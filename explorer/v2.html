<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>White List Data Explorer · Cosenza v2</title><style>
:root{--bg:#f3f6f8;--panel:#fff;--ink:#17222c;--muted:#687685;--line:#dce3e8;--nav:#102936;--good:#247451;--warn:#8b6116;--bad:#a13e3e}*{box-sizing:border-box}body{margin:0;font:14px/1.42 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.layout{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:var(--nav);color:#e8f0f4;padding:20px 15px;position:sticky;top:0;height:100vh}.brand{font-size:17px;font-weight:800}.sub{font-size:11px;color:#a9bbc4;margin:5px 0 16px}.tag{display:inline-block;border:1px solid #8b7130;background:#4b3d17;color:#ffe7a4;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}.nav{display:grid;gap:5px;margin-top:18px}.nav button{border:0;background:transparent;color:#c9d6dc;text-align:left;padding:9px;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:#1e4355;color:#fff}.main{min-width:0}.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:4}.content{padding:23px;max-width:1600px}.view{display:none}.view.active{display:block}.hero h2{margin:2px 0 5px;font-size:25px}.hero p{margin:0;color:var(--muted);max-width:900px}.notice{margin:14px 0;padding:11px 13px;border-radius:9px;background:#fff7df;border:1px solid #ead18a;color:#60480e}.grid{display:grid;gap:12px}.cards{grid-template-columns:repeat(5,minmax(0,1fr));margin:15px 0}.card,.box{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px}.card small{color:var(--muted)}.card strong{display:block;font-size:24px;margin:5px 0}.box{margin-top:12px}.box h3{font-size:15px;margin:0 0 11px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.toolbar input,.toolbar select{border:1px solid #cbd5dc;background:white;border-radius:7px;padding:7px 9px}.toolbar input{min-width:260px}.toolbar .count{margin-left:auto;color:var(--muted)}.wrap{overflow:auto;border:1px solid var(--line);border-radius:9px;background:white}.table{border-collapse:collapse;width:100%;min-width:1350px}.table th{background:#f7f9fa;position:sticky;top:0;font-size:10px;text-transform:uppercase;color:#63717e;letter-spacing:.3px;text-align:left;padding:8px;border-bottom:1px solid var(--line)}.table td{padding:8px;border-bottom:1px solid #edf0f2;vertical-align:top}.table tbody tr{cursor:pointer}.table tbody tr:hover{background:#f7fbfd}.mono{font-family:ui-monospace,monospace;font-size:11px}.muted{color:var(--muted)}.pager{display:flex;gap:7px;justify-content:flex-end;align-items:center;margin-top:9px}.pager button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 8px}.drawer{position:fixed;right:0;top:0;width:min(720px,94vw);height:100vh;background:white;box-shadow:-14px 0 38px #0002;transform:translateX(105%);transition:.18s;z-index:20;overflow:auto}.drawer.open{transform:none}.dh{position:sticky;top:0;background:white;border-bottom:1px solid var(--line);padding:15px 18px;display:flex;justify-content:space-between}.db{padding:17px}.kv{display:grid;grid-template-columns:190px 1fr;gap:6px 12px}.kv>div:nth-child(odd){color:var(--muted)}.raw{white-space:pre-wrap;background:#f6f8fa;border:1px solid var(--line);border-radius:7px;padding:10px;font-family:ui-monospace,monospace;font-size:11px}.close{border:0;border-radius:6px;width:30px;height:30px}.coverage{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.authority{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px}.authority small{color:var(--muted)}@media(max-width:1000px){.layout{grid-template-columns:1fr}.side{height:auto;position:relative}.nav{display:flex;overflow:auto}.cards{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.coverage{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="layout"><aside class="side"><div class="brand">White List Data Explorer</div><div class="sub">Cosenza parser v2 · checkpoint</div><span class="tag">INTERNAL SOURCE OBSERVATIONS</span><div class="nav"><button class="active" data-v="overview">Overview</button><button data-v="observations">Osservazioni ricche</button><button data-v="diff">Confronto</button><button data-v="coverage">Copertura nazionale</button><button data-v="provenance">Provenance</button><button data-v="method">Metodo</button></div></aside><main class="main"><header class="top"><strong id="title">Overview</strong><span class="muted" id="meta"></span></header><div class="content"><section class="view active" id="v-overview"></section><section class="view" id="v-observations"></section><section class="view" id="v-diff"></section><section class="view" id="v-coverage"></section><section class="view" id="v-provenance"></section><section class="view" id="v-method"></section></div></main></div><aside class="drawer" id="drawer"><div class="dh"><div><small class="muted">SOURCE OBSERVATION · PARSER V2</small><h3 id="dt" style="margin:3px 0"></h3></div><button class="close" id="dc">×</button></div><div class="db" id="db"></div></aside><script>
const D=__DATA_PAYLOAD__;const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const F=n=>new Intl.NumberFormat('it-IT').format(n||0);const labels={pending:'In istruttoria',listed:'Inserita / listed',renewal_requested:'Rinnovo richiesto',renewal_update_in_progress:'Aggiornamento in corso',other_or_unknown:'Altro / ignoto',rejected_or_denied:'Diniego/rigetto',cancellation_related:'Cancellazione'};const changes={added:'Nuova osservazione',disappeared:'Non più osservata',status_changed:'Esito cambiato',content_changed:'Contenuto cambiato',unchanged:'Invariata'};function hero(t,p){return `<div class="hero"><h2>${t}</h2><p>${p}</p></div>`}function card(k,v,s){return `<div class="card"><small>${k}</small><strong>${v}</strong><small>${s||''}</small></div>`}
function overview(){let c=D.cosenza,q=c.parser_qa;document.querySelector('#v-overview').innerHTML=hero('Parser v2: checkpoint di completezza','V2 usa la geometria reale della tabella e struttura tutte le colonne osservabili, senza usare la validità del CF/P.IVA come criterio di esistenza della riga.')+`<div class="notice"><b>Correzione QA:</b> v1 sottostimava entrambi gli snapshot di 2 record netti: 3 false negative e 1 falso positivo per snapshot. V1 resta nella provenance; v2 è il candidato corrente.</div><div class="grid cards">${card('28 giugno',F(c.snapshots[0].count),'righe v2')}${card('3 agosto',F(c.snapshots[1].count),'righe v2')}${card('Campi sorgente','7','colonne persistite')}${card('Date inserimento',F(c.snapshots.reduce((a,s)=>a+s.listing_dates,0)),'osservate da Esito')}${card('Scadenze',F(c.snapshots.reduce((a,s)=>a+s.expiry_dates,0)),'nominali osservate')}</div><div class="split"><div class="box"><h3>V1 → V2</h3><div class="kv"><div>Giugno v1</div><div>${F(q.v1_counts['2026-06-28'])}</div><div>Giugno v2</div><div><b>${F(q.v2_counts['2026-06-28'])}</b></div><div>Agosto v1</div><div>${F(q.v1_counts['2026-08-03'])}</div><div>Agosto v2</div><div><b>${F(q.v2_counts['2026-08-03'])}</b></div><div>False negative v1</div><div>3 / snapshot</div><div>Falso positivo v1</div><div>1 / snapshot</div></div></div><div class="box"><h3>Campi ora leggibili</h3><p>Ragione sociale · sede legale · sede secondaria · CF/P.IVA multivalore · attività richieste · date domanda · Esito.</p><p><b>Da Esito:</b> data di inserimento osservata, scadenza nominale osservata, rinnovo richiesto, aggiornamento in corso.</p><p class="muted">Questi restano valori e interpretazioni della fonte, non fatti canonici.</p></div></div>`}
let state={page:1,size:40};function filtered(){let r=D.cosenza.records,q=(document.querySelector('#s')?.value||'').toLowerCase(),ed=document.querySelector('#ed')?.value||'all',st=document.querySelector('#st')?.value||'all',ch=document.querySelector('#ch')?.value||'all';return r.filter(x=>(ed==='all'||x.edition===ed)&&(st==='all'||x.source_status===st)&&(ch==='all'||x.change===ch)&&(!q||JSON.stringify(x).toLowerCase().includes(q)))}function table(){let r=filtered(),pages=Math.max(1,Math.ceil(r.length/state.size));state.page=Math.min(state.page,pages);let show=r.slice((state.page-1)*state.size,state.page*state.size);document.querySelector('#cnt').textContent=`${F(r.length)} righe`;document.querySelector('#body').innerHTML=show.map(x=>`<tr data-i="${x._i}"><td>${E(x.edition)}</td><td><b>${E(x.operator_name_raw)}</b></td><td>${E(x.registered_office_raw)}</td><td class="mono">${E(String(x.identifier_field_raw).replaceAll('\n',' · '))}</td><td>${E(x.requested_activities_raw)}</td><td>${E(x.application_date_field_raw)}</td><td>${E(x.observed_listing_date||'')}</td><td>${E(x.observed_expiry_date||'')}</td><td>${E(labels[x.source_status]||x.source_status)}</td><td>${E(changes[x.change]||x.change)}</td></tr>`).join('');document.querySelector('#pg').textContent=`${state.page}/${pages}`;document.querySelector('#pr').disabled=state.page<=1;document.querySelector('#nx').disabled=state.page>=pages;document.querySelectorAll('#body tr').forEach(tr=>tr.onclick=()=>openRecord(D.cosenza.records[+tr.dataset.i]))}
function observations(){let statuses=[...new Set(D.cosenza.records.map(x=>x.source_status))];document.querySelector('#v-observations').innerHTML=hero('Osservazioni sorgente complete','Questa è la vista QA principale: ogni colonna strutturata è confrontabile con Esito e raw block originali.')+`<div class="box"><div class="toolbar"><input id="s" placeholder="Cerca impresa, sede, identificativo, attività…"><select id="ed"><option value="all">Entrambe le edizioni</option>${D.cosenza.snapshots.map(x=>`<option>${x.date}</option>`).join('')}</select><select id="st"><option value="all">Tutti gli esiti</option>${statuses.map(x=>`<option value="${E(x)}">${E(labels[x]||x)}</option>`).join('')}</select><select id="ch"><option value="all">Tutte le variazioni</option>${Object.entries(changes).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><span class="count" id="cnt"></span></div><div class="wrap"><table class="table"><thead><tr><th>Edizione</th><th>Impresa</th><th>Sede legale</th><th>CF/P.IVA sorgente</th><th>Attività</th><th>Date domanda</th><th>Inserita il*</th><th>Scadenza*</th><th>Esito</th><th>Confronto</th></tr></thead><tbody id="body"></tbody></table></div><div class="pager"><button id="pr">←</button><span id="pg"></span><button id="nx">→</button></div><p class="muted">* date osservate nel testo della fonte; non ancora date canoniche.</p></div>`;['s','ed','st','ch'].forEach(id=>document.querySelector('#'+id).addEventListener(id==='s'?'input':'change',()=>{state.page=1;table()}));document.querySelector('#pr').onclick=()=>{state.page--;table()};document.querySelector('#nx').onclick=()=>{state.page++;table()};table()}
function openRecord(x){document.querySelector('#dt').textContent=x.operator_name_raw;let ids=(x.identifiers_parsed||[]).map(i=>`${E(i.raw_value)} <span class="muted">${E(i.scheme_assertion)}</span>`).join('<br>');let apps=(x.application_dates_parsed||[]).map(d=>`${E(d.date)}${d.parenthesized?' (parenthesized)':''}`).join('<br>');document.querySelector('#db').innerHTML=`<div class="kv"><div>Edizione</div><div>${E(x.edition)}</div><div>Ragione sociale</div><div>${E(x.operator_name_raw)}</div><div>Sede legale</div><div>${E(x.registered_office_raw)}</div><div>Sede secondaria</div><div>${E(x.secondary_office_raw||'—')}</div><div>Identificativi</div><div class="mono">${ids||'—'}</div><div>Attività</div><div>${E(x.requested_activities_raw)}</div><div>Date domanda</div><div>${apps||E(x.application_date_field_raw)}</div><div>Inserita il (osservata)</div><div>${E(x.observed_listing_date||'—')}</div><div>Scadenza (osservata)</div><div>${E(x.observed_expiry_date||'—')}</div><div>Esito sorgente</div><div>${E(x.outcome_raw)}</div><div>Record hash</div><div class="mono">${E(x.record_hash)}</div></div><h4>Raw source block</h4><div class="raw">${E(x.raw_block)}</div><div class="notice"><b>Guardrail:</b> nessuno di questi valori è automaticamente una data/stato amministrativo canonico.</div>`;document.querySelector('#drawer').classList.add('open')}
function diff(){let d=D.cosenza.diff;document.querySelector('#v-diff').innerHTML=hero('Confronto snapshot v2','Differenze osservate nella pubblicazione; non equivalgono automaticamente a iscrizioni o rimozioni.')+`<div class="grid cards">${card('Nuove osservazioni',F(d.mention_observations.added),'source-level')}${card('Non più osservate',F(d.mention_observations.disappeared),'source-level')}${card('Comuni',F(d.mention_observations.common),'stessa mention key')}${card('Righe cambiate',F(d.mention_observations.record_content_changed),'contenuto')}${card('Esito cambiato',F(d.source_status.changed_common_mentions),'diagnostico')}</div><div class="box"><h3>Completezza strutturale</h3><div class="kv"><div>Giugno: sede / attività / domanda / esito</div><div>1327 / 1327 per ciascun campo</div><div>Agosto: sede / attività / domanda / esito</div><div>1334 / 1334 per ciascun campo</div><div>Data inserimento</div><div>452 → 461 righe</div><div>Scadenza nominale</div><div>213 → 215 righe</div></div></div>`}
function coverage(){let n=D.national;document.querySelector('#v-coverage').innerHTML=hero('Copertura nazionale','Lo scale-out dei parser resta fermo finché questo checkpoint non è approvato.')+`<div class="grid cards">${card('Autorità',F(n.authority_count),'mappate')}${card('Landing verificate',F(n.verified_page_count),'fonti')}${card('Source series',F(n.source_series_count),'qualificate')}${card('Cosenza storico',F(n.cosenza_historical_editions),'edizioni')}${card('Parser nazionali','1','famiglia v2 in QA')}</div><div class="box"><div class="coverage">${n.authorities.map(a=>`<div class="authority"><b>${E(a.name)}</b><br><small>${E(a.region)} · ${a.verified?'verificata':'da verificare'} · ${a.series_count} series</small></div>`).join('')}</div></div>`}
function provenance(){let p=D.cosenza.provenance;document.querySelector('#v-provenance').innerHTML=hero('Provenance','V2 è un nuovo ParseRun: v1 non viene sovrascritto.')+`<div class="box"><div class="kv"><div>Parser</div><div class="mono">${E(p.parser_name)}</div><div>Versione</div><div>${E(p.parser_version)}</div><div>Git revision</div><div class="mono">${E(p.processing_revision)}</div><div>Configuration hash</div><div class="mono">${E(p.configuration_hash)}</div><div>Schema fingerprint</div><div class="mono">${E(p.schema_fingerprint)}</div></div></div><div class="box"><h3>Content identity</h3>${p.editions.map(e=>`<p><b>${E(e.reference_date)}</b> · ${e.page_count} pagine<br><span class="mono">${E(e.content_sha256)}</span></p>`).join('')}</div>`}
function method(){document.querySelector('#v-method').innerHTML=hero('Metodo','Lossless-first: prima catturiamo fedelmente la fonte, poi interpretiamo e canonicalizziamo in layer separati.')+`<div class="box"><h3>Regole v2</h3><ol><li>La validità formale del CF/P.IVA non decide se una riga esiste.</li><li>Ogni colonna sorgente viene preservata come raw value.</li><li>Campi multivalore restano multivalore.</li><li>Data inserimento e scadenza sono <b>osservate nel testo Esito</b>, non automaticamente canoniche.</li><li>Il raw block resta sempre disponibile per QA e parser futuri.</li><li>V1 resta nella provenance come ParseRun storico, incluso il suo errore di coverage.</li></ol></div>`}
function activate(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelector('#v-'+v).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===v));document.querySelector('#title').textContent={overview:'Overview',observations:'Osservazioni ricche',diff:'Confronto',coverage:'Copertura nazionale',provenance:'Provenance',method:'Metodo'}[v];if(v==='observations')observations()}function init(){D.cosenza.records.forEach((r,i)=>r._i=i);document.querySelector('#meta').textContent=D.meta.classification+' · '+D.meta.generated_at;overview();diff();coverage();provenance();method();document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>activate(b.dataset.v));document.querySelector('#dc').onclick=()=>document.querySelector('#drawer').classList.remove('open')}init();
</script></body></html>
