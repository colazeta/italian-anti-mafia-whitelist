<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>White List Dataset Explorer</title>
<style>
:root{--bg:#d4d0c8;--paper:#fff;--chrome:#ece9d8;--head:#d7d7d7;--line:#8d8d8d;--line2:#b9b9b9;--ink:#111;--muted:#555;--sel:#0a246a;--seltext:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:12px/1.3 Arial,Helvetica,sans-serif}
button,input,select{font:inherit;color:inherit}.shell{min-height:100vh;padding:8px}.window{max-width:1680px;margin:auto;background:var(--paper);border:1px solid #666;box-shadow:1px 1px 0 #fff inset}
.titlebar{background:#1f4e79;color:#fff;padding:4px 7px;font-weight:700;display:flex;justify-content:space-between}
.menubar{display:flex;gap:2px;background:var(--chrome);border-bottom:1px solid #999;padding:3px 4px}
.tab{border:1px solid transparent;background:transparent;padding:3px 8px;cursor:pointer}.tab:hover{border-color:#999}.tab.active{background:#fff;border-color:#777;border-bottom-color:#fff}
.statusbar{display:grid;grid-template-columns:1fr auto auto;gap:2px;background:var(--chrome);border-top:1px solid #999;padding:2px}
.statuscell{border:1px inset #ddd;padding:2px 5px;min-height:20px}
.content{padding:6px}.view{display:none}.view.active{display:block}
.section{border:1px solid #777;margin-bottom:7px}.section-title{background:var(--head);border-bottom:1px solid #888;padding:3px 5px;font-weight:700}.section-body{padding:5px}
.toolbar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;background:var(--chrome);border:1px solid #aaa;padding:4px;margin-bottom:5px}
.toolbar label{font-weight:700}.toolbar input,.toolbar select{height:22px;border:1px solid #777;background:#fff;padding:1px 4px}.toolbar input{min-width:230px}
.btn{height:22px;border:1px outset #ddd;background:var(--chrome);padding:1px 7px;cursor:pointer}.btn:active{border-style:inset}
.gridwrap{overflow:auto;border:1px solid #777;background:#fff}.grid{border-collapse:collapse;width:100%;min-width:980px}
.grid th{position:sticky;top:0;background:var(--head);border:1px solid #888;padding:3px 5px;text-align:left;white-space:nowrap}
.grid td{border:1px solid #bbb;padding:2px 5px;vertical-align:top}.grid tbody tr:hover{background:#fff7c6}.grid tbody tr.selected{background:var(--sel);color:var(--seltext)}
.mono{font-family:"Courier New",monospace}.muted{color:var(--muted)}.nowrap{white-space:nowrap}.small{font-size:11px}
.summary{border-collapse:collapse}.summary td,.summary th{border:1px solid #aaa;padding:3px 6px}.summary th{background:var(--head);text-align:left}
.split{display:grid;grid-template-columns:1fr 1fr;gap:7px}.kv{display:grid;grid-template-columns:190px 1fr;border:1px solid #aaa}.kv div{padding:3px 5px;border-bottom:1px solid #ccc}.kv div:nth-child(odd){background:#eee;font-weight:700;border-right:1px solid #bbb}
.detail{position:fixed;right:12px;top:42px;width:min(720px,92vw);max-height:calc(100vh - 60px);background:#fff;border:2px outset #ddd;display:none;z-index:20}.detail.open{display:block}
.detail-title{background:#1f4e79;color:#fff;padding:4px 6px;font-weight:700;display:flex;justify-content:space-between}.detail-body{padding:6px;overflow:auto;max-height:calc(100vh - 95px)}
.raw{white-space:pre-wrap;font-family:"Courier New",monospace;border:1px solid #888;background:#f6f6f6;padding:5px;max-height:260px;overflow:auto}
.note{border:1px solid #888;background:#ffffe1;padding:4px 6px;margin:5px 0}.ok{color:#075c0a}.warn{color:#8a4b00}.bad{color:#8a0000}
.tree{border-collapse:collapse;width:100%}.tree td,.tree th{border:1px solid #aaa;padding:3px 5px}.tree th{background:var(--head);text-align:left}.indent1{padding-left:18px!important}.indent2{padding-left:34px!important}
.pager{display:flex;justify-content:flex-end;gap:4px;align-items:center;margin-top:4px}
@media(max-width:900px){.split{grid-template-columns:1fr}.menubar{overflow:auto}.statusbar{grid-template-columns:1fr}.grid{min-width:1200px}}
</style>
</head>
<body>
<div class="shell"><div class="window">
<div class="titlebar"><span>Open Italian Anti-Mafia White List Archive — Dataset Explorer</span><span id="build"></span></div>
<div class="menubar" id="tabs">
<button class="tab active" data-view="structure">Struttura dataset</button>
<button class="tab" data-view="observations">Dati Cosenza</button>
<button class="tab" data-view="diff">Confronto snapshot</button>
<button class="tab" data-view="coverage">Copertura nazionale</button>
<button class="tab" data-view="provenance">Provenance</button>
<button class="tab" data-view="method">Metodo</button>
</div>
<div class="content">
<section class="view active" id="view-structure"></section>
<section class="view" id="view-observations"></section>
<section class="view" id="view-diff"></section>
<section class="view" id="view-coverage"></section>
<section class="view" id="view-provenance"></section>
<section class="view" id="view-method"></section>
</div>
<div class="statusbar"><div class="statuscell" id="status">Pronto</div><div class="statuscell" id="rowstatus"></div><div class="statuscell">INTERNAL CHECKPOINT · SOURCE ≠ CANONICAL</div></div>
</div></div>
<div class="detail" id="detail"><div class="detail-title"><span id="detail-title">Dettaglio</span><button class="btn" id="detail-close">X</button></div><div class="detail-body" id="detail-body"></div></div>
<script>
const D=__DATA_PAYLOAD__;
const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const F=n=>new Intl.NumberFormat('it-IT').format(Number(n||0));
const SL={pending:'In istruttoria',listed:'Inserita/listed',renewal_requested:'Rinnovo richiesto',renewal_update_in_progress:'Aggiornamento in corso',other_or_unknown:'Altro/ignoto',rejected_or_denied:'Diniego/rigetto',cancellation_related:'Cancellazione'};
const CL={added:'Nuova osservazione',disappeared:'Non più osservata',status_changed:'Esito cambiato',content_changed:'Contenuto cambiato',unchanged:'Invariata'};
const DATA_MODEL=[
['SOURCE','Autorità territoriale','core.public_authority','106 censite','Prefettura/autorità che pubblica o mantiene il registro'],
['SOURCE','White List regime','whitelist.white_list_regime','modellato','Regime giuridico/amministrativo applicabile'],
['SOURCE','Registro White List','whitelist.white_list_register','modellato','Registro concreto mantenuto da una autorità'],
['TAXONOMY','Settore concettuale','whitelist.sector_concept','modellato','Concetto stabile indipendente dalla numerazione della sezione'],
['TAXONOMY','Versione schema settori','whitelist.sector_scheme_version','modellato','Classificazione valida in un periodo'],
['TAXONOMY','Membership settore','whitelist.sector_scheme_membership','modellato','Sezione/notation/label nella specifica versione'],
['ENTITY','Legal entity','core.legal_entity','non ancora risolta nel pilot','Impresa/soggetto canonico'],
['ENTITY','Nomi entità','core.entity_name','non ancora popolato dal pilot','Nomi legali e varianti, versionati'],
['ENTITY','Identificativi','core.entity_identifier','non ancora popolato dal pilot','CF/P.IVA e altri identificativi canonici'],
['WHITELIST','Relazione impresa-registro','whitelist.white_list_relationship','non ancora canonicalizzata','Anchor LegalEntity × WhiteListRegister'],
['WHITELIST','Storia stato relazione','whitelist.relationship_state_version','non ancora canonicalizzata','Disposizione, effetto legale, validità nominale e tempi'],
['WHITELIST','Settori della relazione','whitelist.relationship_sector','non ancora canonicalizzato','Settori risultanti/listed della relazione'],
['PROCEDURE','Procedura','whitelist.white_list_procedure','non ancora risolta','Istanza/rinnovo/decisione come oggetto procedurale'],
['PROCEDURE','Versione procedura','whitelist.procedure_version','non ancora canonicalizzata','Date, status/outcome, periodi temporali'],
['SOURCE','Source series','source.source_series','28 qualificate','Serie ricorrente di pubblicazione'],
['SOURCE','Source edition','source.source_edition','Cosenza pilot popolato','Edizione logica con data/periodo di riferimento'],
['SOURCE','Source resource','source.source_resource','Cosenza pilot popolato','Risorsa/locator del documento'],
['SOURCE','Source capture','source.source_capture','Cosenza pilot popolato','Acquisizione con timestamp e metadata HTTP'],
['SOURCE','Content object','source.content_object','Cosenza pilot popolato','Bytes identificati da SHA-256'],
['PARSE','Parse run','source.parse_run','v1 + v2','Esecuzione parser su uno specifico ContentObject'],
['PARSE','Parsed record','source.parsed_record','2.661 v2','Riga osservata immutabile'],
['PARSE','Source field value','source.source_field_value','18.627 v2','Valore raw + interpretazione strutturata'],
['PARSE','Entity mention','source.entity_mention','2.661 unresolved','Menzione osservata, non identità canonica'],
['RESOLUTION','Entity resolution','source.entity_resolution','non ancora applicata','Decisione auditabile mention → LegalEntity'],
['PROVENANCE','Processing activity','provenance.processing_activity','attivo','Software/version/config che genera output'],
['EVIDENCE','Evidence links','provenance/evidence tables','modellato','Support/contradict/derive_from verso fatti canonici'],
['DERIVED','Derived event','derived.derived_event','non ancora applicato','FIRST_OBSERVED, DISAPPEARED_FROM_SOURCE, ecc.'],
['GOVERNANCE','Dissemination policy','governance.*','modellato','Public/transformed/review/internal per profilo']
];
function section(title,body){return `<div class="section"><div class="section-title">${E(title)}</div><div class="section-body">${body}</div></div>`}
function renderStructure(){
let rows=DATA_MODEL.map(r=>`<tr><td class="nowrap">${E(r[0])}</td><td><b>${E(r[1])}</b></td><td class="mono">${E(r[2])}</td><td>${E(r[3])}</td><td>${E(r[4])}</td></tr>`).join('');
let fields=[
['Ragione sociale','source observation','cosenza_combined_v2:operator_name','text','1','raw + normalized'],
['Sede legale','source observation','cosenza_combined_v2:registered_office','text','1','raw'],
['Sede secondaria','source observation','cosenza_combined_v2:secondary_office','text','0..1','raw'],
['CF / P.IVA','source observation','cosenza_combined_v2:identifier','text/json','1..n','raw + parsed list'],
['Attività richieste','source observation','cosenza_combined_v2:requested_activities','text/json','1..n','raw + parsed list'],
['Data presentazione istanza','source observation','cosenza_combined_v2:application_dates','text/json','1..n','raw + parsed dates'],
['Esito','source observation','cosenza_combined_v2:outcome','text/json','1','raw + source annotations'],
['Data inserimento osservata','derived-from-source field','outcome.observed_listing_date','date','0..1','non canonical'],
['Scadenza nominale osservata','derived-from-source field','outcome.observed_expiry_date','date','0..1','non canonical']
].map(r=>`<tr>${r.map((c,i)=>`<td${i==2?' class="mono"':''}>${E(c)}</td>`).join('')}</tr>`).join('');
document.querySelector('#view-structure').innerHTML=
section('MODELLO LOGICO — oggetti principali',`<div class="note">Questa è la mappa leggibile del progetto. Le tabelle tecniche implementano questi oggetti; non tutto è ancora popolato. Il pilot Cosenza vive oggi soprattutto nel layer SOURCE/PARSE.</div><div class="gridwrap"><table class="tree"><thead><tr><th>Layer</th><th>Oggetto</th><th>Tabella / area</th><th>Stato dati</th><th>Significato</th></tr></thead><tbody>${rows}</tbody></table></div>`)+
section('SCHEMA SORGENTE Cosenza v2',`<div class="gridwrap"><table class="grid"><thead><tr><th>Campo</th><th>Layer</th><th>Locator</th><th>Tipo</th><th>Cardinalità</th><th>Persistenza</th></tr></thead><tbody>${fields}</tbody></table></div>`);
}
let obs={page:1,size:40};
function filters(){
let q=(document.querySelector('#q')?.value||'').toLowerCase(),ed=document.querySelector('#ed')?.value||'all',st=document.querySelector('#st')?.value||'all';
return (D.cosenza.records||[]).filter(r=>(ed==='all'||r.edition===ed)&&(st==='all'||r.source_status===st)&&(!q||JSON.stringify(r).toLowerCase().includes(q)));
}
function ids(r){let x=r.identifiers_parsed;return Array.isArray(x)?x.map(v=>v.raw_value||v.value||'').filter(Boolean).join(' · '):String(r.identifier_field_raw||'').replaceAll('\n',' · ')}
function acts(r){let x=r.requested_activities_parsed;return Array.isArray(x)?x.map(v=>typeof v==='string'?v:(v.label||v.raw_value||'')).filter(Boolean).join(' · '):String(r.requested_activities_raw||'')}
function dates(r){let x=r.application_dates_parsed;return Array.isArray(x)?x.map(v=>typeof v==='string'?v:(v.date||v.raw_value||'')).filter(Boolean).join(' · '):String(r.application_dates_raw||'')}
function drawObs(){
let rows=filters(),pages=Math.max(1,Math.ceil(rows.length/obs.size));obs.page=Math.min(obs.page,pages);let s=(obs.page-1)*obs.size,show=rows.slice(s,s+obs.size);
document.querySelector('#rowstatus').textContent=`${F(rows.length)} righe`;
document.querySelector('#tbody').innerHTML=show.map((r,i)=>`<tr data-i="${D.cosenza.records.indexOf(r)}"><td>${E(r.edition)}</td><td class="mono">${E(r.row_ordinal)}</td><td><b>${E(r.operator_name_raw)}</b></td><td>${E(r.registered_office_raw)}</td><td class="mono">${E(ids(r))}</td><td>${E(acts(r))}</td><td class="nowrap">${E(dates(r))}</td><td class="nowrap">${E(r.observed_listing_date||'')}</td><td class="nowrap">${E(r.observed_expiry_date||'')}</td><td>${E(SL[r.source_status]||r.source_status)}</td><td>${E(CL[r.change]||r.change)}</td></tr>`).join('');
document.querySelector('#page').textContent=`${obs.page}/${pages}`;document.querySelector('#prev').disabled=obs.page<=1;document.querySelector('#next').disabled=obs.page>=pages;
document.querySelectorAll('#tbody tr').forEach(tr=>tr.onclick=()=>openDetail(D.cosenza.records[Number(tr.dataset.i)]));
}
function renderObservations(){
let sts=[...new Set((D.cosenza.records||[]).map(r=>r.source_status))].sort();
document.querySelector('#view-observations').innerHTML=section('OSSERVAZIONI SORGENTE — Cosenza parser v2',
`<div class="toolbar"><label>Cerca</label><input id="q"><label>Edizione</label><select id="ed"><option value="all">Tutte</option>${D.cosenza.snapshots.map(s=>`<option>${E(s.date)}</option>`).join('')}</select><label>Esito</label><select id="st"><option value="all">Tutti</option>${sts.map(s=>`<option value="${E(s)}">${E(SL[s]||s)}</option>`).join('')}</select><button class="btn" id="reset">Azzera</button></div>
<div class="gridwrap"><table class="grid"><thead><tr><th>Edizione</th><th>Riga</th><th>Ragione sociale</th><th>Sede legale</th><th>CF / P.IVA</th><th>Attività</th><th>Data istanza</th><th>Inserita il</th><th>Scadenza</th><th>Esito</th><th>Diff</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div class="pager"><button class="btn" id="prev">&lt;</button><span id="page"></span><button class="btn" id="next">&gt;</button></div>`);
['q','ed','st'].forEach(id=>document.querySelector('#'+id).addEventListener(id==='q'?'input':'change',()=>{obs.page=1;drawObs()}));
document.querySelector('#reset').onclick=()=>{document.querySelector('#q').value='';document.querySelector('#ed').value='all';document.querySelector('#st').value='all';obs.page=1;drawObs()};
document.querySelector('#prev').onclick=()=>{obs.page--;drawObs()};document.querySelector('#next').onclick=()=>{obs.page++;drawObs()};drawObs();
}
function openDetail(r){
document.querySelector('#detail-title').textContent=r.operator_name_raw||'Dettaglio';
document.querySelector('#detail-body').innerHTML=`<div class="kv">
<div>Edizione</div><div>${E(r.edition)}</div><div>Ragione sociale</div><div>${E(r.operator_name_raw)}</div><div>Sede legale</div><div>${E(r.registered_office_raw)}</div><div>Sede secondaria</div><div>${E(r.secondary_office_raw)}</div><div>Identificativi</div><div class="mono">${E(ids(r))}</div><div>Attività</div><div>${E(acts(r))}</div><div>Date istanza</div><div>${E(dates(r))}</div><div>Data inserimento osservata</div><div>${E(r.observed_listing_date||'')}</div><div>Scadenza nominale osservata</div><div>${E(r.observed_expiry_date||'')}</div><div>Esito parser</div><div>${E(SL[r.source_status]||r.source_status)}</div><div>Confronto</div><div>${E(CL[r.change]||r.change)}</div><div>Record hash</div><div class="mono">${E(r.record_hash)}</div></div><p><b>Esito sorgente completo</b></p><div class="raw">${E(r.outcome_raw||'')}</div><p><b>Raw record</b></p><div class="raw">${E(r.raw_block||'')}</div><div class="note"><b>Nota:</b> valori osservati nella fonte. Nessuna data o esito qui è automaticamente un fatto amministrativo canonico.</div>`;
document.querySelector('#detail').classList.add('open');
}
function renderDiff(){
let d=D.cosenza.diff,q=D.cosenza.parser_qa;
let t=Object.entries(d.source_status?.transition_counts||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${E(k)}</td><td>${F(v)}</td></tr>`).join('');
document.querySelector('#view-diff').innerHTML=
section('CONFRONTO 28/06/2026 → 03/08/2026',`<table class="summary"><tr><th>Indicatore</th><th>Valore</th><th>Interpretazione</th></tr><tr><td>Nuove osservazioni</td><td>${F(d.mention_observations.added)}</td><td>non equivale a nuova iscrizione</td></tr><tr><td>Non più osservate</td><td>${F(d.mention_observations.disappeared)}</td><td>non equivale a rimozione</td></tr><tr><td>Comuni</td><td>${F(d.mention_observations.common)}</td><td>stessa chiave osservativa</td></tr><tr><td>Contenuto cambiato</td><td>${F(d.mention_observations.record_content_changed)}</td><td>record sorgente modificato</td></tr></table>`)+
section('QA parser v1 → v2',`<table class="summary"><tr><th></th><th>28/06</th><th>03/08</th></tr><tr><td>v1</td><td>${F(q.v1_counts['2026-06-28'])}</td><td>${F(q.v1_counts['2026-08-03'])}</td></tr><tr><td><b>v2 corrente</b></td><td><b>${F(q.v2_counts['2026-06-28'])}</b></td><td><b>${F(q.v2_counts['2026-08-03'])}</b></td></tr></table><div class="note">v1: 3 false negative + 1 falso positivo per snapshot. v2: row detection geometrico; validità dell'identificativo non decide l'esistenza della riga.</div>`)+
section('Transizioni diagnostiche Esito',`<table class="summary"><tr><th>Transizione</th><th>N.</th></tr>${t}</table>`);
}
function renderCoverage(){
let rows=(D.national.authorities||[]).map(a=>`<tr><td>${E(a.name)}</td><td>${E(a.region)}</td><td>${E(a.office_type)}</td><td>${a.verified?'VERIFICATA':'DA VERIFICARE'}</td><td>${F(a.series_count)}</td></tr>`).join('');
document.querySelector('#view-coverage').innerHTML=section('COPERTURA NAZIONALE',`<table class="summary"><tr><th>Autorità censite</th><td>${F(D.national.authority_count)}</td><th>Landing verificate</th><td>${F(D.national.verified_page_count)}</td><th>Source series</th><td>${F(D.national.source_series_count)}</td></tr></table><br><div class="gridwrap"><table class="grid"><thead><tr><th>Autorità</th><th>Regione</th><th>Tipo ufficio</th><th>Landing</th><th>Series</th></tr></thead><tbody>${rows}</tbody></table></div>`);
}
function renderProvenance(){
let p=D.cosenza.provenance,eds=p.editions.map(e=>`<tr><td>${E(e.reference_date)}</td><td class="mono">${E(e.content_sha256)}</td><td>${E(e.page_count)}</td></tr>`).join('');
document.querySelector('#view-provenance').innerHTML=section('PARSER',`<div class="kv"><div>Nome</div><div class="mono">${E(p.parser_name)}</div><div>Versione</div><div>${E(p.parser_version)}</div><div>Commit/revision</div><div class="mono">${E(p.processing_revision)}</div><div>Configuration hash</div><div class="mono">${E(p.configuration_hash)}</div><div>Schema fingerprint</div><div class="mono">${E(p.schema_fingerprint)}</div></div>`)+section('CONTENT OBJECTS',`<table class="summary"><tr><th>Edizione</th><th>SHA-256</th><th>Pagine</th></tr>${eds}</table>`);
}
function renderMethod(){
document.querySelector('#view-method').innerHTML=section('LIVELLI SEMANTICI',`<table class="tree"><tr><th>Livello</th><th>Cosa significa</th><th>Stato pilot</th></tr><tr><td>Evidence</td><td>PDF/pagina ufficiale + capture/hash</td><td class="ok">ATTIVO</td></tr><tr><td>Source observation</td><td>Righe e campi parsati dalla fonte</td><td class="ok">ATTIVO v2</td></tr><tr><td>Entity resolution</td><td>mention → LegalEntity</td><td class="warn">NON ANCORA</td></tr><tr><td>Canonical fact</td><td>stato amministrativo normalizzato</td><td class="warn">NON ANCORA</td></tr><tr><td>Derived event</td><td>eventi riproducibili da versioni/stati</td><td class="warn">NON ANCORA</td></tr></table><div class="note"><b>Regola:</b> source observation ≠ canonical fact. DISAPPEARED_FROM_SOURCE ≠ REMOVED.</div>`);
}
function activate(v){
document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id==='view-'+v));
document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===v));
document.querySelector('#status').textContent='Vista: '+v;
if(v==='observations')renderObservations();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>activate(b.dataset.view));
document.querySelector('#detail-close').onclick=()=>document.querySelector('#detail').classList.remove('open');
document.querySelector('#build').textContent=D.meta.classification;
renderStructure();renderDiff();renderCoverage();renderProvenance();renderMethod();
document.querySelector('#rowstatus').textContent=F(D.cosenza.total_records)+' osservazioni v2';
</script>
</body></html>
