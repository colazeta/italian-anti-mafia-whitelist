<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>White List Dataset Explorer</title>
<style>
:root{--bg:#d4d0c8;--paper:#fff;--chrome:#ece9d8;--head:#d7d7d7;--line:#888;--ink:#111;--muted:#555;--sel:#0a246a;--seltext:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:12px/1.3 Arial,Helvetica,sans-serif}button,input,select{font:inherit;color:inherit}
.shell{min-height:100vh;padding:8px}.window{max-width:1800px;margin:auto;background:var(--paper);border:1px solid #666}.titlebar{background:#1f4e79;color:#fff;padding:4px 7px;font-weight:700;display:flex;justify-content:space-between;gap:8px}.menubar{display:flex;gap:2px;background:var(--chrome);border-bottom:1px solid #999;padding:3px 4px;overflow:auto}.tab{border:1px solid transparent;background:transparent;padding:3px 8px;cursor:pointer;white-space:nowrap}.tab.active{background:#fff;border-color:#777;border-bottom-color:#fff}.content{padding:6px}.view{display:none}.view.active{display:block}.section{border:1px solid #777;margin-bottom:7px}.section-title{background:var(--head);border-bottom:1px solid #888;padding:3px 5px;font-weight:700}.section-body{padding:5px}.toolbar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;background:var(--chrome);border:1px solid #aaa;padding:4px;margin-bottom:5px}.toolbar label{font-weight:700}.toolbar input,.toolbar select{height:22px;border:1px solid #777;background:#fff;padding:1px 4px}.toolbar input{min-width:230px}.btn{height:22px;border:1px outset #ddd;background:var(--chrome);padding:1px 7px;cursor:pointer}.btn:active{border-style:inset}.gridwrap{overflow:auto;border:1px solid #777;background:#fff}.grid,.tree,.summary{border-collapse:collapse;width:100%}.grid{min-width:1250px}.grid th,.tree th,.summary th{background:var(--head);border:1px solid #888;padding:3px 5px;text-align:left;white-space:nowrap}.grid td,.tree td,.summary td{border:1px solid #bbb;padding:2px 5px;vertical-align:top}.grid tbody tr:hover,.tree tbody tr:hover{background:#fff7c6}.mono{font-family:"Courier New",monospace}.muted{color:var(--muted)}.nowrap{white-space:nowrap}.note{border:1px solid #888;background:#ffffe1;padding:4px 6px;margin:5px 0}.ok{color:#075c0a}.warn{color:#8a4b00}.bad{color:#8a0000}.status{font-family:"Courier New",monospace;font-weight:700;white-space:nowrap}.status.POPULATED,.status.POPULATED_NO_OPEN_ISSUES{color:#075c0a}.status.POPULATED_WITH_UNRESOLVED_EDGE_CASES,.status.POPULATED_WITH_REVIEW_ITEMS,.status.REQUIRES_REVIEW,.status.REQUIRES_RESOLUTION{color:#8a4b00}.status.NOT_APPLICABLE_FROM_CURRENT_SOURCE,.status.NOT_YET_PROCESSED,.status.NOT_YET_POPULATED{color:#555}.split{display:grid;grid-template-columns:1fr 1fr;gap:7px}.kv{display:grid;grid-template-columns:210px 1fr;border:1px solid #aaa}.kv div{padding:3px 5px;border-bottom:1px solid #ccc}.kv div:nth-child(odd){background:#eee;font-weight:700;border-right:1px solid #bbb}.raw{white-space:pre-wrap;font-family:"Courier New",monospace;border:1px solid #888;background:#f6f6f6;padding:5px;max-height:260px;overflow:auto}.detail{position:fixed;right:12px;top:42px;width:min(760px,94vw);max-height:calc(100vh - 60px);background:#fff;border:2px outset #ddd;display:none;z-index:20}.detail.open{display:block}.detail-title{background:#1f4e79;color:#fff;padding:4px 6px;font-weight:700;display:flex;justify-content:space-between}.detail-body{padding:6px;overflow:auto;max-height:calc(100vh - 95px)}.pager{display:flex;justify-content:flex-end;gap:4px;align-items:center;margin-top:4px}.statusbar{display:grid;grid-template-columns:1fr auto auto;gap:2px;background:var(--chrome);border-top:1px solid #999;padding:2px}.statuscell{border:1px inset #ddd;padding:2px 5px;min-height:20px}@media(max-width:900px){.split{grid-template-columns:1fr}.statusbar{grid-template-columns:1fr}.grid{min-width:1300px}}
</style>
</head>
<body>
<div class="shell"><div class="window">
<div class="titlebar"><span>Open Italian Anti-Mafia White List Archive — Dataset Explorer</span><span id="build"></span></div>
<div class="menubar" id="tabs">
<button class="tab active" data-view="structure">Struttura dataset</button>
<button class="tab" data-view="observations">Dati Cosenza</button>
<button class="tab" data-view="diff">Confronto snapshot</button>
<button class="tab" data-view="coverage">Copertura nazionale</button>
<button class="tab" data-view="provenance">Pipeline / provenance</button>
<button class="tab" data-view="method">Metodo</button>
</div>
<div class="content">
<section class="view active" id="view-structure"></section><section class="view" id="view-observations"></section><section class="view" id="view-diff"></section><section class="view" id="view-coverage"></section><section class="view" id="view-provenance"></section><section class="view" id="view-method"></section>
</div>
<div class="statusbar"><div class="statuscell" id="status">Pronto</div><div class="statuscell" id="rowstatus"></div><div class="statuscell">SOURCE → SEMANTIC → RESOLUTION → CANONICAL</div></div>
</div></div>
<div class="detail" id="detail"><div class="detail-title"><span id="detail-title">Dettaglio</span><button class="btn" id="detail-close">X</button></div><div class="detail-body" id="detail-body"></div></div>
<script>
const D=__DATA_PAYLOAD__;
const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const F=n=>new Intl.NumberFormat('it-IT').format(Number(n||0));
const SL={pending:'In istruttoria',listed:'Inserita/listed',renewal_requested:'Rinnovo richiesto',renewal_update_in_progress:'Aggiornamento in corso',other_or_unknown:'Altro/ignoto',rejected_or_denied:'Diniego/rigetto',cancellation_related:'Cancellazione'};
const CL={added:'Nuova osservazione',disappeared:'Non più osservata',status_changed:'Esito cambiato',content_changed:'Contenuto cambiato',unchanged:'Invariata'};
function section(title,body){return `<div class="section"><div class="section-title">${E(title)}</div><div class="section-body">${body}</div></div>`}
function renderStructure(){
 const m=D.model_population;
 if(!m){document.querySelector('#view-structure').innerHTML=section('STRUTTURA DATASET','<div class="note">Population manifest non disponibile in questa build. La build live deve essere generata dopo il semantic pipeline.</div>');return}
 let rows=m.objects.map(o=>`<tr><td>${E(o.layer.toUpperCase())}</td><td><b>${E(o.label)}</b></td><td class="mono">${E(o.table)}</td><td style="text-align:right">${F(o.count)}</td><td><span class="status ${E(o.status)}">${E(o.status)}</span></td><td>${E(o.reason)}</td><td>${E(o.meaning)}</td></tr>`).join('');
 const p=D.semantic_pipeline;
 let pipe=p?`<table class="summary"><tr><th>Source series</th><td>${E(p.series_code)}</td><th>Parser family</th><td class="mono">${E(p.parser_selection.family_code)}</td><th>Record contract</th><td class="mono">${E(p.record_contract_code)}</td></tr><tr><th>Semantic profile</th><td class="mono">${E(p.semantic_profile.code)}</td><th>Projector</th><td class="mono">${E(p.semantic_profile.projector_module)}</td><th>Field mappings</th><td>${F((p.field_mappings.inserted||0)+(p.field_mappings.existing||0))}</td></tr></table>`:'<div class="note">Nessun semantic-pipeline manifest incorporato.</div>';
 document.querySelector('#view-structure').innerHTML=section('POPOLAZIONE REALE DEL DATABASE',`<div class="note"><b>Questa tabella viene letta dal PostgreSQL ricostruito dopo l’ingestione.</b> Una tabella a zero righe non è più descritta genericamente come “non popolata”: viene indicato il motivo operativo.</div><div class="gridwrap"><table class="tree"><thead><tr><th>Layer</th><th>Oggetto</th><th>Tabella</th><th>N.</th><th>Stato</th><th>Perché</th><th>Significato</th></tr></thead><tbody>${rows}</tbody></table></div>`)+section('ROUTING PARSER → CONTRATTO → ONTOLOGIA',pipe);
}
let obs={page:1,size:40};
function filters(){let q=(document.querySelector('#q')?.value||'').toLowerCase(),ed=document.querySelector('#ed')?.value||'all',st=document.querySelector('#st')?.value||'all';return (D.cosenza.records||[]).filter(r=>(ed==='all'||r.edition===ed)&&(st==='all'||r.source_status===st)&&(!q||JSON.stringify(r).toLowerCase().includes(q)))}
function ids(r){let x=r.identifiers_parsed;return Array.isArray(x)?x.map(v=>v.raw_value||v.value||'').filter(Boolean).join(' · '):String(r.identifier_field_raw||'').replaceAll('\n',' · ')}
function acts(r){let x=r.requested_activities_parsed;return Array.isArray(x)?x.map(v=>typeof v==='string'?v:(v.label||v.raw_value||'')).filter(Boolean).join(' · '):String(r.requested_activities_raw||'')}
function dates(r){let x=r.application_dates_parsed;return Array.isArray(x)?x.map(v=>typeof v==='string'?v:(v.date||v.raw_value||'')).filter(Boolean).join(' · '):String(r.application_dates_raw||'')}
function drawObs(){let rows=filters(),pages=Math.max(1,Math.ceil(rows.length/obs.size));obs.page=Math.min(obs.page,pages);let s=(obs.page-1)*obs.size,show=rows.slice(s,s+obs.size);document.querySelector('#rowstatus').textContent=`${F(rows.length)} righe`;document.querySelector('#tbody').innerHTML=show.map(r=>`<tr data-i="${D.cosenza.records.indexOf(r)}"><td>${E(r.edition)}</td><td class="mono">${E(r.row_ordinal)}</td><td><b>${E(r.operator_name_raw)}</b></td><td>${E(r.registered_office_raw)}</td><td class="mono">${E(ids(r))}</td><td>${E(acts(r))}</td><td>${E(dates(r))}</td><td>${E(r.observed_listing_date||'')}</td><td>${E(r.observed_expiry_date||'')}</td><td>${E(SL[r.source_status]||r.source_status)}</td><td>${E(CL[r.change]||r.change)}</td></tr>`).join('');document.querySelector('#page').textContent=`${obs.page}/${pages}`;document.querySelector('#prev').disabled=obs.page<=1;document.querySelector('#next').disabled=obs.page>=pages;document.querySelectorAll('#tbody tr').forEach(tr=>tr.onclick=()=>openDetail(D.cosenza.records[Number(tr.dataset.i)]))}
function renderObservations(){let sts=[...new Set((D.cosenza.records||[]).map(r=>r.source_status))].sort();document.querySelector('#view-observations').innerHTML=section('OSSERVAZIONI SORGENTE — Cosenza parser v2',`<div class="toolbar"><label>Cerca</label><input id="q"><label>Edizione</label><select id="ed"><option value="all">Tutte</option>${D.cosenza.snapshots.map(s=>`<option>${E(s.date)}</option>`).join('')}</select><label>Esito</label><select id="st"><option value="all">Tutti</option>${sts.map(s=>`<option value="${E(s)}">${E(SL[s]||s)}</option>`).join('')}</select><button class="btn" id="reset">Azzera</button></div><div class="gridwrap"><table class="grid"><thead><tr><th>Edizione</th><th>Riga</th><th>Ragione sociale</th><th>Sede legale</th><th>CF/P.IVA</th><th>Attività</th><th>Data istanza</th><th>Inserita il</th><th>Scadenza</th><th>Esito</th><th>Diff</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="pager"><button class="btn" id="prev">&lt;</button><span id="page"></span><button class="btn" id="next">&gt;</button></div>`);['q','ed','st'].forEach(id=>document.querySelector('#'+id).addEventListener(id==='q'?'input':'change',()=>{obs.page=1;drawObs()}));document.querySelector('#reset').onclick=()=>{document.querySelector('#q').value='';document.querySelector('#ed').value='all';document.querySelector('#st').value='all';obs.page=1;drawObs()};document.querySelector('#prev').onclick=()=>{obs.page--;drawObs()};document.querySelector('#next').onclick=()=>{obs.page++;drawObs()};drawObs()}
function openDetail(r){document.querySelector('#detail-title').textContent=r.operator_name_raw||'Dettaglio';document.querySelector('#detail-body').innerHTML=`<div class="kv"><div>Edizione</div><div>${E(r.edition)}</div><div>Ragione sociale</div><div>${E(r.operator_name_raw)}</div><div>Sede legale</div><div>${E(r.registered_office_raw)}</div><div>Sede secondaria</div><div>${E(r.secondary_office_raw)}</div><div>Identificativi</div><div class="mono">${E(ids(r))}</div><div>Attività</div><div>${E(acts(r))}</div><div>Date istanza</div><div>${E(dates(r))}</div><div>Data inserimento osservata</div><div>${E(r.observed_listing_date||'')}</div><div>Scadenza nominale osservata</div><div>${E(r.observed_expiry_date||'')}</div><div>Esito parser</div><div>${E(SL[r.source_status]||r.source_status)}</div><div>Record hash</div><div class="mono">${E(r.record_hash)}</div></div><p><b>Esito sorgente completo</b></p><div class="raw">${E(r.outcome_raw||'')}</div><p><b>Raw record</b></p><div class="raw">${E(r.raw_block||'')}</div><div class="note">Questa vista parte dall'evidenza sorgente. La proiezione semantica e la canonicalizzazione sono passaggi distinti e versionati.</div>`;document.querySelector('#detail').classList.add('open')}
function renderDiff(){let d=D.cosenza.diff,q=D.cosenza.parser_qa;let t=Object.entries(d.source_status?.transition_counts||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${E(k)}</td><td>${F(v)}</td></tr>`).join('');document.querySelector('#view-diff').innerHTML=section('CONFRONTO 28/06/2026 → 03/08/2026',`<table class="summary"><tr><th>Indicatore</th><th>Valore</th><th>Interpretazione</th></tr><tr><td>Nuove osservazioni</td><td>${F(d.mention_observations.added)}</td><td>non equivale a nuova iscrizione</td></tr><tr><td>Non più osservate</td><td>${F(d.mention_observations.disappeared)}</td><td>non equivale a rimozione</td></tr><tr><td>Comuni</td><td>${F(d.mention_observations.common)}</td><td>stessa chiave osservativa</td></tr></table>`)+section('QA parser v1 → v2',`<table class="summary"><tr><th></th><th>28/06</th><th>03/08</th></tr><tr><td>v1</td><td>${F(q.v1_counts['2026-06-28'])}</td><td>${F(q.v1_counts['2026-08-03'])}</td></tr><tr><td><b>v2 corrente</b></td><td><b>${F(q.v2_counts['2026-06-28'])}</b></td><td><b>${F(q.v2_counts['2026-08-03'])}</b></td></tr></table>`)+section('Transizioni diagnostiche Esito',`<table class="summary"><tr><th>Transizione</th><th>N.</th></tr>${t}</table>`)}
function renderCoverage(){let rows=(D.national.authorities||[]).map(a=>`<tr><td>${E(a.name)}</td><td>${E(a.region)}</td><td>${E(a.office_type)}</td><td>${a.verified?'VERIFICATA':'DA VERIFICARE'}</td><td>${F(a.series_count)}</td></tr>`).join('');document.querySelector('#view-coverage').innerHTML=section('COPERTURA NAZIONALE',`<table class="summary"><tr><th>Autorità censite</th><td>${F(D.national.authority_count)}</td><th>Landing verificate</th><td>${F(D.national.verified_page_count)}</td><th>Source series</th><td>${F(D.national.source_series_count)}</td></tr></table><br><div class="gridwrap"><table class="grid"><thead><tr><th>Autorità</th><th>Regione</th><th>Tipo ufficio</th><th>Landing</th><th>Series</th></tr></thead><tbody>${rows}</tbody></table></div>`)}
function renderProvenance(){let p=D.cosenza.provenance,sp=D.semantic_pipeline;let eds=p.editions.map(e=>`<tr><td>${E(e.reference_date)}</td><td class="mono">${E(e.content_sha256)}</td><td>${E(e.page_count)}</td></tr>`).join('');let routing=sp?`<div class="kv"><div>Parser family</div><div class="mono">${E(sp.parser_selection.family_code)}</div><div>Parser implementation</div><div class="mono">${E(sp.parser_selection.implementation_module)}</div><div>Record contract</div><div class="mono">${E(sp.record_contract_code)}</div><div>Semantic projector</div><div class="mono">${E(sp.semantic_profile.projector_module)}</div><div>Projection counts</div><div class="mono">${E(JSON.stringify(sp.semantic_projection))}</div><div>Canonicalisation counts</div><div class="mono">${E(JSON.stringify(sp.canonicalisation))}</div></div>`:'<div class="note">Semantic pipeline manifest non incorporato.</div>';document.querySelector('#view-provenance').innerHTML=section('PARSER FISICO',`<div class="kv"><div>Nome</div><div class="mono">${E(p.parser_name)}</div><div>Versione</div><div>${E(p.parser_version)}</div><div>Commit/revision</div><div class="mono">${E(p.processing_revision)}</div><div>Configuration hash</div><div class="mono">${E(p.configuration_hash)}</div><div>Schema fingerprint</div><div class="mono">${E(p.schema_fingerprint)}</div></div>`)+section('ROUTING SEMANTICO',routing)+section('CONTENT OBJECTS',`<table class="summary"><tr><th>Edizione</th><th>SHA-256</th><th>Pagine</th></tr>${eds}</table>`)}
function renderMethod(){let m=D.model_population;let unresolved=m?.unresolved_entity_observations??'—';document.querySelector('#view-method').innerHTML=section('PIPELINE AUTOMATICA',`<table class="tree"><tr><th>Livello</th><th>Responsabilità</th><th>Regola</th></tr><tr><td>1. Capture</td><td>Acquisire e identificare i bytes</td><td>hash/provenance immutabili</td></tr><tr><td>2. Parser family</td><td>Estrarre la struttura fisica della fonte</td><td>assegnata per source binding / schema fingerprint</td></tr><tr><td>3. Record contract</td><td>Interfaccia stabile tra parser e semantica</td><td>il parser non scrive il canone</td></tr><tr><td>4. Semantic projector</td><td>Popolare osservazioni tipizzate dell'ontologia</td><td>nessuna informazione sorgente persa</td></tr><tr><td>5. Resolver/canonicalizer</td><td>Creare entità e fatti solo quando la regola è sufficientemente forte</td><td>${E(unresolved)} osservazioni identitarie restano non forzate</td></tr><tr><td>6. Derived events</td><td>Confrontare storia canonica</td><td>DISAPPEARED_FROM_SOURCE ≠ REMOVED</td></tr></table>`)+section('PRINCIPIO PARSER',`<div class="note">Non un parser per URL e non un mega-parser universale. Una <b>parser family</b> può coprire più fonti compatibili. Parser diversi possono produrre lo stesso <b>record contract</b> e riusare lo stesso semantic projector.</div>`)}
function activate(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id==='view-'+v));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===v));document.querySelector('#status').textContent='Vista: '+v;if(v==='observations')renderObservations()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>activate(b.dataset.view));document.querySelector('#detail-close').onclick=()=>document.querySelector('#detail').classList.remove('open');document.querySelector('#build').textContent=D.meta.classification;renderStructure();renderDiff();renderCoverage();renderProvenance();renderMethod();document.querySelector('#rowstatus').textContent=F(D.cosenza.total_records)+' osservazioni sorgente';
</script>
</body></html>
