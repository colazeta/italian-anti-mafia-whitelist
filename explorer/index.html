<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>White List Data Explorer · Preview</title>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--ink:#17202a;--muted:#637083;--line:#dfe5ec;--accent:#1f5f8b;--accent2:#eaf3f9;--warn:#8a5a00;--warnbg:#fff7df;--good:#1d6b49;--goodbg:#eaf7f0;--bad:#a03a3a;--badbg:#fff0f0;--shadow:0 8px 28px rgba(29,48,67,.08)}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}.sidebar{background:#102432;color:#eaf1f6;padding:20px 16px;position:sticky;top:0;height:100vh}.brand{font-size:17px;font-weight:750;letter-spacing:.1px;line-height:1.2;margin-bottom:6px}.subbrand{font-size:12px;color:#a9bdca;margin-bottom:18px}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700}.badge.internal{background:#503c11;color:#ffe7a5;border:1px solid #755d25}.nav{margin-top:20px;display:grid;gap:5px}.nav button{width:100%;text-align:left;background:transparent;color:#cbd8e0;border:0;padding:9px 10px;border-radius:8px;cursor:pointer}.nav button:hover,.nav button.active{background:#1d3c50;color:white}.side-note{position:absolute;left:16px;right:16px;bottom:18px;font-size:11px;color:#91a9b7;border-top:1px solid #294557;padding-top:12px}.main{min-width:0}.topbar{height:66px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:5}.topbar h1{font-size:17px;margin:0}.topmeta{font-size:12px;color:var(--muted)}.content{padding:24px 26px 50px;max-width:1500px}.view{display:none}.view.active{display:block}.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:18px}.hero h2{font-size:25px;margin:0 0 6px}.hero p{margin:0;color:var(--muted);max-width:800px}.notice{border:1px solid #e1c46e;background:var(--warnbg);color:#5e470c;border-radius:10px;padding:12px 14px;margin:16px 0}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(5,minmax(0,1fr));margin:14px 0 22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:var(--shadow)}.card .k{font-size:12px;color:var(--muted);margin-bottom:6px}.card .v{font-size:25px;font-weight:760;letter-spacing:-.4px}.card .s{font-size:11px;color:var(--muted);margin-top:5px}.section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px;margin-top:14px;box-shadow:var(--shadow)}.section h3{font-size:15px;margin:0 0 12px}.split{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.progress-row{display:grid;grid-template-columns:180px 1fr 70px;gap:10px;align-items:center;margin:10px 0}.bar{height:9px;background:#edf1f5;border-radius:99px;overflow:hidden}.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}.pill{display:inline-flex;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:650;border:1px solid var(--line);background:#fafbfc;color:#455467}.pill.good{background:var(--goodbg);color:var(--good);border-color:#bee1cf}.pill.warn{background:var(--warnbg);color:var(--warn);border-color:#ead28b}.pill.bad{background:var(--badbg);color:var(--bad);border-color:#f0c4c4}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{background:white;border:1px solid #ccd6e0;border-radius:8px;padding:8px 10px;outline:none}.toolbar input{min-width:260px}.toolbar .count{color:var(--muted);margin-left:auto}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse;min-width:900px}.table th{position:sticky;top:0;background:#f7f9fb;color:#586779;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.35px;border-bottom:1px solid var(--line);padding:9px}.table td{border-bottom:1px solid #edf0f3;padding:9px;vertical-align:top}.table tr{cursor:pointer}.table tbody tr:hover{background:#f7fbfe}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.muted{color:var(--muted)}.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}.status-pending{background:#c08a16}.status-listed{background:#2a8a5b}.status-renewal_requested{background:#6f63b5}.status-renewal_update_in_progress{background:#387da6}.status-other_or_unknown,.status-rejected_or_denied,.status-cancellation_related{background:#a75e5e}.change-added{color:#1d6b49}.change-disappeared{color:#a03a3a}.change-status_changed{color:#7259a6}.change-content_changed{color:#9b6b00}.change-unchanged{color:#7b8793}.pagination{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:10px}.pagination button{border:1px solid var(--line);background:white;border-radius:7px;padding:6px 9px;cursor:pointer}.pagination button:disabled{opacity:.4}.kv{display:grid;grid-template-columns:210px 1fr;gap:7px 14px;font-size:13px}.kv div:nth-child(odd){color:var(--muted)}.timeline{display:grid;gap:9px}.timeline-item{display:grid;grid-template-columns:115px 1fr;gap:12px}.timeline-item .date{font-weight:700}.raw{white-space:pre-wrap;background:#f6f8fa;border:1px solid var(--line);padding:12px;border-radius:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;max-height:260px;overflow:auto}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(620px,92vw);background:white;box-shadow:-14px 0 38px rgba(26,44,60,.18);z-index:20;transform:translateX(105%);transition:transform .18s ease;display:flex;flex-direction:column}.drawer.open{transform:translateX(0)}.drawer-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.drawer-head h3{margin:0;font-size:16px}.drawer-body{overflow:auto;padding:18px 20px}.close{border:0;background:#eef2f6;border-radius:7px;width:30px;height:30px;cursor:pointer}.metric-list{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.metric{padding:10px;border:1px solid var(--line);border-radius:9px}.metric strong{display:block;font-size:19px}.metric span{font-size:11px;color:var(--muted)}.authority-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.authority{border:1px solid var(--line);padding:9px;border-radius:9px;background:#fff}.authority strong{display:block;font-size:12px}.authority small{color:var(--muted)}.empty{color:var(--muted);padding:30px;text-align:center}.footer-note{font-size:11px;color:var(--muted);margin-top:18px}@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.side-note{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.cards{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.authority-list{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">White List Data Explorer</div>
  <div class="subbrand">Open Italian Anti-Mafia White List Archive</div>
  <span class="badge internal">● INTERNAL CHECKPOINT</span>
  <div class="nav" id="nav">
    <button data-view="overview" class="active">Overview</button>
    <button data-view="coverage">Copertura nazionale</button>
    <button data-view="cosenza">Cosenza</button>
    <button data-view="observations">Osservazioni sorgente</button>
    <button data-view="diff">Confronto snapshot</button>
    <button data-view="provenance">Provenance</button>
    <button data-view="method">Metodo</button>
  </div>
  <div class="side-note">Preview di controllo. Le righe mostrate sono osservazioni pubblicate dalla fonte, non ancora entità o stati amministrativi canonici.</div>
</aside>
<main class="main">
  <header class="topbar"><h1 id="topTitle">Overview</h1><div class="topmeta" id="topMeta"></div></header>
  <div class="content">
    <section class="view active" id="view-overview"></section>
    <section class="view" id="view-coverage"></section>
    <section class="view" id="view-cosenza"></section>
    <section class="view" id="view-observations"></section>
    <section class="view" id="view-diff"></section>
    <section class="view" id="view-provenance"></section>
    <section class="view" id="view-method"></section>
  </div>
</main>
</div>
<div class="drawer" id="drawer"><div class="drawer-head"><div><div class="muted" style="font-size:11px">SOURCE OBSERVATION</div><h3 id="drawerTitle"></h3></div><button class="close" id="drawerClose">×</button></div><div class="drawer-body" id="drawerBody"></div></div>
<script>
window.EXPLORER_DATA = __DATA_PAYLOAD__;
const D=window.EXPLORER_DATA;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmt=n=>new Intl.NumberFormat('it-IT').format(n||0);
const pct=(a,b)=>b?Math.round(a/b*100):0;
const statusLabel={pending:'In istruttoria',listed:'Listed / inserita',renewal_requested:'Rinnovo richiesto',renewal_update_in_progress:'Rinnovo/aggiornamento in corso',other_or_unknown:'Altro / non classificato',rejected_or_denied:'Diniego/rigetto (diagnostico)',cancellation_related:'Cancellazione (diagnostico)'};
const changeLabel={added:'Nuova osservazione',disappeared:'Non più osservata',status_changed:'Esito sorgente cambiato',content_changed:'Contenuto riga cambiato',unchanged:'Invariata'};
function hero(title,desc,tag='CHECKPOINT'){return `<div class="hero"><div><div class="pill warn">${tag}</div><h2>${title}</h2><p>${desc}</p></div></div>`}
function card(k,v,s=''){return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`}
function renderOverview(){const n=D.national,c=D.cosenza;document.querySelector('#view-overview').innerHTML=hero('Checkpoint prima della scala nazionale','Questa preview serve a verificare se struttura, parsing, distinzione fra fonte e canone e modalità di consultazione sono corretti prima di replicare il modello sulle altre Prefetture.')+`<div class="notice"><strong>Importante:</strong> le ${fmt(c.total_records)} righe Cosenza sono <b>source observations</b>. Nessuna riga è stata automaticamente trasformata in impresa canonica, iscrizione o cancellazione amministrativa.</div><div class="grid cards">${card('Autorità territoriali',fmt(n.authority_count),'universo nazionale')}${card('Landing page verificate',fmt(n.verified_page_count),`${pct(n.verified_page_count,n.authority_count)}% del totale`)}${card('Source series qualificate',fmt(n.source_series_count),'modelli di pubblicazione')}${card('Edizioni storiche Cosenza',fmt(n.cosenza_historical_editions),'individuate')}${card('Osservazioni Cosenza',fmt(c.total_records),'2 snapshot reali')}</div><div class="split"><div class="section"><h3>Stato del progetto</h3><div class="timeline"><div class="timeline-item"><div class="date">Source discovery</div><div><span class="pill good">ATTIVO</span> 106 autorità mappate; fonti verificate progressivamente.</div></div><div class="timeline-item"><div class="date">Capture</div><div><span class="pill good">VALIDATO</span> PDF ufficiali Cosenza identificati per SHA-256 e metadata HTTP.</div></div><div class="timeline-item"><div class="date">Parsing</div><div><span class="pill good">VALIDATO v1</span> ragione sociale + CF/P.IVA + raw row block.</div></div><div class="timeline-item"><div class="date">Entity resolution</div><div><span class="pill warn">NON ANCORA</span> gli identificativi ambigui non vengono forzati.</div></div><div class="timeline-item"><div class="date">Canonical facts</div><div><span class="pill warn">NON ANCORA</span> nessun esito sorgente viene promosso automaticamente a stato legale.</div></div></div></div><div class="section"><h3>Cosenza · snapshot confrontati</h3><div class="metric-list">${c.snapshots.map(s=>`<div class="metric"><strong>${fmt(s.count)}</strong><span>${esc(s.date)} · righe</span></div>`).join('')}<div class="metric"><strong>+${fmt(c.diff.records.net)}</strong><span>variazione netta</span></div><div class="metric"><strong>${fmt(c.diff.mention_observations.record_content_changed)}</strong><span>righe comuni cambiate</span></div></div><div class="footer-note">L’aumento netto non equivale a nuove iscrizioni amministrative: è soltanto differenza fra pubblicazioni osservate.</div></div></div>`}
function renderCoverage(){const n=D.national;let authorities=(n.authorities||[]);document.querySelector('#view-coverage').innerHTML=hero('Copertura nazionale','Qui controlliamo prima di tutto la copertura delle fonti, separandola dalla disponibilità dei dati d’impresa.')+`<div class="section"><h3>Avanzamento</h3><div class="progress-row"><div>Autorità censite</div><div class="bar"><span style="width:100%"></span></div><strong>${n.authority_count}/${n.authority_count}</strong></div><div class="progress-row"><div>Landing verificate</div><div class="bar"><span style="width:${pct(n.verified_page_count,n.authority_count)}%"></span></div><strong>${n.verified_page_count}/${n.authority_count}</strong></div></div><div class="section"><h3>Autorità territoriali</h3><div class="toolbar"><input id="authoritySearch" placeholder="Cerca autorità o regione…"><select id="authorityVerified"><option value="all">Tutte</option><option value="yes">Solo verificate</option><option value="no">Non ancora verificate</option></select><span class="count" id="authorityCount"></span></div><div class="authority-list" id="authorityList"></div></div>`;const draw=()=>{const q=(document.querySelector('#authoritySearch').value||'').toLowerCase(),v=document.querySelector('#authorityVerified').value;const rows=authorities.filter(a=>(!q||`${a.name} ${a.region}`.toLowerCase().includes(q))&&(v==='all'||(v==='yes')===!!a.verified));document.querySelector('#authorityCount').textContent=`${rows.length} autorità`;document.querySelector('#authorityList').innerHTML=rows.map(a=>`<div class="authority"><strong>${esc(a.name)}</strong><small>${esc(a.region)} · ${a.verified?'<span class="change-added">fonte verificata</span>':'fonte da verificare'} · ${a.series_count||0} series</small></div>`).join('')||'<div class="empty">Nessun risultato</div>'};document.querySelector('#authoritySearch').oninput=draw;document.querySelector('#authorityVerified').onchange=draw;draw()}
function renderCosenza(){const c=D.cosenza;document.querySelector('#view-cosenza').innerHTML=hero('Prefettura di Cosenza','Primo pilot end-to-end: fonte ufficiale, due snapshot congelati, parser versionato e osservazioni riga-per-riga riproducibili.')+`<div class="grid cards" style="grid-template-columns:repeat(4,minmax(0,1fr))">${c.snapshots.map(s=>card(s.date,fmt(s.count),'source rows')).join('')}${card('ParseRun',fmt(c.parse_run_count),'successful')}${card('Canonical entities','0','creazione automatica disabilitata')}</div><div class="split"><div class="section"><h3>Distribuzione parser status</h3>${c.snapshots.map(s=>`<div style="margin-bottom:15px"><strong>${s.date}</strong>${Object.entries(s.status_counts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="progress-row" style="grid-template-columns:180px 1fr 60px"><div><span class="status-dot status-${k}"></span>${esc(statusLabel[k]||k)}</div><div class="bar"><span style="width:${Math.max(2,pct(v,s.count))}%"></span></div><strong>${fmt(v)}</strong></div>`).join('')}</div>`).join('')}</div><div class="section"><h3>Guardrail</h3><p><span class="pill warn">SOURCE ≠ CANONICAL</span></p><p>Il parser riconosce pattern nella colonna <i>Esito</i> per diagnosi e confronto, ma la versione v1 persiste strutturalmente soltanto ragione sociale e campo CF/P.IVA, oltre al raw block completo.</p><p>La presenza o assenza fra snapshot non produce eventi amministrativi di iscrizione/rimozione.</p><p>Un identificativo a 11 cifre non viene assunto come chiave univoca: nel pilot esiste almeno un identificativo ambiguo.</p></div></div>`}
let obsState={page:1,pageSize:50};
function filteredRecords(){let rows=D.cosenza.records||[];const q=(document.querySelector('#obsSearch')?.value||'').trim().toLowerCase(),ed=document.querySelector('#obsEdition')?.value||'all',st=document.querySelector('#obsStatus')?.value||'all',ch=document.querySelector('#obsChange')?.value||'all';return rows.filter(r=>(ed==='all'||r.edition===ed)&&(st==='all'||r.source_status===st)&&(ch==='all'||r.change===ch)&&(!q||`${r.operator_name_raw} ${r.identifier_raw} ${r.raw_block}`.toLowerCase().includes(q)))}
function renderObservationTable(){const rows=filteredRecords(),pages=Math.max(1,Math.ceil(rows.length/obsState.pageSize));obsState.page=Math.min(obsState.page,pages);const start=(obsState.page-1)*obsState.pageSize,show=rows.slice(start,start+obsState.pageSize);document.querySelector('#obsCount').textContent=`${fmt(rows.length)} righe`;document.querySelector('#obsBody').innerHTML=show.map(r=>`<tr data-index="${r._i}"><td>${esc(r.edition)}</td><td class="mono">${esc(r.row_ordinal)}</td><td><strong>${esc(r.operator_name_raw)}</strong><div class="muted">${esc(r.operator_name_normalised)}</div></td><td class="mono">${esc(r.identifier_raw)}</td><td><span class="status-dot status-${r.source_status}"></span>${esc(statusLabel[r.source_status]||r.source_status)}</td><td class="change-${r.change}">${esc(changeLabel[r.change]||r.change)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nessun risultato</td></tr>';document.querySelector('#pageLabel').textContent=`Pagina ${obsState.page} / ${pages}`;document.querySelector('#prevPage').disabled=obsState.page<=1;document.querySelector('#nextPage').disabled=obsState.page>=pages;document.querySelectorAll('#obsBody tr[data-index]').forEach(tr=>tr.onclick=()=>openRecord(D.cosenza.records[Number(tr.dataset.index)]))}
function renderObservations(){const statuses=[...new Set((D.cosenza.records||[]).map(r=>r.source_status))].sort();document.querySelector('#view-observations').innerHTML=hero('Osservazioni sorgente','Questa è la vista che useresti per controllare il parsing. Clicca una riga per vedere raw source block, hash e provenance.')+`<div class="notice"><strong>Preview interna:</strong> i valori CF/P.IVA e i raw source blocks sono inclusi nel bundle privato di controllo. Questo non è un dataset pubblico né una release.</div><div class="section"><div class="toolbar"><input id="obsSearch" placeholder="Cerca ragione sociale, identificativo, testo…"><select id="obsEdition"><option value="all">Entrambi gli snapshot</option>${D.cosenza.snapshots.map(s=>`<option>${s.date}</option>`).join('')}</select><select id="obsStatus"><option value="all">Tutti gli status parser</option>${statuses.map(s=>`<option value="${esc(s)}">${esc(statusLabel[s]||s)}</option>`).join('')}</select><select id="obsChange"><option value="all">Tutte le variazioni</option>${Object.entries(changeLabel).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><span class="count" id="obsCount"></span></div><div class="table-wrap"><table class="table"><thead><tr><th>Edizione</th><th>Riga</th><th>Ragione sociale sorgente</th><th>CF/P.IVA sorgente</th><th>Status parser</th><th>Confronto</th></tr></thead><tbody id="obsBody"></tbody></table></div><div class="pagination"><button id="prevPage">←</button><span id="pageLabel"></span><button id="nextPage">→</button></div></div>`;['obsSearch','obsEdition','obsStatus','obsChange'].forEach(id=>document.querySelector('#'+id).addEventListener(id==='obsSearch'?'input':'change',()=>{obsState.page=1;renderObservationTable()}));document.querySelector('#prevPage').onclick=()=>{obsState.page--;renderObservationTable()};document.querySelector('#nextPage').onclick=()=>{obsState.page++;renderObservationTable()};renderObservationTable()}
function renderDiff(){const d=D.cosenza.diff;const transitions=d.source_status.transition_counts||{};document.querySelector('#view-diff').innerHTML=hero('Confronto fra snapshot','28 giugno 2026 → 3 agosto 2026. Tutte le differenze sono eventi osservativi nella pubblicazione, non ancora eventi amministrativi.')+`<div class="grid cards" style="grid-template-columns:repeat(4,minmax(0,1fr))">${card('Nuove osservazioni',fmt(d.mention_observations.added),'non = nuove iscrizioni')}${card('Non più osservate',fmt(d.mention_observations.disappeared),'non = rimozioni')}${card('Comuni',fmt(d.mention_observations.common),'stessa mention key')}${card('Contenuto cambiato',fmt(d.mention_observations.record_content_changed),'fra le comuni')}</div><div class="split"><div class="section"><h3>Transizioni diagnostiche dell’Esito</h3>${Object.entries(transitions).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="progress-row"><div>${esc(k)}</div><div class="bar"><span style="width:${Math.max(4,pct(v,d.source_status.changed_common_mentions))}%"></span></div><strong>${fmt(v)}</strong></div>`).join('')}</div><div class="section"><h3>Identificativi sorgente</h3><div class="metric-list">${Object.entries(d.identifier_observations).map(([k,v])=>`<div class="metric"><strong>${fmt(v)}</strong><span>${esc(k.replaceAll('_',' '))}</span></div>`).join('')}</div><div class="notice" style="margin-bottom:0">La presenza di un identificativo ambiguo è una prova pratica del perché il progetto mantiene separati <b>EntityMention</b> ed <b>EntityResolution</b>.</div></div></div>`}
function renderProvenance(){const p=D.cosenza.provenance;document.querySelector('#view-provenance').innerHTML=hero('Provenance e riproducibilità','Ogni snapshot e ParseRun deve poter essere ricondotto ai bytes e alla specifica versione del codice che lo ha prodotto.')+`<div class="section"><h3>Parser</h3><div class="kv"><div>Nome</div><div class="mono">${esc(p.parser_name)}</div><div>Versione</div><div>${esc(p.parser_version)}</div><div>Processing revision</div><div class="mono">${esc(p.processing_revision)}</div><div>Configuration hash</div><div class="mono">${esc(p.configuration_hash)}</div><div>Schema fingerprint</div><div class="mono">${esc(p.schema_fingerprint)}</div></div></div><div class="section"><h3>Snapshot</h3><div class="table-wrap"><table class="table"><thead><tr><th>Edizione</th><th>SHA-256 PDF</th><th>Text SHA-256</th><th>Pagine</th><th>HTTP</th></tr></thead><tbody>${p.editions.map(e=>`<tr><td>${esc(e.reference_date)}</td><td class="mono">${esc(e.content_sha256)}</td><td class="mono">${esc(e.text_sha256)}</td><td>${e.page_count}</td><td>200 · ETag verificato</td></tr>`).join('')}</tbody></table></div></div>`}
function renderMethod(){document.querySelector('#view-method').innerHTML=hero('Come leggere questa preview','Il checkpoint è costruito per farti contestare il modello prima della scala nazionale.')+`<div class="section"><h3>Livelli che non vanno confusi</h3><div class="timeline"><div class="timeline-item"><div class="date">1. Evidence</div><div>PDF/pagina ufficiale, hash, capture metadata.</div></div><div class="timeline-item"><div class="date">2. Observation</div><div>Riga parsata, raw values, source status diagnostico.</div></div><div class="timeline-item"><div class="date">3. Resolution</div><div>Decisione auditabile che una mention corrisponda a una LegalEntity. Non ancora applicata in questa preview.</div></div><div class="timeline-item"><div class="date">4. Canonical fact</div><div>Stato amministrativo/legale normalizzato, temporalmente versionato. Non ancora derivato automaticamente.</div></div><div class="timeline-item"><div class="date">5. Derived event</div><div>Es. FIRST_OBSERVED o DISAPPEARED_FROM_SOURCE, sempre distinto da eventi amministrativi.</div></div></div></div><div class="section"><h3>Cosa vorrei che tu valuti</h3><ol><li>La distinzione visiva fra dati sorgente e dati canonici è abbastanza forte?</li><li>La tabella delle osservazioni ti permette davvero di controllare se il parsing è corretto?</li><li>Nel dettaglio riga, raw block e valori estratti sono sufficienti per fare QA?</li><li>Il confronto fra snapshot è leggibile senza indurre l’utente a interpretare “sparito” come “rimosso”?</li><li>La pagina Prefettura è il livello giusto da cui partire per l’esperienza finale?</li></ol></div>`}
function openRecord(r){document.querySelector('#drawerTitle').textContent=r.operator_name_raw;document.querySelector('#drawerBody').innerHTML=`<div class="kv"><div>Edizione</div><div>${esc(r.edition)}</div><div>Riga</div><div>${esc(r.row_ordinal)}</div><div>Nome sorgente</div><div>${esc(r.operator_name_raw)}</div><div>Nome normalizzato</div><div>${esc(r.operator_name_normalised)}</div><div>CF/P.IVA sorgente</div><div class="mono">${esc(r.identifier_raw)}</div><div>Status parser</div><div>${esc(statusLabel[r.source_status]||r.source_status)}</div><div>Confronto</div><div class="change-${r.change}">${esc(changeLabel[r.change]||r.change)}${r.transition?` · ${esc(r.transition)}`:''}</div><div>Record hash</div><div class="mono">${esc(r.record_hash)}</div><div>Mention key</div><div class="mono">${esc(r.mention_key)}</div></div><h4>Raw source block</h4><div class="raw">${esc(r.raw_block)}</div><div class="notice"><strong>Non canonicalizzare da qui:</strong> questa vista mostra ciò che il parser osserva nella fonte. Identità, stato legale e settori canonici richiedono passaggi separati e provenance dedicata.</div>`;document.querySelector('#drawer').classList.add('open')}
function activate(view){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelector('#view-'+view).classList.add('active');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===view));const labels={overview:'Overview',coverage:'Copertura nazionale',cosenza:'Cosenza',observations:'Osservazioni sorgente',diff:'Confronto snapshot',provenance:'Provenance',method:'Metodo'};document.querySelector('#topTitle').textContent=labels[view];if(view==='observations')renderObservations()}
function init(){if(!D){document.querySelector('#view-overview').innerHTML='<div class="empty">Nessun payload Explorer caricato.</div>';return}(D.cosenza.records||[]).forEach((r,i)=>r._i=i);document.querySelector('#topMeta').textContent=`generato ${D.meta.generated_at} · ${D.meta.classification}`;renderOverview();renderCoverage();renderCosenza();renderDiff();renderProvenance();renderMethod();document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>activate(b.dataset.view));document.querySelector('#drawerClose').onclick=()=>document.querySelector('#drawer').classList.remove('open')}
init();
</script>
</body></html>
