[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "italian-anti-mafia-whitelist"
version = "0.1.0"
description = "Open, provenance-aware and longitudinal archive of Italian anti-mafia White Lists"
requires-python = ">=3.12"
authors = [{name = "Project contributors"}]
dependencies = []

[project.scripts]
white-list-national-index = "white_list_archive.acquisition.national_index:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
database = ["psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
