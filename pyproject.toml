[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "italian-anti-mafia-whitelist"
version = "0.1.1.dev0"
description = "Open, provenance-aware and longitudinal archive of Italian anti-mafia White Lists"
requires-python = ">=3.12"
authors = [{name = "Project contributors"}]
dependencies = []

[project.scripts]
white-list-national-index = "white_list_archive.acquisition.national_index:main"
white-list-source-population-coverage = "white_list_archive.acquisition.source_population_coverage:main"
white-list-anncsu-acquire = "white_list_archive.acquisition.anncsu:main"
white-list-istat-municipalities-acquire = "white_list_archive.acquisition.istat_municipalities:main"
white-list-normalise-addresses = "white_list_archive.geocoding.pipeline:main"
white-list-anncsu-enrich = "white_list_archive.geocoding.anncsu_pipeline:main"
white-list-geocode-validation = "white_list_archive.geocoding.validation:main"
white-list-address-review-sample = "white_list_archive.geocoding.review_sample:main"
white-list-cosenza-snapshot = "white_list_archive.acquisition.cosenza_snapshot:main"
white-list-cosenza-capture = "white_list_archive.acquisition.cosenza_capture:main"
white-list-cosenza-mentions = "white_list_archive.parsers.cosenza_combined_mentions:main"
white-list-cosenza-v2 = "white_list_archive.parsers.cosenza_combined_v2:main"
white-list-persist-capture-manifests = "white_list_archive.persistence.capture_manifest:main"
white-list-persist-parsed-records = "white_list_archive.persistence.parsed_records:main"
white-list-persist-parsed-records-v2 = "white_list_archive.persistence.parsed_records_v2:main"
white-list-semantic-pipeline = "white_list_archive.semantic.pipeline_current:main"
white-list-model-population = "white_list_archive.publishing.model_population:main"
white-list-table-bundle = "white_list_archive.publishing.table_bundle:main"
white-list-source-evidence = "white_list_archive.publishing.source_evidence:main"
white-list-explorer-audit-patch = "white_list_archive.publishing.explorer_audit_patch:main"
white-list-explorer-address-validation-patch = "white_list_archive.publishing.explorer_address_validation_bundle:main"
white-list-build-explorer-preview = "white_list_archive.publishing.explorer_bundle:main"
white-list-build-explorer-preview-v2 = "white_list_archive.publishing.explorer_bundle_v2:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
database = ["psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
