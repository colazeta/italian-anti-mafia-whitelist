<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Registro pubblico sperimentale delle White List antimafia italiane, con attributi di fonte, storico, provenienza e audit.">
  <title>Open Italian Anti-Mafia White List Archive</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="desktop">
    <main class="window" aria-labelledby="app-title">
      <header class="titlebar">
        <span id="app-title">Open Italian Anti-Mafia White List Archive</span>
        <span class="titlebar-meta">PUBLIC REGISTER · AUDIT TRANSPARENT</span>
      </header>

      <nav class="menubar" aria-label="Sezioni del portale">
        <button class="tab active" data-view="registry">Registro</button>
        <button class="tab" data-view="overview">Panoramica</button>
        <button class="tab" data-view="history">Storico</button>
        <button class="tab" data-view="coverage">Copertura</button>
        <button class="tab" data-view="quality">Qualità</button>
        <button class="tab" data-view="method">Metodo</button>
        <button class="tab" data-view="audit">Audit</button>
        <button class="tab" data-view="sources">Fonti</button>
      </nav>

      <div class="content">
        <noscript><div class="note bad">Questo portale richiede JavaScript per caricare il dataset pubblico.</div></noscript>
        <section class="view active" id="view-registry" aria-live="polite"></section>
        <section class="view" id="view-overview"></section>
        <section class="view" id="view-history"></section>
        <section class="view" id="view-coverage"></section>
        <section class="view" id="view-quality"></section>
        <section class="view" id="view-method"></section>
        <section class="view" id="view-audit"></section>
        <section class="view" id="view-sources"></section>
      </div>

      <footer class="statusbar">
        <div class="statuscell" id="status">Caricamento registro pubblico…</div>
        <div class="statuscell" id="rowstatus"></div>
        <div class="statuscell" id="asof"></div>
        <div class="statuscell">SOURCE → REGISTER → AUDIT</div>
      </footer>
    </main>
  </div>

  <aside class="detail" id="detail" aria-hidden="true">
    <div class="detail-title"><span id="detail-title">Dettaglio osservazione</span><button class="btn" id="detail-close" type="button">X</button></div>
    <div class="detail-body" id="detail-body"></div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
