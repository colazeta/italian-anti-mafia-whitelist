name: Belluno current-source integration

on:
  push:
    branches:
      - expansion/belluno-public-2026-09-10
    paths:
      - '.github/workflows/belluno-current-integrate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/belluno-public-2026-09-10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconcile Belluno into current canonical state
        run: |
          python - <<'PY'
          import csv, json
          from datetime import datetime, timezone
          from pathlib import Path

          source = {
              "source_key": "belluno-combined",
              "parser": "belluno_combined",
              "authority_key": "belluno",
              "authority_name": "Prefettura di Belluno",
              "register_key": "belluno-ordinary",
              "register_name": "White List ordinaria",
              "population_scope": "listed_and_applicant",
              "reference_date": "2026-09-02",
              "source_page_url": "https://prefettura.interno.gov.it/it/prefetture/belluno/evidenza/white-list",
              "resource_url": "https://prefettura.interno.gov.it/sites/default/files/29/2026-09/white_list_02_09_2026-1.pdf",
              "sha256": "65203c633f261deec31bba00be6c4893f90c8a40cd293b832066d20520ff8b58",
              "expected_source_rows": 402,
              "last_source_update": "2026-09-02",
              "last_source_update_basis": "document heading and dated official resource",
              "notes": "Current official Belluno PDF explicitly combines enrolled companies and companies requesting registration. The byte-pinned 44-page edition contains 402 source rows across 42 data pages. Legal-state mapping uses only explicit source notes; malformed dates and identifiers are never repaired."
          }

          config_path=Path('data/publication/multi_prefecture_pilot.json')
          config=json.loads(config_path.read_text(encoding='utf-8'))
          existing=[s for s in config['sources'] if s['source_key']==source['source_key']]
          if existing and existing != [source]: raise SystemExit('Conflicting Belluno source config')
          if not existing: config['sources'].append(source)
          config['verified_at']='2026-09-10'
          config_path.write_text(json.dumps(config,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          series_path=Path('data/source_registry/source_series_inventory.csv')
          rows=list(csv.DictReader(series_path.open(encoding='utf-8',newline='')))
          match=[r for r in rows if r['source_series_key']=='belluno-combined']
          if len(match)!=1: raise SystemExit(f'Expected one Belluno series row, found {len(match)}')
          r=match[0]
          r['resource_resolution_status']='landing_page_resolved'
          r['verified_date']='2026-09-10'
          r['notes']=('Current official landing page and direct combined PDF verified 10 September 2026. '
                      'The attachment is explicitly dated 2 September 2026 and contains 402 source rows: '
                      '392 listed-population rows and 10 rows explicitly in fase istruttoria. Exact SHA and '
                      'parser boundaries are documented in docs/sources/belluno-operational-check-2026-09-10.md.')
          with series_path.open('w',encoding='utf-8',newline='') as h:
              w=csv.DictWriter(h,fieldnames=rows[0].keys()); w.writeheader(); w.writerows(rows)

          catalog_path=Path('data/catalog.csv')
          cat=list(csv.DictReader(catalog_path.open(encoding='utf-8',newline='')))
          m=[r for r in cat if r['dataset_id']=='multi-prefecture-publication-pilot']
          if len(m)!=1 or m[0]['record_count']!='19': raise SystemExit(f'Unexpected publication config baseline: {m}')
          m[0]['record_count']='20'
          with catalog_path.open('w',encoding='utf-8',newline='') as h:
              w=csv.DictWriter(h,fieldnames=cat[0].keys()); w.writeheader(); w.writerows(cat)

          cov_path=Path('data/monitoring/national_coverage.json')
          cov=json.loads(cov_path.read_text(encoding='utf-8'))
          b=[p for p in cov['prefectures'] if p['authority_key']=='belluno']
          if len(b)!=1: raise SystemExit('Belluno monitoring row missing/duplicated')
          item=b[0]
          if item['public_export_enabled']: raise SystemExit('Belluno unexpectedly already public')
          now=datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z')
          item.update({
              'current_edition_identified': True,
              'capture_implemented': True,
              'parser_implemented': True,
              'parser_validated': True,
              'company_observations_loaded': True,
              'observation_layer': 'public_source_observations',
              'canonical_integration_validated': False,
              'public_export_enabled': True,
              'durable_evidence_verified': False,
              'population_scopes_complete': True,
              'latest_source_reference_date': '2026-09-02',
              'last_successful_source_check_at': now,
              'last_attempted_source_check_at': now,
              'last_successful_investigation_on': '2026-09-10',
              'monitoring_status': 'CURRENT',
              'unresolved_issue': ['Canonical hosted-database integration and independent durable-evidence verification remain governed under #16; public source observations are validated independently of that infrastructure.'],
              'actionable_issue': False,
              'coverage_status': 'VALIDATED',
              'terminal_reason': None,
              'completion_evidence': ['docs/sources/belluno-operational-check-2026-09-10.md','src/white_list_archive/parsers/belluno_combined.py','tests/test_belluno_parser_semantics.py','data/publication/multi_prefecture_pilot.json'],
              'known_content_sha256': [source['sha256']],
              'evidence': ['data/source_registry/verified_primary_pages.csv','data/source_registry/source_series_inventory.csv','docs/sources/belluno-operational-check-2026-09-10.md','src/white_list_archive/parsers/belluno_combined.py','tests/test_belluno_parser_semantics.py','data/publication/multi_prefecture_pilot.json']
          })
          cov_path.write_text(json.dumps(cov,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          registry_path=Path('src/white_list_archive/publishing/public_national_registry.py')
          txt=registry_path.read_text(encoding='utf-8')
          old='from white_list_archive.parsers.benevento_positioned import PARSERS as BENEVENTO_PARSERS\n'
          new=old+'from white_list_archive.parsers.belluno_combined import PARSERS as BELLUNO_PARSERS\n'
          if txt.count(old)!=1: raise SystemExit('Unexpected registry import baseline')
          txt=txt.replace(old,new)
          old='        or BENEVENTO_PARSERS.get(cfg["parser"])\n'
          new=old+'        or BELLUNO_PARSERS.get(cfg["parser"])\n'
          if txt.count(old)!=1: raise SystemExit('Unexpected parser dispatch baseline')
          registry_path.write_text(txt.replace(old,new),encoding='utf-8')

          pages_path=Path('.github/workflows/public-pages.yml')
          pages=pages_path.read_text(encoding='utf-8')
          reps={
            "      - 'src/white_list_archive/parsers/benevento_positioned.py'\n": "      - 'src/white_list_archive/parsers/benevento_positioned.py'\n      - 'src/white_list_archive/parsers/belluno_combined.py'\n",
            "assert reg['meta']['record_count'] == 8522": "assert reg['meta']['record_count'] == 8924",
            "'pesaro-e-urbino','biella','benevento'}": "'pesaro-e-urbino','biella','benevento','belluno'}",
            "'pesaro-urbino-ordinary','biella-ordinary','benevento-ordinary'": "'pesaro-urbino-ordinary','biella-ordinary','benevento-ordinary','belluno-ordinary'",
            "assert reg['meta']['authority_count'] == 11": "assert reg['meta']['authority_count'] == 12",
            "assert reg['meta']['register_count'] == 12": "assert reg['meta']['register_count'] == 13",
            "assert pref['meta']['published_count'] == 11": "assert pref['meta']['published_count'] == 12",
            "          assert len(benevento) == 1 and benevento[0]['mapped'] and benevento[0]['published']\n": "          assert len(benevento) == 1 and benevento[0]['mapped'] and benevento[0]['published']\n          belluno = [x for x in pref['prefectures'] if x['authority_key'] == 'belluno']\n          assert len(belluno) == 1 and belluno[0]['mapped'] and belluno[0]['published']\n"
          }
          for old,new in reps.items():
              if pages.count(old)!=1: raise SystemExit(f'Unexpected public-pages baseline: {old!r} count={pages.count(old)}')
              pages=pages.replace(old,new)
          pages_path.write_text(pages,encoding='utf-8')

          browser_path=Path('tests/public_portal_browser.cjs')
          browser=browser_path.read_text(encoding='utf-8')
          reps={
            'assert.equal(stats.total,8522);':'assert.equal(stats.total,8924);',
            "['alessandria','aosta','arezzo','avellino','pesaro-e-urbino','biella','benevento']":"['alessandria','aosta','arezzo','avellino','pesaro-e-urbino','biella','benevento','belluno']",
            "      assert.deepEqual(statusCounts(benevento),{listed:734,pending:204});\n":"      assert.deepEqual(statusCounts(benevento),{listed:734,pending:204});\n      const belluno=registry.records.filter(r=>r.authority_key==='belluno');\n      assert.equal(belluno.length,402);\n      assert.equal(belluno.filter(r=>r.source_key==='belluno-combined').length,402);\n      assert.deepEqual(statusCounts(belluno),{expired_observed:49,listed:281,pending:10,renewal_update_in_progress:62});\n"
          }
          for old,new in reps.items():
              if browser.count(old)!=1: raise SystemExit(f'Unexpected browser baseline: {old!r} count={browser.count(old)}')
              browser=browser.replace(old,new)
          browser_path.write_text(browser,encoding='utf-8')

          Path('docs/sources/belluno-operational-check-2026-09-10.md').write_text('''# Belluno White List operational check — 10 September 2026\n\n## Current official source\n\n- Official landing page: `https://prefettura.interno.gov.it/it/prefetture/belluno/evidenza/white-list`.\n- Current direct attachment: `https://prefettura.interno.gov.it/sites/default/files/29/2026-09/white_list_02_09_2026-1.pdf`.\n- The PDF identifies enterprises enrolled in and requesting enrolment in the provincial Belluno White Lists and carries the explicit source date **2 September 2026**.\n- Verified byte SHA-256: `65203c633f261deec31bba00be6c4893f90c8a40cd293b832066d20520ff8b58`.\n- The source has 44 pages: page 1 is the ten-section legend, pages 2–43 contain one stable eight-column data table each, and page 44 has no data table.\n\n## Population and parser boundary\n\nThe audited edition contains **402 source rows**: **392** listed-population rows with explicit listing and expiry dates and **10** rows explicitly marked `IN FASE ISTRUTTORIA`. Observed source-status counts are **281 listed**, **62 renewal/update in progress**, **49 expired observed**, and **10 pending/in istruttoria**. Status mapping uses only source-explicit notes and fails closed on unrecognised non-blank legal-status text.\n\nDates are normalised only from complete valid `DD/MM/YYYY` tokens. One visibly truncated source application date, `07/04/202`, is not reconstructed and remains canonically blank. Identifiers are preserved verbatim: **388/402** rows yield a strict canonical CF/PIVA token, **13/402** contain a non-empty raw identifier that does not satisfy the canonical rule, and **1/402** has a blank source identifier. No identifier is padded, truncated or repaired.\n\n## Validation and publication boundary\n\n`belluno_combined` requires 44 pages, the ten-section legend, 42 exact data-page headers, one table per data page, exactly eight columns and exactly 402 source rows. The live validation re-downloads the official PDF, requires the pinned SHA-256 and confirms the complete identifier partition and source-backed status counts. Public records stay inside public contract v3. Canonical hosted-database integration and independent durable-evidence verification are **not** claimed by this expansion and remain governed separately under issue #16.\n''',encoding='utf-8')

          Path('.github/workflows/belluno-current-integrate.yml').unlink()
          PY
      - name: Install full test runtime
        run: python -m pip install -e '.[dev,publication,database,storage]'
      - name: Run full repository tests
        run: python -m pytest -q
      - name: Build Belluno against pinned official bytes
        run: |
          rm -rf /tmp/belluno-current public-site/data/registry.json public-site/data/registry.csv public-site/data/prefectures.json public-site/data/prefectures.csv
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/belluno-current \
            --registry-json public-site/data/registry.json \
            --registry-csv public-site/data/registry.csv \
            --prefectures-json public-site/data/prefectures.json \
            --prefectures-csv public-site/data/prefectures.csv
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('public-site/data/registry.json').read_text())
          pref=json.loads(Path('public-site/data/prefectures.json').read_text())
          b=[r for r in reg['records'] if r['authority_key']=='belluno']
          assert len(reg['records'])==8924
          assert reg['meta']['authority_count']==12 and reg['meta']['register_count']==13
          assert len(b)==402
          assert {s:sum(r['source_status']==s for r in b) for s in set(r['source_status'] for r in b)} == {'listed':281,'renewal_update_in_progress':62,'expired_observed':49,'pending':10}
          assert pref['meta']['mapped_count']==35 and pref['meta']['published_count']==12
          diag=json.loads(Path('/tmp/belluno-current/belluno-combined.diagnostics.json').read_text())
          assert diag['identifier_coverage']==388 and diag['raw_identifier_only']==13 and diag['blank_identifier_rows']==1
          assert diag['malformed_application_dates']==1 and diag['dropped_date_rows']==0
          print('Belluno current-source integration validated', diag)
          PY
      - name: Commit validated source integration
        run: |
          rm -f public-site/data/registry.json public-site/data/registry.csv public-site/data/prefectures.json public-site/data/prefectures.csv
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/catalog.csv data/monitoring/national_coverage.json data/publication/multi_prefecture_pilot.json data/source_registry/source_series_inventory.csv docs/sources/belluno-operational-check-2026-09-10.md src/white_list_archive/publishing/public_national_registry.py src/white_list_archive/parsers/belluno_combined.py tests/test_belluno_parser_semantics.py tests/public_portal_browser.cjs .github/workflows/public-pages.yml
          git add -u .github/workflows/belluno-current-integrate.yml
          git diff --cached --check
          git commit -m 'Expand public archive to Belluno'
          git push origin HEAD:expansion/belluno-public-2026-09-10
