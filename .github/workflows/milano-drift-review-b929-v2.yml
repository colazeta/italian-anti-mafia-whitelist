name: Milano drift review b929 v2

on:
  push:
    branches:
      - fix/milano-source-drift-2026-09-18-b929
    paths:
      - '.github/workflows/milano-drift-review-b929-v2.yml'
      - 'scripts/milano_drift_review_b929.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install publication runtime
        run: python -m pip install -e '.[publication]'

      - name: Capture and audit current Milano sources
        run: python scripts/milano_drift_review_b929.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milano-drift-review-b929-v2
          path: audit-output/milano-drift-review.json
          retention-days: 14
          if-no-files-found: warn
