name: Pisa national integration candidate

on:
  push:
    branches:
      - expansion/pisa-2026-09-15
    paths:
      - '.github/workflows/pisa-national-candidate.yml'
      - 'tmp/pisa_integrate_candidate.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pisa-national-candidate
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PDF and project runtimes
        run: |
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install -e '.[dev,database,storage,publication]'
      - name: Reacquire Pisa sources twice and verify approved bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pisa-source
          cat > /tmp/pisa-source/sources.tsv <<'EOF'
          listed	https://prefettura.interno.gov.it/sites/default/files/0/2026-09/iscritte.pdf	30eea93e542aea6ceb13bcfd4e3f1358e1c3f9cfb274b23e738dfb304b1dea23	169257
          applicant	https://prefettura.interno.gov.it/sites/default/files/0/2026-09/richiedente-iscrizione.pdf	ed3bbf19670dbed899f6386836f4723898e4c20f9315e4d4297156fd1dcd6b12	68334
          renewal_update	https://prefettura.interno.gov.it/sites/default/files/0/2026-09/in-aggiornamento.pdf	8658cd2e6048c44de18687b3933980778dd36bbf3721cd944063f61c0e2ceedb	73013
          EOF
          while IFS=$'\t' read -r scope url expected_sha expected_bytes; do
            for attempt in 1 2; do
              curl --fail --location --silent --show-error \
                --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 90 \
                "$url" -o "/tmp/pisa-source/${scope}.${attempt}.pdf"
              head -c 5 "/tmp/pisa-source/${scope}.${attempt}.pdf" | grep -q '^%PDF-'
            done
            cmp "/tmp/pisa-source/${scope}.1.pdf" "/tmp/pisa-source/${scope}.2.pdf"
            test "$(sha256sum "/tmp/pisa-source/${scope}.1.pdf" | awk '{print $1}')" = "$expected_sha"
            test "$(stat -c %s "/tmp/pisa-source/${scope}.1.pdf")" = "$expected_bytes"
          done < /tmp/pisa-source/sources.tsv
      - name: Apply fail-closed Pisa integration transaction
        run: python tmp/pisa_integrate_candidate.py
      - name: Run full repository and Pisa semantic tests
        run: |
          pytest -q
          pytest -q tests/test_pisa_parser_semantics.py
      - name: Build actual national candidate
        run: |
          rm -rf /tmp/pisa-public-site /tmp/pisa-national-sources
          cp -a public-site /tmp/pisa-public-site
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/pisa-national-sources \
            --registry-json /tmp/pisa-public-site/data/registry.json \
            --registry-csv /tmp/pisa-public-site/data/registry.csv \
            --prefectures-json /tmp/pisa-public-site/data/prefectures.json \
            --prefectures-csv /tmp/pisa-public-site/data/prefectures.csv
      - name: Validate national candidate and exact Pisa invariants
        run: |
          python -m white_list_archive.publishing.public_artifact /tmp/pisa-public-site
          node --check /tmp/pisa-public-site/app.js
          node --check /tmp/pisa-public-site/summary.js
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root = Path('/tmp/pisa-public-site/data')
          reg = json.loads((root/'registry.json').read_text(encoding='utf-8'))
          pref = json.loads((root/'prefectures.json').read_text(encoding='utf-8'))
          meta = reg['meta']
          assert meta['record_count'] == 47248, meta
          assert meta['authority_count'] == 41, meta
          assert meta['register_count'] == 42, meta
          assert len(reg['records']) == 47248
          assert meta['authority_counts']['pisa'] == 449
          assert meta['register_counts']['pisa-white-list'] == 449
          assert pref['meta']['authority_count'] == 106
          assert pref['meta']['published_count'] == 41
          assert pref['meta']['mapped_count'] == 45

          rows = [record for record in reg['records'] if record['authority_key'] == 'pisa']
          assert len(rows) == 449
          assert Counter(record['source_key'] for record in rows) == Counter({
              'pisa-listed': 398,
              'pisa-applicants': 18,
              'pisa-renewal-update': 33,
          })
          assert Counter(record['population_scope'] for record in rows) == Counter({'listed': 431, 'applicant': 18})
          assert Counter(record['source_status'] for record in rows) == Counter({
              'listed': 398,
              'pending': 18,
              'renewal_update_in_progress': 33,
          })
          assert len({record['record_locator'] for record in rows}) == 449
          assert sum(bool(record['identifiers']) for record in rows if record['source_key'] == 'pisa-listed') == 397
          assert sum(bool(record['identifiers']) for record in rows if record['source_key'] == 'pisa-applicants') == 18
          assert sum(bool(record['identifiers']) for record in rows if record['source_key'] == 'pisa-renewal-update') == 33
          pisa = [item for item in pref['prefectures'] if item['authority_key'] == 'pisa']
          assert len(pisa) == 1 and pisa[0]['mapped'] and pisa[0]['published'] and pisa[0]['series_count'] == 3, pisa
          print({
              'record_count': meta['record_count'],
              'authority_count': meta['authority_count'],
              'register_count': meta['register_count'],
              'mapped_count': pref['meta']['mapped_count'],
              'pisa_sources': dict(Counter(record['source_key'] for record in rows)),
              'pisa_statuses': dict(Counter(record['source_status'] for record in rows)),
          })
          PY
      - name: Check exact production-only integration diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          data/catalog.csv
          data/monitoring/national_coverage.json
          data/publication/multi_prefecture_pilot.json
          data/source_registry/source_series_inventory.csv
          data/source_registry/verified_primary_pages.csv
          src/white_list_archive/publishing/public_national_registry.py
          tests/test_source_population_coverage.py
          tests/test_source_registry.py
          EOF
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
      - name: Commit validated production integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/catalog.csv \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            data/source_registry/verified_primary_pages.csv \
            src/white_list_archive/publishing/public_national_registry.py \
            tests/test_source_population_coverage.py \
            tests/test_source_registry.py
          git diff --cached --check
          git commit -m 'Integrate Pisa public White List sources'
          git push origin HEAD:expansion/pisa-2026-09-15
