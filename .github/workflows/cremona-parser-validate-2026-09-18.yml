name: Cremona parser validation 2026-09-18

on:
  push:
    branches:
      - expansion/cremona-2026-09-18
    paths:
      - src/white_list_archive/parsers/cremona_combined.py
      - tests/test_cremona_parser_semantics.py
      - .github/workflows/cremona-parser-validate-2026-09-18.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[publication]' pytest
      - name: Fetch current official PDF twice
        shell: bash
        run: |
          set -euo pipefail
          URL='https://prefettura.interno.gov.it/sites/default/files/22/2026-09/white-list-elenchi-ditte_3.pdf'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36'
          for copy in 1 2; do
            ok=0
            for attempt in 1 2 3; do
              if curl -fsSL -A "$UA" -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${URL}?validate=${copy}-${attempt}-$(date +%s%N)" -o "source${copy}.pdf"; then ok=1; break; fi
              sleep $((attempt*2))
            done
            test "$ok" -eq 1
          done
          cmp source1.pdf source2.pdf
          test "$(sha256sum source1.pdf | cut -d' ' -f1)" = '55a9498a76120f0b781f9c7ae8da7144c141551598b63a98b0bc52caac79a550'
      - name: Run semantic tests and parser
        run: |
          pytest -q tests/test_cremona_parser_semantics.py
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          from white_list_archive.parsers.cremona_combined import parse_cremona_combined
          cfg={
            'source_key':'cremona-combined','authority_key':'cremona','authority_name':'Prefettura di Cremona',
            'register_key':'cremona-ordinary','register_name':'White List ordinaria',
            'population_scope':'listed_and_applicant','reference_date':'2026-09-18',
            'source_page_url':'https://prefettura.interno.gov.it/it/prefetture/cremona/evidenza/white-list-elenco-ditte',
            'resource_url':'https://prefettura.interno.gov.it/sites/default/files/22/2026-09/white-list-elenchi-ditte_3.pdf',
            'sha256':'55a9498a76120f0b781f9c7ae8da7144c141551598b63a98b0bc52caac79a550',
          }
          batch=parse_cremona_combined(Path('source1.pdf'),cfg)
          print(batch.diagnostics)
          assert len(batch.records)==187
          assert Counter(r['source_status'] for r in batch.records)==Counter({'listed':99,'pending':38,'renewal_update_in_progress':50})
          assert sum(bool(r['identifiers']) for r in batch.records)==183
          PY
