          # Asti White List operational check — 10 September 2026

          ## Official current surface

          The official Prefettura di Asti provincial White List page was verified directly on 10 September 2026:

          - https://prefettura.interno.gov.it/it/prefetture/asti/white-list-provinciali
          - the page explicitly labels **Elenco imprese iscritte — Aggiornato al 03/09/2026**;
          - the same page explicitly labels **Elenco imprese richiedenti l'iscrizione — Aggiornato al 03/09/2026**.

          This establishes positive current-edition evidence for both relevant ordinary White List populations. No publication state is inferred from failed search or from absence.

          ## Byte-pinned resources

          Registered-company resource:

          - https://prefettura.interno.gov.it/sites/default/files/26/2026-09/ditte-iscritte.pdf
          - SHA-256: `8c26313c57588745e92600961e7071d4ff2246ab86555e39500f17f59c41c128`
          - 39 pages.

          Applicant resource:

          - https://prefettura.interno.gov.it/sites/default/files/26/2026-09/ditte_in_istruttoria.pdf
          - SHA-256: `ae5d69a85541dae61ffd67f4983a78831f2a97d096bd752aeb8b93c9a88943a5`
          - 6 pages.

          ## Registered-company parser boundary

          The registered-company source is organised by Sections I-X. Generic PDF table extraction is not a safe fixed-column interface: observed extracted table widths vary across pages. The parser therefore uses the stable ruled-table geometry and the position of the source's **Data di iscrizione o di rinnovo** column, while retaining the section-wide activity from each ruled table.

          The audited source contains **521 sector observations**: 520 have a four-digit-year registration/renewal date in the approved primary-date band and one additional source row (CEIT SRL, Section IV) has no listing date and explicitly reports **In istruttoria**. That row remains a pending source observation. It is not assigned a listing date and is not silently swallowed into a neighbouring dated record.

          The 521 sector observations are conservatively grouped only when cleaned identity, secondary office, canonical identifier set (or raw identifier fallback), source date pair, raw update text and source status all agree. The current byte-pinned edition yields **${listed_count} public source observations** after that grouping. Section/activity membership is accumulated only inside those exact groups.

          Four sector observations do not expose a normal four-digit-year expiry anchor. Three are the repeated RONCO ANDREA SRL cancellation observations with a blank expiry field; one source cell is literally `18.04.24`. The parser does not expand the two-digit year or invent an expiry date: malformed non-blank expiry text remains in the approved raw-variant provenance field.

          ## Applicant parser boundary

          The applicant source has one stable seven-column ruled table on each of its six pages and yields **17 source observations**. Two application-date cells are blank and remain blank. One identifier (JOKKO SOCIETA' COOPERATIVA SOCIALE) is the ten-digit source value `0141215742` and remains raw; it is not padded or otherwise corrected.

          Source-explicit outcomes are handled conservatively: four `Iscritta ...` rows are represented as observed listed outcomes, twelve `In istruttoria` rows remain pending, and the single `Non iscritta` value is retained as `other_or_unknown` because that wording alone does not prove a rejection, cancellation, or other legal route.

          ## Validation and publication

          The approved Asti parsers are `asti_listed` and `asti_applicants`. The publication config pins the exact official hashes, the 521 listed-sector denominator, the grouped listed public-observation denominator, and the 17-row applicant denominator. Future byte drift, page-count drift, changed applicant table width, loss of the single explicit pending exception, changed denominators or a new invalid non-blank applicant date fail closed.

          With Asti added, the expected public registry total is **${final_records} records**, **12 published Prefectures** and **13 registers**. Canonical hosted-database integration and independent durable-evidence verification remain governed separately under issue #16 and are not claimed complete here.
          EOF

