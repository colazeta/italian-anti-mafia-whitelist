          assert pref['meta']['mapped_count'] == 35
          assert pref['meta']['published_count'] == 12
          ast=[x for x in pref['prefectures'] if x['authority_key']=='asti']
          assert len(ast)==1 and ast[0]['mapped'] and ast[0]['published']
          listed=[r for r in reg['records'] if r['source_key']=='asti-listed']
          applicants=[r for r in reg['records'] if r['source_key']=='asti-applicants']
          assert len(applicants)==17
          assert sum(r['source_status']=='pending' for r in listed)==1
          assert any(r['name']=='CEIT SRL' and r['source_status']=='pending' and not r['observed_listing_date'] for r in listed)
          assert any(r['identifier_field_raw']=='0141215742' and not r['identifiers'] for r in applicants)
          print({'final_records':final,'asti_listed':len(listed),'asti_applicants':len(applicants)})
          PY

