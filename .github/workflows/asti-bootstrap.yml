              'notes':"The source is organised by Sections I-X. The parser uses ruled-table geometry and exact primary-date positions, then conservatively groups only source rows sharing the same cleaned identity, dates, raw update text and source status. One row for CEIT SRL appears inside the official listed-company PDF without a listing date and explicitly says 'In istruttoria'; it is preserved as a pending source observation rather than assigned a listing date. Blank or malformed expiry values are not reconstructed.",
