name: Frosinone fragment invariant fix

on:
  push:
    branches:
      - expansion/frosinone-2026-09-13
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Promote independently verified fragment invariant
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          parser = Path('src/white_list_archive/parsers/frosinone_tables.py')
          text = parser.read_text(encoding='utf-8')
          old = '_EXPECTED_LISTED_FRAGMENT_ROWS = 42'
          new = '_EXPECTED_LISTED_FRAGMENT_ROWS = 44'
          if text.count(old) != 1:
              raise RuntimeError(f'expected exactly one production fragment invariant, found {text.count(old)}')
          parser.write_text(text.replace(old, new), encoding='utf-8')

          doc = Path('docs/sources/frosinone-operational-check-2026-09-13.md')
          text = doc.read_text(encoding='utf-8')
          marker = 'The next gate is a full-document layout/status audit over these exact hashes.'
          replacement = (
              'A subsequent full-document parser probe independently confirmed 761 listed records and 475 applicant records. '
              'The listed extraction contains 44 continuation row fragments attached to 40 logical company records; this distinction '
              'is frozen explicitly so the fail-closed parser guards the publisher shape without conflating fragment rows with affected records.\n\n'
              'The next gate is parser validation against these exact hashes.'
          )
          if text.count(marker) != 1:
              raise RuntimeError(f'expected one documentation gate marker, found {text.count(marker)}')
          doc.write_text(text.replace(marker, replacement), encoding='utf-8')
          PY

      - name: Commit promoted invariant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/white_list_archive/parsers/frosinone_tables.py docs/sources/frosinone-operational-check-2026-09-13.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Promote verified Frosinone fragment invariant"
          git push
