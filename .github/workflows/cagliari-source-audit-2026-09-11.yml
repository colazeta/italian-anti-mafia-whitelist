name: Audit Cagliari White List official sources

on:
  push:
    branches:
      - expansion/cagliari-2026-09-11
    paths:
      - .github/workflows/cagliari-source-audit-2026-09-11.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PDF inspection runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Inspect current official Cagliari source surface
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import hashlib, re, subprocess, time, urllib.request

          PAGE = 'https://prefettura.interno.gov.it/it/prefetture/cagliari/evidenza/white-list'
          UA = 'italian-anti-mafia-whitelist/0.1 source-verification'

          def get(url):
              last = None
              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': '*/*'})
                      with urllib.request.urlopen(req, timeout=45) as r:
                          return r.geturl(), dict(r.headers), r.read()
                  except Exception as exc:
                      last = exc
                      print('GET_RETRY', attempt, url, type(exc).__name__, str(exc))
                      if attempt < 3:
                          time.sleep(attempt * 3)
              raise last

          final, headers, body = get(PAGE)
          print('LANDING_FINAL', final)
          print('LANDING_STATUS_BYTES', len(body))
          print('LANDING_SHA256', hashlib.sha256(body).hexdigest())
          text = body.decode('utf-8', 'replace')
          compact = ' '.join(re.sub(r'<[^>]+>', ' ', text).split())
          print('LANDING_TEXT_SAMPLE', compact[:1800])

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.href = None; self.label = []; self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      self.href = dict(attrs).get('href'); self.label = []
              def handle_data(self, data):
                  if self.href is not None: self.label.append(data)
              def handle_endtag(self, tag):
                  if tag == 'a' and self.href is not None:
                      self.links.append((' '.join(''.join(self.label).split()), self.href))
                      self.href = None; self.label = []

          parser = Links(); parser.feed(text)
          candidates = []
          for label, href in parser.links:
              if not href:
                  continue
              url = urljoin(final, href)
              s = f'{label} {href}'.casefold()
              if any(token in s for token in ('white', 'iscritt', 'richied', '.pdf', 'allegat')):
                  candidates.append((label, url))
          print('CANDIDATE_LINK_COUNT', len(candidates))
          for i, item in enumerate(candidates, 1):
              print('CANDIDATE', i, repr(item[0]), item[1])

          seen = set(); downloads = []
          for label, url in candidates:
              if url in seen: continue
              seen.add(url)
              try:
                  final_u, h, b = get(url)
              except Exception as exc:
                  print('CANDIDATE_FETCH_FAILED', repr(label), url, type(exc).__name__, str(exc))
                  continue
              ctype = str(h.get('Content-Type', '')).casefold()
              magic = b[:8]
              if 'pdf' not in ctype and not b.startswith(b'%PDF'):
                  print('CANDIDATE_NON_PDF', repr(label), final_u, ctype, len(b), magic)
                  continue
              sha = hashlib.sha256(b).hexdigest()
              path = Path('/tmp') / f'cagliari-{len(downloads)+1}.pdf'
              path.write_bytes(b)
              print('PDF_SOURCE', len(downloads)+1, repr(label), final_u, len(b), sha, ctype)
              try:
                  info = subprocess.check_output(['pdfinfo', str(path)], text=True, errors='replace')
                  pages = next((ln.split(':',1)[1].strip() for ln in info.splitlines() if ln.startswith('Pages:')), '?')
                  print('PDF_PAGES', len(downloads)+1, pages)
              except Exception as exc:
                  print('PDFINFO_FAILED', len(downloads)+1, type(exc).__name__, str(exc))
              try:
                  txt = subprocess.check_output(['pdftotext', '-layout', str(path), '-'], text=True, errors='replace')
                  lines = [' '.join(x.split()) for x in txt.splitlines() if x.strip()]
                  print('PDF_TEXT_LINE_COUNT', len(downloads)+1, len(lines))
                  for ln in lines[:120]: print('PDF_HEAD', len(downloads)+1, repr(ln[:500]))
                  for ln in lines[-40:]: print('PDF_TAIL', len(downloads)+1, repr(ln[:500]))
                  marker = [ln for ln in lines if re.search(r'iscritt|richied|rinnovo|aggiorn|sezion|istrutt', ln, re.I)]
                  print('PDF_MARKER_COUNT', len(downloads)+1, len(marker))
                  for ln in marker[:160]: print('PDF_MARKER', len(downloads)+1, repr(ln[:500]))
              except Exception as exc:
                  print('PDFTEXT_FAILED', len(downloads)+1, type(exc).__name__, str(exc))
              downloads.append((label, final_u, sha))

          print('PDF_DOWNLOAD_COUNT', len(downloads))
          if not downloads:
              raise SystemExit('No current official PDF attachment could be positively resolved')
          PY
