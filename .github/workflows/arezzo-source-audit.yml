name: Audit current Arezzo White List attachments

on:
  push:
    branches:
      - expansion/arezzo-2026-09-10
    paths:
      - .github/workflows/arezzo-source-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Diagnose source-backed parser boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q requests beautifulsoup4 openpyxl python-docx
          python - <<'PY'
          import collections, datetime, hashlib, io, re
          from urllib.parse import urljoin
          import requests, openpyxl
          from bs4 import BeautifulSoup
          from docx import Document

          def clean(v): return ' '.join(str(v or '').replace('\u00a0',' ').split())
          def date_text(v):
              if isinstance(v,(datetime.datetime,datetime.date)): return v.date().isoformat() if isinstance(v,datetime.datetime) else v.isoformat()
              raw=clean(v)
              m=re.fullmatch(r'(\d{1,2})/+([0-9]{1,2})/+(\d{4})',raw)
              if m:
                  d,mn,y=map(int,m.groups())
                  try: return datetime.date(y,mn,d).isoformat()
                  except ValueError: return ''
              return ''
          page='https://prefettura.interno.gov.it/it/prefetture/arezzo/iscrizione-white-list'
          h={'User-Agent':'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelistArchive/1.0; evidence-source-check)'}
          s=requests.Session(); r=s.get(page,headers=h,timeout=40); r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          urls={}
          for a in soup.find_all('a',href=True):
              t=' '.join(a.stripped_strings); f=t.casefold()
              if 'elenco imprese iscritte' in f: urls['listed']=urljoin(page,a['href'])
              if "elenco imprese richiedenti l'iscrizione" in f: urls['applicants']=urljoin(page,a['href'])
          assert set(urls)=={'listed','applicants'},urls
          bodies={}
          for k,u in urls.items():
              rr=s.get(u,headers=h,timeout=60); rr.raise_for_status(); bodies[k]=rr.content
              print(k.upper(),'URL',u,'BYTES',len(rr.content),'SHA256',hashlib.sha256(rr.content).hexdigest())

          wb=openpyxl.load_workbook(io.BytesIO(bodies['listed']),data_only=True,read_only=True)
          sector_rows=[]; malformed=[]
          for ws in wb.worksheets:
              rows=list(ws.iter_rows(values_only=True)); section=clean(rows[3][0]) if len(rows)>3 else ws.title
              for n,row in enumerate(rows[5:],6):
                  vals=[clean(x) for x in row]
                  if not any(vals): continue
                  if len(vals)<7: vals += ['']*(7-len(vals))
                  ld,ed=date_text(row[4]),date_text(row[5])
                  if vals[0] and vals[3] and ld and ed:
                      sector_rows.append((section,vals[:7],ld,ed))
                  else:
                      malformed.append((ws.title,n,vals[:7],ld,ed))
          print('LISTED_SECTOR_ROWS',len(sector_rows),'MALFORMED_NONEMPTY_DATA_ROWS',len(malformed))
          for item in malformed: print('LISTED_MALFORMED',repr(item))
          grouped={}
          for section,row,ld,ed in sector_rows:
              key=(row[0],row[1],row[2],row[3],ld,ed,row[6])
              grouped.setdefault(key,[]).append(section)
          print('LISTED_GROUPED_RECORDS',len(grouped))
          updates=sum(bool(k[6]) for k in grouped)
          print('LISTED_GROUPED_UPDATES',updates,'LISTED_GROUPED_PLAIN',len(grouped)-updates)
          identities=collections.defaultdict(set)
          for key in grouped:
              identities[(key[0],key[3])].add((key[4],key[5],key[6]))
          conflicts={k:v for k,v in identities.items() if len(v)>1}
          print('LISTED_IDENTITY_GROUPS',len(identities),'DATE_OUTCOME_CONFLICT_GROUPS',len(conflicts))
          for k,v in sorted(conflicts.items()): print('LISTED_CONFLICT',repr(k),repr(sorted(v)))
          missing_ids=sum(not bool(re.findall(r'(?<![A-Za-z0-9])(?:\d{11}|[A-Za-z0-9]{16})(?![A-Za-z0-9])',k[3].replace(' ',''))) for k in grouped)
          print('LISTED_GROUPED_WITHOUT_CANONICAL_LENGTH_IDENTIFIER',missing_ids)

          doc=Document(io.BytesIO(bodies['applicants']))
          assert len(doc.tables)==1
          rows=[]; malformed_app=[]; activities=collections.Counter()
          for n,tr in enumerate(doc.tables[0].rows[1:],2):
              vals=[clean(c.text) for c in tr.cells]
              if len(vals)<6: vals+=['']*(6-len(vals))
              dt=date_text(vals[5]); activities[vals[4]]+=1
              if vals[0] and vals[3] and dt: rows.append((vals,dt))
              else: malformed_app.append((n,vals,dt))
          print('APPLICANT_RECORDS',len(rows),'MALFORMED_ROWS',len(malformed_app))
          for item in malformed_app: print('APPLICANT_MALFORMED',repr(item))
          print('APPLICANT_UNIQUE_ACTIVITY_STRINGS',len(activities))
          for raw,count in activities.most_common(): print('APPLICANT_ACTIVITY',count,repr(raw))
          print('APPLICANT_WITHOUT_CANONICAL_LENGTH_IDENTIFIER',sum(not bool(re.findall(r'(?<![A-Za-z0-9])(?:\d{11}|[A-Za-z0-9]{16})(?![A-Za-z0-9])',vals[3].replace(' ',''))) for vals,_ in rows))
          PY
