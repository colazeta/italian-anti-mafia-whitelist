name: Inspect current Arezzo White List tables

on:
  push:
    branches:
      - expansion/arezzo-source-audit-2026-09-10
    paths:
      - .github/workflows/arezzo-source-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install inspection runtime
        run: python -m pip install openpyxl python-docx
      - name: Resolve and inspect official Arezzo source tables
        run: |
          python - <<'PY'
          from collections import Counter, defaultdict
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin
          import hashlib, re, time, urllib.request
          import openpyxl
          from docx import Document

          PAGE='https://prefettura.interno.gov.it/it/prefetture/arezzo/iscrizione-white-list'
          UA='italian-anti-mafia-whitelist/0.1 source-verification'
          def get(url, attempts=3):
              last=None
              for n in range(1,attempts+1):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':UA})
                      with urllib.request.urlopen(req,timeout=45) as r:
                          return r.geturl(), dict(r.headers), r.read()
                  except Exception as exc:
                      last=exc
                      if n==attempts: raise
                      time.sleep(n*3)
              raise last

          final,headers,body=get(PAGE)
          html=body.decode('utf-8','replace')
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.href=None; self.text=[]; self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a': self.href=dict(attrs).get('href'); self.text=[]
              def handle_data(self,data):
                  if self.href is not None: self.text.append(data)
              def handle_endtag(self,tag):
                  if tag=='a' and self.href is not None:
                      self.links.append((' '.join(''.join(self.text).split()),self.href)); self.href=None; self.text=[]
          p=Links(); p.feed(html)
          wanted=[]
          for text,href in p.links:
              f=text.casefold()
              if 'elenco imprese iscritte' in f or ('elenco imprese richiedenti' in f and 'iscrizione' in f):
                  wanted.append((text,urljoin(final,href)))
          assert len(wanted)==2,wanted
          blobs=[]
          for idx,(text,url) in enumerate(wanted,1):
              final_u,h,b=get(url); sha=hashlib.sha256(b).hexdigest(); suffix='.xlsx' if 'spreadsheet' in (h.get('Content-Type') or '') else '.docx'
              path=Path(f'/tmp/arezzo-{idx}{suffix}'); path.write_bytes(b); blobs.append((text,final_u,h,b,sha,path))
              print('ATTACHMENT',idx,'TEXT',repr(text),'FINAL',final_u,'CONTENT_TYPE',h.get('Content-Type'),'BYTES',len(b),'SHA256',sha)

          # Listed XLSX
          text,url,h,b,sha,path=blobs[0]
          wb=openpyxl.load_workbook(path,data_only=True,read_only=True)
          print('XLSX_SHEETS',wb.sheetnames)
          for ws in wb.worksheets:
              rows=[]
              for raw in ws.iter_rows(values_only=True):
                  vals=tuple(' '.join(str(v).split()) if v is not None else '' for v in raw)
                  if any(vals): rows.append(vals)
              print('XLSX_SHEET',ws.title,'ROWS',len(rows),'MAX_COLUMNS',max((len(r) for r in rows),default=0))
              for i,r in enumerate(rows[:12],1): print('XLSX_ROW',i,repr(r))
              for i,r in enumerate(rows[-5:],max(1,len(rows)-4)): print('XLSX_TAIL',i,repr(r))
              print('XLSX_SHAPES',dict(Counter(len(r) for r in rows)))
              # candidate rows heuristically containing a plausible Italian fiscal/VAT id anywhere
              cands=[]
              for i,r in enumerate(rows,1):
                  ids=[cell for cell in r if re.fullmatch(r'[A-Z0-9]{11,16}',cell.replace(' ',''),re.I)]
                  if ids: cands.append((i,r,ids))
              print('XLSX_ID_CANDIDATES',len(cands))
              for item in cands[:8]: print('XLSX_CAND',repr(item))
              print('XLSX_ID_DUP_EXTRA',sum(n-1 for n in Counter(x for _,_,ids in cands for x in ids).values() if n>1))

          # Applicant DOCX
          text,url,h,b,sha,path=blobs[1]
          doc=Document(path)
          print('DOCX_TABLES',len(doc.tables),'PARAGRAPHS',len(doc.paragraphs))
          para=[(' '.join(p.text.split())) for p in doc.paragraphs if p.text.strip()]
          for i,t in enumerate(para[:10],1): print('DOCX_PARA',i,repr(t))
          all_rows=[]
          for ti,table in enumerate(doc.tables,1):
              rows=[]
              for row in table.rows:
                  vals=tuple(' '.join(cell.text.split()) for cell in row.cells)
                  if any(vals): rows.append(vals)
              all_rows.extend((ti,ri,r) for ri,r in enumerate(rows,1))
              print('DOCX_TABLE',ti,'ROWS',len(rows),'SHAPES',dict(Counter(len(r) for r in rows)))
              for ri,r in enumerate(rows[:10],1): print('DOCX_ROW',ti,ri,repr(r))
              for ri,r in enumerate(rows[-5:],max(1,len(rows)-4)): print('DOCX_TAIL',ti,ri,repr(r))
          cands=[]
          for ti,ri,r in all_rows:
              ids=[cell for cell in r if re.fullmatch(r'[A-Z0-9]{11,16}',cell.replace(' ',''),re.I)]
              if ids:cands.append((ti,ri,r,ids))
          print('DOCX_ID_CANDIDATES',len(cands))
          for item in cands[:10]: print('DOCX_CAND',repr(item))
          print('DOCX_ID_DUP_EXTRA',sum(n-1 for n in Counter(x for *_,ids in cands for x in ids).values() if n>1))
          PY
