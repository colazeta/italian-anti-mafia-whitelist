name: Cuneo reviewed applicant title repair 2026-09-19

on:
  push:
    branches:
      - expansion/cuneo-2026-09-19
    paths:
      - .github/workflows/cuneo-record-394-diagnostic-2026-09-19.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/cuneo-2026-09-19
      - name: Apply exact reviewed title-boundary repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/white_list_archive/parsers/cuneo_positioned.py')
          text = path.read_text()
          old = '''    if "elenco delle ditte richiedenti l'iscrizione nella white list" not in page_texts[0].replace("’", "'").replace("‘", "'"):\n        raise RuntimeError("cuneo_applicants: positive applicant-population title missing")\n'''
          new = '''    applicant_title = " ".join(\n        page_texts[0].replace("’", "'").replace("‘", "'").split()\n    )\n    if "elenco delle ditte richiedenti l'iscrizione nella white list" not in applicant_title:\n        raise RuntimeError("cuneo_applicants: positive applicant-population title missing")\n'''
          if text.count(old) != 1:
              raise SystemExit('expected applicant title guard not found exactly once')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- src/white_list_archive/parsers/cuneo_positioned.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/white_list_archive/parsers/cuneo_positioned.py
          git commit -m "Normalise reviewed Cuneo applicant title whitespace"
          git push origin HEAD:expansion/cuneo-2026-09-19
