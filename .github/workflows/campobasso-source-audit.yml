name: Campobasso source audit

on:
  push:
    branches:
      - expansion/campobasso-2026-09-11
    paths:
      - .github/workflows/campobasso-source-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check openpyxl python-docx requests
      - name: Fetch and audit current official Campobasso sources
        env:
          LANDING_URL: https://prefettura.interno.gov.it/it/prefetture/campobasso/evidenza/white-list
          LISTED_URL: https://prefettura.interno.gov.it/sites/default/files/21/2026-08/11-agosto-2026-elenco-delle-imprese-non-soggette-a-tentativo-di-infilt.xlsx
          APPLICANT_URL: https://prefettura.interno.gov.it/sites/default/files/21/2026-08/11-agosto-2026-elenco-delle-imprese-richiedenti-l-iscrizione.docx
        run: |
          python - <<'PY'
          import hashlib, json, os, re
          from collections import Counter, defaultdict
          from datetime import date, datetime
          from pathlib import Path
          import requests
          import openpyxl
          from docx import Document

          landing_url = os.environ['LANDING_URL']
          listed_url = os.environ['LISTED_URL']
          applicant_url = os.environ['APPLICANT_URL']
          headers = {'User-Agent': 'italian-anti-mafia-whitelist/official-source-audit (+https://github.com/colazeta/italian-anti-mafia-whitelist)'}

          def get(url):
              r = requests.get(url, headers=headers, timeout=60)
              r.raise_for_status()
              return r

          landing = get(landing_url)
          landing_text = landing.text
          for needle in ('11 agosto 2026', 'Elenco delle imprese non soggette a tentativo di infiltrazione mafiosa', "Elenco delle imprese richiedenti l'iscrizione"):
              if needle.casefold() not in landing_text.casefold():
                  raise SystemExit(f'official landing does not contain expected current-edition marker: {needle!r}')

          files = {}
          for key, url, suffix in [('listed', listed_url, '.xlsx'), ('applicant', applicant_url, '.docx')]:
              r = get(url)
              p = Path(f'/tmp/campobasso-{key}{suffix}')
              p.write_bytes(r.content)
              files[key] = {
                  'url': url,
                  'bytes': len(r.content),
                  'sha256': hashlib.sha256(r.content).hexdigest(),
                  'content_type': r.headers.get('content-type',''),
                  'path': str(p),
              }

          def clean(v):
              if v is None: return ''
              if isinstance(v, datetime): return v.date().isoformat()
              if isinstance(v, date): return v.isoformat()
              return re.sub(r'\s+', ' ', str(v)).strip()

          roman = {1:'I',2:'II',3:'III',4:'IV',5:'V',6:'VI',7:'VII',8:'VIII',9:'IX',10:'X'}
          def normalise_section_token(token):
              token = token.upper().strip().rstrip('°º^')
              if token.isdigit():
                  n=int(token)
                  return roman.get(n)
              return token if token in set(roman.values()) else None

          wb = openpyxl.load_workbook(files['listed']['path'], data_only=True, read_only=True)
          row_profiles=[]
          section_candidates=[]
          header_rows=[]
          for ws in wb.worksheets:
              for rowno,row in enumerate(ws.iter_rows(values_only=True), start=1):
                  vals=[clean(v) for v in row]
                  nonempty=[{'col':i+1,'value':v} for i,v in enumerate(vals) if v]
                  joined=' | '.join(vals)
                  if rowno <= 35 or 'sezione' in joined.casefold() or ('ragione sociale' in joined.casefold() and 'data di iscrizione' in joined.casefold()):
                      row_profiles.append({'sheet':ws.title,'row':rowno,'cells':nonempty})
                  for i,v in enumerate(vals):
                      m=re.search(r'\bsezione\s*([ivx]+|10|[1-9])\s*[°º^]?\b', v, re.I)
                      if m:
                          sec=normalise_section_token(m.group(1))
                          section_candidates.append({'sheet':ws.title,'row':rowno,'col':i+1,'raw':v,'normalised':f'Sezione {sec}' if sec else None})
                  low=joined.casefold()
                  if 'ragione sociale' in low and 'codice fiscale' in low and 'data di iscrizione' in low and 'aggiornamento in corso' in low:
                      header_rows.append({'sheet':ws.title,'row':rowno,'cells':nonempty})

          print('CAMPOBASSO_ROW_PROFILE_BEGIN')
          print(json.dumps({'section_candidates':section_candidates,'header_rows':header_rows,'row_profiles':row_profiles},ensure_ascii=False,indent=2))
          print('CAMPOBASSO_ROW_PROFILE_END')

          raw_rows = []
          status_values = Counter()
          identifier_lengths = Counter()
          malformed_identifiers = []
          section_meta = {}
          unscoped_headers=[]
          for ws in wb.worksheets:
              current_section = ''
              current_activity = ''
              in_table = False
              for rowno, row in enumerate(ws.iter_rows(values_only=True), start=1):
                  vals = [clean(v) for v in row]
                  joined = ' | '.join(vals)
                  low_joined = joined.casefold()
                  matches=[]
                  for v in vals:
                      m=re.search(r'\bsezione\s*([ivx]+|10|[1-9])\s*[°º^]?\b', v, re.I)
                      if m:
                          sec=normalise_section_token(m.group(1))
                          if sec: matches.append(sec)
                  if matches:
                      if len(set(matches)) != 1:
                          raise SystemExit(f'ambiguous section markers at {ws.title}:{rowno}: {matches}')
                      current_section = f'Sezione {matches[0]}'
                      current_activity = ''
                      in_table = False
                      section_meta.setdefault(current_section, {'sheet':ws.title,'section':current_section,'activity':'','rows':0,'header_rows':[]})
                      continue
                  if current_section and not in_table:
                      nonempty=[v for v in vals if v]
                      if nonempty and 'ragione sociale' not in low_joined:
                          candidates=[]
                          for v in nonempty:
                              low=v.casefold()
                              if not low.startswith('prefettura') and 'elenco dei fornitori' not in low and 'ministero' not in low and not re.fullmatch(r'\d{1,2}\s+\w+\s+\d{4}', low):
                                  candidates.append(v)
                          if candidates:
                              current_activity=max(candidates,key=len)
                              section_meta[current_section]['activity']=current_activity
                  if 'ragione sociale' in low_joined and 'codice fiscale' in low_joined and 'data di iscrizione' in low_joined and 'aggiornamento in corso' in low_joined:
                      if not current_section:
                          unscoped_headers.append({'sheet':ws.title,'row':rowno})
                          current_section='UNSCOPED_INITIAL'
                          section_meta.setdefault(current_section, {'sheet':ws.title,'section':current_section,'activity':'','rows':0,'header_rows':[]})
                      in_table = True
                      section_meta[current_section]['header_rows'].append(rowno)
                      continue
                  if not in_table:
                      continue
                  padded = (vals + ['']*8)[:8]
                  name, office, province, secondary, ident, listing, expiry, update = padded
                  if not any(padded):
                      continue
                  if not name or not listing or not expiry:
                      continue
                  section_meta[current_section]['rows'] += 1
                  status_values[update] += 1
                  digits = re.sub(r'\D','',ident)
                  if ident:
                      identifier_lengths[len(digits)] += 1
                      if len(digits) != 11:
                          malformed_identifiers.append({'sheet':ws.title,'row':rowno,'section':current_section,'name':name,'identifier_raw':ident})
                  raw_rows.append({
                      'sheet': ws.title, 'section': current_section, 'activity': current_activity,
                      'row': rowno, 'name': name, 'office': office, 'province': province,
                      'secondary': secondary, 'identifier_raw': ident,
                      'listing': listing, 'expiry': expiry, 'update_raw': update,
                  })

          sections = list(section_meta.values())

          grouped = defaultdict(list)
          for r in raw_rows:
              key=(r['name'],r['office'],r['secondary'],r['identifier_raw'],r['listing'],r['expiry'])
              grouped[key].append(r)

          group_status = Counter()
          note_only_groups=[]
          status_conflict_groups=[]
          address_variant_groups=[]
          duplicate_same_section=[]
          for key, rs in grouped.items():
              updates=[r['update_raw'] for r in rs if r['update_raw']]
              plain_si=[u for u in updates if u.strip().casefold()=='si']
              scoped=[u for u in updates if 'non richiesto per questa sezione' in u.casefold()]
              other=[u for u in updates if u not in plain_si and u not in scoped]
              seen=Counter(r['section'] for r in rs)
              if any(v>1 for v in seen.values()): duplicate_same_section.append({'key':key,'sections':dict(seen)})
              provinces=sorted(set(r['province'] for r in rs))
              if len(provinces)>1: address_variant_groups.append({'key':key,'provinces':provinces,'sections':[r['section'] for r in rs]})
              if plain_si:
                  status='renewal_update_in_progress'
              elif scoped:
                  status='scoped_note_without_plain_si'
                  note_only_groups.append({'key':key,'updates':sorted(set(updates)),'sections':[r['section'] for r in rs]})
              elif other:
                  status='other_nonempty_update'
              else:
                  status='listed'
              group_status[status]+=1
              if len(set(updates))>1: status_conflict_groups.append({'key':key,'updates':sorted(set(updates)),'sections':[r['section'] for r in rs]})

          identity_groups=defaultdict(list)
          for r in raw_rows: identity_groups[(r['name'],r['identifier_raw'])].append(r)
          identity_conflicts=[]
          for key, rs in identity_groups.items():
              tuples=sorted(set((r['office'],r['province'],r['secondary'],r['listing'],r['expiry']) for r in rs))
              if len(tuples)>1: identity_conflicts.append({'key':key,'variants':tuples,'sections':[r['section'] for r in rs]})

          doc = Document(files['applicant']['path'])
          applicant_rows=[]
          applicant_headers=[]
          for ti, table in enumerate(doc.tables):
              for ri, row in enumerate(table.rows):
                  vals=[clean(c.text) for c in row.cells]
                  joined=' | '.join(v.casefold() for v in vals)
                  if 'ragione sociale' in joined and 'data di presentazione' in joined:
                      applicant_headers.append({'table':ti,'row':ri+1,'values':vals})
                      continue
                  vals=(vals+['']*6)[:6]
                  if not any(vals): continue
                  name, office, secondary, ident, activities, application_date=vals
                  if not name: continue
                  applicant_rows.append({'table':ti,'row':ri+1,'name':name,'office':office,'secondary':secondary,'identifier_raw':ident,'activities_raw':activities,'application_date_raw':application_date})

          applicant_seen=Counter((r['name'],r['office'],r['secondary'],r['identifier_raw'],r['activities_raw'],r['application_date_raw']) for r in applicant_rows)
          applicant_dupes=[{'key':key,'count':count} for key,count in applicant_seen.items() if count>1]
          applicant_bad_ident=[]
          for r in applicant_rows:
              digits=re.sub(r'\D','',r['identifier_raw'])
              if r['identifier_raw'] and len(digits)!=11: applicant_bad_ident.append({'name':r['name'],'identifier_raw':r['identifier_raw']})

          report={
              'landing': {'url':landing_url,'status_code':landing.status_code,'current_edition':'2026-08-11'},
              'files': {k:{x:y for x,y in v.items() if x!='path'} for k,v in files.items()},
              'listed': {
                  'sheet_count': len(wb.sheetnames), 'sections': sections, 'unscoped_headers':unscoped_headers,
                  'raw_section_rows':len(raw_rows),'semantic_groups':len(grouped), 'group_status_counts':dict(group_status),
                  'raw_update_values':dict(status_values), 'identifier_digit_lengths':dict(identifier_lengths),
                  'malformed_identifier_count':len(malformed_identifiers),'malformed_identifiers':malformed_identifiers,
                  'note_only_groups':note_only_groups,'status_conflict_group_count':len(status_conflict_groups),
                  'status_conflict_groups':status_conflict_groups,'address_variant_group_count':len(address_variant_groups),
                  'address_variant_groups':address_variant_groups,'duplicate_same_section':duplicate_same_section,
                  'identity_conflict_count':len(identity_conflicts),'identity_conflicts':identity_conflicts,
              },
              'applicant': {
                  'table_count':len(doc.tables),'header_occurrences':len(applicant_headers),'headers':applicant_headers,
                  'rows':len(applicant_rows),'duplicate_rows':applicant_dupes,
                  'malformed_identifier_count':len(applicant_bad_ident),'malformed_identifiers':applicant_bad_ident,
                  'records':applicant_rows,
              },
          }
          print('CAMPOBASSO_AUDIT_JSON_BEGIN')
          print(json.dumps(report, ensure_ascii=False, indent=2, default=str))
          print('CAMPOBASSO_AUDIT_JSON_END')
          PY
