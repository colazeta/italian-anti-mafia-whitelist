name: Crotone anomaly profile 2026-09-11

on:
  push:
    branches: [expansion/crotone-2026-09-11]
    paths: [.github/workflows/crotone-anomaly-profile-2026-09-11.yml]

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/crotone-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pdfplumber
      - name: Profile anomalies without inference
        run: |
          python - <<'PY'
          import hashlib,json,re,time
          from collections import Counter,defaultdict
          from datetime import date
          from pathlib import Path
          from urllib.request import Request,urlopen
          import pdfplumber

          src={
            'listed':('https://prefettura.interno.gov.it/sites/default/files/0/2026-09/ditte-iscritte-white-list-2.pdf','c9a2774c5842b895cd0bb18be3fe30a0c8858b2d67e985a993983e1834f0d511'),
            'applicants':('https://prefettura.interno.gov.it/sites/default/files/0/2026-09/ditte-con-richiesta-iscrizione-white-list-2.pdf','af66ff6bf6a173c4156fef3e7741ca26956769e399285764123ef8405097e6d1')}
          months={'gennaio':1,'febbraio':2,'marzo':3,'aprile':4,'maggio':5,'giugno':6,'luglio':7,'agosto':8,'settembre':9,'ottobre':10,'novembre':11,'dicembre':12}
          ma='|'.join(months)
          date_re=re.compile(rf'^(\d{{1,2}})(?:°|º)?\s+({ma})\s+(\d{{4}})$',re.I)
          prefix_re=re.compile(rf'^(\d{{1,2}})(?:°|º)?\s+({ma})\s+(\d{{4}})(.*)$',re.I)
          section_re=re.compile(r'(?:SEZIONE|SEZ\.?)[\s\n]*(10|[1-9])\b',re.I)
          id_re=re.compile(r'^(?:\d{11}|[A-Za-z0-9]{16})$',re.I)
          def clean(x):return ' '.join(str(x or '').split())
          def get(url):
            last=None
            for i in range(5):
              try:
                with urlopen(Request(url,headers={'User-Agent':'italian-anti-mafia-whitelist/0.1 (+anomaly profile)','Accept':'application/pdf,*/*'}),timeout=90) as r:return r.read()
              except Exception as e:last=e;time.sleep(3*(i+1))
            raise last
          def parse(v):
            m=date_re.fullmatch(clean(v))
            if not m:return ''
            try:return date(int(m[3]),months[m[2].casefold()],int(m[1])).isoformat()
            except ValueError:return ''
          def split(v):
            raw=clean(v);m=prefix_re.fullmatch(raw)
            if not m:return '',raw
            try:iso=date(int(m[3]),months[m[2].casefold()],int(m[1])).isoformat()
            except ValueError:return '',raw
            return iso,clean(m[4])
          def status(expiry_tail,note):
            f=(clean(expiry_tail)+' '+clean(note)).casefold()
            return 'renewal_update_in_progress' if any(x in f for x in ('rinnovo','istruttoria','aggiornamento')) else 'listed'

          out={'profiled_on':'2026-09-11','sources':{}}
          body=get(src['listed'][0]);sha=hashlib.sha256(body).hexdigest();assert sha==src['listed'][1]
          Path('/tmp/l.pdf').write_bytes(body)
          named=[];blank=[];headers=0;allrows=[];current=None;page_texts={}
          with pdfplumber.open('/tmp/l.pdf') as pdf:
            for pno,page in enumerate(pdf.pages,1):
              text=clean(page.extract_text() or ''); hits=[int(x) for x in section_re.findall(text)]
              if hits:
                if len(set(hits))!=1:raise RuntimeError((pno,hits))
                current=hits[0]
              tables=page.extract_tables() or []
              for tno,t in enumerate(tables,1):
                compact=[]
                for rno,row in enumerate(t or [],1):
                  cells=[clean(x) for x in row]
                  if any(cells):compact.append({'row':rno,'cells':cells})
                for i,r in enumerate(compact):
                  c=r['cells'];rec={'page':pno,'table':tno,'row':r['row'],'section':current,'cells':c};allrows.append(rec)
                  if len(c)!=6:raise RuntimeError(f'width {len(c)} at {pno}/{r["row"]}')
                  if c[0].casefold()=='ragione sociale':headers+=1;continue
                  if not c[0]:
                    blank.append({**rec,'previous':compact[i-1]['cells'] if i else None,'next':compact[i+1]['cells'] if i+1<len(compact) else None})
                    page_texts[str(pno)]=text
                    continue
                  expiry_iso,tail=split(c[4]); listing_iso=parse(c[3]) if c[3] else ''
                  named.append({'page':pno,'table':tno,'row':r['row'],'section':current,'name':c[0],'id':c[1],'office':c[2],'listing_raw':c[3],'listing_iso':listing_iso,'expiry_raw':c[4],'expiry_iso':expiry_iso,'expiry_tail':tail,'note':c[5],'status':status(tail,c[5])})
          groups={}
          for r in named:
            key=tuple(clean(r[k]).casefold() if isinstance(r[k],str) else r[k] for k in ('name','id','office','listing_raw','expiry_raw','note','status'))
            g=groups.setdefault(key,{'row':r,'sections':[]})
            g['sections'].append(r['section'])
          same_section=[{'name':g['row']['name'],'sections':g['sections']} for g in groups.values() if len(g['sections'])!=len(set(g['sections']))]
          broad=defaultdict(list)
          for r in named:broad[(r['name'].casefold(),r['id'].casefold())].append(r)
          conflicts=[]
          for ident,rs in broad.items():
            variants={(r['office'].casefold(),r['listing_raw'].casefold(),r['expiry_raw'].casefold(),r['note'].casefold(),r['status']) for r in rs}
            if len(variants)>1:conflicts.append({'identity':list(ident),'variant_count':len(variants),'rows':rs[:30]})
          out['sources']['listed']={'url':src['listed'][0],'sha256':sha,'pages':130,'raw_nonempty_rows':len(allrows),'headers':headers,'named_rows':len(named),'blank_identity_rows':blank,'blank_page_texts':page_texts,'section_counts':dict(Counter(r['section'] for r in named)),'status_counts':dict(Counter(r['status'] for r in named)),'listing_blank_count':sum(not r['listing_raw'] for r in named),'listing_nonblank_unparsed_count':sum(bool(r['listing_raw']) and not r['listing_iso'] for r in named),'expiry_blank_count':sum(not r['expiry_raw'] for r in named),'expiry_nonblank_unparsed_count':sum(bool(r['expiry_raw']) and not r['expiry_iso'] for r in named),'groups':len(groups),'group_status_counts':dict(Counter(g['row']['status'] for g in groups.values())),'group_identifier_coverage':sum(bool(id_re.fullmatch(g['row']['id'])) for g in groups.values()),'group_malformed_ids':[{'name':g['row']['name'],'raw':g['row']['id']} for g in groups.values() if not id_re.fullmatch(g['row']['id'])],'same_section_duplicate_groups':same_section,'identity_variant_conflict_count':len(conflicts),'identity_variant_conflicts':conflicts[:100],'group_section_span_counts':dict(Counter(len(set(g['sections'])) for g in groups.values()))}

          body=get(src['applicants'][0]);sha=hashlib.sha256(body).hexdigest();assert sha==src['applicants'][1]
          Path('/tmp/a.pdf').write_bytes(body)
          rows=[];headers=0;anoms=[];page_counts=[];page_texts={}
          with pdfplumber.open('/tmp/a.pdf') as pdf:
            for pno,page in enumerate(pdf.pages,1):
              text=clean(page.extract_text() or ''); pc=0
              for tno,t in enumerate(page.extract_tables() or [],1):
                compact=[]
                for rno,row in enumerate(t or [],1):
                  c=[clean(x) for x in row]
                  if any(c):compact.append({'row':rno,'cells':c})
                for i,r in enumerate(compact):
                  c=r['cells']
                  if len(c)!=6:raise RuntimeError(f'app width {len(c)} p{pno} r{r["row"]}')
                  if 'codice fiscale' in c[0].casefold() or c[1].casefold()=='ragione sociale':headers+=1;continue
                  app_iso=parse(c[5]) if c[5] else ''
                  rec={'page':pno,'table':tno,'row':r['row'],'id':c[0],'name':c[1],'office':c[2],'secondary':c[3],'activities':c[4],'application_raw':c[5],'application_iso':app_iso}
                  if not c[0] or not c[1] or not app_iso:
                    anoms.append({**rec,'previous':compact[i-1]['cells'] if i else None,'next':compact[i+1]['cells'] if i+1<len(compact) else None});page_texts[str(pno)]=text
                  rows.append(rec);pc+=1
              page_counts.append(pc)
          keys=[(r['id'].casefold(),r['name'].casefold(),r['office'].casefold(),r['secondary'].casefold(),r['activities'].casefold(),r['application_raw'].casefold()) for r in rows]
          out['sources']['applicants']={'url':src['applicants'][0],'sha256':sha,'pages':46,'headers':headers,'records_including_anomalies':len(rows),'page_counts':page_counts,'anomaly_rows':anoms,'anomaly_page_texts':page_texts,'duplicates':len(keys)-len(set(keys)),'identifier_coverage':sum(bool(id_re.fullmatch(r['id'])) for r in rows),'malformed_ids':[{'name':r['name'],'raw':r['id']} for r in rows if not id_re.fullmatch(r['id'])]}
          Path('tmp').mkdir(exist_ok=True)
          Path('tmp/crotone-anomaly-profile.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit anomaly checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/crotone-anomaly-profile.json
          git commit -m 'Checkpoint Crotone anomaly profile'
          git push origin HEAD:expansion/crotone-2026-09-11
