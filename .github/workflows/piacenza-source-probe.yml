name: Piacenza source validation

on:
  push:
    branches:
      - expansion/piacenza-2026-09-21
    paths:
      - .github/workflows/piacenza-source-probe.yml
      - src/white_list_archive/parsers/piacenza_legacy_xls.py
      - tests/test_piacenza_legacy_xls.py
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publication runtime
        run: python -m pip install -e '.[publication,dev]'

      - name: Fetch official Piacenza source bytes twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/piacenza-validation
          listed='https://prefettura.interno.gov.it/sites/default/files/65/2026-09/ditte-white-list-copia_2.zip'
          applicants='https://prefettura.interno.gov.it/sites/default/files/65/2026-02/elenco_imprese_richiedenti_l-iscrizione_nell-elenco_dei_fornitori-prestatori_di_servizi_ed_esecutori_di_lavori_non_soggetti_a_tentativi_di_infiltrazione_mafiosa-i.zip'
          for pass in 1 2; do
            curl -L -f -sS --retry 2 --connect-timeout 20 --max-time 120 \
              -A 'Mozilla/5.0 (compatible; italian-anti-mafia-whitelist-source-validation/1.0)' \
              -H 'Cache-Control: no-cache' -o "tmp/piacenza-validation/listed-${pass}.zip" "$listed"
            curl -L -f -sS --retry 2 --connect-timeout 20 --max-time 120 \
              -A 'Mozilla/5.0 (compatible; italian-anti-mafia-whitelist-source-validation/1.0)' \
              -H 'Cache-Control: no-cache' -o "tmp/piacenza-validation/applicants-${pass}.zip" "$applicants"
          done
          cmp tmp/piacenza-validation/listed-1.zip tmp/piacenza-validation/listed-2.zip
          cmp tmp/piacenza-validation/applicants-1.zip tmp/piacenza-validation/applicants-2.zip
          echo 'e53d2f0a1c044efb2b28adf058893c4d482b2262396f936dc17a93a43f7aaea8  tmp/piacenza-validation/listed-1.zip' | sha256sum -c -
          echo '99e2809359df95497ea921fdc69b2c4e826112ab4cd5d31209b38110a3c4d335  tmp/piacenza-validation/applicants-1.zip' | sha256sum -c -

      - name: Validate parser against byte-pinned official sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from white_list_archive.parsers.piacenza_legacy_xls import parse_piacenza_listed, parse_piacenza_applicants

          common = {
              'authority_key': 'piacenza',
              'authority_name': 'Prefettura di Piacenza',
              'register_key': 'piacenza-ordinary',
              'register_name': 'White List ordinaria',
              'reference_date': '2026-09-21',
              'source_page_url': 'https://prefettura.interno.gov.it/it/prefetture/piacenza/evidenza/white-list',
          }
          listed_cfg = {
              **common,
              'source_key': 'piacenza-listed',
              'population_scope': 'listed',
              'resource_url': 'https://prefettura.interno.gov.it/sites/default/files/65/2026-09/ditte-white-list-copia_2.zip',
              'sha256': 'e53d2f0a1c044efb2b28adf058893c4d482b2262396f936dc17a93a43f7aaea8',
          }
          applicant_cfg = {
              **common,
              'source_key': 'piacenza-applicants',
              'population_scope': 'applicant',
              'resource_url': 'https://prefettura.interno.gov.it/sites/default/files/65/2026-02/elenco_imprese_richiedenti_l-iscrizione_nell-elenco_dei_fornitori-prestatori_di_servizi_ed_esecutori_di_lavori_non_soggetti_a_tentativi_di_infiltrazione_mafiosa-i.zip',
              'sha256': '99e2809359df95497ea921fdc69b2c4e826112ab4cd5d31209b38110a3c4d335',
          }
          listed = parse_piacenza_listed(Path('tmp/piacenza-validation/listed-1.zip'), listed_cfg)
          applicants = parse_piacenza_applicants(Path('tmp/piacenza-validation/applicants-1.zip'), applicant_cfg)
          assert len(listed.records) == 552
          assert len(applicants.records) == 18
          assert listed.diagnostics['status_counts'] == {'listed': 455, 'renewal_update_in_progress': 97}
          assert listed.diagnostics['identifier_coverage'] == 540
          assert listed.diagnostics['raw_identifier_only'] == 12
          assert applicants.diagnostics['status_counts'] == {'pending': 18}
          assert applicants.diagnostics['identifier_coverage'] == 18
          assert len({r['record_locator'] for r in listed.records + applicants.records}) == 570
          result = {'listed': listed.diagnostics, 'applicants': applicants.diagnostics, 'total_records': 570}
          Path('tmp/piacenza-validation/parser-diagnostics.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), 'utf-8')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Run focused tests
        run: pytest -q tests/test_piacenza_legacy_xls.py

      - name: Run full repository suite with diagnostics
        shell: bash
        run: |
          set +e
          pytest -q > tmp/piacenza-validation/full-suite.log 2>&1
          status=$?
          set -e
          cat tmp/piacenza-validation/full-suite.log
          exit "$status"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piacenza-source-validation
          path: tmp/piacenza-validation/
          if-no-files-found: error
          retention-days: 7
