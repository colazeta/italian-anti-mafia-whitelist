name: Milano drift review b929

on:
  push:
    branches:
      - fix/milano-source-drift-2026-09-18-b929
    paths:
      - '.github/workflows/milano-drift-review-b929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Capture and audit current Milano sources
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import sys
          import time
          import urllib.request
          from collections import Counter
          from pathlib import Path

          from white_list_archive.parsers import milano_webapp as m
          from white_list_archive.parsers.multi_prefecture_tables import _clean

          OUT = Path('audit-output')
          OUT.mkdir(exist_ok=True)
          report_path = OUT / 'milano-drift-review.json'

          COMBINED_URL = 'https://whitelist.prefmi.it/elenco/elenco.php'
          REGISTERED_URL = 'https://whitelist.prefmi.it/elenco/elenco_iscritte.php'
          LIVE_REGISTRY_URL = 'https://colazeta.github.io/italian-anti-mafia-whitelist/data/registry.json'
          EXPECTED_COMBINED_SHA = 'b92945af542b89ca99122d60a6f2d1c4c22359bb2c1bbe7c40672c7738bbc58a'

          report = {
              'candidate_combined_sha256': EXPECTED_COMBINED_SHA,
              'captures': {},
              'summaries': {},
              'corroboration': {},
              'live_registry_comparison': {},
              'errors': [],
          }

          def fetch(url: str) -> bytes:
              req = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': 'italian-anti-mafia-whitelist-evidence-review/1.0',
                      'Cache-Control': 'no-cache, no-store, max-age=0',
                      'Pragma': 'no-cache',
                      'Accept': 'text/html,application/json;q=0.9,*/*;q=0.8',
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{url}: HTTP {response.status}')
                  return response.read()

          def capture_pair(label: str, url: str) -> tuple[bytes, bytes]:
              first = fetch(url)
              time.sleep(3)
              second = fetch(url)
              h1 = hashlib.sha256(first).hexdigest()
              h2 = hashlib.sha256(second).hexdigest()
              report['captures'][label] = {
                  'url': url,
                  'capture_1_bytes': len(first),
                  'capture_2_bytes': len(second),
                  'capture_1_sha256': h1,
                  'capture_2_sha256': h2,
                  'byte_identical': first == second,
              }
              return first, second

          def audit_html(raw: bytes) -> tuple[dict, dict[str, dict]]:
              text = raw.decode('cp1252')
              tables = m._parse_tables(text)
              if len(tables) != m._EXPECTED_TABLES:
                  raise RuntimeError(f'table-count drift: {len(tables)} != {m._EXPECTED_TABLES}')

              rows = []
              headings = []
              for section_number, table in enumerate(tables, start=1):
                  if len(table) < 3:
                      raise RuntimeError(f'section {section_number} has fewer than three rows')
                  heading = _clean(table[0][0] if table[0] else '')
                  expected_heading = m._EXPECTED_SECTION_PREFIXES[section_number - 1]
                  if heading != expected_heading:
                      raise RuntimeError(
                          f'section-heading drift {section_number}: {heading!r} != {expected_heading!r}'
                      )
                  header = tuple(_clean(v) for v in table[1])
                  if header != m._HEADER:
                      raise RuntimeError(f'header drift section {section_number}: {header!r}')
                  headings.append(heading)

                  for physical_row, cells in enumerate(table[2:], start=3):
                      if not any(_clean(v) for v in cells):
                          continue
                      if len(cells) != 6:
                          raise RuntimeError(
                              f'width drift section {section_number} row {physical_row}: {len(cells)}'
                          )
                      name, office, identifier_raw, first, second, note = [_clean(v) for v in cells]
                      if not name or not office or not identifier_raw:
                          raise RuntimeError(
                              f'blank identity section {section_number} row {physical_row}: {cells!r}'
                          )
                      if not m._STRICT_IDENTIFIER.fullmatch(identifier_raw):
                          raise RuntimeError(
                              f'malformed identifier section {section_number} row {physical_row}: {identifier_raw!r}'
                          )
                      status, application_date, listing_date, expiry_date = m._status_and_dates(first, second)
                      rows.append({
                          'section': section_number,
                          'physical_row': physical_row,
                          'heading': heading,
                          'name': name,
                          'office': office,
                          'identifier': identifier_raw.upper(),
                          'first_raw': first,
                          'second_raw': second,
                          'note': note,
                          'status': status,
                          'application_date': application_date,
                          'listing_date': listing_date,
                          'expiry_date': expiry_date,
                      })

              grouped = {}
              for row in rows:
                  key = (
                      m._normalise_text(row['name']),
                      row['identifier'],
                      m._normalise_address(row['office']),
                      row['status'],
                      row['application_date'],
                      row['listing_date'],
                      row['expiry_date'],
                      m._normalise_text(row['note']),
                  )
                  group = grouped.setdefault(key, {'row': row, 'sections': []})
                  if row['section'] in group['sections']:
                      raise RuntimeError(
                          f"duplicate same-section observation: {row['identifier']} section {row['section']}"
                      )
                  group['sections'].append(row['section'])

              by_id = {}
              for group in grouped.values():
                  row = group['row']
                  identifier = row['identifier']
                  if identifier in by_id:
                      raise RuntimeError(f'identifier maps to multiple logical observations: {identifier}')
                  sections = sorted(group['sections'])
                  by_id[identifier] = {
                      'identifier': identifier,
                      'name': row['name'],
                      'office': row['office'],
                      'status': row['status'],
                      'application_date': row['application_date'],
                      'listing_date': row['listing_date'],
                      'expiry_date': row['expiry_date'],
                      'note': row['note'],
                      'sections': sections,
                      'activities': [m._activity(headings[n - 1], n) for n in sections],
                  }

              statuses = Counter(v['status'] for v in by_id.values())
              summary = {
                  'source_tables': len(tables),
                  'sector_rows': len(rows),
                  'logical_records': len(by_id),
                  'status_counts': dict(sorted(statuses.items())),
                  'distinct_identifiers': len(by_id),
                  'nonblank_notes': sum(bool(v['note']) for v in by_id.values()),
                  'application_date_count': sum(bool(v['application_date']) for v in by_id.values()),
                  'listing_date_count': sum(bool(v['listing_date']) for v in by_id.values()),
                  'expiry_date_count': sum(bool(v['expiry_date']) for v in by_id.values()),
                  'max_application_date': max((v['application_date'] for v in by_id.values() if v['application_date']), default=None),
                  'max_listing_date': max((v['listing_date'] for v in by_id.values() if v['listing_date']), default=None),
                  'max_expiry_date': max((v['expiry_date'] for v in by_id.values() if v['expiry_date']), default=None),
              }
              return summary, by_id

          def slim(record: dict) -> dict:
              return {
                  'identifier': record.get('identifier'),
                  'name': record.get('name'),
                  'status': record.get('status'),
                  'application_date': record.get('application_date'),
                  'listing_date': record.get('listing_date'),
                  'expiry_date': record.get('expiry_date'),
                  'sections': record.get('sections'),
              }

          try:
              combined_1, combined_2 = capture_pair('combined', COMBINED_URL)
              registered_1, registered_2 = capture_pair('registered_only', REGISTERED_URL)

              combined_sha = report['captures']['combined']['capture_1_sha256']
              if combined_1 != combined_2:
                  report['errors'].append('combined captures are not byte-identical')
              if combined_sha != EXPECTED_COMBINED_SHA:
                  report['errors'].append(
                      f'combined candidate changed again: {combined_sha} != {EXPECTED_COMBINED_SHA}'
                  )
              if registered_1 != registered_2:
                  report['errors'].append('registered-only captures are not byte-identical')

              combined_summary, combined = audit_html(combined_1)
              registered_summary, registered = audit_html(registered_1)
              report['summaries']['combined'] = combined_summary
              report['summaries']['registered_only'] = registered_summary

              combined_nonpending = {k for k, v in combined.items() if v['status'] != 'pending'}
              registered_ids = set(registered)
              report['corroboration'] = {
                  'combined_nonpending_identifiers': len(combined_nonpending),
                  'registered_identifiers': len(registered_ids),
                  'sets_equal': combined_nonpending == registered_ids,
                  'missing_from_registered': sorted(combined_nonpending - registered_ids),
                  'extra_in_registered': sorted(registered_ids - combined_nonpending),
              }
              if combined_nonpending != registered_ids:
                  report['errors'].append('registered-only identity set does not equal combined non-pending identity set')

              try:
                  live_raw = fetch(LIVE_REGISTRY_URL)
                  live_doc = json.loads(live_raw.decode('utf-8'))
                  live_rows = [r for r in live_doc.get('records', []) if r.get('authority_key') == 'milano']
                  live = {}
                  for row in live_rows:
                      identifier = str(row.get('identifier_field_raw') or '').upper()
                      if not identifier:
                          continue
                      if identifier in live:
                          raise RuntimeError(f'duplicate Milano identifier in live registry: {identifier}')
                      live[identifier] = row

                  added = sorted(set(combined) - set(live))
                  removed = sorted(set(live) - set(combined))
                  changed = []
                  for identifier in sorted(set(combined) & set(live)):
                      current = combined[identifier]
                      old = live[identifier]
                      old_sections = []
                      source_fields = old.get('source_fields') or {}
                      for label in source_fields.get('sections') or []:
                          try:
                              old_sections.append(int(str(label).split()[-1]))
                          except Exception:
                              pass
                      old_view = {
                          'status': old.get('source_status') or '',
                          'application_date': old.get('application_date') or '',
                          'listing_date': old.get('observed_listing_date') or '',
                          'expiry_date': old.get('observed_expiry_date') or '',
                          'sections': sorted(old_sections),
                      }
                      new_view = {
                          'status': current['status'],
                          'application_date': current['application_date'],
                          'listing_date': current['listing_date'],
                          'expiry_date': current['expiry_date'],
                          'sections': current['sections'],
                      }
                      if old_view != new_view:
                          changed.append({
                              'identifier': identifier,
                              'name': current['name'],
                              'old': old_view,
                              'new': new_view,
                          })

                  report['live_registry_comparison'] = {
                      'live_url': LIVE_REGISTRY_URL,
                      'live_total_records': len(live_doc.get('records', [])),
                      'live_milano_records': len(live),
                      'current_milano_records': len(combined),
                      'added_count': len(added),
                      'removed_count': len(removed),
                      'changed_count': len(changed),
                      'added': [slim(combined[i]) for i in added],
                      'removed': [
                          {
                              'identifier': i,
                              'name': live[i].get('name'),
                              'status': live[i].get('source_status'),
                              'application_date': live[i].get('application_date'),
                              'listing_date': live[i].get('observed_listing_date'),
                              'expiry_date': live[i].get('observed_expiry_date'),
                          }
                          for i in removed
                      ],
                      'changed': changed,
                  }
              except Exception as exc:
                  report['live_registry_comparison'] = {'error': repr(exc)}

          except Exception as exc:
              report['errors'].append(repr(exc))

          report_path.write_text(json.dumps(report, indent=2, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2, ensure_ascii=False, sort_keys=True))
          if report['errors']:
              raise SystemExit(1)
          PY

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milano-drift-review-b929
          path: audit-output/milano-drift-review.json
          retention-days: 14
          if-no-files-found: warn
