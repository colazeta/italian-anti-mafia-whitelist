name: Run Biella integration

on:
  push:
    branches:
      - expansion/biella-2026-09-10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: expansion/biella-2026-09-10
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply integration
        run: python scripts/integrate_biella_one_shot.py
      - name: Test focused contracts
        run: |
          python -m pip install -e '.[dev,publication]'
          pytest -q tests/test_biella_parser_semantics.py tests/test_source_registry.py tests/test_source_population_coverage.py tests/test_parser_registry.py
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git status --short
          git add data src tests docs .github/workflows/public-pages.yml
          git diff --cached --check
          git commit -m '[biella integrated] Publish current Biella source observations'
          git push origin HEAD:expansion/biella-2026-09-10
