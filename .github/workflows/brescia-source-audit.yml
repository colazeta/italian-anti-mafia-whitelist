name: Brescia source audit

on:
  push:
    branches:
      - expansion/brescia-2026-09-12
    paths:
      - .github/workflows/brescia-source-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/brescia-2026-09-12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check 'openpyxl>=3.1,<4' requests
      - name: Fetch and audit current official Brescia sources
        env:
          LANDING_URL: https://prefettura.interno.gov.it/it/prefetture/brescia/evidenza/white-list
          LISTED_URL: https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco-ditte-iscritte-10-settembre-2026.xlsx
          APPLICANT_URL: https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco-ditte-richiedenti-l-iscrizione-10-settembre-2026.xlsx
        run: |
          mkdir -p tmp
          python - <<'PY'
          import hashlib, io, json, os, re
          from collections import Counter
          from datetime import date, datetime
          from pathlib import Path

          import openpyxl
          import requests

          headers = {
              'User-Agent': 'italian-anti-mafia-whitelist/official-source-audit (+https://github.com/colazeta/italian-anti-mafia-whitelist)'
          }

          def get(url):
              r = requests.get(url, headers=headers, timeout=60)
              r.raise_for_status()
              return r

          def clean(v):
              if v is None:
                  return ''
              if isinstance(v, datetime):
                  return v.isoformat()
              if isinstance(v, date):
                  return v.isoformat()
              return re.sub(r'\s+', ' ', str(v)).strip()

          report = {
              'verified_on': '2026-09-12',
              'current_reference_date': '2026-09-10',
              'landing': {'url': os.environ['LANDING_URL']},
              'attachments': {},
          }

          # The Ministry landing endpoint intermittently rejects generic runner GETs.
          # Record that state, but do not turn a failed second channel into negative evidence.
          try:
              landing = get(os.environ['LANDING_URL'])
              report['landing'].update({
                  'status_code': landing.status_code,
                  'sha256': hashlib.sha256(landing.content).hexdigest(),
                  'contains_current_date': '10 settembre 2026' in landing.text.casefold(),
                  'contains_listed_label': 'elenco ditte iscritte in white list aggiornato al 10 settembre 2026' in landing.text.casefold(),
                  'contains_applicant_label': 'elenco ditte richiedenti iscrizione in white list aggiornato al 10 settembre 2026' in landing.text.casefold(),
              })
          except Exception as exc:
              report['landing'].update({'fetch_error': f'{type(exc).__name__}: {exc}'})

          def audit_xlsx(data, kind):
              wb = openpyxl.load_workbook(io.BytesIO(data), data_only=True, read_only=True)
              result = {'format': 'xlsx', 'sheet_count': len(wb.sheetnames), 'sheets': []}
              total_nonempty = 0
              all_rows = []
              for ws in wb.worksheets:
                  rows = list(ws.iter_rows(values_only=True))
                  nonempty = []
                  for rowno, row in enumerate(rows, start=1):
                      vals = [clean(v) for v in row]
                      if not any(vals):
                          continue
                      total_nonempty += 1
                      nonempty.append((rowno, vals))
                      all_rows.append((ws.title, rowno, vals))
                  result['sheets'].append({
                      'title': ws.title,
                      'max_row': ws.max_row,
                      'max_column': ws.max_column,
                      'nonempty_rows': len(nonempty),
                      'first_nonempty_rows': [
                          {'row': rowno, 'values': vals[:16]} for rowno, vals in nonempty[:20]
                      ],
                      'last_nonempty_rows': [
                          {'row': rowno, 'values': vals[:16]} for rowno, vals in nonempty[-10:]
                      ],
                  })
              result['total_nonempty_rows'] = total_nonempty

              # Generic structure/profile evidence only; parser semantics are bound later.
              joined_rows = [' | '.join(vals) for _, _, vals in all_rows]
              result['header_like_rows'] = [
                  {'sheet': sh, 'row': rowno, 'values': vals[:16]}
                  for sh, rowno, vals in all_rows
                  if any(x in ' '.join(vals).casefold() for x in ('ragione sociale','codice fiscale','partita iva','data iscrizione','data di iscrizione','data presentazione','aggiornamento'))
              ][:60]
              lengths = Counter()
              numeric_tokens = Counter()
              date_tokens = Counter()
              status_tokens = Counter()
              for text in joined_rows:
                  for token in re.findall(r'(?<!\d)\d{8,16}(?!\d)', text):
                      lengths[len(token)] += 1
                      if len(token) in (10, 11, 12):
                          numeric_tokens[token] += 1
                  for token in re.findall(r'(?<!\d)\d{1,2}[./-]\d{1,2}[./-]\d{2,4}(?!\d)', text):
                      date_tokens[token] += 1
                  low = text.casefold()
                  for term in ('iscritt', 'aggiornamento', 'rinnovo', 'istruttoria', 'richiedent', 'sospes', 'cancell'):
                      if term in low:
                          status_tokens[term] += 1
              result['digit_token_lengths'] = dict(lengths)
              result['distinct_10_12_digit_tokens'] = len(numeric_tokens)
              result['sample_10_12_digit_tokens'] = list(numeric_tokens)[:80]
              result['distinct_date_tokens'] = len(date_tokens)
              result['sample_date_tokens'] = list(date_tokens)[:80]
              result['row_term_hits'] = dict(status_tokens)
              return result

          for kind, env_name in [('listed', 'LISTED_URL'), ('applicant', 'APPLICANT_URL')]:
              url = os.environ[env_name]
              first = get(url)
              second = get(url)
              sha1 = hashlib.sha256(first.content).hexdigest()
              sha2 = hashlib.sha256(second.content).hexdigest()
              if sha1 != sha2:
                  raise SystemExit(f'{kind} source changed across independent GETs: {sha1} != {sha2}')
              if first.content[:4] != b'PK\x03\x04':
                  raise SystemExit(f'{kind} source is not an OpenXML package')
              inspection = audit_xlsx(first.content, kind)
              report['attachments'][kind] = {
                  'url': url,
                  'final_url': first.url,
                  'status_code': first.status_code,
                  'bytes': len(first.content),
                  'sha256': sha1,
                  'second_get_sha256': sha2,
                  'content_type': first.headers.get('content-type', ''),
                  'content_disposition': first.headers.get('content-disposition', ''),
                  'last_modified': first.headers.get('last-modified'),
                  'inspection': inspection,
              }

          Path('tmp/brescia-source-audit.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Persist audit checkpoint on expansion branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/brescia-source-audit.json
          if git diff --cached --quiet; then
            echo 'Audit checkpoint unchanged.'
          else
            git commit -m 'Checkpoint Brescia source audit'
            git push origin HEAD:expansion/brescia-2026-09-12
          fi
