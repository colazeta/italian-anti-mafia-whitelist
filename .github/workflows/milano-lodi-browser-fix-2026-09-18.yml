name: Milano Lodi browser assertion repair 2026-09-18

on:
  push:
    branches:
      - fix/milano-source-drift-2026-09-18

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/milano-source-drift-2026-09-18
          fetch-depth: 0
      - name: Apply exact reviewed Lodi browser assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/public_portal_browser.cjs')
          text = p.read_text(encoding='utf-8')
          old = "assert.deepEqual(statusCounts(lodi),{listed:146,pending:2,rejected_or_denied:2,renewal_update_in_progress:23});"
          new = "assert.deepEqual(statusCounts(lodi),{listed:144,pending:2,rejected_or_denied:2,renewal_update_in_progress:25});"
          if text.count(old) == 1 and text.count(new) == 0:
              p.write_text(text.replace(old, new), encoding='utf-8')
          elif text.count(old) == 0 and text.count(new) == 1:
              print('Reviewed Lodi browser assertion already applied; no-op.')
          else:
              raise SystemExit(f'Unexpected assertion state: old={text.count(old)} new={text.count(new)}')
          PY
          node --check tests/public_portal_browser.cjs
          git diff --check
          changed="$(git diff --name-only)"
          if [ -n "$changed" ] && [ "$changed" != "tests/public_portal_browser.cjs" ]; then
            echo "Unexpected changed files: $changed" >&2
            exit 1
          fi
      - name: Commit exact repair when needed
        shell: bash
        run: |
          if git diff --quiet -- tests/public_portal_browser.cjs; then
            echo "No repair commit needed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/public_portal_browser.cjs
          git commit -m 'Align browser Lodi assertions with reviewed boundary'
          git push origin HEAD:fix/milano-source-drift-2026-09-18
