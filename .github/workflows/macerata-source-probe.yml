name: Macerata source probe

on:
  push:
    branches:
      - expansion/macerata-2026-09-19
    paths:
      - .github/workflows/macerata-source-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install probe runtime
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf openpyxl python-docx xlrd

      - name: Probe official Macerata publication surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/macerata-probe
          python - <<'PY'
          import hashlib, json, re, time, uuid
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit, urlunsplit, parse_qsl, urlencode

          import requests
          from bs4 import BeautifulSoup

          LANDING = 'https://prefettura.interno.gov.it/it/prefetture/macerata/white-list-elenco-imprese-iscritte'
          OUT = Path('tmp/macerata-probe')
          EXPECTED = {
              'listed': re.compile(r'^iscrizioni\s+al\s+21\s+agosto\s+2026$', re.I),
              'applicants': re.compile(r'^presentazioni\s+al\s+21\s+agosto\s+2026$', re.I),
          }
          headers = {
              'User-Agent': 'Mozilla/5.0 (compatible; italian-anti-mafia-whitelist source verification; +https://github.com/colazeta/italian-anti-mafia-whitelist)',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Cache-Control': 'no-cache',
              'Pragma': 'no-cache',
          }

          def cache_bust(url, token):
              parts = urlsplit(url)
              q = parse_qsl(parts.query, keep_blank_values=True)
              q.append(('_wl_probe', token))
              return urlunsplit((parts.scheme, parts.netloc, parts.path, urlencode(q), parts.fragment))

          def fetch_bytes(url, token):
              rr = requests.get(cache_bust(url, token), headers=headers, timeout=75, allow_redirects=True)
              rr.raise_for_status()
              return rr, rr.content

          report = {'landing_url': LANDING, 'landing_ok': False, 'expected_labels': list(EXPECTED), 'series': {}, 'errors': []}
          try:
              r = requests.get(cache_bust(LANDING, uuid.uuid4().hex), headers=headers, timeout=45, allow_redirects=True)
              report.update({
                  'landing_status': r.status_code,
                  'landing_final_url': r.url,
                  'landing_content_type': r.headers.get('content-type'),
                  'landing_last_modified': r.headers.get('last-modified'),
                  'landing_bytes': len(r.content),
                  'landing_sha256': hashlib.sha256(r.content).hexdigest(),
              })
              r.raise_for_status()
              report['landing_ok'] = True
              html = r.text
              (OUT / 'landing.html').write_text(html, encoding='utf-8')
              soup = BeautifulSoup(html, 'html.parser')
              text = ' '.join(soup.stripped_strings)
              report['title'] = soup.title.get_text(' ', strip=True) if soup.title else None
              m = re.search(r'Ultimo aggiornamento\s+([^|]{0,160})', text, re.I)
              report['last_update_text'] = m.group(1).strip() if m else None

              links = []
              for a in soup.find_all('a', href=True):
                  label = re.sub(r'\s+', ' ', ' '.join(a.stripped_strings)).strip()
                  links.append((label, urljoin(r.url, a['href'])))

              for key, rx in EXPECTED.items():
                  matches = [(label, url) for label, url in links if rx.fullmatch(label)]
                  if len(matches) != 1:
                      raise RuntimeError(f'{key}: expected exactly one exact-labelled attachment, got {len(matches)}: {matches}')
                  label, url = matches[0]
                  item = {'label': label, 'url': url, 'fetches': []}
                  bodies = []
                  for attempt in range(2):
                      token = f'{int(time.time())}-{attempt}-{uuid.uuid4().hex}'
                      rr, body = fetch_bytes(url, token)
                      meta = {
                          'attempt': attempt + 1,
                          'status': rr.status_code,
                          'final_url': rr.url,
                          'content_type': rr.headers.get('content-type'),
                          'content_length_header': rr.headers.get('content-length'),
                          'last_modified': rr.headers.get('last-modified'),
                          'etag': rr.headers.get('etag'),
                          'bytes': len(body),
                          'sha256': hashlib.sha256(body).hexdigest(),
                          'magic_hex': body[:16].hex(),
                      }
                      item['fetches'].append(meta)
                      bodies.append(body)
                      time.sleep(1.2)
                  if bodies[0] != bodies[1]:
                      raise RuntimeError(f'{key}: independent cache-bypassed fetches are not byte-identical')
                  item['bytes'] = len(bodies[0])
                  item['sha256'] = hashlib.sha256(bodies[0]).hexdigest()
                  magic = bodies[0][:8]
                  if bodies[0][:4] == b'%PDF':
                      suffix = '.pdf'
                      item['format'] = 'pdf'
                  elif magic.startswith(b'PK'):
                      suffix = '.xlsx'
                      item['format'] = 'openxml_or_zip'
                  elif magic.startswith(bytes.fromhex('d0cf11e0a1b11ae1')):
                      suffix = '.xls'
                      item['format'] = 'ole_compound'
                  else:
                      suffix = '.bin'
                      item['format'] = 'unknown'
                  path = OUT / f'{key}{suffix}'
                  path.write_bytes(bodies[0])
                  item['saved_as'] = str(path)
                  report['series'][key] = item
          except Exception as exc:
              report['errors'].append(f'{type(exc).__name__}: {exc}')

          (OUT / 'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if report['errors']:
              raise SystemExit(1)
          PY

      - name: Inspect downloaded source structure conservatively
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          from pypdf import PdfReader
          from docx import Document
          import openpyxl

          root = Path('tmp/macerata-probe')
          report = json.loads((root / 'report.json').read_text(encoding='utf-8'))
          diagnostics = {}
          for key, item in report.get('series', {}).items():
              p = Path(item['saved_as'])
              d = {'file': p.name, 'bytes': p.stat().st_size, 'sha256': item['sha256'], 'format': item.get('format')}
              text = ''
              if p.read_bytes()[:4] == b'%PDF':
                  reader = PdfReader(str(p))
                  d['pages'] = len(reader.pages)
                  page_texts = [(page.extract_text() or '') for page in reader.pages]
                  text = '\n\n--- PAGE ---\n\n'.join(page_texts)
                  d['chars_extracted'] = len(text)
              elif p.read_bytes()[:2] == b'PK':
                  try:
                      wb = openpyxl.load_workbook(p, read_only=True, data_only=True)
                      d['sheets'] = []
                      parts = []
                      for ws in wb.worksheets:
                          s = {'title': ws.title, 'max_row': ws.max_row, 'max_column': ws.max_column}
                          d['sheets'].append(s)
                          for row in ws.iter_rows(min_row=1, max_row=min(ws.max_row, 120), values_only=True):
                              parts.append(' | '.join('' if v is None else str(v) for v in row))
                      text = '\n'.join(parts)
                  except Exception as exc:
                      d['openxml_error'] = f'{type(exc).__name__}: {exc}'
              elif p.suffix.lower() == '.docx':
                  doc = Document(str(p))
                  d['paragraphs'] = len(doc.paragraphs)
                  d['tables'] = len(doc.tables)
                  text = '\n'.join(x.text for x in doc.paragraphs)
              text = re.sub(r'\x00', '', text)
              preview_path = root / f'{key}.txt'
              preview_path.write_text(text[:200000], encoding='utf-8')
              d['preview'] = text[:20000]
              diagnostics[key] = d
          (root / 'diagnostics.json').write_text(json.dumps(diagnostics, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(diagnostics, ensure_ascii=False, indent=2))
          PY

      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: macerata-source-probe
          path: tmp/macerata-probe/
          if-no-files-found: error
          retention-days: 7
