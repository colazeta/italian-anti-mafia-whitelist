name: Crotone grouping audit 2026-09-11

on:
  push:
    branches: [expansion/crotone-2026-09-11]
    paths: [.github/workflows/crotone-grouping-audit-2026-09-11.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/crotone-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pdfplumber
      - name: Compare conservative grouping keys
        run: |
          python - <<'PY'
          import hashlib,json,re,time,unicodedata
          from collections import Counter,defaultdict
          from datetime import date
          from pathlib import Path
          from urllib.request import Request,urlopen
          import pdfplumber

          URL='https://prefettura.interno.gov.it/sites/default/files/0/2026-09/ditte-iscritte-white-list-2.pdf'
          SHA='c9a2774c5842b895cd0bb18be3fe30a0c8858b2d67e985a993983e1834f0d511'
          months={'gennaio':1,'febbraio':2,'marzo':3,'aprile':4,'maggio':5,'giugno':6,'luglio':7,'agosto':8,'settembre':9,'ottobre':10,'novembre':11,'dicembre':12}; ma='|'.join(months)
          full=re.compile(rf'^(\d{{1,2}})(?:°|º)?\s+({ma})\s+(\d{{4}})$',re.I); pref=re.compile(rf'^(\d{{1,2}})(?:°|º)?\s+({ma})\s+(\d{{4}})(.*)$',re.I)
          section_re=re.compile(r'(?:SEZIONE|SEZ\.?)[\s\n]*(10|[1-9])\b',re.I)
          def clean(x):return ' '.join(str(x or '').split())
          def norm_text(x):return clean(unicodedata.normalize('NFKC',str(x or ''))).casefold()
          def addr(x):
            s=norm_text(x).replace('–','-').replace('—','-').replace('−','-')
            s=re.sub(r'\s*([,;:/.-])\s*',r'\1',s)
            return re.sub(r'\s+',' ',s).strip()
          def d(v,prefix=False):
            raw=clean(v); m=(pref if prefix else full).fullmatch(raw)
            if not m:return ('', raw, '') if prefix else ('',raw)
            try:iso=date(int(m[3]),months[m[2].casefold()],int(m[1])).isoformat()
            except ValueError:return ('',raw,'') if prefix else ('',raw)
            return (iso,raw[:m.end(3)],clean(m[4])) if prefix else (iso,raw)
          def keydate(raw,iso):return iso if iso else 'RAW:'+norm_text(raw)
          def st(tail,note):return 'renewal_update_in_progress' if any(k in (tail+' '+note).casefold() for k in ('rinnovo','istruttoria','aggiornamento')) else 'listed'
          last=None
          for i in range(5):
            try:
              with urlopen(Request(URL,headers={'User-Agent':'italian-anti-mafia-whitelist/0.1 (+grouping audit)','Accept':'application/pdf,*/*'}),timeout=90) as r:b=r.read();break
            except Exception as e:last=e;time.sleep(3*(i+1))
          else:raise last
          assert hashlib.sha256(b).hexdigest()==SHA;Path('/tmp/l.pdf').write_bytes(b)
          rows=[]; current=None; carried=[]; headers=0
          with pdfplumber.open('/tmp/l.pdf') as pdf:
            for pno,page in enumerate(pdf.pages,1):
              hits=[int(x) for x in section_re.findall(page.extract_text() or '')]
              if hits: current=hits[0]
              for tno,t in enumerate(page.extract_tables() or [],1):
                previous_data=None
                for rno,row in enumerate(t or [],1):
                  c=[clean(x) for x in row]
                  if not any(c):continue
                  if len(c)!=6:raise RuntimeError((pno,rno,c))
                  if c[0].casefold()=='ragione sociale' or (not c[0] and c[1].casefold()=='partita iva'):
                    headers+=1;continue
                  if not c[0]:
                    if previous_data and not any(c[:3]) and (c[3] or c[4]):
                      c=previous_data[:3]+c[3:];carried.append({'page':pno,'table':tno,'row':rno,'from_previous_identity':previous_data[:3],'cells':c})
                    else:raise RuntimeError(f'unresolved blank row p{pno} r{rno}: {c!r}')
                  li,lraw=d(c[3]); ei,eraw,tail=d(c[4],True); status=st(tail,c[5])
                  rec={'page':pno,'table':tno,'row':rno,'section':current,'name':c[0],'id':c[1],'office':c[2],'listing_raw':c[3],'listing_iso':li,'expiry_raw':c[4],'expiry_iso':ei,'tail':tail,'note':c[5],'status':status};rows.append(rec);previous_data=c
          g_exact=defaultdict(list);g_norm=defaultdict(list);g_broad=defaultdict(list)
          for r in rows:
            dates=(keydate(r['listing_raw'],r['listing_iso']),keydate(r['expiry_raw'],r['expiry_iso']),r['status'])
            base=(norm_text(r['name']),norm_text(r['id']))
            g_exact[base+(norm_text(r['office']),)+dates+(norm_text(r['note']),)].append(r)
            g_norm[base+(addr(r['office']),)+dates].append(r)
            g_broad[base+dates].append(r)
          norm_same_section=[];norm_multi_address=[];norm_note_variants=[]
          for k,rs in g_norm.items():
            secs=[r['section'] for r in rs]
            if len(secs)!=len(set(secs)):norm_same_section.append({'key':k,'rows':rs})
            raw_addr=sorted({r['office'] for r in rs}); notes=sorted({r['note'] for r in rs})
            if len(raw_addr)>1:norm_multi_address.append({'key':k,'address_variants':raw_addr,'rows':rs})
            if len(notes)>1:norm_note_variants.append({'key':k,'note_variants':notes,'rows':rs})
          broad_addr_conf=[]
          for k,rs in g_broad.items():
            aks={addr(r['office']) for r in rs}
            if len(aks)>1:broad_addr_conf.append({'key':k,'normalised_addresses':sorted(aks),'rows':rs})
          out={'audited_on':'2026-09-11','sha256':SHA,'sector_rows_after_structural_carry':len(rows),'headers':headers,'carried_identity_rows':carried,'source_status_counts':dict(Counter(r['status'] for r in rows)),'exact_raw_group_count':len(g_exact),'normalised_address_date_status_group_count':len(g_norm),'broad_identity_date_status_group_count':len(g_broad),'normalised_same_section_duplicate_count':len(norm_same_section),'normalised_same_section_duplicates':norm_same_section[:50],'normalised_multi_raw_address_count':len(norm_multi_address),'normalised_multi_raw_addresses':norm_multi_address[:100],'normalised_note_variant_count':len(norm_note_variants),'normalised_note_variants':norm_note_variants[:100],'broad_substantive_address_conflict_count':len(broad_addr_conf),'broad_substantive_address_conflicts':broad_addr_conf[:100],'group_status_counts':dict(Counter(rs[0]['status'] for rs in g_norm.values())),'listing_blank_count':sum(not r['listing_raw'] for r in rows),'listing_nonblank_unparsed_count':sum(bool(r['listing_raw']) and not r['listing_iso'] for r in rows),'expiry_blank_count':sum(not r['expiry_raw'] for r in rows),'expiry_nonblank_unparsed_count':sum(bool(r['expiry_raw']) and not r['expiry_iso'] for r in rows),'date_anomaly_rows':[r for r in rows if (r['listing_raw'] and not r['listing_iso']) or (r['expiry_raw'] and not r['expiry_iso']) or not r['listing_raw'] or not r['expiry_raw']]}
          Path('tmp').mkdir(exist_ok=True);Path('tmp/crotone-grouping-audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n');print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit grouping checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/crotone-grouping-audit.json
          git commit -m 'Checkpoint Crotone grouping audit'
          git push origin HEAD:expansion/crotone-2026-09-11
