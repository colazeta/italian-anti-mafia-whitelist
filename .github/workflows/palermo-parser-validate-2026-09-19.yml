name: Palermo parser validation 2026-09-19

on:
  push:
    branches:
      - expansion/palermo-2026-09-19
    paths:
      - .github/workflows/palermo-parser-validate-2026-09-19.yml
      - src/white_list_archive/parsers/palermo_positioned.py
      - tests/test_palermo_parser_semantics.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install publication runtime
        run: python -m pip install -e '.[dev,publication]'
      - name: Revalidate official bytes and parser boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, pathlib, time
          from collections import Counter
          from urllib.parse import parse_qsl, urlencode, urlparse, urlunparse
          from urllib.request import Request, urlopen

          from white_list_archive.parsers.palermo_positioned import PARSERS
          from white_list_archive.publishing.public_contract import public_record

          landing = 'https://prefettura.interno.gov.it/it/prefetture/palermo/evidenza/white-list'
          sources = {
              'listed': {
                  'source_key': 'palermo-listed',
                  'reference_date': '2026-09-18',
                  'resource_url': 'https://prefettura.interno.gov.it/sites/default/files/61/2026-09/whitelistelencounicoimpreseiscritte_10.pdf',
                  'sha256': '2349d3ae3dcd37e5da7fc5fdec1326a9408e00fcc0b3b78b0a0809ad75c0837f',
                  'parser': 'palermo_listed',
                  'population_scope': 'listed',
                  'records': 929,
                  'statuses': {'listed': 486, 'renewal_update_in_progress': 443},
                  'identifier_coverage': 924,
              },
              'applicants': {
                  'source_key': 'palermo-applicants',
                  'reference_date': '2026-09-17',
                  'resource_url': 'https://prefettura.interno.gov.it/sites/default/files/61/2026-09/elencoimpreserichiedentiliscrizione-1_0.pdf',
                  'sha256': '82dd288c21c85ea563c75cbfc8346c528b603e54c3a78283a0ae67983e97f2f5',
                  'parser': 'palermo_applicants',
                  'population_scope': 'applicants',
                  'records': 609,
                  'statuses': {'pending': 609},
                  'identifier_coverage': 606,
              },
          }

          pathlib.Path('/tmp/palermo-validation').mkdir(parents=True, exist_ok=True)
          headers = {
              'User-Agent': 'italian-anti-mafia-whitelist/0.1 (+Palermo exact-source validation)',
              'Cache-Control': 'no-cache',
              'Pragma': 'no-cache',
              'Referer': landing,
          }
          all_records = []
          for population, source in sources.items():
              captures = []
              for attempt in (1, 2):
                  parsed = urlparse(source['resource_url'])
                  query = list(parse_qsl(parsed.query, keep_blank_values=True))
                  query.append(('_wl_validate', f'palermo-{population}-{attempt}-{time.time_ns()}'))
                  url = urlunparse(parsed._replace(query=urlencode(query)))
                  request = Request(url, headers=headers)
                  with urlopen(request, timeout=90) as response:
                      if response.status != 200:
                          raise RuntimeError(f'{population}: HTTP {response.status}')
                      captures.append(response.read())
              if captures[0] != captures[1]:
                  raise RuntimeError(f'{population}: independent captures differ')
              digest = hashlib.sha256(captures[0]).hexdigest()
              if digest != source['sha256']:
                  raise RuntimeError(f'{population}: SHA drift: {digest}')
              path = pathlib.Path('/tmp/palermo-validation') / f'{population}.pdf'
              path.write_bytes(captures[0])
              cfg = {
                  'source_key': source['source_key'],
                  'authority_key': 'palermo',
                  'authority_name': 'Prefettura di Palermo',
                  'register_key': 'palermo-ordinary',
                  'register_name': 'White List ordinaria',
                  'population_scope': source['population_scope'],
                  'reference_date': source['reference_date'],
                  'source_page_url': landing,
                  'resource_url': source['resource_url'],
                  'sha256': source['sha256'],
              }
              batch = PARSERS[source['parser']](path, cfg)
              if len(batch.records) != source['records']:
                  raise RuntimeError(f'{population}: record denominator drift')
              statuses = dict(Counter(record['source_status'] for record in batch.records))
              if statuses != source['statuses']:
                  raise RuntimeError(f'{population}: status drift: {statuses}')
              identifier_coverage = sum(bool(record['identifiers']) for record in batch.records)
              if identifier_coverage != source['identifier_coverage']:
                  raise RuntimeError(f'{population}: identifier coverage drift: {identifier_coverage}')
              if len({record['record_locator'] for record in batch.records}) != len(batch.records):
                  raise RuntimeError(f'{population}: duplicate record locator')
              for record in batch.records:
                  public_record(record)
              all_records.extend(batch.records)
              print(json.dumps({
                  'population': population,
                  'sha256': digest,
                  'records': len(batch.records),
                  'statuses': statuses,
                  'identifier_coverage': identifier_coverage,
                  'diagnostics': batch.diagnostics,
              }, sort_keys=True))

          assert len(all_records) == 1538
          assert dict(Counter(r['source_status'] for r in all_records)) == {
              'renewal_update_in_progress': 443,
              'listed': 486,
              'pending': 609,
          }
          assert sum(bool(r['identifiers']) for r in all_records) == 1530
          assert len({r['record_locator'] for r in all_records}) == 1538
          print('PALERMO_BOUNDARY_OK records=1538 listed=486 renewal=443 pending=609 identifiers=1530')
          PY
      - name: Run Palermo semantic tests
        run: pytest -q tests/test_palermo_parser_semantics.py
