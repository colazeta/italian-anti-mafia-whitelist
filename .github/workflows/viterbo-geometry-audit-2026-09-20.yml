name: Viterbo geometry audit 2026-09-20

on:
  push:
    branches:
      - expansion/viterbo-2026-09-20
    paths:
      - .github/workflows/viterbo-geometry-audit-2026-09-20.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viterbo-geometry-audit-2026-09-20
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/viterbo-2026-09-20
          fetch-depth: 0
      - name: Install audit runtime
        run: python -m pip install 'pdfplumber==0.11.10'
      - name: Audit exact source geometry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, urllib.request
          from collections import Counter
          from pathlib import Path
          import pdfplumber

          SOURCES={
            'listed':('https://prefettura.interno.gov.it/sites/default/files/87/2026-09/iscritte_4.pdf','ee6bdb1f9020689ae4e24d91397cdf07e7bf17999a85f4f2620eb127541f2e78',237),
            'applicants':('https://prefettura.interno.gov.it/sites/default/files/87/2026-09/richiedenti_4.pdf','a0a2280f4c4352e29997ab3b5b532500f1a7d5eb57b5e44f82a62515ac66a545',23),
          }
          Path('tmp').mkdir(exist_ok=True)
          out={}
          for kind,(url,expected_sha,expected_pages) in SOURCES.items():
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
            raw=urllib.request.urlopen(req,timeout=30).read()
            actual=hashlib.sha256(raw).hexdigest()
            if actual!=expected_sha: raise RuntimeError(f'{kind} sha drift: {actual}')
            path=Path(f'/tmp/viterbo-{kind}.pdf'); path.write_bytes(raw)
            markers=[]; dates=Counter(); notes=Counter(); samples=[]; empty_pages=[]
            with pdfplumber.open(path) as pdf:
              if len(pdf.pages)!=expected_pages: raise RuntimeError(f'{kind} page drift: {len(pdf.pages)}')
              for page_no,page in enumerate(pdf.pages,1):
                text=page.extract_text(layout=True,x_tolerance=1,y_tolerance=2) or ''
                expected_marker=f'Ditta/Società {page_no} di {expected_pages}'
                if expected_marker not in text: raise RuntimeError(f'{kind} marker drift page {page_no}')
                markers.append(page_no)
                for d in re.findall(r'\b\d{2}/\d{2}/\d{4}\b',text): dates[d]+=1
                # retain only text following Note up to the next stable left-side field/activity label.
                m=re.search(r'\bNote\b(?P<tail>.*?)(?:Attività per cui|Data Richiesta Iscrizione|Ditta/Società)',text,re.S)
                if m:
                  cleaned=' '.join(m.group('tail').split())
                  if cleaned: notes[cleaned]+=1
                if page_no in (1,2,3,expected_pages):
                  words=page.extract_words(x_tolerance=1,y_tolerance=2,keep_blank_chars=False,use_text_flow=False)
                  keep=[{'text':w['text'],'x0':round(float(w['x0']),1),'top':round(float(w['top']),1),'x1':round(float(w['x1']),1),'bottom':round(float(w['bottom']),1)} for w in words if 65 <= float(w['top']) <= 520]
                  samples.append({'page':page_no,'width':page.width,'height':page.height,'words':keep})
                if not text.strip(): empty_pages.append(page_no)
            out[kind]={
              'sha256':actual,'pages':expected_pages,'marker_count':len(markers),'empty_pages':empty_pages,
              'date_token_count':sum(dates.values()),'distinct_dates':len(dates),
              'note_fragments':notes.most_common(), 'samples':samples,
            }
          Path('tmp/viterbo-geometry-audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:{kk:vv for kk,vv in v.items() if kk!='samples'} for k,v in out.items()},ensure_ascii=False,indent=2))
          PY
      - name: Commit geometry checkpoint
        run: |
          set -euo pipefail
          git add tmp/viterbo-geometry-audit.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Checkpoint Viterbo source geometry'
          git push origin HEAD:expansion/viterbo-2026-09-20
