name: Validate Avellino parser on pinned sources

on:
  push:
    branches:
      - expansion/avellino-public-2026-09-10
    paths:
      - 'src/white_list_archive/parsers/avellino_positioned.py'
      - 'tests/test_avellino_parser_semantics.py'
      - '.github/workflows/avellino-parser-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install parser dependencies
        run: |
          python -m pip install -e '.[publication]'
          python -m pip install pytest
      - name: Run parser semantic tests
        run: pytest -q tests/test_avellino_parser_semantics.py
      - name: Validate pinned current sources
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from urllib.request import Request, urlopen
          from white_list_archive.parsers.avellino_positioned import parse_applicants, parse_listed

          sources = [
              (
                  'listed',
                  'https://prefettura.interno.gov.it/sites/default/files/24/2026-09/per_pubblicazione_iscritte_av_01-09-2026_note.pdf',
                  '9ada9195d72ba3b773448df0f0f46bab5efdd72ad7da35236bad389ad860eaf0',
                  383,
                  parse_listed,
              ),
              (
                  'applicant',
                  'https://prefettura.interno.gov.it/sites/default/files/24/2026-09/per_pubblicazione_richiedenti_iscrizione_av_01-09-2026.pdf',
                  'b541e057787e9d26982eb1e87c1233002e88a376e865b637d223c027a6b210be',
                  244,
                  parse_applicants,
              ),
          ]
          for population, url, expected_sha, expected_rows, func in sources:
              req = Request(url, headers={'User-Agent':'italian-anti-mafia-whitelist/0.1 (+source validation)'})
              with urlopen(req, timeout=90) as response:
                  body = response.read()
              actual = hashlib.sha256(body).hexdigest()
              if actual != expected_sha:
                  raise SystemExit(f'{population}: source SHA mismatch {actual}')
              path = Path('/tmp') / f'avellino-{population}.pdf'
              path.write_bytes(body)
              cfg = {
                  'source_key': f'avellino-{population}',
                  'authority_key': 'avellino',
                  'authority_name': 'Prefettura di Avellino',
                  'register_key': 'avellino-ordinary',
                  'register_name': 'White List ordinaria',
                  'population_scope': population,
                  'reference_date': '2026-09-01',
                  'source_page_url': 'https://prefettura.interno.gov.it/it/prefetture/avellino/evidenza/white-list',
                  'resource_url': url,
                  'sha256': expected_sha,
              }
              batch = func(path, cfg)
              if len(batch.records) != expected_rows:
                  raise SystemExit(f'{population}: expected {expected_rows} rows, got {len(batch.records)}')
              if batch.diagnostics['raw_identifier_coverage'] != expected_rows:
                  raise SystemExit(f'{population}: missing raw identifier cells')
              if batch.diagnostics['name_coverage'] != expected_rows:
                  raise SystemExit(f'{population}: missing names')
              if batch.diagnostics['office_coverage'] != expected_rows:
                  raise SystemExit(f'{population}: missing registered offices')
              if batch.diagnostics['activities_coverage'] != expected_rows:
                  raise SystemExit(f'{population}: missing activities')
              print(population, batch.diagnostics)
          PY
