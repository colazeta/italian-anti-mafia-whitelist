name: Cuneo applicant title diagnostic 2026-09-19

on:
  push:
    branches:
      - expansion/cuneo-2026-09-19
    paths:
      - .github/workflows/cuneo-applicant-title-diagnostic-2026-09-19.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install inspection runtime
        run: python -m pip install 'pdfplumber>=0.11,<0.12' requests
      - name: Verify source and print first-page title evidence
        env:
          URL: https://prefettura.interno.gov.it/sites/default/files/39/2026-09/elenco-richiedenti-iscrizione_0.pdf
          SHA256: 25ee4f5fff0b0f6580396c27f3e73abfdcfa994bfe673e7a86ca33377e784cea
        run: |
          python - <<'PY'
          import hashlib, os, re, tempfile, time
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          import pdfplumber, requests

          def bust(url):
              p = urlsplit(url)
              q = parse_qsl(p.query, keep_blank_values=True)
              q.append(('_wl_title_diag', str(time.time_ns())))
              return urlunsplit((p.scheme, p.netloc, p.path, urlencode(q), p.fragment))

          r = requests.get(
              bust(os.environ['URL']),
              headers={
                  'User-Agent': 'Mozilla/5.0 (compatible; italian-anti-mafia-whitelist-source-verification/1.0)',
                  'Accept': 'application/pdf,*/*;q=0.8',
                  'Cache-Control': 'no-cache',
                  'Pragma': 'no-cache',
              },
              timeout=90,
          )
          r.raise_for_status()
          digest = hashlib.sha256(r.content).hexdigest()
          assert digest == os.environ['SHA256'], (digest, os.environ['SHA256'])
          with tempfile.NamedTemporaryFile(suffix='.pdf') as fh:
              fh.write(r.content); fh.flush()
              with pdfplumber.open(fh.name) as pdf:
                  raw = pdf.pages[0].extract_text() or ''
          print('sha256=', digest)
          print('--- FIRST PAGE NORMALISED LINES ---')
          for n, line in enumerate(raw.splitlines(), 1):
              value = re.sub(r'\s+', ' ', line).strip()
              if value:
                  print(f'{n:02d}: {value}')
          print('--- FOLDED ---')
          print(re.sub(r'\s+', ' ', raw).strip().casefold())
          PY
