# Temporary transactional integration gate; remove before production PR.
name: Caserta integration gate

on:
  push:
    branches:
      - expansion/caserta-2026-09-12
    paths:
      - .github/workflows/caserta-integration.yml
      - tmp/caserta_integration.py
      - data/catalog.csv
      - tests/test_source_population_coverage.py
      - tests/test_source_registry.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/caserta-2026-09-12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialise Caserta production candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('data/monitoring/national_coverage.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          matches=[item for item in data['prefectures'] if item['authority_key']=='caserta']
          assert len(matches)==1, f'Expected one Caserta coverage placeholder, got {len(matches)}'
          current=matches[0]
          assert current.get('source_verified') is False
          assert current.get('capture_implemented') is False
          assert current.get('parser_implemented') is False
          assert current.get('company_observations_loaded') is False
          data['prefectures']=[item for item in data['prefectures'] if item['authority_key']!='caserta']
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Removed exactly one unvalidated Caserta coverage placeholder for transactional replacement')
          PY
          python tmp/caserta_integration.py
          python - <<'PY'
          from pathlib import Path
          for name in (
              'data/source_registry/source_series_inventory.csv',
              'data/source_registry/verified_primary_pages.csv',
          ):
              path = Path(name)
              path.write_bytes(path.read_bytes().replace(b'\r\n', b'\n'))
          PY
          git diff --check
          git status --short
      - name: Install full validation runtime
        run: |
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends poppler-utils; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[dev,publication,storage,database]'
          python -m pip install pdfplumber
      - name: Run full repository tests
        run: python -m pytest -q
      - name: Validate Caserta public contract
        run: |
          python - <<'PY'
          from white_list_archive.parsers.caserta_tables import PARSERS
          assert set(PARSERS) == {'caserta_listed','caserta_applicants'}
          print('Caserta parser public-contract binding available')
          PY
      - name: Validate Caserta national public candidate
        run: |
          set +e
          rc=1
          for attempt in 1 2; do
            log="/tmp/caserta-national-build-attempt-${attempt}.log"
            PYTHONUNBUFFERED=1 white-list-public-national-build \
              --source-config data/publication/multi_prefecture_pilot.json \
              --verified-pages data/source_registry/verified_primary_pages.csv \
              --source-series data/source_registry/source_series_inventory.csv \
              --authority-aliases data/source_registry/national_index_authority_aliases.csv \
              --work-dir /tmp/public-national-sources \
              --registry-json public-site/data/registry.json \
              --registry-csv public-site/data/registry.csv \
              --prefectures-json public-site/data/prefectures.json \
              --prefectures-csv public-site/data/prefectures.csv \
              2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then break; fi
            if grep -Eqi 'HTTP Error (403|408|429|5[0-9][0-9])|timed out|timeout|URLError|Temporary failure|Connection reset|Remote end closed connection' "$log"; then
              echo "Transient source/network failure detected; bounded retry $attempt/2" >&2
              sleep $((attempt * 5))
              continue
            fi
            echo "Non-transient national build failure; not retrying" >&2
            break
          done
          set -e
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          reg=json.loads(Path('public-site/data/registry.json').read_text())
          pref=json.loads(Path('public-site/data/prefectures.json').read_text())
          assert reg['meta']['record_count']==26882, reg['meta']
          assert reg['meta']['authority_count']==28, reg['meta']
          assert reg['meta']['register_count']==29, reg['meta']
          assert pref['meta']['published_count']==28, pref['meta']
          assert pref['meta']['mapped_count']==38, pref['meta']
          ce=[r for r in reg['records'] if r['authority_key']=='caserta']
          assert len(ce)==2158
          assert sum(r['source_key']=='caserta-listed' for r in ce)==950
          assert sum(r['source_key']=='caserta-applicants' for r in ce)==1208
          assert Counter(r['source_status'] for r in ce)==Counter({'pending':1208,'renewal_update_in_progress':548,'listed':395,'other_or_unknown':7})
          malformed=[r for r in ce if r.get('source_fields',{}).get('application_date_raw_variants')==['28/25/2025']]
          assert len(malformed)==1 and malformed[0]['application_date']==''
          print('Caserta national candidate validated:',reg['meta']['record_count'],reg['meta']['authority_count'],reg['meta']['register_count'],pref['meta']['mapped_count'])
          PY
      - name: Commit production candidate without workflow mutation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            data/source_registry/verified_primary_pages.csv \
            docs/sources/caserta-operational-check-2026-09-12.md \
            src/white_list_archive/publishing/public_national_registry.py \
            tests/public_portal_browser.cjs
          git diff --cached --check
          git commit -m 'Integrate Caserta public archive'
          git push origin HEAD:expansion/caserta-2026-09-12
