name: Cuneo integration finalizer v2 2026-09-19

on:
  push:
    branches:
      - expansion/cuneo-2026-09-19
    paths:
      - .github/workflows/cuneo-finalizer-v2-2026-09-19.yml

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/cuneo-2026-09-19
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify canonical base and bounded branch scope
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "daa7c0efd9c91e15b39272f93f3e6260178cea6f"
          test "$(git rev-list --count HEAD..origin/main)" = "0"
          python - <<'PY'
          import subprocess
          files=set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'],text=True).splitlines())
          allowed={
            'src/white_list_archive/parsers/cuneo_positioned.py',
            '.github/workflows/cuneo-integration-2026-09-19.yml',
            '.github/workflows/cuneo-workflow-fix-2026-09-19.yml',
            '.github/workflows/cuneo-finalizer-v2-2026-09-19.yml',
          }
          if not files <= allowed or 'src/white_list_archive/parsers/cuneo_positioned.py' not in files:
              raise SystemExit(f'unexpected pre-finalisation scope: {sorted(files)}')
          PY

      - name: Materialise reviewed permanent integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          src=Path('.github/workflows/cuneo-integration-2026-09-19.yml').read_text()
          marker="      - name: Apply permanent Cuneo integration\n        run: |\n          python - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\n          PY\n          git diff --check",start)
          script=textwrap.dedent(src[start:end])
          old="writer = csv.DictWriter(handle, fieldnames=fieldnames)"
          assert script.count(old)==1
          script=script.replace(old,"writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator='\\n')")
          exec(compile(script,'<cuneo-reviewed-integration>','exec'),{})
          PY
          mkdir -p tmp
          cp .github/workflows/public-pages.yml tmp/cuneo-public-pages-candidate.yml
          git diff --check

      - name: Install validation runtime
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils antiword
          python -m pip install -e '.[dev,publication]' requests

      - name: Reverify official bytes and exact Cuneo parser boundary
        env:
          LISTED_URL: https://prefettura.interno.gov.it/sites/default/files/39/2026-09/elenco-iscritti-white-list_0.pdf
          APPLICANTS_URL: https://prefettura.interno.gov.it/sites/default/files/39/2026-09/elenco-richiedenti-iscrizione_0.pdf
          LISTED_SHA256: 3556b033acea0b035ad8f955973affa97637260c4abe233d53518e5c7a32a2f7
          APPLICANTS_SHA256: 25ee4f5fff0b0f6580396c27f3e73abfdcfa994bfe673e7a86ca33377e784cea
        run: |
          mkdir -p /tmp/cuneo-final
          python - <<'PY'
          import hashlib,os,pathlib,time
          from collections import Counter
          from urllib.parse import parse_qsl,urlencode,urlsplit,urlunsplit
          import requests
          from white_list_archive.parsers.cuneo_positioned import parse_applicants,parse_listed
          def bust(url,token):
              p=urlsplit(url);q=parse_qsl(p.query,keep_blank_values=True);q.append(('_wl_final',token));return urlunsplit((p.scheme,p.netloc,p.path,urlencode(q),p.fragment))
          out=pathlib.Path('/tmp/cuneo-final');paths={}
          for kind in ('listed','applicants'):
              expected=os.environ[f'{kind.upper()}_SHA256'];obs=[]
              for attempt in (1,2):
                  r=requests.get(bust(os.environ[f'{kind.upper()}_URL'],f'{attempt}-{time.time_ns()}'),headers={'User-Agent':'Mozilla/5.0 (compatible; italian-anti-mafia-whitelist-source-verification/1.0)','Accept':'application/pdf,*/*;q=0.8','Cache-Control':'no-cache','Pragma':'no-cache'},timeout=90,allow_redirects=True)
                  r.raise_for_status();digest=hashlib.sha256(r.content).hexdigest();obs.append((len(r.content),digest));p=out/f'{kind}-{attempt}.pdf';p.write_bytes(r.content)
                  if attempt==1:paths[kind]=p
              assert obs[0]==obs[1] and obs[0][1]==expected,(kind,obs,expected);print(kind,obs[0])
          common={'authority_key':'cuneo','authority_name':'Prefettura di Cuneo','register_key':'cuneo-ordinary','register_name':'White List ordinaria','reference_date':'2026-09-15','source_page_url':'https://prefettura.interno.gov.it/it/prefetture/cuneo/elenco-iscritti-white-liste-e-elenco-richiedenti-white-list'}
          listed=parse_listed(paths['listed'],{**common,'source_key':'cuneo-listed','population_scope':'listed','resource_url':os.environ['LISTED_URL'],'sha256':os.environ['LISTED_SHA256']})
          applicants=parse_applicants(paths['applicants'],{**common,'source_key':'cuneo-applicants','population_scope':'applicant','resource_url':os.environ['APPLICANTS_URL'],'sha256':os.environ['APPLICANTS_SHA256']})
          records=listed.records+applicants.records
          assert len(records)==516 and sum(bool(r['identifiers']) for r in records)==505
          assert Counter(r['source_status'] for r in records)==Counter({'listed':402,'renewal_update_in_progress':66,'pending':48})
          assert listed.diagnostics['sector_rows']==1063 and applicants.diagnostics['sector_rows']==93
          PY

      - name: Run repository tests
        run: pytest -q

      - name: Build and validate national candidate
        run: |
          rm -rf /tmp/cuneo-national public-site/data/registry.json public-site/data/registry.csv public-site/data/prefectures.json public-site/data/prefectures.csv
          white-list-public-national-build --source-config data/publication/multi_prefecture_pilot.json --verified-pages data/source_registry/verified_primary_pages.csv --source-series data/source_registry/source_series_inventory.csv --authority-aliases data/source_registry/national_index_authority_aliases.csv --work-dir /tmp/cuneo-national --registry-json public-site/data/registry.json --registry-csv public-site/data/registry.csv --prefectures-json public-site/data/prefectures.json --prefectures-csv public-site/data/prefectures.csv
          python - <<'PY'
          import json
          from collections import Counter
          reg=json.load(open('public-site/data/registry.json',encoding='utf-8'));pref=json.load(open('public-site/data/prefectures.json',encoding='utf-8'))
          assert reg['meta']['record_count']==63925 and reg['meta']['authority_count']==57 and reg['meta']['register_count']==59
          assert pref['meta']['published_count']==57 and pref['meta']['mapped_count']==57
          rows=[r for r in reg['records'] if r['authority_key']=='cuneo']
          assert len(rows)==516 and sum(bool(r['identifiers']) for r in rows)==505 and len({r['record_locator'] for r in rows})==516
          assert Counter(r['source_status'] for r in rows)==Counter({'listed':402,'renewal_update_in_progress':66,'pending':48})
          assert sum(bool(r['identifier_field_raw']) and not r['identifiers'] for r in rows)==11
          print('Cuneo candidate validated',reg['meta']['record_count'],reg['meta']['authority_count'],reg['meta']['register_count'])
          PY
          git checkout -- public-site/data/registry.json public-site/data/registry.csv public-site/data/prefectures.json public-site/data/prefectures.csv 2>/dev/null || true

      - name: Commit non-workflow permanent integration and workflow candidate
        run: |
          git checkout -- .github/workflows/public-pages.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/catalog.csv data/monitoring/national_coverage.json data/publication/multi_prefecture_pilot.json data/source_registry/source_series_inventory.csv data/source_registry/verified_primary_pages.csv docs/sources/cuneo-operational-check-2026-09-19.md src/white_list_archive/publishing/public_national_registry.py tests/public_portal_browser.cjs tests/test_cuneo_parser_semantics.py tests/test_operations.py tests/test_source_population_coverage.py tests/test_source_registry.py tmp/cuneo-public-pages-candidate.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 13
          git commit -m "Integrate Cuneo White List publication candidate"
          git push origin HEAD:expansion/cuneo-2026-09-19
