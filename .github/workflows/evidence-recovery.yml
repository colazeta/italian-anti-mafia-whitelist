name: Private evidence recovery verification

on:
  workflow_dispatch:
    inputs:
      release_manifest:
        description: Reviewed frozen release manifest under data/releases/
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: private-evidence-recovery
  cancel-in-progress: false

jobs:
  backup-and-restore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: evidence-recovery
    env:
      RELEASE_MANIFEST_INPUT: ${{ inputs.release_manifest }}
      PRIMARY_EVIDENCE_BUCKET: ${{ vars.PRIMARY_EVIDENCE_BUCKET }}
      PRIMARY_EVIDENCE_ENDPOINT: ${{ vars.PRIMARY_EVIDENCE_ENDPOINT }}
      PRIMARY_EVIDENCE_REGION: ${{ vars.PRIMARY_EVIDENCE_REGION }}
      PRIMARY_EVIDENCE_POLICY_EVIDENCE: ${{ vars.PRIMARY_EVIDENCE_POLICY_EVIDENCE }}
      RECOVERY_BUCKET: ${{ vars.RECOVERY_BUCKET }}
      RECOVERY_ENDPOINT: ${{ vars.RECOVERY_ENDPOINT }}
      RECOVERY_REGION: ${{ vars.RECOVERY_REGION }}
      RECOVERY_POLICY_EVIDENCE: ${{ vars.RECOVERY_POLICY_EVIDENCE }}
      RECOVERY_INDEPENDENCE_EVIDENCE: ${{ vars.RECOVERY_INDEPENDENCE_EVIDENCE }}
      PRIMARY_EVIDENCE_READ_ACCESS_KEY_ID: ${{ secrets.PRIMARY_EVIDENCE_READ_ACCESS_KEY_ID }}
      PRIMARY_EVIDENCE_READ_SECRET_ACCESS_KEY: ${{ secrets.PRIMARY_EVIDENCE_READ_SECRET_ACCESS_KEY }}
      PRIMARY_EVIDENCE_READ_SESSION_TOKEN: ${{ secrets.PRIMARY_EVIDENCE_READ_SESSION_TOKEN }}
      RECOVERY_ACCESS_KEY_ID: ${{ secrets.RECOVERY_ACCESS_KEY_ID }}
      RECOVERY_SECRET_ACCESS_KEY: ${{ secrets.RECOVERY_SECRET_ACCESS_KEY }}
      RECOVERY_SESSION_TOKEN: ${{ secrets.RECOVERY_SESSION_TOKEN }}
      AWS_EC2_METADATA_DISABLED: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install private recovery runtime
        run: python -m pip install -e '.[storage,publication]'

      - name: Freeze reviewed release selection and exact source configuration
        run: |
          case "$RELEASE_MANIFEST_INPUT" in
            data/releases/*.json) ;;
            *) echo "release_manifest must be a JSON file directly under data/releases/" >&2; exit 1 ;;
          esac
          test -f "$RELEASE_MANIFEST_INPUT"
          git ls-files --error-unmatch "$RELEASE_MANIFEST_INPUT" >/dev/null
          cp -- "$RELEASE_MANIFEST_INPUT" /tmp/frozen-release.json

          RELEASE_CODE_REVISION="$(python - <<'PY'
          import json, os, re
          from pathlib import Path

          manifest = json.loads(Path('/tmp/frozen-release.json').read_text(encoding='utf-8'))
          revision = manifest.get('code_revision')
          if not isinstance(revision, str) or not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise SystemExit('Frozen release code_revision must be an exact 40-character Git SHA')
          print(revision)
          PY
          )"
          git cat-file -e "${RELEASE_CODE_REVISION}^{commit}"
          git merge-base --is-ancestor "$RELEASE_CODE_REVISION" "$GITHUB_SHA"
          git show "${RELEASE_CODE_REVISION}:data/publication/multi_prefecture_pilot.json" > /tmp/frozen-source-config.json

      - name: Require separate primary-read and recovery configuration
        run: |
          python - <<'PY'
          import os
          from white_list_archive.storage.evidence import StoreConfig
          from white_list_archive.storage.recovery import store_fingerprint, validate_recovery_target

          primary = StoreConfig(
              os.environ['PRIMARY_EVIDENCE_BUCKET'],
              os.environ['PRIMARY_EVIDENCE_ENDPOINT'],
              os.environ['PRIMARY_EVIDENCE_REGION'],
              os.environ['PRIMARY_EVIDENCE_POLICY_EVIDENCE'],
          )
          recovery = StoreConfig(
              os.environ['RECOVERY_BUCKET'],
              os.environ['RECOVERY_ENDPOINT'],
              os.environ['RECOVERY_REGION'],
              os.environ['RECOVERY_POLICY_EVIDENCE'],
          )
          required = (
              'PRIMARY_EVIDENCE_READ_ACCESS_KEY_ID',
              'PRIMARY_EVIDENCE_READ_SECRET_ACCESS_KEY',
              'RECOVERY_ACCESS_KEY_ID',
              'RECOVERY_SECRET_ACCESS_KEY',
              'RECOVERY_INDEPENDENCE_EVIDENCE',
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Recovery environment is incomplete: ' + ', '.join(missing))
          validate_recovery_target(
              store_fingerprint(primary), recovery, os.environ['RECOVERY_INDEPENDENCE_EVIDENCE']
          )
          PY

      - name: Verify every selected capture and clean-restore every distinct ContentObject
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          import boto3
          from botocore.config import Config

          from white_list_archive.storage.capture_catalogue import CaptureCatalogue
          from white_list_archive.storage.evidence import EvidenceStore, StoreConfig
          from white_list_archive.storage.recovery import (
              backup_and_restore_test,
              public_recovery_receipt,
              store_fingerprint,
          )
          from white_list_archive.storage.release_recovery import (
              distinct_content_object_inputs,
              selected_release_captures,
          )

          def client(config, key_name, secret_name, token_name):
              kwargs = {
                  'endpoint_url': config.endpoint,
                  'region_name': config.region,
                  'aws_access_key_id': os.environ[key_name],
                  'aws_secret_access_key': os.environ[secret_name],
                  'config': Config(
                      signature_version='s3v4',
                      connect_timeout=10,
                      read_timeout=60,
                      retries={'max_attempts': 3, 'mode': 'standard'},
                  ),
              }
              token = os.environ.get(token_name)
              if token:
                  kwargs['aws_session_token'] = token
              return boto3.client('s3', **kwargs)

          release_manifest = json.loads(Path('/tmp/frozen-release.json').read_text(encoding='utf-8'))
          source_config = json.loads(Path('/tmp/frozen-source-config.json').read_text(encoding='utf-8'))
          selected = selected_release_captures(release_manifest, source_config)
          if not selected:
              raise SystemExit('Frozen release selected no captures')

          primary_config = StoreConfig(
              os.environ['PRIMARY_EVIDENCE_BUCKET'],
              os.environ['PRIMARY_EVIDENCE_ENDPOINT'],
              os.environ['PRIMARY_EVIDENCE_REGION'],
              os.environ['PRIMARY_EVIDENCE_POLICY_EVIDENCE'],
          )
          recovery_config = StoreConfig(
              os.environ['RECOVERY_BUCKET'],
              os.environ['RECOVERY_ENDPOINT'],
              os.environ['RECOVERY_REGION'],
              os.environ['RECOVERY_POLICY_EVIDENCE'],
          )
          primary_store = EvidenceStore(
              client(
                  primary_config,
                  'PRIMARY_EVIDENCE_READ_ACCESS_KEY_ID',
                  'PRIMARY_EVIDENCE_READ_SECRET_ACCESS_KEY',
                  'PRIMARY_EVIDENCE_READ_SESSION_TOKEN',
              ),
              primary_config,
          )
          recovery_store = EvidenceStore(
              client(
                  recovery_config,
                  'RECOVERY_ACCESS_KEY_ID',
                  'RECOVERY_SECRET_ACCESS_KEY',
                  'RECOVERY_SESSION_TOKEN',
              ),
              recovery_config,
          )
          catalogue = CaptureCatalogue(primary_store)
          primary_fingerprint = store_fingerprint(primary_config)

          root = Path('/tmp/private-evidence-recovery')
          source_dir = root / 'primary-verified'
          restore_dir = root / 'clean-restore'
          receipt_dir = root / 'receipts'
          for path in (source_dir, restore_dir, receipt_dir):
              path.mkdir(parents=True, exist_ok=False)

          # Verify every capture/check independently before deduplicating repeated bytes.
          # This preserves capture provenance even when unchanged bytes reuse one ContentObject.
          bytes_by_sha = {}
          for item in selected:
              capture = item['capture']
              catalogue.verify_receipt(capture, item['catalogue'])
              primary_bytes = primary_store.read_verified(capture)
              if (
                  len(primary_bytes) != capture['byte_size']
                  or hashlib.sha256(primary_bytes).hexdigest() != capture['sha256']
              ):
                  raise SystemExit('Selected primary ContentObject failed size/SHA-256 verification')
              prior = bytes_by_sha.get(capture['sha256'])
              if prior is not None and prior != primary_bytes:
                  raise SystemExit('One ContentObject identity resolved to conflicting primary bytes')
              bytes_by_sha[capture['sha256']] = primary_bytes

          representatives = distinct_content_object_inputs(selected)
          for item in representatives:
              capture = item['capture']
              primary_bytes = bytes_by_sha[capture['sha256']]
              source_path = source_dir / capture['sha256']
              with source_path.open('xb') as handle:
                  handle.write(primary_bytes)
              restore_path = restore_dir / capture['sha256']
              full_receipt = backup_and_restore_test(
                  source_path=source_path,
                  manifest=capture,
                  recovery_store=recovery_store,
                  restore_path=restore_path,
                  primary_store_fingerprint=primary_fingerprint,
                  independence_evidence=os.environ['RECOVERY_INDEPENDENCE_EVIDENCE'],
              )
              if restore_path.read_bytes() != primary_bytes:
                  raise SystemExit('Clean restore differs from independently verified primary bytes')

              receipt = public_recovery_receipt(full_receipt)
              receipt['release_id'] = release_manifest['release_id']
              with (receipt_dir / f"{capture['sha256']}.recovery-verification.json").open('x') as handle:
                  json.dump(receipt, handle, indent=2, sort_keys=True)
                  handle.write('\n')

          summary = {
              'schema_version': 1,
              'release_id': release_manifest['release_id'],
              'code_revision': release_manifest['code_revision'],
              'selected_capture_count': len(selected),
              'distinct_content_object_count': len(representatives),
              'all_selected_capture_provenance_verified': True,
              'all_selected_primary_bytes_verified': True,
              'all_distinct_content_objects_clean_restored': True,
          }
          with (receipt_dir / 'release-recovery-summary.json').open('x') as handle:
              json.dump(summary, handle, indent=2, sort_keys=True)
              handle.write('\n')
          PY

      - name: Save redacted recovery verification receipts
        uses: actions/upload-artifact@v4
        with:
          name: evidence-recovery-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/private-evidence-recovery/receipts/*.json
          if-no-files-found: error
          retention-days: 90
