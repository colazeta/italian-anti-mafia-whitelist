name: Trapani parser validation
on:
  push:
    branches: [expansion/trapani-2026-09-19]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project runtime
        run: python -m pip install --disable-pip-version-check -e '.[dev,publication]'
      - name: Fetch official sources twice and pin bytes
        shell: bash
        run: |
          L='https://prefettura.interno.gov.it/sites/default/files/97/2026-09/elenco-ditte-iscritte-negli-elenchi-delle-white-list-aggiornato-all-11.09.2026.pdf'
          A='https://prefettura.interno.gov.it/sites/default/files/97/2026-09/elenco-ditte-richiedenti-iscrizione-negli-elenchi-delle-white-list-aggiornato-all-11.09.2026.pdf'
          for n in 1 2; do
            curl -fLsS -H 'Cache-Control: no-cache' "$L?_wl_validate=l${n}-${GITHUB_RUN_ID}" -o "/tmp/listed-${n}.pdf"
            curl -fLsS -H 'Cache-Control: no-cache' "$A?_wl_validate=a${n}-${GITHUB_RUN_ID}" -o "/tmp/applicants-${n}.pdf"
          done
          cmp /tmp/listed-1.pdf /tmp/listed-2.pdf
          cmp /tmp/applicants-1.pdf /tmp/applicants-2.pdf
          test "$(sha256sum /tmp/listed-1.pdf | cut -d' ' -f1)" = '060c5ddb20b24f733066b59f27aa1ea98a8fdc04d22b0196b90c9e383253b476'
          test "$(sha256sum /tmp/applicants-1.pdf | cut -d' ' -f1)" = 'd42720c3ebf9c24055371fc42b1de89060604fc98d60861ec72a54e650412ae9'
      - name: Validate exact parser boundary
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          from white_list_archive.parsers.trapani_tables import parse_trapani_applicants, parse_trapani_listed

          common = {
              'authority_key': 'trapani',
              'authority_name': 'Prefettura di Trapani',
              'register_key': 'trapani-ordinary',
              'register_name': 'White List ordinaria',
              'reference_date': '2026-09-11',
              'source_page_url': 'https://prefettura.interno.gov.it/it/prefetture/trapani/evidenza/white-list',
          }
          listed_cfg = common | {
              'source_key': 'trapani-listed', 'population_scope': 'listed',
              'resource_url': 'https://prefettura.interno.gov.it/sites/default/files/97/2026-09/elenco-ditte-iscritte-negli-elenchi-delle-white-list-aggiornato-all-11.09.2026.pdf',
              'sha256': '060c5ddb20b24f733066b59f27aa1ea98a8fdc04d22b0196b90c9e383253b476',
          }
          applicant_cfg = common | {
              'source_key': 'trapani-applicants', 'population_scope': 'applicant',
              'resource_url': 'https://prefettura.interno.gov.it/sites/default/files/97/2026-09/elenco-ditte-richiedenti-iscrizione-negli-elenchi-delle-white-list-aggiornato-all-11.09.2026.pdf',
              'sha256': 'd42720c3ebf9c24055371fc42b1de89060604fc98d60861ec72a54e650412ae9',
          }
          listed = parse_trapani_listed(Path('/tmp/listed-1.pdf'), listed_cfg)
          applicants = parse_trapani_applicants(Path('/tmp/applicants-1.pdf'), applicant_cfg)
          assert len(listed.records) == 333, listed.diagnostics
          assert listed.diagnostics['sector_rows'] == 658, listed.diagnostics
          assert listed.diagnostics['continuation_rows'] == 10, listed.diagnostics
          assert listed.diagnostics['split_header_fragments'] == 1, listed.diagnostics
          assert listed.diagnostics['non_date_expiry_records'] == 1, listed.diagnostics
          assert Counter(r['source_status'] for r in listed.records) == Counter({'listed': 177, 'renewal_update_in_progress': 156})
          assert sum(bool(r['identifiers']) for r in listed.records) == 333
          assert len(applicants.records) == 222, applicants.diagnostics
          assert applicants.diagnostics['continuation_rows'] == 23, applicants.diagnostics
          assert Counter(r['source_status'] for r in applicants.records) == Counter({'pending': 222})
          assert sum(bool(r['identifiers']) for r in applicants.records) == 222
          ids_l = [r['identifiers'][0] for r in listed.records]
          ids_a = [r['identifiers'][0] for r in applicants.records]
          assert len(ids_l) == len(set(ids_l)) == 333
          assert len(ids_a) == len(set(ids_a)) == 222

          by_id = {r['identifiers'][0]: r for r in applicants.records}
          assert 'Servizi funerari e cimiteriali' in by_id['02303880815']['requested_activities']
          assert by_id['02312540814']['registered_office'] == 'CASTELLAMMARE DEL GOLFO'
          assert by_id['02883270817']['name'] == 'PASTICCERIA CIOCCOLATTANDO VITO FILINGERI DI VITO CARLO FILINGERI & C. S.A.S.'
          assert by_id['02810670816']['name'] == "VINCENZO EVOLA CANTIERI MAZARA SOCIETA' A RESPONSABILITA'LIMITATA"
          assert 'Noli a caldo' in by_id['02810670816']['requested_activities']
          print({'listed': listed.diagnostics, 'applicants': applicants.diagnostics})
          PY
      - name: Run Trapani semantic tests
        run: pytest -q tests/test_trapani_parser_semantics.py
# exact office-variant evidence recheck
# patched non-date expiry evidence exact-head revalidation
