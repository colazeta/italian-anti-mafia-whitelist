name: Milano source transition

on:
  push:
    branches:
      - fix/milano-source-drift-2026-09-17
    paths:
      - .github/workflows/milano-source-transition.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transition:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile with current main
        run: |
          set -euo pipefail
          git fetch origin main
          behind=$(git rev-list --count HEAD..origin/main)
          echo "behind_main=$behind"
          test "$behind" = 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install full validation runtime
        run: python -m pip install -e '.[dev,database,storage,publication]'
      - name: Reverify approved transition boundary independently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/milano-transition
          capture() {
            name="$1"; url="$2"; expected="$3"
            code=$(curl --silent --show-error --location --retry 2 --retry-all-errors \
              --connect-timeout 20 --max-time 120 \
              --header 'Cache-Control: no-cache' --header 'Pragma: no-cache' \
              --user-agent 'italian-anti-mafia-whitelist/0.1 (+source-transition)' \
              --output "/tmp/milano-transition/${name}.body" --write-out '%{http_code}' \
              "${url}?transition=${GITHUB_RUN_ID}-${name}")
            test "$code" = 200
            actual=$(sha256sum "/tmp/milano-transition/${name}.body" | cut -d' ' -f1)
            echo "$name HTTP=$code bytes=$(wc -c < /tmp/milano-transition/${name}.body) sha256=$actual"
            test "$actual" = "$expected"
          }
          for round in 1 2; do
            capture "combined_${round}" 'https://whitelist.prefmi.it/elenco/elenco.php' '37fd59b67b153dd642298c7143de4aa1bc57bb1cced0a9310bc9539a79078215'
            capture "registered_${round}" 'https://whitelist.prefmi.it/elenco/elenco_iscritte.php' '7f5c7dcc3288387d15125aee1f8aee4e271e5743ecc3a6e9da229873cc1f4848'
            sleep 2
          done
          cmp /tmp/milano-transition/combined_1.body /tmp/milano-transition/combined_2.body
          cmp /tmp/milano-transition/registered_1.body /tmp/milano-transition/registered_2.body
      - name: Apply permanent transition
        run: python tmp/milano_apply_transition.py
      - name: Validate exact permanent diff
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              'data/monitoring/national_coverage.json',
              'data/publication/multi_prefecture_pilot.json',
              'data/source_registry/source_series_inventory.csv',
              'docs/sources/milano-source-transition-2026-09-17.md',
              'src/white_list_archive/parsers/milano_webapp.py',
              'tests/test_milano_parser_semantics.py',
          }
          changed = set(subprocess.check_output(['git','status','--short'], text=True).splitlines())
          paths = {line[3:] for line in changed}
          if paths != expected:
              raise SystemExit(f'unexpected permanent working-tree diff: {sorted(paths)!r} != {sorted(expected)!r}')
          print('exact six-file permanent transition diff verified')
          PY
      - name: Run repository and Milano semantic tests
        run: |
          pytest -q
          pytest -q tests/test_milano_parser_semantics.py
      - name: Build and validate transitioned national boundary
        run: |
          set -euo pipefail
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/milano-transition-national \
            --registry-json public-site/data/registry.json \
            --registry-csv public-site/data/registry.csv \
            --prefectures-json public-site/data/prefectures.json \
            --prefectures-csv public-site/data/prefectures.csv
          python - <<'PY'
          import json
          from pathlib import Path
          reg = json.loads(Path('public-site/data/registry.json').read_text(encoding='utf-8'))
          pref = json.loads(Path('public-site/data/prefectures.json').read_text(encoding='utf-8'))
          assert reg['meta']['record_count'] == 54177, reg['meta']['record_count']
          assert len(reg['meta']['authority_counts']) == 47, len(reg['meta']['authority_counts'])
          assert len(reg['meta']['register_counts']) == 48, len(reg['meta']['register_counts'])
          mapped = sum(bool(x.get('mapped')) for x in pref['prefectures'])
          published = sum(bool(x.get('published')) for x in pref['prefectures'])
          assert mapped == 47, mapped
          assert published == 47, published
          milano = [r for r in reg['records'] if r['authority_key'] == 'milano']
          assert len(milano) == 2612
          assert all(r['source_key'] == 'milano-combined' for r in milano)
          assert sum(r['source_status'] == 'listed' for r in milano) == 933
          assert sum(r['source_status'] == 'renewal_update_in_progress' for r in milano) == 517
          assert sum(r['source_status'] == 'pending' for r in milano) == 1162
          assert len({r['record_locator'] for r in milano}) == 2612
          assert sum(bool(r['identifiers']) for r in milano) == 2612
          assert sum(bool(r['application_date']) for r in milano) == 1162
          assert sum(bool(r['observed_listing_date']) for r in milano) == 933
          assert sum(bool(r['observed_expiry_date']) for r in milano) == 933
          assert max(r['application_date'] for r in milano if r['application_date']) == '2026-09-16'
          absent = {'04793740962','06960770961','07693660156','09835880155','10674330963','11016700152'}
          present = {r['identifier_field_raw'] for r in milano}
          assert not (absent & present), absent & present
          print(f"transitioned national boundary verified: records={reg['meta']['record_count']} authorities={len(reg['meta']['authority_counts'])} registers={len(reg['meta']['register_counts'])} mapped={mapped} Milano={len(milano)}")
          PY
      - name: Commit permanent transition checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            docs/sources/milano-source-transition-2026-09-17.md \
            src/white_list_archive/parsers/milano_webapp.py \
            tests/test_milano_parser_semantics.py
          test "$(git diff --cached --name-only | wc -l)" = 6
          git commit -m 'Approve 17 September Milano source transition'
          git push origin HEAD:fix/milano-source-drift-2026-09-17
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Report checkpoint
        run: |
          echo "Permanent transition checkpoint: ${FINAL_SHA}"
          git status --short
