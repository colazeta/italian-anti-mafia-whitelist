name: Genova parser correction
on:
  push:
    branches: [expansion/genova-2026-09-12]
    paths: [.github/workflows/genova-parser-correct.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/genova-2026-09-12
      - name: Patch parser
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/white_list_archive/parsers/genova_tables.py')
          s = p.read_text(encoding='utf-8')
          a = 'primary_date=row["application_date"],'
          b = 'application_date=row["application_date"],'
          c = 'primary_date_label="Data di presentazione dell\'istanza",'
          d = 'primary_date_label="Data presentazione istanza",'
          assert s.count(a) == 1, s.count(a)
          assert s.count(c) == 1, s.count(c)
          s = s.replace(a, b).replace(c, d)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git diff -- src/white_list_archive/parsers/genova_tables.py
      - name: Commit parser
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/white_list_archive/parsers/genova_tables.py
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'Fix Genova applicant primary-date binding'
          git push origin HEAD:expansion/genova-2026-09-12
# trigger 3
