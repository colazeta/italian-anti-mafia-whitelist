name: Private Cosenza rich preflight
on:
  # Fixed already committed capture/snapshot pair; read-only main acceptance.
  push:
    branches: [main]
    paths:
      - '.github/workflows/cosenza-rich-preflight.yml'
      - 'src/white_list_archive/normalisation/cosenza_preflight.py'
      - 'src/white_list_archive/normalisation/cosenza_capture_rich.py'
      - 'src/white_list_archive/persistence/capture_rich_cosenza.py'
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight or explicitly requested source-only persistence
        required: true
        default: preflight
        type: choice
        options: [preflight, persist-source-only]
      capture_id:
        description: Exact reviewed historical capture UUID
        required: true
        type: string
      parse_run_id:
        description: Exact committed snapshot parse run UUID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cosenza-rich-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: evidence-archive
    env:
      EVIDENCE_BUCKET: ${{ vars.EVIDENCE_BUCKET }}
      EVIDENCE_ENDPOINT: ${{ vars.EVIDENCE_ENDPOINT }}
      EVIDENCE_REGION: ${{ vars.EVIDENCE_REGION }}
      EVIDENCE_POLICY_EVIDENCE: ${{ vars.EVIDENCE_POLICY_EVIDENCE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.EVIDENCE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.EVIDENCE_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.EVIDENCE_SESSION_TOKEN }}
      EVIDENCE_DATABASE_URL: ${{ secrets.EVIDENCE_DATABASE_URL }}
      AWS_EC2_METADATA_DISABLED: 'true'
      PREFLIGHT_MODE: ${{ inputs.mode || 'preflight' }}
      PIN_CAPTURE: ${{ inputs.capture_id || '9e769f09-3d3c-5d2a-b0f7-1b53ee5895c0' }}
      PIN_RUN: ${{ inputs.parse_run_id || 'd0e644d0-ec85-4a7e-87e7-e5aa3dc48c23' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install bounded parser runtime
        run: |
          set -euo pipefail
          while IFS= read -r source_file; do
            [ -n "$source_file" ] && sudo rm -f "$source_file"
          done < <(grep -rlE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '\|dl\.google\.com/linux/chrome|d;\|packages\.google\.com/chrome|d' /etc/apt/sources.list
          fi
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 &&
               sudo apt-get install -y --no-install-recommends poppler-utils; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Parser dependency installation failed' >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[publication,storage,database]'
      - name: Run pinned preflight or explicitly selected source-only persistence
        run: |
          python - <<'PY'
          import os
          import json
          from white_list_archive.persistence.capture_rich_cosenza import MissingSourcePrivileges
          try:
              mode = os.environ['PREFLIGHT_MODE']
              if mode == 'preflight':
                  from white_list_archive.normalisation.cosenza_preflight import main
                  main(['--capture-id', os.environ['PIN_CAPTURE'],
                        '--parse-run-id', os.environ['PIN_RUN'],
                        '--code-revision', os.environ['GITHUB_SHA']])
              elif mode == 'persist-source-only' and os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
                  from white_list_archive.normalisation.cosenza_capture_rich import materialise
                  print(json.dumps(materialise(capture_id=os.environ['PIN_CAPTURE'],
                        parse_run_id=os.environ['PIN_RUN'],code_revision=os.environ['GITHUB_SHA']),
                        sort_keys=True))
              else:
                  raise ValueError('Persistence requires an explicit manual mode selection')
          except Exception as exc:
              # Never print driver/network exceptions or source rows.
              report = {'operation_verified': False,'error_type':type(exc).__name__,
                        'publications':0,'edition_approvals':0}
              if isinstance(exc, MissingSourcePrivileges):
                  report['missing_privileges'] = exc.missing
                  report['writes'] = 0
              print(json.dumps(report,sort_keys=True))
              raise SystemExit(1)
          PY
