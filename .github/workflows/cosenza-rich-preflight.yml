name: Private Cosenza rich preflight
on:
  # Read-only preflight, recovery of prior owner requests and private review.
  push:
    branches: [main]
    paths:
      - '.github/workflows/cosenza-rich-preflight.yml'
      - 'src/white_list_archive/normalisation/cosenza_preflight.py'
      - 'src/white_list_archive/normalisation/cosenza_capture_rich.py'
      - 'src/white_list_archive/persistence/capture_rich_cosenza.py'
      - 'src/white_list_archive/normalisation/source_command.py'
      - 'src/white_list_archive/normalisation/source_queue.py'
      - 'src/white_list_archive/normalisation/cosenza_qa.py'
      - 'src/white_list_archive/normalisation/cosenza_review.py'
      - 'src/white_list_archive/normalisation/cosenza_candidate.py'
      - 'src/white_list_archive/semantic/combined_whitelist_v1.py'
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ['Prefecture robots']
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight or explicitly requested source-only persistence
        required: true
        default: preflight
        type: choice
        options: [preflight, persist-source-only]
      capture_id:
        description: Exact reviewed historical capture UUID
        required: true
        type: string
      parse_run_id:
        description: Exact committed snapshot parse run UUID
        required: true
        type: string
permissions:
  contents: read
jobs:
  authorise:
    # No protected environment or archive/database credentials in this job.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'schedule' ||
         github.event.workflow_run.event == 'workflow_dispatch'))) &&
      (github.event_name != 'issue_comment' ||
       (github.event.action == 'created' && github.event.issue.number == 225 &&
        !github.event.issue.pull_request && github.actor == github.repository_owner &&
        github.event.comment.user.login == github.repository_owner &&
        (github.event.comment.body == '/cosenza-source-only 2026-06-28' ||
         github.event.comment.body == '/cosenza-source-only 2026-08-03')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.request.outputs.mode }}
      capture_id: ${{ steps.request.outputs.capture_id }}
      parse_run_id: ${{ steps.request.outputs.parse_run_id }}
      code_revision: ${{ steps.revision.outputs.code_revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate exact request before accessing protected environment
        id: request
        env:
          PYTHONPATH: src
        run: python -m white_list_archive.normalisation.source_command
      - name: Freeze the executing code
        id: revision
        run: echo "code_revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  preflight:
    needs: authorise
    # Only authorised jobs enter this queue. A replacement drains the full ledger.
    concurrency:
      group: cosenza-rich-protected-worker
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: evidence-archive
    env:
      EVIDENCE_BUCKET: ${{ vars.EVIDENCE_BUCKET }}
      EVIDENCE_ENDPOINT: ${{ vars.EVIDENCE_ENDPOINT }}
      EVIDENCE_REGION: ${{ vars.EVIDENCE_REGION }}
      EVIDENCE_POLICY_EVIDENCE: ${{ vars.EVIDENCE_POLICY_EVIDENCE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.EVIDENCE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.EVIDENCE_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.EVIDENCE_SESSION_TOKEN }}
      EVIDENCE_DATABASE_URL: ${{ secrets.EVIDENCE_DATABASE_URL }}
      AWS_EC2_METADATA_DISABLED: 'true'
      GITHUB_TOKEN: ${{ github.token }}
      PREFLIGHT_MODE: ${{ needs.authorise.outputs.mode }}
      EXECUTING_REVISION: ${{ needs.authorise.outputs.code_revision }}
      PIN_CAPTURE: ${{ needs.authorise.outputs.capture_id }}
      PIN_RUN: ${{ needs.authorise.outputs.parse_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorise.outputs.code_revision }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install bounded parser runtime
        run: |
          set -euo pipefail
          while IFS= read -r source_file; do
            [ -n "$source_file" ] && sudo rm -f "$source_file"
          done < <(grep -rlE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '\|dl\.google\.com/linux/chrome|d;\|packages\.google\.com/chrome|d' /etc/apt/sources.list
          fi
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 &&
               sudo apt-get install -y --no-install-recommends poppler-utils; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Parser dependency installation failed' >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[publication,storage,database]'
      - name: Run pinned preflight or explicitly selected source-only persistence
        run: |
          python - <<'PY'
          import os
          import json
          from white_list_archive.persistence.capture_rich_cosenza import MissingSourcePrivileges
          try:
              mode = os.environ['PREFLIGHT_MODE']
              if mode == 'drain-owner-queue' or (mode == 'persist-source-only' and os.environ['GITHUB_EVENT_NAME'] == 'issue_comment'):
                  from white_list_archive.normalisation.source_queue import main
                  main()
              elif mode == 'preflight':
                  from white_list_archive.normalisation.cosenza_preflight import main
                  main(['--capture-id', os.environ['PIN_CAPTURE'],
                        '--parse-run-id', os.environ['PIN_RUN'],
                        '--code-revision', os.environ['EXECUTING_REVISION']])
                  from white_list_archive.normalisation.source_queue import main
                  main()
              elif mode == 'persist-source-only' and os.environ['GITHUB_EVENT_NAME'] in ('workflow_dispatch', 'issue_comment'):
                  from white_list_archive.normalisation.cosenza_capture_rich import materialise
                  print(json.dumps(materialise(capture_id=os.environ['PIN_CAPTURE'],
                        parse_run_id=os.environ['PIN_RUN'],code_revision=os.environ['EXECUTING_REVISION']),
                        sort_keys=True))
                  from white_list_archive.normalisation.source_queue import main
                  main()
              else:
                  raise ValueError('Persistence requires an explicit manual mode selection')
          except Exception as exc:
              # Never print driver/network exceptions or source rows.
              report = {'operation_verified': False,'error_type':type(exc).__name__,
                        'publications':0,'edition_approvals':0}
              if isinstance(exc, MissingSourcePrivileges):
                  report['missing_privileges'] = exc.missing
                  report['writes'] = 0
              print(json.dumps(report,sort_keys=True))
              raise SystemExit(1)
          PY
