name: Pescara source probe v2

on:
  push:
    branches: [expansion/pescara-2026-09-21]
    paths: [.github/workflows/pescara-source-probe-v2.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/pescara-2026-09-21
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pdfplumber
      - name: Capture and inspect current official sources
        run: |
          python - <<'PY'
          import hashlib,json,re,time
          from pathlib import Path
          from urllib.parse import urljoin
          import pdfplumber,requests
          from bs4 import BeautifulSoup

          targets={
            'listed':('https://prefettura.interno.gov.it/it/prefetture/pescara/evidenza/white-list','White list 27/08/2026'),
            'applicants':('https://prefettura.interno.gov.it/it/prefetture/pescara/elenco-imprese-richiedenti-liscrizione-nelle-white-list','Elenco richiedenti White List - 04.09.2026'),
          }
          clean=lambda x:re.sub(r'\s+',' ',x or '').strip()
          s=requests.Session();s.headers['User-Agent']='Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelist/1.0)'
          result={'verified_on':'2026-09-21','sources':{}}
          for key,(landing,label) in targets.items():
            o={'landing_url':landing,'expected_label':label};result['sources'][key]=o
            try:
              r=s.get(landing,timeout=40);o['landing_status']=r.status_code
              if r.status_code!=200:o['error']=f'landing HTTP {r.status_code}';continue
              soup=BeautifulSoup(r.text,'html.parser');links=[{'text':clean(a.get_text(' ',strip=True)),'href':urljoin(landing,a['href'])} for a in soup.find_all('a',href=True)]
              exact=[x for x in links if x['text'].casefold()==label.casefold()]
              o['matching_link_count']=len(exact)
              if len(exact)!=1:
                o['candidates']=[x for x in links if 'white' in x['text'].casefold() or 'richied' in x['text'].casefold()][:30]
                o['error']='exact attachment label not unique';continue
              url=exact[0]['href'];o['attachment_url']=url;bodies=[];caps=[]
              for n in (1,2):
                rr=s.get(url,timeout=60);body=rr.content
                caps.append({'attempt':n,'status':rr.status_code,'content_type':rr.headers.get('content-type',''),'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()})
                if rr.status_code==200:bodies.append(body)
                time.sleep(1)
              o['captures']=caps;o['byte_identical']=len(bodies)==2 and bodies[0]==bodies[1]
              if not o['byte_identical'] or not bodies[0].startswith(b'%PDF'):
                o['error']='stable PDF capture not established';continue
              p=Path(f'/tmp/{key}.pdf');p.write_bytes(bodies[0])
              with pdfplumber.open(p) as pdf:
                o['pages']=len(pdf.pages);o['page_summaries']=[]
                for i,page in enumerate(pdf.pages,1):
                  tables=page.extract_tables();info=[]
                  for table in tables:
                    rows=[[clean(c) for c in row] for row in (table or [])]
                    info.append({'rows':len(rows),'widths':sorted(set(map(len,rows))),'head':rows[:4],'tail':rows[-3:]})
                  o['page_summaries'].append({'page':i,'tables':len(tables),'tables_info':info,'text_head':clean(page.extract_text() or '')[:800]})
                full='\n\f\n'.join(page.extract_text(layout=True) or '' for page in pdf.pages)
                o['text_head']=full[:7000];o['text_tail']=full[-4000:];o['text_chars']=len(full)
            except Exception as exc:o['error']=f'{type(exc).__name__}: {exc}'
          path=Path('docs/sources/pescara-source-probe-2026-09-21.json');path.write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit probe evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/sources/pescara-source-probe-2026-09-21.json
          git commit -m 'Checkpoint Pescara official-source probe'
          git push origin HEAD:expansion/pescara-2026-09-21
