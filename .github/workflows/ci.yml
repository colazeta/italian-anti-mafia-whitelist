name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  static-and-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: whitelist
          POSTGRES_USER: whitelist
          POSTGRES_PASSWORD: whitelist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whitelist -d whitelist"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      PGPASSWORD: whitelist
      TEST_DSN: postgresql://whitelist:whitelist@localhost:5432/whitelist

    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed Genova date exceptions
        if: github.ref == 'refs/heads/expansion/genova-2026-09-12'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/white_list_archive/parsers/genova_tables.py')
          text = path.read_text(encoding='utf-8')
          marker = '_REVIEWED_INVALID_DATE_FIELDS = {'
          if marker not in text:
              anchor = '''_REVIEWED_SECTION_FIELDS = {'''
              start = text.index(anchor)
              end_marker = '''\n}\n\n\ndef _compact'''
              end = text.index(end_marker, start)
              insertion = '''\n}\n\n\n_REVIEWED_INVALID_DATE_FIELDS = {\n    ("listed", "GENOVARENT SRL", "listing", "26//09/2023"),\n    ("applicant", "LO SCACCIA PENSIERI SRL", "application", "16/072026"),\n}\n\n\ndef _compact'''
              text = text[:end] + insertion + text[end + len(end_marker):]

              old_helper = '''def _sections(value: str, *, scope: str, name: str) -> list[str]:'''
              new_helper = '''def _parse_observed_date(value: str, *, scope: str, name: str, field: str) -> str:\n    raw = _clean(value)\n    if (scope, name, field, raw) in _REVIEWED_INVALID_DATE_FIELDS:\n        return ""\n    return _parse_date(raw)\n\n\ndef _sections(value: str, *, scope: str, name: str) -> list[str]:'''
              if text.count(old_helper) != 1:
                  raise SystemExit(f'expected one _sections anchor, found {text.count(old_helper)}')
              text = text.replace(old_helper, new_helper)

              replacements = {
                  'listing_date = _parse_date(cells[5])': 'listing_date = _parse_observed_date(cells[5], scope="listed", name=cells[0], field="listing")',
                  'expiry_date = _parse_date(cells[6])': 'expiry_date = _parse_observed_date(cells[6], scope="listed", name=cells[0], field="expiry")',
                  'application_date = _parse_date(cells[5])': 'application_date = _parse_observed_date(cells[5], scope="applicant", name=cells[0], field="application")',
              }
              for old, new in replacements.items():
                  if text.count(old) != 1:
                      raise SystemExit(f'expected one date binding {old!r}, found {text.count(old)}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          else:
              required = [
                  '("listed", "GENOVARENT SRL", "listing", "26//09/2023")',
                  '("applicant", "LO SCACCIA PENSIERI SRL", "application", "16/072026")',
                  'listing_date = _parse_observed_date(cells[5], scope="listed", name=cells[0], field="listing")',
                  'application_date = _parse_observed_date(cells[5], scope="applicant", name=cells[0], field="application")',
              ]
              missing = [item for item in required if item not in text]
              if missing:
                  raise SystemExit(f'incomplete reviewed-date patch: {missing}')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and Python test dependencies
        run: python -m pip install -e .[dev,database,storage]
      - name: Install Genova validation runtime
        if: github.ref == 'refs/heads/expansion/genova-2026-09-12'
        run: python -m pip install --disable-pip-version-check requests pdfplumber
      - name: Run repository tests
        run: pytest -q
      - name: Validate Genova byte-pinned official sources
        if: github.ref == 'refs/heads/expansion/genova-2026-09-12'
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import tempfile
          from collections import Counter

          import requests

          from white_list_archive.parsers.genova_tables import parse_genova_applicants, parse_genova_listed

          page = 'https://prefettura.interno.gov.it/it/prefetture/genova/elenco-imprese-iscritte-white-list'
          specs = {
              'listed': {
                  'source_key': 'genova-listed',
                  'population_scope': 'listed',
                  'url': 'https://prefettura.interno.gov.it/sites/default/files/0/2026-09/wl-10-09-26.pdf',
                  'sha256': 'baf72de8d1f28943a8e9ec2bdd6e95213eacd0058cd6799a04e233c06d9e5403',
              },
              'applicant': {
                  'source_key': 'genova-applicants',
                  'population_scope': 'applicant',
                  'url': 'https://prefettura.interno.gov.it/sites/default/files/0/2026-09/sez-richiedenti-10-09-26.pdf',
                  'sha256': '13ecfd8bea8616deea76349cd7592fd046d09f45e2b522c11dda1f084a4420a7',
              },
          }
          session = requests.Session()
          session.headers.update({'User-Agent': 'italian-anti-mafia-whitelist parser validation/1.0'})
          report = {'authority_key': 'genova', 'validated_on': '2026-09-12', 'sources': {}}
          with tempfile.TemporaryDirectory(prefix='genova-parser-validation-') as td:
              td = pathlib.Path(td)
              batches = {}
              for scope, spec in specs.items():
                  response = session.get(spec['url'], timeout=(15, 120))
                  response.raise_for_status()
                  sha = hashlib.sha256(response.content).hexdigest()
                  if sha != spec['sha256']:
                      raise SystemExit(f'{scope} source drift: {sha}')
                  path = td / f'{scope}.pdf'
                  path.write_bytes(response.content)
                  cfg = {
                      'source_key': spec['source_key'],
                      'authority_key': 'genova',
                      'authority_name': 'Prefettura di Genova',
                      'register_key': 'genova-ordinary',
                      'register_name': 'White List ordinaria',
                      'population_scope': spec['population_scope'],
                      'reference_date': '2026-09-10',
                      'source_page_url': page,
                      'resource_url': spec['url'],
                      'sha256': spec['sha256'],
                  }
                  batch = parse_genova_listed(path, cfg) if scope == 'listed' else parse_genova_applicants(path, cfg)
                  batches[scope] = batch
                  report['sources'][scope] = batch.diagnostics

              listed = batches['listed'].records
              applicants = batches['applicant'].records
              assert len(listed) == 652, len(listed)
              assert Counter(x['source_status'] for x in listed) == Counter({'listed': 528, 'renewal_update_in_progress': 124})
              assert len(applicants) == 110, len(applicants)
              assert Counter(x['source_status'] for x in applicants) == Counter({'pending': 110})
              assert all(x['capture_sha256'] == specs['listed']['sha256'] for x in listed)
              assert all(x['capture_sha256'] == specs['applicant']['sha256'] for x in applicants)

              genovarent = [x for x in listed if x['name'] == 'GENOVARENT SRL']
              assert len(genovarent) == 1
              assert genovarent[0]['observed_listing_date'] == ''
              assert genovarent[0]['source_fields']['listing_date_raw'] == '26//09/2023'

              scacciapensieri = [x for x in applicants if x['name'] == 'LO SCACCIA PENSIERI SRL']
              assert len(scacciapensieri) == 1
              assert scacciapensieri[0]['application_date'] == ''
              assert scacciapensieri[0]['source_fields']['application_date_raw'] == '16/072026'

              fisia = [x for x in listed if x['name'] == 'FISIA ITALIMPIANTI SPA']
              assert len(fisia) == 1
              assert fisia[0]['identifiers'] == ['02340830997']
              assert fisia[0]['source_status'] == 'renewal_update_in_progress'
              assert fisia[0]['observed_listing_date'] == '2024-09-06'
              assert fisia[0]['observed_expiry_date'] == '2026-09-05'

              p7 = {x['name']: x for x in applicants if x['name'] in {
                  'CRESTA & DELFINO SRL', 'CUNEO LUIGI', 'CURZI LUIGI - AUTOTRASPORTI C/TERZI',
                  'DAMA SRL', 'DASSORI SRL', 'DE BREEZE SRL'}}
              assert len(p7) == 6
              assert p7['CRESTA & DELFINO SRL']['identifiers'] == ['01345600991']
              assert p7['DE BREEZE SRL']['application_date'] == '2026-05-19'
              assert p7['DE BREEZE SRL']['source_fields']['application_date_raw'] == '1 9 / 0 5 / 2 0 2 6'

              edilq = [x for x in applicants if x['name'] == 'EDILQUADRIFOGLIO SRL']
              assert len(edilq) == 1
              assert edilq[0]['identifiers'] == ['01660680990']
              assert edilq[0]['application_date'] == '2026-07-03'

              raw_anomalies = {x['name']: x for x in listed if x['name'] in {'PARODI PAOLO', 'PIROMALLI ANTONINO srl', 'ROSSI ROBERTO', 'TRAVERSO SERGIO'}}
              assert raw_anomalies['PARODI PAOLO']['identifier_field_raw'] == '018509000992'
              assert raw_anomalies['PARODI PAOLO']['identifiers'] == []
              assert raw_anomalies['PIROMALLI ANTONINO srl']['identifiers'] == []
              assert raw_anomalies['ROSSI ROBERTO']['identifiers'] == []
              assert raw_anomalies['TRAVERSO SERGIO']['identifiers'] == []

              report['total_records'] = len(listed) + len(applicants)
              report['status_counts'] = dict(Counter(x['source_status'] for x in listed + applicants))
              report['listed_identifier_coverage'] = sum(bool(x['identifiers']) for x in listed)
              report['applicant_identifier_coverage'] = sum(bool(x['identifiers']) for x in applicants)

          out = pathlib.Path('tmp/genova_parser_validation.json')
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Generate synthetic Cosenza parser outputs
        run: |
          white-list-cosenza-mentions \
            tests/fixtures/cosenza_parser/before.txt \
            tests/fixtures/cosenza_parser/after.txt \
            --output-dir artifacts/cosenza-fixture
      - name: Build sanitized Data Explorer fixture
        run: |
          white-list-build-explorer-preview \
            --before-records artifacts/cosenza-fixture/before_records.csv \
            --after-records artifacts/cosenza-fixture/after_records.csv \
            --diff artifacts/cosenza-fixture/diff_summary.json \
            --parse-manifest artifacts/cosenza-fixture/parse_manifest.json \
            --output artifacts/explorer-check/index.html
          python - <<'PY'
          from pathlib import Path
          html = Path('artifacts/explorer-check/index.html').read_text(encoding='utf-8')
          assert '__DATA_PAYLOAD__' not in html
          assert 'SANITIZED PREVIEW' in html
          assert '[omitted in sanitized preview]' in html
          PY
      - name: Install PostgreSQL client
        run: |
          if command -v psql >/dev/null 2>&1; then
            psql --version
            exit 0
          fi
          # GitHub-hosted images can contain third-party APT source files in either
          # .list or deb822 .sources form. This project does not depend on Chrome;
          # remove only source files that actually reference its repository so a
          # transient Google metadata mismatch cannot make database CI flaky.
          while IFS= read -r source_file; do
            [ -n "$source_file" ] && sudo rm -f "$source_file"
          done < <(grep -rlE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '\|dl\.google\.com/linux/chrome|d;\|packages\.google\.com/chrome|d' /etc/apt/sources.list
          fi
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -o Acquire::Retries=3 && \
               sudo apt-get install -y --no-install-recommends postgresql-client; then
              psql --version
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 3))
            fi
          done
          echo "PostgreSQL client installation failed after bounded retries" >&2
          exit 1
      - name: Apply schema and seeds
        run: psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -f db/apply.sql
      - name: Run database integrity tests
        run: psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -f db/test.sql
      - name: Persist frozen Cosenza capture manifests twice
        run: |
          white-list-persist-capture-manifests --dsn "$TEST_DSN" \
            data/captures/cosenza/combined_2026-06-28.json \
            data/captures/cosenza/combined_2026-08-03.json
          white-list-persist-capture-manifests --dsn "$TEST_DSN" \
            data/captures/cosenza/combined_2026-06-28.json \
            data/captures/cosenza/combined_2026-08-03.json
      - name: Validate persisted capture graph
        run: psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -f db/tests/002_cosenza_manifest_persistence.sql
      - name: Persist synthetic parsed records twice
        run: |
          for pass in 1 2; do
            white-list-persist-parsed-records --dsn "$TEST_DSN" \
              --capture-manifest tests/fixtures/cosenza_parser/before_capture.json \
              --parse-manifest artifacts/cosenza-fixture/parse_manifest.json \
              --parse-label before \
              --records artifacts/cosenza-fixture/before_records.csv
            white-list-persist-parsed-records --dsn "$TEST_DSN" \
              --capture-manifest tests/fixtures/cosenza_parser/after_capture.json \
              --parse-manifest artifacts/cosenza-fixture/parse_manifest.json \
              --parse-label after \
              --records artifacts/cosenza-fixture/after_records.csv
          done
      - name: Validate parsed-record persistence
        run: psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -f db/tests/003_cosenza_parsed_record_persistence.sql

      - name: Test evidence storage promotion against PostgreSQL (mock object transport)
        run: python tests/evidence_db_check.py
      - name: Checkpoint validated Genova parser
        if: github.ref == 'refs/heads/expansion/genova-2026-09-12'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/white_list_archive/parsers/genova_tables.py tmp/genova_parser_validation.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Validate Genova parser against official sources'
            git push origin HEAD:expansion/genova-2026-09-12
          fi
