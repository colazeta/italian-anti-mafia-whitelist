name: CI

on:
  push:
  pull_request:

jobs:
  static-and-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: whitelist
          POSTGRES_USER: whitelist
          POSTGRES_PASSWORD: whitelist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whitelist -d whitelist"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      PGPASSWORD: whitelist

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and Python test dependencies
        run: python -m pip install -e .[dev]
      - name: Run repository tests
        run: pytest -q
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply schema and seeds
        run: psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -f db/apply.sql
      - name: Run database integrity tests
        run: psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -f db/test.sql
