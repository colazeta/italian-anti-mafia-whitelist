name: Brindisi source audit 2026-09-11

on:
  push:
    branches:
      - expansion/brindisi-2026-09-11
    paths:
      - .github/workflows/brindisi-source-audit-2026-09-11.yml
      - scripts/brindisi_source_audit_v2.py
      - scripts/brindisi_applicant_geometry.py
      - scripts/brindisi_parser_smoke.py
      - src/white_list_archive/parsers/brindisi_tables.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install audit runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          python -m pip install -e '.[publication]'
      - name: Fetch and audit official sources
        env:
          LISTED_URL: https://prefettura.interno.gov.it/sites/default/files/23/2026-09/white-list-elenco-imprese-iscritte_1.pdf
          APPLICANT_URL: https://prefettura.interno.gov.it/sites/default/files/23/2026-09/white_list_della_provincia_di_brindisi-elenco_delle_imprese_richiedenti_l-iscrizione_0.pdf
        run: |
          python scripts/brindisi_source_audit_v2.py
          python scripts/brindisi_parser_smoke.py
      - name: Upload deterministic parser checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: brindisi-parser-smoke-${{ github.sha }}
          path: tmp/brindisi-parser-smoke.json
          if-no-files-found: error
          retention-days: 1
