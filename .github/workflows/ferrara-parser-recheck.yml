name: Ferrara parser recheck

on:
  push:
    branches: [expansion/ferrara-2026-09-20]
    paths: [.github/workflows/ferrara-parser-recheck.yml]

permissions:
  contents: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e . requests pdfplumber==0.11.10
      - name: Revalidate byte-pinned Ferrara parser boundary
        shell: python
        run: |
          import hashlib, secrets, tempfile
          from pathlib import Path
          import requests
          from white_list_archive.parsers.ferrara_tables import parse_ferrara_ordinary, parse_ferrara_applicants, parse_ferrara_reconstruction_bundle

          SOURCES = {
            'ordinary': ('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/white-list-provinciali-elenco-imprese-iscritte-agg11112024_0.pdf','0d631e678b7f85bb84d265b09b8de6fcffa09cc4a49b84be37c6c1d7b9dcd6d9'),
            'applicants': ('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/white-list-elenco-imprese-richiedenti_0.pdf','c7437cdeebd1a64d4a6de8bbe5e8c108a688269409b7c772e8a6c87162e588e7'),
            'A': ('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-a-fornitura-moduli-prefabbricati-e-dei-relativi-arredi_is_0.pdf','4fdf292b1538892c7b5ff79d3c0c14e0ed3b5830effb791316b0fddb8c90ae01'),
            'B': ('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-b-demolizione-di-edifici-ed-altre-strutture_is_0.pdf','97d9af0d587af0b7d93d31df33bd612440bf5be5b48b57872d436e2afeb164ec'),
            'C': ('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-c-movimenti-di-terra_is_0.pdf','99f519101dccff84dddd9753f0d6fa27170c33b1982858afe9fdf9ebbc63c57e'),
            'D': ('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-d-noleggio-con-coducente-mezzi-speciali_is_0.pdf','07c27b38e48a879aa0d1efff4710bf7dbbf1bb323e59f62eb0b0b796a75a46d8'),
            'E': ('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-e-fornitura-e-posa-in-opera-impianti-fotovoltaici_is_0.pdf','9cea950d37f653d0356edb9a46a7f43665a382e771c969bc93f7027f95fecf9e'),
            'F': ('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-f-fornitura-e-manutenzione-impianti-tecnologici_is_0.pdf','ac7dd77f1c4633c27a62c0ad7e074f507a10b091a327c2fc1072cfb52fd45664'),
            'G': ('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-g-fornitura-beni-necessari-ricostruzione_is_0.pdf','0657c7e0f0b9fb8ad7f0b341682716d695132e61131adc92407627a5cae82bae'),
          }

          def capture(name, root):
            url, expected = SOURCES[name]
            bodies=[]
            for _ in range(2):
              r=requests.get(url, headers={'User-Agent':'italian-anti-mafia-whitelist/ferrara-parser-recheck','Cache-Control':'no-cache','Pragma':'no-cache'}, params={'nonce':secrets.token_hex(8)}, timeout=90)
              r.raise_for_status(); got=hashlib.sha256(r.content).hexdigest(); assert got==expected,(name,expected,got,len(r.content)); bodies.append(r.content)
            assert bodies[0]==bodies[1], f'independent captures differ: {name}'
            p=root/f'{name}.pdf'; p.write_bytes(bodies[0]); return p

          def cfg(source_key, register_key, resource_url='https://prefettura.interno.gov.it/it/prefetture/ferrara', sha='validation'):
            return {'source_key':source_key,'authority_key':'ferrara','authority_name':'Prefettura di Ferrara','register_key':register_key,'register_name':register_key,'population_scope':'all','reference_date':'2026-09-20','source_page_url':'https://prefettura.interno.gov.it/it/prefetture/ferrara','resource_url':resource_url,'sha256':sha}

          with tempfile.TemporaryDirectory() as d:
            root=Path(d)
            ordinary=parse_ferrara_ordinary(capture('ordinary',root),cfg('ferrara-provincial-listed','ferrara-ordinary',*SOURCES['ordinary']))
            assert ordinary.diagnostics['public_records']==868
            assert ordinary.diagnostics['status_counts']=={'listed':717,'renewal_update_in_progress':150,'other_or_unknown':1}
            assert ordinary.diagnostics['identifier_coverage']==859
            assert ordinary.diagnostics['continuation_rows']==28
            assert ordinary.diagnostics['date_anomalies']==2

            applicants=parse_ferrara_applicants(capture('applicants',root),cfg('ferrara-provincial-applicants','ferrara-ordinary',*SOURCES['applicants']))
            assert len(applicants.records)==21
            assert applicants.diagnostics['identifier_coverage']==21
            assert applicants.diagnostics['shared_publication_no_duplicate_ingest'] is True

            recon_paths={s:capture(s,root) for s in 'ABCDEFG'}
            reconstruction=parse_ferrara_reconstruction_bundle(recon_paths,cfg('ferrara-reconstruction-listed','ferrara-reconstruction'))
            assert reconstruction.diagnostics['physical_sector_observations']==1161
            assert reconstruction.diagnostics['public_records']==697
            assert reconstruction.diagnostics['status_counts']=={'listed':542,'renewal_update_in_progress':153,'other_or_unknown':2}
            assert reconstruction.diagnostics['identifier_coverage']==683
            assert reconstruction.diagnostics['multi_sector_groups']==282
            assert reconstruction.diagnostics['date_anomalies']==15
            assert len(ordinary.records)+len(applicants.records)+len(reconstruction.records)==1586
            print('Ferrara parser boundary green: 868 ordinary + 21 shared applicants + 697 reconstruction = 1586 physical/logical observations')
