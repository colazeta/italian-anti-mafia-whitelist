name: Pescara DOC audit

on:
  push:
    branches: [expansion/pescara-2026-09-21]
    paths: [.github/workflows/pescara-doc-audit.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/pescara-2026-09-21
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq antiword
          python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Capture twice and inspect Word structure
        run: |
          set -euo pipefail
          mkdir -p docs/sources/pescara-doc-audit
          python - <<'PY'
          import hashlib, html, json, re, subprocess, time, xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          out=Path('docs/sources/pescara-doc-audit')
          targets={
            'listed':('https://prefettura.interno.gov.it/it/prefetture/pescara/evidenza/white-list','White list 16/09/2026'),
            'applicants':('https://prefettura.interno.gov.it/it/prefetture/pescara/elenco-imprese-richiedenti-liscrizione-nelle-white-list','Elenco richiedenti White List - 04.09.2026'),
          }
          clean=lambda x:re.sub(r'\s+',' ',x or '').strip()
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelist/1.0)','Accept':'text/html,application/msword,*/*;q=0.8'})
          report={'verified_on':'2026-09-21','audit_version':1,'sources':{}}
          for key,(landing,label) in targets.items():
            item={'landing_url':landing,'expected_label':label};report['sources'][key]=item
            r=s.get(landing,timeout=40);item['landing_status']=r.status_code
            if r.status_code!=200:
              item['error']=f'landing HTTP {r.status_code}';continue
            links=[{'text':clean(a.get_text(' ',strip=True)),'href':urljoin(landing,a['href'])} for a in BeautifulSoup(r.text,'html.parser').find_all('a',href=True)]
            exact=[x for x in links if x['text'].casefold()==label.casefold()]
            item['matching_link_count']=len(exact)
            if len(exact)!=1:
              item['candidate_links']=[x for x in links if 'white' in x['text'].casefold() or 'richied' in x['text'].casefold()][:30]
              item['error']='exact attachment label not unique';continue
            url=exact[0]['href'];item['attachment_url']=url
            bodies=[];caps=[]
            for n in (1,2):
              rr=s.get(url,timeout=60);body=rr.content
              caps.append({'attempt':n,'status':rr.status_code,'content_type':rr.headers.get('content-type',''),'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest(),'magic_hex':body[:8].hex()})
              if rr.status_code==200:bodies.append(body)
              time.sleep(1)
            item['captures']=caps;item['byte_identical']=len(bodies)==2 and bodies[0]==bodies[1]
            if not item['byte_identical']:
              item['error']='two successful byte-identical captures not established';continue
            p=Path(f'/tmp/pescara-{key}.doc');p.write_bytes(bodies[0])
            proc=subprocess.run(['antiword','-x','db',str(p)],stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=False)
            item['antiword_returncode']=proc.returncode;item['antiword_stderr']=proc.stderr.decode('utf-8','replace')[:2000]
            if proc.returncode:
              item['error']='antiword DocBook conversion failed';continue
            db=proc.stdout.decode('utf-8','replace')
            (out/f'{key}.docbook.xml').write_text(db,encoding='utf-8')
            plain=subprocess.run(['antiword',str(p)],stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=False).stdout.decode('utf-8','replace')
            (out/f'{key}.txt').write_text(plain,encoding='utf-8')
            xml=re.sub(r'<!DOCTYPE book PUBLIC.*?docbookx\.dtd">\s*','',db,flags=re.S)
            root=ET.fromstring(xml)
            paras=[]
            for para in root.findall('.//para'):
              text=clean(''.join(para.itertext()))
              if text:paras.append(text)
            tables=[]
            for ti,table in enumerate(root.findall('.//informaltable'),1):
              tgroups=table.findall('.//tgroup')
              for gi,tg in enumerate(tgroups,1):
                rows=[]
                for row in tg.findall('.//row'):
                  rows.append([clean(''.join(e.itertext())) for e in row.findall('./entry')])
                tables.append({'table_index':ti,'tgroup_index':gi,'declared_cols':tg.get('cols'),'row_count':len(rows),'widths':sorted(set(map(len,rows))),'rows':rows})
            item['paragraph_count']=len(paras);item['paragraphs']=paras
            item['table_count']=len(tables);item['tables']=tables
            item['plain_chars']=len(plain);item['plain_head']=plain[:5000];item['plain_tail']=plain[-3000:]
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit DOC audit checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/sources/pescara-doc-audit
          git commit -m 'Checkpoint Pescara legacy Word source audit'
          git push origin HEAD:expansion/pescara-2026-09-21
