name: Fix Cagliari register label

on:
  push:
    branches:
      - expansion/cagliari-2026-09-11
    paths:
      - .github/workflows/cagliari-register-label-fix-2026-09-11.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: expansion/cagliari-2026-09-11
      - name: Correct composed register label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('data/publication/multi_prefecture_pilot.json')
          text = path.read_text(encoding='utf-8')
          old = '"register_name": "White List ordinaria · Prefettura di Cagliari"'
          new = '"register_name": "White List ordinaria"'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 Cagliari register labels, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff -- data/publication/multi_prefecture_pilot.json
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/publication/multi_prefecture_pilot.json
          git commit -m 'Fix Cagliari register label composition'
          git push origin HEAD:expansion/cagliari-2026-09-11
