name: Lecco parser patch

on:
  push:
    branches:
      - expansion/lecco-2026-09-15
    paths:
      - .github/workflows/lecco-parser-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/lecco-2026-09-15
          fetch-depth: 0
      - name: Apply narrow reviewed parser fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/white_list_archive/parsers/lecco_rect_tables.py')
          text = path.read_text()
          old = '    residue = value\n    for section in _SECTION.findall(value):\n        residue = residue.replace(section, " ")\n'
          new = '    residue = _SECTION.sub(" ", value)\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one reviewed section-residue block, got {text.count(old)}')
          text = text.replace(old, new)
          parser_map = '\n\nPARSERS = {\n    "lecco_listed": parse_lecco_listed,\n    "lecco_applicants": parse_lecco_applicants,\n}\n'
          if 'PARSERS = {' in text:
              raise SystemExit('Lecco parser map already exists; refusing duplicate append')
          path.write_text(text.rstrip() + parser_map)
          PY
          git diff --check
          git diff -- src/white_list_archive/parsers/lecco_rect_tables.py
      - name: Commit parser fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/white_list_archive/parsers/lecco_rect_tables.py
          git commit -m 'Fix Lecco section parsing and bind parsers'
          git push origin HEAD:expansion/lecco-2026-09-15
