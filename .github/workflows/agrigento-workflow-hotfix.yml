name: Repair Agrigento integration test runtime

on:
  push:
    branches:
      - expansion/agrigento-2026-09-10
    paths:
      - '.github/workflows/agrigento-workflow-hotfix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/agrigento-2026-09-10
          fetch-depth: 0
      - name: Add pytest to the one-shot integration runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/agrigento-integration-apply.yml')
          text = path.read_text(encoding='utf-8')
          old = "        run: python -m pip install -e '.[publication]'\n"
          new = "        run: python -m pip install -e '.[publication]' pytest\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one runtime install line, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'colazeta'
          git config user.email '47261299+colazeta@users.noreply.github.com'
          git add .github/workflows/agrigento-integration-apply.yml
          git diff --cached --check
          git commit -m 'Install Agrigento integration test runtime'
          git push origin HEAD:expansion/agrigento-2026-09-10
