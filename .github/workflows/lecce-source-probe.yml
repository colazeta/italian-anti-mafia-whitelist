name: Lecce source boundary probe

on:
  push:
    branches:
      - expansion/lecce-2026-09-18
    paths:
      - scripts/lecce_debug_rows.py
      - .github/workflows/lecce-source-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/lecce-2026-09-18
      - name: Install PDF tooling
        run: python -m pip install --disable-pip-version-check pdfplumber
      - name: Inspect conflicting Lecce source rows
        run: python scripts/lecce_debug_rows.py
      - name: Persist debug receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/lecce_debug_rows.json
          if git diff --cached --quiet; then
            echo "Debug receipt unchanged"
            exit 0
          fi
          git commit -m "chore: capture Lecce collision debug receipt"
          git push origin HEAD:expansion/lecce-2026-09-18
