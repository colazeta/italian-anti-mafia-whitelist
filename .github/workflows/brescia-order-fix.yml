name: Brescia order fix
on:
  push:
    branches: [expansion/brescia-2026-09-12]
    paths: [.github/workflows/brescia-order-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/brescia-2026-09-12
      - name: Patch reviewed sheet orders
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/white_list_archive/parsers/brescia_openxml.py')
          s = p.read_text()
          s = s.replace('_EXPECTED_SHEETS = ["Foglio1", "Foglio3", "Foglio2"]', '_EXPECTED_LISTED_SHEETS = ["Foglio1", "Foglio3", "Foglio2"]\n_EXPECTED_APPLICANT_SHEETS = ["Foglio1", "Foglio2", "Foglio3"]', 1)
          marker = 'def parse_brescia_applicants('
          a, b = s.split(marker, 1)
          a = a.replace('_EXPECTED_SHEETS', '_EXPECTED_LISTED_SHEETS')
          b = b.replace('_EXPECTED_SHEETS', '_EXPECTED_APPLICANT_SHEETS')
          p.write_text(a + marker + b)
          t = Path('tests/test_brescia_parser_semantics.py')
          q = t.read_text()
          q = q.replace('def _workbook() -> tuple[openpyxl.Workbook, openpyxl.worksheet.worksheet.Worksheet]:\n    workbook = openpyxl.Workbook()\n    ws = workbook.active\n    ws.title = "Foglio1"\n    workbook.create_sheet("Foglio3")\n    workbook.create_sheet("Foglio2")\n    return workbook, ws', 'def _workbook(*, applicant: bool = False) -> tuple[openpyxl.Workbook, openpyxl.worksheet.worksheet.Worksheet]:\n    workbook = openpyxl.Workbook()\n    ws = workbook.active\n    ws.title = "Foglio1"\n    if applicant:\n        workbook.create_sheet("Foglio2")\n        workbook.create_sheet("Foglio3")\n    else:\n        workbook.create_sheet("Foglio3")\n        workbook.create_sheet("Foglio2")\n    return workbook, ws', 1)
          q = q.replace('path = tmp_path / "applicants.xlsx"\n    workbook, ws = _workbook()', 'path = tmp_path / "applicants.xlsx"\n    workbook, ws = _workbook(applicant=True)', 1)
          if '_EXPECTED_SHEETS' in p.read_text():
              raise SystemExit('old sheet-order constant remains')
          if 'workbook, ws = _workbook(applicant=True)' not in q:
              raise SystemExit('applicant fixture order was not patched')
          t.write_text(q)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add src/white_list_archive/parsers/brescia_openxml.py tests/test_brescia_parser_semantics.py
          git commit -m 'Fix Brescia applicant workbook order'
          git push origin HEAD:expansion/brescia-2026-09-12
