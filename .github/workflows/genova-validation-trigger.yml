name: Trigger Genova parser validation

on:
  push:
    branches:
      - expansion/genova-2026-09-12
    paths:
      - .github/workflows/genova-validation-trigger.yml

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/genova-2026-09-12
      - name: Touch validation workflow without changing assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/genova-parser-validation.yml')
          text = path.read_text(encoding='utf-8')
          old = '# Re-run the unchanged evidence-pinned assertions after the reviewed legend-row exclusion.\n'
          new = '# Re-run the unchanged evidence-pinned assertions after restoring the validated strict Roman section grammar.\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected validation trigger comment')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/genova-parser-validation.yml
          git diff --cached --check
          git commit -m 'Revalidate Genova strict section grammar'
          git push origin HEAD:expansion/genova-2026-09-12
