name: Foggia registered production gate

on:
  push:
    branches:
      - expansion/foggia-2026-09-13
    paths:
      - .github/workflows/foggia-parser-hotfix.yml

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/foggia-2026-09-13
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute reviewed literal Foggia transaction with durable diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import traceback

          diagnostic = Path('tmp/foggia_gate_failure.txt')
          diagnostic.unlink(missing_ok=True)
          transaction = Path('.github/workflows/foggia-production-materialise.yml').read_text(encoding='utf-8')
          expected = [
              'Install complete test runtime',
              'Materialise permanent Foggia integration',
              'Run full repository test suite',
              'Build and validate Foggia national candidate',
              'Commit validated permanent integration',
          ]

          def literal_run(name: str) -> str:
              block_marker = f'      - name: {name}\n        run: |\n'
              scalar_marker = f'      - name: {name}\n        run: '
              block_count = transaction.count(block_marker)
              scalar_count = transaction.count(scalar_marker) - block_count
              if block_count == 1 and scalar_count == 0:
                  tail = transaction.split(block_marker, 1)[1]
                  boundary = tail.find('\n      - name: ')
                  block = tail if boundary < 0 else tail[:boundary]
                  out = []
                  for line in block.splitlines():
                      out.append(line[10:] if line.startswith('          ') else line)
                  return '\n'.join(out).rstrip() + '\n'
              if block_count == 0 and scalar_count == 1:
                  tail = transaction.split(scalar_marker, 1)[1]
                  command = tail.split('\n', 1)[0].strip()
                  if not command:
                      raise RuntimeError(f'empty scalar transaction step: {name!r}')
                  return command + '\n'
              raise RuntimeError(
                  f'Foggia transaction marker drift for {name!r}: block={block_count}, scalar={scalar_count}'
              )

          governance_sync = r'''python - <<'PY2'
          import csv
          import json
          from pathlib import Path

          catalog = Path('data/catalog.csv')
          with catalog.open(encoding='utf-8', newline='') as handle:
              reader = csv.DictReader(handle)
              fieldnames = reader.fieldnames
              rows = list(reader)
          targets = {'verified-primary-pages': '40', 'source-series-inventory': '76'}
          found = set()
          for row in rows:
              if row['dataset_id'] in targets:
                  row['record_count'] = targets[row['dataset_id']]
                  found.add(row['dataset_id'])
          if found != set(targets):
              raise SystemExit(f'catalog governance targets drifted: {found!r}')
          with catalog.open('w', encoding='utf-8', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one governance invariant {old!r}, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('tests/test_source_registry.py', '    assert len(pages) == 39\n', '    assert len(pages) == 40\n')
          replace_once('tests/test_source_population_coverage.py', '    assert report["verified_authority_count"] == 39\n', '    assert report["verified_authority_count"] == 40\n')
          replace_once('tests/test_source_population_coverage.py', '    assert report["register_scope_count"] == 40\n', '    assert report["register_scope_count"] == 41\n')
          replace_once('tests/test_source_population_coverage.py', '    assert report["complete_register_scope_count"] == 38\n', '    assert report["complete_register_scope_count"] == 39\n')

          coverage_path = Path('data/monitoring/national_coverage.json')
          coverage = json.loads(coverage_path.read_text(encoding='utf-8'))
          foggia_rows = [row for row in coverage['prefectures'] if row.get('authority_key') == 'foggia']
          if len(foggia_rows) != 1:
              raise SystemExit(f'Foggia coverage-row cardinality drift: {len(foggia_rows)}')
          foggia = foggia_rows[0]
          baseline = {
              'coverage_status': 'SOURCE_IDENTIFIED',
              'source_verified': False,
              'current_edition_identified': None,
              'capture_implemented': False,
              'parser_implemented': False,
              'parser_validated': False,
              'company_observations_loaded': False,
              'public_export_enabled': False,
              'population_scopes_complete': False,
              'known_content_sha256': [],
          }
          drift = {key: (foggia.get(key), value) for key, value in baseline.items() if foggia.get(key) != value}
          if drift:
              raise SystemExit(f'Foggia source-identified baseline drift before validated advancement: {drift!r}')
          foggia.update({
              'official_landing_page': 'https://prefettura.interno.gov.it/it/prefetture/foggia/evidenza/white-list',
              'source_verified': True,
              'current_edition_identified': True,
              'capture_implemented': True,
              'parser_implemented': True,
              'parser_validated': True,
              'company_observations_loaded': True,
              'observation_layer': 'public_source_observations',
              'canonical_integration_validated': False,
              'public_export_enabled': True,
              'durable_evidence_verified': False,
              'population_scopes_complete': True,
              'latest_source_reference_date': '2026-09-10',
              'last_successful_investigation_on': '2026-09-13',
              'unresolved_issue': ['Canonical hosted-database integration and independent durable-evidence verification remain governed under #16; public source observations are validated independently of that infrastructure.'],
              'actionable_issue': False,
              'coverage_status': 'VALIDATED',
              'terminal_reason': None,
              'completion_evidence': [
                  'docs/sources/foggia-operational-check-2026-09-13.md',
                  'src/white_list_archive/parsers/foggia_tables.py',
                  'tests/test_foggia_parser_semantics.py',
                  'data/publication/multi_prefecture_pilot.json',
              ],
              'known_content_sha256': [
                  '313828d0d7fc0797920697841411503230a1a569e1eb8d41f93aec15908e5d5a',
                  'd76eab040fcb984dbabbff740296f9cd30b41ef028ba756d210d4b7d7df2f6d5',
              ],
              'evidence': [
                  'data/source_registry/verified_primary_pages.csv',
                  'data/source_registry/source_series_inventory.csv',
                  'data/publication/multi_prefecture_pilot.json',
                  'docs/sources/foggia-operational-check-2026-09-13.md',
              ],
              'last_completed_coverage_stage': 'VALIDATED',
          })
          coverage_path.write_text(json.dumps(coverage, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY2'''

          try:
              scripts = [(name, literal_run(name)) for name in expected]
              for name, script in scripts:
                  if name == 'Run full repository test suite':
                      sync = subprocess.run(
                          governance_sync, shell=True, executable='/bin/bash', text=True,
                          stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                      )
                      print('::group::Synchronise expansion governance invariants')
                      print(sync.stdout)
                      print('::endgroup::')
                      if sync.returncode:
                          raise RuntimeError(
                              f'step="Synchronise expansion governance invariants" returncode={sync.returncode}\nOUTPUT:\n{sync.stdout[-30000:]}'
                          )
                  if name == 'Commit validated permanent integration':
                      script = script.replace(
                          'git diff --cached --check\n',
                          'git add data/catalog.csv tests/test_source_population_coverage.py tests/test_source_registry.py\ngit diff --cached --check\n',
                          1,
                      )
                  result = subprocess.run(
                      script, shell=True, executable='/bin/bash', text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                  )
                  print(f'::group::{name}')
                  print(result.stdout)
                  print('::endgroup::')
                  if result.returncode:
                      raise RuntimeError(
                          f'step={name!r} returncode={result.returncode}\nOUTPUT:\n{result.stdout[-30000:]}'
                      )
          except BaseException:
              diagnostic.parent.mkdir(parents=True, exist_ok=True)
              diagnostic.write_text(traceback.format_exc(), encoding='utf-8')
              subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git','add',str(diagnostic)], check=True)
              subprocess.run(['git','commit','-m','Record Foggia integration gate failure'], check=True)
              subprocess.run(['git','push','origin','HEAD:expansion/foggia-2026-09-13'], check=True)
              raise
          PY
