name: Foggia registered production gate

on:
  push:
    branches:
      - expansion/foggia-2026-09-13
    paths:
      - .github/workflows/foggia-parser-hotfix.yml

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/foggia-2026-09-13
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute the reviewed Foggia transaction specification
        run: |
          python -m pip install --quiet PyYAML
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          path = Path('.github/workflows/foggia-production-materialise.yml')
          spec = yaml.safe_load(path.read_text(encoding='utf-8'))
          steps = spec['jobs']['materialise']['steps']
          run_steps = [step for step in steps if 'run' in step]
          expected = [
              'Install complete test runtime',
              'Materialise permanent Foggia integration',
              'Run full repository test suite',
              'Build and validate Foggia national candidate',
              'Commit validated permanent integration',
          ]
          names = [step.get('name') for step in run_steps]
          if names != expected:
              raise SystemExit(f'Foggia transaction step drift: {names!r}')
          for step in run_steps:
              print(f"::group::{step['name']}", flush=True)
              subprocess.run(step['run'], shell=True, executable='/bin/bash', check=True)
              print('::endgroup::', flush=True)
          PY
