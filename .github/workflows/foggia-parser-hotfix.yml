name: Foggia production finaliser

on:
  push:
    branches:
      - expansion/foggia-2026-09-13
    paths:
      - .github/workflows/foggia-parser-hotfix.yml

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/foggia-2026-09-13
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validation runtime
        run: |
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends poppler-utils; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Validation runtime installation failed after bounded retries' >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[publication,dev,storage,database]'
      - name: Raise permanent Foggia publication gates
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          pages = '.github/workflows/public-pages.yml'
          replace_once(pages, "      - 'src/white_list_archive/parsers/genova_tables.py'\n", "      - 'src/white_list_archive/parsers/genova_tables.py'\n      - 'src/white_list_archive/parsers/foggia_tables.py'\n")
          replace_once(pages, "          assert reg['meta']['record_count'] == 29600\n", "          assert reg['meta']['record_count'] == 30558\n")
          replace_once(pages, "'caserta','catania','genova'}\n", "'caserta','catania','genova','foggia'}\n")
          replace_once(pages, "'caserta-ordinary','catania-ordinary','genova-ordinary'\n", "'caserta-ordinary','catania-ordinary','genova-ordinary','foggia-ordinary'\n")
          replace_once(pages, "          assert reg['meta']['authority_count'] == 30\n", "          assert reg['meta']['authority_count'] == 31\n")
          replace_once(pages, "          assert reg['meta']['register_count'] == 31\n", "          assert reg['meta']['register_count'] == 32\n")
          replace_once(pages, "          assert pref['meta']['published_count'] == 30\n", "          assert pref['meta']['published_count'] == 31\n")
          replace_once(pages, "          assert pref['meta']['mapped_count'] == 39\n", "          assert pref['meta']['mapped_count'] == 40\n")
          replace_once(
              pages,
              "          genova = [x for x in pref['prefectures'] if x['authority_key'] == 'genova']\n          assert len(genova) == 1 and genova[0]['mapped'] and genova[0]['published'] and genova[0]['series_count'] == 2\n",
              "          genova = [x for x in pref['prefectures'] if x['authority_key'] == 'genova']\n          assert len(genova) == 1 and genova[0]['mapped'] and genova[0]['published'] and genova[0]['series_count'] == 2\n          foggia = [x for x in pref['prefectures'] if x['authority_key'] == 'foggia']\n          assert len(foggia) == 1 and foggia[0]['mapped'] and foggia[0]['published'] and foggia[0]['series_count'] == 2\n",
          )

          browser = 'tests/public_portal_browser.cjs'
          replace_once(browser, "      assert.ok(labels.includes('White List ordinaria · Prefettura di Genova'));\n", "      assert.ok(labels.includes('White List ordinaria · Prefettura di Genova'));\n      assert.ok(labels.includes('White List ordinaria · Prefettura di Foggia'));\n")
          replace_once(browser, '      assert.equal(stats.total,29600);\n', '      assert.equal(stats.total,30558);\n')
          replace_once(browser, "'caserta','catania','genova'].includes(r.authority_key));\n", "'caserta','catania','genova','foggia'].includes(r.authority_key));\n")
          replace_once(
              browser,
              "      const genova=registry.records.filter(r=>r.authority_key==='genova');\n      assert.equal(genova.length,762);\n      assert.equal(genova.filter(r=>r.source_key==='genova-listed').length,652);\n      assert.equal(genova.filter(r=>r.source_key==='genova-applicants').length,110);\n      assert.deepEqual(statusCounts(genova),{listed:528,pending:110,renewal_update_in_progress:124});\n",
              "      const genova=registry.records.filter(r=>r.authority_key==='genova');\n      assert.equal(genova.length,762);\n      assert.equal(genova.filter(r=>r.source_key==='genova-listed').length,652);\n      assert.equal(genova.filter(r=>r.source_key==='genova-applicants').length,110);\n      assert.deepEqual(statusCounts(genova),{listed:528,pending:110,renewal_update_in_progress:124});\n      const foggia=registry.records.filter(r=>r.authority_key==='foggia');\n      assert.equal(foggia.length,958);\n      assert.equal(foggia.filter(r=>r.source_key==='foggia-listed').length,330);\n      assert.equal(foggia.filter(r=>r.source_key==='foggia-applicants').length,628);\n      assert.deepEqual(statusCounts(foggia),{listed:85,pending:628,renewal_update_in_progress:245});\n",
          )
          PY
          git diff --check
      - name: Validate repository and national candidate
        run: |
          pytest
          rm -rf /tmp/foggia-final-sources /tmp/foggia-registry.json /tmp/foggia-registry.csv /tmp/foggia-prefectures.json /tmp/foggia-prefectures.csv
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/foggia-final-sources \
            --registry-json /tmp/foggia-registry.json \
            --registry-csv /tmp/foggia-registry.csv \
            --prefectures-json /tmp/foggia-prefectures.json \
            --prefectures-csv /tmp/foggia-prefectures.csv
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          reg = json.loads(Path('/tmp/foggia-registry.json').read_text(encoding='utf-8'))
          pref = json.loads(Path('/tmp/foggia-prefectures.json').read_text(encoding='utf-8'))
          assert reg['meta']['record_count'] == 30558
          assert reg['meta']['authority_count'] == 31
          assert reg['meta']['register_count'] == 32
          assert pref['meta']['published_count'] == 31
          assert pref['meta']['mapped_count'] == 40
          rows = [r for r in reg['records'] if r['authority_key'] == 'foggia']
          assert len(rows) == 958
          assert Counter(r['source_status'] for r in rows) == Counter({'listed': 85, 'renewal_update_in_progress': 245, 'pending': 628})
          item = [x for x in pref['prefectures'] if x['authority_key'] == 'foggia']
          assert len(item) == 1 and item[0]['mapped'] and item[0]['published'] and item[0]['series_count'] == 2
          PY
      - name: Remove expansion-only mechanisms and commit production-only branch
        run: |
          rm -f .github/workflows/foggia-*.yml
          rm -f tmp/foggia_*
          git diff --check
          if find .github/workflows -maxdepth 1 -type f -name 'foggia-*' | grep -q .; then
            echo 'Foggia temporary workflow remains' >&2
            exit 1
          fi
          if find tmp -maxdepth 1 -type f -name 'foggia_*' | grep -q .; then
            echo 'Foggia temporary artifact remains' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalise production-only Foggia integration'
          allowed=$(cat <<'EOF'
.github/workflows/public-pages.yml
data/catalog.csv
data/monitoring/national_coverage.json
data/publication/multi_prefecture_pilot.json
data/source_registry/source_series_inventory.csv
data/source_registry/verified_primary_pages.csv
docs/sources/foggia-operational-check-2026-09-13.md
src/white_list_archive/parsers/foggia_tables.py
src/white_list_archive/publishing/public_national_registry.py
tests/public_portal_browser.cjs
tests/test_foggia_parser_semantics.py
tests/test_source_population_coverage.py
tests/test_source_registry.py
EOF
          )
          actual=$(git diff --name-only origin/main...HEAD | sort)
          expected=$(printf '%s\n' "$allowed" | sort)
          if [ "$actual" != "$expected" ]; then
            echo 'Production-only file set mismatch' >&2
            echo '--- expected'; printf '%s\n' "$expected"
            echo '--- actual'; printf '%s\n' "$actual"
            exit 1
          fi
          git push origin HEAD:expansion/foggia-2026-09-13
