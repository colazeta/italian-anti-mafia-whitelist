name: ANNCSU format probe

on:
  push:
    branches:
      - research/anncsu-open-api-probe
    paths:
      - '.github/workflows/anncsu-format-probe.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download and inspect official Calabria indirizzario
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import io
          import json
          import urllib.request
          import zipfile
          from pathlib import Path

          url = 'https://anncsu.open.agenziaentrate.gov.it/age-inspire/opendata/anncsu/getds.php?INDIR_CALA'
          req = urllib.request.Request(
              url,
              headers={
                  'User-Agent': 'italian-anti-mafia-whitelist/anncsu-format-probe (+https://github.com/colazeta/italian-anti-mafia-whitelist)',
                  'Accept': 'application/octet-stream,*/*',
              },
          )
          with urllib.request.urlopen(req, timeout=120) as response:
              payload = response.read()
              headers = dict(response.headers.items())

          if not payload.startswith(b'PK'):
              raise SystemExit('ANNCSU Calabria response is not a ZIP archive')

          report = {
              'url': url,
              'bytes': len(payload),
              'sha256': hashlib.sha256(payload).hexdigest(),
              'content_disposition': headers.get('Content-Disposition'),
              'members': [],
              'csv': {},
          }

          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f'Corrupt ZIP member: {bad}')
              report['members'] = [
                  {'name': info.filename, 'size': info.file_size, 'compressed_size': info.compress_size}
                  for info in archive.infolist()
              ]
              csv_members = [i for i in archive.infolist() if i.filename.lower().endswith('.csv')]
              if len(csv_members) != 1:
                  raise SystemExit(f'Expected one CSV member, found {[i.filename for i in csv_members]}')
              info = csv_members[0]
              raw = archive.read(info)

          encoding = None
          text = None
          for candidate in ('utf-8-sig', 'utf-8', 'cp1252', 'latin-1'):
              try:
                  text = raw.decode(candidate)
                  encoding = candidate
                  break
              except UnicodeDecodeError:
                  continue
          if text is None:
              raise SystemExit('Could not decode ANNCSU CSV')

          first_lines = text.splitlines()[:10]
          dialect = csv.Sniffer().sniff('\n'.join(first_lines), delimiters=',;|\t')
          reader = csv.DictReader(io.StringIO(text), dialect=dialect)
          fieldnames = reader.fieldnames or []
          cosenza = []
          row_count = 0
          cosenza_count = 0
          cosenza_with_coordinates = 0
          method_counts = {}
          for row in reader:
              row_count += 1
              if (row.get('CODICE_COMUNE') or '').strip() == 'D086':
                  cosenza_count += 1
                  x = (row.get('COORD_X_COMUNE') or '').strip()
                  y = (row.get('COORD_Y_COMUNE') or '').strip()
                  if x and y:
                      cosenza_with_coordinates += 1
                  method = (row.get('METODO') or '').strip() or '<blank>'
                  method_counts[method] = method_counts.get(method, 0) + 1
                  if len(cosenza) < 8:
                      cosenza.append({key: row.get(key) for key in fieldnames})

          report['csv'] = {
              'member': info.filename,
              'uncompressed_bytes': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
              'encoding': encoding,
              'delimiter': dialect.delimiter,
              'fieldnames': fieldnames,
              'row_count': row_count,
              'cosenza_d086_count': cosenza_count,
              'cosenza_with_coordinate_pair': cosenza_with_coordinates,
              'cosenza_method_counts': method_counts,
              'cosenza_sample': cosenza,
          }

          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/anncsu-format-probe.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anncsu-format-probe
          path: artifacts/anncsu-format-probe.json
          if-no-files-found: error
