name: Campobasso integration gate

on:
  push:
    branches:
      - expansion/campobasso-2026-09-11
    paths:
      - .github/workflows/campobasso-integration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/campobasso-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialise Campobasso production candidate
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          ROOT=Path('.')
          landing='https://prefettura.interno.gov.it/it/prefetture/campobasso/evidenza/white-list'
          listed_url='https://prefettura.interno.gov.it/sites/default/files/21/2026-08/11-agosto-2026-elenco-delle-imprese-non-soggette-a-tentativo-di-infilt.xlsx'
          applicant_url="https://prefettura.interno.gov.it/sites/default/files/21/2026-08/11-agosto-2026-elenco-delle-imprese-richiedenti-l-iscrizione.docx"
          listed_sha='9d07423eb023025e1dd318c610a205f287a4bee165e4f7fe34e2448f8d91d2a1'
          applicant_sha='6b1b1f877a0ae5fe68d2472034975914723626a553257d4978296b3632a635ba'

          # Publication config: append exactly two independently byte-pinned source populations.
          p=ROOT/'data/publication/multi_prefecture_pilot.json'
          cfg=json.loads(p.read_text(encoding='utf-8'))
          if any(x.get('authority_key')=='campobasso' for x in cfg['sources']):
              raise SystemExit('Campobasso already present in publication config; refusing duplicate integration')
          common={
              'authority_key':'campobasso','authority_name':'Prefettura di Campobasso',
              'register_key':'campobasso-ordinary','register_name':'White List ordinaria',
              'reference_date':'2026-08-11','source_page_url':landing,
              'last_source_update':'2026-08-11',
              'last_source_update_basis':'current official landing page directly verified 11 September 2026; both attachments are explicitly dated 11 August 2026',
          }
          cfg['sources'].extend([
              {**common,'source_key':'campobasso-listed','parser':'campobasso_listed','population_scope':'listed',
               'resource_url':listed_url,'sha256':listed_sha,'expected_source_rows':323,'expected_sector_rows':882,
               'notes':'Current byte-pinned XLSX listed-company publication. Ten statutory White List sections contain 882 reviewed section rows, conservatively grouped to 323 observations (276 listed; 47 renewal/update in progress). Province-only source placeholders such as ==/CB/blank are not treated as identity changes; substantive registered-office differences remain separate. Malformed source identifiers remain raw and are never reconstructed. Exact evidence is documented in docs/sources/campobasso-operational-check-2026-09-11.md.'},
              {**common,'source_key':'campobasso-applicants','parser':'campobasso_applicants','population_scope':'applicant',
               'resource_url':applicant_url,'sha256':applicant_sha,'expected_source_rows':19,
               'notes':'Current byte-pinned DOCX applicant publication positively identified by the official landing page. One table with a repeated header contains exactly 19 applicant observations, all represented as pending. Italian written-month dates are accepted only through the audited strict month map; malformed or absent values are never inferred. Exact evidence is documented in docs/sources/campobasso-operational-check-2026-09-11.md.'},
          ])
          p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Verified official primary page: add one authority, preserving uniqueness and alphabetical order.
          p=ROOT/'data/source_registry/verified_primary_pages.csv'
          with p.open(newline='',encoding='utf-8') as f:
              rows=list(csv.DictReader(f)); fields=list(rows[0])
          if any(r['authority_key']=='campobasso' for r in rows):
              raise SystemExit('Campobasso verified primary page already exists')
          rows.append({'authority_key':'campobasso','landing_url':landing,'verification_date':'2026-09-11','verification_status':'verified'})
          rows.sort(key=lambda r:r['authority_key'])
          with p.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)

          # Source-series inventory: positive evidence for both logical populations, no negative inference.
          p=ROOT/'data/source_registry/source_series_inventory.csv'
          with p.open(newline='',encoding='utf-8') as f:
              rows=list(csv.DictReader(f)); fields=list(rows[0])
          if any(r['authority_key']=='campobasso' for r in rows):
              raise SystemExit('Campobasso source series already exists; refusing ambiguous upsert')
          rows.extend([
              {'source_series_key':'campobasso-applicants','authority_key':'campobasso','regime_code':'WL-REGIME-L190-2012','population_scope':'applicant','sector_scope':'all','publication_model':'periodic_attachment','series_url':landing,'resource_resolution_status':'landing_page_resolved','verified_date':'2026-09-11','notes':'Current official landing page directly verified 11 September 2026; it positively exposes the applicant DOCX explicitly dated 11 August 2026. Exact byte identity and parser boundary are documented in docs/sources/campobasso-operational-check-2026-09-11.md.'},
              {'source_series_key':'campobasso-listed','authority_key':'campobasso','regime_code':'WL-REGIME-L190-2012','population_scope':'listed','sector_scope':'all','publication_model':'periodic_attachment','series_url':landing,'resource_resolution_status':'landing_page_resolved','verified_date':'2026-09-11','notes':'Current official landing page directly verified 11 September 2026; it positively exposes the listed-company XLSX explicitly dated 11 August 2026. Exact byte identity, 882 section-row denominator and conservative grouping boundary are documented in docs/sources/campobasso-operational-check-2026-09-11.md.'},
          ])
          rows.sort(key=lambda r:r['source_series_key'])
          with p.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)

          # Catalogue denominators change only because one verified page and two qualified series are added.
          p=ROOT/'data/catalog.csv'
          with p.open(newline='',encoding='utf-8') as f:
              rows=list(csv.DictReader(f)); fields=list(rows[0])
          by_id={r['dataset_id']:r for r in rows}
          assert by_id['verified-primary-pages']['record_count']=='36'
          assert by_id['source-series-inventory']['record_count']=='68'
          by_id['verified-primary-pages']['record_count']='37'
          by_id['source-series-inventory']['record_count']='70'
          with p.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)

          # Governance denominator tests: Campobasso adds one complete ordinary-register scope.
          p=ROOT/'tests/test_source_registry.py'; text=p.read_text(encoding='utf-8')
          old='assert len(pages) == 36'; new='assert len(pages) == 37'
          if text.count(old)!=1: raise SystemExit('source-registry denominator anchor drift')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          p=ROOT/'tests/test_source_population_coverage.py'; text=p.read_text(encoding='utf-8')
          for old,new in [('verified_authority_count\"] == 36','verified_authority_count\"] == 37'),('register_scope_count\"] == 37','register_scope_count\"] == 38'),('complete_register_scope_count\"] == 35','complete_register_scope_count\"] == 36')]:
              if text.count(old)!=1: raise SystemExit(f'population denominator anchor drift: {old}')
              text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')

          # Coverage state: only evidence-backed stages are advanced; durable evidence remains separately unresolved.
          p=ROOT/'data/monitoring/national_coverage.json'; cov=json.loads(p.read_text(encoding='utf-8'))
          matches=[x for x in cov['prefectures'] if x['authority_key']=='campobasso']
          if len(matches)!=1: raise SystemExit('Campobasso coverage row is not unique')
          row=matches[0]
          if row['coverage_status']!='SOURCE_IDENTIFIED': raise SystemExit(f"Unexpected prior Campobasso coverage state: {row['coverage_status']}")
          row.update({
              'source_verified':True,'current_edition_identified':True,'capture_implemented':True,
              'parser_implemented':True,'parser_validated':True,'company_observations_loaded':True,
              'observation_layer':'public_source_observations','canonical_integration_validated':False,
              'public_export_enabled':True,'durable_evidence_verified':False,'population_scopes_complete':True,
              'latest_source_reference_date':'2026-08-11','latest_archived_edition':None,
              'archived_evidence_storage_status':'not_documented','last_successful_source_check_at':'2026-09-11T21:22:38Z',
              'last_attempted_source_check_at':'2026-09-11T21:22:38Z','last_content_change_at':None,
              'last_successful_investigation_on':'2026-09-11','monitoring_status':'CURRENT',
              'unresolved_issue':['Canonical hosted-database integration and independent durable-evidence verification remain governed under #16; public source observations are validated independently of that infrastructure.'],
              'actionable_issue':False,'coverage_status':'VALIDATED','terminal_reason':None,
              'completion_evidence':['docs/sources/campobasso-operational-check-2026-09-11.md','src/white_list_archive/parsers/campobasso_openxml.py','tests/test_campobasso_parser_semantics.py','data/publication/multi_prefecture_pilot.json'],
              'known_content_sha256':[listed_sha,applicant_sha],
              'evidence':['data/source_registry/verified_primary_pages.csv','data/source_registry/source_series_inventory.csv','data/publication/multi_prefecture_pilot.json','docs/sources/campobasso-operational-check-2026-09-11.md'],
              'last_completed_coverage_stage':'VALIDATED',
          })
          p.write_text(json.dumps(cov,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Register the parser family in the national publication build.
          p=ROOT/'src/white_list_archive/publishing/public_national_registry.py'; text=p.read_text(encoding='utf-8')
          import_anchor='from white_list_archive.parsers.crotone_tables import PARSERS as CROTONE_PARSERS\n'
          if text.count(import_anchor)!=1: raise SystemExit('national parser import anchor drift')
          text=text.replace(import_anchor,import_anchor+'from white_list_archive.parsers.campobasso_openxml import PARSERS as CAMPOBASSO_PARSERS\n',1)
          dispatch_anchor='        or CROTONE_PARSERS.get(cfg["parser"])\n'
          if text.count(dispatch_anchor)!=1: raise SystemExit('national parser dispatch anchor drift')
          text=text.replace(dispatch_anchor,dispatch_anchor+'        or CAMPOBASSO_PARSERS.get(cfg["parser"])\n',1)
          p.write_text(text,encoding='utf-8')

          # Browser acceptance: freeze new total and authority-specific source semantics.
          p=ROOT/'tests/public_portal_browser.cjs'; text=p.read_text(encoding='utf-8')
          label="      assert.ok(labels.includes('White List ordinaria · Prefettura di Crotone'));\n"
          if text.count(label)!=1: raise SystemExit('browser label anchor drift')
          text=text.replace(label,label+"      assert.ok(labels.includes('White List ordinaria · Prefettura di Campobasso'));\n",1)
          if text.count('assert.equal(stats.total,19826);')!=1: raise SystemExit('browser total anchor drift')
          text=text.replace('assert.equal(stats.total,19826);','assert.equal(stats.total,20168);',1)
          old="'cagliari','caltanissetta','crotone'].includes(r.authority_key)"
          new="'cagliari','caltanissetta','crotone','campobasso'].includes(r.authority_key)"
          if text.count(old)!=1: raise SystemExit('browser previous-baseline anchor drift')
          text=text.replace(old,new,1)
          anchor="      const pm=crotone.filter(r=>r.name==='PM COSTRUZIONI S.R.L.');\n"
          block="""      const campobasso=registry.records.filter(r=>r.authority_key==='campobasso');
      assert.equal(campobasso.length,342);
      assert.equal(campobasso.filter(r=>r.source_key==='campobasso-listed').length,323);
      assert.equal(campobasso.filter(r=>r.source_key==='campobasso-applicants').length,19);
      assert.deepEqual(statusCounts(campobasso),{listed:276,pending:19,renewal_update_in_progress:47});
      assert.ok(campobasso.some(r=>r.identifier_field_raw==='880470703'&&r.identifiers.length===0));
"""
          if text.count(anchor)!=1: raise SystemExit('browser Crotone anomaly anchor drift')
          text=text.replace(anchor,block+anchor,1)
          p.write_text(text,encoding='utf-8')

          doc=ROOT/'docs/sources/campobasso-operational-check-2026-09-11.md'
          if doc.exists(): raise SystemExit('Campobasso source-check doc already exists')
          doc.write_text('''# Campobasso operational source check — 11 September 2026

## Current official evidence

The current official Prefettura di Campobasso White List landing page was directly verified on 11 September 2026. It positively exposes two distinct current populations, both explicitly dated **11 August 2026**: the registered-company list and the applicant-company list. No absence or completeness claim is inferred from search failure.

- Landing page: https://prefettura.interno.gov.it/it/prefetture/campobasso/evidenza/white-list
- Listed XLSX SHA-256: `9d07423eb023025e1dd318c610a205f287a4bee165e4f7fe34e2448f8d91d2a1` (380,550 bytes).
- Applicant DOCX SHA-256: `6b1b1f877a0ae5fe68d2472034975914723626a553257d4978296b3632a635ba` (28,695 bytes).

## Listed population

The XLSX contains one worksheet with ten stacked statutory White List sections. The frozen physical denominator is **882 section rows**: I 134; II 60; III 199; IV 51; V 179; VI 107; VII 31; VIII 19; IX 19; X 83.

Conservative grouping on exact company name, registered office, secondary office, raw identifier, registration date and expiry date yields **323 company observations**: **276 `listed`** and **47 `renewal_update_in_progress`**. Province is deliberately excluded from the grouping key only because the audited source uses `==`, `CB` and blank province cells inconsistently for otherwise exact repeated observations. Registered-office differences remain identity-relevant and are never fuzzy-merged.

The update column contains 741 blank row values, 132 exact `SI` values and 9 `SI (non richiesto per questa sezione)` values. No semantic group is classified as update-in-progress solely from the scoped note: every grouped observation carrying that note also contains an explicit plain `SI` occurrence.

Malformed source identifiers remain raw. The audit observed 53 malformed-identifier row occurrences (51 ten-digit and 2 nine-digit); examples include `1933960708`, `1910940707`, `1821800701`, `880470703` and `895390706`. No digit is added, removed or guessed.

## Applicant population

The current DOCX contains one table and exactly **19 applicant company rows**, with the header repeated twice. The population is positively identified by the official page as companies requesting registration; all 19 observations are therefore represented as `pending`. No duplicate applicant rows were found and no applicant identifier required reconstruction.

Application dates use Italian written month names (for example `14 novembre 2025` and `07 agosto 2026`). The parser accepts only the explicitly reviewed Italian month-name mapping and fails closed on unreviewed date typography or invalid calendar dates.

## Publication and validation boundary

The parser freezes the current worksheet/table structure, ten section denominators, semantic-group count, status counts, repeated applicant headers and exact source hashes. Unknown status text, duplicate rows within a statutory section, source hash drift, unexpected worksheet/table structure, unreviewed dates or denominator drift fail closed. Address normalisation is conservative and no missing identity, address, legal status or population evidence is inferred.

The resulting public candidate contributes **342 source observations**: 323 listed-population observations and 19 applicant observations. Canonical hosted-database integration and independently durable evidence remain governed separately under issue #16 and are not claimed by this source/publication validation.
''',encoding='utf-8')
          PY
          git diff --check
          git status --short
      - name: Install full validation runtime
        run: |
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends poppler-utils; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[dev,publication,storage,database]'
      - name: Run full repository tests
        run: python -m pytest -q
      - name: Validate Campobasso national public candidate
        run: |
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/public-national-sources \
            --registry-json public-site/data/registry.json \
            --registry-csv public-site/data/registry.csv \
            --prefectures-json public-site/data/prefectures.json \
            --prefectures-csv public-site/data/prefectures.csv
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('public-site/data/registry.json').read_text())
          pref=json.loads(Path('public-site/data/prefectures.json').read_text())
          assert reg['meta']['record_count']==20168
          assert reg['meta']['authority_count']==25
          assert reg['meta']['register_count']==26
          assert pref['meta']['published_count']==25
          assert pref['meta']['mapped_count']==36
          cb=[r for r in reg['records'] if r['authority_key']=='campobasso']
          assert len(cb)==342
          print('Campobasso national candidate validated:',reg['meta']['record_count'],reg['meta']['authority_count'],reg['meta']['register_count'],pref['meta']['mapped_count'])
          PY
      - name: Commit production candidate only
        run: |
          git checkout -- public-site/data/registry.json public-site/data/registry.csv public-site/data/prefectures.json public-site/data/prefectures.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/catalog.csv \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            data/source_registry/verified_primary_pages.csv \
            docs/sources/campobasso-operational-check-2026-09-11.md \
            src/white_list_archive/publishing/public_national_registry.py \
            tests/public_portal_browser.cjs \
            tests/test_source_population_coverage.py \
            tests/test_source_registry.py
          git diff --cached --check
          git commit -m 'Integrate Campobasso public archive'
          git push origin HEAD:expansion/campobasso-2026-09-11
