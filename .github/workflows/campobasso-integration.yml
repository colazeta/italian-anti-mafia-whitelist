name: Campobasso integration gate

on:
  push:
    branches:
      - expansion/campobasso-2026-09-11
    paths:
      - .github/workflows/campobasso-integration.yml
      - tmp/campobasso_integration.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/campobasso-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialise Campobasso production candidate
        run: |
          python tmp/campobasso_integration.py
          python - <<'PY'
          from pathlib import Path
          for name in (
              "data/catalog.csv",
              "data/source_registry/source_series_inventory.csv",
              "data/source_registry/verified_primary_pages.csv",
          ):
              path = Path(name)
              path.write_bytes(path.read_bytes().replace(b"\r\n", b"\n"))
          PY
          git diff --check
          git status --short
      - name: Install full validation runtime
        run: |
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends poppler-utils; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[dev,publication,storage,database]'
      - name: Run full repository tests
        run: |
          set +e
          python -m pytest -q --junitxml=/tmp/campobasso-pytest.xml 2>&1 | tee /tmp/campobasso-pytest.log
          rc=${PIPESTATUS[0]}
          set -e
          exit "$rc"
      - name: Validate Campobasso national public candidate
        run: |
          set +e
          rc=1
          for attempt in 1 2; do
            log="/tmp/campobasso-national-build-attempt-${attempt}.log"
            PYTHONUNBUFFERED=1 white-list-public-national-build \
              --source-config data/publication/multi_prefecture_pilot.json \
              --verified-pages data/source_registry/verified_primary_pages.csv \
              --source-series data/source_registry/source_series_inventory.csv \
              --authority-aliases data/source_registry/national_index_authority_aliases.csv \
              --work-dir /tmp/public-national-sources \
              --registry-json public-site/data/registry.json \
              --registry-csv public-site/data/registry.csv \
              --prefectures-json public-site/data/prefectures.json \
              --prefectures-csv public-site/data/prefectures.csv \
              2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then
              break
            fi
            if grep -Eqi 'HTTP Error (403|408|429|5[0-9][0-9])|timed out|timeout|URLError|Temporary failure|Connection reset|Remote end closed connection' "$log"; then
              echo "Transient source/network failure detected; bounded retry $attempt/2" >&2
              sleep $((attempt * 5))
              continue
            fi
            echo "Non-transient national build failure; not retrying" >&2
            break
          done
          set -e
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('public-site/data/registry.json').read_text())
          pref=json.loads(Path('public-site/data/prefectures.json').read_text())
          assert reg['meta']['record_count']==20168
          assert reg['meta']['authority_count']==25
          assert reg['meta']['register_count']==26
          assert pref['meta']['published_count']==25
          assert pref['meta']['mapped_count']==36
          cb=[r for r in reg['records'] if r['authority_key']=='campobasso']
          assert len(cb)==342
          print('Campobasso national candidate validated:',reg['meta']['record_count'],reg['meta']['authority_count'],reg['meta']['register_count'],pref['meta']['mapped_count'])
          PY
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: campobasso-integration-failure-attempt-${{ github.run_attempt }}
          path: |
            /tmp/campobasso-pytest.log
            /tmp/campobasso-pytest.xml
            /tmp/campobasso-national-build-attempt-*.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit production candidate only
        run: |
          git checkout -- public-site/data/registry.json public-site/data/registry.csv public-site/data/prefectures.json public-site/data/prefectures.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/catalog.csv \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            data/source_registry/verified_primary_pages.csv \
            docs/sources/campobasso-operational-check-2026-09-11.md \
            src/white_list_archive/publishing/public_national_registry.py \
            tests/public_portal_browser.cjs \
            tests/test_source_population_coverage.py \
            tests/test_source_registry.py
          git diff --cached --check
          git commit -m 'Integrate Campobasso public archive'
          git push origin HEAD:expansion/campobasso-2026-09-11
