name: Udine production retry 2026-09-11

on:
  push:
    branches: [expansion/udine-2026-09-10]

permissions:
  contents: write

jobs:
  retry:
    if: github.event.head_commit.message == 'Retry Udine production materialisation'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/udine-2026-09-10
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute previously validated finalizer steps
        shell: bash
        run: |
          python -m pip install -q pyyaml
          python - <<'PY'
          import os, subprocess, yaml
          from pathlib import Path
          workflow=yaml.safe_load(Path('.github/workflows/udine-production-finalizer-2026-09-10.yml').read_text())
          wanted={
              'Install complete validation runtime',
              'Re-verify official sources and materialize Udine production metadata',
              'Validate parser, repository and complete national build',
          }
          steps=workflow['jobs']['finalize']['steps']
          found=[]
          for step in steps:
              name=step.get('name')
              if name in wanted:
                  found.append(name)
                  subprocess.run(step['run'], shell=True, executable='/bin/bash', check=True, env=os.environ.copy())
          assert set(found)==wanted, found
          PY
      - name: Commit validated non-workflow production state
        shell: bash
        run: |
          sed -i 's/\r$//' data/source_registry/source_series_inventory.csv data/source_registry/verified_primary_pages.csv
          git restore .github/workflows/public-pages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/white_list_archive/publishing/public_national_registry.py data/publication/multi_prefecture_pilot.json data/source_registry/source_series_inventory.csv data/source_registry/verified_primary_pages.csv data/monitoring/national_coverage.json tests/public_portal_browser.cjs
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)"
          git commit -m 'Materialize Udine validated production state'
          git push origin HEAD:expansion/udine-2026-09-10
