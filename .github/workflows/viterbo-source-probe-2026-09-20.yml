name: Viterbo source probe 2026-09-20

on:
  push:
    branches:
      - expansion/viterbo-2026-09-20
    paths:
      - .github/workflows/viterbo-source-probe-2026-09-20.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viterbo-source-probe-2026-09-20
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe official landing and positive source populations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import html
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser

          LANDING = 'https://prefettura.interno.gov.it/it/prefetture/viterbo/elenco-imprese-richiedenti-iscrizione-elenco-imprese-iscritte'
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'

          def get(url, attempt_tag):
              last = None
              for i in range(3):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              'User-Agent': UA,
                              'Accept': '*/*',
                              'Cache-Control': 'no-cache',
                              'Pragma': 'no-cache',
                              'X-White-List-Probe': f'{attempt_tag}-{i}',
                          },
                      )
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return r.geturl(), r.headers.get_content_type(), r.read()
                  except Exception as exc:
                      last = repr(exc)
                      time.sleep(i + 1)
              raise RuntimeError(f'GET failed {url}: {last}')

          class Anchors(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.items=[]
                  self.href=None
                  self.text=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'a':
                      self.href=dict(attrs).get('href')
                      self.text=[]
              def handle_data(self, data):
                  if self.href is not None:
                      self.text.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == 'a' and self.href is not None:
                      txt=' '.join(''.join(self.text).split())
                      self.items.append((txt,self.href))
                      self.href=None
                      self.text=[]

          final, ctype, raw = get(LANDING, 'landing-a')
          final2, ctype2, raw2 = get(LANDING + ('&' if '?' in LANDING else '?') + 'wl_probe=2', 'landing-b')
          print('LANDING', json.dumps({
              'url': final,
              'content_type': ctype,
              'bytes': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
              'second_bytes': len(raw2),
              'second_sha256': hashlib.sha256(raw2).hexdigest(),
              'byte_identical': raw == raw2,
          }, sort_keys=True))

          p=Anchors(); p.feed(raw.decode('utf-8','replace'))
          candidates=[]
          for text, href in p.items:
              t=html.unescape(text).lower()
              u=urllib.parse.urljoin(final, html.unescape(href))
              if ('richiedent' in t or 'iscritt' in t or 'richiedent' in u.lower() or 'iscritt' in u.lower()):
                  if '/sites/default/files/' in u or re.search(r'\.(pdf|xlsx?|docx?)(?:\?|$)',u,re.I):
                      candidates.append((text,u))
          # Preserve order while de-duplicating URLs.
          seen=set(); candidates=[x for x in candidates if not (x[1] in seen or seen.add(x[1]))]
          print('CANDIDATES', json.dumps(candidates, ensure_ascii=False))
          if len(candidates) < 2:
              # Print all same-domain downloadable anchors for diagnosis; do not infer absence.
              all_downloads=[]
              for text, href in p.items:
                  u=urllib.parse.urljoin(final, html.unescape(href))
                  if '/sites/default/files/' in u:
                      all_downloads.append((text,u))
              print('ALL_DOWNLOADS', json.dumps(all_downloads, ensure_ascii=False))
              raise RuntimeError('fewer than two positively identified listed/applicant attachment candidates')

          outputs=[]
          for text, url in candidates:
              u1, ct1, b1=get(url, 'source-a')
              sep='&' if '?' in url else '?'
              u2, ct2, b2=get(url+sep+'wl_probe=2', 'source-b')
              item={
                  'anchor_text': text,
                  'url': u1,
                  'content_type': ct1,
                  'bytes': len(b1),
                  'sha256': hashlib.sha256(b1).hexdigest(),
                  'second_bytes': len(b2),
                  'second_sha256': hashlib.sha256(b2).hexdigest(),
                  'byte_identical': b1 == b2,
                  'magic_hex': b1[:8].hex(),
              }
              outputs.append(item)
              print('SOURCE', json.dumps(item, ensure_ascii=False, sort_keys=True))
          if not all(x['byte_identical'] for x in outputs):
              raise RuntimeError('independent source acquisitions were not byte-identical')
          labels=' '.join(x['anchor_text'].lower() for x in outputs)
          if 'richiedent' not in labels or 'iscritt' not in labels:
              raise RuntimeError('positive listed/applicant labels not both established')
          PY
