name: Genova section typography audit
on:
  push:
    branches: [expansion/genova-2026-09-12]
    paths: [.github/workflows/genova-section-audit.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/genova-2026-09-12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pdfplumber
      - name: Enumerate section-field anomalies
        run: |
          python - <<'PY'
          import collections, hashlib, json, pathlib, re, tempfile, requests, pdfplumber
          src=json.loads(pathlib.Path('tmp/genova_source_profile.json').read_text())
          session=requests.Session(); session.headers.update({'User-Agent':'italian-anti-mafia-whitelist section audit/1.0'})
          canonical=re.compile(r'^(?:Sez\.\s*(?:X|IX|VIII|VII|VI|V|IV|III|II|I)\s*)+$',re.I)
          out={'authority_key':'genova','audited_on':'2026-09-12','sources':{}}
          def clean(v): return re.sub(r'\s+',' ',(v or '').replace('\u00a0',' ')).strip()
          with tempfile.TemporaryDirectory(prefix='genova-sections-') as td:
            td=pathlib.Path(td)
            for scope in ('listed','applicant'):
              cfg=src['sources'][scope]
              r=session.get(cfg['resource_url'],timeout=(15,120));r.raise_for_status()
              if hashlib.sha256(r.content).hexdigest()!=cfg['sha256']: raise SystemExit(f'{scope} drift')
              p=td/f'{scope}.pdf';p.write_bytes(r.content)
              anomalies=[]; values=collections.Counter(); blanks=[]
              with pdfplumber.open(p) as pdf:
                for pno,page in enumerate(pdf.pages,1):
                  for tno,table in enumerate(page.extract_tables() or [],1):
                    for rno,row in enumerate(table or [],1):
                      cells=[clean(x) for x in row]
                      if not any(cells): continue
                      fold=' | '.join(cells).casefold()
                      if any(x in fold for x in ('ragione sociale','codice fiscale','partita iva','data iscrizione','data di presentazione')): continue
                      if cells and cells[0].casefold().startswith('legenda sez.'): continue
                      if scope=='listed':
                        if len(cells)==9 and not cells[0]: cells=cells[1:]
                        if len(cells)==5 and pno==47: section=cells[4]
                        elif len(cells)==8: section=cells[4]
                        else: continue
                      else:
                        if pno==7: continue
                        if len(cells)!=7: continue
                        section=cells[4]
                      values[section]+=1
                      item={'page':pno,'table':tno,'row':rno,'name':cells[0] if cells else '', 'section_raw':section}
                      if not section: blanks.append(item)
                      elif not canonical.fullmatch(section): anomalies.append(item)
              out['sources'][scope]={'unique_section_values':len(values),'blank_count':len(blanks),'blanks':blanks,'noncanonical_count':len(anomalies),'noncanonical':anomalies,'noncanonical_value_counts':dict(collections.Counter(x['section_raw'] for x in anomalies))}
          path=pathlib.Path('tmp/genova_section_audit.json');path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Checkpoint section audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/genova_section_audit.json
          if ! git diff --cached --quiet; then git commit -m 'Checkpoint Genova section typography audit'; git push origin HEAD:expansion/genova-2026-09-12; fi
