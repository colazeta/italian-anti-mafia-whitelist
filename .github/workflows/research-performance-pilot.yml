name: Research performance pilot (non-production)

on:
  push:
    branches:
      - research/white-list-performance-pilot
    paths:
      - research/white_list_performance_pilot/scripts/run_source_pilot.py
      - research/white_list_performance_pilot/scripts/run_followup.py
      - research/white_list_performance_pilot/tests/**
      - .github/workflows/research-performance-pilot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-performance-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-diagnostics:
    if: github.ref == 'refs/heads/research/white-list-performance-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the existing parser dependencies
        run: |
          python -m pip install -e '.[publication]'
          bash scripts/install_ci_ubuntu_packages.sh poppler-utils
      - name: Run synthetic research regression tests
        run: |
          mkdir -p artifacts/research-performance-aggregate/code
          python -m unittest discover \
            -s research/white_list_performance_pilot/tests -v \
            2>&1 | tee artifacts/research-performance-aggregate/tests.txt
      - name: Assess discovery per authority and regime
        run: |
          python research/white_list_performance_pilot/scripts/build_eligibility.py \
            --output artifacts/research-performance-aggregate/eligibility_v2.csv
      - name: Run research-only source checks and aggregates
        run: |
          python research/white_list_performance_pilot/scripts/run_followup.py \
            --output-dir artifacts/research-performance-aggregate
      - name: Preserve inspected research code alongside the safe output
        run: |
          cp research/white_list_performance_pilot/scripts/*.py artifacts/research-performance-aggregate/code/
          cp research/white_list_performance_pilot/tests/test_research_contract.py artifacts/research-performance-aggregate/code/
          cp research/white_list_performance_pilot/METHODOLOGICAL_REVIEW.md artifacts/research-performance-aggregate/
          python -m pip freeze > artifacts/research-performance-aggregate/dependencies.txt
      - name: Verify that tracked repository inputs are unchanged
        run: git diff --exit-code
      - name: Retain only explicitly allowed non-identifying research outputs
        uses: actions/upload-artifact@v4
        with:
          name: research-performance-aggregate-${{ github.run_id }}
          path: |
            artifacts/research-performance-aggregate/source_diagnostics_v3.json
            artifacts/research-performance-aggregate/eligibility_v2.csv
            artifacts/research-performance-aggregate/eligibility_v2.metadata.json
            artifacts/research-performance-aggregate/tests.txt
            artifacts/research-performance-aggregate/dependencies.txt
            artifacts/research-performance-aggregate/METHODOLOGICAL_REVIEW.md
            artifacts/research-performance-aggregate/code/*.py
          if-no-files-found: error
          retention-days: 7
