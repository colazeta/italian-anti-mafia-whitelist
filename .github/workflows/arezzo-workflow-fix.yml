name: Repair Arezzo materialiser

on:
  push:
    branches:
      - expansion/arezzo-2026-09-10
    paths:
      - .github/workflows/arezzo-workflow-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep monitoring state within the canonical ontology
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/arezzo-source-audit.yml')
          text=path.read_text(encoding='utf-8')
          old=",'monitoring_status':'VERIFIED_CURRENT'"
          if old not in text:
              raise SystemExit('invalid monitoring token anchor missing')
          text=text.replace(old,'',1)
          anchor=",'last_completed_coverage_stage':'VALIDATED'})\n"
          addition=anchor+"              if item['authority_key']=='arezzo':\n                  item['monitoring_status']='CURRENT'\n                  item['last_successful_source_check_at']='2026-09-09T23:36:43Z'\n                  item['last_attempted_source_check_at']='2026-09-09T23:36:43Z'\n"
          if anchor not in text:
              raise SystemExit('coverage update anchor missing')
          text=text.replace(anchor,addition,1)
          path.write_text(text,encoding='utf-8')
          PY
          rm .github/workflows/arezzo-workflow-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep Arezzo monitoring state canonical'
          git push origin HEAD:expansion/arezzo-2026-09-10
