name: Pordenone source probe

on:
  push:
    branches:
      - expansion/pordenone-2026-09-20
    paths:
      - .github/workflows/pordenone-source-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe official Pordenone White List source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, time
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          landing = 'https://prefettura.interno.gov.it/it/prefetture/pordenone/white-list-elenco-ditte-iscritte'
          ua = 'italian-anti-mafia-whitelist/1.0 source-verification'

          def get(url):
              req = Request(url, headers={'User-Agent': ua, 'Cache-Control': 'no-cache'})
              with urlopen(req, timeout=45) as r:
                  return r.status, r.headers.get('Content-Type',''), r.read()

          status, ctype, body = get(landing)
          print('LANDING', status, ctype, len(body), hashlib.sha256(body).hexdigest())
          text = body.decode('utf-8', 'replace')

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]; self._href=None; self._txt=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      self._href = dict(attrs).get('href'); self._txt=[]
              def handle_data(self, data):
                  if self._href is not None: self._txt.append(data)
              def handle_endtag(self, tag):
                  if tag == 'a' and self._href is not None:
                      label = ' '.join(' '.join(self._txt).split())
                      self.links.append((label, urljoin(landing, self._href)))
                      self._href=None; self._txt=[]

          p=P(); p.feed(text)
          candidates=[]
          for label,url in p.links:
              l=(label+' '+url).lower()
              if ('sez.' in l or 'sez ' in l or 'richiedent' in l or 'white' in l) and any(x in url.lower() for x in ('.pdf','.xlsx','.xls','.ods')):
                  candidates.append((label,url))

          # fall back to all official file assets if labels are not retained in HTML
          if len(candidates) < 2:
              candidates=[]
              for label,url in p.links:
                  if 'prefettura.interno.gov.it/sites/default/files/' in url and any(x in url.lower() for x in ('.pdf','.xlsx','.xls','.ods')):
                      candidates.append((label,url))

          # stable de-duplication
          seen=set(); ordered=[]
          for label,url in candidates:
              if url not in seen:
                  seen.add(url); ordered.append((label,url))

          print('ATTACHMENT_COUNT', len(ordered))
          out=[]
          for i,(label,url) in enumerate(ordered,1):
              s1,c1,b1=get(url); time.sleep(1); s2,c2,b2=get(url)
              item={
                  'ordinal':i,'label':label,'url':url,
                  'status_1':s1,'status_2':s2,'content_type_1':c1,'content_type_2':c2,
                  'bytes_1':len(b1),'bytes_2':len(b2),
                  'sha256_1':hashlib.sha256(b1).hexdigest(),
                  'sha256_2':hashlib.sha256(b2).hexdigest(),
                  'byte_identical':b1==b2,
              }
              out.append(item)
              print('ATTACHMENT', json.dumps(item, ensure_ascii=False, sort_keys=True))

          assert status == 200, status
          assert len(ordered) >= 2, len(ordered)
          assert all(x['status_1']==200 and x['status_2']==200 for x in out)
          assert all(x['byte_identical'] for x in out)
          print('SUMMARY', json.dumps(out, ensure_ascii=False, sort_keys=True))
          PY
