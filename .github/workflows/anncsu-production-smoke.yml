name: ANNCSU production smoke

on:
  push:
    branches:
      - feature/anncsu-official-acquisition
    paths:
      - '.github/workflows/anncsu-production-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project
        run: python -m pip install -e .
      - name: Acquire and validate official Calabria dataset
        run: |
          white-list-anncsu-acquire \
            --dataset INDIR_CALA \
            --output-dir artifacts/anncsu \
            --expected-sha256 65136ad879e33bca5e776f526fe77d17bd3b141a434575591873c842e23ef0aa
          python - <<'PY'
          import json
          from pathlib import Path
          from white_list_archive.acquisition.anncsu import iter_anncsu_rows, parse_decimal_coordinate

          root = Path('artifacts/anncsu')
          manifest_path = root / 'anncsu-indir_cala-2026-08-03.manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['provider'] == 'ANNCSU'
          assert manifest['provider_version'] == '2026-08-03'
          assert manifest['zip']['sha256'] == '65136ad879e33bca5e776f526fe77d17bd3b141a434575591873c842e23ef0aa'
          assert manifest['csv']['sha256'] == '7da7624090f4cc096f7981d91e6f820f73450c773bea5343bc1a9f8963431784'
          csv_path = root / manifest['csv']['path']

          count = 0
          coordinate_pairs = 0
          methods = {}
          for row in iter_anncsu_rows(csv_path, municipality_belfiore='D086'):
              count += 1
              x = parse_decimal_coordinate(row['COORD_X_COMUNE'])
              y = parse_decimal_coordinate(row['COORD_Y_COMUNE'])
              if x is not None and y is not None:
                  coordinate_pairs += 1
              method = row['METODO'].strip() or '<blank>'
              methods[method] = methods.get(method, 0) + 1

          assert count == 23654, count
          assert coordinate_pairs == 23654, coordinate_pairs
          assert methods == {'3': 22924, '5': 730}, methods
          print(json.dumps({
              'provider_version': manifest['provider_version'],
              'cosenza_rows': count,
              'coordinate_pairs': coordinate_pairs,
              'method_counts': methods,
          }, indent=2))
          PY
