name: Cremona split finalizer 2026-09-19

on:
  push:
    branches:
      - expansion/cremona-2026-09-18
    paths:
      - .github/workflows/cremona-finalize-split-2026-09-19.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/cremona-2026-09-18
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute validated finalizer through candidate build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          workflow = yaml.safe_load(Path('.github/workflows/cremona-finalize-2026-09-18.yml').read_text())
          steps = workflow['jobs']['finalize']['steps']
          wanted = {
              'Verify branch base',
              'Install validation runtime',
              'Apply permanent Cremona integration',
              'Reverify Cremona content and build full candidate',
          }
          selected = [step for step in steps if step.get('name') in wanted]
          if {step['name'] for step in selected} != wanted:
              raise SystemExit('expected finalizer steps not found')
          for step in selected:
              print(f"RUNNING {step['name']}", flush=True)
              subprocess.run(step['run'], shell=True, executable='/bin/bash', check=True)
          PY
      - name: Checkpoint non-workflow integration and workflow candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          cp .github/workflows/public-pages.yml tmp/cremona-public-pages-candidate.yml
          git checkout -- .github/workflows/public-pages.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          permanent=(
            data/catalog.csv
            data/monitoring/national_coverage.json
            data/publication/multi_prefecture_pilot.json
            data/source_registry/source_series_inventory.csv
            data/source_registry/verified_primary_pages.csv
            docs/sources/cremona-operational-check-2026-09-18.md
            src/white_list_archive/parsers/cremona_combined.py
            src/white_list_archive/publishing/public_national_registry.py
            tests/public_portal_browser.cjs
            tests/test_cremona_parser_semantics.py
            tests/test_source_population_coverage.py
            tmp/cremona-public-pages-candidate.yml
          )
          git add "${permanent[@]}"
          git diff --cached --check
          git commit -m 'Checkpoint Cremona integration pending public workflow promotion'
          git push origin HEAD:expansion/cremona-2026-09-18
