name: Trigger Ravenna current refresh finaliser

on:
  push:
    branches: [expansion/ravenna-2026-09-20]
    paths: ['.github/workflows/ravenna-current-refresh-trigger.yml']

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current Ravenna finaliser on exact branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This trigger is temporary and exists only to run the already-defined Ravenna transaction on this exact head.
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ravenna-current-refresh-finalise.yml/dispatches" \
            -d '{"ref":"expansion/ravenna-2026-09-20"}'
