name: Taranto integration finalizer

on:
  push:
    branches:
      - expansion/taranto-2026-09-18
    paths:
      - 'tmp/taranto_finalize.py'
      - '.github/workflows/taranto-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: expansion/taranto-2026-09-18
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize permanent Taranto integration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tmp/taranto_finalize.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('"reference_date": "2026-09-18"', '"reference_date": "2026-09-07"')
          s = s.replace('"last_source_update": "2026-09-18"', '"last_source_update": "2026-09-07"')
          s = s.replace('"latest_source_reference_date": "2026-09-18"', '"latest_source_reference_date": "2026-09-07"')
          s = s.replace('current mutable official HTML table captured and independently revalidated 18 September 2026; date is an observation/reference boundary only and is not an inferred company event or legal-effect date', "official page 'Ultimo aggiornamento' (7 September 2026); independently revalidated 18 September 2026; date is a source update/reference boundary only and is not an inferred company event or legal-effect date")
          p.write_text(s, encoding='utf-8')
          PY
          python tmp/taranto_finalize.py
          python -m json.tool data/publication/multi_prefecture_pilot.json >/dev/null
          python -m json.tool data/monitoring/national_coverage.json >/dev/null
          python -m py_compile \
            src/white_list_archive/publishing/public_national_registry.py \
            src/white_list_archive/parsers/taranto_html.py
          # The Actions token cannot update workflow files. Leave public-pages for an authenticated connector write.
          git checkout HEAD -- .github/workflows/public-pages.yml
      - name: Remove non-workflow temporary script
        run: |
          rm -f tmp/taranto_finalize.py
          test ! -e tmp/taranto_finalize.py
      - name: Commit permanent non-workflow integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep '^.github/workflows/'; then
            echo 'Workflow file unexpectedly staged; refusing push' >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'No Taranto integration changes to commit' >&2
            exit 1
          fi
          git commit -m 'Integrate Taranto source data and publication metadata'
          git push origin HEAD:expansion/taranto-2026-09-18
