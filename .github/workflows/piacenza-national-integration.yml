name: Piacenza national integration

on:
  push:
    branches:
      - expansion/piacenza-2026-09-21
    paths:
      - .github/workflows/piacenza-national-integration.yml
      - tmp/piacenza_integrate.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: piacenza-national-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify branch resume state
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'expansion/piacenza-2026-09-21'
          git fetch origin main
          test "$(git rev-list --count HEAD..origin/main)" = 0
          test -f tmp/piacenza_integrate.py
          test -f src/white_list_archive/parsers/piacenza_legacy_xls.py
          test ! -e .github/workflows/piacenza-source-probe.yml

      - name: Install full runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils antiword
          python -m pip install -e '.[publication,dev,storage,database]'

      - name: Materialise permanent Piacenza candidate integration
        run: python tmp/piacenza_integrate.py

      - name: Validate focused Piacenza and source-registry tests
        run: |
          pytest -q \
            tests/test_piacenza_legacy_xls.py \
            tests/test_source_registry.py \
            tests/test_source_population_coverage.py

      - name: Run full repository suite
        run: pytest -q

      - name: Build and validate actual national candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/piacenza-public-site /tmp/piacenza-public-sources
          mkdir -p /tmp/piacenza-public-site/data
          cp -R public-site/. /tmp/piacenza-public-site/
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/piacenza-public-sources \
            --registry-json /tmp/piacenza-public-site/data/registry.json \
            --registry-csv /tmp/piacenza-public-site/data/registry.csv \
            --prefectures-json /tmp/piacenza-public-site/data/prefectures.json \
            --prefectures-csv /tmp/piacenza-public-site/data/prefectures.csv
          python -m white_list_archive.publishing.public_artifact /tmp/piacenza-public-site
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/piacenza-public-site/data')
          reg=json.loads((root/'registry.json').read_text(encoding='utf-8'))
          pref=json.loads((root/'prefectures.json').read_text(encoding='utf-8'))
          assert reg['meta']['record_count'] == 73668, reg['meta']['record_count']
          assert reg['meta']['authority_count'] == 72, reg['meta']['authority_count']
          assert reg['meta']['register_count'] == 75, reg['meta']['register_count']
          assert pref['meta']['published_count'] == 72, pref['meta']['published_count']
          assert pref['meta']['mapped_count'] == 72, pref['meta']['mapped_count']
          records=[r for r in reg['records'] if r['authority_key']=='piacenza']
          assert len(records) == 570
          assert sum(r['source_key']=='piacenza-listed' for r in records) == 552
          assert sum(r['source_key']=='piacenza-applicants' for r in records) == 18
          assert sum(r['source_status']=='listed' for r in records) == 455
          assert sum(r['source_status']=='renewal_update_in_progress' for r in records) == 97
          assert sum(r['source_status']=='pending' for r in records) == 18
          assert sum(bool(r['identifiers']) for r in records) == 558
          assert len({r['record_locator'] for r in records}) == 570
          pc=[x for x in pref['prefectures'] if x['authority_key']=='piacenza']
          assert len(pc)==1 and pc[0]['mapped'] and pc[0]['published'] and pc[0]['series_count']==2
          print(json.dumps({'record_count':reg['meta']['record_count'],'authority_count':reg['meta']['authority_count'],'register_count':reg['meta']['register_count'],'published_count':pref['meta']['published_count'],'mapped_count':pref['meta']['mapped_count'],'piacenza_records':len(records),'piacenza_identified':sum(bool(r['identifiers']) for r in records)}, indent=2))
          PY

      - name: Commit permanent checkpoint only
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git add \
            data/catalog.csv \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/verified_primary_pages.csv \
            data/source_registry/source_series_inventory.csv \
            src/white_list_archive/publishing/public_national_registry.py \
            tests/test_source_registry.py \
            tests/test_source_population_coverage.py
          if git diff --cached --quiet; then
            echo 'Permanent Piacenza integration already checkpointed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate Piacenza White List sources'
          git push origin HEAD:expansion/piacenza-2026-09-21
