name: Torino table diagnostic

on:
  push:
    branches:
      - expansion/torino-2026-09-15
    paths:
      - .github/workflows/torino-table-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime
        run: python -m pip install pdfplumber requests

      - name: Inspect table geometry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          from collections import Counter
          from pathlib import Path
          import requests
          import pdfplumber

          urls = {
              'listed': 'https://prefettura.interno.gov.it/sites/default/files/90/2026-09/w.l-11.09.2026.pdf',
              'applicants': 'https://prefettura.interno.gov.it/sites/default/files/90/2026-09/w.l-11.09.2026-i.pdf',
          }
          session = requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 Chrome/140 Safari/537.36'})
          for role, url in urls.items():
              path = Path(f'/tmp/torino-{role}.pdf')
              r = session.get(url, timeout=60)
              r.raise_for_status()
              path.write_bytes(r.content)
              print(f'===== {role.upper()} =====')
              with pdfplumber.open(path) as pdf:
                  print('pages', len(pdf.pages))
                  total_rows = 0
                  for pno, page in enumerate(pdf.pages, start=1):
                      tables = page.extract_tables()
                      rects = page.rects
                      lines = page.lines
                      print(f'PAGE {pno}: size={page.width}x{page.height} tables={len(tables)} rects={len(rects)} lines={len(lines)}')
                      for ti, table in enumerate(tables):
                          print(f'  TABLE {ti}: rows={len(table)} widths={Counter(len(row) for row in table)}')
                          total_rows += len(table)
                          if pno <= 2 or pno == len(pdf.pages):
                              for row in table[:8]:
                                  print('    ROW', repr(row))
                      if pno == 1:
                          print('  RECT SAMPLE')
                          for rect in rects[:40]:
                              print('   ', {k: round(rect[k],3) if isinstance(rect.get(k), (int,float)) else rect.get(k) for k in ('x0','x1','top','bottom','width','height','non_stroking_color')})
                  print('TOTAL EXTRACTED TABLE ROWS', total_rows)
          PY
