name: Torino table diagnostic
on:
  push:
    branches: [expansion/torino-2026-09-15]
    paths: [.github/workflows/torino-table-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pdfplumber requests
      - name: Audit complete source tables
        run: |
          python - <<'PY'
          import re
          from collections import Counter
          from datetime import datetime
          from pathlib import Path
          import pdfplumber, requests
          sources={
            'listed':'https://prefettura.interno.gov.it/sites/default/files/90/2026-09/w.l-11.09.2026.pdf',
            'applicants':'https://prefettura.interno.gov.it/sites/default/files/90/2026-09/w.l-11.09.2026-i.pdf'}
          clean=lambda x:' '.join(str(x or '').replace('\u00a0',' ').split())
          id_rx=re.compile(r'(?<![A-Z0-9])(?:\d{11}|[A-Z]{6}[0-9A-Z]{10})(?![A-Z0-9])')
          act_rx=re.compile(r'^(?:I|II|III|IV|V|VI|VII|VIII|IX|X|XI)(?:-(?:I|II|III|IV|V|VI|VII|VIII|IX|X|XI))*$')
          date_rx=re.compile(r'^\d{2}/\d{2}/\d{4}$')
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 Chrome/140 Safari/537.36'
          for role,url in sources.items():
            p=Path('/tmp')/f'{role}.pdf'; r=s.get(url,timeout=60); r.raise_for_status(); p.write_bytes(r.content)
            rows=[]; counts=[]
            with pdfplumber.open(p) as pdf:
              for pno,page in enumerate(pdf.pages,1):
                tables=page.extract_tables()
                if len(tables)!=1: raise SystemExit(f'{role} p{pno}: table count {len(tables)}')
                page_rows=[[clean(c) for c in row] for row in tables[0]]
                if pno==1: page_rows=page_rows[1:]
                counts.append(len(page_rows)); rows += [(pno,i,row) for i,row in enumerate(page_rows,1)]
            print(role,'PAGE_COUNTS',tuple(counts),'RECORDS',len(rows),'WIDTHS',Counter(len(x[2]) for x in rows))
            print(role,'BLANKS', {i:sum(not row[i] for _,_,row in rows) for i in range(len(rows[0][2]))})
            bad_act=[(p,i,row[0],row[4]) for p,i,row in rows if not act_rx.fullmatch(row[4])]
            print(role,'BAD_ACTIVITIES',bad_act)
            malformed=[]; coverage=0
            for pno,i,row in rows:
              found=id_rx.findall(row[3].upper()); coverage += bool(found)
              residue=id_rx.sub('',row[3].upper()); residue=re.sub(r'[\s/\-]+','',residue)
              if row[3] and (not found or residue): malformed.append((pno,i,row[0],row[3],found,residue))
            print(role,'IDENTIFIER_COVERAGE',coverage,'MALFORMED',malformed)
            date_cols=(5,7,8) if role=='listed' else (5,)
            for col in date_cols:
              bad=[]
              for pno,i,row in rows:
                v=row[col]
                if not v: continue
                try:
                  if not date_rx.fullmatch(v): raise ValueError('format')
                  datetime.strptime(v,'%d/%m/%Y')
                except ValueError: bad.append((pno,i,row[0],v))
              print(role,'BAD_DATE_COL',col,bad)
            print(role,'OUTCOMES',Counter(row[6] for _,_,row in rows))
            if role=='listed':
              print(role,'ANNOTATIONS',Counter(row[9] for _,_,row in rows))
              print(role,'COMBOS',Counter((row[6],row[9],bool(row[5]),bool(row[7]),bool(row[8])) for _,_,row in rows))
          PY
