name: Udine parser validation 2026-09-10

on:
  push:
    branches: [expansion/udine-2026-09-10]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.head_commit.message == 'Validate Udine parser candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/udine-2026-09-10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate byte-pinned sources and parser
        shell: bash
        run: |
          python -m pip install -e '.[dev,publication]'
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from urllib.request import Request, urlopen
          from white_list_archive.parsers.udine_positioned import parse_udine_listed, parse_udine_applicants

          H={'User-Agent':'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelistArchive/1.0; udine-parser-validation)'}
          sources={
            'listed':('https://prefettura.interno.gov.it/sites/default/files/13/2026-09/elenco-ditte-iscritte-nelle-white-list_0.pdf','0bd74200cbe5d96b313f943a889acbfe1fe6278293516a76ad0702e28b293fba'),
            'applicants':('https://prefettura.interno.gov.it/sites/default/files/13/2026-09/elenco-dei-fornitori-che-hanno-chiesto-di-essere-iscritti_0.pdf','4ea03173171bda5df4a3abba120feae3842506f436f28f5c0604099388523971'),
          }
          for key,(url,sha) in sources.items():
              with urlopen(Request(url,headers=H),timeout=90) as r: body=r.read()
              assert hashlib.sha256(body).hexdigest()==sha
              Path('/tmp',f'udine-{key}.pdf').write_bytes(body)
          base={'authority_key':'udine','authority_name':'Prefettura di Udine','register_key':'udine-ordinary','register_name':'White List ordinaria','reference_date':'2026-09-09','source_page_url':'https://prefettura.interno.gov.it/it/prefetture/udine/evidenza/white-list'}
          lc=base|{'source_key':'udine-listed','population_scope':'listed','resource_url':sources['listed'][0],'sha256':sources['listed'][1]}
          ac=base|{'source_key':'udine-applicants','population_scope':'applicant','resource_url':sources['applicants'][0],'sha256':sources['applicants'][1]}
          lb=parse_udine_listed(Path('/tmp/udine-listed.pdf'),lc)
          ab=parse_udine_applicants(Path('/tmp/udine-applicants.pdf'),ac)
          print('LISTED_DIAGNOSTICS',lb.diagnostics)
          print('APPLICANT_DIAGNOSTICS',ab.diagnostics)
          print('LISTED_NONSTANDARD_IDS',[(r['name'],r['identifier_field_raw']) for r in lb.records if not r['identifiers']])
          print('LISTED_BAD_DATES',[(r['name'],r['source_fields']) for r in lb.records if r['source_fields'].get('listing_date_unparsed_reviewed') or r['source_fields'].get('expiry_date_unparsed_reviewed')])
          print('APPLICANT_NAMES',[(r['name'],r['registered_office'],r['identifier_field_raw'],r['requested_activities'],r['application_date']) for r in ab.records])
          assert len(lb.records)==1431
          assert len(ab.records)==19
          assert all(r['source_status']=='pending' for r in ab.records)
          assert any(r['name']=='MTL MESSAGGERIE TRASPORTI E LOGISTICA SOCIETA’ COOPERATIVA' for r in ab.records)
          PY
          pytest -q tests/test_udine_parser_semantics.py
