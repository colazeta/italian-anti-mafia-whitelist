name: Gorizia parser source-shape fix

on:
  push:
    branches:
      - expansion/gorizia-2026-09-13
    paths:
      - .github/workflows/gorizia-parser-import-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/gorizia-2026-09-13
      - name: Bind reviewed section-3 header typography
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/white_list_archive/parsers/gorizia_tables.py')
          text = path.read_text(encoding='utf-8')
          old = '''        header = _physical_cells(table.rows[0])
        if header != expected_headers:
            raise RuntimeError(f"Gorizia listed header drift in section {section}: {header!r}")
'''
          new = '''        header = _physical_cells(table.rows[0])
        expected_header = list(expected_headers)
        if section == 3:
            expected_header[4] = "Data d ’ iscrizione"
        if header != expected_header:
            raise RuntimeError(f"Gorizia listed header drift in section {section}: {header!r}")
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one strict header block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff -- src/white_list_archive/parsers/gorizia_tables.py
      - name: Commit source-shape fix
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/white_list_archive/parsers/gorizia_tables.py
          git diff --cached --quiet && exit 0
          git commit -m 'Bind Gorizia section 3 header typography'
          git push origin HEAD:expansion/gorizia-2026-09-13
