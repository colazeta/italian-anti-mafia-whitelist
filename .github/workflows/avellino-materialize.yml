name: Materialize validated Avellino expansion

on:
  push:
    branches:
      - expansion/avellino-public-2026-09-10
    paths:
      - '.github/workflows/avellino-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install publication runtime
        run: |
          python -m pip install -e '.[publication]'
          python -m pip install pytest
      - name: Materialize approved source configuration and governance state
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          # Parser dispatch: extend the explicit approved-parser registry only.
          registry_path = Path('src/white_list_archive/publishing/public_national_registry.py')
          text = registry_path.read_text(encoding='utf-8')
          old_import = 'from white_list_archive.parsers.arezzo_openxml import PARSERS as AREZZO_PARSERS\n'
          new_import = old_import + 'from white_list_archive.parsers.avellino_positioned import PARSERS as AVELLINO_PARSERS\n'
          if old_import not in text or 'AVELLINO_PARSERS' in text:
              raise SystemExit('public parser import boundary changed unexpectedly')
          text = text.replace(old_import, new_import, 1)
          old_dispatch = '    parser = PARSERS.get(cfg["parser"]) or AREZZO_PARSERS.get(cfg["parser"])\n'
          new_dispatch = '    parser = (\n        PARSERS.get(cfg["parser"])\n        or AREZZO_PARSERS.get(cfg["parser"])\n        or AVELLINO_PARSERS.get(cfg["parser"])\n    )\n'
          if old_dispatch not in text:
              raise SystemExit('public parser dispatch boundary changed unexpectedly')
          registry_path.write_text(text.replace(old_dispatch, new_dispatch, 1), encoding='utf-8')

          # Append exactly the two positively evidenced current Avellino populations.
          config_path = Path('data/publication/multi_prefecture_pilot.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          existing = {source['source_key'] for source in config['sources']}
          wanted = {'avellino-listed', 'avellino-applicants'}
          if existing & wanted:
              raise SystemExit(f'Avellino source already present unexpectedly: {existing & wanted}')
          config['verified_at'] = '2026-09-10'
          config['sources'].extend([
              {
                  'source_key': 'avellino-listed',
                  'parser': 'avellino_listed',
                  'authority_key': 'avellino',
                  'authority_name': 'Prefettura di Avellino',
                  'register_key': 'avellino-ordinary',
                  'register_name': 'White List ordinaria',
                  'population_scope': 'listed',
                  'reference_date': '2026-09-01',
                  'source_page_url': 'https://prefettura.interno.gov.it/it/prefetture/avellino/white-list-elenco-imprese-iscritte',
                  'resource_url': 'https://prefettura.interno.gov.it/sites/default/files/24/2026-09/per_pubblicazione_iscritte_av_01-09-2026_note.pdf',
                  'sha256': '9ada9195d72ba3b773448df0f0f46bab5efdd72ad7da35236bad389ad860eaf0',
                  'expected_source_rows': 383,
                  'last_source_update': '2026-09-01',
                  'last_source_update_basis': 'dated official attachment label and resource filename',
                  'notes': 'The official listed-company page exposes the current PDF dated 1 September 2026. The PDF has no extractable table grid, so the approved parser uses byte-pinned positioned text and primary expiry-date anchors. All 383 rows retain name, raw identifier, registered office, activities, source expiry date, update field and source page. The page itself is explicitly the listed-company population; update/notes text is retained but is not used to infer a different legal status.'
              },
              {
                  'source_key': 'avellino-applicants',
                  'parser': 'avellino_applicants',
                  'authority_key': 'avellino',
                  'authority_name': 'Prefettura di Avellino',
                  'register_key': 'avellino-ordinary',
                  'register_name': 'White List ordinaria',
                  'population_scope': 'applicant',
                  'reference_date': '2026-09-01',
                  'source_page_url': 'https://prefettura.interno.gov.it/it/prefetture/avellino/white-list-elenco-imprese-richiedenti',
                  'resource_url': 'https://prefettura.interno.gov.it/sites/default/files/24/2026-09/per_pubblicazione_richiedenti_iscrizione_av_01-09-2026.pdf',
                  'sha256': 'b541e057787e9d26982eb1e87c1233002e88a376e865b637d223c027a6b210be',
                  'expected_source_rows': 244,
                  'last_source_update': '2026-09-01',
                  'last_source_update_basis': 'dated official attachment label and resource filename',
                  'notes': 'The dedicated official applicant page explicitly identifies this population as companies requesting White List registration. The approved parser recovers 244 complete positioned rows anchored on the source application date. Applicant observations remain pending; no final legal outcome is inferred from the absence of a separate outcome field.'
              }
          ])
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Refresh the two existing source-series entries using the current direct verification.
          series_path = Path('data/source_registry/source_series_inventory.csv')
          with series_path.open(encoding='utf-8', newline='') as handle:
              rows = list(csv.DictReader(handle))
              fields = handle.seek(0) or None
          fieldnames = ['source_series_key','authority_key','regime_code','population_scope','sector_scope','publication_model','series_url','resource_resolution_status','verified_date','notes']
          seen = set()
          for row in rows:
              if row['source_series_key'] == 'avellino-listed':
                  row['verified_date'] = '2026-09-10'
                  row['notes'] = 'Dedicated registered-company page verified directly on 10 September 2026; current official PDF is dated 1 September 2026 and byte/parser evidence is recorded in docs/sources/avellino-operational-check-2026-09-10.md.'
                  seen.add(row['source_series_key'])
              elif row['source_series_key'] == 'avellino-applicants':
                  row['verified_date'] = '2026-09-10'
                  row['notes'] = 'Dedicated applicant-company page verified directly on 10 September 2026; current official PDF is dated 1 September 2026 and byte/parser evidence is recorded in docs/sources/avellino-operational-check-2026-09-10.md.'
                  seen.add(row['source_series_key'])
          if seen != {'avellino-listed','avellino-applicants'}:
              raise SystemExit(f'Avellino source-series inventory incomplete: {seen}')
          with series_path.open('w', encoding='utf-8', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator='\n')
              writer.writeheader(); writer.writerows(rows)

          # Reconcile the expansion ledger without claiming hosted canonical DB or durable evidence.
          coverage_path = Path('data/monitoring/national_coverage.json')
          coverage = json.loads(coverage_path.read_text(encoding='utf-8'))
          matches = [item for item in coverage['prefectures'] if item['authority_key'] == 'avellino']
          if len(matches) != 1:
              raise SystemExit(f'expected one Avellino ledger entry, got {len(matches)}')
          item = matches[0]
          item.update({
              'current_edition_identified': True,
              'capture_implemented': True,
              'parser_implemented': True,
              'parser_validated': True,
              'company_observations_loaded': True,
              'observation_layer': 'public_source_observations',
              'canonical_integration_validated': False,
              'public_export_enabled': True,
              'durable_evidence_verified': False,
              'population_scopes_complete': True,
              'latest_source_reference_date': '2026-09-01',
              'last_successful_source_check_at': '2026-09-10T00:22:37Z',
              'last_attempted_source_check_at': '2026-09-10T00:22:37Z',
              'last_successful_investigation_on': '2026-09-10',
              'monitoring_status': 'CURRENT',
              'actionable_issue': False,
              'coverage_status': 'VALIDATED',
              'terminal_reason': None,
              'completion_evidence': [
                  'docs/sources/avellino-operational-check-2026-09-10.md',
                  'src/white_list_archive/parsers/avellino_positioned.py',
                  'tests/test_avellino_parser_semantics.py',
                  'data/publication/multi_prefecture_pilot.json'
              ],
              'known_content_sha256': [
                  '9ada9195d72ba3b773448df0f0f46bab5efdd72ad7da35236bad389ad860eaf0',
                  'b541e057787e9d26982eb1e87c1233002e88a376e865b637d223c027a6b210be'
              ],
          })
          unresolved = [value for value in item.get('unresolved_issue', []) if '#16' not in value and 'durable' not in value.casefold() and 'canonical' not in value.casefold()]
          unresolved.append('Canonical hosted-database integration and independent durable-evidence verification remain governed under #16; public source observations are validated independently of that infrastructure.')
          item['unresolved_issue'] = unresolved
          evidence = list(dict.fromkeys(item.get('evidence', []) + [
              'data/source_registry/verified_primary_pages.csv',
              'data/source_registry/source_series_inventory.csv',
              'docs/sources/avellino-operational-check-2026-09-10.md',
              'src/white_list_archive/parsers/avellino_positioned.py',
              'tests/test_avellino_parser_semantics.py',
              'data/publication/multi_prefecture_pilot.json'
          ]))
          item['evidence'] = evidence
          coverage_path.write_text(json.dumps(coverage, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Permanent Pages gate: grow exact expected coverage; never relax validation.
          pages_path = Path('.github/workflows/public-pages.yml')
          pages = pages_path.read_text(encoding='utf-8')
          replacements = {
              "      - 'src/white_list_archive/parsers/arezzo_openxml.py'\n": "      - 'src/white_list_archive/parsers/arezzo_openxml.py'\n      - 'src/white_list_archive/parsers/avellino_positioned.py'\n",
              "          assert reg['meta']['record_count'] == 6234\n": "          assert reg['meta']['record_count'] == 6861\n",
              "{'cosenza','parma','pistoia','bologna','alessandria','aosta','arezzo'}": "{'cosenza','parma','pistoia','bologna','alessandria','aosta','arezzo','avellino'}",
              "'bologna-provincial','bologna-post-sisma','alessandria-ordinary','aosta-ordinary','arezzo-ordinary'\n": "'bologna-provincial','bologna-post-sisma','alessandria-ordinary','aosta-ordinary','arezzo-ordinary','avellino-ordinary'\n",
              "          assert reg['meta']['authority_count'] == 7\n": "          assert reg['meta']['authority_count'] == 8\n",
              "          assert reg['meta']['register_count'] == 8\n": "          assert reg['meta']['register_count'] == 9\n",
              "          assert pref['meta']['published_count'] == 7\n": "          assert pref['meta']['published_count'] == 8\n",
          }
          for old, new in replacements.items():
              if old not in pages:
                  raise SystemExit(f'Pages gate boundary missing: {old!r}')
              pages = pages.replace(old, new, 1)
          arezzo_gate = "          arezzo = [x for x in pref['prefectures'] if x['jurisdiction_name'] == 'Arezzo']\n          assert len(arezzo) == 1 and arezzo[0]['mapped'] and arezzo[0]['published']\n"
          avellino_gate = arezzo_gate + "          avellino = [x for x in pref['prefectures'] if x['jurisdiction_name'] == 'Avellino']\n          assert len(avellino) == 1 and avellino[0]['mapped'] and avellino[0]['published']\n"
          if arezzo_gate not in pages:
              raise SystemExit('Arezzo Pages authority gate boundary missing')
          pages_path.write_text(pages.replace(arezzo_gate, avellino_gate, 1), encoding='utf-8')
          PY

          cat > docs/sources/avellino-operational-check-2026-09-10.md <<'EOF'
          # Avellino White List operational check — 10 September 2026

          ## Official publication surfaces

          The Prefettura di Avellino exposes two distinct current official series:

          - listed companies: `https://prefettura.interno.gov.it/it/prefetture/avellino/white-list-elenco-imprese-iscritte`;
          - companies requesting registration: `https://prefettura.interno.gov.it/it/prefetture/avellino/white-list-elenco-imprese-richiedenti`.

          Both pages were resolved directly from the official Ministry domain on 10 September 2026. Their current attachment labels explicitly identify an edition at **1 September 2026**.

          ## Current byte identities

          Listed population:

          - resource: `https://prefettura.interno.gov.it/sites/default/files/24/2026-09/per_pubblicazione_iscritte_av_01-09-2026_note.pdf`;
          - SHA-256: `9ada9195d72ba3b773448df0f0f46bab5efdd72ad7da35236bad389ad860eaf0`;
          - size observed by the source audit: 990,198 bytes;
          - PDF pages: 9.

          Applicant population:

          - resource: `https://prefettura.interno.gov.it/sites/default/files/24/2026-09/per_pubblicazione_richiedenti_iscrizione_av_01-09-2026.pdf`;
          - SHA-256: `b541e057787e9d26982eb1e87c1233002e88a376e865b637d223c027a6b210be`;
          - size observed by the source audit: 387,247 bytes;
          - PDF pages: 5.

          ## Parser boundary

          The source PDFs expose positioned text but do not yield their substantive rows through the repository's ordinary `pdfplumber.extract_tables()` path. A dedicated positioned-text parser is therefore used. It is bound to the byte-pinned current sources and fails closed on page-count changes, ambiguous primary-date anchors, missing essential identity fields, invalid primary dates or unexpected row counts.

          For the listed PDF, the source's `Data scadenza` column is used as the row anchor. This yields **383 complete listed observations**, with name, raw identifier, registered office, activities, source expiry date, update field and source page retained. The source page itself explicitly defines this as the registered-company population. Free-text update/notes fields are retained as provenance but are not interpreted to manufacture a different legal status. Canonical identifier extraction succeeds for 381 observations; the remaining two retain their raw identifier field without repair.

          For the applicant PDF, the source's application-date column yields **244 complete request observations**. All are represented as `pending` because the dedicated applicant publication does not itself establish a final outcome. Canonical identifier extraction succeeds for 243 observations; the remaining raw identifier is retained without repair.

          ## Verification evidence

          - source-resolution and structural audit: successful Actions run `34420174051`;
          - aggregate positioned-layout audit: successful Actions run `34420703937`;
          - parser semantic tests plus execution against both pinned official PDFs: successful Actions run `34420996848`;
          - semantic unit tests: `tests/test_avellino_parser_semantics.py`.

          No claim is made here that the Avellino observations have been integrated into the separately governed hosted canonical database or independently durable evidence store. Those controls remain under issue #16 and are not prerequisites for the source-backed public observation layer.
          EOF
      - name: Validate semantic tests and expanded public build
        run: |
          pytest -q tests/test_avellino_parser_semantics.py
          rm -rf /tmp/avellino-public-build /tmp/avellino-public-sources
          mkdir -p /tmp/avellino-public-build
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/avellino-public-sources \
            --registry-json /tmp/avellino-public-build/registry.json \
            --registry-csv /tmp/avellino-public-build/registry.csv \
            --prefectures-json /tmp/avellino-public-build/prefectures.json \
            --prefectures-csv /tmp/avellino-public-build/prefectures.csv
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('/tmp/avellino-public-build/registry.json').read_text())
          pref=json.loads(Path('/tmp/avellino-public-build/prefectures.json').read_text())
          assert reg['meta']['record_count'] == 6861, reg['meta']
          assert reg['meta']['authority_count'] == 8, reg['meta']
          assert reg['meta']['register_count'] == 9, reg['meta']
          assert reg['meta']['authority_counts']['avellino'] == 627, reg['meta']['authority_counts']
          assert reg['meta']['register_counts']['avellino-ordinary'] == 627, reg['meta']['register_counts']
          assert pref['meta']['authority_count'] == 106, pref['meta']
          assert pref['meta']['mapped_count'] == 34, pref['meta']
          assert pref['meta']['published_count'] == 8, pref['meta']
          listed=json.loads(Path('/tmp/avellino-public-sources/avellino-listed.diagnostics.json').read_text())
          applicants=json.loads(Path('/tmp/avellino-public-sources/avellino-applicants.diagnostics.json').read_text())
          assert listed['public_records'] == 383 and listed['dropped_date_rows'] == 0
          assert applicants['public_records'] == 244 and applicants['dropped_date_rows'] == 0
          print('AVELLINO_EXPANDED_BUILD', reg['meta']['record_count'], pref['meta'])
          print('AVELLINO_LISTED_DIAGNOSTICS', listed)
          print('AVELLINO_APPLICANT_DIAGNOSTICS', applicants)
          PY
      - name: Remove temporary expansion workflows and commit validated state
        run: |
          git rm .github/workflows/avellino-materialize.yml .github/workflows/avellino-parser-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/white_list_archive/publishing/public_national_registry.py \
                  data/publication/multi_prefecture_pilot.json \
                  data/source_registry/source_series_inventory.csv \
                  data/monitoring/national_coverage.json \
                  .github/workflows/public-pages.yml \
                  docs/sources/avellino-operational-check-2026-09-10.md
          git diff --cached --check
          git commit -m 'Publish validated Avellino White List sources'
          git push origin HEAD:expansion/avellino-public-2026-09-10
