name: Milano source validation

on:
  push:
    branches:
      - expansion/milano-2026-09-16
    paths:
      - .github/workflows/milano-source-probe.yml
      - src/white_list_archive/parsers/milano_webapp.py
      - tests/test_milano_parser_semantics.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation runtime
        run: python -m pip install -e '.[dev,database,storage]'
      - name: Run Milano semantic and repository tests
        run: |
          pytest -q tests/test_milano_parser_semantics.py
          pytest -q
      - name: Capture two independent current official editions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/milano-validation
          capture() {
            name="$1"
            url="$2"
            code=$(curl --silent --show-error --location --retry 2 --retry-all-errors \
              --connect-timeout 20 --max-time 120 \
              --header 'Cache-Control: no-cache' --header 'Pragma: no-cache' \
              --user-agent 'italian-anti-mafia-whitelist/0.1 (+source validation)' \
              --dump-header "/tmp/milano-validation/${name}.headers" \
              --output "/tmp/milano-validation/${name}.body" \
              --write-out '%{http_code}' "$url")
            test "$code" = 200
            printf '%s\n' "$url" > "/tmp/milano-validation/${name}.url"
            echo "$name HTTP=$code bytes=$(wc -c < /tmp/milano-validation/${name}.body) sha256=$(sha256sum /tmp/milano-validation/${name}.body | cut -d' ' -f1)"
          }
          for round in 1 2; do
            capture "legacy_${round}" 'https://whitelist.prefmi.it/elenco/elenco.php'
            capture "registered_${round}" 'https://whitelist.prefmi.it/elenco/elenco_iscritte.php'
            if [ "$round" = 1 ]; then
              capture ministry 'https://prefettura.interno.gov.it/it/prefetture/milano/evidenza/white-list'
              capture inizio 'https://whitelist.prefmi.it/elenco/inizio.php'
            fi
            sleep 2
          done
          cmp /tmp/milano-validation/legacy_1.body /tmp/milano-validation/legacy_2.body
          cmp /tmp/milano-validation/registered_1.body /tmp/milano-validation/registered_2.body
      - name: Validate combined source with production parser
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          from pathlib import Path
          from white_list_archive.parsers.milano_webapp import parse_milano_combined

          root = Path('/tmp/milano-validation')
          source = root / 'legacy_1.body'
          sha = hashlib.sha256(source.read_bytes()).hexdigest()
          cfg = {
              'source_key': 'milano-combined',
              'authority_key': 'milano',
              'authority_name': 'Prefettura di Milano',
              'register_key': 'milano-ordinary',
              'register_name': 'White List ordinaria',
              'population_scope': 'listed_and_applicant',
              'reference_date': '2026-09-16',
              'source_page_url': 'https://prefettura.interno.gov.it/it/prefetture/milano/evidenza/white-list',
              'resource_url': 'https://whitelist.prefmi.it/elenco/elenco.php',
              'sha256': sha,
          }
          batch = parse_milano_combined(source, cfg)
          expected = {
              'public_records': 2614,
              'sector_rows': 4214,
              'status_counts': {'listed': 940, 'renewal_update_in_progress': 516, 'pending': 1158},
              'identifier_coverage': 2614,
              'distinct_identifiers': 2614,
              'nonblank_notes': 1,
              'application_date_coverage': 1158,
              'listing_date_coverage': 940,
              'expiry_date_coverage': 940,
              'requested_activity_coverage': 2614,
          }
          for key, value in expected.items():
              actual = batch.diagnostics.get(key)
              if actual != value:
                  raise SystemExit(f'Milano diagnostic drift for {key}: {actual!r} != {value!r}')

          pending_dates = [r['application_date'] for r in batch.records if r['source_status'] == 'pending']
          if max(pending_dates) < '2026-09-01':
              raise SystemExit('Milano applicant surface lacks a current September 2026 application date')

          ministry = (root / 'ministry.body').read_bytes().decode('utf-8', 'replace')
          ministry_visible = re.sub(r'<[^>]+>', ' ', ministry)
          ministry_visible = ' '.join(ministry_visible.split()).casefold()
          required = (
              'che ancora non siano iscritte nelle white list',
              "richiedere l'iscrizione o il rinnovo",
              'white list - elenco imprese iscritte',
          )
          for token in required:
              if token not in ministry_visible:
                  raise SystemExit(f'Milano Ministry-page evidence drift: missing {token!r}')

          inizio = (root / 'inizio.body').read_bytes().decode('cp1252')
          visible = ' '.join(re.sub(r'<[^>]+>', ' ', inizio).split())
          print('MILANO_ENTRYPOINT_VISIBLE=', visible[:2000])
          print('MILANO_SHA256=', sha)
          print('MILANO_BYTES=', source.stat().st_size)
          print('MILANO_DIAGNOSTICS=', json.dumps(batch.diagnostics, ensure_ascii=False, sort_keys=True))
          print('MILANO_LATEST_PENDING_DATE=', max(pending_dates))
          PY
