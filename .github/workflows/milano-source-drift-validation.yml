name: Milano source drift validation

on:
  push:
    branches:
      - fix/milano-source-drift-2026-09-17
    paths:
      - .github/workflows/milano-source-drift-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation runtime
        run: python -m pip install -e '.[dev,database,storage]'
      - name: Capture official sources twice independently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/milano-drift
          capture() {
            name="$1"; url="$2"
            code=$(curl --silent --show-error --location --retry 2 --retry-all-errors \
              --connect-timeout 20 --max-time 120 \
              --header 'Cache-Control: no-cache' --header 'Pragma: no-cache' \
              --user-agent 'italian-anti-mafia-whitelist/0.1 (+source-drift-validation)' \
              --output "/tmp/milano-drift/${name}.body" --write-out '%{http_code}' \
              "${url}?drift_validation=${GITHUB_RUN_ID}-${name}")
            test "$code" = 200
            echo "$name HTTP=$code bytes=$(wc -c < /tmp/milano-drift/${name}.body) sha256=$(sha256sum /tmp/milano-drift/${name}.body | cut -d' ' -f1)"
          }
          for round in 1 2; do
            capture "combined_${round}" 'https://whitelist.prefmi.it/elenco/elenco.php'
            capture "registered_${round}" 'https://whitelist.prefmi.it/elenco/elenco_iscritte.php'
            sleep 2
          done
          cmp /tmp/milano-drift/combined_1.body /tmp/milano-drift/combined_2.body
          cmp /tmp/milano-drift/registered_1.body /tmp/milano-drift/registered_2.body
          test "$(sha256sum /tmp/milano-drift/combined_1.body | cut -d' ' -f1)" = '37fd59b67b153dd642298c7143de4aa1bc57bb1cced0a9310bc9539a79078215'
          test "$(sha256sum /tmp/milano-drift/registered_1.body | cut -d' ' -f1)" = '7f5c7dcc3288387d15125aee1f8aee4e271e5743ecc3a6e9da229873cc1f4848'
      - name: Prove current semantics and exact approved-edition delta
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, urllib.request
          from collections import Counter
          from pathlib import Path
          import white_list_archive.parsers.milano_webapp as m

          def audit(path: Path, allow_pending: bool):
              tables = m._parse_tables(m._decode(path))
              assert len(tables) == 10
              rows = []
              for section, table in enumerate(tables, 1):
                  assert m._clean(table[0][0]) == m._EXPECTED_SECTION_PREFIXES[section-1]
                  assert tuple(m._clean(x) for x in table[1]) == m._HEADER
                  for physical_row, cells in enumerate(table[2:], 3):
                      if not any(m._clean(x) for x in cells):
                          continue
                      assert len(cells) == 6
                      name, office, ident, first, second, note = [m._clean(x) for x in cells]
                      assert name and office and ident and m._STRICT_IDENTIFIER.fullmatch(ident)
                      status, application_date, listing_date, expiry_date = m._status_and_dates(first, second)
                      assert allow_pending or status != 'pending'
                      rows.append(dict(section=section, physical_row=physical_row, name=name, office=office,
                          identifier=ident.upper(), status=status, application_date=application_date,
                          listing_date=listing_date, expiry_date=expiry_date, note=note))
              grouped = {}
              for row in rows:
                  key = (m._normalise_text(row['name']), row['identifier'], m._normalise_address(row['office']),
                         row['status'], row['application_date'], row['listing_date'], row['expiry_date'],
                         m._normalise_text(row['note']))
                  g = grouped.setdefault(key, {'row': row, 'sections': []})
                  assert row['section'] not in g['sections']
                  g['sections'].append(row['section'])
              by_id = {}
              for g in grouped.values():
                  row = dict(g['row']); row['sections'] = sorted(g['sections'])
                  assert row['identifier'] not in by_id
                  by_id[row['identifier']] = row
              return dict(
                  sha256=hashlib.sha256(path.read_bytes()).hexdigest(), bytes=path.stat().st_size,
                  sector_rows=len(rows), logical_records=len(by_id),
                  status_counts=dict(Counter(r['status'] for r in by_id.values())), by_id=by_id)

          root = Path('/tmp/milano-drift')
          combined = audit(root/'combined_1.body', True)
          registered = audit(root/'registered_1.body', False)
          assert combined['bytes'] == 970799
          assert combined['sector_rows'] == 4213
          assert combined['logical_records'] == 2612
          assert combined['status_counts'] == {'listed': 933, 'renewal_update_in_progress': 517, 'pending': 1162}
          assert registered['bytes'] == 557481
          assert registered['sector_rows'] == 2454
          assert registered['logical_records'] == 1450
          assert registered['status_counts'] == {'listed': 977, 'renewal_update_in_progress': 473}
          nonpending = {i for i,r in combined['by_id'].items() if r['status'] != 'pending'}
          assert nonpending == set(registered['by_id'])
          assert not ({i for i,r in combined['by_id'].items() if r['status'] == 'pending'} & set(registered['by_id']))

          req = urllib.request.Request(
              'https://colazeta.github.io/italian-anti-mafia-whitelist/data/registry.json?milano_transition_validation=2',
              headers={'User-Agent':'italian-anti-mafia-whitelist/0.1 (+source-drift-validation)',
                       'Cache-Control':'no-cache','Pragma':'no-cache'})
          with urllib.request.urlopen(req, timeout=120) as response:
              public = json.load(response)
          prior = [r for r in public['records'] if r.get('authority_key') == 'milano' and r.get('source_key') == 'milano-combined']
          prior_by_id = {}
          for record in prior:
              match = re.search(r':id-([A-Za-z0-9]+)$', record.get('record_locator',''))
              assert match
              prior_by_id[match.group(1).upper()] = record
          current = combined['by_id']
          added = sorted(set(current) - set(prior_by_id))
          removed = sorted(set(prior_by_id) - set(current))
          status_changed = []
          for ident in sorted(set(current) & set(prior_by_id)):
              old_status = prior_by_id[ident].get('source_status') or ''
              if current[ident]['status'] != old_status:
                  status_changed.append({'identifier': ident, 'approved': old_status, 'current': current[ident]['status']})
          expected_removed = ['04793740962','06960770961','07693660156','09835880155','10674330963','11016700152']
          assert len(prior) == 2618
          assert added == []
          assert removed == expected_removed
          assert status_changed == []

          print('MILANO_CURRENT=' + json.dumps({k:v for k,v in combined.items() if k != 'by_id'}, sort_keys=True))
          print('MILANO_REGISTERED=' + json.dumps({k:v for k,v in registered.items() if k != 'by_id'}, sort_keys=True))
          print('MILANO_DELTA=' + json.dumps({'approved_records': len(prior), 'current_records': len(current),
                'added': added, 'removed': removed, 'status_changed': status_changed}, sort_keys=True))
          print('MILANO_REMOVED_RECORDS=' + json.dumps([prior_by_id[i] for i in removed], ensure_ascii=False, sort_keys=True))
          PY
