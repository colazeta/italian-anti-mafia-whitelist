name: Validate Cagliari production candidate

on:
  push:
    branches:
      - expansion/cagliari-2026-09-11
    paths:
      - scripts/cagliari_finalize.py
      - scripts/cagliari_contract_fix.py
      - src/white_list_archive/parsers/cagliari_tables.py
      - tests/test_cagliari_parser_semantics.py
      - docs/sources/cagliari-operational-check-2026-09-11.md
      - .github/workflows/cagliari-production-gate-2026-09-11.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialise production candidate
        run: |
          python scripts/cagliari_finalize.py
          python scripts/cagliari_contract_fix.py
      - name: Install validation runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install -e '.[dev,database,storage]'
      - name: Validate repository
        run: pytest -q
      - name: Validate national public build
        run: |
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/cagliari-public-national-sources \
            --registry-json /tmp/cagliari-public-site/data/registry.json \
            --registry-csv /tmp/cagliari-public-site/data/registry.csv \
            --prefectures-json /tmp/cagliari-public-site/data/prefectures.json \
            --prefectures-csv /tmp/cagliari-public-site/data/prefectures.csv
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          registry=json.loads(Path('/tmp/cagliari-public-site/data/registry.json').read_text())
          prefectures=json.loads(Path('/tmp/cagliari-public-site/data/prefectures.json').read_text())
          assert registry['meta']['record_count']==18515
          assert registry['meta']['authority_count']==22
          assert registry['meta']['register_count']==23
          assert prefectures['meta']['published_count']==22
          assert prefectures['meta']['mapped_count']==35
          rows=[r for r in registry['records'] if r['authority_key']=='cagliari']
          assert len(rows)==801
          assert Counter(r['source_status'] for r in rows)==Counter({'listed':713,'renewal_update_in_progress':37,'pending':51})
          assert sum(r['source_key']=='cagliari-listed' for r in rows)==750
          assert sum(r['source_key']=='cagliari-applicants' for r in rows)==51
          aeffe=[r for r in rows if r['name']=='AEFFE di Farci Alessandro']
          assert len(aeffe)==1 and aeffe[0]['identifier_field_raw']=='0336817853' and aeffe[0]['identifiers']==[]
          assert aeffe[0]['requested_activities']==['Sezione 1','Sezione 5']
          la=[r for r in rows if r['name']=='La Pignola S.r.l.']
          assert len(la)==1 and la[0]['identifier_field_raw']=='3814850925' and la[0]['identifiers']==[]
          collu=[r for r in rows if r['name']=='Collu Giuliano Impresa Individuale']
          assert len(collu)==1 and collu[0]['registered_office']==''
          print('Cagliari candidate validated:',len(rows),'records; national',registry['meta']['record_count'],registry['meta']['authority_count'],registry['meta']['register_count'])
          PY
      - name: Validate final Pages gate syntax and assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/public-pages.yml').read_text()
          for token in ["18515", "authority_count'] == 22", "register_count'] == 23", "published_count'] == 22", "cagliari-ordinary", "parsers/cagliari_tables.py"]:
              assert token in text, token
          PY
      - name: Commit validated non-workflow production files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            data/source_registry/verified_primary_pages.csv \
            src/white_list_archive/parsers/cagliari_tables.py \
            src/white_list_archive/publishing/public_national_registry.py \
            tests/public_portal_browser.cjs \
            tests/test_operations.py
          git diff --cached --quiet && { echo 'No candidate production changes to commit'; exit 1; }
          git commit -m 'Integrate Cagliari public archive candidate'
          git push origin HEAD:expansion/cagliari-2026-09-11
