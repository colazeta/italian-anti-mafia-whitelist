name: Ravenna source refresh 2026-09-22

on:
  push:
    branches: [expansion/ravenna-2026-09-20]
    paths: ['.github/workflows/ravenna-source-refresh-2026-09-22.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ravenna-source-refresh-2026-09-22
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/ravenna-2026-09-20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe runtime
        run: python -m pip install --disable-pip-version-check requests pdfplumber
      - name: Compare reviewed and current Ravenna rows
        env:
          OLD_URL: https://prefettura.interno.gov.it/sites/default/files/64/2026-09/nuova_tabella_unica_17-sett-2026.pdf
          OLD_SHA: 8d249118ca1fc90cb744a5a630a3c991eee44a963576a031596c9209910ac555
          NEW_URL: https://prefettura.interno.gov.it/sites/default/files/64/2026-09/nuova_tabella_unica_18sett26.pdf
          NEW_SHA: 0ce84f5b90d8f820318c1acdc4cd082ee29ce671134e6e2c62dd19aed8ad4d4a
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, io, json, os, re, time
          from pathlib import Path
          import pdfplumber, requests

          header_expected=(
              'N. prog.','Ragione sociale e p. iva / cf','Indirizzo sede legale','DATA PRIMA RICHIESTA',
              'DATA ISCRIZIONE/ RINNOVO','NOTE','sez. I','sez.II','sez. III','sez. IV','sez. V',
              'sez. VI','sez. VII','sez. VIII','sez. IX','sez. X')
          def clean(v): return ' '.join((v or '').split())
          def fetch(url, expected_sha, label):
              r=requests.get(url,headers={'User-Agent':'Mozilla/5.0 (compatible; italian-anti-mafia-whitelist-diff/1.0)','Cache-Control':'no-cache','Pragma':'no-cache'},timeout=(20,90))
              if r.status_code!=200 or not r.content.startswith(b'%PDF'): raise RuntimeError(f'{label} fetch invalid HTTP {r.status_code}')
              sha=hashlib.sha256(r.content).hexdigest()
              if sha!=expected_sha: raise RuntimeError(f'{label} digest drift: expected {expected_sha}, got {sha}')
              return r.content
          def extract(payload,label):
              by_progressive={}; page_rows=[]
              with pdfplumber.open(io.BytesIO(payload)) as pdf:
                  for pno,page in enumerate(pdf.pages,1):
                      matches=[]
                      for table in page.extract_tables():
                          if table and table[0] and tuple(clean(x) for x in table[0])==header_expected: matches.append(table)
                      if len(matches)!=1: raise RuntimeError(f'{label} page {pno}: expected one exact table, got {len(matches)}')
                      rows=[[clean(x) for x in row] for row in matches[0][1:] if any(clean(x) for x in row)]
                      page_rows.append(len(rows))
                      for row in rows:
                          if len(row)!=16 or not row[0].isdigit(): raise RuntimeError(f'{label} page {pno}: malformed row {row!r}')
                          if row[0] in by_progressive: raise RuntimeError(f'{label}: duplicate progressive {row[0]}')
                          by_progressive[row[0]]={'page':pno,'row':row}
              return by_progressive,page_rows

          old,old_pages=extract(fetch(os.environ['OLD_URL'],os.environ['OLD_SHA'],'old'),'old')
          new,new_pages=extract(fetch(os.environ['NEW_URL'],os.environ['NEW_SHA'],'new'),'new')
          old_ids=set(old); new_ids=set(new)
          removed=sorted(old_ids-new_ids,key=int); added=sorted(new_ids-old_ids,key=int)
          changed=[]
          for prog in sorted(old_ids & new_ids,key=int):
              if old[prog]['row']!=new[prog]['row']:
                  diffs=[]
                  names=['progressive','company','office','application','listing','note','I','II','III','IV','V','VI','VII','VIII','IX','X']
                  for idx,(a,b) in enumerate(zip(old[prog]['row'],new[prog]['row'])):
                      if a!=b: diffs.append({'field':names[idx],'old':a,'new':b})
                  changed.append({'progressive':prog,'old_page':old[prog]['page'],'new_page':new[prog]['page'],'field_diffs':diffs})
          receipt={
              'authority_key':'ravenna','compared_at_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
              'old':{'url':os.environ['OLD_URL'],'sha256':os.environ['OLD_SHA'],'row_count':len(old),'page_rows':old_pages},
              'new':{'url':os.environ['NEW_URL'],'sha256':os.environ['NEW_SHA'],'row_count':len(new),'page_rows':new_pages},
              'added_progressives':added,'removed_progressives':removed,'changed_row_count':len(changed),'changed_rows':changed
          }
          Path('tmp/ravenna-source-diff-2026-09-22.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY
      - name: Checkpoint source diff
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/ravenna-source-diff-2026-09-22.json
          git diff --cached --quiet && exit 0
          git commit -m 'Checkpoint Ravenna source row diff'
          git push origin HEAD:expansion/ravenna-2026-09-20
