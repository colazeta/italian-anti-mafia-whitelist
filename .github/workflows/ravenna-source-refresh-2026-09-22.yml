name: Ravenna source refresh 2026-09-22

on:
  push:
    branches: [expansion/ravenna-2026-09-20]
    paths: ['.github/workflows/ravenna-source-refresh-2026-09-22.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ravenna-source-refresh-2026-09-22
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/ravenna-2026-09-20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe runtime
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Reverify Ravenna evidence channels
        env:
          LANDING_URL: https://prefettura.interno.gov.it/it/prefetture/ravenna/evidenza/white-list
          REVIEWED_PDF_URL: https://prefettura.interno.gov.it/sites/default/files/64/2026-09/nuova_tabella_unica_17-sett-2026.pdf
          REVIEWED_SHA256: 8d249118ca1fc90cb744a5a630a3c991eee44a963576a031596c9209910ac555
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, time
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          landing_url=os.environ['LANDING_URL']
          reviewed_url=os.environ['REVIEWED_PDF_URL']
          reviewed_sha=os.environ['REVIEWED_SHA256']
          headers={'User-Agent':'Mozilla/5.0 (compatible; italian-anti-mafia-whitelist-source-probe/1.2)','Cache-Control':'no-cache','Pragma':'no-cache'}
          def get(url, accept, nonce):
              h=dict(headers); h['Accept']=accept
              sep='&' if '?' in url else '?'
              last=None
              for retry in range(3):
                  try:
                      r=requests.get(f'{url}{sep}probe={nonce}-{retry}',headers=h,timeout=(20,90),allow_redirects=True)
                      last=r
                      if r.status_code==200: return r
                  except requests.RequestException as exc:
                      last=exc
                  time.sleep(2*(retry+1))
              if isinstance(last,requests.Response): return last
              raise RuntimeError(f'GET failed: {last!r}')

          landing=get(landing_url,'text/html,*/*;q=0.8',int(time.time()*1000))
          landing_verified=False; selected=None; links=[]
          if landing.status_code==200:
              soup=BeautifulSoup(landing.text,'html.parser')
              for a in soup.find_all('a',href=True):
                  href=urljoin(landing.url,a['href']).split('?probe=')[0]
                  label=' '.join(a.get_text(' ',strip=True).split())
                  if '/sites/default/files/' in href: links.append({'label':label,'url':href})
              candidates=[x for x in links if x['label']=='Nuova tabella unica aggiornata']
              if len(candidates)!=1:
                  raise RuntimeError(f'positive landing verification found ambiguous Ravenna attachments: {candidates!r}; links={links!r}')
              selected=candidates[0]
              if selected['url']!=reviewed_url:
                  raise RuntimeError(f'positive Ravenna current attachment drift: reviewed={reviewed_url!r}, current={selected!r}')
              landing_verified=True
          elif landing.status_code!=403:
              raise RuntimeError(f'official landing returned unexpected HTTP {landing.status_code}')

          copies=[]; payloads=[]
          for attempt in (1,2):
              r=get(reviewed_url,'application/pdf,*/*;q=0.8',f'{int(time.time()*1000)}-{attempt}')
              copies.append({'attempt':attempt,'http_status':r.status_code,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest() if r.status_code==200 else None})
              if r.status_code!=200 or not r.content.startswith(b'%PDF'):
                  raise RuntimeError(f'reviewed Ravenna resource unavailable on independent fetch {attempt}: {copies[-1]!r}')
              payloads.append(r.content)
          if payloads[0]!=payloads[1]: raise RuntimeError(f'independent Ravenna resource fetches differ: {copies!r}')
          if copies[0]['sha256']!=reviewed_sha: raise RuntimeError(f'Ravenna reviewed-resource content drift: reviewed={reviewed_sha}, current={copies[0]!r}')

          receipt={
              'authority_key':'ravenna','checked_at_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
              'landing_url':landing_url,'landing_http_status':landing.status_code,'landing_currentness_reverified':landing_verified,
              'selected_attachment_from_landing':selected,'landing_attachment_links':links,
              'reviewed_resource_url':reviewed_url,'independent_resource_fetches':copies,
              'resource_byte_identical':True,'reviewed_sha256_match':True,
              'interpretation':('current official landing and reviewed resource both reverified' if landing_verified else 'landing returned HTTP 403; reviewed resource bytes independently reverified, but currentness was not inferred')
          }
          Path('tmp').mkdir(exist_ok=True)
          Path('tmp/ravenna-source-probe-2026-09-22.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY
      - name: Checkpoint verification receipt
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/ravenna-source-probe-2026-09-22.json
          git diff --cached --quiet && exit 0
          git commit -m 'Checkpoint partial 2026-09-22 Ravenna source verification'
          git push origin HEAD:expansion/ravenna-2026-09-20
