name: Cuneo applicant title repair 2026-09-19

on:
  push:
    branches:
      - expansion/cuneo-2026-09-19
    paths:
      - .github/workflows/cuneo-applicant-title-repair-2026-09-19.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/cuneo-2026-09-19
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Normalise whitespace without weakening positive title evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/white_list_archive/parsers/cuneo_positioned.py')
          text = path.read_text()
          old = '''    if "elenco delle ditte richiedenti l'iscrizione nella white list" not in page_texts[0].replace("’", "'").replace("‘", "'"):\n        raise RuntimeError("cuneo_applicants: positive applicant-population title missing")\n'''
          new = '''    applicant_title_text = " ".join(\n        page_texts[0].replace("’", "'").replace("‘", "'").split()\n    )\n    if "elenco delle ditte richiedenti l'iscrizione nella white list" not in applicant_title_text:\n        raise RuntimeError("cuneo_applicants: positive applicant-population title missing")\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one title assertion target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python -m compileall -q src/white_list_archive/parsers/cuneo_positioned.py
          git diff --check
          git diff -- src/white_list_archive/parsers/cuneo_positioned.py
      - name: Commit parser repair only
        run: |
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^ M src/white_list_archive/parsers/cuneo_positioned.py$' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/white_list_archive/parsers/cuneo_positioned.py
          git commit -m "Normalise Cuneo applicant title whitespace"
          git push origin HEAD:expansion/cuneo-2026-09-19
