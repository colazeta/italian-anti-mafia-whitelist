name: Crotone grouping reconciliation 2026-09-11

on:
  push:
    branches: [expansion/crotone-2026-09-11]
    paths: [.github/workflows/crotone-grouping-reconciliation-2026-09-11.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/crotone-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[publication]'
      - name: Reconcile parser semantic grouping against byte-pinned source
        run: |
          python - <<'PY'
          import hashlib, json, time
          from collections import Counter, defaultdict
          from pathlib import Path
          from urllib.request import Request, urlopen
          import pdfplumber
          import white_list_archive.parsers.crotone_tables as c

          url='https://prefettura.interno.gov.it/sites/default/files/0/2026-09/ditte-iscritte-white-list-2.pdf'
          sha='c9a2774c5842b895cd0bb18be3fe30a0c8858b2d67e985a993983e1834f0d511'
          last=None
          for i in range(5):
              try:
                  with urlopen(Request(url,headers={'User-Agent':'italian-anti-mafia-whitelist/0.1 (+grouping reconciliation)','Accept':'application/pdf,*/*'}),timeout=90) as r:
                      body=r.read()
                  break
              except Exception as exc:
                  last=exc; time.sleep(4*(i+1))
          else:
              raise last
          assert hashlib.sha256(body).hexdigest()==sha
          source=Path('/tmp/crotone-listed.pdf'); source.write_bytes(body)

          rows=[]; current=None; carried=0
          with pdfplumber.open(source) as pdf:
              assert len(pdf.pages)==130
              for page_number,page in enumerate(pdf.pages,start=1):
                  hits=[int(v) for v in c._SECTION.findall(page.extract_text() or '')]
                  assert len(set(hits)) <= 1, (page_number,hits)
                  page_section=hits[0] if hits else None
                  tables=page.extract_tables() or []
                  if page_section is not None:
                      current=page_section
                  for table_number,table in enumerate(tables,start=1):
                      previous=None
                      for row_number,row in enumerate(table or [],start=1):
                          cells=[c._clean(cell) for cell in row]
                          if not any(cells): continue
                          assert len(cells)==6,(page_number,row_number,cells)
                          if c._is_header(cells):
                              if page_section is not None: current=page_section
                              continue
                          assert current is not None
                          if not cells[0]:
                              assert previous is not None and not any(cells[:3]) and (cells[3] or cells[4] or cells[5]), (page_number,row_number,cells)
                              cells=previous[:3]+cells[3:]; carried += 1
                          listing=c._parse_date(cells[3],allow_blank=True)
                          expiry,tail=c._parse_expiry(cells[4])
                          rows.append({'page':page_number,'table':table_number,'row':row_number,'section':current,'name':cells[0],'id':cells[1],'office':cells[2],'listing_raw':cells[3],'listing':listing,'expiry_raw':cells[4],'expiry':expiry,'tail':tail,'note':cells[5],'status':c._status(tail,cells[5])})
                          previous=cells
          assert len(rows)==743
          assert carried==1

          def semantic_key(r):
              return (c._normalise_text(r['name']),c._normalise_text(r['id']),c._normalise_address(r['office']),c._date_key(r['listing_raw'],r['listing']),c._date_key(r['expiry_raw'],r['expiry']),r['status'])
          groups=defaultdict(list)
          for r in rows: groups[semantic_key(r)].append(r)
          duplicate_same_section=[]; raw_date_variant_groups=[]
          for key,rs in groups.items():
              sections=[r['section'] for r in rs]
              if len(sections)!=len(set(sections)):
                  duplicate_same_section.append({'key':key,'rows':rs})
              variants={(r['listing_raw'],r['expiry_raw']) for r in rs}
              if len(variants)>1:
                  raw_date_variant_groups.append({'key':key,'date_variants':sorted([list(v) for v in variants]),'rows':rs})
          status_counts=dict(Counter(rs[0]['status'] for rs in groups.values()))
          out={'audited_on':'2026-09-11','sha256':sha,'sector_rows':len(rows),'semantic_group_count':len(groups),'semantic_group_status_counts':status_counts,'same_section_duplicate_count':len(duplicate_same_section),'same_section_duplicates':duplicate_same_section,'raw_date_variant_group_count':len(raw_date_variant_groups),'raw_date_variant_groups':raw_date_variant_groups,'reviewed_listing_typography':c._REVIEWED_DATE_TYPOGRAPHY,'reviewed_ambiguous_listing_raw':sorted(c._REVIEWED_AMBIGUOUS_DATE_RAW),'reviewed_expiry_typography':c._REVIEWED_EXPIRY_TYPOGRAPHY}
          Path('tmp/crotone-grouping-reconciliation.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'semantic_group_count':len(groups),'semantic_group_status_counts':status_counts,'same_section_duplicate_count':len(duplicate_same_section),'raw_date_variant_group_count':len(raw_date_variant_groups)},ensure_ascii=False))
          PY
      - name: Commit reconciliation checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/crotone-grouping-reconciliation.json
          git commit -m 'Checkpoint Crotone grouping reconciliation'
          git push origin HEAD:expansion/crotone-2026-09-11
