name: Brindisi production gate 2026-09-11

on:
  push:
    branches: [expansion/brindisi-2026-09-11]
    paths:
      - scripts/brindisi_finalize.py
      - .github/workflows/brindisi-production-gate-2026-09-11.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run Brindisi production finalizer'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/brindisi-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize reviewed Brindisi production integration
        run: |
          python scripts/brindisi_finalize.py
          git diff --check
      - name: Install complete validation runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install -e '.[dev,publication,database,storage]'
      - name: Validate repository and national build
        run: |
          pytest -q
          rm -rf /tmp/brindisi-production-build /tmp/brindisi-production-sources
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/brindisi-production-sources \
            --registry-json /tmp/brindisi-production-build/registry.json \
            --registry-csv /tmp/brindisi-production-build/registry.csv \
            --prefectures-json /tmp/brindisi-production-build/prefectures.json \
            --prefectures-csv /tmp/brindisi-production-build/prefectures.csv
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          reg=json.loads(Path('/tmp/brindisi-production-build/registry.json').read_text())
          pref=json.loads(Path('/tmp/brindisi-production-build/prefectures.json').read_text())
          assert reg['meta']['record_count']==17714,reg['meta']
          assert reg['meta']['authority_count']==21 and reg['meta']['register_count']==22
          assert reg['meta']['authority_counts']['brindisi']==411
          assert reg['meta']['register_counts']['brindisi-ordinary']==411
          assert pref['meta']['authority_count']==106 and pref['meta']['published_count']==21 and pref['meta']['mapped_count']==35
          br=[x for x in pref['prefectures'] if x['authority_key']=='brindisi']
          assert len(br)==1 and br[0]['mapped'] and br[0]['published']
          records=[r for r in reg['records'] if r['authority_key']=='brindisi']
          assert len(records)==411
          assert sum(r['source_key']=='brindisi-listed' for r in records)==385
          assert sum(r['source_key']=='brindisi-applicants' for r in records)==26
          assert Counter(r['source_status'] for r in records)==Counter({'listed':341,'pending':26,'renewal_update_in_progress':44})
          print('Brindisi national candidate validated:',reg['meta']['record_count'],pref['meta'])
          PY
      - name: Commit reviewed production files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/public-pages.yml \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            data/source_registry/verified_primary_pages.csv \
            docs/sources/brindisi-operational-check-2026-09-11.md \
            src/white_list_archive/publishing/public_national_registry.py \
            tests/public_portal_browser.cjs \
            tests/test_operations.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Integrate Brindisi public archive'
          git push origin HEAD:expansion/brindisi-2026-09-11
