name: Align Como public acceptance gates

on:
  push:
    branches:
      - expansion/como-2026-09-17
    paths:
      - '.github/workflows/como-align-public-gates.yml'

permissions:
  contents: write

concurrency:
  group: como-align-public-gates
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Como expansion
        uses: actions/checkout@v4
        with:
          ref: expansion/como-2026-09-17
          fetch-depth: 0

      - name: Align permanent public and browser acceptance gates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one replacement target, found {count}')
              return text.replace(old, new, 1)

          workflow = Path('.github/workflows/public-pages.yml')
          text = workflow.read_text(encoding='utf-8')
          text = replace_once(
              text,
              "      - 'src/white_list_archive/parsers/modena_tables.py'\n",
              "      - 'src/white_list_archive/parsers/modena_tables.py'\n      - 'src/white_list_archive/parsers/como_html.py'\n",
              'workflow parser trigger',
          )
          text = replace_once(text, "          assert reg['meta']['record_count'] == 57969\n", "          assert reg['meta']['record_count'] == 58378\n", 'record total')
          text = replace_once(text, "'sassari','milano','modena'}\n", "'sassari','milano','modena','como'}\n", 'authority set')
          text = replace_once(text, "'milano-ordinary','modena-provincial','modena-post-sisma'\n          }\n", "'milano-ordinary','modena-provincial','modena-post-sisma','como-ordinary'\n          }\n", 'register set')
          text = replace_once(text, "          assert reg['meta']['authority_count'] == 48\n", "          assert reg['meta']['authority_count'] == 49\n", 'authority count')
          text = replace_once(text, "          assert reg['meta']['register_count'] == 50\n", "          assert reg['meta']['register_count'] == 51\n", 'register count')
          text = replace_once(text, "          assert pref['meta']['published_count'] == 48\n", "          assert pref['meta']['published_count'] == 49\n", 'published count')
          text = replace_once(text, "          assert pref['meta']['mapped_count'] == 48\n", "          assert pref['meta']['mapped_count'] == 49\n", 'mapped count')
          como_gate = """          como = [x for x in pref['prefectures'] if x['authority_key'] == 'como']
          assert len(como) == 1 and como[0]['mapped'] and como[0]['published'] and como[0]['series_count'] == 2
          como_records = [r for r in reg['records'] if r['authority_key'] == 'como']
          assert len(como_records) == 409
          assert sum(r['source_key'] == 'como-listed' for r in como_records) == 391
          assert sum(r['source_key'] == 'como-applicants' for r in como_records) == 18
          assert sum(r['source_status'] == 'listed' for r in como_records) == 359
          assert sum(r['source_status'] == 'renewal_update_in_progress' for r in como_records) == 32
          assert sum(r['source_status'] == 'pending' for r in como_records) == 18
          assert len({r['record_locator'] for r in como_records}) == 409
          assert sum(bool(r['identifiers']) for r in como_records) == 405
          assert sum(bool(r['identifier_field_raw']) and not r['identifiers'] for r in como_records) == 4
"""
          text = replace_once(
              text,
              "          modena = [x for x in pref['prefectures'] if x['authority_key'] == 'modena']\n",
              como_gate + "          modena = [x for x in pref['prefectures'] if x['authority_key'] == 'modena']\n",
              'Como public acceptance block',
          )
          workflow.write_text(text, encoding='utf-8')

          browser = Path('tests/public_portal_browser.cjs')
          text = browser.read_text(encoding='utf-8')
          text = replace_once(
              text,
              "      assert.ok(labels.includes('White List — Prefettura di Milano · Prefettura di Milano'));\n",
              "      assert.ok(labels.includes('White List — Prefettura di Milano · Prefettura di Milano'));\n      assert.ok(labels.includes('White List ordinaria · Prefettura di Como'));\n",
              'Como browser label',
          )
          text = replace_once(text, "      assert.equal(stats.total,57969);\n", "      assert.equal(stats.total,58378);\n", 'browser total')
          text = replace_once(
              text,
              "'potenza','sassari','milano','modena'].includes(r.authority_key)",
              "'potenza','sassari','milano','modena','como'].includes(r.authority_key)",
              'baseline exclusion',
          )
          baseline = """      assert.deepEqual(statusCounts(previous),{
        cancellation_related:2,expired_observed:171,listed:2229,other_or_unknown:5,
        pending:1416,rejected_or_denied:12,renewal_requested:14,renewal_update_in_progress:1203
      });
"""
          como_browser = baseline + """      const como=registry.records.filter(r=>r.authority_key==='como');
      assert.equal(como.length,409);
      assert.equal(como.filter(r=>r.source_key==='como-listed').length,391);
      assert.equal(como.filter(r=>r.source_key==='como-applicants').length,18);
      assert.deepEqual(statusCounts(como),{listed:359,pending:18,renewal_update_in_progress:32});
"""
          text = replace_once(text, baseline, como_browser, 'Como browser record block')
          browser.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git add .github/workflows/public-pages.yml tests/public_portal_browser.cjs
          git commit -m 'test(como): align permanent public acceptance gates'
          git rm .github/workflows/como-align-public-gates.yml
          git commit -m 'chore(como): remove temporary gate-alignment workflow'
          git push origin HEAD:expansion/como-2026-09-17
