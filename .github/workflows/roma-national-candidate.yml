name: Roma national integration candidate

on:
  push:
    branches:
      - expansion/roma-2026-09-15
    paths:
      - '.github/workflows/roma-national-candidate.yml'
      - 'tmp/roma_integrate_candidate.py'
      - 'tmp/roma_fix_positioned_geometry.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roma-national-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PDF and project runtimes
        run: |
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install -e '.[dev,database,storage,publication]'
      - name: Reacquire Roma sources twice and verify approved bytes
        shell: bash
        run: |
          set -euo pipefail
          listed='https://prefettura.interno.gov.it/sites/default/files/57/2026-09/elenco-imprese-iscritte-alla-white-list-aggiornato-alla-data-di-pubblicazione.pdf'
          applicants='https://prefettura.interno.gov.it/sites/default/files/57/2026-09/elenco-imprese-richiedenti-iscrizione-alla-white-list-aggiornato-alla-data-di-pubblicazione.pdf'
          mkdir -p /tmp/roma-source
          for n in 1 2; do
            curl --fail --location --silent --show-error --retry 3 "$listed" -o "/tmp/roma-source/listed-$n.pdf"
            sleep 2
            curl --fail --location --silent --show-error --retry 3 "$applicants" -o "/tmp/roma-source/applicants-$n.pdf"
            sleep 2
          done
          cmp /tmp/roma-source/listed-1.pdf /tmp/roma-source/listed-2.pdf
          cmp /tmp/roma-source/applicants-1.pdf /tmp/roma-source/applicants-2.pdf
          test "$(sha256sum /tmp/roma-source/listed-1.pdf | cut -d' ' -f1)" = '8a2bbdb210757a8e7bf1da74db4bd7440c4fc45b3198b09e225c0aee2e6ef4af'
          test "$(sha256sum /tmp/roma-source/applicants-1.pdf | cut -d' ' -f1)" = '9bf34641f92b7480492646f0ab442b47305438a06547e1739dafd324c2b1b32a'
      - name: Apply reviewed Roma first-page geometry correction
        run: python tmp/roma_fix_positioned_geometry.py
      - name: Apply fail-closed Roma integration transaction
        run: python tmp/roma_integrate_candidate.py
      - name: Run full repository and Roma semantic tests
        run: |
          pytest -q
          pytest -q tests/test_roma_parser_semantics.py
      - name: Build actual national candidate
        run: |
          rm -rf /tmp/roma-public-site /tmp/roma-national-sources
          cp -a public-site /tmp/roma-public-site
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/roma-national-sources \
            --registry-json /tmp/roma-public-site/data/registry.json \
            --registry-csv /tmp/roma-public-site/data/registry.csv \
            --prefectures-json /tmp/roma-public-site/data/prefectures.json \
            --prefectures-csv /tmp/roma-public-site/data/prefectures.csv
      - name: Validate national candidate and exact Roma invariants
        run: |
          python -m white_list_archive.publishing.public_artifact /tmp/roma-public-site
          node --check /tmp/roma-public-site/app.js
          node --check /tmp/roma-public-site/summary.js
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root=Path('/tmp/roma-public-site/data')
          reg=json.loads((root/'registry.json').read_text(encoding='utf-8'))
          pref=json.loads((root/'prefectures.json').read_text(encoding='utf-8'))
          meta=reg['meta']
          assert meta['record_count'] == 46799, meta
          assert meta['authority_count'] == 40, meta
          assert meta['register_count'] == 41, meta
          assert len(reg['records']) == 46799
          assert meta['authority_counts']['roma'] == 4428
          assert meta['register_counts']['roma-ordinary'] == 4428
          assert pref['meta']['authority_count'] == 106
          assert pref['meta']['published_count'] == 40
          assert pref['meta']['mapped_count'] == 44
          rows=[record for record in reg['records'] if record['authority_key']=='roma']
          assert len(rows) == 4428
          scopes=Counter(record['population_scope'] for record in rows)
          assert scopes == Counter({'applicant':2259,'listed':2169}), scopes
          statuses=Counter(record['source_status'] for record in rows)
          assert statuses == Counter({'pending':2256,'listed':1215,'renewal_update_in_progress':957}), statuses
          assert len({record['record_locator'] for record in rows}) == 4428
          listed=[record for record in rows if record['population_scope']=='listed']
          applicants=[record for record in rows if record['population_scope']=='applicant']
          assert len(listed)==2169 and len(applicants)==2259
          assert sum(not record['observed_listing_date'] and not record['observed_expiry_date'] for record in listed) >= 9
          assert sum(not record['application_date'] for record in applicants) >= 20
          roma=[item for item in pref['prefectures'] if item['authority_key']=='roma']
          assert len(roma)==1 and roma[0]['mapped'] and roma[0]['published'] and roma[0]['series_count']==2, roma
          print({'record_count':meta['record_count'],'authority_count':meta['authority_count'],'register_count':meta['register_count'],'mapped_count':pref['meta']['mapped_count'],'roma_statuses':dict(statuses)})
          PY
      - name: Check exact production-only integration diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          data/monitoring/national_coverage.json
          data/publication/multi_prefecture_pilot.json
          data/source_registry/source_series_inventory.csv
          data/source_registry/verified_primary_pages.csv
          src/white_list_archive/parsers/roma_positioned.py
          src/white_list_archive/publishing/public_national_registry.py
          EOF
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
      - name: Commit validated production integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            data/source_registry/verified_primary_pages.csv \
            src/white_list_archive/parsers/roma_positioned.py \
            src/white_list_archive/publishing/public_national_registry.py
          git diff --cached --check
          git commit -m 'Integrate Roma public White List sources'
          git push origin HEAD:expansion/roma-2026-09-15
