name: Apply verified Aosta current source state

on:
  push:
    branches:
      - fix/aosta-source-drift-2026-09-10
    paths:
      - '.github/workflows/aosta-source-drift-diagnose.yml'

permissions:
  contents: write
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install publication runtime
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install -e '.[publication]'
      - name: Download last live-verified public registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/aosta-baseline
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/${{ github.repository }}/actions/artifacts/10146014803/zip \
            > /tmp/aosta-baseline/review.zip
          unzip -q /tmp/aosta-baseline/review.zip -d /tmp/aosta-baseline/site
          test -f /tmp/aosta-baseline/site/data/registry.json
      - name: Verify and record current Aosta semantics
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          from white_list_archive.publishing.public_contract import public_record
          from white_list_archive.publishing.public_national_registry import _download, _parse_source, _semantic_digest

          config_path = Path('data/publication/multi_prefecture_pilot.json')
          monitoring_path = Path('data/monitoring/national_coverage.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          monitoring = json.loads(monitoring_path.read_text(encoding='utf-8'))
          baseline = json.loads(Path('/tmp/aosta-baseline/site/data/registry.json').read_text(encoding='utf-8'))
          baseline_records = baseline['records']

          expected = {
              'aosta-listed': {
                  'raw': 'de10b4fe05ff6e77c1698d3b0d98c1a5603578417166440439e28107db4d354e',
                  'semantic': 'b82caff9c3c491dc8d44b407801b6d1f9e6a1c7620f3ce2270b10bb332b7e047',
                  'rows': 244,
                  'statuses': {'listed': 227, 'renewal_update_in_progress': 17},
              },
              'aosta-applicants': {
                  'raw': '6c2aaca63aa7bad2b7a95eed43ed31401b497f27167718275fd10ba736236d01',
                  'semantic': '06cc1155e2abc3e38c3d552d2009fa9e06a1d958aefaf13f080d6c7475b12b00',
                  'rows': 139,
                  'statuses': {'listed': 116, 'pending': 23},
              },
          }

          current = {}
          for key, exp in expected.items():
              cfg = next(item for item in config['sources'] if item['source_key'] == key)
              path = Path('/tmp') / f'{key}.pdf'
              raw = _download(cfg['resource_url'], path)
              assert raw == exp['raw'], (key, raw)
              parse_cfg = dict(cfg)
              parse_cfg['sha256'] = raw
              batch = _parse_source(path, parse_cfg)
              public = [public_record(record) for record in batch.records]
              semantic = _semantic_digest(public)
              statuses = dict(Counter(record['source_status'] for record in public))
              assert len(public) == exp['rows'], (key, len(public))
              assert semantic == exp['semantic'], (key, semantic)
              assert statuses == exp['statuses'], (key, statuses)
              current[key] = public

          def by_identity(records):
              return {(r.get('name', ''), r.get('identifier_field_raw', '')): r for r in records}

          old_listed = by_identity([r for r in baseline_records if r['source_key'] == 'aosta-listed'])
          new_listed = by_identity(current['aosta-listed'])
          san_giorgio = ('IMPRESA COSTRUZIONI SAN GIORGIO Srl', '00562570077')
          assert set(old_listed) - set(new_listed) == {san_giorgio}
          assert not (set(new_listed) - set(old_listed))

          old_app = by_identity([r for r in baseline_records if r['source_key'] == 'aosta-applicants'])
          new_app = by_identity(current['aosta-applicants'])
          assert set(old_app) == set(new_app)
          before = old_app[san_giorgio]
          after = new_app[san_giorgio]
          assert before['source_status'] == 'listed' and before['application_date'] == '2024-09-25'
          assert after['source_status'] == 'pending' and after['application_date'] == '2026-09-03'
          assert after['outcome_raw'] == 'Istruttoria in corso'
          assert after['requested_activities'] == ['C']

          for cfg in config['sources']:
              key = cfg['source_key']
              if key not in expected:
                  continue
              exp = expected[key]
              cfg['sha256'] = exp['raw']
              cfg['expected_source_rows'] = exp['rows']
              cfg['approval_mode'] = 'semantic_sha256'
              cfg['semantic_sha256'] = exp['semantic']
              if key == 'aosta-listed':
                  cfg['notes'] = (
                      'The official listed-company attachment is a mutable current resource. On 10 September 2026 repeated independent captures '
                      'stably exposed 244 complete source rows: 227 listed and 17 with explicit update/renewal text. Compared with the last live-verified '
                      'capture, IMPRESA COSTRUZIONI SAN GIORGIO Srl (00562570077) is no longer present in the listed series. Raw capture SHA-256 remains '
                      'observation provenance; publication fails closed unless parsed source semantics match this separately approved digest.'
                  )
              else:
                  cfg['notes'] = (
                      'The official applicant attachment is a mutable current resource. On 10 September 2026 repeated independent captures stably '
                      'exposed 139 request observations: 116 with source-explicit subsequent enrolment and 23 in istruttoria. Compared with the last '
                      'live-verified capture, IMPRESA COSTRUZIONI SAN GIORGIO Srl (00562570077) now has a 3 September 2026 application for activity C '
                      'with source outcome Istruttoria in corso. Raw capture SHA-256 remains observation provenance; publication fails closed unless '
                      'parsed source semantics match this separately approved digest.'
                  )

          aosta = next(item for item in monitoring['prefectures'] if item['authority_key'] == 'aosta')
          known = list(aosta.get('known_content_sha256') or [])
          for value in (expected['aosta-listed']['raw'], expected['aosta-applicants']['raw']):
              if value not in known:
                  known.append(value)
          aosta['known_content_sha256'] = known
          aosta['last_successful_source_check_at'] = '2026-09-10T11:34:23Z'
          aosta['last_attempted_source_check_at'] = '2026-09-10T11:34:23Z'
          aosta['monitoring_status'] = 'CURRENT'
          aosta['last_successful_investigation_on'] = '2026-09-10'

          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          monitoring_path.write_text(json.dumps(monitoring, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify full current national build
        run: |
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/public-national-sources \
            --registry-json /tmp/aosta-current-registry.json \
            --registry-csv /tmp/aosta-current-registry.csv \
            --prefectures-json /tmp/aosta-current-prefectures.json \
            --prefectures-csv /tmp/aosta-current-prefectures.csv
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('/tmp/aosta-current-registry.json').read_text())
          prefectures = json.loads(Path('/tmp/aosta-current-prefectures.json').read_text())
          assert registry['meta']['record_count'] == 8822, registry['meta']
          assert registry['meta']['authority_count'] == 12
          assert registry['meta']['register_count'] == 13
          assert prefectures['meta']['published_count'] == 12
          print(json.dumps({'registry': registry['meta'], 'prefectures': prefectures['meta']}, ensure_ascii=False))
          PY
      - name: Commit verified source-state update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/publication/multi_prefecture_pilot.json data/monitoring/national_coverage.json
          git diff --cached --check
          git commit -m 'Approve current Aosta source semantics'
          git push origin HEAD:fix/aosta-source-drift-2026-09-10
