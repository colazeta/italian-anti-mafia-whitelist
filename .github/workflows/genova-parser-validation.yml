name: Genova parser validation

on:
  push:
    branches:
      - expansion/genova-2026-09-12
    paths:
      - .github/workflows/genova-parser-validation.yml

# Validate the restored evidence-backed parser and all reviewed split-row identities.
permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/genova-2026-09-12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser runtime
        run: python -m pip install --disable-pip-version-check -e . requests pdfplumber
      - name: Validate exact sources and parser output
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import tempfile
          import requests
          from collections import Counter
          from white_list_archive.parsers.genova_tables import parse_genova_applicants, parse_genova_listed

          page = 'https://prefettura.interno.gov.it/it/prefetture/genova/elenco-imprese-iscritte-white-list'
          specs = {
              'listed': {
                  'source_key': 'genova-listed',
                  'population_scope': 'listed',
                  'url': 'https://prefettura.interno.gov.it/sites/default/files/0/2026-09/wl-10-09-26.pdf',
                  'sha256': 'baf72de8d1f28943a8e9ec2bdd6e95213eacd0058cd6799a04e233c06d9e5403',
              },
              'applicant': {
                  'source_key': 'genova-applicants',
                  'population_scope': 'applicant',
                  'url': 'https://prefettura.interno.gov.it/sites/default/files/0/2026-09/sez-richiedenti-10-09-26.pdf',
                  'sha256': '13ecfd8bea8616deea76349cd7592fd046d09f45e2b522c11dda1f084a4420a7',
              },
          }
          session = requests.Session()
          session.headers.update({'User-Agent': 'italian-anti-mafia-whitelist parser validation/1.0'})
          report = {'authority_key': 'genova', 'validated_on': '2026-09-12', 'sources': {}}
          with tempfile.TemporaryDirectory(prefix='genova-parser-validation-') as td:
              td = pathlib.Path(td)
              batches = {}
              for scope, spec in specs.items():
                  r = session.get(spec['url'], timeout=(15, 120))
                  r.raise_for_status()
                  sha = hashlib.sha256(r.content).hexdigest()
                  if sha != spec['sha256']:
                      raise SystemExit(f'{scope} source drift: {sha}')
                  source_path = td / f'{scope}.pdf'
                  source_path.write_bytes(r.content)
                  cfg = {
                      'source_key': spec['source_key'],
                      'authority_key': 'genova',
                      'authority_name': 'Prefettura di Genova',
                      'register_key': 'genova-ordinary',
                      'register_name': 'White List ordinaria',
                      'population_scope': spec['population_scope'],
                      'reference_date': '2026-09-10',
                      'source_page_url': page,
                      'resource_url': spec['url'],
                      'sha256': spec['sha256'],
                  }
                  batch = parse_genova_listed(source_path, cfg) if scope == 'listed' else parse_genova_applicants(source_path, cfg)
                  batches[scope] = batch
                  report['sources'][scope] = batch.diagnostics

              listed = batches['listed'].records
              applicants = batches['applicant'].records
              assert len(listed) == 652, len(listed)
              assert Counter(x['source_status'] for x in listed) == Counter({'listed': 528, 'renewal_update_in_progress': 124})
              assert len(applicants) == 110, len(applicants)
              assert Counter(x['source_status'] for x in applicants) == Counter({'pending': 110})
              assert all(x['capture_sha256'] == specs['listed']['sha256'] for x in listed)
              assert all(x['capture_sha256'] == specs['applicant']['sha256'] for x in applicants)
              assert all(x['population_scope'] == 'listed' for x in listed)
              assert all(x['population_scope'] == 'applicant' for x in applicants)

              fisia = [x for x in listed if x['name'] == 'FISIA ITALIMPIANTI SPA']
              assert len(fisia) == 1
              assert fisia[0]['identifiers'] == ['02340830997']
              assert fisia[0]['source_status'] == 'renewal_update_in_progress'
              assert fisia[0]['observed_listing_date'] == '2024-09-06'
              assert fisia[0]['observed_expiry_date'] == '2026-09-05'
              assert fisia[0]['requested_activities'] == ['Sezione 10']

              reviewed = {
                  'CRESTA & DELFINO SRL': ('01345600991', '2026-04-28', ['Sezione 1', 'Sezione 10']),
                  'CUNEO LUIGI': ('01067080992', '2026-08-05', ['Sezione 6', 'Sezione 10']),
                  'CURZI LUIGI - AUTOTRASPORTI C/TERZI': ('03185270109', '2026-05-05', ['Sezione 6']),
                  'DAMA SRL': ('02830520991', '2026-05-07', ['Sezione 1']),
                  'DASSORI SRL': ('02665830994', '2026-03-05', ['Sezione 1']),
                  'DE BREEZE SRL': ('03047520998', '2026-05-19', ['Sezione 3', 'Sezione 4', 'Sezione 5']),
              }
              by_name = {x['name']: x for x in applicants if x['name'] in reviewed}
              assert set(by_name) == set(reviewed)
              for name, (identifier, application_date, activities) in reviewed.items():
                  record = by_name[name]
                  assert record['identifiers'] == [identifier], (name, record['identifiers'])
                  assert record['application_date'] == application_date, (name, record['application_date'])
                  assert record['requested_activities'] == activities, (name, record['requested_activities'])
              assert by_name['DE BREEZE SRL']['source_fields']['application_date_raw'] == '1 9 / 0 5 / 2 0 2 6'

              edilq = [x for x in applicants if x['name'] == 'EDILQUADRIFOGLIO SRL']
              assert len(edilq) == 1
              assert edilq[0]['identifiers'] == ['01660680990']
              assert edilq[0]['registered_office'] == 'GENOVA VIA CESAREA, 11/6'
              assert edilq[0]['application_date'] == '2026-07-03'

              raw_anomalies = {x['name']: x for x in listed if x['name'] in {'PARODI PAOLO', 'PIROMALLI ANTONINO srl', 'ROSSI ROBERTO', 'TRAVERSO SERGIO'}}
              assert raw_anomalies['PARODI PAOLO']['identifier_field_raw'] == '018509000992'
              assert raw_anomalies['PARODI PAOLO']['identifiers'] == []
              assert raw_anomalies['PIROMALLI ANTONINO srl']['identifiers'] == []
              assert raw_anomalies['ROSSI ROBERTO']['identifiers'] == []
              assert raw_anomalies['TRAVERSO SERGIO']['identifiers'] == []

              genovarent = [x for x in listed if x['name'] == 'GENOVARENT SRL']
              assert len(genovarent) == 1
              assert genovarent[0]['source_fields']['listing_date_raw'] == '26//09/2023'
              assert genovarent[0]['observed_listing_date'] == ''
              scaccia = [x for x in applicants if x['name'] == 'LO SCACCIA PENSIERI SRL']
              assert len(scaccia) == 1
              assert scaccia[0]['source_fields']['application_date_raw'] == '16/072026'
              assert scaccia[0]['application_date'] == ''

              report['total_records'] = len(listed) + len(applicants)
              report['status_counts'] = dict(Counter(x['source_status'] for x in listed + applicants))
              report['listed_identifier_coverage'] = sum(bool(x['identifiers']) for x in listed)
              report['applicant_identifier_coverage'] = sum(bool(x['identifiers']) for x in applicants)

          out = pathlib.Path('tmp/genova_parser_validation.json')
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Checkpoint validation
        run: |
          test -f tmp/genova_parser_validation.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/genova_parser_validation.json
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint Genova parser validation'
            git push origin HEAD:expansion/genova-2026-09-12
          fi
