name: Cuneo finalizer runner 2026-09-19

on:
  push:
    branches:
      - expansion/cuneo-2026-09-19
    paths:
      - .github/workflows/cuneo-finalizer-runner-2026-09-19.yml

permissions:
  contents: write

jobs:
  run-reviewed-finalizer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/cuneo-2026-09-19
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check scope then execute reviewed finalizer run blocks
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "daa7c0efd9c91e15b39272f93f3e6260178cea6f"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --name-only origin/main...HEAD | sort
          python - <<'PY'
          import subprocess
          from pathlib import Path

          lines = Path('.github/workflows/cuneo-integration-finalizer-2026-09-19.yml').read_text().splitlines()
          steps = []
          i = 0
          while i < len(lines):
              if lines[i].startswith('      - name: '):
                  name = lines[i].split(': ', 1)[1]
                  j = i + 1
                  while j < len(lines) and lines[j] != '        run: |' and not lines[j].startswith('      - name: ') and not lines[j].startswith('      - uses: '):
                      j += 1
                  if j < len(lines) and lines[j] == '        run: |':
                      j += 1
                      block = []
                      while j < len(lines) and not lines[j].startswith('      - name: ') and not lines[j].startswith('      - uses: '):
                          line = lines[j]
                          block.append(line[10:] if line.startswith('          ') else line)
                          j += 1
                      steps.append((name, '\n'.join(block)))
                      i = j
                      continue
              i += 1

          expected = {
              'Verify branch is based on current main and parser-only before permanent integration',
              'Materialise permanent Cuneo integration',
              'Install publication runtime',
              'Run targeted regression tests',
              'Build and validate full national candidate',
              'Commit permanent integration only',
          }
          observed = {name for name, _ in steps}
          if observed != expected:
              raise SystemExit(f'unexpected finalizer steps: {sorted(observed)}')

          for name, script in steps:
              if name == 'Verify branch is based on current main and parser-only before permanent integration':
                  continue
              print(f'::group::{name}', flush=True)
              subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)
              print('::endgroup::', flush=True)
          PY
