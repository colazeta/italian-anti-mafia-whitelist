name: Cosenza geocoding validation one-shot

on:
  push:
    branches:
      - research/cosenza-geocode-validation
    paths:
      - 'src/white_list_archive/geocoding/**'
      - 'tests/test_geocoding_validation.py'
      - 'pyproject.toml'
      - '.github/workflows/cosenza-geocode-validation-one-shot.yml'
  workflow_dispatch:

concurrency:
  group: cosenza-geocode-validation-one-shot
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: whitelist
          POSTGRES_USER: whitelist
          POSTGRES_PASSWORD: whitelist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whitelist -d whitelist"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      PGPASSWORD: whitelist
      TEST_DSN: postgresql://whitelist:whitelist@localhost:5432/whitelist
      NOMINATIM_ENDPOINT: https://nominatim.openstreetmap.org

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install project and acquisition utilities
        run: |
          python -m pip install -e .[dev,database]
          sudo apt-get update
          sudo apt-get install -y poppler-utils postgresql-client
          pytest -q tests/test_nominatim_provider.py tests/test_geocoding_validation.py

      - name: Apply PostgreSQL schema
        run: psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -f db/apply.sql

      - name: Capture and verify the two frozen Cosenza editions
        run: |
          white-list-cosenza-capture \
            https://prefettura.interno.gov.it/it/prefetture/cosenza/white-list-elenchi-aggiornati-28-giugno-2026 \
            https://prefettura.interno.gov.it/it/prefetture/cosenza/white-list-elenchi-aggiornati-03-agosto-2026
          python - <<'PY'
          import json
          from pathlib import Path
          live = {item['reference_date']: item for item in json.loads(Path('artifacts/cosenza-capture/manifest.json').read_text())}
          frozen = {
              '2026-06-28': json.loads(Path('data/captures/cosenza/combined_2026-06-28.json').read_text()),
              '2026-08-03': json.loads(Path('data/captures/cosenza/combined_2026-08-03.json').read_text()),
          }
          keys = ['resource_url', 'sha256', 'text_sha256', 'schema_fingerprint', 'page_count']
          if set(live) != set(frozen):
              raise SystemExit(f'Unexpected live edition set: {sorted(live)}')
          for reference_date, expected in frozen.items():
              observed = live[reference_date]
              mismatches = {key: {'expected': expected[key], 'observed': observed.get(key)} for key in keys if observed.get(key) != expected.get(key)}
              if mismatches:
                  raise SystemExit(f'Frozen content identity mismatch for {reference_date}: {mismatches}')
          print('Frozen Cosenza content identities verified.')
          PY

      - name: Persist source graph and rich v2 observations
        run: |
          white-list-persist-capture-manifests --dsn "$TEST_DSN" \
            data/captures/cosenza/combined_2026-06-28.json \
            data/captures/cosenza/combined_2026-08-03.json
          white-list-cosenza-v2 \
            artifacts/cosenza-capture/2026-06-28/combined.pdf \
            artifacts/cosenza-capture/2026-08-03/combined.pdf \
            --output-dir artifacts/cosenza-v2
          white-list-persist-parsed-records-v2 --dsn "$TEST_DSN" \
            --capture-manifest data/captures/cosenza/combined_2026-06-28.json \
            --parse-manifest artifacts/cosenza-v2/parse_manifest_v2.json \
            --parse-label before \
            --records artifacts/cosenza-v2/before_records_v2.csv
          white-list-persist-parsed-records-v2 --dsn "$TEST_DSN" \
            --capture-manifest data/captures/cosenza/combined_2026-08-03.json \
            --parse-manifest artifacts/cosenza-v2/parse_manifest_v2.json \
            --parse-label after \
            --records artifacts/cosenza-v2/after_records_v2.csv
          psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -f db/tests/005_cosenza_v2_live_counts.sql

      - name: Canonicalise Cosenza addresses
        run: |
          white-list-semantic-pipeline \
            --dsn "$TEST_DSN" \
            --series-code cosenza-combined \
            > artifacts/cosenza-v2/semantic_pipeline.json
          psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -f db/tests/006_cosenza_semantic_pipeline.sql

      - name: Preflight one-time public Nominatim batch
        run: |
          mkdir -p artifacts/cosenza-geocode-validation
          python - <<'PY'
          import json
          import os
          import psycopg
          from pathlib import Path
          with psycopg.connect(os.environ['TEST_DSN']) as conn, conn.cursor() as cur:
              cur.execute("SELECT count(*), count(DISTINCT btrim(full_address)) FROM core.address")
              address_ids, unique_queries = map(int, cur.fetchone())
              cur.execute("SELECT country_code,count(*) FROM core.address GROUP BY country_code ORDER BY country_code")
              source_country_counts = {str(code): int(count) for code, count in cur.fetchall()}
          payload = {
              'canonical_address_ids': address_ids,
              'unique_queries': unique_queries,
              'source_country_counts': source_country_counts,
              'public_endpoint': os.environ['NOMINATIM_ENDPOINT'],
              'execution_mode': 'one-shot_single-thread_single-machine_cached',
          }
          Path('artifacts/cosenza-geocode-validation/preflight.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          print(json.dumps(payload, indent=2))
          if not (1000 <= unique_queries <= 2000):
              raise SystemExit(f'Unexpected Cosenza geocoding scope: {unique_queries} unique queries')
          PY

      - name: Geocode every canonical Cosenza address once
        run: |
          white-list-normalise-addresses \
            --dsn "$TEST_DSN" \
            --endpoint "$NOMINATIM_ENDPOINT" \
            --allow-public-nominatim \
            --search-limit 3 \
            > artifacts/cosenza-geocode-validation/geocode_run.json
          cat artifacts/cosenza-geocode-validation/geocode_run.json

      - name: Build reproducible validation pack
        run: |
          white-list-geocode-validation \
            --dsn "$TEST_DSN" \
            --provider-name nominatim \
            --provider-endpoint "$NOMINATIM_ENDPOINT" \
            --sample-size 150 \
            --output-dir artifacts/cosenza-geocode-validation \
            > artifacts/cosenza-geocode-validation/validation_stdout.json
          cat artifacts/cosenza-geocode-validation/README.md
          cat artifacts/cosenza-geocode-validation/README.md >> "$GITHUB_STEP_SUMMARY"

      - name: Export all provider candidates for audit
        run: |
          psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 <<'SQL'
          \copy (
            SELECT a.full_address AS source_address,
                   g.provider_name,g.provider_endpoint,g.provider_version,g.provider_data_updated,
                   g.candidate_rank,g.match_status_code,g.precision_code,
                   g.query_text,g.matched_address,
                   g.normalised_street_name,g.normalised_house_number,g.normalised_postal_code,
                   g.normalised_locality,g.normalised_admin_unit_l2,g.normalised_admin_unit_l1,
                   g.normalised_country_name,g.normalised_country_code,
                   g.latitude,g.longitude,g.provider_result_id,
                   g.provider_attribution,g.provider_licence
            FROM geo.address_geocode_result g
            JOIN core.address a USING(address_id)
            WHERE g.provider_name='nominatim'
              AND g.provider_endpoint='https://nominatim.openstreetmap.org'
              AND upper_inf(g.system_period)
            ORDER BY a.full_address,g.candidate_rank
          ) TO 'artifacts/cosenza-geocode-validation/all_provider_candidates.csv' WITH CSV HEADER
          SQL

      - name: Validate pilot completeness without judging geocoder quality
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/cosenza-geocode-validation')
          preflight = json.loads((root/'preflight.json').read_text())
          run = json.loads((root/'geocode_run.json').read_text())
          summary = json.loads((root/'summary.json').read_text())
          if summary['total_canonical_addresses'] != preflight['canonical_address_ids']:
              raise SystemExit('Validation total does not reconcile with preflight canonical addresses')
          if summary['distinct_source_address_strings'] != preflight['unique_queries']:
              raise SystemExit('Validation distinct-query total does not reconcile with preflight')
          if summary['unprocessed'] != 0:
              raise SystemExit(f"Pilot left {summary['unprocessed']} addresses unprocessed")
          if summary['manual_sample_rows'] != 150:
              raise SystemExit(f"Unexpected manual sample size: {summary['manual_sample_rows']}")
          if run['accepted'] != 0:
              raise SystemExit('Candidate-by-default pilot unexpectedly accepted geocodes')
          if run['unique_queries'] != preflight['unique_queries']:
              raise SystemExit('Geocoder unique-query count does not reconcile with preflight')
          if run['network_queries'] != preflight['unique_queries']:
              raise SystemExit('One-shot baseline should make exactly one search request per unique source string')
          print('Pilot completeness validated; geocoder quality remains an empirical output, not a CI threshold.')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: cosenza-geocode-validation
          path: artifacts/cosenza-geocode-validation/
          if-no-files-found: error
          retention-days: 30
