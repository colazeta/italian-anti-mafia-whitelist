name: Audit current Biella source drift

on:
  push:
    branches:
      - expansion/asti-2026-09-10
    paths:
      - '.github/workflows/biella-drift-audit-2026-09-10.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/asti-2026-09-10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit runtime
        run: python -m pip install -e '.[publication]'
      - name: Compare current official Biella tables with currently published records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, time, urllib.request
          from pathlib import Path
          from white_list_archive.parsers.biella_html import parse_biella_listed, parse_biella_applicants

          source_url='https://prefettura.interno.gov.it/it/prefetture/biella/evidenza/white-list'
          live_url='https://colazeta.github.io/italian-anti-mafia-whitelist/data/registry.json'
          headers={'User-Agent':'Mozilla/5.0 italian-anti-mafia-whitelist source audit/1.0'}

          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r:
                  data=r.read()
                  return data, dict(r.headers)

          raw1, source_headers1=get(source_url)
          time.sleep(1)
          raw2, source_headers2=get(source_url)
          sha1=hashlib.sha256(raw1).hexdigest()
          sha2=hashlib.sha256(raw2).hexdigest()
          Path('/tmp/biella-1.html').write_bytes(raw1)
          Path('/tmp/biella-2.html').write_bytes(raw2)
          live_raw, _=get(live_url)
          live=json.loads(live_raw)

          cfg=json.loads(Path('data/publication/multi_prefecture_pilot.json').read_text())
          biella={s['source_key']:dict(s) for s in cfg['sources'] if s['authority_key']=='biella'}
          assert set(biella)=={'biella-listed','biella-applicants'}
          configured_sha=biella['biella-listed']['sha256']

          def parse(path, sha):
              local={k:dict(v,sha256=sha) for k,v in biella.items()}
              return {
                  'biella-listed': parse_biella_listed(path,local['biella-listed']).records,
                  'biella-applicants': parse_biella_applicants(path,local['biella-applicants']).records,
              }

          current1=parse(Path('/tmp/biella-1.html'),sha1)
          current2=parse(Path('/tmp/biella-2.html'),sha2)
          published={key:[r for r in live['records'] if r['source_key']==key] for key in current1}

          # parser_name/parser_version are added by the publication adapter, not by
          # the source parser; capture_sha256 is expected to change when the mutable
          # HTML wrapper changes. Neither is a source-semantic field.
          ignored={'capture_sha256','parser_name','parser_version'}
          def projection(records):
              return [{k:v for k,v in r.items() if k not in ignored} for r in records]
          def digest(records):
              payload=json.dumps(projection(records),ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
              return hashlib.sha256(payload).hexdigest()

          text=raw1.decode('utf-8','strict')
          dates=sorted(set(re.findall(r'(?:Ultimo aggiornamento|Aggiornato[^<]{0,30})[^0-9]{0,20}(\d{1,2}[./-]\d{1,2}[./-]\d{4})',text,re.I)))
          result={
              'configured_sha256':configured_sha,
              'current_sha256_first':sha1,
              'current_sha256_second':sha2,
              'raw_bytes_stable_across_two_requests':sha1==sha2,
              'http_last_modified_first':source_headers1.get('Last-Modified'),
              'http_last_modified_second':source_headers2.get('Last-Modified'),
              'visible_update_dates':dates,
              'listed_current':len(current1['biella-listed']),
              'listed_published':len(published['biella-listed']),
              'applicants_current':len(current1['biella-applicants']),
              'applicants_published':len(published['biella-applicants']),
              'listed_semantic_digest_first':digest(current1['biella-listed']),
              'listed_semantic_digest_second':digest(current2['biella-listed']),
              'listed_published_semantic_digest':digest(published['biella-listed']),
              'applicants_semantic_digest_first':digest(current1['biella-applicants']),
              'applicants_semantic_digest_second':digest(current2['biella-applicants']),
              'applicants_published_semantic_digest':digest(published['biella-applicants']),
          }
          print(json.dumps(result,indent=2,ensure_ascii=False))

          assert projection(current1['biella-listed']) == projection(current2['biella-listed']), 'Biella listed semantics changed across two immediate official-page requests'
          assert projection(current1['biella-applicants']) == projection(current2['biella-applicants']), 'Biella applicant semantics changed across two immediate official-page requests'
          assert projection(current1['biella-listed']) == projection(published['biella-listed']), 'Current Biella listed semantics differ from currently published records'
          assert projection(current1['biella-applicants']) == projection(published['biella-applicants']), 'Current Biella applicant semantics differ from currently published records'
          print('BIELLA_SEMANTIC_EQUIVALENCE_CONFIRMED')
          PY
