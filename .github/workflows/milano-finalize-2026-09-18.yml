name: Milano finalise 2026-09-18
on:
  push:
    branches: [fix/milano-source-drift-2026-09-18]
    paths: [.github/workflows/milano-finalize-2026-09-18.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Materialise permanent Milano transition
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, io, json

          COMBINED='8dd6ce95d933f6b892e056bdec5bc78a985bb6485504055cd7cbde0e8cbdad5c'
          REGISTERED='bfad4880c80cf465d6356e7ae518149f150781de69a712c8551320f25a92b195'
          EVID='docs/sources/milano-source-transition-2026-09-18.md'
          AT='2026-09-18T12:18:25Z'

          def replace_exact(path, old, new, count=1):
              p=Path(path); text=p.read_text(encoding='utf-8')
              actual=text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s) of {old!r}, found {actual}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          parser='src/white_list_archive/parsers/milano_webapp.py'
          replace_exact(parser,'PARSER_VERSION = "3"','PARSER_VERSION = "4"')
          replace_exact(parser,'_REFERENCE_DATE = "2026-09-17"','_REFERENCE_DATE = "2026-09-18"')
          replace_exact(parser,'    "listed": 940,','    "listed": 938,')
          replace_exact(parser,'    "renewal_update_in_progress": 514,','    "renewal_update_in_progress": 516,')

          replace_exact('tests/test_milano_parser_semantics.py','        "reference_date": "2026-09-17",','        "reference_date": "2026-09-18",')

          pub_path=Path('data/publication/multi_prefecture_pilot.json')
          pub=json.loads(pub_path.read_text(encoding='utf-8'))
          rows=[x for x in pub['sources'] if x.get('source_key')=='milano-combined'] if isinstance(pub,dict) and 'sources' in pub else [x for x in pub if x.get('source_key')=='milano-combined']
          if len(rows)!=1: raise SystemExit(f'Milano publication row count {len(rows)}')
          row=rows[0]
          row['reference_date']='2026-09-18'
          row['sha256']=COMBINED
          row['last_source_update']='2026-09-18'
          row['last_source_update_basis']='Direct 18 September 2026 operational-source verification: repeated cache-bypassed captures of both official Milano views were byte-identical; the production parser accepted the combined view at the frozen 4,208-sector-row / 2,611-observation boundary.'
          row['notes']='The mutable combined operational table was independently re-verified on 18 September 2026 at 969,618 bytes (SHA-256 '+COMBINED+'). Identity membership remains 2,611 observations with no additions or removals against the live 17 September boundary; the source explicitly moved IMPRESA GUERINI & C. SRL (00936150150) and TECNOTER SRL (13072070157) from dated listed rows to IN AGGIORNAMENTO, yielding 938 listed, 516 renewal/update and 1,157 pending. The separate registered-only sibling was independently repeated at 558,574 bytes (SHA-256 '+REGISTERED+') and its 1,454 identities exactly equal the non-pending identity set. No legal effect is inferred beyond the source-published status wording.'
          pub_path.write_text(json.dumps(pub,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          inv_path=Path('data/source_registry/source_series_inventory.csv')
          with inv_path.open(encoding='utf-8',newline='') as f:
              reader=csv.DictReader(f); fields=reader.fieldnames; items=list(reader)
          matches=[r for r in items if r['source_series_key']=='milano-combined']
          if len(matches)!=1: raise SystemExit(f'Milano inventory row count {len(matches)}')
          matches[0]['verified_date']='2026-09-18'
          matches[0]['notes']='Official mutable combined table directly re-verified 18 September 2026: repeated captures were byte-identical at SHA-256 '+COMBINED+' (969,618 bytes), 4,208 sector rows and 2,611 logical observations. No identities were added or removed from the prior live boundary; two identifiers (00936150150 and 13072070157) are now source-explicit IN AGGIORNAMENTO, giving 938 listed / 516 renewal-update / 1,157 pending. The registered-only sibling was independently stable at SHA-256 '+REGISTERED+' (558,574 bytes), with 1,454 identities exactly matching the combined non-pending set. See '+EVID+'.'
          out=io.StringIO(newline=''); writer=csv.DictWriter(out,fieldnames=fields,lineterminator='\n'); writer.writeheader(); writer.writerows(items)
          inv_path.write_text(out.getvalue(),encoding='utf-8')

          mon_path=Path('data/monitoring/national_coverage.json')
          mon=json.loads(mon_path.read_text(encoding='utf-8'))
          hist=mon.setdefault('check_history',[])
          if not any(x.get('authority_key')=='milano' and x.get('content_sha256')==COMBINED for x in hist):
              hist.append({'authority_key':'milano','at':AT,'evidence':EVID,'error':None,'content_changed':True,'content_sha256':COMBINED})
          matches=[x for x in mon['prefectures'] if x.get('authority_key')=='milano']
          if len(matches)!=1: raise SystemExit(f'Milano monitoring row count {len(matches)}')
          m=matches[0]
          m['latest_source_reference_date']='2026-09-18'
          m['last_successful_source_check_at']=AT
          m['last_attempted_source_check_at']=AT
          m['last_content_change_at']=AT
          m['last_successful_investigation_on']='2026-09-18'
          m['monitoring_status']='CURRENT'
          for sha in (COMBINED,REGISTERED):
              if sha not in m['known_content_sha256']: m['known_content_sha256'].append(sha)
          for key in ('completion_evidence','evidence'):
              if EVID not in m[key]: m[key].append(EVID)
          mon_path.write_text(json.dumps(mon,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          browser='tests/public_portal_browser.cjs'
          replace_exact(browser,"assert.deepEqual(statusCounts(milano),{listed:940,pending:1157,renewal_update_in_progress:514});","assert.deepEqual(statusCounts(milano),{listed:938,pending:1157,renewal_update_in_progress:516});")
          replace_exact(browser,"assert.equal(milano.filter(r=>r.observed_listing_date!=='').length,940);","assert.equal(milano.filter(r=>r.observed_listing_date!=='').length,938);")
          replace_exact(browser,"assert.equal(milano.filter(r=>r.observed_expiry_date!=='').length,940);","assert.equal(milano.filter(r=>r.observed_expiry_date!=='').length,938);")
          marker="      for(const k of ['01843860543','08402360963','09406080961','11572370960']) assert.equal(currentMilano[k].source_status,'renewal_update_in_progress');\n"
          replacement=marker+"      for(const k of ['00936150150','13072070157']){assert.equal(currentMilano[k].source_status,'renewal_update_in_progress');assert.equal(currentMilano[k].observed_listing_date,'');assert.equal(currentMilano[k].observed_expiry_date,'');}\n"
          replace_exact(browser,marker,replacement)

          workflow=Path('.github/workflows/public-pages.yml').read_text(encoding='utf-8')
          replacements={
            "assert sum(r['source_status'] == 'listed' for r in milano_records) == 940":"assert sum(r['source_status'] == 'listed' for r in milano_records) == 938",
            "assert sum(r['source_status'] == 'renewal_update_in_progress' for r in milano_records) == 514":"assert sum(r['source_status'] == 'renewal_update_in_progress' for r in milano_records) == 516",
            "assert sum(bool(r['observed_listing_date']) for r in milano_records) == 940":"assert sum(bool(r['observed_listing_date']) for r in milano_records) == 938",
            "assert sum(bool(r['observed_expiry_date']) for r in milano_records) == 940":"assert sum(bool(r['observed_expiry_date']) for r in milano_records) == 938",
          }
          for old,new in replacements.items():
              if workflow.count(old)!=1: raise SystemExit(f'public-pages replacement count for {old!r}: {workflow.count(old)}')
              workflow=workflow.replace(old,new)
          marker="          assert all(current_milano[k]['source_status'] == 'renewal_update_in_progress' for k in ('01843860543','08402360963','09406080961','11572370960'))\n"
          addition=marker+"          assert all(current_milano[k]['source_status'] == 'renewal_update_in_progress' and not current_milano[k]['observed_listing_date'] and not current_milano[k]['observed_expiry_date'] for k in ('00936150150','13072070157'))\n"
          if workflow.count(marker)!=1: raise SystemExit('public-pages Milano transition marker drift')
          workflow=workflow.replace(marker,addition)
          Path('tmp').mkdir(exist_ok=True)
          Path('tmp/milano-public-pages-candidate.yml').write_text(workflow,encoding='utf-8')

          Path(EVID).write_text('''# Milano source transition — 18 September 2026\n\n## Scope\n\nOperational re-verification of the official mutable Milano White List web application after the national fail-closed build detected a SHA change. This note approves only the positively observed current source boundary; it does not infer legal effects from absence or status changes.\n\n## Official sources\n\n- Landing page: https://prefettura.interno.gov.it/it/prefetture/milano/evidenza/white-list\n- Combined listed/applicant view: https://whitelist.prefmi.it/elenco/elenco.php\n- Registered-only corroborative view: https://whitelist.prefmi.it/elenco/elenco_iscritte.php\n\n## Reproducible boundary\n\nRepeated cache-bypassed captures on 18 September 2026 were byte-identical within each official view. The combined view is 969,618 bytes, SHA-256 `'''+COMBINED+'''`; the registered-only sibling is 558,574 bytes, SHA-256 `'''+REGISTERED+'''`. A later independent recheck reproduced both exact byte identities and ten source tables in each view.\n\nThe production Milano parser, with only the new reference-date and frozen status denominators supplied at runtime, accepted the combined source without relaxing any structural invariant: 10 tables, 4,208 sector rows, 2,611 logical observations, 2,611 structured identifiers and one logical non-blank note. The resulting status distribution is 938 `listed`, 516 `renewal_update_in_progress`, and 1,157 `pending`; listing-date and expiry-date coverage are each 938, and application-date coverage remains 1,157.\n\n## Exact semantic transition\n\nNo identifier was added or removed relative to the live 17 September boundary. The official source explicitly changed exactly two previously dated listed identities to `IN AGGIORNAMENTO`:\n\n- `00936150150` — IMPRESA GUERINI & C. SRL\n- `13072070157` — TECNOTER SRL\n\nFor both, the current source no longer supplies listing/expiry dates in those cells; the parser therefore records `renewal_update_in_progress` with blank observed listing/expiry dates. No legal consequence beyond the source-published wording is inferred.\n\nThe registered-only sibling contains 1,454 logical identities, and that identity set exactly matches the non-pending identities in the combined view. It remains corroborative and is not co-ingested as a second population.\n\n`durable_evidence_verified` remains false pending the separate hosted-evidence governance work; this transition approval concerns official-source observations only.\n''',encoding='utf-8')
          PY
      - run: python -m pip install -e '.[dev]'
      - name: Validate focused permanent edits
        run: |
          python -m pytest -q tests/test_milano_parser_semantics.py
          python - <<'PY'
          import json
          json.load(open('data/publication/multi_prefecture_pilot.json',encoding='utf-8'))
          json.load(open('data/monitoring/national_coverage.json',encoding='utf-8'))
          PY
          node --check tests/public_portal_browser.cjs
      - name: Commit non-workflow transition and candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/white_list_archive/parsers/milano_webapp.py tests/test_milano_parser_semantics.py data/publication/multi_prefecture_pilot.json data/source_registry/source_series_inventory.csv data/monitoring/national_coverage.json tests/public_portal_browser.cjs docs/sources/milano-source-transition-2026-09-18.md tmp/milano-public-pages-candidate.yml
          git diff --cached --check
          git commit -m 'Approve 18 September Milano source transition'
          git push origin HEAD:fix/milano-source-drift-2026-09-18
