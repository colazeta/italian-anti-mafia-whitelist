name: Foggia production materialisation

on:
  push:
    branches:
      - expansion/foggia-2026-09-13
    paths:
      - .github/workflows/foggia-production-materialise.yml

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/foggia-2026-09-13
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install complete test runtime
        run: |
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends poppler-utils; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Validation runtime installation failed after bounded retries' >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[publication,dev,storage,database]'
      - name: Materialise permanent Foggia integration
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv
          import io
          import json
          from pathlib import Path

          PAGE = 'https://prefettura.interno.gov.it/it/prefetture/foggia/evidenza/white-list'
          LISTED_URL = 'https://prefettura.interno.gov.it/sites/default/files/43/2026-09/white-list-elenco-imprese-iscritte-aggiornato_al-08-09-2026-copia.pdf'
          APPLICANT_URL = 'https://prefettura.interno.gov.it/sites/default/files/43/2026-09/elenco_delle_imprese_richiedenti_iscrizione_elenco_fornitori_agg_10-09-2026.pdf'
          LISTED_SHA = '313828d0d7fc0797920697841411503230a1a569e1eb8d41f93aec15908e5d5a'
          APPLICANT_SHA = 'd76eab040fcb984dbabbff740296f9cd30b41ef028ba756d210d4b7d7df2f6d5'

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}: {old[:140]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Publication configuration: two positively identified populations, one ordinary register.
          cfg_path = Path('data/publication/multi_prefecture_pilot.json')
          cfg = json.loads(cfg_path.read_text(encoding='utf-8'))
          if any(s.get('authority_key') == 'foggia' for s in cfg['sources']):
              raise SystemExit('Foggia unexpectedly already present in publication config')
          common = {
              'authority_key': 'foggia',
              'authority_name': 'Prefettura di Foggia',
              'register_key': 'foggia-ordinary',
              'register_name': 'White List ordinaria',
              'source_page_url': PAGE,
          }
          cfg['sources'].extend([
              {
                  **common,
                  'source_key': 'foggia-listed',
                  'parser': 'foggia_listed',
                  'population_scope': 'listed',
                  'reference_date': '2026-09-08',
                  'resource_url': LISTED_URL,
                  'sha256': LISTED_SHA,
                  'expected_sector_rows': 942,
                  'expected_source_rows': 330,
                  'last_source_update': '2026-09-08',
                  'last_source_update_basis': 'dated official resource directly revalidated 13 September 2026',
                  'notes': 'Byte-pinned 44-page listed-company PDF. The fail-closed parser groups 942 statutory-section rows into 330 source-backed observations: 85 listed and 245 renewal/update in progress. Three exact source name-layout reconciliations are evidence-backed; malformed dates and identifiers are never repaired by inference.',
              },
              {
                  **common,
                  'source_key': 'foggia-applicants',
                  'parser': 'foggia_applicants',
                  'population_scope': 'applicant',
                  'reference_date': '2026-09-10',
                  'resource_url': APPLICANT_URL,
                  'sha256': APPLICANT_SHA,
                  'expected_source_rows': 628,
                  'last_source_update': '2026-09-10',
                  'last_source_update_basis': 'dated official resource directly revalidated 13 September 2026',
                  'notes': 'Byte-pinned 46-page applicant PDF. The fail-closed parser yields exactly 628 pending observations. Identifier coverage is frozen at 621 strict identifiers, six raw-only identifiers and one empty source identifier; source values are preserved without inference.',
              },
          ])
          cfg_path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Verified primary page: Foggia is a newly mapped authority, not a replacement.
          vp = Path('data/source_registry/verified_primary_pages.csv')
          vp_text = vp.read_text(encoding='utf-8')
          if any(line.startswith('foggia,') for line in vp_text.splitlines()):
              raise SystemExit('Foggia unexpectedly already present in verified primary pages')
          vp.write_text(vp_text.rstrip('\n') + f'\nfoggia,{PAGE},2026-09-13,verified\n', encoding='utf-8')

          inv = Path('data/source_registry/source_series_inventory.csv')
          inv_text = inv.read_text(encoding='utf-8')
          if any(line.startswith('foggia-') for line in inv_text.splitlines()):
              raise SystemExit('Foggia unexpectedly already present in source series inventory')
          rows = [
              ['foggia-listed','foggia','WL-REGIME-L190-2012','listed','all','periodic_attachment',PAGE,'landing_page_resolved','2026-09-13','Current official landing page and listed-company attachment directly revalidated 13 September 2026. The dated 8 September 2026 byte-pinned 44-page PDF yields 330 grouped observations from 942 section rows (85 listed; 245 renewal/update in progress); exact source-layout reconciliations and conservative raw-value handling are enforced fail-closed.'],
              ['foggia-applicants','foggia','WL-REGIME-L190-2012','applicant','all','periodic_attachment',PAGE,'landing_page_resolved','2026-09-13','Current official landing page and applicant attachment directly revalidated 13 September 2026. The dated 10 September 2026 byte-pinned 46-page PDF yields exactly 628 pending observations; identifier coverage and applicant semantics are frozen fail-closed.'],
          ]
          buf = io.StringIO()
          writer = csv.writer(buf, lineterminator='\n')
          writer.writerows(rows)
          inv.write_text(inv_text.rstrip('\n') + '\n' + buf.getvalue(), encoding='utf-8')

          # Evidence note is permanent, concise and bound to the exact source bytes.
          note_path = Path('docs/sources/foggia-operational-check-2026-09-13.md')
          if note_path.exists():
              raise SystemExit('Foggia operational note unexpectedly already exists')
          note_path.write_text(f'''# Foggia operational source check — 13 September 2026

## Current official publication

The official Prefettura di Foggia White List landing page is `{PAGE}`. The current registered-company and applicant populations are published as separate official PDF attachments and were re-downloaded by the parser validation gate on 13 September 2026. Publication is bound to the exact byte hashes below; hash drift fails closed.

- Listed population: 8 September 2026, 44 pages, `{LISTED_SHA}`, `{LISTED_URL}`.
- Applicant population: 10 September 2026, 46 pages, `{APPLICANT_SHA}`, `{APPLICANT_URL}`.

## Parser boundary and semantics

The listed PDF contains 942 statutory-section rows. Exact grouping by strict source identity, date pair and reviewed status semantics yields 330 public observations: 85 `listed` and 245 `renewal_update_in_progress`. Three source name-layout inconsistencies are reconciled only through explicit evidence-backed guards; raw variants remain parser evidence. Unknown status lexemes, section structures, row widths and groupings fail closed.

The applicant PDF yields 628 observations, all explicitly marked `ISTRUTTORIA` and published as `pending`. Identifier coverage is frozen at 621 strict identifiers, six non-empty raw-only identifiers and one empty source identifier. No identifier is padded, truncated or otherwise repaired. Application dates and requested activities are required by the parser.

The parser validation also freezes reviewed identity cases including LUISI COSTRUZIONI DI LUISI CARMINE (`03570730717`) and the two source observations for IMPRESA PASQUA S.R.L. (`03926080718`), and verifies six applicant identifiers that occur in two distinct source rows each.

## Publication treatment

Foggia is represented as one ordinary register with two source series, `foggia-listed` and `foggia-applicants`. Parser-only layout diagnostics are retained for validation but projected through an exact fail-closed adapter before the recursively closed public contract. Canonical hosted-database integration and independent durable-evidence verification remain governed separately under issue #16; they are not inferred from public-source availability.
''', encoding='utf-8')

          # Bind Foggia parsers to the national publisher and project parser-only evidence onto the closed contract.
          pub = 'src/white_list_archive/publishing/public_national_registry.py'
          replace_once(
              pub,
              'from white_list_archive.parsers.genova_tables import PARSERS as GENOVA_PARSERS\n',
              'from white_list_archive.parsers.genova_tables import PARSERS as GENOVA_PARSERS\nfrom white_list_archive.parsers.foggia_tables import parse_foggia_applicants, parse_foggia_listed\n',
          )
          replace_once(
              pub,
              'BOLZANO_PARSERS = {\n    "bolzano_listed": parse_bolzano_listed,\n    "bolzano_applicants": parse_bolzano_applicants,\n}\n',
              'BOLZANO_PARSERS = {\n    "bolzano_listed": parse_bolzano_listed,\n    "bolzano_applicants": parse_bolzano_applicants,\n}\nFOGGIA_PARSERS = {\n    "foggia_listed": parse_foggia_listed,\n    "foggia_applicants": parse_foggia_applicants,\n}\n',
          )
          replace_once(
              pub,
              '        or GENOVA_PARSERS.get(cfg["parser"])\n    )\n',
              '        or GENOVA_PARSERS.get(cfg["parser"])\n        or FOGGIA_PARSERS.get(cfg["parser"])\n    )\n',
          )
          replace_once(
              pub,
              '    if cfg["parser"] in GENOVA_PARSERS:\n        batch = _adapt_genova_public_fields(batch, cfg["parser"])\n',
              '    if cfg["parser"] in GENOVA_PARSERS:\n        batch = _adapt_genova_public_fields(batch, cfg["parser"])\n    if cfg["parser"] in FOGGIA_PARSERS:\n        batch = _adapt_foggia_public_fields(batch, cfg["parser"])\n',
          )
          adapter = '''\n\ndef _adapt_foggia_public_fields(batch: ParsedBatch, parser_name: str) -> ParsedBatch:\n    """Project audited Foggia parser evidence onto the closed public contract."""\n    adapted: list[dict[str, Any]] = []\n    for source_record in batch.records:\n        record = dict(source_record)\n        fields = record.get("source_fields")\n        if not isinstance(fields, dict):\n            raise RuntimeError("Foggia source_fields must be a mapping")\n        if parser_name == "foggia_listed":\n            expected = {\n                "name_variants", "registered_office_variants", "secondary_office_variants",\n                "identifier_raw_variants", "sections", "section_heading_raw_variants",\n                "listing_date_raw_variants", "expiry_date_raw_variants", "outcome_raw_variants",\n                "source_locators", "reviewed_name_reconciliation",\n            }\n            if set(fields) != expected:\n                raise RuntimeError(f"Foggia listed source-field drift: {sorted(fields)!r}")\n            list_keys = (\n                "name_variants", "registered_office_variants", "secondary_office_variants",\n                "identifier_raw_variants", "sections", "section_heading_raw_variants",\n                "listing_date_raw_variants", "expiry_date_raw_variants", "outcome_raw_variants",\n                "source_locators",\n            )\n            for key in list_keys:\n                if not isinstance(fields[key], list) or any(not isinstance(value, str) for value in fields[key]):\n                    raise RuntimeError(f"Foggia listed source-field type drift: {key}")\n            if not isinstance(fields["reviewed_name_reconciliation"], str):\n                raise RuntimeError("Foggia listed reconciliation type drift")\n            record["source_fields"] = {\n                "registered_office_variants": list(fields["registered_office_variants"]),\n                "secondary_office_variants": list(fields["secondary_office_variants"]),\n                "sections": list(fields["sections"]),\n                "listing_date_raw_variants": list(fields["listing_date_raw_variants"]),\n                "expiry_date_raw_variants": list(fields["expiry_date_raw_variants"]),\n            }\n        elif parser_name == "foggia_applicants":\n            expected = {"requested_activities_source", "application_date_raw", "source_locator"}\n            if set(fields) != expected:\n                raise RuntimeError(f"Foggia applicant source-field drift: {sorted(fields)!r}")\n            if any(not isinstance(fields[key], str) for key in expected):\n                raise RuntimeError("Foggia applicant source-field type drift")\n            application_raw = fields["application_date_raw"]\n            record["source_fields"] = {\n                "requested_activities_source": fields["requested_activities_source"],\n                "application_date_raw_variants": [application_raw] if application_raw else [],\n            }\n        else:\n            raise RuntimeError(f"Unexpected Foggia parser: {parser_name!r}")\n        adapted.append(record)\n    return ParsedBatch(records=adapted, diagnostics=batch.diagnostics)\n'''
          replace_once(pub, '\ndef _parse_source(path: Path, cfg: dict[str, Any]) -> ParsedBatch:\n', adapter + '\n\ndef _parse_source(path: Path, cfg: dict[str, Any]) -> ParsedBatch:\n')

          # Coverage row: Foggia was not previously mapped in the local coverage ledger.
          coverage_path = Path('data/monitoring/national_coverage.json')
          coverage = json.loads(coverage_path.read_text(encoding='utf-8'))
          if set(coverage) < {'schema_version', 'mode', 'prefectures'} or not isinstance(coverage['prefectures'], list):
              raise SystemExit(f'unexpected national coverage root keys: {sorted(coverage)}')
          if any(row.get('authority_key') == 'foggia' for row in coverage['prefectures']):
              raise SystemExit('Foggia unexpectedly already present in national coverage')
          coverage['prefectures'].append({
              'authority_key': 'foggia',
              'prefecture': 'Foggia',
              'region': 'Puglia',
              'national_index_key': 'foggia',
              'official_landing_page': PAGE,
              'source_verified': True,
              'current_edition_identified': True,
              'historical_editions_identified': None,
              'capture_implemented': True,
              'parser_implemented': True,
              'parser_validated': True,
              'company_observations_loaded': True,
              'observation_layer': 'public_source_observations',
              'canonical_integration_validated': False,
              'public_export_enabled': True,
              'durable_evidence_verified': False,
              'population_scopes_complete': True,
              'latest_source_reference_date': '2026-09-10',
              'latest_archived_edition': None,
              'archived_evidence_storage_status': 'not_documented',
              'last_successful_source_check_at': None,
              'last_attempted_source_check_at': None,
              'last_content_change_at': None,
              'last_successful_investigation_on': '2026-09-13',
              'monitoring_status': 'NEVER_CHECKED',
              'unresolved_issue': ['Canonical hosted-database integration and independent durable-evidence verification remain governed under #16; public source observations are validated independently of that infrastructure.'],
              'actionable_issue': False,
              'coverage_status': 'VALIDATED',
              'terminal_reason': None,
              'completion_evidence': [
                  'docs/sources/foggia-operational-check-2026-09-13.md',
                  'src/white_list_archive/parsers/foggia_tables.py',
                  'tests/test_foggia_parser_semantics.py',
                  'data/publication/multi_prefecture_pilot.json',
              ],
              'known_content_sha256': [LISTED_SHA, APPLICANT_SHA],
              'evidence': [
                  'data/source_registry/verified_primary_pages.csv',
                  'data/source_registry/source_series_inventory.csv',
                  'data/publication/multi_prefecture_pilot.json',
                  'docs/sources/foggia-operational-check-2026-09-13.md',
              ],
              'last_completed_coverage_stage': 'VALIDATED',
          })
          coverage_path.write_text(json.dumps(coverage, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Permanent Pages gates are raised only within this transaction and must be confirmed by the national build below.
          pages = '.github/workflows/public-pages.yml'
          replace_once(pages, "      - 'src/white_list_archive/parsers/genova_tables.py'\n", "      - 'src/white_list_archive/parsers/genova_tables.py'\n      - 'src/white_list_archive/parsers/foggia_tables.py'\n")
          replace_once(pages, "          assert reg['meta']['record_count'] == 29600\n", "          assert reg['meta']['record_count'] == 30558\n")
          replace_once(pages, "'caserta','catania','genova'}\n", "'caserta','catania','genova','foggia'}\n")
          replace_once(pages, "'caserta-ordinary','catania-ordinary','genova-ordinary'\n", "'caserta-ordinary','catania-ordinary','genova-ordinary','foggia-ordinary'\n")
          replace_once(pages, "          assert reg['meta']['authority_count'] == 30\n", "          assert reg['meta']['authority_count'] == 31\n")
          replace_once(pages, "          assert reg['meta']['register_count'] == 31\n", "          assert reg['meta']['register_count'] == 32\n")
          replace_once(pages, "          assert pref['meta']['published_count'] == 30\n", "          assert pref['meta']['published_count'] == 31\n")
          replace_once(pages, "          assert pref['meta']['mapped_count'] == 39\n", "          assert pref['meta']['mapped_count'] == 40\n")
          replace_once(
              pages,
              "          genova = [x for x in pref['prefectures'] if x['authority_key'] == 'genova']\n          assert len(genova) == 1 and genova[0]['mapped'] and genova[0]['published'] and genova[0]['series_count'] == 2\n",
              "          genova = [x for x in pref['prefectures'] if x['authority_key'] == 'genova']\n          assert len(genova) == 1 and genova[0]['mapped'] and genova[0]['published'] and genova[0]['series_count'] == 2\n          foggia = [x for x in pref['prefectures'] if x['authority_key'] == 'foggia']\n          assert len(foggia) == 1 and foggia[0]['mapped'] and foggia[0]['published'] and foggia[0]['series_count'] == 2\n",
          )

          browser = 'tests/public_portal_browser.cjs'
          replace_once(browser, "      assert.ok(labels.includes('White List ordinaria · Prefettura di Genova'));\n", "      assert.ok(labels.includes('White List ordinaria · Prefettura di Genova'));\n      assert.ok(labels.includes('White List ordinaria · Prefettura di Foggia'));\n")
          replace_once(browser, '      assert.equal(stats.total,29600);\n', '      assert.equal(stats.total,30558);\n')
          replace_once(browser, "'caserta','catania','genova'].includes(r.authority_key));\n", "'caserta','catania','genova','foggia'].includes(r.authority_key));\n")
          replace_once(
              browser,
              "      const genova=registry.records.filter(r=>r.authority_key==='genova');\n      assert.equal(genova.length,762);\n      assert.equal(genova.filter(r=>r.source_key==='genova-listed').length,652);\n      assert.equal(genova.filter(r=>r.source_key==='genova-applicants').length,110);\n      assert.deepEqual(statusCounts(genova),{listed:528,pending:110,renewal_update_in_progress:124});\n",
              "      const genova=registry.records.filter(r=>r.authority_key==='genova');\n      assert.equal(genova.length,762);\n      assert.equal(genova.filter(r=>r.source_key==='genova-listed').length,652);\n      assert.equal(genova.filter(r=>r.source_key==='genova-applicants').length,110);\n      assert.deepEqual(statusCounts(genova),{listed:528,pending:110,renewal_update_in_progress:124});\n      const foggia=registry.records.filter(r=>r.authority_key==='foggia');\n      assert.equal(foggia.length,958);\n      assert.equal(foggia.filter(r=>r.source_key==='foggia-listed').length,330);\n      assert.equal(foggia.filter(r=>r.source_key==='foggia-applicants').length,628);\n      assert.deepEqual(statusCounts(foggia),{listed:85,pending:628,renewal_update_in_progress:245});\n",
          )
          PY
          git diff --check
          git status --short
      - name: Run full repository test suite
        run: pytest
      - name: Build and validate Foggia national candidate
        run: |
          rm -rf /tmp/foggia-production-sources /tmp/foggia-registry.json /tmp/foggia-registry.csv /tmp/foggia-prefectures.json /tmp/foggia-prefectures.csv
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/foggia-production-sources \
            --registry-json /tmp/foggia-registry.json \
            --registry-csv /tmp/foggia-registry.csv \
            --prefectures-json /tmp/foggia-prefectures.json \
            --prefectures-csv /tmp/foggia-prefectures.csv
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          reg = json.loads(Path('/tmp/foggia-registry.json').read_text(encoding='utf-8'))
          pref = json.loads(Path('/tmp/foggia-prefectures.json').read_text(encoding='utf-8'))
          assert reg['meta']['record_count'] == 30558, reg['meta']
          assert reg['meta']['authority_count'] == 31, reg['meta']
          assert reg['meta']['register_count'] == 32, reg['meta']
          assert pref['meta']['published_count'] == 31, pref['meta']
          assert pref['meta']['mapped_count'] == 40, pref['meta']
          rows = [r for r in reg['records'] if r['authority_key'] == 'foggia']
          assert len(rows) == 958
          assert Counter(r['population_scope'] for r in rows) == Counter({'listed': 330, 'applicant': 628})
          assert Counter(r['source_status'] for r in rows) == Counter({'listed': 85, 'renewal_update_in_progress': 245, 'pending': 628})
          assert len([r for r in rows if r['source_key'] == 'foggia-listed']) == 330
          assert len([r for r in rows if r['source_key'] == 'foggia-applicants']) == 628
          listed = [r for r in rows if r['source_key'] == 'foggia-listed']
          applicants = [r for r in rows if r['source_key'] == 'foggia-applicants']
          assert all(set(r['source_fields']) <= {'registered_office_variants','secondary_office_variants','sections','listing_date_raw_variants','expiry_date_raw_variants'} for r in listed)
          assert all(set(r['source_fields']) <= {'requested_activities_source','application_date_raw_variants'} for r in applicants)
          pasqua = [r for r in listed if '03926080718' in r['identifiers']]
          assert len(pasqua) == 2
          assert {r['name'] for r in pasqua} == {'IMPRESA PASQUA S.R.L.'}
          assert {r['observed_expiry_date'] for r in pasqua} == {'2025-09-09','2026-09-09'}
          item = [r for r in pref['prefectures'] if r['authority_key'] == 'foggia']
          assert len(item) == 1 and item[0]['mapped'] and item[0]['published'] and item[0]['series_count'] == 2
          PY
      - name: Commit validated permanent integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/public-pages.yml \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            data/source_registry/verified_primary_pages.csv \
            docs/sources/foggia-operational-check-2026-09-13.md \
            src/white_list_archive/publishing/public_national_registry.py \
            tests/public_portal_browser.cjs \
            tests/test_foggia_parser_semantics.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Integrate validated Foggia public data'
          git push origin HEAD:expansion/foggia-2026-09-13
