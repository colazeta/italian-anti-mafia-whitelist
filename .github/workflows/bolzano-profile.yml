name: Bolzano source profile

on:
  push:
    branches:
      - expansion/bolzano-bozen-2026-09-12
    paths:
      - .github/workflows/bolzano-profile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/bolzano-bozen-2026-09-12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'python-docx>=1.1,<2' requests
      - name: Profile byte-pinned Bolzano populations
        run: |
          python - <<'PY'
          import hashlib, io, json, re
          from collections import Counter, defaultdict
          from pathlib import Path
          import requests
          from docx import Document

          SOURCES = {
            'listed': ('https://prefettura.interno.gov.it/sites/default/files/0/2026-09/2026.09.11-elenco-white-list-da-sez-1-a-sez-10_iscritti-rinnovi.docx','96992db4caac16200fbebfa573bb602e1e396961ff854bbf006cb42e011c1e04'),
            'applicant': ('https://prefettura.interno.gov.it/sites/default/files/0/2026-09/2026.09.11-elenco-richiesta-iscrizione-wl.docx','8b7321745edb19db688a001b9a1a706e84bee95cb457f9fdca1af144521ef3ae'),
          }
          H={'User-Agent':'italian-anti-mafia-whitelist/source-profile (+https://github.com/colazeta/italian-anti-mafia-whitelist)'}
          DATEISH=re.compile(r'^\d{1,2}/\d{1,2}/\d{2,4}$')
          STRICT_DATE=re.compile(r'^\d{2}/\d{2}/\d{4}$')
          STRICT_ID=re.compile(r'^(?:\d{11}|[A-Za-z0-9]{16})$')
          def clean(v): return re.sub(r'\s+',' ',v or '').strip()
          def fetch(kind):
            url, expected=SOURCES[kind]; r=requests.get(url,headers=H,timeout=60); r.raise_for_status()
            got=hashlib.sha256(r.content).hexdigest()
            if got!=expected: raise SystemExit(f'{kind} source drift: {got} != {expected}')
            return r.content
          def vals(row): return [clean(c.text) for c in row.cells]
          def uniq(seq):
            out=[]
            for x in seq:
              if x and x not in out: out.append(x)
            return out

          doc=Document(io.BytesIO(fetch('listed')))
          if len(doc.tables)!=10: raise SystemExit(f'listed table count drift: {len(doc.tables)}')
          listed=[]; anomalies=[]; widths={}; section_counts={}; tail_patterns=Counter()
          for section,table in enumerate(doc.tables,1):
            h=vals(table.rows[0])
            if len(h)<7 or h[0].casefold()!='ragione sociale' or 'sede legale' not in h[1].casefold() or 'codice fiscale' not in h[3].casefold() or 'data di iscrizione' not in h[4].casefold():
              raise SystemExit(f'section {section} header drift: {h!r}')
            widths[str(section)]=dict(Counter(len(vals(r)) for r in table.rows[2:] if any(vals(r))))
            n=0
            for rn,row in enumerate(table.rows[2:],3):
              x=vals(row)
              if not any(x): continue
              if len(x)<7:
                anomalies.append({'section':section,'row':rn,'reason':'short_row','raw':x}); continue
              name,office,secondary,ident=x[:4]
              tail=uniq(x[4:])
              dates=[z for z in tail if DATEISH.fullmatch(z)]
              other=[z for z in tail if not DATEISH.fullmatch(z)]
              tail_patterns[(len(x),len(tail),len(dates),tuple(other))]+=1
              if not name or len(dates)!=2:
                anomalies.append({'section':section,'row':rn,'reason':'semantic_tail_shape','raw':x,'distinct_tail':tail,'date_tokens':dates,'other_tokens':other}); continue
              listed.append({'section':section,'row':rn,'name':name,'office':office,'secondary':secondary,'identifier_raw':ident,'listed_raw':dates[0],'expiry_raw':dates[1],'update_raw':' | '.join(other)})
              n+=1
            section_counts[str(section)]=n
          groups=defaultdict(list)
          for r in listed:
            groups[(r['name'],r['office'],r['secondary'],r['identifier_raw'],r['listed_raw'],r['expiry_raw'])].append(r)
          duplicate_same_section=[]; group_status=Counter(); unknown_updates=[]; multiplicity=Counter()
          allowed={'si-ja','sì-ja'}
          for k,members in groups.items():
            sections=[r['section'] for r in members]
            if len(sections)!=len(set(sections)): duplicate_same_section.append({'key':list(k),'sections':sections})
            multiplicity[len(sections)]+=1
            upd=uniq([r['update_raw'] for r in members])
            folded={u.casefold().replace('–','-').replace('—','-').replace(' ','') for u in upd if u}
            if folded-allowed: unknown_updates.append({'key':list(k),'updates':upd,'folded':sorted(folded)})
            group_status['renewal_update_in_progress' if folded else 'listed']+=1

          adoc=Document(io.BytesIO(fetch('applicant')))
          if len(adoc.tables)!=1: raise SystemExit(f'applicant table count drift: {len(adoc.tables)}')
          at=adoc.tables[0]; ah=vals(at.rows[0])
          if len(ah)!=7 or ah[0].casefold()!='ragione sociale' or 'data di presentazione' not in ah[5].casefold() or ah[6].casefold()!='esito': raise SystemExit(f'applicant header drift: {ah!r}')
          applicants=[]; aan=[]
          for rn,row in enumerate(at.rows[2:],3):
            x=vals(row)
            if not any(x): continue
            if len(x)!=7 or not x[0] or not x[5]: aan.append({'row':rn,'raw':x}); continue
            applicants.append({'row':rn,'name':x[0],'office':x[1],'secondary':x[2],'identifier_raw':x[3],'activities_raw':x[4],'submitted_raw':x[5],'outcome_raw':x[6]})
          exact=Counter((r['name'],r['office'],r['secondary'],r['identifier_raw'],r['activities_raw'],r['submitted_raw'],r['outcome_raw']) for r in applicants)
          report={
            'source_sha256':{k:v[1] for k,v in SOURCES.items()},
            'listed':{
              'table_count':len(doc.tables),'parsed_source_rows':len(listed),'section_source_rows':section_counts,
              'row_widths_by_section':widths,'semantic_tail_patterns':{repr(k):v for k,v in tail_patterns.items()},
              'source_row_anomaly_count':len(anomalies),'source_row_anomalies':anomalies[:100],
              'semantic_groups_exact':len(groups),'same_section_exact_duplicate_count':len(duplicate_same_section),'same_section_exact_duplicates':duplicate_same_section[:30],
              'status_counts_exact_grouping':dict(group_status),'group_section_multiplicity':dict(multiplicity),
              'update_values':dict(Counter(r['update_raw'] for r in listed)),'unreviewed_update_group_count':len(unknown_updates),'unreviewed_update_groups':unknown_updates[:50],
              'listed_date_bad':sorted({r['listed_raw'] for r in listed if not STRICT_DATE.fullmatch(r['listed_raw'])}),
              'expiry_date_bad':sorted({r['expiry_raw'] for r in listed if not STRICT_DATE.fullmatch(r['expiry_raw'])}),
              'invalid_identifier_values':dict(Counter(r['identifier_raw'] for r in listed if r['identifier_raw'] and not STRICT_ID.fullmatch(r['identifier_raw']))),
            },
            'applicant':{
              'rows_total':len(at.rows),'parsed_source_rows':len(applicants),'source_row_anomaly_count':len(aan),'source_row_anomalies':aan[:50],
              'submitted_date_bad':sorted({r['submitted_raw'] for r in applicants if not STRICT_DATE.fullmatch(r['submitted_raw'])}),
              'outcome_values':dict(Counter(r['outcome_raw'] for r in applicants)),
              'invalid_identifier_values':dict(Counter(r['identifier_raw'] for r in applicants if r['identifier_raw'] and not STRICT_ID.fullmatch(r['identifier_raw']))),
              'exact_duplicate_groups':[{'row_key':list(k),'count':v} for k,v in exact.items() if v>1],
              'exact_unique_rows':len(exact),
            }
          }
          Path('tmp').mkdir(exist_ok=True)
          Path('tmp/bolzano_source_profile.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Persist profile checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/bolzano_source_profile.json
          git commit -m 'Checkpoint Bolzano source profile' || exit 0
          git push origin HEAD:expansion/bolzano-bozen-2026-09-12
