name: Reconcile monitoring ledger once

on:
  push:
    branches:
      - ops/reconcile-monitoring-ledger-2026-09-09
    paths:
      - 'src/white_list_archive/acquisition/reconcile_monitoring.py'
      - 'tests/test_monitoring_reconciliation.py'
      - '.github/workflows/reconcile-monitoring-ledger-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/reconcile-monitoring-ledger-2026-09-09
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project and tests
        run: python -m pip install -e . pytest
      - name: Run focused reconciliation tests
        run: python -m pytest -q tests/test_monitoring_reconciliation.py tests/test_source_population_coverage.py tests/test_operations.py
      - name: Reconcile canonical monitoring ledger
        run: |
          python -m white_list_archive.acquisition.reconcile_monitoring \
            --durable-storage-run-url https://github.com/colazeta/italian-anti-mafia-whitelist/actions/runs/34327668707 \
            --durable-storage-verified-at 2026-09-09T08:10:49Z \
            --activation-record docs/architecture/evidence-store-activation-2026-09-09.md
          python -m json.tool data/monitoring/national_coverage.json >/dev/null
      - name: Commit reconciled ledger to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/monitoring/national_coverage.json
          if git diff --cached --quiet; then
            echo 'Monitoring ledger already reconciled.'
            exit 0
          fi
          git commit -m 'Reconcile monitoring ledger after live R2 verification'
          git push origin HEAD:ops/reconcile-monitoring-ledger-2026-09-09
