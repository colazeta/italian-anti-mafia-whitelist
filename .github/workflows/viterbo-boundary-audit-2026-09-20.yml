name: Viterbo boundary audit 2026-09-20

on:
  push:
    branches:
      - expansion/viterbo-2026-09-20
    paths:
      - .github/workflows/viterbo-boundary-audit-2026-09-20.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viterbo-boundary-audit-2026-09-20
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/viterbo-2026-09-20
          fetch-depth: 0
      - name: Install audit runtime
        run: python -m pip install 'pdfplumber==0.11.10'
      - name: Audit exact parser boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, urllib.request
          from collections import Counter
          from datetime import datetime
          from pathlib import Path
          import pdfplumber

          SOURCES={
            'listed':('https://prefettura.interno.gov.it/sites/default/files/87/2026-09/iscritte_4.pdf','ee6bdb1f9020689ae4e24d91397cdf07e7bf17999a85f4f2620eb127541f2e78',237),
            'applicant':('https://prefettura.interno.gov.it/sites/default/files/87/2026-09/richiedenti_4.pdf','a0a2280f4c4352e29997ab3b5b532500f1a7d5eb57b5e44f82a62515ac66a545',23),
          }
          STRICT_ID=re.compile(r'^(?:\d{11}|[A-Z0-9]{16})$')
          DATE=re.compile(r'^\d{2}/\d{2}/\d{4}$')
          def clean(s): return ' '.join((s or '').split())
          def valid_date(raw):
            if not DATE.fullmatch(raw): return False
            try: datetime.strptime(raw,'%d/%m/%Y'); return True
            except ValueError: return False
          def unique_word(words,value):
            hits=[w for w in words if str(w['text']).casefold()==value.casefold()]
            if len(hits)!=1: return None, len(hits)
            return hits[0],1
          def right_note(words,note_label,activity_label):
            ws=[w for w in words if float(w['x0']) > float(note_label['x1'])+5 and float(note_label['top'])-4 <= float(w['top']) < float(activity_label['top'])-5]
            ws.sort(key=lambda w:(round(float(w['top']),1),float(w['x0'])))
            return clean(' '.join(str(w['text']) for w in ws))

          report={}
          for kind,(url,sha,pages_expected) in SOURCES.items():
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
            raw=urllib.request.urlopen(req,timeout=30).read()
            actual=hashlib.sha256(raw).hexdigest()
            if actual!=sha: raise RuntimeError(f'{kind} sha drift: {actual}')
            path=Path(f'/tmp/viterbo-{kind}.pdf'); path.write_bytes(raw)
            note_counts=Counter(); status_counts=Counter(); section_counts=Counter(); identifiers=[]; anomalies=[]; page_summaries=[]
            with pdfplumber.open(path) as pdf:
              if len(pdf.pages)!=pages_expected: raise RuntimeError(f'{kind} page drift {len(pdf.pages)} != {pages_expected}')
              for page_no,page in enumerate(pdf.pages,1):
                text=page.extract_text(layout=True,x_tolerance=1,y_tolerance=2) or ''
                marker=f'Ditta/Società {page_no} di {pages_expected}'
                if marker not in text: anomalies.append({'page':page_no,'kind':'marker','expected':marker})
                words=page.extract_words(x_tolerance=1,y_tolerance=2,keep_blank_chars=False,use_text_flow=False)
                note_label,n_note=unique_word(words,'Note'); activity_label,n_activity=unique_word(words,'Attività')
                if note_label is None or activity_label is None:
                  anomalies.append({'page':page_no,'kind':'label_geometry','note_count':n_note,'activity_count':n_activity})
                  note=''
                else:
                  note=right_note(words,note_label,activity_label)
                note_counts[note]+=1
                id_match=re.search(r'Codice\s+Fiscale(?:\s+o\s+P\.I:|/pIVA)\s+([A-Z0-9]+)',text,re.I)
                identifier=clean(id_match.group(1)).upper() if id_match else ''
                identifiers.append(identifier)
                if not STRICT_ID.fullmatch(identifier): anomalies.append({'page':page_no,'kind':'identifier','raw':identifier})
                sections=sorted(set(re.findall(r'\bSez\s+(\d{2})\s+-',text,re.I)))
                if not sections: anomalies.append({'page':page_no,'kind':'sections_empty'})
                for section in sections: section_counts[section]+=1
                if kind=='listed':
                  listed=re.search(r'Data\s+Prima\s+Iscrizione\s+(\d{2}/\d{2}/\d{4})',text,re.I)
                  expiry=re.search(r'Scadenza\s+(\d{2}/\d{2}/\d{4})',text,re.I)
                  dates=[listed.group(1) if listed else '',expiry.group(1) if expiry else '']
                  for label,value in zip(('listing_date','expiry_date'),dates):
                    if not valid_date(value): anomalies.append({'page':page_no,'kind':label,'raw':value})
                  folded=note.casefold()
                  if 'attualmente in istruttoria' in folded:
                    status='renewal_update_in_progress'
                  elif not note or 'iscritta a seguito di istanza di mantenimento' in folded:
                    status='listed'
                  else:
                    status='other_or_unknown'
                else:
                  requested=re.search(r'Data\s+Richiesta\s+Iscrizione\s+(\d{2}/\d{2}/\d{4})',text,re.I)
                  dates=[requested.group(1) if requested else '']
                  if not valid_date(dates[0]): anomalies.append({'page':page_no,'kind':'application_date','raw':dates[0]})
                  folded=note.casefold()
                  status='pending' if 'in istruttoria' in folded else 'other_or_unknown'
                status_counts[status]+=1
                page_summaries.append({'page':page_no,'identifier':identifier,'dates':dates,'sections':sections,'note':note,'status':status})
            duplicates=[{'identifier':k,'count':v} for k,v in Counter(identifiers).items() if k and v>1]
            report[kind]={
              'sha256':sha,'pages':pages_expected,'records':len(page_summaries),
              'strict_identifier_coverage':sum(bool(STRICT_ID.fullmatch(x)) for x in identifiers),
              'status_counts':dict(status_counts),'note_counts':dict(note_counts),'section_counts':dict(section_counts),
              'duplicate_identifiers':duplicates,'anomalies':anomalies,
              'first_page':page_summaries[0],'last_page':page_summaries[-1],
              'audit_ok':not anomalies,
            }
          Path('tmp').mkdir(exist_ok=True)
          Path('tmp/viterbo-boundary-audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit boundary checkpoint
        run: |
          set -euo pipefail
          git add tmp/viterbo-boundary-audit.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Checkpoint Viterbo parser boundary'
          git push origin HEAD:expansion/viterbo-2026-09-20
