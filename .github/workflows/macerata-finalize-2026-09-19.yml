name: Macerata national integration finalizer 2026-09-19

on:
  push:
    branches:
      - expansion/macerata-2026-09-19
    paths:
      - .github/workflows/macerata-finalize-2026-09-19.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/macerata-2026-09-19
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify branch base and Macerata-only scope
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "d4f65a5bc106db17ff934a8dc4f2424540b74942"
          test "$(git rev-list --count HEAD..origin/main)" = "0"
          python - <<'PY'
          import subprocess
          files = set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'], text=True).splitlines())
          expected = {
              '.github/workflows/macerata-source-probe.yml',
              '.github/workflows/macerata-finalize-2026-09-19.yml',
              'docs/sources/macerata-operational-check-2026-09-19.md',
              'src/white_list_archive/parsers/macerata_tables.py',
              'tests/test_macerata_parser_semantics.py',
          }
          if files != expected:
              raise SystemExit(f'unexpected pre-finalizer branch scope: {sorted(files)}')
          PY

      - name: Install full validation runtime
        run: |
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && \
               sudo apt-get install -y --no-install-recommends poppler-utils antiword; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[dev,publication,database,storage]'

      - name: Revalidate official resources and parser boundary
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import time
          from collections import Counter
          from pathlib import Path
          from urllib.request import Request, urlopen
          from white_list_archive.parsers.macerata_tables import parse_listed, parse_applicants

          listed_url = 'https://prefettura.interno.gov.it/sites/default/files/52/2026-08/iscrizioni-21.08.2026.pdf'
          applicants_url = 'https://prefettura.interno.gov.it/sites/default/files/52/2026-08/presentazioni-21.08.2026.pdf'
          expected = {
              listed_url: (1733039, '7b1518847ea0bcc6bd76bd354ded1ae0e0cc7e7092cb9b7077dbcc689bfe1bce'),
              applicants_url: (290457, '4d432d015c09060967da156d9ee54718645a22a623656c6def5a9fc58367aa17'),
          }

          def get_once(url: str, nonce: str) -> bytes:
              last = None
              for attempt in range(1, 4):
                  try:
                      sep = '&' if '?' in url else '?'
                      req = Request(
                          f'{url}{sep}archive_check={nonce}-{attempt}',
                          headers={
                              'User-Agent': 'italian-anti-mafia-whitelist/0.1 (+source verification)',
                              'Cache-Control': 'no-cache',
                              'Pragma': 'no-cache',
                          },
                      )
                      with urlopen(req, timeout=45) as response:
                          if response.status != 200:
                              raise RuntimeError(f'HTTP {response.status}')
                          return response.read()
                  except Exception as exc:
                      last = exc
                      if attempt < 3:
                          time.sleep(attempt * 2)
              raise RuntimeError(f'GET failed for {url}: {last}')

          paths = {}
          for label, url in [('listed', listed_url), ('applicants', applicants_url)]:
              a = get_once(url, f'{label}-a-{time.time_ns()}')
              b = get_once(url, f'{label}-b-{time.time_ns()}')
              if a != b:
                  raise RuntimeError(f'{label}: independent GETs differ byte-for-byte')
              length, sha = expected[url]
              actual = hashlib.sha256(a).hexdigest()
              if len(a) != length or actual != sha:
                  raise RuntimeError(f'{label}: source drift length={len(a)} sha={actual}')
              path = Path(f'/tmp/macerata-{label}.pdf')
              path.write_bytes(a)
              paths[label] = path

          common = {
              'authority_key': 'macerata',
              'authority_name': 'Prefettura di Macerata',
              'register_key': 'macerata-ordinary',
              'register_name': 'White List ordinaria',
              'reference_date': '2026-08-21',
              'source_page_url': 'https://prefettura.interno.gov.it/it/prefetture/macerata/white-list-elenco-imprese-iscritte',
          }
          listed_cfg = {
              **common,
              'source_key': 'macerata-listed',
              'population_scope': 'listed',
              'resource_url': listed_url,
              'sha256': expected[listed_url][1],
          }
          applicant_cfg = {
              **common,
              'source_key': 'macerata-applicants',
              'population_scope': 'applicant',
              'resource_url': applicants_url,
              'sha256': expected[applicants_url][1],
          }
          listed = parse_listed(paths['listed'], listed_cfg)
          applicants = parse_applicants(paths['applicants'], applicant_cfg)
          assert listed.diagnostics['public_records'] == 1274
          assert listed.diagnostics['sector_rows'] == 2150
          assert listed.diagnostics['identifier_coverage'] == 1240
          assert Counter(r['source_status'] for r in listed.records) == Counter({
              'listed': 879,
              'renewal_update_in_progress': 394,
              'other_or_unknown': 1,
          })
          assert applicants.diagnostics['public_records'] == 84
          assert applicants.diagnostics['identifier_coverage'] == 80
          assert Counter(r['source_status'] for r in applicants.records) == Counter({'pending': 83, 'listed': 1})
          all_records = listed.records + applicants.records
          assert len(all_records) == 1358
          assert sum(bool(r['identifiers']) for r in all_records) == 1320
          assert Counter(r['source_status'] for r in all_records) == Counter({
              'listed': 880,
              'renewal_update_in_progress': 394,
              'pending': 83,
              'other_or_unknown': 1,
          })
          PY

      - name: Materialize permanent Macerata integration and reviewed portal candidate
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv
          import json
          from pathlib import Path

          ROOT = Path('.')
          LANDING = 'https://prefettura.interno.gov.it/it/prefetture/macerata/white-list-elenco-imprese-iscritte'
          LISTED_URL = 'https://prefettura.interno.gov.it/sites/default/files/52/2026-08/iscrizioni-21.08.2026.pdf'
          APPLICANTS_URL = 'https://prefettura.interno.gov.it/sites/default/files/52/2026-08/presentazioni-21.08.2026.pdf'
          LISTED_SHA = '7b1518847ea0bcc6bd76bd354ded1ae0e0cc7e7092cb9b7077dbcc689bfe1bce'
          APPLICANTS_SHA = '4d432d015c09060967da156d9ee54718645a22a623656c6def5a9fc58367aa17'

          def rewrite_csv(path: Path, rows: list[dict[str, str]], fieldnames: list[str]) -> None:
              with path.open('w', encoding='utf-8', newline='') as handle:
                  writer = csv.DictWriter(handle, fieldnames=fieldnames)
                  writer.writeheader()
                  writer.writerows(rows)

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise RuntimeError(f'{label}: expected one occurrence, found {text.count(old)}')
              return text.replace(old, new)

          path = ROOT/'data/catalog.csv'
          with path.open(encoding='utf-8', newline='') as handle:
              reader = csv.DictReader(handle); rows = list(reader); fields = reader.fieldnames
          assert fields is not None
          by_id = {r['dataset_id']: r for r in rows}
          assert by_id['verified-primary-pages']['record_count'] == '61'
          assert by_id['source-series-inventory']['record_count'] == '120'
          by_id['verified-primary-pages']['record_count'] = '62'
          by_id['source-series-inventory']['record_count'] = '122'
          rewrite_csv(path, rows, fields)

          path = ROOT/'data/source_registry/verified_primary_pages.csv'
          with path.open(encoding='utf-8', newline='') as handle:
              reader = csv.DictReader(handle); rows = list(reader); fields = reader.fieldnames
          assert fields == ['authority_key','landing_url','verification_date','verification_status']
          assert not any(r['authority_key'] == 'macerata' for r in rows)
          rows.append({'authority_key':'macerata','landing_url':LANDING,'verification_date':'2026-09-19','verification_status':'verified'})
          rows.sort(key=lambda r: r['authority_key'])
          assert len(rows) == 62
          rewrite_csv(path, rows, fields)

          path = ROOT/'data/source_registry/source_series_inventory.csv'
          with path.open(encoding='utf-8', newline='') as handle:
              reader = csv.DictReader(handle); rows = list(reader); fields = reader.fieldnames
          assert fields == ['source_series_key','authority_key','regime_code','population_scope','sector_scope','publication_model','series_url','resource_resolution_status','verified_date','notes']
          assert not any(r['authority_key'] == 'macerata' for r in rows)
          rows.extend([
              {'source_series_key':'macerata-applicants','authority_key':'macerata','regime_code':'WL-REGIME-L190-2012','population_scope':'applicant','sector_scope':'all','publication_model':'periodic_attachment','series_url':LANDING,'resource_resolution_status':'landing_page_resolved','verified_date':'2026-09-19','notes':'Current official Macerata page positively exposes the applicant attachment labelled presentazioni al 21 agosto 2026. Two independent cache-bypassed captures were byte-identical. The pinned edition yields 84 source observations: 83 pending and one explicitly marked Iscritta il 14/08/2026; the malformed source application date 27/01/206 is retained raw without repair.'},
              {'source_series_key':'macerata-listed','authority_key':'macerata','regime_code':'WL-REGIME-L190-2012','population_scope':'listed','sector_scope':'all','publication_model':'periodic_attachment','series_url':LANDING,'resource_resolution_status':'landing_page_resolved','verified_date':'2026-09-19','notes':'Current official Macerata page positively exposes the listed attachment labelled iscrizioni al 21 agosto 2026. Two independent cache-bypassed captures were byte-identical. Exact source-identity grouping across 2,150 company×section rows yields 1,274 observations; malformed identifiers and non-standard expiry cells remain conservative raw evidence.'},
          ])
          rows.sort(key=lambda r: r['source_series_key'])
          assert len(rows) == 122
          rewrite_csv(path, rows, fields)

          path = ROOT/'data/publication/multi_prefecture_pilot.json'
          config = json.loads(path.read_text(encoding='utf-8'))
          assert not any(s['authority_key'] == 'macerata' for s in config['sources'])
          common = {
              'authority_key':'macerata',
              'authority_name':'Prefettura di Macerata',
              'register_key':'macerata-ordinary',
              'register_name':'White List ordinaria',
              'reference_date':'2026-08-21',
              'source_page_url':LANDING,
              'last_source_update':'2026-08-21',
              'last_source_update_basis':'explicit attachment and landing edition date; two independent cache-bypassed captures reverified byte-identical on 19 September 2026',
              'approval_mode':'raw_sha256',
          }
          config['sources'].extend([
              {'source_key':'macerata-listed','parser':'macerata_listed',**common,'population_scope':'listed','resource_url':LISTED_URL,'sha256':LISTED_SHA,'expected_source_rows':1274,'expected_sector_rows':2150,'notes':'Dedicated official listed-company series. Exact full-row grouping only across sector repetition yields 1,274 observations: 879 listed, 394 renewal/update in progress and one raw ambiguous status retained as other_or_unknown. Structured identifiers are available for 1,240 observations; no malformed identifier or non-standard expiry is repaired.'},
              {'source_key':'macerata-applicants','parser':'macerata_applicants',**common,'population_scope':'applicant','resource_url':APPLICANTS_URL,'sha256':APPLICANTS_SHA,'expected_source_rows':84,'notes':'Dedicated official applicant series. Positive applicant publication evidence yields 84 observations: 83 pending and one explicitly listed by the source on 14 August 2026. Structured identifiers are available for 80 observations; the malformed application date 27/01/206 is retained raw and not normalised.'},
          ])
          path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          path = ROOT/'data/monitoring/national_coverage.json'
          ledger = json.loads(path.read_text(encoding='utf-8'))
          target = next(r for r in ledger['prefectures'] if r['authority_key'] == 'macerata')
          assert target['coverage_status'] == 'SOURCE_IDENTIFIED'
          assert target['source_verified'] is False and target['public_export_enabled'] is False
          target.update({
              'official_landing_page':LANDING,
              'source_verified':True,
              'current_edition_identified':True,
              'capture_implemented':True,
              'parser_implemented':True,
              'parser_validated':True,
              'company_observations_loaded':True,
              'observation_layer':'public_source_observations',
              'canonical_integration_validated':False,
              'public_export_enabled':True,
              'durable_evidence_verified':False,
              'population_scopes_complete':True,
              'latest_source_reference_date':'2026-08-21',
              'last_successful_source_check_at':None,
              'last_attempted_source_check_at':None,
              'last_content_change_at':None,
              'last_successful_investigation_on':'2026-09-19',
              'monitoring_status':'NEVER_CHECKED',
              'unresolved_issue':['Canonical hosted-database integration and independent durable-evidence verification remain separate infrastructure gates; the 21 August publication date is source provenance and is not promoted to any unobserved company legal-effect date.'],
              'actionable_issue':False,
              'coverage_status':'VALIDATED',
              'terminal_reason':None,
              'completion_evidence':['docs/sources/macerata-operational-check-2026-09-19.md','src/white_list_archive/parsers/macerata_tables.py','tests/test_macerata_parser_semantics.py','data/publication/multi_prefecture_pilot.json'],
              'known_content_sha256':[LISTED_SHA,APPLICANTS_SHA],
              'evidence':['data/source_registry/verified_primary_pages.csv','data/source_registry/source_series_inventory.csv','data/publication/multi_prefecture_pilot.json','docs/sources/macerata-operational-check-2026-09-19.md'],
              'last_completed_coverage_stage':'VALIDATED',
          })
          path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          path = ROOT/'src/white_list_archive/publishing/public_national_registry.py'
          text = path.read_text(encoding='utf-8')
          old = 'from white_list_archive.parsers.lucca_tables import PARSERS as LUCCA_PARSERS\n'
          text = replace_once(text, old, old + 'from white_list_archive.parsers.macerata_tables import PARSERS as MACERATA_PARSERS\n', 'registry import')
          old = '        or LUCCA_PARSERS.get(cfg["parser"])\n'
          text = replace_once(text, old, old + '        or MACERATA_PARSERS.get(cfg["parser"])\n', 'registry parser binding')
          path.write_text(text, encoding='utf-8')

          path = ROOT/'tests/test_source_registry.py'
          text = path.read_text(encoding='utf-8')
          text = replace_once(text, 'assert len(pages) == 61', 'assert len(pages) == 62', 'verified page test')
          path.write_text(text, encoding='utf-8')

          path = ROOT/'tests/test_source_population_coverage.py'
          text = path.read_text(encoding='utf-8')
          for old,new,label in [
              ('assert report["verified_authority_count"] == 61','assert report["verified_authority_count"] == 62','population authority count'),
              ('assert report["register_scope_count"] == 63','assert report["register_scope_count"] == 64','population register count'),
              ('assert report["complete_register_scope_count"] == 63','assert report["complete_register_scope_count"] == 64','population complete count'),
              ('        "lucca",\n    ):','        "lucca",\n        "macerata",\n    ):','population authority tuple'),
          ]:
              text = replace_once(text, old, new, label)
          path.write_text(text, encoding='utf-8')

          path = ROOT/'tests/public_portal_browser.cjs'
          text = path.read_text(encoding='utf-8')
          text = replace_once(text,
              "      assert.ok(labels.includes('White List ordinaria · Prefettura di Lucca'));\n",
              "      assert.ok(labels.includes('White List ordinaria · Prefettura di Lucca'));\n      assert.ok(labels.includes('White List ordinaria · Prefettura di Macerata'));\n",
              'browser label')
          text = replace_once(text, 'assert.equal(stats.total,65267);', 'assert.equal(stats.total,66625);', 'browser total')
          text = replace_once(text,
              "'imperia','lucca'].includes(r.authority_key)",
              "'imperia','lucca','macerata'].includes(r.authority_key)",
              'browser baseline exclusion')
          marker = "      assert.equal(new Set(lucca.map(r=>r.record_locator)).size,402);\n"
          macerata_js = """      const macerata=registry.records.filter(r=>r.authority_key==='macerata');\n      assert.equal(macerata.length,1358);\n      assert.equal(macerata.filter(r=>r.source_key==='macerata-listed').length,1274);\n      assert.equal(macerata.filter(r=>r.source_key==='macerata-applicants').length,84);\n      assert.deepEqual(statusCounts(macerata),{listed:880,other_or_unknown:1,pending:83,renewal_update_in_progress:394});\n      assert.equal(new Set(macerata.map(r=>r.record_locator)).size,1358);\n      assert.equal(macerata.filter(r=>r.identifiers.length>0).length,1320);\n      assert.equal(macerata.filter(r=>r.source_key==='macerata-applicants'&&r.outcome_raw==='Iscritta il 14/08/2026'&&r.source_status==='listed'&&r.observed_listing_date==='2026-08-14').length,1);\n      assert.equal(macerata.filter(r=>r.source_key==='macerata-applicants'&&r.source_fields.application_date_raw_variants.includes('27/01/206')&&r.application_date==='').length,1);\n      assert.equal(macerata.filter(r=>r.source_key==='macerata-listed'&&r.source_fields.expiry_date_raw_variants.includes('ISCRIZIONE 05/01/2027')&&r.observed_expiry_date==='').length,1);\n"""
          text = replace_once(text, marker, marker + macerata_js, 'browser Macerata block')
          path.write_text(text, encoding='utf-8')

          workflow = (ROOT/'.github/workflows/public-pages.yml').read_text(encoding='utf-8')
          workflow = replace_once(workflow,
              "      - 'src/white_list_archive/parsers/lucca_tables.py'\n",
              "      - 'src/white_list_archive/parsers/lucca_tables.py'\n      - 'src/white_list_archive/parsers/macerata_tables.py'\n",
              'portal parser path')
          workflow = replace_once(workflow, "assert reg['meta']['record_count'] == 65267", "assert reg['meta']['record_count'] == 66625", 'portal record count')
          workflow = replace_once(workflow, "'imperia','lucca'}", "'imperia','lucca','macerata'}", 'portal authority set')
          workflow = replace_once(workflow, "'imperia-ordinary','lucca-ordinary'", "'imperia-ordinary','lucca-ordinary','macerata-ordinary'", 'portal register set')
          workflow = replace_once(workflow, "assert reg['meta']['authority_count'] == 61", "assert reg['meta']['authority_count'] == 62", 'portal authority count')
          workflow = replace_once(workflow, "assert reg['meta']['register_count'] == 63", "assert reg['meta']['register_count'] == 64", 'portal register count')
          workflow = replace_once(workflow, "assert pref['meta']['published_count'] == 61", "assert pref['meta']['published_count'] == 62", 'portal published count')
          workflow = replace_once(workflow, "assert pref['meta']['mapped_count'] == 61", "assert pref['meta']['mapped_count'] == 62", 'portal mapped count')
          marker = "          assert len({r['record_locator'] for r in lucca_records}) == 402\n"
          macerata_gate = """          macerata = [x for x in pref['prefectures'] if x['authority_key'] == 'macerata']\n          assert len(macerata) == 1 and macerata[0]['mapped'] and macerata[0]['published'] and macerata[0]['series_count'] == 2\n          macerata_records = [r for r in reg['records'] if r['authority_key'] == 'macerata']\n          assert len(macerata_records) == 1358\n          assert sum(r['source_key'] == 'macerata-listed' for r in macerata_records) == 1274\n          assert sum(r['source_key'] == 'macerata-applicants' for r in macerata_records) == 84\n          assert sum(r['source_status'] == 'listed' for r in macerata_records) == 880\n          assert sum(r['source_status'] == 'renewal_update_in_progress' for r in macerata_records) == 394\n          assert sum(r['source_status'] == 'pending' for r in macerata_records) == 83\n          assert sum(r['source_status'] == 'other_or_unknown' for r in macerata_records) == 1\n          assert sum(bool(r['identifiers']) for r in macerata_records) == 1320\n          assert len({r['record_locator'] for r in macerata_records}) == 1358\n"""
          workflow = replace_once(workflow, marker, marker + macerata_gate, 'portal Macerata gate')
          candidate = ROOT/'tmp/macerata-public-pages.yml'
          candidate.parent.mkdir(parents=True, exist_ok=True)
          candidate.write_text(workflow, encoding='utf-8')
          PY

      - name: Run clean repository tests
        run: |
          mkdir -p /tmp/macerata-workflows
          mv .github/workflows/macerata-source-probe.yml /tmp/macerata-workflows/
          mv .github/workflows/macerata-finalize-2026-09-19.yml /tmp/macerata-workflows/
          pytest -q
          mv /tmp/macerata-workflows/macerata-source-probe.yml .github/workflows/
          mv /tmp/macerata-workflows/macerata-finalize-2026-09-19.yml .github/workflows/

      - name: Build and validate national candidate
        run: |
          rm -rf /tmp/macerata-public-build /tmp/macerata-public-sources
          mkdir -p /tmp/macerata-public-build/data
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/macerata-public-sources \
            --registry-json /tmp/macerata-public-build/data/registry.json \
            --registry-csv /tmp/macerata-public-build/data/registry.csv \
            --prefectures-json /tmp/macerata-public-build/data/prefectures.json \
            --prefectures-csv /tmp/macerata-public-build/data/prefectures.csv
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          root = Path('/tmp/macerata-public-build/data')
          reg = json.loads((root/'registry.json').read_text(encoding='utf-8'))
          pref = json.loads((root/'prefectures.json').read_text(encoding='utf-8'))
          assert reg['meta']['record_count'] == 66625
          assert reg['meta']['authority_count'] == 62
          assert reg['meta']['register_count'] == 64
          assert pref['meta']['published_count'] == 62
          assert pref['meta']['mapped_count'] == 62
          records = [r for r in reg['records'] if r['authority_key'] == 'macerata']
          assert len(records) == 1358
          assert len({r['record_locator'] for r in records}) == 1358
          assert sum(bool(r['identifiers']) for r in records) == 1320
          assert Counter(r['source_status'] for r in records) == Counter({
              'listed': 880,
              'renewal_update_in_progress': 394,
              'pending': 83,
              'other_or_unknown': 1,
          })
          PY

      - name: Commit permanent integration checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/catalog.csv \
            data/source_registry/verified_primary_pages.csv \
            data/source_registry/source_series_inventory.csv \
            data/publication/multi_prefecture_pilot.json \
            data/monitoring/national_coverage.json \
            src/white_list_archive/publishing/public_national_registry.py \
            tests/test_source_registry.py \
            tests/test_source_population_coverage.py \
            tests/public_portal_browser.cjs \
            tmp/macerata-public-pages.yml
          git diff --cached --check
          git commit -m 'Integrate Macerata White List sources'
          git push origin HEAD:expansion/macerata-2026-09-19
