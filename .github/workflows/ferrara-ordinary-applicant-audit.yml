name: Ferrara ordinary and applicant completeness audit

on:
  push:
    branches:
      - expansion/ferrara-2026-09-20
    paths:
      - .github/workflows/ferrara-ordinary-applicant-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pdfplumber==0.11.10
      - name: Audit pinned ordinary and applicant rows structurally
        shell: python
        run: |
          import hashlib, io, json, re, secrets, unicodedata
          from collections import Counter
          from datetime import datetime
          import pdfplumber, requests

          SOURCES = {
              'ordinary': (
                  'https://prefettura.interno.gov.it/sites/default/files/0/2026-08/white-list-provinciali-elenco-imprese-iscritte-agg11112024_0.pdf',
                  '0d631e678b7f85bb84d265b09b8de6fcffa09cc4a49b84be37c6c1d7b9dcd6d9',
              ),
              'applicants': (
                  'https://prefettura.interno.gov.it/sites/default/files/0/2026-08/white-list-elenco-imprese-richiedenti_0.pdf',
                  'c7437cdeebd1a64d4a6de8bbe5e8c108a688269409b7c772e8a6c87162e588e7',
              ),
          }
          EXPECTED = {
              'ordinary_pages': 87,
              'ordinary_candidates': 868,
              'ordinary_statuses': {
                  'listed': 717,
                  'renewal_update_in_progress': 150,
                  'other_or_unknown': 1,
              },
              'ordinary_strict_id_rows': 860,
              'ordinary_blank_office_rows': 1,
              'ordinary_date_anomalies': 2,
              'ordinary_header_rows': 10,
              'ordinary_structural_rows': 10,
              'ordinary_continuation_rows': 28,
              'applicant_pages': 5,
              'applicant_candidates': 21,
              'applicant_strict_id_rows': 21,
              'applicant_date_anomalies': 0,
              'applicant_header_rows': 4,
              'applicant_widths': {6: 10, 8: 15},
          }
          # Reviewed against exact applicant SHA and pdfplumber 0.11.10. Page 5 is
          # an actual empty trailing page. Any non-empty extraction fails closed.
          EXPECTED_EMPTY_APPLICANT_PAGES = {5}

          def norm(v):
              return ' '.join((v or '').replace('\u00a0', ' ').split())

          def fold(v):
              v = unicodedata.normalize('NFKD', norm(v))
              return ''.join(c for c in v if not unicodedata.combining(c)).casefold()

          def strict_ids(v):
              upper = (v or '').upper()
              compact = re.sub(r'[^0-9A-Z]', '', upper)
              out = re.findall(r'(?<![0-9A-Z])(?:[0-9]{11}|[A-Z0-9]{16})(?![0-9A-Z])', upper)
              if len(compact) in (11, 16) and compact not in out:
                  out.append(compact)
              return tuple(dict.fromkeys(out))

          def date_state(v):
              v = norm(v)
              if not v:
                  return 'blank'
              if not re.fullmatch(r'\d{2}/\d{2}/\d{4}', v):
                  return 'raw_noncanonical'
              try:
                  datetime.strptime(v, '%d/%m/%Y')
              except ValueError:
                  return 'raw_invalid'
              return 'normalised'

          def status(note):
              n = fold(note)
              if not n:
                  return 'listed'
              if 'rinnovo' in n or 'rinovo' in n:
                  return 'renewal_update_in_progress'
              return 'other_or_unknown'

          def get(label):
              url, expected = SOURCES[label]
              bodies = []
              for _ in range(2):
                  r = requests.get(
                      url,
                      headers={
                          'User-Agent': 'italian-anti-mafia-whitelist/ferrara-completeness-audit',
                          'Cache-Control': 'no-cache',
                          'Pragma': 'no-cache',
                      },
                      params={'audit_nonce': secrets.token_hex(8)},
                      timeout=90,
                  )
                  r.raise_for_status()
                  actual = hashlib.sha256(r.content).hexdigest()
                  assert actual == expected, (label, expected, actual, len(r.content))
                  bodies.append(r.content)
              assert bodies[0] == bodies[1], f'{label} independent fetches differ'
              return bodies[0]

          def is_header(row):
              joined = fold(' | '.join(row))
              return (
                  ('denominazione' in joined or 'ragione sociale' in joined)
                  and ('c.f' in joined or 'p.iva' in joined or 'partita iva' in joined)
              )

          def is_structural(row):
              first = fold(row[0]) if row else ''
              joined = fold(' | '.join(row))
              return (
                  first.startswith('prefettura di ferrara')
                  or first.startswith('sezione ')
                  or 'elenco dei fornitori, prestatori di servizi' in joined
              )

          def is_applicant_title(row):
              joined = fold(' | '.join(row))
              return 'white list' in joined and 'elenco imprese richiedenti' in joined

          ordinary = []
          ordinary_headers = []
          ordinary_structural = []
          ordinary_continuations = []
          ordinary_unclassified = []
          current = None

          with pdfplumber.open(io.BytesIO(get('ordinary'))) as pdf:
              assert len(pdf.pages) == EXPECTED['ordinary_pages']
              for pno, page in enumerate(pdf.pages, 1):
                  tables = page.extract_tables() or []
                  assert len(tables) == 1, (pno, len(tables))
                  for rno, raw in enumerate(tables[0] or [], 1):
                      row = [norm(x) for x in raw]
                      if not any(row):
                          continue
                      assert len(row) == 7, (pno, rno, row)
                      locator = f'p{pno}:r{rno}'
                      if is_header(row):
                          ordinary_headers.append({'locator': locator, 'row': row})
                          current = None
                          continue
                      if is_structural(row):
                          ordinary_structural.append({'locator': locator, 'row': row})
                          current = None
                          continue

                      name, office, secondary, ident, listed_raw, expiry_raw, note = row
                      if ident and expiry_raw:
                          current = {
                              'locator': locator,
                              'source_locators': [locator],
                              'name': name,
                              'office': office,
                              'secondary': secondary,
                              'id_raw': ident,
                              'listed_raw': listed_raw,
                              'expiry_raw': expiry_raw,
                              'note': note,
                          }
                          ordinary.append(current)
                          continue

                      if current is not None and not ident and not listed_raw and not expiry_raw:
                          fragment = [name, office, secondary, '', '', '', note]
                          if any(fragment):
                              for key, value in (
                                  ('name', name), ('office', office), ('secondary', secondary), ('note', note)
                              ):
                                  if value:
                                      current[key] = norm(f"{current[key]} {value}")
                              current['source_locators'].append(locator)
                              ordinary_continuations.append({
                                  'locator': locator,
                                  'attached_to': current['locator'],
                                  'row': row,
                              })
                              continue

                      ordinary_unclassified.append({'locator': locator, 'row': row})

          assert not ordinary_unclassified, ordinary_unclassified
          assert ordinary, 'no Ferrara ordinary observations parsed'
          assert all(x['name'] and x['id_raw'] and x['expiry_raw'] for x in ordinary)

          ordinary_status = Counter()
          ordinary_date_anomalies = []
          for item in ordinary:
              item['ids'] = strict_ids(item['id_raw'])
              item['listed_state'] = date_state(item['listed_raw'])
              item['expiry_state'] = date_state(item['expiry_raw'])
              item['status'] = status(item['note'])
              ordinary_status[item['status']] += 1
              if item['listed_state'] != 'normalised' or item['expiry_state'] != 'normalised':
                  ordinary_date_anomalies.append(item)

          applicants = []
          applicant_headers = []
          applicant_empty_pages = set()
          applicant_widths = Counter()
          applicant_unclassified = []
          applicant_date_anomalies = []

          with pdfplumber.open(io.BytesIO(get('applicants'))) as pdf:
              assert len(pdf.pages) == EXPECTED['applicant_pages']
              for pno, page in enumerate(pdf.pages, 1):
                  tables = page.extract_tables() or []
                  if not tables:
                      text = norm(page.extract_text() or '')
                      words = page.extract_words() or []
                      assert pno in EXPECTED_EMPTY_APPLICANT_PAGES, (pno, text, len(words))
                      assert text == '' and not words, (pno, text, words)
                      applicant_empty_pages.add(pno)
                      continue
                  assert len(tables) == 1, (pno, len(tables))
                  for rno, raw in enumerate(tables[0] or [], 1):
                      row = [norm(x) for x in raw]
                      if not any(row):
                          continue
                      applicant_widths[len(row)] += 1
                      locator = f'p{pno}:r{rno}'
                      if is_header(row) or is_applicant_title(row):
                          applicant_headers.append({'locator': locator, 'row': row})
                          continue

                      if len(row) == 6:
                          name, office, secondary, ident, app_raw, activities = row
                      elif len(row) == 8 and not row[0] and not row[-1]:
                          _, name, office, secondary, ident, app_raw, activities, _ = row
                      else:
                          applicant_unclassified.append({'locator': locator, 'row': row})
                          continue

                      if not (name and office and ident and app_raw and activities):
                          applicant_unclassified.append({'locator': locator, 'row': row})
                          continue

                      item = {
                          'locator': locator,
                          'name': name,
                          'office': office,
                          'secondary': secondary,
                          'id_raw': ident,
                          'ids': strict_ids(ident),
                          'application_raw': app_raw,
                          'application_state': date_state(app_raw),
                          'activities': activities,
                      }
                      applicants.append(item)
                      if item['application_state'] != 'normalised':
                          applicant_date_anomalies.append(item)

          assert applicant_empty_pages == EXPECTED_EMPTY_APPLICANT_PAGES, applicant_empty_pages
          assert not applicant_unclassified, applicant_unclassified
          assert applicants, 'no Ferrara applicant observations parsed'

          summary = {
              'ordinary_candidates': len(ordinary),
              'ordinary_statuses': dict(ordinary_status),
              'ordinary_strict_id_rows': sum(bool(x['ids']) for x in ordinary),
              'ordinary_blank_office_rows': sum(not x['office'] for x in ordinary),
              'ordinary_date_anomalies': len(ordinary_date_anomalies),
              'ordinary_header_rows': len(ordinary_headers),
              'ordinary_structural_rows': len(ordinary_structural),
              'ordinary_continuation_rows': len(ordinary_continuations),
              'ordinary_continuations': ordinary_continuations,
              'ordinary_date_anomaly_rows': ordinary_date_anomalies,
              'applicant_candidates': len(applicants),
              'applicant_widths': dict(applicant_widths),
              'applicant_strict_id_rows': sum(bool(x['ids']) for x in applicants),
              'applicant_date_anomalies': len(applicant_date_anomalies),
              'applicant_header_rows': len(applicant_headers),
              'applicant_empty_pages': sorted(applicant_empty_pages),
              'applicant_date_anomaly_rows': applicant_date_anomalies,
          }
          print('FERRARA_ORDINARY_APPLICANT_AUDIT_JSON')
          print(json.dumps(summary, ensure_ascii=False, indent=2))

          for key in (
              'ordinary_candidates', 'ordinary_strict_id_rows', 'ordinary_blank_office_rows',
              'ordinary_date_anomalies', 'ordinary_header_rows', 'ordinary_structural_rows',
              'ordinary_continuation_rows', 'applicant_candidates', 'applicant_strict_id_rows',
              'applicant_date_anomalies', 'applicant_header_rows',
          ):
              assert summary[key] == EXPECTED[key], (key, summary[key], EXPECTED[key])
          assert summary['ordinary_statuses'] == EXPECTED['ordinary_statuses'], summary['ordinary_statuses']
          assert summary['applicant_widths'] == EXPECTED['applicant_widths'], summary['applicant_widths']
