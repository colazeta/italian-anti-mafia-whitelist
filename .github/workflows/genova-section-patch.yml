name: Genova canonical record binding patch
on:
  push:
    branches: [expansion/genova-2026-09-12]
    paths: [.github/workflows/genova-section-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/genova-2026-09-12
      - name: Apply exact canonical helper binding
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/white_list_archive/parsers/genova_tables.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('from white_list_archive.parsers.multi_prefecture_tables import ParsedBatch, _base_record', 'from white_list_archive.parsers.multi_prefecture_tables import ParsedBatch, _record', 1),
              ('        record = _base_record(\n', '        record = _record(\n', 2),
              ('            source_ordinal=row["ordinal"],\n', '            row_ordinal=row["ordinal"],\n', 2),
              ('            address=row["address"],\n', '            office=row["address"],\n', 2),
              ('            source_status=row["source_status"],\n', '            status=row["source_status"],\n', 1),
              ('            source_status="pending",\n', '            status="pending",\n', 1),
              ('            observed_listing_date=row["listing_date"],\n', '            listing_date=row["listing_date"],\n', 1),
              ('            observed_expiry_date=row["expiry_date"],\n', '            expiry_date=row["expiry_date"],\n', 1),
              ('            observed_listing_date="",\n', '            listing_date="",\n', 1),
              ('            observed_expiry_date="",\n', '            expiry_date="",\n', 1),
          ]
          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'expected {expected} occurrence(s) of {old!r}, found {count}')
              text = text.replace(old, new)
          if '_base_record' in text:
              raise SystemExit('stale _base_record reference remains')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          python -m py_compile src/white_list_archive/parsers/genova_tables.py
      - name: Commit canonical helper binding
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/white_list_archive/parsers/genova_tables.py
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'Bind Genova parser to canonical record helper'
          git push origin HEAD:expansion/genova-2026-09-12
