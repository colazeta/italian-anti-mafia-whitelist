name: Genova reviewed section patch
on:
  push:
    branches: [expansion/genova-2026-09-12]
    paths: [.github/workflows/genova-section-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/genova-2026-09-12
      - name: Apply exact reviewed Genova exceptions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/white_list_archive/parsers/genova_tables.py')
          text = path.read_text(encoding='utf-8')

          marker = '_REVIEWED_INVALID_DATE_FIELDS = {'
          if marker not in text:
              anchor = '''_REVIEWED_SECTION_FIELDS = {'''
              start = text.index(anchor)
              end_marker = '''\n}\n\n\ndef _compact'''
              end = text.index(end_marker, start)
              insertion = '''\n}\n\n\n_REVIEWED_INVALID_DATE_FIELDS = {\n    ("listed", "GENOVARENT SRL", "listing", "26//09/2023"),\n    ("applicant", "LO SCACCIA PENSIERI SRL", "application", "16/072026"),\n}\n\n\ndef _compact'''
              text = text[:end] + insertion + text[end + len(end_marker):]

              old_helper = '''def _sections(value: str, *, scope: str, name: str) -> list[str]:'''
              new_helper = '''def _parse_observed_date(value: str, *, scope: str, name: str, field: str) -> str:\n    raw = _clean(value)\n    if (scope, name, field, raw) in _REVIEWED_INVALID_DATE_FIELDS:\n        return ""\n    return _parse_date(raw)\n\n\ndef _sections(value: str, *, scope: str, name: str) -> list[str]:'''
              if text.count(old_helper) != 1:
                  raise SystemExit(f'expected one _sections anchor, found {text.count(old_helper)}')
              text = text.replace(old_helper, new_helper)

              replacements = {
                  'listing_date = _parse_date(cells[5])': 'listing_date = _parse_observed_date(cells[5], scope="listed", name=cells[0], field="listing")',
                  'expiry_date = _parse_date(cells[6])': 'expiry_date = _parse_observed_date(cells[6], scope="listed", name=cells[0], field="expiry")',
                  'application_date = _parse_date(cells[5])': 'application_date = _parse_observed_date(cells[5], scope="applicant", name=cells[0], field="application")',
              }
              for old, new in replacements.items():
                  if text.count(old) != 1:
                      raise SystemExit(f'expected one date binding {old!r}, found {text.count(old)}')
                  text = text.replace(old, new)

          old_page9 = '''                    page_text = _clean(page.extract_text() or "")\n                    if not all(token in page_text for token in (_REVIEWED_APPLICANT_PAGE9[0], _REVIEWED_APPLICANT_PAGE9[1], _REVIEWED_APPLICANT_PAGE9[3])):\n                        raise RuntimeError("Genova applicant page-9 reconstruction no longer supported by page text")\n'''
          new_page9 = '''                    page_compact = _compact(page.extract_text() or "")\n                    reviewed_support = "EDILQUADRIFOGLIOSRL0166068099003/07/2026INISTRUTTORIAVIACESAREA,11/6"\n                    if reviewed_support not in page_compact:\n                        raise RuntimeError("Genova applicant page-9 reconstruction no longer supported by page text")\n'''
          if old_page9 in text:
              text = text.replace(old_page9, new_page9, 1)
          elif new_page9 not in text:
              raise SystemExit('reviewed page-9 support anchor not found')

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit reviewed parser patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/white_list_archive/parsers/genova_tables.py
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          if ! git diff --cached --quiet; then
            git commit -m 'Handle reviewed Genova page 9 and invalid dates'
            git push origin HEAD:expansion/genova-2026-09-12
          fi
