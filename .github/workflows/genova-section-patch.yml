name: Genova reviewed section patch
on:
  push:
    branches: [expansion/genova-2026-09-12]
    paths: [.github/workflows/genova-section-patch.yml]
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/genova-2026-09-12
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install bounded PDF audit runtime
        run: python -m pip install --disable-pip-version-check requests pdfplumber
      - name: Audit byte-pinned applicant page 9 extraction
        run: |
          python - <<'PY'
          import hashlib
          import json
          import tempfile
          from pathlib import Path

          import pdfplumber
          import requests

          url = 'https://prefettura.interno.gov.it/sites/default/files/0/2026-09/sez-richiedenti-10-09-26.pdf'
          expected = '13ecfd8bea8616deea76349cd7592fd046d09f45e2b522c11dda1f084a4420a7'
          r = requests.get(url, headers={'User-Agent': 'italian-anti-mafia-whitelist source audit/1.0'}, timeout=(15, 120))
          r.raise_for_status()
          actual = hashlib.sha256(r.content).hexdigest()
          if actual != expected:
              raise SystemExit(f'applicant source drift: {actual}')

          with tempfile.TemporaryDirectory(prefix='genova-p9-audit-') as td:
              path = Path(td) / 'applicants.pdf'
              path.write_bytes(r.content)
              with pdfplumber.open(path) as pdf:
                  page = pdf.pages[8]
                  text = page.extract_text() or ''
                  words = page.extract_words() or []
                  tables = page.extract_tables() or []
                  report = {
                      'sha256': actual,
                      'page': 9,
                      'text': text,
                      'words': [w.get('text', '') for w in words],
                      'tables': tables,
                  }
                  print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
