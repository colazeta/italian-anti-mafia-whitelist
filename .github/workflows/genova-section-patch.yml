name: Genova listed legend audit
on:
  push:
    branches: [expansion/genova-2026-09-12]
    paths: [.github/workflows/genova-section-patch.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/genova-2026-09-12
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install bounded audit runtime
        run: python -m pip install --disable-pip-version-check requests pdfplumber
      - name: Audit byte-pinned listed legend rows
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, tempfile
          import pdfplumber, requests
          url='https://prefettura.interno.gov.it/sites/default/files/0/2026-09/wl-10-09-26.pdf'
          expected='baf72de8d1f28943a8e9ec2bdd6e95213eacd0058cd6799a04e233c06d9e5403'
          r=requests.get(url,headers={'User-Agent':'italian-anti-mafia-whitelist source audit/1.0'},timeout=(15,120)); r.raise_for_status()
          actual=hashlib.sha256(r.content).hexdigest(); assert actual==expected,actual
          hits=[]
          with tempfile.TemporaryDirectory() as td:
            p=pathlib.Path(td)/'listed.pdf'; p.write_bytes(r.content)
            with pdfplumber.open(p) as pdf:
              for page_number,page in enumerate(pdf.pages,start=1):
                for table_index,table in enumerate(page.extract_tables() or [],start=1):
                  for row_index,row in enumerate(table or [],start=1):
                    cells=[' '.join(str(x or '').split()) for x in (row or [])]
                    joined=' '.join(cells)
                    if 'Legenda Sez. I - Estrazione' in joined:
                      hits.append({'page':page_number,'table':table_index,'row':row_index,'cells':cells})
          print(json.dumps({'sha256':actual,'legend_rows':hits,'count':len(hits)},ensure_ascii=False,indent=2))
          PY
