name: Genova reviewed section patch
on:
  push:
    branches: [expansion/genova-2026-09-12]
    paths: [.github/workflows/genova-section-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/genova-2026-09-12
      - name: Fix exact casefold guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/white_list_archive/parsers/genova_tables.py')
          text = path.read_text(encoding='utf-8')
          old = 'reviewed_support = "EDILQUADRIFOGLIOSRL0166068099003/07/2026INISTRUTTORIAVIACESAREA,11/6"'
          new = 'reviewed_support = "edilquadrifogliosrl0166068099003/07/2026inistruttoriaviacesarea,11/6"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one uppercase reviewed support guard, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit parser guard fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/white_list_archive/parsers/genova_tables.py
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'Fix Genova reviewed page 9 guard casefold'
          git push origin HEAD:expansion/genova-2026-09-12
