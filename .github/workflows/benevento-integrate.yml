name: Benevento one-shot integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/benevento-2026-09-10
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate validated Benevento sources
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv, json
          from pathlib import Path

          root=Path('.')

          # Approved public source configuration.
          config_path=root/'data/publication/multi_prefecture_pilot.json'
          config=json.loads(config_path.read_text(encoding='utf-8'))
          existing={s['source_key'] for s in config['sources']}
          additions=[
            {
              'source_key':'benevento-listed','parser':'benevento_listed','authority_key':'benevento',
              'authority_name':'Prefettura di Benevento','register_key':'benevento-ordinary','register_name':'White List ordinaria',
              'population_scope':'listed','reference_date':'2026-08-31',
              'source_page_url':'https://prefettura.interno.gov.it/it/prefetture/benevento/white-list-elenco-imprese-iscritte',
              'resource_url':'https://prefettura.interno.gov.it/sites/default/files/25/2026-09/elenco-imprese-iscritte-31-08-2026.pdf',
              'sha256':'a0e260f748d3447cf17378e15e3466ec93ca72b7da1f6a7b1e1144c11ba28c01','expected_source_rows':734,
              'last_source_update':'2026-09-01','last_source_update_basis':'official page update and dated attachment label',
              'notes':'The official source explicitly identifies the listed-company population at 31 August 2026. The PDF table contains visually distinct company observations that ordinary table extraction can merge; the approved parser therefore uses the ruled-table geometry and the source listing-date column as row anchors. Names, offices, activities and identifiers are read only from their source column bands. Two listed rows have an empty raw identifier cell and other non-canonical identifiers remain raw; one malformed expiry value is retained as a raw source variant and is not repaired. Free-text update material is preserved without changing the source-population status.'
            },
            {
              'source_key':'benevento-applicants','parser':'benevento_applicants','authority_key':'benevento',
              'authority_name':'Prefettura di Benevento','register_key':'benevento-ordinary','register_name':'White List ordinaria',
              'population_scope':'applicant','reference_date':'2026-08-31',
              'source_page_url':'https://prefettura.interno.gov.it/it/prefetture/benevento/white-list-elenco-imprese-richiedenti',
              'resource_url':'https://prefettura.interno.gov.it/sites/default/files/25/2026-09/elenco-imprese-richiedenti-31-08-2026.pdf',
              'sha256':'7e7333af70cef53e10e8c9d269cb6d5a70a88f33871630606b6cd06b1c2f5cac','expected_source_rows':204,
              'last_source_update':'2026-09-01','last_source_update_basis':'official page update and dated attachment label',
              'notes':'The official source explicitly identifies companies requesting enrolment at 31 August 2026. Position-aware recovery yields 204 complete name/office/activity observations from primary application-date anchors inside the ruled table; this prevents distinct visual rows from being collapsed by generic table extraction. Applicant rows are published as pending only; no legal or procedural outcome is inferred from blank or free-text cells. One source row has an empty raw identifier and other non-canonical identifiers remain unmodified.'
            }
          ]
          for item in additions:
            if item['source_key'] not in existing:
              config['sources'].append(item)
          config_path.write_text(json.dumps(config,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Parser registry.
          registry_path=root/'src/white_list_archive/publishing/public_national_registry.py'
          text=registry_path.read_text(encoding='utf-8')
          import_anchor='from white_list_archive.parsers.biella_html import PARSERS as BIELLA_PARSERS\n'
          if 'BENEVENTO_PARSERS' not in text:
            assert text.count(import_anchor)==1
            text=text.replace(import_anchor,import_anchor+'from white_list_archive.parsers.benevento_positioned import PARSERS as BENEVENTO_PARSERS\n')
            map_anchor='        or BIELLA_PARSERS.get(cfg["parser"])\n'
            assert text.count(map_anchor)==1
            text=text.replace(map_anchor,map_anchor+'        or BENEVENTO_PARSERS.get(cfg["parser"])\n')
          registry_path.write_text(text,encoding='utf-8')

          # Source-series inventory: append only if absent; do not rewrite older evidence.
          inv_path=root/'data/source_registry/source_series_inventory.csv'
          inv=inv_path.read_text(encoding='utf-8')
          if 'benevento-listed,' not in inv:
            if not inv.endswith('\n'): inv+='\n'
            inv += 'benevento-listed,benevento,WL-REGIME-L190-2012,listed,all,periodic_pdf,https://prefettura.interno.gov.it/it/prefetture/benevento/white-list-elenco-imprese-iscritte,direct_series_page_resolved,2026-09-10,"Current official listed-company series verified 10 September 2026; approved edition dated 31 August 2026. Byte identity and position-aware parser boundary documented in docs/sources/benevento-operational-check-2026-09-10.md."\n'
            inv += 'benevento-applicants,benevento,WL-REGIME-L190-2012,applicant,requested_sectors,periodic_pdf,https://prefettura.interno.gov.it/it/prefetture/benevento/white-list-elenco-imprese-richiedenti,direct_series_page_resolved,2026-09-10,"Current official applicant series verified 10 September 2026; approved edition dated 31 August 2026. Position-aware recovery is required because generic extraction merges distinct visual observations; details in docs/sources/benevento-operational-check-2026-09-10.md."\n'
          inv_path.write_text(inv,encoding='utf-8')

          # Coverage ledger.
          coverage_path=root/'data/monitoring/national_coverage.json'
          coverage=json.loads(coverage_path.read_text(encoding='utf-8'))
          row=next(x for x in coverage['prefectures'] if x['authority_key']=='benevento')
          row.update({
            'source_verified':True,'current_edition_identified':True,'capture_implemented':True,
            'parser_implemented':True,'parser_validated':True,'company_observations_loaded':True,
            'observation_layer':'public_source_observations','canonical_integration_validated':False,
            'public_export_enabled':True,'durable_evidence_verified':False,'population_scopes_complete':True,
            'latest_source_reference_date':'2026-08-31','latest_archived_edition':None,
            'archived_evidence_storage_status':'not_documented','last_successful_source_check_at':'2026-09-10T04:44:16Z',
            'last_attempted_source_check_at':'2026-09-10T04:44:16Z','last_successful_investigation_on':'2026-09-10',
            'monitoring_status':'CURRENT','unresolved_issue':['Canonical hosted-database integration and independent durable-evidence verification remain governed under #16; public source observations are validated independently of that infrastructure.'],
            'actionable_issue':False,'coverage_status':'VALIDATED','terminal_reason':None,
            'completion_evidence':['docs/sources/benevento-operational-check-2026-09-10.md','src/white_list_archive/parsers/benevento_positioned.py','tests/test_benevento_parser_semantics.py','data/publication/multi_prefecture_pilot.json'],
            'known_content_sha256':['a0e260f748d3447cf17378e15e3466ec93ca72b7da1f6a7b1e1144c11ba28c01','7e7333af70cef53e10e8c9d269cb6d5a70a88f33871630606b6cd06b1c2f5cac'],
            'evidence':['data/source_registry/verified_primary_pages.csv','data/source_registry/source_series_inventory.csv','docs/sources/benevento-operational-check-2026-09-10.md','src/white_list_archive/parsers/benevento_positioned.py','tests/test_benevento_parser_semantics.py','data/publication/multi_prefecture_pilot.json']
          })
          coverage_path.write_text(json.dumps(coverage,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Durable operational evidence, intentionally without source-row content.
          doc=root/'docs/sources/benevento-operational-check-2026-09-10.md'
          doc.write_text('''# Benevento — operational source check — 10 September 2026\n\n## Current official populations\n\nThe Prefettura di Benevento publishes two explicit current White List populations. The listed-company page links the attachment labelled **Elenco delle imprese iscritte al giorno 31 agosto 2026**; the applicant page links **Elenco imprese richiedenti iscrizione al giorno 31 agosto 2026**. Both landing pages were checked on 10 September 2026 and had been updated by the Prefecture on 1 September 2026.\n\nApproved source identities:\n\n- listed PDF: `a0e260f748d3447cf17378e15e3466ec93ca72b7da1f6a7b1e1144c11ba28c01`, 64 pages;\n- applicant PDF: `7e7333af70cef53e10e8c9d269cb6d5a70a88f33871630606b6cd06b1c2f5cac`, 16 pages.\n\nThe official landing and resource URLs are stored in `data/publication/multi_prefecture_pilot.json`.\n\n## Parser boundary\n\nGeneric PDF table extraction is not a safe row boundary for these editions. In the applicant PDF, several visually distinct observations are collapsed into a single extracted table row. The approved parser therefore uses the PDF's ruled-table geometry and the source's primary date column as row anchors, then reads each source field only inside the corresponding fixed column band. Date-like document metadata outside the ruled source table cannot create an observation. The parser is byte-layout specific and fails closed on an unexpected page count, ambiguous row anchors, missing name/office, invalid primary source dates or an unexpected final observation count.\n\nValidation against the byte-pinned editions yields **734 listed observations** and **204 applicant observations**. All 938 observations have non-empty source names, registered offices and activity cells. The listed source has 732 non-empty raw identifier cells and 718 values meeting conservative identifier normalisation; the applicant source has 203 non-empty raw identifier cells and 194 values meeting that normalisation. Empty or non-canonical identifiers are not reconstructed. One listed expiry value is malformed in the source representation; the normalised expiry remains blank and the raw variant is retained.\n\n## Status semantics\n\nPopulation membership is positive source evidence. Rows from the listed-company source are `listed`; rows from the applicant source are `pending`. Free text is not used to invent a legal outcome. The listed source's explicit update column is retained as source text, while the requested-activity/section column is published separately.\n\n## Remaining infrastructure boundary\n\nThis expansion validates public source observations and the public export. It does not claim hosted canonical-database integration or independent durable-evidence recovery; those remain governed under issue #16.\n''',encoding='utf-8')

          # Public build gate: increase, never weaken, the frozen assertions.
          pages_path=root/'.github/workflows/public-pages.yml'
          p=pages_path.read_text(encoding='utf-8')
          if "parsers/benevento_positioned.py" not in p:
            p=p.replace("      - 'src/white_list_archive/parsers/biella_html.py'\n","      - 'src/white_list_archive/parsers/biella_html.py'\n      - 'src/white_list_archive/parsers/benevento_positioned.py'\n")
          replacements={
            "assert reg['meta']['record_count'] == 7584":"assert reg['meta']['record_count'] == 8522",
            "'pesaro-e-urbino','biella'}":"'pesaro-e-urbino','biella','benevento'}",
            "'avellino-ordinary','pesaro-urbino-ordinary','biella-ordinary'":"'avellino-ordinary','pesaro-urbino-ordinary','biella-ordinary','benevento-ordinary'",
            "assert reg['meta']['authority_count'] == 10":"assert reg['meta']['authority_count'] == 11",
            "assert reg['meta']['register_count'] == 11":"assert reg['meta']['register_count'] == 12",
            "assert pref['meta']['published_count'] == 10":"assert pref['meta']['published_count'] == 11",
          }
          for old,new in replacements.items():
            assert old in p, old
            p=p.replace(old,new,1)
          marker="          biella = [x for x in pref['prefectures'] if x['authority_key'] == 'biella']\n          assert len(biella) == 1 and biella[0]['mapped'] and biella[0]['published']\n"
          if "authority_key'] == 'benevento'" not in p:
            assert marker in p
            p=p.replace(marker,marker+"          benevento = [x for x in pref['prefectures'] if x['authority_key'] == 'benevento']\n          assert len(benevento) == 1 and benevento[0]['mapped'] and benevento[0]['published']\n")
          pages_path.write_text(p,encoding='utf-8')

          # Browser acceptance gate with an independent pre-Benevento baseline.
          browser_path=root/'tests/public_portal_browser.cjs'
          b=browser_path.read_text(encoding='utf-8')
          label="      assert.ok(labels.includes('White List ordinaria · Prefettura di Biella'));\n"
          if 'Prefettura di Benevento' not in b:
            assert label in b
            b=b.replace(label,label+"      assert.ok(labels.includes('White List ordinaria · Prefettura di Benevento'));\n")
          assert 'assert.equal(stats.total,7584);' in b
          b=b.replace('assert.equal(stats.total,7584);','assert.equal(stats.total,8522);',1)
          old="!['alessandria','aosta','arezzo','avellino','pesaro-e-urbino','biella'].includes(r.authority_key)"
          new="!['alessandria','aosta','arezzo','avellino','pesaro-e-urbino','biella','benevento'].includes(r.authority_key)"
          assert old in b
          b=b.replace(old,new,1)
          biella_block="      assert.deepEqual(statusCounts(biella),{listed:213,pending:12,renewal_update_in_progress:14});\n"
          if "authority_key==='benevento'" not in b:
            assert biella_block in b
            b=b.replace(biella_block,biella_block+"      const benevento=registry.records.filter(r=>r.authority_key==='benevento');\n      assert.equal(benevento.length,938);\n      assert.equal(benevento.filter(r=>r.source_key==='benevento-listed').length,734);\n      assert.equal(benevento.filter(r=>r.source_key==='benevento-applicants').length,204);\n      assert.deepEqual(statusCounts(benevento),{listed:734,pending:204});\n")
          browser_path.write_text(b,encoding='utf-8')

          # Temporary automation files must never reach main.
          for temporary in [root/'.github/workflows/benevento-expansion-diagnostics.yml', root/'.github/workflows/benevento-integrate.yml']:
            if temporary.exists(): temporary.unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Integrate validated Benevento White List sources'
          git push origin HEAD:expansion/benevento-2026-09-10
