name: Temporary L'Aquila integration finalizer v3

on:
  push:
    branches:
      - expansion/laquila-2026-09-18
    paths:
      - '.github/workflows/laquila-integration-finalize-v3.yml'

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact expansion branch
        uses: actions/checkout@v4
        with:
          ref: expansion/laquila-2026-09-18
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare reviewed stage extractor
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/run-laquila-stage <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          step_name="$1"
          ruby -ryaml -e '
            d=YAML.unsafe_load_file(ARGV[0]);
            s=d.fetch("jobs").fetch("finalise").fetch("steps").find{|x| x["name"]==ARGV[1]};
            abort("step not found: #{ARGV[1]}") unless s && s["run"];
            print s["run"]
          ' .github/workflows/laquila-integration-finalize.yml "$step_name" > /tmp/laquila-stage.sh
          bash /tmp/laquila-stage.sh
          EOF
          chmod +x /tmp/run-laquila-stage

      - name: Install publication runtime
        shell: bash
        run: |
          /tmp/run-laquila-stage 'Install publication runtime'
          python -m pip install 'pytest>=8,<9'

      - name: Revalidate exact official source bytes twice
        shell: bash
        run: /tmp/run-laquila-stage 'Revalidate exact official source bytes twice'

      - name: Exercise parser against fresh captures
        shell: bash
        run: /tmp/run-laquila-stage 'Exercise parser against fresh captures'

      - name: Materialise reviewed permanent integration
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: /tmp/run-laquila-stage 'Materialise reviewed permanent integration and public-workflow candidate'

      - name: Validate targeted integration before checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_laquila_parser_semantics.py \
            tests/test_source_population_coverage.py \
            tests/test_source_registry.py
          node --check tests/public_portal_browser.cjs
          ruby -e "require 'yaml'; YAML.load_file('tmp/laquila-public-pages-candidate.yml')"
          git diff --check

      - name: Commit recoverable integration checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected <<'EOF'
          data/catalog.csv
          data/monitoring/national_coverage.json
          data/publication/multi_prefecture_pilot.json
          data/source_registry/source_series_inventory.csv
          data/source_registry/verified_primary_pages.csv
          docs/sources/laquila-operational-check-2026-09-18.md
          src/white_list_archive/publishing/public_national_registry.py
          tests/public_portal_browser.cjs
          tests/test_laquila_parser_semantics.py
          tests/test_source_population_coverage.py
          tests/test_source_registry.py
          tmp/laquila-public-pages-candidate.yml
          EOF
          sed -i 's/^          //' /tmp/expected
          actual=$(git status --short | sed 's/^.. //' | sort)
          expected=$(sort /tmp/expected)
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected finalizer working-tree scope:' >&2
            printf '%s\n' "$actual" >&2
            echo 'Expected:' >&2
            printf '%s\n' "$expected" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data docs src tests tmp
          git commit -m "Integrate L'Aquila public White List sources"
          git push origin HEAD:expansion/laquila-2026-09-18

      - name: Build full approved public registry
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/laquila-public-build /tmp/laquila-public-sources
          mkdir -p /tmp/laquila-public-build
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/laquila-public-sources \
            --registry-json /tmp/laquila-public-build/registry.json \
            --registry-csv /tmp/laquila-public-build/registry.csv \
            --prefectures-json /tmp/laquila-public-build/prefectures.json \
            --prefectures-csv /tmp/laquila-public-build/prefectures.csv

      - name: Validate full-registry L'Aquila boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          reg=json.load(open('/tmp/laquila-public-build/registry.json', encoding='utf-8'))
          pref=json.load(open('/tmp/laquila-public-build/prefectures.json', encoding='utf-8'))
          assert reg['meta']['record_count'] == 62286
          assert reg['meta']['authority_count'] == 54
          assert reg['meta']['register_count'] == 56
          rows=[r for r in reg['records'] if r['authority_key']=='laquila']
          assert len(rows)==695
          assert sum(r['source_status']=='listed' for r in rows)==209
          assert sum(r['source_status']=='renewal_update_in_progress' for r in rows)==210
          assert sum(r['source_status']=='pending' for r in rows)==276
          assert len({r['record_locator'] for r in rows})==695
          assert sum(bool(r['identifiers']) for r in rows)==690
          p=[x for x in pref['prefectures'] if x['authority_key']=='laquila']
          assert len(p)==1 and p[0]['mapped'] and p[0]['published'] and p[0]['series_count']==2
          assert pref['meta']['published_count']==54 and pref['meta']['mapped_count']==54
          PY
