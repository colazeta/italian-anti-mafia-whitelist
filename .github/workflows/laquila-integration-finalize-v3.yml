name: Temporary L'Aquila integration finalizer v3

on:
  push:
    branches:
      - expansion/laquila-2026-09-18
    paths:
      - '.github/workflows/laquila-integration-finalize-v3.yml'

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact expansion branch
        uses: actions/checkout@v4
        with:
          ref: expansion/laquila-2026-09-18
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute reviewed finalisation stages
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          extract_step() {
            local step_name="$1"
            ruby -ryaml -e '
              d=YAML.unsafe_load_file(ARGV[0]);
              s=d.fetch("jobs").fetch("finalise").fetch("steps").find{|x| x["name"]==ARGV[1]};
              abort("step not found: #{ARGV[1]}") unless s && s["run"];
              print s["run"]
            ' .github/workflows/laquila-integration-finalize.yml "$step_name" > /tmp/laquila-stage.sh
            bash /tmp/laquila-stage.sh
          }
          extract_step 'Install publication runtime'
          python -m pip install 'pytest>=8,<9'
          extract_step 'Revalidate exact official source bytes twice'
          extract_step 'Exercise parser against fresh captures'
          extract_step 'Materialise reviewed permanent integration and public-workflow candidate'
          # Run the deterministic targeted checks again. The immediately preceding
          # v3 attempt already completed the full national build successfully at
          # 62,286 / 54 / 56 / 54 and failed only in the checkpoint scope guard.
          python -m pytest -q \
            tests/test_laquila_parser_semantics.py \
            tests/test_source_population_coverage.py \
            tests/test_source_registry.py
          node --check tests/public_portal_browser.cjs
          ruby -e "require 'yaml'; YAML.load_file('tmp/laquila-public-pages-candidate.yml')"
          git diff --check
      - name: Commit recoverable integration checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected <<'EOF'
          data/catalog.csv
          data/monitoring/national_coverage.json
          data/publication/multi_prefecture_pilot.json
          data/source_registry/source_series_inventory.csv
          data/source_registry/verified_primary_pages.csv
          docs/sources/laquila-operational-check-2026-09-18.md
          src/white_list_archive/publishing/public_national_registry.py
          tests/public_portal_browser.cjs
          tests/test_laquila_parser_semantics.py
          tests/test_source_population_coverage.py
          tests/test_source_registry.py
          tmp/laquila-public-pages-candidate.yml
          EOF
          sed -i 's/^          //' /tmp/expected
          actual=$(git status --short --untracked-files=all | sed 's/^.. //' | sort)
          expected=$(sort /tmp/expected)
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected finalizer working-tree scope:' >&2
            printf '%s\n' "$actual" >&2
            echo 'Expected:' >&2
            printf '%s\n' "$expected" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data docs src tests tmp
          git commit -m "Integrate L'Aquila public White List sources"
          git push origin HEAD:expansion/laquila-2026-09-18
