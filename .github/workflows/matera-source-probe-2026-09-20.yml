name: Matera source probe 2026-09-20

on:
  push:
    branches:
      - expansion/matera-2026-09-20
    paths:
      - .github/workflows/matera-source-probe-2026-09-20.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/matera-2026-09-20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact canonical base and isolated scope
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "6d88336c0ca902eee0e37071a43da1d96c28681c"
          test "$(git rev-list --count HEAD..origin/main)" = "0"
          python - <<'PY'
          import subprocess
          files=set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'],text=True).splitlines())
          expected={'.github/workflows/matera-source-probe-2026-09-20.yml'}
          if files != expected:
              raise SystemExit(f'unexpected Matera pre-probe scope: {sorted(files)}')
          PY
      - name: Install bounded source-inspection runtime
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils antiword file
          python -m pip install --disable-pip-version-check requests beautifulsoup4 openpyxl python-docx xlrd
      - name: Resolve, recapture and inspect official Matera attachments
        env:
          LANDING_URL: https://prefettura.interno.gov.it/it/prefetture/matera/evidenza/white-list
        run: |
          mkdir -p /tmp/matera-probe
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, pathlib, re, subprocess, time, zipfile
          from urllib.parse import parse_qsl, urlencode, urljoin, urlsplit, urlunsplit
          import requests
          from bs4 import BeautifulSoup

          ROOT=pathlib.Path('/tmp/matera-probe')
          UA='Mozilla/5.0 (compatible; italian-anti-mafia-whitelist-source-verification/1.0)'
          landing=os.environ['LANDING_URL']
          session=requests.Session()
          session.headers.update({'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,application/pdf,*/*;q=0.8','Cache-Control':'no-cache','Pragma':'no-cache'})

          def bust(url: str, token: str) -> str:
              p=urlsplit(url); q=parse_qsl(p.query,keep_blank_values=True); q.append(('_wl_probe',token))
              return urlunsplit((p.scheme,p.netloc,p.path,urlencode(q),p.fragment))

          def fetch(url: str, attempt: int, accept: str='*/*'):
              target=bust(url,f'{attempt}-{time.time_ns()}')
              r=session.get(target,headers={'Accept':accept},timeout=90,allow_redirects=True)
              info={'requested':url,'attempt':attempt,'status':r.status_code,'final_url':r.url.split('?_wl_probe=',1)[0].split('&_wl_probe=',1)[0],
                    'content_type':r.headers.get('content-type',''),'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest()}
              print('FETCH',json.dumps(info,ensure_ascii=False,sort_keys=True))
              r.raise_for_status()
              return r,info

          landing_responses=[]
          for attempt in (1,2):
              try:
                  r,info=fetch(landing,attempt,'text/html,application/xhtml+xml,*/*;q=0.8')
                  landing_responses.append((r,info))
              except Exception as exc:
                  print(f'LANDING_FETCH_ERROR attempt={attempt}: {type(exc).__name__}: {exc}')
          if not landing_responses:
              print('NO_LANDING_BYTES_AVAILABLE; source status remains unresolved, not negative evidence')
              raise SystemExit(0)

          html=landing_responses[-1][0].text
          soup=BeautifulSoup(html,'html.parser')
          matches=[]
          for a in soup.find_all('a',href=True):
              text=' '.join(a.get_text(' ',strip=True).split())
              href=urljoin(landing,a['href'])
              folded=(text+' '+href).casefold()
              if any(k in folded for k in ('richiest','iscritt','white list','white-list','31 luglio 2026','31-luglio-2026')):
                  matches.append({'text':text,'url':href})
          # dedupe preserving order
          unique=[]; seen=set()
          for item in matches:
              key=(item['text'],item['url'])
              if key not in seen:
                  seen.add(key); unique.append(item)
          print('MATCHED_ANCHORS_BEGIN')
          for item in unique:
              print(json.dumps(item,ensure_ascii=False,sort_keys=True))
          print('MATCHED_ANCHORS_END')

          def score(item,kind):
              s=(item['text']+' '+item['url']).casefold()
              if kind=='applicants':
                  return sum(w in s for w in ('richiest','aggiornamento','iscrizione')) + (3 if 'richiest' in s else 0)
              return sum(w in s for w in ('imprese iscritte','elenco imprese iscritte','iscritt')) - (5 if 'richiest' in s else 0)

          picked={}
          for kind in ('listed','applicants'):
              ranked=sorted(unique,key=lambda x:(score(x,kind),x['text']),reverse=True)
              ranked=[x for x in ranked if score(x,kind)>0 and x['url'] != landing]
              if ranked:
                  picked[kind]=ranked[0]
          print('PICKED_CANDIDATES',json.dumps(picked,ensure_ascii=False,sort_keys=True))
          if set(picked)!={'listed','applicants'} or picked['listed']['url']==picked['applicants']['url']:
              print('POSITIVE_TWO-POPULATION_RESOURCE_RESOLUTION_NOT_ESTABLISHED; no integration inference')
              raise SystemExit(0)

          summaries={}
          for kind,item in picked.items():
              captures=[]
              for attempt in (1,2):
                  try:
                      r,info=fetch(item['url'],attempt)
                  except Exception as exc:
                      print(f'ATTACHMENT_FETCH_ERROR kind={kind} attempt={attempt}: {type(exc).__name__}: {exc}')
                      captures=[]; break
                  path=ROOT/f'{kind}-{attempt}.bin'; path.write_bytes(r.content)
                  captures.append((path,r.content,info))
              if len(captures)!=2:
                  print(f'{kind.upper()}_DOUBLE_CAPTURE_UNAVAILABLE; do not approve bytes')
                  continue
              identical=captures[0][1]==captures[1][1]
              print(f'{kind.upper()}_BYTE_IDENTITY identical={identical}')
              if not identical:
                  print(f'{kind.upper()}_MUTABLE_OR_UNSTABLE_BYTES; do not approve raw digest')
                  continue
              path,body,info=captures[0]
              magic=body[:16]
              suffix='bin'
              if body.startswith(b'%PDF-'): suffix='pdf'
              elif body.startswith(b'PK\x03\x04'):
                  # xlsx/docx are zip containers; discriminate by names
                  with zipfile.ZipFile(path) as z:
                      names=set(z.namelist())
                  if any(n.startswith('xl/') for n in names): suffix='xlsx'
                  elif any(n.startswith('word/') for n in names): suffix='docx'
                  else: suffix='zip'
              elif body.startswith(b'\xd0\xcf\x11\xe0'): suffix='ole'
              typed=ROOT/f'{kind}.{suffix}'; typed.write_bytes(body)
              summary={'kind':kind,'label':item['text'],'url':item['url'],'sha256':info['sha256'],'bytes':len(body),'type':suffix,'magic_hex':magic.hex()}
              summaries[kind]=summary
              print('APPROVED_CAPTURE_CANDIDATE',json.dumps(summary,ensure_ascii=False,sort_keys=True))

          (ROOT/'summary.json').write_text(json.dumps(summaries,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if set(summaries)!={'listed','applicants'}:
              print('BYTE-STABLE_TWO-POPULATION_CAPTURE_NOT_ESTABLISHED; stop before parser assumptions')
              raise SystemExit(0)
          PY

          for f in /tmp/matera-probe/listed.* /tmp/matera-probe/applicants.*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.pdf)
                echo "===== PDFINFO $f ====="
                pdfinfo "$f" | sed -n '1,25p'
                pdftotext -layout "$f" "$f.txt"
                echo "===== TEXT HEAD $f ====="; sed -n '1,80p' "$f.txt"
                echo "===== TEXT TAIL $f ====="; tail -n 50 "$f.txt"
                echo "===== KEY LINES $f ====="; grep -Ein 'ragione|sociale|codice|fisc|partita|iva|sede|iscritt|richiest|aggiorna|istrutt|scad|data|attivit|sez' "$f.txt" | head -n 120 || true
                ;;
              *.xlsx)
                python - "$f" <<'PY'
          import json,sys
          from openpyxl import load_workbook
          p=sys.argv[1]; wb=load_workbook(p,read_only=True,data_only=False)
          print('XLSX_SHEETS',json.dumps(wb.sheetnames,ensure_ascii=False))
          for ws in wb.worksheets:
              print('XLSX_SHEET',ws.title,'max_row',ws.max_row,'max_column',ws.max_column)
              shown=0
              for i,row in enumerate(ws.iter_rows(values_only=True),start=1):
                  vals=['' if v is None else str(v) for v in row]
                  if any(v.strip() for v in vals):
                      print('ROW',i,json.dumps(vals,ensure_ascii=False))
                      shown+=1
                      if shown>=35: break
          PY
                ;;
              *.docx)
                python - "$f" <<'PY'
          import json,sys
          from docx import Document
          d=Document(sys.argv[1]); print('DOCX_PARAGRAPHS',len(d.paragraphs),'TABLES',len(d.tables))
          for i,p in enumerate([p for p in d.paragraphs if p.text.strip()][:50],1): print('P',i,repr(p.text))
          for ti,t in enumerate(d.tables[:5],1):
              print('TABLE',ti,'rows',len(t.rows),'cols',len(t.columns))
              for ri,row in enumerate(t.rows[:25],1): print('ROW',ri,json.dumps([c.text for c in row.cells],ensure_ascii=False))
          PY
                ;;
              *.ole)
                echo "===== OLE/LEGACY FILE $f ====="; file "$f"; antiword "$f" 2>/dev/null | sed -n '1,160p' || true
                ;;
            esac
          done
      - name: Preserve bounded probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matera-source-probe-${{ github.sha }}
          path: /tmp/matera-probe
          if-no-files-found: ignore
          retention-days: 3
