name: Trapani shape runner
on:
  push:
    branches: [expansion/trapani-2026-09-19]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/trapani-2026-09-19
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pdfplumber
      - name: Fetch reviewed sources
        run: |
          curl -fLsS -H 'Cache-Control: no-cache' 'https://prefettura.interno.gov.it/sites/default/files/97/2026-09/elenco-ditte-iscritte-negli-elenchi-delle-white-list-aggiornato-all-11.09.2026.pdf?_wl_shape=l1-${GITHUB_RUN_ID}' -o /tmp/listed.pdf
          curl -fLsS -H 'Cache-Control: no-cache' 'https://prefettura.interno.gov.it/sites/default/files/97/2026-09/elenco-ditte-richiedenti-iscrizione-negli-elenchi-delle-white-list-aggiornato-all-11.09.2026.pdf?_wl_shape=a1-${GITHUB_RUN_ID}' -o /tmp/applicants.pdf
          test "$(sha256sum /tmp/listed.pdf | cut -d' ' -f1)" = '060c5ddb20b24f733066b59f27aa1ea98a8fdc04d22b0196b90c9e383253b476'
          test "$(sha256sum /tmp/applicants.pdf | cut -d' ' -f1)" = 'd42720c3ebf9c24055371fc42b1de89060604fc98d60861ec72a54e650412ae9'
      - name: Inspect source shape
        run: |
          python scripts/trapani_shape_diagnostic.py listed /tmp/listed.pdf
          python scripts/trapani_shape_diagnostic.py applicants /tmp/applicants.pdf
      - name: Apply exact reviewed applicant continuation handling
        run: |
          python scripts/patch_trapani_applicant_continuations.py
          python -m compileall -q src/white_list_archive/parsers/trapani_tables.py
          git diff --check
      - name: Commit exact applicant continuation handling
        run: |
          if git diff --quiet -- src/white_list_archive/parsers/trapani_tables.py; then
            echo 'No parser change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/white_list_archive/parsers/trapani_tables.py
          git commit -m 'Preserve Trapani applicant continuation evidence'
          git push origin HEAD:expansion/trapani-2026-09-19
