name: Crotone applicant stitch audit 2026-09-11

on:
  push:
    branches: [expansion/crotone-2026-09-11]
    paths: [.github/workflows/crotone-applicant-stitch-audit-2026-09-11.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/crotone-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pdfplumber
      - name: Validate deterministic cross-page stitching
        run: |
          python - <<'PY'
          import hashlib,json,re,time
          from datetime import date
          from pathlib import Path
          from urllib.request import Request,urlopen
          import pdfplumber
          URL='https://prefettura.interno.gov.it/sites/default/files/0/2026-09/ditte-con-richiesta-iscrizione-white-list-2.pdf'
          SHA='af66ff6bf6a173c4156fef3e7741ca26956769e399285764123ef8405097e6d1'
          months={'gennaio':1,'febbraio':2,'marzo':3,'aprile':4,'maggio':5,'giugno':6,'luglio':7,'agosto':8,'settembre':9,'ottobre':10,'novembre':11,'dicembre':12};ma='|'.join(months)
          date_re=re.compile(rf'^(\d{{1,2}})(?:°|º)?\s+({ma})\s+(\d{{4}})$',re.I)
          def clean(x):return ' '.join(str(x or '').split())
          def normdate(v):
            m=date_re.fullmatch(clean(v))
            if not m:return ''
            try:return date(int(m[3]),months[m[2].casefold()],int(m[1])).isoformat()
            except ValueError:return ''
          last=None
          for i in range(5):
            try:
              with urlopen(Request(URL,headers={'User-Agent':'italian-anti-mafia-whitelist/0.1 (+stitch audit)','Accept':'application/pdf,*/*'}),timeout=90) as r:b=r.read();break
            except Exception as e:last=e;time.sleep(3*(i+1))
          else:raise last
          assert hashlib.sha256(b).hexdigest()==SHA
          Path('/tmp/a.pdf').write_bytes(b)
          logical=[]; physical=0; headers=0; continuations=[]; provisional=[]; page_logical_counts=[]
          with pdfplumber.open('/tmp/a.pdf') as pdf:
            assert len(pdf.pages)==46
            for pno,page in enumerate(pdf.pages,1):
              page_rows=[]
              for tno,t in enumerate(page.extract_tables() or [],1):
                for rno,row in enumerate(t or [],1):
                  c=[clean(x) for x in row]
                  if not any(c):continue
                  if len(c)!=6:raise RuntimeError(f'width drift p{pno} r{rno}: {len(c)}')
                  if 'codice fiscale' in c[0].casefold() or c[1].casefold()=='ragione sociale':headers+=1;continue
                  page_rows.append({'page':pno,'table':tno,'row':rno,'cells':c})
              before=len(logical)
              for idx,r in enumerate(page_rows):
                c=r['cells']; iso=normdate(c[5]); is_first=(idx==0)
                if iso and c[0] and c[1]:
                  logical.append({'id':c[0],'name':c[1],'office':c[2],'secondary':c[3],'activities':c[4],'application_raw':c[5],'application_iso':iso,'locators':[f'p{pno}:t{r["table"]}:r{r["row"]}']})
                elif iso and is_first and logical and not logical[-1]['application_iso']:
                  prev=logical[-1]
                  if c[0]:raise RuntimeError(f'completion unexpectedly has id p{pno}: {c!r}')
                  for key,val in zip(('name','office','secondary','activities'),c[1:5]):
                    if val:prev[key]=clean(prev[key]+' '+val)
                  prev['application_raw']=c[5];prev['application_iso']=iso;prev['locators'].append(f'p{pno}:t{r["table"]}:r{r["row"]}')
                  continuations.append({'page':pno,'kind':'completes_previous','cells':c})
                elif not iso and is_first and logical and logical[-1]['application_iso']:
                  # source pagination splits long textual cells onto the next page.
                  if c[0]:raise RuntimeError(f'page continuation unexpectedly has id p{pno}: {c!r}')
                  prev=logical[-1]
                  for key,val in zip(('name','office','secondary','activities'),c[1:5]):
                    if val:prev[key]=clean(prev[key]+' '+val)
                  prev['locators'].append(f'p{pno}:t{r["table"]}:r{r["row"]}')
                  continuations.append({'page':pno,'kind':'continues_previous','cells':c})
                elif not iso and c[0] and c[1] and idx==len(page_rows)-1:
                  # exactly one logical record is split at a page boundary: identity on
                  # the final row, remaining cells/date at the next page's first row.
                  logical.append({'id':c[0],'name':c[1],'office':c[2],'secondary':c[3],'activities':c[4],'application_raw':'','application_iso':'','locators':[f'p{pno}:t{r["table"]}:r{r["row"]}']})
                  provisional.append({'page':pno,'cells':c})
                else:
                  raise RuntimeError(f'unreviewed applicant fragment p{pno} idx{idx}: {c!r}')
                physical+=1
              page_logical_counts.append(len(logical)-before)
          unresolved=[r for r in logical if not r['application_iso']]
          if unresolved:raise RuntimeError(f'unresolved provisional rows: {unresolved!r}')
          keys=[(r['id'].casefold(),r['name'].casefold(),r['office'].casefold(),r['secondary'].casefold(),r['activities'].casefold(),r['application_raw'].casefold()) for r in logical]
          out={'audited_on':'2026-09-11','sha256':SHA,'pages':46,'physical_nonheader_rows':physical,'headers':headers,'logical_records':len(logical),'continuation_fragments':len(continuations),'continuations':continuations,'provisional_rows':provisional,'duplicate_logical_rows':len(keys)-len(set(keys)),'page_net_record_counts':page_logical_counts,'sample_first':logical[:5],'sample_last':logical[-5:]}
          Path('tmp').mkdir(exist_ok=True);Path('tmp/crotone-applicant-stitch-audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n');print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit stitch checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/crotone-applicant-stitch-audit.json
          git commit -m 'Checkpoint Crotone applicant stitching'
          git push origin HEAD:expansion/crotone-2026-09-11
