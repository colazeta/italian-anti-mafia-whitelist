name: Pordenone parser validation

on:
  push:
    branches: [expansion/pordenone-2026-09-20]
    paths:
      - src/white_list_archive/parsers/pordenone_tables.py
      - .github/workflows/pordenone-parser-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check -e . pdfplumber==0.11.7
      - name: Validate content-addressed Pordenone parser boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, tempfile
          from pathlib import Path
          from urllib.request import Request, urlopen
          from white_list_archive.parsers.pordenone_tables import parse_pordenone_applicants, parse_pordenone_listed_bundle

          assets={
            'I':('https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-i-estrazione-fornitura-etc_0.pdf','f4e6374e5e03daa25daedd49ada730ae39c6b77437e763e3c0308aa0a0c627de'),
            'II':('https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-ii-confezionamento-fornitura-etc_0.pdf','62d63a080b3025e2ee2f37c3af1d486f12095be8f83e73cae611e2ca56bf84d5'),
            'III':('https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-iii-noli-a-freddo-di-macchinari.pdf','2204fe651b733e32fe13f001c97fd2c6a93ccd9a846cc9f4ddd40d4f471e6ce9'),
            'IV':('https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-iv-fornitura-di-ferro-lavorato_0.pdf','55a1edd7bcc52de101536c42091e14e040892cf1122462c36b37a861c48eeb62'),
            'V':('https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-v-noli-a-caldo_0.pdf','4fcd95954d20ba19ffcfb11e64a911a637056ba2fd794d47c5d3f19171f77803'),
            'VI':('https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-vi-autotrasporti-per-conto-terzi_1.pdf','62c39abfc260ecacf59b0201867263499643fe5dc36c95500e380fa53deb87aa'),
            'VII':('https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-vii-guardiania-dei-cantieri.pdf','35c5ef5ddb218e50d1f5a56007f2c1886ac73b6a91c5a13fb37e4b7f4952d2c8'),
            'VIII':('https://prefettura.interno.gov.it/sites/default/files/74/2026-08/sez-viii-servizi-funerari-e-cimiteriali.pdf','cac3354a388d87b3f7ee1fef965f7b9968d2fea4dfcbafa776fc175bee5d96b3'),
            'IX':('https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-ix-ristorazione-mense-e-catering.pdf','a3b7c0b749be947692cb6ebb031e21e6c2e61913f34c1ad9f4741f3a7b9e96fa'),
            'X':('https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-x-servizi-ambientali-trasporto-rifiuti-etc_0.pdf','af639b5c55ff31893bfd3906876e0c60e1e6614065efae1e5c7871ac62290c0f'),
            'XI':('https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-xi-elenco-imprese-richiedenti_edit_0.pdf','b8875c9392f9c7273c3c773110d90141eada8aebaa538ae1e3115be27bfdaea1'),
          }
          ua='italian-anti-mafia-whitelist/1.0 parser-validation'
          with tempfile.TemporaryDirectory() as td:
            td=Path(td); paths={}
            for sec,(url,expected) in assets.items():
              with urlopen(Request(url,headers={'User-Agent':ua,'Cache-Control':'no-cache'}),timeout=60) as r: body=r.read()
              digest=hashlib.sha256(body).hexdigest(); assert digest==expected,(sec,digest,expected)
              path=td/f'{sec}.pdf'; path.write_bytes(body); paths[sec]=path
            common={
              'authority_key':'pordenone','authority_name':'Prefettura di Pordenone',
              'reference_date':'2026-09-01','source_page_url':'https://prefettura.interno.gov.it/it/prefetture/pordenone/white-list-elenco-ditte-iscritte',
            }
            listed_cfg={**common,'source_key':'pordenone-provincial-listed','register_key':'pordenone-white-list-listed','register_name':'White List · Prefettura di Pordenone','population_scope':'listed','resource_url':common['source_page_url'],'sha256':'bundle-content-addressed'}
            applicant_cfg={**common,'source_key':'pordenone-provincial-applicants','register_key':'pordenone-white-list-applicants','register_name':'White List richiedenti · Prefettura di Pordenone','population_scope':'applicant','resource_url':assets['XI'][0],'sha256':assets['XI'][1]}
            listed=parse_pordenone_listed_bundle({k:v for k,v in paths.items() if k!='XI'},listed_cfg)
            applicants=parse_pordenone_applicants(paths['XI'],applicant_cfg)
            assert len(listed.records)==401
            assert listed.diagnostics['physical_sector_observations']==595
            assert listed.diagnostics['status_counts']=={'listed':335,'renewal_update_in_progress':65,'other_or_unknown':1}
            assert listed.diagnostics['identifier_coverage']==234
            assert listed.diagnostics['multi_section_groups']==105
            assert listed.diagnostics['identity_groups_with_conflicting_date_or_status']==20
            assert listed.diagnostics['missing_date_fields']==4
            assert listed.diagnostics['date_anomalies']==5
            assert len(applicants.records)==32
            assert applicants.diagnostics['status_counts']=={'pending':31,'renewal_update_in_progress':1}
            assert applicants.diagnostics['identifier_coverage']==32
            assert applicants.diagnostics['date_anomalies']==0
            missing=[r for r in applicants.records if not r['name']]
            assert len(missing)==1,missing
            assert missing[0]['registered_office']=='SEQUALS - VIA CECILIA DANIELI, 7'
            assert missing[0]['identifiers']==['01456650934']
            assert missing[0]['source_status']=='renewal_update_in_progress'
            mg=[r for r in applicants.records if r['identifiers']==['01975030931']]
            assert len(mg)==1 and mg[0]['source_status']=='pending' and mg[0]['application_date']=='2026-01-07',mg
            print('PORDENONE_PARSER_VALID',json.dumps({'listed':listed.diagnostics,'applicants':applicants.diagnostics,'logical_total':len(listed.records)+len(applicants.records)},sort_keys=True))
          PY
