name: Foggia source audit

on:
  push:
    branches:
      - expansion/foggia-2026-09-13
    paths:
      - .github/workflows/foggia-source-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/foggia-2026-09-13
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit runtime
        run: pip install requests beautifulsoup4 openpyxl pdfplumber python-docx
      - name: Verify and profile current Foggia sources
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, io, json, zipfile
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          LANDING = 'https://prefettura.interno.gov.it/it/prefetture/foggia/evidenza/white-list'
          EXPECTED = {
              'listed': {
                  'label': 'White list - Elenco imprese iscritte - Aggiornato al 08-09-2026',
                  'reference_date': '2026-09-08',
              },
              'applicants': {
                  'label': "White list - Elenco imprese richiedenti l'iscrizione - Aggiornato al 10/09/2026",
                  'reference_date': '2026-09-10',
              },
          }
          UA = 'Mozilla/5.0 (compatible; italian-anti-mafia-whitelist-source-audit/1.0)'

          def norm(value: str) -> str:
              return ' '.join((value or '').split())

          def get(url: str) -> requests.Response:
              r = requests.get(url, headers={'User-Agent': UA, 'Accept': '*/*'}, timeout=45)
              r.raise_for_status()
              return r

          landing = get(LANDING)
          soup = BeautifulSoup(landing.text, 'html.parser')
          anchors = []
          expected_cf = [x['label'].casefold() for x in EXPECTED.values()]
          for a in soup.find_all('a', href=True):
              own = norm(a.get_text(' ', strip=True))
              contexts = []
              tr = a.find_parent('tr')
              if tr is not None:
                  contexts.append(norm(tr.get_text(' ', strip=True)))
              cur = a
              for _ in range(5):
                  cur = cur.parent
                  if cur is None:
                      break
                  text = norm(cur.get_text(' ', strip=True))
                  if text and len(text) <= 1600:
                      contexts.append(text)
                  if any(label in text.casefold() for label in expected_cf):
                      break
              context = max(contexts, key=lambda x: (any(label in x.casefold() for label in expected_cf), len(x)), default=own)
              anchors.append({'text': own, 'context': context, 'url': urljoin(LANDING, a['href'])})

          matched = {}
          for pop, expected in EXPECTED.items():
              label = expected['label']
              label_cf = label.casefold()
              by_url = {}
              for item in anchors:
                  signal = f"{item['text']} {item['context']}".casefold()
                  if label_cf in signal:
                      by_url[item['url']] = item
              candidates = list(by_url.values())
              if len(candidates) != 1:
                  interesting = [
                      x for x in anchors
                      if any(token in f"{x['text']} {x['context']} {x['url']}".casefold()
                             for token in ('elenco', 'fornitor', 'richiedent', '.pdf', '.xlsx', '.docx', '/files/', '/media/'))
                  ]
                  raise SystemExit(
                      f'fail-closed: expected exactly one {pop} attachment for {label!r}; '
                      f'candidates={candidates!r}; interesting={interesting[:40]!r}'
                  )
              item = candidates[0]
              matched[pop] = {
                  'text': label,
                  'reference_date': expected['reference_date'],
                  'url': item['url'],
                  'html_anchor_text': item['text'],
                  'html_context': item['context'],
              }

          def profile_bytes(raw: bytes) -> dict:
              p = {'size_bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}
              if raw.startswith(b'%PDF'):
                  import pdfplumber
                  p['format'] = 'pdf'
                  with pdfplumber.open(io.BytesIO(raw)) as pdf:
                      p['page_count'] = len(pdf.pages)
                      sample = []
                      for i in range(min(3, len(pdf.pages))):
                          sample.append((pdf.pages[i].extract_text() or '')[:5000])
                      p['sample_text'] = sample
              elif raw.startswith(b'PK'):
                  z = zipfile.ZipFile(io.BytesIO(raw))
                  names = set(z.namelist())
                  if 'xl/workbook.xml' in names:
                      import openpyxl
                      p['format'] = 'xlsx'
                      wb = openpyxl.load_workbook(io.BytesIO(raw), data_only=False, read_only=False)
                      sheets = []
                      for ws in wb.worksheets:
                          formulas = 0
                          nonempty = 0
                          preview = []
                          for row in ws.iter_rows():
                              vals=[]
                              for c in row:
                                  if c.value is not None:
                                      nonempty += 1
                                      if isinstance(c.value, str) and c.value.startswith('='):
                                          formulas += 1
                                  vals.append(c.value)
                              if any(v is not None for v in vals) and len(preview) < 20:
                                  preview.append(vals[:15])
                          sheets.append({'title': ws.title, 'max_row': ws.max_row, 'max_column': ws.max_column, 'nonempty_cells': nonempty, 'formula_cells': formulas, 'preview_rows': preview})
                      p['sheets'] = sheets
                  elif 'word/document.xml' in names:
                      from docx import Document
                      p['format'] = 'docx'
                      d = Document(io.BytesIO(raw))
                      p['paragraph_count'] = len(d.paragraphs)
                      p['table_count'] = len(d.tables)
                      p['sample_paragraphs'] = [x.text for x in d.paragraphs[:20]]
                      tbls=[]
                      for ti,t in enumerate(d.tables[:5]):
                          rows=[]
                          for row in t.rows[:20]:
                              rows.append([c.text for c in row.cells])
                          tbls.append({'index':ti,'rows':len(t.rows),'cols':len(t.columns),'preview_rows':rows})
                      p['tables']=tbls
                  else:
                      p['format'] = 'zip-other'
                      p['zip_names_sample'] = sorted(names)[:50]
              else:
                  p['format'] = 'unknown'
                  p['head_hex'] = raw[:32].hex()
              return p

          out = {
              'authority_key': 'foggia',
              'landing_page': LANDING,
              'landing_http_status': landing.status_code,
              'landing_sha256': hashlib.sha256(landing.content).hexdigest(),
              'sources': {},
          }
          for pop, item in matched.items():
              first = get(item['url'])
              second = get(item['url'])
              if first.content != second.content:
                  raise SystemExit(f'fail-closed: repeated independent GETs differ for {pop}')
              prof = profile_bytes(first.content)
              prof.update({
                  'population': pop,
                  'official_link_label': item['text'],
                  'reference_date': item['reference_date'],
                  'html_anchor_text': item['html_anchor_text'],
                  'html_context': item['html_context'],
                  'url': item['url'],
                  'http_status_first': first.status_code,
                  'http_status_second': second.status_code,
                  'repeat_fetch_byte_identical': True,
                  'content_type': first.headers.get('content-type'),
                  'content_disposition': first.headers.get('content-disposition'),
              })
              out['sources'][pop] = prof

          Path('tmp').mkdir(exist_ok=True)
          Path('tmp/foggia_source_profile.json').write_text(json.dumps(out, ensure_ascii=False, indent=2, default=str) + '\n', encoding='utf-8')
          print(json.dumps(out, ensure_ascii=False, indent=2, default=str))
          PY
      - name: Commit audit checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/foggia_source_profile.json
          if git diff --cached --quiet; then
            echo 'No audit checkpoint change.'
          else
            git commit -m 'Checkpoint Foggia official source profile'
            git push origin HEAD:expansion/foggia-2026-09-13
          fi
