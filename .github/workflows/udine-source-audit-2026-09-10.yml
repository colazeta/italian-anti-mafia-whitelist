name: Udine source audit 2026-09-10

on:
  push:
    branches: [expansion/udine-2026-09-10]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Deep-profile byte-pinned Udine PDFs
        shell: bash
        run: |
          python -m pip install -q pdfplumber
          python - <<'PY'
          import hashlib, json, re, tempfile
          from collections import Counter
          from urllib.request import Request, urlopen
          import pdfplumber

          SOURCES={
            'applicants':('https://prefettura.interno.gov.it/sites/default/files/13/2026-09/elenco-dei-fornitori-che-hanno-chiesto-di-essere-iscritti_0.pdf','4ea03173171bda5df4a3abba120feae3842506f436f28f5c0604099388523971'),
            'listed':('https://prefettura.interno.gov.it/sites/default/files/13/2026-09/elenco-ditte-iscritte-nelle-white-list_0.pdf','0bd74200cbe5d96b313f943a889acbfe1fe6278293516a76ad0702e28b293fba'),
          }
          ID11=re.compile(r'(?<!\d)\d{11}(?!\d)')
          ID16=re.compile(r'\b[A-Z0-9]{16}\b')
          DATE=re.compile(r'\b\d{2}/\d{2}/\d{4}\b')
          def get(url):
              req=Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelistArchive/1.0; deep-source-audit)'})
              with urlopen(req,timeout=90) as r:return r.read()
          def clean(v):return ' '.join(str(v or '').replace('\u00a0',' ').split())
          for key,(url,expected) in SOURCES.items():
              data=get(url); sha=hashlib.sha256(data).hexdigest(); assert sha==expected,(key,sha)
              with tempfile.NamedTemporaryFile(suffix='.pdf') as f:
                  f.write(data);f.flush()
                  with pdfplumber.open(f.name) as pdf:
                      profile=[]; all_ids=[]; all_dates=[]; updates=[]; section_pages={}
                      for pno,page in enumerate(pdf.pages,1):
                          text=page.extract_text(x_tolerance=2,y_tolerance=2) or ''
                          ids=ID11.findall(text)+ID16.findall(text.upper())
                          dates=DATE.findall(text)
                          upd=len(re.findall(r'In\s+aggiornamento',text,re.I))
                          secs=[]
                          for m in re.finditer(r'Sezione\s+([IVXLCDM]+|\d+)',text,re.I):
                              s=m.group(1).upper()
                              if s not in secs:secs.append(s)
                          profile.append({'page':pno,'ids':len(ids),'dates':len(dates),'updates':upd,'sections':secs,'lines':len(text.splitlines())})
                          all_ids.extend((pno,x) for x in ids);all_dates.extend((pno,x) for x in dates);updates.extend([pno]*upd)
                          for s in secs:section_pages.setdefault(s,[]).append(pno)
                      print(key.upper()+'_PROFILE='+json.dumps(profile,ensure_ascii=False))
                      print(key.upper()+'_TOTAL_IDS='+str(len(all_ids)))
                      print(key.upper()+'_UNIQUE_IDS='+str(len(set(v for _,v in all_ids))))
                      print(key.upper()+'_TOTAL_DATES='+str(len(all_dates)))
                      print(key.upper()+'_UPDATE_MARKERS='+str(len(updates)))
                      print(key.upper()+'_SECTION_PAGES='+json.dumps(section_pages,ensure_ascii=False,sort_keys=True))
                      print(key.upper()+'_DUPLICATE_IDS='+json.dumps(Counter(v for _,v in all_ids).most_common(30),ensure_ascii=False))
                      sample_pages=sorted(set([1,2,len(pdf.pages),20 if len(pdf.pages)>=20 else 1,62 if len(pdf.pages)>=62 else 1]))
                      for pno in sample_pages:
                          page=pdf.pages[pno-1]
                          words=page.extract_words(x_tolerance=1,y_tolerance=2,keep_blank_chars=False,use_text_flow=False)
                          anchors=[]
                          for w in words:
                              t=w['text'].strip().upper()
                              if ID11.fullmatch(t) or ID16.fullmatch(t) or DATE.fullmatch(t) or t in {'IN','AGGIORNAMENTO'}:
                                  anchors.append({'text':w['text'],'x0':round(w['x0'],1),'x1':round(w['x1'],1),'top':round(w['top'],1),'bottom':round(w['bottom'],1)})
                          print(f'{key.upper()}_PAGE_{pno}_ANCHORS='+json.dumps(anchors,ensure_ascii=False))
                          lines=(page.extract_text(x_tolerance=2,y_tolerance=2) or '').splitlines()
                          print(f'{key.upper()}_PAGE_{pno}_LINES='+json.dumps(lines[:20]+(['...'] if len(lines)>40 else [])+lines[-20:],ensure_ascii=False))
          PY
