name: Udine geometry audit v2 2026-09-10

on:
  push:
    branches: [expansion/udine-2026-09-10]

permissions:
  contents: write

jobs:
  audit:
    if: github.event.head_commit.message != 'Persist Udine geometry audit v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/udine-2026-09-10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Audit exact Udine row geometry
        shell: bash
        run: |
          python -m pip install -q pdfplumber beautifulsoup4
          python - <<'PY'
          import hashlib, json, re, tempfile
          from pathlib import Path
          from urllib.request import Request, urlopen
          import pdfplumber

          SOURCES={
            'listed':('https://prefettura.interno.gov.it/sites/default/files/13/2026-09/elenco-ditte-iscritte-nelle-white-list_0.pdf','0bd74200cbe5d96b313f943a889acbfe1fe6278293516a76ad0702e28b293fba'),
            'applicants':('https://prefettura.interno.gov.it/sites/default/files/13/2026-09/elenco-dei-fornitori-che-hanno-chiesto-di-essere-iscritti_0.pdf','4ea03173171bda5df4a3abba120feae3842506f436f28f5c0604099388523971'),
          }
          H={'User-Agent':'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelistArchive/1.0; udine-geometry-audit-v2)'}
          def fetch(url):
              with urlopen(Request(url,headers=H),timeout=90) as r: return r.read()
          def centre(w): return (float(w['x0'])+float(w['x1']))/2
          def cluster(vals,tol=3.2):
              groups=[]
              for v in sorted(vals):
                  if not groups or v-groups[-1][-1]>tol: groups.append([v])
                  else: groups[-1].append(v)
              return [sum(g)/len(g) for g in groups]
          def strict_id(t): return bool(re.fullmatch(r'(?:\d{11}|[A-Z0-9]{16})',t.upper()))
          def dateish(t): return bool(re.fullmatch(r'\d{1,3}/\d{1,2}/\d{2,4}',t))
          def compact_words(words,y0,y1):
              out=[]
              for w in words:
                  if y0<=float(w['top'])<y1:
                      out.append({'t':w['text'],'x0':round(float(w['x0']),1),'x1':round(float(w['x1']),1),'cx':round(centre(w),1),'top':round(float(w['top']),1)})
              return sorted(out,key=lambda z:(z['top'],z['x0']))
          report={}
          for kind,(url,expected) in SOURCES.items():
              data=fetch(url); assert hashlib.sha256(data).hexdigest()==expected
              with tempfile.NamedTemporaryFile(suffix='.pdf') as f:
                  f.write(data); f.flush()
                  with pdfplumber.open(f.name) as pdf:
                      kr={'sha256':expected,'pages':len(pdf.pages),'page_counts':[],'total_anchors':0,'samples':{},'section_headings':[],'anomalies':[]}
                      current_section=None
                      for pno,page in enumerate(pdf.pages,1):
                          words=page.extract_words(x_tolerance=1,y_tolerance=2,keep_blank_chars=False,use_text_flow=False)
                          # Candidate company anchors: exact identifiers in the identifier region plus date-like values in the date region.
                          if kind=='listed':
                              ids=[float(w['top']) for w in words if 470<=centre(w)<610 and (strict_id(w['text']) or re.fullmatch(r'\d{12}',w['text']))]
                              dates=[float(w['top']) for w in words if 585<=centre(w)<760 and dateish(w['text'])]
                          else:
                              ids=[float(w['top']) for w in words if 430<=centre(w)<620 and strict_id(w['text'])]
                              dates=[float(w['top']) for w in words if 680<=centre(w)<835 and dateish(w['text'])]
                          anchors=cluster(ids+dates)
                          # Drop obvious document-note/footer anchors by requiring a strict identifier near the same y OR, for listed only, a date plus left-column company text.
                          kept=[]
                          for y in anchors:
                              near_id=[w for w in words if abs(float(w['top'])-y)<=3.5 and strict_id(w['text']) and 430<=centre(w)<620]
                              left=' '.join(w['text'] for w in words if abs(float(w['top'])-y)<=4.0 and centre(w)<470)
                              if near_id or (kind=='listed' and any(abs(float(w['top'])-y)<=3.5 and dateish(w['text']) for w in words) and left.strip()): kept.append(y)
                          anchors=cluster(kept)
                          kr['page_counts'].append(len(anchors)); kr['total_anchors']+=len(anchors)
                          # Section headings and assignment context for listed.
                          headings=[]
                          if kind=='listed':
                              for w in words:
                                  if w['text'].casefold()=='sezione':
                                      peers=[q for q in words if float(q['x0'])>float(w['x1']) and float(q['x0'])<float(w['x1'])+100 and abs(float(q['top'])-float(w['top']))<=3]
                                      for q in sorted(peers,key=lambda z:float(z['x0'])):
                                          t=q['text'].upper().strip('.,:')
                                          if re.fullmatch(r'(?:I|II|III|IV|V|VI|VII|VIII|IX|X)',t): headings.append((float(w['top']),t)); kr['section_headings'].append({'page':pno,'top':round(float(w['top']),1),'section':t}); break
                          for idx,y in enumerate(anchors):
                              if kind=='listed':
                                  prior=[h for h in headings if h[0]<y]
                                  if prior: current_section=prior[-1][1]
                              nexty=anchors[idx+1] if idx+1<len(anchors) else min(float(page.height)-18,y+38)
                              top=y-3.5; bottom=max(y+7,min(nexty-0.6,y+38))
                              ws=compact_words(words,top,bottom)
                              ids_row=[x['t'] for x in ws if strict_id(x['t']) or (kind=='listed' and re.fullmatch(r'\d{12}',x['t']))]
                              date_tokens=[x['t'] for x in ws if dateish(x['t'])]
                              rowtext=' '.join(x['t'] for x in ws)
                              anomaly=False
                              if kind=='listed':
                                  if len(ids_row)!=1 or len(date_tokens)!=2: anomaly=True
                              else:
                                  if len(ids_row)!=1 or len(date_tokens)!=1: anomaly=True
                              if anomaly:
                                  kr['anomalies'].append({'page':pno,'row':idx+1,'y':round(y,1),'section':current_section,'ids':ids_row,'dates':date_tokens,'words':ws})
                          if pno in ({1,11,31,54,64} if kind=='listed' else {1,2}):
                              kr['samples'][str(pno)]={
                                  'header_words':compact_words(words,70,150),
                                  'rows':[{'y':round(y,1),'words':compact_words(words,y-3.5,(anchors[i+1]-0.6 if i+1<len(anchors) else min(float(page.height)-18,y+38)))} for i,y in enumerate(anchors[:3])]
                              }
                      report[kind]=kr
          Path('tmp/udine-geometry-v2.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({k:{'pages':v['pages'],'page_counts':v['page_counts'],'total_anchors':v['total_anchors'],'section_headings':v['section_headings'],'anomaly_count':len(v['anomalies']),'anomalies':v['anomalies'][:20]} for k,v in report.items()},ensure_ascii=False))
          PY
      - name: Commit compact geometry report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/udine-geometry-v2.json
          git diff --cached --check
          git commit -m 'Persist Udine geometry audit v2'
          git push origin HEAD:expansion/udine-2026-09-10
