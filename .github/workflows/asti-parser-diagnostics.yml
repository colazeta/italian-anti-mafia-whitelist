name: Asti parser validation

on:
  push:
    branches:
      - expansion/asti-2026-09-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser runtime
        run: python -m pip install -e '.[publication]'
      - name: Validate pinned Asti sources and parser output
        shell: python
        run: |
          import hashlib
          import json
          import urllib.request
          from pathlib import Path

          from white_list_archive.parsers.asti_positioned import parse_applicants, parse_listed

          headers = {'User-Agent':'italian-anti-mafia-whitelist/0.1 (+source validation)','Accept':'*/*'}
          sources = {
              'listed': (
                  'https://prefettura.interno.gov.it/sites/default/files/26/2026-09/ditte-iscritte.pdf',
                  '8c26313c57588745e92600961e7071d4ff2246ab86555e39500f17f59c41c128',
              ),
              'applicants': (
                  'https://prefettura.interno.gov.it/sites/default/files/26/2026-09/ditte_in_istruttoria.pdf',
                  'ae5d69a85541dae61ffd67f4983a78831f2a97d096bd752aeb8b93c9a88943a5',
              ),
          }
          for label,(url,sha) in sources.items():
              body=urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=90).read()
              actual=hashlib.sha256(body).hexdigest()
              assert actual==sha,(label,actual)
              Path(f'/tmp/asti-{label}.pdf').write_bytes(body)

          common = {
              'authority_key':'asti','authority_name':'Prefettura di Asti',
              'register_key':'asti-ordinary','register_name':'White List ordinaria',
              'reference_date':'2026-09-03',
              'source_page_url':'https://prefettura.interno.gov.it/it/prefetture/asti/white-list-provinciali',
          }
          listed_cfg={**common,'source_key':'asti-listed','population_scope':'listed','resource_url':sources['listed'][0],'sha256':sources['listed'][1]}
          applicants_cfg={**common,'source_key':'asti-applicants','population_scope':'applicant','resource_url':sources['applicants'][0],'sha256':sources['applicants'][1]}
          listed=parse_listed(Path('/tmp/asti-listed.pdf'),listed_cfg)
          applicants=parse_applicants(Path('/tmp/asti-applicants.pdf'),applicants_cfg)

          assert listed.diagnostics['sector_rows']==521, listed.diagnostics
          assert listed.diagnostics['pending_source_exceptions']==1, listed.diagnostics
          assert listed.diagnostics['dropped_date_rows']==0
          assert applicants.diagnostics['public_records']==17, applicants.diagnostics
          assert applicants.diagnostics['missing_application_dates']==2, applicants.diagnostics
          assert applicants.diagnostics['status_counts']=={'other_or_unknown':1,'listed':4,'pending':12}, applicants.diagnostics
          assert applicants.diagnostics['dropped_date_rows']==0
          ceit=[r for r in listed.records if r['name']=='CEIT SRL' and r['source_status']=='pending']
          assert len(ceit)==1 and not ceit[0]['observed_listing_date'], ceit
          jokko=[r for r in applicants.records if r['name'].startswith('JOKKO')]
          assert len(jokko)==1 and jokko[0]['identifier_field_raw']=='0141215742' and not jokko[0]['identifiers'], jokko
          print(json.dumps({'listed':listed.diagnostics,'applicants':applicants.diagnostics},ensure_ascii=False,indent=2))
