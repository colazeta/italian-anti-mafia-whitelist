name: Asti parser geometry diagnostics

on:
  push:
    branches:
      - expansion/asti-2026-09-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pdfplumber>=0.11,<0.12'
      - name: Inspect official Asti PDF geometry
        shell: python
        run: |
          import hashlib, re, urllib.request
          from collections import Counter
          from pathlib import Path
          import pdfplumber

          UA = {'User-Agent':'italian-anti-mafia-whitelist/0.1 (+source audit)','Accept':'*/*'}
          sources = {
            'listed': ('https://prefettura.interno.gov.it/sites/default/files/26/2026-09/ditte-iscritte.pdf','8c26313c57588745e92600961e7071d4ff2246ab86555e39500f17f59c41c128',39),
            'applicants': ('https://prefettura.interno.gov.it/sites/default/files/26/2026-09/ditte_in_istruttoria.pdf','ae5d69a85541dae61ffd67f4983a78831f2a97d096bd752aeb8b93c9a88943a5',6),
          }
          date_re = re.compile(r'^\d{1,2}[./]\d{1,2}[./]\d{4}$')
          id_re = re.compile(r'^[A-Z0-9]{8,16}$', re.I)
          for label,(url,expected_sha,expected_pages) in sources.items():
            req=urllib.request.Request(url,headers=UA)
            body=urllib.request.urlopen(req,timeout=90).read()
            actual=hashlib.sha256(body).hexdigest()
            assert actual==expected_sha,(label,actual)
            path=Path(f'/tmp/{label}.pdf'); path.write_bytes(body)
            with pdfplumber.open(path) as pdf:
              assert len(pdf.pages)==expected_pages,(label,len(pdf.pages))
              print(f'=== {label} sha={actual} pages={len(pdf.pages)} ===')
              xdates=Counter(); xtokens=Counter(); page_summaries=[]
              reps={1,2,3,8,20,34,39} if label=='listed' else {1,2,6}
              for pno,page in enumerate(pdf.pages,1):
                words=page.extract_words(x_tolerance=2,y_tolerance=2,keep_blank_chars=False)
                dates=[w for w in words if date_re.match(w['text'].strip())]
                ids=[w for w in words if id_re.match(w['text'].strip()) and any(c.isdigit() for c in w['text'])]
                tables=page.extract_tables() or []
                widths=[max((len(r or []) for r in (t or [])),default=0) for t in tables]
                for w in dates: xdates[round(w['x0']/10)*10]+=1
                for w in words: xtokens[round(w['x0']/10)*10]+=1
                page_summaries.append((pno,len(dates),len(ids),len(tables),widths))
                if pno in reps:
                  print(f'-- PAGE {pno} size={page.width:.1f}x{page.height:.1f} dates={len(dates)} tables={len(tables)} widths={widths}')
                  head=[w for w in words if w['top'] < 190]
                  print('HEAD',[(w['text'],round(w['x0'],1),round(w['x1'],1),round(w['top'],1)) for w in head[:120]])
                  print('DATES',[(w['text'],round(w['x0'],1),round(w['top'],1)) for w in dates[:40]])
                  print('IDS',[(w['text'],round(w['x0'],1),round(w['top'],1)) for w in ids[:40]])
                  print('LINES',[(round(x.get('x0',0),1),round(x.get('x1',0),1),round(x.get('top',0),1),round(x.get('bottom',0),1)) for x in (page.lines or [])[:80]])
                  if tables:
                    for ti,t in enumerate(tables[:2]):
                      print('TABLE',ti,'ROWS',len(t),'FIRST',t[:8])
              print('XDATE_CLUSTERS',xdates.most_common())
              print('PAGE_SUMMARIES',page_summaries)
