name: Como integration checkpoint

on:
  workflow_dispatch:
  push:
    branches:
      - expansion/como-2026-09-17
    paths:
      - .github/workflows/como-integration-checkpoint.yml
      - tmp/como_apply_integration.py

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile exact canonical base
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "9e80b9e5db283cf077cdf7870a05bb75c324bf89"
          git merge-base --is-ancestor origin/main HEAD
      - name: Install full repository test and publication runtime
        run: |
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends poppler-utils; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[dev,database,storage,publication]'
      - name: Materialise Como production integration
        run: python tmp/como_apply_integration.py
      - name: Run Como semantic tests
        run: pytest -q tests/test_como_parser_semantics.py
      - name: Run repository tests
        run: pytest -q
      - name: Build and validate candidate national boundary
        id: national
        run: |
          rm -rf /tmp/como-national-work /tmp/como-public /tmp/como-national-build.log
          mkdir -p /tmp/como-public/data
          set +e
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/como-national-work \
            --registry-json /tmp/como-public/data/registry.json \
            --registry-csv /tmp/como-public/data/registry.csv \
            --prefectures-json /tmp/como-public/data/prefectures.json \
            --prefectures-csv /tmp/como-public/data/prefectures.csv \
            2>&1 | tee /tmp/como-national-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -Fq 'potenza-combined: expected 1034 source rows, got 1035' /tmp/como-national-build.log; then
              echo 'external_blocker=potenza-source-drift' >> "$GITHUB_OUTPUT"
              echo 'National build is blocked by independently observed Potenza source drift; preserving the scoped Como checkpoint without treating Potenza as Como evidence.' >&2
              exit 0
            fi
            exit "$status"
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/como-public/data')
          reg = json.loads((root / 'registry.json').read_text(encoding='utf-8'))
          pref = json.loads((root / 'prefectures.json').read_text(encoding='utf-8'))
          assert reg['meta']['record_count'] == 58378, reg['meta']
          assert reg['meta']['authority_count'] == 49, reg['meta']
          assert reg['meta']['register_count'] == 51, reg['meta']
          assert len(reg['records']) == 58378
          rows = [r for r in reg['records'] if r['authority_key'] == 'como']
          assert len(rows) == 409
          assert sum(r['source_key'] == 'como-listed' for r in rows) == 391
          assert sum(r['source_key'] == 'como-applicants' for r in rows) == 18
          assert sum(r['source_status'] == 'listed' for r in rows) == 359
          assert sum(r['source_status'] == 'renewal_update_in_progress' for r in rows) == 32
          assert sum(r['source_status'] == 'pending' for r in rows) == 18
          assert sum(bool(r['identifiers']) for r in rows) == 405
          assert len({r['record_locator'] for r in rows}) == 409
          como = [p for p in pref['prefectures'] if p['authority_key'] == 'como']
          assert len(como) == 1 and como[0]['mapped'] and como[0]['published'] and como[0]['series_count'] == 2
          assert pref['meta']['published_count'] == 49, pref['meta']
          assert pref['meta']['mapped_count'] == 49, pref['meta']
          print(json.dumps({'registry': reg['meta'], 'como': como[0]}, ensure_ascii=False, indent=2))
          PY
      - name: Checkpoint only scoped permanent integration
        run: |
          git status --short
          allowed='^(data/catalog.csv|data/monitoring/national_coverage.json|data/publication/multi_prefecture_pilot.json|data/source_registry/source_series_inventory.csv|data/source_registry/verified_primary_pages.csv|src/white_list_archive/publishing/public_national_registry.py|tests/test_source_population_coverage.py|tests/test_source_registry.py)$'
          unexpected="$(git status --short | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected integration mutations:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git add data/catalog.csv \
                  data/monitoring/national_coverage.json \
                  data/publication/multi_prefecture_pilot.json \
                  data/source_registry/source_series_inventory.csv \
                  data/source_registry/verified_primary_pages.csv \
                  src/white_list_archive/publishing/public_national_registry.py \
                  tests/test_source_population_coverage.py \
                  tests/test_source_registry.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate Como current White List populations'
          git push origin HEAD:expansion/como-2026-09-17
      - name: Preserve external national-build blocker state
        if: steps.national.outputs.external_blocker == 'potenza-source-drift'
        run: |
          echo 'Scoped Como integration was checkpointed, but national validation remains blocked by Potenza source drift (1034 -> 1035 source rows).' >&2
          exit 1
