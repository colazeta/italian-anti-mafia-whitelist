name: Potenza source drift finalisation v2

on:
  push:
    branches:
      - fix/potenza-source-drift-2026-09-17
    paths:
      - '.github/workflows/potenza-finalise-v2.yml'

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install complete validation runtime
        run: python -m pip install -e '.[dev,database,storage,publication]'
      - name: Apply and validate reviewed Potenza transition
        run: |
          python tmp/potenza_finalise.py
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/sources/potenza-operational-check-2026-09-15.md')
          p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          node --check tests/public_portal_browser.cjs
          python -m pytest -q
      - name: Commit permanent Potenza transition
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/publication/multi_prefecture_pilot.json \
            data/monitoring/national_coverage.json \
            data/source_registry/source_series_inventory.csv \
            docs/sources/potenza-operational-check-2026-09-15.md \
            .github/workflows/public-pages.yml \
            tests/public_portal_browser.cjs
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git diff --cached --check
          git commit -m 'data(potenza): approve 17 September source transition'
          git push origin HEAD:fix/potenza-source-drift-2026-09-17
