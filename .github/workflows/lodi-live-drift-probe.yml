name: Lodi source transition temporary

on:
  push:
    branches:
      - fix/lodi-source-drift-2026-09-18
    paths:
      - .github/workflows/lodi-live-drift-probe.yml

permissions:
  contents: write

jobs:
  transition:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Confirm branch is based on current main
        run: |
          git fetch origin main
          test "$(git rev-list --count HEAD..origin/main)" -eq 0
      - name: Install validation runtime
        run: python -m pip install -e '.[dev]'
      - name: Apply and validate reviewed transition
        run: python scripts/lodi_transition_temp.py
      - name: Update frozen test denominators to reviewed source boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_lodi_parser_semantics.py')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('        "listed": 254,\n        "renewal_update_in_progress": 37,', '        "listed": 251,\n        "renewal_update_in_progress": 40,'),
              ('        "listed": 146,\n        "renewal_update_in_progress": 23,', '        "listed": 144,\n        "renewal_update_in_progress": 25,'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one frozen test block: {old!r}; got {s.count(old)}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Run focused repository gates
        run: pytest -q tests/test_lodi_parser_semantics.py tests/test_source_registry.py tests/test_source_population_coverage.py
      - name: Commit permanent transition only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/monitoring/national_coverage.json data/publication/multi_prefecture_pilot.json data/source_registry/source_series_inventory.csv docs/sources/lodi-operational-check-2026-09-18.md src/white_list_archive/parsers/lodi_sheets.py tests/test_lodi_parser_semantics.py
          git diff --cached --check
          git commit -m 'Approve 18 September Lodi source transition'
          git push origin HEAD:fix/lodi-source-drift-2026-09-18
