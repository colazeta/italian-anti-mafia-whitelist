name: Lodi live drift probe

on:
  push:
    branches:
      - fix/lodi-source-drift-2026-09-18

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch two independent current Lodi exports
        run: |
          python - <<'PY'
          import hashlib, json, time
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode
          from urllib.request import Request, urlopen

          cfg = json.loads(Path('data/publication/multi_prefecture_pilot.json').read_text())
          sources = {s['source_key']: s for s in cfg['sources'] if s.get('authority_key') == 'lodi'}
          expected_keys = {'lodi-listed', 'lodi-applicants'}
          if set(sources) != expected_keys:
              raise SystemExit(f'Lodi source-key drift: {set(sources)!r}')
          out = Path('artifacts/lodi-drift-current')
          out.mkdir(parents=True, exist_ok=True)

          def cache_bust(url, token):
              parts = urlsplit(url)
              q = parse_qsl(parts.query, keep_blank_values=True)
              q.append(('wl_probe', token))
              return urlunsplit((parts.scheme, parts.netloc, parts.path, urlencode(q), parts.fragment))

          def fetch(url, token):
              req = Request(cache_bust(url, token), headers={
                  'User-Agent':'italian-anti-mafia-whitelist/1.0 (+source-verification)',
                  'Cache-Control':'no-cache', 'Pragma':'no-cache'})
              with urlopen(req, timeout=60) as resp:
                  return resp.read()

          summary = {}
          for key in sorted(expected_keys):
              source = sources[key]
              a = fetch(source['resource_url'], '20260918-A')
              time.sleep(3)
              b = fetch(source['resource_url'], '20260918-B')
              ha = hashlib.sha256(a).hexdigest(); hb = hashlib.sha256(b).hexdigest()
              identical = a == b and ha == hb
              print(f'{key}: approved_sha={source["sha256"]} live_sha_a={ha} live_sha_b={hb} size_a={len(a)} size_b={len(b)} byte_identical={identical}')
              (out / f'{key}-1.csv').write_bytes(a)
              (out / f'{key}-2.csv').write_bytes(b)
              summary[key] = {
                  'approved_sha256': source['sha256'],
                  'live_sha256': ha,
                  'size': len(a),
                  'independent_captures_identical': identical,
              }
              if not identical:
                  raise SystemExit(f'{key}: independent live captures disagree')
          (out / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          PY
      - name: Upload exact current source evidence
        uses: actions/upload-artifact@v4
        with:
          name: lodi-source-drift-2026-09-18
          path: artifacts/lodi-drift-current/*
          if-no-files-found: error
          retention-days: 7
