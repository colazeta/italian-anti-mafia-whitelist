name: Torino source validation

on:
  push:
    branches:
      - expansion/torino-2026-09-15
    paths:
      - src/white_list_archive/parsers/torino_tables.py
      - tests/test_torino_parser_semantics.py
      - docs/sources/torino-operational-check-2026-09-15.md
      - .github/workflows/torino-source-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime
        run: |
          python -m pip install -e .[dev,database,storage]
          python -m pip install beautifulsoup4

      - name: Verify official sources and parse frozen populations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          from collections import Counter
          from pathlib import Path
          from urllib.parse import urljoin
          import hashlib
          import time

          import requests
          from bs4 import BeautifulSoup

          from white_list_archive.parsers.torino_tables import (
              _APPLICANT_BYTES,
              _APPLICANT_RECORDS,
              _APPLICANT_SHA256,
              _EXPECTED_APPLICANT_IDENTIFIER_COVERAGE,
              _EXPECTED_APPLICANT_STATUS_COUNTS,
              _EXPECTED_LISTED_IDENTIFIER_COVERAGE,
              _EXPECTED_LISTED_STATUS_COUNTS,
              _LISTED_BYTES,
              _LISTED_RECORDS,
              _LISTED_SHA256,
              _REFERENCE_DATE,
              parse_torino_applicants,
              parse_torino_listed,
          )

          PAGE = 'https://prefettura.interno.gov.it/it/prefetture/torino/evidenza/white-list'
          LISTED_URL = 'https://prefettura.interno.gov.it/sites/default/files/90/2026-09/w.l-11.09.2026.pdf'
          APPLICANT_URL = 'https://prefettura.interno.gov.it/sites/default/files/90/2026-09/w.l-11.09.2026-i.pdf'
          OUT = Path('/tmp/torino-validation')
          OUT.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/pdf;q=0.9,*/*;q=0.8',
          })

          def get(url: str) -> bytes:
              response = session.get(url, timeout=60, allow_redirects=True)
              print(f'GET {url} -> {response.status_code} {len(response.content)} bytes final={response.url}')
              response.raise_for_status()
              return response.content

          landing_a = get(PAGE)
          time.sleep(1)
          landing_b = get(PAGE)
          if landing_a != landing_b:
              raise RuntimeError('Torino official landing changed between independent GETs')
          soup = BeautifulSoup(landing_a, 'html.parser')
          links = {
              ' '.join(a.get_text(' ', strip=True).split()): urljoin(PAGE, a['href'])
              for a in soup.find_all('a', href=True)
          }
          expected_links = {
              'White List provinciale': LISTED_URL,
              'Elenco imprese richiedenti iscrizione': APPLICANT_URL,
          }
          for label, expected in expected_links.items():
              actual = links.get(label)
              print(f'{label}: {actual}')
              if actual != expected:
                  raise RuntimeError(f'Torino official population link drift for {label!r}: {actual!r}')

          paths = {}
          for role, url, expected_hash, expected_bytes in (
              ('listed', LISTED_URL, _LISTED_SHA256, _LISTED_BYTES),
              ('applicants', APPLICANT_URL, _APPLICANT_SHA256, _APPLICANT_BYTES),
          ):
              first = get(url)
              time.sleep(1)
              second = get(url)
              if first != second:
                  raise RuntimeError(f'Torino {role} resource changed between independent GETs')
              digest = hashlib.sha256(first).hexdigest()
              if digest != expected_hash or len(first) != expected_bytes:
                  raise RuntimeError(
                      f'Torino {role} byte identity drift: sha={digest} bytes={len(first)}'
                  )
              path = OUT / f'{role}.pdf'
              path.write_bytes(first)
              paths[role] = path

          common = {
              'authority_key': 'torino',
              'authority_name': 'Prefettura - Ufficio Territoriale del Governo di Torino',
              'register_key': 'torino-white-list',
              'register_name': 'White List provinciale - Prefettura di Torino',
              'reference_date': _REFERENCE_DATE,
              'source_page_url': PAGE,
          }
          listed_cfg = common | {
              'source_key': 'torino-listed',
              'population_scope': 'listed',
              'resource_url': LISTED_URL,
              'sha256': _LISTED_SHA256,
          }
          applicant_cfg = common | {
              'source_key': 'torino-applicants',
              'population_scope': 'applicant',
              'resource_url': APPLICANT_URL,
              'sha256': _APPLICANT_SHA256,
          }
          listed = parse_torino_listed(paths['listed'], listed_cfg)
          applicants = parse_torino_applicants(paths['applicants'], applicant_cfg)

          if len(listed.records) != _LISTED_RECORDS or len(applicants.records) != _APPLICANT_RECORDS:
              raise RuntimeError('Torino parser record denominator drift')
          if listed.diagnostics['status_counts'] != _EXPECTED_LISTED_STATUS_COUNTS:
              raise RuntimeError('Torino listed status denominator drift')
          if applicants.diagnostics['status_counts'] != _EXPECTED_APPLICANT_STATUS_COUNTS:
              raise RuntimeError('Torino applicant status denominator drift')
          if listed.diagnostics['identifier_coverage'] != _EXPECTED_LISTED_IDENTIFIER_COVERAGE:
              raise RuntimeError('Torino listed identifier coverage drift')
          if applicants.diagnostics['identifier_coverage'] != _EXPECTED_APPLICANT_IDENTIFIER_COVERAGE:
              raise RuntimeError('Torino applicant identifier coverage drift')

          records = listed.records + applicants.records
          if len(records) != 1663:
              raise RuntimeError(f'Torino combined denominator drift: {len(records)}')
          locators = [record['record_locator'] for record in records]
          if len(set(locators)) != 1663:
              raise RuntimeError('Torino record locator uniqueness drift')
          statuses = Counter(record['source_status'] for record in records)
          expected_statuses = Counter({
              'listed': 1237,
              'renewal_update_in_progress': 264,
              'pending': 162,
          })
          if statuses != expected_statuses:
              raise RuntimeError(f'Torino combined status drift: {dict(statuses)!r}')
          print('TORINO_VALIDATED_RECORDS=1663')
          print('TORINO_STATUS_COUNTS=', dict(statuses))
          print('TORINO_LISTED_IDENTIFIER_COVERAGE=', listed.diagnostics['identifier_coverage'])
          print('TORINO_APPLICANT_IDENTIFIER_COVERAGE=', applicants.diagnostics['identifier_coverage'])
          print('TORINO_REFERENCE_DATE=', _REFERENCE_DATE)
          PY

      - name: Run Torino semantic regressions
        run: pytest -q tests/test_torino_parser_semantics.py

      - name: Run full repository tests
        run: pytest -q
