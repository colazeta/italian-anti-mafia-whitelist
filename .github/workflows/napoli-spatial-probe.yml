name: Napoli spatial probe

on:
  push:
    branches:
      - 'expansion/napoli-2026-09-13'
    paths:
      - '.github/workflows/napoli-spatial-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install parser runtime
        run: python -m pip install -e '.[publication]'
      - name: Reconstruct Napoli rows from spatial word anchors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/napoli_spatial_probe
          curl --fail --location --silent --show-error --retry 2 --retry-all-errors \
            --user-agent 'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelist/1.0; +https://github.com/colazeta/italian-anti-mafia-whitelist)' \
            -o tmp/napoli_spatial_probe/listed.pdf \
            'https://prefettura.interno.gov.it/sites/default/files/79/2026-09/whitelistprefnapoli_11_settembre_26.pdf'
          curl --fail --location --silent --show-error --retry 2 --retry-all-errors \
            --user-agent 'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelist/1.0; +https://github.com/colazeta/italian-anti-mafia-whitelist)' \
            -o tmp/napoli_spatial_probe/applicants.pdf \
            'https://prefettura.interno.gov.it/sites/default/files/79/2026-09/ditterichiedenti_wl_11_settembre_26.pdf'
          echo '93a8635c0bd9b00587f9cc60c52752061bd239a7c16cb34b64a11e495a0ab4be  tmp/napoli_spatial_probe/listed.pdf' | sha256sum -c -
          echo '053be2500b07a7da536c344aede12084dde9b7cf28b4717af99764cbd05e7e6b  tmp/napoli_spatial_probe/applicants.pdf' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import json, math, re
          import pdfplumber

          root=Path('tmp/napoli_spatial_probe')
          specs={'listed':(60,2259,9),'applicants':(215,2571,8)}
          selected={'listed':{1,1620,1735,1775,1816,1890,1965,2004,2074,2157,2239,2259},'applicants':{1,511,512,513,2571}}

          def clean(s): return re.sub(r'\s+',' ',s or '').strip()
          def cell_ranges(table,width):
              for row in table.rows:
                  cells=row.cells
                  if len(cells)==width and all(c is not None for c in cells):
                      return [(float(c[0]),float(c[2])) for c in cells]
              raise RuntimeError('no full-width row geometry')
          def col_for(word,ranges):
              x=(float(word['x0'])+float(word['x1']))/2
              for i,(a,b) in enumerate(ranges):
                  if a-0.5 <= x <= b+0.5: return i
              return None
          def join_words(words):
              if not words: return ''
              lines=[]
              for w in sorted(words,key=lambda q:(q['top'],q['x0'])):
                  y=float(w['top'])
                  if not lines or abs(y-lines[-1][0])>2.5:
                      lines.append([y,[w]])
                  else: lines[-1][1].append(w)
              return clean(' '.join(' '.join(x['text'] for x in sorted(ws,key=lambda q:q['x0'])) for _,ws in lines))

          report={}
          for src,(pages,terminal,width) in specs.items():
              reconstructed=[]; page_anchor_counts=[]
              with pdfplumber.open(root/f'{src}.pdf') as pdf:
                  if len(pdf.pages)!=pages: raise RuntimeError('page drift')
                  expected_next=1
                  for pn,page in enumerate(pdf.pages,start=1):
                      tables=page.find_tables()
                      if len(tables)!=1: raise RuntimeError(f'{src} table count p{pn}: {len(tables)}')
                      table=tables[0]; ranges=cell_ranges(table,width)
                      words=page.extract_words(x_tolerance=1,y_tolerance=2,keep_blank_chars=False)
                      anchors=[]
                      for w in words:
                          c=col_for(w,ranges)
                          t=clean(w['text'])
                          if c==0 and re.fullmatch(r'\d{1,4}',t):
                              n=int(t)
                              if 1<=n<=terminal:
                                  anchors.append((n,(float(w['top'])+float(w['bottom']))/2,w))
                      anchors.sort(key=lambda x:x[1])
                      page_anchor_counts.append(len(anchors))
                      if not anchors: raise RuntimeError(f'{src} no anchors p{pn}')
                      nums=[a[0] for a in anchors]
                      if nums != list(range(expected_next, expected_next+len(nums))):
                          raise RuntimeError(f'{src} anchor sequence p{pn}: {nums[:3]}..{nums[-3:]} expected {expected_next}')
                      expected_next += len(nums)
                      centers=[a[1] for a in anchors]
                      gaps=[b-a for a,b in zip(centers,centers[1:]) if b>a]
                      typical=sorted(gaps)[len(gaps)//2] if gaps else 30.0
                      top_limit=max(table.bbox[1], centers[0]-0.80*typical)
                      bottom_limit=min(table.bbox[3], centers[-1]+0.80*typical)
                      bins=[[] for _ in anchors]
                      for w in words:
                          c=col_for(w,ranges)
                          if c is None or c==0: continue
                          yc=(float(w['top'])+float(w['bottom']))/2
                          if yc < top_limit or yc > bottom_limit: continue
                          idx=min(range(len(centers)), key=lambda i:abs(yc-centers[i]))
                          bins[idx].append((c,w))
                      for (n,y,_),bucket in zip(anchors,bins):
                          cells=[str(n)]
                          for c in range(1,width):
                              cells.append(join_words([w for col,w in bucket if col==c]))
                          reconstructed.append({'ordinal':n,'page':pn,'anchor_y':round(y,2),'cells':cells})
              if [r['ordinal'] for r in reconstructed] != list(range(1,terminal+1)):
                  raise RuntimeError(f'{src} reconstructed ordinal drift')
              blanks={}
              labels=['ordinal','company','office','secondary','identifier','activities','primary_date'] + (['secondary_date','outcome'] if src=='listed' else ['outcome'])
              for i,label in enumerate(labels[1:],start=1):
                  blanks[label]=sum(not r['cells'][i] for r in reconstructed)
              report[src]={
                  'records':len(reconstructed),
                  'page_anchor_counts':page_anchor_counts,
                  'blank_counts':blanks,
                  'selected_rows':[r for r in reconstructed if r['ordinal'] in selected[src]],
                  'identifier_shape_counts':dict(Counter('11_digit' if re.fullmatch(r'\d{11}',r['cells'][4]) else '16_alnum' if re.fullmatch(r'[A-Za-z]{6}[0-9A-Za-z]{10}',r['cells'][4]) else 'other' for r in reconstructed)),
                  'outcome_nonblank':sum(bool(r['cells'][-1]) for r in reconstructed),
              }
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY
