name: Lecco production finaliser (temporary)
# Triggered only after the validated national candidate commit.

on:
  push:
    branches:
      - expansion/lecco-2026-09-15
    paths:
      - .github/workflows/lecco-finalize-nonworkflow.yml

permissions:
  contents: write

concurrency:
  group: lecco-production-finaliser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply reviewed permanent Lecco gate/documentation edits
        run: |
          python - <<'PY'
          from pathlib import Path

          browser_path = Path('tests/public_portal_browser.cjs')
          browser = browser_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          browser = replace_once(
              browser,
              "      assert.ok(labels.includes('White List — Prefettura di Catanzaro · Prefettura di Catanzaro'));\n",
              "      assert.ok(labels.includes('White List — Prefettura di Catanzaro · Prefettura di Catanzaro'));\n"
              "      assert.ok(labels.includes('White List — Prefettura di Lecco · Prefettura di Lecco'));\n",
              'Lecco register label',
          )
          browser = replace_once(
              browser,
              '      assert.equal(stats.total,48135);\n',
              '      assert.equal(stats.total,48391);\n',
              'national browser denominator',
          )
          browser = replace_once(
              browser,
              "'roma','pisa','catanzaro'].includes(r.authority_key));",
              "'roma','pisa','catanzaro','lecco'].includes(r.authority_key));",
              'pre-expansion baseline exclusion',
          )
          anchor = "      assert.equal(catanzaro.filter(r=>r.source_key==='catanzaro-applicants'&&r.source_fields?.application_date_raw==='1/8/12/2025'&&r.application_date==='').length,1);\n"
          lecco_block = anchor + """      const lecco=registry.records.filter(r=>r.authority_key==='lecco');
      assert.equal(lecco.length,256);
      assert.equal(lecco.filter(r=>r.source_key==='lecco-listed').length,230);
      assert.equal(lecco.filter(r=>r.source_key==='lecco-applicants').length,26);
      assert.deepEqual(statusCounts(lecco),{listed:201,pending:22,rejected_or_denied:4,renewal_update_in_progress:29});
      assert.equal(new Set(lecco.map(r=>r.record_locator)).size,256);
      assert.equal(lecco.filter(r=>r.source_key==='lecco-listed'&&r.identifiers.length>0).length,228);
      assert.equal(lecco.filter(r=>r.source_key==='lecco-applicants'&&r.identifiers.length>0).length,26);
      const termoidraulica=lecco.filter(r=>r.source_key==='lecco-listed'&&r.name==='Termoidraulica');
      assert.equal(termoidraulica.length,1);
      assert.equal(termoidraulica[0].identifier_field_raw,'035180050137');
      assert.deepEqual(termoidraulica[0].identifiers,[]);
      assert.deepEqual(termoidraulica[0].requested_activities,[]);
      const edilnord=lecco.filter(r=>r.source_key==='lecco-applicants'&&r.identifier_field_raw==='01882770132');
      assert.equal(edilnord.length,3);
      assert.deepEqual(edilnord.map(r=>r.application_date).sort(),['2013-12-12','2016-01-29','2017-04-18']);
"""
          browser = replace_once(browser, anchor, lecco_block, 'Lecco browser invariants anchor')
          browser_path.write_text(browser, encoding='utf-8')

          note_path = Path('docs/sources/lecco-operational-check-2026-09-15.md')
          note = note_path.read_text(encoding='utf-8')
          note = replace_once(
              note,
              "Source activity labels are preserved as printed, including unusual source typography such as `Sez. XIII`; no section correction is inferred.\n",
              "Source activity labels are preserved as printed, including unusual source typography such as `Sez. XIII`; no section correction is inferred. Source-geometry review confirms that the activity cell for `Termoidraulica` is genuinely blank: `requested_activities` is therefore preserved as an empty list, with no activity borrowed from neighbouring rows. The parser remains fail-closed for any other blank activity cell not covered by this byte-pinned reviewed exception.\n",
              'Termoidraulica evidence note',
          )
          note = replace_once(
              note,
              "At this checkpoint source verification and parser work are in progress on `expansion/lecco-2026-09-15`. National canonical/public integration is not yet validated. `canonical_integration_validated` and `durable_evidence_verified` therefore remain false; durable evidence infrastructure continues to be governed separately under issue #16.\n",
              "The actual national candidate build and its fail-closed denominator checks completed successfully on `expansion/lecco-2026-09-15`: 48,391 national observations, 43 published Prefectures, 44 registers and 47 mapped Prefectures, including exactly 256 Lecco observations with 256 distinct record locators. The production integration transaction was committed only after the full repository tests, Lecco semantic tests, actual national build, Lecco denominator checks and exact production-diff recheck succeeded. `canonical_integration_validated` is therefore true for this candidate integration. `durable_evidence_verified` remains false: no separate immutable evidence archive is inferred from successful live retrieval, and durable evidence infrastructure continues to be governed separately under issue #16.\n",
              'integration state',
          )
          note_path.write_text(note, encoding='utf-8')
          PY
      - name: Validate exact finaliser diff
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = $'docs/sources/lecco-operational-check-2026-09-15.md\ntests/public_portal_browser.cjs'
      - name: Commit reviewed non-workflow finalisation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/sources/lecco-operational-check-2026-09-15.md tests/public_portal_browser.cjs
          git commit -m 'test(lecco): promote validated public integration gates'
          git push origin HEAD:expansion/lecco-2026-09-15
