name: Viterbo parser reconnaissance 2026-09-20

on:
  push:
    branches:
      - expansion/viterbo-2026-09-20
    paths:
      - .github/workflows/viterbo-parser-recon-2026-09-20.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viterbo-parser-recon-2026-09-20
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/viterbo-2026-09-20
          fetch-depth: 0
      - name: Install PDF tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Capture exact sources and extract layout text
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          curl --fail --location --retry 3 --header 'Cache-Control: no-cache' --user-agent 'Mozilla/5.0' -o /tmp/viterbo-listed.pdf 'https://prefettura.interno.gov.it/sites/default/files/87/2026-09/iscritte_4.pdf'
          curl --fail --location --retry 3 --header 'Cache-Control: no-cache' --user-agent 'Mozilla/5.0' -o /tmp/viterbo-applicants.pdf 'https://prefettura.interno.gov.it/sites/default/files/87/2026-09/richiedenti_4.pdf'
          echo 'ee6bdb1f9020689ae4e24d91397cdf07e7bf17999a85f4f2620eb127541f2e78  /tmp/viterbo-listed.pdf' | sha256sum -c -
          echo 'a0a2280f4c4352e29997ab3b5b532500f1a7d5eb57b5e44f82a62515ac66a545  /tmp/viterbo-applicants.pdf' | sha256sum -c -
          pdfinfo /tmp/viterbo-listed.pdf > tmp/viterbo-listed.pdfinfo.txt
          pdfinfo /tmp/viterbo-applicants.pdf > tmp/viterbo-applicants.pdfinfo.txt
          pdftotext -layout /tmp/viterbo-listed.pdf tmp/viterbo-listed.txt
          pdftotext -layout /tmp/viterbo-applicants.pdf tmp/viterbo-applicants.txt
          wc -l -c tmp/viterbo-*.txt
          sed -n '1,100p' tmp/viterbo-listed.txt
          sed -n '1,100p' tmp/viterbo-applicants.txt
      - name: Commit temporary parser reconnaissance
        run: |
          set -euo pipefail
          git add tmp/viterbo-listed.txt tmp/viterbo-applicants.txt tmp/viterbo-listed.pdfinfo.txt tmp/viterbo-applicants.pdfinfo.txt
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Checkpoint Viterbo parser reconnaissance'
          git push origin HEAD:expansion/viterbo-2026-09-20
