name: Macerata finalizer line-ending repair

on:
  push:
    branches:
      - expansion/macerata-2026-09-19
    paths:
      - .github/workflows/macerata-fix-finalizer-line-endings.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/macerata-2026-09-19
          fetch-depth: 0

      - name: Verify repair scope
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "d4f65a5bc106db17ff934a8dc4f2424540b74942"
          test "$(git rev-list --count HEAD..origin/main)" = "0"
          python - <<'PY'
          import subprocess
          files = set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'], text=True).splitlines())
          expected = {
              '.github/workflows/macerata-source-probe.yml',
              '.github/workflows/macerata-finalize-2026-09-19.yml',
              '.github/workflows/macerata-fix-finalizer-line-endings.yml',
              'docs/sources/macerata-operational-check-2026-09-19.md',
              'src/white_list_archive/parsers/macerata_tables.py',
              'tests/test_macerata_parser_semantics.py',
          }
          if files != expected:
              raise SystemExit(f'unexpected repair scope: {sorted(files)}')
          PY

      - name: Preserve LF in generated CSV and remove repair helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/macerata-finalize-2026-09-19.yml')
          text = path.read_text(encoding='utf-8')
          old = "writer = csv.DictWriter(handle, fieldnames=fieldnames)"
          new = "writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator='\\n')"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one DictWriter target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/macerata-fix-finalizer-line-endings.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/macerata-finalize-2026-09-19.yml
          git commit -m 'Preserve LF in Macerata finalizer CSV output'
          git push origin HEAD:expansion/macerata-2026-09-19
