name: Grosseto finalizer scope fix 2026-09-19

on:
  push:
    branches:
      - expansion/grosseto-2026-09-19
    paths:
      - .github/workflows/grosseto-finalizer-scope-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct finalizer scope matcher only
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "expansion/grosseto-2026-09-19"
          git fetch origin main
          test "$(git rev-list --count HEAD..origin/main)" = "0"
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/grosseto-integration-finalizer.yml')
          text=p.read_text(encoding='utf-8')
          old="grep -Ev '^(\\.github/workflows/grosseto-|tmp/grosseto-|src/white_list_archive/parsers/grosseto_openxml.py|tests/test_grosseto_parser_semantics.py)$'"
          new="grep -Ev '^(\\.github/workflows/grosseto-.*|tmp/grosseto-.*|src/white_list_archive/parsers/grosseto_openxml.py|tests/test_grosseto_parser_semantics.py)$'"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one matcher anchor, found {text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
          git diff -- .github/workflows/grosseto-integration-finalizer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/grosseto-integration-finalizer.yml
          git commit -m 'Fix Grosseto finalizer scope matcher'
          git push origin HEAD:expansion/grosseto-2026-09-19
