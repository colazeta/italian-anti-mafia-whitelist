name: Frosinone parser validation

on:
  push:
    branches:
      - expansion/frosinone-2026-09-13
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser runtime
        run: python -m pip install --disable-pip-version-check -e . requests pdfplumber

      - name: Validate fail-closed parsers against byte-pinned sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          import requests

          from white_list_archive.parsers.frosinone_tables import (
              parse_frosinone_applicants,
              parse_frosinone_listed,
          )

          LANDING = "https://prefettura.interno.gov.it/it/prefetture/frosinone/evidenza/white-list"
          SOURCE_DEFS = {
              "listed": {
                  "source_key": "frosinone-listed",
                  "population_scope": "listed",
                  "url": "https://prefettura.interno.gov.it/sites/default/files/9/2026-09/elenco-societa-iscritte-white-list-al-2-settembre-2026-aggiornato.pdf",
                  "sha256": "aad166b49393055a197b9b1fef4eba82d0a70453a90d84209f967180d2855d71",
              },
              "applicants": {
                  "source_key": "frosinone-applicants",
                  "population_scope": "applicant",
                  "url": "https://prefettura.interno.gov.it/sites/default/files/9/2026-09/elenco-ric-iscr-white-list-aggiornato-al-2-settembre-2026-ordine-alfabetico-ok.pdf",
                  "sha256": "9906d55864f4c1dc8e027efa2b44fa2c6463c512fb34241a32aa9b21a5ba6db8",
              },
          }
          headers = {
              "User-Agent": "Mozilla/5.0 whitelist-archive-frosinone-parser-validation/1.0",
              "Accept": "application/pdf,*/*;q=0.8",
              "Referer": LANDING,
          }

          def capture(key: str, definition: dict) -> tuple[Path, dict]:
              response = requests.get(definition["url"], headers=headers, timeout=(20, 120))
              response.raise_for_status()
              body = response.content
              digest = hashlib.sha256(body).hexdigest()
              if digest != definition["sha256"]:
                  raise RuntimeError(f"{key} SHA drift: {digest} != {definition['sha256']}")
              path = Path(f"tmp/frosinone_{key}_validation.pdf")
              path.write_bytes(body)
              cfg = {
                  "source_key": definition["source_key"],
                  "authority_key": "frosinone",
                  "authority_name": "Prefettura di Frosinone",
                  "register_key": "frosinone-white-list",
                  "register_name": "White List - Prefettura di Frosinone",
                  "population_scope": definition["population_scope"],
                  "reference_date": "2026-09-02",
                  "source_page_url": LANDING,
                  "resource_url": definition["url"],
                  "sha256": definition["sha256"],
              }
              return path, cfg

          listed_path, listed_cfg = capture("listed", SOURCE_DEFS["listed"])
          applicant_path, applicant_cfg = capture("applicants", SOURCE_DEFS["applicants"])
          listed = parse_frosinone_listed(listed_path, listed_cfg)
          applicants = parse_frosinone_applicants(applicant_path, applicant_cfg)

          assert len(listed.records) == 761, len(listed.records)
          assert listed.diagnostics["status_counts"] == {"listed": 529, "renewal_update_in_progress": 232}
          assert listed.diagnostics["identifier_coverage"] == 737
          assert listed.diagnostics["raw_identifier_only"] == 24
          assert listed.diagnostics["continuation_fragments_joined"] == 44
          assert listed.diagnostics["reviewed_malformed_dates"] == 8
          assert listed.diagnostics["blank_sections"] == 3

          assert len(applicants.records) == 475, len(applicants.records)
          assert applicants.diagnostics["status_counts"] == {"pending": 475}
          assert applicants.diagnostics["identifier_coverage"] == 473
          assert applicants.diagnostics["raw_identifier_only"] == 2
          assert applicants.diagnostics["continuation_fragments_joined"] == 5
          assert applicants.diagnostics["reviewed_identity_continuations"] == 1
          assert applicants.diagnostics["reviewed_malformed_dates"] == 2
          assert applicants.diagnostics["blank_sections"] == 0

          statuses = Counter(record["source_status"] for record in listed.records + applicants.records)
          assert statuses == Counter({"listed": 529, "renewal_update_in_progress": 232, "pending": 475}), statuses

          # Source anomalies remain evidence rather than inferred corrections.
          malformed_listed = {
              record["name"]: (
                  record["source_fields"]["listing_date_raw"],
                  record["source_fields"]["expiry_date_raw"],
                  record["observed_listing_date"],
                  record["observed_expiry_date"],
              )
              for record in listed.records
              if record["source_fields"]["listing_date_raw"] in {"30/07/*2026", "12/15/2025", "1 6 / 1 0/2025"}
              or record["source_fields"]["expiry_date_raw"] in {"27/0/2024", "224/02/2027", "24/02/20270", "11/15/2026", "14/02/2025CO S.MO"}
          }
          assert len(malformed_listed) == 7
          for _name, values in malformed_listed.items():
              raw_listing, raw_expiry, parsed_listing, parsed_expiry = values
              if raw_listing in {"30/07/*2026", "12/15/2025", "1 6 / 1 0/2025"}:
                  assert parsed_listing == ""
              if raw_expiry in {"27/0/2024", "224/02/2027", "24/02/20270", "11/15/2026", "14/02/2025CO S.MO"}:
                  assert parsed_expiry == ""

          draghetto = next(record for record in applicants.records if record["name"] == "DRAGHETTO S.R.L.")
          joy = next(record for record in applicants.records if record["name"] == "JOY S.R.L.")
          assert draghetto["source_fields"]["application_date_raw"] == "06/08/2025s" and draghetto["application_date"] == ""
          assert joy["source_fields"]["application_date_raw"] == "13/05/206" and joy["application_date"] == ""

          pagliaroli = next(
              record for record in applicants.records
              if record["name"] == "PAGLIAROLI LORENZO – IMPRESA INDIVIDUALE"
          )
          assert pagliaroli["identifiers"] == ["03332660608", "PGLLNZ94D01I838U"], pagliaroli["identifiers"]
          assert any(
              fragment["source_locator"] == "p29:t1:r1"
              for fragment in pagliaroli["source_fields"]["continuation_fragments"]
          )

          blank_outcome = [record for record in applicants.records if not record["outcome_raw"]]
          assert len(blank_outcome) == 4
          assert all(record["source_status"] == "pending" for record in blank_outcome)

          report = {
              "authority_key": "frosinone",
              "source_reference_date": "2026-09-02",
              "capture_sha256": {
                  "listed": SOURCE_DEFS["listed"]["sha256"],
                  "applicants": SOURCE_DEFS["applicants"]["sha256"],
              },
              "listed": listed.diagnostics,
              "applicants": applicants.diagnostics,
              "combined_public_records": len(listed.records) + len(applicants.records),
              "combined_status_counts": dict(statuses),
              "validation": "passed",
          }
          Path("tmp/frosinone_parser_validation.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY

      - name: Checkpoint parser validation
        shell: bash
        run: |
          set -euo pipefail
          rm -f tmp/frosinone_listed_validation.pdf tmp/frosinone_applicants_validation.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/frosinone_parser_validation.json
          if git diff --cached --quiet; then
            echo "No parser-validation change to checkpoint."
            exit 0
          fi
          git commit -m "Checkpoint Frosinone parser validation"
          git push
