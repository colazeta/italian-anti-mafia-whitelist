name: Viterbo production parser validation 2026-09-20

on:
  push:
    branches:
      - expansion/viterbo-2026-09-20
    paths:
      - src/white_list_archive/parsers/viterbo_pages.py
      - .github/workflows/viterbo-parser-validation-2026-09-20.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viterbo-parser-validation-2026-09-20
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/viterbo-2026-09-20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install parser runtime
        run: python -m pip install -e '.[publication]'
      - name: Validate exact pinned Viterbo sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          from white_list_archive.parsers.viterbo_pages import parse_applicants, parse_listed

          specs = {
              'listed': {
                  'url': 'https://prefettura.interno.gov.it/sites/default/files/87/2026-09/iscritte_4.pdf',
                  'sha256': 'ee6bdb1f9020689ae4e24d91397cdf07e7bf17999a85f4f2620eb127541f2e78',
                  'parser': parse_listed,
                  'source_key': 'viterbo-listed',
                  'population_scope': 'listed',
              },
              'applicants': {
                  'url': 'https://prefettura.interno.gov.it/sites/default/files/87/2026-09/richiedenti_4.pdf',
                  'sha256': 'a0a2280f4c4352e29997ab3b5b532500f1a7d5eb57b5e44f82a62515ac66a545',
                  'parser': parse_applicants,
                  'source_key': 'viterbo-applicants',
                  'population_scope': 'applicant',
              },
          }
          receipt = {}
          for kind, spec in specs.items():
              path = Path(f'/tmp/viterbo-{kind}.pdf')
              request = urllib.request.Request(spec['url'], headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
              body = urllib.request.urlopen(request, timeout=30).read()
              actual = hashlib.sha256(body).hexdigest()
              if actual != spec['sha256']:
                  raise RuntimeError(f'{kind} capture drift: {actual}')
              path.write_bytes(body)
              cfg = {
                  'source_key': spec['source_key'],
                  'authority_key': 'viterbo',
                  'authority_name': 'Prefettura - U.T.G. di Viterbo',
                  'register_key': 'viterbo-ordinary',
                  'register_name': 'White List Viterbo',
                  'population_scope': spec['population_scope'],
                  'reference_date': '2026-09-20',
                  'source_page_url': 'https://prefettura.interno.gov.it/it/prefetture/viterbo/elenco-imprese-richiedenti-iscrizione-elenco-imprese-iscritte',
                  'resource_url': spec['url'],
                  'sha256': spec['sha256'],
              }
              batch = spec['parser'](path, cfg)
              if len({r['record_locator'] for r in batch.records}) != len(batch.records):
                  raise RuntimeError(f'{kind}: record-locator collision')
              if any(r['capture_sha256'] != spec['sha256'] for r in batch.records):
                  raise RuntimeError(f'{kind}: capture identity drift')
              receipt[kind] = batch.diagnostics
          assert receipt['listed']['public_records'] == 237
          assert receipt['listed']['identifier_coverage'] == 235
          assert receipt['listed']['status_counts'] == {'listed': 190, 'renewal_update_in_progress': 47}
          assert receipt['listed']['malformed_identifier_values'] == ['0226497056', 'BNMGLC74C265C773P']
          assert receipt['applicants']['public_records'] == 23
          assert receipt['applicants']['identifier_coverage'] == 23
          assert receipt['applicants']['status_counts'] == {'pending': 23}
          assert sum(x['public_records'] for x in receipt.values()) == 260
          Path('tmp/viterbo-production-parser-validation.json').write_text(json.dumps(receipt, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(receipt, ensure_ascii=False, indent=2))
          PY
      - name: Commit parser validation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git add tmp/viterbo-production-parser-validation.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Checkpoint Viterbo production parser validation'
          git push origin HEAD:expansion/viterbo-2026-09-20
