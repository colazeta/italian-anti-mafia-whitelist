name: Torino source diagnostic

on:
  push:
    branches:
      - expansion/torino-2026-09-15
    paths:
      - .github/workflows/torino-source-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install inspection runtime
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install requests beautifulsoup4

      - name: Verify current official landing and inspect resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/torino-source
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import pathlib
          import subprocess
          import time
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          PAGE = 'https://prefettura.interno.gov.it/it/prefetture/torino/evidenza/white-list'
          LISTED_URL = 'https://prefettura.interno.gov.it/sites/default/files/90/2026-09/w.l-11.09.2026.pdf'
          APPLICANT_URL = 'https://prefettura.interno.gov.it/sites/default/files/90/2026-09/w.l-11.09.2026-i.pdf'
          OUT = pathlib.Path('/tmp/torino-source')

          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/pdf;q=0.9,*/*;q=0.8',
          })

          def get(url: str) -> bytes:
              response = s.get(url, timeout=60, allow_redirects=True)
              print(f'GET {url} -> {response.status_code} {len(response.content)} bytes final={response.url}')
              response.raise_for_status()
              return response.content

          page_a = get(PAGE)
          time.sleep(1)
          page_b = get(PAGE)
          if page_a != page_b:
              raise SystemExit('Torino official landing changed between two independent GETs')

          soup = BeautifulSoup(page_a, 'html.parser')
          links = {
              ' '.join(a.get_text(' ', strip=True).split()): urljoin(PAGE, a['href'])
              for a in soup.find_all('a', href=True)
          }
          print('Official resource links:')
          for label in ('White List provinciale', 'Elenco imprese richiedenti iscrizione'):
              print(f'  {label!r}: {links.get(label)!r}')
          if links.get('White List provinciale') != LISTED_URL:
              raise SystemExit('Torino listed population is not positively identified by the expected current official label/link')
          if links.get('Elenco imprese richiedenti iscrizione') != APPLICANT_URL:
              raise SystemExit('Torino applicant population is not positively identified by the expected current official label/link')

          for role, url in [('listed', LISTED_URL), ('applicants', APPLICANT_URL)]:
              first = get(url)
              time.sleep(1)
              second = get(url)
              if first != second:
                  raise SystemExit(f'Torino {role} resource changed between two independent GETs')
              digest = hashlib.sha256(first).hexdigest()
              path = OUT / f'{role}.pdf'
              path.write_bytes(first)
              info = subprocess.check_output(['pdfinfo', str(path)], text=True, errors='replace')
              pages = next((line.split(':',1)[1].strip() for line in info.splitlines() if line.startswith('Pages:')), '?')
              print(f'TORINO_{role.upper()}_SHA256={digest}')
              print(f'TORINO_{role.upper()}_BYTES={len(first)}')
              print(f'TORINO_{role.upper()}_PAGES={pages}')
              subprocess.run(['pdftotext', '-layout', str(path), str(OUT / f'{role}.txt')], check=True)

          for role in ('listed', 'applicants'):
              lines = (OUT / f'{role}.txt').read_text(encoding='utf-8', errors='replace').splitlines()
              nonempty = [line.rstrip() for line in lines if line.strip()]
              print(f'===== {role.upper()} FIRST 180 NONEMPTY LINES =====')
              for line in nonempty[:180]:
                  print(line)
              print(f'===== {role.upper()} LAST 80 NONEMPTY LINES =====')
              for line in nonempty[-80:]:
                  print(line)
          PY
