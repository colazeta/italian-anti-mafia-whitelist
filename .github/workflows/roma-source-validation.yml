name: Roma source validation

on:
  push:
    branches:
      - expansion/roma-2026-09-15
    paths:
      - '.github/workflows/roma-source-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install inspection runtime
        run: python -m pip install --disable-pip-version-check requests pdfplumber
      - name: Inspect first-page vertical geometry
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import requests, pdfplumber

          sources={
            'listed':('https://prefettura.interno.gov.it/sites/default/files/57/2026-09/elenco-imprese-iscritte-alla-white-list-aggiornato-alla-data-di-pubblicazione.pdf','8a2bbdb210757a8e7bf1da74db4bd7440c4fc45b3198b09e225c0aee2e6ef4af'),
            'applicants':('https://prefettura.interno.gov.it/sites/default/files/57/2026-09/elenco-imprese-richiedenti-iscrizione-alla-white-list-aggiornato-alla-data-di-pubblicazione.pdf','9bf34641f92b7480492646f0ab442b47305438a06547e1739dafd324c2b1b32a')}
          s=requests.Session();s.headers['User-Agent']='italian-anti-mafia-whitelist/0.1 (+Roma geometry)'
          for key,(url,expected) in sources.items():
            r=s.get(url,timeout=40);r.raise_for_status();body=r.content
            assert hashlib.sha256(body).hexdigest()==expected
            p=Path('/tmp')/(key+'.pdf');p.write_bytes(body)
            with pdfplumber.open(p) as pdf:
              words=pdf.pages[0].extract_words(x_tolerance=1,y_tolerance=2,keep_blank_chars=False,use_text_flow=False)
            # print every positioned token from the table-heading/first-company transition only
            selected=[w for w in words if 250 <= float(w['top']) <= 380]
            selected.sort(key=lambda w:(float(w['top']),float(w['x0'])))
            for w in selected:
              print('GEOM',key,json.dumps({'top':round(float(w['top']),3),'bottom':round(float(w['bottom']),3),'x0':round(float(w['x0']),3),'x1':round(float(w['x1']),3),'text':str(w['text'])},ensure_ascii=False))
          PY
