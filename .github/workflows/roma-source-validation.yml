name: Roma source validation

on:
  push:
    branches:
      - expansion/roma-2026-09-15
    paths:
      - '.github/workflows/roma-source-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install bounded inspection runtime
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 pdfplumber
      - name: Resolve, recapture and inspect positioned Roma publications
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          import time
          from collections import Counter, defaultdict
          from pathlib import Path
          from urllib.parse import urljoin

          import pdfplumber
          import requests
          from bs4 import BeautifulSoup

          UA = 'italian-anti-mafia-whitelist/0.1 (+bounded source validation)'
          SOURCES = {
              'roma-listed': 'https://prefettura.interno.gov.it/it/prefetture/roma/white-list-elenco-imprese-iscritte',
              'roma-applicants': 'https://prefettura.interno.gov.it/it/prefetture/roma/white-list-elenco-imprese-richiedenti-iscrizione',
          }
          EXPECTED_SHA = {
              'roma-listed': '8a2bbdb210757a8e7bf1da74db4bd7440c4fc45b3198b09e225c0aee2e6ef4af',
              'roma-applicants': '9bf34641f92b7480492646f0ab442b47305438a06547e1739dafd324c2b1b32a',
          }
          session = requests.Session()
          session.headers.update({'User-Agent': UA, 'Accept': 'text/html,application/pdf,*/*'})

          def get(url: str) -> requests.Response:
              last = None
              for attempt in range(3):
                  try:
                      r = session.get(url, timeout=35)
                      r.raise_for_status()
                      return r
                  except Exception as exc:
                      last = exc
                      if attempt < 2:
                          time.sleep(2 * (attempt + 1))
              raise RuntimeError(f'bounded GET failed for {url}: {last}')

          def lines(page):
              grouped = defaultdict(list)
              for w in page.extract_words(x_tolerance=1, y_tolerance=2, keep_blank_chars=False):
                  grouped[round(float(w['top']), 1)].append(w)
              out = []
              for top, words in sorted(grouped.items()):
                  words.sort(key=lambda w: float(w['x0']))
                  out.append({
                      'top': top,
                      'text': ' '.join(str(w['text']) for w in words),
                      'words': [{'x0': round(float(w['x0']),1), 'text': str(w['text'])} for w in words],
                  })
              return out

          summary = {}
          for key, page_url in SOURCES.items():
              page = get(page_url)
              soup = BeautifulSoup(page.text, 'html.parser')
              pdf_links = []
              seen = set()
              for a in soup.find_all('a', href=True):
                  href = urljoin(page_url, a['href'])
                  if '.pdf' not in href.lower() or href in seen:
                      continue
                  seen.add(href)
                  pdf_links.append((' '.join(a.get_text(' ', strip=True).split()), href))
              if len(pdf_links) != 1:
                  raise RuntimeError(f'{key}: expected exactly one PDF, got {pdf_links!r}')
              label, resource_url = pdf_links[0]
              body = get(resource_url).content
              sha = hashlib.sha256(body).hexdigest()
              if sha != EXPECTED_SHA[key]:
                  raise RuntimeError(f'{key}: content changed between independent captures: {sha}')
              path = Path('/tmp') / f'{key}.pdf'
              path.write_bytes(body)
              with pdfplumber.open(path) as pdf:
                  page_line_counts=[]
                  samples={}
                  date_counts=Counter()
                  x_hist=Counter()
                  page_text_lengths=[]
                  for page_no,p in enumerate(pdf.pages,1):
                      ls=lines(p)
                      page_line_counts.append(len(ls))
                      page_text_lengths.append(len(p.extract_text() or ''))
                      if page_no in {1,2,3,len(pdf.pages)}:
                          samples[str(page_no)]=ls[:120]
                      for line in ls:
                          for token in re.findall(r'\b\d{1,2}/\d{1,2}/\d{4}\b',line['text']):
                              date_counts[token]+=1
                          for w in line['words']:
                              x_hist[round(float(w['x0'])/10)*10]+=1
                  summary[key]={
                      'page_url':page_url,'label':label,'resource_url':resource_url,
                      'sha256':sha,'bytes':len(body),'pages':len(pdf.pages),
                      'page_line_counts':page_line_counts,
                      'page_text_lengths':page_text_lengths,
                      'date_token_count':sum(date_counts.values()),
                      'distinct_date_tokens':len(date_counts),
                      'x_hist_top':x_hist.most_common(30),
                      'samples':samples,
                  }
              print('ROMA_META',key,json.dumps({k:v for k,v in summary[key].items() if k!='samples'},ensure_ascii=False))
              for pno, sample in summary[key]['samples'].items():
                  print('ROMA_PAGE_SAMPLE',key,pno,json.dumps(sample,ensure_ascii=False))
          Path('/tmp/roma-positioned-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload positioned inspection summary
        uses: actions/upload-artifact@v4
        with:
          name: roma-positioned-summary
          path: /tmp/roma-positioned-summary.json
          retention-days: 7
