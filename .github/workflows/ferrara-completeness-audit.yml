name: Ferrara structural completeness audit

on:
  push:
    branches:
      - expansion/ferrara-2026-09-20
    paths:
      - .github/workflows/ferrara-completeness-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit runtime
        run: python -m pip install --disable-pip-version-check requests pdfplumber
      - name: Revalidate pinned bytes and audit table structure
        shell: python
        run: |
          import hashlib
          import io
          import json
          import re
          import secrets
          import unicodedata
          from collections import Counter, defaultdict
          from datetime import datetime

          import pdfplumber
          import requests

          ORDINARY = (
              'ordinary',
              'https://prefettura.interno.gov.it/sites/default/files/0/2026-08/white-list-provinciali-elenco-imprese-iscritte-agg11112024_0.pdf',
              '0d631e678b7f85bb84d265b09b8de6fcffa09cc4a49b84be37c6c1d7b9dcd6d9',
              7,
          )
          APPLICANTS = (
              'applicants',
              'https://prefettura.interno.gov.it/sites/default/files/0/2026-08/white-list-elenco-imprese-richiedenti_0.pdf',
              'c7437cdeebd1a64d4a6de8bbe5e8c108a688269409b7c772e8a6c87162e588e7',
              None,
          )
          RECONSTRUCTION = [
              ('A', 'https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-a-fornitura-moduli-prefabbricati-e-dei-relativi-arredi_is_0.pdf', '4fdf292b1538892c7b5ff79d3c0c14e0ed3b5830effb791316b0fddb8c90ae01', 6),
              ('B', 'https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-b-demolizione-di-edifici-ed-altre-strutture_is_0.pdf', '97d9af0d587af0b7d93d31df33bd612440bf5be5b48b57872d436e2afeb164ec', 6),
              ('C', 'https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-c-movimenti-di-terra_is_0.pdf', '99f519101dccff84dddd9753f0d6fa27170c33b1982858afe9fdf9ebbc63c57e', 6),
              ('D', 'https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-d-noleggio-con-coducente-mezzi-speciali_is_0.pdf', '07c27b38e48a879aa0d1efff4710bf7dbbf1bb323e59f62eb0b0b796a75a46d8', 6),
              ('E', 'https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-e-fornitura-e-posa-in-opera-impianti-fotovoltaici_is_0.pdf', '9cea950d37f653d0356edb9a46a7f43665a382e771c969bc93f7027f95fecf9e', 6),
              ('F', 'https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-f-fornitura-e-manutenzione-impianti-tecnologici_is_0.pdf', 'ac7dd77f1c4633c27a62c0ad7e074f507a10b091a327c2fc1072cfb52fd45664', 6),
              ('G', 'https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-g-fornitura-beni-necessari-ricostruzione_is_0.pdf', '0657c7e0f0b9fb8ad7f0b341682716d695132e61131adc92407627a5cae82bae', 6),
          ]

          def norm(value):
              return ' '.join((value or '').replace('\u00a0', ' ').split())

          def fold(value):
              value = unicodedata.normalize('NFKD', norm(value))
              return ''.join(c for c in value if not unicodedata.combining(c)).casefold()

          def strict_ids(value):
              compact = re.sub(r'[^0-9A-Za-z]', '', value or '').upper()
              tokens = re.findall(r'(?<![0-9A-Z])(?:[0-9]{11}|[A-Z0-9]{16})(?![0-9A-Z])', (value or '').upper())
              if len(compact) in (11, 16) and compact not in tokens:
                  tokens.append(compact)
              return tuple(dict.fromkeys(tokens))

          def date_state(raw):
              value = norm(raw)
              if not value:
                  return 'blank', None
              if not re.fullmatch(r'\d{2}/\d{2}/\d{4}', value):
                  return 'raw_noncanonical', None
              try:
                  parsed = datetime.strptime(value, '%d/%m/%Y').date().isoformat()
              except ValueError:
                  return 'raw_invalid', None
              return 'normalised', parsed

          def status(note):
              n = fold(note)
              if not n:
                  return 'listed'
              if 'rinnovo' in n or 'rinovo' in n:
                  return 'renewal_update_in_progress'
              return 'other_or_unknown'

          def fetch(spec):
              label, url, expected, _ = spec
              response = requests.get(
                  url,
                  headers={
                      'User-Agent': 'italian-anti-mafia-whitelist/ferrara-structural-audit',
                      'Cache-Control': 'no-cache',
                      'Pragma': 'no-cache',
                  },
                  params={'audit_nonce': secrets.token_hex(8)},
                  timeout=90,
              )
              response.raise_for_status()
              blob = response.content
              actual = hashlib.sha256(blob).hexdigest()
              assert actual == expected, (label, expected, actual, len(blob))
              return blob

          def tables(blob, expected_width):
              out = []
              with pdfplumber.open(io.BytesIO(blob)) as pdf:
                  for pno, page in enumerate(pdf.pages, 1):
                      for tno, table in enumerate(page.extract_tables() or [], 1):
                          for rno, raw in enumerate(table or [], 1):
                              row = [norm(c) for c in (raw or [])]
                              if not any(row):
                                  continue
                              if expected_width is not None:
                                  assert len(row) == expected_width, (pno, tno, rno, len(row), row)
                              out.append((pno, tno, rno, row))
              return out

          def looks_header(row):
              joined = fold(' | '.join(row))
              return (
                  ('denominazione' in joined and ('c.f' in joined or 'p.iva' in joined or 'partita iva' in joined))
                  or ('ragione sociale' in joined and ('c.f' in joined or 'p.iva' in joined or 'partita iva' in joined))
              )

          result = {}

          # Ordinary listed: selection is structural, not date-driven.
          ordinary_blob = fetch(ORDINARY)
          ordinary_rows = tables(ordinary_blob, ORDINARY[3])
          ordinary_candidates = []
          ordinary_suspicious = []
          for pno, tno, rno, row in ordinary_rows:
              if looks_header(row):
                  continue
              name, office, ident, listed_raw, expiry_raw, note = row[:6]
              locator = f'p{pno}:t{tno}:r{rno}'
              is_candidate = bool(name and office and ident and expiry_raw)
              if is_candidate:
                  ordinary_candidates.append((locator, row))
              elif ident or expiry_raw:
                  ordinary_suspicious.append({'locator': locator, 'row': row})

          ordinary_dates = []
          ordinary_statuses = Counter()
          ordinary_id_count = 0
          for locator, row in ordinary_candidates:
              name, office, ident, listed_raw, expiry_raw, note = row[:6]
              ls, ln = date_state(listed_raw)
              es, en = date_state(expiry_raw)
              if ls != 'normalised' or es != 'normalised':
                  ordinary_dates.append({
                      'locator': locator, 'name': name, 'id_raw': ident,
                      'listed_raw': listed_raw, 'listed_state': ls,
                      'expiry_raw': expiry_raw, 'expiry_state': es,
                  })
              ordinary_statuses[status(note)] += 1
              ordinary_id_count += bool(strict_ids(ident))
          result['ordinary'] = {
              'physical_candidates': len(ordinary_candidates),
              'statuses': ordinary_statuses,
              'strict_id_rows': ordinary_id_count,
              'date_anomalies': ordinary_dates,
              'suspicious_non_candidates': ordinary_suspicious,
          }

          # Applicant population: audit structural rows, independent of date validity.
          applicant_blob = fetch(APPLICANTS)
          applicant_rows = tables(applicant_blob, APPLICANTS[3])
          applicant_candidates = []
          applicant_suspicious = []
          applicant_widths = Counter()
          for pno, tno, rno, row in applicant_rows:
              applicant_widths[len(row)] += 1
              if looks_header(row):
                  continue
              locator = f'p{pno}:t{tno}:r{rno}'
              nonempty = [(i, value) for i, value in enumerate(row) if value]
              # Positive structural signal: a row carrying a company name, office,
              # an identifier-like field and at least one later semantic field.
              ident_cells = [(i, value) for i, value in nonempty if strict_ids(value)]
              is_candidate = bool(row and row[0] and len(nonempty) >= 4 and ident_cells)
              if is_candidate:
                  applicant_candidates.append((locator, row, ident_cells))
              elif ident_cells:
                  applicant_suspicious.append({'locator': locator, 'row': row})
          result['applicants'] = {
              'physical_candidates': len(applicant_candidates),
              'widths': applicant_widths,
              'strict_id_rows': sum(bool(ids) for _, _, ids in applicant_candidates),
              'suspicious_non_candidates': applicant_suspicious,
          }

          # Reconstruction: require structural company/office/id/expiry cells only;
          # malformed or non-canonical dates remain candidates and are audited below.
          physical = []
          recon_suspicious = []
          sector_counts = Counter()
          sector_statuses = defaultdict(Counter)
          date_anomalies = []
          for sector, url, sha, width in RECONSTRUCTION:
              blob = fetch((sector, url, sha, width))
              for pno, tno, rno, row in tables(blob, width):
                  if looks_header(row):
                      continue
                  name, office, ident, listed_raw, expiry_raw, note = row
                  locator = f'{sector}:p{pno}:t{tno}:r{rno}'
                  is_candidate = bool(name and office and ident and expiry_raw)
                  if not is_candidate:
                      if ident or expiry_raw:
                          recon_suspicious.append({'locator': locator, 'row': row})
                      continue
                  ls, ln = date_state(listed_raw)
                  es, en = date_state(expiry_raw)
                  st = status(note)
                  ids = strict_ids(ident)
                  item = {
                      'sector': sector,
                      'locator': locator,
                      'name': name,
                      'office': office,
                      'id_raw': ident,
                      'ids': ids,
                      'listed_raw': listed_raw,
                      'listed_norm': ln,
                      'listed_state': ls,
                      'expiry_raw': expiry_raw,
                      'expiry_norm': en,
                      'expiry_state': es,
                      'note': note,
                      'status': st,
                  }
                  physical.append(item)
                  sector_counts[sector] += 1
                  sector_statuses[sector][st] += 1
                  if ls != 'normalised' or es != 'normalised':
                      date_anomalies.append({k: item[k] for k in (
                          'sector','locator','name','id_raw','listed_raw','listed_state',
                          'expiry_raw','expiry_state','status'
                      )})

          def raw_date_key(item, prefix):
              normal = item[f'{prefix}_norm']
              return ('NORM', normal) if normal else ('RAW', norm(item[f'{prefix}_raw']).casefold())

          groups = defaultdict(list)
          ungroupable = []
          for item in physical:
              ids = item['ids']
              if not ids:
                  ungroupable.append(item)
                  # No identity repair: keep physical observation distinct.
                  identity = ('RAW', fold(item['id_raw']), fold(item['name']), fold(item['office']), item['locator'])
              else:
                  identity = ('ID', ids)
              key = (
                  identity,
                  raw_date_key(item, 'listed'),
                  raw_date_key(item, 'expiry'),
                  item['status'],
              )
              groups[key].append(item)

          grouped_statuses = Counter(items[0]['status'] for items in groups.values())
          multi_sector = sum(len({i['sector'] for i in items}) > 1 for items in groups.values())
          grouped_strict = sum(bool(items[0]['ids']) for items in groups.values())

          # Identity families with multiple date/status variants are intentionally
          # not merged; enumerate them as semantic conflicts for review.
          families = defaultdict(list)
          for key, items in groups.items():
              identity = key[0]
              if identity[0] == 'ID':
                  families[identity].append((key, items))
          conflicts = []
          for identity, variants in families.items():
              if len(variants) > 1:
                  conflicts.append({
                      'identity': identity,
                      'variant_count': len(variants),
                      'variants': [
                          {
                              'listed': key[1], 'expiry': key[2], 'status': key[3],
                              'sectors': sorted({i['sector'] for i in items}),
                              'locators': [i['locator'] for i in items],
                          }
                          for key, items in variants
                      ],
                  })

          result['reconstruction'] = {
              'physical_candidates': len(physical),
              'physical_statuses': Counter(i['status'] for i in physical),
              'strict_id_rows': sum(bool(i['ids']) for i in physical),
              'sector_counts': sector_counts,
              'sector_statuses': {k: v for k, v in sector_statuses.items()},
              'grouped_observations': len(groups),
              'grouped_statuses': grouped_statuses,
              'grouped_strict_id_observations': grouped_strict,
              'multi_sector_groups': multi_sector,
              'ungroupable_rows': [
                  {k: i[k] for k in ('sector','locator','name','office','id_raw','listed_raw','expiry_raw','note','status')}
                  for i in ungroupable
              ],
              'date_anomalies': date_anomalies,
              'suspicious_non_candidates': recon_suspicious,
              'identity_conflicts': conflicts,
          }

          # Demonstrate the known false-negative that motivated this audit.
          donega = [i for i in physical if 'donega' in fold(i['name']) and i['listed_raw'] == '23/09/21']
          assert donega, 'expected structurally valid DONEGA two-digit-year rows not found'
          assert {i['sector'] for i in donega} >= {'A','B','C','D','E','F'}, donega

          # Fail closed on unexpected partially structured rows: they require review
          # before any denominator can be approved.
          print('FERRARA_STRUCTURAL_AUDIT_JSON')
          print(json.dumps(result, ensure_ascii=False, indent=2, default=lambda x: dict(x)))
          print('FERRARA_STRUCTURAL_AUDIT_SUMMARY')
          print(json.dumps({
              'ordinary_candidates': len(ordinary_candidates),
              'ordinary_statuses': dict(ordinary_statuses),
              'ordinary_strict_id_rows': ordinary_id_count,
              'ordinary_date_anomalies': len(ordinary_dates),
              'ordinary_suspicious_non_candidates': len(ordinary_suspicious),
              'applicant_candidates': len(applicant_candidates),
              'applicant_suspicious_non_candidates': len(applicant_suspicious),
              'reconstruction_physical_candidates': len(physical),
              'reconstruction_sector_counts': dict(sector_counts),
              'reconstruction_grouped_observations': len(groups),
              'reconstruction_grouped_statuses': dict(grouped_statuses),
              'reconstruction_grouped_strict_ids': grouped_strict,
              'reconstruction_multi_sector_groups': multi_sector,
              'reconstruction_date_anomalies': len(date_anomalies),
              'reconstruction_suspicious_non_candidates': len(recon_suspicious),
              'reconstruction_identity_conflict_families': len(conflicts),
              'donega_two_digit_year_sectors': sorted({i['sector'] for i in donega}),
          }, ensure_ascii=False, indent=2))
