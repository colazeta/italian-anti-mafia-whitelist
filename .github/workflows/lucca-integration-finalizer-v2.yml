# bounded transactional runner
name: Lucca integration finalizer v2

on:
  push:
    branches:
      - expansion/lucca-2026-09-19
    paths:
      - .github/workflows/lucca-integration-finalizer-v2.yml
      - tmp/lucca-finalize-v2.py

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact expansion head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify branch is based on current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source_file; do
            [ -n "$source_file" ] && sudo rm -f "$source_file"
          done < <(grep -rlE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils antiword
          python -m pip install -e '.[dev,publication,database,storage]'
          python -m pip install --disable-pip-version-check requests

      - name: Materialise reviewed integration and clean temporary mechanisms
        run: python tmp/lucca-finalize-v2.py

      - name: Run full repository tests
        run: pytest -q

      - name: Reuse already-successful national candidate validation safely
        shell: bash
        run: |
          set -euo pipefail
          # Run 35437514563 successfully built and validated the exact 65,267-record
          # Lucca candidate from commit 52c27ed before failing only at the final push.
          # Since that validated head, only this transactional workflow may have changed.
          unexpected="$(git diff --name-only 52c27ed78e25c6a510aed2433056a4d534bd3785...HEAD | grep -v '^\.github/workflows/lucca-integration-finalizer-v2\.yml$' || true)"
          test -z "$unexpected" || { printf '%s\n' "$unexpected" >&2; exit 1; }
          git diff --quiet 52c27ed78e25c6a510aed2433056a4d534bd3785 HEAD -- \
            tmp/lucca-finalize.py \
            tmp/lucca-finalize-v2.py \
            docs/sources/lucca-operational-check-2026-09-19.md \
            src/white_list_archive/parsers/lucca_tables.py \
            tests/test_lucca_parser_semantics.py

      - name: Commit permanent checkpoint without workflow mutations
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            public-site/data/registry.json \
            public-site/data/registry.csv \
            public-site/data/prefectures.json \
            public-site/data/prefectures.csv \
            public-site/data/history.json; do
            if git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              git restore -- "$p"
            else
              rm -f "$p"
            fi
          done

          # The clean validation projection deliberately removes Lucca transaction files.
          # Restore them for this push, and restore public-pages.yml because the Actions
          # token has contents:write but no workflows permission. The reviewed public
          # workflow change is promoted separately through the repository API.
          git restore --source=HEAD -- \
            .github/workflows/public-pages.yml \
            .github/workflows/lucca-integration-finalizer-v2.yml \
            .github/workflows/lucca-parser-validate.yml \
            .github/workflows/lucca-source-probe.yml \
            tmp/lucca-finalize-v2.py \
            tmp/lucca-finalize.py

          git diff --check
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -Eq '^\.github/workflows/'; then
            echo 'Workflow mutation entered permission-safe checkpoint' >&2
            git diff --cached --name-only >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -Eq '^(tmp/lucca-|public-site/data/history\.json$)'; then
            echo 'Temporary/generated Lucca artifact entered permanent checkpoint' >&2
            git diff --cached --name-only >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate Lucca White List sources'
          git push origin HEAD:expansion/lucca-2026-09-19
