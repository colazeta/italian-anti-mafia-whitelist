name: Palermo integration finalizer v2 2026-09-19

on:
  push:
    branches:
      - expansion/palermo-2026-09-19
    paths:
      - .github/workflows/palermo-finalize-v2-2026-09-19.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: palermo-integration-finalizer-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify branch and scope
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "expansion/palermo-2026-09-19"
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-list --count HEAD..origin/main)" = "0"
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/palermo-(parser-validate|finalize|finalize-v2)-2026-09-19\.yml|tmp/palermo_integrate\.py|docs/sources/palermo-operational-check-2026-09-19\.md|src/white_list_archive/parsers/palermo_positioned\.py|tests/test_palermo_parser_semantics\.py)$' | grep -q .; then
            echo 'Unexpected pre-integration branch scope' >&2
            exit 1
          fi
      - name: Install complete validation runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils antiword
          python -m pip install -e '.[dev,publication,database,storage]'
      - name: Materialise Palermo integration
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tmp/palermo_integrate.py')
          text = path.read_text(encoding='utf-8')
          old = "coverage['authorities']"
          new = "coverage['prefectures']"
          if text.count(old) != 1:
              raise RuntimeError(f'Palermo monitoring collection anchor drift: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python tmp/palermo_integrate.py
          git diff --check
      - name: Run focused and full repository validation
        run: |
          set -euo pipefail
          pytest -q tests/test_palermo_parser_semantics.py tests/test_source_registry.py tests/test_source_population_coverage.py
          pytest -q
      - name: Build and validate national candidate
        run: |
          set -euo pipefail
          rm -rf /tmp/palermo-national
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/palermo-national \
            --registry-json public-site/data/registry.json \
            --registry-csv public-site/data/registry.csv \
            --prefectures-json public-site/data/prefectures.json \
            --prefectures-csv public-site/data/prefectures.csv
          python -c "import json; from collections import Counter; reg=json.load(open('public-site/data/registry.json',encoding='utf-8')); pref=json.load(open('public-site/data/prefectures.json',encoding='utf-8')); r=[x for x in reg['records'] if x['authority_key']=='palermo']; assert reg['meta']['record_count']==68718; assert reg['meta']['authority_count']==64; assert reg['meta']['register_count']==66; assert pref['meta']['published_count']==64; assert pref['meta']['mapped_count']==64; assert len(r)==1538; assert Counter(x['source_key'] for x in r)==Counter({'palermo-listed':929,'palermo-applicants':609}); assert Counter(x['source_status'] for x in r)==Counter({'pending':609,'listed':486,'renewal_update_in_progress':443}); assert sum(bool(x['identifiers']) for x in r)==1530; assert len({x['record_locator'] for x in r})==1538; print('PALERMO_NATIONAL_OK 68718/64/66/64')"
      - name: Commit permanent checkpoint and review candidate
        run: |
          set -euo pipefail
          git restore public-site/data 2>/dev/null || true
          git add data/catalog.csv data/monitoring/national_coverage.json data/publication/multi_prefecture_pilot.json data/source_registry/source_series_inventory.csv data/source_registry/verified_primary_pages.csv src/white_list_archive/publishing/public_national_registry.py tests/public_portal_browser.cjs tests/test_source_population_coverage.py tests/test_source_registry.py tmp/palermo-public-pages.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 10
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate Palermo White List observations'
          git push origin HEAD:expansion/palermo-2026-09-19
