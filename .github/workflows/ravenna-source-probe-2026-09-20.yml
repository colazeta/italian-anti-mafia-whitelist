name: Ravenna source probe 2026-09-20

on:
  push:
    branches: [expansion/ravenna-2026-09-20]
    paths: ['.github/workflows/ravenna-source-probe-2026-09-20.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ravenna-source-probe-2026-09-20
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/ravenna-2026-09-20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe runtime
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pdfplumber
      - name: Verify and freeze current official Ravenna attachment
        env:
          LANDING_URL: https://prefettura.interno.gov.it/it/prefetture/ravenna/evidenza/white-list
          CURRENT_PDF_URL: https://prefettura.interno.gov.it/sites/default/files/64/2026-09/nuova_tabella_unica_17-sett-2026.pdf
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, io, json, os, re, time
          from pathlib import Path
          from urllib.parse import urljoin
          import pdfplumber, requests
          from bs4 import BeautifulSoup

          landing_url = os.environ['LANDING_URL']
          pdf_url = os.environ['CURRENT_PDF_URL']
          out = Path('tmp'); out.mkdir(exist_ok=True)
          base_headers = {
              'User-Agent': 'Mozilla/5.0 (compatible; italian-anti-mafia-whitelist-source-probe/1.0)',
              'Cache-Control': 'no-cache', 'Pragma': 'no-cache'
          }
          def get(url, accept, nonce):
              h = dict(base_headers); h['Accept'] = accept
              sep = '&' if '?' in url else '?'
              last = None
              for retry in range(3):
                  try:
                      r = requests.get(f'{url}{sep}probe={nonce}-{retry}', headers=h, timeout=(20,90), allow_redirects=True)
                      last = r
                      if r.status_code == 200: return r
                  except requests.RequestException as exc: last = exc
                  time.sleep(2*(retry+1))
              if isinstance(last, requests.Response): return last
              raise RuntimeError(f'GET failed: {last!r}')

          landing = get(landing_url, 'text/html,*/*;q=0.8', int(time.time()*1000))
          if landing.status_code != 200:
              raise RuntimeError(f'official landing returned HTTP {landing.status_code}')
          soup = BeautifulSoup(landing.text, 'html.parser')
          links = []
          for a in soup.find_all('a', href=True):
              href = urljoin(landing.url, a['href']).split('?probe=')[0]
              label = ' '.join(a.get_text(' ', strip=True).split())
              if '/sites/default/files/' in href:
                  links.append({'label': label, 'url': href})
          exact = [x for x in links if x['url'] == pdf_url]
          if len(exact) != 1 or exact[0]['label'] != 'Nuova tabella unica aggiornata':
              raise RuntimeError(f'current Ravenna attachment drift: expected one exact link, got {exact!r}; links={links!r}')

          copies = []
          contents = []
          for attempt in (1,2):
              r = get(pdf_url, 'application/pdf,*/*;q=0.8', f'{int(time.time()*1000)}-{attempt}')
              if r.status_code != 200 or not r.content.startswith(b'%PDF'):
                  raise RuntimeError(f'current Ravenna PDF fetch {attempt} invalid: HTTP {r.status_code}')
              contents.append(r.content)
              copies.append({'attempt':attempt,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest()})
          if copies[0]['sha256'] != copies[1]['sha256']:
              raise RuntimeError('current Ravenna attachment changed between independent fetches')

          page_meta=[]; tables_dump=[]; text_dump=[]; numeric_rows=0
          renewal_rows=0; one_date_rows=0
          date_re=re.compile(r'\b\d{1,2}/\d{1,2}/\d{4}\b')
          with pdfplumber.open(io.BytesIO(contents[0])) as pdf:
              for pno,page in enumerate(pdf.pages,1):
                  text=page.extract_text(x_tolerance=2,y_tolerance=3) or ''
                  text_dump.append(f'===== PAGE {pno} =====\n{text}\n')
                  serial=[]; shapes=[]
                  for table in page.extract_tables():
                      rows=[]
                      for rr in table or []:
                          row=[' '.join((c or '').split()) for c in rr]
                          if not any(row): continue
                          rows.append(row)
                          if row and re.fullmatch(r'\d+', row[0]):
                              numeric_rows += 1
                              joined=' | '.join(row)
                              if 'Richiesto rinnovo' in joined or 'Aggiornamento in corso' in joined: renewal_rows += 1
                              if len(date_re.findall(joined)) == 1: one_date_rows += 1
                      serial.append(rows); shapes.append({'rows':len(rows),'widths':sorted({len(r) for r in rows})})
                  tables_dump.append({'page':pno,'tables':serial})
                  page_meta.append({'page':pno,'text_chars':len(text),'table_count':len(serial),'table_shapes':shapes})
              page_count=len(pdf.pages)

          text=''.join(text_dump)
          receipt={
              'authority_key':'ravenna','landing_url':landing_url,'landing_http_status':landing.status_code,
              'selected_attachment':exact[0],'attachment_links':links,'independent_pdf_fetches':copies,
              'byte_identical':True,'page_count':page_count,'page_diagnostics':page_meta,
              'numeric_first_rows':numeric_rows,'renewal_marked_rows_heuristic':renewal_rows,
              'single_date_numeric_rows_heuristic':one_date_rows,
              'page_text_sha256':hashlib.sha256(text.encode()).hexdigest()
          }
          (out/'ravenna-source-probe.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'ravenna-extracted-tables.json').write_text(json.dumps(tables_dump,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'ravenna-page-text.txt').write_text(text,encoding='utf-8')
          print(json.dumps({k:receipt[k] for k in ('selected_attachment','independent_pdf_fetches','page_count','numeric_first_rows','renewal_marked_rows_heuristic','single_date_numeric_rows_heuristic')},indent=2))
          PY
      - name: Commit current-source checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/ravenna-source-probe.json tmp/ravenna-extracted-tables.json tmp/ravenna-page-text.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Checkpoint current Ravenna official source'
          git push origin HEAD:expansion/ravenna-2026-09-20
