name: Firenze bounded finalisation helper

on:
  push:
    branches:
      - expansion/firenze-2026-09-18

permissions:
  contents: write

jobs:
  finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist reviewed Firenze public boundary and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          python tmp/firenze_workflow_only.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/public-pages.yml tests/public_portal_browser.cjs
          git rm -f --ignore-unmatch .github/workflows/_firenze-stage-final.yml tmp/firenze_finalise.py tmp/firenze_workflow_only.py staging/firenze-public-pages.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Finalise Firenze public portal acceptance'
          git push origin HEAD:expansion/firenze-2026-09-18
