name: Firenze bounded finalisation helper

on:
  push:
    branches:
      - expansion/firenze-2026-09-18

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stage reviewed Firenze public workflow outside workflow path
        shell: bash
        run: |
          set -euo pipefail
          python tmp/firenze_workflow_only.py
          mkdir -p staging
          cp .github/workflows/public-pages.yml staging/firenze-public-pages.yml
          git checkout -- .github/workflows/public-pages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staging/firenze-public-pages.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Stage Firenze public workflow assertions'
          git push origin HEAD:expansion/firenze-2026-09-18
