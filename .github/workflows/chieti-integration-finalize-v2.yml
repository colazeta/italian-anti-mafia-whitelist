name: Temporary Chieti integration finalisation v2

on:
  push:
    branches:
      - expansion/chieti-2026-09-18
    paths:
      - '.github/workflows/chieti-integration-finalize-v2.yml'

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/chieti-2026-09-18
          fetch-depth: 0

      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends antiword poppler-utils
          python -m pip install -e '.[dev,publication]'

      - name: Revalidate approved Chieti source bytes twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/chieti
          LISTED='https://prefettura.interno.gov.it/sites/default/files/82/2026-09/elenco-iscritti-white-list-18-settembre-2026.doc'
          APPLICANTS='https://prefettura.interno.gov.it/sites/default/files/82/2026-09/elenco-richiedenti-iscrizione-in-white-list-18-settembre-2026.doc'
          UA='Mozilla/5.0 (compatible; italian-anti-mafia-whitelist/1.0; Chieti final verification v2)'
          for kind in listed applicants; do
            url="$LISTED"
            expected='09c9b3ae1b1f4145c2a3795738a8d80d872c9816752cedb31b34cd730d801ddd'
            if [ "$kind" = applicants ]; then
              url="$APPLICANTS"
              expected='2628230c417cf7b961d4a22490ba04f1b548c512782bd19a211890e11df54dc1'
            fi
            for n in 1 2; do
              curl --fail --location --silent --show-error --retry 2 \
                -A "$UA $kind-$n" -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                "$url" -o "/tmp/chieti/$kind-$n.doc"
              actual="$(sha256sum "/tmp/chieti/$kind-$n.doc" | cut -d' ' -f1)"
              test "$actual" = "$expected"
            done
            cmp "/tmp/chieti/$kind-1.doc" "/tmp/chieti/$kind-2.doc"
          done

      - name: Exercise fail-closed parser against fresh captures
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from white_list_archive.parsers.chieti_legacy_doc import parse_chieti_listed, parse_chieti_applicants

          common = {
              "reference_date": "2026-09-18",
              "authority_key": "chieti",
              "authority_name": "Prefettura di Chieti",
              "register_key": "chieti-ordinary",
              "register_name": "White List ordinaria",
              "source_page_url": "https://prefettura.interno.gov.it/it/prefetture/chieti/evidenza/white-list",
          }
          listed = parse_chieti_listed(Path('/tmp/chieti/listed-1.doc'), {
              **common,
              "source_key": "chieti-listed",
              "population_scope": "listed",
              "resource_url": "https://prefettura.interno.gov.it/sites/default/files/82/2026-09/elenco-iscritti-white-list-18-settembre-2026.doc",
              "sha256": "09c9b3ae1b1f4145c2a3795738a8d80d872c9816752cedb31b34cd730d801ddd",
          })
          applicants = parse_chieti_applicants(Path('/tmp/chieti/applicants-1.doc'), {
              **common,
              "source_key": "chieti-applicants",
              "population_scope": "applicant",
              "resource_url": "https://prefettura.interno.gov.it/sites/default/files/82/2026-09/elenco-richiedenti-iscrizione-in-white-list-18-settembre-2026.doc",
              "sha256": "2628230c417cf7b961d4a22490ba04f1b548c512782bd19a211890e11df54dc1",
          })
          assert listed.diagnostics == {
              'parser': 'chieti_legacy_listed',
              'sector_rows': 1352,
              'public_records': 759,
              'status_counts': {'listed': 544, 'renewal_update_in_progress': 204, 'expired_observed': 10, 'cancellation_related': 1},
              'identifier_coverage': 731,
              'raw_only_identifier_records': 28,
              'malformed_listing_date_records': 7,
              'malformed_expiry_date_records': 12,
          }
          assert applicants.diagnostics['public_records'] == 177
          assert applicants.diagnostics['status_counts'] == {'pending': 169, 'other_or_unknown': 7, 'rejected_or_denied': 1}
          assert applicants.diagnostics['identifier_coverage'] == 173
          assert applicants.diagnostics['raw_only_identifier_records'] == 4
          assert applicants.diagnostics['malformed_or_missing_application_date_records'] == 5
          PY

      - name: Materialise permanent Chieti integration
        run: |
          set -euo pipefail
          python scripts/chieti_finalize_tmp.py

      - name: Remove temporary expansion machinery
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/chieti-source-discovery.yml \
            .github/workflows/chieti-integration-finalize.yml \
            .github/workflows/chieti-integration-finalize-v2.yml \
            scripts/chieti_finalize_tmp.py
          test ! -e .github/workflows/chieti-source-discovery.yml
          test ! -e .github/workflows/chieti-integration-finalize.yml
          test ! -e .github/workflows/chieti-integration-finalize-v2.yml
          test ! -e scripts/chieti_finalize_tmp.py

      - name: Validate permanent Chieti checkpoint
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_chieti_parser_semantics.py \
            tests/test_source_population_coverage.py \
            tests/test_source_registry.py \
            tests/test_actions_artifact_policy.py
          git diff --check
          test -f docs/sources/chieti-operational-check-2026-09-18.md
          git status --short

      - name: Commit permanent integration checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No materialised changes to commit.'
            exit 1
          fi
          git commit -m 'Integrate Chieti White List sources'
          git push origin HEAD:expansion/chieti-2026-09-18
