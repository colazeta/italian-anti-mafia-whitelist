name: Cosenza content capture

on:
  push:
    branches:
      - main
      - research/cosenza-content-capture
      - feature/cosenza-parser-v2
      - feature/automatic-semantic-projection
      - feature/explorer-drilldown-source-evidence
      - feature/geography-and-population-coverage
    paths:
      - 'src/white_list_archive/acquisition/cosenza_capture.py'
      - 'src/white_list_archive/acquisition/source_population_coverage.py'
      - 'src/white_list_archive/parsers/**'
      - 'src/white_list_archive/persistence/**'
      - 'src/white_list_archive/semantic/**'
      - 'src/white_list_archive/publishing/**'
      - 'explorer/**'
      - 'data/source_registry/**'
      - 'data/captures/cosenza/combined_2026-06-28.json'
      - 'data/captures/cosenza/combined_2026-08-03.json'
      - 'db/apply.sql'
      - 'db/schema/**'
      - 'db/seeds/**'
      - 'db/tests/004_cosenza_live_parsed_counts.sql'
      - 'db/tests/005_cosenza_v2_live_counts.sql'
      - 'db/tests/006_cosenza_semantic_pipeline.sql'
      - 'pyproject.toml'
      - '.github/workflows/cosenza-content-capture.yml'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: whitelist
          POSTGRES_USER: whitelist
          POSTGRES_PASSWORD: whitelist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whitelist -d whitelist"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      PGPASSWORD: whitelist
      TEST_DSN: postgresql://whitelist:whitelist@localhost:5432/whitelist

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project and acquisition utilities
        run: |
          python -m pip install -e .[database]
          sudo apt-get update
          sudo apt-get install -y poppler-utils postgresql-client
      - name: Apply PostgreSQL schema
        run: psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -f db/apply.sql
      - name: Capture two adjacent Cosenza editions
        run: |
          white-list-cosenza-capture \
            https://prefettura.interno.gov.it/it/prefetture/cosenza/white-list-elenchi-aggiornati-28-giugno-2026 \
            https://prefettura.interno.gov.it/it/prefetture/cosenza/white-list-elenchi-aggiornati-03-agosto-2026
      - name: Verify live bytes and extracted text against frozen capture identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          live = {item['reference_date']: item for item in json.loads(Path('artifacts/cosenza-capture/manifest.json').read_text())}
          frozen = {
              '2026-06-28': json.loads(Path('data/captures/cosenza/combined_2026-06-28.json').read_text()),
              '2026-08-03': json.loads(Path('data/captures/cosenza/combined_2026-08-03.json').read_text()),
          }
          if set(live) != set(frozen):
              raise SystemExit(f'Unexpected live edition set: {sorted(live)}')
          keys = ['resource_url', 'sha256', 'text_sha256', 'schema_fingerprint', 'page_count']
          for reference_date, expected in frozen.items():
              observed = live[reference_date]
              mismatches = {key: {'expected': expected[key], 'observed': observed[key]} for key in keys if observed.get(key) != expected.get(key)}
              if mismatches:
                  raise SystemExit(f'Frozen content identity mismatch for {reference_date}: {mismatches}. Review as a new capture.')
          print('Frozen Cosenza content identities verified.')
          PY
      - name: Persist frozen source and capture graph
        run: |
          white-list-persist-capture-manifests --dsn "$TEST_DSN" \
            data/captures/cosenza/combined_2026-06-28.json \
            data/captures/cosenza/combined_2026-08-03.json

      # Parser v1 is retained and re-run as a historical QA baseline.
      - name: Parse legacy v1 source mentions
        run: |
          white-list-cosenza-mentions \
            artifacts/cosenza-capture/2026-06-28/combined.txt \
            artifacts/cosenza-capture/2026-08-03/combined.txt \
            --output-dir artifacts/cosenza-mentions-v1
      - name: Persist legacy v1 parsed observations
        run: |
          white-list-persist-parsed-records --dsn "$TEST_DSN" \
            --capture-manifest data/captures/cosenza/combined_2026-06-28.json \
            --parse-manifest artifacts/cosenza-mentions-v1/parse_manifest.json \
            --parse-label before \
            --records artifacts/cosenza-mentions-v1/before_records.csv
          white-list-persist-parsed-records --dsn "$TEST_DSN" \
            --capture-manifest data/captures/cosenza/combined_2026-08-03.json \
            --parse-manifest artifacts/cosenza-mentions-v1/parse_manifest.json \
            --parse-label after \
            --records artifacts/cosenza-mentions-v1/after_records.csv
      - name: Validate legacy v1 baseline
        run: psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -f db/tests/004_cosenza_live_parsed_counts.sql

      - name: Parse rich Cosenza v2 source rows
        run: |
          white-list-cosenza-v2 \
            artifacts/cosenza-capture/2026-06-28/combined.pdf \
            artifacts/cosenza-capture/2026-08-03/combined.pdf \
            --output-dir artifacts/cosenza-v2
      - name: Persist rich v2 source observations
        run: |
          white-list-persist-parsed-records-v2 --dsn "$TEST_DSN" \
            --capture-manifest data/captures/cosenza/combined_2026-06-28.json \
            --parse-manifest artifacts/cosenza-v2/parse_manifest_v2.json \
            --parse-label before \
            --records artifacts/cosenza-v2/before_records_v2.csv
          white-list-persist-parsed-records-v2 --dsn "$TEST_DSN" \
            --capture-manifest data/captures/cosenza/combined_2026-08-03.json \
            --parse-manifest artifacts/cosenza-v2/parse_manifest_v2.json \
            --parse-label after \
            --records artifacts/cosenza-v2/after_records_v2.csv
      - name: Validate v2 row coverage and rich fields
        run: psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -f db/tests/005_cosenza_v2_live_counts.sql

      - name: Project semantics and canonicalise safe observations automatically
        run: |
          white-list-semantic-pipeline \
            --dsn "$TEST_DSN" \
            --series-code cosenza-combined \
            > artifacts/cosenza-v2/semantic_pipeline.json
          cat artifacts/cosenza-v2/semantic_pipeline.json
      - name: Validate semantic projection and canonical population
        run: psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -f db/tests/006_cosenza_semantic_pipeline.sql
      - name: Prove semantic pipeline idempotence
        run: |
          white-list-semantic-pipeline \
            --dsn "$TEST_DSN" \
            --series-code cosenza-combined \
            > artifacts/cosenza-v2/semantic_pipeline_second_run.json
          psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -f db/tests/006_cosenza_semantic_pipeline.sql
      - name: Export real database population manifest
        run: |
          white-list-model-population \
            --dsn "$TEST_DSN" \
            --output artifacts/cosenza-v2/model_population.json
          cat artifacts/cosenza-v2/model_population.json
      - name: Build mandatory listed/applicant coverage ledger
        run: |
          white-list-source-population-coverage \
            --output-json artifacts/data-explorer-preview-v2/source_population_coverage.json \
            --output-csv artifacts/data-explorer-preview-v2/source_population_coverage.csv

      - name: Export browsable database tables for internal audit
        run: |
          white-list-table-bundle \
            --dsn "$TEST_DSN" \
            --output-dir artifacts/data-explorer-preview-v2 \
            --preview-limit 50
      - name: Package original PDFs and row-to-page evidence locators
        run: |
          white-list-source-evidence \
            --before-pdf artifacts/cosenza-capture/2026-06-28/combined.pdf \
            --after-pdf artifacts/cosenza-capture/2026-08-03/combined.pdf \
            --before-manifest data/captures/cosenza/combined_2026-06-28.json \
            --after-manifest data/captures/cosenza/combined_2026-08-03.json \
            --output-dir artifacts/data-explorer-preview-v2
      - name: Build private Dataset Explorer from populated database state
        run: |
          white-list-build-explorer-preview-v2 \
            --before-records artifacts/cosenza-v2/before_records_v2.csv \
            --after-records artifacts/cosenza-v2/after_records_v2.csv \
            --diff artifacts/cosenza-v2/diff_summary_v2.json \
            --parse-manifest artifacts/cosenza-v2/parse_manifest_v2.json \
            --model-population artifacts/cosenza-v2/model_population.json \
            --semantic-pipeline artifacts/cosenza-v2/semantic_pipeline.json \
            --mode internal \
            --acknowledge-internal-row-data \
            --output artifacts/data-explorer-preview-v2/index.html
          white-list-explorer-audit-patch \
            --index artifacts/data-explorer-preview-v2/index.html \
            --table-catalog artifacts/data-explorer-preview-v2/table_catalog.json \
            --source-evidence artifacts/data-explorer-preview-v2/source_evidence.json \
            --population-coverage artifacts/data-explorer-preview-v2/source_population_coverage.json
      - name: Validate Explorer audit package
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('artifacts/data-explorer-preview-v2')
          table=json.loads((root/'table_catalog.json').read_text())
          pop=json.loads(Path('artifacts/cosenza-v2/model_population.json').read_text())
          if set(table['objects']) != {o['object_code'] for o in pop['objects']}:
              raise SystemExit('Table catalog does not cover every model-population object')
          for code,item in table['objects'].items():
              if not (root/item['csv_path']).is_file():
                  raise SystemExit(f'Missing CSV export for {code}')
          evidence=json.loads((root/'source_evidence.json').read_text())
          for date,item in evidence['editions'].items():
              pdf=root/item['pdf_path']
              observed=hashlib.sha256(pdf.read_bytes()).hexdigest()
              if observed != item['sha256']:
                  raise SystemExit(f'Evidence PDF hash mismatch for {date}')
              if len(item['rows']) not in (1327,1334):
                  raise SystemExit(f'Unexpected row locator count for {date}: {len(item["rows"])}')
          coverage=json.loads((root/'source_population_coverage.json').read_text())
          if coverage.get('required_populations') != ['listed','applicant']:
              raise SystemExit('Coverage ledger must require listed + applicant')
          count_keys = (
              'verified_authority_count',
              'register_scope_count',
              'complete_register_scope_count',
              'incomplete_register_scope_count',
          )
          for key in count_keys:
              value = coverage.get(key)
              if not isinstance(value, int) or isinstance(value, bool) or value < 0:
                  raise SystemExit(f'Coverage ledger has invalid {key}: {value!r}')
          scope_count = coverage['register_scope_count']
          complete_count = coverage['complete_register_scope_count']
          incomplete_count = coverage['incomplete_register_scope_count']
          if complete_count + incomplete_count != scope_count:
              raise SystemExit(
                  'Coverage ledger scope totals are inconsistent: '
                  f'{complete_count} complete + {incomplete_count} incomplete != {scope_count} scopes'
              )
          scopes = coverage.get('scopes')
          if not isinstance(scopes, list) or len(scopes) != scope_count:
              raise SystemExit(
                  f'Coverage ledger scope rows do not match register_scope_count: '
                  f'{len(scopes) if isinstance(scopes, list) else type(scopes).__name__} != {scope_count}'
              )
          authority_keys = {scope.get('authority_key') for scope in scopes}
          if None in authority_keys or len(authority_keys) != coverage['verified_authority_count']:
              raise SystemExit(
                  'Coverage ledger authority cardinality does not match verified_authority_count'
              )
          scope_flags = [scope.get('source_population_complete') for scope in scopes]
          if any(not isinstance(flag, bool) for flag in scope_flags):
              raise SystemExit('Every coverage scope must expose a boolean source_population_complete')
          if sum(scope_flags) != complete_count:
              raise SystemExit(
                  f'Coverage ledger complete-scope rows do not match summary: '
                  f'{sum(scope_flags)} != {complete_count}'
              )
          rows = coverage.get('rows')
          if not isinstance(rows, list) or len(rows) != scope_count * 2:
              raise SystemExit(
                  f'Coverage ledger must contain exactly two logical-population rows per scope: '
                  f'{len(rows) if isinstance(rows, list) else type(rows).__name__} != {scope_count * 2}'
              )
          targets_by_scope = {}
          for row in rows:
              scope_key = (row.get('authority_key'), row.get('regime_code'))
              targets_by_scope.setdefault(scope_key, set()).add(row.get('population_target'))
          if len(targets_by_scope) != scope_count or any(
              targets != {'listed', 'applicant'} for targets in targets_by_scope.values()
          ):
              raise SystemExit('Every coverage scope must account for listed + applicant exactly once logically')
          html=(root/'index.html').read_text()
          for needle in ('__AUDIT_DRILLDOWN_V1__','Apri CSV completo','Verifica indipendente:','COMPLETEZZA SORGENTI'):
              if needle not in html:
                  raise SystemExit(f'Missing Explorer audit feature: {needle}')
          print('Explorer audit package validated.')
          PY
      - name: Print v1-to-v2 and semantic QA summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v1=json.loads(Path('artifacts/cosenza-mentions-v1/diff_summary.json').read_text())
          v2=json.loads(Path('artifacts/cosenza-v2/diff_summary_v2.json').read_text())
          semantic=json.loads(Path('artifacts/cosenza-v2/semantic_pipeline.json').read_text())
          coverage=json.loads(Path('artifacts/data-explorer-preview-v2/source_population_coverage.json').read_text())
          print('v1 records:', v1['records'])
          print('v2 records:', v2['records'])
          print('v2 structured field coverage:', json.dumps(v2['structured_field_coverage'], indent=2))
          print('semantic projection:', json.dumps(semantic['semantic_projection'], indent=2))
          print('canonicalisation:', json.dumps(semantic['canonicalisation'], indent=2))
          print('source population coverage:', json.dumps({k:v for k,v in coverage.items() if k.endswith('count')}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cosenza-content-capture-v2
          path: |
            artifacts/cosenza-capture/
            artifacts/cosenza-mentions-v1/
            artifacts/cosenza-v2/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: data-explorer-preview-v2
          path: artifacts/data-explorer-preview-v2/
          if-no-files-found: error
          retention-days: 90
