name: Temporary Messina finalizer repair runner

on:
  push:
    branches:
      - expansion/messina-2026-09-18

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/messina-2026-09-18
          fetch-depth: 0
      - name: Prepare corrected finalizer
        if: github.event.head_commit.message == 'Simplify Messina finalizer repair runner'
        run: python .github/scripts/messina-finalizer-repair.py
      - name: Execute corrected finalizer
        if: github.event.head_commit.message == 'Simplify Messina finalizer repair runner'
        run: bash /tmp/messina-finalizer.sh
