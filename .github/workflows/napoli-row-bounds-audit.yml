name: Napoli row-bounds audit

on:
  push:
    branches:
      - 'expansion/napoli-2026-09-13'
    paths:
      - '.github/workflows/napoli-row-bounds-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install parser runtime
        run: python -m pip install -e '.[publication]'
      - name: Verify evidence and bind reviewed Napoli expiry exceptions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/napoli_row_bounds
          source_url='https://prefettura.interno.gov.it/sites/default/files/79/2026-09/whitelistprefnapoli_11_settembre_26.pdf'
          ua='Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelist/1.0; +https://github.com/colazeta/italian-anti-mafia-whitelist)'
          for copy in a b; do
            curl --fail --location --silent --show-error --retry 2 --retry-all-errors \
              --user-agent "$ua" \
              -o "tmp/napoli_row_bounds/listed_${copy}.pdf" \
              "$source_url"
            test "$(stat -c %s "tmp/napoli_row_bounds/listed_${copy}.pdf")" = "3081398"
            echo "93a8635c0bd9b00587f9cc60c52752061bd239a7c16cb34b64a11e495a0ab4be  tmp/napoli_row_bounds/listed_${copy}.pdf" | sha256sum -c -
          done
          cmp --silent tmp/napoli_row_bounds/listed_a.pdf tmp/napoli_row_bounds/listed_b.pdf
          python - <<'PY'
          from pathlib import Path
          import re
          import pdfplumber

          source = Path('tmp/napoli_row_bounds/listed_a.pdf')
          parser = Path('src/white_list_archive/parsers/napoli_tables.py')
          strict_date = re.compile(r'^\d{2}/\d{2}/\d{2}$')

          def clean(value):
              return re.sub(r'\s+', ' ', value or '').strip()

          rows = {}
          with pdfplumber.open(source) as pdf:
              if len(pdf.pages) != 60:
                  raise RuntimeError(f'page drift: {len(pdf.pages)} != 60')
              for page_number, page in enumerate(pdf.pages, start=1):
                  tables = page.find_tables()
                  if len(tables) != 1:
                      raise RuntimeError(f'table-count drift p{page_number}: {len(tables)}')
                  table = tables[0]
                  extracted = table.extract() or []
                  if len(extracted) != len(table.rows):
                      raise RuntimeError(f'extracted/physical row mismatch p{page_number}')
                  for row_index, raw in enumerate(extracted, start=1):
                      if len(raw or []) != 9:
                          raise RuntimeError(f'width drift p{page_number} r{row_index}: {len(raw or [])}')
                      cells = [clean(value) for value in (raw or [])]
                      if not cells[0].isdigit():
                          continue
                      ordinal = int(cells[0])
                      if not 1 <= ordinal <= 2259:
                          raise RuntimeError(f'unexpected ordinal p{page_number} r{row_index}: {ordinal}')
                      if ordinal in rows:
                          raise RuntimeError(f'duplicate ordinal: {ordinal}')
                      rows[ordinal] = (cells[1], cells[7])

          if sorted(rows) != list(range(1, 2260)):
              raise RuntimeError('ordinal coverage drift')

          observed = {
              ordinal: pair
              for ordinal, pair in rows.items()
              if pair[1] and not strict_date.fullmatch(pair[1])
          }
          expected = {
              83: ("AMBIENTE CAMPANIA S.R.L.", "Iscrizione valida per la durata dell'amministrazi one giudiziaria"),
              155: ("AURORA S.R.L.", "Iscrizione valida per la durata dell'amministrazi one giudiziaria"),
              371: ("CIEFFE COSTRUZIONI SRL UNIPERSONALE", "Iscrizione valida per la durata dell'amministrazi one giudiziaria"),
              372: ("CIEFFE LAVORI S.R.L.", "Iscrizione valida per la durata dell'amministrazi one giudiziaria"),
              488: ("COSTRUZIONI GENERALI SUD S.R.L.", "Iscrizione valida per la durata dell'amministrazi one giudiziaria"),
              968: ("FONTANA DI FONTANA FRANCESCO S.R.L.", "Iscrizione valida per la durata dell'amministrazi one giudiziaria"),
              2244: ("XECO SRL", "Iscrizione valida per la durata dell'amministrazi one giudiziaria"),
          }
          if observed != expected:
              raise RuntimeError(f'non-calendar expiry population drift: {observed!r}')

          text = parser.read_text(encoding='utf-8')
          if '_LISTED_NONCALENDAR_EXPIRY = {' in text or 'def _listed_expiry(' in text:
              raise RuntimeError('Napoli non-calendar expiry binding already present; refusing duplicate patch')

          anchor_constants = '''_PROTECTED_CLEAN_NAME_ROWS = {
              402: "CEM.AR. 86 - SOCIETA' COOPERATIVA DI PRODUZIONE E LAVORO A RESPON SABILITA' LIMITATA",
              403: "CEMENTI MOCCIA SPA",
          }
          '''
          replacement_constants = anchor_constants + '''
          # Seven listed records carry a source-positive non-calendar validity term.
          # Bind ordinal + company + exact cleaned source typography; do not interpret
          # the term as a calendar date or as a blank expiry.
          _LISTED_NONCALENDAR_EXPIRY = {
              83: ("AMBIENTE CAMPANIA S.R.L.", "Iscrizione valida per la durata dell'amministrazi one giudiziaria"),
              155: ("AURORA S.R.L.", "Iscrizione valida per la durata dell'amministrazi one giudiziaria"),
              371: ("CIEFFE COSTRUZIONI SRL UNIPERSONALE", "Iscrizione valida per la durata dell'amministrazi one giudiziaria"),
              372: ("CIEFFE LAVORI S.R.L.", "Iscrizione valida per la durata dell'amministrazi one giudiziaria"),
              488: ("COSTRUZIONI GENERALI SUD S.R.L.", "Iscrizione valida per la durata dell'amministrazi one giudiziaria"),
              968: ("FONTANA DI FONTANA FRANCESCO S.R.L.", "Iscrizione valida per la durata dell'amministrazi one giudiziaria"),
              2244: ("XECO SRL", "Iscrizione valida per la durata dell'amministrazi one giudiziaria"),
          }
          '''
          if text.count(anchor_constants) != 1:
              raise RuntimeError('protected-name constant anchor drift')
          text = text.replace(anchor_constants, replacement_constants, 1)

          helper_anchor = '\n\ndef _listed_status(ordinal: int, raw: str) -> str:\n'
          helper = '''

          def _listed_expiry(raw: str, *, ordinal: int, company: str) -> str:
              value = _clean(raw)
              reviewed = _LISTED_NONCALENDAR_EXPIRY.get(ordinal)
              if reviewed is not None:
                  expected_company, expected_raw = reviewed
                  if _clean(company) != expected_company or value != expected_raw:
                      raise RuntimeError(
                          f"Napoli listed reviewed non-calendar expiry drift at ordinal {ordinal}: "
                          f"company={_clean(company)!r}; expiry={value!r}"
                      )
                  return ""
              return _short_date(raw, ordinal=ordinal, population="listed", field="expiry date")
          '''
          if text.count(helper_anchor) != 1:
              raise RuntimeError('listed-status helper anchor drift')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          old_call = 'expiry_date = _short_date(expiry_raw, ordinal=ordinal, population="listed", field="expiry date")'
          new_call = 'expiry_date = _listed_expiry(expiry_raw, ordinal=ordinal, company=name)'
          if text.count(old_call) != 1:
              raise RuntimeError('listed expiry call anchor drift')
          text = text.replace(old_call, new_call, 1)

          diagnostics_anchor = '            "reviewed_special_outcomes": len(_EXPECTED_LISTED_SPECIAL),\n'
          diagnostics_replacement = diagnostics_anchor + '            "reviewed_noncalendar_expiries": len(_LISTED_NONCALENDAR_EXPIRY),\n'
          if text.count(diagnostics_anchor) != 1:
              raise RuntimeError('listed diagnostics anchor drift')
          text = text.replace(diagnostics_anchor, diagnostics_replacement, 1)

          parser.write_text(text, encoding='utf-8')
          PY
          python -m py_compile src/white_list_archive/parsers/napoli_tables.py
          git diff --check
          git diff -- src/white_list_archive/parsers/napoli_tables.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/white_list_archive/parsers/napoli_tables.py
          git diff --cached --quiet && { echo 'Expected Napoli parser patch was empty'; exit 1; }
          git commit -m 'Bind Napoli non-calendar expiry evidence'
          git push origin HEAD:expansion/napoli-2026-09-13
