name: Napoli row-bounds audit

on:
  push:
    branches:
      - 'expansion/napoli-2026-09-13'
    paths:
      - '.github/workflows/napoli-row-bounds-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install parser runtime
        run: python -m pip install -e '.[publication]'
      - name: Audit Napoli source outcomes and cross-border rows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/napoli_row_bounds
          curl --fail --location --silent --show-error --retry 2 --retry-all-errors \
            --user-agent 'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelist/1.0; +https://github.com/colazeta/italian-anti-mafia-whitelist)' \
            -o tmp/napoli_row_bounds/listed.pdf \
            'https://prefettura.interno.gov.it/sites/default/files/79/2026-09/whitelistprefnapoli_11_settembre_26.pdf'
          curl --fail --location --silent --show-error --retry 2 --retry-all-errors \
            --user-agent 'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelist/1.0; +https://github.com/colazeta/italian-anti-mafia-whitelist)' \
            -o tmp/napoli_row_bounds/applicants.pdf \
            'https://prefettura.interno.gov.it/sites/default/files/79/2026-09/ditterichiedenti_wl_11_settembre_26.pdf'
          test "$(stat -c %s tmp/napoli_row_bounds/listed.pdf)" = "3081398"
          test "$(stat -c %s tmp/napoli_row_bounds/applicants.pdf)" = "3566448"
          echo '93a8635c0bd9b00587f9cc60c52752061bd239a7c16cb34b64a11e495a0ab4be  tmp/napoli_row_bounds/listed.pdf' | sha256sum -c -
          echo '053be2500b07a7da536c344aede12084dde9b7cf28b4717af99764cbd05e7e6b  tmp/napoli_row_bounds/applicants.pdf' | sha256sum -c -
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json
          import re
          import pdfplumber

          ROOT = Path('tmp/napoli_row_bounds')
          SPECS = {
              'listed': {'pages': 60, 'terminal': 2259, 'width': 9},
              'applicants': {'pages': 215, 'terminal': 2571, 'width': 8},
          }
          TARGETS = {402, 403, 511, 512, 793, 794, 879, 880, 881, 1209, 1210, 1226, 1227, 1259, 1260}

          def clean(value):
              return re.sub(r'\s+', ' ', value or '').strip()

          def physical_rows(path, spec):
              rows = {}
              with pdfplumber.open(path) as pdf:
                  if len(pdf.pages) != spec['pages']:
                      raise RuntimeError(f'page drift {path.name}: {len(pdf.pages)} != {spec["pages"]}')
                  for page_number, page in enumerate(pdf.pages, start=1):
                      tables = page.find_tables()
                      if len(tables) != 1:
                          raise RuntimeError(f'{path.name} table-count drift p{page_number}: {len(tables)}')
                      table = tables[0]
                      extracted = table.extract() or []
                      if len(extracted) != len(table.rows):
                          raise RuntimeError(f'{path.name} extracted/physical row mismatch p{page_number}')
                      for row_index, raw in enumerate(extracted):
                          cells = [clean(value) for value in (raw or [])]
                          if not cells or not cells[0].isdigit():
                              continue
                          ordinal = int(cells[0])
                          if not (1 <= ordinal <= spec['terminal']):
                              continue
                          if len(cells) != spec['width']:
                              raise RuntimeError(f'{path.name} row-width drift p{page_number} #{ordinal}: {len(cells)}')
                          if ordinal in rows:
                              raise RuntimeError(f'{path.name} duplicate ordinal: {ordinal}')
                          physical = [cell for cell in table.rows[row_index].cells if cell is not None]
                          rows[ordinal] = {
                              'page': page_number,
                              'bounds': [round(min(float(c[1]) for c in physical), 3), round(max(float(c[3]) for c in physical), 3)],
                              'cells': cells,
                          }
              if sorted(rows) != list(range(1, spec['terminal'] + 1)):
                  missing = sorted(set(range(1, spec['terminal'] + 1)) - set(rows))
                  raise RuntimeError(f'{path.name} ordinal coverage drift: count={len(rows)} missing={missing[:20]}')
              return rows

          listed = physical_rows(ROOT / 'listed.pdf', SPECS['listed'])
          applicants = physical_rows(ROOT / 'applicants.pdf', SPECS['applicants'])

          listed_outcomes = Counter(item['cells'][8] for item in listed.values())
          listed_special = [
              {'ordinal': ordinal, 'page': item['page'], 'outcome': item['cells'][8]}
              for ordinal, item in listed.items()
              if item['cells'][8] and not item['cells'][8].casefold().startswith('iscrizione in aggiornamento')
          ]
          applicant_nonblank = [
              {'ordinal': ordinal, 'page': item['page'], 'outcome': item['cells'][7]}
              for ordinal, item in applicants.items() if item['cells'][7]
          ]

          # Exact source-positive continuation fragments already isolated by the physical-row audit.
          continuation_expectations = {
              512: 'provvedimento',
              880: 'provv. 399217 del',
              1260: 'ordinanza TAR',
          }
          for ordinal, expected in continuation_expectations.items():
              observed = applicants[ordinal]['cells'][7]
              if observed != expected:
                  raise RuntimeError(f'applicant continuation drift #{ordinal}: {observed!r} != {expected!r}')

          # The source places these prefixes across a horizontal border. Freeze the exact observed cells;
          # production parsing must reassign them only through explicit reviewed bindings.
          company_expectations = {
              793: 'ECOLOGIA LA VESUVIANA',
              794: "S.R.L. ECOLOGIA SAN VINCENZO S.A.S. DI MIELE EMILIA",
              1209: 'GENERAL COSTRUZIONI',
              1210: 'S.R.L. GENERAL SERVICE S.R.L.',
              1226: 'GESTIONE APPALTI E',
              1227: 'SERVIZI S.R.L.S. GESTIONE HOTEL S.R.L.',
          }
          for ordinal, expected in company_expectations.items():
              observed = applicants[ordinal]['cells'][1]
              if observed != expected:
                  raise RuntimeError(f'applicant company border drift #{ordinal}: {observed!r} != {expected!r}')

          # 402/403 were a midpoint-only false alarm: physical table ownership is already clean.
          if applicants[402]['cells'][1] != "CEM.AR. 86 - SOCIETA' COOPERATIVA DI PRODUZIONE E LAVORO A RESPON SABILITA' LIMITATA":
              raise RuntimeError('applicant physical ownership drift #402')
          if applicants[403]['cells'][1] != 'CEMENTI MOCCIA SPA':
              raise RuntimeError('applicant physical ownership drift #403')

          print('=== TARGET ROWS ===')
          print(json.dumps({str(k): applicants[k] for k in sorted(TARGETS)}, ensure_ascii=False, indent=2))
          print('=== APPLICANT NONBLANK OUTCOMES ===')
          print(json.dumps(applicant_nonblank, ensure_ascii=False, indent=2))
          print('=== LISTED SPECIAL OUTCOMES (excluding ordinary update prefix) ===')
          print(json.dumps(listed_special, ensure_ascii=False, indent=2))
          print('=== SUMMARY ===')
          print(json.dumps({
              'listed_records': len(listed),
              'applicant_records': len(applicants),
              'listed_outcome_nonblank': sum(v for key, v in listed_outcomes.items() if key),
              'listed_update_prefix': sum(v for key, v in listed_outcomes.items() if key.casefold().startswith('iscrizione in aggiornamento')),
              'listed_special_rows': len(listed_special),
              'applicant_nonblank_raw_rows': len(applicant_nonblank),
              'reviewed_applicant_continuation_rows': sorted(continuation_expectations),
              'reviewed_company_border_pairs': [[793, 794], [1209, 1210], [1226, 1227]],
              'midpoint_false_alarm_pair': [402, 403],
          }, ensure_ascii=False, indent=2))
          PY
