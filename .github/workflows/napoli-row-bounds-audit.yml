name: Napoli row-bounds audit

on:
  push:
    branches:
      - 'expansion/napoli-2026-09-13'
    paths:
      - '.github/workflows/napoli-row-bounds-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install parser runtime
        run: python -m pip install -e '.[publication]'
      - name: Fetch approved Napoli sources twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/napoli_date_binding
          ua='Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelist/1.0; +https://github.com/colazeta/italian-anti-mafia-whitelist)'
          listed='https://prefettura.interno.gov.it/sites/default/files/79/2026-09/whitelistprefnapoli_11_settembre_26.pdf'
          applicants='https://prefettura.interno.gov.it/sites/default/files/79/2026-09/ditterichiedenti_wl_11_settembre_26.pdf'
          for n in 1 2; do
            curl --fail --location --silent --show-error --retry 2 --retry-all-errors --user-agent "$ua" -o "tmp/napoli_date_binding/listed-$n.pdf" "$listed"
            curl --fail --location --silent --show-error --retry 2 --retry-all-errors --user-agent "$ua" -o "tmp/napoli_date_binding/applicants-$n.pdf" "$applicants"
          done
          cmp --silent tmp/napoli_date_binding/listed-1.pdf tmp/napoli_date_binding/listed-2.pdf
          cmp --silent tmp/napoli_date_binding/applicants-1.pdf tmp/napoli_date_binding/applicants-2.pdf
          test "$(stat -c %s tmp/napoli_date_binding/listed-1.pdf)" = '3081398'
          test "$(stat -c %s tmp/napoli_date_binding/applicants-1.pdf)" = '3566448'
          echo '93a8635c0bd9b00587f9cc60c52752061bd239a7c16cb34b64a11e495a0ab4be  tmp/napoli_date_binding/listed-1.pdf' | sha256sum -c -
          echo '053be2500b07a7da536c344aede12084dde9b7cf28b4717af99764cbd05e7e6b  tmp/napoli_date_binding/applicants-1.pdf' | sha256sum -c -
      - name: Apply exact reviewed date binding
        shell: bash
        run: |
          set -euo pipefail
          python tmp/napoli_date_binding.py \
            tmp/napoli_date_binding/listed-1.pdf \
            tmp/napoli_date_binding/applicants-1.pdf \
            src/white_list_archive/parsers/napoli_tables.py
      - name: Persist parser change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/white_list_archive/parsers/napoli_tables.py
          git diff --cached --quiet && exit 0
          git commit -m 'Bind reviewed Napoli date typography in parser'
          git push origin HEAD:expansion/napoli-2026-09-13
