name: Napoli row-bounds audit

on:
  push:
    branches:
      - 'expansion/napoli-2026-09-13'
    paths:
      - '.github/workflows/napoli-row-bounds-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install parser runtime
        run: python -m pip install -e '.[publication]'
      - name: Audit Napoli date typography exhaustively
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/napoli_row_bounds
          ua='Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelist/1.0; +https://github.com/colazeta/italian-anti-mafia-whitelist)'
          listed_url='https://prefettura.interno.gov.it/sites/default/files/79/2026-09/whitelistprefnapoli_11_settembre_26.pdf'
          applicants_url='https://prefettura.interno.gov.it/sites/default/files/79/2026-09/ditterichiedenti_wl_11_settembre_26.pdf'
          for copy in a b; do
            curl --fail --location --silent --show-error --retry 2 --retry-all-errors --user-agent "$ua" -o "tmp/napoli_row_bounds/listed_${copy}.pdf" "$listed_url"
            curl --fail --location --silent --show-error --retry 2 --retry-all-errors --user-agent "$ua" -o "tmp/napoli_row_bounds/applicants_${copy}.pdf" "$applicants_url"
            test "$(stat -c %s "tmp/napoli_row_bounds/listed_${copy}.pdf")" = "3081398"
            test "$(stat -c %s "tmp/napoli_row_bounds/applicants_${copy}.pdf")" = "3566448"
            echo "93a8635c0bd9b00587f9cc60c52752061bd239a7c16cb34b64a11e495a0ab4be  tmp/napoli_row_bounds/listed_${copy}.pdf" | sha256sum -c -
            echo "053be2500b07a7da536c344aede12084dde9b7cf28b4717af99764cbd05e7e6b  tmp/napoli_row_bounds/applicants_${copy}.pdf" | sha256sum -c -
          done
          cmp --silent tmp/napoli_row_bounds/listed_a.pdf tmp/napoli_row_bounds/listed_b.pdf
          cmp --silent tmp/napoli_row_bounds/applicants_a.pdf tmp/napoli_row_bounds/applicants_b.pdf
          python - <<'PY'
          from pathlib import Path
          from datetime import date
          import json
          import re
          import pdfplumber

          short = re.compile(r'^(\d{1,2})/(\d{1,2})/(\d{2})$')

          def clean(value):
              return re.sub(r'\s+', ' ', value or '').strip()

          def rows(path, *, pages, terminal, width, population):
              result = {}
              with pdfplumber.open(path) as pdf:
                  if len(pdf.pages) != pages:
                      raise RuntimeError(f'{population} page drift: {len(pdf.pages)} != {pages}')
                  for page_number, page in enumerate(pdf.pages, start=1):
                      tables = page.find_tables()
                      if len(tables) != 1:
                          raise RuntimeError(f'{population} table-count drift p{page_number}: {len(tables)}')
                      table = tables[0]
                      extracted = table.extract() or []
                      if len(extracted) != len(table.rows):
                          raise RuntimeError(f'{population} extracted/physical row mismatch p{page_number}')
                      for row_index, raw in enumerate(extracted, start=1):
                          if len(raw or []) != width:
                              raise RuntimeError(f'{population} width drift p{page_number} r{row_index}: {len(raw or [])}')
                          cells = [clean(v) for v in (raw or [])]
                          if not cells[0].isdigit():
                              continue
                          ordinal = int(cells[0])
                          if not 1 <= ordinal <= terminal:
                              raise RuntimeError(f'{population} unexpected ordinal p{page_number} r{row_index}: {ordinal}')
                          if ordinal in result:
                              raise RuntimeError(f'{population} duplicate ordinal: {ordinal}')
                          result[ordinal] = {'page': page_number, 'physical_row': row_index, 'cells': cells, 'raw': raw}
              if sorted(result) != list(range(1, terminal + 1)):
                  raise RuntimeError(f'{population} ordinal coverage drift')
              return result

          def classify_date(value):
              if not value:
                  return 'blank'
              match = short.fullmatch(value)
              if not match:
                  return 'non_short_typography'
              day, month, yy = (int(part) for part in match.groups())
              try:
                  date(2000 + yy, month, day)
              except ValueError:
                  return 'invalid_calendar_date'
              return 'valid_short_date'

          listed = rows(Path('tmp/napoli_row_bounds/listed_a.pdf'), pages=60, terminal=2259, width=9, population='listed')
          applicants = rows(Path('tmp/napoli_row_bounds/applicants_a.pdf'), pages=215, terminal=2571, width=8, population='applicants')

          payload = {'listed_listing_date': [], 'listed_expiry_date': [], 'applicant_application_date': []}
          specs = [
              ('listed_listing_date', listed, 6),
              ('listed_expiry_date', listed, 7),
              ('applicant_application_date', applicants, 6),
          ]
          for key, population_rows, index in specs:
              for ordinal, item in population_rows.items():
                  value = item['cells'][index]
                  classification = classify_date(value)
                  if classification in {'blank', 'valid_short_date'}:
                      continue
                  payload[key].append({
                      'ordinal': ordinal,
                      'page': item['page'],
                      'physical_row': item['physical_row'],
                      'company': item['cells'][1],
                      'identifier_raw': item['cells'][4],
                      'date_raw': (item['raw'] or [''] * len(item['cells']))[index] or '',
                      'date_clean': value,
                      'classification': classification,
                      'full_clean_row': item['cells'],
                      'previous_company': population_rows.get(ordinal - 1, {}).get('cells', ['', ''])[1] if ordinal > 1 else '',
                      'next_company': population_rows.get(ordinal + 1, {}).get('cells', ['', ''])[1] if ordinal < max(population_rows) else '',
                  })

          out = Path('tmp/napoli-date-anomalies.json')
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          print('LISTED_LISTING_DATE_ANOMALIES=', len(payload['listed_listing_date']))
          print('LISTED_EXPIRY_DATE_ANOMALIES=', len(payload['listed_expiry_date']))
          print('APPLICANT_APPLICATION_DATE_ANOMALIES=', len(payload['applicant_application_date']))
          if not payload['listed_listing_date']:
              raise RuntimeError('parser reported a listed listing-date anomaly but inventory is empty')
          PY
      - name: Persist bounded date audit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/napoli-date-anomalies.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Napoli date typography inventory'
          git push origin HEAD:expansion/napoli-2026-09-13
