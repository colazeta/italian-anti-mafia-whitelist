name: Napoli row-bounds audit

on:
  push:
    branches:
      - 'expansion/napoli-2026-09-13'
    paths:
      - '.github/workflows/napoli-row-bounds-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install parser runtime
        run: python -m pip install -e '.[publication]'
      - name: Capture unresolved Napoli applicant geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/napoli_row_bounds
          curl --fail --location --silent --show-error --retry 2 --retry-all-errors \
            --user-agent 'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelist/1.0; +https://github.com/colazeta/italian-anti-mafia-whitelist)' \
            -o tmp/napoli_row_bounds/applicants.pdf \
            'https://prefettura.interno.gov.it/sites/default/files/79/2026-09/ditterichiedenti_wl_11_settembre_26.pdf'
          test "$(stat -c %s tmp/napoli_row_bounds/applicants.pdf)" = "3566448"
          echo '053be2500b07a7da536c344aede12084dde9b7cf28b4717af99764cbd05e7e6b  tmp/napoli_row_bounds/applicants.pdf' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import pdfplumber

          pdf_path = Path('tmp/napoli_row_bounds/applicants.pdf')
          targets = {402, 403, 793, 794, 879, 880, 881, 1209, 1210, 1226, 1227}

          def clean(value):
              return re.sub(r'\s+', ' ', value or '').strip()

          def cell_ranges(table):
              for row in table.rows:
                  if len(row.cells) == 8 and all(cell is not None for cell in row.cells):
                      return [(float(cell[0]), float(cell[2])) for cell in row.cells]
              raise RuntimeError('no complete eight-column geometry')

          def row_bounds(row):
              cells = [cell for cell in row.cells if cell is not None]
              return min(float(cell[1]) for cell in cells), max(float(cell[3]) for cell in cells)

          def col_for(word, ranges):
              x = (float(word['x0']) + float(word['x1'])) / 2
              for index, (left, right) in enumerate(ranges):
                  if left - 0.5 <= x <= right + 0.5:
                      return index
              return None

          def join_words(words):
              if not words:
                  return ''
              lines = []
              for word in sorted(words, key=lambda item: (item['top'], item['x0'])):
                  y = float(word['top'])
                  if not lines or abs(y - lines[-1][0]) > 2.5:
                      lines.append([y, [word]])
                  else:
                      lines[-1][1].append(word)
              return clean(' '.join(
                  ' '.join(item['text'] for item in sorted(line_words, key=lambda item: item['x0']))
                  for _, line_words in lines
              ))

          report = {'source': {
              'bytes': pdf_path.stat().st_size,
              'sha256': '053be2500b07a7da536c344aede12084dde9b7cf28b4717af99764cbd05e7e6b',
          }, 'rows': {}, 'page74': {}}

          with pdfplumber.open(pdf_path) as pdf:
              if len(pdf.pages) != 215:
                  raise RuntimeError(f'page drift: {len(pdf.pages)} != 215')
              found = set()
              for page_number, page in enumerate(pdf.pages, start=1):
                  tables = page.find_tables()
                  if len(tables) != 1:
                      raise RuntimeError(f'table count p{page_number}: {len(tables)}')
                  table = tables[0]
                  extracted = table.extract() or []
                  if len(extracted) != len(table.rows):
                      raise RuntimeError(f'extracted/physical row mismatch p{page_number}')
                  ranges = cell_ranges(table)
                  words = page.extract_words(x_tolerance=1, y_tolerance=2, keep_blank_chars=False)

                  semantic = {}
                  for row_index, row in enumerate(extracted):
                      first = clean(row[0] if row else '')
                      if first.isdigit():
                          number = int(first)
                          if number in targets:
                              semantic[number] = row_index

                  for number, row_index in semantic.items():
                      top, bottom = row_bounds(table.rows[row_index])
                      physical = [[] for _ in range(8)]
                      for word in words:
                          column = col_for(word, ranges)
                          if column is None:
                              continue
                          y = (float(word['top']) + float(word['bottom'])) / 2
                          if top <= y <= bottom:
                              physical[column].append(word)
                      report['rows'][str(number)] = {
                          'page': page_number,
                          'top': round(top, 3),
                          'bottom': round(bottom, 3),
                          'table_extract': [clean(value) for value in extracted[row_index]],
                          'physical_cells': [join_words(bucket) for bucket in physical],
                          'company_words': [
                              {'text': w['text'], 'x0': round(float(w['x0']), 3), 'x1': round(float(w['x1']), 3),
                               'top': round(float(w['top']), 3), 'bottom': round(float(w['bottom']), 3)}
                              for w in sorted(physical[1], key=lambda item: (item['top'], item['x0']))
                          ],
                          'outcome_words': [
                              {'text': w['text'], 'x0': round(float(w['x0']), 3), 'x1': round(float(w['x1']), 3),
                               'top': round(float(w['top']), 3), 'bottom': round(float(w['bottom']), 3)}
                              for w in sorted(physical[7], key=lambda item: (item['top'], item['x0']))
                          ],
                      }
                      found.add(number)

                  if page_number == 74:
                      outcome_left, outcome_right = ranges[7]
                      report['page74'] = {
                          'width': round(float(page.width), 3),
                          'height': round(float(page.height), 3),
                          'outcome_x': [round(outcome_left, 3), round(outcome_right, 3)],
                          'full_text': page.extract_text(x_tolerance=1, y_tolerance=2) or '',
                          'outcome_words_all': [
                              {'text': w['text'], 'x0': round(float(w['x0']), 3), 'x1': round(float(w['x1']), 3),
                               'top': round(float(w['top']), 3), 'bottom': round(float(w['bottom']), 3)}
                              for w in words if col_for(w, ranges) == 7
                          ],
                      }

              if found != targets:
                  raise RuntimeError(f'target row coverage drift: found={sorted(found)} missing={sorted(targets-found)}')

          Path('tmp/napoli_row_bounds/report.json').write_text(
              json.dumps(report, indent=2, ensure_ascii=False), encoding='utf-8'
          )
          print(json.dumps({
              'rows': {key: {'page': value['page'], 'company': value['physical_cells'][1], 'outcome': value['physical_cells'][7]}
                       for key, value in report['rows'].items()},
              'page74_outcome_words': report['page74']['outcome_words_all'],
          }, indent=2, ensure_ascii=False))
          PY
      - name: Upload evidence probe
        uses: actions/upload-artifact@v4
        with:
          name: napoli-row-bounds-evidence
          path: tmp/napoli_row_bounds/report.json
          if-no-files-found: error
          retention-days: 7
