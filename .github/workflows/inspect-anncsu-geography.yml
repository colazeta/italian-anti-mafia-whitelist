name: Inspect ANNCSU geography sources

on:
  push:
    branches:
      - feature/geography-and-population-coverage
    paths:
      - '.github/workflows/inspect-anncsu-geography.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install xlsx reader
        run: python -m pip install openpyxl
      - name: Download official ANNCSU Calabria indirizzario
        run: |
          curl --fail --location --show-error \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36' \
            --referer 'https://www.anncsu.gov.it/it/consultazione-dellarchivio/open-data/Accedi-ai-servizi-di-dowload-massivo-in-Open-data/' \
            --header 'Accept: application/zip,application/octet-stream,*/*' \
            --header 'Accept-Language: it-IT,it;q=0.9,en;q=0.8' \
            --output /tmp/anncsu-calabria.zip \
            'https://anncsu.open.agenziaentrate.gov.it/age-inspire/opendata/anncsu/getds.php?INDIR_CALA='
          file /tmp/anncsu-calabria.zip
          ls -lh /tmp/anncsu-calabria.zip
      - name: Inspect ANNCSU file schema
        run: |
          python - <<'PY'
          import csv, io, zipfile
          from pathlib import Path
          data=Path('/tmp/anncsu-calabria.zip').read_bytes()
          z=zipfile.ZipFile(io.BytesIO(data)); print('ANNCSU members:',[(n,z.getinfo(n).file_size) for n in z.namelist()][:10])
          member=next(n for n in z.namelist() if n.lower().endswith(('.csv','.txt')))
          raw=z.read(member)
          encoding=None
          for enc in ('utf-8-sig','utf-8','cp1252','latin1'):
              try: text=raw[:500000].decode(enc); encoding=enc; break
              except UnicodeDecodeError: pass
          if encoding is None: raise SystemExit('Could not decode ANNCSU sample')
          sample='\n'.join(text.splitlines()[:10]); dialect=csv.Sniffer().sniff(sample,delimiters=';,|\t')
          reader=csv.reader(io.StringIO(text),dialect); rows=[next(reader) for _ in range(4)]
          print('ANNCSU encoding/delimiter:',encoding,repr(dialect.delimiter)); print('ANNCSU rows:',rows)
          PY
      - name: Inspect current ISTAT municipality workbook
        run: |
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          from openpyxl import load_workbook
          url='https://www.istat.it/storage/codici-unita-amministrative/Elenco-comuni-italiani.xlsx'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=120) as r: x=r.read(); print('ISTAT status/bytes:',r.status,len(x))
          p=Path('/tmp/comuni.xlsx'); p.write_bytes(x); wb=load_workbook(p,read_only=True,data_only=True); print('ISTAT sheets:',wb.sheetnames)
          ws=wb[wb.sheetnames[0]]
          for i,row in enumerate(ws.iter_rows(values_only=True),start=1):
              print('ISTAT row',i,row)
              if i>=10: break
          PY
