name: Fix and dispatch Asti bootstrap

on:
  push:
    branches:
      - expansion/asti-2026-09-10
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch-and-dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch audited bootstrap without weakening parser gates
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/asti-bootstrap.yml')
          text = path.read_text(encoding='utf-8')

          old = '''          def _header_bottom(table: Any) -> float:
              extracted = table.extract()
              for index, (row, cells) in enumerate(zip(table.rows, extracted)):
                  if index > 12:
                      break
                  folded_cells = [_clean(cell).casefold() for cell in cells]
                  if "italia" in folded_cells:
                      bounds = [cell for cell in row.cells if cell is not None]
                      if bounds:
                          return max(float(cell[3]) for cell in bounds)
              raise RuntimeError("Asti parser could not establish the ruled table header boundary")
'''
          new = '''          def _header_bottom(table: Any) -> float:
              extracted = table.extract()
              header_bottom: float | None = None
              header_markers = (
                  "ragione sociale",
                  "sede legale",
                  "sede secondaria",
                  "rappresentanza stabile",
                  "codice fiscale",
                  "partita iva",
                  "data di iscrizione",
                  "o di rinnovo",
                  "data scadenza",
                  "aggiornamento in corso",
                  "italia",
              )
              for row, cells in zip(table.rows, extracted):
                  cleaned = [_clean(cell) for cell in cells]
                  if any(_DATE.fullmatch(value) for value in cleaned if value):
                      break
                  folded = " ".join(value.casefold() for value in cleaned if value)
                  if any(marker in folded for marker in header_markers):
                      bounds = [cell for cell in row.cells if cell is not None]
                      if bounds:
                          header_bottom = max(float(cell[3]) for cell in bounds)
              if header_bottom is not None:
                  return header_bottom
              raise RuntimeError("Asti parser could not establish the ruled table header boundary before the first dated source row")
'''
          if text.count(old) != 1:
              raise SystemExit('expected Asti _header_bottom block was not found exactly once')
          text = text.replace(old, new)

          marker = "          cat > docs/sources/asti-operational-check-2026-09-10.md <<EOF\n"
          replacement = "          cat > docs/sources/asti-operational-check-2026-09-10.md <<'EOF'\n"
          if text.count(marker) != 1:
              raise SystemExit('expected documentation heredoc marker was not found exactly once')
          text = text.replace(marker, replacement)

          eof_anchor = "          EOF\n\n          rm -f .github/workflows/asti-parser-diagnostics.yml .github/workflows/asti-bootstrap.yml\n"
          eof_replacement = '''          EOF
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/sources/asti-operational-check-2026-09-10.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('${listed_count}', Path('/tmp/asti-listed-public-count.txt').read_text().strip())
          text = text.replace('${final_records}', Path('/tmp/asti-final-count.txt').read_text().strip())
          if '${' in text:
              raise SystemExit('unresolved Asti documentation placeholder')
          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/asti-parser-diagnostics.yml .github/workflows/asti-bootstrap.yml .github/workflows/asti-bootstrap-patcher.yml
'''
          if text.count(eof_anchor) != 1:
              raise SystemExit('expected documentation EOF anchor was not found exactly once')
          text = text.replace(eof_anchor, eof_replacement)
          path.write_text(text, encoding='utf-8')
      - name: Commit corrected bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/asti-bootstrap.yml
          git diff --cached --check
          git commit -m 'Harden Asti header-boundary detection'
          git push origin HEAD:expansion/asti-2026-09-10
      - name: Dispatch corrected bootstrap on the updated branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/asti-bootstrap.yml/dispatches \
            -d '{"ref":"expansion/asti-2026-09-10"}'
