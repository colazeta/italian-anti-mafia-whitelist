name: Frosinone national integration gate

on:
  push:
    branches:
      - expansion/frosinone-2026-09-13
    paths:
      - '.github/workflows/frosinone-national-integration.yml'
      - 'tmp/frosinone_national_integrate.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout full branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends poppler-utils; then
              break
            fi
            test "$attempt" -lt 3 || exit 1
            sleep $((attempt * 3))
          done
          python -m pip install --disable-pip-version-check -e '.[publication,database,storage]' pytest requests pdfplumber

      - name: Apply fail-closed Frosinone production transaction
        run: python tmp/frosinone_national_integrate.py

      - name: Run full repository test suite
        run: pytest -q

      - name: Build and validate national candidate with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2; do
            rm -rf /tmp/public-national-sources
            rm -f public-site/data/registry.json public-site/data/registry.csv public-site/data/prefectures.json public-site/data/prefectures.csv
            if white-list-public-national-build \
              --source-config data/publication/multi_prefecture_pilot.json \
              --verified-pages data/source_registry/verified_primary_pages.csv \
              --source-series data/source_registry/source_series_inventory.csv \
              --authority-aliases data/source_registry/national_index_authority_aliases.csv \
              --work-dir /tmp/public-national-sources \
              --registry-json public-site/data/registry.json \
              --registry-csv public-site/data/registry.csv \
              --prefectures-json public-site/data/prefectures.json \
              --prefectures-csv public-site/data/prefectures.csv; then
              ok=1
              break
            fi
            echo "National build attempt $attempt failed; one bounded retry is allowed for transient official-source errors." >&2
            sleep 5
          done
          test "$ok" -eq 1
          python -m white_list_archive.publishing.public_artifact public-site
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          root = Path('public-site/data')
          reg = json.loads((root / 'registry.json').read_text(encoding='utf-8'))
          pref = json.loads((root / 'prefectures.json').read_text(encoding='utf-8'))
          assert reg['meta']['record_count'] == 32543, reg['meta']['record_count']
          assert reg['meta']['authority_count'] == 33, reg['meta']['authority_count']
          assert reg['meta']['register_count'] == 34, reg['meta']['register_count']
          assert pref['meta']['published_count'] == 33, pref['meta']
          assert pref['meta']['mapped_count'] == 42, pref['meta']
          rows = [r for r in reg['records'] if r['authority_key'] == 'frosinone']
          assert len(rows) == 1236, len(rows)
          assert Counter(r['source_key'] for r in rows) == Counter({'frosinone-listed': 761, 'frosinone-applicants': 475})
          assert Counter(r['source_status'] for r in rows) == Counter({'listed': 529, 'renewal_update_in_progress': 232, 'pending': 475})
          fp = [p for p in pref['prefectures'] if p['authority_key'] == 'frosinone']
          assert len(fp) == 1 and fp[0]['mapped'] and fp[0]['published'] and fp[0]['series_count'] == 2, fp
          print('Frosinone national candidate validated:', reg['meta']['record_count'], pref['meta'])
          PY

      - name: Run desktop and mobile browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          python -m http.server 8765 --directory public-site > /tmp/public-preview-server.log 2>&1 &
          node tests/public_portal_browser.cjs

      - name: Commit validated non-workflow production candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/catalog.csv \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            data/source_registry/verified_primary_pages.csv \
            docs/sources/frosinone-operational-check-2026-09-13.md \
            src/white_list_archive/parsers/frosinone_tables.py \
            src/white_list_archive/publishing/public_national_registry.py \
            tests/public_portal_browser.cjs \
            tests/test_frosinone_parser_semantics.py \
            tests/test_source_population_coverage.py \
            tests/test_source_registry.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Integrate validated Frosinone public data"
          git fetch origin expansion/frosinone-2026-09-13
          git rebase origin/expansion/frosinone-2026-09-13
          echo "VALIDATED_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:expansion/frosinone-2026-09-13
