name: Potenza source validation

on:
  push:
    branches:
      - expansion/potenza-2026-09-15
    paths:
      - src/white_list_archive/parsers/potenza_webapp.py
      - tests/test_potenza_parser_semantics.py
      - docs/sources/potenza-operational-check-2026-09-15.md
      - .github/workflows/potenza-source-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-live-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and tests
        run: python -m pip install -e .[dev,database,storage]
      - name: Capture official Potenza endpoint twice
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.utgpotenza.it/data/vis_imprese.php?action=list&jtStartIndex=0&jtPageSize=2000&jtSorting=ragione_sociale%20ASC&cerca_ragione_sociale=&cerca_sede_legale=&cerca_stato_richiesta=0&cerca_sezione=0'
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 90 \
            --user-agent 'italian-anti-mafia-whitelist/0.1 (+source validation)' \
            "$URL" -o /tmp/potenza-1.json
          sleep 3
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 90 \
            --user-agent 'italian-anti-mafia-whitelist/0.1 (+source validation)' \
            "$URL" -o /tmp/potenza-2.json
      - name: Report unreviewed live status combinations
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          payload = json.loads(Path('/tmp/potenza-1.json').read_text(encoding='utf-8'))
          counts = Counter((str(r.get('stato_richiesta')), str(r.get('agg_incorso'))) for r in payload['Records'])
          print('status/update combinations:', dict(sorted(counts.items())))
          reviewed = {('1', '0'), ('2', '0'), ('2', '1')}
          for row in payload['Records']:
              combo = (str(row.get('stato_richiesta')), str(row.get('agg_incorso')))
              if combo not in reviewed:
                  print('UNREVIEWED_SOURCE_ROW=' + json.dumps(row, ensure_ascii=False, sort_keys=True))
          PY
      - name: Validate full public population and semantics
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from white_list_archive.parsers.potenza_webapp import parse_potenza_combined

          captures = [Path('/tmp/potenza-1.json'), Path('/tmp/potenza-2.json')]
          payloads = [json.loads(path.read_text(encoding='utf-8')) for path in captures]
          for payload in payloads:
              assert payload.get('Result') == 'OK'
              assert int(payload.get('TotalRecordCount')) == 1034
              assert len(payload.get('Records', [])) == 1034
          assert payloads[0]['Records'] == payloads[1]['Records'], 'independent live captures differ semantically'

          raw_hashes = [hashlib.sha256(path.read_bytes()).hexdigest() for path in captures]
          batches = []
          semantic_hashes = []
          for path, raw_sha in zip(captures, raw_hashes, strict=True):
              cfg = {
                  'source_key': 'potenza-combined',
                  'authority_key': 'potenza',
                  'authority_name': 'Prefettura di Potenza',
                  'register_key': 'potenza-ordinary',
                  'register_name': 'White List ordinaria',
                  'population_scope': 'listed_and_applicant',
                  'reference_date': '2026-09-15',
                  'source_page_url': 'https://prefettura.interno.gov.it/it/prefetture/potenza/white-list',
                  'resource_url': 'https://www.utgpotenza.it/data/vis_imprese.php?action=list&jtStartIndex=0&jtPageSize=2000&jtSorting=ragione_sociale%20ASC&cerca_ragione_sociale=&cerca_sede_legale=&cerca_stato_richiesta=0&cerca_sezione=0',
                  'sha256': raw_sha,
              }
              batch = parse_potenza_combined(path, cfg)
              assert batch.diagnostics['public_records'] == 1034
              assert batch.diagnostics['distinct_source_ids'] == 1034
              projected = [
                  {k: v for k, v in record.items() if k not in {'capture_sha256', 'parser_name', 'parser_version'}}
                  for record in batch.records
              ]
              semantic_payload = json.dumps(projected, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
              semantic_hashes.append(hashlib.sha256(semantic_payload).hexdigest())
              batches.append(batch)
          assert semantic_hashes[0] == semantic_hashes[1]
          assert batches[0].diagnostics == batches[1].diagnostics

          report = {
              'source_url': 'https://www.utgpotenza.it/_whitelist.php',
              'capture_sha256': raw_hashes,
              'semantic_sha256': semantic_hashes[0],
              'diagnostics': batches[0].diagnostics,
          }
          print(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True))
          PY
      - name: Run Potenza semantic tests
        run: pytest -q tests/test_potenza_parser_semantics.py
      - name: Run full repository tests
        run: pytest -q
