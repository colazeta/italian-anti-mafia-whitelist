name: Frosinone record audit

on:
  push:
    branches:
      - expansion/frosinone-2026-09-13
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit runtime
        run: python -m pip install --disable-pip-version-check requests pdfplumber

      - name: Audit normalised source rows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from collections import Counter
          from datetime import date
          from pathlib import Path

          import pdfplumber
          import requests

          LANDING = "https://prefettura.interno.gov.it/it/prefetture/frosinone/evidenza/white-list"
          SOURCES = {
              "listed": {
                  "url": "https://prefettura.interno.gov.it/sites/default/files/9/2026-09/elenco-societa-iscritte-white-list-al-2-settembre-2026-aggiornato.pdf",
                  "sha256": "aad166b49393055a197b9b1fef4eba82d0a70453a90d84209f967180d2855d71",
                  "pages": 91,
              },
              "applicants": {
                  "url": "https://prefettura.interno.gov.it/sites/default/files/9/2026-09/elenco-ric-iscr-white-list-aggiornato-al-2-settembre-2026-ordine-alfabetico-ok.pdf",
                  "sha256": "9906d55864f4c1dc8e027efa2b44fa2c6463c512fb34241a32aa9b21a5ba6db8",
                  "pages": 37,
              },
          }
          REQUEST_HEADERS = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36 whitelist-archive-record-audit/2.0",
              "Accept": "application/pdf,*/*;q=0.8",
              "Referer": LANDING,
          }
          STRICT_ID = re.compile(r"(?<![A-Za-z0-9])(?:\d{11}|[A-Za-z]{6}[0-9A-Za-z]{10})(?![A-Za-z0-9])")
          DATE = re.compile(r"^(\d{1,2})/(\d{1,2})/(\d{4})$")
          YEAR = re.compile(r"20\d{2}")
          ADMIN_ONLY = re.compile(r"^(?:n\.?\s*)?\d+$", re.I)

          def clean(value):
              return re.sub(r"\s+", " ", value or "").strip()

          def download(key, cfg):
              response = requests.get(cfg["url"], headers=REQUEST_HEADERS, timeout=(20, 120))
              response.raise_for_status()
              body = response.content
              digest = hashlib.sha256(body).hexdigest()
              if digest != cfg["sha256"]:
                  raise RuntimeError(f"{key} SHA drift: {digest} != {cfg['sha256']}")
              path = Path(f"tmp/frosinone_{key}.pdf")
              path.write_bytes(body)
              return path

          def is_header(row):
              folded = " | ".join(row).casefold()
              return (
                  ("denominaz" in folded and "codice fiscale" in folded)
                  or ("ragione sociale" in folded and "codice fiscale" in folded)
              )

          def strict_ids(raw):
              return list(dict.fromkeys(m.group(0).upper() for m in STRICT_ID.finditer(clean(raw))))

          def date_state(raw):
              value = clean(raw)
              if not value:
                  return "blank"
              m = DATE.fullmatch(value)
              if not m:
                  return "malformed"
              d, month, y = map(int, m.groups())
              try:
                  date(y, month, d)
              except ValueError:
                  return "malformed"
              return "valid"

          def semantic_listed(row):
              if len(row) < 7:
                  raise RuntimeError(f"listed row width below seven: {len(row)}: {row!r}")
              return row[:6] + [clean(" ".join(value for value in row[6:] if value))]

          def append_fragment(record, cells, *, page, table, row):
              before = list(record["cells"])
              for index, value in enumerate(cells):
                  if value:
                      record["cells"][index] = clean(f"{record['cells'][index]} {value}")
              event = {
                  "page": page,
                  "table": table,
                  "row": row,
                  "fragment": cells,
                  "before_name": before[0],
                  "after_name": record["cells"][0],
              }
              record["continuations"].append(event)
              return event

          # Listed population: the source uses seven semantic columns, with two
          # pages whose extraction geometry adds trailing split cells. Collapse
          # every row to the six fixed fields plus joined NOTE cells, then join
          # only rows that carry no independent identifier/date evidence.
          listed_path = download("listed", SOURCES["listed"])
          listed_records = []
          listed_admin_rows = []
          listed_boundary_fragments = []
          listed_blank_name_identity_rows = []
          listed_unresolved_rows = []
          with pdfplumber.open(listed_path) as pdf:
              if len(pdf.pages) != SOURCES["listed"]["pages"]:
                  raise RuntimeError("listed page-count drift")
              current = None
              for page_number, page in enumerate(pdf.pages, 1):
                  tables = page.extract_tables() or []
                  if len(tables) != 1:
                      raise RuntimeError(f"listed p{page_number}: expected one table, got {len(tables)}")
                  for row_number, raw in enumerate(tables[0] or [], 1):
                      raw_row = [clean(cell) for cell in (raw or [])]
                      if not any(raw_row) or is_header(raw_row):
                          continue
                      cells = semantic_listed(raw_row)
                      nonblank = [value for value in cells if value]
                      if not cells[0] and len(nonblank) == 1 and ADMIN_ONLY.fullmatch(nonblank[0]):
                          listed_admin_rows.append({"page": page_number, "row": row_number, "cells": cells})
                          continue
                      independent_evidence = bool(cells[2] or YEAR.search(cells[3]) or YEAR.search(cells[4]))
                      if cells[0] and independent_evidence:
                          current = {
                              "page": page_number,
                              "row": row_number,
                              "cells": cells,
                              "continuations": [],
                          }
                          listed_records.append(current)
                          continue
                      if not cells[0] and independent_evidence:
                          listed_blank_name_identity_rows.append({
                              "page": page_number, "row": row_number, "cells": cells,
                              "previous_name": current["cells"][0] if current else None,
                          })
                          current = None
                          continue
                      if current is not None and any(cells):
                          listed_boundary_fragments.append(
                              append_fragment(current, cells, page=page_number, table=1, row=row_number)
                          )
                          continue
                      listed_unresolved_rows.append({"page": page_number, "row": row_number, "cells": cells})

          listed_statuses = Counter()
          listed_other_notes = Counter()
          listed_identifier_cardinality = Counter()
          listed_malformed_dates = []
          listed_blank_sections = []
          for record in listed_records:
              cells = record["cells"]
              note = clean(cells[6])
              folded = note.casefold()
              if not note:
                  status = "listed"
              elif "aggiornamento in corso" in folded and "permanere" in folded:
                  status = "renewal_update_in_progress"
              else:
                  status = "listed_note"
                  listed_other_notes[note] += 1
              listed_statuses[status] += 1
              listed_identifier_cardinality[len(strict_ids(cells[2]))] += 1
              for label, raw_date in (("listing", cells[3]), ("expiry", cells[4])):
                  if date_state(raw_date) == "malformed":
                      listed_malformed_dates.append({
                          "page": record["page"], "row": record["row"], "field": label,
                          "value": raw_date, "name": cells[0],
                      })
              if not cells[5]:
                  listed_blank_sections.append({
                      "page": record["page"], "row": record["row"], "name": cells[0],
                      "identifier_raw": cells[2], "continuations": record["continuations"],
                  })

          # Applicant population: a company row is anchored by a nonblank legal
          # name plus identifier/application-date/outcome evidence. Other table
          # rows are joined to the immediately preceding company only when they
          # carry no independent date/outcome evidence; blank-name rows carrying
          # independent identifiers remain explicit review items.
          applicant_path = download("applicants", SOURCES["applicants"])
          applicant_records = []
          applicant_boundary_fragments = []
          applicant_blank_name_identity_rows = []
          applicant_unresolved_rows = []
          with pdfplumber.open(applicant_path) as pdf:
              if len(pdf.pages) != SOURCES["applicants"]["pages"]:
                  raise RuntimeError("applicant page-count drift")
              current = None
              for page_number, page in enumerate(pdf.pages, 1):
                  for table_number, table in enumerate(page.extract_tables() or [], 1):
                      for row_number, raw in enumerate(table or [], 1):
                          cells = [clean(cell) for cell in (raw or [])]
                          if not any(cells) or is_header(cells):
                              continue
                          if len(cells) != 7:
                              raise RuntimeError(
                                  f"applicant p{page_number}:t{table_number}:r{row_number} width drift: {len(cells)}"
                              )
                          independent_evidence = bool(cells[3] or cells[5] or cells[6])
                          if cells[0] and independent_evidence:
                              current = {
                                  "page": page_number,
                                  "table": table_number,
                                  "row": row_number,
                                  "cells": cells,
                                  "continuations": [],
                              }
                              applicant_records.append(current)
                              continue
                          if not cells[0] and independent_evidence:
                              applicant_blank_name_identity_rows.append({
                                  "page": page_number, "table": table_number, "row": row_number,
                                  "cells": cells,
                                  "previous_name": current["cells"][0] if current else None,
                              })
                              current = None
                              continue
                          if current is not None and any(cells):
                              applicant_boundary_fragments.append(
                                  append_fragment(
                                      current, cells, page=page_number, table=table_number, row=row_number
                                  )
                              )
                              continue
                          applicant_unresolved_rows.append({
                              "page": page_number, "table": table_number, "row": row_number, "cells": cells
                          })

          applicant_outcomes = Counter(clean(item["cells"][6]) for item in applicant_records)
          applicant_identifier_cardinality = Counter(len(strict_ids(item["cells"][3])) for item in applicant_records)
          applicant_malformed_dates = []
          applicant_blank_dates = []
          applicant_blank_sections = []
          applicant_blank_outcomes = []
          for item in applicant_records:
              cells = item["cells"]
              state = date_state(cells[5])
              locator = {
                  "page": item["page"], "table": item["table"], "row": item["row"],
                  "name": cells[0], "identifier_raw": cells[3],
              }
              if state == "malformed":
                  applicant_malformed_dates.append({**locator, "value": cells[5]})
              elif state == "blank":
                  applicant_blank_dates.append(locator)
              if not cells[4]:
                  applicant_blank_sections.append({**locator, "continuations": item["continuations"]})
              if not cells[6]:
                  applicant_blank_outcomes.append({**locator, "application_date": cells[5]})

          report = {
              "authority_key": "frosinone",
              "source_reference_date": "2026-09-02",
              "listed": {
                  "records": len(listed_records),
                  "status_counts": dict(listed_statuses),
                  "strict_identifier_cardinality": {str(k): v for k, v in sorted(listed_identifier_cardinality.items())},
                  "records_with_continuations": sum(bool(item["continuations"]) for item in listed_records),
                  "administrative_rows": listed_admin_rows,
                  "boundary_fragments": listed_boundary_fragments,
                  "blank_name_identity_rows": listed_blank_name_identity_rows,
                  "unresolved_rows": listed_unresolved_rows,
                  "other_note_values": dict(listed_other_notes),
                  "malformed_dates": listed_malformed_dates,
                  "blank_sections": listed_blank_sections,
              },
              "applicants": {
                  "records": len(applicant_records),
                  "outcome_counts": dict(applicant_outcomes),
                  "strict_identifier_cardinality": {str(k): v for k, v in sorted(applicant_identifier_cardinality.items())},
                  "records_with_continuations": sum(bool(item["continuations"]) for item in applicant_records),
                  "boundary_fragments": applicant_boundary_fragments,
                  "blank_name_identity_rows": applicant_blank_name_identity_rows,
                  "unresolved_rows": applicant_unresolved_rows,
                  "malformed_application_dates": applicant_malformed_dates,
                  "blank_application_dates": applicant_blank_dates,
                  "blank_sections": applicant_blank_sections,
                  "blank_outcomes": applicant_blank_outcomes,
              },
          }
          Path("tmp/frosinone_record_audit.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY

      - name: Checkpoint record audit
        shell: bash
        run: |
          set -euo pipefail
          rm -f tmp/frosinone_listed.pdf tmp/frosinone_applicants.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/frosinone_record_audit.json
          if git diff --cached --quiet; then
            echo "No record-audit change to checkpoint."
            exit 0
          fi
          git commit -m "Checkpoint Frosinone record audit"
          git push
