name: Fermo integration finalizer v2 2026-09-19

on:
  push:
    branches: [expansion/fermo-2026-09-19]
    paths:
      - .github/workflows/fermo-integration-finalizer-v2.yml
      - scripts/fermo_finalize.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify branch base and pre-finalization scope
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = expansion/fermo-2026-09-19
          git fetch origin main
          test "$(git rev-list --count HEAD..origin/main)" = 0
          bad=0
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/fermo-*|tmp/fermo-*|scripts/fermo_finalize.py|src/white_list_archive/parsers/fermo_openxml.py|tests/test_fermo_parser_semantics.py) ;;
              *) echo "Unexpected pre-finalization file: $f" >&2; bad=1 ;;
            esac
          done < <(git diff --name-only origin/main...HEAD)
          test "$bad" = 0
      - name: Install validation runtime
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y -qq --no-install-recommends poppler-utils antiword
          python -m pip install --disable-pip-version-check -e '.[dev,publication,database,storage]' requests beautifulsoup4 openpyxl
      - name: Materialise permanent integration
        run: |
          python scripts/fermo_finalize.py
          git diff --check
      - name: Reverify sources and parser boundary
        run: |
          set -euo pipefail
          mkdir -p /tmp/fermo-fresh
          python - <<'PY'
          import hashlib,time
          from pathlib import Path
          from urllib.parse import urlparse,parse_qsl,urlencode,urlunparse
          import requests
          from white_list_archive.parsers.fermo_openxml import parse_listed,parse_applicants
          landing='https://prefettura.interno.gov.it/it/prefetture/fermo/white-list-elenco-imprese-richiedenti-e-iscritte'
          specs=[
            ('listed','https://prefettura.interno.gov.it/sites/default/files/0/2026-05/imprese-iscritte-wl-22-maggio-2026_0.xlsx','2ed8f867c6ee477ec0af22a827ac0ccf54e4d483eec5de5fc27c812a0c31c6dd',parse_listed,174,{'listed':97,'renewal_update_in_progress':77},163),
            ('applicants','https://prefettura.interno.gov.it/sites/default/files/0/2026-05/imprese-richiedenti-iscrizione-wl-22-maggio-2026.xlsx','fa17e1f6676f84dc51e8abd1fd6e7627a1a2ed684a55c490708a06990e48676f',parse_applicants,75,{'pending':75},70),
          ]
          s=requests.Session(); headers={'User-Agent':'Mozilla/5.0 WhiteListEvidence/1.0','Cache-Control':'no-cache','Pragma':'no-cache','Referer':landing}
          lr=s.get(landing,headers=headers,timeout=45); lr.raise_for_status()
          for name,url,expected_sha,parser,n,statuses,ids in specs:
            bodies=[]
            for attempt in (1,2):
              p=urlparse(url); q=dict(parse_qsl(p.query,keep_blank_values=True)); q['_wl_verify']=f'{attempt}-{time.time_ns()}'
              r=s.get(urlunparse(p._replace(query=urlencode(q))),headers=headers,timeout=60); r.raise_for_status(); bodies.append(r.content)
            assert bodies[0]==bodies[1], f'{name}: independent captures differ'
            sha=hashlib.sha256(bodies[0]).hexdigest(); assert sha==expected_sha, (name,sha)
            path=Path('/tmp/fermo-fresh')/f'{name}.xlsx'; path.write_bytes(bodies[0])
            cfg={'source_key':f'fermo-{name if name=="listed" else "applicants"}','authority_key':'fermo','authority_name':'Prefettura di Fermo','register_key':'fermo-ordinary','register_name':'White List ordinaria','population_scope':'listed' if name=='listed' else 'applicant','reference_date':'2026-05-22','source_page_url':landing,'resource_url':url,'sha256':sha}
            batch=parser(path,cfg)
            assert len(batch.records)==n and batch.diagnostics['status_counts']==statuses and batch.diagnostics['identifier_coverage']==ids, batch.diagnostics
            print(name,sha,batch.diagnostics)
          PY
      - name: Run repository tests
        run: pytest -q
      - name: Build and validate national candidate
        run: |
          set -euo pipefail
          rm -rf /tmp/fermo-national
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/fermo-national \
            --registry-json /tmp/fermo-registry.json \
            --registry-csv /tmp/fermo-registry.csv \
            --prefectures-json /tmp/fermo-prefectures.json \
            --prefectures-csv /tmp/fermo-prefectures.csv
          python - <<'PY'
          import json
          reg=json.load(open('/tmp/fermo-registry.json'))
          pref=json.load(open('/tmp/fermo-prefectures.json'))
          assert reg['meta']['record_count']==64174, reg['meta']
          assert reg['meta']['authority_count']==58, reg['meta']
          assert reg['meta']['register_count']==60, reg['meta']
          assert pref['meta']['published_count']==58, pref['meta']
          assert pref['meta']['mapped_count']==58, pref['meta']
          rows=[r for r in reg['records'] if r['authority_key']=='fermo']
          assert len(rows)==249
          assert sum(r['source_status']=='listed' for r in rows)==97
          assert sum(r['source_status']=='renewal_update_in_progress' for r in rows)==77
          assert sum(r['source_status']=='pending' for r in rows)==75
          assert sum(bool(r['identifiers']) for r in rows)==233
          assert len({r['record_locator'] for r in rows})==249
          print('CANDIDATE',reg['meta']['record_count'],reg['meta']['authority_count'],reg['meta']['register_count'],pref['meta']['published_count'],pref['meta']['mapped_count'])
          PY
      - name: Commit permanent checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.csv data/monitoring/national_coverage.json data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv data/source_registry/verified_primary_pages.csv \
            docs/sources/fermo-operational-check-2026-09-19.md src/white_list_archive/parsers/fermo_openxml.py \
            src/white_list_archive/publishing/public_national_registry.py tests/public_portal_browser.cjs \
            tests/test_fermo_parser_semantics.py tests/test_source_population_coverage.py tests/test_source_registry.py
          git diff --cached --check
          git commit -m 'Integrate Fermo White List sources'
          git push origin HEAD:expansion/fermo-2026-09-19
      - name: Upload public-pages candidate
        uses: actions/upload-artifact@v4
        with:
          name: fermo-public-pages-candidate
          path: tmp/fermo-public-pages-candidate.yml
          if-no-files-found: error
          retention-days: 7
