name: Trapani exact office-variant patcher
on:
  push:
    branches: [expansion/trapani-2026-09-19]
    paths:
      - '.github/workflows/trapani-continuation-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/trapani-2026-09-19
          fetch-depth: 0
      - name: Apply exact fail-closed office variant model
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/white_list_archive/parsers/trapani_tables.py')
          s = p.read_text(encoding='utf-8')
          anchor = '''_LISTED_NAME_VARIANT_NORMALISATIONS = {\n'''
          if anchor not in s:
              raise SystemExit('name-variant anchor drift')
          marker = '''_LISTED_OFFICE_VARIANT_NORMALISATIONS = {\n    "GCCNDR95R07D423B": {\n        "source_variants": ["SA LEMI", "SALEMI"],\n        "canonical": "SALEMI",\n    },\n}\n'''
          if '_LISTED_OFFICE_VARIANT_NORMALISATIONS =' not in s:
              end_anchor = '''    },\n}\n\n_APPLICANT_CONTINUATIONS = {\n'''
              if s.count(end_anchor) != 1:
                  raise SystemExit('office-variant insertion anchor drift')
              s = s.replace(end_anchor, '''    },\n}\n\n''' + marker + '''\n_APPLICANT_CONTINUATIONS = {\n''', 1)

          old = '''        office_variants = _ordered_unique([row["office"] for row in rows if row["office"]])\n        secondary_variants = _ordered_unique([row["secondary"] for row in rows if row["secondary"]])\n        if len(office_variants) > 1 or len(secondary_variants) > 1:\n            raise RuntimeError(\n                f"Trapani listed office drift within identifier {identifier}: "\n                f"{office_variants!r} / {secondary_variants!r}"\n            )\n'''
          new = '''        office_variants = _ordered_unique([row["office"] for row in rows if row["office"]])\n        office_normalisation = _LISTED_OFFICE_VARIANT_NORMALISATIONS.get(identifier)\n        if office_normalisation is None:\n            if len(office_variants) > 1:\n                raise RuntimeError(\n                    f"Trapani listed office drift within identifier {identifier}: {office_variants!r}"\n                )\n            output_office = office_variants[0] if office_variants else ""\n        else:\n            if office_variants != office_normalisation["source_variants"]:\n                raise RuntimeError(\n                    f"Trapani approved office-variant evidence drift for {identifier}: {office_variants!r}"\n                )\n            output_office = office_normalisation["canonical"]\n        secondary_variants = _ordered_unique([row["secondary"] for row in rows if row["secondary"]])\n        if len(secondary_variants) > 1:\n            raise RuntimeError(\n                f"Trapani listed secondary-office drift within identifier {identifier}: {secondary_variants!r}"\n            )\n'''
          if 'office_normalisation = _LISTED_OFFICE_VARIANT_NORMALISATIONS.get(identifier)' not in s:
              if s.count(old) != 1:
                  raise SystemExit('office grouping anchor drift')
              s = s.replace(old, new, 1)
          old_output = '                office=office_variants[0] if office_variants else "",\n'
          new_output = '                office=output_office,\n'
          if old_output in s:
              if s.count(old_output) != 1:
                  raise SystemExit('office output anchor multiplicity drift')
              s = s.replace(old_output, new_output, 1)
          elif new_output not in s:
              raise SystemExit('office output anchor drift')
          p.write_text(s, encoding='utf-8')
          PY
          python -m compileall -q src/white_list_archive/parsers/trapani_tables.py
          git diff --check
      - name: Commit exact office evidence handling
        run: |
          if git diff --quiet -- src/white_list_archive/parsers/trapani_tables.py; then
            echo 'No parser change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/white_list_archive/parsers/trapani_tables.py
          git commit -m 'Preserve Trapani exact office-variant evidence'
          git push origin HEAD:expansion/trapani-2026-09-19
