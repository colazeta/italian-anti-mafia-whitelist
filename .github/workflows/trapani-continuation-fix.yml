name: Trapani exact name-variant patcher
on:
  push:
    branches: [expansion/trapani-2026-09-19]
    paths:
      - '.github/workflows/trapani-continuation-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/trapani-2026-09-19
          fetch-depth: 0
      - name: Apply exact fail-closed name-variant model
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/white_list_archive/parsers/trapani_tables.py')
          s = p.read_text(encoding='utf-8')

          const_anchor = '''_LISTED_JUDICIAL_ADMINISTRATION_EXPIRY = "In amministrazio ne giudiziaria e fermo restando fino al permanere della stessa"\n'''
          const_repl = const_anchor + '''_LISTED_NAME_VARIANT_NORMALISATIONS = {\n    "02483290819": {\n        "source_variants": [\n            "STRADE E SERVIZI S.R.L. UNIPERSONALE",\n            "STRADE E SERVIZI S.R.L.UNIPERSONALE",\n        ],\n        "canonical": "STRADE E SERVIZI S.R.L. UNIPERSONALE",\n    },\n}\n'''
          if '_LISTED_NAME_VARIANT_NORMALISATIONS =' not in s:
              if s.count(const_anchor) != 1:
                  raise SystemExit('Trapani name-variant constant anchor drift')
              s = s.replace(const_anchor, const_repl, 1)

          old = '''        name_variants = _ordered_unique([row["name"] for row in rows])\n        if len(name_variants) != 1:\n            raise RuntimeError(f"Trapani listed name drift within identifier {identifier}: {name_variants!r}")\n        office_variants = _ordered_unique([row["office"] for row in rows if row["office"]])\n'''
          new = '''        name_variants = _ordered_unique([row["name"] for row in rows])\n        normalisation = _LISTED_NAME_VARIANT_NORMALISATIONS.get(identifier)\n        if normalisation is None:\n            if len(name_variants) != 1:\n                raise RuntimeError(f"Trapani listed name drift within identifier {identifier}: {name_variants!r}")\n            output_name = name_variants[0]\n        else:\n            if name_variants != normalisation["source_variants"]:\n                raise RuntimeError(\n                    f"Trapani approved name-variant evidence drift for {identifier}: {name_variants!r}"\n                )\n            output_name = normalisation["canonical"]\n        office_variants = _ordered_unique([row["office"] for row in rows if row["office"]])\n'''
          if 'normalisation = _LISTED_NAME_VARIANT_NORMALISATIONS.get(identifier)' not in s:
              if s.count(old) != 1:
                  raise SystemExit('Trapani name-variant grouping anchor drift')
              s = s.replace(old, new, 1)

          old_name = '                name=name_variants[0],\n'
          new_name = '                name=output_name,\n'
          if old_name in s:
              if s.count(old_name) != 1:
                  raise SystemExit('Trapani output-name anchor multiplicity drift')
              s = s.replace(old_name, new_name, 1)
          elif new_name not in s:
              raise SystemExit('Trapani output-name anchor drift')

          p.write_text(s, encoding='utf-8')
          PY
          python -m compileall -q src/white_list_archive/parsers/trapani_tables.py
          git diff --check
      - name: Commit exact parser evidence handling
        run: |
          if git diff --quiet -- src/white_list_archive/parsers/trapani_tables.py; then
            echo 'No parser change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/white_list_archive/parsers/trapani_tables.py
          git commit -m 'Preserve Trapani exact name-variant evidence'
          git push origin HEAD:expansion/trapani-2026-09-19
