name: Trapani evidence patcher
on:
  push:
    branches: [expansion/trapani-2026-09-19]
    paths:
      - '.github/workflows/trapani-continuation-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/trapani-2026-09-19
          fetch-depth: 0
      - name: Apply exact fail-closed non-date expiry model
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/white_list_archive/parsers/trapani_tables.py')
          s=p.read_text(encoding='utf-8')

          const_anchor='''_LISTED_HEADER_FRAGMENT = (\n    (34, 1, 1),\n    ["", "", "CON RAPPRESENTANZA STABILE IN ITALIA", "PARTITA IVA", "ISCRIZIONE", "SCADENZA ISCRIZIONE", "IN CORSO"],\n)\n'''
          const_repl=const_anchor + '''_LISTED_JUDICIAL_ADMINISTRATION_EXPIRY = "In amministrazio ne giudiziaria e fermo restando fino al permanere della stessa"\n'''
          if '_LISTED_JUDICIAL_ADMINISTRATION_EXPIRY =' not in s:
              if s.count(const_anchor) != 1:
                  raise SystemExit('Trapani expiry-constant anchor drift')
              s=s.replace(const_anchor,const_repl,1)

          state_anchor='''    records: list[dict[str, Any]] = []\n    for identifier, rows in grouped.items():\n'''
          state_repl='''    records: list[dict[str, Any]] = []\n    non_date_expiry_records = 0\n    for identifier, rows in grouped.items():\n'''
          if 'non_date_expiry_records = 0' not in s:
              if s.count(state_anchor) != 1:
                  raise SystemExit('Trapani expiry-state anchor drift')
              s=s.replace(state_anchor,state_repl,1)

          old='''        valid_listing_dates = _ordered_unique([value for raw in listing_raw_variants if (value := _strict_date(raw))])\n        valid_expiry_dates = _ordered_unique([value for raw in expiry_raw_variants if (value := _strict_date(raw))])\n        if len(valid_listing_dates) != 1 or len(valid_expiry_dates) != 1:\n            raise RuntimeError(\n                f"Trapani listed date evidence drift for {identifier}: listing={listing_raw_variants!r}, expiry={expiry_raw_variants!r}"\n            )\n        markers = [row["update_raw"] for row in rows]\n'''
          new='''        valid_listing_dates = _ordered_unique([value for raw in listing_raw_variants if (value := _strict_date(raw))])\n        valid_expiry_dates = _ordered_unique([value for raw in expiry_raw_variants if (value := _strict_date(raw))])\n        if len(valid_listing_dates) != 1:\n            raise RuntimeError(\n                f"Trapani listed listing-date evidence drift for {identifier}: {listing_raw_variants!r}"\n            )\n        expiry_date = ""\n        if len(valid_expiry_dates) == 1:\n            expiry_date = valid_expiry_dates[0]\n        elif not valid_expiry_dates and expiry_raw_variants == [_LISTED_JUDICIAL_ADMINISTRATION_EXPIRY]:\n            expected = {\n                "rows": 1,\n                "pages": [8],\n                "names": ["CALCESTRUZZI DI ROMANO ALESSANDRO"],\n                "listing_raw": ["30/08/2017"],\n                "updates": [""],\n            }\n            observed = {\n                "rows": len(rows),\n                "pages": _ordered_unique([str(row["page"]) for row in rows]),\n                "names": name_variants,\n                "listing_raw": listing_raw_variants,\n                "updates": [row["update_raw"] for row in rows],\n            }\n            # Keep the source legal/status text verbatim in provenance. It is not a\n            # date and must never be repaired or converted into an expiry date.\n            if observed != {**expected, "pages": [str(value) for value in expected["pages"]]}:\n                raise RuntimeError(f"Trapani judicial-administration expiry evidence drift: {observed!r}")\n            non_date_expiry_records += 1\n        else:\n            raise RuntimeError(\n                f"Trapani listed expiry-date evidence drift for {identifier}: {expiry_raw_variants!r}"\n            )\n        markers = [row["update_raw"] for row in rows]\n'''
          if old not in s:
              raise SystemExit('Trapani date-evidence block anchor drift')
          s=s.replace(old,new,1)
          if 'expiry_date=valid_expiry_dates[0],' in s:
              s=s.replace('expiry_date=valid_expiry_dates[0],','expiry_date=expiry_date,',1)
          else:
              raise SystemExit('Trapani expiry output anchor drift')

          diag_anchor='''    status_counts = dict(Counter(record["source_status"] for record in records))\n    if status_counts != {"listed": 177, "renewal_update_in_progress": 156}:\n'''
          diag_repl='''    if non_date_expiry_records != 1:\n        raise RuntimeError(f"Trapani non-date expiry record-count drift: {non_date_expiry_records}")\n    status_counts = dict(Counter(record["source_status"] for record in records))\n    if status_counts != {"listed": 177, "renewal_update_in_progress": 156}:\n'''
          if 'Trapani non-date expiry record-count drift' not in s:
              if s.count(diag_anchor) != 1:
                  raise SystemExit('Trapani expiry-diagnostic anchor drift')
              s=s.replace(diag_anchor,diag_repl,1)
          if '"non_date_expiry_records": non_date_expiry_records,' not in s:
              s=s.replace('''        "split_header_fragments": header_fragments,\n''','''        "split_header_fragments": header_fragments,\n        "non_date_expiry_records": non_date_expiry_records,\n''',1)

          p.write_text(s,encoding='utf-8')
          PY
          python -m compileall -q src/white_list_archive/parsers/trapani_tables.py
          git diff --check
      - name: Commit exact parser evidence handling
        run: |
          if git diff --quiet -- src/white_list_archive/parsers/trapani_tables.py; then
            echo 'No parser change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/white_list_archive/parsers/trapani_tables.py
          git commit -m 'Preserve Trapani non-date expiry evidence'
          git push origin HEAD:expansion/trapani-2026-09-19
