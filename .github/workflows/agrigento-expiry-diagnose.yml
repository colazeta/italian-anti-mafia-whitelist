name: Diagnose Agrigento expiry anomaly

on:
  push:
    branches:
      - expansion/agrigento-2026-09-10
    paths:
      - '.github/workflows/agrigento-expiry-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/agrigento-2026-09-10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[publication]'
      - name: Print exact listed diagnostics
        run: |
          python - <<'PY'
          import hashlib, tempfile
          from pathlib import Path
          from urllib.request import Request, urlopen
          from white_list_archive.parsers.agrigento_positioned import PARSERS

          cfg = {
              'source_key':'agrigento-listed','parser':'agrigento_listed','authority_key':'agrigento','authority_name':'Prefettura di Agrigento','register_key':'agrigento-ordinary','register_name':'White List ordinaria','population_scope':'listed','reference_date':'2026-09-04','source_page_url':'https://prefettura.interno.gov.it/it/prefetture/agrigento/evidenza/white-list','resource_url':'https://prefettura.interno.gov.it/sites/default/files/100/2026-09/elenco-iscritte-4-settembre-2026.pdf','sha256':'23ceb5785bb39ca2da2eef5a80ad0468b03a191ad2cc36c571524587dbafca81'
          }
          req=Request(cfg['resource_url'],headers={'User-Agent':'italian-anti-mafia-whitelist/0.1 (+Agrigento diagnosis)'})
          with urlopen(req,timeout=90) as response:
              body=response.read()
          print('sha256=',hashlib.sha256(body).hexdigest())
          assert hashlib.sha256(body).hexdigest()==cfg['sha256']
          with tempfile.TemporaryDirectory() as td:
              path=Path(td)/'listed.pdf'; path.write_bytes(body)
              batch=PARSERS['agrigento_listed'](path,cfg)
              print('count=',len(batch.records))
              print('diagnostics=',repr(batch.diagnostics))
          PY
