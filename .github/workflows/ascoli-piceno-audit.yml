name: Ascoli Piceno source audit

on:
  workflow_dispatch:
  push:
    branches:
      - expansion/ascoli-piceno-2026-09-10
    paths:
      - .github/workflows/ascoli-piceno-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publication runtime
        run: python -m pip install -e '.[publication]'
      - name: Resolve and inspect current official sources
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          from pathlib import Path
          import hashlib, re, pdfplumber

          landing = 'https://prefettura.interno.gov.it/it/prefetture/ascoli-piceno/elenco-iscritti-white-list'
          headers = {'User-Agent': 'Mozilla/5.0 (compatible; italian-anti-mafia-whitelist/1.0; +https://github.com/colazeta/italian-anti-mafia-whitelist)'}

          def get(url):
              req = Request(url, headers=headers)
              with urlopen(req, timeout=45) as r:
                  body = r.read()
                  print('HTTP', r.status, url, 'bytes', len(body), 'sha256', hashlib.sha256(body).hexdigest())
                  return body

          html = get(landing).decode('utf-8', errors='replace')
          print('PAGE TITLE/DATE CONTEXT')
          for line in re.sub(r'<[^>]+>', ' ', html).splitlines():
              s = ' '.join(line.split())
              if s and ('Aggiorn' in s or '2026' in s or 'White List' in s):
                  print(s[:500])

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      a=dict(attrs); href=a.get('href')
                      if href: self.links.append(href)
          p=Links(); p.feed(html)
          links=[]
          for href in p.links:
              u=urljoin(landing, href)
              if '.pdf' in u.lower() and u not in links: links.append(u)
          print('PDF LINKS', len(links))
          for u in links: print(u)

          def pick(pattern):
              matches=[u for u in links if re.search(pattern, u, re.I)]
              if not matches: raise SystemExit('No match for '+pattern)
              return matches[-1]

          listed = pick(r'elenco-degli-iscritti\.pdf')
          applicants = pick(r'elenco-dei-richiedenti.*iscrizione\.pdf')
          for label, url in [('listed',listed),('applicants',applicants)]:
              data=get(url); path=Path('/tmp')/f'{label}.pdf'; path.write_bytes(data)
              print('SOURCE', label, url, hashlib.sha256(data).hexdigest())
              with pdfplumber.open(path) as pdf:
                  print('PAGES', label, len(pdf.pages))
                  text='\n'.join((page.extract_text(x_tolerance=2, y_tolerance=3) or '') for page in pdf.pages)
              lines=[x.rstrip() for x in text.splitlines() if x.strip()]
              print('TEXT SAMPLE BEGIN', label)
              for x in lines[:180]: print(x[:1000])
              print('TEXT SAMPLE END', label, 'nonblank_lines', len(lines))
          PY
