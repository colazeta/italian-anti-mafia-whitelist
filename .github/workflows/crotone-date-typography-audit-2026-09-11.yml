name: Crotone date typography audit 2026-09-11

on:
  push:
    branches: [expansion/crotone-2026-09-11]
    paths: [.github/workflows/crotone-date-typography-audit-2026-09-11.yml]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/crotone-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[publication]'
      - name: Enumerate every nonblank date value rejected by the strict parser
        run: |
          python - <<'PY'
          import hashlib
          from collections import Counter
          from pathlib import Path
          from urllib.request import Request,urlopen
          import pdfplumber
          from white_list_archive.parsers.crotone_tables import _clean, _is_header, _parse_date, _parse_expiry

          url='https://prefettura.interno.gov.it/sites/default/files/0/2026-09/ditte-iscritte-white-list-2.pdf'
          sha='c9a2774c5842b895cd0bb18be3fe30a0c8858b2d67e985a993983e1834f0d511'
          with urlopen(Request(url,headers={'User-Agent':'italian-anti-mafia-whitelist/0.1 (+date typography audit)','Accept':'application/pdf,*/*'}),timeout=90) as r:
              body=r.read()
          assert hashlib.sha256(body).hexdigest()==sha
          path=Path('/tmp/crotone-listed.pdf'); path.write_bytes(body)
          rejected_listing=Counter(); rejected_expiry=Counter()
          with pdfplumber.open(path) as pdf:
              for page in pdf.pages:
                  for table in page.extract_tables() or []:
                      for row in table or []:
                          cells=[_clean(c) for c in row]
                          if not any(cells) or len(cells)!=6 or _is_header(cells):
                              continue
                          if cells[3]:
                              try: _parse_date(cells[3])
                              except RuntimeError: rejected_listing[cells[3]] += 1
                          if cells[4]:
                              try: _parse_expiry(cells[4])
                              except RuntimeError: rejected_expiry[cells[4]] += 1
          print('REJECTED_LISTING',dict(rejected_listing))
          print('REJECTED_EXPIRY',dict(rejected_expiry))
          PY
