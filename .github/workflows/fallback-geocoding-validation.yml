name: Fallback geocoding validation

on:
  pull_request:
    paths:
      - 'src/white_list_archive/geocoding/fallback.py'
      - 'src/white_list_archive/geocoding/nominatim.py'
      - 'src/white_list_archive/geocoding/pipeline.py'
      - 'db/schema/059_address_normalisation.sql'
      - 'db/schema/062_fallback_geocoding.sql'
      - 'db/schema/071_geo_views.sql'
      - 'db/apply.sql'
      - 'db/test.sql'
      - 'db/tests/011_fallback_geocoding.sql'
      - 'scripts/mock_nominatim_server.py'
      - 'scripts/validate_fallback_geocoding.py'
      - 'tests/test_fallback_geocoding.py'
      - 'tests/test_nominatim_provider.py'
      - 'pyproject.toml'
      - '.github/workflows/fallback-geocoding-validation.yml'
  push:
    branches: [main]
    paths:
      - 'src/white_list_archive/geocoding/fallback.py'
      - 'src/white_list_archive/geocoding/nominatim.py'
      - 'src/white_list_archive/geocoding/pipeline.py'
      - 'db/schema/059_address_normalisation.sql'
      - 'db/schema/062_fallback_geocoding.sql'
      - 'db/schema/071_geo_views.sql'
      - 'db/apply.sql'
      - 'db/test.sql'
      - 'db/tests/011_fallback_geocoding.sql'
      - 'scripts/mock_nominatim_server.py'
      - 'scripts/validate_fallback_geocoding.py'
      - 'tests/test_fallback_geocoding.py'
      - 'tests/test_nominatim_provider.py'
      - 'pyproject.toml'
      - '.github/workflows/fallback-geocoding-validation.yml'
  workflow_dispatch:

concurrency:
  group: fallback-geocoding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-endpoint-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: whitelist
          POSTGRES_USER: whitelist
          POSTGRES_PASSWORD: whitelist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whitelist -d whitelist"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      PGPASSWORD: whitelist
      TEST_DSN: postgresql://whitelist:whitelist@localhost:5432/whitelist
      MOCK_ENDPOINT: http://127.0.0.1:8765

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install project and test dependencies
        run: |
          python -m pip install -e '.[dev,database]'
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          pytest -q tests/test_fallback_geocoding.py tests/test_nominatim_provider.py

      - name: Apply database schema and integrity tests
        run: |
          psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -f db/apply.sql
          psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -f db/test.sql

      - name: Start deterministic managed Nominatim-compatible endpoint
        run: |
          mkdir -p artifacts/fallback-geocoding
          printf 'mock-v1\n' > artifacts/fallback-geocoding/provider-version.txt
          : > artifacts/fallback-geocoding/request-log.jsonl
          nohup python scripts/mock_nominatim_server.py \
            --version-file artifacts/fallback-geocoding/provider-version.txt \
            --log-file artifacts/fallback-geocoding/request-log.jsonl \
            > artifacts/fallback-geocoding/mock-server.log 2>&1 &
          echo $! > artifacts/fallback-geocoding/mock-server.pid
          python - <<'PY'
          import json, time, urllib.request
          url='http://127.0.0.1:8765/status?format=json'
          for _ in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=1) as r:
                      payload=json.load(r)
                  if payload.get('status') == 0:
                      print(payload)
                      break
              except Exception:
                  time.sleep(.25)
          else:
              raise SystemExit('mock Nominatim-compatible endpoint did not become ready')
          PY

      - name: Validate multi-route incremental fallback orchestration
        run: |
          python scripts/validate_fallback_geocoding.py \
            --dsn "$TEST_DSN" \
            --endpoint "$MOCK_ENDPOINT" \
            --version-file artifacts/fallback-geocoding/provider-version.txt \
            --request-log artifacts/fallback-geocoding/request-log.jsonl \
            --artifact-dir artifacts/fallback-geocoding/verification \
            > artifacts/fallback-geocoding/validator-stdout.json

      - name: Assert production policy gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/fallback-geocoding/verification/verification-summary.json')
          x=json.loads(p.read_text())
          assert x['status']=='VERIFIED', x
          assert x['routing_reasons_tested']==['anncsu_not_found','source_foreign','country_unresolved'], x
          assert x['same_version_cache_reuse_verified'] is True
          assert x['new_address_incremental_refresh_verified'] is True
          assert x['provider_version_refresh_verified'] is True
          assert x['stale_fallback_expiration_verified'] is True
          assert x['public_osmf_used'] is False
          assert x['automatic_acceptance'] is False
          assert x['database']['accepted']==0
          print(json.dumps(x, indent=2))
          PY

      - name: Stop mock endpoint
        if: always()
        run: |
          if test -f artifacts/fallback-geocoding/mock-server.pid; then
            kill "$(cat artifacts/fallback-geocoding/mock-server.pid)" || true
          fi

      - name: Upload fallback validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fallback-geocoding-validation-attempt-${{ github.run_attempt }}
          path: artifacts/fallback-geocoding/
          if-no-files-found: error
          retention-days: 90
