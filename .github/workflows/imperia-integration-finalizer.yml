name: Imperia integration finalizer 2026-09-19

on:
  push:
    branches:
      - expansion/imperia-2026-09-19
    paths:
      - .github/workflows/imperia-integration-finalizer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify canonical base and Imperia-only pre-integration scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "expansion/imperia-2026-09-19"
          git fetch origin main --no-tags
          read -r behind ahead < <(git rev-list --left-right --count origin/main...HEAD)
          echo "main-only commits: $behind; branch-only commits: $ahead"
          test "$behind" -eq 0
          test "$ahead" -ge 1
          git diff --name-only origin/main...HEAD | sort > /tmp/imperia-pre-scope.txt
          cat /tmp/imperia-pre-scope.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              '.github/workflows/imperia-source-discovery.yml',
              '.github/workflows/imperia-parser-validation.yml',
              '.github/workflows/imperia-integration-finalizer.yml',
              'scripts/imperia_finalize.py',
              'src/white_list_archive/parsers/imperia_sources.py',
              'tests/test_imperia_parser_semantics.py',
              'tests/test_source_population_coverage.py',
              'tests/test_source_registry.py',
          }
          observed = {x for x in Path('/tmp/imperia-pre-scope.txt').read_text().splitlines() if x}
          extra = observed - allowed
          missing = {'src/white_list_archive/parsers/imperia_sources.py','tests/test_imperia_parser_semantics.py'} - observed
          if extra or missing:
              raise SystemExit(f'Unexpected pre-integration scope: extra={sorted(extra)}, missing={sorted(missing)}')
          PY

      - name: Install complete reviewed runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && \
               sudo apt-get install -y --no-install-recommends poppler-utils antiword; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Runtime package installation failed after bounded retries" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[dev,publication,database,storage]'

      - name: Materialise permanent Imperia integration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/imperia_finalize.py
          test -s tmp/imperia-public-pages-candidate.yml
          cp tmp/imperia-public-pages-candidate.yml /tmp/imperia-public-pages-candidate.yml

      - name: Validate source parser again on exact approved bytes
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/test_imperia_parser_semantics.py
          mkdir -p /tmp/imperia-source-revalidation
          python - <<'PY'
          import hashlib, json, time
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from white_list_archive.parsers.imperia_sources import PARSERS

          specs = {
              'listed': {
                  'url':'https://prefettura.interno.gov.it/sites/default/files/46/2026-09/elenco-ditte-iscritte-white-list_3.xlsx',
                  'sha':'9716cf0571946f5e39d90b177c41e7919957eb88adb71cf22fd928b73c615a3f','bytes':86337,'ext':'.xlsx',
                  'parser':'imperia_listed','source_key':'imperia-listed','population_scope':'listed',
              },
              'applicants': {
                  'url':'https://prefettura.interno.gov.it/sites/default/files/46/2026-08/elenco-delle-ditte-che-hanno-presentato-istanza-di-iscrizione-nelle-white-lists_2.doc',
                  'sha':'e1c93ece7e919e1b3f7c6cf2cd399e7585bcef5e7713876b0a9662de642b60f9','bytes':635392,'ext':'.doc',
                  'parser':'imperia_applicants','source_key':'imperia-applicants','population_scope':'applicant',
              },
          }
          report = {}
          for label, spec in specs.items():
              copies=[]; first=None
              for attempt in range(2):
                  sep='&' if '?' in spec['url'] else '?'
                  req=Request(spec['url']+sep+urlencode({'_wlarchive_nocache':f'{int(time.time())}-{attempt}'}), headers={
                      'User-Agent':'Mozilla/5.0 WhiteListArchive/1.0','Cache-Control':'no-cache','Pragma':'no-cache'})
                  with urlopen(req, timeout=60) as response:
                      data=response.read(); final=response.geturl(); last=response.headers.get('Last-Modified')
                  digest=hashlib.sha256(data).hexdigest()
                  if digest != spec['sha'] or len(data) != spec['bytes']:
                      raise RuntimeError(f"{label}: official bytes changed: {digest}/{len(data)}")
                  path=Path('/tmp/imperia-source-revalidation')/f"{label}-{attempt}{spec['ext']}"; path.write_bytes(data)
                  if first is None: first=path
                  copies.append({'sha256':digest,'bytes':len(data),'final_url':final,'last_modified':last})
              if copies[0]['sha256'] != copies[1]['sha256']:
                  raise RuntimeError(f'{label}: independent acquisitions differ')
              cfg={
                  'authority_key':'imperia','authority_name':'Prefettura di Imperia','register_key':'imperia-ordinary',
                  'register_name':'White List ordinaria','reference_date':'2026-09-18',
                  'source_page_url':'https://prefettura.interno.gov.it/it/prefetture/imperia/evidenza/white-list',
                  'resource_url':spec['url'],'sha256':spec['sha'],'source_key':spec['source_key'],'population_scope':spec['population_scope'],
              }
              batch=PARSERS[spec['parser']](first,cfg)
              report[label]={'copies':copies,'diagnostics':batch.diagnostics,'records':len(batch.records)}
          assert report['listed']['records'] == 142
          assert report['listed']['diagnostics']['sector_rows'] == 246
          assert report['listed']['diagnostics']['status_counts'] == {'listed':105,'renewal_update_in_progress':37}
          assert report['listed']['diagnostics']['identifier_coverage'] == 131
          assert report['applicants']['records'] == 131
          assert report['applicants']['diagnostics']['status_counts'] == {'listed':117,'pending':6,'cancellation_related':5,'other_or_unknown':3}
          assert report['applicants']['diagnostics']['identifier_coverage'] == 126
          Path('/tmp/imperia-source-revalidation/report.json').write_text(json.dumps(report, indent=2, ensure_ascii=False),encoding='utf-8')
          PY

      - name: Remove temporary machinery from clean review worktree
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/imperia-source-discovery.yml \
            .github/workflows/imperia-parser-validation.yml \
            .github/workflows/imperia-integration-finalizer.yml \
            scripts/imperia_finalize.py
          rm -rf tmp
          test ! -e .github/workflows/imperia-source-discovery.yml
          test ! -e .github/workflows/imperia-parser-validation.yml
          test ! -e .github/workflows/imperia-integration-finalizer.yml
          test ! -e scripts/imperia_finalize.py

      - name: Run full repository tests on clean review scope
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee /tmp/imperia-pytest.log

      - name: Build and validate national Imperia candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/imperia-public-site /tmp/imperia-public-sources
          cp -a public-site /tmp/imperia-public-site
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/imperia-public-sources \
            --registry-json /tmp/imperia-public-site/data/registry.json \
            --registry-csv /tmp/imperia-public-site/data/registry.csv \
            --prefectures-json /tmp/imperia-public-site/data/prefectures.json \
            --prefectures-csv /tmp/imperia-public-site/data/prefectures.csv
          python -m white_list_archive.publishing.public_artifact /tmp/imperia-public-site
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/imperia-public-site/data')
          reg=json.loads((root/'registry.json').read_text(encoding='utf-8'))
          pref=json.loads((root/'prefectures.json').read_text(encoding='utf-8'))
          assert reg['meta']['record_count'] == 64865
          assert reg['meta']['authority_count'] == 60
          assert reg['meta']['register_count'] == 62
          assert pref['meta']['authority_count'] == 106
          assert pref['meta']['published_count'] == 60
          assert pref['meta']['mapped_count'] == 60
          rows=[r for r in reg['records'] if r['authority_key']=='imperia']
          assert len(rows)==273
          assert sum(r['source_key']=='imperia-listed' for r in rows)==142
          assert sum(r['source_key']=='imperia-applicants' for r in rows)==131
          assert sum(r['source_status']=='listed' for r in rows)==222
          assert sum(r['source_status']=='renewal_update_in_progress' for r in rows)==37
          assert sum(r['source_status']=='pending' for r in rows)==6
          assert sum(r['source_status']=='cancellation_related' for r in rows)==5
          assert sum(r['source_status']=='other_or_unknown' for r in rows)==3
          assert sum(bool(r['identifiers']) for r in rows)==257
          assert len({r['record_locator'] for r in rows})==273
          authority=[x for x in pref['prefectures'] if x['authority_key']=='imperia']
          assert len(authority)==1 and authority[0]['mapped'] and authority[0]['published'] and authority[0]['series_count']==2
          print(json.dumps({'records':reg['meta']['record_count'],'authorities':reg['meta']['authority_count'],'registers':reg['meta']['register_count'],'published':pref['meta']['published_count'],'mapped':pref['meta']['mapped_count']},indent=2))
          PY

      - name: Verify reviewed public workflow candidate
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/imperia-public-pages-candidate.yml
          grep -F "assert reg['meta']['record_count'] == 64865" /tmp/imperia-public-pages-candidate.yml
          grep -F "assert reg['meta']['authority_count'] == 60" /tmp/imperia-public-pages-candidate.yml
          grep -F "assert reg['meta']['register_count'] == 62" /tmp/imperia-public-pages-candidate.yml
          grep -F "assert pref['meta']['published_count'] == 60" /tmp/imperia-public-pages-candidate.yml
          grep -F "assert pref['meta']['mapped_count'] == 60" /tmp/imperia-public-pages-candidate.yml
          grep -F "imperia_records" /tmp/imperia-public-pages-candidate.yml

      - name: Commit permanent checkpoint only
        shell: bash
        env:
          TARGET_BRANCH: expansion/imperia-2026-09-19
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            data/catalog.csv \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            data/source_registry/verified_primary_pages.csv \
            docs/sources/imperia-operational-check-2026-09-19.md \
            src/white_list_archive/publishing/public_national_registry.py
          git diff --cached --name-only | sort > /tmp/imperia-staged.txt
          cat /tmp/imperia-staged.txt
          python - <<'PY'
          from pathlib import Path
          expected={
            'data/catalog.csv','data/monitoring/national_coverage.json','data/publication/multi_prefecture_pilot.json',
            'data/source_registry/source_series_inventory.csv','data/source_registry/verified_primary_pages.csv',
            'docs/sources/imperia-operational-check-2026-09-19.md','src/white_list_archive/publishing/public_national_registry.py',
          }
          observed={x for x in Path('/tmp/imperia-staged.txt').read_text().splitlines() if x}
          if observed != expected:
              raise SystemExit(f'Permanent checkpoint scope mismatch: {sorted(observed)}')
          PY
          git commit -m 'Integrate Imperia White List sources'
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Upload reviewed candidates and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imperia-integration-finalizer
          path: |
            /tmp/imperia-public-pages-candidate.yml
            /tmp/imperia-source-revalidation/report.json
            /tmp/imperia-pytest.log
            /tmp/imperia-public-site/data/registry.json
            /tmp/imperia-public-site/data/prefectures.json
            /tmp/imperia-staged.txt
          if-no-files-found: warn
          retention-days: 7
