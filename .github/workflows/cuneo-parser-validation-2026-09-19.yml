name: Cuneo parser validation 2026-09-19

on:
  push:
    branches:
      - expansion/cuneo-2026-09-19
    paths:
      - .github/workflows/cuneo-parser-validation-2026-09-19.yml
      - src/white_list_archive/parsers/cuneo_positioned.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install parser runtime
        run: python -m pip install -e .[dev] requests

      - name: Fetch and byte-verify official Cuneo sources twice
        env:
          LISTED_URL: https://prefettura.interno.gov.it/sites/default/files/39/2026-09/elenco-iscritti-white-list_0.pdf
          APPLICANTS_URL: https://prefettura.interno.gov.it/sites/default/files/39/2026-09/elenco-richiedenti-iscrizione_0.pdf
          LISTED_SHA256: 3556b033acea0b035ad8f955973affa97637260c4abe233d53518e5c7a32a2f7
          APPLICANTS_SHA256: 25ee4f5fff0b0f6580396c27f3e73abfdcfa994bfe673e7a86ca33377e784cea
        run: |
          mkdir -p /tmp/cuneo
          python - <<'PY'
          import hashlib, os, pathlib, time
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          import requests

          headers = {
              'User-Agent': 'Mozilla/5.0 (compatible; italian-anti-mafia-whitelist-source-verification/1.0)',
              'Accept': 'application/pdf,*/*;q=0.8',
              'Cache-Control': 'no-cache',
              'Pragma': 'no-cache',
          }
          out = pathlib.Path('/tmp/cuneo')
          def bust(url, token):
              p = urlsplit(url)
              q = parse_qsl(p.query, keep_blank_values=True)
              q.append(('_wl_validate', token))
              return urlunsplit((p.scheme, p.netloc, p.path, urlencode(q), p.fragment))
          for kind in ('listed', 'applicants'):
              url = os.environ[f'{kind.upper()}_URL']
              expected = os.environ[f'{kind.upper()}_SHA256']
              observed = []
              for attempt in (1, 2):
                  response = requests.get(
                      bust(url, f'{attempt}-{time.time_ns()}'),
                      headers=headers,
                      timeout=90,
                      allow_redirects=True,
                  )
                  response.raise_for_status()
                  digest = hashlib.sha256(response.content).hexdigest()
                  observed.append((len(response.content), digest))
                  out.joinpath(f'{kind}-{attempt}.pdf').write_bytes(response.content)
                  time.sleep(1)
              assert observed[0] == observed[1], (kind, observed)
              assert observed[0][1] == expected, (kind, observed[0][1], expected)
              print(kind, observed[0])
          PY

      - name: Parse and validate exact source boundary
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          from white_list_archive.parsers.cuneo_positioned import parse_applicants, parse_listed

          common = {
              'authority_key': 'cuneo',
              'authority_name': 'Prefettura di Cuneo',
              'register_key': 'cuneo-ordinary',
              'register_name': 'White List ordinaria',
              'reference_date': '2026-09-15',
              'source_page_url': 'https://prefettura.interno.gov.it/it/prefetture/cuneo/elenco-iscritti-white-liste-e-elenco-richiedenti-white-list',
          }
          listed_cfg = {
              **common,
              'source_key': 'cuneo-listed',
              'population_scope': 'listed',
              'resource_url': 'https://prefettura.interno.gov.it/sites/default/files/39/2026-09/elenco-iscritti-white-list_0.pdf',
              'sha256': '3556b033acea0b035ad8f955973affa97637260c4abe233d53518e5c7a32a2f7',
          }
          applicant_cfg = {
              **common,
              'source_key': 'cuneo-applicants',
              'population_scope': 'applicant',
              'resource_url': 'https://prefettura.interno.gov.it/sites/default/files/39/2026-09/elenco-richiedenti-iscrizione_0.pdf',
              'sha256': '25ee4f5fff0b0f6580396c27f3e73abfdcfa994bfe673e7a86ca33377e784cea',
          }
          listed = parse_listed(Path('/tmp/cuneo/listed-1.pdf'), listed_cfg)
          applicants = parse_applicants(Path('/tmp/cuneo/applicants-1.pdf'), applicant_cfg)
          assert listed.diagnostics['public_records'] == 468
          assert listed.diagnostics['sector_rows'] == 1063
          assert listed.diagnostics['identifier_coverage'] == 457
          assert listed.diagnostics['status_counts'] == {'listed': 402, 'renewal_update_in_progress': 66}
          assert applicants.diagnostics['public_records'] == 48
          assert applicants.diagnostics['sector_rows'] == 93
          assert applicants.diagnostics['identifier_coverage'] == 48
          assert applicants.diagnostics['status_counts'] == {'pending': 48}
          records = listed.records + applicants.records
          assert len(records) == 516
          assert len({record['record_locator'] for record in records}) == 516
          assert sum(bool(record['identifiers']) for record in records) == 505
          assert Counter(record['source_status'] for record in records) == Counter({
              'listed': 402,
              'renewal_update_in_progress': 66,
              'pending': 48,
          })
          carrero = listed.records[112]
          assert carrero['name'] == 'CARRERO TRASPORTI S.r.l.'
          assert carrero['registered_office'] == "Via del Vecchio Mulino 10/12 Fraz. Cinzano Santa Vittoria d'Alba"
          assert carrero['identifier_field_raw'] == '02764820045'
          baudino = listed.records[70]
          assert baudino['name'] == 'BAUDINO TRASPORTI S.r.l.'
          assert baudino['observed_listing_date'] == ''
          assert set(baudino['source_fields']['listing_date_raw_variants']) == {'07/01/2025', '07/01/2015'}
          assert applicants.records[0]['name'] == 'ALPHA COSTRUZIONI - INGEGNERIA SRL'
          assert applicants.records[0]['application_date'] == '2026-07-09'
          print('Cuneo parser boundary validated:', Counter(record['source_status'] for record in records))
          PY
