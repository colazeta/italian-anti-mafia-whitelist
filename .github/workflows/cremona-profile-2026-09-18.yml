name: Cremona profile 2026-09-18

on:
  push:
    branches:
      - expansion/cremona-2026-09-18
    paths:
      - .github/workflows/cremona-profile-2026-09-18.yml

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: python -m pip install --quiet pdfplumber
      - name: Profile identifier multiplicity
        shell: bash
        run: |
          set -euo pipefail
          URL='https://prefettura.interno.gov.it/sites/default/files/22/2026-09/white-list-elenchi-ditte_3.pdf'
          for attempt in 1 2 3; do
            curl -fsSL -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36' -H 'Cache-Control: no-cache' "${URL}?ids=${attempt}-$(date +%s%N)" -o source.pdf && break
            sleep 2
          done
          python - <<'PY'
          import pdfplumber,re
          from collections import Counter
          rows=[]
          with pdfplumber.open('source.pdf') as pdf:
              for pn,p in enumerate(pdf.pages,1):
                  t=p.extract_tables()[0]
                  rows.extend(t[2:] if pn==1 else t)
          rows=[r for r in rows if any((x or '').strip() for x in r)]
          shapes=Counter()
          for ordinal,row in enumerate(rows,1):
              raw=str(row[3] or '').strip()
              tokens=[re.sub(r'[^A-Za-z0-9]','',x).upper() for x in raw.splitlines() if x.strip()]
              strict=[x for x in tokens if x.isdigit() and len(x)==11]
              fiscal=[x for x in tokens if len(x)==16 and x.isalnum() and not x.isdigit()]
              malformed=[x for x in tokens if x not in strict and x not in fiscal]
              shape=(len(strict),len(fiscal),len(malformed))
              shapes[shape]+=1
              if len(tokens)>1 or malformed:
                  print('ROW',ordinal,'SHAPE',shape,'RAW',repr(raw),'TOKENS',tokens)
          print('SHAPES',dict(shapes))
          PY
