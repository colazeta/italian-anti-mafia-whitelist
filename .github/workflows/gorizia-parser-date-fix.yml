name: Gorizia parser date fix

on:
  push:
    branches:
      - expansion/gorizia-2026-09-13
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply reviewed ordinal-date support
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/white_list_archive/parsers/gorizia_tables.py")
          text = path.read_text(encoding="utf-8")
          old = 're.fullmatch(r"(\\d{1,2})\\s+([A-Za-zÀ-ÿ]+)\\s+(\\d{4})", value)'
          new = 're.fullmatch(r"(\\d{1,2})°?\\s+([A-Za-zÀ-ÿ]+)\\s+(\\d{4})", value)'
          if new in text:
              print("Ordinal-date support already present.")
          elif old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          else:
              raise RuntimeError("Expected Gorizia Italian-word date parser expression not found")
          PY

      - name: Commit parser fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/white_list_archive/parsers/gorizia_tables.py
          if git diff --cached --quiet; then
            echo "No parser change to checkpoint."
            exit 0
          fi
          git commit -m "Handle reviewed ordinal date typography in Gorizia source"
          git push
