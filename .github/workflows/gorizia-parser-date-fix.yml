name: Gorizia reviewed blank-expiry fix

on:
  push:
    branches:
      - expansion/gorizia-2026-09-13
    paths:
      - .github/workflows/gorizia-parser-date-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout expansion branch
        uses: actions/checkout@v4
        with:
          ref: expansion/gorizia-2026-09-13
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact reviewed blank-expiry correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          parser = Path('src/white_list_archive/parsers/gorizia_tables.py')
          text = parser.read_text(encoding='utf-8')

          old_sig = '''        (\n            "PEVERE LOGISTICA SRL",\n            "MONFALCONE (GO) Via Timavo, 63",\n            "C.F./P.I. 01282120315",\n            "30 luglio 2026",\n        ),\n'''
          new_sig = '''        (\n            "PEVERE LOGISTICA SRL",\n            "GORIZIA Via Gregorcic snc",\n            "C.F./P.I. 01282120315",\n            "30 luglio 2026",\n        ),\n'''
          if old_sig in text:
              text = text.replace(old_sig, new_sig, 1)
          elif new_sig not in text:
              raise RuntimeError('PEVERE reviewed signature is neither old nor corrected form')

          old_block = '''    grouped: dict[tuple[str, ...], list[dict[str, Any]]] = defaultdict(list)\n    blank_expiry_rows = 0\n    for row in sector_rows:\n        if not row["expiry_raw"]:\n            signature = (row["name"], row["office"], row["identifier_raw"], row["listing_raw"])\n            if signature not in _REVIEWED_BLANK_EXPIRY_ROWS:\n                raise RuntimeError(f"Gorizia unreviewed blank expiry row: {signature!r}")\n            blank_expiry_rows += 1\n        key = (\n            row["name"],\n            row["office"],\n            row["secondary"],\n            row["identifier_raw"],\n            row["listing_raw"],\n            row["expiry_raw"],\n        )\n        grouped[key].append(row)\n\n    if blank_expiry_rows != len(_REVIEWED_BLANK_EXPIRY_ROWS):\n        raise RuntimeError(\n            f"Gorizia reviewed blank-expiry population drift: {blank_expiry_rows} != {len(_REVIEWED_BLANK_EXPIRY_ROWS)}"\n        )\n'''
          new_block = '''    grouped: dict[tuple[str, ...], list[dict[str, Any]]] = defaultdict(list)\n    observed_blank_expiry_signatures: set[tuple[str, str, str, str]] = set()\n    blank_expiry_sector_rows = 0\n    for row in sector_rows:\n        if not row["expiry_raw"]:\n            signature = (row["name"], row["office"], row["identifier_raw"], row["listing_raw"])\n            if signature not in _REVIEWED_BLANK_EXPIRY_ROWS:\n                raise RuntimeError(f"Gorizia unreviewed blank expiry row: {signature!r}")\n            observed_blank_expiry_signatures.add(signature)\n            blank_expiry_sector_rows += 1\n        key = (\n            row["name"],\n            row["office"],\n            row["secondary"],\n            row["identifier_raw"],\n            row["listing_raw"],\n            row["expiry_raw"],\n        )\n        grouped[key].append(row)\n\n    if observed_blank_expiry_signatures != _REVIEWED_BLANK_EXPIRY_ROWS:\n        missing = sorted(_REVIEWED_BLANK_EXPIRY_ROWS - observed_blank_expiry_signatures)\n        unexpected = sorted(observed_blank_expiry_signatures - _REVIEWED_BLANK_EXPIRY_ROWS)\n        raise RuntimeError(\n            f"Gorizia reviewed blank-expiry population drift: missing={missing!r}; unexpected={unexpected!r}"\n        )\n'''
          if old_block in text:
              text = text.replace(old_block, new_block, 1)
          elif new_block not in text:
              raise RuntimeError('expected Gorizia blank-expiry parser block not found')

          old_diag = '            "blank_expiry_rows": blank_expiry_rows,\n'
          new_diag = '            "blank_expiry_rows": blank_expiry_sector_rows,\n            "blank_expiry_registrations": len(observed_blank_expiry_signatures),\n'
          if old_diag in text:
              text = text.replace(old_diag, new_diag, 1)
          elif new_diag not in text:
              raise RuntimeError('expected Gorizia blank-expiry diagnostic not found')

          parser.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- src/white_list_archive/parsers/gorizia_tables.py

      - name: Install parser runtime
        run: python -m pip install --disable-pip-version-check -e '.[dev]' requests

      - name: Validate against immutable official sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/validation
          python - <<'PY'
          import hashlib
          import time
          from collections import Counter
          from pathlib import Path

          import requests

          from white_list_archive.parsers.gorizia_tables import parse_gorizia_applicants, parse_gorizia_listed

          landing = 'https://prefettura.interno.gov.it/it/prefetture/gorizia/evidenza/white-list'
          headers = {
              'User-Agent': 'Mozilla/5.0 whitelist-archive-gorizia-reviewed-fix/1.0',
              'Referer': landing,
              'Connection': 'close',
          }
          sources = [
              {
                  'key': 'gorizia-listed',
                  'url': 'https://prefettura.interno.gov.it/sites/default/files/0/2026-08/gorizia-elenco-ditte-iscritte-wl.docx',
                  'sha': '680f0822f56ce7499a5d3f6c9e524d3d33b631feca51886e57e70fdf9e5fbd6d',
                  'suffix': '.docx',
                  'scope': 'listed',
              },
              {
                  'key': 'gorizia-applicants',
                  'url': 'https://prefettura.interno.gov.it/sites/default/files/0/2026-08/2026.08-white-list-ditte-richiedenti-iscrizione.pdf',
                  'sha': 'befe7ed054e0cfe9dda48c8dec59f843b569019e40b925d6d5d1fcec19021c7c',
                  'suffix': '.pdf',
                  'scope': 'applicant',
              },
          ]
          batches = []
          for source in sources:
              bodies = []
              for attempt in range(2):
                  response = requests.get(source['url'], headers=headers, timeout=(20, 90), allow_redirects=True)
                  response.raise_for_status()
                  body = response.content
                  digest = hashlib.sha256(body).hexdigest()
                  if digest != source['sha']:
                      raise RuntimeError(f"{source['key']} approved-byte drift: {digest}")
                  bodies.append(body)
                  if attempt == 0:
                      time.sleep(2)
              if bodies[0] != bodies[1]:
                  raise RuntimeError(f"{source['key']} repeat-fetch byte drift")
              path = Path('tmp/validation') / f"{source['key']}{source['suffix']}"
              path.write_bytes(bodies[0])
              cfg = {
                  'source_key': source['key'],
                  'parser': 'gorizia_listed' if source['scope'] == 'listed' else 'gorizia_applicants',
                  'authority_key': 'gorizia',
                  'authority_name': 'Prefettura di Gorizia',
                  'register_key': 'gorizia-ordinary',
                  'register_name': 'White List ordinaria',
                  'population_scope': source['scope'],
                  'reference_date': '2026-09-13',
                  'source_page_url': landing,
                  'resource_url': source['url'],
                  'sha256': source['sha'],
              }
              batch = parse_gorizia_listed(path, cfg) if source['scope'] == 'listed' else parse_gorizia_applicants(path, cfg)
              batches.append(batch)

          listed, applicants = batches
          if listed.diagnostics['public_records'] != 117:
              raise RuntimeError(f"listed record drift: {listed.diagnostics!r}")
          if listed.diagnostics['sector_rows'] != 186:
              raise RuntimeError(f"listed sector-row drift: {listed.diagnostics!r}")
          if listed.diagnostics['blank_expiry_registrations'] != 2:
              raise RuntimeError(f"listed blank-expiry registration drift: {listed.diagnostics!r}")
          if listed.diagnostics['status_counts'] != {'listed': 86, 'renewal_update_in_progress': 31}:
              raise RuntimeError(f"listed status drift: {listed.diagnostics!r}")
          if applicants.diagnostics['public_records'] != 10:
              raise RuntimeError(f"applicant record drift: {applicants.diagnostics!r}")
          records = listed.records + applicants.records
          statuses = dict(Counter(record['source_status'] for record in records))
          if len(records) != 127 or statuses != {'listed': 86, 'renewal_update_in_progress': 31, 'pending': 10}:
              raise RuntimeError(f"combined Gorizia drift: records={len(records)} statuses={statuses!r}")
          if len({record['record_locator'] for record in records}) != 127:
              raise RuntimeError('Gorizia locator collision')
          print({'records': len(records), 'statuses': statuses, 'listed_diagnostics': listed.diagnostics})
          PY

      - name: Run repository tests
        run: pytest -q

      - name: Commit validated production parser correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/white_list_archive/parsers/gorizia_tables.py
          if git diff --cached --quiet; then
            echo 'No parser change to checkpoint.'
            exit 0
          fi
          git commit -m 'Reconcile Gorizia blank expiry evidence'
          git push origin HEAD:expansion/gorizia-2026-09-13
