name: Gorizia parser evidence fix

on:
  push:
    branches:
      - expansion/gorizia-2026-09-13
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bind reviewed section-3 header typography
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          parser = Path("src/white_list_archive/parsers/gorizia_tables.py")
          text = parser.read_text(encoding="utf-8")
          old = '''        header = _physical_cells(table.rows[0])
        if header != expected_headers:
            raise RuntimeError(f"Gorizia listed header drift in section {section}: {header!r}")
'''
          new = '''        header = _physical_cells(table.rows[0])
        expected_header = list(expected_headers)
        if section == 3:
            expected_header[4] = "Data d ’ iscrizione"
        if header != expected_header:
            raise RuntimeError(f"Gorizia listed header drift in section {section}: {header!r}")
'''
          if new not in text:
              if text.count(old) != 1:
                  raise RuntimeError(f"Expected exactly one strict header block, found {text.count(old)}")
              text = text.replace(old, new, 1)
              parser.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git diff -- src/white_list_archive/parsers/gorizia_tables.py

      - name: Commit reviewed parser fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/white_list_archive/parsers/gorizia_tables.py
          if git diff --cached --quiet; then
            echo "No parser change to checkpoint."
            exit 0
          fi
          git commit -m "Bind Gorizia section 3 header typography"
          git push
