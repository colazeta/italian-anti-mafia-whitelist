name: Crotone current-head production runner 2026-09-11

on:
  push:
    branches: [expansion/crotone-2026-09-11]
    paths: [.github/workflows/crotone-current-head-runner-2026-09-11.yml]

permissions:
  contents: write

jobs:
  run-current-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/crotone-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute the reviewed production-gate run steps on this head
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/crotone-production-gate-2026-09-11.yml').read_text())
          steps = workflow['jobs']['gate']['steps']
          run_steps = [step for step in steps if isinstance(step, dict) and step.get('run')]
          if len(run_steps) < 5:
              raise SystemExit(f'unexpected production-gate shape: {len(run_steps)} run steps')
          for index, step in enumerate(run_steps, start=1):
              name = step.get('name', f'run step {index}')
              print(f'::group::{name}')
              subprocess.run(step['run'], shell=True, executable='/bin/bash', check=True)
              print('::endgroup::')
          PY
