name: Cremona ledger repair 2026-09-19

on:
  push:
    branches:
      - expansion/cremona-2026-09-18
    paths:
      - '.github/workflows/cremona-ledger-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact expansion branch
        uses: actions/checkout@v4
        with:
          ref: expansion/cremona-2026-09-18
          fetch-depth: 0

      - name: Repair Cremona monitoring timestamps conservatively
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/monitoring/national_coverage.json')
          data = json.loads(path.read_text())
          rows = [r for r in data['prefectures'] if r['authority_key'] == 'cremona']
          assert len(rows) == 1
          row = rows[0]

          # 2026-09-18 is evidenced as a capture/reference date, not an exact
          # timezone-aware operational monitoring instant. Preserve that date in
          # latest_source_reference_date / last_successful_investigation_on and do
          # not fabricate a clock time for monitoring fields.
          assert row['latest_source_reference_date'] == '2026-09-18'
          assert row['last_successful_investigation_on'] == '2026-09-18'
          assert row['monitoring_status'] == 'NEVER_CHECKED'
          for field in ('last_successful_source_check_at', 'last_attempted_source_check_at', 'last_content_change_at'):
              assert row[field] == '2026-09-18', (field, row[field])
              row[field] = None

          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Validate ledger invariant
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          from datetime import datetime, timezone

          p = Path('data/monitoring/national_coverage.json')
          data = json.loads(p.read_text())
          row = next(r for r in data['prefectures'] if r['authority_key'] == 'cremona')
          assert row['last_successful_source_check_at'] is None
          assert row['last_attempted_source_check_at'] is None
          assert row['last_content_change_at'] is None
          assert row['monitoring_status'] == 'NEVER_CHECKED'
          assert row['known_content_sha256'] == ['55a9498a76120f0b781f9c7ae8da7144c141551598b63a98b0bc52caac79a550']
          assert row['source_verified'] is True
          assert row['population_scopes_complete'] is True
          PY

      - name: Commit exact ledger repair
        run: |
          if git diff --quiet -- data/monitoring/national_coverage.json; then
            echo 'No ledger change required.'
            exit 0
          fi
          test "$(git diff --name-only)" = "data/monitoring/national_coverage.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/monitoring/national_coverage.json
          git commit -m 'Fix Cremona monitoring timestamp semantics'
          git push origin HEAD:expansion/cremona-2026-09-18
