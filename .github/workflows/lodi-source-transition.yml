name: Lodi source transition (temporary)

on:
  push:
    branches:
      - fix/lodi-source-drift-2026-09-16
    paths:
      - '.github/workflows/lodi-source-transition.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lodi-source-transition-2026-09-16
  cancel-in-progress: false

jobs:
  transition:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Confirm branch and current official source stability
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/lodi-source-drift-2026-09-16'
          remote_sha="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-list --count HEAD..origin/main)" -eq 0
          listed='https://docs.google.com/spreadsheets/d/e/2PACX-1vSTOZ3x5FBo4IanDtISccAnqZmVLPmGhEYaj0YrDn4aP6ZpwY8kzpiHhAX0i26IwipgD6bvsWhSigwz/pub?gid=0&single=true&output=csv'
          applicants='https://docs.google.com/spreadsheets/d/e/2PACX-1vSTOZ3x5FBo4IanDtISccAnqZmVLPmGhEYaj0YrDn4aP6ZpwY8kzpiHhAX0i26IwipgD6bvsWhSigwz/pub?gid=245180329&single=true&output=csv'
          mkdir -p /tmp/lodi-transition
          for n in 1 2; do
            nonce="$(date +%s%N)-$n"
            curl --fail --location --silent --show-error --retry 3 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${listed}&cb=${nonce}" -o "/tmp/lodi-transition/listed-$n.csv"
            sleep 3
            nonce="$(date +%s%N)-a-$n"
            curl --fail --location --silent --show-error --retry 3 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${applicants}&cb=${nonce}" -o "/tmp/lodi-transition/applicants-$n.csv"
            sleep 3
          done
          cmp /tmp/lodi-transition/listed-1.csv /tmp/lodi-transition/listed-2.csv
          cmp /tmp/lodi-transition/applicants-1.csv /tmp/lodi-transition/applicants-2.csv
          test "$(sha256sum /tmp/lodi-transition/listed-1.csv | cut -d' ' -f1)" = 'c3695018c56ba754614eff988011e0f9b2f6cb2d8e0f22a9823275c8659da613'
          test "$(sha256sum /tmp/lodi-transition/applicants-1.csv | cut -d' ' -f1)" = '55aeab7e809cb90cc1ebd1ad9c1f08db78e91648a2c2e1a2b603188c77846228'
      - name: Apply reviewed Lodi transition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from pathlib import Path

          old_sha = 'ad64ab8669084bc31b80938a384b41849be4db28b448e9b2c0ce199f6af1d6ec'
          new_sha = 'c3695018c56ba754614eff988011e0f9b2f6cb2d8e0f22a9823275c8659da613'
          app_sha = '55aeab7e809cb90cc1ebd1ad9c1f08db78e91648a2c2e1a2b603188c77846228'

          parser = Path('src/white_list_archive/parsers/lodi_sheets.py')
          text = parser.read_text(encoding='utf-8')
          for old, new in [
              ('PARSER_VERSION = "1"', 'PARSER_VERSION = "2"'),
              ('_REFERENCE_DATE = "2026-09-15"', '_REFERENCE_DATE = "2026-09-16"'),
              (f'_LISTED_SHA256 = "{old_sha}"', f'_LISTED_SHA256 = "{new_sha}"'),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one parser token: {old!r}')
              text = text.replace(old, new)
          parser.write_text(text, encoding='utf-8')

          test = Path('tests/test_lodi_parser_semantics.py')
          text = test.read_text(encoding='utf-8')
          for old, new in [
              ('assert lodi._REFERENCE_DATE == "2026-09-15"', 'assert lodi._REFERENCE_DATE == "2026-09-16"'),
              (f'assert lodi._LISTED_SHA256 == "{old_sha}"', f'assert lodi._LISTED_SHA256 == "{new_sha}"'),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one test token: {old!r}')
              text = text.replace(old, new)
          test.write_text(text, encoding='utf-8')

          pilot_path = Path('data/publication/multi_prefecture_pilot.json')
          pilot = json.loads(pilot_path.read_text(encoding='utf-8'))
          sources = {x['source_key']: x for x in pilot['sources']}
          listed = sources['lodi-listed']
          applicants = sources['lodi-applicants']
          if listed['sha256'] != old_sha or listed['expected_source_rows'] != 169:
              raise SystemExit('unexpected pre-transition lodi-listed config')
          if applicants['sha256'] != app_sha or applicants['expected_source_rows'] != 4:
              raise SystemExit('unexpected pre-transition lodi-applicants config')
          listed.update({
              'reference_date': '2026-09-16',
              'last_source_update': '2026-09-16',
              'sha256': new_sha,
              'notes': 'Official mutable Google Sheet linked by the Prefettura di Lodi. Two independent no-cache GETs on 16 September 2026 were byte-identical at the approved SHA-256. The physical, section-membership and grouped-record denominators remain 324, 291 and 169 (146 listed; 23 renewal/update in progress). Exact comparison with the preserved 15 September capture identifies only two row-level semantic transitions: KUMAR S.n.c. di Kumar Devinder e C. (03030560969) is now explicitly in aggiornamento with unchanged 23/10/2025–23/10/2026 dates; Z.A. AUTOTRASPORTI S.r.l. (04220560967) is now ordinarily listed with source dates 16/09/2026–16/09/2027 instead of the previous in-aggiornamento 13/08/2025–13/08/2026 row. Exact evidence is documented in docs/sources/lodi-operational-check-2026-09-16.md.'
          })
          applicants.update({
              'reference_date': '2026-09-16',
              'last_source_update': '2026-09-16',
              'notes': 'Official applicant tab linked by the Prefettura di Lodi. Two independent no-cache GETs on 16 September 2026 are byte-identical to each other and to the approved 15 September capture. The four positively identified observations remain unchanged: two explicit denials with source-explicit decision dates and two records explicitly in istruttoria. No applicant status or completeness is inferred from failed search. Exact evidence is documented in docs/sources/lodi-operational-check-2026-09-16.md.'
          })
          pilot_path.write_text(json.dumps(pilot, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          inv_path = Path('data/source_registry/source_series_inventory.csv')
          with inv_path.open(encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f))
              fields = f.fieldnames
          found=set()
          for row in rows:
              if row['source_series_key'] == 'lodi-listed':
                  row['verified_date'] = '2026-09-16'
                  row['notes'] = 'Official Lodi landing page revalidated 16 September 2026 and positively exposes the registered-company Google Sheet tab. Two independent no-cache CSV exports are byte-identical at SHA-256 c3695018c56ba754614eff988011e0f9b2f6cb2d8e0f22a9823275c8659da613. Structure and grouped denominator remain 291 statutory-section memberships and 169 public observations; two exact semantic row changes versus the preserved 15 September capture are documented in docs/sources/lodi-operational-check-2026-09-16.md.'
                  found.add('listed')
              elif row['source_series_key'] == 'lodi-applicants':
                  row['verified_date'] = '2026-09-16'
                  row['notes'] = 'Official Lodi landing page revalidated 16 September 2026 and positively exposes the requesting-company Google Sheet tab. Two independent no-cache CSV exports remain byte-identical to the approved SHA-256 55aeab7e809cb90cc1ebd1ad9c1f08db78e91648a2c2e1a2b603188c77846228; the four source-backed applicant observations are unchanged. Exact evidence is documented in docs/sources/lodi-operational-check-2026-09-16.md.'
                  found.add('applicants')
          if found != {'listed','applicants'}:
              raise SystemExit(f'Lodi inventory rows not found: {found}')
          with inv_path.open('w', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              w.writeheader(); w.writerows(rows)

          cov_path = Path('data/monitoring/national_coverage.json')
          cov = json.loads(cov_path.read_text(encoding='utf-8'))
          matches=[x for x in cov['prefectures'] if x['authority_key']=='lodi']
          if len(matches)!=1:
              raise SystemExit('expected one Lodi monitoring entry')
          entry=matches[0]
          if entry['known_content_sha256'] != [old_sha, app_sha]:
              raise SystemExit('unexpected Lodi monitoring hashes')
          entry['latest_source_reference_date']='2026-09-16'
          entry['last_successful_investigation_on']='2026-09-16'
          entry['known_content_sha256']=[new_sha, app_sha]
          entry['unresolved_issue']=[
              'The official Google Sheet is mutable and exposes no reliable edition date; 2026-09-16 is the current byte-pinned observation/capture boundary, not an inferred publication date.',
              'Canonical hosted-database integration and independent durable-evidence verification remain governed under #16; public source observations are validated independently of that infrastructure.'
          ]
          newdoc='docs/sources/lodi-operational-check-2026-09-16.md'
          if newdoc not in entry['completion_evidence']:
              entry['completion_evidence'].append(newdoc)
          if newdoc not in entry['evidence']:
              entry['evidence'].append(newdoc)
          cov_path.write_text(json.dumps(cov, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          doc = Path('docs/sources/lodi-operational-check-2026-09-16.md')
          doc.write_text('''# Lodi operational source transition — 16 September 2026

## Scope

This note records the evidence review required after the mutable official Lodi registered-company Google Sheet changed after the 15 September approval. It does not infer a legal publication date from the observation date.

## Official publication surface

- Authority: Prefettura di Lodi.
- Official White List page: `https://prefettura.interno.gov.it/it/prefetture/lodi/evidenza/white-list`.
- The page continues to positively expose separate registered-company and requesting-company Google Sheet tabs.
- Both populations were fetched twice independently with cache-bypass parameters on 16 September 2026.

## Registered-company transition

The two current captures are byte-identical:

- SHA-256: `c3695018c56ba754614eff988011e0f9b2f6cb2d8e0f22a9823275c8659da613`.
- Size: 36,372 bytes.
- Physical CSV rows: 324, all exactly seven columns.
- Positively identifiable statutory-section membership rows: 291.
- Section denominators are unchanged: I 44; II 24; III 47; IV 18; V 55; VI 54; VII 6; VIII 1; IX 3; X 39.
- Source-row status totals are unchanged: 254 ordinary listed memberships and 37 explicitly in aggiornamento.
- Conservative grouping remains exactly 169 public observations: 146 `listed` and 23 `renewal_update_in_progress`.

Exact comparison with the preserved 15 September approved capture (`ad64ab8669084bc31b80938a384b41849be4db28b448e9b2c0ce199f6af1d6ec`) yields exactly two changed CSV rows and no insertions or removals:

1. `KUMAR S.n.c. di Kumar Devinder e C.` — identifier `03030560969`: dates remain `23/10/2025` to `23/10/2026`; the status marker changes from blank to `in aggiornamento`, so the source status becomes `renewal_update_in_progress`.
2. `Z.A. AUTOTRASPORTI S.r.l.` — identifier `04220560967`: the previous `13/08/2025` to `13/08/2026` row marked `in aggiornamento` is replaced by an ordinary listed row dated `16/09/2026` to `16/09/2027`.

The two changes offset in the aggregate status counts; therefore the 169-record listed-series denominator and its 146/23 status split remain unchanged. The project nevertheless approves the new raw byte identity explicitly rather than treating equal denominators as evidence of unchanged content.

## Applicant population

The two current applicant captures are byte-identical and also identical to the 15 September approved capture:

- SHA-256: `55aeab7e809cb90cc1ebd1ad9c1f08db78e91648a2c2e1a2b603188c77846228`.
- Size: 1,388 bytes.
- Physical CSV rows: 8.
- Positively identifiable observations: 4.
- Statuses remain two explicit denials and two `pending` / `IN ISTRUTTORIA` observations.

No applicant transition is inferred because none is observed.

## Approval boundary

The current Lodi public-source boundary remains 173 observations: 169 registered-series observations plus 4 applicant-series observations. The registered-series bytes are promoted only after the two independent captures, exact historical comparison, parser tests and national publication build pass. `durable_evidence_verified` remains a separate control and is not promoted by this source transition.
''', encoding='utf-8')
          PY
          git diff --check
      - name: Prepare publication runtime
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source_file; do
            [ -n "$source_file" ] && sudo rm -f "$source_file"
          done < <(grep -rlE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '\|dl\.google\.com/linux/chrome|d;\|packages\.google\.com/chrome|d' /etc/apt/sources.list
          fi
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends poppler-utils; then break; fi
            test "$attempt" -lt 3 || exit 1
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[dev,publication,database,storage]'
      - name: Run repository and Lodi semantic tests
        run: |
          pytest -q
          pytest -q tests/test_lodi_parser_semantics.py
          node --check tests/public_portal_browser.cjs
      - name: Commit implementation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/white_list_archive/parsers/lodi_sheets.py tests/test_lodi_parser_semantics.py data/publication/multi_prefecture_pilot.json data/source_registry/source_series_inventory.csv data/monitoring/national_coverage.json docs/sources/lodi-operational-check-2026-09-16.md
          git commit -m 'Approve 16 September Lodi source transition'
          git push origin HEAD:fix/lodi-source-drift-2026-09-16
          echo "IMPLEMENTED_SHA=$(git rev-parse HEAD)"
      - name: Build and validate current national boundary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lodi-national /tmp/lodi-sources
          mkdir -p /tmp/lodi-national
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/lodi-sources \
            --registry-json /tmp/lodi-national/registry.json \
            --registry-csv /tmp/lodi-national/registry.csv \
            --prefectures-json /tmp/lodi-national/prefectures.json \
            --prefectures-csv /tmp/lodi-national/prefectures.csv
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          reg=json.loads(Path('/tmp/lodi-national/registry.json').read_text(encoding='utf-8'))
          pref=json.loads(Path('/tmp/lodi-national/prefectures.json').read_text(encoding='utf-8'))
          assert reg['meta']['record_count'] == len(reg['records']) == 51565
          assert reg['meta']['authority_count'] == 46
          assert reg['meta']['register_count'] == 47
          assert pref['meta']['published_count'] == 46
          assert pref['meta']['mapped_count'] == 47
          records=[r for r in reg['records'] if r['authority_key']=='lodi']
          assert len(records)==173
          assert len({r['record_locator'] for r in records})==173
          assert Counter(r['source_status'] for r in records)==Counter({'listed':146,'renewal_update_in_progress':23,'rejected_or_denied':2,'pending':2})
          by_id={i:r for r in records for i in r.get('identifiers',[]) if i in {'03030560969','04220560967'}}
          assert by_id['03030560969']['source_status']=='renewal_update_in_progress'
          assert by_id['03030560969']['observed_listing_date']=='2025-10-23'
          assert by_id['03030560969']['observed_expiry_date']=='2026-10-23'
          assert by_id['04220560967']['source_status']=='listed'
          assert by_id['04220560967']['observed_listing_date']=='2026-09-16'
          assert by_id['04220560967']['observed_expiry_date']=='2027-09-16'
          print({'record_count':51565,'published_count':46,'register_count':47,'mapped_count':47,'lodi_records':173,'lodi_statuses':dict(Counter(r['source_status'] for r in records))})
          PY
