name: Caserta source profile

on:
  push:
    branches:
      - expansion/caserta-2026-09-12
    paths:
      - .github/workflows/caserta-source-profile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/caserta-2026-09-12
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install profile runtime
        run: python -m pip install --disable-pip-version-check requests pdfplumber
      - name: Verify and profile official sources
        env:
          LISTED_URL: https://prefettura.interno.gov.it/sites/default/files/30/2026-09/elenco-iscritti-31082026_white-list.pdf
          APPLICANT_URL: https://prefettura.interno.gov.it/sites/default/files/30/2026-08/elenco_imprese_richiedenti_iscrizione_white_list-al-31.08.2026.pdf
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, re, time
          from collections import Counter
          from pathlib import Path
          import requests, pdfplumber

          OUT = Path('tmp/caserta_source_profile.json')
          OUT.parent.mkdir(parents=True, exist_ok=True)
          UA = {'User-Agent': 'italian-anti-mafia-whitelist evidence verifier/1.0'}

          def get_twice(url: str, stem: str):
              attempts=[]
              payloads=[]
              for i in range(2):
                  r=requests.get(url, headers=UA, timeout=90)
                  attempts.append({'status': r.status_code, 'content_type': r.headers.get('content-type'), 'bytes': len(r.content)})
                  if r.status_code != 200:
                      raise RuntimeError(f'{stem} GET {i+1} failed: {r.status_code}')
                  payloads.append(r.content)
                  if i == 0:
                      time.sleep(1)
              hashes=[hashlib.sha256(x).hexdigest() for x in payloads]
              if hashes[0] != hashes[1]:
                  raise RuntimeError(f'{stem} independent GET mismatch: {hashes}')
              p=Path(f'/tmp/{stem}.pdf')
              p.write_bytes(payloads[0])
              return p, attempts, hashes[0]

          def clean(v):
              return re.sub(r'\s+', ' ', (v or '').replace('\xa0',' ')).strip()

          def profile_pdf(path: Path):
              widths=Counter(); table_counts=[]; nonempty_rows=0; samples=[]; first_text=[]
              with pdfplumber.open(path) as pdf:
                  page_count=len(pdf.pages)
                  for pno,page in enumerate(pdf.pages,1):
                      text=page.extract_text() or ''
                      if pno <= 3:
                          first_text.append({'page':pno,'text':text[:12000]})
                      tables=page.extract_tables() or []
                      table_counts.append(len(tables))
                      for tno,table in enumerate(tables,1):
                          for rno,row in enumerate(table or [],1):
                              cells=[clean(c) for c in row]
                              if not any(cells):
                                  continue
                              nonempty_rows += 1
                              widths[len(cells)] += 1
                              if len(samples) < 80:
                                  samples.append({'page':pno,'table':tno,'row':rno,'cells':cells})
              return {
                  'page_count': page_count,
                  'tables_per_page': table_counts,
                  'nonempty_table_rows': nonempty_rows,
                  'row_width_counts': dict(sorted(widths.items())),
                  'sample_rows': samples,
                  'first_page_text': first_text,
              }

          report={
              'authority_key':'caserta',
              'landing_page':'https://prefettura.interno.gov.it/it/prefetture/caserta/elenco-white-list',
              'reference_date':'2026-08-31',
              'sources':{}
          }
          for key,env in [('listed','LISTED_URL'),('applicants','APPLICANT_URL')]:
              url=os.environ[env]
              p,attempts,sha=get_twice(url, f'caserta_{key}')
              report['sources'][key]={
                  'url':url,
                  'independent_gets':attempts,
                  'sha256':sha,
                  **profile_pdf(p),
              }
          OUT.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({k:{'sha256':v['sha256'],'pages':v['page_count'],'rows':v['nonempty_table_rows'],'widths':v['row_width_counts']} for k,v in report['sources'].items()}, indent=2))
          PY
      - name: Persist profile checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/caserta_source_profile.json
          if git diff --cached --quiet; then
            echo 'No profile change to commit.'
            exit 0
          fi
          git commit -m 'Checkpoint Caserta source profile'
          git push origin HEAD:expansion/caserta-2026-09-12
