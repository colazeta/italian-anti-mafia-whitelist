name: Temporary Chieti integration finalisation

on:
  push:
    branches:
      - expansion/chieti-2026-09-18
    paths:
      - '.github/workflows/chieti-integration-finalize.yml'

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/chieti-2026-09-18
          fetch-depth: 0
      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends antiword poppler-utils
          python -m pip install -e '.[publication]'
      - name: Revalidate current Chieti bytes twice and exercise parser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/chieti
          LISTED='https://prefettura.interno.gov.it/sites/default/files/82/2026-09/elenco-iscritti-white-list-18-settembre-2026.doc'
          APPLICANTS='https://prefettura.interno.gov.it/sites/default/files/82/2026-09/elenco-richiedenti-iscrizione-in-white-list-18-settembre-2026.doc'
          UA='Mozilla/5.0 (compatible; italian-anti-mafia-whitelist/1.0; Chieti final verification)'
          for kind in listed applicants; do
            url="$LISTED"; expected='09c9b3ae1b1f4145c2a3795738a8d80d872c9816752cedb31b34cd730d801ddd'
            [ "$kind" = applicants ] && url="$APPLICANTS" && expected='2628230c417cf7b961d4a22490ba04f1b548c512782bd19a211890e11df54dc1'
            for n in 1 2; do
              curl --fail --location --silent --show-error --retry 2 \
                -A "$UA $kind-$n" -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                "$url" -o "/tmp/chieti/$kind-$n.doc"
              actual="$(sha256sum "/tmp/chieti/$kind-$n.doc" | cut -d' ' -f1)"
              test "$actual" = "$expected"
            done
            cmp "/tmp/chieti/$kind-1.doc" "/tmp/chieti/$kind-2.doc"
          done
          python - <<'PY'
          from pathlib import Path
          from white_list_archive.parsers.chieti_legacy_doc import parse_chieti_listed, parse_chieti_applicants
          common = {
              "reference_date": "2026-09-18",
              "authority_key": "chieti",
              "authority_name": "Prefettura di Chieti",
              "register_key": "chieti-ordinary",
              "register_name": "White List ordinaria",
              "source_page_url": "https://prefettura.interno.gov.it/it/prefetture/chieti/evidenza/white-list",
          }
          listed = parse_chieti_listed(Path("/tmp/chieti/listed-1.doc"), {
              **common, "source_key": "chieti-listed", "population_scope": "listed",
              "resource_url": "https://prefettura.interno.gov.it/sites/default/files/82/2026-09/elenco-iscritti-white-list-18-settembre-2026.doc",
              "sha256": "09c9b3ae1b1f4145c2a3795738a8d80d872c9816752cedb31b34cd730d801ddd",
          })
          applicants = parse_chieti_applicants(Path("/tmp/chieti/applicants-1.doc"), {
              **common, "source_key": "chieti-applicants", "population_scope": "applicant",
              "resource_url": "https://prefettura.interno.gov.it/sites/default/files/82/2026-09/elenco-richiedenti-iscrizione-in-white-list-18-settembre-2026.doc",
              "sha256": "2628230c417cf7b961d4a22490ba04f1b548c512782bd19a211890e11df54dc1",
          })
          assert listed.diagnostics["public_records"] == 759
          assert listed.diagnostics["sector_rows"] == 1352
          assert listed.diagnostics["status_counts"] == {
              "listed": 544, "renewal_update_in_progress": 204,
              "expired_observed": 10, "cancellation_related": 1,
          }
          assert applicants.diagnostics["public_records"] == 177
          assert applicants.diagnostics["status_counts"] == {
              "pending": 169, "other_or_unknown": 7, "rejected_or_denied": 1,
          }
          assert listed.diagnostics["identifier_coverage"] == 731
          assert applicants.diagnostics["identifier_coverage"] == 173
          print(listed.diagnostics)
          print(applicants.diagnostics)
          PY
      - name: Materialise permanent Chieti integration
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from pathlib import Path

          root = Path('.')
          landing = 'https://prefettura.interno.gov.it/it/prefetture/chieti/evidenza/white-list'
          listed_url = 'https://prefettura.interno.gov.it/sites/default/files/82/2026-09/elenco-iscritti-white-list-18-settembre-2026.doc'
          applicants_url = 'https://prefettura.interno.gov.it/sites/default/files/82/2026-09/elenco-richiedenti-iscrizione-in-white-list-18-settembre-2026.doc'
          listed_sha = '09c9b3ae1b1f4145c2a3795738a8d80d872c9816752cedb31b34cd730d801ddd'
          applicants_sha = '2628230c417cf7b961d4a22490ba04f1b548c512782bd19a211890e11df54dc1'

          p = root/'data/source_registry/verified_primary_pages.csv'
          with p.open(encoding='utf-8', newline='') as h: rows=list(csv.DictReader(h)); fields=list(rows[0])
          if not any(r['authority_key']=='chieti' for r in rows):
              rows.append({'authority_key':'chieti','landing_url':landing,'verification_date':'2026-09-18','verification_status':'verified'})
          rows.sort(key=lambda r:r['authority_key'])
          with p.open('w',encoding='utf-8',newline='') as h:
              w=csv.DictWriter(h,fieldnames=fields); w.writeheader(); w.writerows(rows)

          p = root/'data/source_registry/source_series_inventory.csv'
          with p.open(encoding='utf-8', newline='') as h: rows=list(csv.DictReader(h)); fields=list(rows[0])
          additions = [
              {'source_series_key':'chieti-listed','authority_key':'chieti','regime_code':'WL-REGIME-L190-2012','population_scope':'listed','sector_scope':'all','publication_model':'periodic_attachment','series_url':'https://prefettura.interno.gov.it/it/prefetture/chieti/white-list-albo-iscritti','resource_resolution_status':'direct_series_page_resolved','verified_date':'2026-09-18','notes':'Current official registered-company page directly revalidated 18 September 2026; its live attachment is explicitly labelled Elenco Iscritti White List - Agg. 18 Settembre 2026. Two independent cache-bypassed captures are byte-identical and the fail-closed legacy Word parser yields 759 grouped observations from 1,352 activity-sector rows. Exact provenance and reviewed source anomalies are documented in docs/sources/chieti-operational-check-2026-09-18.md.'},
              {'source_series_key':'chieti-applicants','authority_key':'chieti','regime_code':'WL-REGIME-L190-2012','population_scope':'applicant','sector_scope':'all','publication_model':'periodic_attachment','series_url':'https://prefettura.interno.gov.it/it/prefetture/chieti/elenco-imprese-richiedenti-liscrizione-nelle-white-list','resource_resolution_status':'direct_series_page_resolved','verified_date':'2026-09-18','notes':'Current official applicant page directly revalidated 18 September 2026; its live attachment is explicitly labelled Elenco Richiedenti Iscrizione in White List - Agg. 18 Settembre 2026. Two independent cache-bypassed captures are byte-identical and the fail-closed legacy Word parser yields all 177 source observations, preserving explicit archive, rejection and transferred-competence outcomes rather than treatinging them as pending. Exact provenance is documented in docs/sources/chieti-operational-check-2026-09-18.md.'},
          ]
          keys={r['source_series_key'] for r in rows}; rows.extend(r for r in additions if r['source_series_key'] not in keys); rows.sort(key=lambda r:r['source_series_key'])
          with p.open('w',encoding='utf-8',newline='') as h:
              w=csv.DictWriter(h,fieldnames=fields); w.writeheader(); w.writerows(rows)

          p=root/'data/publication/multi_prefecture_pilot.json'; cfg=json.loads(p.read_text(encoding='utf-8'))
          new_sources=[
              {'source_key':'chieti-listed','parser':'chieti_legacy_listed','authority_key':'chieti','authority_name':'Prefettura di Chieti','register_key':'chieti-ordinary','register_name':'White List ordinaria','population_scope':'listed','reference_date':'2026-09-18','source_page_url':landing,'resource_url':listed_url,'sha256':listed_sha,'expected_source_rows':759,'expected_sector_rows':1352,'last_source_update':'2026-09-18','last_source_update_basis':'current official source label and two byte-identical cache-bypassed captures','approval_mode':'raw_sha256'},
              {'source_key':'chieti-applicants','parser':'chieti_legacy_applicants','authority_key':'chieti','authority_name':'Prefettura di Chieti','register_key':'chieti-ordinary','register_name':'White List ordinaria','population_scope':'applicant','reference_date':'2026-09-18','source_page_url':landing,'resource_url':applicants_url,'sha256':applicants_sha,'expected_source_rows':177,'last_source_update':'2026-09-18','last_source_update_basis':'current official source label and two byte-identical cache-bypassed captures','approval_mode':'raw_sha256'},
          ]
          existing={s['source_key'] for s in cfg['sources']}; cfg['sources'].extend(s for s in new_sources if s['source_key'] not in existing); p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=root/'data/monitoring/national_coverage.json'; data=json.loads(p.read_text(encoding='utf-8')); entries=data['authorities'] if isinstance(data,dict) and 'authorities' in data else data; row=next(r for r in entries if r['authority_key']=='chieti')
          row.update({'source_verified':True,'current_edition_identified':True,'capture_implemented':True,'parser_implemented':True,'parser_validated':True,'company_observations_loaded':True,'observation_layer':'public_source_observations','public_export_enabled':True,'population_scopes_complete':True,'latest_source_reference_date':'2026-09-18','last_successful_investigation_on':'2026-09-18','coverage_status':'VALIDATED','actionable_issue':False,'terminal_reason':None,'known_content_sha256':[listed_sha,applicants_sha],'completion_evidence':['docs/sources/chieti-operational-check-2026-09-18.md','src/white_list_archive/parsers/chieti_legacy_doc.py','tests/test_chieti_parser_semantics.py','data/publication/multi_prefecture_pilot.json'],'evidence':['data/source_registry/verified_primary_pages.csv','data/source_registry/source_series_inventory.csv','data/publication/multi_prefecture_pilot.json','docs/sources/chieti-operational-check-2026-09-18.md'],'last_completed_coverage_stage':'VALIDATED'})
          row['unresolved_issue']=['Canonical hosted-database integration and independent durable-evidence verification remain governed under #16; public source observations are validated independently of that infrastructure.']; p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=root/'data/catalog.csv'; text=p.read_text(encoding='utf-8').replace('verified_primary_page,54,false','verified_primary_page,55,false').replace('source_series,107,false','source_series,109,false'); p.write_text(text,encoding='utf-8')

          p=root/'src/white_list_archive/publishing/public_national_registry.py'; text=p.read_text(encoding='utf-8'); anchor='from white_list_archive.parsers.laquila_tables import PARSERS as LAQUILA_PARSERS\n'; assert anchor in text and 'CHIETI_PARSERS' not in text; text=text.replace(anchor,anchor+'from white_list_archive.parsers.chieti_legacy_doc import PARSERS as CHIETI_PARSERS\n'); anchor='        or LAQUILA_PARSERS.get(cfg["parser"])\n'; assert anchor in text; text=text.replace(anchor,anchor+'        or CHIETI_PARSERS.get(cfg["parser"])\n'); p.write_text(text,encoding='utf-8')

          p=root/'tests/test_source_registry.py'; p.write_text(p.read_text(encoding='utf-8').replace('assert len(pages) == 54','assert len(pages) == 55'),encoding='utf-8')
          p=root/'tests/test_source_population_coverage.py'; text=p.read_text(encoding='utf-8').replace('assert report["verified_authority_count"] == 54','assert report["verified_authority_count"] == 55').replace('assert report["register_scope_count"] == 56','assert report["register_scope_count"] == 57').replace('assert report["complete_register_scope_count"] == 56','assert report["complete_register_scope_count"] == 57'); p.write_text(text,encoding='utf-8')

          p=root/'.github/workflows/public-pages.yml'; text=p.read_text(encoding='utf-8'); text=text.replace("      - 'src/white_list_archive/parsers/laquila_tables.py'\n", "      - 'src/white_list_archive/parsers/laquila_tables.py'\n      - 'src/white_list_archive/parsers/chieti_legacy_doc.py'\n").replace('sudo apt-get install -y --no-install-recommends poppler-utils;', 'sudo apt-get install -y --no-install-recommends poppler-utils antiword;').replace("assert reg['meta']['record_count'] == 62286", "assert reg['meta']['record_count'] == 63222").replace("'messina','laquila'}", "'messina','laquila','chieti'}").replace("'messina-ordinary','laquila-ordinary'", "'messina-ordinary','laquila-ordinary','chieti-ordinary'").replace("assert reg['meta']['authority_count'] == 54", "assert reg['meta']['authority_count'] == 55").replace("assert reg['meta']['register_count'] == 56", "assert reg['meta']['register_count'] == 57").replace("assert pref['meta']['published_count'] == 54", "assert pref['meta']['published_count'] == 55").replace("assert pref['meta']['mapped_count'] == 54", "assert pref['meta']['mapped_count'] == 55"); p.write_text(text,encoding='utf-8')

          p=root/'tests/public_portal_browser.cjs'; text=p.read_text(encoding='utf-8').replace("assert.ok(labels.includes(\"White List ordinaria · Prefettura dell'Aquila\"));", "assert.ok(labels.includes(\"White List ordinaria · Prefettura dell'Aquila\"));\n      assert.ok(labels.includes('White List ordinaria · Prefettura di Chieti'));" ).replace('assert.equal(stats.total,62286);','assert.equal(stats.total,63222);').replace("'messina','laquila'].includes(r.authority_key)", "'messina','laquila','chieti'].includes(r.authority_key)")
          anchor="      assert.equal(laquila.filter(r=>r.identifier_field_raw&&r.identifiers.length===0).length,5);"; assert anchor in text
          block="\n      const chieti=registry.records.filter(r=>r.authority_key==='chieti');\n      assert.equal(chieti.length,936);\n      assert.equal(chieti.filter(r=>r.source_key==='chieti-listed').length,759);\n      assert.equal(chieti.filter(r=>r.source_key==='chieti-applicants').length,177);\n      assert.deepEqual(statusCounts(chieti),{cancellation_related:1,expired_observed:10,listed:544,other_or_unknown:7,pending:169,rejected_or_denied:1,renewal_update_in_progress:204});\n      assert.equal(new Set(chieti.map(r=>r.record_locator)).size,936);\n      assert.equal(chieti.filter(r=>r.identifiers.length>0).length,904);\n      assert.equal(chieti.filter(r=>r.source_key==='chieti-listed'&&!r.observed_listing_date&&r.source_fields.listing_date_raw_variants.length>0).length,7);\n      assert.equal(chieti.filter(r=>r.source_key==='chieti-listed'&&!r.observed_expiry_date&&r.source_fields.expiry_date_raw_variants.length>0).length,12);\n      assert.equal(chieti.filter(r=>r.source_key==='chieti-applicants'&&!r.application_date).length,5);"; text=text.replace(anchor,anchor+block); p.write_text(text,encoding='utf-8')
          PY

          cat > docs/sources/chieti-operational-check-2026-09-18.md <<'EOF'
          # Chieti White List operational check — 18 September 2026

          The Prefettura di Chieti official White List surface was revalidated on 18 September 2026. The current registered-company page exposes **Elenco Iscritti White List - Agg. 18 Settembre 2026** and the current applicant page exposes **Elenco Richiedenti Iscrizione in White List - Agg. 18 Settembre 2026**. Both are legacy Word (`.doc`) attachments, parsed through `antiword` table output rather than inferred from rendered prose.

          Two independent cache-bypassed GETs of each current attachment were byte-identical: registered companies `09c9b3ae1b1f4145c2a3795738a8d80d872c9816752cedb31b34cd730d801ddd`; applicants `2628230c417cf7b961d4a22490ba04f1b548c512782bd19a211890e11df54dc1`.

          The registered attachment contains 1,352 activity-sector rows across ten headings. Exact repeated observations across sectors are grouped conservatively into **759 observations**: 544 `listed`, 204 `renewal_update_in_progress`, 10 `expired_observed`, and one `cancellation_related`. Structured identifier coverage is 731/759. Seven grouped observations retain non-normalised listing-date typography and 12 retain non-normalised expiry-date typography. One registered sector row has a blank company-name cell but an explicit office and identifier; it is retained without inferential filling. Legacy document metadata contains a stale Teramo template title; source identity rests on the Chieti official pages, current attachment links and table content.

          The applicant attachment contains **177 observations**, all retained: 169 `pending`, seven `other_or_unknown` for explicit archived or transferred-competence outcomes, and one `rejected_or_denied` for the explicit interdittiva outcome. Structured identifier coverage is 173/177. Five rows have malformed or missing application dates and preserve their raw source values.

          Publication is byte-pinned (`raw_sha256`) and fail-closed on activity headings, row/observation denominators, applicant outcome vocabulary, status distributions and identifier coverage. Both listed and applicant populations are positively evidenced.
          EOF

          cat > tests/test_chieti_parser_semantics.py <<'PY'
          from white_list_archive.parsers.chieti_legacy_doc import _applicant_status, _listed_status, _source_date, _source_identifiers

          def test_chieti_dates_are_conservative():
              assert _source_date("13 ottobre 2026") == "2026-10-13"
              assert _source_date("27/05/2015") == "2015-05-27"
              assert _source_date("1° LUGLIO 2019") == "2019-07-01"
              assert _source_date("23 maggio 20256") == ""
              assert _source_date("8 febbario 2022") == ""

          def test_chieti_identifier_extraction_preserves_only_strict_shapes():
              assert _source_identifiers("c.f.DLRRRT65S18D763Z p.IVA 01994310694") == ["01994310694", "DLRRRT65S18D763Z"]
              assert _source_identifiers("p.IVA 003253330695") == []

          def test_chieti_statuses_require_positive_source_text():
              assert _listed_status("") == "listed"
              assert _listed_status("Richiesta di rinnovo in data 09/07/2026") == "renewal_update_in_progress"
              assert _listed_status("ISCRIZIONE SCADUTA") == "expired_observed"
              assert _listed_status("richiesta cancellazione per trasferimento sede legale") == "cancellation_related"
              assert _applicant_status("IN ISTRUTTORIA") == "pending"
              assert _applicant_status("") == "pending"
              assert _applicant_status("Istanza archiviata con D.P. 1") == "other_or_unknown"
              assert _applicant_status("Istruttoria trasferita per competenza alla Prefettura di Pescara") == "other_or_unknown"
              assert _applicant_status("Istanza respinta a seguito di informativa interdittiva") == "rejected_or_denied"
          PY

          python -m pytest -q tests/test_chieti_parser_semantics.py tests/test_source_population_coverage.py tests/test_source_registry.py
      - name: Commit permanent integration checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.csv data/monitoring/national_coverage.json data/publication/multi_prefecture_pilot.json data/source_registry/source_series_inventory.csv data/source_registry/verified_primary_pages.csv docs/sources/chieti-operational-check-2026-09-18.md src/white_list_archive/parsers/chieti_legacy_doc.py src/white_list_archive/publishing/public_national_registry.py tests/public_portal_browser.cjs tests/test_chieti_parser_semantics.py tests/test_source_population_coverage.py tests/test_source_registry.py .github/workflows/public-pages.yml
          git diff --cached --check
          git commit -m 'Integrate Chieti current White List populations'
          git push origin HEAD:expansion/chieti-2026-09-18
