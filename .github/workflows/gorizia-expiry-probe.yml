name: Gorizia expiry probe

on:
  push:
    branches:
      - expansion/gorizia-2026-09-13
    paths:
      - .github/workflows/gorizia-expiry-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install probe runtime
        run: python -m pip install --disable-pip-version-check requests python-docx

      - name: Inspect byte-pinned listed source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import requests
          from docx import Document

          url = "https://prefettura.interno.gov.it/sites/default/files/0/2026-08/gorizia-elenco-ditte-iscritte-wl.docx"
          expected = "680f0822f56ce7499a5d3f6c9e524d3d33b631feca51886e57e70fdf9e5fbd6d"
          headers = {
              "User-Agent": "Mozilla/5.0 whitelist-archive-gorizia-expiry-probe/1.0",
              "Referer": "https://prefettura.interno.gov.it/it/prefetture/gorizia/evidenza/white-list",
              "Connection": "close",
          }
          r = requests.get(url, headers=headers, timeout=(20, 90), allow_redirects=True)
          r.raise_for_status()
          body = r.content
          digest = hashlib.sha256(body).hexdigest()
          if digest != expected:
              raise RuntimeError(f"Gorizia listed byte drift: {digest} != {expected}")
          path = Path("tmp/gorizia-expiry-probe.docx")
          path.write_bytes(body)
          doc = Document(path)
          blank = []
          total = 0
          for section, table in enumerate(doc.tables, start=1):
              for source_row, row in enumerate(table.rows[1:], start=2):
                  values = [" ".join(cell.text.split()) for cell in row.cells]
                  if not any(values):
                      continue
                  total += 1
                  if len(values) != 7:
                      raise RuntimeError(f"unexpected row shape section={section} row={source_row}: {values!r}")
                  if not values[5]:
                      blank.append({
                          "section": section,
                          "source_row": source_row,
                          "name": values[0],
                          "office": values[1],
                          "identifier_raw": values[3],
                          "listing_raw": values[4],
                          "expiry_raw": values[5],
                          "update_raw": values[6],
                      })
          report = {
              "sha256": digest,
              "bytes": len(body),
              "sector_rows": total,
              "blank_expiry_rows": len(blank),
              "rows": blank,
          }
          Path("tmp/gorizia_expiry_probe.json").write_text(json.dumps(report, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY

      - name: Checkpoint probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/gorizia_expiry_probe.json
          if git diff --cached --quiet; then
            echo "No expiry-probe change to checkpoint."
            exit 0
          fi
          git commit -m "Checkpoint Gorizia blank expiry evidence"
          git push
