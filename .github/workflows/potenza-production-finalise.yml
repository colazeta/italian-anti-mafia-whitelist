name: Potenza production finaliser (temporary)

on:
  push:
    branches:
      - expansion/potenza-2026-09-15
    paths:
      - .github/workflows/potenza-production-finalise.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: potenza-production-finalise-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply permanent Potenza finalisation outside workflow files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          # 1. Promote only the already validated Potenza canonical-integration flag.
          coverage_path = Path('data/monitoring/national_coverage.json')
          coverage = json.loads(coverage_path.read_text(encoding='utf-8'))
          touched = []
          def walk(value):
              if isinstance(value, dict):
                  if value.get('authority_key') == 'potenza' and 'canonical_integration_validated' in value:
                      assert value['canonical_integration_validated'] is False
                      assert value.get('durable_evidence_verified') is False
                      value['canonical_integration_validated'] = True
                      touched.append(value)
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(coverage)
          assert len(touched) == 1, f'expected one Potenza canonical flag, found {len(touched)}'
          coverage_path.write_text(json.dumps(coverage, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 2. Record the successful national candidate without promoting durable evidence.
          note_path = Path('docs/sources/potenza-operational-check-2026-09-15.md')
          note = note_path.read_text(encoding='utf-8')
          old = '`canonical_integration_validated=false` at this stage. `durable_evidence_verified=false`; immutable evidence promotion remains a separate infrastructure control and is not inferred from live-source availability.'
          new = ('`canonical_integration_validated=true`: the national candidate build completed successfully with '
                 '51,088 public observations, 45 published Prefectures, 46 registers and 47 mapped Prefectures, '
                 'including exactly 1,034 Potenza observations and 1,034 distinct Potenza record locators. '
                 '`durable_evidence_verified=false`; immutable evidence promotion remains a separate infrastructure '
                 'control and is not inferred from live-source availability.')
          assert note.count(old) == 1
          note_path.write_text(note.replace(old, new), encoding='utf-8')

          # 3. Promote the browser acceptance boundary and add explicit Potenza invariants.
          browser_path = Path('tests/public_portal_browser.cjs')
          browser = browser_path.read_text(encoding='utf-8')
          browser = browser.replace(
              "      assert.ok(labels.includes('White List — Prefettura di Torino · Prefettura di Torino'));\n",
              "      assert.ok(labels.includes('White List — Prefettura di Torino · Prefettura di Torino'));\n"
              "      assert.ok(labels.includes('White List ordinaria · Prefettura di Potenza'));\n",
              1,
          )
          assert browser.count('assert.equal(stats.total,50054);') == 1
          browser = browser.replace('assert.equal(stats.total,50054);', 'assert.equal(stats.total,51088);', 1)
          old_previous = "'catanzaro','lecco','torino'].includes(r.authority_key)"
          new_previous = "'catanzaro','lecco','torino','potenza'].includes(r.authority_key)"
          assert browser.count(old_previous) == 1
          browser = browser.replace(old_previous, new_previous, 1)
          torino_anchor = "      assert.equal(torino.filter(r=>r.source_key==='torino-listed'&&r.application_date==='').length,1241);\n"
          assert browser.count(torino_anchor) == 1
          potenza_block = """      const potenza=registry.records.filter(r=>r.authority_key==='potenza');
          assert.equal(potenza.length,1034);
          assert.equal(potenza.filter(r=>r.source_key==='potenza-combined').length,1034);
          assert.deepEqual(statusCounts(potenza),{listed:217,pending:375,renewal_update_in_progress:442});
          assert.equal(new Set(potenza.map(r=>r.record_locator)).size,1034);
          assert.equal(potenza.filter(r=>r.identifiers.length>0).length,1033);
          assert.equal(potenza.filter(r=>r.identifier_field_raw&&r.identifiers.length===0).length,1);
          assert.equal(potenza.filter(r=>r.application_date!=='').length,1034);
          assert.equal(potenza.filter(r=>r.observed_listing_date!=='').length,659);
          assert.equal(potenza.filter(r=>r.observed_expiry_date!=='').length,659);
          assert.equal(potenza.filter(r=>r.requested_activities.length>0).length,0);
          assert.ok(potenza.every(r=>r.parser_name==='potenza_combined'&&r.parser_version==='2'));
          assert.ok(potenza.every(r=>r.source_fields.physical_locator.startsWith('source-id:')));
          assert.equal(potenza.filter(r=>r.source_fields.notes).length,1);
          const gap=potenza.filter(r=>r.source_fields.physical_locator==='source-id:903');
          assert.equal(gap.length,1);
          assert.equal(gap[0].name,'GAP S.R.L.S.');
          assert.equal(gap[0].source_status,'renewal_update_in_progress');
          assert.equal(gap[0].observed_listing_date,'2024-11-28');
          assert.equal(gap[0].observed_expiry_date,'2025-11-28');
          assert.equal(gap[0].source_fields.in_aggiornamento,'1');
"""
          browser = browser.replace(torino_anchor, torino_anchor + potenza_block, 1)
          browser_path.write_text(browser, encoding='utf-8')

          # 4. Prepare the permanent Pages workflow as a normal temporary file. The
          # connector will promote it into .github/workflows after this job, because
          # the Actions token intentionally does not rewrite workflow files.
          workflow = Path('.github/workflows/public-pages.yml').read_text(encoding='utf-8')
          parser_anchor = "      - 'src/white_list_archive/parsers/torino_tables.py'\n"
          assert workflow.count(parser_anchor) == 1
          workflow = workflow.replace(parser_anchor, parser_anchor + "      - 'src/white_list_archive/parsers/potenza_webapp.py'\n", 1)
          assert workflow.count("assert reg['meta']['record_count'] == 50054") == 1
          workflow = workflow.replace("assert reg['meta']['record_count'] == 50054", "assert reg['meta']['record_count'] == 51088", 1)
          authority_anchor = "'catanzaro','lecco','torino'}"
          assert workflow.count(authority_anchor) == 1
          workflow = workflow.replace(authority_anchor, "'catanzaro','lecco','torino','potenza'}", 1)
          register_anchor = "'catanzaro-ordinary','lecco-ordinary','torino-ordinary'\n"
          assert workflow.count(register_anchor) == 1
          workflow = workflow.replace(register_anchor, "'catanzaro-ordinary','lecco-ordinary','torino-ordinary','potenza-ordinary'\n", 1)
          assert workflow.count("assert reg['meta']['authority_count'] == 44") == 1
          assert workflow.count("assert reg['meta']['register_count'] == 45") == 1
          assert workflow.count("assert pref['meta']['published_count'] == 44") == 1
          workflow = workflow.replace("assert reg['meta']['authority_count'] == 44", "assert reg['meta']['authority_count'] == 45", 1)
          workflow = workflow.replace("assert reg['meta']['register_count'] == 45", "assert reg['meta']['register_count'] == 46", 1)
          workflow = workflow.replace("assert pref['meta']['published_count'] == 44", "assert pref['meta']['published_count'] == 45", 1)
          torino_wf_anchor = "          assert sum(r['source_key'] == 'torino-listed' and r['application_date'] == '' for r in torino_records) == 1241\n"
          assert workflow.count(torino_wf_anchor) == 1
          potenza_wf_block = """          potenza = [x for x in pref['prefectures'] if x['authority_key'] == 'potenza']
          assert len(potenza) == 1 and potenza[0]['mapped'] and potenza[0]['published'] and potenza[0]['series_count'] == 1
          potenza_records = [r for r in reg['records'] if r['authority_key'] == 'potenza']
          assert len(potenza_records) == 1034
          assert all(r['source_key'] == 'potenza-combined' for r in potenza_records)
          assert sum(r['source_status'] == 'listed' for r in potenza_records) == 217
          assert sum(r['source_status'] == 'pending' for r in potenza_records) == 375
          assert sum(r['source_status'] == 'renewal_update_in_progress' for r in potenza_records) == 442
          assert len({r['record_locator'] for r in potenza_records}) == 1034
          assert sum(bool(r['identifiers']) for r in potenza_records) == 1033
          assert sum(bool(r['identifier_field_raw']) and not r['identifiers'] for r in potenza_records) == 1
          assert sum(bool(r['application_date']) for r in potenza_records) == 1034
          assert sum(bool(r['observed_listing_date']) for r in potenza_records) == 659
          assert sum(bool(r['observed_expiry_date']) for r in potenza_records) == 659
          assert sum(bool(r['requested_activities']) for r in potenza_records) == 0
          assert all(r['parser_name'] == 'potenza_combined' and r['parser_version'] == '2' for r in potenza_records)
          assert all(r['source_fields']['physical_locator'].startswith('source-id:') for r in potenza_records)
          assert sum(bool(r['source_fields']['notes']) for r in potenza_records) == 1
          gap = [r for r in potenza_records if r['source_fields']['physical_locator'] == 'source-id:903']
          assert len(gap) == 1
          assert gap[0]['name'] == 'GAP S.R.L.S.'
          assert gap[0]['source_status'] == 'renewal_update_in_progress'
          assert gap[0]['observed_listing_date'] == '2024-11-28'
          assert gap[0]['observed_expiry_date'] == '2025-11-28'
          assert gap[0]['source_fields']['in_aggiornamento'] == '1'
"""
          workflow = workflow.replace(torino_wf_anchor, torino_wf_anchor + potenza_wf_block, 1)
          Path('tmp/potenza-public-pages.yml').write_text(workflow, encoding='utf-8')
          PY

      - name: Validate finalisation edits
        run: |
          python -m pip install -e '.[dev,database,storage]'
          pytest -q
          node --check tests/public_portal_browser.cjs
          git diff --check

      - name: Commit non-workflow finalisation and prepared Pages workflow
        shell: bash
        env:
          BRANCH: expansion/potenza-2026-09-15
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Remote branch advanced during Potenza finalisation: $remote_sha != $GITHUB_SHA" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/monitoring/national_coverage.json docs/sources/potenza-operational-check-2026-09-15.md tests/public_portal_browser.cjs tmp/potenza-public-pages.yml
          git rm tmp/potenza_integrate_candidate.py
          git commit -m 'chore(potenza): finalise validated public integration'
          git push origin "HEAD:$BRANCH"
