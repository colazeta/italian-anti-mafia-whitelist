name: Istat municipality production smoke

on:
  push:
    branches:
      - feature/istat-municipality-crosswalk
    paths:
      - '.github/workflows/istat-municipality-production-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project
        run: python -m pip install -e .
      - name: Acquire and validate official Istat municipality workbook
        run: |
          white-list-istat-municipalities-acquire \
            --output-dir artifacts/istat \
            --expected-sha256 83842076860450f7e482daecea6b7a769f5f93d0bf5b0d48802b44896d7a26d5
          python - <<'PY'
          import json
          from pathlib import Path
          from white_list_archive.acquisition.istat_municipalities import iter_municipalities

          root = Path('artifacts/istat')
          manifest = json.loads((root / 'istat-municipalities-2026-02-21.manifest.json').read_text(encoding='utf-8'))
          assert manifest['provider'] == 'ISTAT'
          assert manifest['provider_version'] == '2026-02-21'
          assert manifest['municipality_count'] == 7894
          assert manifest['xlsx']['sha256'] == '83842076860450f7e482daecea6b7a769f5f93d0bf5b0d48802b44896d7a26d5'

          rows = list(iter_municipalities(root / manifest['crosswalk_csv']['path']))
          assert len(rows) == 7894
          by_code = {row['municipality_code']: row for row in rows}
          cosenza = by_code['078045']
          rende = by_code['078102']
          assert cosenza['municipality_name_it'] == 'Cosenza'
          assert cosenza['cadastral_code'] == 'D086'
          assert cosenza['province_plate'] == 'CS'
          assert cosenza['region_name'] == 'Calabria'
          assert cosenza['nuts3_2024'] == 'ITF61'
          assert rende['municipality_name_it'] == 'Rende'
          assert rende['cadastral_code'] == 'H235'
          assert rende['nuts3_2024'] == 'ITF61'
          print(json.dumps({
              'provider_version': manifest['provider_version'],
              'municipality_count': len(rows),
              'cosenza': cosenza,
              'rende': rende,
          }, ensure_ascii=False, indent=2))
          PY
