name: Discover national White List index

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install -e .
      - name: Discover official national index
        run: white-list-national-index --output national-white-list-index.csv
      - name: Show discovery summary
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path('national-white-list-index.csv')
          rows = list(csv.DictReader(path.open(encoding='utf-8')))
          print(f'discovered_rows={len(rows)}')
          for row in rows[:5]:
              print(row['jurisdiction_name'], row['white_list_url'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: national-white-list-index
          path: national-white-list-index.csv
          if-no-files-found: error
          retention-days: 30
