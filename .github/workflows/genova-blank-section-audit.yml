name: Genova blank section audit

on:
  push:
    branches: [expansion/genova-2026-09-12]
    paths: [.github/workflows/genova-blank-section-audit.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/genova-2026-09-12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pdfplumber
      - name: Capture exact page evidence for blank section cells
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, re, tempfile, requests, pdfplumber
          profile=json.loads(pathlib.Path('tmp/genova_source_profile.json').read_text(encoding='utf-8'))
          targets={'listed':[5,30,32,52,86,89,94,111], 'applicant':[6,15]}
          out={'authority_key':'genova','audited_on':'2026-09-12','targets':{}}
          session=requests.Session(); session.headers.update({'User-Agent':'italian-anti-mafia-whitelist blank-section audit/1.0'})
          def clean(v): return re.sub(r'\s+',' ',(v or '').replace('\u00a0',' ')).strip()
          with tempfile.TemporaryDirectory(prefix='genova-blank-sections-') as td:
            td=pathlib.Path(td)
            for scope,pages in targets.items():
              cfg=profile['sources'][scope]
              r=session.get(cfg['resource_url'],timeout=(15,120)); r.raise_for_status()
              sha=hashlib.sha256(r.content).hexdigest()
              if sha!=cfg['sha256']: raise SystemExit(f'{scope} source drift: {sha}')
              p=td/f'{scope}.pdf'; p.write_bytes(r.content)
              with pdfplumber.open(p) as pdf:
                for page_no in pages:
                  page=pdf.pages[page_no-1]
                  tables=page.extract_tables() or []
                  out['targets'][f'{scope}-page-{page_no}']={
                    'text': clean(page.extract_text() or ''),
                    'tables': [[[clean(c) for c in row] for row in (table or [])] for table in tables],
                  }
          path=pathlib.Path('tmp/genova_blank_section_audit.json')
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Checkpoint audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/genova_blank_section_audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint Genova blank-section audit'
            git push origin HEAD:expansion/genova-2026-09-12
          fi
