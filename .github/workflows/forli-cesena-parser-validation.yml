name: Forli-Cesena parser validation

on:
  push:
    branches:
      - expansion/forli-cesena-2026-09-13
    paths:
      - .github/workflows/forli-cesena-parser-validation.yml
      - src/white_list_archive/parsers/forli_cesena_combined.py
      - tests/test_forli_cesena_parser_semantics.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forli-cesena-parser-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/forli-cesena-2026-09-13
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install -e .[dev]

      - name: Fetch byte-pinned official PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/forli_validation tmp
          url='https://prefettura.interno.gov.it/sites/default/files/44/2026-09/wlp-al-11-09-2026.pdf'
          landing='https://prefettura.interno.gov.it/it/prefetture/forli-cesena/evidenza/white-list'
          expected='f18e1980e6f7f5bc2ac55a55926ab7a221f290fc7a40f5d0781eef4885455468'
          curl -L -sS --fail --connect-timeout 20 --max-time 120 --retry 3 --retry-delay 2 --retry-all-errors \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -H 'Accept: application/pdf,application/octet-stream;q=0.9,*/*;q=0.8' -H "Referer: $landing" \
            -o /tmp/forli_validation/source.pdf "$url"
          actual=$(sha256sum /tmp/forli_validation/source.pdf | awk '{print $1}')
          test "$actual" = "$expected"

      - name: Validate parser and public-contract projection
        id: parser
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, traceback
          from collections import Counter
          from pathlib import Path

          from white_list_archive.parsers.forli_cesena_combined import parse_forli_cesena_combined
          from white_list_archive.publishing.public_contract import public_record

          report = Path('tmp/forli_cesena_parser_validation.txt')
          cfg = {
              'source_key': 'forli-cesena-combined',
              'authority_key': 'forli-cesena',
              'authority_name': 'Prefettura di Forlì-Cesena',
              'register_key': 'forli-cesena-white-list',
              'register_name': 'White list',
              'population_scope': 'combined',
              'reference_date': '2026-09-11',
              'source_page_url': 'https://prefettura.interno.gov.it/it/prefetture/forli-cesena/evidenza/white-list',
              'resource_url': 'https://prefettura.interno.gov.it/sites/default/files/44/2026-09/wlp-al-11-09-2026.pdf',
              'sha256': 'f18e1980e6f7f5bc2ac55a55926ab7a221f290fc7a40f5d0781eef4885455468',
          }
          lines = []
          try:
              batch = parse_forli_cesena_combined(Path('/tmp/forli_validation/source.pdf'), cfg)
              records = batch.records
              for record in records:
                  public_record(record)
              statuses = Counter(record['source_status'] for record in records)
              assert len(records) == 749
              assert statuses == Counter({'listed': 401, 'renewal_update_in_progress': 204, 'pending': 144})
              assert batch.diagnostics['identifier_kind_counts'] == {
                  'strict_11_digit': 747,
                  'reviewed_blank_identifier_foreign_exception': 1,
                  'reviewed_10_digit_source_exception': 1,
              }
              assert batch.diagnostics['duplicate_strict_identifiers'] == {'03690740406': 2, '04581460260': 2}
              assert batch.diagnostics['dated_provvedimento_rows'] == 600
              assert batch.diagnostics['status_date_rows'] == 318
              assert batch.diagnostics['reviewed_cid_artifact_rows'] == 1
              assert sum(bool(record['identifiers']) for record in records) == 747

              v8 = [record for record in records if record['identifier_field_raw'] == '0543034730']
              assert len(v8) == 1 and v8[0]['identifiers'] == [] and v8[0]['source_status'] == 'pending'
              foreign = [record for record in records if record['name'] == "GRUPPO IDRODEMOLIZIONI SRL - SOCIETA' ESTERA"]
              assert len(foreign) == 1 and foreign[0]['identifier_field_raw'] == '' and foreign[0]['source_status'] == 'pending'
              aquamet = [record for record in records if record['identifier_field_raw'] == '02161921008']
              assert len(aquamet) == 1 and aquamet[0]['name'] == 'AQUAMET S.R.L. (EX AQUAMET SPA)'
              for duplicate_id, expected_count in {'03690740406': 2, '04581460260': 2}.items():
                  assert sum(duplicate_id in record['identifiers'] for record in records) == expected_count

              lines.extend([
                  'parser_gate=VALIDATED',
                  'official_sha256=' + cfg['sha256'],
                  'records=749',
                  'status_counts=' + json.dumps(dict(statuses), sort_keys=True),
                  'identifier_kind_counts=' + json.dumps(batch.diagnostics['identifier_kind_counts'], sort_keys=True),
                  'duplicate_strict_identifiers=' + json.dumps(batch.diagnostics['duplicate_strict_identifiers'], sort_keys=True),
                  'dated_provvedimento_rows=600',
                  'status_date_rows=318',
                  'reviewed_cid_artifact_rows=1',
                  'public_contract_records=749',
                  'fabricated_identifier_rows=0',
                  'diagnostics=' + json.dumps(batch.diagnostics, ensure_ascii=False, sort_keys=True),
              ])
          except Exception:
              lines.append('parser_gate=FAILED')
              lines.append(traceback.format_exc())
              report.write_text('\n'.join(lines) + '\n', encoding='utf-8')
              print(report.read_text(encoding='utf-8'))
              raise
          report.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(report.read_text(encoding='utf-8'))
          PY

      - name: Run permanent semantic tests
        if: always()
        shell: bash
        run: pytest -q tests/test_forli_cesena_parser_semantics.py

      - name: Commit validation checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/forli_cesena_parser_validation.txt || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Checkpoint Forli-Cesena parser validation'
          git fetch origin expansion/forli-cesena-2026-09-13
          git rebase origin/expansion/forli-cesena-2026-09-13
          git push origin HEAD:expansion/forli-cesena-2026-09-13

      - name: Enforce parser validation gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'parser_gate=VALIDATED' tmp/forli_cesena_parser_validation.txt
