name: Napoli semantic audit

on:
  push:
    branches:
      - 'expansion/napoli-2026-09-13'
    paths:
      - '.github/workflows/napoli-semantic-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install parser runtime
        run: python -m pip install -e '.[publication]'

      - name: Audit pinned Napoli source semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/napoli_semantic_audit
          curl --fail --location --silent --show-error --retry 2 --retry-all-errors \
            --user-agent 'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelist/1.0; +https://github.com/colazeta/italian-anti-mafia-whitelist)' \
            -o tmp/napoli_semantic_audit/listed.pdf \
            'https://prefettura.interno.gov.it/sites/default/files/79/2026-09/whitelistprefnapoli_11_settembre_26.pdf'
          curl --fail --location --silent --show-error --retry 2 --retry-all-errors \
            --user-agent 'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelist/1.0; +https://github.com/colazeta/italian-anti-mafia-whitelist)' \
            -o tmp/napoli_semantic_audit/applicants.pdf \
            'https://prefettura.interno.gov.it/sites/default/files/79/2026-09/ditterichiedenti_wl_11_settembre_26.pdf'
          echo '93a8635c0bd9b00587f9cc60c52752061bd239a7c16cb34b64a11e495a0ab4be  tmp/napoli_semantic_audit/listed.pdf' | sha256sum -c -
          echo '053be2500b07a7da536c344aede12084dde9b7cf28b4717af99764cbd05e7e6b  tmp/napoli_semantic_audit/applicants.pdf' | sha256sum -c -

          python - <<'PY'
          from collections import Counter
          from datetime import date
          from pathlib import Path
          import json
          import re
          import pdfplumber

          root = Path('tmp/napoli_semantic_audit')
          specs = {'listed': (60, 2259, 9), 'applicants': (215, 2571, 8)}
          strict_id = re.compile(r'^(?:\d{11}|[A-Za-z]{6}[0-9A-Za-z]{10})$')
          date2 = re.compile(r'^(\d{1,2})/(\d{1,2})/(\d{2})$')
          date4 = re.compile(r'^(\d{1,2})/(\d{1,2})/(\d{4})$')
          section = re.compile(r'^(?:I|II|III|IV|V|VI|VII|VIII|IX|X)(?:-(?:I|II|III|IV|V|VI|VII|VIII|IX|X))*$')

          def clean(v):
              return re.sub(r'\s+', ' ', v or '').strip()

          def parsed_date(raw):
              raw = clean(raw)
              if not raw:
                  return ('blank', '')
              m = date2.fullmatch(raw)
              if m:
                  d, mo, y = map(int, m.groups()); y += 2000
              else:
                  m = date4.fullmatch(raw)
                  if not m: return ('malformed', raw)
                  d, mo, y = map(int, m.groups())
              try:
                  return ('valid', date(y, mo, d).isoformat())
              except ValueError:
                  return ('invalid_calendar', raw)

          report = {'prefecture':'Napoli','reference_date':'2026-09-11','sources':{}}
          for name,(pages,terminal,width) in specs.items():
              counters = {
                  'names_blank':0,'office_blank':0,'secondary_blank':0,'identifier_blank':0,
                  'strict_identifier':0,'raw_identifier_only':0,'activities_blank':0,
                  'primary_date_blank':0,'outcome_blank':0,
              }
              ids_raw=Counter(); activity_raw=Counter(); outcome_raw=Counter();
              primary_date_shapes=Counter(); secondary_date_shapes=Counter();
              malformed_primary=Counter(); malformed_secondary=Counter();
              bad_sections=Counter(); ordinals=[]; semantic=[]
              with pdfplumber.open(root/f'{name}.pdf') as pdf:
                  if len(pdf.pages)!=pages: raise RuntimeError(f'{name} page count drift')
                  for pn,p in enumerate(pdf.pages,start=1):
                      tables=p.extract_tables() or []
                      if len(tables)!=1: raise RuntimeError(f'{name} table count drift p{pn}: {len(tables)}')
                      for rn,row0 in enumerate(tables[0] or [],start=1):
                          row=[clean(x) for x in (row0 or [])]
                          if len(row)!=width: raise RuntimeError(f'{name} row width drift p{pn}:r{rn}: {len(row)}')
                          if not row[0].isdigit(): continue
                          n=int(row[0])
                          if not 1<=n<=terminal: continue
                          ordinals.append(n)
                          if name=='listed':
                              _,company,office,secondary,ident,activities,primary,secondary_date,outcome=row
                          else:
                              _,company,office,secondary,ident,activities,primary,outcome=row
                              secondary_date=''
                          if not company: counters['names_blank']+=1
                          if not office: counters['office_blank']+=1
                          if not secondary: counters['secondary_blank']+=1
                          if not ident: counters['identifier_blank']+=1
                          elif strict_id.fullmatch(ident): counters['strict_identifier']+=1
                          else:
                              counters['raw_identifier_only']+=1; ids_raw[ident]+=1
                          if not activities: counters['activities_blank']+=1
                          elif not section.fullmatch(activities): bad_sections[activities]+=1
                          if not primary: counters['primary_date_blank']+=1
                          pk,pv=parsed_date(primary); primary_date_shapes[pk]+=1
                          if pk in {'malformed','invalid_calendar'}: malformed_primary[primary]+=1
                          if name=='listed':
                              sk,sv=parsed_date(secondary_date); secondary_date_shapes[sk]+=1
                              if sk in {'malformed','invalid_calendar'}: malformed_secondary[secondary_date]+=1
                          if not outcome: counters['outcome_blank']+=1
                          outcome_raw[outcome]+=1
                          activity_raw[activities]+=1
                          semantic.append({'ordinal':n,'page':pn,'row':rn,'company':company,'office':office,'secondary':secondary,'identifier_raw':ident,'activities_raw':activities,'primary_date_raw':primary,'secondary_date_raw':secondary_date,'outcome_raw':outcome})
              expected=list(range(1,terminal+1))
              if ordinals!=expected:
                  raise RuntimeError(f'{name} ordinal sequence drift: got {len(ordinals)}')
              report['sources'][name]={
                  'records':len(semantic),
                  'counters':counters,
                  'raw_identifier_values':dict(ids_raw),
                  'primary_date_shapes':dict(primary_date_shapes),
                  'secondary_date_shapes':dict(secondary_date_shapes),
                  'malformed_primary_dates':dict(malformed_primary),
                  'malformed_secondary_dates':dict(malformed_secondary),
                  'noncanonical_activity_values':dict(bad_sections),
                  'outcome_counts':dict(outcome_raw),
                  'activity_value_count':len(activity_raw),
                  'activity_top_counts':activity_raw.most_common(40),
                  'review_rows': [r for r in semantic if (r['identifier_raw'] in ids_raw or r['primary_date_raw'] in malformed_primary or r['secondary_date_raw'] in malformed_secondary or r['activities_raw'] in bad_sections or r['outcome_raw'])],
              }
          (root/'semantic-report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps({k:{'records':v['records'],'counters':v['counters'],'primary_date_shapes':v['primary_date_shapes'],'secondary_date_shapes':v['secondary_date_shapes'],'raw_identifier_values':v['raw_identifier_values'],'malformed_primary_dates':v['malformed_primary_dates'],'malformed_secondary_dates':v['malformed_secondary_dates'],'noncanonical_activity_values':v['noncanonical_activity_values'],'outcome_counts':v['outcome_counts']} for k,v in report['sources'].items()},indent=2,ensure_ascii=False))
          PY

      - name: Upload Napoli semantic audit
        uses: actions/upload-artifact@v4
        with:
          name: napoli-semantic-audit
          path: tmp/napoli_semantic_audit/semantic-report.json
          if-no-files-found: error
