# temporary bounded promotion helper; remove before PR
name: Lucca public-pages candidate

on:
  push:
    branches:
      - expansion/lucca-2026-09-19
    paths:
      - .github/workflows/lucca-public-pages-candidate.yml

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify base and generate reviewed candidate only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          helper = Path('tmp/lucca-finalize.py')
          spec = importlib.util.spec_from_file_location('lucca_finalize', helper)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          mod.update_public_workflow()
          src = Path('.github/workflows/public-pages.yml')
          candidate = Path('tmp/lucca-public-pages-candidate.yml')
          candidate.write_bytes(src.read_bytes())
          PY
          git restore -- .github/workflows/public-pages.yml
          git diff --check
          test -f tmp/lucca-public-pages-candidate.yml
          git add tmp/lucca-public-pages-candidate.yml
          test "$(git diff --cached --name-only)" = "tmp/lucca-public-pages-candidate.yml"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage Lucca public-pages candidate'
          git push origin HEAD:expansion/lucca-2026-09-19
