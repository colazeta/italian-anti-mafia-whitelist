name: Udine line-ending fix 2026-09-11

on:
  push:
    branches: [expansion/udine-2026-09-10]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix Udine finalizer CSV line endings'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/udine-2026-09-10
          fetch-depth: 0
      - name: Patch finalizer without changing data semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/udine-production-finalizer-2026-09-10.yml')
          text=path.read_text()
          old1="writer=csv.DictWriter(f,fieldnames=fields); writer.writeheader(); writer.writerows(rows)"
          new1="writer=csv.DictWriter(f,fieldnames=fields,lineterminator='\\n'); writer.writeheader(); writer.writerows(rows)"
          old2="writer=csv.DictWriter(f,fieldnames=page_fields); writer.writeheader(); writer.writerows(pages)"
          new2="writer=csv.DictWriter(f,fieldnames=page_fields,lineterminator='\\n'); writer.writeheader(); writer.writerows(pages)"
          assert text.count(old1)==1, text.count(old1)
          assert text.count(old2)==1, text.count(old2)
          text=text.replace(old1,new1).replace(old2,new2)
          path.write_text(text)
          PY
          rm .github/workflows/udine-line-ending-fix-2026-09-11.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/udine-production-finalizer-2026-09-10.yml .github/workflows/udine-line-ending-fix-2026-09-11.yml
          git commit -m 'Prepare Udine production integration'
          git push origin HEAD:expansion/udine-2026-09-10
