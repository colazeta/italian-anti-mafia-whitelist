name: Asti clean integration gate

on:
  push:
    branches:
      - expansion/asti-2026-09-10-clean
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare publication runtime
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source_file; do
            [ -n "$source_file" ] && sudo rm -f "$source_file"
          done < <(grep -rlE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '\|dl\.google\.com/linux/chrome|d;\|packages\.google\.com/chrome|d' /etc/apt/sources.list
          fi
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends poppler-utils; then
              break
            fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[dev,publication]'
      - name: Apply Asti integration
        run: python .github/scripts/asti_integrate.py
      - name: Validate Asti and national build
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_asti_parser_semantics.py
          mkdir -p /tmp/asti-public
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/asti-public/sources \
            --registry-json /tmp/asti-public/registry.json \
            --registry-csv /tmp/asti-public/registry.csv \
            --prefectures-json /tmp/asti-public/prefectures.json \
            --prefectures-csv /tmp/asti-public/prefectures.csv
          python -c "import json; from pathlib import Path; r=json.loads(Path('/tmp/asti-public/registry.json').read_text()); p=json.loads(Path('/tmp/asti-public/prefectures.json').read_text()); a=[x for x in r['records'] if x['authority_key']=='asti']; assert r['meta']['record_count']==8823 and r['meta']['authority_count']==12 and r['meta']['register_count']==13 and p['meta']['authority_count']==106 and p['meta']['mapped_count']==35 and p['meta']['published_count']==12 and len(a)==301 and {x['reference_date'] for x in a}=={'2026-08-03'}; print('Asti validated',len(a))"
      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/white_list_archive/publishing/public_national_registry.py \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/verified_primary_pages.csv \
            data/source_registry/source_series_inventory.csv \
            data/monitoring/national_coverage.json \
            .github/workflows/public-pages.yml \
            tests/public_portal_browser.cjs \
            tests/test_asti_parser_semantics.py \
            docs/sources/asti-operational-check-2026-09-10.md
          git diff --cached --check
          git commit -m 'Integrate validated Asti public observations'
          git push origin HEAD:expansion/asti-2026-09-10-clean
