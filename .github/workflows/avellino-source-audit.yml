name: Audit Avellino White List sources

on:
  push:
    branches:
      - expansion/avellino-2026-09-10
    paths:
      - .github/workflows/avellino-source-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Map positioned text without exposing entity data
        run: |
          python -m pip install -q requests beautifulsoup4 pdfplumber
          python - <<'PY'
          import hashlib, re, tempfile
          from collections import Counter, defaultdict
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          import pdfplumber

          SOURCES = {
              'listed': ('https://prefettura.interno.gov.it/it/prefetture/avellino/white-list-elenco-imprese-iscritte', 'elenco_imprese_iscritte_whitelist_al_01-09-2026'),
              'applicants': ('https://prefettura.interno.gov.it/it/prefetture/avellino/white-list-elenco-imprese-richiedenti', 'elenco_imprese_richiedenti_iscrizione_whitelist_al_01-09-2026'),
          }
          headers = {'User-Agent': 'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelistArchive/1.0; evidence-source-check)'}
          session = requests.Session()
          date_re = re.compile(r'^\d{1,2}[./-]\d{1,2}[./-]\d{4}$')
          id_re = re.compile(r'^(?:\d{11}|[A-Z0-9]{16})$')
          safe_header_words = {
              'ragione','sociale','sede','legale','codice','fiscale','partita','iva','data','scadenza','iscrizione',
              'presentazione','istanza','sezione','aggiornamento','settori','attività','attivita','richiesta','note'
          }

          def clean(v): return ' '.join(str(v or '').replace('\u00a0',' ').split())
          def compact(v): return re.sub(r'\s+', '', clean(v))
          def cluster_lines(words, tol=2.5):
              lines=[]
              for w in sorted(words, key=lambda z:(float(z['top']), float(z['x0']))):
                  cy=(float(w['top'])+float(w['bottom']))/2
                  target=None
                  for line in reversed(lines[-4:]):
                      if abs(line['y']-cy)<=tol:
                          target=line; break
                  if target is None:
                      target={'y':cy,'words':[]}; lines.append(target)
                  target['words'].append(w)
                  target['y']=sum((float(x['top'])+float(x['bottom']))/2 for x in target['words'])/len(target['words'])
              for line in lines: line['words'].sort(key=lambda z:float(z['x0']))
              return lines
          def spans(line, pattern):
              ws=line['words']; out=[]
              for i in range(len(ws)):
                  joined=''
                  for j in range(i,min(len(ws),i+7)):
                      joined += compact(ws[j]['text'])
                      if pattern.fullmatch(joined.upper()):
                          out.append((float(ws[i]['x0']),float(ws[j]['x1']),i,j))
                          break
                      if len(joined)>20: break
              # collapse overlapping detections
              chosen=[]
              for item in out:
                  if chosen and item[2] <= chosen[-1][3]:
                      if (item[3]-item[2]) > (chosen[-1][3]-chosen[-1][2]): chosen[-1]=item
                  else: chosen.append(item)
              return chosen

          for key,(page_url,expected) in SOURCES.items():
              page=session.get(page_url,headers=headers,timeout=45); page.raise_for_status()
              soup=BeautifulSoup(page.text,'html.parser')
              matches=[]
              for a in soup.find_all('a',href=True):
                  label=' '.join(a.stripped_strings).strip()
                  if expected in re.sub(r'\s+','_',label.casefold()): matches.append((label,urljoin(page_url,a['href'])))
              if len(matches)!=1: raise SystemExit(f'{key}: expected one current source, got {len(matches)}')
              label,url=matches[0]
              r=session.get(url,headers=headers,timeout=90); r.raise_for_status(); body=r.content
              print(f'{key.upper()}_RESOURCE={url}')
              print(f'{key.upper()}_SHA256={hashlib.sha256(body).hexdigest()}')
              if not body.startswith(b'%PDF'): raise SystemExit(f'{key}: non-PDF')
              with tempfile.TemporaryDirectory() as td:
                  p=Path(td)/f'{key}.pdf'; p.write_bytes(body)
                  all_date_x=[]; all_id_x=[]; line_class_counts=Counter(); safe_headers=defaultdict(list)
                  per_page=[]
                  with pdfplumber.open(p) as pdf:
                      for page_no,page_obj in enumerate(pdf.pages,1):
                          words=page_obj.extract_words(use_text_flow=False,keep_blank_chars=False,x_tolerance=2,y_tolerance=3)
                          lines=cluster_lines(words)
                          page_dates=[]; page_ids=[]; page_classes=Counter()
                          for line in lines:
                              d=spans(line,date_re); ids=spans(line,id_re)
                              for x0,x1,_,_ in d: page_dates.append(round(x0,1)); all_date_x.append(round(x0,1))
                              for x0,x1,_,_ in ids: page_ids.append(round(x0,1)); all_id_x.append(round(x0,1))
                              cls=('D' if d else '-')+('I' if ids else '-')
                              page_classes[cls]+=1; line_class_counts[cls]+=1
                              for w in line['words']:
                                  t=clean(w['text']).casefold().strip(':').strip()
                                  if t in safe_header_words:
                                      safe_headers[t].append((page_no,round(float(w['x0']),1),round(float(w['top']),1)))
                          per_page.append({'page':page_no,'words':len(words),'lines':len(lines),'date_spans':len(page_dates),'id_spans':len(page_ids),'classes':dict(page_classes)})
                  def bins(values, step=25): return dict(sorted(Counter(int(v//step)*step for v in values).items()))
                  print(f'{key.upper()}_PAGES={len(per_page)}')
                  print(f'{key.upper()}_PER_PAGE={per_page}')
                  print(f'{key.upper()}_LINE_CLASSES={dict(line_class_counts)}')
                  print(f'{key.upper()}_DATE_X_BINS={bins(all_date_x)}')
                  print(f'{key.upper()}_ID_X_BINS={bins(all_id_x)}')
                  print(f'{key.upper()}_DATE_X_RANGE={(min(all_date_x),max(all_date_x)) if all_date_x else None}')
                  print(f'{key.upper()}_ID_X_RANGE={(min(all_id_x),max(all_id_x)) if all_id_x else None}')
                  for token in sorted(safe_headers):
                      # header labels only; retain first six positions to detect repeated page headers
                      print(f'{key.upper()}_HEADER_{token.upper()}={safe_headers[token][:6]}')
          PY
