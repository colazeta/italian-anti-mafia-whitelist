name: Milano reviewed-boundary rebase finaliser

on:
  push:
    branches:
      - fix/milano-source-drift-2026-09-21
    paths:
      - '.github/workflows/milano-rebase-finalise.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milano-reviewed-boundary-rebase
  cancel-in-progress: false

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout maintenance branch with history
        uses: actions/checkout@v4
        with:
          ref: fix/milano-source-drift-2026-09-21
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reconcile reviewed Milano surface onto current main
        shell: bash
        run: |
          set -euo pipefail
          REVIEWED_HEAD='1fa68601b430c6df767f5e263b57c9583a4395e1'
          OLD_BASE='a7d23dd6c71f0c13b4ab09d332632b315aec69b5'
          EXPECTED_MAIN='702f5a91bb3943871cddb43abe7166e978acb243'
          SOURCE_REPO="$GITHUB_WORKSPACE"
          export REVIEWED_HEAD OLD_BASE SOURCE_REPO

          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git cat-file -e "$REVIEWED_HEAD^{commit}"
          git cat-file -e "$OLD_BASE^{commit}"

          patch_paths=(
            '.github/workflows/public-pages.yml'
            'data/publication/multi_prefecture_pilot.json'
            'data/source_registry/source_series_inventory.csv'
            'docs/sources/milano-source-transition-2026-09-21-fe508.md'
            'src/white_list_archive/parsers/milano_webapp.py'
            'tests/public_portal_browser.cjs'
            'tests/test_milano_parser_semantics.py'
          )

          git diff --binary "$OLD_BASE" "$REVIEWED_HEAD" -- "${patch_paths[@]}" > /tmp/milano-reviewed.patch
          test -s /tmp/milano-reviewed.patch
          rm -rf /tmp/milano-clean
          git worktree add --detach /tmp/milano-clean origin/main
          git -C /tmp/milano-clean apply --3way --index /tmp/milano-reviewed.patch

          # national_coverage.json also advanced for Lodi/Potenza on current main.
          # Merge only Milano's reviewed semantic delta into that current file,
          # preserving every non-Milano object from main and failing closed on
          # any unexpected Milano list shape.
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          rel = 'data/monitoring/national_coverage.json'
          repo = os.environ['SOURCE_REPO']
          old = os.environ['OLD_BASE']
          reviewed = os.environ['REVIEWED_HEAD']

          def show(ref):
              return json.loads(subprocess.check_output(
                  ['git','show',f'{ref}:{rel}'], cwd=repo, text=True
              ))

          base = show(old)
          review = show(reviewed)
          path = Path('/tmp/milano-clean') / rel
          current = json.loads(path.read_text(encoding='utf-8'))

          changed = []
          for key, reviewed_value in review.items():
              base_value = base.get(key)
              current_value = current.get(key)
              if not all(isinstance(v, list) for v in (reviewed_value, base_value, current_value)):
                  continue
              b = [x for x in base_value if isinstance(x, dict) and x.get('authority_key') == 'milano']
              r = [x for x in reviewed_value if isinstance(x, dict) and x.get('authority_key') == 'milano']
              if r == b:
                  continue
              c_idx = [i for i,x in enumerate(current_value) if isinstance(x, dict) and x.get('authority_key') == 'milano']
              if len(b) == len(r) == 1:
                  if len(c_idx) != 1:
                      raise SystemExit(f'{key}: expected one current Milano object, found {len(c_idx)}')
                  current_value[c_idx[0]] = r[0]
                  changed.append(key)
                  continue
              if len(r) >= len(b) and r[:len(b)] == b:
                  additions = r[len(b):]
                  if not additions:
                      continue
                  for item in additions:
                      if item in current_value:
                          raise SystemExit(f'{key}: reviewed Milano addition already present unexpectedly')
                  current_value.extend(additions)
                  changed.append(key)
                  continue
              raise SystemExit(f'{key}: unreviewed Milano merge shape')

          if not changed:
              raise SystemExit('No Milano monitoring delta was applied')
          path.write_text(json.dumps(current, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print('Merged Milano monitoring keys:', ', '.join(changed))
          PY
          git -C /tmp/milano-clean add data/monitoring/national_coverage.json

          # Keep the current main workflow in the transactional commit so the
          # Actions token does not have to modify a workflow file. Preserve the
          # fully reconciled reviewed workflow as an ordinary temporary blob;
          # the controller can promote that exact blob into the final clean tree.
          mkdir -p /tmp/milano-clean/tmp /tmp/milano-clean/.github/workflows
          cp /tmp/milano-clean/.github/workflows/public-pages.yml /tmp/milano-clean/tmp/public-pages-milano-candidate.yml
          git -C /tmp/milano-clean restore --source=origin/main --staged --worktree .github/workflows/public-pages.yml
          cp "$SOURCE_REPO/.github/workflows/milano-rebase-finalise.yml" /tmp/milano-clean/.github/workflows/milano-rebase-finalise.yml
          git -C /tmp/milano-clean add .github/workflows/milano-rebase-finalise.yml tmp/public-pages-milano-candidate.yml

          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/milano-rebase-finalise.yml',
              'tmp/public-pages-milano-candidate.yml',
              'data/monitoring/national_coverage.json',
              'data/publication/multi_prefecture_pilot.json',
              'data/source_registry/source_series_inventory.csv',
              'docs/sources/milano-source-transition-2026-09-21-fe508.md',
              'src/white_list_archive/parsers/milano_webapp.py',
              'tests/public_portal_browser.cjs',
              'tests/test_milano_parser_semantics.py',
          }
          got = set(subprocess.check_output(
              ['git','-C','/tmp/milano-clean','diff','--cached','--name-only'], text=True
          ).splitlines())
          if got != expected:
              raise SystemExit(f'Unexpected transactional surface: {sorted(got)} != {sorted(expected)}')
          PY

      - name: Independently re-fetch current Milano combined source twice
        shell: bash
        run: |
          set -euo pipefail
          url='https://whitelist.prefmi.it/elenco/elenco.php'
          expected_sha='fe508b739494d6af29e494f90ac45646a3d24c6bd7bd5448ccaed4d779096b6d'
          expected_bytes='968796'
          for n in 1 2; do
            curl --fail --location --silent --show-error --max-time 90 \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              --header 'User-Agent: Mozilla/5.0 whitelist-review/1.0' \
              "$url" -o "/tmp/milano-current-$n.html"
            sha="$(sha256sum "/tmp/milano-current-$n.html" | awk '{print $1}')"
            bytes="$(wc -c < "/tmp/milano-current-$n.html" | tr -d ' ')"
            echo "capture=$n sha256=$sha bytes=$bytes"
            test "$sha" = "$expected_sha"
            test "$bytes" = "$expected_bytes"
            sleep 1
          done
          cmp /tmp/milano-current-1.html /tmp/milano-current-2.html

      - name: Install validation runtime
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source_file; do
            [ -n "$source_file" ] && sudo rm -f "$source_file"
          done < <(grep -rlE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '\|dl\.google\.com/linux/chrome|d;\|packages\.google\.com/chrome|d' /etc/apt/sources.list
          fi
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends poppler-utils antiword; then
              break
            fi
            test "$attempt" -lt 3
            sleep $((attempt * 3))
          done
          cd /tmp/milano-clean
          python -m pip install -e '.[dev,publication,storage,database]'

      - name: Validate parser, repository and browser contract syntax
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/milano-clean
          pytest -q tests/test_milano_parser_semantics.py
          pytest -q
          node --check tests/public_portal_browser.cjs

      - name: Build and validate current national candidate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/milano-clean
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/milano-national-sources \
            --registry-json public-site/data/registry.json \
            --registry-csv public-site/data/registry.csv \
            --prefectures-json public-site/data/prefectures.json \
            --prefectures-csv public-site/data/prefectures.csv
          python - <<'PY'
          import json
          from pathlib import Path
          reg = json.loads(Path('public-site/data/registry.json').read_text(encoding='utf-8'))
          pref = json.loads(Path('public-site/data/prefectures.json').read_text(encoding='utf-8'))
          assert reg['meta']['record_count'] == 73672, reg['meta']['record_count']
          assert len(reg['meta']['authority_counts']) == 72, len(reg['meta']['authority_counts'])
          assert len(reg['meta']['register_counts']) == 75, len(reg['meta']['register_counts'])
          assert len(pref['prefectures']) == 106, len(pref['prefectures'])
          assert pref['meta']['authority_count'] == 106, pref['meta']['authority_count']
          assert pref['meta']['mapped_count'] == 72, pref['meta']['mapped_count']
          assert pref['meta']['published_count'] == 72, pref['meta']['published_count']
          rows = [r for r in reg['records'] if r['authority_key'] == 'milano']
          assert len(rows) == 2611
          assert sum(r['source_status'] == 'listed' for r in rows) == 944
          assert sum(r['source_status'] == 'renewal_update_in_progress' for r in rows) == 520
          assert sum(r['source_status'] == 'pending' for r in rows) == 1147
          print('validated national candidate: 73672 / 72 / 75 / 72; Milano 2611 = 944 + 520 + 1147')
          PY

      - name: Commit recoverable transactional checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/milano-clean
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/milano-rebase-finalise.yml',
              'tmp/public-pages-milano-candidate.yml',
              'data/monitoring/national_coverage.json',
              'data/publication/multi_prefecture_pilot.json',
              'data/source_registry/source_series_inventory.csv',
              'docs/sources/milano-source-transition-2026-09-21-fe508.md',
              'src/white_list_archive/parsers/milano_webapp.py',
              'tests/public_portal_browser.cjs',
              'tests/test_milano_parser_semantics.py',
          }
          got = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          if got != expected:
              raise SystemExit(f'Pre-commit surface drift: {sorted(got)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Checkpoint reviewed Milano fe508 on current main'
          clean_commit="$(git rev-parse HEAD)"
          clean_tree="$(git rev-parse HEAD^{tree})"
          candidate_blob="$(git rev-parse HEAD:tmp/public-pages-milano-candidate.yml)"
          echo "TRANSACTIONAL_COMMIT=$clean_commit"
          echo "TRANSACTIONAL_TREE=$clean_tree"
          echo "PUBLIC_PAGES_CANDIDATE_BLOB=$candidate_blob"
          git push --force-with-lease="refs/heads/fix/milano-source-drift-2026-09-21:${GITHUB_SHA}" \
            origin HEAD:refs/heads/fix/milano-source-drift-2026-09-21
