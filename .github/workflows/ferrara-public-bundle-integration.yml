              },
          ])
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          inventory_path = Path('data/source_registry/source_series_inventory.csv')
          inventory = inventory_path.read_text(encoding='utf-8')
          old = ('The same current official unified applicant PDF positively contains requests for reconstruction-regime h-bis activities as well as ordinary White List activities. '
                 'This logical source-series binding accounts for the special-regime applicant population without duplicating public applicant observations.')
          new = ('The same current official unified applicant PDF has requested-activity descriptions that positively correspond to reconstruction taxonomy categories B-F as well as ordinary White List activities; the PDF itself is not separately labelled as a reconstruction/h-bis applicant publication. '
                 'This logical source-series binding accounts for the evidenced special-regime applicant scope without creating a second physical publication or duplicate public observations.')
          if inventory.count(old) != 1:
              raise SystemExit(f'Ferrara inventory wording anchor drift: {inventory.count(old)}')
          inventory_path.write_text(inventory.replace(old, new, 1), encoding='utf-8')

          doc_path = Path('docs/sources/ferrara-operational-check-2026-09-20.md')
          doc = doc_path.read_text(encoding='utf-8')
