name: Ferrara public bundle integration

on:
  push:
    branches:
      - expansion/ferrara-2026-09-20
    paths:
      - .github/workflows/ferrara-public-bundle-integration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install complete validation runtime
        run: |
          while IFS= read -r source_file; do
            [ -n "$source_file" ] && sudo rm -f "$source_file"
          done < <(grep -rlE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '\|dl\.google\.com/linux/chrome|d;\|packages\.google\.com/chrome|d' /etc/apt/sources.list
          fi
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends poppler-utils antiword; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Validation runtime package installation failed after bounded retries" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install --disable-pip-version-check -e '.[dev,publication,database,storage]'
      - name: Materialise permanent Ferrara public integration
        run: |
          python -m py_compile tmp/ferrara_integrate_public.py tmp/ferrara_patch_ledger.py
          python tmp/ferrara_integrate_public.py
          python tmp/ferrara_patch_ledger.py
          python - <<'PY'
          from pathlib import Path

          history_path = Path('src/white_list_archive/publishing/public_history.py')
          text = history_path.read_text(encoding='utf-8')

          old = 'HEX = re.compile(r"^[0-9a-f]{64}$")\n'
          new = old + 'BUNDLE_CAPTURE = re.compile(r"^bundle:([0-9a-f]{64})$")\n'
          if 'BUNDLE_CAPTURE = re.compile' not in text:
              assert text.count(old) == 1
              text = text.replace(old, new, 1)

          anchor = '''def _digest(value: Any) -> str:\n    return hashlib.sha256(json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()).hexdigest()\n'''
          helper = '''def _history_document_sha256(capture_identity: str) -> str:\n    """Return the content digest represented by an approved scalar or bundle capture identity."""\n    if not isinstance(capture_identity, str):\n        raise ValueError("Public capture content identity must be a string")\n    if HEX.fullmatch(capture_identity):\n        return capture_identity\n    match = BUNDLE_CAPTURE.fullmatch(capture_identity)\n    if match:\n        return match.group(1)\n    raise ValueError("Invalid public capture content identity")\n'''
          if 'def _history_document_sha256' not in text:
              assert text.count(anchor) == 1
              text = text.replace(anchor, anchor + '\n\n' + helper, 1)

          old_assignment = 'document_sha256=first["capture_sha256"]'
          new_assignment = 'document_sha256=_history_document_sha256(first["capture_sha256"])'
          if new_assignment not in text:
              assert text.count(old_assignment) == 1
              text = text.replace(old_assignment, new_assignment, 1)

          old_rows = '''        return [r for r in registry["records"] if (r["source_key"], r["reference_date"], r["capture_sha256"]) == (edition["source_key"], edition["reference_date_raw"], edition["document_sha256"])]'''
          new_rows = '''        return [r for r in registry["records"] if (r["source_key"], r["reference_date"], _history_document_sha256(r["capture_sha256"])) == (edition["source_key"], edition["reference_date_raw"], edition["document_sha256"])]'''
          if new_rows not in text:
              assert text.count(old_rows) == 1
              text = text.replace(old_rows, new_rows, 1)

          history_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_public_history.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '\n\ndef test_repeating_an_edition_is_idempotent_but_keeps_new_checks():\n'
          addition = '''\n\ndef test_bundle_capture_identity_keeps_history_sha_contract_and_comparisons():\n    digest_a, digest_b = "b" * 64, "c" * 64\n    previous = fixture_registry("2026-06-01", f"bundle:{digest_a}")\n    current = fixture_registry("2026-07-01", f"bundle:{digest_b}", ("listed", "listed", "pending"))\n    aggregated = aggregate_registry(previous)\n    assert aggregated["editions"][0]["document_sha256"] == digest_a\n    validate_history_registry(aggregated, previous)\n    compared = compare_releases(previous, current)\n    assert compared["comparisons"][0]["common"] == 2\n    assert compared["comparisons"][0]["added"] == 1\n\n\ndef test_malformed_bundle_capture_identity_fails_closed():\n    with pytest.raises(ValueError, match="Invalid public capture content identity"):\n        aggregate_registry(fixture_registry(sha="bundle:not-a-sha256"))\n'''
          if 'test_bundle_capture_identity_keeps_history_sha_contract_and_comparisons' not in tests:
              assert marker in tests
              tests = tests.replace(marker, addition + marker, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY
          python -m py_compile src/white_list_archive/publishing/public_history.py
          git diff --check
      - name: Validate focused integration tests
        run: |
          pytest -q \
            tests/test_ferrara_public_bundle.py \
            tests/test_public_history.py \
            tests/test_source_registry.py \
            tests/test_source_population_coverage.py \
            tests/test_operations.py
      - name: Validate full repository suite
        run: pytest -q
      - name: Build and validate national candidate
        run: |
          rm -rf /tmp/ferrara-public-national
          rm -f public-site/data/registry.json public-site/data/registry.csv public-site/data/prefectures.json public-site/data/prefectures.csv
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/ferrara-public-national \
            --registry-json public-site/data/registry.json \
            --registry-csv public-site/data/registry.csv \
            --prefectures-json public-site/data/prefectures.json \
            --prefectures-csv public-site/data/prefectures.csv
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          reg = json.loads(Path('public-site/data/registry.json').read_text(encoding='utf-8'))
          pref = json.loads(Path('public-site/data/prefectures.json').read_text(encoding='utf-8'))
          assert reg['meta']['record_count'] == 71057, reg['meta']
          assert reg['meta']['authority_count'] == 67, reg['meta']
          assert reg['meta']['register_count'] == 70, reg['meta']
          assert len(reg['records']) == 71057
          assert 'ferrara' in reg['meta']['authority_counts']
          assert {'ferrara-ordinary', 'ferrara-reconstruction'} <= set(reg['meta']['register_counts'])

          ferrara = [r for r in reg['records'] if r['authority_key'] == 'ferrara']
          assert len(ferrara) == 1583
          assert Counter(r['source_key'] for r in ferrara) == {
              'ferrara-provincial-listed': 868,
              'ferrara-provincial-applicants': 21,
              'ferrara-reconstruction-listed': 694,
          }
          assert Counter(r['source_status'] for r in ferrara) == {
              'listed': 1256,
              'renewal_update_in_progress': 303,
              'other_or_unknown': 3,
              'pending': 21,
          }
          assert sum(bool(r['identifiers']) for r in ferrara) == 1563
          assert len({r['record_locator'] for r in ferrara}) == 1583

          applicants = [r for r in ferrara if r['source_key'] == 'ferrara-provincial-applicants']
          assert len(applicants) == 21
          assert all(r['source_status'] == 'pending' for r in applicants)
          assert not any('shared_publication_no_duplicate_ingest' in r.get('source_fields', {}) for r in applicants)

          ferrara_pref = [x for x in pref['prefectures'] if x['authority_key'] == 'ferrara']
          assert len(ferrara_pref) == 1
          assert ferrara_pref[0]['mapped'] and ferrara_pref[0]['published']
          assert ferrara_pref[0]['series_count'] == 4
          assert pref['meta']['published_count'] == 67
          assert pref['meta']['mapped_count'] == 67

          metrics = {
              'record_count': reg['meta']['record_count'],
              'authority_count': reg['meta']['authority_count'],
              'register_count': reg['meta']['register_count'],
              'published_count': pref['meta']['published_count'],
              'mapped_count': pref['meta']['mapped_count'],
              'ferrara_record_count': len(ferrara),
              'ferrara_source_counts': dict(Counter(r['source_key'] for r in ferrara)),
              'ferrara_status_counts': dict(Counter(r['source_status'] for r in ferrara)),
              'ferrara_identifier_coverage': sum(bool(r['identifiers']) for r in ferrara),
              'bundle_sha256': 'bundle:f3d9093a8859e082ed304b1342ab7a3ae687f7735da04b3d363bbe7440543283',
          }
          Path('tmp').mkdir(exist_ok=True)
          Path('tmp/ferrara-public-candidate-metrics.json').write_text(
              json.dumps(metrics, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(metrics, indent=2, sort_keys=True))
          PY
      - name: Mark candidate integration validated and recheck ledger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/monitoring/national_coverage.json')
          ledger = json.loads(path.read_text(encoding='utf-8'))
          rows = [r for r in ledger['prefectures'] if r['authority_key'] == 'ferrara']
          assert len(rows) == 1
          row = rows[0]
          assert row['public_export_enabled'] is True
          assert row['canonical_integration_validated'] is False
          assert row['coverage_status'] == 'VALIDATED'
          row['canonical_integration_validated'] = True
          path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          pytest -q tests/test_operations.py tests/test_ferrara_public_bundle.py tests/test_public_history.py
          git diff --check
      - name: Checkpoint validated permanent implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/white_list_archive/publishing/public_national_registry.py \
            src/white_list_archive/publishing/public_history.py \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            data/monitoring/national_coverage.json \
            docs/sources/ferrara-operational-check-2026-09-20.md \
            tests/test_ferrara_public_bundle.py \
            tests/test_public_history.py \
            tmp/ferrara-public-candidate-metrics.json
          git diff --cached --check
          git commit -m 'Integrate validated Ferrara public candidate [ferrara-public-bundle]'
          git push origin HEAD:expansion/ferrara-2026-09-20
