def test_ferrara_bundle_identity_is_order_stable_and_content_addressed():
    expected = "bundle:f3d9093a8859e082ed304b1342ab7a3ae687f7735da04b3d363bbe7440543283"
    assert _bundle_digest(MEMBER_HASHES) == expected
    assert _bundle_digest(dict(reversed(list(MEMBER_HASHES.items())))) == expected
    changed = dict(MEMBER_HASHES)
    changed["G"] = "0" * 64
    assert _bundle_digest(changed) != expected
    with pytest.raises(RuntimeError):
        _bundle_digest({"A": "not-a-sha"})


def _batch(fields):
    return ParsedBatch(records=[{"source_fields": fields}], diagnostics={"public_records": 1})


def test_ferrara_public_adapter_closes_ordinary_fields():
    batch = _adapt_ferrara_public_fields(
        _batch({
            "listing_date_raw": "01/02/2026",
            "expiry_date_raw": "01/02/2027",
            "notes": ["RINNOVO IN CORSO"],
            "physical_locators": ["p1:r2", "p2:r1"],
        }),
        "ferrara-provincial-listed",
    )
    assert batch.records[0]["source_fields"] == {
        "physical_locators": ["p1:r2", "p2:r1"],
        "notes": ["RINNOVO IN CORSO"],
        "listing_date_raw_variants": ["01/02/2026"],
        "expiry_date_raw_variants": ["01/02/2027"],
    }


def test_ferrara_public_adapter_closes_shared_applicant_fields_without_duplication_marker_leak():
    batch = _adapt_ferrara_public_fields(
        _batch({
            "application_date_raw": "03/04/2026",
            "requested_activities_source": "demolizione edifici",
            "physical_locators": ["p1:r4"],
            "shared_publication_no_duplicate_ingest": True,
            "logical_series": ["ferrara-provincial-applicants", "ferrara-reconstruction-applicants"],
        }),
        "ferrara-provincial-applicants",
    )
    assert batch.records[0]["source_fields"] == {
        "physical_locators": ["p1:r4"],
        "requested_activities_source": "demolizione edifici",
        "application_date_raw_variants": ["03/04/2026"],
    }


def test_ferrara_public_adapter_preserves_reconstruction_sector_provenance_in_approved_fields():
    batch = _adapt_ferrara_public_fields(
        _batch({
            "listing_date_raw": "01/01/2026",
            "expiry_date_raw": "01/01/2027",
            "sectors": ["B", "C"],
            "name_variants": ["Example S.r.l."],
            "office_variants": ["Ferrara"],
            "notes": [],
            "physical_locators": ["B:p1:t1:r2", "C:p1:t1:r2"],
            "physical_sector_observations": 2,
        }),
        FERRARA_RECONSTRUCTION_PARSER,
    )
    assert batch.records[0]["source_fields"] == {
        "sections": ["B", "C"],
        "physical_locators": ["B:p1:t1:r2", "C:p1:t1:r2"],
        "notes": [],
        "registered_office_variants": ["Ferrara"],
        "listing_date_raw_variants": ["01/01/2026"],
        "expiry_date_raw_variants": ["01/01/2027"],
    }
