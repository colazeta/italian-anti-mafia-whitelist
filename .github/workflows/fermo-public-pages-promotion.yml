name: Fermo public-pages candidate promotion 2026-09-19

on:
  push:
    branches:
      - expansion/fermo-2026-09-19
    paths:
      - '.github/workflows/fermo-public-pages-promotion.yml'
      - 'scripts/fermo_promote_public_pages.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialise candidate
        run: python scripts/fermo_promote_public_pages.py
      - name: Validate candidate diff
        run: |
          set -euo pipefail
          git diff --no-index --check .github/workflows/public-pages.yml tmp/fermo-public-pages-candidate.yml || test $? -eq 1
      - name: Commit candidate blob
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/fermo-public-pages-candidate.yml
          git diff --cached --check
          git commit -m 'Stage reviewed Fermo public-pages candidate'
          git push origin HEAD:expansion/fermo-2026-09-19
