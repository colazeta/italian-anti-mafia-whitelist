name: Milano production parser probe 2026-09-18
on:
  push:
    branches: [fix/milano-source-drift-2026-09-18]
    paths: [.github/workflows/milano-production-parser-probe-2026-09-18.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -e '.[dev]'
      - name: Run production Milano parser against stable current boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit /tmp/milano
          curl --fail --silent --show-error --location --retry 2 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            -A 'italian-anti-mafia-whitelist/0.1 (+milano-production-parser-probe)' \
            -o /tmp/milano/current.html \
            "https://whitelist.prefmi.it/elenco/elenco.php?parser_probe=${GITHUB_RUN_ID}"
          python - <<'PY' | tee audit/parser-probe.txt
          import hashlib, json
          from pathlib import Path
          import white_list_archive.parsers.milano_webapp as m

          path=Path('/tmp/milano/current.html')
          sha=hashlib.sha256(path.read_bytes()).hexdigest()
          print('sha256='+sha)
          print('bytes='+str(path.stat().st_size))
          if sha != '8dd6ce95d933f6b892e056bdec5bc78a985bb6485504055cd7cbde0e8cbdad5c':
              raise SystemExit('current source no longer matches independently repeated stable boundary')
          m._REFERENCE_DATE='2026-09-18'
          m._EXPECTED_STATUS_COUNTS={'listed':938,'renewal_update_in_progress':516,'pending':1157}
          cfg={
            'source_key':'milano-combined',
            'authority_key':'milano',
            'population_scope':'listed_and_applicant',
            'reference_date':'2026-09-18',
            'sha256':sha,
            'parser':'milano_combined',
            'register_key':'milano-ordinary',
            'authority_name':'Prefettura di Milano',
            'register_name':'White List — Prefettura di Milano',
            'source_page_url':'https://prefettura.interno.gov.it/it/prefetture/milano/evidenza/white-list',
            'resource_url':'https://whitelist.prefmi.it/elenco/elenco.php',
          }
          try:
              batch=m.parse_milano_combined(path,cfg)
          except Exception as exc:
              print('PRODUCTION_PARSER_ERROR='+repr(exc))
              raise
          print('PRODUCTION_PARSER_OK')
          print(json.dumps(batch.diagnostics,ensure_ascii=False,sort_keys=True))
          changed=[r for r in batch.records if r['identifier_field_raw'] in {'00936150150','13072070157'}]
          print('TRANSITION_RECORDS='+json.dumps(changed,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milano-production-parser-probe-2026-09-18
          path: audit/parser-probe.txt
          if-no-files-found: warn
          retention-days: 1
