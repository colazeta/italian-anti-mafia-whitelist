name: Pordenone exact row audit v3
on:
  push:
    branches: [expansion/pordenone-2026-09-20]
    paths: [.github/workflows/pordenone-exact-audit-v3.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: python -m pip install --disable-pip-version-check pdfplumber==0.11.7
      - name: Audit immutable Pordenone rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, io, json, re, unicodedata
          from collections import Counter, defaultdict
          from datetime import datetime
          from urllib.request import Request, urlopen
          import pdfplumber
          A=[
          ('I','listed','https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-i-estrazione-fornitura-etc_0.pdf','f4e6374e5e03daa25daedd49ada730ae39c6b77437e763e3c0308aa0a0c627de'),
          ('II','listed','https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-ii-confezionamento-fornitura-etc_0.pdf','62d63a080b3025e2ee2f37c3af1d486f12095be8f83e73cae611e2ca56bf84d5'),
          ('III','listed','https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-iii-noli-a-freddo-di-macchinari.pdf','2204fe651b733e32fe13f001c97fd2c6a93ccd9a846cc9f4ddd40d4f471e6ce9'),
          ('IV','listed','https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-iv-fornitura-di-ferro-lavorato_0.pdf','55a1edd7bcc52de101536c42091e14e040892cf1122462c36b37a861c48eeb62'),
          ('V','listed','https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-v-noli-a-caldo_0.pdf','4fcd95954d20ba19ffcfb11e64a911a637056ba2fd794d47c5d3f19171f77803'),
          ('VI','listed','https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-vi-autotrasporti-per-conto-terzi_1.pdf','62c39abfc260ecacf59b0201867263499643fe5dc36c95500e380fa53deb87aa'),
          ('VII','listed','https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-vii-guardiania-dei-cantieri.pdf','35c5ef5ddb218e50d1f5a56007f2c1886ac73b6a91c5a13fb37e4b7f4952d2c8'),
          ('VIII','listed','https://prefettura.interno.gov.it/sites/default/files/74/2026-08/sez-viii-servizi-funerari-e-cimiteriali.pdf','cac3354a388d87b3f7ee1fef965f7b9968d2fea4dfcbafa776fc175bee5d96b3'),
          ('IX','listed','https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-ix-ristorazione-mense-e-catering.pdf','a3b7c0b749be947692cb6ebb031e21e6c2e61913f34c1ad9f4741f3a7b9e96fa'),
          ('X','listed','https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-x-servizi-ambientali-trasporto-rifiuti-etc_0.pdf','af639b5c55ff31893bfd3906876e0c60e1e6614065efae1e5c7871ac62290c0f'),
          ('XI','applicant','https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-xi-elenco-imprese-richiedenti_edit_0.pdf','b8875c9392f9c7273c3c773110d90141eada8aebaa538ae1e3115be27bfdaea1')]
          def c(x): return ' '.join((x or '').split())
          def f(x):
            x=unicodedata.normalize('NFKD',c(x)); return ''.join(z for z in x if not unicodedata.combining(z)).casefold()
          def sid(x):
            x=re.sub('[^0-9A-Z]','',c(x).upper()); return x if re.fullmatch(r'(?:\d{11}|[A-Z0-9]{16})',x) else ''
          def valid_date(x):
            try: datetime.strptime(c(x),'%d/%m/%Y'); return bool(re.fullmatch(r'\d{2}/\d{2}/\d{4}',c(x)))
            except: return False
          def fields(row):
            p=row[:-4]
            if p and (p[0].isdigit() or not p[0]): p=p[1:]
            p=(p+['','',''])[:3]; return tuple(map(c,p))
          def structural(row):
            n=[c(x) for x in row if c(x)]; j=f(' | '.join(row))
            if not n: return True
            if len(n)==1 and (n[0].isdigit() or re.fullmatch(r'\d{2}/\d{2}/\d{4}',n[0]) or f(n[0])=='stabile in italia'): return True
            if ('rag. sociale' in j and ('cod. fiscale' in j or 'partita iva' in j)) or ('ragione sociale' in j and 'cod. fiscale' in j and 'data presentazione istanza' in j): return True
            if j.startswith('rag. | sede | sede secondaria | cod. fiscale | data di | data scadenza | aggiornamento in'): return True
            if j.startswith('sociale | legale | con rappresentanza | partita iva | iscrizione | iscrizione | corso'): return True
            if j.startswith('sezione '): return True
            return False
          listed=[]; applicants=[]; bad=[]; bysec=defaultdict(Counter)
          date_re=re.compile(r'\b\d{2}/\d{2}/\d{4}\b')
          for sec,pop,url,sha in A:
            with urlopen(Request(url,headers={'User-Agent':'italian-anti-mafia-whitelist/1.0','Cache-Control':'no-cache'}),timeout=60) as r: b=r.read()
            assert hashlib.sha256(b).hexdigest()==sha,(sec,'digest drift')
            with pdfplumber.open(io.BytesIO(b)) as pdf:
              for pn,page in enumerate(pdf.pages,1):
                ts=page.extract_tables() or []; assert len(ts)==1,(sec,pn,'tables',len(ts))
                for rn,raw in enumerate(ts[0] or [],1):
                  row=[c(x) for x in raw]; loc=f'{sec}:p{pn}:r{rn}'
                  if structural(row): continue
                  name,office,secondary=fields(row); ir=c(row[-4]); ident=sid(ir)
                  if pop=='listed':
                    note=c(row[-1]); nf=f(note)
                    if 'aggiornamento' in nf: out='renewal_update_in_progress'
                    elif 'trasferita' in nf or 'competenza prefettura' in nf: out='other_or_unknown'
                    elif not nf or 'iscritta' in nf: out='listed'
                    else: bad.append((loc,'status',row)); continue
                    if not(name or ir): bad.append((loc,'anchor',row)); continue
                    rec=dict(section=sec,locator=loc,name=name,office=office,secondary=secondary,identifier_raw=ir,identifier=ident,listed_raw=c(row[-3]),expiry_raw=c(row[-2]),outcome=out)
                    listed.append(rec); bysec[sec][out]+=1
                  else:
                    joined=' | '.join(row); jf=f(joined); dates=date_re.findall(joined)
                    if 'in istruttoria' in jf: out='pending'
                    elif 'in aggiornamento' in jf: out='renewal_update_in_progress'
                    elif loc=='XI:p3:r2' and name=='MGDSCAVI SRL' and ir=='01975030931' and dates==['07/01/2026'] and 'istruttoria' in jf: out='pending'
                    else: bad.append((loc,'status',row)); continue
                    if len(dates)!=1 or not(name or ir): bad.append((loc,'date_anchor',row)); continue
                    rec=dict(section=sec,locator=loc,name=name,office=office,secondary=secondary,identifier_raw=ir,identifier=ident,application_raw=dates[0],outcome=out)
                    applicants.append(rec); bysec[sec][out]+=1
          print('UNCLASSIFIED',json.dumps(bad,ensure_ascii=False)); assert not bad,bad
          groups={}; identity_states=defaultdict(set)
          for r in listed:
            ident=('id',r['identifier']) if r['identifier'] else ('fallback',f(r['name']),f(r['office']),f(r['secondary']))
            state=(r['listed_raw'],r['expiry_raw'],r['outcome']); identity_states[ident].add(state)
            k=ident+state; g=groups.setdefault(k,{'rows':[],'sections':set()}); g['rows'].append(r); g['sections'].add(r['section'])
          logical=list(groups.values())
          summary={
            'listed_physical':len(listed),'listed_logical':len(logical),'applicants':len(applicants),
            'listed_physical_status':dict(Counter(r['outcome'] for r in listed)),
            'listed_logical_status':dict(Counter(g['rows'][0]['outcome'] for g in logical)),
            'applicant_status':dict(Counter(r['outcome'] for r in applicants)),
            'listed_identifier_physical':sum(bool(r['identifier']) for r in listed),
            'listed_identifier_logical':sum(bool(g['rows'][0]['identifier']) for g in logical),
            'applicant_identifier':sum(bool(r['identifier']) for r in applicants),
            'listed_missing_date_fields':sum((not r['listed_raw'])+(not r['expiry_raw']) for r in listed),
            'listed_date_anomalies':sum(bool(r[x]) and not valid_date(r[x]) for r in listed for x in ('listed_raw','expiry_raw')),
            'applicant_date_anomalies':sum(not valid_date(r['application_raw']) for r in applicants),
            'blank_applicant_names':sum(not bool(r['name']) for r in applicants),
            'multi_section_logical_groups':sum(len(g['sections'])>1 for g in logical),
            'identity_groups_with_conflicting_date_or_status':sum(len(v)>1 for v in identity_states.values()),
            'per_section':{k:dict(v) for k,v in sorted(bysec.items())}}
          print('EXACT_SUMMARY',json.dumps(summary,ensure_ascii=False,sort_keys=True))
          print('APPLICANT_SPECIAL',json.dumps([{k:r[k] for k in ('locator','name','office','identifier_raw','application_raw','outcome')} for r in applicants if not r['name'] or r['outcome']!='pending'],ensure_ascii=False))
          PY
