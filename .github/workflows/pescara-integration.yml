name: Pescara integration candidate

on:
  push:
    branches:
      - expansion/pescara-2026-09-21
    paths:
      - .github/workflows/pescara-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/pescara-2026-09-21
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialise permanent Pescara candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('tmp/pescara_integrate.py')
          spec = importlib.util.spec_from_file_location('pescara_integrate', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          module.patch_registry()
          module.patch_publication_config()
          module.write_operational_doc()
          module.write_test()
          PY
          python tmp/pescara_source_registry.py
      - name: Install integration runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends poppler-utils antiword; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Publication runtime package installation failed after bounded retries" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[dev]'
      - name: Run focused Pescara tests
        run: pytest -q tests/test_pescara_legacy_doc.py
      - name: Run full repository suite
        run: pytest -q
      - name: Build and validate actual national candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pescara-national /tmp/pescara-site
          mkdir -p /tmp/pescara-site/data
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/pescara-national \
            --registry-json /tmp/pescara-site/data/registry.json \
            --registry-csv /tmp/pescara-site/data/registry.csv \
            --prefectures-json /tmp/pescara-site/data/prefectures.json \
            --prefectures-csv /tmp/pescara-site/data/prefectures.csv
          python tmp/pescara_integrate.py validate \
            --registry /tmp/pescara-site/data/registry.json \
            --prefectures /tmp/pescara-site/data/prefectures.json \
            --output docs/sources/pescara-national-candidate-2026-09-21.json
      - name: Commit permanent candidate checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/white_list_archive/publishing/public_national_registry.py \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/verified_primary_pages.csv \
            data/source_registry/source_series_inventory.csv \
            docs/sources/pescara-operational-check-2026-09-21.md \
            docs/sources/pescara-national-candidate-2026-09-21.json \
            tests/test_pescara_legacy_doc.py
          if git diff --cached --quiet; then
            echo 'Permanent Pescara candidate already checkpointed.'
            exit 0
          fi
          git commit -m 'Integrate Pescara White List candidate'
          git push origin HEAD:expansion/pescara-2026-09-21
