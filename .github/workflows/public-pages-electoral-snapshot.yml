name: Public portal from verified registry snapshot

on:
  pull_request:
    paths:
      - 'public-site/**'
      - '.github/workflows/public-pages-electoral-snapshot.yml'
      - 'src/white_list_archive/publishing/public_artifact.py'
  push:
    branches: [main]
    paths:
      - 'public-site/**'
      - '.github/workflows/public-pages-electoral-snapshot.yml'
      - 'src/white_list_archive/publishing/public_artifact.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install public artifact validator
        run: python -m pip install -e '.[publication]' pytest
      - name: Restore byte-pinned registry from the last verified Pages release
        run: |
          python - <<'PY'
          import hashlib
          import time
          import urllib.request
          from pathlib import Path

          base = 'https://colazeta.github.io/italian-anti-mafia-whitelist/data/'
          approved = {
              'registry.json': '55c7e3dfa5e97115d247d846979b795844803f6c83d70e58a82ceee126d595c5',
              'registry.csv': 'e0182e26ac6c96438921b738d0cac3ee749b3275808ca32670d8cbad03607375',
              'prefectures.json': '303f4a7efa97dded4daaf44b85ea9c15024a6c458ab18b8e6d6fa50cc2a5a479',
              'prefectures.csv': '8280d975a48990465c33752dc2fbe35221d0b02754e03b59dfbd01ee7c37926e',
              'history.json': 'c31986cdd4f9863ffc2f9efaf0dcb79ccff7a1459599fe1c58bcb1e60cc3d270',
          }
          root = Path('public-site/data')
          for name, expected in approved.items():
              last = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(base + name, headers={'User-Agent': 'white-list-public-snapshot/1'})
                      with urllib.request.urlopen(req, timeout=120) as response:
                          body = response.read()
                      actual = hashlib.sha256(body).hexdigest()
                      if actual != expected:
                          raise ValueError(f'{name}: published snapshot SHA mismatch: {actual}')
                      (root / name).write_bytes(body)
                      print(f'{name}: approved {len(body)} bytes, SHA-256 {actual}')
                      break
                  except (OSError, TimeoutError) as exc:
                      last = exc
                      if attempt < 2:
                          time.sleep(3 * (attempt + 1))
              else:
                  raise RuntimeError(f'{name}: failed to retrieve approved public snapshot') from last
          PY
      - name: Validate complete public artifact and electoral module
        run: |
          node --check public-site/app.js
          node --check public-site/electoral.js
          python -m white_list_archive.publishing.public_artifact public-site
          python -m pytest -q tests/test_electoral_public.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
