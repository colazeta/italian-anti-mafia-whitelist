name: Belluno finalise current-source integration v2

on:
  push:
    branches:
      - expansion/belluno-final-2026-09-10
    paths:
      - '.github/workflows/belluno-finalise-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/belluno-final-2026-09-10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PDF and Python runtime
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install -e '.[dev,publication,database,storage]'
      - name: Restore materialiser baseline locally and materialise Belluno
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/public-pages.yml')
          s = p.read_text(encoding='utf-8')
          reps = {
              "      - 'src/white_list_archive/parsers/agrigento_positioned.py'\n      - 'src/white_list_archive/parsers/belluno_combined.py'\n": "      - 'src/white_list_archive/parsers/agrigento_positioned.py'\n",
              "assert reg['meta']['record_count'] == 10385": "assert reg['meta']['record_count'] == 9983",
              "'pesaro-e-urbino','biella','benevento','asti','agrigento','belluno'}": "'pesaro-e-urbino','biella','benevento','asti','agrigento'}",
              "'biella-ordinary','benevento-ordinary','asti-ordinary','agrigento-ordinary','belluno-ordinary'": "'biella-ordinary','benevento-ordinary','asti-ordinary','agrigento-ordinary'",
              "assert reg['meta']['authority_count'] == 14": "assert reg['meta']['authority_count'] == 13",
              "assert reg['meta']['register_count'] == 15": "assert reg['meta']['register_count'] == 14",
              "assert pref['meta']['published_count'] == 14": "assert pref['meta']['published_count'] == 13",
              "          agrigento = [x for x in pref['prefectures'] if x['authority_key'] == 'agrigento']\n          assert len(agrigento) == 1 and agrigento[0]['mapped'] and agrigento[0]['published']\n          belluno = [x for x in pref['prefectures'] if x['authority_key'] == 'belluno']\n          assert len(belluno) == 1 and belluno[0]['mapped'] and belluno[0]['published']\n": "          agrigento = [x for x in pref['prefectures'] if x['authority_key'] == 'agrigento']\n          assert len(agrigento) == 1 and agrigento[0]['mapped'] and agrigento[0]['published']\n",
          }
          for old, new in reps.items():
              if s.count(old) != 1:
                  raise SystemExit(f'unexpected Belluno public-pages target while preparing local baseline: {old!r} count={s.count(old)}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          python .tmp/belluno_finalise.py
          git diff -- .github/workflows/public-pages.yml
          test -z "$(git diff -- .github/workflows/public-pages.yml)"
      - name: Run full repository tests
        run: python -m pytest -q
      - name: Build Belluno against pinned official bytes
        run: |
          rm -rf /tmp/belluno-current public-site/data/registry.json public-site/data/registry.csv public-site/data/prefectures.json public-site/data/prefectures.csv
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/belluno-current \
            --registry-json public-site/data/registry.json \
            --registry-csv public-site/data/registry.csv \
            --prefectures-json public-site/data/prefectures.json \
            --prefectures-csv public-site/data/prefectures.csv
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('public-site/data/registry.json').read_text())
          pref=json.loads(Path('public-site/data/prefectures.json').read_text())
          b=[r for r in reg['records'] if r['authority_key']=='belluno']
          assert len(reg['records'])==10385
          assert reg['meta']['authority_count']==14 and reg['meta']['register_count']==15
          assert len(b)==402
          assert {s:sum(r['source_status']==s for r in b) for s in set(r['source_status'] for r in b)} == {'listed':281,'renewal_update_in_progress':62,'expired_observed':49,'pending':10}
          assert pref['meta']['mapped_count']==35 and pref['meta']['published_count']==14
          diag=json.loads(Path('/tmp/belluno-current/belluno-combined.diagnostics.json').read_text())
          assert diag['identifier_coverage']==388 and diag['raw_identifier_only']==13 and diag['blank_identifier_rows']==1
          assert diag['malformed_application_dates']==1 and diag['dropped_date_rows']==0
          print('Belluno current-source integration validated', diag)
          PY
      - name: Commit validated production changes
        run: |
          rm -f public-site/data/registry.json public-site/data/registry.csv public-site/data/prefectures.json public-site/data/prefectures.csv
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git diff --cached --name-only
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Refusing runtime push containing workflow changes' >&2
            exit 1
          fi
          git commit -m 'Integrate Belluno current White List source'
          git push origin HEAD:expansion/belluno-final-2026-09-10
