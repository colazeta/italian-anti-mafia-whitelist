name: Ascoli Piceno finalisation

on:
  workflow_dispatch:
  push:
    branches:
      - expansion/ascoli-piceno-2026-09-10
    paths:
      - .github/workflows/ascoli-piceno-finalise.yml

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/ascoli-piceno-2026-09-10
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install full repository test runtime
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install -e '.[publication,storage,database]' pytest
      - name: Materialise Ascoli Piceno production integration
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          root=Path('.')
          page='https://prefettura.interno.gov.it/it/prefetture/ascoli-piceno/elenco-iscritti-white-list'
          listed_url='https://prefettura.interno.gov.it/sites/default/files/31/2026-08/elenco-degli-iscritti.pdf'
          applicants_url='https://prefettura.interno.gov.it/sites/default/files/31/2026-08/elenco-dei-richiedenti-l-iscrizione.pdf'
          listed_sha='5c1e7e6145929162207721d79302a5267524e5b35429234a961eee504b75c43b'
          applicants_sha='b278d9eeb3c387ea6b8eb67f5da74a1918eecdac720a400b34e29b626e962453'

          p=root/'src/white_list_archive/publishing/public_national_registry.py'
          text=p.read_text(encoding='utf-8')
          import_anchor='from white_list_archive.parsers.belluno_combined import PARSERS as BELLUNO_PARSERS\n'
          if 'ASCOLI_PARSERS' not in text:
              text=text.replace(import_anchor, import_anchor+'from white_list_archive.parsers.ascoli_piceno_labels import PARSERS as ASCOLI_PARSERS\n')
              text=text.replace('        or BELLUNO_PARSERS.get(cfg["parser"])\n    )', '        or BELLUNO_PARSERS.get(cfg["parser"])\n        or ASCOLI_PARSERS.get(cfg["parser"])\n    )')
          if 'ASCOLI_PARSERS.get' not in text:
              raise SystemExit('Failed to bind Ascoli parser family')
          p.write_text(text,encoding='utf-8')

          p=root/'data/publication/multi_prefecture_pilot.json'
          config=json.loads(p.read_text(encoding='utf-8'))
          config['sources']=[s for s in config['sources'] if s.get('authority_key')!='ascoli-piceno']
          config['sources'].extend([
            {
              'source_key':'ascoli-piceno-listed','parser':'ascoli_piceno_listed','authority_key':'ascoli-piceno','authority_name':'Prefettura di Ascoli Piceno','register_key':'ascoli-piceno-ordinary','register_name':'White List ordinaria','population_scope':'listed','reference_date':'2026-08-11','source_page_url':page,'resource_url':listed_url,'sha256':listed_sha,'expected_source_rows':544,'last_source_update':'2026-08-11','last_source_update_basis':'explicit Aggiornato al 11/08/2026 marker in the current official comprehensive PDF','notes':'The official page exposes a comprehensive all-sections registered-company PDF alongside ten section-specific alternate manifestations. The comprehensive PDF is ingested once to avoid duplicate observations. The label-bounded parser requires 544 company starts and maps only the two source-explicit statuses: 448 Iscritto to listed and 96 In aggiornamento to renewal_update_in_progress. DATA PROVVEDIMENTO is preserved as decision_date and the second explicit date as observed expiry; identifiers and dates are never repaired.'
            },
            {
              'source_key':'ascoli-piceno-applicants','parser':'ascoli_piceno_applicants','authority_key':'ascoli-piceno','authority_name':'Prefettura di Ascoli Piceno','register_key':'ascoli-piceno-ordinary','register_name':'White List ordinaria','population_scope':'applicant','reference_date':'2026-08-11','source_page_url':page,'resource_url':applicants_url,'sha256':applicants_sha,'expected_source_rows':57,'last_source_update':'2026-08-11','last_source_update_basis':'explicit Aggiornato al 11/08/2026 marker in the current official applicant PDF','notes':'The official applicant PDF contains 57 label-bounded observations, each with an explicit application date and ESITO: istruttoria. All 57 therefore map to pending by positive row-level evidence; no missing status, completeness or legal outcome is inferred.'
            }
          ])
          p.write_text(json.dumps(config,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=root/'data/source_registry/verified_primary_pages.csv'
          with p.open(encoding='utf-8',newline='') as h:
              rows=list(csv.DictReader(h)); fields=list(rows[0])
          found=False
          for row in rows:
              if row['authority_key']=='ascoli-piceno':
                  row.update(landing_url=page,verification_date='2026-09-10',verification_status='verified'); found=True
          if not found: raise SystemExit('Ascoli verified-primary row missing')
          with p.open('w',encoding='utf-8',newline='') as h:
              w=csv.DictWriter(h,fieldnames=fields); w.writeheader(); w.writerows(rows)

          p=root/'data/source_registry/source_series_inventory.csv'
          with p.open(encoding='utf-8',newline='') as h:
              rows=list(csv.DictReader(h)); fields=list(rows[0])
          notes={
            'ascoli-piceno-listed-comprehensive':'Current official page re-verified 10 September 2026; comprehensive all-sections registered-company PDF explicitly states Aggiornato al 11/08/2026. It is the publication input and yields 544 observations. Ten sector-specific PDFs remain alternate manifestations and are not separately ingested to avoid duplication.',
            'ascoli-piceno-applicants':'Current official page re-verified 10 September 2026; applicant PDF explicitly states Aggiornato al 11/08/2026 and contains 57 companies, each with ESITO: istruttoria.',
            'ascoli-piceno-listed-by-sector':'Ten section-specific registered-company PDFs are exposed alongside the comprehensive all-sections PDF. They are retained as source-series evidence but are not independently ingested while the comprehensive current edition is available, preventing duplicate listed observations.'
          }
          seen=set()
          for row in rows:
              key=row['source_series_key']
              if key in notes:
                  row['series_url']=page; row['resource_resolution_status']='direct_series_page_resolved'; row['verified_date']='2026-09-10'; row['notes']=notes[key]; seen.add(key)
          if seen != set(notes): raise SystemExit(f'Ascoli source-series rows missing: {set(notes)-seen}')
          with p.open('w',encoding='utf-8',newline='') as h:
              w=csv.DictWriter(h,fieldnames=fields); w.writeheader(); w.writerows(rows)

          p=root/'data/monitoring/national_coverage.json'
          cov=json.loads(p.read_text(encoding='utf-8'))
          matches=[x for x in cov['prefectures'] if x['authority_key']=='ascoli-piceno']
          if len(matches)!=1: raise SystemExit('Expected exactly one Ascoli coverage row')
          row=matches[0]
          row.update({
              'official_landing_page':page,'source_verified':True,'current_edition_identified':True,
              'capture_implemented':True,'parser_implemented':True,'parser_validated':True,
              'company_observations_loaded':True,'observation_layer':'public_source_observations',
              'canonical_integration_validated':False,'public_export_enabled':True,'durable_evidence_verified':False,
              'population_scopes_complete':True,'latest_source_reference_date':'2026-08-11',
              'last_successful_source_check_at':'2026-09-10T15:31:46Z','last_attempted_source_check_at':'2026-09-10T15:31:46Z',
              'last_successful_investigation_on':'2026-09-10','monitoring_status':'CURRENT','coverage_status':'VALIDATED',
              'terminal_reason':None,'actionable_issue':False,'last_completed_coverage_stage':'VALIDATED',
              'unresolved_issue':['Canonical hosted-database integration and independent durable-evidence verification remain governed under #16; public source observations are validated independently of that infrastructure.'],
              'completion_evidence':['docs/sources/ascoli-piceno-operational-check-2026-09-10.md','src/white_list_archive/parsers/ascoli_piceno_labels.py','tests/test_ascoli_piceno_parser_semantics.py','data/publication/multi_prefecture_pilot.json'],
              'known_content_sha256':[listed_sha,applicants_sha],
              'evidence':['data/source_registry/verified_primary_pages.csv','data/source_registry/source_series_inventory.csv','data/publication/multi_prefecture_pilot.json','docs/sources/ascoli-piceno-operational-check-2026-09-10.md']
          })
          p.write_text(json.dumps(cov,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Run repository tests
        run: pytest -q
      - name: Build and validate national public registry
        run: |
          rm -rf /tmp/ascoli-public /tmp/ascoli-work
          mkdir -p /tmp/ascoli-public/data
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/ascoli-work \
            --registry-json /tmp/ascoli-public/data/registry.json \
            --registry-csv /tmp/ascoli-public/data/registry.csv \
            --prefectures-json /tmp/ascoli-public/data/prefectures.json \
            --prefectures-csv /tmp/ascoli-public/data/prefectures.csv
          python - <<'PY'
          import json
          from collections import Counter
          reg=json.load(open('/tmp/ascoli-public/data/registry.json',encoding='utf-8'))
          pref=json.load(open('/tmp/ascoli-public/data/prefectures.json',encoding='utf-8'))
          ascoli=[r for r in reg['records'] if r['authority_key']=='ascoli-piceno']
          assert len(ascoli)==601
          assert Counter(r['source_status'] for r in ascoli)==Counter({'listed':448,'renewal_update_in_progress':96,'pending':57})
          assert reg['meta']['record_count']==10986, reg['meta']
          assert reg['meta']['authority_count']==15, reg['meta']
          assert reg['meta']['register_count']==16, reg['meta']
          assert pref['meta']['authority_count']==106, pref['meta']
          assert pref['meta']['mapped_count']==35, pref['meta']
          assert pref['meta']['published_count']==15, pref['meta']
          row=[p for p in pref['prefectures'] if p['authority_key']=='ascoli-piceno']
          assert len(row)==1 and row[0]['mapped'] and row[0]['published']
          print('ASCOLI_FINAL_COUNTS',reg['meta']['record_count'],reg['meta']['authority_count'],reg['meta']['register_count'],pref['meta'])
          PY
      - name: Commit only production integration
        run: |
          git config user.name 'colazeta'
          git config user.email '47261299+colazeta@users.noreply.github.com'
          git add \
            src/white_list_archive/publishing/public_national_registry.py \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/verified_primary_pages.csv \
            data/source_registry/source_series_inventory.csv \
            data/monitoring/national_coverage.json
          if git diff --cached --quiet; then
            echo 'No production integration changes to commit'
          else
            git commit -m 'Integrate Ascoli Piceno public sources'
            git push origin HEAD:expansion/ascoli-piceno-2026-09-10
          fi
