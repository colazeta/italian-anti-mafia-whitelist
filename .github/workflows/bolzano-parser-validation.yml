name: Bolzano parser validation

on:
  push:
    branches:
      - expansion/bolzano-bozen-2026-09-12
    paths:
      - .github/workflows/bolzano-parser-validation.yml
      - src/white_list_archive/parsers/bolzano_docx.py
      - tests/test_bolzano_parser_semantics.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/bolzano-bozen-2026-09-12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser runtime
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check 'python-docx>=1.1,<2' 'pdfplumber>=0.11,<0.12' requests pytest
      - name: Run Bolzano semantic unit tests
        run: python -m pytest -q tests/test_bolzano_parser_semantics.py
      - name: Validate official Bolzano sources
        run: |
          python - <<'PY'
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          import requests

          from white_list_archive.parsers.bolzano_docx import (
              parse_bolzano_applicants,
              parse_bolzano_listed,
          )

          SOURCES = {
              'listed': {
                  'source_key': 'bolzano-bozen-listed',
                  'scope': 'listed',
                  'url': 'https://prefettura.interno.gov.it/sites/default/files/0/2026-09/2026.09.11-elenco-white-list-da-sez-1-a-sez-10_iscritti-rinnovi.docx',
                  'sha256': '96992db4caac16200fbebfa573bb602e1e396961ff854bbf006cb42e011c1e04',
              },
              'applicant': {
                  'source_key': 'bolzano-bozen-applicants',
                  'scope': 'applicant',
                  'url': 'https://prefettura.interno.gov.it/sites/default/files/0/2026-09/2026.09.11-elenco-richiesta-iscrizione-wl.docx',
                  'sha256': '8b7321745edb19db688a001b9a1a706e84bee95cb457f9fdca1af144521ef3ae',
              },
          }
          headers = {'User-Agent': 'italian-anti-mafia-whitelist/parser-validation (+https://github.com/colazeta/italian-anti-mafia-whitelist)'}
          batches = {}
          for kind, source in SOURCES.items():
              response = requests.get(source['url'], headers=headers, timeout=60)
              response.raise_for_status()
              digest = hashlib.sha256(response.content).hexdigest()
              if digest != source['sha256']:
                  raise SystemExit(f"{kind} digest drift: {digest} != {source['sha256']}")
              path = Path(f'/tmp/bolzano-{kind}.docx')
              path.write_bytes(response.content)
              cfg = {
                  'source_key': source['source_key'],
                  'authority_key': 'bolzano-bozen',
                  'authority_name': 'Prefettura di Bolzano',
                  'register_key': 'bolzano-bozen-ordinary',
                  'register_name': 'White List ordinaria',
                  'population_scope': source['scope'],
                  'reference_date': '2026-09-11',
                  'source_page_url': 'https://prefettura.interno.gov.it/it/prefetture/bolzano/evidenza/white-list',
                  'resource_url': source['url'],
                  'sha256': source['sha256'],
              }
              batches[kind] = (
                  parse_bolzano_listed(path, cfg)
                  if kind == 'listed'
                  else parse_bolzano_applicants(path, cfg)
              )

          listed = batches['listed']
          applicants = batches['applicant']
          if len(listed.records) != 871:
              raise SystemExit(f'listed record count drift: {len(listed.records)}')
          if len(applicants.records) != 351:
              raise SystemExit(f'applicant record count drift: {len(applicants.records)}')
          statuses = Counter(r['source_status'] for r in listed.records + applicants.records)
          expected_statuses = {'listed': 620, 'renewal_update_in_progress': 251, 'pending': 351}
          if dict(statuses) != expected_statuses:
              raise SystemExit(f'status drift: {dict(statuses)} != {expected_statuses}')
          malformed_listing = listed.diagnostics['malformed_listing_values']
          malformed_expiry = listed.diagnostics['malformed_expiry_values']
          malformed_application = applicants.diagnostics['malformed_application_values']
          if len(malformed_listing) != 9 or len(malformed_expiry) != 11 or malformed_application != ['14/032025']:
              raise SystemExit(
                  f'malformed-date evidence drift: listing={malformed_listing!r}; '
                  f'expiry={malformed_expiry!r}; applicant={malformed_application!r}'
              )
          report = {
              'listed_source_sha256': SOURCES['listed']['sha256'],
              'applicant_source_sha256': SOURCES['applicant']['sha256'],
              'listed_source_rows': listed.diagnostics['sector_rows'],
              'listed_records': len(listed.records),
              'applicant_source_rows': applicants.diagnostics['source_rows'],
              'applicant_records': len(applicants.records),
              'total_records': len(listed.records) + len(applicants.records),
              'status_counts': dict(statuses),
              'malformed_listing_values': malformed_listing,
              'malformed_expiry_values': malformed_expiry,
              'malformed_application_values': malformed_application,
          }
          Path('tmp').mkdir(exist_ok=True)
          Path('tmp/bolzano_parser_validation.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Persist parser-validation checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/bolzano_parser_validation.json
          if git diff --cached --quiet; then
            echo 'No parser-validation change to checkpoint.'
            exit 0
          fi
          git commit -m 'Checkpoint Bolzano parser validation'
          git push origin HEAD:expansion/bolzano-bozen-2026-09-12
