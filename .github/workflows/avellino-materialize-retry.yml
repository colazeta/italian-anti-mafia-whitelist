name: Stage validated Avellino Pages gate

on:
  push:
    branches:
      - expansion/avellino-public-2026-09-10
    paths:
      - '.github/workflows/avellino-materialize-retry.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate exact validated Pages workflow as ordinary staging text
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/public-pages.yml').read_text(encoding='utf-8')
          replacements = {
              "      - 'src/white_list_archive/parsers/arezzo_openxml.py'\n": "      - 'src/white_list_archive/parsers/arezzo_openxml.py'\n      - 'src/white_list_archive/parsers/avellino_positioned.py'\n",
              "          assert reg['meta']['record_count'] == 6234\n": "          assert reg['meta']['record_count'] == 6861\n",
              "{'cosenza','parma','pistoia','bologna','alessandria','aosta','arezzo'}": "{'cosenza','parma','pistoia','bologna','alessandria','aosta','arezzo','avellino'}",
              "'bologna-provincial','bologna-post-sisma','alessandria-ordinary','aosta-ordinary','arezzo-ordinary'\n": "'bologna-provincial','bologna-post-sisma','alessandria-ordinary','aosta-ordinary','arezzo-ordinary','avellino-ordinary'\n",
              "          assert reg['meta']['authority_count'] == 7\n": "          assert reg['meta']['authority_count'] == 8\n",
              "          assert reg['meta']['register_count'] == 8\n": "          assert reg['meta']['register_count'] == 9\n",
              "          assert pref['meta']['published_count'] == 7\n": "          assert pref['meta']['published_count'] == 8\n",
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'Pages gate boundary changed: {old!r}')
              source = source.replace(old, new, 1)
          arezzo_gate = "          arezzo = [x for x in pref['prefectures'] if x['jurisdiction_name'] == 'Arezzo']\n          assert len(arezzo) == 1 and arezzo[0]['mapped'] and arezzo[0]['published']\n"
          avellino_gate = arezzo_gate + "          avellino = [x for x in pref['prefectures'] if x['jurisdiction_name'] == 'Avellino']\n          assert len(avellino) == 1 and avellino[0]['mapped'] and avellino[0]['published']\n"
          if source.count(arezzo_gate) != 1:
              raise SystemExit('Arezzo authority gate boundary changed')
          source = source.replace(arezzo_gate, avellino_gate, 1)
          Path('docs/.avellino-public-pages.generated.yml').write_text(source, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/.avellino-public-pages.generated.yml
          git diff --cached --check
          git commit -m 'Stage validated Avellino Pages gate'
          git push origin HEAD:expansion/avellino-public-2026-09-10
