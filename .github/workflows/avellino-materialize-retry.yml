name: Retry validated Avellino materialisation

on:
  push:
    branches:
      - expansion/avellino-public-2026-09-10
    paths:
      - '.github/workflows/avellino-materialize-retry.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install complete publication runtime
        run: |
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && \
               sudo apt-get install -y --no-install-recommends poppler-utils; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Poppler installation failed after bounded retries" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[publication]'
          python -m pip install pytest pyyaml
      - name: Keep unreviewed raw notes outside the public contract
        run: |
          python - <<'PY'
          from pathlib import Path
          parser_path = Path('src/white_list_archive/parsers/avellino_positioned.py')
          text = parser_path.read_text(encoding='utf-8')
          listed_old = '            source_fields={\n                "update_registration_raw": row["update"],\n                "notes_raw": row["notes"],\n                "source_page": int(row["source_page"]),\n            },\n'
          listed_new = '            source_fields={},\n'
          applicant_old = '                source_fields={"source_page": int(row["source_page"])},\n'
          applicant_new = '                source_fields={},\n'
          if text.count(listed_old) != 1 or text.count(applicant_old) != 1:
              raise SystemExit('Avellino source-field boundary changed unexpectedly')
          parser_path.write_text(text.replace(listed_old, listed_new, 1).replace(applicant_old, applicant_new, 1), encoding='utf-8')
          test_path = Path('tests/test_avellino_parser_semantics.py')
          tests = test_path.read_text(encoding='utf-8')
          old = '    assert batch.records[0]["source_fields"]["update_registration_raw"] == "testo fonte non interpretato"\n'
          new = '    assert batch.records[0]["outcome_raw"] == "testo fonte non interpretato"\n    assert batch.records[0]["source_fields"] == {}\n'
          if tests.count(old) != 1:
              raise SystemExit('Avellino semantic-test boundary changed unexpectedly')
          test_path.write_text(tests.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Reuse approved materialisation and validation scripts
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml
          workflow = yaml.safe_load(Path('.github/workflows/avellino-materialize.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['materialize']['steps']
          wanted = ['Materialize approved source configuration and governance state', 'Validate semantic tests and expanded public build']
          scripts = {step.get('name'): step.get('run') for step in steps if step.get('name') in wanted}
          if set(scripts) != set(wanted) or any(not scripts[name] for name in wanted):
              raise SystemExit(f'approved Avellino scripts not found exactly: {sorted(scripts)}')
          for name in wanted:
              print(f'RUNNING_APPROVED_STEP {name}', flush=True)
              subprocess.run(['bash', '-c', 'set -euo pipefail\n' + scripts[name]], check=True)
          PY
      - name: Reconcile public-boundary documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/sources/avellino-operational-check-2026-09-10.md')
          text = path.read_text(encoding='utf-8')
          old = 'All 383 rows retain name, raw identifier, registered office, activities, source expiry date, update field and source page. The page itself is explicitly the listed-company population; update/notes text is retained but is not used to infer a different legal status.'
          new = 'All 383 rows retain the approved public fields: name, raw identifier, registered office, activities, source expiry date and the source update field as `outcome_raw`. Free-text notes and page-layout metadata remain outside the public contract. The page itself is explicitly the listed-company population; no free-text field is used to infer a different legal status.'
          if text.count(old) != 1:
              raise SystemExit('Avellino documentation boundary changed unexpectedly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit only after complete validation
        run: |
          git rm .github/workflows/avellino-materialize.yml \
                 .github/workflows/avellino-parser-validation.yml \
                 .github/workflows/avellino-materialize-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/white_list_archive/parsers/avellino_positioned.py \
                  tests/test_avellino_parser_semantics.py \
                  src/white_list_archive/publishing/public_national_registry.py \
                  data/publication/multi_prefecture_pilot.json \
                  data/source_registry/source_series_inventory.csv \
                  data/monitoring/national_coverage.json \
                  .github/workflows/public-pages.yml \
                  docs/sources/avellino-operational-check-2026-09-10.md
          git diff --cached --check
          git commit -m 'Publish validated Avellino White List sources'
          git push origin HEAD:expansion/avellino-public-2026-09-10
