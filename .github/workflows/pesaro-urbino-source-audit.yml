name: Pesaro-Urbino source audit

on:
  push:
    branches:
      - expansion/pesaro-urbino-2026-09-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve and profile official current attachment
        run: |
          python -m pip install -q requests beautifulsoup4 pdfplumber
          python - <<'PY'
          import hashlib, io, re
          from urllib.parse import urljoin
          import requests, pdfplumber
          from bs4 import BeautifulSoup

          page_url='https://prefettura.interno.gov.it/it/prefetture/pesaro-urbino/white-list-elenco-imprese-iscritte'
          H={'User-Agent':'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelistArchive/1.0; evidence-source-check)'}
          s=requests.Session(); r=s.get(page_url,headers=H,timeout=45); r.raise_for_status(); soup=BeautifulSoup(r.text,'html.parser')
          candidates=[]
          for a in soup.find_all('a',href=True):
              label=' '.join(a.stripped_strings).strip(); href=urljoin(page_url,a['href'])
              if 'elenco imprese iscritte' in label.casefold() or '/sites/default/files/' in href:
                  candidates.append((label,href))
          exact=[x for x in candidates if 'aggiornamento 31.08.2026' in x[0].casefold()]
          if len(exact)!=1: raise SystemExit(f'expected exactly one dated attachment, got {exact!r}')
          label,url=exact[0]; res=s.get(url,headers=H,timeout=90); res.raise_for_status(); data=res.content
          print('LABEL='+label); print('RESOURCE='+url); print('CONTENT_TYPE='+res.headers.get('content-type','')); print('SHA256='+hashlib.sha256(data).hexdigest()); print('BYTES='+str(len(data)))
          if not data.startswith(b'%PDF'): raise SystemExit('current attachment is not a PDF; fail closed')
          with pdfplumber.open(io.BytesIO(data)) as pdf:
              print('PAGES='+str(len(pdf.pages)))
              for pno,page in enumerate(pdf.pages,1):
                  if pno==1: print('PAGE_SIZE='+repr((page.width,page.height)))
                  tables=page.extract_tables()
                  print(f'PAGE {pno} TABLES={len(tables)} ROWS='+repr([len(t or []) for t in tables]))
                  if pno in (1,2,21):
                      for ti,t in enumerate(tables):
                          print(f'PAGE {pno} TABLE {ti} HEAD='+repr((t or [])[:6]))
                  words=page.extract_words(use_text_flow=False,keep_blank_chars=False,x_tolerance=2,y_tolerance=3)
                  # identify x positions of known source headings and first data tokens.
                  if pno<=2:
                      lines={}
                      for w in words:
                          key=round(float(w['top'])/3)*3
                          lines.setdefault(key,[]).append(w)
                      for y,ws in sorted(lines.items()):
                          text=' '.join(str(w['text']) for w in sorted(ws,key=lambda x:float(x['x0'])))
                          if any(k in text for k in ['Ragione Sociale','24 S.R.L.','ALANUOVA','AG SCAVI','ALBA COSTRUZIONI']):
                              print('LINE',pno,y,[(round(float(w['x0']),1),round(float(w['x1']),1),w['text']) for w in sorted(ws,key=lambda x:float(x['x0']))])
          PY
