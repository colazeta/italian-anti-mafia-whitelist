name: Pesaro-Urbino source audit

on:
  push:
    branches:
      - expansion/pesaro-urbino-2026-09-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve and inspect official current attachment
        run: |
          python -m pip install -q requests beautifulsoup4 pymupdf
          python - <<'PY'
          import hashlib, io, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          import fitz

          page_url='https://prefettura.interno.gov.it/it/prefetture/pesaro-urbino/white-list-elenco-imprese-iscritte'
          H={'User-Agent':'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelistArchive/1.0; evidence-source-check)'}
          s=requests.Session(); r=s.get(page_url,headers=H,timeout=45); r.raise_for_status(); soup=BeautifulSoup(r.text,'html.parser')
          candidates=[]
          for a in soup.find_all('a',href=True):
              label=' '.join(a.stripped_strings).strip(); href=urljoin(page_url,a['href'])
              if 'elenco imprese iscritte' in label.casefold() or '/sites/default/files/' in href:
                  candidates.append((label,href))
          print('CANDIDATES='+repr(candidates))
          exact=[x for x in candidates if 'aggiornamento 31.08.2026' in x[0].casefold()]
          if len(exact)!=1: raise SystemExit(f'expected exactly one dated attachment, got {exact!r}')
          label,url=exact[0]; res=s.get(url,headers=H,timeout=90); res.raise_for_status(); data=res.content
          ctype=res.headers.get('content-type',''); print('LABEL='+label); print('RESOURCE='+url); print('CONTENT_TYPE='+ctype); print('SHA256='+hashlib.sha256(data).hexdigest()); print('BYTES='+str(len(data)))
          if not data.startswith(b'%PDF'):
              raise SystemExit('current attachment is not a PDF; fail closed')
          doc=fitz.open(stream=data,filetype='pdf')
          print('FORMAT=pdf'); print('PAGES='+str(doc.page_count))
          all_text=[]
          for pno,page in enumerate(doc,1):
              text='\n'.join(' '.join(line.split()) for line in page.get_text('text').splitlines() if line.strip())
              all_text.append(text)
              if pno <= 3 or pno > doc.page_count-3:
                  print(f'PAGE {pno} TEXT_HEAD={text[:1800]!r}')
          joined='\n'.join(all_text)
          markers=[]
          for pat in [r'richiedent\w*',r'richiesta\w*',r'iscritt\w*',r'white\s*list']:
              hits=[(m.start(), joined[max(0,m.start()-250):m.start()+500]) for m in re.finditer(pat,joined,re.I)]
              print(f'MARKER {pat!r} COUNT={len(hits)}')
              for pos,snip in hits[:20]: print(f'HIT {pos}: {snip!r}')
          # Print compact page-level structural stats to locate population transitions.
          for pno,text in enumerate(all_text,1):
              lc=text.casefold()
              if 'richied' in lc or 'istanza' in lc or 'iscritt' in lc:
                  print(f'PAGE_MARKER {pno}: '+repr(text[:700]))
          PY
