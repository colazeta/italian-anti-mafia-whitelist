name: Pesaro-Urbino integration

on:
  push:
    branches:
      - expansion/pesaro-urbino-2026-09-10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/pesaro-urbino-2026-09-10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconcile source, parser and public state
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          source_page = 'https://prefettura.interno.gov.it/it/prefetture/pesaro-urbino/white-list-elenco-imprese-iscritte'
          resource = 'https://prefettura.interno.gov.it/sites/default/files/72/2026-08/elenco-wl-ditte-iscritte-31.08.2026.pdf'
          sha = '7cadfb4d4473f9100691793b0b695d0c71bf93eebf7b7351060b28196dbe149a'

          # Public source config.
          config_path = Path('data/publication/multi_prefecture_pilot.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          config['sources'] = [s for s in config['sources'] if s.get('source_key') != 'pesaro-urbino-combined']
          config['sources'].append({
              'source_key': 'pesaro-urbino-combined',
              'parser': 'pesaro_urbino_combined',
              'authority_key': 'pesaro-urbino',
              'authority_name': 'Prefettura di Pesaro e Urbino',
              'register_key': 'pesaro-urbino-ordinary',
              'register_name': 'White List ordinaria',
              'population_scope': 'listed_and_applicant',
              'reference_date': '2026-08-31',
              'source_page_url': source_page,
              'resource_url': resource,
              'sha256': sha,
              'expected_source_rows': 484,
              'last_source_update': '2026-08-31',
              'last_source_update_basis': 'dated official attachment label, document heading and official page update',
              'notes': 'The official page and current PDF explicitly describe a combined population of enrolled companies and companies requesting enrolment. The table exposes row-level listing dates and an explicit Aggiornamento in corso marker, but no separate applicant flag. The parser therefore maps only source-explicit row signals: date-pair rows without X are listed; X rows are renewal_update_in_progress; no pending/applicant status is inferred from blank dates. Two dot-separated date pairs are normalised without changing digits; compound non-canonical identifiers remain raw; one blank section remains an empty activity list.'
          })
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def update_csv(path, key_field, new_row):
              p = Path(path)
              with p.open(encoding='utf-8', newline='') as fh:
                  reader = csv.DictReader(fh); fields = reader.fieldnames; rows = list(reader)
              rows = [r for r in rows if r[key_field] != new_row[key_field]]
              rows.append(new_row)
              rows.sort(key=lambda r: r[key_field])
              with p.open('w', encoding='utf-8', newline='') as fh:
                  writer = csv.DictWriter(fh, fieldnames=fields); writer.writeheader(); writer.writerows(rows)

          update_csv('data/source_registry/source_series_inventory.csv', 'source_series_key', {
              'source_series_key':'pesaro-urbino-combined','authority_key':'pesaro-urbino','regime_code':'WL-REGIME-L190-2012',
              'population_scope':'listed_and_applicant','sector_scope':'all','publication_model':'periodic_attachment','series_url':source_page,
              'resource_resolution_status':'direct_series_page_resolved','verified_date':'2026-09-10',
              'notes':'Official page and current PDF verified 10 September 2026; the PDF explicitly covers enrolled and requesting companies and is dated 31 August 2026. Row-level semantics and byte identity are documented in docs/sources/pesaro-urbino-operational-check-2026-09-10.md.'
          })
          update_csv('data/source_registry/parser_families.csv', 'parser_family_code', {
              'parser_family_code':'pesaro-urbino-combined-pdf-table-v1','implementation_module':'white_list_archive.parsers.pesaro_urbino_combined',
              'parser_version':'1','record_contract_code':'prefecture-combined-whitelist-v1','semantic_profile_code':'prefecture-combined-whitelist-v1',
              'field_locator_prefix':'pesaro_urbino_combined:','supported_schema_fingerprints':'','validation_status':'validated_current',
              'description':'Fail-closed PDF table parser validated on the 31 August 2026 Pesaro-Urbino combined White List publication.'
          })
          update_csv('data/source_registry/parser_bindings.csv', 'source_series_key', {
              'source_series_key':'pesaro-urbino-combined','parser_family_code':'pesaro-urbino-combined-pdf-table-v1','binding_status':'validated_current',
              'priority':'100','selection_basis':'explicit_series_binding','notes':'Validated against the byte-pinned 31 August 2026 Pesaro-Urbino combined PDF; page count, table headers and row count are fail-closed.'
          })

          # Public parser dispatch.
          registry_path = Path('src/white_list_archive/publishing/public_national_registry.py')
          text = registry_path.read_text(encoding='utf-8')
          anchor = 'from white_list_archive.parsers.avellino_positioned import PARSERS as AVELLINO_PARSERS\n'
          addition = anchor + 'from white_list_archive.parsers.pesaro_urbino_combined import PARSERS as PESARO_PARSERS\n'
          if 'PESARO_PARSERS' not in text:
              if anchor not in text: raise SystemExit('parser import anchor not found')
              text = text.replace(anchor, addition, 1)
          dispatch = '        or AVELLINO_PARSERS.get(cfg["parser"])\n    )'
          dispatch_new = '        or AVELLINO_PARSERS.get(cfg["parser"])\n        or PESARO_PARSERS.get(cfg["parser"])\n    )'
          if 'or PESARO_PARSERS.get' not in text:
              if dispatch not in text: raise SystemExit('parser dispatch anchor not found')
              text = text.replace(dispatch, dispatch_new, 1)
          registry_path.write_text(text, encoding='utf-8')

          # Monitoring state: public source observation layer is validated; hosted canonical/durable evidence remains #16.
          mon_path = Path('data/monitoring/national_coverage.json')
          mon = json.loads(mon_path.read_text(encoding='utf-8'))
          matches = [p for p in mon['prefectures'] if p.get('authority_key') == 'pesaro-urbino']
          if len(matches) != 1: raise SystemExit(f'expected one Pesaro-Urbino monitoring row, got {len(matches)}')
          p = matches[0]
          p.update({
              'current_edition_identified': True, 'capture_implemented': True, 'parser_implemented': True,
              'parser_validated': True, 'company_observations_loaded': True, 'observation_layer': 'public_source_observations',
              'canonical_integration_validated': False, 'public_export_enabled': True, 'durable_evidence_verified': False,
              'population_scopes_complete': True, 'latest_source_reference_date': '2026-08-31',
              'last_successful_source_check_at': '2026-09-10T02:22:50Z', 'last_attempted_source_check_at': '2026-09-10T02:22:50Z',
              'last_successful_investigation_on': '2026-09-10', 'monitoring_status': 'CURRENT', 'actionable_issue': False,
              'coverage_status': 'VALIDATED', 'terminal_reason': None,
              'completion_evidence': ['docs/sources/pesaro-urbino-operational-check-2026-09-10.md','src/white_list_archive/parsers/pesaro_urbino_combined.py','tests/test_pesaro_urbino_parser_semantics.py','data/publication/multi_prefecture_pilot.json'],
              'known_content_sha256': [sha],
              'unresolved_issue': ['Canonical hosted-database integration and independent durable-evidence verification remain governed under #16; public source observations are validated independently of that infrastructure.'],
          })
          evidence = p.setdefault('evidence', [])
          for value in ['data/source_registry/verified_primary_pages.csv','data/source_registry/source_series_inventory.csv','docs/sources/pesaro-urbino-operational-check-2026-09-10.md','src/white_list_archive/parsers/pesaro_urbino_combined.py','tests/test_pesaro_urbino_parser_semantics.py','data/publication/multi_prefecture_pilot.json']:
              if value not in evidence: evidence.append(value)
          mon_path.write_text(json.dumps(mon, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Pages acceptance gates.
          pages_path = Path('.github/workflows/public-pages.yml')
          pages = pages_path.read_text(encoding='utf-8')
          av_path = "      - 'src/white_list_archive/parsers/avellino_positioned.py'\n"
          if 'pesaro_urbino_combined.py' not in pages:
              pages = pages.replace(av_path, av_path + "      - 'src/white_list_archive/parsers/pesaro_urbino_combined.py'\n", 1)
          pages = pages.replace("assert reg['meta']['record_count'] == 6861", "assert reg['meta']['record_count'] == 7345")
          pages = pages.replace("{'cosenza','parma','pistoia','bologna','alessandria','aosta','arezzo','avellino'}", "{'cosenza','parma','pistoia','bologna','alessandria','aosta','arezzo','avellino','pesaro-urbino'}")
          pages = pages.replace("'bologna-provincial','bologna-post-sisma','alessandria-ordinary','aosta-ordinary','arezzo-ordinary','avellino-ordinary'", "'bologna-provincial','bologna-post-sisma','alessandria-ordinary','aosta-ordinary','arezzo-ordinary','avellino-ordinary','pesaro-urbino-ordinary'")
          pages = pages.replace("assert reg['meta']['authority_count'] == 8", "assert reg['meta']['authority_count'] == 9")
          pages = pages.replace("assert reg['meta']['register_count'] == 9", "assert reg['meta']['register_count'] == 10")
          pages = pages.replace("assert pref['meta']['published_count'] == 8", "assert pref['meta']['published_count'] == 9")
          pages = pages.replace("assert pref['meta']['mapped_count'] == 34", "assert pref['meta']['mapped_count'] == 35")
          av_assert = "          assert len(avellino) == 1 and avellino[0]['mapped'] and avellino[0]['published']\n"
          pes_assert = av_assert + "          pesaro = [x for x in pref['prefectures'] if x['jurisdiction_name'] == 'Pesaro e Urbino']\n          assert len(pesaro) == 1 and pesaro[0]['mapped'] and pesaro[0]['published']\n"
          if "jurisdiction_name'] == 'Pesaro e Urbino'" not in pages:
              if av_assert not in pages: raise SystemExit('Avellino public-pages assertion anchor not found')
              pages = pages.replace(av_assert, pes_assert, 1)
          pages_path.write_text(pages, encoding='utf-8')

          browser_path = Path('tests/public_portal_browser.cjs')
          browser = browser_path.read_text(encoding='utf-8')
          av_label = "      assert.ok(labels.includes('White List ordinaria · Prefettura di Avellino'));\n"
          if 'White List ordinaria · Prefettura di Pesaro e Urbino' not in browser:
              browser = browser.replace(av_label, av_label + "      assert.ok(labels.includes('White List ordinaria · Prefettura di Pesaro e Urbino'));\n", 1)
          browser = browser.replace('assert.equal(stats.total,6861);','assert.equal(stats.total,7345);')
          browser = browser.replace("!['alessandria','aosta','arezzo','avellino'].includes(r.authority_key)", "!['alessandria','aosta','arezzo','avellino','pesaro-urbino'].includes(r.authority_key)")
          av_stats = "      assert.deepEqual(statusCounts(avellino),{listed:383,pending:244});\n"
          pes_stats = av_stats + "      const pesaro=registry.records.filter(r=>r.authority_key==='pesaro-urbino');\n      assert.equal(pesaro.length,484);\n      assert.equal(pesaro.filter(r=>r.source_key==='pesaro-urbino-combined').length,484);\n      assert.deepEqual(statusCounts(pesaro),{listed:406,renewal_update_in_progress:78});\n"
          if "const pesaro=registry.records.filter" not in browser:
              if av_stats not in browser: raise SystemExit('Avellino browser statistics anchor not found')
              browser = browser.replace(av_stats, pes_stats, 1)
          browser_path.write_text(browser, encoding='utf-8')

          # Remove the temporary source-audit workflow before the integration commit.
          Path('.github/workflows/pesaro-urbino-source-audit.yml').unlink()
          PY
      - name: Commit integration
        run: |
          git config user.name 'colazeta'
          git config user.email '47261299+colazeta@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Publish Pesaro-Urbino White List source'
          git push origin HEAD:expansion/pesaro-urbino-2026-09-10
