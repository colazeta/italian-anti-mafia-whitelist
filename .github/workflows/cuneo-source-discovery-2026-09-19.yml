name: Cuneo source discovery 2026-09-19

on:
  push:
    branches:
      - expansion/cuneo-2026-09-19
    paths:
      - .github/workflows/cuneo-source-discovery-2026-09-19.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install probe runtime
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Probe official Cuneo publication
        env:
          LANDING_URL: https://prefettura.interno.gov.it/it/prefetture/cuneo/elenco-iscritti-white-liste-e-elenco-richiedenti-white-list
        run: |
          mkdir -p probe
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import time
          from urllib.parse import urljoin, urlsplit, urlunsplit, parse_qsl, urlencode

          import requests
          from bs4 import BeautifulSoup

          landing = os.environ['LANDING_URL']
          out = pathlib.Path('probe')
          headers = {
              'User-Agent': 'Mozilla/5.0 (compatible; italian-anti-mafia-whitelist-source-verification/1.0)',
              'Accept': 'text/html,application/xhtml+xml,application/pdf;q=0.9,*/*;q=0.8',
              'Cache-Control': 'no-cache',
              'Pragma': 'no-cache',
          }
          summary = {'landing_url': landing, 'ok': False, 'attachments': []}

          def cache_bust(url, token):
              parts = urlsplit(url)
              q = parse_qsl(parts.query, keep_blank_values=True)
              q.append(('_wl_probe', token))
              return urlunsplit((parts.scheme, parts.netloc, parts.path, urlencode(q), parts.fragment))

          try:
              r = requests.get(cache_bust(landing, 'landing-' + str(time.time_ns())), headers=headers, timeout=45, allow_redirects=True)
              summary['landing_status'] = r.status_code
              summary['landing_final_url'] = r.url
              summary['landing_content_type'] = r.headers.get('content-type')
              r.raise_for_status()
              out.joinpath('landing.html').write_bytes(r.content)

              soup = BeautifulSoup(r.content, 'html.parser')
              anchors = []
              for a in soup.find_all('a', href=True):
                  label = ' '.join(a.stripped_strings)
                  href = urljoin(r.url, a.get('href'))
                  if label or href:
                      anchors.append({'label': label, 'url': href})
              out.joinpath('links.json').write_text(json.dumps(anchors, ensure_ascii=False, indent=2), encoding='utf-8')

              def choose(kind):
                  candidates = []
                  for x in anchors:
                      hay = (x['label'] + ' ' + x['url']).lower()
                      if kind == 'listed' and ('iscritt' in hay) and ('richied' not in hay):
                          candidates.append(x)
                      if kind == 'applicants' and ('richied' in hay):
                          candidates.append(x)
                  pdfish = [x for x in candidates if '.pdf' in x['url'].lower() or 'document' in x['url'].lower() or 'file' in x['url'].lower()]
                  candidates = pdfish or candidates
                  if not candidates:
                      return None
                  return candidates[-1]

              selected = {'listed': choose('listed'), 'applicants': choose('applicants')}
              summary['selected'] = selected

              for kind, item in selected.items():
                  if not item:
                      continue
                  copies = []
                  for idx in (1, 2):
                      u = cache_bust(item['url'], f'{kind}-{idx}-{time.time_ns()}')
                      rr = requests.get(u, headers=headers, timeout=60, allow_redirects=True)
                      rec = {
                          'attempt': idx,
                          'status': rr.status_code,
                          'final_url': rr.url,
                          'content_type': rr.headers.get('content-type'),
                          'bytes': len(rr.content),
                          'sha256': hashlib.sha256(rr.content).hexdigest(),
                      }
                      copies.append(rec)
                      if rr.status_code == 200:
                          out.joinpath(f'{kind}-{idx}.bin').write_bytes(rr.content)
                      time.sleep(2)
                  entry = {'kind': kind, 'label': item['label'], 'source_url': item['url'], 'copies': copies}
                  entry['byte_identical'] = (
                      len(copies) == 2
                      and copies[0]['status'] == 200
                      and copies[1]['status'] == 200
                      and copies[0]['sha256'] == copies[1]['sha256']
                      and copies[0]['bytes'] == copies[1]['bytes']
                  )
                  summary['attachments'].append(entry)

              summary['ok'] = (
                  len(summary['attachments']) == 2
                  and {x['kind'] for x in summary['attachments']} == {'listed', 'applicants'}
                  and all(x['byte_identical'] for x in summary['attachments'])
              )
          except Exception as exc:
              summary['error'] = f'{type(exc).__name__}: {exc}'
          finally:
              out.joinpath('summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
              print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Inspect downloaded documents
        if: always()
        run: |
          for f in probe/listed-1.bin probe/applicants-1.bin; do
            if [ -f "$f" ]; then
              echo "===== $f ====="
              file "$f" || true
              sha256sum "$f" || true
              pdfinfo "$f" | sed -n '1,25p' || true
              pdftotext -layout "$f" "${f%.bin}.txt" || true
              if [ -f "${f%.bin}.txt" ]; then
                echo "--- first 80 non-empty lines ---"
                sed '/^[[:space:]]*$/d' "${f%.bin}.txt" | sed -n '1,80p'
                echo "--- last 40 non-empty lines ---"
                sed '/^[[:space:]]*$/d' "${f%.bin}.txt" | tail -40
                echo "--- text line count ---"
                wc -l "${f%.bin}.txt"
              fi
            fi
          done

      - name: Report probe verdict
        if: always()
        run: |
          cat probe/summary.json || true
          if jq -e '.ok == true' probe/summary.json >/dev/null 2>&1; then
            echo 'Cuneo source probe established two byte-identical independent captures for both official populations.'
          else
            echo '::warning::Cuneo source probe did not establish the complete two-population capture boundary; treat as unresolved evidence, not negative evidence.'
          fi

      - name: Save source-discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuneo-source-discovery-2026-09-19
          path: probe/
          if-no-files-found: warn
          retention-days: 7
