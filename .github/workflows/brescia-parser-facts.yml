name: Brescia parser facts audit

on:
  push:
    branches:
      - expansion/brescia-2026-09-12
    paths:
      - .github/workflows/brescia-parser-facts.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  facts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/brescia-2026-09-12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'openpyxl>=3.1,<4' requests
      - name: Derive compact parser facts
        env:
          LISTED_URL: https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco-ditte-iscritte-10-settembre-2026.xlsx
          APPLICANT_URL: https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco-ditte-richiedenti-l-iscrizione-10-settembre-2026.xlsx
        run: |
          mkdir -p tmp
          python - <<'PY'
          import io,json,os,re,hashlib
          from collections import Counter,defaultdict
          from datetime import date,datetime
          from pathlib import Path
          import openpyxl,requests
          H={'User-Agent':'italian-anti-mafia-whitelist/parser-facts (+https://github.com/colazeta/italian-anti-mafia-whitelist)'}
          DMY=re.compile(r'^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$')
          SEC=re.compile(r'^\s*sezione\s*(i{1,3}|iv|v|vi{0,3}|ix|x)\s*$',re.I)
          def get(url):
              r=requests.get(url,headers=H,timeout=60);r.raise_for_status();return r
          def c(v):
              if v is None:return ''
              if isinstance(v,datetime):return v.date().isoformat()
              if isinstance(v,date):return v.isoformat()
              return re.sub(r'\s+',' ',str(v)).strip()
          def norm(v):
              raw=c(v)
              if not raw:return '',raw,'missing'
              if re.fullmatch(r'\d{4}-\d{2}-\d{2}',raw):
                  try:return date.fromisoformat(raw).isoformat(),raw,''
                  except ValueError:return '',raw,'invalid'
              m=DMY.fullmatch(raw)
              if m:
                  try:return date(int(m[3]),int(m[2]),int(m[1])).isoformat(),raw,''
                  except ValueError:return '',raw,'invalid'
              return '',raw,'unreviewed'
          def fetch2(url):
              a=get(url);b=get(url);sa=hashlib.sha256(a.content).hexdigest();sb=hashlib.sha256(b.content).hexdigest()
              if sa!=sb:raise SystemExit('byte drift')
              return a.content,sa
          def find(vals, pred):
              for i,v in enumerate(vals):
                  if pred(v.casefold()):return i
              return None

          lbytes,lsha=fetch2(os.environ['LISTED_URL']);wb=openpyxl.load_workbook(io.BytesIO(lbytes),data_only=True,read_only=True)
          rows=[];sec='';act='';cols=None
          for ws in wb.worksheets:
              for rn,row in enumerate(ws.iter_rows(values_only=True),1):
                  vals=[c(x) for x in row];non=[x for x in vals if x]
                  hits=[SEC.fullmatch(x).group(1).upper() for x in non if SEC.fullmatch(x)]
                  if hits:sec=hits[0];act='';cols=None;continue
                  if sec and cols is None and non and not any('ragione sociale' in x.casefold() for x in non):
                      cand=max(non,key=len)
                      if not any(t in cand.casefold() for t in ('prefettura','ufficio antimafia','elenco dei fornitori','art.1')):act=cand
                  if any('ragione sociale' in x.casefold() for x in vals):
                      ni=find(vals,lambda x:'ragione sociale' in x);oi=find(vals,lambda x:'sede legale' in x);ii=find(vals,lambda x:'codice fiscale' in x or 'partita iva' in x);li=find(vals,lambda x:'data iscrizione' in x or 'data di iscrizione' in x);ei=find(vals,lambda x:'data scadenza' in x or 'data di scadenza' in x);ui=find(vals,lambda x:'aggiornamento' in x)
                      cols=(ni,oi,ii,li,ei,ui);continue
                  if cols is None:continue
                  ni,oi,ii,li,ei,ui=cols;name=vals[ni] if ni is not None and ni<len(vals) else ''
                  if not name:continue
                  office=vals[oi] if oi is not None and oi<len(vals) else ''; ident=vals[ii] if ii is not None and ii<len(vals) else ''; upd=vals[ui] if ui is not None and ui<len(vals) else ''
                  ln,lr,le=norm(row[li] if li is not None and li<len(row) else None);en,er,ee=norm(row[ei] if ei is not None and ei<len(row) else None)
                  if not ident and not lr and not er and not upd:continue
                  rows.append({'row':rn,'section':sec,'activity':act,'name':name,'office':office,'identifier':ident,'listing':ln,'listing_raw':lr,'listing_error':le,'expiry':en,'expiry_raw':er,'expiry_error':ee,'update':upd})
          by_ident=defaultdict(list);by_name=defaultdict(list)
          for r in rows:
              if r['identifier']:by_ident[r['identifier']].append(r)
              by_name[r['name']].append(r)
          anomalies=[]
          for r in rows:
              if r['listing_error'] or r['expiry_error'] or not r['identifier'] or re.fullmatch(r'\d{1,2}[./-]\d{1,2}[./-]\d{4}',r['identifier'] or ''):
                  peers=[]
                  for p in (by_ident.get(r['identifier'],[]) if r['identifier'] else by_name.get(r['name'],[])):
                      if p['row']!=r['row']:
                          peers.append({k:p[k] for k in ('row','section','name','office','identifier','listing','listing_raw','expiry','expiry_raw','update')})
                  anomalies.append({'row':{k:r[k] for k in r},'peers':peers})
          groups=defaultdict(list)
          for r in rows:
              key=(r['name'],r['identifier'],r['listing'] or r['listing_raw'],r['expiry'] or r['expiry_raw'])
              groups[key].append(r)
          listed_summary={
              'sha256':lsha,'rows':len(rows),'groups':len(groups),
              'group_status_counts':dict(Counter('renewal_update_in_progress' if any('in fase di aggiornamento' in x['update'].casefold() for x in rs) else 'listed' for rs in groups.values())),
              'anomalies':anomalies,
              'nonstandard_updates':[{'row':r['row'],'section':r['section'],'name':r['name'],'value':r['update']} for r in rows if r['update'] and 'in fase di aggiornamento' not in r['update'].casefold()],
          }

          abytes,asha=fetch2(os.environ['APPLICANT_URL']);awb=openpyxl.load_workbook(io.BytesIO(abytes),data_only=True,read_only=True)
          arows=[];headers=[]
          for ws in awb.worksheets:
              cols=None
              for rn,row in enumerate(ws.iter_rows(values_only=True),1):
                  vals=[c(x) for x in row];joined=' | '.join(vals).casefold()
                  if 'ragione sociale' in joined and ('codice fiscale' in joined or 'partita iva' in joined):
                      ni=find(vals,lambda x:'ragione sociale' in x);oi=find(vals,lambda x:'sede' in x);ii=find(vals,lambda x:'codice fiscale' in x or 'partita iva' in x);ai=find(vals,lambda x:'attivit' in x or 'settore' in x);di=find(vals,lambda x:'data' in x and any(t in x for t in ('istanza','presentazione','richiesta')))
                      cols=(ni,oi,ii,ai,di);headers.append({'sheet':ws.title,'row':rn,'columns':list(cols),'values':vals});continue
                  if cols is None:continue
                  ni,oi,ii,ai,di=cols;name=vals[ni] if ni is not None and ni<len(vals) else ''
                  if not name:continue
                  office=vals[oi] if oi is not None and oi<len(vals) else '';ident=vals[ii] if ii is not None and ii<len(vals) else '';activity=vals[ai] if ai is not None and ai<len(vals) else '';dn,dr,de=norm(row[di] if di is not None and di<len(row) else None)
                  if not ident and not activity and not dr:continue
                  arows.append({'row':rn,'name':name,'office':office,'identifier':ident,'activity':activity,'date':dn,'date_raw':dr,'date_error':de})
          ag=defaultdict(list)
          for r in arows:ag[(r['name'],r['office'],r['identifier'],r['activity'],r['date'] or r['date_raw'])].append(r)
          dup=[{'key':list(k),'rows':[x['row'] for x in v]} for k,v in ag.items() if len(v)>1]
          applicant_summary={
              'sha256':asha,'sheets':awb.sheetnames,'headers':headers,'rows':len(arows),'groups':len(ag),'duplicates':dup,
              'date_presence':dict(Counter('present' if r['date_raw'] else 'missing' for r in arows)),
              'date_errors':[{k:r[k] for k in ('row','name','date_raw','date_error')} for r in arows if r['date_error'] not in ('','missing')],
              'identifier_presence':dict(Counter('present' if r['identifier'] else 'missing' for r in arows)),
              'activity_presence':dict(Counter('present' if r['activity'] else 'missing' for r in arows)),
              'missing_identifier_examples':[{k:r[k] for k in ('row','name','office','activity','date_raw')} for r in arows if not r['identifier']][:50],
              'dated_examples':[{k:r[k] for k in ('row','name','date_raw','date')} for r in arows if r['date_raw']][:50],
          }
          out={'listed':listed_summary,'applicant':applicant_summary}
          Path('tmp/brescia-parser-facts.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Persist parser facts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/brescia-parser-facts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Checkpoint Brescia parser facts'
          git push origin HEAD:expansion/brescia-2026-09-12
