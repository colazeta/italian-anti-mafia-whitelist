name: Matera parser validation 2026-09-20

on:
  push:
    branches:
      - expansion/matera-2026-09-20
    paths:
      - src/white_list_archive/parsers/matera_openxml.py
      - tests/test_matera_parser_semantics.py
      - .github/workflows/matera-parser-validate-2026-09-20.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/matera-2026-09-20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify canonical base and isolated Matera scope
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "6d88336c0ca902eee0e37071a43da1d96c28681c"
          test "$(git rev-list --count HEAD..origin/main)" = "0"
          python - <<'PY'
          import subprocess
          files=set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'],text=True).splitlines())
          allowed={
            '.github/workflows/matera-source-probe-2026-09-20.yml',
            '.github/workflows/matera-source-probe-v2-2026-09-20.yml',
            '.github/workflows/matera-parser-validate-2026-09-20.yml',
            'src/white_list_archive/parsers/matera_openxml.py',
            'tests/test_matera_parser_semantics.py',
          }
          if files != allowed: raise SystemExit(f'unexpected Matera validation scope: {sorted(files)}')
          PY
      - name: Install project and bounded HTTP dependency
        run: python -m pip install -e .[dev] requests
      - name: Run focused parser tests
        run: pytest -q tests/test_matera_parser_semantics.py
      - name: Capture exact official sources twice and validate production parser
        env:
          LISTED_URL: https://prefettura.interno.gov.it/sites/default/files/54/2026-08/iscritte-luglio-2026.xlsx
          APPLICANTS_URL: https://prefettura.interno.gov.it/sites/default/files/54/2026-08/elenco-richiedenti-iscrizione.xlsx
          LISTED_SHA: 4a2a3fad0711f9d3c159d78c93210983b9f1699c2810d8154b60d8fc5d958d3f
          APPLICANTS_SHA: e4dae926800d1c513e1274b8ae45267337987eaa5b62b1581cbbcc56f6da898c
        run: |
          mkdir -p /tmp/matera-parser
          python - <<'PY'
          import hashlib,json,os,pathlib,time
          from collections import Counter
          from urllib.parse import parse_qsl,urlencode,urlsplit,urlunsplit
          import requests
          from white_list_archive.parsers.matera_openxml import parse_applicants,parse_listed

          root=pathlib.Path('/tmp/matera-parser')
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; italian-anti-mafia-whitelist-source-verification/1.0)','Cache-Control':'no-cache','Pragma':'no-cache'})
          def bust(url,tag):
              p=urlsplit(url); q=parse_qsl(p.query,keep_blank_values=True); q.append(('_wl_validate',f'{tag}-{time.time_ns()}'))
              return urlunsplit((p.scheme,p.netloc,p.path,urlencode(q),''))
          def capture(kind,url,expected):
              bodies=[]
              for attempt in (1,2):
                  r=s.get(bust(url,f'{kind}-{attempt}'),timeout=90,allow_redirects=True); r.raise_for_status()
                  sha=hashlib.sha256(r.content).hexdigest()
                  print('FETCH',json.dumps({'kind':kind,'attempt':attempt,'bytes':len(r.content),'sha256':sha,'content_type':r.headers.get('content-type','')},sort_keys=True))
                  if sha != expected: raise SystemExit(f'{kind} approved digest drift: expected {expected}, got {sha}')
                  bodies.append(r.content)
              if bodies[0] != bodies[1]: raise SystemExit(f'{kind} independent captures differ')
              path=root/f'{kind}.xlsx'; path.write_bytes(bodies[0]); return path

          listed_path=capture('listed',os.environ['LISTED_URL'],os.environ['LISTED_SHA'])
          applicants_path=capture('applicants',os.environ['APPLICANTS_URL'],os.environ['APPLICANTS_SHA'])
          base={
            'authority_key':'matera',
            'authority_name':'Prefettura - Ufficio Territoriale del Governo di Matera',
            'register_key':'matera-ordinary',
            'register_name':'White List',
            'reference_date':'2026-07-31',
            'source_page_url':'https://prefettura.interno.gov.it/it/prefetture/matera/evidenza/white-list',
          }
          listed=parse_listed(listed_path,{**base,'source_key':'matera-listed','population_scope':'listed','resource_url':os.environ['LISTED_URL'],'sha256':os.environ['LISTED_SHA']})
          applicants=parse_applicants(applicants_path,{**base,'source_key':'matera-applicants','population_scope':'applicants','resource_url':os.environ['APPLICANTS_URL'],'sha256':os.environ['APPLICANTS_SHA']})
          records=listed.records+applicants.records
          status=Counter(r['source_status'] for r in records)
          source_keys=Counter(r['source_key'] for r in records)
          diagnostics={
            'listed':listed.diagnostics,
            'applicants':applicants.diagnostics,
            'total_records':len(records),
            'status_counts':dict(status),
            'source_counts':dict(source_keys),
            'identifier_coverage':sum(bool(r['identifiers']) for r in records),
            'application_date_coverage':sum(bool(r['application_date']) for r in records),
            'listing_date_coverage':sum(bool(r['observed_listing_date']) for r in records),
            'expiry_date_coverage':sum(bool(r['observed_expiry_date']) for r in records),
            'unique_locators':len({r['record_locator'] for r in records}),
          }
          print('MATERA_VALIDATED_BOUNDARY',json.dumps(diagnostics,ensure_ascii=False,sort_keys=True))
          if len(records) != 338: raise SystemExit(f'Matera total boundary changed: {len(records)}')
          if dict(status) != {'listed':248,'pending':41,'renewal_update_in_progress':49}: raise SystemExit(f'Matera canonical statuses changed: {dict(status)!r}')
          if dict(source_keys) != {'matera-listed':248,'matera-applicants':90}: raise SystemExit(f'Matera source split changed: {dict(source_keys)!r}')
          if diagnostics['unique_locators'] != 338: raise SystemExit('Matera record locators are not unique')
          if diagnostics['application_date_coverage'] != 90: raise SystemExit('Matera applicant-date coverage changed')
          if diagnostics['listing_date_coverage'] != 248 or diagnostics['expiry_date_coverage'] != 248: raise SystemExit('Matera listed date coverage changed')
          (root/'diagnostics.json').write_text(json.dumps(diagnostics,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Upload bounded validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matera-parser-validation-${{ github.sha }}
          path: /tmp/matera-parser/diagnostics.json
          if-no-files-found: ignore
          retention-days: 3
