name: Lecco national candidate (temporary)

on:
  push:
    branches:
      - expansion/lecco-2026-09-15
    paths:
      - .github/workflows/lecco-national-candidate.yml
      - tmp/lecco_integrate_candidate.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lecco-national-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply candidate transaction in the runner worktree
        run: python tmp/lecco_integrate_candidate.py

      - name: Enforce exact candidate integration diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          data/catalog.csv
          data/monitoring/national_coverage.json
          data/publication/multi_prefecture_pilot.json
          data/source_registry/source_series_inventory.csv
          data/source_registry/verified_primary_pages.csv
          src/white_list_archive/publishing/public_national_registry.py
          tests/test_source_population_coverage.py
          tests/test_source_registry.py
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Prepare publication runtime
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source_file; do
            [ -n "$source_file" ] && sudo rm -f "$source_file"
          done < <(grep -rlE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '\|dl\.google\.com/linux/chrome|d;\|packages\.google\.com/chrome|d' /etc/apt/sources.list
          fi
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && \
               sudo apt-get install -y --no-install-recommends poppler-utils; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Publication runtime package installation failed after bounded retries" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[dev,publication,database,storage]'

      - name: Run full repository and Lecco semantic tests
        run: |
          pytest -q
          pytest -q tests/test_lecco_parser_semantics.py

      - name: Build actual national candidate
        run: |
          rm -rf /tmp/lecco-national-candidate /tmp/lecco-national-sources
          mkdir -p /tmp/lecco-national-candidate
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/lecco-national-sources \
            --registry-json /tmp/lecco-national-candidate/registry.json \
            --registry-csv /tmp/lecco-national-candidate/registry.csv \
            --prefectures-json /tmp/lecco-national-candidate/prefectures.json \
            --prefectures-csv /tmp/lecco-national-candidate/prefectures.csv

      - name: Validate actual national and Lecco denominators
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/lecco-national-candidate')
          reg = json.loads((root / 'registry.json').read_text(encoding='utf-8'))
          pref = json.loads((root / 'prefectures.json').read_text(encoding='utf-8'))

          assert reg['meta']['record_count'] == len(reg['records']) == 48391
          assert reg['meta']['authority_count'] == 43
          assert reg['meta']['register_count'] == 44
          assert pref['meta']['authority_count'] == 106
          assert pref['meta']['published_count'] == 43
          assert pref['meta']['mapped_count'] == 47

          lecco_pref = [x for x in pref['prefectures'] if x.get('authority_key') == 'lecco']
          assert len(lecco_pref) == 1
          assert lecco_pref[0]['mapped'] and lecco_pref[0]['published']
          assert lecco_pref[0]['series_count'] == 2

          records = [r for r in reg['records'] if r['authority_key'] == 'lecco']
          assert len(records) == 256
          assert len({r['record_locator'] for r in records}) == 256
          assert sum(r['source_key'] == 'lecco-listed' for r in records) == 230
          assert sum(r['source_key'] == 'lecco-applicants' for r in records) == 26
          assert sum(r['source_status'] == 'listed' for r in records) == 201
          assert sum(r['source_status'] == 'renewal_update_in_progress' for r in records) == 29
          assert sum(r['source_status'] == 'pending' for r in records) == 22
          assert sum(r['source_status'] == 'rejected_or_denied' for r in records) == 4
          assert sum(bool(r['identifiers']) for r in records if r['source_key'] == 'lecco-listed') == 228
          assert sum(bool(r['identifiers']) for r in records if r['source_key'] == 'lecco-applicants') == 26

          termoidraulica = [r for r in records if r['source_key'] == 'lecco-listed' and r['name'] == 'Termoidraulica']
          assert len(termoidraulica) == 1
          assert termoidraulica[0]['identifier_field_raw'] == '035180050137'
          assert termoidraulica[0]['identifiers'] == []
          assert termoidraulica[0]['requested_activities'] == []

          edilnord = [
              r for r in records
              if r['source_key'] == 'lecco-applicants'
              and r['identifier_field_raw'] == '01882770132'
          ]
          assert len(edilnord) == 3
          assert {r['application_date'] for r in edilnord} == {'2013-12-12', '2016-01-29', '2017-04-18'}

          print({
              'record_count': reg['meta']['record_count'],
              'authority_count': reg['meta']['authority_count'],
              'register_count': reg['meta']['register_count'],
              'published_count': pref['meta']['published_count'],
              'mapped_count': pref['meta']['mapped_count'],
              'lecco_records': len(records),
          })
          PY

      - name: Recheck exact production transaction
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > /tmp/actual-files-final.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files-final.txt

      - name: Commit validated production integration
        shell: bash
        env:
          BRANCH: expansion/lecco-2026-09-15
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Remote branch advanced during candidate transaction: $remote_sha != $GITHUB_SHA" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/catalog.csv \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            data/source_registry/verified_primary_pages.csv \
            src/white_list_archive/publishing/public_national_registry.py \
            tests/test_source_population_coverage.py \
            tests/test_source_registry.py
          git commit -m 'feat(lecco): integrate current White List coverage'
          git push origin "HEAD:$BRANCH"
