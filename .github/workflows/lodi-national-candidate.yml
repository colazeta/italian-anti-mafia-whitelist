name: Lodi national integration candidate

on:
  push:
    branches:
      - expansion/lodi-2026-09-15
    paths:
      - '.github/workflows/lodi-national-candidate.yml'
      - 'tmp/lodi_integrate_candidate.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lodi-national-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PDF and project runtimes
        run: |
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install -e '.[dev,database,storage,publication]'
      - name: Reacquire Lodi sources twice and verify approved bytes
        shell: bash
        run: |
          set -euo pipefail
          listed='https://docs.google.com/spreadsheets/d/e/2PACX-1vSTOZ3x5FBo4IanDtISccAnqZmVLPmGhEYaj0YrDn4aP6ZpwY8kzpiHhAX0i26IwipgD6bvsWhSigwz/pub?gid=0&single=true&output=csv'
          applicants='https://docs.google.com/spreadsheets/d/e/2PACX-1vSTOZ3x5FBo4IanDtISccAnqZmVLPmGhEYaj0YrDn4aP6ZpwY8kzpiHhAX0i26IwipgD6bvsWhSigwz/pub?gid=245180329&single=true&output=csv'
          mkdir -p /tmp/lodi-source
          for n in 1 2; do
            curl --fail --location --silent --show-error --retry 3 "$listed" -o "/tmp/lodi-source/listed-$n.csv"
            sleep 2
            curl --fail --location --silent --show-error --retry 3 "$applicants" -o "/tmp/lodi-source/applicants-$n.csv"
            sleep 2
          done
          cmp /tmp/lodi-source/listed-1.csv /tmp/lodi-source/listed-2.csv
          cmp /tmp/lodi-source/applicants-1.csv /tmp/lodi-source/applicants-2.csv
          test "$(sha256sum /tmp/lodi-source/listed-1.csv | cut -d' ' -f1)" = 'ad64ab8669084bc31b80938a384b41849be4db28b448e9b2c0ce199f6af1d6ec'
          test "$(sha256sum /tmp/lodi-source/applicants-1.csv | cut -d' ' -f1)" = '55aeab7e809cb90cc1ebd1ad9c1f08db78e91648a2c2e1a2b603188c77846228'
      - name: Apply fail-closed Lodi integration transaction
        run: python tmp/lodi_integrate_candidate.py
      - name: Run full repository and Lodi semantic tests
        run: |
          pytest -q
          pytest -q tests/test_lodi_parser_semantics.py
      - name: Build actual national candidate
        run: |
          rm -rf /tmp/lodi-public-site /tmp/lodi-national-sources
          cp -a public-site /tmp/lodi-public-site
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/lodi-national-sources \
            --registry-json /tmp/lodi-public-site/data/registry.json \
            --registry-csv /tmp/lodi-public-site/data/registry.csv \
            --prefectures-json /tmp/lodi-public-site/data/prefectures.json \
            --prefectures-csv /tmp/lodi-public-site/data/prefectures.csv
      - name: Validate national candidate and exact Lodi invariants
        run: |
          python -m white_list_archive.publishing.public_artifact /tmp/lodi-public-site
          node --check /tmp/lodi-public-site/app.js
          node --check /tmp/lodi-public-site/summary.js
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root=Path('/tmp/lodi-public-site/data')
          reg=json.loads((root/'registry.json').read_text(encoding='utf-8'))
          pref=json.loads((root/'prefectures.json').read_text(encoding='utf-8'))
          meta=reg['meta']
          assert meta['record_count'] == 42371, meta
          assert meta['authority_count'] == 39, meta
          assert meta['register_count'] == 40, meta
          assert len(reg['records']) == 42371
          assert meta['authority_counts']['lodi'] == 173
          assert meta['register_counts']['lodi-ordinary'] == 173
          assert pref['meta']['authority_count'] == 106
          assert pref['meta']['published_count'] == 39
          assert pref['meta']['mapped_count'] == 44
          rows=[record for record in reg['records'] if record['authority_key']=='lodi']
          assert len(rows) == 173
          scopes=Counter(record['population_scope'] for record in rows)
          assert scopes == Counter({'listed':169,'applicant':4}), scopes
          statuses=Counter(record['source_status'] for record in rows)
          assert statuses == Counter({'listed':146,'renewal_update_in_progress':23,'rejected_or_denied':2,'pending':2}), statuses
          assert len({record['record_locator'] for record in rows}) == 173
          denied=[record for record in rows if record['source_status']=='rejected_or_denied']
          assert sorted(record['decision_date'] for record in denied) == ['2021-06-17','2022-11-17']
          lodi=[item for item in pref['prefectures'] if item['authority_key']=='lodi']
          assert len(lodi)==1 and lodi[0]['mapped'] and lodi[0]['published'] and lodi[0]['series_count']==2, lodi
          print({'record_count':meta['record_count'],'authority_count':meta['authority_count'],'register_count':meta['register_count'],'mapped_count':pref['meta']['mapped_count'],'lodi_statuses':dict(statuses)})
          PY
      - name: Check exact production-only integration diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          data/monitoring/national_coverage.json
          data/publication/multi_prefecture_pilot.json
          data/source_registry/source_series_inventory.csv
          data/source_registry/verified_primary_pages.csv
          src/white_list_archive/publishing/public_national_registry.py
          EOF
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
      - name: Commit validated production integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            data/source_registry/verified_primary_pages.csv \
            src/white_list_archive/publishing/public_national_registry.py
          git diff --cached --check
          git commit -m 'Integrate Lodi public White List sources'
          git push origin HEAD:expansion/lodi-2026-09-15
