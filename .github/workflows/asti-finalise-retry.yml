name: Retry Asti finalisation

on:
  push:
    branches:
      - expansion/asti-2026-09-10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair Asti finaliser runtime
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/asti-finalise.yml')
          text = path.read_text(encoding='utf-8')

          # The finaliser is a temporary one-shot workflow. Allow the helper's
          # bot-authored repair commit to execute it exactly once; the finaliser
          # deletes itself after successful validation.
          guard = "    if: github.actor != 'github-actions[bot]'\n"
          assert text.count(guard) == 1
          text = text.replace(guard, "", 1)

          install = "      - name: Install publication runtime\n        run: python -m pip install -e '.[dev,publication]'\n"
          assert text.count(install) == 1
          replacement = (
              "      - name: Install PDF system runtime\n"
              "        run: sudo apt-get update && sudo apt-get install -y poppler-utils\n"
              + install
          )
          text = text.replace(install, replacement, 1)

          removal = "            .github/workflows/asti-finalise.yml\n"
          assert text.count(removal) == 1
          text = text.replace(removal, removal + "            .github/workflows/asti-finalise-retry.yml\n", 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit repaired finaliser
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/asti-finalise.yml
          git diff --cached --check
          git commit -m 'Repair Asti finalisation runtime'
          git push origin HEAD:expansion/asti-2026-09-10
