name: Bolzano integration gate v2

on:
  push:
    branches:
      - expansion/bolzano-bozen-2026-09-12
    paths:
      - .github/workflows/bolzano-integration-v2.yml
      - tmp/bolzano_integration_v2.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/bolzano-bozen-2026-09-12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialise Bolzano production candidate
        run: |
          python tmp/bolzano_integration_v2.py
          python - <<'PY'
          from pathlib import Path
          for name in (
              "data/source_registry/source_series_inventory.csv",
              "data/source_registry/verified_primary_pages.csv",
          ):
              path = Path(name)
              path.write_bytes(path.read_bytes().replace(b"\r\n", b"\n"))
          PY
          git diff --check
          git status --short
      - name: Install full validation runtime
        run: |
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends poppler-utils; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[dev,publication,storage,database]'
      - name: Run full repository tests
        run: python -m pytest -q
      - name: Validate Bolzano public-contract projection
        run: |
          python - <<'PY'
          from white_list_archive.parsers.multi_prefecture_tables import ParsedBatch
          from white_list_archive.publishing.public_contract import public_record
          from white_list_archive.publishing.public_national_registry import _adapt_bolzano_public_fields

          base = {
              'record_locator': 'bolzano-test:1', 'source_key': 'bolzano-test',
              'authority_key': 'bolzano-bozen', 'authority_name': 'Bolzano',
              'register_key': 'bolzano-bozen-ordinary', 'register_name': 'White List ordinaria',
              'population_scope': 'listed', 'reference_date': '2026-09-11',
              'source_row_ordinal': 1, 'name': 'TEST', 'registered_office': '',
              'secondary_office': '', 'identifier_field_raw': '', 'identifiers': [],
              'requested_activities': ['Sezione 1'], 'requested_activities_raw': 'Sezione 1',
              'source_status': 'listed', 'outcome_raw': '', 'application_date': '',
              'observed_listing_date': '', 'decision_date': '', 'registration_date': '',
              'observed_expiry_date': '', 'primary_date': '', 'primary_date_label': 'Data iscrizione',
              'source_page_url': 'https://example.invalid', 'resource_url': 'https://example.invalid/source',
              'capture_sha256': '0' * 64,
              'source_fields': {
                  'listed_sections': [1], 'listed_source_rows': [3],
                  'listing_date_raw': '29/6/2026', 'expiry_date_raw': '16/19/2026',
                  'update_raw_values': [],
              },
          }
          batch = _adapt_bolzano_public_fields(ParsedBatch([base], {'public_records': 1}), 'bolzano_listed')
          projected = public_record(batch.records[0])
          assert projected['source_fields']['sections'] == ['Sezione 1']
          assert projected['source_fields']['listing_date_raw_variants'] == ['29/6/2026']
          assert projected['source_fields']['expiry_date_raw_variants'] == ['16/19/2026']
          print('Bolzano public-contract projection validated')
          PY
      - name: Validate Bolzano national public candidate
        run: |
          set +e
          rc=1
          for attempt in 1 2; do
            log="/tmp/bolzano-national-build-v2-attempt-${attempt}.log"
            PYTHONUNBUFFERED=1 white-list-public-national-build \
              --source-config data/publication/multi_prefecture_pilot.json \
              --verified-pages data/source_registry/verified_primary_pages.csv \
              --source-series data/source_registry/source_series_inventory.csv \
              --authority-aliases data/source_registry/national_index_authority_aliases.csv \
              --work-dir /tmp/public-national-sources \
              --registry-json public-site/data/registry.json \
              --registry-csv public-site/data/registry.csv \
              --prefectures-json public-site/data/prefectures.json \
              --prefectures-csv public-site/data/prefectures.csv \
              2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then
              break
            fi
            if grep -Eqi 'HTTP Error (403|408|429|5[0-9][0-9])|timed out|timeout|URLError|Temporary failure|Connection reset|Remote end closed connection' "$log"; then
              echo "Transient source/network failure detected; bounded retry $attempt/2" >&2
              sleep $((attempt * 5))
              continue
            fi
            echo "Non-transient national build failure; not retrying" >&2
            break
          done
          set -e
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          reg=json.loads(Path('public-site/data/registry.json').read_text())
          pref=json.loads(Path('public-site/data/prefectures.json').read_text())
          assert reg['meta']['record_count']==24724, reg['meta']
          assert reg['meta']['authority_count']==27, reg['meta']
          assert reg['meta']['register_count']==28, reg['meta']
          assert pref['meta']['published_count']==27, pref['meta']
          assert pref['meta']['mapped_count']==37, pref['meta']
          bz=[r for r in reg['records'] if r['authority_key']=='bolzano-bozen']
          assert len(bz)==1222
          assert sum(r['source_key']=='bolzano-bozen-listed' for r in bz)==871
          assert sum(r['source_key']=='bolzano-bozen-applicants' for r in bz)==351
          assert Counter(r['source_status'] for r in bz)==Counter({'listed':620,'pending':351,'renewal_update_in_progress':251})
          malformed=[r for r in bz if r.get('source_fields',{}).get('expiry_date_raw_variants')==['16/19/2026']]
          assert len(malformed)==1 and malformed[0]['observed_expiry_date']==''
          print('Bolzano national candidate validated:',reg['meta']['record_count'],reg['meta']['authority_count'],reg['meta']['register_count'],pref['meta']['mapped_count'])
          PY
      - name: Commit production candidate without workflow mutation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            data/source_registry/verified_primary_pages.csv \
            docs/sources/bolzano-operational-check-2026-09-12.md \
            src/white_list_archive/publishing/public_national_registry.py \
            tests/public_portal_browser.cjs
          git diff --cached --check
          git commit -m 'Integrate Bolzano public archive'
          git push origin HEAD:expansion/bolzano-bozen-2026-09-12
