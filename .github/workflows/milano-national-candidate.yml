name: Milano national candidate (temporary)

on:
  push:
    branches:
      - expansion/milano-2026-09-16
    paths:
      - .github/workflows/milano-national-candidate.yml
      - tmp/milano_integrate_candidate.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milano-national-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply candidate transaction in the runner worktree
        run: python tmp/milano_integrate_candidate.py

      - name: Enforce exact candidate integration diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          data/monitoring/national_coverage.json
          data/publication/multi_prefecture_pilot.json
          data/source_registry/source_series_inventory.csv
          data/source_registry/verified_primary_pages.csv
          src/white_list_archive/publishing/public_national_registry.py
          tests/test_source_population_coverage.py
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Prepare publication runtime
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source_file; do
            [ -n "$source_file" ] && sudo rm -f "$source_file"
          done < <(grep -rlE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '\|dl\.google\.com/linux/chrome|d;\|packages\.google\.com/chrome|d' /etc/apt/sources.list
          fi
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends poppler-utils; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Publication runtime package installation failed after bounded retries" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[dev,publication,database,storage]'

      - name: Run full repository and Milano semantic tests
        run: |
          pytest -q
          pytest -q tests/test_milano_parser_semantics.py

      - name: Build actual national candidate
        run: |
          rm -rf /tmp/milano-national-candidate /tmp/milano-national-sources
          mkdir -p /tmp/milano-national-candidate
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/milano-national-sources \
            --registry-json /tmp/milano-national-candidate/registry.json \
            --registry-csv /tmp/milano-national-candidate/registry.csv \
            --prefectures-json /tmp/milano-national-candidate/prefectures.json \
            --prefectures-csv /tmp/milano-national-candidate/prefectures.csv

      - name: Validate actual national and Milano denominators
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from white_list_archive.acquisition.source_population_coverage import _read_csv, build_coverage

          root = Path('/tmp/milano-national-candidate')
          reg = json.loads((root / 'registry.json').read_text(encoding='utf-8'))
          pref = json.loads((root / 'prefectures.json').read_text(encoding='utf-8'))

          assert reg['meta']['record_count'] == len(reg['records']) == 54180
          assert reg['meta']['authority_count'] == 47
          assert reg['meta']['register_count'] == 48
          assert pref['meta']['authority_count'] == 106
          assert pref['meta']['published_count'] == 47
          assert pref['meta']['mapped_count'] == 47

          milano_pref = [x for x in pref['prefectures'] if x.get('authority_key') == 'milano']
          assert len(milano_pref) == 1
          assert milano_pref[0]['mapped'] and milano_pref[0]['published']
          assert milano_pref[0]['series_count'] == 1

          records = [r for r in reg['records'] if r['authority_key'] == 'milano']
          assert len(records) == 2614
          assert len({r['record_locator'] for r in records}) == 2614
          assert {r['source_key'] for r in records} == {'milano-combined'}
          assert Counter(r['source_status'] for r in records) == Counter({
              'listed': 940,
              'renewal_update_in_progress': 516,
              'pending': 1158,
          })
          assert sum(bool(r['identifiers']) for r in records) == 2614
          assert all(r['requested_activities'] for r in records)
          assert sum(bool(r['application_date']) for r in records) == 1158
          assert sum(bool(r['observed_listing_date']) for r in records) == 940
          assert sum(bool(r['observed_expiry_date']) for r in records) == 940
          assert max(r['application_date'] for r in records if r['application_date']) == '2026-09-15'

          noted = [r for r in records if r['source_fields']['notes']]
          assert len(noted) == 1
          assert noted[0]['name'] == 'COMOTER SRL'
          assert noted[0]['source_fields']['notes'] == [
              'Misura di prevenzione collaborativa ex art. 94 bis D.lgs.159/2011 in data 18/04/2024, per la durata di un anno'
          ]
          assert all(len(r['source_fields']['sections']) == len(r['source_fields']['physical_locators']) for r in records)
          assert all(
              r['source_fields']['application_date_raw_variants']
              if r['source_status'] == 'pending'
              else not r['source_fields']['application_date_raw_variants']
              for r in records
          )
          assert all(
              r['source_fields']['listing_date_raw_variants'] and r['source_fields']['expiry_date_raw_variants']
              if r['source_status'] == 'listed'
              else not r['source_fields']['listing_date_raw_variants'] and not r['source_fields']['expiry_date_raw_variants']
              for r in records
          )
          assert all(
              r['source_fields']['in_aggiornamento'] == 'IN AGGIORNAMENTO'
              if r['source_status'] == 'renewal_update_in_progress'
              else r['source_fields']['in_aggiornamento'] == ''
              for r in records
          )

          coverage = build_coverage(
              _read_csv(Path('data/source_registry/verified_primary_pages.csv')),
              _read_csv(Path('data/source_registry/source_series_inventory.csv')),
          )
          assert coverage['verified_authority_count'] == 47
          assert coverage['register_scope_count'] == 48
          assert coverage['complete_register_scope_count'] == 48
          assert coverage['incomplete_register_scope_count'] == 0
          unresolved = {
              row['authority_key'] for row in coverage['scopes']
              if not row['source_population_complete']
          }
          assert unresolved == set()
          print({
              'record_count': reg['meta']['record_count'],
              'authority_count': reg['meta']['authority_count'],
              'register_count': reg['meta']['register_count'],
              'published_count': pref['meta']['published_count'],
              'mapped_count': pref['meta']['mapped_count'],
              'milano_records': len(records),
              'complete_register_scopes': coverage['complete_register_scope_count'],
          })
          PY

      - name: Recheck exact production transaction
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > /tmp/actual-files-final.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files-final.txt

      - name: Commit validated production integration
        shell: bash
        env:
          BRANCH: expansion/milano-2026-09-16
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Remote branch advanced during candidate transaction: $remote_sha != $GITHUB_SHA" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            data/source_registry/verified_primary_pages.csv \
            src/white_list_archive/publishing/public_national_registry.py \
            tests/test_source_population_coverage.py
          git commit -m 'feat(milano): integrate combined White List coverage'
          git push origin "HEAD:$BRANCH"
