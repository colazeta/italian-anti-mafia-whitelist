name: Catanzaro production finalizer (temporary)

on:
  push:
    branches:
      - expansion/catanzaro-2026-09-15
    paths:
      - .github/workflows/catanzaro-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catanzaro-production-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize reviewed production outputs
        run: |
          set -euo pipefail
          python tmp/catanzaro_finalize.py
          git diff --check -- .github/workflows/public-pages.yml tests/public_portal_browser.cjs
          node --check tests/public_portal_browser.cjs
          cp .github/workflows/public-pages.yml tmp/catanzaro-public-pages.generated.yml
          cp tests/public_portal_browser.cjs tmp/catanzaro-public-portal-browser.generated.cjs
          git restore .github/workflows/public-pages.yml tests/public_portal_browser.cjs
          git add tmp/catanzaro-public-pages.generated.yml tmp/catanzaro-public-portal-browser.generated.cjs
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
      - name: Commit generated outputs only
        env:
          BRANCH: expansion/catanzaro-2026-09-15
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(catanzaro): materialize reviewed public gate outputs'
          git push origin "HEAD:$BRANCH"
