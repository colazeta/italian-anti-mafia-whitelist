name: Catanzaro production finalizer (temporary)

on:
  push:
    branches:
      - expansion/catanzaro-2026-09-15
    paths:
      - .github/workflows/catanzaro-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catanzaro-production-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build production-only final diff
        run: |
          set -euo pipefail
          python tmp/catanzaro_finalize.py
          git rm \
            .github/workflows/catanzaro-source-validation.yml \
            .github/workflows/catanzaro-national-candidate.yml \
            .github/workflows/catanzaro-finalize.yml \
            tmp/catanzaro_integrate_candidate.py \
            tmp/catanzaro_finalize.py
          git diff --check
          node --check tests/public_portal_browser.cjs
          git diff --name-only | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/catanzaro-finalize.yml
          .github/workflows/catanzaro-national-candidate.yml
          .github/workflows/catanzaro-source-validation.yml
          .github/workflows/public-pages.yml
          tests/public_portal_browser.cjs
          tmp/catanzaro_finalize.py
          tmp/catanzaro_integrate_candidate.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
      - name: Commit validated finalization
        env:
          BRANCH: expansion/catanzaro-2026-09-15
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci(catanzaro): promote permanent public gates'
          git push origin "HEAD:$BRANCH"
