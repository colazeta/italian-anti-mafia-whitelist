name: Cuneo integration finalizer 2026-09-19

on:
  push:
    branches:
      - expansion/cuneo-2026-09-19
    paths:
      - .github/workflows/cuneo-integration-finalizer-2026-09-19.yml

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/cuneo-2026-09-19
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify branch is based on current main and parser-only before permanent integration
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "daa7c0efd9c91e15b39272f93f3e6260178cea6f"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          test "$changed" = "src/white_list_archive/parsers/cuneo_positioned.py"

      - name: Materialise permanent Cuneo integration
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          from pathlib import Path

          ROOT = Path('.')
          LANDING = 'https://prefettura.interno.gov.it/it/prefetture/cuneo/elenco-iscritti-white-liste-e-elenco-richiedenti-white-list'
          LISTED_URL = 'https://prefettura.interno.gov.it/sites/default/files/39/2026-09/elenco-iscritti-white-list_0.pdf'
          APPLICANTS_URL = 'https://prefettura.interno.gov.it/sites/default/files/39/2026-09/elenco-richiedenti-iscrizione_0.pdf'
          LISTED_SHA = '3556b033acea0b035ad8f955973affa97637260c4abe233d53518e5c7a32a2f7'
          APPLICANTS_SHA = '25ee4f5fff0b0f6580396c27f3e73abfdcfa994bfe673e7a86ca33377e784cea'

          def load_json(path):
              return json.loads(Path(path).read_text())

          def dump_json(path, obj):
              Path(path).write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n')

          # Publication source configuration: two explicit positive-evidence populations.
          pilot_path = Path('data/publication/multi_prefecture_pilot.json')
          pilot = load_json(pilot_path)
          sources = pilot['sources']
          if any(s.get('authority_key') == 'cuneo' for s in sources):
              raise SystemExit('Cuneo already present in publication source config')
          common = {
              'authority_key': 'cuneo',
              'authority_name': 'Prefettura di Cuneo',
              'register_key': 'cuneo-ordinary',
              'register_name': 'White List ordinaria',
              'source_page_url': LANDING,
              'reference_date': '2026-09-15',
              'last_source_update': '2026-09-15',
              'last_source_update_basis': 'embedded official document marker “martedì 15 settembre 2026”; both current official resources independently repeat-fetched and byte-pinned 19 September 2026',
              'approval_mode': 'raw_sha256',
          }
          sources.extend([
              {
                  **common,
                  'source_key': 'cuneo-listed',
                  'parser': 'cuneo_listed',
                  'population_scope': 'listed',
                  'resource_url': LISTED_URL,
                  'sha256': LISTED_SHA,
                  'expected_source_rows': 468,
                  'expected_sector_rows': 1063,
                  'notes': 'Byte-pinned 137-page official listed-company PDF. Fail-closed parser yields 468 observations: 402 listed and 66 renewal/update in progress; 457 have structured identifiers. Eleven malformed numeric identifiers remain raw-only; two reviewed office/identifier column spillovers are bound explicitly; conflicting BAUDINO listing dates remain unnormalised.',
              },
              {
                  **common,
                  'source_key': 'cuneo-applicants',
                  'parser': 'cuneo_applicants',
                  'population_scope': 'applicant',
                  'resource_url': APPLICANTS_URL,
                  'sha256': APPLICANTS_SHA,
                  'expected_source_rows': 48,
                  'expected_sector_rows': 93,
                  'notes': 'Byte-pinned 13-page official applicant PDF whose title explicitly states ELENCO DELLE DITTE RICHIEDENTI L’ISCRIZIONE NELLA WHITE LIST. Fail-closed parser yields 48 pending observations, all with structured identifiers.',
              },
          ])
          dump_json(pilot_path, pilot)

          # National coverage ledger.
          coverage_path = Path('data/monitoring/national_coverage.json')
          coverage = load_json(coverage_path)
          rows = [r for r in coverage['prefectures'] if r['authority_key'] == 'cuneo']
          if len(rows) != 1:
              raise SystemExit(f'Expected one Cuneo coverage row, got {len(rows)}')
          row = rows[0]
          row.update({
              'official_landing_page': LANDING,
              'source_verified': True,
              'current_edition_identified': True,
              'capture_implemented': True,
              'parser_implemented': True,
              'parser_validated': True,
              'company_observations_loaded': True,
              'observation_layer': 'public_source_observations',
              'canonical_integration_validated': False,
              'public_export_enabled': True,
              'durable_evidence_verified': False,
              'population_scopes_complete': True,
              'latest_source_reference_date': '2026-09-15',
              'last_successful_source_check_at': '2026-09-19T01:10:37Z',
              'last_attempted_source_check_at': '2026-09-19T01:10:37Z',
              'last_content_change_at': None,
              'last_successful_investigation_on': '2026-09-19',
              'monitoring_status': 'CURRENT',
              'unresolved_issue': [
                  'Canonical hosted-database integration and independent durable-evidence verification remain governed under #16; public source observations are validated independently of that infrastructure.'
              ],
              'actionable_issue': False,
              'coverage_status': 'VALIDATED',
              'terminal_reason': None,
              'completion_evidence': [
                  'docs/sources/cuneo-operational-check-2026-09-19.md',
                  'src/white_list_archive/parsers/cuneo_positioned.py',
                  'tests/test_cuneo_parser_semantics.py',
                  'data/publication/multi_prefecture_pilot.json',
              ],
              'known_content_sha256': [LISTED_SHA, APPLICANTS_SHA],
              'evidence': [
                  'data/source_registry/verified_primary_pages.csv',
                  'data/source_registry/source_series_inventory.csv',
                  'data/publication/multi_prefecture_pilot.json',
                  'docs/sources/cuneo-operational-check-2026-09-19.md',
              ],
              'last_completed_coverage_stage': 'VALIDATED',
          })
          dump_json(coverage_path, coverage)

          # Source registry CSVs.
          def read_csv(path):
              with Path(path).open(newline='', encoding='utf-8') as fh:
                  reader = csv.DictReader(fh)
                  return reader.fieldnames, list(reader)

          def write_csv(path, fields, rows):
              buf = io.StringIO(newline='')
              writer = csv.DictWriter(buf, fieldnames=fields, lineterminator='\n')
              writer.writeheader(); writer.writerows(rows)
              Path(path).write_text(buf.getvalue(), encoding='utf-8')

          pages_path = 'data/source_registry/verified_primary_pages.csv'
          fields, pages = read_csv(pages_path)
          if any(r['authority_key'] == 'cuneo' for r in pages):
              raise SystemExit('Cuneo already present in verified primary pages')
          pages.append({
              'authority_key': 'cuneo',
              'primary_page': LANDING,
              'verified_date': '2026-09-19',
              'verification_status': 'verified',
          })
          pages.sort(key=lambda r: r['authority_key'])
          write_csv(pages_path, fields, pages)

          series_path = 'data/source_registry/source_series_inventory.csv'
          fields, series = read_csv(series_path)
          if any(r['authority_key'] == 'cuneo' for r in series):
              raise SystemExit('Cuneo already present in source series inventory')
          series.extend([
              {
                  'source_series_key': 'cuneo-applicants',
                  'authority_key': 'cuneo',
                  'regime_code': 'WL-REGIME-L190-2012',
                  'population_scope': 'applicant',
                  'sector_scope': 'all',
                  'publication_model': 'periodic_attachment',
                  'series_url': LANDING,
                  'resource_resolution_status': 'landing_page_resolved',
                  'verified_date': '2026-09-19',
                  'notes': 'Current official applicant PDF independently repeat-fetched and byte-pinned 19 September 2026; the embedded title positively identifies the applicant population and the document is dated 15 September 2026. Exact boundary is documented in docs/sources/cuneo-operational-check-2026-09-19.md.',
              },
              {
                  'source_series_key': 'cuneo-listed',
                  'authority_key': 'cuneo',
                  'regime_code': 'WL-REGIME-L190-2012',
                  'population_scope': 'listed',
                  'sector_scope': 'all',
                  'publication_model': 'periodic_attachment',
                  'series_url': LANDING,
                  'resource_resolution_status': 'landing_page_resolved',
                  'verified_date': '2026-09-19',
                  'notes': 'Current official listed-company PDF independently repeat-fetched and byte-pinned 19 September 2026; the document is dated 15 September 2026. Exact status, identifier and layout anomaly handling is documented in docs/sources/cuneo-operational-check-2026-09-19.md.',
              },
          ])
          series.sort(key=lambda r: r['source_series_key'])
          write_csv(series_path, fields, series)

          # Dataset catalogue denominators.
          catalog_path = Path('data/catalog.csv')
          text = catalog_path.read_text()
          replacements = {
              'verified-primary-page,56,false': 'verified-primary-page,57,false',
              'source_series,110,false': 'source_series,112,false',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'catalog replacement count for {old!r}: {text.count(old)}')
              text = text.replace(old, new, 1)
          catalog_path.write_text(text)

          # Public builder parser registration.
          builder_path = Path('src/white_list_archive/publishing/public_national_registry.py')
          text = builder_path.read_text()
          old = 'from white_list_archive.parsers.cremona_combined import PARSERS as CREMONA_PARSERS\n'
          new = old + 'from white_list_archive.parsers.cuneo_positioned import PARSERS as CUNEO_PARSERS\n'
          if text.count(old) != 1 or 'CUNEO_PARSERS' in text:
              raise SystemExit('unexpected Cuneo builder import state')
          text = text.replace(old, new, 1)
          old = '        or CREMONA_PARSERS.get(cfg["parser"])\n'
          new = old + '        or CUNEO_PARSERS.get(cfg["parser"])\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected Cuneo builder dispatch state')
          builder_path.write_text(text.replace(old, new, 1))

          # Source-registry/count regression tests.
          path = Path('tests/test_source_registry.py')
          text = path.read_text()
          if text.count('assert len(pages) == 56') != 1:
              raise SystemExit('source registry page denominator target drift')
          path.write_text(text.replace('assert len(pages) == 56', 'assert len(pages) == 57', 1))

          path = Path('tests/test_source_population_coverage.py')
          text = path.read_text()
          for old, new in [
              ('assert report["verified_authority_count"] == 56', 'assert report["verified_authority_count"] == 57'),
              ('assert report["register_scope_count"] == 58', 'assert report["register_scope_count"] == 59'),
              ('assert report["complete_register_scope_count"] == 58', 'assert report["complete_register_scope_count"] == 59'),
              ('for authority in ("bari", "udine", "crotone"):', 'for authority in ("bari", "udine", "crotone", "cuneo"):')
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'population coverage target drift: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          # Safety regression fixture must remain genuinely source-identified.
          path = Path('tests/test_operations.py')
          text = path.read_text()
          old = '    authority_key = "cuneo"\n'
          new = '    authority_key = "enna"\n'
          if text.count(old) != 1:
              raise SystemExit('operations source-identified fixture drift')
          path.write_text(text.replace(old, new, 1))

          # Browser-level permanent checks.
          path = Path('tests/public_portal_browser.cjs')
          text = path.read_text()
          marker = "      assert.ok(labels.includes('White List ordinaria · Prefettura di Cremona'));\n"
          if text.count(marker) != 1:
              raise SystemExit('browser label insertion point drift')
          text = text.replace(marker, marker + "      assert.ok(labels.includes('White List ordinaria · Prefettura di Cuneo'));\n", 1)
          if text.count('assert.equal(stats.total,63409);') != 1:
              raise SystemExit('browser total boundary drift')
          text = text.replace('assert.equal(stats.total,63409);', 'assert.equal(stats.total,63925);', 1)
          needle = "'chieti','cremona'].includes(r.authority_key)"
          if text.count(needle) != 1:
              raise SystemExit('browser expansion exclusion boundary drift')
          text = text.replace(needle, "'chieti','cremona','cuneo'].includes(r.authority_key)", 1)
          marker = "      assert.equal(cremona.flatMap(r=>r.identifiers).length,203);\n"
          block = """      const cuneo=registry.records.filter(r=>r.authority_key==='cuneo');
      assert.equal(cuneo.length,516);
      assert.equal(cuneo.filter(r=>r.source_key==='cuneo-listed').length,468);
      assert.equal(cuneo.filter(r=>r.source_key==='cuneo-applicants').length,48);
      assert.deepEqual(statusCounts(cuneo),{listed:402,pending:48,renewal_update_in_progress:66});
      assert.equal(new Set(cuneo.map(r=>r.record_locator)).size,516);
      assert.equal(cuneo.filter(r=>r.identifiers.length>0).length,505);
"""
          if text.count(marker) != 1:
              raise SystemExit('browser Cuneo assertion insertion point drift')
          path.write_text(text.replace(marker, marker + block, 1))

          # Permanent parser semantics test.
          Path('tests/test_cuneo_parser_semantics.py').write_text('''import pytest\n\nfrom white_list_archive.parsers.cuneo_positioned import (\n    _EXPECTED_APPLICANT_PAGE_ROWS,\n    _EXPECTED_DUPLICATE_STRICT_IDENTIFIERS,\n    _EXPECTED_MALFORMED_IDENTIFIERS,\n    _listed_status,\n    _source_date,\n)\n\n\ndef test_cuneo_status_mapping_is_source_explicit():\n    assert _listed_status("Iscritta") == "listed"\n    assert _listed_status("iscritta") == "listed"\n    assert _listed_status("Iscritto") == "listed"\n    assert _listed_status("Aggiornamento in corso") == "renewal_update_in_progress"\n    assert _listed_status("Aggiornamnto in corso") == "renewal_update_in_progress"\n    with pytest.raises(RuntimeError):\n        _listed_status("status non revisionato")\n\n\ndef test_cuneo_dates_are_normalised_only_when_source_parseable():\n    assert _source_date("09-07-2026") == "2026-07-09"\n    assert _source_date("07/01/2025") == "2025-01-07"\n    assert _source_date("") == ""\n\n\ndef test_cuneo_reviewed_identifier_and_page_boundaries_are_frozen():\n    assert len(_EXPECTED_MALFORMED_IDENTIFIERS) == 11\n    assert _EXPECTED_MALFORMED_IDENTIFIERS[12] == "0288370045"\n    assert _EXPECTED_DUPLICATE_STRICT_IDENTIFIERS == {"03491860049": 2, "02712230040": 2}\n    assert sum(_EXPECTED_APPLICANT_PAGE_ROWS) == 48\n''')

          # Permanent source evidence note.
          Path('docs/sources/cuneo-operational-check-2026-09-19.md').write_text('''# Cuneo White List operational check — 19 September 2026\n\n## Official current source\n\nThe official Prefettura di Cuneo White List landing page is:\n\n- https://prefettura.interno.gov.it/it/prefetture/cuneo/elenco-iscritti-white-liste-e-elenco-richiedenti-white-list\n\nIt exposes two separate current official PDF series, both carrying the embedded marker **martedì 15 settembre 2026**. The applicant document positively identifies its population in the title as **ELENCO DELLE DITTE RICHIEDENTI L'ISCRIZIONE NELLA WHITE LIST**; applicant coverage is therefore not inferred from search failure or absence.\n\n## Content-addressed captures\n\nTwo independent cache-bypassed GETs of each official resource were byte-identical during validation on 19 September 2026:\n\n- listed companies: 653,517 bytes; SHA-256 `3556b033acea0b035ad8f955973affa97637260c4abe233d53518e5c7a32a2f7`;\n- applicants: 239,448 bytes; SHA-256 `25ee4f5fff0b0f6580396c27f3e73abfdcfa994bfe673e7a86ca33377e784cea`.\n\nThe publication configuration is fail-closed on those hashes.\n\n## Reviewed parser boundary\n\nThe positioned parser freezes the physical structure and produces **516 observations** with **516 unique record locators** and **505 observations with structured identifiers**:\n\n- listed source: 468 observations / 1,063 sector rows / 457 structured identifiers; 402 `listed` and 66 `renewal_update_in_progress`;\n- applicant source: 48 observations / 93 sector rows / 48 structured identifiers; all 48 `pending`.\n\nEleven malformed numeric identifier tokens in the listed source are preserved raw-only. Two reviewed source-layout spillovers are explicit parser invariants: record 113 (`CARRERO TRASPORTI S.r.l.`) carries office suffix `d'Alba` into the identifier band before identifier `02764820045`, and record 394 (`SACED S.r.l.`) carries office suffix `Cuneo` before identifier `00934480047`. These tokens are reassigned only because the terminal token is an exact 10–12 digit identifier and the observed spillover set is frozen; any additional spillover fails closed.\n\nFor `BAUDINO TRASPORTI S.r.l.` the source contains conflicting listing-date variants `07/01/2025` and `07/01/2015`. The canonical observation deliberately leaves `observed_listing_date` blank and retains both raw variants rather than repairing the conflict.\n\n## Publication decision\n\nBoth logical populations are positively accounted for by separate official series and the current editions are byte-pinned and parser-validated. This supports publication of the 516 source observations while leaving hosted-database integration and durable-evidence verification under their separate governance controls.\n''')
          PY

          git diff --check

      - name: Install publication runtime
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils antiword
          python -m pip install -e '.[publication]'

      - name: Run targeted regression tests
        run: |
          pytest -q \
            tests/test_cuneo_parser_semantics.py \
            tests/test_source_registry.py \
            tests/test_source_population_coverage.py \
            tests/test_operations.py

      - name: Build and validate full national candidate
        run: |
          rm -rf /tmp/public-national-sources /tmp/cuneo-public-site
          cp -a public-site /tmp/cuneo-public-site
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/public-national-sources \
            --registry-json /tmp/cuneo-public-site/data/registry.json \
            --registry-csv /tmp/cuneo-public-site/data/registry.csv \
            --prefectures-json /tmp/cuneo-public-site/data/prefectures.json \
            --prefectures-csv /tmp/cuneo-public-site/data/prefectures.csv
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          root = Path('/tmp/cuneo-public-site/data')
          reg = json.loads((root/'registry.json').read_text())
          pref = json.loads((root/'prefectures.json').read_text())
          assert reg['meta']['record_count'] == 63925, reg['meta']
          assert reg['meta']['authority_count'] == 57, reg['meta']
          assert reg['meta']['register_count'] == 59, reg['meta']
          assert pref['meta']['published_count'] == 57, pref['meta']
          assert pref['meta']['mapped_count'] == 57, pref['meta']
          rows = [r for r in reg['records'] if r['authority_key'] == 'cuneo']
          assert len(rows) == 516
          assert len({r['record_locator'] for r in rows}) == 516
          assert sum(bool(r['identifiers']) for r in rows) == 505
          assert Counter(r['source_status'] for r in rows) == Counter({'listed': 402, 'renewal_update_in_progress': 66, 'pending': 48})
          assert sum(r['source_key'] == 'cuneo-listed' for r in rows) == 468
          assert sum(r['source_key'] == 'cuneo-applicants' for r in rows) == 48
          print('candidate meta', reg['meta'])
          print('Cuneo boundary', Counter(r['source_status'] for r in rows))
          PY

      - name: Commit permanent integration only
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/catalog.csv \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            data/source_registry/verified_primary_pages.csv \
            docs/sources/cuneo-operational-check-2026-09-19.md \
            src/white_list_archive/publishing/public_national_registry.py \
            tests/public_portal_browser.cjs \
            tests/test_cuneo_parser_semantics.py \
            tests/test_operations.py \
            tests/test_source_population_coverage.py \
            tests/test_source_registry.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "Integrate Cuneo White List sources"
          git push origin HEAD:expansion/cuneo-2026-09-19
