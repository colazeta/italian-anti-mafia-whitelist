name: Public retro portal

on:
  push:
    branches:
      - main
    paths:
      - 'public-site/**'
      - 'data/publication/multi_prefecture_pilot.json'
      - 'data/source_registry/verified_primary_pages.csv'
      - 'data/source_registry/source_series_inventory.csv'
      - 'data/source_registry/national_index_authority_aliases.csv'
      - 'src/white_list_archive/acquisition/national_index.py'
      - 'src/white_list_archive/publishing/public_national_registry.py'
      - 'src/white_list_archive/publishing/public_national_build.py'
      - 'src/white_list_archive/publishing/public_contract.py'
      - 'src/white_list_archive/publishing/public_artifact.py'
      - 'src/white_list_archive/parsers/multi_prefecture_tables.py'
      - 'src/white_list_archive/parsers/cosenza_combined_v2.py'
      - 'src/white_list_archive/parsers/arezzo_openxml.py'
      - 'src/white_list_archive/parsers/avellino_positioned.py'
      - 'src/white_list_archive/parsers/pesaro_urbino_combined.py'
      - 'src/white_list_archive/parsers/biella_html.py'
      - 'src/white_list_archive/parsers/benevento_positioned.py'
      - 'src/white_list_archive/parsers/asti_positioned.py'
      - 'src/white_list_archive/parsers/agrigento_positioned.py'
      - 'src/white_list_archive/parsers/belluno_combined.py'
      - 'src/white_list_archive/parsers/ascoli_piceno_labels.py'
      - 'src/white_list_archive/parsers/ancona_combined.py'
      - 'src/white_list_archive/parsers/bari_tables.py'
      - 'src/white_list_archive/parsers/udine_positioned.py'
      - 'src/white_list_archive/parsers/bergamo_positioned.py'
      - 'src/white_list_archive/parsers/barletta_andria_trani_tables.py'
      - 'src/white_list_archive/parsers/brindisi_tables.py'
      - 'src/white_list_archive/parsers/cagliari_tables.py'
      - 'src/white_list_archive/parsers/caltanissetta_tables.py'
      - 'src/white_list_archive/parsers/crotone_tables.py'
      - 'src/white_list_archive/parsers/campobasso_openxml.py'
      - 'src/white_list_archive/parsers/brescia_openxml.py'
      - 'src/white_list_archive/parsers/bolzano_docx.py'
      - 'src/white_list_archive/parsers/caserta_tables.py'
      - 'src/white_list_archive/parsers/catania_openxml.py'
      - 'pyproject.toml'
      - '.github/workflows/public-pages.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare runner package sources
        run: |
          # GitHub-hosted images can declare Chrome through either a classic .list
          # file or a deb822 .sources file. The portal does not depend on that
          # repository, so remove only files that actually reference it. Keep this
          # cleanup before both our package install and Playwright's later apt work.
          while IFS= read -r source_file; do
            [ -n "$source_file" ] && sudo rm -f "$source_file"
          done < <(grep -rlE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '\|dl\.google\.com/linux/chrome|d;\|packages\.google\.com/chrome|d' /etc/apt/sources.list
          fi
          if grep -RqsE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null; then
            echo "Chrome APT source remained after targeted cleanup" >&2
            grep -RHnE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true
            exit 1
          fi
      - name: Install publication runtime
        run: |
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && \
               sudo apt-get install -y --no-install-recommends poppler-utils; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Publication runtime package installation failed after bounded retries" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[publication]'
      - name: Build approved multi-Prefecture registry
        run: |
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/public-national-sources \
            --registry-json public-site/data/registry.json \
            --registry-csv public-site/data/registry.csv \
            --prefectures-json public-site/data/prefectures.json \
            --prefectures-csv public-site/data/prefectures.csv
      - name: Validate public artifact and national registry
        id: validate_public
        run: |
          test -f public-site/index.html
          test -f public-site/data/site.json
          test -f public-site/data/registry.json
          test -f public-site/data/registry.csv
          test -f public-site/data/prefectures.json
          test -f public-site/data/prefectures.csv
          node --check public-site/app.js
          node --check public-site/summary.js
          python -m white_list_archive.publishing.public_artifact public-site
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('public-site')
          site = json.loads((root/'data/site.json').read_text(encoding='utf-8'))
          reg = json.loads((root/'data/registry.json').read_text(encoding='utf-8'))
          pref = json.loads((root/'data/prefectures.json').read_text(encoding='utf-8'))

          assert site['meta']['classification'] == 'PUBLIC EXPERIMENTAL VIEW'
          assert site['meta']['public_contract_version'] == 3
          assert reg['meta']['contract_version'] == 3
          assert reg['meta']['record_count'] == 28838
          assert set(reg['meta']['authority_counts']) == {'cosenza','parma','pistoia','bologna','alessandria','aosta','arezzo','avellino','pesaro-e-urbino','biella','benevento','asti','agrigento','belluno','ascoli-piceno','ancona','bari','udine','bergamo','barletta-andria-trani','brindisi','cagliari','caltanissetta','crotone','campobasso','brescia','bolzano-bozen','caserta','catania'}
          assert set(reg['meta']['register_counts']) == {
              'cosenza-ordinary','parma-ordinary','pistoia-ordinary',
              'bologna-provincial','bologna-post-sisma','alessandria-ordinary','aosta-ordinary','arezzo-ordinary','avellino-ordinary','pesaro-urbino-ordinary','biella-ordinary','benevento-ordinary','asti-ordinary','agrigento-ordinary','belluno-ordinary','ascoli-piceno-ordinary','ancona-ordinary','bari-ordinary','udine-ordinary','bergamo-ordinary','barletta-andria-trani-ordinary','brindisi-ordinary','cagliari-ordinary','caltanissetta-ordinary','crotone-ordinary','campobasso-ordinary','brescia-ordinary','bolzano-bozen-ordinary','caserta-ordinary','catania-ordinary'
          }
          assert reg['meta']['authority_count'] == 29
          assert reg['meta']['register_count'] == 30
          assert reg['meta']['record_count'] == len(reg['records'])
          assert pref['meta']['authority_count'] == 106
          assert pref['meta']['published_count'] == 29
          assert pref['meta']['mapped_count'] == 39
          bolzano = [x for x in pref['prefectures'] if x['jurisdiction_name'] == 'Bolzano']
          assert len(bolzano) == 1 and bolzano[0]['mapped'] and bolzano[0]['published'] and bolzano[0]['series_count'] > 0
          caserta = [x for x in pref['prefectures'] if x['authority_key'] == 'caserta']
          assert len(caserta) == 1 and caserta[0]['mapped'] and caserta[0]['published'] and caserta[0]['series_count'] > 0
          catania = [x for x in pref['prefectures'] if x['authority_key'] == 'catania']
          assert len(catania) == 1 and catania[0]['mapped'] and catania[0]['published'] and catania[0]['series_count'] == 2
          alessandria = [x for x in pref['prefectures'] if x['jurisdiction_name'] == 'Alessandria']
          assert len(alessandria) == 1 and alessandria[0]['mapped'] and alessandria[0]['published']
          aosta = [x for x in pref['prefectures'] if x['jurisdiction_name'] == 'Aosta']
          assert len(aosta) == 1 and aosta[0]['mapped'] and aosta[0]['published']
          arezzo = [x for x in pref['prefectures'] if x['jurisdiction_name'] == 'Arezzo']
          assert len(arezzo) == 1 and arezzo[0]['mapped'] and arezzo[0]['published']
          avellino = [x for x in pref['prefectures'] if x['jurisdiction_name'] == 'Avellino']
          assert len(avellino) == 1 and avellino[0]['mapped'] and avellino[0]['published']
          pesaro = [x for x in pref['prefectures'] if x['authority_key'] == 'pesaro-e-urbino']
          assert len(pesaro) == 1 and pesaro[0]['mapped'] and pesaro[0]['published']
          biella = [x for x in pref['prefectures'] if x['authority_key'] == 'biella']
          assert len(biella) == 1 and biella[0]['mapped'] and biella[0]['published']
          benevento = [x for x in pref['prefectures'] if x['authority_key'] == 'benevento']
          assert len(benevento) == 1 and benevento[0]['mapped'] and benevento[0]['published']
          asti = [x for x in pref['prefectures'] if x['authority_key'] == 'asti']
          assert len(asti) == 1 and asti[0]['mapped'] and asti[0]['published']
          agrigento = [x for x in pref['prefectures'] if x['authority_key'] == 'agrigento']
          assert len(agrigento) == 1 and agrigento[0]['mapped'] and agrigento[0]['published']
          belluno = [x for x in pref['prefectures'] if x['authority_key'] == 'belluno']
          assert len(belluno) == 1 and belluno[0]['mapped'] and belluno[0]['published']
          ascoli = [x for x in pref['prefectures'] if x['authority_key'] == 'ascoli-piceno']
          assert len(ascoli) == 1 and ascoli[0]['mapped'] and ascoli[0]['published']
          ancona = [x for x in pref['prefectures'] if x['authority_key'] == 'ancona']
          assert len(ancona) == 1 and ancona[0]['mapped'] and ancona[0]['published']
          bari = [x for x in pref['prefectures'] if x['authority_key'] == 'bari']
          assert len(bari) == 1 and bari[0]['mapped'] and bari[0]['published']
          udine = [x for x in pref['prefectures'] if x['authority_key'] == 'udine']
          assert len(udine) == 1 and udine[0]['mapped'] and udine[0]['published']
          bergamo = [x for x in pref['prefectures'] if x['authority_key'] == 'bergamo']
          assert len(bergamo) == 1 and bergamo[0]['mapped'] and bergamo[0]['published']
          barletta = [x for x in pref['prefectures'] if x['authority_key'] == 'barletta-andria-trani']
          assert len(barletta) == 1 and barletta[0]['mapped'] and barletta[0]['published']
          brindisi = [x for x in pref['prefectures'] if x['authority_key'] == 'brindisi']
          assert len(brindisi) == 1 and brindisi[0]['mapped'] and brindisi[0]['published']
          cagliari = [x for x in pref['prefectures'] if x['authority_key'] == 'cagliari']
          assert len(cagliari) == 1 and cagliari[0]['mapped'] and cagliari[0]['published']
          caltanissetta = [x for x in pref['prefectures'] if x['authority_key'] == 'caltanissetta']
          assert len(caltanissetta) == 1 and caltanissetta[0]['mapped'] and caltanissetta[0]['published']
          crotone = [x for x in pref['prefectures'] if x['authority_key'] == 'crotone']
          assert len(crotone) == 1 and crotone[0]['mapped'] and crotone[0]['published']
          campobasso = [x for x in pref['prefectures'] if x['authority_key'] == 'campobasso']
          assert len(campobasso) == 1 and campobasso[0]['mapped'] and campobasso[0]['published']
          brescia = [x for x in pref['prefectures'] if x['authority_key'] == 'brescia']
          assert len(brescia) == 1 and brescia[0]['mapped'] and brescia[0]['published']
          assert all(r.get('record_locator') for r in reg['records'])
          assert any(r.get('identifiers') or r.get('identifier_field_raw') for r in reg['records'])
          assert site['publication']['geography_policy']

          for source in reg['meta']['sources']:
              assert source['document_checked_at']
              assert 'diagnostics' not in source
              diagnostic = json.loads(Path('/tmp/public-national-sources', source['source_key'] + '.diagnostics.json').read_text())
              assert diagnostic['public_records'] > 0
              assert diagnostic.get('dropped_date_rows', 0) == 0

          forbidden_tokens = ('legal_entity_id','address_id','review_notes','reviewed_at','source_occurrences')
          reg_text = (root/'data/registry.json').read_text(encoding='utf-8').casefold()
          for token in forbidden_tokens:
              assert token not in reg_text, token
          names = [str(p) for p in root.rglob('*') if p.is_file()]
          forbidden_files = ['address-review-2026-09-07.csv','table_catalog.json','source_evidence.json','data-explorer-preview-v2']
          for token in forbidden_files:
              if any(token in name for name in names):
                  raise SystemExit(f'Forbidden artifact in public site: {token}')
          print('Public national registry validated:', reg['meta']['record_count'], 'records; Prefectures:', pref['meta'])
          PY
      - name: Install browser acceptance test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test public registry at desktop and mobile widths
        run: |
          python -m http.server 8765 --directory public-site > /tmp/public-preview-server.log 2>&1 &
          node tests/public_portal_browser.cjs
      - name: Save rendered acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-rendered-evidence-attempt-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
      - name: Verify official-source links
        if: ${{ !cancelled() && steps.validate_public.outcome == 'success' }}
        run: python -m white_list_archive.publishing.public_links public-site /tmp/public-link-audit.json
      - name: Save link verification report
        if: ${{ !cancelled() && steps.validate_public.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-link-audit-attempt-${{ github.run_attempt }}
          path: /tmp/public-link-audit.json
          retention-days: 14
      - name: Save reviewable public build
        if: ${{ !cancelled() && steps.validate_public.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-portal-review-attempt-${{ github.run_attempt }}
          path: public-site/
          retention-days: 14
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
