name: Public retro portal

on:
  push:
    branches: [main]
    paths:
      - 'public-site/**'
      - 'data/publication/public_snapshot.json'
      - 'src/white_list_archive/publishing/public_snapshot.py'
      - 'src/white_list_archive/publishing/public_artifact.py'
      - 'tests/public_snapshot_browser.cjs'
      - '.github/workflows/public-pages.yml'
  pull_request:
    paths:
      - 'public-site/**'
      - 'data/publication/public_snapshot.json'
      - 'src/white_list_archive/publishing/public_snapshot.py'
      - 'src/white_list_archive/publishing/public_artifact.py'
      - 'tests/public_snapshot_browser.cjs'
      - '.github/workflows/public-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validator
        run: python -m pip install -e '.[publication]' pytest
      - name: Restore reviewed public data
        run: python -m white_list_archive.publishing.public_snapshot restore --manifest data/publication/public_snapshot.json
      - name: Validate complete publication
        run: |
          node --check public-site/app.js
          node --check public-site/electoral.js
          python -m white_list_archive.publishing.public_artifact public-site
          python -m pytest -q tests/test_electoral_public.py tests/test_public_snapshot.py
      - name: Install browser acceptance runtime
        run: |
          while IFS= read -r source_file; do
            [ -n "$source_file" ] && sudo rm -f "$source_file"
          done < <(grep -rlE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test actual snapshot and independent section loading
        run: |
          python -m http.server 8765 --directory public-site > /tmp/public-preview-server.log 2>&1 &
          node tests/public_snapshot_browser.cjs
      - name: Save rendered acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-snapshot-browser-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
