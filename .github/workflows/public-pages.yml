name: Public retro portal

on:
  push:
    branches:
      - main
    paths:
      - 'public-site/**'
      - 'src/white_list_archive/publishing/public_registry.py'
      - 'src/white_list_archive/parsers/cosenza_combined_v2.py'
      - 'pyproject.toml'
      - '.github/workflows/public-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install parser runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python -m pip install -e .
      - name: Download approved Cosenza source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen
          site = json.loads(Path('public-site/data/site.json').read_text(encoding='utf-8'))
          url = site['cosenza']['latest_resource_url']
          req = Request(url, headers={'User-Agent':'italian-anti-mafia-whitelist/0.1 (+public archive)'})
          with urlopen(req, timeout=60) as response:
              body = response.read()
          target = Path('/tmp/cosenza-approved.pdf')
          target.write_bytes(body)
          print('Downloaded', len(body), 'bytes from approved resource URL')
          PY
      - name: Build source-backed public registry
        run: |
          white-list-public-registry /tmp/cosenza-approved.pdf \
            --site-config public-site/data/site.json \
            --output-json public-site/data/registry.json \
            --output-csv public-site/data/registry.csv
      - name: Validate public artifact and registry
        run: |
          test -f public-site/index.html
          test -f public-site/data/site.json
          test -f public-site/data/registry.json
          test -f public-site/data/registry.csv
          node --check public-site/app.js
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('public-site')
          site = json.loads((root/'data/site.json').read_text(encoding='utf-8'))
          reg = json.loads((root/'data/registry.json').read_text(encoding='utf-8'))
          assert site['meta']['classification'] == 'PUBLIC EXPERIMENTAL VIEW'
          assert site['meta']['public_contract_version'] == 2
          assert reg['meta']['contract_version'] == 2
          assert reg['meta']['record_count'] == site['cosenza']['source_rows'] == 1334
          assert reg['meta']['status_counts'] == site['cosenza']['status_counts']
          assert reg['meta']['status_counts']['listed'] == 461
          assert reg['meta']['capture_sha256'] == site['cosenza']['capture_sha256']
          assert any(r.get('identifier_field_raw') for r in reg['records'])
          assert all(r.get('record_locator') for r in reg['records'])
          forbidden_tokens = ('legal_entity_id','address_id','review_notes','reviewed_at','source_occurrences')
          reg_text = (root/'data/registry.json').read_text(encoding='utf-8').casefold()
          for token in forbidden_tokens:
              assert token not in reg_text, token
          forbidden_files = [
              'address-review-2026-09-07.csv',
              'table_catalog.json',
              'source_evidence.json',
              'data-explorer-preview-v2',
          ]
          names = [str(p) for p in root.rglob('*') if p.is_file()]
          for token in forbidden_files:
              if any(token in name for name in names):
                  raise SystemExit(f'Forbidden artifact in public site: {token}')
          print('Public registry validated:', reg['meta']['record_count'], 'records; files:', len(names))
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
