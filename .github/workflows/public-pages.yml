name: Public retro portal

on:
  push:
    branches:
      - main
    paths:
      - 'public-site/**'
      - 'data/publication/multi_prefecture_pilot.json'
      - 'data/source_registry/verified_primary_pages.csv'
      - 'data/source_registry/source_series_inventory.csv'
      - 'data/source_registry/national_index_authority_aliases.csv'
      - 'src/white_list_archive/acquisition/national_index.py'
      - 'src/white_list_archive/publishing/public_national_registry.py'
      - 'src/white_list_archive/publishing/public_national_build.py'
      - 'src/white_list_archive/publishing/public_contract.py'
      - 'src/white_list_archive/publishing/public_artifact.py'
      - 'src/white_list_archive/parsers/multi_prefecture_tables.py'
      - 'src/white_list_archive/parsers/cosenza_combined_v2.py'
      - 'pyproject.toml'
      - '.github/workflows/public-pages.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare runner package sources
        run: |
          # GitHub-hosted images can declare Chrome through either a classic .list
          # file or a deb822 .sources file. The portal does not depend on that
          # repository, so remove only files that actually reference it. Keep this
          # cleanup before both our package install and Playwright's later apt work.
          while IFS= read -r source_file; do
            [ -n "$source_file" ] && sudo rm -f "$source_file"
          done < <(grep -rlE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '\|dl\.google\.com/linux/chrome|d;\|packages\.google\.com/chrome|d' /etc/apt/sources.list
          fi
          if grep -RqsE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null; then
            echo "Chrome APT source remained after targeted cleanup" >&2
            grep -RHnE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true
            exit 1
          fi
      - name: Install publication runtime
        run: |
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && \
               sudo apt-get install -y --no-install-recommends poppler-utils; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Publication runtime package installation failed after bounded retries" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[publication]'
      - name: Build approved multi-Prefecture registry
        run: |
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/public-national-sources \
            --registry-json public-site/data/registry.json \
            --registry-csv public-site/data/registry.csv \
            --prefectures-json public-site/data/prefectures.json \
            --prefectures-csv public-site/data/prefectures.csv
      - name: Validate public artifact and national registry
        id: validate_public
        run: |
          test -f public-site/index.html
          test -f public-site/data/site.json
          test -f public-site/data/registry.json
          test -f public-site/data/registry.csv
          test -f public-site/data/prefectures.json
          test -f public-site/data/prefectures.csv
          node --check public-site/app.js
          node --check public-site/summary.js
          python -m white_list_archive.publishing.public_artifact public-site
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('public-site')
          site = json.loads((root/'data/site.json').read_text(encoding='utf-8'))
          reg = json.loads((root/'data/registry.json').read_text(encoding='utf-8'))
          pref = json.loads((root/'data/prefectures.json').read_text(encoding='utf-8'))

          assert site['meta']['classification'] == 'PUBLIC EXPERIMENTAL VIEW'
          assert site['meta']['public_contract_version'] == 3
          assert reg['meta']['contract_version'] == 3
          assert reg['meta']['record_count'] == 5486
          assert set(reg['meta']['authority_counts']) == {'cosenza','parma','pistoia','bologna','alessandria'}
          assert set(reg['meta']['register_counts']) == {
              'cosenza-ordinary','parma-ordinary','pistoia-ordinary',
              'bologna-provincial','bologna-post-sisma','alessandria-ordinary'
          }
          assert reg['meta']['authority_count'] == 5
          assert reg['meta']['register_count'] == 6
          assert reg['meta']['record_count'] == len(reg['records'])
          assert pref['meta']['authority_count'] == 106
          assert pref['meta']['published_count'] == 5
          assert pref['meta']['mapped_count'] == 34
          bolzano = [x for x in pref['prefectures'] if x['jurisdiction_name'] == 'Bolzano']
          assert len(bolzano) == 1 and bolzano[0]['mapped'] and bolzano[0]['series_count'] > 0
          alessandria = [x for x in pref['prefectures'] if x['jurisdiction_name'] == 'Alessandria']
          assert len(alessandria) == 1 and alessandria[0]['mapped'] and alessandria[0]['published']
          assert all(r.get('record_locator') for r in reg['records'])
          assert any(r.get('identifiers') or r.get('identifier_field_raw') for r in reg['records'])
          assert site['publication']['geography_policy']

          for source in reg['meta']['sources']:
              assert source['document_checked_at']
              assert 'diagnostics' not in source
              diagnostic = json.loads(Path('/tmp/public-national-sources', source['source_key'] + '.diagnostics.json').read_text())
              assert diagnostic['public_records'] > 0
              assert diagnostic.get('dropped_date_rows', 0) == 0

          forbidden_tokens = ('legal_entity_id','address_id','review_notes','reviewed_at','source_occurrences')
          reg_text = (root/'data/registry.json').read_text(encoding='utf-8').casefold()
          for token in forbidden_tokens:
              assert token not in reg_text, token
          names = [str(p) for p in root.rglob('*') if p.is_file()]
          forbidden_files = ['address-review-2026-09-07.csv','table_catalog.json','source_evidence.json','data-explorer-preview-v2']
          for token in forbidden_files:
              if any(token in name for name in names):
                  raise SystemExit(f'Forbidden artifact in public site: {token}')
          print('Public national registry validated:', reg['meta']['record_count'], 'records; Prefectures:', pref['meta'])
          PY
      - name: Install browser acceptance test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test public registry at desktop and mobile widths
        run: |
          python -m http.server 8765 --directory public-site > /tmp/public-preview-server.log 2>&1 &
          node tests/public_portal_browser.cjs
      - name: Save rendered acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-rendered-evidence-attempt-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
      - name: Verify official-source links
        if: ${{ !cancelled() && steps.validate_public.outcome == 'success' }}
        run: python -m white_list_archive.publishing.public_links public-site /tmp/public-link-audit.json
      - name: Save link verification report
        if: ${{ !cancelled() && steps.validate_public.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-link-audit-attempt-${{ github.run_attempt }}
          path: /tmp/public-link-audit.json
          retention-days: 14
      - name: Save reviewable public build
        if: ${{ !cancelled() && steps.validate_public.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-portal-review-attempt-${{ github.run_attempt }}
          path: public-site/
          retention-days: 14
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
