name: Cremona source discovery 2026-09-18

on:
  push:
    branches:
      - expansion/cremona-2026-09-18
    paths:
      - .github/workflows/cremona-discovery-2026-09-18.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install PDF text tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch and inspect official Cremona publication
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://prefettura.interno.gov.it/it/prefetture/cremona/evidenza/white-list-elenco-ditte'
          PDF='https://prefettura.interno.gov.it/sites/default/files/22/2026-09/white-list-elenchi-ditte_3.pdf'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36'
          for i in 1 2; do
            curl --fail --location --silent --show-error --user-agent "$UA" \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "${PAGE}?wl_probe=20260918-page-${i}-$(date +%s%N)" -o "page${i}.html"
            curl --fail --location --silent --show-error --user-agent "$UA" \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "${PDF}?wl_probe=20260918-pdf-${i}-$(date +%s%N)" -o "source${i}.pdf"
            echo "PAGE_${i} bytes=$(wc -c < "page${i}.html") sha256=$(sha256sum "page${i}.html" | cut -d' ' -f1)"
            echo "PDF_${i} bytes=$(wc -c < "source${i}.pdf") sha256=$(sha256sum "source${i}.pdf" | cut -d' ' -f1) type=$(file -b "source${i}.pdf")"
          done
          cmp -s source1.pdf source2.pdf && echo 'PDF_BYTE_IDENTICAL=yes' || { echo 'PDF_BYTE_IDENTICAL=no'; exit 1; }
          echo "PDF_PAGES=$(pdfinfo source1.pdf | awk -F: '/^Pages/{gsub(/ /,"",$2);print $2}')"
          pdftotext -layout source1.pdf source.txt
          echo "TEXT_SHA256=$(sha256sum source.txt | cut -d' ' -f1)"
          python - <<'PY'
          import re
          t=open('source.txt',encoding='utf-8',errors='replace').read()
          print('TEXT_CHARS='+str(len(t)))
          for token in ['RICHIED','ISCRITT','IN AGGIORNAMENTO','RINNOV','AVVIO ISTRUTTORIA','SCADEN','DINIEG','CANCEL','REVOCA']:
              print(token.replace(' ','_')+'='+str(t.upper().count(token)))
          ids=re.findall(r'(?<!\d)\d{11}(?!\d)',t)
          print('STRICT_11_DIGIT_TOKENS='+str(len(ids)))
          print('STRICT_11_DIGIT_UNIQUE='+str(len(set(ids))))
          print('DUPLICATE_STRICT_IDS='+','.join(f'{x}:{ids.count(x)}' for x in sorted(set(ids)) if ids.count(x)>1))
          lines=[ln.rstrip() for ln in t.splitlines() if ln.strip()]
          print('NONEMPTY_LINES='+str(len(lines)))
          print('TEXT_HEAD_BEGIN')
          for ln in lines[:120]: print(ln)
          print('TEXT_HEAD_END')
          print('MARKER_LINES_BEGIN')
          for ln in lines:
              u=ln.upper()
              if any(k in u for k in ['RICHIED','IN AGGIORNAMENTO','RINNOV','AVVIO ISTRUTTORIA','DINIEG','CANCEL','REVOCA']): print(ln)
          print('MARKER_LINES_END')
          print('TEXT_TAIL_BEGIN')
          for ln in lines[-80:]: print(ln)
          print('TEXT_TAIL_END')
          PY
