name: Cremona source discovery 2026-09-18

on:
  push:
    branches:
      - expansion/cremona-2026-09-18
    paths:
      - .github/workflows/cremona-discovery-2026-09-18.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch and inspect official Cremona source
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://prefettura.interno.gov.it/it/prefetture/cremona/evidenza/white-list-elenco-ditte'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36'
          for i in 1 2; do
            curl --fail --location --silent --show-error \
              --user-agent "$UA" \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "${BASE}?wl_probe=20260918-${i}-$(date +%s%N)" \
              -o "page${i}.html"
            printf 'page_fetch_%s bytes=%s sha256=%s\n' "$i" "$(wc -c < "page${i}.html")" "$(sha256sum "page${i}.html" | cut -d' ' -f1)"
          done
          python - <<'PY'
          from html import unescape
          from urllib.parse import urljoin
          import re
          base='https://prefettura.interno.gov.it/it/prefetture/cremona/evidenza/white-list-elenco-ditte'
          text=open('page1.html',encoding='utf-8',errors='replace').read()
          hrefs=[]
          for raw in re.findall(r'''href=["']([^"']+)["']''', text, flags=re.I):
              u=urljoin(base,unescape(raw))
              if u not in hrefs: hrefs.append(u)
          print('ATTACHMENT_CANDIDATES_BEGIN')
          for u in hrefs:
              lu=u.lower().split('?',1)[0]
              if ('/sites/default/files/' in lu or lu.endswith(('.pdf','.doc','.docx','.xls','.xlsx','.ods','.csv','.rtf'))):
                  print(u)
          print('ATTACHMENT_CANDIDATES_END')
          plain=re.sub(r'<[^>]+>',' ',text)
          plain=unescape(re.sub(r'\s+',' ',plain))
          for token in ('richiedent','iscritt','aggiorn','rinnov','elenco'):
              print(f'token_{token}={plain.lower().count(token)}')
          PY
          mapfile -t urls < <(python - <<'PY'
          from html import unescape
          from urllib.parse import urljoin
          import re
          base='https://prefettura.interno.gov.it/it/prefetture/cremona/evidenza/white-list-elenco-ditte'
          text=open('page1.html',encoding='utf-8',errors='replace').read()
          seen=[]
          for raw in re.findall(r'''href=["']([^"']+)["']''', text, flags=re.I):
              u=urljoin(base,unescape(raw))
              lu=u.lower().split('?',1)[0]
              if ('/sites/default/files/' in lu or lu.endswith(('.pdf','.doc','.docx','.xls','.xlsx','.ods','.csv','.rtf'))) and u not in seen:
                  seen.append(u); print(u)
          PY
          )
          echo "attachment_count=${#urls[@]}"
          idx=0
          for u in "${urls[@]}"; do
            idx=$((idx+1))
            echo "ATTACHMENT_${idx}_URL=$u"
            for i in 1 2; do
              sep='?'; [[ "$u" == *'?'* ]] && sep='&'
              curl --fail --location --silent --show-error --user-agent "$UA" \
                -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                "${u}${sep}wl_probe=20260918-${i}-$(date +%s%N)" -o "att-${idx}-${i}"
              echo "ATTACHMENT_${idx}_FETCH_${i} bytes=$(wc -c < "att-${idx}-${i}") sha256=$(sha256sum "att-${idx}-${i}" | cut -d' ' -f1) type=$(file -b "att-${idx}-${i}")"
            done
            cmp -s "att-${idx}-1" "att-${idx}-2" && echo "ATTACHMENT_${idx}_BYTE_IDENTICAL=yes" || echo "ATTACHMENT_${idx}_BYTE_IDENTICAL=no"
            if file -b "att-${idx}-1" | grep -qi PDF; then
              pdftotext -layout "att-${idx}-1" "att-${idx}.txt" || true
              echo "ATTACHMENT_${idx}_PDF_PAGES=$(pdfinfo "att-${idx}-1" 2>/dev/null | awk -F: '/^Pages/{gsub(/ /,"",$2);print $2}')"
              echo "ATTACHMENT_${idx}_TEXT_HEAD_BEGIN"
              head -n 80 "att-${idx}.txt" || true
              echo "ATTACHMENT_${idx}_TEXT_HEAD_END"
              echo "ATTACHMENT_${idx}_TEXT_TAIL_BEGIN"
              tail -n 40 "att-${idx}.txt" || true
              echo "ATTACHMENT_${idx}_TEXT_TAIL_END"
            fi
          done
