name: Archive reviewed source scopes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-reviewed-sources.yml'
      - 'scripts/audit_source_archive.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reviewed-source-archive
  cancel-in-progress: false

jobs:
  archive:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: evidence-archive
    env:
      EVIDENCE_BUCKET: ${{ vars.EVIDENCE_BUCKET }}
      EVIDENCE_ENDPOINT: ${{ vars.EVIDENCE_ENDPOINT }}
      EVIDENCE_REGION: ${{ vars.EVIDENCE_REGION }}
      EVIDENCE_POLICY_EVIDENCE: ${{ vars.EVIDENCE_POLICY_EVIDENCE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.EVIDENCE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.EVIDENCE_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.EVIDENCE_SESSION_TOKEN }}
      EVIDENCE_DATABASE_URL: ${{ secrets.EVIDENCE_DATABASE_URL }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[storage,database]'
      - name: Preserve affected scopes before any subsequent data promotion
        run: |
          python scripts/audit_source_archive.py \
            --source-keys potenza-combined milano-combined enna-combined taranto-listed taranto-applicants \
            --work-dir /tmp/private-reviewed-sources \
            --output /tmp/public-actions/reviewed-source-captures.json
      - name: Retain safe capture receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-source-captures-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/public-actions/reviewed-source-captures.json
          if-no-files-found: warn
          retention-days: 90

# Original bytes and provider/catalogue coordinates are never uploaded to Actions.
# A capture receipt does not approve changed bytes, parsed facts or a public release.
