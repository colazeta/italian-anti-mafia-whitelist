name: Pordenone exact row audit

on:
  push:
    branches:
      - expansion/pordenone-2026-09-20
    paths:
      - .github/workflows/pordenone-exact-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install PDF audit runtime
        run: python -m pip install --disable-pip-version-check pdfplumber==0.11.7
      - name: Freeze Pordenone row semantics fail closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, io, json, re, unicodedata
          from collections import Counter, defaultdict
          from datetime import datetime
          from urllib.request import Request, urlopen
          import pdfplumber

          assets = [
            ('I','listed','https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-i-estrazione-fornitura-etc_0.pdf','f4e6374e5e03daa25daedd49ada730ae39c6b77437e763e3c0308aa0a0c627de'),
            ('II','listed','https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-ii-confezionamento-fornitura-etc_0.pdf','62d63a080b3025e2ee2f37c3af1d486f12095be8f83e73cae611e2ca56bf84d5'),
            ('III','listed','https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-iii-noli-a-freddo-di-macchinari.pdf','2204fe651b733e32fe13f001c97fd2c6a93ccd9a846cc9f4ddd40d4f471e6ce9'),
            ('IV','listed','https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-iv-fornitura-di-ferro-lavorato_0.pdf','55a1edd7bcc52de101536c42091e14e040892cf1122462c36b37a861c48eeb62'),
            ('V','listed','https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-v-noli-a-caldo_0.pdf','4fcd95954d20ba19ffcfb11e64a911a637056ba2fd794d47c5d3f19171f77803'),
            ('VI','listed','https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-vi-autotrasporti-per-conto-terzi_1.pdf','62c39abfc260ecacf59b0201867263499643fe5dc36c95500e380fa53deb87aa'),
            ('VII','listed','https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-vii-guardiania-dei-cantieri.pdf','35c5ef5ddb218e50d1f5a56007f2c1886ac73b6a91c5a13fb37e4b7f4952d2c8'),
            ('VIII','listed','https://prefettura.interno.gov.it/sites/default/files/74/2026-08/sez-viii-servizi-funerari-e-cimiteriali.pdf','cac3354a388d87b3f7ee1fef965f7b9968d2fea4dfcbafa776fc175bee5d96b3'),
            ('IX','listed','https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-ix-ristorazione-mense-e-catering.pdf','a3b7c0b749be947692cb6ebb031e21e6c2e61913f34c1ad9f4741f3a7b9e96fa'),
            ('X','listed','https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-x-servizi-ambientali-trasporto-rifiuti-etc_0.pdf','af639b5c55ff31893bfd3906876e0c60e1e6614065efae1e5c7871ac62290c0f'),
            ('XI','applicant','https://prefettura.interno.gov.it/sites/default/files/74/2026-09/sez-xi-elenco-imprese-richiedenti_edit_0.pdf','b8875c9392f9c7273c3c773110d90141eada8aebaa538ae1e3115be27bfdaea1'),
          ]
          ua='italian-anti-mafia-whitelist/1.0 exact-audit'
          strict_id=re.compile(r'^(?:\d{11}|[A-Z0-9]{16})$',re.I)
          date_any=re.compile(r'\b(\d{2}/\d{2}/\d{4})\b')

          def clean(v): return ' '.join((v or '').split())
          def fold(v):
              v=unicodedata.normalize('NFKD',clean(v))
              return ''.join(c for c in v if not unicodedata.combining(c)).casefold()
          def valid_date(v):
              v=clean(v)
              if not re.fullmatch(r'\d{2}/\d{2}/\d{4}',v): return False
              try: datetime.strptime(v,'%d/%m/%Y'); return True
              except ValueError: return False
          def strict_identifier(raw):
              v=re.sub(r'[^0-9A-Z]','',clean(raw).upper())
              return v if strict_id.fullmatch(v) else ''
          def party_fields(cells):
              prefix=cells[:-4]
              if prefix and (prefix[0].isdigit() or prefix[0]==''):
                  prefix=prefix[1:]
              vals=(prefix+['','',''])[:3]
              return clean(vals[0]),clean(vals[1]),clean(vals[2])
          def structural(cells):
              nonempty=[clean(c) for c in cells if clean(c)]
              joined=fold(' | '.join(cells))
              if not nonempty: return 'blank'
              if len(nonempty)==1 and re.fullmatch(r'\d{2}/\d{2}/\d{4}',nonempty[0]): return 'page_date'
              if len(nonempty)==1 and nonempty[0].isdigit(): return 'numbering_only'
              if 'rag. sociale' in joined and ('cod. fiscale' in joined or 'partita iva' in joined): return 'header'
              if joined.startswith('rag. | sede | sede secondaria | cod. fiscale | data di | data scadenza | aggiornamento in'): return 'header_split_1'
              if joined.startswith('sociale | legale | con rappresentanza | partita iva | iscrizione | iscrizione | corso'): return 'header_split_2'
              if joined == 'stabile in italia': return 'header_split_3'
              if joined.startswith('sezione '): return 'section_title'
              return ''
          def listed_status(note):
              f=fold(note)
              if 'aggiornamento' in f: return 'renewal_update_in_progress'
              if 'trasferita' in f or 'competenza prefettura' in f: return 'other_or_unknown'
              if not f or 'iscritta' in f: return 'listed'
              return ''
          def applicant_status(joined):
              f=fold(joined)
              if 'in istruttoria' in f: return 'pending'
              if 'in aggiornamento' in f: return 'renewal_update_in_progress'
              return ''

          listed=[]; applicants=[]; unclassified=[]; structural_counts=Counter(); per_section=defaultdict(Counter)
          for section,pop,url,expected in assets:
              req=Request(url,headers={'User-Agent':ua,'Cache-Control':'no-cache'})
              with urlopen(req,timeout=60) as r: data=r.read()
              digest=hashlib.sha256(data).hexdigest(); assert digest==expected,(section,digest)
              with pdfplumber.open(io.BytesIO(data)) as pdf:
                  for pno,page in enumerate(pdf.pages,1):
                      tables=page.extract_tables() or []
                      if len(tables)!=1:
                          raise AssertionError((section,pno,'table_count',len(tables)))
                      for rno,raw in enumerate(tables[0] or [],1):
                          cells=[clean(c) for c in raw]
                          locator=f'{section}:p{pno}:r{rno}'
                          kind=structural(cells)
                          if kind:
                              structural_counts[kind]+=1
                              continue
                          if pop=='listed':
                              if len(cells) not in (7,8):
                                  unclassified.append((locator,'column_count',cells)); continue
                              name,office,secondary=party_fields(cells)
                              identifier_raw=clean(cells[-4]); listed_raw=clean(cells[-3]); expiry_raw=clean(cells[-2]); note=clean(cells[-1])
                              status=listed_status(note)
                              # Series membership is positive listed evidence. Blank dates/status are retained raw;
                              # they are not fabricated. A row still needs a company/identifier anchor.
                              if not status:
                                  unclassified.append((locator,'listed_status',cells)); continue
                              if not (name or identifier_raw):
                                  unclassified.append((locator,'listed_anchor',cells)); continue
                              rec={'section':section,'locator':locator,'name':name,'office':office,'secondary':secondary,
                                   'identifier_raw':identifier_raw,'identifier':strict_identifier(identifier_raw),
                                   'listed_raw':listed_raw,'expiry_raw':expiry_raw,'note':note,'outcome':status}
                              listed.append(rec); per_section[section][status]+=1
                          else:
                              if len(cells) not in (7,8):
                                  unclassified.append((locator,'applicant_column_count',cells)); continue
                              # Section XI is explicit applicant evidence. Table geometry is irregular on page 3,
                              # so date/status are read from the entire row while identifier remains position-bound.
                              name,office,secondary=party_fields(cells)
                              identifier_raw=clean(cells[-4])
                              joined=' | '.join(cells)
                              status=applicant_status(joined)
                              dates=date_any.findall(joined)
                              if not status or len(dates)!=1:
                                  unclassified.append((locator,'applicant_status_or_date',cells)); continue
                              if not (name or identifier_raw):
                                  unclassified.append((locator,'applicant_anchor',cells)); continue
                              applicants.append({'section':section,'locator':locator,'name':name,'office':office,
                                                 'secondary':secondary,'identifier_raw':identifier_raw,
                                                 'identifier':strict_identifier(identifier_raw),
                                                 'row_raw':cells,'application_raw':dates[0],'outcome':status})
                              per_section[section][status]+=1

          print('UNCLASSIFIED',json.dumps(unclassified,ensure_ascii=False))
          assert not unclassified, unclassified

          # Conservative logical grouping across listed sector PDFs. Only exact strict identifier, or exact
          # folded name+office+secondary when the source identifier is unusable, can join rows; date/status
          # remain part of the key so conflicting evidence never collapses.
          groups={}
          for rec in listed:
              identity=('id',rec['identifier']) if rec['identifier'] else ('fallback',fold(rec['name']),fold(rec['office']),fold(rec['secondary']))
              key=identity+(rec['listed_raw'],rec['expiry_raw'],rec['outcome'])
              if key not in groups: groups[key]={'records':[],'sections':set()}
              groups[key]['records'].append(rec); groups[key]['sections'].add(rec['section'])
          logical=list(groups.values())

          physical_status=Counter(r['outcome'] for r in listed)
          logical_status=Counter(g['records'][0]['outcome'] for g in logical)
          applicant_statuses=Counter(r['outcome'] for r in applicants)
          listed_id_physical=sum(bool(r['identifier']) for r in listed)
          listed_id_logical=sum(bool(g['records'][0]['identifier']) for g in logical)
          applicant_id=sum(bool(r['identifier']) for r in applicants)
          listed_missing_dates=sum((not r['listed_raw'])+(not r['expiry_raw']) for r in listed)
          listed_date_anomalies=sum(bool(r['listed_raw']) and not valid_date(r['listed_raw']) for r in listed) + sum(bool(r['expiry_raw']) and not valid_date(r['expiry_raw']) for r in listed)
          applicant_date_anomalies=sum(not valid_date(r['application_raw']) for r in applicants)
          multi_section=sum(len(g['sections'])>1 for g in logical)
          blank_applicant_names=sum(not bool(clean(r['name'])) for r in applicants)

          conflict_identities=defaultdict(set)
          for r in listed:
              ident=('id',r['identifier']) if r['identifier'] else ('fallback',fold(r['name']),fold(r['office']),fold(r['secondary']))
              conflict_identities[ident].add((r['listed_raw'],r['expiry_raw'],r['outcome']))
          conflicts={str(k):sorted(v) for k,v in conflict_identities.items() if len(v)>1}

          summary={
              'listed_physical':len(listed),'listed_logical':len(logical),'applicants':len(applicants),
              'listed_physical_status':dict(physical_status),'listed_logical_status':dict(logical_status),
              'applicant_status':dict(applicant_statuses),
              'listed_identifier_physical':listed_id_physical,'listed_identifier_logical':listed_id_logical,
              'applicant_identifier':applicant_id,
              'listed_missing_date_fields':listed_missing_dates,'listed_date_anomalies':listed_date_anomalies,
              'applicant_date_anomalies':applicant_date_anomalies,'blank_applicant_names':blank_applicant_names,
              'multi_section_logical_groups':multi_section,
              'identity_groups_with_conflicting_date_or_status':len(conflicts),
              'structural_rows':dict(structural_counts),
              'per_section':{k:dict(v) for k,v in sorted(per_section.items())},
          }
          print('EXACT_SUMMARY',json.dumps(summary,ensure_ascii=False,sort_keys=True))
          print('CONFLICT_SAMPLE',json.dumps(list(conflicts.items())[:30],ensure_ascii=False,sort_keys=True))
          print('STRICT_ID_MISS_SAMPLE',json.dumps([
              {k:r[k] for k in ('section','locator','name','identifier_raw','listed_raw','expiry_raw','outcome')}
              for r in listed if not r['identifier']
          ][:40],ensure_ascii=False,sort_keys=True))
          print('APPLICANT_SPECIAL_ROWS',json.dumps([
              {k:r[k] for k in ('locator','name','office','identifier_raw','application_raw','outcome')}
              for r in applicants if (not r['identifier'] or not r['name'] or r['outcome']!='pending')
          ],ensure_ascii=False,sort_keys=True))
          PY
