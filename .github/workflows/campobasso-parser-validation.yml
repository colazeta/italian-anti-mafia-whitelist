name: Campobasso parser validation

on:
  push:
    branches:
      - expansion/campobasso-2026-09-11
    paths:
      - src/white_list_archive/parsers/campobasso_openxml.py
      - tests/test_campobasso_parser_semantics.py
      - .github/workflows/campobasso-parser-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and parser dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev,publication]' requests
      - name: Run Campobasso semantic tests
        run: python -m pytest -q tests/test_campobasso_parser_semantics.py
      - name: Fetch byte-pinned official sources and validate live parser
        env:
          LISTED_URL: https://prefettura.interno.gov.it/sites/default/files/21/2026-08/11-agosto-2026-elenco-delle-imprese-non-soggette-a-tentativo-di-infilt.xlsx
          APPLICANT_URL: https://prefettura.interno.gov.it/sites/default/files/21/2026-08/11-agosto-2026-elenco-delle-imprese-richiedenti-l-iscrizione.docx
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import requests
          from white_list_archive.parsers.campobasso_openxml import parse_campobasso_applicants, parse_campobasso_listed

          expected = {
              'listed': '9d07423eb023025e1dd318c610a205f287a4bee165e4f7fe34e2448f8d91d2a1',
              'applicant': '6b1b1f877a0ae5fe68d2472034975914723626a553257d4978296b3632a635ba',
          }
          urls = {'listed': os.environ['LISTED_URL'], 'applicant': os.environ['APPLICANT_URL']}
          paths = {}
          for key, url in urls.items():
              response = requests.get(url, timeout=60, headers={'User-Agent':'italian-anti-mafia-whitelist/source-validation'})
              response.raise_for_status()
              digest = hashlib.sha256(response.content).hexdigest()
              if digest != expected[key]:
                  raise SystemExit(f'{key} byte drift: {digest} != {expected[key]}')
              suffix = '.xlsx' if key == 'listed' else '.docx'
              path = Path(f'/tmp/campobasso-{key}{suffix}')
              path.write_bytes(response.content)
              paths[key] = path

          base = {
              'authority_key':'campobasso', 'authority_name':'Prefettura di Campobasso',
              'register_key':'campobasso-ordinary', 'register_name':'White List ordinaria',
              'reference_date':'2026-08-11',
              'source_page_url':'https://prefettura.interno.gov.it/it/prefetture/campobasso/evidenza/white-list',
          }
          listed_cfg = {**base, 'parser':'campobasso_listed', 'source_key':'campobasso-listed', 'population_scope':'listed', 'resource_url':urls['listed'], 'sha256':expected['listed']}
          applicant_cfg = {**base, 'parser':'campobasso_applicants', 'source_key':'campobasso-applicants', 'population_scope':'applicant', 'resource_url':urls['applicant'], 'sha256':expected['applicant']}
          listed = parse_campobasso_listed(paths['listed'], listed_cfg)
          applicants = parse_campobasso_applicants(paths['applicant'], applicant_cfg)
          assert listed.diagnostics['public_records'] == 323, listed.diagnostics
          assert listed.diagnostics['status_counts'] == {'listed':276, 'renewal_update_in_progress':47}, listed.diagnostics
          assert applicants.diagnostics['public_records'] == 19, applicants.diagnostics
          assert applicants.diagnostics['status_counts'] == {'pending':19}, applicants.diagnostics
          assert len(listed.records) + len(applicants.records) == 342
          print('Campobasso parser validation passed: 323 listed-population + 19 applicant = 342 observations')
          print('Listed diagnostics:', listed.diagnostics)
          print('Applicant diagnostics:', applicants.diagnostics)
          PY
