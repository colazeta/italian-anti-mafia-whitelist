name: Genova parser hotfix

on:
  push:
    branches:
      - expansion/genova-2026-09-12
    paths:
      - .github/workflows/genova-parser-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/genova-2026-09-12
      - name: Apply exact fail-closed binding correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/white_list_archive/parsers/genova_tables.py')
          text = path.read_text(encoding='utf-8')
          old = '''            primary_date=row["application_date"],
            primary_date_label="Data di presentazione dell'istanza",
'''
          new = '''            application_date=row["application_date"],
            primary_date_label="Data presentazione istanza",
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one old binding, found {text.count(old)}')
          text = text.replace(old, new)
          if 'primary_date=row["application_date"]' in text:
              raise SystemExit('unsupported primary_date binding remains')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit exact correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/white_list_archive/parsers/genova_tables.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'Fix Genova applicant primary-date binding'
          git push origin HEAD:expansion/genova-2026-09-12
