name: Crotone parser profile 2026-09-11

on:
  push:
    branches: [expansion/crotone-2026-09-11]
    paths: [.github/workflows/crotone-parser-profile-2026-09-11.yml]

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/crotone-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pdfplumber
      - name: Build compact parser profile
        run: |
          python - <<'PY'
          import hashlib, json, re, time
          from collections import Counter, defaultdict
          from pathlib import Path
          from urllib.request import Request, urlopen
          import pdfplumber

          URLS={
            'listed':'https://prefettura.interno.gov.it/sites/default/files/0/2026-09/ditte-iscritte-white-list-2.pdf',
            'applicants':'https://prefettura.interno.gov.it/sites/default/files/0/2026-09/ditte-con-richiesta-iscrizione-white-list-2.pdf',
          }
          MONTHS='gennaio febbraio marzo aprile maggio giugno luglio agosto settembre ottobre novembre dicembre'.split()
          MONTH='(?:'+'|'.join(MONTHS)+')'
          DATE=re.compile(rf'^\d{{1,2}}\s+{MONTH}\s+\d{{4}}$',re.I)
          SECTION=re.compile(r'(?:SEZIONE|SEZ\.?)[\s\n]*(10|[1-9])\b',re.I)
          STRICT_ID=re.compile(r'^(?:\d{11}|[A-Za-z0-9]{16})$',re.I)
          def clean(x): return ' '.join(str(x or '').split())
          def get(url):
            last=None
            for i in range(5):
              try:
                req=Request(url,headers={'User-Agent':'italian-anti-mafia-whitelist/0.1 (+parser profile)','Accept':'application/pdf,*/*'})
                with urlopen(req,timeout=90) as r: return r.read()
              except Exception as e:
                last=e; time.sleep(3*(i+1))
            raise last
          out={'profiled_on':'2026-09-11','sources':{}}
          for scope,url in URLS.items():
            body=get(url)
            if not body.startswith(b'%PDF'): raise RuntimeError(f'{scope}: not PDF')
            p=Path(f'/tmp/{scope}.pdf'); p.write_bytes(body)
            src={'url':url,'sha256':hashlib.sha256(body).hexdigest(),'bytes':len(body)}
            length_counts=Counter(); date_positions=Counter(); raw=[]; sections=[]; current_section=None; page_sections=[]
            with pdfplumber.open(p) as pdf:
              src['pages']=len(pdf.pages); src['metadata']={k:clean(v) for k,v in (pdf.metadata or {}).items()}
              for pno,page in enumerate(pdf.pages,1):
                text=page.extract_text() or ''
                hits=[int(x) for x in SECTION.findall(text)]
                if hits: current_section=hits[0]
                page_sections.append({'page':pno,'hits':hits,'carried':current_section})
                for tno,table in enumerate(page.extract_tables() or [],1):
                  for rno,row in enumerate(table or [],1):
                    cells=[clean(c) for c in row]
                    if not any(cells): continue
                    length_counts[len(cells)]+=1
                    positions=tuple(i for i,c in enumerate(cells) if DATE.fullmatch(c))
                    date_positions[(len(cells),positions)]+=1
                    raw.append({'page':pno,'table':tno,'row':rno,'section':current_section,'cells':cells,'date_positions':positions})
            src['table_row_lengths']=dict(sorted(length_counts.items()))
            src['date_position_patterns']={f'{k[0]}:{list(k[1])}':v for k,v in date_positions.most_common()}
            src['page_sections']=page_sections
            if scope=='listed':
              # reviewed layout from official heading: name, identifier, office, listing date, expiry, notes.
              rows=[]
              for r in raw:
                c=r['cells']
                if len(c)==6 and DATE.fullmatch(c[3]) and DATE.fullmatch(c[4]) and c[0] and c[1]:
                  rows.append({'page':r['page'],'table':r['table'],'row':r['row'],'section':r['section'],'name':c[0],'id':c[1],'office':c[2],'listing':c[3],'expiry':c[4],'note':c[5]})
              src['candidate_rows']=len(rows)
              src['section_counts']=dict(sorted(Counter(r['section'] for r in rows).items(),key=lambda x:str(x[0])))
              src['note_counts']=Counter(r['note'] for r in rows).most_common(30)
              src['identifier_coverage_sector_rows']=sum(bool(STRICT_ID.fullmatch(r['id'].replace(' ',''))) for r in rows)
              conservative={}
              for r in rows:
                key=(r['name'].casefold(),r['id'].casefold(),r['office'].casefold(),r['listing'],r['expiry'],r['note'].casefold())
                g=conservative.setdefault(key,{'row':r,'sections':set()}); g['sections'].add(r['section'])
              broad=defaultdict(list)
              for r in rows: broad[(r['name'].casefold(),r['id'].casefold())].append(r)
              src['conservative_groups']=len(conservative)
              src['conservative_group_section_span_counts']=dict(sorted(Counter(len(g['sections']) for g in conservative.values()).items()))
              src['grouped_note_counts']=Counter(g['row']['note'] for g in conservative.values()).most_common(30)
              src['grouped_identifier_coverage']=sum(bool(STRICT_ID.fullmatch(g['row']['id'].replace(' ',''))) for g in conservative.values())
              conflicts=[]
              for ident,rs in broad.items():
                variants={(r['office'].casefold(),r['listing'],r['expiry'],r['note'].casefold()) for r in rs}
                if len(variants)>1:
                  conflicts.append({'identity':list(ident),'variant_count':len(variants),'rows':rs[:8]})
              src['identity_variant_conflicts']=conflicts[:50]
              src['identity_variant_conflict_count']=len(conflicts)
              src['sample_rows']=rows[:15]
              src['malformed_identifiers']=[{'name':g['row']['name'],'raw':g['row']['id']} for g in conservative.values() if not STRICT_ID.fullmatch(g['row']['id'].replace(' ',''))][:50]
            else:
              rows=[]
              for r in raw:
                c=r['cells']
                if len(c)==6 and DATE.fullmatch(c[5]) and c[0] and c[1]:
                  rows.append({'page':r['page'],'table':r['table'],'row':r['row'],'id':c[0],'name':c[1],'office':c[2],'secondary':c[3],'activities':c[4],'application':c[5]})
              src['candidate_rows']=len(rows)
              src['identifier_coverage']=sum(bool(STRICT_ID.fullmatch(r['id'].replace(' ',''))) for r in rows)
              src['duplicate_full_rows']=len(rows)-len({tuple(r[k].casefold() if isinstance(r[k],str) else r[k] for k in ('id','name','office','secondary','activities','application')) for r in rows})
              src['sample_rows']=rows[:15]
              src['malformed_identifiers']=[{'name':r['name'],'raw':r['id']} for r in rows if not STRICT_ID.fullmatch(r['id'].replace(' ',''))][:50]
            out['sources'][scope]=src
          Path('tmp').mkdir(exist_ok=True)
          Path('tmp/crotone-parser-profile.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({s:{k:v for k,v in d.items() if k not in ('page_sections','sample_rows','identity_variant_conflicts')} for s,d in out['sources'].items()},ensure_ascii=False,indent=2))
          PY
      - name: Commit profile checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/crotone-parser-profile.json
          git commit -m 'Checkpoint Crotone parser profile'
          git push origin HEAD:expansion/crotone-2026-09-11
