name: Fix Agrigento strict expiry invariant

on:
  push:
    branches:
      - expansion/agrigento-2026-09-10
    paths:
      - '.github/workflows/agrigento-validator-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/agrigento-2026-09-10
      - name: Replace Counter assertion with exact ordered invariant
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/agrigento-integration-apply.yml')
          text=p.read_text(encoding='utf-8')
          old="assert Counter(batch.diagnostics['malformed_expiry_dates']) == Counter({'22,01,2027':1})"
          new="assert batch.diagnostics['malformed_expiry_dates'] == ['22,01.2027'], repr(batch.diagnostics['malformed_expiry_dates'])"
          if text.count(old) != 1:
              raise SystemExit('expected exactly one expiry invariant')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'colazeta'
          git config user.email '47261299+colazeta@users.noreply.github.com'
          git add .github/workflows/agrigento-integration-apply.yml
          git diff --cached --check
          git commit -m 'Make Agrigento expiry invariant exact'
          git push origin HEAD:expansion/agrigento-2026-09-10
