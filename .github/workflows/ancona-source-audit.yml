name: Ancona source audit

on:
  push:
    branches:
      - expansion/ancona-2026-09-10
    paths:
      - .github/workflows/ancona-source-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate current byte-pinned source and parser
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE='https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco_imprese_wl07-10-2026.pdf'
          EXPECTED_SHA='09d5ba7264ee6f0c6170273713881273c5d5a045cc9a4a49de3dd36c3860f88d'
          curl --fail --location --retry 2 --retry-delay 2 --user-agent 'italian-anti-mafia-whitelist/0.1 (+source verification)' --output /tmp/ancona.pdf "$RESOURCE"
          ACTUAL_SHA=$(sha256sum /tmp/ancona.pdf | cut -d' ' -f1)
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          python -m pip install -q -e '.[dev]'
          python - <<'PY'
          from white_list_archive.parsers.ancona_combined import parse_ancona_combined
          cfg={
            'source_key':'ancona-combined','authority_key':'ancona','authority_name':'Prefettura di Ancona',
            'register_key':'ancona-ordinary','register_name':'White List ordinaria','population_scope':'listed_and_applicant',
            'reference_date':'2026-09-07','source_page_url':'https://prefettura.interno.gov.it/it/prefetture/ancona/evidenza/white-list',
            'resource_url':'https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco_imprese_wl07-10-2026.pdf',
            'sha256':'09d5ba7264ee6f0c6170273713881273c5d5a045cc9a4a49de3dd36c3860f88d',
          }
          batch=parse_ancona_combined('/tmp/ancona.pdf',cfg)
          print('DIAGNOSTICS',batch.diagnostics)
          assert batch.diagnostics['public_records']==577
          assert batch.diagnostics['status_counts']=={'renewal_update_in_progress':100,'pending':145,'listed':331,'other_or_unknown':1}
          assert batch.diagnostics['blank_name_rows']==0
          assert batch.diagnostics['raw_identifier_coverage']==577
          assert all(r['name'] and r['identifier_field_raw'] for r in batch.records)
          PY
          pytest -q tests/test_ancona_parser_semantics.py
