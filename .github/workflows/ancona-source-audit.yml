name: Ancona source audit

on:
  push:
    branches:
      - expansion/ancona-2026-09-10
    paths:
      - .github/workflows/ancona-source-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve split-row geometry
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE='https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco_imprese_wl07-10-2026.pdf'
          curl --fail --location --retry 2 --retry-delay 2 --user-agent 'italian-anti-mafia-whitelist/0.1 (+source verification)' --output /tmp/ancona.pdf "$RESOURCE"
          python -m pip install -q 'pdfplumber>=0.11,<0.12'
          python - <<'PY'
          import pdfplumber
          target_pages={2,3,8,13,21}
          with pdfplumber.open('/tmp/ancona.pdf') as pdf:
              for pno in sorted(target_pages):
                  page=pdf.pages[pno-1]
                  cand=[]
                  for table in page.extract_tables():
                      if table and table[0] and 'Ragione Sociale' in ' | '.join(' '.join(str(x or '').split()) for x in table[0]): cand.append(table)
                  assert len(cand)==1
                  rows=[[' '.join(str(x or '').split()) for x in r] for r in cand[0][1:]]
                  blank_indexes=[i for i,r in enumerate(rows) if any(r) and not r[0]]
                  print('=== PAGE',pno,'BLANK INDEXES',blank_indexes,'===')
                  for i in blank_indexes:
                      for j in range(max(0,i-2),min(len(rows),i+3)):
                          print('ROW',j+1,rows[j])
                      print('---')
          PY
