name: Ancona source audit

on:
  push:
    branches:
      - expansion/ancona-2026-09-10
    paths:
      - .github/workflows/ancona-source-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit all structural extraction anomalies
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE='https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco_imprese_wl07-10-2026.pdf'
          curl --fail --location --retry 2 --retry-delay 2 --user-agent 'italian-anti-mafia-whitelist/0.1 (+source verification)' --output /tmp/ancona.pdf "$RESOURCE"
          python -m pip install -q 'pdfplumber>=0.11,<0.12'
          python - <<'PY'
          import pdfplumber,re
          with pdfplumber.open('/tmp/ancona.pdf') as pdf:
              for pno,page in enumerate(pdf.pages,1):
                  cand=[]
                  for table in page.extract_tables():
                      if table and table[0] and 'Ragione Sociale' in ' | '.join(' '.join(str(x or '').split()) for x in table[0]): cand.append(table)
                  assert len(cand)==1,(pno,len(cand))
                  rows=[[' '.join(str(x or '').split()) for x in r] for r in cand[0][1:] if any(' '.join(str(x or '').split()) for x in r)]
                  for rno,v in enumerate(rows,1):
                      name,office,secondary,ident,listed,expiry,sections,update,application=v
                      ids=re.findall(r'(?<!\d)\d{10,16}(?!\d)',ident.replace(' ',''))
                      reasons=[]
                      if not name: reasons.append('blank_name')
                      if not office: reasons.append('blank_office')
                      if not ident: reasons.append('blank_identifier')
                      if not sections: reasons.append('blank_sections')
                      if len(ids)>1: reasons.append('multiple_numeric_identifiers')
                      if reasons: print('ANOMALY',pno,rno,','.join(reasons),v)
          PY
