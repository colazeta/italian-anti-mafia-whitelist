name: Ancona source audit

on:
  push:
    branches:
      - expansion/ancona-2026-09-10
    paths:
      - .github/workflows/ancona-source-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect blank-name source evidence
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE='https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco_imprese_wl07-10-2026.pdf'
          curl --fail --location --retry 2 --retry-delay 2 --user-agent 'italian-anti-mafia-whitelist/0.1 (+source verification)' --output /tmp/ancona.pdf "$RESOURCE"
          python -m pip install -q 'pdfplumber>=0.11,<0.12'
          python - <<'PY'
          import pdfplumber
          targets={2:['00733460422','02809800424'],3:['01479620427'],8:['07898760637'],13:['02272920428'],21:['27/08/2026','02557530421']}
          with pdfplumber.open('/tmp/ancona.pdf') as pdf:
              for pno,needles in targets.items():
                  text=pdf.pages[pno-1].extract_text(x_tolerance=2,y_tolerance=3) or ''
                  lines=text.splitlines()
                  print('=== PAGE',pno,'===')
                  for i,line in enumerate(lines):
                      if any(n in line.replace(' ','') or n in line for n in needles):
                          for j in range(max(0,i-2),min(len(lines),i+3)):
                              print(f'{j:03d}',lines[j])
                          print('---')
          PY
