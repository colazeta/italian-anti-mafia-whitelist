name: Ancona source audit

on:
  push:
    branches:
      - expansion/ancona-2026-09-10
    paths:
      - .github/workflows/ancona-source-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ambiguous current Ancona rows
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE='https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco_imprese_wl07-10-2026.pdf'
          curl --fail --location --retry 2 --retry-delay 2 --user-agent 'italian-anti-mafia-whitelist/0.1 (+source verification)' --output /tmp/ancona.pdf "$RESOURCE"
          python -m pip install -q 'pdfplumber>=0.11,<0.12'
          python - <<'PY'
          import pdfplumber
          from collections import Counter
          rows=[]
          with pdfplumber.open('/tmp/ancona.pdf') as pdf:
              for pno,page in enumerate(pdf.pages,1):
                  candidates=[]
                  for table in page.extract_tables():
                      if table and any('Ragione Sociale' in ' | '.join(' '.join(str(x or '').split()) for x in r) and 'Data iscrizione' in ' | '.join(' '.join(str(x or '').split()) for x in r) for r in table[:4]):
                          candidates.append(table)
                  assert len(candidates)==1,(pno,len(candidates))
                  table=candidates[0]
                  for i,r in enumerate(table[1:],1):
                      vals=[' '.join(str(x or '').split()) for x in r]
                      if any(vals): rows.append((pno,i,vals))
          print('TOTAL',len(rows))
          for pno,i,v in rows:
              name,office,secondary,ident,listed,expiry,sections,update,application=v
              if update != '' and update != 'Richiesto rinnovo':
                  print('NONSTANDARD_UPDATE',pno,i,v)
              if not listed and not expiry and not update and not application:
                  print('NO_STATE_SIGNAL',pno,i,v)
              if listed and application:
                  print('LISTED_PLUS_APPLICATION',pno,i,v)
          PY
