name: Ancona source audit

on:
  push:
    branches:
      - expansion/ancona-2026-09-10
    paths:
      - .github/workflows/ancona-source-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit source row boundaries
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE='https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco_imprese_wl07-10-2026.pdf'
          curl --fail --location --retry 2 --retry-delay 2 --user-agent 'italian-anti-mafia-whitelist/0.1 (+source verification)' --output /tmp/ancona.pdf "$RESOURCE"
          python -m pip install -q 'pdfplumber>=0.11,<0.12'
          python - <<'PY'
          import pdfplumber
          rows=[]
          with pdfplumber.open('/tmp/ancona.pdf') as pdf:
              for pno,page in enumerate(pdf.pages,1):
                  cand=[]
                  for table in page.extract_tables():
                      if table and table[0] and 'Ragione Sociale' in ' | '.join(' '.join(str(x or '').split()) for x in table[0]): cand.append(table)
                  assert len(cand)==1,(pno,len(cand))
                  for rno,row in enumerate(cand[0][1:],1):
                      v=[' '.join(str(x or '').split()) for x in row]
                      if any(v): rows.append((pno,rno,v))
          blanks=[x for x in rows if not x[2][0]]
          print('BLANK_NAMES',len(blanks))
          for x in blanks: print('BLANK',x)
          for pno,rno,v in rows:
              if pno==3 and 20 <= rno <= 26: print('P3_CONTEXT',pno,rno,v)
              if pno==15 and 20 <= rno <= 25: print('P15_CONTEXT',pno,rno,v)
          print('BLANK_OFFICE',sum(not x[2][1] for x in rows),'BLANK_ID',sum(not x[2][3] for x in rows),'BLANK_SECTIONS',sum(not x[2][6] for x in rows))
          PY
