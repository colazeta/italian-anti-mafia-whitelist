name: Pescara source probe

on:
  push:
    branches:
      - expansion/pescara-2026-09-21
    paths:
      - .github/workflows/pescara-source-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/pescara-2026-09-21
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe runtime
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 pdfplumber
      - name: Probe official sources twice and inspect PDF structure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/pescara-probe
          python - <<'PY'
          import hashlib, json, re, subprocess, time
          from pathlib import Path
          from urllib.parse import urljoin

          import pdfplumber
          import requests
          from bs4 import BeautifulSoup

          OUT = Path('tmp/pescara-probe')
          UA = 'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelist/1.0; +https://github.com/colazeta/italian-anti-mafia-whitelist)'
          pages = {
              'listed': {
                  'url': 'https://prefettura.interno.gov.it/it/prefetture/pescara/evidenza/white-list',
                  'label': 'White list 27/08/2026',
              },
              'applicants': {
                  'url': 'https://prefettura.interno.gov.it/it/prefetture/pescara/elenco-imprese-richiedenti-liscrizione-nelle-white-list',
                  'label': 'Elenco richiedenti White List - 04.09.2026',
              },
          }
          session = requests.Session()
          session.headers.update({'User-Agent': UA, 'Accept': 'text/html,application/xhtml+xml,application/pdf;q=0.9,*/*;q=0.8'})
          report = {'probe_version': 1, 'sources': {}}

          def clean(value):
              return re.sub(r'\s+', ' ', value or '').strip()

          for key, spec in pages.items():
              item = {'landing_url': spec['url'], 'expected_label': spec['label']}
              report['sources'][key] = item
              try:
                  r = session.get(spec['url'], timeout=40)
                  item['landing_status'] = r.status_code
                  item['landing_content_type'] = r.headers.get('content-type', '')
                  if r.status_code != 200:
                      item['error'] = f'landing HTTP {r.status_code}'
                      continue
                  soup = BeautifulSoup(r.text, 'html.parser')
                  links = []
                  for a in soup.find_all('a', href=True):
                      text = clean(a.get_text(' ', strip=True))
                      href = urljoin(spec['url'], a['href'])
                      links.append({'text': text, 'href': href})
                  exact = [x for x in links if clean(x['text']).casefold() == clean(spec['label']).casefold()]
                  if len(exact) != 1:
                      # Fail closed on source identity, but preserve candidates for diagnosis.
                      item['candidate_links'] = [x for x in links if ('white' in x['text'].casefold() or 'richied' in x['text'].casefold() or x['href'].lower().endswith('.pdf'))][:30]
                      item['error'] = f'expected exactly one exact attachment label, found {len(exact)}'
                      continue
                  url = exact[0]['href']
                  item['attachment_url'] = url
                  captures = []
                  bodies = []
                  for attempt in (1, 2):
                      rr = session.get(url, timeout=60)
                      capture = {
                          'attempt': attempt,
                          'status': rr.status_code,
                          'content_type': rr.headers.get('content-type', ''),
                          'bytes': len(rr.content),
                          'sha256': hashlib.sha256(rr.content).hexdigest(),
                      }
                      captures.append(capture)
                      if rr.status_code != 200:
                          break
                      bodies.append(rr.content)
                      time.sleep(1)
                  item['captures'] = captures
                  if len(bodies) != 2 or bodies[0] != bodies[1]:
                      item['error'] = 'two independent successful byte-identical captures not established'
                      continue
                  data = bodies[0]
                  if not data.startswith(b'%PDF'):
                      item['error'] = 'attachment is not a PDF by magic bytes'
                      continue
                  pdf_path = OUT / f'{key}.pdf'
                  pdf_path.write_bytes(data)
                  text_path = OUT / f'{key}.txt'
                  subprocess.run(['pdftotext', '-layout', str(pdf_path), str(text_path)], check=True)
                  text = text_path.read_text(encoding='utf-8', errors='replace')
                  item['text_chars'] = len(text)
                  item['text_head'] = text[:5000]
                  item['text_tail'] = text[-3000:]
                  with pdfplumber.open(pdf_path) as pdf:
                      item['pages'] = len(pdf.pages)
                      page_summaries = []
                      for page_no, page in enumerate(pdf.pages, 1):
                          tables = page.extract_tables()
                          tinfo = []
                          for t in tables:
                              rows = [[clean(c) for c in row] for row in (t or [])]
                              tinfo.append({
                                  'rows': len(rows),
                                  'widths': sorted({len(r) for r in rows}),
                                  'head': rows[:3],
                                  'tail': rows[-2:] if rows else [],
                              })
                          page_summaries.append({
                              'page': page_no,
                              'tables': len(tables),
                              'table_info': tinfo,
                              'text_head': clean(page.extract_text() or '')[:600],
                          })
                      item['page_summaries'] = page_summaries
              except Exception as exc:
                  item['error'] = f'{type(exc).__name__}: {exc}'

          # Never infer negative publication evidence from a failed source request.
          (OUT / 'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          md = ['# Pescara source probe', '', 'Automated diagnostic only; failed retrieval is not negative publication evidence.', '']
          for key, item in report['sources'].items():
              md += [f'## {key}', '', f"- landing: `{item.get('landing_url')}`", f"- landing status: `{item.get('landing_status')}`", f"- attachment: `{item.get('attachment_url', '')}`"]
              if item.get('captures'):
                  md.append(f"- captures: `{item['captures']}`")
              if item.get('pages') is not None:
                  md.append(f"- pages: `{item['pages']}`")
              if item.get('error'):
                  md.append(f"- diagnostic error: `{item['error']}`")
              md += ['', '### extracted text head', '', '```text', item.get('text_head', '')[:5000], '```', '']
          (OUT / 'report.md').write_text('\n'.join(md), encoding='utf-8')
          # Do not retain downloaded mutable PDFs in git; hashes and diagnostics only.
          for p in OUT.glob('*.pdf'):
              p.unlink()
          PY
      - name: Commit diagnostic checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/pescara-probe/report.json tmp/pescara-probe/report.md tmp/pescara-probe/listed.txt tmp/pescara-probe/applicants.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No diagnostic changes to commit.'
            exit 0
          fi
          git commit -m 'Checkpoint Pescara official source probe'
          git push origin HEAD:expansion/pescara-2026-09-21
