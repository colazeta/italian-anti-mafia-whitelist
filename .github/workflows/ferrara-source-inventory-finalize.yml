name: Ferrara source inventory finalise

on:
  push:
    branches:
      - expansion/ferrara-2026-09-20
    paths:
      - .github/workflows/ferrara-source-inventory-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-list --count HEAD..origin/main)" = "0"
      - name: Materialise reviewed Ferrara source inventory
        shell: python
        run: |
          import csv
          from pathlib import Path

          path = Path('data/source_registry/source_series_inventory.csv')
          with path.open(newline='', encoding='utf-8') as fh:
              reader = csv.DictReader(fh)
              fieldnames = reader.fieldnames
              rows = list(reader)
          assert fieldnames == [
              'source_series_key','authority_key','regime_code','population_scope','sector_scope',
              'publication_model','series_url','resource_resolution_status','verified_date','notes'
          ], fieldnames
          assert len(rows) == 130, len(rows)
          assert not any(r['authority_key'] == 'ferrara' for r in rows)

          common = {'authority_key':'ferrara','verified_date':'2026-09-20'}
          additions = [
              {
                  **common,
                  'source_series_key':'ferrara-provincial-listed',
                  'regime_code':'WL-REGIME-L190-2012',
                  'population_scope':'listed',
                  'sector_scope':'all',
                  'publication_model':'periodic_attachment',
                  'series_url':'https://prefettura.interno.gov.it/it/prefetture/ferrara/white-list-elenco-imprese-iscritte',
                  'resource_resolution_status':'direct_series_page_resolved',
                  'notes':'Current official ordinary listed page verified 20 September 2026; its single current PDF was captured twice independently with byte-identical SHA-256 0d631e678b7f85bb84d265b09b8de6fcffa09cc4a49b84be37c6c1d7b9dcd6d9. Exact evidence is documented in docs/sources/ferrara-operational-check-2026-09-20.md.',
              },
              {
                  **common,
                  'source_series_key':'ferrara-provincial-applicants',
                  'regime_code':'WL-REGIME-L190-2012',
                  'population_scope':'applicant',
                  'sector_scope':'all',
                  'publication_model':'periodic_attachment',
                  'series_url':'https://prefettura.interno.gov.it/it/prefetture/ferrara/white-list-elenco-imprese-richiedenti',
                  'resource_resolution_status':'direct_series_page_resolved',
                  'notes':'Current official unified applicant publication verified 20 September 2026; its single current PDF was captured twice independently with byte-identical SHA-256 c7437cdeebd1a64d4a6de8bbe5e8c108a688269409b7c772e8a6c87162e588e7 and positively contains ordinary White List requested activities. Exact evidence is documented in docs/sources/ferrara-operational-check-2026-09-20.md.',
              },
              {
                  **common,
                  'source_series_key':'ferrara-reconstruction-listed',
                  'regime_code':'WL-REGIME-ER-SISMA-2012',
                  'population_scope':'listed',
                  'sector_scope':'special_regime',
                  'publication_model':'sector_specific_attachments',
                  'series_url':'https://prefettura.interno.gov.it/it/prefetture/ferrara/white-list-ricostruzione-elenco-imprese-iscritte',
                  'resource_resolution_status':'direct_series_page_resolved',
                  'notes':'Current official reconstruction listed page verified 20 September 2026 positively exposes seven activity-sector PDFs; every attachment was captured twice independently with byte-identical content. Exact URLs, hashes and parser-boundary evidence are documented in docs/sources/ferrara-operational-check-2026-09-20.md.',
              },
              {
                  **common,
                  'source_series_key':'ferrara-reconstruction-applicants',
                  'regime_code':'WL-REGIME-ER-SISMA-2012',
                  'population_scope':'applicant',
                  'sector_scope':'special_regime',
                  'publication_model':'periodic_attachment',
                  'series_url':'https://prefettura.interno.gov.it/it/prefetture/ferrara/white-list-elenco-imprese-richiedenti',
                  'resource_resolution_status':'direct_series_page_resolved',
                  'notes':'The same current official unified applicant PDF positively contains requests for reconstruction-regime h-bis activities as well as ordinary White List activities. This logical source-series binding accounts for the special-regime applicant population without duplicating public applicant observations. Evidence is documented in docs/sources/ferrara-operational-check-2026-09-20.md.',
              },
          ]
          rows.extend(additions)
          rows.sort(key=lambda r: r['source_series_key'])
          assert len(rows) == 134
          assert len({r['source_series_key'] for r in rows}) == 134
          with path.open('w', newline='', encoding='utf-8') as fh:
              writer = csv.DictWriter(fh, fieldnames=fieldnames, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)

          catalog = Path('data/catalog.csv')
          with catalog.open(newline='', encoding='utf-8') as fh:
              reader = csv.DictReader(fh)
              cat_fields = reader.fieldnames
              cat_rows = list(reader)
          by_id = {r['dataset_id']: r for r in cat_rows}
          assert by_id['verified-primary-pages']['record_count'] == '66'
          assert by_id['source-series-inventory']['record_count'] == '130'
          by_id['verified-primary-pages']['record_count'] = '67'
          by_id['source-series-inventory']['record_count'] = '134'
          with catalog.open('w', newline='', encoding='utf-8') as fh:
              writer = csv.DictWriter(fh, fieldnames=cat_fields, lineterminator='\n')
              writer.writeheader()
              writer.writerows(cat_rows)
      - name: Validate source-population accounting
        run: |
          python -m pip install --disable-pip-version-check -e . pytest
          python -m white_list_archive.acquisition.source_population_coverage
          pytest -q tests/test_source_population_coverage.py tests/test_source_registry.py
      - name: Commit permanent source inventory checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source_registry/source_series_inventory.csv data/catalog.csv
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Account for Ferrara White List source populations'
          git push origin HEAD:expansion/ferrara-2026-09-20
