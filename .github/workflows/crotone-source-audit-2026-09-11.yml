name: Crotone source audit 2026-09-11

on:
  push:
    branches:
      - expansion/crotone-2026-09-11
    paths:
      - .github/workflows/crotone-source-audit-2026-09-11.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/crotone-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit runtime
        run: python -m pip install --disable-pip-version-check pdfplumber
      - name: Resolve, capture and audit current official publications
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, html, json, re, time
          from collections import Counter, defaultdict
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          import pdfplumber

          LANDING = 'https://prefettura.interno.gov.it/it/prefetture/crotone/evidenza/white-list'
          STRICT_ID = re.compile(r'^(?:\d{11}|[A-Za-z0-9]{16})$')
          DATE_TOKEN = re.compile(r'\b(?:\d{1,2}[./-]\d{1,2}[./-]\d{2,4}|\d{1,2}\s+[A-Za-zÀ-ÿ]+\s+\d{4})\b')
          PDF_REF = re.compile(r'''(?P<u>(?:https?://[^\"'<>\s]+|/[^\"'<>\s]+)\.pdf(?:\?[^\"'<>\s]*)?)''', re.I)

          def clean(v):
              return ' '.join(html.unescape(str(v or '')).split())

          def fetch(url, accept='*/*'):
              last = None
              for i in range(5):
                  try:
                      req = Request(url, headers={
                          'User-Agent': 'italian-anti-mafia-whitelist/0.1 (+source audit)',
                          'Accept': accept,
                      })
                      with urlopen(req, timeout=90) as r:
                          body = r.read()
                          final_url = r.geturl()
                          ctype = r.headers.get('Content-Type', '')
                      return body, final_url, ctype
                  except Exception as e:
                      last = e
                      if i < 4:
                          time.sleep(5 * (i + 1))
              raise last

          class AnchorParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current_href = None
                  self.current_text = []
                  self.anchors = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'a':
                      self.current_href = dict(attrs).get('href')
                      self.current_text = []
              def handle_data(self, data):
                  if self.current_href is not None:
                      self.current_text.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == 'a' and self.current_href is not None:
                      self.anchors.append((clean(' '.join(self.current_text)), self.current_href))
                      self.current_href = None
                      self.current_text = []

          Path('tmp').mkdir(exist_ok=True)
          landing_body, landing_final, landing_ctype = fetch(LANDING, 'text/html,*/*')
          landing_text = landing_body.decode('utf-8', errors='replace')
          parser = AnchorParser(); parser.feed(landing_text)

          anchor_texts = defaultdict(list)
          candidate_urls = set()
          for text, href in parser.anchors:
              if not href:
                  continue
              absolute = urljoin(landing_final, href)
              anchor_texts[absolute].append(clean(text))
              if '.pdf' in absolute.casefold() or '/sites/default/files/' in absolute.casefold():
                  candidate_urls.add(absolute)
          for m in PDF_REF.finditer(landing_text):
              candidate_urls.add(urljoin(landing_final, html.unescape(m.group('u'))))

          report = {
              'verified_on': '2026-09-11',
              'landing_page': LANDING,
              'landing_final_url': landing_final,
              'landing_content_type': landing_ctype,
              'landing_sha256': hashlib.sha256(landing_body).hexdigest(),
              'landing_contains_update_14_aug_2026': '14 Agosto 2026' in landing_text or '14 agosto 2026' in landing_text,
              'candidate_count': len(candidate_urls),
              'candidates': [],
              'resolved_links': {},
              'sources': {},
          }

          for idx, url in enumerate(sorted(candidate_urls), 1):
              entry = {'url': url, 'anchor_texts': anchor_texts.get(url, [])}
              try:
                  body, final_url, ctype = fetch(url, 'application/pdf,*/*')
                  entry['final_url'] = final_url
                  entry['content_type'] = ctype
                  entry['bytes'] = len(body)
                  entry['sha256'] = hashlib.sha256(body).hexdigest()
                  if not body.startswith(b'%PDF'):
                      entry['error'] = f'non-PDF response {body[:32]!r}'
                      report['candidates'].append(entry)
                      continue
                  path = Path('tmp') / f'crotone-candidate-{idx}.pdf'
                  path.write_bytes(body)
                  with pdfplumber.open(path) as pdf:
                      entry['pages'] = len(pdf.pages)
                      first_text = clean('\n'.join((p.extract_text() or '') for p in pdf.pages[:2]))
                      entry['first_text'] = first_text[:4000]
                      tables = []
                      for pno, page in enumerate(pdf.pages[:3], 1):
                          for tno, table in enumerate(page.extract_tables() or [], 1):
                              rows = []
                              for rno, row in enumerate(table or [], 1):
                                  cells = [clean(x) for x in row]
                                  if any(cells): rows.append({'page':pno,'table':tno,'row':rno,'cells':cells})
                              if rows: tables.extend(rows[:20])
                      entry['sample_table_rows'] = tables[:50]
              except Exception as e:
                  entry['error'] = f'{type(e).__name__}: {e}'
              report['candidates'].append(entry)

          pdf_candidates = [c for c in report['candidates'] if c.get('sha256') and c.get('first_text')]
          applicant_hits = []
          listed_hits = []
          for c in pdf_candidates:
              hay = (' '.join(c.get('anchor_texts', [])) + ' ' + c.get('first_text','') + ' ' + c.get('url','')).casefold()
              if ('richiest' in hay and 'iscrizion' in hay and ('white list' in hay or 'white-list' in hay)):
                  applicant_hits.append(c)
              if ('iscritt' in hay and 'white list' in hay and 'richiest' not in hay):
                  listed_hits.append(c)
          if len(applicant_hits) == 1:
              report['resolved_links']['applicants'] = {k: applicant_hits[0].get(k) for k in ('url','final_url','sha256','bytes','pages','anchor_texts')}
          if len(listed_hits) == 1:
              report['resolved_links']['listed'] = {k: listed_hits[0].get(k) for k in ('url','final_url','sha256','bytes','pages','anchor_texts')}

          for scope, link in report['resolved_links'].items():
              source = next(c for c in pdf_candidates if c.get('sha256') == link['sha256'])
              body, _, _ = fetch(source['url'], 'application/pdf,*/*')
              path = Path('tmp') / f'crotone-{scope}.pdf'; path.write_bytes(body)
              info = {k: source.get(k) for k in ('url','final_url','sha256','bytes','pages','anchor_texts')}
              table_shapes = Counter(); page_table_counts=[]; page_text_lengths=[]; samples=[]; all_rows=[]
              with pdfplumber.open(path) as pdf:
                  for pno, page in enumerate(pdf.pages, 1):
                      text = clean(page.extract_text() or '')
                      page_text_lengths.append(len(text))
                      tables = page.extract_tables() or []
                      page_table_counts.append(len(tables))
                      for tno, table in enumerate(tables, 1):
                          for rno, row in enumerate(table or [], 1):
                              cells = [clean(x) for x in row]
                              if not any(cells): continue
                              table_shapes[len(cells)] += 1
                              rec={'page':pno,'table':tno,'row':rno,'cells':cells}; all_rows.append(rec)
                              if len(samples) < 120: samples.append(rec)
              info['table_shape_counts']=dict(sorted(table_shapes.items()))
              info['page_table_counts']=page_table_counts
              info['page_text_lengths']=page_text_lengths
              info['nonempty_table_rows']=len(all_rows)
              info['sample_rows']=samples
              info['rows_with_date_token']=sum(any(DATE_TOKEN.search(c) for c in r['cells']) for r in all_rows)
              info['strict_identifier_like_cells']=sum(any(STRICT_ID.fullmatch(c) for c in r['cells']) for r in all_rows)
              info['unique_row_lengths']=sorted({len(r['cells']) for r in all_rows})
              report['sources'][scope]=info

          Path('tmp/crotone-source-audit.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Commit recoverable audit checkpoint
        run: |
          rm -f tmp/crotone-*.pdf
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/crotone-source-audit.json
          git commit -m 'Checkpoint Crotone source audit'
          git push origin HEAD:expansion/crotone-2026-09-11
