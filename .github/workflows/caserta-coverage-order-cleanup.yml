name: Caserta coverage order cleanup

on:
  push:
    branches:
      - expansion/caserta-2026-09-12
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-order:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: expansion/caserta-2026-09-12
          fetch-depth: 0
      - name: Restore pre-existing national coverage order
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/monitoring/national_coverage.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          rows = data['prefectures']
          positions = {row['authority_key']: idx for idx, row in enumerate(rows)}
          ia = positions['la-spezia']
          ib = positions['laquila']
          if ib != ia + 1:
              raise SystemExit(f'unexpected order/adjacency: la-spezia={ia}, laquila={ib}')
          rows[ia], rows[ib] = rows[ib], rows[ia]
          if [row['authority_key'] for row in rows[ia:ib + 1]] != ['laquila', 'la-spezia']:
              raise SystemExit('failed to restore canonical pre-Caserta ordering')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit order-only cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/monitoring/national_coverage.json
          git diff --cached --quiet && { echo 'Expected order cleanup produced no diff' >&2; exit 1; }
          git commit -m 'Restore canonical national coverage ordering'
          git push origin HEAD:expansion/caserta-2026-09-12
