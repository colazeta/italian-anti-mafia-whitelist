name: Napoli layout audit

on:
  push:
    branches:
      - 'expansion/napoli-2026-09-13'
    paths:
      - '.github/workflows/napoli-layout-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install parser runtime
        run: |
          python -m pip install -e '.[publication]'

      - name: Fetch pinned Napoli sources and audit full table geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/napoli_layout_audit
          curl --fail --location --silent --show-error --retry 2 --retry-all-errors \
            --user-agent 'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelist/1.0; +https://github.com/colazeta/italian-anti-mafia-whitelist)' \
            -o tmp/napoli_layout_audit/listed.pdf \
            'https://prefettura.interno.gov.it/sites/default/files/79/2026-09/whitelistprefnapoli_11_settembre_26.pdf'
          curl --fail --location --silent --show-error --retry 2 --retry-all-errors \
            --user-agent 'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelist/1.0; +https://github.com/colazeta/italian-anti-mafia-whitelist)' \
            -o tmp/napoli_layout_audit/applicants.pdf \
            'https://prefettura.interno.gov.it/sites/default/files/79/2026-09/ditterichiedenti_wl_11_settembre_26.pdf'
          echo '93a8635c0bd9b00587f9cc60c52752061bd239a7c16cb34b64a11e495a0ab4be  tmp/napoli_layout_audit/listed.pdf' | sha256sum -c -
          echo '053be2500b07a7da536c344aede12084dde9b7cf28b4717af99764cbd05e7e6b  tmp/napoli_layout_audit/applicants.pdf' | sha256sum -c -

          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json
          import re
          import pdfplumber

          root = Path('tmp/napoli_layout_audit')
          expected = {'listed': (60, 2259), 'applicants': (215, 2571)}
          report = {'prefecture': 'Napoli', 'reference_date': '2026-09-11', 'sources': {}}

          def clean(value):
              return re.sub(r'\s+', ' ', value or '').strip()

          for source, (expected_pages, terminal_ordinal) in expected.items():
              path = root / f'{source}.pdf'
              table_counts = Counter()
              row_widths = Counter()
              ordinal_counts = Counter()
              page_ordinal_counts = []
              page_summaries = []
              samples = []
              with pdfplumber.open(path) as pdf:
                  if len(pdf.pages) != expected_pages:
                      raise RuntimeError(f'{source} page-count drift: {len(pdf.pages)} != {expected_pages}')
                  for page_number, page in enumerate(pdf.pages, start=1):
                      tables = page.extract_tables() or []
                      table_counts[len(tables)] += 1
                      page_ordinals = []
                      for table_number, table in enumerate(tables, start=1):
                          for row_number, raw_row in enumerate(table or [], start=1):
                              row = [clean(cell) for cell in (raw_row or [])]
                              row_widths[len(row)] += 1
                              if not row:
                                  continue
                              m = re.fullmatch(r'\d{1,4}', row[0])
                              if not m:
                                  continue
                              ordinal = int(m.group(0))
                              if 1 <= ordinal <= terminal_ordinal:
                                  ordinal_counts[ordinal] += 1
                                  page_ordinals.append(ordinal)
                                  if len(samples) < 12 or ordinal > terminal_ordinal - 6:
                                      samples.append({
                                          'page': page_number,
                                          'table': table_number,
                                          'row': row_number,
                                          'ordinal': ordinal,
                                          'cells': row,
                                      })
                      page_ordinal_counts.append(len(page_ordinals))
                      page_summaries.append({
                          'page': page_number,
                          'table_count': len(tables),
                          'ordinal_count': len(page_ordinals),
                          'first_ordinal': page_ordinals[0] if page_ordinals else None,
                          'last_ordinal': page_ordinals[-1] if page_ordinals else None,
                      })

              missing = [n for n in range(1, terminal_ordinal + 1) if ordinal_counts[n] == 0]
              duplicates = {str(n): count for n, count in ordinal_counts.items() if count != 1}
              report['sources'][source] = {
                  'expected_pages': expected_pages,
                  'terminal_ordinal': terminal_ordinal,
                  'table_count_histogram': dict(sorted(table_counts.items())),
                  'row_width_histogram': dict(sorted(row_widths.items())),
                  'semantic_row_count': sum(ordinal_counts.values()),
                  'unique_ordinals': len(ordinal_counts),
                  'missing_ordinals': missing,
                  'non_unit_ordinal_counts': duplicates,
                  'page_ordinal_counts': page_ordinal_counts,
                  'pages_without_semantic_rows': [p['page'] for p in page_summaries if p['ordinal_count'] == 0],
                  'pages_with_nonstandard_table_count': [p for p in page_summaries if p['table_count'] != 1],
                  'first_pages': page_summaries[:5],
                  'last_pages': page_summaries[-5:],
                  'sample_rows': samples,
              }

          (root / 'layout-report.json').write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY

      - name: Upload Napoli layout audit
        uses: actions/upload-artifact@v4
        with:
          name: napoli-layout-audit
          path: tmp/napoli_layout_audit/layout-report.json
          if-no-files-found: error
