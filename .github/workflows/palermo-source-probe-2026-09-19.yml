name: Palermo source probe 2026-09-19

on:
  push:
    branches:
      - expansion/palermo-2026-09-19
    paths:
      - .github/workflows/palermo-source-probe-2026-09-19.yml
      - tmp/palermo-probe-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install probe dependencies
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf openpyxl xlrd
      - name: Resolve and capture official Palermo sources
        env:
          LANDING: https://prefettura.interno.gov.it/it/prefetture/palermo/evidenza/white-list
        run: |
          set -euo pipefail
          rm -rf tmp/palermo-probe
          mkdir -p tmp/palermo-probe
          python - <<'PY'
          import hashlib, io, json, os, pathlib, re, subprocess, time
          from urllib.parse import urljoin, urlparse, parse_qsl, urlencode, urlunparse
          import requests
          from bs4 import BeautifulSoup

          landing = os.environ['LANDING']
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel;q=0.9,*/*;q=0.8',
              'Cache-Control': 'no-cache',
              'Pragma': 'no-cache',
          }
          session = requests.Session()
          response = session.get(landing, headers=headers, timeout=45)
          response.raise_for_status()
          html = response.text
          pathlib.Path('tmp/palermo-probe/landing.html').write_text(html, encoding='utf-8')
          soup = BeautifulSoup(html, 'html.parser')

          anchors = []
          for a in soup.find_all('a', href=True):
              text = ' '.join(a.stripped_strings)
              href = urljoin(landing, a['href'])
              low = (text + ' ' + href).lower()
              if any(token in low for token in ('whitelistelencounico', 'richiedent', 'imprese iscritte', 'elenco unico')):
                  anchors.append({'text': text, 'href': href})
          print('OFFICIAL LANDING', landing)
          print('LANDING STATUS', response.status_code, 'BYTES', len(response.content))
          for i, anchor in enumerate(anchors):
              print(f'ANCHOR[{i}] {anchor["text"]!r} -> {anchor["href"]}')
          pathlib.Path('tmp/palermo-probe/anchors.json').write_text(json.dumps(anchors, ensure_ascii=False, indent=2), encoding='utf-8')

          candidates = {'listed': [], 'applicants': []}
          for anchor in anchors:
              low = (anchor['text'] + ' ' + anchor['href']).lower()
              if 'richiedent' in low:
                  candidates['applicants'].append(anchor)
              elif 'whitelistelencounico' in low or 'imprese iscritte' in low or 'elenco unico' in low:
                  candidates['listed'].append(anchor)
          targets = {}
          for population, items in candidates.items():
              dedup = []
              seen = set()
              for item in items:
                  if item['href'] not in seen:
                      seen.add(item['href']); dedup.append(item)
              if len(dedup) != 1:
                  raise SystemExit(f'Expected exactly one positive {population} resource; got {dedup!r}')
              targets[population] = dedup[0]

          manifest = []
          for index, population in enumerate(('listed','applicants'), 1):
              anchor = targets[population]
              url = anchor['href']
              captures = []
              headers_seen = []
              for attempt in (1, 2):
                  parsed = urlparse(url)
                  query = list(parse_qsl(parsed.query, keep_blank_values=True))
                  query.append(('_wl_probe', f'palermo-20260919-{index}-{attempt}-{time.time_ns()}'))
                  fetch_url = urlunparse(parsed._replace(query=urlencode(query)))
                  fetched = session.get(fetch_url, headers={**headers, 'Referer': landing}, timeout=90, allow_redirects=True)
                  fetched.raise_for_status()
                  captures.append(fetched.content)
                  headers_seen.append({
                      'status': fetched.status_code,
                      'content_type': fetched.headers.get('Content-Type'),
                      'content_disposition': fetched.headers.get('Content-Disposition'),
                      'last_modified': fetched.headers.get('Last-Modified'),
                      'etag': fetched.headers.get('ETag'),
                      'final_url': fetched.url,
                  })
              if captures[0] != captures[1]:
                  raise SystemExit(f'Independent captures differ for {population}: {url}')
              data = captures[0]
              sha = hashlib.sha256(data).hexdigest()
              if data.startswith(b'%PDF-'):
                  kind = 'pdf'; suffix = '.pdf'
              elif data.startswith(b'PK\x03\x04'):
                  kind = 'zip-ooxml'; suffix = '.xlsx'
              elif data.startswith(bytes.fromhex('D0CF11E0A1B11AE1')):
                  kind = 'ole-compound'; suffix = '.xls'
              else:
                  kind = 'unknown'; suffix = '.bin'
              out = pathlib.Path(f'tmp/palermo-probe/{population}{suffix}')
              out.write_bytes(data)
              item = {'population': population, 'label': anchor['text'], 'url': url, 'bytes': len(data), 'sha256': sha, 'kind': kind, 'headers': headers_seen}
              manifest.append(item)
              print('SOURCE', population, 'LABEL', repr(anchor['text']), 'URL', url)
              print('BYTES', len(data), 'SHA256', sha, 'KIND', kind, 'HEADERS', headers_seen)

              dump = []
              if kind == 'pdf':
                  from pypdf import PdfReader
                  reader = PdfReader(io.BytesIO(data))
                  print('PDF', population, 'PAGES', len(reader.pages))
                  layout_path = pathlib.Path(f'tmp/palermo-probe/{population}-layout.txt')
                  subprocess.run(['pdftotext','-layout',str(out),str(layout_path)], check=True)
                  layout = layout_path.read_text(encoding='utf-8', errors='replace')
                  page_texts = layout.split('\f')
                  print('LAYOUT_CHARS', population, len(layout), 'LAYOUT_PAGES', len([p for p in page_texts if p.strip()]))
                  for page_no, text in enumerate(page_texts, 1):
                      if not text.strip():
                          continue
                      lines = [line.rstrip() for line in text.splitlines()]
                      nonempty = [line for line in lines if line.strip()]
                      print(f'PAGE {population} {page_no} NONEMPTY {len(nonempty)} MAXWIDTH {max(map(len, nonempty), default=0)}')
                      if page_no <= 2 or page_no > max(0, len(page_texts)-3):
                          print(f'--- {population} PAGE {page_no} START ---')
                          for line in nonempty[:80]:
                              print(line[:500])
                          print(f'--- {population} PAGE {page_no} END ---')
                  dump.append(layout)
              elif kind == 'zip-ooxml':
                  from openpyxl import load_workbook
                  wb = load_workbook(io.BytesIO(data), read_only=True, data_only=True)
                  print('WORKBOOK', population, 'SHEETS', wb.sheetnames)
                  for ws in wb.worksheets:
                      print('SHEET', population, repr(ws.title), 'MAX_ROW', ws.max_row, 'MAX_COLUMN', ws.max_column)
                      for row_num, row in enumerate(ws.iter_rows(values_only=True), 1):
                          values = ['' if value is None else str(value).replace('\n',' ').replace('\r',' ') for value in row]
                          if any(value.strip() for value in values) and (row_num <= 60 or row_num > max(0, ws.max_row-20)):
                              print(f'ROW {population} {ws.title} {row_num}: ' + '\t'.join(values))
              elif kind == 'ole-compound':
                  import xlrd
                  wb = xlrd.open_workbook(file_contents=data)
                  print('XLS', population, 'SHEETS', wb.sheet_names())
                  for ws in wb.sheets():
                      print('SHEET', population, repr(ws.name), 'NROWS', ws.nrows, 'NCOLS', ws.ncols)
              else:
                  raise SystemExit(f'Unknown source magic for {population}: {data[:32].hex()}')

          pathlib.Path('tmp/palermo-probe/manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: palermo-source-probe
          path: tmp/palermo-probe/
          if-no-files-found: error
          retention-days: 7
