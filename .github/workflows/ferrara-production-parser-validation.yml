name: Ferrara production parser validation

on:
  push:
    branches:
      - expansion/ferrara-2026-09-20
    paths:
      - src/white_list_archive/parsers/ferrara_tables.py
      - .github/workflows/ferrara-production-parser-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser runtime
        run: python -m pip install --disable-pip-version-check -e . requests pdfplumber==0.11.10
      - name: Validate Ferrara parser against byte-pinned official sources
        shell: python
        run: |
          import hashlib
          import secrets
          import tempfile
          from pathlib import Path

          import requests

          from white_list_archive.parsers.ferrara_tables import (
              parse_ferrara_applicants,
              parse_ferrara_ordinary,
              parse_ferrara_reconstruction_bundle,
          )

          ORDINARY = (
              'https://prefettura.interno.gov.it/sites/default/files/0/2026-08/white-list-provinciali-elenco-imprese-iscritte-agg11112024_0.pdf',
              '0d631e678b7f85bb84d265b09b8de6fcffa09cc4a49b84be37c6c1d7b9dcd6d9',
          )
          APPLICANTS = (
              'https://prefettura.interno.gov.it/sites/default/files/0/2026-08/white-list-elenco-imprese-richiedenti_0.pdf',
              'c7437cdeebd1a64d4a6de8bbe5e8c108a688269409b7c772e8a6c87162e588e7',
          )
          RECONSTRUCTION = {
              'A': ('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-a-fornitura-moduli-prefabbricati-e-dei-relativi-arredi_is_0.pdf', '4fdf292b1538892c7b5ff79d3c0c14e0ed3b5830effb791316b0fddb8c90ae01'),
              'B': ('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-b-demolizione-di-edifici-ed-altre-strutture_is_0.pdf', '97d9af0d587af0b7d93d31df33bd612440bf5be5b48b57872d436e2afeb164ec'),
              'C': ('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-c-movimenti-di-terra_is_0.pdf', '99f519101dccff84dddd9753f0d6fa27170c33b1982858afe9fdf9ebbc63c57e'),
              'D': ('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-d-noleggio-con-coducente-mezzi-speciali_is_0.pdf', '07c27b38e48a879aa0d1efff4710bf7dbbf1bb323e59f62eb0b0b796a75a46d8'),
              'E': ('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-e-fornitura-e-posa-in-opera-impianti-fotovoltaici_is_0.pdf', '9cea950d37f653d0356edb9a46a7f43665a382e771c969bc93f7027f95fecf9e'),
              'F': ('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-f-fornitura-e-manutenzione-impianti-tecnologici_is_0.pdf', 'ac7dd77f1c4633c27a62c0ad7e074f507a10b091a327c2fc1072cfb52fd45664'),
              'G': ('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-g-fornitura-beni-necessari-ricostruzione_is_0.pdf', '0657c7e0f0b9fb8ad7f0b341682716d695132e61131adc92407627a5cae82bae'),
          }

          def get_twice(url, expected_sha):
              bodies = []
              for _ in range(2):
                  response = requests.get(
                      url,
                      headers={
                          'User-Agent': 'italian-anti-mafia-whitelist/ferrara-production-parser-validation',
                          'Cache-Control': 'no-cache',
                          'Pragma': 'no-cache',
                      },
                      params={'validation_nonce': secrets.token_hex(8)},
                      timeout=90,
                  )
                  response.raise_for_status()
                  digest = hashlib.sha256(response.content).hexdigest()
                  assert digest == expected_sha, (url, expected_sha, digest, len(response.content))
                  bodies.append(response.content)
              assert bodies[0] == bodies[1], f'independent captures differ for {url}'
              return bodies[0]

          def cfg(source_key, resource_url, sha256, register_key):
              return {
                  'source_key': source_key,
                  'authority_key': 'ferrara',
                  'authority_name': 'Prefettura di Ferrara',
                  'register_key': register_key,
                  'register_name': register_key,
                  'population_scope': 'all',
                  'reference_date': '2026-09-20',
                  'source_page_url': 'https://prefettura.interno.gov.it/it/prefetture/ferrara',
                  'resource_url': resource_url,
                  'sha256': sha256,
              }

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              ordinary_path = root / 'ordinary.pdf'
              ordinary_path.write_bytes(get_twice(*ORDINARY))
              ordinary = parse_ferrara_ordinary(
                  ordinary_path,
                  cfg('ferrara-provincial-listed', ORDINARY[0], ORDINARY[1], 'ferrara-ordinary'),
              )
              assert ordinary.diagnostics == {
                  'parser': 'ferrara_ordinary',
                  'parser_version': '1',
                  'source_pages': 87,
                  'public_records': 868,
                  'continuation_rows': 28,
                  'status_counts': {'listed': 717, 'renewal_update_in_progress': 150, 'other_or_unknown': 1},
                  'identifier_coverage': 860,
                  'date_anomalies': 2,
              }

              applicants_path = root / 'applicants.pdf'
              applicants_path.write_bytes(get_twice(*APPLICANTS))
              applicants = parse_ferrara_applicants(
                  applicants_path,
                  cfg('ferrara-provincial-applicants', APPLICANTS[0], APPLICANTS[1], 'ferrara-ordinary'),
              )
              assert len(applicants.records) == 21
              assert applicants.diagnostics['identifier_coverage'] == 21
              assert applicants.diagnostics['shared_publication_no_duplicate_ingest'] is True
              assert all(record['source_status'] == 'pending' for record in applicants.records)
              assert all(record['source_fields']['logical_series'] == [
                  'ferrara-provincial-applicants', 'ferrara-reconstruction-applicants'
              ] for record in applicants.records)

              recon_paths = {}
              member_hashes = {}
              for sector, (url, expected_sha) in RECONSTRUCTION.items():
                  path = root / f'reconstruction-{sector}.pdf'
                  path.write_bytes(get_twice(url, expected_sha))
                  recon_paths[sector] = path
                  member_hashes[sector] = expected_sha
              reconstruction = parse_ferrara_reconstruction_bundle(
                  recon_paths,
                  cfg(
                      'ferrara-reconstruction-listed',
                      'https://prefettura.interno.gov.it/it/prefetture/ferrara/white-list-ricostruzione-elenco-imprese-iscritte',
                      'bundle:' + hashlib.sha256(''.join(member_hashes[k] for k in sorted(member_hashes)).encode()).hexdigest(),
                      'ferrara-reconstruction',
                  ),
              )
              assert reconstruction.diagnostics == {
                  'parser': 'ferrara_reconstruction_bundle',
                  'parser_version': '1',
                  'physical_sector_observations': 1161,
                  'public_records': 697,
                  'status_counts': {'listed': 542, 'renewal_update_in_progress': 153, 'other_or_unknown': 2},
                  'identifier_coverage': 683,
                  'multi_sector_groups': 282,
                  'date_anomalies': 15,
                  'bundle_sectors': ['A', 'B', 'C', 'D', 'E', 'F', 'G'],
              }

              total = len(ordinary.records) + len(applicants.records) + len(reconstruction.records)
              assert total == 1586, total
              print('Ferrara parser boundary validated: ordinary=868 applicants=21 reconstruction=697 total=1586')
