name: Genova anomaly audit

on:
  push:
    branches:
      - expansion/genova-2026-09-12
    paths:
      - .github/workflows/genova-anomaly-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/genova-2026-09-12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pdfplumber
      - name: Inspect bounded known anomalies
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, re, tempfile, requests, pdfplumber
          src=json.loads(pathlib.Path('tmp/genova_source_profile.json').read_text())
          session=requests.Session(); session.headers.update({'User-Agent':'italian-anti-mafia-whitelist anomaly audit/1.0'})
          strict=re.compile(r'^(?:\d{11}|[A-Z0-9]{16})$')
          def clean(v): return re.sub(r'\s+',' ',(v or '').replace('\u00a0',' ')).strip()
          report={'authority_key':'genova','audited_on':'2026-09-12','targets':{},'no_strict_identifier':{}}
          with tempfile.TemporaryDirectory(prefix='genova-anomaly-') as td:
            td=pathlib.Path(td)
            for scope,pages in {'listed':[47,92], 'applicant':[7]}.items():
              cfg=src['sources'][scope]; r=session.get(cfg['resource_url'],timeout=(15,120)); r.raise_for_status()
              if hashlib.sha256(r.content).hexdigest()!=cfg['sha256']: raise SystemExit(f'{scope} drift')
              p=td/f'{scope}.pdf'; p.write_bytes(r.content)
              all_no_id=[]
              with pdfplumber.open(p) as pdf:
                for page_no,page in enumerate(pdf.pages,1):
                  tables=page.extract_tables() or []
                  if page_no in pages:
                    report['targets'][f'{scope}-page-{page_no}']={
                      'text': clean(page.extract_text() or ''),
                      'tables': [[[clean(c) for c in row] for row in (table or [])] for table in tables]
                    }
                  for table_no,table in enumerate(tables,1):
                    for row_no,row in enumerate(table or [],1):
                      cells=[clean(c) for c in row]
                      if not any(cells): continue
                      folded=' | '.join(cells).casefold()
                      if any(t in folded for t in ('ragione sociale','codice fiscale','partita iva','data iscrizione','data di presentazione')): continue
                      ids=[clean(c).upper().replace(' ','') for c in cells if strict.fullmatch(clean(c).upper().replace(' ',''))]
                      if not ids:
                        all_no_id.append({'page':page_no,'table':table_no,'row':row_no,'cells':cells})
              report['no_strict_identifier'][scope]=all_no_id
          path=pathlib.Path('tmp/genova_anomaly_audit.json'); path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Checkpoint anomaly audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/genova_anomaly_audit.json
          if ! git diff --cached --quiet; then git commit -m 'Checkpoint Genova anomaly audit'; git push origin HEAD:expansion/genova-2026-09-12; fi
