name: Genova Pages gate staging

on:
  push:
    branches:
      - expansion/genova-2026-09-12
    paths:
      - .github/workflows/genova-nonworkflow-finalise.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/genova-2026-09-12
          fetch-depth: 0
      - name: Build fail-closed permanent Pages gate candidate
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path('.github/workflows/public-pages.yml')
          text = src.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one Pages replacement target, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "      - 'src/white_list_archive/parsers/catania_openxml.py'\n",
              "      - 'src/white_list_archive/parsers/catania_openxml.py'\n      - 'src/white_list_archive/parsers/genova_tables.py'\n",
          )
          replace_once("          assert reg['meta']['record_count'] == 28838\n", "          assert reg['meta']['record_count'] == 29600\n")
          replace_once("'caserta','catania'}\n", "'caserta','catania','genova'}\n")
          replace_once("'caserta-ordinary','catania-ordinary'\n", "'caserta-ordinary','catania-ordinary','genova-ordinary'\n")
          replace_once("          assert reg['meta']['authority_count'] == 29\n", "          assert reg['meta']['authority_count'] == 30\n")
          replace_once("          assert reg['meta']['register_count'] == 30\n", "          assert reg['meta']['register_count'] == 31\n")
          replace_once("          assert pref['meta']['published_count'] == 29\n", "          assert pref['meta']['published_count'] == 30\n")
          replace_once(
              "          catania = [x for x in pref['prefectures'] if x['authority_key'] == 'catania']\n          assert len(catania) == 1 and catania[0]['mapped'] and catania[0]['published'] and catania[0]['series_count'] == 2\n",
              "          catania = [x for x in pref['prefectures'] if x['authority_key'] == 'catania']\n          assert len(catania) == 1 and catania[0]['mapped'] and catania[0]['published'] and catania[0]['series_count'] == 2\n          genova = [x for x in pref['prefectures'] if x['authority_key'] == 'genova']\n          assert len(genova) == 1 and genova[0]['mapped'] and genova[0]['published'] and genova[0]['series_count'] == 2\n",
          )

          out = Path('tmp/public-pages-genova-final.yml')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(text, encoding='utf-8')
          PY
          diff -u .github/workflows/public-pages.yml tmp/public-pages-genova-final.yml || true
      - name: Commit staged Pages gate blob
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/public-pages-genova-final.yml
          git diff --cached --check
          git commit -m 'Stage validated Genova Pages gate'
          git push origin HEAD:expansion/genova-2026-09-12
