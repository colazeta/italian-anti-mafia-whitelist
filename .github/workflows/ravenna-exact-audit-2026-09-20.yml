name: Ravenna exact audit 2026-09-20

on:
  push:
    branches: [expansion/ravenna-2026-09-20]
    paths: ['.github/workflows/ravenna-exact-audit-2026-09-20.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/ravenna-2026-09-20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen-source exact audit
        run: python tmp/ravenna_exact_audit.py
      - name: Commit exact audit receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/ravenna-exact-audit.json
          git diff --cached --quiet && exit 0
          git commit -m 'Checkpoint Ravenna exact semantic audit'
          git push origin HEAD:expansion/ravenna-2026-09-20
