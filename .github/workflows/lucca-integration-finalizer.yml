name: Lucca integration finalizer

on:
  push:
    branches:
      - expansion/lucca-2026-09-19
    paths:
      - .github/workflows/lucca-integration-finalizer.yml

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact expansion head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical base and branch scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "expansion/lucca-2026-09-19"
          git fetch origin main
          BASE=$(git merge-base HEAD origin/main)
          MAIN=$(git rev-parse origin/main)
          if [ "$BASE" != "$MAIN" ]; then
            echo "Lucca branch is no longer based on current main: base=$BASE main=$MAIN" >&2
            exit 1
          fi
          git diff --name-only origin/main...HEAD | tee /tmp/lucca-pre-finalize-scope.txt
          if grep -Ev '^(\.github/workflows/lucca-|src/white_list_archive/parsers/lucca_tables\.py|tests/test_lucca_parser_semantics\.py|docs/sources/lucca-operational-check-2026-09-19\.md)$' /tmp/lucca-pre-finalize-scope.txt | grep -q .; then
            echo "Unexpected pre-finalization branch scope" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation runtime
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source_file; do
            [ -n "$source_file" ] && sudo rm -f "$source_file"
          done < <(grep -rlE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils antiword
          python -m pip install -e '.[publication]'
          python -m pip install --disable-pip-version-check requests pytest

      - name: Re-verify exact Lucca source bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, time
          import requests
          sources={
            'listed':('https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco-imprese-iscritte-agg-l-40-del-2020-al-11-settembre-2026.pdf','d5a0f11c68a0a3dfb01d10b30f35130c7899795bb46e0239226ad5ea575b5c67',532170),
            'applicants':('https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco-imprese-richiedenti-agg-l-40-del-2020-al-08-settembre-2026.pdf','fd9cdc163e09c411ce5fd1f716d85811a15503f3527ac0f5abdaec909de4f084',179370),
          }
          h={'User-Agent':'Mozilla/5.0 (compatible; italian-anti-mafia-whitelist source verification)','Cache-Control':'no-cache','Pragma':'no-cache'}
          for key,(url,expected,size) in sources.items():
            observed=[]
            for _ in range(2):
              r=requests.get(url,headers=h,timeout=60); r.raise_for_status(); body=r.content
              digest=hashlib.sha256(body).hexdigest(); observed.append((len(body),digest))
              if len(body)!=size or digest!=expected:
                raise SystemExit(f'{key}: official source drift: {observed[-1]}')
              time.sleep(1)
            if observed[0] != observed[1]:
              raise SystemExit(f'{key}: independent captures differ')
            print(key, observed[0])
          PY

      - name: Materialise permanent Lucca integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from pathlib import Path

          root=Path('.')
          landing='https://prefettura.interno.gov.it/it/prefetture/lucca/elenco-imprese-iscritte-e-richiedenti'
          listed_url='https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco-imprese-iscritte-agg-l-40-del-2020-al-11-settembre-2026.pdf'
          applicants_url='https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco-imprese-richiedenti-agg-l-40-del-2020-al-08-settembre-2026.pdf'
          listed_sha='d5a0f11c68a0a3dfb01d10b30f35130c7899795bb46e0239226ad5ea575b5c67'
          applicants_sha='fd9cdc163e09c411ce5fd1f716d85811a15503f3527ac0f5abdaec909de4f084'

          # Parser review evidence may be richer than the closed public source_fields contract.
          # Keep identifier raw evidence in identifier_field_raw and remove only redundant
          # source_fields keys before public integration; no values are repaired or inferred.
          parser_path=root/'src/white_list_archive/parsers/lucca_tables.py'
          text=parser_path.read_text(encoding='utf-8')
          if text.count('                "identifier_raw_source": identifier_raw,\n') != 2:
              raise SystemExit('Unexpected Lucca identifier source-field anchor count')
          text=text.replace('                "identifier_raw_source": identifier_raw,\n','')
          if text.count('                "expiry_cell_raw": expiry_raw,\n') != 1:
              raise SystemExit('Unexpected Lucca expiry-cell source-field anchor count')
          text=text.replace('                "expiry_cell_raw": expiry_raw,\n','')
          parser_path.write_text(text,encoding='utf-8')

          # Publication config: two positively evidenced populations, one ordinary register.
          cfg_path=root/'data/publication/multi_prefecture_pilot.json'
          cfg=json.loads(cfg_path.read_text(encoding='utf-8'))
          if any(s.get('authority_key')=='lucca' for s in cfg['sources']):
              raise SystemExit('Lucca already present in publication config')
          cfg['sources'].extend([
            {
              'authority_key':'lucca','authority_name':'Prefettura di Lucca',
              'register_key':'lucca-ordinary','register_name':'White List ordinaria',
              'reference_date':'2026-09-11','source_page_url':landing,
              'last_source_update':'2026-09-15',
              'last_source_update_basis':"official landing-page 'Ultimo aggiornamento' 15 September 2026, 12:12; source reference_date follows the listed attachment marker and is not promoted to a company decision/legal-effect date",
              'approval_mode':'raw_sha256','source_key':'lucca-listed','parser':'lucca_listed',
              'population_scope':'listed','resource_url':listed_url,'sha256':listed_sha,
              'expected_source_rows':331,
              'notes':'Dedicated official listed PDF positively exposed by the current landing page. 331 table rows yield 229 listed and 102 renewal/update-in-progress observations. Structured identifier coverage is 324/331; seven source rows remain raw-only. No malformed identifier or missing expiry value is repaired inferentially.'
            },
            {
              'authority_key':'lucca','authority_name':'Prefettura di Lucca',
              'register_key':'lucca-ordinary','register_name':'White List ordinaria',
              'reference_date':'2026-09-08','source_page_url':landing,
              'last_source_update':'2026-09-15',
              'last_source_update_basis':"official landing-page 'Ultimo aggiornamento' 15 September 2026, 12:12; source reference_date follows the applicant attachment marker and is not promoted to a company decision/legal-effect date",
              'approval_mode':'raw_sha256','source_key':'lucca-applicants','parser':'lucca_applicants',
              'population_scope':'applicant','resource_url':applicants_url,'sha256':applicants_sha,
              'expected_source_rows':71,
              'notes':'Dedicated official applicant PDF positively exposed by the current landing page. All 71 table rows are pending observations and structured identifier coverage is 69/71; the two malformed numeric identifiers remain raw-only. Applicant coverage is positive source evidence, never inferred from absence.'
            }
          ])
          cfg_path.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Verified landing page.
          pages_path=root/'data/source_registry/verified_primary_pages.csv'
          with pages_path.open(encoding='utf-8',newline='') as f:
              reader=csv.DictReader(f); fields=reader.fieldnames; rows=list(reader)
          if any(r['authority_key']=='lucca' for r in rows):
              raise SystemExit('Lucca already in verified primary pages')
          rows.append({'authority_key':'lucca','landing_url':landing,'verification_date':'2026-09-19','verification_status':'verified'})
          rows.sort(key=lambda r:r['authority_key'])
          with pages_path.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)

          # Qualified recurring source series.
          series_path=root/'data/source_registry/source_series_inventory.csv'
          with series_path.open(encoding='utf-8',newline='') as f:
              reader=csv.DictReader(f); fields=reader.fieldnames; series=list(reader)
          if any(r['authority_key']=='lucca' for r in series):
              raise SystemExit('Lucca already in source series inventory')
          series.extend([
            {
              'source_series_key':'lucca-applicants','authority_key':'lucca','regime_code':'WL-REGIME-L190-2012','population_scope':'applicant','sector_scope':'all','publication_model':'periodic_attachment','series_url':landing,'resource_resolution_status':'landing_page_resolved','verified_date':'2026-09-19',
              'notes':'Current official Lucca page directly re-verified 19 September 2026 and positively exposes the dedicated applicant PDF marked Aggiornato al 08/09/2026. Exact bytes, denominator and conservative anomaly handling are documented in docs/sources/lucca-operational-check-2026-09-19.md.'
            },
            {
              'source_series_key':'lucca-listed','authority_key':'lucca','regime_code':'WL-REGIME-L190-2012','population_scope':'listed','sector_scope':'all','publication_model':'periodic_attachment','series_url':landing,'resource_resolution_status':'landing_page_resolved','verified_date':'2026-09-19',
              'notes':'Current official Lucca page directly re-verified 19 September 2026 and positively exposes the dedicated listed PDF marked Aggiornato al 11/09/2026. Exact bytes, denominator and conservative status/identifier handling are documented in docs/sources/lucca-operational-check-2026-09-19.md.'
            }
          ])
          series.sort(key=lambda r:r['source_series_key'])
          with series_path.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(series)

          # Dataset catalogue counts.
          catalog_path=root/'data/catalog.csv'
          cat=catalog_path.read_text(encoding='utf-8')
          anchors={
            'verified-primary-pages,source_registry,data/source_registry/verified_primary_pages.csv,csv,national,in_progress,verified_primary_page,60,false':'verified-primary-pages,source_registry,data/source_registry/verified_primary_pages.csv,csv,national,in_progress,verified_primary_page,61,false',
            'source-series-inventory,source_registry,data/source_registry/source_series_inventory.csv,csv,national,in_progress,source_series,118,false':'source-series-inventory,source_registry,data/source_registry/source_series_inventory.csv,csv,national,in_progress,source_series,120,false',
          }
          for old,new in anchors.items():
              if cat.count(old)!=1: raise SystemExit(f'catalog anchor mismatch: {old}')
              cat=cat.replace(old,new)
          catalog_path.write_text(cat,encoding='utf-8')

          # National coverage state: public/source validation only; separate canonical and durable gates remain false.
          cov_path=root/'data/monitoring/national_coverage.json'
          cov=json.loads(cov_path.read_text(encoding='utf-8'))
          candidates=[item for item in cov['authorities'] if item['authority_key']=='lucca']
          if len(candidates)!=1: raise SystemExit(f'Lucca coverage row cardinality drift: {len(candidates)}')
          item=candidates[0]
          item.update({
            'official_landing_page':landing,
            'source_verified':True,'current_edition_identified':True,
            'capture_implemented':True,'parser_implemented':True,'parser_validated':True,
            'company_observations_loaded':True,'observation_layer':'public_source_observations',
            'canonical_integration_validated':False,'public_export_enabled':True,
            'durable_evidence_verified':False,'population_scopes_complete':True,
            'latest_source_reference_date':'2026-09-11',
            'last_successful_investigation_on':'2026-09-19','coverage_status':'VALIDATED',
            'terminal_reason':None,
            'unresolved_issue':['Canonical hosted-database integration and independent durable-evidence verification remain separate infrastructure gates; the 15 September landing update timestamp is publication-surface provenance and is not promoted to a company decision or legal-effect date.'],
            'actionable_issue':False,
            'completion_evidence':['docs/sources/lucca-operational-check-2026-09-19.md','src/white_list_archive/parsers/lucca_tables.py','tests/test_lucca_parser_semantics.py','data/publication/multi_prefecture_pilot.json'],
            'known_content_sha256':[listed_sha,applicants_sha],
            'evidence':['data/source_registry/verified_primary_pages.csv','data/source_registry/source_series_inventory.csv','data/publication/multi_prefecture_pilot.json','docs/sources/lucca-operational-check-2026-09-19.md'],
            'last_completed_coverage_stage':'VALIDATED',
          })
          cov_path.write_text(json.dumps(cov,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Public builder parser registration.
          pub_path=root/'src/white_list_archive/publishing/public_national_registry.py'
          pub=pub_path.read_text(encoding='utf-8')
          import_anchor='from white_list_archive.parsers.imperia_sources import PARSERS as IMPERIA_PARSERS\n'
          if pub.count(import_anchor)!=1: raise SystemExit('public builder Imperia import anchor drift')
          pub=pub.replace(import_anchor,import_anchor+'from white_list_archive.parsers.lucca_tables import PARSERS as LUCCA_PARSERS\n')
          parser_anchor='        or IMPERIA_PARSERS.get(cfg["parser"])\n'
          if pub.count(parser_anchor)!=1: raise SystemExit('public builder Imperia parser anchor drift')
          pub=pub.replace(parser_anchor,parser_anchor+'        or LUCCA_PARSERS.get(cfg["parser"])\n')
          pub_path.write_text(pub,encoding='utf-8')

          # Public Pages exact-boundary gates.
          wf_path=root/'.github/workflows/public-pages.yml'
          wf=wf_path.read_text(encoding='utf-8')
          path_anchor="      - 'src/white_list_archive/parsers/imperia_sources.py'\n"
          if wf.count(path_anchor)!=1: raise SystemExit('public-pages parser path anchor drift')
          wf=wf.replace(path_anchor,path_anchor+"      - 'src/white_list_archive/parsers/lucca_tables.py'\n")
          replacements={
            "assert reg['meta']['record_count'] == 64865":"assert reg['meta']['record_count'] == 65267",
            ",'grosseto','imperia'}":",'grosseto','imperia','lucca'}",
            ",'grosseto-ordinary','imperia-ordinary'\n":",'grosseto-ordinary','imperia-ordinary','lucca-ordinary'\n",
            "assert reg['meta']['authority_count'] == 60":"assert reg['meta']['authority_count'] == 61",
            "assert reg['meta']['register_count'] == 62":"assert reg['meta']['register_count'] == 63",
            "assert pref['meta']['published_count'] == 60":"assert pref['meta']['published_count'] == 61",
            "assert pref['meta']['mapped_count'] == 60":"assert pref['meta']['mapped_count'] == 61",
          }
          for old,new in replacements.items():
              if wf.count(old)!=1: raise SystemExit(f'public-pages anchor drift: {old}')
              wf=wf.replace(old,new)
          imp_anchor="          assert len({r['record_locator'] for r in imperia_records}) == 273\n"
          if wf.count(imp_anchor)!=1: raise SystemExit('public-pages Imperia assertion anchor drift')
          lucca_assert="""          lucca = [x for x in pref['prefectures'] if x['authority_key'] == 'lucca']
          assert len(lucca) == 1 and lucca[0]['mapped'] and lucca[0]['published'] and lucca[0]['series_count'] == 2
          lucca_records = [r for r in reg['records'] if r['authority_key'] == 'lucca']
          assert len(lucca_records) == 402
          assert sum(r['source_key'] == 'lucca-listed' for r in lucca_records) == 331
          assert sum(r['source_key'] == 'lucca-applicants' for r in lucca_records) == 71
          assert sum(r['source_status'] == 'listed' for r in lucca_records) == 229
          assert sum(r['source_status'] == 'renewal_update_in_progress' for r in lucca_records) == 102
          assert sum(r['source_status'] == 'pending' for r in lucca_records) == 71
          assert sum(bool(r['identifiers']) for r in lucca_records) == 393
          assert len({r['record_locator'] for r in lucca_records}) == 402
"""
          wf=wf.replace(imp_anchor,imp_anchor+lucca_assert)
          wf_path.write_text(wf,encoding='utf-8')

          # Browser regression boundary.
          browser_path=root/'tests/public_portal_browser.cjs'
          b=browser_path.read_text(encoding='utf-8')
          label="      assert.ok(labels.includes('White List ordinaria · Prefettura di Imperia'));\n"
          if b.count(label)!=1: raise SystemExit('browser Imperia label anchor drift')
          b=b.replace(label,label+"      assert.ok(labels.includes('White List ordinaria · Prefettura di Lucca'));\n")
          if b.count('assert.equal(stats.total,64865);')!=1: raise SystemExit('browser total anchor drift')
          b=b.replace('assert.equal(stats.total,64865);','assert.equal(stats.total,65267);')
          filter_anchor=",'grosseto','imperia'].includes(r.authority_key)"
          if b.count(filter_anchor)!=1: raise SystemExit('browser authority exclusion anchor drift')
          b=b.replace(filter_anchor,",'grosseto','imperia','lucca'].includes(r.authority_key)")
          imp_browser="      assert.equal(imperia.filter(r=>r.identifiers.length>0).length,257);\n"
          if b.count(imp_browser)!=1: raise SystemExit('browser Imperia assertion anchor drift')
          lucca_browser="""      const lucca=registry.records.filter(r=>r.authority_key==='lucca');
      assert.equal(lucca.length,402);
      assert.equal(lucca.filter(r=>r.source_key==='lucca-listed').length,331);
      assert.equal(lucca.filter(r=>r.source_key==='lucca-applicants').length,71);
      assert.deepEqual(statusCounts(lucca),{listed:229,pending:71,renewal_update_in_progress:102});
      assert.equal(new Set(lucca.map(r=>r.record_locator)).size,402);
      assert.equal(lucca.filter(r=>r.identifiers.length>0).length,393);
"""
          b=b.replace(imp_browser,imp_browser+lucca_browser)
          browser_path.write_text(b,encoding='utf-8')

          # Registry/population tests.
          sr_path=root/'tests/test_source_registry.py'
          s=sr_path.read_text(encoding='utf-8')
          if s.count('assert len(pages) == 60')!=1: raise SystemExit('source registry count anchor drift')
          sr_path.write_text(s.replace('assert len(pages) == 60','assert len(pages) == 61'),encoding='utf-8')

          pc_path=root/'tests/test_source_population_coverage.py'
          s=pc_path.read_text(encoding='utf-8')
          for old,new in [
            ('assert report["verified_authority_count"] == 60','assert report["verified_authority_count"] == 61'),
            ('assert report["register_scope_count"] == 62','assert report["register_scope_count"] == 63'),
            ('assert report["complete_register_scope_count"] == 62','assert report["complete_register_scope_count"] == 63'),
            ('        "imperia",\n    ):','        "imperia",\n        "lucca",\n    ):'),
          ]:
              if s.count(old)!=1: raise SystemExit(f'population coverage anchor drift: {old}')
              s=s.replace(old,new)
          pc_path.write_text(s,encoding='utf-8')
          PY

      - name: Remove all Lucca transactional mechanisms for clean review projection
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/lucca-source-probe.yml \
            .github/workflows/lucca-parser-validate.yml \
            .github/workflows/lucca-integration-finalizer.yml

      - name: Run complete repository test suite on clean projection
        run: pytest -q

      - name: Build and validate national Lucca candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/public-national-sources
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/public-national-sources \
            --registry-json public-site/data/registry.json \
            --registry-csv public-site/data/registry.csv \
            --prefectures-json public-site/data/prefectures.json \
            --prefectures-csv public-site/data/prefectures.csv
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('public-site/data/registry.json').read_text(encoding='utf-8'))
          pref=json.loads(Path('public-site/data/prefectures.json').read_text(encoding='utf-8'))
          assert reg['meta']['record_count']==65267, reg['meta']['record_count']
          assert reg['meta']['authority_count']==61, reg['meta']['authority_count']
          assert reg['meta']['register_count']==63, reg['meta']['register_count']
          assert pref['meta']['published_count']==61, pref['meta']
          assert pref['meta']['mapped_count']==61, pref['meta']
          rows=[r for r in reg['records'] if r['authority_key']=='lucca']
          assert len(rows)==402
          assert sum(r['source_key']=='lucca-listed' for r in rows)==331
          assert sum(r['source_key']=='lucca-applicants' for r in rows)==71
          assert sum(r['source_status']=='listed' for r in rows)==229
          assert sum(r['source_status']=='renewal_update_in_progress' for r in rows)==102
          assert sum(r['source_status']=='pending' for r in rows)==71
          assert sum(bool(r['identifiers']) for r in rows)==393
          assert len({r['record_locator'] for r in rows})==402
          print({'records':reg['meta']['record_count'],'published':pref['meta']['published_count'],'registers':reg['meta']['register_count'],'lucca':len(rows)})
          PY
          python -m white_list_archive.publishing.public_artifact public-site

      - name: Clean generated candidate outputs and commit permanent checkpoint
        shell: bash
        run: |
          set -euo pipefail
          for p in public-site/data/registry.json public-site/data/registry.csv public-site/data/prefectures.json public-site/data/prefectures.csv; do
            if git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              git restore -- "$p"
            else
              rm -f "$p"
            fi
          done
          git status --short
          if find .github/workflows -maxdepth 1 -type f -name 'lucca-*' | grep -q .; then
            echo 'Temporary Lucca workflow leaked into review projection' >&2
            exit 1
          fi
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate Lucca White List sources'
          git push origin HEAD:expansion/lucca-2026-09-19
