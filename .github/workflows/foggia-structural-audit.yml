name: Foggia structural audit

on:
  push:
    branches:
      - expansion/foggia-2026-09-13
    paths:
      - .github/workflows/foggia-structural-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/foggia-2026-09-13
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit runtime
        run: pip install requests pdfplumber
      - name: Audit byte-pinned PDFs
        run: |
          python - <<'PY'
          from __future__ import annotations
          import collections, hashlib, io, json, re
          from pathlib import Path
          import requests, pdfplumber

          SOURCES = {
              'listed': {
                  'url': 'https://prefettura.interno.gov.it/sites/default/files/43/2026-09/white-list-elenco-imprese-iscritte-aggiornato_al-08-09-2026-copia.pdf',
                  'sha256': '313828d0d7fc0797920697841411503230a1a569e1eb8d41f93aec15908e5d5a',
                  'reference_date': '2026-09-08',
              },
              'applicants': {
                  'url': 'https://prefettura.interno.gov.it/sites/default/files/43/2026-09/elenco_delle_imprese_richiedenti_iscrizione_elenco_fornitori_agg_10-09-2026.pdf',
                  'sha256': 'd76eab040fcb984dbabbff740296f9cd30b41ef028ba756d210d4b7d7df2f6d5',
                  'reference_date': '2026-09-10',
              },
          }
          UA = 'Mozilla/5.0 (compatible; italian-anti-mafia-whitelist-structural-audit/1.0)'
          DATE = re.compile(r'(?<!\d)(?:0?[1-9]|[12]\d|3[01])[./-](?:0?[1-9]|1[0-2])[./-](?:20)?\d{2}(?!\d)')
          ID = re.compile(r'\b(?:P\.?\s*I\.?|C\.?\s*F\.?)\s*[:.]?\s*([A-Z0-9]{8,18})\b', re.I)
          SECT = re.compile(r'\bSezione\s+([IVX]+)\s*[:.-]?\s*([^\n]*)', re.I)

          def norm(s):
              return ' '.join((s or '').replace('\xa0', ' ').split())

          def fetch(spec):
              r = requests.get(spec['url'], headers={'User-Agent': UA}, timeout=60)
              r.raise_for_status()
              raw = r.content
              got = hashlib.sha256(raw).hexdigest()
              if got != spec['sha256']:
                  raise SystemExit(f"fail-closed hash drift: {spec['url']} expected={spec['sha256']} got={got}")
              return raw

          result = {'authority_key':'foggia','sources':{}}
          for population, spec in SOURCES.items():
              raw = fetch(spec)
              per_page=[]; sections=[]; status_counts=collections.Counter(); ids=[]; dates=[]
              all_table_rows=[]; extract_methods=collections.Counter(); empty_text_pages=[]
              with pdfplumber.open(io.BytesIO(raw)) as pdf:
                  for pno, page in enumerate(pdf.pages, start=1):
                      text = page.extract_text(x_tolerance=2, y_tolerance=3) or ''
                      if not text.strip(): empty_text_pages.append(pno)
                      for m in SECT.finditer(text): sections.append({'page':pno,'roman':m.group(1).upper(),'label':norm(m.group(2))[:300]})
                      for m in ID.finditer(text): ids.append({'page':pno,'raw':norm(m.group(0)),'value':m.group(1)})
                      for m in DATE.finditer(text): dates.append({'page':pno,'value':m.group(0)})
                      upper=text.upper()
                      for token in ('IN CORSO','ISTRUTTORIA','ISCRITTA','ISCRITTO','RIGETTATA','RIGETTATO','ARCHIVIATA','ARCHIVIATO','DINIEGO','ACCOLTA','ACCOLTO'):
                          n=upper.count(token)
                          if n: status_counts[token]+=n
                      tables = page.extract_tables() or []
                      shapes=[]
                      for ti,t in enumerate(tables):
                          if not t: continue
                          rows=[]
                          for ri,row in enumerate(t):
                              clean=[norm(c) for c in (row or [])]
                              if any(clean):
                                  rows.append(clean)
                                  all_table_rows.append({'page':pno,'table':ti,'row':ri,'cells':clean})
                          if rows: shapes.append({'table':ti,'rows':len(rows),'max_cols':max(len(r) for r in rows)})
                      per_page.append({'page':pno,'text_chars':len(text),'table_count':len(tables),'table_shapes':shapes,'line_count':len(text.splitlines())})
              # Candidate observation rows are table rows with an explicit P.I./C.F. marker OR a plausible 11/16-char identifier.
              candidate_rows=[]
              for row in all_table_rows:
                  joined=' | '.join(row['cells'])
                  if re.search(r'\b(?:P\.?\s*I\.?|C\.?\s*F\.?)\b', joined, re.I) or re.search(r'(?<!\d)\d{11}(?!\d)|\b[A-Z]{6}[0-9A-Z]{10}\b', joined):
                      candidate_rows.append(row)
              # Freeze distinct section declarations and status evidence; do not infer absent statuses.
              result['sources'][population]={
                  'url':spec['url'],'sha256':spec['sha256'],'reference_date':spec['reference_date'],
                  'size_bytes':len(raw),'page_count':len(per_page),'empty_text_pages':empty_text_pages,
                  'per_page':per_page,
                  'sections':sections,
                  'status_token_counts':dict(status_counts),
                  'identifier_mentions':len(ids),
                  'distinct_identifier_values':len(set(x['value'] for x in ids)),
                  'identifier_examples':ids[:40],
                  'date_mentions':len(dates),'date_examples':dates[:40],
                  'table_rows_nonempty':len(all_table_rows),
                  'candidate_observation_rows':len(candidate_rows),
                  'candidate_row_examples':candidate_rows[:35],
                  'table_row_tail_examples':all_table_rows[-20:],
              }
          Path('tmp').mkdir(exist_ok=True)
          out=Path('tmp/foggia_structural_audit.json')
          out.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          # Human-readable compact summary for logs.
          compact={}
          for pop,d in result['sources'].items():
              compact[pop]={k:d[k] for k in ('sha256','reference_date','page_count','empty_text_pages','status_token_counts','identifier_mentions','distinct_identifier_values','date_mentions','table_rows_nonempty','candidate_observation_rows')}
              compact[pop]['section_declarations']=d['sections']
              compact[pop]['first_candidate_rows']=d['candidate_row_examples'][:5]
          print(json.dumps(compact,ensure_ascii=False,indent=2))
          PY
      - name: Commit structural checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/foggia_structural_audit.json
          git commit -m 'Checkpoint Foggia PDF structural audit'
          git push origin HEAD:expansion/foggia-2026-09-13
