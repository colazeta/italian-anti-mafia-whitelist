name: Crotone semantic denominator fix 2026-09-11

on:
  push:
    branches: [expansion/crotone-2026-09-11]
    paths: [.github/workflows/crotone-semantic-denominator-fix-2026-09-11.yml]

permissions:
  contents: write

jobs:
  reconcile-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/crotone-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Align frozen production denominator with semantic reconciliation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p=Path(path); text=p.read_text()
              found=text.count(old)
              if found != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, found {found}')
              p.write_text(text.replace(old,new))

          replace_exact('src/white_list_archive/parsers/crotone_tables.py', '_EXPECTED_LISTED_RECORDS = 328', '_EXPECTED_LISTED_RECORDS = 325')
          replace_exact('src/white_list_archive/parsers/crotone_tables.py', '_EXPECTED_LISTED_STATUS_COUNTS = {"listed": 73, "renewal_update_in_progress": 255}', '_EXPECTED_LISTED_STATUS_COUNTS = {"listed": 72, "renewal_update_in_progress": 253}')
          replace_exact('tests/test_crotone_parser_semantics.py', 'assert _EXPECTED_LISTED_RECORDS == 328', 'assert _EXPECTED_LISTED_RECORDS == 325')
          replace_exact('tests/test_crotone_parser_semantics.py', 'assert _EXPECTED_LISTED_STATUS_COUNTS == {"listed": 73, "renewal_update_in_progress": 255}', 'assert _EXPECTED_LISTED_STATUS_COUNTS == {"listed": 72, "renewal_update_in_progress": 253}')

          p=Path('.github/workflows/crotone-production-gate-2026-09-11.yml'); text=p.read_text()
          replacements={
              "'expected_source_rows':328":"'expected_source_rows':325",
              'yield 328 conservative company observations':'yield 325 conservative company observations',
              '(73 listed; 255 renewal/update in progress)':'(72 listed; 253 renewal/update in progress)',
              'yields 328 conservative public observations':'yields 325 conservative public observations',
              'assert.equal(stats.total,19321);':'assert.equal(stats.total,19826);',
              'assert.equal(crotone.length,508);':'assert.equal(crotone.length,505);',
              "r=>r.source_key==='crotone-listed').length,328":"r=>r.source_key==='crotone-listed').length,325",
              "{listed:73,pending:180,renewal_update_in_progress:255}":"{listed:72,pending:180,renewal_update_in_progress:253}",
              '**328 public observations: 73 `listed` and 255 `renewal_update_in_progress`**':'**325 public observations: 72 `listed` and 253 `renewal_update_in_progress`**',
              "assert reg['meta']['record_count']==19829":"assert reg['meta']['record_count']==19826",
              'assert len(cr)==508':'assert len(cr)==505',
              "assert sum(r['source_status']=='listed' for r in cr)==73":"assert sum(r['source_status']=='listed' for r in cr)==72",
              "assert sum(r['source_status']=='renewal_update_in_progress' for r in cr)==255":"assert sum(r['source_status']=='renewal_update_in_progress' for r in cr)==253",
          }
          for old,new in replacements.items():
              n=text.count(old)
              if n < 1:
                  raise SystemExit(f'production gate anchor missing: {old!r}')
              text=text.replace(old,new)
          p.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/white_list_archive/parsers/crotone_tables.py tests/test_crotone_parser_semantics.py .github/workflows/crotone-production-gate-2026-09-11.yml
          git commit -m 'Reconcile Crotone semantic grouping denominator'
          git push origin HEAD:expansion/crotone-2026-09-11
      - name: Execute corrected production gate on exact current source bytes
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          workflow=yaml.safe_load(Path('.github/workflows/crotone-production-gate-2026-09-11.yml').read_text())
          run_steps=[s for s in workflow['jobs']['gate']['steps'] if isinstance(s,dict) and s.get('run')]
          if len(run_steps) < 5:
              raise SystemExit(f'unexpected production-gate shape: {len(run_steps)}')
          for step in run_steps:
              print(f"::group::{step.get('name','production gate step')}")
              subprocess.run(step['run'],shell=True,executable='/bin/bash',check=True)
              print('::endgroup::')
          PY
      - name: Install permanent Crotone Pages gate and remove temporary mechanisms
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/public-pages.yml'); text=p.read_text()
          def one(old,new):
              global text
              n=text.count(old)
              if n != 1: raise SystemExit(f'public-pages anchor count {n}: {old!r}')
              text=text.replace(old,new,1)
          one("      - 'src/white_list_archive/parsers/caltanissetta_tables.py'\n", "      - 'src/white_list_archive/parsers/caltanissetta_tables.py'\n      - 'src/white_list_archive/parsers/crotone_tables.py'\n")
          one("assert reg['meta']['record_count'] == 19321", "assert reg['meta']['record_count'] == 19826")
          one("'brindisi','cagliari','caltanissetta'}", "'brindisi','cagliari','caltanissetta','crotone'}")
          one("'brindisi-ordinary','cagliari-ordinary','caltanissetta-ordinary'\n          }", "'brindisi-ordinary','cagliari-ordinary','caltanissetta-ordinary','crotone-ordinary'\n          }")
          one("assert reg['meta']['authority_count'] == 23", "assert reg['meta']['authority_count'] == 24")
          one("assert reg['meta']['register_count'] == 24", "assert reg['meta']['register_count'] == 25")
          one("assert pref['meta']['published_count'] == 23", "assert pref['meta']['published_count'] == 24")
          anchor="          caltanissetta = [x for x in pref['prefectures'] if x['authority_key'] == 'caltanissetta']\n          assert len(caltanissetta) == 1 and caltanissetta[0]['mapped'] and caltanissetta[0]['published']\n"
          one(anchor, anchor+"          crotone = [x for x in pref['prefectures'] if x['authority_key'] == 'crotone']\n          assert len(crotone) == 1 and crotone[0]['mapped'] and crotone[0]['published']\n")
          p.write_text(text)
          PY
          git rm -f .github/workflows/crotone-*-2026-09-11.yml
          git rm -f tmp/crotone-*.json
          git add .github/workflows/public-pages.yml
          git commit -m 'Finalise Crotone production branch'
          git push origin HEAD:expansion/crotone-2026-09-11
