name: Caserta parser validation

on:
  push:
    branches:
      - expansion/caserta-2026-09-12
    paths:
      - .github/workflows/caserta-parser-validation.yml
      - src/white_list_archive/parsers/caserta_tables.py
      - tests/test_caserta_parser_semantics.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/caserta-2026-09-12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and validation runtime
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pip install --disable-pip-version-check requests pdfplumber
      - name: Run Caserta semantic tests
        run: pytest -q tests/test_caserta_parser_semantics.py
      - name: Validate parser against byte-pinned official PDFs
        env:
          LISTED_URL: https://prefettura.interno.gov.it/sites/default/files/30/2026-09/elenco-iscritti-31082026_white-list.pdf
          APPLICANT_URL: https://prefettura.interno.gov.it/sites/default/files/30/2026-08/elenco_imprese_richiedenti_iscrizione_white_list-al-31.08.2026.pdf
          LISTED_SHA256: d323335641b3a84a2e13c047e403030b5bb6a98ec6d034c8648d1286d703585a
          APPLICANT_SHA256: 90f4bfbedd6c2e4794330066df83bfce834bb3a2707902fe2705430439d1ffc5
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, os
          from pathlib import Path
          import requests
          from white_list_archive.parsers.caserta_tables import parse_caserta_applicants, parse_caserta_listed

          UA={'User-Agent':'italian-anti-mafia-whitelist parser validator/1.0'}
          page='https://prefettura.interno.gov.it/it/prefetture/caserta/elenco-white-list'
          def fetch(url,expected,stem):
              r=requests.get(url,headers=UA,timeout=120); r.raise_for_status()
              sha=hashlib.sha256(r.content).hexdigest()
              if sha != expected: raise RuntimeError(f'{stem}: SHA mismatch {sha} != {expected}')
              p=Path(f'/tmp/{stem}.pdf'); p.write_bytes(r.content); return p
          def cfg(source_key, population, url, sha):
              return {
                  'source_key':source_key,
                  'authority_key':'caserta',
                  'authority_name':'Prefettura di Caserta',
                  'register_key':'caserta-ordinary',
                  'register_name':'White List ordinaria',
                  'population_scope':population,
                  'reference_date':'2026-08-31',
                  'source_page_url':page,
                  'resource_url':url,
                  'sha256':sha,
              }
          lp=fetch(os.environ['LISTED_URL'],os.environ['LISTED_SHA256'],'caserta_listed')
          ap=fetch(os.environ['APPLICANT_URL'],os.environ['APPLICANT_SHA256'],'caserta_applicants')
          listed=parse_caserta_listed(lp,cfg('caserta-listed','listed',os.environ['LISTED_URL'],os.environ['LISTED_SHA256']))
          applicants=parse_caserta_applicants(ap,cfg('caserta-applicants','applicant',os.environ['APPLICANT_URL'],os.environ['APPLICANT_SHA256']))
          if len(listed.records) != 950 or len(applicants.records) != 1208:
              raise RuntimeError('Caserta record denominator drift')
          print(json.dumps({'listed':listed.diagnostics,'applicants':applicants.diagnostics,'total_records':len(listed.records)+len(applicants.records)},ensure_ascii=False,indent=2))
          PY
