name: Brescia semantic-group delta audit

on:
  push:
    branches:
      - expansion/brescia-2026-09-12
    paths:
      - .github/workflows/brescia-group-delta-audit.yml
      - tmp/brescia_group_delta_audit.py
      - tmp/brescia_apply_name_shift_fix.py
      - tmp/brescia_apply_audited_row_counts.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/brescia-2026-09-12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed parser patches in workspace
        run: |
          python tmp/brescia_apply_name_shift_fix.py
          python tmp/brescia_apply_audited_row_counts.py
      - name: Install parser runtime
        run: python -m pip install --disable-pip-version-check -e '.[publication]'
      - name: Fetch byte-pinned listed source
        run: |
          curl --fail --location --retry 2 --retry-delay 2 --user-agent 'italian-anti-mafia-whitelist/group-delta-audit' \
            'https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco-ditte-iscritte-10-settembre-2026.xlsx' \
            --output /tmp/brescia-listed.xlsx
          echo '509e6724de2d4d63f403e254236ec2c5b77077d676ee8c17382464d5c9da07a7  /tmp/brescia-listed.xlsx' | sha256sum --check --strict
      - name: Audit semantic-group delta
        run: python tmp/brescia_group_delta_audit.py
      - name: Persist audit output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/brescia_group_delta_audit_output.json
          if git diff --cached --quiet; then
            echo 'No audit-output change to commit.'
            exit 0
          fi
          git commit -m 'Capture Brescia semantic-group delta audit'
          git push origin HEAD:expansion/brescia-2026-09-12
