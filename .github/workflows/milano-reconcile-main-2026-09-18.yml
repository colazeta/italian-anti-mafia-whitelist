name: Milano reconcile current main

on:
  push:
    branches:
      - fix/milano-source-drift-2026-09-18
    paths:
      - .github/workflows/milano-reconcile-main-2026-09-18.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/milano-source-drift-2026-09-18
          fetch-depth: 0

      - name: Reconcile exact Milano transition over canonical main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e

          mapfile -t unmerged < <(git diff --name-only --diff-filter=U)
          allowed=(
            data/monitoring/national_coverage.json
            data/publication/multi_prefecture_pilot.json
            data/source_registry/source_series_inventory.csv
          )
          for path in "${unmerged[@]}"; do
            ok=0
            for expected in "${allowed[@]}"; do
              if [[ "$path" == "$expected" ]]; then ok=1; break; fi
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "Unexpected merge conflict: $path" >&2
              exit 1
            fi
          done
          if [[ "$merge_rc" -ne 0 && "${#unmerged[@]}" -eq 0 ]]; then
            echo 'Merge failed without an expected file conflict' >&2
            exit 1
          fi

          git checkout origin/main -- \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv

          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          coverage_path = Path('data/monitoring/national_coverage.json')
          coverage = json.loads(coverage_path.read_text())
          milano = next(p for p in coverage['prefectures'] if p['authority_key'] == 'milano')
          milano.update({
              'latest_source_reference_date': '2026-09-18',
              'last_successful_source_check_at': '2026-09-18T12:18:25Z',
              'last_attempted_source_check_at': '2026-09-18T12:18:25Z',
              'last_content_change_at': '2026-09-18T12:18:25Z',
              'last_successful_investigation_on': '2026-09-18',
          })
          for key, value in (
              ('completion_evidence', 'docs/sources/milano-source-transition-2026-09-18.md'),
              ('known_content_sha256', '8dd6ce95d933f6b892e056bdec5bc78a985bb6485504055cd7cbde0e8cbdad5c'),
              ('known_content_sha256', 'bfad4880c80cf465d6356e7ae518149f150781de69a712c8551320f25a92b195'),
              ('evidence', 'docs/sources/milano-source-transition-2026-09-18.md'),
          ):
              seq = milano.setdefault(key, [])
              if value not in seq:
                  seq.append(value)

          history = coverage.setdefault('check_history', [])
          event = {
              'authority_key': 'milano',
              'at': '2026-09-18T12:18:25Z',
              'evidence': 'docs/sources/milano-source-transition-2026-09-18.md',
              'error': None,
              'content_changed': True,
              'content_sha256': '8dd6ce95d933f6b892e056bdec5bc78a985bb6485504055cd7cbde0e8cbdad5c',
          }
          history[:] = [h for h in history if not (h.get('authority_key') == 'milano' and h.get('at') == event['at'])]
          history.append(event)
          coverage_path.write_text(json.dumps(coverage, indent=2, ensure_ascii=False) + '\n')

          publication_path = Path('data/publication/multi_prefecture_pilot.json')
          publication = json.loads(publication_path.read_text())
          def walk(value):
              if isinstance(value, dict):
                  if value.get('source_key') == 'milano-combined':
                      yield value
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child)
          matches = list(walk(publication))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one milano-combined config, got {len(matches)}')
          cfg = matches[0]
          cfg.update({
              'reference_date': '2026-09-18',
              'sha256': '8dd6ce95d933f6b892e056bdec5bc78a985bb6485504055cd7cbde0e8cbdad5c',
              'last_source_update': '2026-09-18',
              'last_source_update_basis': 'Direct 18 September 2026 operational-source verification: repeated cache-bypassed captures of both official Milano views were byte-identical; the production parser accepted the combined view at the frozen 4,208-sector-row / 2,611-observation boundary.',
              'notes': 'The mutable combined operational table was independently re-verified on 18 September 2026 at 969,618 bytes (SHA-256 8dd6ce95d933f6b892e056bdec5bc78a985bb6485504055cd7cbde0e8cbdad5c). Identity membership remains 2,611 observations with no additions or removals against the live 17 September boundary; the source explicitly moved IMPRESA GUERINI & C. SRL (00936150150) and TECNOTER SRL (13072070157) from dated listed rows to IN AGGIORNAMENTO, yielding 938 listed, 516 renewal/update and 1,157 pending. The separate registered-only sibling was independently repeated at 558,574 bytes (SHA-256 bfad4880c80cf465d6356e7ae518149f150781de69a712c8551320f25a92b195) and its 1,454 identities exactly equal the non-pending identity set. No legal effect is inferred beyond the source-published status wording.',
          })
          publication_path.write_text(json.dumps(publication, indent=2, ensure_ascii=False) + '\n')

          inventory_path = Path('data/source_registry/source_series_inventory.csv')
          with inventory_path.open(newline='') as fh:
              reader = csv.DictReader(fh)
              fieldnames = reader.fieldnames
              rows = list(reader)
          if not fieldnames:
              raise SystemExit('Missing source-series header')
          matches = [r for r in rows if r['source_series_key'] == 'milano-combined']
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one Milano source-series row, got {len(matches)}')
          row = matches[0]
          row['verified_date'] = '2026-09-18'
          row['notes'] = ('Official mutable combined table directly re-verified 18 September 2026: repeated captures were byte-identical at SHA-256 '
                          '8dd6ce95d933f6b892e056bdec5bc78a985bb6485504055cd7cbde0e8cbdad5c (969,618 bytes), 4,208 sector rows and 2,611 logical observations. '
                          'No identities were added or removed from the prior live boundary; two identifiers (00936150150 and 13072070157) are now source-explicit IN AGGIORNAMENTO, '
                          'giving 938 listed / 516 renewal-update / 1,157 pending. The registered-only sibling was independently stable at SHA-256 '
                          'bfad4880c80cf465d6356e7ae518149f150781de69a712c8551320f25a92b195 (558,574 bytes), with 1,454 identities exactly matching the combined non-pending set. '
                          'See docs/sources/milano-source-transition-2026-09-18.md.')
          with inventory_path.open('w', newline='') as fh:
              writer = csv.DictWriter(fh, fieldnames=fieldnames, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)
          PY

          git add \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge conflicts remain' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          rm -f .github/workflows/milano-reconcile-main-2026-09-18.yml
          git add -A
          git commit -m 'Reconcile Milano transition with current main'
          git push origin HEAD:fix/milano-source-drift-2026-09-18
