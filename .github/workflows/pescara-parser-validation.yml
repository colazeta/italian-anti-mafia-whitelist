name: Pescara parser validation

on:
  push:
    branches: [expansion/pescara-2026-09-21]
    paths:
      - src/white_list_archive/parsers/pescara_legacy_doc.py
      - .github/workflows/pescara-parser-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: expansion/pescara-2026-09-21}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install validation runtime
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq antiword
          python -m pip install -e '.[publication]'
      - name: Validate pinned listed and applicant populations
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from urllib.request import Request, urlopen
          from white_list_archive.parsers.pescara_legacy_doc import parse_pescara_applicants, parse_pescara_listed
          from white_list_archive.publishing.public_contract import public_record

          sources = [
            (
              'listed',
              'https://prefettura.interno.gov.it/sites/default/files/0/2026-09/white-list-2026.doc',
              '6a8aa832db7d0f55c17d9ed1f8179d9ed46a7c927b5b88d85319f79a1da92239',
              parse_pescara_listed,
              'pescara-listed',
              'listed',
              '2026-09-16',
              607,
            ),
            (
              'applicants',
              'https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco_richiedenti_white-list_04.09.2026.doc',
              '2a0f74ab6548ad2418f539aba7fc2eaf0d23998b709b0bc247e512d7b46a578c',
              parse_pescara_applicants,
              'pescara-applicants',
              'applicant',
              '2026-09-04',
              35,
            ),
          ]
          for label,url,expected_sha,parser,source_key,population,reference_date,expected_records in sources:
            req=Request(url,headers={'User-Agent':'italian-anti-mafia-whitelist/0.1 (+parser validation)'})
            with urlopen(req,timeout=60) as response:
              body=response.read()
            actual=hashlib.sha256(body).hexdigest()
            assert actual == expected_sha, (label,actual)
            path=Path('/tmp')/f'pescara-{label}.doc';path.write_bytes(body)
            cfg={
              'source_key':source_key,
              'authority_key':'pescara',
              'authority_name':'Prefettura di Pescara',
              'register_key':'pescara-ordinary',
              'register_name':'White List ordinaria',
              'population_scope':population,
              'reference_date':reference_date,
              'source_page_url':'https://prefettura.interno.gov.it/it/prefetture/pescara/evidenza/white-list' if label=='listed' else 'https://prefettura.interno.gov.it/it/prefetture/pescara/elenco-imprese-richiedenti-liscrizione-nelle-white-list',
              'resource_url':url,
              'sha256':expected_sha,
            }
            batch=parser(path,cfg)
            assert len(batch.records)==expected_records
            for record in batch.records:
              public_record({**record,'parser_name':parser.__name__,'parser_version':'1'})
            print(label,batch.diagnostics)
          PY
      - name: Validate fail-closed configuration binding
        run: |
          python - <<'PY'
          from pathlib import Path
          from white_list_archive.parsers.pescara_legacy_doc import parse_pescara_listed
          cfg={
            'source_key':'pescara-listed','authority_key':'pescara','authority_name':'Prefettura di Pescara',
            'register_key':'pescara-ordinary','register_name':'White List ordinaria','population_scope':'listed',
            'reference_date':'2026-09-15','source_page_url':'https://example.invalid','resource_url':'https://example.invalid/source.doc','sha256':'0'*64,
          }
          try:
            parse_pescara_listed(Path('/tmp/does-not-need-to-exist.doc'),cfg)
          except RuntimeError as exc:
            assert 'reference-date drift' in str(exc)
          else:
            raise AssertionError('reference-date drift did not fail closed')
          PY
