name: Foggia conflict review

on:
  push:
    branches:
      - expansion/foggia-2026-09-13
    paths:
      - .github/workflows/foggia-conflict-review.yml

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/foggia-2026-09-13
      - name: Print audited conflict summaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('tmp/foggia_anomaly_audit.json').read_text())
          print('LISTED_CONFLICTS')
          for i,c in enumerate(d['listed']['identity_conflicts'],1):
              print(json.dumps({
                  'n':i,
                  'identifier_key':c['identifier_key'],
                  'row_count':c['row_count'],
                  'names':c['names'],
                  'listing_raw':c['listing_raw'],
                  'expiry_raw':c['expiry_raw'],
                  'update_raw':c['update_raw'],
                  'semantic_update':c['semantic_update'],
                  'rows':[{
                      'page':r['page'],
                      'section':r['section'],
                      'name':r['cells'][0],
                      'listing':r['cells'][4],
                      'expiry':r['cells'][5],
                      'update':r['cells'][6],
                  } for r in c['rows']],
              },ensure_ascii=False))
          print('APPLICANT_DUPLICATES')
          for c in d['applicants']['duplicate_strict_identifier_groups']:
              print(json.dumps(c,ensure_ascii=False))
          PY
