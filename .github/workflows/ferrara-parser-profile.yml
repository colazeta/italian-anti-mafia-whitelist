name: Ferrara parser profile

on:
  push:
    branches:
      - expansion/ferrara-2026-09-20
    paths:
      - .github/workflows/ferrara-parser-profile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install profile runtime
        run: python -m pip install --disable-pip-version-check requests pdfplumber
      - name: Profile pinned Ferrara tables
        shell: python
        run: |
          import collections
          import hashlib
          import io
          import json
          import re
          import requests
          import pdfplumber

          resources = [
              ("ordinary-listed", "https://prefettura.interno.gov.it/sites/default/files/0/2026-08/white-list-provinciali-elenco-imprese-iscritte-agg11112024_0.pdf", "0d631e678b7f85bb84d265b09b8de6fcffa09cc4a49b84be37c6c1d7b9dcd6d9"),
              ("ordinary-applicants", "https://prefettura.interno.gov.it/sites/default/files/0/2026-08/white-list-elenco-imprese-richiedenti_0.pdf", "c7437cdeebd1a64d4a6de8bbe5e8c108a688269409b7c772e8a6c87162e588e7"),
              ("reconstruction-a", "https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-a-fornitura-moduli-prefabbricati-e-dei-relativi-arredi_is_0.pdf", "4fdf292b1538892c7b5ff79d3c0c14e0ed3b5830effb791316b0fddb8c90ae01"),
              ("reconstruction-b", "https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-b-demolizione-di-edifici-ed-altre-strutture_is_0.pdf", "97d9af0d587af0b7d93d31df33bd612440bf5be5b48b57872d436e2afeb164ec"),
              ("reconstruction-c", "https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-c-movimenti-di-terra_is_0.pdf", "99f519101dccff84dddd9753f0d6fa27170c33b1982858afe9fdf9ebbc63c57e"),
              ("reconstruction-d", "https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-d-noleggio-con-coducente-mezzi-speciali_is_0.pdf", "07c27b38e48a879aa0d1efff4710bf7dbbf1bb323e59f62eb0b0b796a75a46d8"),
              ("reconstruction-e", "https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-e-fornitura-e-posa-in-opera-impianti-fotovoltaici_is_0.pdf", "9cea950d37f653d0356edb9a46a7f43665a382e771c969bc93f7027f95fecf9e"),
              ("reconstruction-f", "https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-f-fornitura-e-manutenzione-impianti-tecnologici_is_0.pdf", "ac7dd77f1c4633c27a62c0ad7e074f507a10b091a327c2fc1072cfb52fd45664"),
              ("reconstruction-g", "https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-g-fornitura-beni-necessari-ricostruzione_is_0.pdf", "0657c7e0f0b9fb8ad7f0b341682716d695132e61131adc92407627a5cae82bae"),
          ]
          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0 (compatible; whitelist parser profile/1.0)", "Cache-Control": "no-cache"})
          dmy = re.compile(r"\b\d{1,2}/\d{1,2}/\d{3,5}\b")

          report = {}
          for key, url, expected_sha in resources:
              r = session.get(url, timeout=60)
              r.raise_for_status()
              actual_sha = hashlib.sha256(r.content).hexdigest()
              assert actual_sha == expected_sha, (key, actual_sha)
              widths = collections.Counter()
              tables_per_page = collections.Counter()
              table_rows = 0
              date_rows = []
              nonempty_rows = 0
              with pdfplumber.open(io.BytesIO(r.content)) as pdf:
                  for page in pdf.pages:
                      tables = page.extract_tables()
                      tables_per_page[len(tables)] += 1
                      for table_no, table in enumerate(tables, 1):
                          for row_no, raw in enumerate(table, 1):
                              cells = [" ".join(str(v or "").replace("\u00a0", " ").split()) for v in (raw or [])]
                              table_rows += 1
                              widths[len(cells)] += 1
                              if any(cells):
                                  nonempty_rows += 1
                              joined = " | ".join(cells)
                              if dmy.search(joined):
                                  date_rows.append({"p": page.page_number, "t": table_no, "r": row_no, "cells": cells})
              report[key] = {
                  "pages": len(pdf.pages),
                  "tables_per_page": dict(sorted(tables_per_page.items())),
                  "table_rows": table_rows,
                  "nonempty_rows": nonempty_rows,
                  "widths": dict(sorted(widths.items())),
                  "date_rows": len(date_rows),
                  "sample_date_rows_first": date_rows[:8],
                  "sample_date_rows_last": date_rows[-8:],
              }
          print("FERRARA_TABLE_PROFILE_JSON")
          print(json.dumps(report, ensure_ascii=False, indent=2))
