name: Nominatim Cosenza one-shot smoke

on:
  push:
    branches:
      - feature/provider-agnostic-address-normalisation
    paths:
      - '.github/workflows/nominatim-cosenza-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: whitelist
          POSTGRES_USER: whitelist
          POSTGRES_PASSWORD: whitelist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whitelist -d whitelist"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PGPASSWORD: whitelist
      TEST_DSN: postgresql://whitelist:whitelist@localhost:5432/whitelist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project and PostgreSQL client
        run: |
          python -m pip install -e .[database]
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply schema and create three real Cosenza-source address examples
        run: |
          psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -f db/apply.sql
          psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 <<'SQL'
          WITH activity AS (
              INSERT INTO provenance.processing_activity(
                  activity_type_code, software_name, software_version,
                  configuration_hash, started_at, completed_at
              ) VALUES (
                  'geocode','nominatim-one-shot-fixture','1',repeat('c',64),
                  CURRENT_TIMESTAMP,CURRENT_TIMESTAMP
              ) RETURNING processing_activity_id
          )
          INSERT INTO core.address(full_address, processing_activity_id)
          SELECT address, processing_activity_id
          FROM activity
          CROSS JOIN (VALUES
              ('RENDE(CS), VIALE ORSO MARIO CORBINO 33'),
              ('CASSANO ALL’IONIO Via IV Novembre, 2'),
              ('PARIGI (FR)Rue du Cardinal Demoine 62')
          ) AS sample(address);
          SQL
      - name: Normalise through public Nominatim as an explicit small one-off batch
        run: |
          white-list-normalise-addresses \
            --dsn "$TEST_DSN" \
            --endpoint https://nominatim.openstreetmap.org \
            --allow-public-nominatim \
            --max-addresses 3 \
            --search-limit 3 \
            > nominatim-smoke-summary.json
          cat nominatim-smoke-summary.json
      - name: Validate persisted results and print normalised surface
        run: |
          psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -P pager=off -c "TABLE mart.address_normalisation;"
          python - <<'PY'
          import json
          summary=json.load(open('nominatim-smoke-summary.json', encoding='utf-8'))
          assert summary['public_osmf_service'] is True
          assert summary['selected_address_ids'] == 3
          assert summary['unique_queries'] == 3
          assert summary['network_queries'] == 3
          assert summary['error'] == 0, summary
          assert summary['accepted'] + summary['candidate'] + summary['not_found'] >= 3
          PY
