name: Ferrara review finalizer

on:
  push:
    branches:
      - expansion/ferrara-2026-09-20
    paths:
      - .github/workflows/ferrara-review-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact branch base
        run: |
          git fetch origin main
          test "$(git rev-list --count HEAD..origin/main)" = "0"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: Stage Ferrara public gate candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/public-pages.yml')
          text = source.read_text(encoding='utf-8')
          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one public-pages anchor, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)
          replace_once("      - 'src/white_list_archive/parsers/siracusa_tables.py'\n      - 'src/white_list_archive/parsers/macerata_tables.py'", "      - 'src/white_list_archive/parsers/siracusa_tables.py'\n      - 'src/white_list_archive/parsers/ferrara_tables.py'\n      - 'src/white_list_archive/parsers/macerata_tables.py'")
          replace_once("assert reg['meta']['record_count'] == 69474", "assert reg['meta']['record_count'] == 71057")
          replace_once(",'matera','siracusa'}\n          assert set(reg['meta']['register_counts'])", ",'matera','siracusa','ferrara'}\n          assert set(reg['meta']['register_counts'])")
          replace_once("'palermo-ordinary','matera-ordinary','siracusa-ordinary'\n          }", "'palermo-ordinary','matera-ordinary','siracusa-ordinary','ferrara-ordinary','ferrara-reconstruction'\n          }")
          replace_once("assert reg['meta']['authority_count'] == 66", "assert reg['meta']['authority_count'] == 67")
          replace_once("assert reg['meta']['register_count'] == 68", "assert reg['meta']['register_count'] == 70")
          replace_once("assert pref['meta']['published_count'] == 66", "assert pref['meta']['published_count'] == 67")
          replace_once("assert pref['meta']['mapped_count'] == 66", "assert pref['meta']['mapped_count'] == 67")
          anchor = "          macerata = [x for x in pref['prefectures'] if x['authority_key'] == 'macerata']\n"
          block = "\n".join([
              "          ferrara = [x for x in pref['prefectures'] if x['authority_key'] == 'ferrara']",
              "          assert len(ferrara) == 1 and ferrara[0]['mapped'] and ferrara[0]['published'] and ferrara[0]['series_count'] == 4",
              "          ferrara_records = [r for r in reg['records'] if r['authority_key'] == 'ferrara']",
              "          assert len(ferrara_records) == 1583",
              "          assert sum(r['source_key'] == 'ferrara-provincial-listed' for r in ferrara_records) == 868",
              "          assert sum(r['source_key'] == 'ferrara-provincial-applicants' for r in ferrara_records) == 21",
              "          assert sum(r['source_key'] == 'ferrara-reconstruction-listed' for r in ferrara_records) == 694",
              "          assert sum(r['source_status'] == 'listed' for r in ferrara_records) == 1256",
              "          assert sum(r['source_status'] == 'renewal_update_in_progress' for r in ferrara_records) == 303",
              "          assert sum(r['source_status'] == 'other_or_unknown' for r in ferrara_records) == 3",
              "          assert sum(r['source_status'] == 'pending' for r in ferrara_records) == 21",
              "          assert sum(bool(r['identifiers']) for r in ferrara_records) == 1563",
              "          assert len({r['record_locator'] for r in ferrara_records}) == 1583",
          ]) + "\n"
          replace_once(anchor, block + anchor)
          assert '69474' not in text
          assert text.count("src/white_list_archive/parsers/ferrara_tables.py") == 1
          assert text.count("authority_key'] == 'ferrara'") == 2
          assert text.count("ferrara-ordinary") >= 1
          assert text.count("ferrara-reconstruction") >= 1
          target = Path('tmp/ferrara-public-pages-candidate.yml')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(text, encoding='utf-8')
          PY
      - name: Validate permanent Ferrara surface
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          pytest -q tests/test_ferrara_parser_semantics.py tests/test_ferrara_public_bundle.py tests/test_public_history.py tests/test_source_registry.py tests/test_source_population_coverage.py
      - name: Publish candidate blob for atomic review cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/ferrara-public-pages-candidate.yml
          git diff --cached --check
          git commit -m 'Stage validated Ferrara public gate candidate'
          git push origin HEAD:expansion/ferrara-2026-09-20
