name: Brescia layout audit

on:
  push:
    branches:
      - expansion/brescia-2026-09-12
    paths:
      - .github/workflows/brescia-layout-audit.yml
      - tmp/brescia_layout_audit.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/brescia-2026-09-12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check openpyxl
      - name: Capture exact layout audit
        run: python tmp/brescia_layout_audit.py > tmp/brescia_layout_audit_output.json
      - name: Capture compact layout fingerprint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('tmp/brescia_layout_audit_output.json').read_text(encoding='utf-8'))
          summary = {
              'expected_name_blank_company_like_count': source['expected_name_blank_company_like_count'],
              'expected_name_blank_company_like_sha256': source['expected_name_blank_company_like_sha256'],
              'expected_name_blank_company_like_rows': [
                  item[0] for item in source['expected_name_blank_company_like_signatures']
              ],
              'expected_name_blank_non_company_count': source['expected_name_blank_non_company_count'],
              'expected_name_blank_non_company_sha256': source['expected_name_blank_non_company_sha256'],
              'expected_name_blank_non_company_rows': [
                  item[0] for item in source['expected_name_blank_non_company_signatures']
              ],
          }
          Path('tmp/brescia_layout_audit_summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Persist audit output on expansion branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/brescia_layout_audit_output.json tmp/brescia_layout_audit_summary.json
          if git diff --cached --quiet; then
            echo 'No audit-output change to commit.'
            exit 0
          fi
          git commit -m 'Capture Brescia layout audit output'
          git push origin HEAD:expansion/brescia-2026-09-12
