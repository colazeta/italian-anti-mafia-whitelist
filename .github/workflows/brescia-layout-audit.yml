name: Brescia layout audit

on:
  push:
    branches:
      - expansion/brescia-2026-09-12
    paths:
      - .github/workflows/brescia-layout-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/brescia-2026-09-12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check openpyxl
      - name: Capture exact layout audit
        run: python tmp/brescia_layout_audit.py > tmp/brescia_layout_audit_output.json
      - name: Persist audit output on expansion branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/brescia_layout_audit_output.json
          if git diff --cached --quiet; then
            echo 'No audit-output change to commit.'
            exit 0
          fi
          git commit -m 'Capture Brescia layout audit output'
          git push origin HEAD:expansion/brescia-2026-09-12
