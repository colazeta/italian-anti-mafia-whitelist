name: Potenza current-boundary reapproval

on:
  push:
    branches:
      - fix/potenza-source-drift-2026-09-17
    paths:
      - '.github/workflows/potenza-drift-audit.yml'

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation runtime
        run: python -m pip install -e '.[dev,publication]'
      - name: Reverify and reapprove current Potenza boundary
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv, hashlib, io, json, re, time, urllib.request
          from collections import Counter
          from pathlib import Path
          from white_list_archive.parsers.potenza_webapp import parse_potenza_combined
          from white_list_archive.publishing.public_national_registry import _semantic_digest

          SOURCE_URL = 'https://www.utgpotenza.it/data/vis_imprese.php?action=list&jtStartIndex=0&jtPageSize=2000&jtSorting=ragione_sociale%20ASC&cerca_ragione_sociale=&cerca_sede_legale=&cerca_stato_richiesta=0&cerca_sezione=0'
          PUBLIC_URL = 'https://colazeta.github.io/italian-anti-mafia-whitelist/data/registry.json'
          RAW_SHA = 'cb3a1816dbe54bb0a1260a63e326385bcc435e52d8928a775f7c5bc259655d30'
          SEM_SHA = '8b3a129f54dfb889740a6f16fddcd53294fc4269a7e311353e72dc9c7b81dd2e'
          PREVIOUS_RAW_SHA = '24fbb61f7ae028a0a2fee8d7d4c89d42ceefdf18fc6d69298a1df0549b78c820'
          PREVIOUS_SEM_SHA = '96b5227dd78fc83b78a2fd1516e8a5cfae6d482be97351f1e8c71c641e7e6316'
          CHECK_AT = '2026-09-17T22:35:08Z'
          headers = {'User-Agent': 'italian-anti-mafia-whitelist/1.0 (+https://github.com/colazeta/italian-anti-mafia-whitelist)'}

          def get(url: str) -> bytes:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=45) as response:
                  if response.status != 200:
                      raise SystemExit(f'GET {url} returned HTTP {response.status}')
                  return response.read()

          def dump_json(path: Path, obj) -> None:
              path.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Positive current-source evidence: two independent complete captures.
          one = get(SOURCE_URL)
          time.sleep(2)
          two = get(SOURCE_URL)
          if one != two:
              raise SystemExit('independent current Potenza captures are not byte-identical')
          actual_raw = hashlib.sha256(one).hexdigest()
          if actual_raw != RAW_SHA:
              raise SystemExit(f'Potenza changed after fresh audit: expected {RAW_SHA}, got {actual_raw}')
          payload = json.loads(one)
          if payload.get('Result') != 'OK' or int(payload.get('TotalRecordCount', -1)) != 1035:
              raise SystemExit('Potenza endpoint result/count drift during finalisation')
          if len(payload.get('Records', [])) != 1035:
              raise SystemExit('Potenza endpoint pagination drift during finalisation')
          ids = [str(row['id']).strip() for row in payload['Records']]
          if len(ids) != len(set(ids)):
              raise SystemExit('duplicate current Potenza source ids')

          cfg_path = Path('data/publication/multi_prefecture_pilot.json')
          cfg_all = json.loads(cfg_path.read_text(encoding='utf-8'))
          pot = next(x for x in cfg_all['sources'] if x['source_key'] == 'potenza-combined')
          if pot['reference_date'] != '2026-09-17' or int(pot['expected_source_rows']) != 1035:
              raise SystemExit('unexpected Potenza publication boundary before reapproval')
          if pot.get('semantic_sha256') != PREVIOUS_SEM_SHA:
              raise SystemExit('unexpected prior Potenza semantic approval')
          if pot.get('approval_mode') != 'semantic_sha256':
              raise SystemExit('Potenza semantic approval mode changed unexpectedly')

          current_path = Path('/tmp/potenza-current.json')
          current_path.write_bytes(one)
          batch = parse_potenza_combined(current_path, pot)
          diagnostics = batch.diagnostics
          expected_diagnostics = {
              'public_records': 1035,
              'distinct_source_ids': 1035,
              'status_counts': {'listed': 216, 'pending': 376, 'renewal_update_in_progress': 443},
              'identifier_coverage': 1034,
              'raw_identifier_only': 1,
              'blank_identifier_fields': 0,
              'application_date_coverage': 1035,
              'listing_date_coverage': 659,
              'expiry_date_coverage': 659,
              'nonblank_notes': 1,
              'requested_activity_coverage': 0,
          }
          for key, expected in expected_diagnostics.items():
              if diagnostics.get(key) != expected:
                  raise SystemExit(f'Potenza diagnostic drift for {key}: {diagnostics.get(key)!r} != {expected!r}')
          actual_sem = _semantic_digest(batch.records)
          if actual_sem != SEM_SHA:
              raise SystemExit(f'Potenza semantic digest changed after fresh audit: {actual_sem}')

          # Reconfirm that the public-relevant transition is still exactly the reviewed one.
          public = json.loads(get(PUBLIC_URL))
          old_rows = [row for row in public['records'] if row.get('authority_key') == 'potenza']
          old_by_id = {}
          for row in old_rows:
              locator = row.get('source_fields', {}).get('physical_locator', '')
              if locator.startswith('source-id:'):
                  old_by_id[locator.split(':', 1)[1]] = row
          current_by_id = {row['source_fields']['source_id']: row for row in batch.records}
          added = set(current_by_id) - set(old_by_id)
          removed = set(old_by_id) - set(current_by_id)
          if added != {'656'} or removed:
              raise SystemExit(f'unreviewed Potenza identity delta: added={sorted(added)}, removed={sorted(removed)}')
          keys = ('name','identifier_field_raw','source_status','application_date','observed_listing_date','observed_expiry_date')
          changed = {}
          for sid in set(old_by_id) & set(current_by_id):
              delta = {key: (old_by_id[sid].get(key), current_by_id[sid].get(key)) for key in keys if old_by_id[sid].get(key) != current_by_id[sid].get(key)}
              if delta:
                  changed[sid] = delta
          if set(changed) != {'359'} or set(changed['359']) != {'source_status'} or changed['359']['source_status'] != ('listed','renewal_update_in_progress'):
              raise SystemExit(f'unreviewed Potenza public-field delta: {changed!r}')
          rows_by_id = {str(row['id']).strip(): row for row in payload['Records']}
          if rows_by_id['656']['ragione_sociale'] != 'SCAVONE & C. S.R.L.' or rows_by_id['656']['stato_richiesta'] != '1' or rows_by_id['656']['agg_incorso'] != '0':
              raise SystemExit('source id 656 no longer matches reviewed pending evidence')
          if rows_by_id['359']['ragione_sociale'] != 'MALASPINA S.R.L.' or rows_by_id['359']['stato_richiesta'] != '2' or rows_by_id['359']['agg_incorso'] != '1':
              raise SystemExit('source id 359 no longer matches reviewed update evidence')
          pairs = Counter((str(row['stato_richiesta']).strip(), str(row['agg_incorso']).strip()) for row in payload['Records'])
          if pairs != Counter({('1','0'):376, ('1','1'):1, ('2','0'):216, ('2','1'):442}):
              raise SystemExit(f'unreviewed Potenza status-pair drift: {pairs!r}')

          # Advance only the mutable-source approval evidence. The 17 September
          # reference boundary and the already-reviewed public transition remain unchanged.
          pot['sha256'] = RAW_SHA
          pot['semantic_sha256'] = SEM_SHA
          marker = 'Fresh revalidation after midnight Europe/Rome'
          prior_notes = str(pot.get('notes') or '')
          if marker not in prior_notes:
              pot['notes'] = prior_notes.rstrip() + (' ' if prior_notes.strip() else '') + (
                  marker + ': two independent complete captures at 2026-09-17T22:35:08Z were byte-identical '
                  f'(raw SHA-256 {RAW_SHA}) and parsed to the same 1,035-row public boundary and reviewed identity/status '
                  f'delta; full parsed semantic approval advanced from {PREVIOUS_SEM_SHA} to {SEM_SHA}. The prior raw '
                  'capture was not retained, so the auxiliary source-field byte/semantic cause is not reconstructed; '
                  'no legal effect is inferred from this reapproval.'
              )
          dump_json(cfg_path, cfg_all)

          cov_path = Path('data/monitoring/national_coverage.json')
          cov = json.loads(cov_path.read_text(encoding='utf-8'))
          pcov = next(x for x in cov['prefectures'] if x['authority_key'] == 'potenza')
          if pcov.get('latest_source_reference_date') != '2026-09-17':
              raise SystemExit('unexpected Potenza monitoring reference boundary')
          pcov['last_successful_source_check_at'] = CHECK_AT
          pcov['last_attempted_source_check_at'] = CHECK_AT
          pcov['last_content_change_at'] = CHECK_AT
          pcov['last_successful_investigation_on'] = '2026-09-18'
          pcov['monitoring_status'] = 'CURRENT'
          if RAW_SHA not in pcov['known_content_sha256']:
              pcov['known_content_sha256'].append(RAW_SHA)
          if not any(c.get('authority_key') == 'potenza' and c.get('content_sha256') == RAW_SHA for c in cov['checks']):
              cov['checks'].append({
                  'authority_key': 'potenza',
                  'at': CHECK_AT,
                  'evidence': 'docs/sources/potenza-operational-check-2026-09-15.md',
                  'error': None,
                  'content_changed': True,
                  'content_sha256': RAW_SHA,
              })
          dump_json(cov_path, cov)

          inv_path = Path('data/source_registry/source_series_inventory.csv')
          inv = inv_path.read_text(encoding='utf-8')
          matches = re.findall(r'^potenza-combined,.*$', inv, flags=re.MULTILINE)
          if len(matches) != 1:
              raise SystemExit(f'expected one Potenza inventory row, found {len(matches)}')
          row = [
              'potenza-combined','potenza','WL-REGIME-L190-2012','listed_and_applicant','all',
              'custom_web_application','https://www.utgpotenza.it/_whitelist.php','linked_application_resolved',
              '2026-09-18',
              ('Current linked UTG Potenza web application revalidated after midnight Europe/Rome by two byte-identical '
               'independent complete endpoint GETs at raw SHA-256 ' + RAW_SHA + '. The response still exposes 1,035 '
               'observations: 216 listed, 376 pending and 443 renewal/update in progress. Relative to the currently live '
               '1,034-row public boundary, the reviewed public-relevant delta remains exactly source id 656 newly pending '
               'and source id 359 listed to renewal/update in progress, with no source-id removals. Production semantic '
               'approval is ' + SEM_SHA + '. The earlier raw capture was not retained, so the auxiliary source-field cause '
               'of the digest change is not reconstructed; no legal effect is inferred.')
          ]
          buf = io.StringIO(newline='')
          csv.writer(buf, lineterminator='').writerow(row)
          inv_path.write_text(inv.replace(matches[0], buf.getvalue(), 1), encoding='utf-8')

          doc_path = Path('docs/sources/potenza-operational-check-2026-09-15.md')
          doc = doc_path.read_text(encoding='utf-8')
          doc_marker = '## Fresh current-source revalidation — 18 September 2026'
          if doc_marker not in doc:
              appendix = f'''\n\n{doc_marker}\n\nAt approximately 00:35 CEST (22:35 UTC on 17 September), the same official UTG Potenza data endpoint was captured twice independently. The two complete responses were byte-identical at **438,471 bytes**, raw SHA-256 **`{RAW_SHA}`**, `Result=OK`, `TotalRecordCount=1035`, with 1,035 distinct numeric source ids. The strict production parser accepted the complete source twice with unchanged schema and diagnostics: **216 listed**, **376 pending**, **443 renewal/update in progress**; 1,034 validated identifiers plus one conservatively retained raw-only identifier; 1,035 application dates; 659 listing dates; 659 expiry dates; and no per-company activity evidence inferred.\n\nThe full parsed source-semantic SHA-256 is now **`{SEM_SHA}`**, rather than the previously approved **`{PREVIOUS_SEM_SHA}`**. A direct comparison with the currently served public Potenza projection confirms that the public-relevant transition remains exactly the already-reviewed boundary: source id **656**, `SCAVONE & C. S.R.L.`, is the sole added id and remains explicitly pending; source id **359**, `MALASPINA S.R.L.`, is the sole existing record changing across the reviewed public fields, from `listed` to `renewal_update_in_progress`; **no source ids were removed**. The prior raw response was intentionally not retained, so the exact auxiliary source-field value responsible for the raw/full-semantic digest drift cannot be reconstructed. The current complete official source is therefore freshly reapproved on positive evidence rather than by assuming byte stability. This does not infer revocation, cancellation, denial, removal, or any other legal effect.\n'''
              doc_path.write_text(doc.rstrip() + appendix + '\n', encoding='utf-8')

          print('reapproved_raw_sha256', RAW_SHA)
          print('reapproved_semantic_sha256', SEM_SHA)
          print('public_relevant_added_ids', sorted(added))
          print('public_relevant_changed_ids', sorted(changed))
          print('diagnostics', json.dumps(diagnostics, ensure_ascii=False, sort_keys=True))
          PY
      - name: Validate reapproved boundary before commit
        run: |
          python -m pytest -q tests/test_potenza_webapp.py tests/test_public_national_registry.py
          python -m white_list_archive.publishing.public_national_registry --config data/publication/multi_prefecture_pilot.json --output /tmp/registry.json --work-dir /tmp/public-build
          python - <<'PY'
          import json
          reg=json.load(open('/tmp/registry.json'))
          pot=[r for r in reg['records'] if r['authority_key']=='potenza']
          assert len(pot)==1035
          assert sum(r['source_status']=='listed' for r in pot)==216
          assert sum(r['source_status']=='pending' for r in pot)==376
          assert sum(r['source_status']=='renewal_update_in_progress' for r in pot)==443
          assert len([r for r in pot if r['source_fields']['physical_locator']=='source-id:656'])==1
          assert len([r for r in pot if r['source_fields']['physical_locator']=='source-id:359'])==1
          print('validated_registry_records', reg['meta']['record_count'])
          print('validated_potenza_records', len(pot))
          PY
      - name: Commit approval evidence and remove temporary finaliser
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/potenza-drift-audit.yml
          git add data/publication/multi_prefecture_pilot.json data/monitoring/national_coverage.json data/source_registry/source_series_inventory.csv docs/sources/potenza-operational-check-2026-09-15.md
          mapfile -t changed < <(git diff --cached --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 5
          git diff --cached --quiet && exit 1 || true
          git commit -m 'data(potenza): reapprove freshly verified current source'
          git push origin HEAD:fix/potenza-source-drift-2026-09-17
