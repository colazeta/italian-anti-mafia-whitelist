name: Catania integration baseline fix

on:
  push:
    branches: [expansion/catania-2026-09-12]
    paths: [.github/workflows/catania-integration-baseline-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/catania-2026-09-12
      - name: Correct evidenced source baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/catania-integration-gate.yml')
          text=p.read_text()
          old="if len(cfg['sources'])!=29: raise SystemExit(f'Unexpected baseline source count {len(cfg[\"sources\"])}')"
          new="if len(cfg['sources'])!=53: raise SystemExit(f'Unexpected baseline source count {len(cfg[\"sources\"])}')"
          if text.count(old)!=1: raise SystemExit(f'baseline guard occurrence count={text.count(old)}')
          p.write_text(text.replace(old,new))
          PY
          git diff --check
      - name: Commit gate correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/catania-integration-gate.yml
          git commit -m 'Correct Catania integration source baseline'
          git push origin HEAD:expansion/catania-2026-09-12
