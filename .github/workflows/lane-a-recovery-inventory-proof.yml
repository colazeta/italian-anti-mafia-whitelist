name: Lane A governed recovery inventory proof

# Four bounded private shards, followed by exact full-denominator reduction.
# Each run attempt rereads its originals and immutable capture provenance.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/lane-a-recovery-inventory-proof.yml
      - src/white_list_archive/storage/inventory_cycle.py
      - src/white_list_archive/storage/inventory_report.py
      - src/white_list_archive/storage/archive_inventory.py
      - src/white_list_archive/storage/recovery_denominator.py
      - src/white_list_archive/storage/robot_recovery.py

permissions:
  contents: read

concurrency:
  group: governed-recovery-inventory
  cancel-in-progress: false

jobs:
  freeze-denominator:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code_revision: ${{ steps.freeze.outputs.code_revision }}
      robot_state_sha: ${{ steps.freeze.outputs.robot_state_sha }}
      generated_at: ${{ steps.freeze.outputs.generated_at }}
      denominator_items: ${{ steps.freeze.outputs.denominator_items }}
      denominator_sha256: ${{ steps.freeze.outputs.denominator_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[storage]'
      - name: Freeze complete robot history and denominator
        id: freeze
        env:
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git fetch --no-tags origin robot-state:refs/remotes/origin/robot-state
          python -m white_list_archive.storage.inventory_cycle freeze \
            --robot-head refs/remotes/origin/robot-state --run-key "$RUN_KEY" >> "$GITHUB_OUTPUT"

  verify-recovery-shard:
    needs: freeze-denominator
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: evidence-archive
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3]
    env:
      PYTHONUNBUFFERED: '1'
      EVIDENCE_BUCKET: ${{ vars.EVIDENCE_BUCKET }}
      EVIDENCE_ENDPOINT: ${{ vars.EVIDENCE_ENDPOINT }}
      EVIDENCE_REGION: ${{ vars.EVIDENCE_REGION }}
      EVIDENCE_POLICY_EVIDENCE: ${{ vars.EVIDENCE_POLICY_EVIDENCE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.EVIDENCE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.EVIDENCE_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.EVIDENCE_SESSION_TOKEN }}
      AWS_EC2_METADATA_DISABLED: 'true'
      RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
      ROBOT_HEAD: ${{ needs.freeze-denominator.outputs.robot_state_sha }}
      GENERATED_AT: ${{ needs.freeze-denominator.outputs.generated_at }}
      DENOMINATOR_ITEMS: ${{ needs.freeze-denominator.outputs.denominator_items }}
      DENOMINATOR_SHA256: ${{ needs.freeze-denominator.outputs.denominator_sha256 }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.freeze-denominator.outputs.code_revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[storage]'
      - name: Verify assigned captures against the complete frozen denominator
        run: |
          git fetch --no-tags origin robot-state:refs/remotes/origin/robot-state
          python -m white_list_archive.storage.inventory_cycle shard \
            --robot-head "$ROBOT_HEAD" --run-key "$RUN_KEY" --generated-at "$GENERATED_AT" \
            --denominator-items "$DENOMINATOR_ITEMS" --denominator-sha256 "$DENOMINATOR_SHA256" \
            --shard "$SHARD"

  verify-complete-denominator:
    needs: [freeze-denominator, verify-recovery-shard]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: evidence-archive
    env:
      PYTHONUNBUFFERED: '1'
      EVIDENCE_BUCKET: ${{ vars.EVIDENCE_BUCKET }}
      EVIDENCE_ENDPOINT: ${{ vars.EVIDENCE_ENDPOINT }}
      EVIDENCE_REGION: ${{ vars.EVIDENCE_REGION }}
      EVIDENCE_POLICY_EVIDENCE: ${{ vars.EVIDENCE_POLICY_EVIDENCE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.EVIDENCE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.EVIDENCE_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.EVIDENCE_SESSION_TOKEN }}
      AWS_EC2_METADATA_DISABLED: 'true'
      RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
      ROBOT_HEAD: ${{ needs.freeze-denominator.outputs.robot_state_sha }}
      GENERATED_AT: ${{ needs.freeze-denominator.outputs.generated_at }}
      DENOMINATOR_ITEMS: ${{ needs.freeze-denominator.outputs.denominator_items }}
      DENOMINATOR_SHA256: ${{ needs.freeze-denominator.outputs.denominator_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.freeze-denominator.outputs.code_revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[storage]'
      - name: Independently read all private shards and prove exact national coverage
        run: |
          git fetch --no-tags origin robot-state:refs/remotes/origin/robot-state
          python -m white_list_archive.storage.inventory_cycle merge \
            --robot-head "$ROBOT_HEAD" --run-key "$RUN_KEY" --generated-at "$GENERATED_AT" \
            --denominator-items "$DENOMINATOR_ITEMS" --denominator-sha256 "$DENOMINATOR_SHA256"

# No source bytes, full manifests, rows, private reports, private report keys or
# storage coordinates are uploaded as Actions artifacts or included in job outputs.
# A partial/failed shard cannot produce a final national inventory checkpoint.
