name: Lane A governed recovery inventory proof

# Lane A Cosenza legacy recovery proof — 2026-09-28
#
# One-shot recovery proof for issue #163. There is intentionally no schedule and no
# workflow_dispatch entry point. A merge that changes this file exercises exact
# historical-package recovery and national denominator migration against the already
# approved private evidence backend while leaving recurring acquisition/publication
# schedules unchanged.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/lane-a-recovery-inventory-proof.yml

permissions:
  actions: read
  contents: read

jobs:
  verify-recovery-denominator:
    name: Recover Cosenza and materialise governed denominator
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: evidence-archive
    env:
      EVIDENCE_BUCKET: ${{ vars.EVIDENCE_BUCKET }}
      EVIDENCE_ENDPOINT: ${{ vars.EVIDENCE_ENDPOINT }}
      EVIDENCE_REGION: ${{ vars.EVIDENCE_REGION }}
      EVIDENCE_POLICY_EVIDENCE: ${{ vars.EVIDENCE_POLICY_EVIDENCE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.EVIDENCE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.EVIDENCE_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.EVIDENCE_SESSION_TOKEN }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install archive runtime
        run: python -m pip install -e '.[storage]'
      - name: Require approved private store
        run: |
          python - <<'PY'
          import os
          from white_list_archive.storage.evidence import StoreConfig
          StoreConfig.from_env()
          required = ('AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY')
          if any(not os.environ.get(name) for name in required):
              raise SystemExit('Required protected evidence-store configuration is unavailable')
          PY
      - name: Download exact retained Cosenza evidence package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9994719997/zip" \
            --output /tmp/cosenza-content-capture.zip
          python - <<'PY'
          import hashlib
          from pathlib import Path

          path = Path('/tmp/cosenza-content-capture.zip')
          expected = '0ff0a21f494685f0f01b73b8dfd905b6cd7193718c4253e8f6a0ed08da257071'
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          if digest != expected:
              raise SystemExit('Retained Cosenza evidence package SHA-256 mismatch')
          print('cosenza_package_sha256_verified=true')
          PY
      - name: Recover exact Cosenza captures and verify denominator migration
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import csv
          import json
          from pathlib import Path

          from white_list_archive.storage.capture_catalogue import CaptureCatalogue
          from white_list_archive.storage.catalogue_recovery import load_catalogued_capture
          from white_list_archive.storage.evidence import EvidenceStore, StoreConfig, client_for
          from white_list_archive.storage.legacy_capture_recovery import (
              recover_legacy_capture_from_package,
          )
          from white_list_archive.storage.recovery_materialize import (
              materialise_national_recovery,
          )
          from white_list_archive.storage.recovery_migration import (
              materialise_migrating_recovery,
          )

          root = Path('.').resolve()
          package = Path('/tmp/cosenza-content-capture.zip')
          config = StoreConfig.from_env()
          store = EvidenceStore(client_for(config), config)
          catalogue = CaptureCatalogue(store)

          authorities = {}
          with (root / 'data/source_registry/source_series_inventory.csv').open(
              encoding='utf-8', newline=''
          ) as handle:
              for row in csv.DictReader(handle):
                  source_key = (row.get('source_series_key') or '').strip()
                  authority_key = (row.get('authority_key') or '').strip()
                  if source_key and authority_key:
                      prior = authorities.get(source_key)
                      if prior is not None and prior != authority_key:
                          raise SystemExit(
                              'Reviewed SourceSeries registry has conflicting authority ownership'
                          )
                      authorities[source_key] = authority_key

          controls = (
              ('potenza-combined', '3c8a4e28-ed29-4502-9b78-cb6e7382c92d'),
              ('aosta-listed', '5748d0d5-14a0-4c2d-9a26-6df0817a7dd5'),
          )
          captures = []
          for source_key, capture_id in controls:
              authority_key = authorities.get(source_key)
              if not authority_key:
                  raise SystemExit(f'Reviewed authority binding unavailable for {source_key}')
              manifest, receipt = load_catalogued_capture(
                  catalogue,
                  source_key=source_key,
                  capture_id=capture_id,
              )
              captures.append(
                  {
                      'authority_key': authority_key,
                      'capture': manifest,
                      'catalogue': receipt,
                      'recovery_paths': [],
                      'durable_absence_confirmed': False,
                      'operator_evidence_refs': [
                          f'lane-a-governed-catalogue-proof:{source_key}:{capture_id}'
                      ],
                  }
              )

          generated_at = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          baseline = materialise_national_recovery(
              repository_root=root,
              store=store,
              plan={
                  'schema_version': 1,
                  'generated_at': generated_at,
                  'recovery_search_complete': False,
                  'captures': captures,
                  'known_version_recovery': [],
              },
          )

          package_sha = '0ff0a21f494685f0f01b73b8dfd905b6cd7193718c4253e8f6a0ed08da257071'
          specs = (
              {
                  'manifest': 'data/captures/cosenza/combined_2026-06-28.json',
                  'member': '2026-06-28/combined.pdf',
              },
              {
                  'manifest': 'data/captures/cosenza/combined_2026-08-03.json',
                  'member': '2026-08-03/combined.pdf',
              },
          )

          migrations = []
          migrated_identities = []
          for spec in specs:
              repository_manifest_path = root / spec['manifest']
              result = recover_legacy_capture_from_package(
                  package_path=package,
                  package_sha256=package_sha,
                  package_manifest_member='cosenza-capture/manifest.json',
                  content_member=spec['member'],
                  repository_manifest_path=repository_manifest_path,
                  source_key='cosenza-combined',
                  store=store,
                  work_dir=Path('/tmp/lane-a-cosenza-recovery'),
              )
              manifest, receipt = load_catalogued_capture(
                  catalogue,
                  source_key=result.manifest['source_key'],
                  capture_id=result.manifest['capture_id'],
              )
              if manifest != result.manifest:
                  raise SystemExit('Catalogue readback changed recovered Cosenza manifest')
              version_key = 'legacy-manifest:' + spec['manifest']
              migrations.append(
                  {
                      'authority_key': 'cosenza',
                      'evidence_version_key': version_key,
                      'sha256': manifest['sha256'],
                      'capture': manifest,
                      'catalogue': receipt,
                      'operator_evidence_refs': [
                          spec['manifest'],
                          'github-actions-run:34051655207',
                          f'github-actions-artifact:9994719997#{spec["member"]}',
                      ],
                  }
              )
              migrated_identities.append(
                  (manifest['source_key'], manifest['capture_id'], version_key)
              )
              print(
                  'recovered_cosenza_capture=' + json.dumps(
                      {
                          'source_key': manifest['source_key'],
                          'capture_id': manifest['capture_id'],
                          'reference_date': manifest['reference_date'],
                          'captured_at': manifest['captured_at'],
                          'sha256': manifest['sha256'],
                          'byte_size': manifest['byte_size'],
                          'durable_content_readback_verified': True,
                          'durable_capture_provenance_readback_verified': True,
                          'content_object_created': bool(result.content_receipt['created']),
                          'capture_record_created': bool(result.catalogue_receipt['created']),
                      },
                      sort_keys=True,
                  )
              )

          migrated = materialise_migrating_recovery(
              repository_root=root,
              store=store,
              plan={
                  'schema_version': 2,
                  'generated_at': generated_at,
                  'recovery_search_complete': False,
                  'captures': captures,
                  'known_version_recovery': [],
                  'capture_migrations': migrations,
              },
          )

          before = baseline['metrics']
          after = migrated['metrics']
          print('baseline_recovery_metrics=' + json.dumps(before, sort_keys=True))
          print('migrated_recovery_metrics=' + json.dumps(after, sort_keys=True))

          expected_deltas = {
              'denominator_items': 0,
              'captures_with_verified_provenance': 2,
              'known_versions_without_capture_identity': -2,
              'verified': 2,
              'recoverable_pending': 0,
              'missing': 0,
              'not_verified': -2,
          }
          for key, delta in expected_deltas.items():
              actual = after[key] - before[key]
              if actual != delta:
                  raise SystemExit(
                      f'Unexpected recovery migration delta for {key}: expected {delta}, got {actual}'
                  )

          capture_items = {
              (item.get('source_key'), item.get('capture_id')): item
              for item in migrated['items']
              if item.get('identity_kind') == 'capture'
          }
          known_keys = {
              item.get('evidence_version_key')
              for item in migrated['items']
              if item.get('identity_kind') == 'known_version'
          }
          for source_key, capture_id, version_key in migrated_identities:
              item = capture_items.get((source_key, capture_id))
              if item is None:
                  raise SystemExit(f'Migrated capture missing from denominator: {capture_id}')
              if item['status'] != 'verified':
                  raise SystemExit(f'Migrated capture is not verified: {capture_id}')
              if not item['durable_original_verified'] or not item['capture_provenance_verified']:
                  raise SystemExit(f'Migrated capture lacks complete provider readback: {capture_id}')
              if version_key in known_keys:
                  raise SystemExit(f'Consumed legacy version remains double-counted: {version_key}')

          print('cosenza_legacy_migration_verified=true')
          PY

# No original bytes, frozen manifests, private recovery reports, storage coordinates or
# working data are uploaded as Actions artefacts. Logs receive only safe aggregate metrics
# and redacted capture identity/readback evidence.
