name: Perugia national integration candidate

on:
  push:
    branches:
      - expansion/perugia-2026-09-14
    paths:
      - .github/workflows/perugia-national-candidate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PDF runtime
        run: |
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && \
               sudo apt-get install -y --no-install-recommends poppler-utils; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Publication runtime package installation failed after bounded retries" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
      - name: Install project
        run: python -m pip install -e '.[dev,database,storage,publication]'
      - name: Apply fail-closed Perugia integration transaction
        run: |
          python tmp/perugia_integrate_candidate.py
          git checkout -- tmp/perugia_integrate_candidate.py
      - name: Run repository and Perugia semantic tests
        run: pytest -q
      - name: Build actual national candidate
        run: |
          rm -rf /tmp/perugia-public-national-sources /tmp/perugia-public-site
          mkdir -p /tmp/perugia-public-site/data
          cp -R public-site/. /tmp/perugia-public-site/
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/perugia-public-national-sources \
            --registry-json /tmp/perugia-public-site/data/registry.json \
            --registry-csv /tmp/perugia-public-site/data/registry.csv \
            --prefectures-json /tmp/perugia-public-site/data/prefectures.json \
            --prefectures-csv /tmp/perugia-public-site/data/prefectures.csv
      - name: Validate candidate denominators and source semantics
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root = Path('/tmp/perugia-public-site/data')
          reg = json.loads((root/'registry.json').read_text(encoding='utf-8'))
          pref = json.loads((root/'prefectures.json').read_text(encoding='utf-8'))
          assert reg['meta']['record_count'] == len(reg['records']) == 40734
          assert reg['meta']['authority_count'] == 37
          assert reg['meta']['register_count'] == 38
          assert pref['meta']['published_count'] == 37
          assert pref['meta']['mapped_count'] == 44
          perugia = [r for r in reg['records'] if r['authority_key'] == 'perugia']
          assert len(perugia) == 2229
          assert Counter(r['source_key'] for r in perugia) == {'perugia-listed': 1016, 'perugia-applicants': 1213}
          assert Counter(r['source_status'] for r in perugia) == {
              'listed': 1710,
              'renewal_update_in_progress': 342,
              'pending': 176,
              'other_or_unknown': 1,
          }
          assert len({r['record_locator'] for r in perugia}) == 2229
          p = [x for x in pref['prefectures'] if x.get('authority_key') == 'perugia']
          assert len(p) == 1 and p[0]['mapped'] and p[0]['published'] and p[0]['series_count'] == 2
          malformed_expiry = [
              r for r in perugia
              if r['source_key'] == 'perugia-listed'
              and r.get('source_fields', {}).get('expiry_date_raw_variants') == ['1 8/11/2026']
          ]
          assert len(malformed_expiry) == 1
          assert malformed_expiry[0]['observed_expiry_date'] == ''
          blank_names = [r for r in perugia if r['source_key'] == 'perugia-applicants' and not r['name']]
          assert len(blank_names) == 1
          assert blank_names[0]['source_row_ordinal'] == 1052
          assert blank_names[0]['identifier_field_raw'] == '03522900541'
          assert blank_names[0]['identifiers'] == ['03522900541']
          bare = [
              r for r in perugia
              if r['source_key'] == 'perugia-applicants'
              and r['name'] == 'BORGIONI PREFABBRICATI S.R.L.'
              and r['source_status'] == 'other_or_unknown'
              and r['outcome_raw'] == '25/03/2026'
          ]
          assert len(bare) == 1
          print(
              'PERUGIA_NATIONAL_CANDIDATE',
              len(perugia),
              reg['meta']['record_count'],
              reg['meta']['authority_count'],
              reg['meta']['register_count'],
              pref['meta']['mapped_count'],
          )
          PY
      - name: Validate recursively closed public artifact
        run: python -m white_list_archive.publishing.public_artifact /tmp/perugia-public-site
      - name: Check production-only transaction diff
        run: |
          git diff --check
          git status --short
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/public-pages.yml',
              'data/monitoring/national_coverage.json',
              'data/publication/multi_prefecture_pilot.json',
              'data/source_registry/source_series_inventory.csv',
              'data/source_registry/verified_primary_pages.csv',
              'docs/sources/perugia-operational-check-2026-09-14.md',
              'src/white_list_archive/publishing/public_national_registry.py',
              'tests/public_portal_browser.cjs',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          assert changed == allowed, (changed, allowed)
          PY
      - name: Commit validated Perugia production integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/public-pages.yml \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            data/source_registry/verified_primary_pages.csv \
            docs/sources/perugia-operational-check-2026-09-14.md \
            src/white_list_archive/publishing/public_national_registry.py \
            tests/public_portal_browser.cjs
          git diff --cached --check
          git commit -m 'Integrate Perugia public source observations'
          git push origin HEAD:expansion/perugia-2026-09-14
