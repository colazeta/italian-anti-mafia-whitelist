name: Trapani integration finalizer

on:
  push:
    branches:
      - expansion/trapani-2026-09-19
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify branch and canonical base
        shell: bash
        run: |
          git fetch origin main
          test "${GITHUB_REF_NAME}" = 'expansion/trapani-2026-09-19'
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-list --count HEAD..origin/main)" = '0'
          test "$(git rev-parse origin/main)" = 'd4f65a5bc106db17ff934a8dc4f2424540b74942'

      - name: Prepare runner package sources
        shell: bash
        run: |
          while IFS= read -r source_file; do
            test -z "$source_file" || sudo rm -f "$source_file"
          done < <(grep -rlE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          if test -f /etc/apt/sources.list; then
            sudo sed -i '\|dl\.google\.com/linux/chrome|d;\|packages\.google\.com/chrome|d' /etc/apt/sources.list
          fi

      - name: Install validation runtime
        shell: bash
        run: |
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends poppler-utils antiword; then
              break
            fi
            if test "$attempt" -eq 3; then
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install --disable-pip-version-check -e '.[dev,publication,storage,database]'

      - name: Materialise permanent Trapani integration
        run: python tmp/trapani_integration_materialize.py

      - name: Validate repository
        run: |
          git diff --check
          python -m pytest -q

      - name: Build national candidate
        shell: bash
        run: |
          rm -rf /tmp/trapani-national
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/trapani-national/sources \
            --registry-json /tmp/trapani-national/registry.json \
            --registry-csv /tmp/trapani-national/registry.csv \
            --prefectures-json /tmp/trapani-national/prefectures.json \
            --prefectures-csv /tmp/trapani-national/prefectures.csv
          python tmp/trapani_candidate_assertions.py

      - name: Commit permanent checkpoint only
        shell: bash
        run: |
          permanent=(
            .github/workflows/public-pages.yml
            data/catalog.csv
            data/monitoring/national_coverage.json
            data/publication/multi_prefecture_pilot.json
            data/source_registry/source_series_inventory.csv
            data/source_registry/verified_primary_pages.csv
            docs/sources/trapani-operational-check-2026-09-19.md
            src/white_list_archive/parsers/trapani_tables.py
            src/white_list_archive/publishing/public_national_registry.py
            tests/public_portal_browser.cjs
            tests/test_source_population_coverage.py
            tests/test_trapani_parser_semantics.py
          )
          git add -- "${permanent[@]}"
          git diff --cached --check
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          if printf '%s\n' "$staged" | grep -E '^\.github/workflows/trapani-|^scripts/(patch_trapani|trapani_shape)|^tmp/trapani'; then
            echo 'Temporary Trapani mechanism leaked into permanent checkpoint' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate Trapani White List sources'
          git push origin HEAD:expansion/trapani-2026-09-19
