name: Gorizia registration grouping probe

on:
  push:
    branches:
      - expansion/gorizia-2026-09-13
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive conservative listed registration groups
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from collections import Counter, defaultdict
          from pathlib import Path

          source = json.loads(Path("tmp/gorizia_listed_tables.json").read_text(encoding="utf-8"))

          def clean(value: str | None) -> str:
              return re.sub(r"\s+", " ", value or "").strip()

          rows = []
          for table in source:
              section = int(table["table"])
              for item in table["rows"][1:]:
                  values = [clean(v) for v in item["physical_cells"]]
                  if not any(values):
                      continue
                  if len(values) != 7:
                      raise RuntimeError(f"section {section} row {item['row']} width drift: {values!r}")
                  name, office, secondary, identifier_raw, listing_raw, expiry_raw, update_raw = values
                  if not name:
                      raise RuntimeError(f"section {section} row {item['row']} has no company name")
                  rows.append({
                      "section": section,
                      "source_row": int(item["row"]),
                      "name": name,
                      "office": office,
                      "secondary": secondary,
                      "identifier_raw": identifier_raw,
                      "listing_raw": listing_raw,
                      "expiry_raw": expiry_raw,
                      "update_raw": update_raw,
                  })

          if len(rows) != 186:
              raise RuntimeError(f"Gorizia listed sector-row drift: {len(rows)} != 186")

          # Conservative registration key: exact cleaned source strings for identity and registration dates.
          # Sector and update are attributes of the registration, not identity keys. No spelling/address/ID/date
          # normalisation is used to merge observations.
          groups = defaultdict(list)
          for row in rows:
              key = (
                  row["name"], row["office"], row["secondary"], row["identifier_raw"],
                  row["listing_raw"], row["expiry_raw"],
              )
              groups[key].append(row)

          records = []
          status_counts = Counter()
          update_set_counts = Counter()
          multi_sector_groups = 0
          update_conflict_groups = []
          source_row_coverage = 0
          for key, members in groups.items():
              sections = sorted({member["section"] for member in members})
              updates = sorted({member["update_raw"] for member in members})
              nonblank_updates = sorted({value for value in updates if value})
              status = "renewal_update_in_progress" if nonblank_updates else "listed"
              status_counts[status] += 1
              update_set_counts[" | ".join(updates)] += 1
              if len(sections) > 1:
                  multi_sector_groups += 1
              if len(nonblank_updates) > 1 or (nonblank_updates and "" in updates):
                  update_conflict_groups.append({
                      "name": key[0],
                      "identifier_raw": key[3],
                      "listing_raw": key[4],
                      "expiry_raw": key[5],
                      "sections": sections,
                      "update_values": updates,
                      "source_rows": [[m["section"], m["source_row"]] for m in members],
                  })
              source_row_coverage += len(members)
              records.append({
                  "name": key[0],
                  "office": key[1],
                  "secondary": key[2],
                  "identifier_raw": key[3],
                  "listing_raw": key[4],
                  "expiry_raw": key[5],
                  "status": status,
                  "update_values": updates,
                  "sections": sections,
                  "source_rows": [[m["section"], m["source_row"]] for m in members],
              })

          if source_row_coverage != 186:
              raise RuntimeError(f"Gorizia grouped source-row coverage drift: {source_row_coverage} != 186")

          # Detect near-collisions but never merge them. These are diagnostics for reviewer attention.
          by_identifier_dates = defaultdict(list)
          for record in records:
              by_identifier_dates[(record["identifier_raw"], record["listing_raw"], record["expiry_raw"])].append(record)
          near_collisions = [
              {
                  "identifier_raw": key[0],
                  "listing_raw": key[1],
                  "expiry_raw": key[2],
                  "names": sorted({record["name"] for record in members}),
                  "offices": sorted({record["office"] for record in members}),
                  "records": len(members),
              }
              for key, members in by_identifier_dates.items()
              if len(members) > 1 and (len({r["name"] for r in members}) > 1 or len({r["office"] for r in members}) > 1)
          ]

          report = {
              "authority_key": "gorizia",
              "grouping_contract": "exact cleaned (name, office, secondary, identifier_raw, listing_raw, expiry_raw); aggregate sectors and update values; no fuzzy merge",
              "sector_rows": len(rows),
              "registration_groups": len(records),
              "status_counts": dict(status_counts),
              "multi_sector_groups": multi_sector_groups,
              "single_sector_groups": len(records) - multi_sector_groups,
              "source_row_coverage": source_row_coverage,
              "update_set_counts": dict(sorted(update_set_counts.items())),
              "update_conflict_group_count": len(update_conflict_groups),
              "update_conflict_groups": update_conflict_groups,
              "near_collision_count": len(near_collisions),
              "near_collisions": near_collisions,
              "records": records,
          }
          Path("tmp/gorizia_registration_probe.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "sector_rows": report["sector_rows"],
              "registration_groups": report["registration_groups"],
              "status_counts": report["status_counts"],
              "multi_sector_groups": report["multi_sector_groups"],
              "update_conflict_group_count": report["update_conflict_group_count"],
              "near_collision_count": report["near_collision_count"],
          }, indent=2, ensure_ascii=False))
          PY

      - name: Checkpoint registration grouping probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/gorizia_registration_probe.json
          if git diff --cached --quiet; then
            echo "No registration-probe change to checkpoint."
            exit 0
          fi
          git commit -m "Checkpoint Gorizia registration grouping probe"
          git push
