name: Frosinone parser probe

on:
  push:
    branches:
      - expansion/frosinone-2026-09-13
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser runtime
        run: python -m pip install --disable-pip-version-check -e . requests pdfplumber
      - name: Probe reviewed fragment invariant without changing production parser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          python - <<'PY'
          import hashlib, json
          from collections import Counter
          from pathlib import Path
          import requests
          import white_list_archive.parsers.frosinone_tables as ft

          LANDING = "https://prefettura.interno.gov.it/it/prefetture/frosinone/evidenza/white-list"
          sources = {
            "listed": ("https://prefettura.interno.gov.it/sites/default/files/9/2026-09/elenco-societa-iscritte-white-list-al-2-settembre-2026-aggiornato.pdf", "aad166b49393055a197b9b1fef4eba82d0a70453a90d84209f967180d2855d71", "frosinone-listed", "listed"),
            "applicants": ("https://prefettura.interno.gov.it/sites/default/files/9/2026-09/elenco-ric-iscr-white-list-aggiornato-al-2-settembre-2026-ordine-alfabetico-ok.pdf", "9906d55864f4c1dc8e027efa2b44fa2c6463c512fb34241a32aa9b21a5ba6db8", "frosinone-applicants", "applicant"),
          }
          headers={"User-Agent":"Mozilla/5.0 whitelist-archive-frosinone-probe/1.0","Accept":"application/pdf,*/*;q=0.8","Referer":LANDING}
          def capture(key):
            url, expected, source_key, scope=sources[key]
            r=requests.get(url,headers=headers,timeout=(20,120)); r.raise_for_status()
            body=r.content; digest=hashlib.sha256(body).hexdigest()
            if digest != expected: raise RuntimeError(f"{key} SHA drift: {digest}")
            p=Path(f"tmp/frosinone_{key}_probe.pdf"); p.write_bytes(body)
            return p,{"source_key":source_key,"authority_key":"frosinone","authority_name":"Prefettura di Frosinone","register_key":"frosinone-white-list","register_name":"White List - Prefettura di Frosinone","population_scope":scope,"reference_date":"2026-09-02","source_page_url":LANDING,"resource_url":url,"sha256":expected}

          listed_path, listed_cfg=capture("listed")
          applicants_path, applicants_cfg=capture("applicants")
          original=ft._EXPECTED_LISTED_FRAGMENT_ROWS
          ft._EXPECTED_LISTED_FRAGMENT_ROWS=44
          report={"production_expected_fragment_rows":original,"probe_fragment_rows":44}
          try:
            listed=ft.parse_frosinone_listed(listed_path,listed_cfg)
            applicants=ft.parse_frosinone_applicants(applicants_path,applicants_cfg)
            statuses=Counter(r["source_status"] for r in listed.records+applicants.records)
            report.update({
              "probe_completed": True,
              "listed": listed.diagnostics,
              "applicants": applicants.diagnostics,
              "combined_public_records": len(listed.records)+len(applicants.records),
              "combined_status_counts": dict(statuses),
              "blank_outcome_count": sum(not r["outcome_raw"] for r in applicants.records),
              "pagliaroli": [
                {"identifiers":r["identifiers"],"fragments":r["source_fields"]["continuation_fragments"]}
                for r in applicants.records if r["name"]=="PAGLIAROLI LORENZO – IMPRESA INDIVIDUALE"
              ],
              "draghetto": [
                {"raw":r["source_fields"]["application_date_raw"],"parsed":r["application_date"]}
                for r in applicants.records if r["name"]=="DRAGHETTO S.R.L."
              ],
              "joy": [
                {"raw":r["source_fields"]["application_date_raw"],"parsed":r["application_date"]}
                for r in applicants.records if r["name"]=="JOY S.R.L."
              ],
            })
          except Exception as exc:
            report.update({"probe_completed":False,"error_type":type(exc).__name__,"error":str(exc)})
          Path("tmp/frosinone_parser_probe.json").write_text(json.dumps(report,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY
      - name: Checkpoint probe
        shell: bash
        run: |
          set -euo pipefail
          rm -f tmp/frosinone_listed_probe.pdf tmp/frosinone_applicants_probe.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/frosinone_parser_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Checkpoint Frosinone parser probe"
          git push
