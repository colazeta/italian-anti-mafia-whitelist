name: Lecco reviewed blank activity fix

on:
  push:
    branches:
      - expansion/lecco-2026-09-15
    paths:
      - .github/workflows/lecco-reviewed-blank-activity-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: expansion/lecco-2026-09-15
          fetch-depth: 0

      - name: Apply reviewed source-specific blank-activity handling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/white_list_archive/parsers/lecco_rect_tables.py")
          lines = path.read_text(encoding="utf-8").splitlines()

          marker = '_REVIEWED_MALFORMED_LISTED_IDENTIFIERS = {'
          start = lines.index(marker)
          end = lines.index('}', start)
          constant = '_REVIEWED_BLANK_LISTED_ACTIVITIES = {"Termoidraulica"}'
          if constant not in lines:
              lines.insert(end + 1, constant)

          fn = lines.index('def parse_lecco_listed(path: Path, cfg: dict[str, Any]) -> ParsedBatch:')
          malformed = lines.index('    malformed: dict[str, str] = {}', fn)
          accumulator = '    blank_activity_names: set[str] = set()'
          if accumulator not in lines[fn:]:
              lines.insert(malformed + 1, accumulator)

          section_line = '        sections = _sections(activities_raw, source_key=_LISTED_SOURCE_KEY, locator=item["locator"])'
          section_idx = lines.index(section_line, fn)
          replacement = [
              '        if _clean(activities_raw):',
              '            sections = _sections(activities_raw, source_key=_LISTED_SOURCE_KEY, locator=item["locator"])',
              '        elif name in _REVIEWED_BLANK_LISTED_ACTIVITIES:',
              '            blank_activity_names.add(name)',
              '            sections = []',
              '        else:',
              '            raise RuntimeError(',
              '                f"Lecco unreviewed blank listed activity at {item[\'locator\']}: {name!r}"',
              '            )',
          ]
          lines[section_idx:section_idx + 1] = replacement

          drift = '    if blank_activity_names != _REVIEWED_BLANK_LISTED_ACTIVITIES:'
          if drift not in lines[fn:]:
              malformed_check = lines.index('    if malformed != _REVIEWED_MALFORMED_LISTED_IDENTIFIERS:', fn)
              close = lines.index('        )', malformed_check)
              drift_block = [
                  drift,
                  '        raise RuntimeError(',
                  '            "Lecco reviewed blank-activity set drift: "',
                  '            f"{blank_activity_names!r} != {_REVIEWED_BLANK_LISTED_ACTIVITIES!r}"',
                  '        )',
              ]
              lines[close + 1:close + 1] = drift_block

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          git diff --check
          git diff -- src/white_list_archive/parsers/lecco_rect_tables.py

      - name: Commit reviewed parser fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/white_list_archive/parsers/lecco_rect_tables.py
          git diff --cached --quiet && { echo 'No parser change to commit'; exit 0; }
          git commit -m 'Handle reviewed blank Lecco activity without inference'
          git push origin HEAD:expansion/lecco-2026-09-15
