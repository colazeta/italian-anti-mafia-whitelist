name: Milano transitioned national validation

on:
  push:
    branches:
      - fix/milano-source-drift-2026-09-17
    paths:
      - .github/workflows/milano-transition-national-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile with current main
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-list --count HEAD..origin/main)" = 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PDF runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Install publication runtime
        run: python -m pip install -e '.[dev,database,storage,publication]'
      - name: Build transitioned national boundary with source diagnostics
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from white_list_archive.publishing import public_national_build as build
          from white_list_archive.publishing import public_national_registry as registry

          original_download = registry._download
          def diagnostic_download(url, path):
              print(f'NATIONAL_SOURCE_FETCH={url}', flush=True)
              return original_download(url, path)
          registry._download = diagnostic_download

          sys.argv = [
              'white-list-public-national-build',
              '--source-config', 'data/publication/multi_prefecture_pilot.json',
              '--verified-pages', 'data/source_registry/verified_primary_pages.csv',
              '--source-series', 'data/source_registry/source_series_inventory.csv',
              '--authority-aliases', 'data/source_registry/national_index_authority_aliases.csv',
              '--work-dir', '/tmp/milano-transition-national-diagnostic',
              '--registry-json', 'public-site/data/registry.json',
              '--registry-csv', 'public-site/data/registry.csv',
              '--prefectures-json', 'public-site/data/prefectures.json',
              '--prefectures-csv', 'public-site/data/prefectures.csv',
          ]
          raise SystemExit(build.main())
          PY
      - name: Validate transitioned national output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reg = json.loads(Path('public-site/data/registry.json').read_text(encoding='utf-8'))
          pref = json.loads(Path('public-site/data/prefectures.json').read_text(encoding='utf-8'))
          assert reg['meta']['record_count'] == 54177, reg['meta']['record_count']
          assert len(reg['meta']['authority_counts']) == 47, len(reg['meta']['authority_counts'])
          assert len(reg['meta']['register_counts']) == 48, len(reg['meta']['register_counts'])
          mapped = sum(bool(x.get('mapped')) for x in pref['prefectures'])
          published = sum(bool(x.get('published')) for x in pref['prefectures'])
          assert mapped == 47, mapped
          assert published == 47, published
          milano = [r for r in reg['records'] if r['authority_key'] == 'milano']
          assert len(milano) == 2612
          assert sum(r['source_status'] == 'listed' for r in milano) == 933
          assert sum(r['source_status'] == 'renewal_update_in_progress' for r in milano) == 517
          assert sum(r['source_status'] == 'pending' for r in milano) == 1162
          assert len({r['record_locator'] for r in milano}) == 2612
          assert sum(bool(r['identifiers']) for r in milano) == 2612
          removed = {'04793740962','06960770961','07693660156','09835880155','10674330963','11016700152'}
          present = {r['identifier_field_raw'] for r in milano}
          assert not removed & present
          print(f"national boundary verified: records={reg['meta']['record_count']} authorities={len(reg['meta']['authority_counts'])} registers={len(reg['meta']['register_counts'])} mapped={mapped} published={published} Milano={len(milano)}")
          PY
