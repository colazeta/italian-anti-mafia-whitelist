name: Bologna ordinary source probe

on:
  push:
    branches:
      - feature/multi-prefecture-pilot
    paths:
      - 'src/white_list_archive/acquisition/bologna_ordinary_probe.py'
      - '.github/workflows/bologna-ordinary-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python -m pip install -e .
      - name: Probe nested ordinary register page
        run: python -m white_list_archive.acquisition.bologna_ordinary_probe
      - uses: actions/upload-artifact@v4
        with:
          name: bologna-ordinary-source-probe
          path: artifacts/bologna-ordinary-probe
          retention-days: 7
