name: Trapani listed diagnostic
on:
  push:
    branches: [expansion/trapani-2026-09-19]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e '.[dev,publication,storage,database]'
      - name: Fetch and bind exact official evidence
        run: |
          URL='https://prefettura.interno.gov.it/sites/default/files/97/2026-09/elenco-ditte-iscritte-negli-elenchi-delle-white-list-aggiornato-all-11.09.2026.pdf'
          curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "$URL?_wl_diag=1-${GITHUB_RUN_ID}" -o /tmp/a.pdf
          curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "$URL?_wl_diag=2-${GITHUB_RUN_ID}" -o /tmp/b.pdf
          test "$(sha256sum /tmp/a.pdf | cut -d' ' -f1)" = '060c5ddb20b24f733066b59f27aa1ea98a8fdc04d22b0196b90c9e383253b476'
          cmp /tmp/a.pdf /tmp/b.pdf
          python - <<'PY'
          import json, re
          from datetime import datetime
          import pdfplumber
          def clean(v): return re.sub(r'\s+',' ',(v or '').replace('\u00a0',' ')).strip()
          def is_date(v):
              m=re.fullmatch(r'(\d{1,2})\s*/\s*(\d{1,2})\s*/\s*(\d{4})', clean(v))
              if not m: return False
              try: datetime(int(m.group(3)),int(m.group(2)),int(m.group(1))); return True
              except ValueError: return False
          nondate=[]
          with pdfplumber.open('/tmp/a.pdf') as pdf:
              for pi,p in enumerate(pdf.pages,1):
                  for ti,t in enumerate(sorted(p.find_tables(), key=lambda x: float(x.bbox[1])),1):
                      for ri,raw in enumerate(t.extract() or [],1):
                          row=[clean(x) for x in raw]
                          if len(row)==6: row.append('')
                          if len(row) != 7: continue
                          ident=row[3]
                          if re.fullmatch(r'(?:\d{11}|[A-Za-z0-9]{16})', ident) and row[5] and not is_date(row[5]):
                              nondate.append({'page':pi,'table':ti,'row':ri,'name':row[0],'office':row[1],'secondary':row[2],'identifier':ident,'listed':row[4],'expiry':row[5],'update':row[6]})
          expected=[{'page':8,'table':1,'row':2,'name':'CALCESTRUZZI DI ROMANO ALESSANDRO','office':'MARSALA','secondary':'','identifier':'05913370820','listed':'30/08/2017','expiry':'In amministrazio ne giudiziaria e fermo restando fino al permanere della stessa','update':''}]
          if nondate != expected:
              raise SystemExit('Trapani unique non-date expiry evidence drift: '+json.dumps(nondate,ensure_ascii=False,sort_keys=True))
          print('TRAPANI_NONDATE_EXPIRY',json.dumps(nondate[0],ensure_ascii=False,sort_keys=True))
          PY
      - name: Patch exact parser exception
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/white_list_archive/parsers/trapani_tables.py')
          text=path.read_text()
          old_anchor='        elif identifier == "01712150819":\n'
          new_anchor='        elif identifier == "05913370820":\n'
          if old_anchor in text:
              if text.count(old_anchor) != 1:
                  raise SystemExit('Trapani old parser anchor count drift')
              start=text.index(old_anchor)
              end=text.index('        else:\n            raise RuntimeError(\n                f"Trapani listed expiry-date evidence drift', start)
              new_lines=[
                  '        elif identifier == "05913370820":',
                  '            expected = {',
                  '                "rows": 1,',
                  '                "pages": ["8"],',
                  '                "names": ["CALCESTRUZZI DI ROMANO ALESSANDRO"],',
                  '                "offices": ["MARSALA"],',
                  '                "listing_raw": ["30/08/2017"],',
                  '                "expiry_raw": [_LISTED_JUDICIAL_ADMINISTRATION_EXPIRY],',
                  '                "updates": [""],',
                  '            }',
                  '            observed = {',
                  '                "rows": len(rows),',
                  '                "pages": _ordered_unique([str(row["page"]) for row in rows]),',
                  '                "names": name_variants,',
                  '                "offices": office_variants,',
                  '                "listing_raw": listing_raw_variants,',
                  '                "expiry_raw": expiry_raw_variants,',
                  '                "updates": [row["update_raw"] for row in rows],',
                  '            }',
                  '            if observed != expected:',
                  '                raise RuntimeError(f"Trapani judicial-administration expiry evidence drift: {observed!r}")',
                  '            non_date_expiry_records += 1',
              ]
              path.write_text(text[:start]+'\n'.join(new_lines)+'\n'+text[end:])
          elif text.count(new_anchor) != 1:
              raise SystemExit('Trapani parser correction anchor missing/drifted')
          PY
      - name: Validate corrected parser and repository
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          from white_list_archive.parsers.trapani_tables import parse_trapani_listed
          cfg={'authority_key':'trapani','authority_name':'Prefettura di Trapani','register_key':'trapani-ordinary','register_name':'White List ordinaria','reference_date':'2026-09-11','source_key':'trapani-listed','population_scope':'listed','source_page_url':'https://prefettura.interno.gov.it/it/prefetture/trapani/evidenza/white-list','resource_url':'https://prefettura.interno.gov.it/sites/default/files/97/2026-09/elenco-ditte-iscritte-negli-elenchi-delle-white-list-aggiornato-all-11.09.2026.pdf','sha256':'060c5ddb20b24f733066b59f27aa1ea98a8fdc04d22b0196b90c9e383253b476'}
          batch=parse_trapani_listed(Path('/tmp/a.pdf'),cfg)
          assert len(batch.records)==333,batch.diagnostics
          assert batch.diagnostics['non_date_expiry_records']==1,batch.diagnostics
          assert Counter(r['source_status'] for r in batch.records)==Counter({'listed':177,'renewal_update_in_progress':156})
          row=next(r for r in batch.records if r['identifiers'] and r['identifiers'][0]=='05913370820')
          assert row['observed_expiry_date']==''
          assert row['source_fields']['expiry_date_raw_variants']==['In amministrazio ne giudiziaria e fermo restando fino al permanere della stessa']
          print(batch.diagnostics)
          PY
          python -m pytest -q
      - name: Commit parser correction only
        run: |
          if git diff --quiet -- src/white_list_archive/parsers/trapani_tables.py; then
            echo 'Parser correction already present; no commit needed.'
            exit 0
          fi
          test "$(git diff --name-only | tr '\n' ' ')" = 'src/white_list_archive/parsers/trapani_tables.py '
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/white_list_archive/parsers/trapani_tables.py
          git diff --cached --check
          git commit -m 'Bind Trapani judicial-administration expiry evidence'
          git push origin HEAD:expansion/trapani-2026-09-19
