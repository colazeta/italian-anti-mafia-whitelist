name: Trapani listed diagnostic
on:
  push:
    branches: [expansion/trapani-2026-09-19]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pdfplumber
      - name: Fetch pinned official PDF twice
        run: |
          URL='https://prefettura.interno.gov.it/sites/default/files/97/2026-09/elenco-ditte-iscritte-negli-elenchi-delle-white-list-aggiornato-all-11.09.2026.pdf'
          curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "$URL?_wl_diag=1-${GITHUB_RUN_ID}" -o /tmp/a.pdf
          curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "$URL?_wl_diag=2-${GITHUB_RUN_ID}" -o /tmp/b.pdf
          test "$(sha256sum /tmp/a.pdf | cut -d' ' -f1)" = '060c5ddb20b24f733066b59f27aa1ea98a8fdc04d22b0196b90c9e383253b476'
          cmp /tmp/a.pdf /tmp/b.pdf
      - name: Resolve every non-data row against its predecessor
        run: |
          python - <<'PY'
          import json, re
          import pdfplumber
          def clean(v): return re.sub(r'\s+',' ',(v or '').replace('\u00a0',' ')).strip()
          ident = re.compile(r'^(?:\d{11}|[A-Za-z0-9]{16})$')
          last_valid=None
          anomalies=[]
          with pdfplumber.open('/tmp/a.pdf') as pdf:
              for pi,p in enumerate(pdf.pages,1):
                  for ti,t in enumerate(sorted(p.find_tables(), key=lambda x: float(x.bbox[1])),1):
                      extracted=t.extract() or []
                      for ri,raw in enumerate(extracted,1):
                          row=[clean(x) for x in raw]
                          if len(row)==6: row.append('')
                          if not any(row): continue
                          joined=' '.join(row).casefold()
                          if 'ragione sociale' in joined and 'codice fiscale' in joined:
                              continue
                          current={'page':pi,'table':ti,'row':ri,'values':row}
                          if len(row)==7 and row[0] and ident.fullmatch(row[3]):
                              last_valid=current
                          else:
                              following=[]
                              for nxt in extracted[ri:ri+2]:
                                  vals=[clean(x) for x in nxt]
                                  if len(vals)==6: vals.append('')
                                  following.append(vals)
                              anomalies.append({'anomaly':current,'previous_valid':last_valid,'following_rows':following})
              print('ANOMALY_CONTEXT_COUNT',len(anomalies))
              for item in anomalies:
                  print('CONTEXT',json.dumps(item,ensure_ascii=False))
          PY
