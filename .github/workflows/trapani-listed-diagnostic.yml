name: Trapani listed diagnostic
on:
  push:
    branches: [expansion/trapani-2026-09-19]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pdfplumber
      - name: Fetch pinned official PDF twice
        run: |
          URL='https://prefettura.interno.gov.it/sites/default/files/97/2026-09/elenco-ditte-iscritte-negli-elenchi-delle-white-list-aggiornato-all-11.09.2026.pdf'
          curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "$URL?_wl_diag=1-${GITHUB_RUN_ID}" -o /tmp/a.pdf
          curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "$URL?_wl_diag=2-${GITHUB_RUN_ID}" -o /tmp/b.pdf
          test "$(sha256sum /tmp/a.pdf | cut -d' ' -f1)" = '060c5ddb20b24f733066b59f27aa1ea98a8fdc04d22b0196b90c9e383253b476'
          cmp /tmp/a.pdf /tmp/b.pdf
          sha256sum /tmp/a.pdf
          stat -c '%s bytes' /tmp/a.pdf
      - name: Inspect tables and source boundary
        run: |
          python - <<'PY'
          import collections, json, re
          import pdfplumber
          def clean(v): return re.sub(r'\s+',' ',(v or '').replace('\u00a0',' ')).strip()
          def ids(raw): return re.findall(r'(?<![A-Z0-9])(?:\d{11}|[A-Z0-9]{16})(?![A-Z0-9])', clean(raw).upper())
          with pdfplumber.open('/tmp/a.pdf') as pdf:
              print('PAGES', len(pdf.pages))
              print('GEOMETRY', sorted({(round(float(p.width),2), round(float(p.height),2)) for p in pdf.pages}))
              table_counts=[]; row_counts=[]; headers=collections.Counter(); last=collections.Counter(); rawonly=collections.Counter(); structured=0; examples=[]
              for pi,p in enumerate(pdf.pages,1):
                  tables=p.find_tables(); table_counts.append(len(tables)); data=[]
                  for ti,t in enumerate(tables,1):
                      extracted=t.extract() or []
                      if pi in (17, 18):
                          print(f'PAGE{pi}_TABLE', ti, 'ROWS', len(extracted))
                          for ri, raw in enumerate(extracted,1):
                              print(f'PAGE{pi}_ROW', ti, ri, json.dumps([clean(x) for x in raw], ensure_ascii=False))
                      for raw in extracted:
                          vals=[clean(x) for x in raw]
                          if not any(vals): continue
                          joined=' '.join(vals).casefold()
                          if 'ragione sociale' in joined and ('codice fiscale' in joined or 'partita i.v.a' in joined or 'partita iva' in joined):
                              headers[tuple(vals)] += 1; continue
                          if len(vals) >= 3 and vals[0] and vals[1]: data.append(vals)
                  row_counts.append(len(data))
                  for vals in data:
                      idraw=vals[3] if len(vals)>3 else vals[2]
                      if ids(idraw): structured += 1
                      else: rawonly[idraw] += 1
                      last[vals[-1]] += 1
                      if len(examples)<20: examples.append([pi,vals])
              print('TABLE_COUNTS',table_counts)
              print('DATA_ROW_COUNTS',row_counts,'TOTAL',sum(row_counts))
              print('HEADERS',json.dumps([{'count':c,'row':list(k)} for k,c in headers.items()],ensure_ascii=False))
              print('STRUCTURED_ID_ROWS',structured,'RAW_ONLY_ROWS',sum(rawonly.values()))
              print('RAW_ONLY_TOP',json.dumps(rawonly.most_common(50),ensure_ascii=False))
              print('LAST_COLUMN_COUNTS',json.dumps(last.most_common(100),ensure_ascii=False))
              print('EXAMPLES',json.dumps(examples,ensure_ascii=False))
              print('FIRST_TEXT',clean(pdf.pages[0].extract_text() or '')[:7000])
              print('LAST_TEXT',clean(pdf.pages[-1].extract_text() or '')[-7000:])
          PY
