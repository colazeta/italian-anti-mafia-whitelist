name: Ferrara browser gate repair

on:
  push:
    branches:
      - expansion/ferrara-2026-09-20
    paths:
      - '.github/workflows/ferrara-browser-gate-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Ferrara branch
        uses: actions/checkout@v4
        with:
          ref: expansion/ferrara-2026-09-20
          fetch-depth: 0
      - name: Align browser acceptance gate with validated Ferrara candidate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/public_portal_browser.cjs')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "      assert.ok(labels.includes('White List ordinaria · Prefettura di Siracusa'));\n",
                  "      assert.ok(labels.includes('White List ordinaria · Prefettura di Siracusa'));\n"
                  "      assert.ok(labels.includes('White List ordinaria · Prefettura di Ferrara'));\n"
                  "      assert.ok(labels.includes('White List ricostruzione · Prefettura di Ferrara'));\n",
              ),
              (
                  "      assert.equal(stats.total,69474);\n",
                  "      assert.equal(stats.total,71057);\n",
              ),
              (
                  ",'palermo','matera','siracusa'].includes(r.authority_key));\n",
                  ",'palermo','matera','siracusa','ferrara'].includes(r.authority_key));\n",
              ),
              (
                  "      assert.equal(siracusa.filter(r=>r.source_key==='siracusa-applicants'&&r.source_fields.application_date_raw_variants.includes('17.01/2024')&&r.application_date==='').length,1);\n",
                  "      assert.equal(siracusa.filter(r=>r.source_key==='siracusa-applicants'&&r.source_fields.application_date_raw_variants.includes('17.01/2024')&&r.application_date==='').length,1);\n"
                  "      const ferrara=registry.records.filter(r=>r.authority_key==='ferrara');\n"
                  "      assert.equal(ferrara.length,1583);\n"
                  "      assert.equal(ferrara.filter(r=>r.source_key==='ferrara-provincial-listed').length,868);\n"
                  "      assert.equal(ferrara.filter(r=>r.source_key==='ferrara-provincial-applicants').length,21);\n"
                  "      assert.equal(ferrara.filter(r=>r.source_key==='ferrara-reconstruction-listed').length,694);\n"
                  "      assert.deepEqual(statusCounts(ferrara),{listed:1256,other_or_unknown:3,pending:21,renewal_update_in_progress:303});\n"
                  "      assert.equal(new Set(ferrara.map(r=>r.record_locator)).size,1583);\n"
                  "      assert.equal(ferrara.filter(r=>r.identifiers.length>0).length,1563);\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one replacement target, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          node --check tests/public_portal_browser.cjs
          git diff --check
          git diff -- tests/public_portal_browser.cjs
      - name: Commit exact repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/public_portal_browser.cjs
          git diff --cached --quiet && { echo 'No browser gate repair required'; exit 0; }
          git commit -m 'Align public browser gate with Ferrara expansion'
          git push origin HEAD:expansion/ferrara-2026-09-20
