name: Pordenone final PR cleanup

on:
  push:
    branches:
      - expansion/pordenone-2026-09-20
    paths:
      - '.github/workflows/pordenone-pr-prep.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pordenone-final-cleanup
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: expansion/pordenone-2026-09-20
          fetch-depth: 0

      - name: Require current main ancestry and prepared candidate
        run: |
          git fetch origin main
          behind=$(git rev-list --count HEAD..origin/main)
          if [ "$behind" -ne 0 ]; then
            echo "Pordenone branch is behind current main by $behind commit(s)" >&2
            exit 1
          fi
          test -f tmp/pordenone-public-pages.yml
          test -f .github/workflows/public-pages.yml
          grep -q "assert reg\['meta'\]\['record_count'\] == 71490" tmp/pordenone-public-pages.yml
          grep -q "assert reg\['meta'\]\['authority_count'\] == 68" tmp/pordenone-public-pages.yml
          grep -q "assert reg\['meta'\]\['register_count'\] == 71" tmp/pordenone-public-pages.yml
          grep -q "assert pref\['meta'\]\['published_count'\] == 68" tmp/pordenone-public-pages.yml
          grep -q "pordenone" tmp/pordenone-public-pages.yml
          cp tmp/pordenone-public-pages.yml .github/workflows/public-pages.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare runner package sources
        run: |
          while IFS= read -r source_file; do
            [ -n "$source_file" ] && sudo rm -f "$source_file"
          done < <(grep -rlE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '\|dl\.google\.com/linux/chrome|d;\|packages\.google\.com/chrome|d' /etc/apt/sources.list
          fi

      - name: Install validation runtime
        run: |
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends poppler-utils antiword; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Validation runtime installation failed after bounded retries' >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[dev,storage,database,publication]'

      - name: Validate permanent Pordenone surface
        run: |
          python -m pytest -q tests/test_pordenone_public_bundle.py tests/test_source_registry.py tests/test_source_population_coverage.py tests/test_public_history.py
          node --check tests/public_portal_browser.cjs
          python -m pytest -q

      - name: Build and validate national candidate off-tree
        run: |
          rm -rf /tmp/pordenone-final-site /tmp/pordenone-final-sources
          cp -a public-site /tmp/pordenone-final-site
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/pordenone-final-sources \
            --registry-json /tmp/pordenone-final-site/data/registry.json \
            --registry-csv /tmp/pordenone-final-site/data/registry.csv \
            --prefectures-json /tmp/pordenone-final-site/data/prefectures.json \
            --prefectures-csv /tmp/pordenone-final-site/data/prefectures.csv
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/pordenone-final-site')
          reg = json.loads((root / 'data/registry.json').read_text(encoding='utf-8'))
          pref = json.loads((root / 'data/prefectures.json').read_text(encoding='utf-8'))
          rows = [r for r in reg['records'] if r['authority_key'] == 'pordenone']
          assert reg['meta']['record_count'] == 71490
          assert reg['meta']['authority_count'] == 68
          assert reg['meta']['register_count'] == 71
          assert pref['meta']['published_count'] == 68
          assert pref['meta']['mapped_count'] == 68
          assert len(rows) == 433
          assert sum(r['source_key'] == 'pordenone-provincial-listed' for r in rows) == 401
          assert sum(r['source_key'] == 'pordenone-provincial-applicants' for r in rows) == 32
          assert sum(r['source_status'] == 'listed' for r in rows) == 335
          assert sum(r['source_status'] == 'renewal_update_in_progress' for r in rows) == 66
          assert sum(r['source_status'] == 'other_or_unknown' for r in rows) == 1
          assert sum(r['source_status'] == 'pending' for r in rows) == 31
          assert sum(bool(r['identifiers']) for r in rows) == 266
          assert len({r['record_locator'] for r in rows}) == 433
          print('validated Pordenone final candidate: 71490 / 68 / 71 / 68')
          PY

      - name: Browser acceptance at desktop and mobile widths
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          python -m http.server 8765 --directory /tmp/pordenone-final-site > /tmp/pordenone-preview.log 2>&1 &
          node tests/public_portal_browser.cjs

      - name: Commit permanent cleanup checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/public-pages.yml
          git rm -f tmp/pordenone-public-pages.yml .github/workflows/pordenone-pr-prep.yml
          git diff --cached --check
          if git diff --cached --name-only | grep -E '(^tmp/|^\.github/workflows/pordenone-)'; then
            echo 'Temporary Pordenone mechanism remains staged unexpectedly' >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'No final cleanup changes to commit' >&2
            exit 1
          fi
          git commit -m 'Promote validated Pordenone public gates and remove temporary machinery'
          git push origin HEAD:expansion/pordenone-2026-09-20
