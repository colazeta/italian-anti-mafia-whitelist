name: Perugia parser validation

on:
  push:
    branches:
      - expansion/perugia-2026-09-14
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        run: pip install -e '.[dev]'

      - name: Fetch official Perugia sources twice and verify bytes
        shell: bash
        run: |
          set -euo pipefail
          listed='https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco-delle-imprese-iscritte-white_list_perugia_0.pdf'
          applicants='https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco-delle-imprese-richiedenti-l-iscrizione_0.pdf'
          for n in 1 2; do
            curl -fsSL --retry 2 --retry-delay 2 "$listed" -o "listed-$n.pdf"
            curl -fsSL --retry 2 --retry-delay 2 "$applicants" -o "applicants-$n.pdf"
          done
          cmp listed-1.pdf listed-2.pdf
          cmp applicants-1.pdf applicants-2.pdf
          test "$(stat -c%s listed-1.pdf)" = '2279077'
          test "$(stat -c%s applicants-1.pdf)" = '1897032'
          test "$(sha256sum listed-1.pdf | cut -d' ' -f1)" = 'c9cd39452fb2f751c2b9e105c10ecf0b9e57569006138af7f766d6851748029f'
          test "$(sha256sum applicants-1.pdf | cut -d' ' -f1)" = '003e2ee6614302b1a1f8a504baae2b0c5d38752c70cfb509f693e1b4c1374f14'
          head -c 5 listed-1.pdf | grep -q '%PDF-'
          head -c 5 applicants-1.pdf | grep -q '%PDF-'

      - name: Run Perugia semantic tests
        run: pytest -q tests/test_perugia_parser_semantics.py

      - name: Parse complete byte-pinned sources
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from white_list_archive.parsers.perugia_tables import (
              parse_perugia_applicants,
              parse_perugia_listed,
          )

          page = 'https://prefettura.interno.gov.it/it/prefetture/perugia/evidenza/white-list'
          common = {
              'authority_key': 'perugia',
              'authority_name': 'Prefettura di Perugia',
              'register_key': 'perugia-white-list',
              'register_name': 'White List Perugia',
              'reference_date': '2026-09-03',
              'source_page_url': page,
          }
          listed_cfg = common | {
              'source_key': 'perugia-listed',
              'population_scope': 'listed',
              'resource_url': 'https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco-delle-imprese-iscritte-white_list_perugia_0.pdf',
              'sha256': 'c9cd39452fb2f751c2b9e105c10ecf0b9e57569006138af7f766d6851748029f',
          }
          applicant_cfg = common | {
              'source_key': 'perugia-applicants',
              'population_scope': 'applicant',
              'resource_url': 'https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco-delle-imprese-richiedenti-l-iscrizione_0.pdf',
              'sha256': '003e2ee6614302b1a1f8a504baae2b0c5d38752c70cfb509f693e1b4c1374f14',
          }
          listed = parse_perugia_listed(Path('listed-1.pdf'), listed_cfg)
          applicants = parse_perugia_applicants(Path('applicants-1.pdf'), applicant_cfg)

          assert len(listed.records) == 1016
          assert len(applicants.records) == 1213
          assert listed.diagnostics['status_counts'] == {'listed': 674, 'renewal_update_in_progress': 342}
          assert applicants.diagnostics['status_counts'] == {'listed': 1036, 'pending': 176, 'other_or_unknown': 1}
          assert len({r['record_locator'] for r in listed.records + applicants.records}) == 2229
          assert sum(not r['name'] for r in applicants.records) == 1
          blank = next(r for r in applicants.records if not r['name'])
          assert blank['source_row_ordinal'] == 1052
          assert blank['identifiers'] == ['03522900541']
          assert sum(bool(r['identifiers']) for r in applicants.records) == 1186

          summary = {
              'listed': listed.diagnostics,
              'applicants': applicants.diagnostics,
              'combined_records': len(listed.records) + len(applicants.records),
              'combined_status_counts': dict(Counter(r['source_status'] for r in listed.records + applicants.records)),
          }
          Path('perugia-parser-validation.json').write_text(
              json.dumps(summary, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          PY

      - name: Upload validation summary
        uses: actions/upload-artifact@v4
        with:
          name: perugia-parser-validation-${{ github.run_attempt }}
          path: perugia-parser-validation.json
          if-no-files-found: error
          retention-days: 14
