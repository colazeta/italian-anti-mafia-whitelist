name: Macerata national integration finalizer v2 2026-09-19

on:
  push:
    branches:
      - expansion/macerata-2026-09-19
    paths:
      - .github/workflows/macerata-finalize-v2-2026-09-19.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/macerata-2026-09-19
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify branch base and Macerata-only scope
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "d4f65a5bc106db17ff934a8dc4f2424540b74942"
          test "$(git rev-list --count HEAD..origin/main)" = "0"
          python - <<'PY'
          import subprocess
          files = set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'], text=True).splitlines())
          expected = {
              '.github/workflows/macerata-source-probe.yml',
              '.github/workflows/macerata-finalize-2026-09-19.yml',
              '.github/workflows/macerata-finalize-v2-2026-09-19.yml',
              'docs/sources/macerata-operational-check-2026-09-19.md',
              'src/white_list_archive/parsers/macerata_tables.py',
              'tests/test_macerata_parser_semantics.py',
          }
          if files != expected:
              raise SystemExit(f'unexpected pre-finalizer v2 scope: {sorted(files)}')
          PY

      - name: Install full validation runtime
        run: |
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && \
               sudo apt-get install -y --no-install-recommends poppler-utils antiword; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[dev,publication,database,storage]'

      - name: Extract reviewed scripts with LF-only CSV repair
        run: |
          python - <<'PY'
          import textwrap
          from pathlib import Path

          workflow = Path('.github/workflows/macerata-finalize-2026-09-19.yml').read_text(encoding='utf-8')

          def extract(step_name: str, next_step_name: str) -> str:
              step = workflow.index(f'      - name: {step_name}\n')
              marker = "          python - <<'PY'\n"
              start = workflow.index(marker, step) + len(marker)
              end_marker = f"\n          PY\n\n      - name: {next_step_name}\n"
              end = workflow.index(end_marker, start)
              return textwrap.dedent(workflow[start:end])

          revalidate = extract(
              'Revalidate official resources and parser boundary',
              'Materialize permanent Macerata integration and reviewed portal candidate',
          )
          materialize = extract(
              'Materialize permanent Macerata integration and reviewed portal candidate',
              'Run clean repository tests',
          )
          old = "writer = csv.DictWriter(handle, fieldnames=fieldnames)"
          new = "writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator='\\n')"
          if materialize.count(old) != 1:
              raise SystemExit(f'expected exactly one DictWriter repair target, found {materialize.count(old)}')
          materialize = materialize.replace(old, new)
          Path('/tmp/macerata-revalidate.py').write_text(revalidate, encoding='utf-8')
          Path('/tmp/macerata-materialize.py').write_text(materialize, encoding='utf-8')
          PY
          python /tmp/macerata-revalidate.py
          python /tmp/macerata-materialize.py

      - name: Run clean repository tests
        run: |
          mkdir -p /tmp/macerata-workflows-v2
          mv .github/workflows/macerata-source-probe.yml /tmp/macerata-workflows-v2/
          mv .github/workflows/macerata-finalize-2026-09-19.yml /tmp/macerata-workflows-v2/
          mv .github/workflows/macerata-finalize-v2-2026-09-19.yml /tmp/macerata-workflows-v2/
          pytest -q
          mv /tmp/macerata-workflows-v2/macerata-source-probe.yml .github/workflows/
          mv /tmp/macerata-workflows-v2/macerata-finalize-2026-09-19.yml .github/workflows/
          mv /tmp/macerata-workflows-v2/macerata-finalize-v2-2026-09-19.yml .github/workflows/

      - name: Build and validate national candidate
        run: |
          rm -rf /tmp/macerata-public-build /tmp/macerata-public-sources
          mkdir -p /tmp/macerata-public-build/data
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/macerata-public-sources \
            --registry-json /tmp/macerata-public-build/data/registry.json \
            --registry-csv /tmp/macerata-public-build/data/registry.csv \
            --prefectures-json /tmp/macerata-public-build/data/prefectures.json \
            --prefectures-csv /tmp/macerata-public-build/data/prefectures.csv
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          root = Path('/tmp/macerata-public-build/data')
          reg = json.loads((root/'registry.json').read_text(encoding='utf-8'))
          pref = json.loads((root/'prefectures.json').read_text(encoding='utf-8'))
          assert reg['meta']['record_count'] == 66625
          assert reg['meta']['authority_count'] == 62
          assert reg['meta']['register_count'] == 64
          assert pref['meta']['published_count'] == 62
          assert pref['meta']['mapped_count'] == 62
          records = [r for r in reg['records'] if r['authority_key'] == 'macerata']
          assert len(records) == 1358
          assert len({r['record_locator'] for r in records}) == 1358
          assert sum(bool(r['identifiers']) for r in records) == 1320
          assert Counter(r['source_status'] for r in records) == Counter({
              'listed': 880,
              'renewal_update_in_progress': 394,
              'pending': 83,
              'other_or_unknown': 1,
          })
          PY

      - name: Commit permanent integration checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/catalog.csv \
            data/source_registry/verified_primary_pages.csv \
            data/source_registry/source_series_inventory.csv \
            data/publication/multi_prefecture_pilot.json \
            data/monitoring/national_coverage.json \
            src/white_list_archive/publishing/public_national_registry.py \
            tests/test_source_registry.py \
            tests/test_source_population_coverage.py \
            tests/public_portal_browser.cjs \
            tmp/macerata-public-pages.yml
          git diff --cached --check
          git commit -m 'Integrate Macerata White List sources'
          git push origin HEAD:expansion/macerata-2026-09-19
