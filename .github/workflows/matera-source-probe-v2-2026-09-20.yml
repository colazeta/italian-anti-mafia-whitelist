name: Matera source probe v2 2026-09-20

on:
  push:
    branches:
      - expansion/matera-2026-09-20
    paths:
      - .github/workflows/matera-source-probe-v2-2026-09-20.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/matera-2026-09-20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify canonical base and Matera-only temporary scope
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "6d88336c0ca902eee0e37071a43da1d96c28681c"
          test "$(git rev-list --count HEAD..origin/main)" = "0"
          python - <<'PY'
          import subprocess
          files=set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'],text=True).splitlines())
          expected={'.github/workflows/matera-source-probe-2026-09-20.yml','.github/workflows/matera-source-probe-v2-2026-09-20.yml'}
          if files != expected: raise SystemExit(f'unexpected scope: {sorted(files)}')
          PY
      - name: Install XLSX inspection runtime
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 openpyxl
      - name: Verify landing evidence and capture exact attachments twice
        env:
          LANDING: https://prefettura.interno.gov.it/it/prefetture/matera/evidenza/white-list
          LISTED: https://prefettura.interno.gov.it/sites/default/files/54/2026-08/iscritte-luglio-2026.xlsx
          APPLICANTS: https://prefettura.interno.gov.it/sites/default/files/54/2026-08/elenco-richiedenti-iscrizione.xlsx
        run: |
          mkdir -p /tmp/matera-v2
          python - <<'PY'
          import hashlib,json,os,pathlib,time
          from urllib.parse import parse_qsl,urlencode,urlsplit,urlunsplit
          import requests
          from bs4 import BeautifulSoup
          from openpyxl import load_workbook
          root=pathlib.Path('/tmp/matera-v2')
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; italian-anti-mafia-whitelist-source-verification/1.0)','Cache-Control':'no-cache','Pragma':'no-cache'})
          def bust(url,tag):
              p=urlsplit(url); q=parse_qsl(p.query,keep_blank_values=True); q.append(('_wl_probe',f'{tag}-{time.time_ns()}'))
              return urlunsplit((p.scheme,p.netloc,p.path,urlencode(q),''))
          def get(url,tag):
              r=s.get(bust(url,tag),timeout=90,allow_redirects=True); r.raise_for_status()
              print('FETCH',json.dumps({'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'sha256':hashlib.sha256(r.content).hexdigest()},sort_keys=True))
              return r
          landing=get(os.environ['LANDING'],'landing').text
          soup=BeautifulSoup(landing,'html.parser')
          links={' '.join(a.get_text(' ',strip=True).split()):a.get('href','') for a in soup.find_all('a',href=True)}
          positive=[(t,h) for t,h in links.items() if ('richiest' in t.casefold() or 'imprese iscritte' in t.casefold()) and '/sites/default/files/' in h]
          print('POSITIVE_RESOURCE_LINKS',json.dumps(positive,ensure_ascii=False))
          for required in (os.environ['LISTED'],os.environ['APPLICANTS']):
              if required not in [h for _,h in positive]: raise SystemExit(f'expected official resource not positively exposed: {required}')
          for kind,url in [('listed',os.environ['LISTED']),('applicants',os.environ['APPLICANTS'])]:
              a=get(url,kind+'-1'); b=get(url,kind+'-2')
              if a.content!=b.content: raise SystemExit(f'{kind} independent captures differ')
              sha=hashlib.sha256(a.content).hexdigest(); p=root/f'{kind}.xlsx'; p.write_bytes(a.content)
              wb=load_workbook(p,read_only=True,data_only=False)
              print('CAPTURE',json.dumps({'kind':kind,'url':url,'bytes':len(a.content),'sha256':sha,'sheets':wb.sheetnames},ensure_ascii=False,sort_keys=True))
              for ws in wb.worksheets:
                  nonempty=[]
                  status_counts={}
                  for ri,row in enumerate(ws.iter_rows(values_only=True),1):
                      vals=['' if v is None else str(v) for v in row]
                      if any(v.strip() for v in vals): nonempty.append((ri,vals))
                  print('SHEET',json.dumps({'kind':kind,'title':ws.title,'max_row':ws.max_row,'max_column':ws.max_column,'nonempty_rows':len(nonempty),'first_row':nonempty[0] if nonempty else None,'last_row':nonempty[-1] if nonempty else None},ensure_ascii=False))
                  for ri,vals in nonempty[:12]: print('ROW',kind,ri,json.dumps(vals,ensure_ascii=False))
                  for ri,vals in nonempty[-8:]: print('TAILROW',kind,ri,json.dumps(vals,ensure_ascii=False))
                  if nonempty:
                      headers=[x.casefold() for x in nonempty[0][1]]
                      for col,h in enumerate(headers):
                          if 'stato' in h:
                              for _,vals in nonempty[1:]:
                                  if col < len(vals) and vals[col].strip(): status_counts[vals[col].strip()]=status_counts.get(vals[col].strip(),0)+1
                      print('STATUS_COUNTS',kind,json.dumps(status_counts,ensure_ascii=False,sort_keys=True))
          PY
      - name: Upload bounded diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matera-source-probe-v2-${{ github.sha }}
          path: /tmp/matera-v2
          if-no-files-found: ignore
          retention-days: 3
