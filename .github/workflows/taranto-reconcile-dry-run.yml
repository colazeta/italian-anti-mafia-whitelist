name: Taranto reconcile dry run

on:
  workflow_dispatch:
  push:
    branches:
      - expansion/taranto-2026-09-18
    paths:
      - '.github/workflows/taranto-reconcile-dry-run.yml'

permissions:
  contents: write

jobs:
  reconcile-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout existing Taranto branch
        uses: actions/checkout@v4
        with:
          ref: expansion/taranto-2026-09-18
          fetch-depth: 0
      - name: Persist canonical reconciliation diagnosis
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          mkdir -p tmp
          out=tmp/taranto-reconcile-2026-09-19.txt
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "MAIN=$(git rev-parse origin/main)"
            echo "MERGE_BASE=$(git merge-base HEAD origin/main)"
          } > "$out"
          set +e
          git merge --no-commit --no-ff origin/main >/tmp/merge.out 2>&1
          rc=$?
          set -e
          {
            echo "MERGE_RC=$rc"
            echo "UNMERGED_BEGIN"
            git diff --name-only --diff-filter=U || true
            echo "UNMERGED_END"
            echo "MERGE_OUTPUT_BEGIN"
            cat /tmp/merge.out
            echo "MERGE_OUTPUT_END"
          } >> "$out"
          git merge --abort >/dev/null 2>&1 || true
          git add "$out"
          if ! git diff --cached --quiet; then
            git commit -m "Record Taranto canonical reconciliation boundary"
            git push origin HEAD:expansion/taranto-2026-09-18
          fi
