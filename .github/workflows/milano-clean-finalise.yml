name: Milano clean finalisation

on:
  push:
    branches:
      - fix/milano-source-drift-2026-09-17
    paths:
      - '.github/workflows/milano-clean-finalise.yml'

permissions:
  contents: write

concurrency:
  group: milano-clean-finalise
  cancel-in-progress: false

jobs:
  finalise:
    if: github.event.head_commit.message == 'Prepare clean Milano transition finalisation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile with current main
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-list --count HEAD..origin/main)" = 0

      - name: Update approved public Milano gate
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/public-pages.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "          assert reg['meta']['record_count'] == 54183\n": "          assert reg['meta']['record_count'] == 54177\n",
              "          assert len(milano_records) == 2618\n": "          assert len(milano_records) == 2612\n",
              "          assert sum(r['source_status'] == 'listed' for r in milano_records) == 939\n": "          assert sum(r['source_status'] == 'listed' for r in milano_records) == 933\n",
              "          assert len({r['record_locator'] for r in milano_records}) == 2618\n": "          assert len({r['record_locator'] for r in milano_records}) == 2612\n",
              "          assert sum(bool(r['identifiers']) for r in milano_records) == 2618\n": "          assert sum(bool(r['identifiers']) for r in milano_records) == 2612\n",
              "          assert sum(bool(r['observed_listing_date']) for r in milano_records) == 939\n": "          assert sum(bool(r['observed_listing_date']) for r in milano_records) == 933\n",
              "          assert sum(bool(r['observed_expiry_date']) for r in milano_records) == 939\n": "          assert sum(bool(r['observed_expiry_date']) for r in milano_records) == 933\n",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one public-gate occurrence, found {count}: {old.strip()}')
              text = text.replace(old, new)

          anchor = "          assert sum(bool(r['identifiers']) for r in milano_records) == 2612\n"
          addition = (
              anchor
              + "          removed_milano = {'04793740962','06960770961','07693660156','09835880155','10674330963','11016700152'}\n"
              + "          assert not removed_milano & {r['identifier_field_raw'] for r in milano_records}\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit('Milano identifier assertion anchor is not unique')
          text = text.replace(anchor, addition)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary Milano machinery
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/milano-source-drift-validation.yml \
            .github/workflows/milano-source-transition-checkpoint.yml \
            .github/workflows/milano-source-transition.yml \
            .github/workflows/milano-transition-national-validation.yml \
            .github/workflows/milano-clean-finalise.yml \
            tmp/milano_apply_transition.py

      - name: Validate exact permanent diff
        run: |
          set -euo pipefail
          git diff --check
          expected="$(mktemp)"
          actual="$(mktemp)"
          cat > "$expected" <<'EOF'
          .github/workflows/public-pages.yml
          data/monitoring/national_coverage.json
          data/publication/multi_prefecture_pilot.json
          data/source_registry/source_series_inventory.csv
          docs/sources/milano-source-transition-2026-09-17.md
          src/white_list_archive/parsers/milano_webapp.py
          tests/test_milano_parser_semantics.py
          EOF
          sed -i 's/^          //' "$expected"
          git diff --name-only origin/main | sort > "$actual"
          sort -o "$expected" "$expected"
          echo 'PERMANENT_DIFF:'
          cat "$actual"
          diff -u "$expected" "$actual"
          if git ls-files | grep -E '(^tmp/milano_|^\.github/workflows/milano-(source|transition|clean))'; then
            echo 'temporary Milano machinery remains tracked' >&2
            exit 1
          fi

      - name: Commit clean checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/public-pages.yml
          git commit -m 'Finalise 17 September Milano source transition'
          echo "FINAL_SHA=$(git rev-parse HEAD)"
          echo "AHEAD=$(git rev-list --count origin/main..HEAD)"
          echo "BEHIND=$(git rev-list --count HEAD..origin/main)"
          git diff --name-only origin/main...HEAD

      - name: Publish clean checkpoint if token permits
        continue-on-error: true
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/fix/milano-source-drift-2026-09-17
