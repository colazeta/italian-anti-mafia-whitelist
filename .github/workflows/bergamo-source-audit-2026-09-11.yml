name: Bergamo source audit 2026-09-11

on:
  push:
    branches: [expansion/bergamo-2026-09-11]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve and inspect official Bergamo publications
        shell: bash
        run: |
          python -m pip install -q requests beautifulsoup4 pdfplumber
          python - <<'PY'
          import hashlib, json, tempfile
          from pathlib import Path
          from urllib.parse import urljoin
          import requests, pdfplumber
          from bs4 import BeautifulSoup

          PAGE='https://prefettura.interno.gov.it/it/prefetture/bergamo/evidenza/white-list'
          H={'User-Agent':'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelistArchive/1.0; source-audit)'}
          s=requests.Session(); r=s.get(PAGE,headers=H,timeout=45); r.raise_for_status()
          print('LANDING_STATUS',r.status_code)
          soup=BeautifulSoup(r.text,'html.parser')
          links=[]
          for a in soup.find_all('a',href=True):
              label=' '.join(a.stripped_strings).strip()
              u=urljoin(PAGE,a['href'])
              folded=label.casefold()
              if 'elenco richiedenti' in folded or 'elenco iscritte' in folded:
                  links.append((label,u))
          print('MATCHED_LINKS',json.dumps(links,ensure_ascii=False))
          if len(links)!=2:
              raise SystemExit(f'Expected exactly two current list links, got {links!r}')
          for label,url in links:
              resp=s.get(url,headers=H,timeout=90); resp.raise_for_status(); data=resp.content
              sha=hashlib.sha256(data).hexdigest()
              print('\nRESOURCE',label)
              print('URL',url)
              print('STATUS',resp.status_code)
              print('CONTENT_TYPE',resp.headers.get('content-type'))
              print('BYTES',len(data))
              print('SHA256',sha)
              if not data.startswith(b'%PDF'):
                  print('NON_PDF_PREFIX',repr(data[:120])); continue
              with tempfile.NamedTemporaryFile(suffix='.pdf') as f:
                  f.write(data); f.flush()
                  with pdfplumber.open(f.name) as pdf:
                      print('PAGES',len(pdf.pages))
                      page_summaries=[]
                      total_tables=0
                      for pno,page in enumerate(pdf.pages,1):
                          tables=page.find_tables(); total_tables+=len(tables)
                          text=' '.join((page.extract_text() or '').split())
                          summary={'page':pno,'tables':len(tables),'text_prefix':text[:500]}
                          if tables:
                              extracted=tables[0].extract()
                              summary['table_rows']=len(extracted) if extracted else 0
                              summary['table_widths']=sorted({len(row) for row in extracted if row}) if extracted else []
                              summary['first_rows']=extracted[:4] if extracted else []
                          page_summaries.append(summary)
                      print('TOTAL_TABLES',total_tables)
                      print('PAGE_SUMMARIES',json.dumps(page_summaries,ensure_ascii=False))
          PY