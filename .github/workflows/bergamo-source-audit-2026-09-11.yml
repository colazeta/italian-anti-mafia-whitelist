name: Bergamo parser validation 2026-09-11

on:
  push:
    branches: [expansion/bergamo-2026-09-11]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.head_commit.message == 'Validate Bergamo parser'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/bergamo-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validation runtime
        run: |
          python -m pip install -e '.[dev,publication]'
          python -m pip install -q requests beautifulsoup4
      - name: Reverify official source identity
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          PAGE='https://prefettura.interno.gov.it/it/prefetture/bergamo/evidenza/white-list'
          SOURCES={
            'applicants':('https://prefettura.interno.gov.it/sites/default/files/20/2026-08/elenco-richiedenti-iscrizione.pdf','65f3db950b3c75f073edc2eaba47cebee9771b706b6c6dcbae21ef881a523ce6','ELENCO RICHIEDENTI ISCRIZIONE'),
            'listed':('https://prefettura.interno.gov.it/sites/default/files/20/2026-08/elenco-iscritte.pdf','b5f6229d4aac3674bcaf68895f93f5f5c60848a1bb6ab78b2e3d98a6c89ecaef','ELENCO ISCRITTE'),
          }
          H={'User-Agent':'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelistArchive/1.0; source-verification)'}
          s=requests.Session(); landing=s.get(PAGE,headers=H,timeout=45); landing.raise_for_status()
          soup=BeautifulSoup(landing.text,'html.parser')
          links={urljoin(PAGE,a['href']):' '.join(a.stripped_strings) for a in soup.find_all('a',href=True)}
          page_text=' '.join(soup.stripped_strings)
          assert '27 Agosto 2026' in page_text, 'official page update marker drift'
          for key,(url,sha,label) in SOURCES.items():
              assert url in links, (key,'resource link missing')
              assert label.casefold() in links[url].casefold(), (key,links[url])
              response=s.get(url,headers=H,timeout=90); response.raise_for_status(); body=response.content
              observed=hashlib.sha256(body).hexdigest(); assert observed==sha,(key,observed)
              Path('/tmp',f'bergamo-{key}.pdf').write_bytes(body)
              print(key,label,observed,len(body))
          PY
      - name: Validate parser against byte-pinned sources
        shell: bash
        run: |
          pytest -q tests/test_bergamo_parser_semantics.py
          python - <<'PY'
          from pathlib import Path
          from white_list_archive.parsers.bergamo_positioned import parse_bergamo_applicants, parse_bergamo_listed

          PAGE='https://prefettura.interno.gov.it/it/prefetture/bergamo/evidenza/white-list'
          base={'authority_key':'bergamo','authority_name':'Prefettura di Bergamo','register_key':'bergamo-ordinary','register_name':'White List ordinaria','reference_date':'2026-08-27','source_page_url':PAGE}
          ac=base|{'source_key':'bergamo-applicants','population_scope':'applicant','resource_url':'https://prefettura.interno.gov.it/sites/default/files/20/2026-08/elenco-richiedenti-iscrizione.pdf','sha256':'65f3db950b3c75f073edc2eaba47cebee9771b706b6c6dcbae21ef881a523ce6'}
          lc=base|{'source_key':'bergamo-listed','population_scope':'listed','resource_url':'https://prefettura.interno.gov.it/sites/default/files/20/2026-08/elenco-iscritte.pdf','sha256':'b5f6229d4aac3674bcaf68895f93f5f5c60848a1bb6ab78b2e3d98a6c89ecaef'}
          applicants=parse_bergamo_applicants(Path('/tmp/bergamo-applicants.pdf'),ac)
          listed=parse_bergamo_listed(Path('/tmp/bergamo-listed.pdf'),lc)
          assert len(applicants.records)==612
          assert applicants.diagnostics['status_counts']=={'pending':612}
          assert applicants.diagnostics['identifier_coverage']==555
          assert len(listed.records)==1434
          assert listed.diagnostics['status_counts']=={'listed':626,'renewal_update_in_progress':808}
          assert listed.diagnostics['identifier_coverage']==1425
          assert listed.diagnostics['multiple_strict_identifier_records']==22
          print('APPLICANTS',applicants.diagnostics)
          print('LISTED',listed.diagnostics)
          PY
