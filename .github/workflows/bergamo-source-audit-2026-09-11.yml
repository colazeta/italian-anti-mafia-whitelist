name: Bergamo row lattice audit 2026-09-11

on:
  push:
    branches: [expansion/bergamo-2026-09-11]

permissions:
  contents: write

jobs:
  audit:
    if: github.event.head_commit.message == 'Audit Bergamo row lattice'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/bergamo-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Derive full logical-row lattice
        shell: bash
        run: |
          python -m pip install -q requests pdfplumber
          python - <<'PY'
          import hashlib, json, re, statistics
          from collections import Counter
          from pathlib import Path
          import requests, pdfplumber

          SOURCES={
            'applicants':('https://prefettura.interno.gov.it/sites/default/files/20/2026-08/elenco-richiedenti-iscrizione.pdf','65f3db950b3c75f073edc2eaba47cebee9771b706b6c6dcbae21ef881a523ce6'),
            'listed':('https://prefettura.interno.gov.it/sites/default/files/20/2026-08/elenco-iscritte.pdf','b5f6229d4aac3674bcaf68895f93f5f5c60848a1bb6ab78b2e3d98a6c89ecaef'),
          }
          DATE=re.compile(r'^\d{1,2}/\d{1,2}/\d{2,4}$')
          ROMAN=re.compile(r'^(?:III|IV|V|VI|VII|VIII|X|XI|XII)$')
          IDLIKE=re.compile(r'^[A-Za-z0-9/\-\.\']{8,32}$')
          H={'User-Agent':'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelistArchive/1.0; row-lattice-audit)'}

          def cluster(values, tol=14.0):
            values=sorted(values)
            groups=[]
            for value in values:
              if not groups or value-groups[-1][-1] > tol:
                groups.append([value])
              else:
                groups[-1].append(value)
            return [round(statistics.median(g),1) for g in groups]

          s=requests.Session(); report={'schema_version':1,'row_step':42.5,'sources':{}}
          for key,(url,expected_sha) in SOURCES.items():
            body=s.get(url,headers=H,timeout=90).content
            observed=hashlib.sha256(body).hexdigest(); assert observed==expected_sha,(key,observed)
            path=Path('/tmp')/f'bergamo-{key}.pdf'; path.write_bytes(body)
            pages=[]; all_steps=[]; total_rows=0; page_counts=[]; signal_exceptions=[]
            with pdfplumber.open(path) as pdf:
              for pno,page in enumerate(pdf.pages,1):
                assert round(page.width)==842 and round(page.height)==595,(key,pno,page.width,page.height)
                words=page.extract_words(x_tolerance=1,y_tolerance=2,keep_blank_chars=False,use_text_flow=False)
                signal_tops=[]; signals=[]
                for w in words:
                  text=w['text'].strip(); x0=float(w['x0']); top=float(w['top'])
                  kind=None
                  if 500 <= x0 <= 525 and ROMAN.fullmatch(text): kind='activity'
                  elif x0 >= 640 and DATE.fullmatch(text): kind='date'
                  elif 405 <= x0 <= 500 and IDLIKE.fullmatch(text) and any(ch.isdigit() for ch in text): kind='identifier_like'
                  if kind:
                    signal_tops.append(top); signals.append((kind,text,x0,top))
                anchors=cluster(signal_tops)
                # remove rare header/noise clusters: true data anchors participate in the 42.5pt lattice.
                if len(anchors)>=2:
                  # split into lattice-connected components and keep the largest.
                  components=[]
                  for a in anchors:
                    if not components or a-components[-1][-1] > 55:
                      components.append([a])
                    else:
                      components[-1].append(a)
                  anchors=max(components,key=len)
                if not anchors:
                  raise RuntimeError(f'{key} page {pno}: no row-anchor signals')
                # infer missing slots from the stable 42.5pt layout.
                first=anchors[0]; last=anchors[-1]
                inferred=[]; current=first
                while current <= last+5:
                  inferred.append(round(current,1)); current += 42.5
                # align each inferred slot to nearest observed anchor and record signal coverage.
                slot_rows=[]
                for ridx,target in enumerate(inferred,1):
                  nearest=min(anchors,key=lambda a:abs(a-target)); observed_anchor=nearest if abs(nearest-target)<=8 else None
                  kinds=set(); raw=[]
                  for kind,text,x0,top in signals:
                    if abs(top-target)<=14:
                      kinds.add(kind); raw.append({'kind':kind,'text':text,'x0':round(x0,1),'top':round(top,1)})
                  slot={'row':ridx,'target_top':target,'observed_anchor':observed_anchor,'signals':sorted(kinds)}
                  if not kinds or 'activity' not in kinds or ('date' not in kinds and 'identifier_like' not in kinds):
                    slot['signal_detail']=raw
                    signal_exceptions.append({'page':pno,**slot})
                  slot_rows.append(slot)
                # Fail if observed anchors cannot be explained by inferred grid.
                unexplained=[a for a in anchors if min(abs(a-t) for t in inferred)>8]
                if unexplained:
                  raise RuntimeError(f'{key} page {pno}: unexplained anchors {unexplained}')
                for a,b in zip(anchors,anchors[1:]):
                  d=round(b-a,1)
                  if d>20: all_steps.append(d)
                total_rows+=len(inferred); page_counts.append(len(inferred))
                pages.append({'page':pno,'first_top':first,'last_top':last,'observed_anchor_count':len(anchors),'inferred_row_count':len(inferred),'observed_anchors':anchors,'rows':slot_rows})
            report['sources'][key]={
              'url':url,'sha256':observed,'page_count':len(pages),'total_inferred_rows':total_rows,
              'page_counts':page_counts,'page_count_distribution':dict(sorted(Counter(page_counts).items())),
              'step_distribution':dict(Counter(round(x,1) for x in all_steps).most_common(12)),
              'signal_exception_count':len(signal_exceptions),'signal_exceptions':signal_exceptions,'pages':pages,
            }
            print(key.upper(),'ROWS',total_rows,'PAGE_COUNTS',Counter(page_counts),'EXCEPTIONS',len(signal_exceptions),'STEPS',Counter(all_steps).most_common(8))
          Path('tmp/bergamo-lattice.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit temporary lattice checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/bergamo-lattice.json
          git diff --cached --check
          git commit -m 'Checkpoint Bergamo row lattice'
          git push origin HEAD:expansion/bergamo-2026-09-11