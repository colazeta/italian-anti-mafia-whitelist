name: Bergamo ambiguous-activity inspection 2026-09-11

on:
  push:
    branches: [expansion/bergamo-2026-09-11]

permissions:
  contents: write

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect Bergamo ambiguous activities'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/bergamo-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect exact physical words around unresolved activity rows
        shell: bash
        run: |
          python -m pip install -q requests pdfplumber
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import requests, pdfplumber

          SOURCES={
            'applicants':('https://prefettura.interno.gov.it/sites/default/files/20/2026-08/elenco-richiedenti-iscrizione.pdf','65f3db950b3c75f073edc2eaba47cebee9771b706b6c6dcbae21ef881a523ce6',[(25,6),(45,10),(47,6),(54,11),(11,9)]),
            'listed':('https://prefettura.interno.gov.it/sites/default/files/20/2026-08/elenco-iscritte.pdf','b5f6229d4aac3674bcaf68895f93f5f5c60848a1bb6ab78b2e3d98a6c89ecaef',[(3,3),(56,11),(97,11),(109,10),(112,7),(118,3),(130,9)]),
          }
          H={'User-Agent':'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelistArchive/1.0; ambiguity-inspection)'}
          def centre(w): return (float(w['x0'])+float(w['x1']))/2
          def target_top(kind,page,row):
            first=(117.3 if page==1 else 54.2) if kind=='applicants' else (157.7 if page==1 else 73.0)
            return first+42.5*(row-1)
          s=requests.Session(); out={'schema_version':1,'sources':{}}
          for kind,(url,sha,coords) in SOURCES.items():
            response=s.get(url,headers=H,timeout=90); response.raise_for_status(); body=response.content
            assert hashlib.sha256(body).hexdigest()==sha
            path=Path('/tmp')/f'bergamo-{kind}.pdf'; path.write_bytes(body)
            inspected=[]
            with pdfplumber.open(path) as pdf:
              for page_no,row_no in coords:
                page=pdf.pages[page_no-1]
                words=page.extract_words(x_tolerance=1,y_tolerance=2,keep_blank_chars=False,use_text_flow=False)
                y=target_top(kind,page_no,row_no)
                nearby=[]
                for w in words:
                  top=float(w['top']); x0=float(w['x0']); x1=float(w['x1'])
                  if y-12 <= top < y+38:
                    nearby.append({'text':str(w['text']),'x0':round(x0,1),'x1':round(x1,1),'top':round(top,1),'centre':round(centre(w),1)})
                nearby.sort(key=lambda w:(w['top'],w['x0']))
                wider_activity=[w for w in nearby if 470 <= w['centre'] < 690]
                all_row_text=' '.join(w['text'] for w in nearby)
                inspected.append({'page':page_no,'row':row_no,'target_top':y,'row_text':all_row_text,'activity_neighbourhood':wider_activity,'all_words':nearby})
            out['sources'][kind]={'sha256':sha,'inspected':inspected}
            print(kind.upper(),json.dumps(inspected,ensure_ascii=False))
          Path('tmp/bergamo-activity-ambiguous.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit temporary ambiguity checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/bergamo-activity-ambiguous.json
          git diff --cached --check
          git commit -m 'Checkpoint Bergamo ambiguous activities'
          git push origin HEAD:expansion/bergamo-2026-09-11
