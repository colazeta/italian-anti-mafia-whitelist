name: Bergamo column boundary audit 2026-09-11

on:
  push:
    branches: [expansion/bergamo-2026-09-11]

permissions:
  contents: write

jobs:
  audit:
    if: github.event.head_commit.message == 'Audit Bergamo column boundaries'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/bergamo-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate horizontal extraction bands against the frozen lattice
        shell: bash
        run: |
          python -m pip install -q requests pdfplumber
          python - <<'PY'
          import hashlib, json
          from collections import Counter
          from pathlib import Path
          import requests, pdfplumber

          lattice=json.loads(Path('tmp/bergamo-lattice.json').read_text())
          SOURCES={
            'applicants':('https://prefettura.interno.gov.it/sites/default/files/20/2026-08/elenco-richiedenti-iscrizione.pdf','65f3db950b3c75f073edc2eaba47cebee9771b706b6c6dcbae21ef881a523ce6'),
            'listed':('https://prefettura.interno.gov.it/sites/default/files/20/2026-08/elenco-iscritte.pdf','b5f6229d4aac3674bcaf68895f93f5f5c60848a1bb6ab78b2e3d98a6c89ecaef'),
          }
          # Boundaries are midpoints between the actual fixed column starts visible in both PDFs.
          BANDS={
            'applicants': {'name':(25,190),'municipality':(190,285),'street':(285,390),'number':(390,415),'identifier':(415,500),'activity':(500,680),'application':(680,735)},
            'listed': {'name':(25,190),'municipality':(190,285),'street':(285,390),'number':(390,412),'identifier':(412,500),'activity':(500,645),'listing':(645,695),'expiry':(695,745),'update':(745,825)},
          }
          H={'User-Agent':'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelistArchive/1.0; column-audit)'}
          def centre(w): return (float(w['x0'])+float(w['x1']))/2
          def text_band(words,x0,x1,y0,y1):
            selected=[w for w in words if x0<=centre(w)<x1 and y0<=float(w['top'])<y1]
            selected.sort(key=lambda w:(round(float(w['top']),1),float(w['x0'])))
            return ' '.join(str(w['text']) for w in selected).strip()
          s=requests.Session(); out={'schema_version':1,'bands':BANDS,'sources':{}}
          for key,(url,sha) in SOURCES.items():
            body=s.get(url,headers=H,timeout=90).content; assert hashlib.sha256(body).hexdigest()==sha
            p=Path('/tmp')/f'bergamo-{key}.pdf'; p.write_bytes(body)
            exceptions=[]; rows=[]; empties=Counter(); date_shape=Counter(); activity_roman=Counter()
            with pdfplumber.open(p) as pdf:
              # capture header coordinate evidence from first ordinary page (page 2)
              header_words=[w for w in pdf.pages[1].extract_words(x_tolerance=1,y_tolerance=2,keep_blank_chars=False,use_text_flow=False) if float(w['top'])<52]
              header=[{'text':w['text'],'x0':round(float(w['x0']),1),'x1':round(float(w['x1']),1),'top':round(float(w['top']),1)} for w in sorted(header_words,key=lambda w:(float(w['top']),float(w['x0'])))]
              for page_meta,page in zip(lattice['sources'][key]['pages'],pdf.pages):
                words=page.extract_words(x_tolerance=1,y_tolerance=2,keep_blank_chars=False,use_text_flow=False)
                targets=[row['target_top'] for row in page_meta['rows']]
                for idx,y in enumerate(targets):
                  y0=y-4; y1=(targets[idx+1]-4 if idx+1<len(targets) else min(y+38,float(page.height)-15))
                  rec={'page':page_meta['page'],'row':idx+1,'top':y}
                  for field,(x0,x1) in BANDS[key].items(): rec[field]=text_band(words,x0,x1,y0,y1)
                  required=['name','municipality','activity']
                  if key=='applicants': required+=['application']
                  else: required+=['listing','expiry']
                  missing=[f for f in required if not rec[f]]
                  for f in BANDS[key]:
                    if not rec[f]: empties[f]+=1
                  if missing: exceptions.append({'page':rec['page'],'row':rec['row'],'missing':missing,'record':rec})
                  rows.append(rec)
            out['sources'][key]={
              'sha256':sha,'row_count':len(rows),'header_words':header,'empty_field_counts':dict(empties),
              'required_field_exception_count':len(exceptions),'required_field_exceptions':exceptions,
              'sample_rows':rows[:3]+rows[-3:],
            }
            print(key.upper(),'ROWS',len(rows),'EMPTY',dict(empties),'REQUIRED_EXCEPTIONS',len(exceptions))
            if exceptions: print(key.upper(),'EXCEPTION_SAMPLE',json.dumps(exceptions[:20],ensure_ascii=False))
            print(key.upper(),'HEADER',json.dumps(header,ensure_ascii=False))
          Path('tmp/bergamo-columns.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit temporary column checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/bergamo-columns.json
          git diff --cached --check
          git commit -m 'Checkpoint Bergamo column extraction'
          git push origin HEAD:expansion/bergamo-2026-09-11