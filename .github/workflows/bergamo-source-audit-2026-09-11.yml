name: Bergamo production finalizer 2026-09-11

on:
  push:
    branches: [expansion/bergamo-2026-09-11]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Retry Bergamo production integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/bergamo-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validation runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install -e '.[dev,publication,database,storage]'
          python -m pip install -q requests beautifulsoup4
      - name: Verify sources and materialize candidate
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          PAGE='https://prefettura.interno.gov.it/it/prefetture/bergamo/evidenza/white-list'
          LISTED_URL='https://prefettura.interno.gov.it/sites/default/files/20/2026-08/elenco-iscritte.pdf'
          APPLICANT_URL='https://prefettura.interno.gov.it/sites/default/files/20/2026-08/elenco-richiedenti-iscrizione.pdf'
          LISTED_SHA='b5f6229d4aac3674bcaf68895f93f5f5c60848a1bb6ab78b2e3d98a6c89ecaef'
          APPLICANT_SHA='65f3db950b3c75f073edc2eaba47cebee9771b706b6c6dcbae21ef881a523ce6'
          H={'User-Agent':'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelistArchive/1.0; source-verification)'}
          s=requests.Session(); landing=s.get(PAGE,headers=H,timeout=45); landing.raise_for_status()
          soup=BeautifulSoup(landing.text,'html.parser')
          links={urljoin(PAGE,a['href']):' '.join(a.stripped_strings) for a in soup.find_all('a',href=True)}
          assert '27 Agosto 2026' in ' '.join(soup.stripped_strings)
          assert LISTED_URL in links and 'elenco iscritte' in links[LISTED_URL].casefold(), links.get(LISTED_URL)
          assert APPLICANT_URL in links and 'elenco richiedenti iscrizione' in links[APPLICANT_URL].casefold(), links.get(APPLICANT_URL)
          for key,url,sha in [('listed',LISTED_URL,LISTED_SHA),('applicants',APPLICANT_URL,APPLICANT_SHA)]:
              response=s.get(url,headers=H,timeout=90); response.raise_for_status(); body=response.content
              observed=hashlib.sha256(body).hexdigest(); assert observed==sha,(key,observed)
              Path('/tmp',f'bergamo-{key}.pdf').write_bytes(body)

          registry_path=Path('src/white_list_archive/publishing/public_national_registry.py')
          text=registry_path.read_text()
          import_anchor='from white_list_archive.parsers.udine_positioned import PARSERS as UDINE_PARSERS\n'
          dispatch_anchor='        or UDINE_PARSERS.get(cfg["parser"])\n'
          assert import_anchor in text and dispatch_anchor in text
          if 'BERGAMO_PARSERS' not in text:
              text=text.replace(import_anchor,import_anchor+'from white_list_archive.parsers.bergamo_positioned import PARSERS as BERGAMO_PARSERS\n')
              text=text.replace(dispatch_anchor,dispatch_anchor+'        or BERGAMO_PARSERS.get(cfg["parser"])\n')
          registry_path.write_text(text)

          cfg_path=Path('data/publication/multi_prefecture_pilot.json')
          cfg=json.loads(cfg_path.read_text())
          assert not [x for x in cfg['sources'] if x['source_key'] in {'bergamo-listed','bergamo-applicants'}]
          cfg['sources'].extend([
            {'source_key':'bergamo-listed','parser':'bergamo_positioned_listed','authority_key':'bergamo','authority_name':'Prefettura di Bergamo','register_key':'bergamo-ordinary','register_name':'White List ordinaria','population_scope':'listed','reference_date':'2026-08-27','source_page_url':PAGE,'resource_url':LISTED_URL,'sha256':LISTED_SHA,'expected_source_rows':1434,'last_source_update':'2026-08-27','last_source_update_basis':'official landing page Ultimo aggiornamento marker and current attachment identity reverified 11 September 2026','notes':'Byte-pinned listed population with 1,434 reviewed logical rows. 808 source rows carry a positive update-in-progress date; 47 reviewed activity rows lack a recoverable Roman section prefix and retain raw activity without an inferred section. Exact boundaries are documented in docs/sources/bergamo-operational-check-2026-09-11.md.'},
            {'source_key':'bergamo-applicants','parser':'bergamo_positioned_applicants','authority_key':'bergamo','authority_name':'Prefettura di Bergamo','register_key':'bergamo-ordinary','register_name':'White List ordinaria','population_scope':'applicant','reference_date':'2026-08-27','source_page_url':PAGE,'resource_url':APPLICANT_URL,'sha256':APPLICANT_SHA,'expected_source_rows':612,'last_source_update':'2026-08-27','last_source_update_basis':'official landing page Ultimo aggiornamento marker and current attachment identity reverified 11 September 2026','notes':'Byte-pinned applicant population with 612 reviewed logical rows. Applicant status is supported by the explicit current publication identity; 12 blank application dates and 11 activity rows without a recoverable Roman section prefix are preserved without inference. Exact boundaries are documented in docs/sources/bergamo-operational-check-2026-09-11.md.'}
          ])
          cfg_path.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n')

          series_path=Path('data/source_registry/source_series_inventory.csv')
          with series_path.open(newline='',encoding='utf-8') as f:
              reader=csv.DictReader(f); fields=reader.fieldnames; series=list(reader)
          assert fields
          desired={
            'bergamo-listed': {'source_series_key':'bergamo-listed','authority_key':'bergamo','regime_code':'WL-REGIME-L190-2012','population_scope':'listed','sector_scope':'all','publication_model':'periodic_attachment','series_url':PAGE,'resource_resolution_status':'landing_page_resolved','verified_date':'2026-09-11','notes':'Current official landing page reverified 11 September 2026; current ELENCO ISCRITTE edition is last updated 27 August 2026. Exact source identity and parser boundary are documented in docs/sources/bergamo-operational-check-2026-09-11.md.'},
            'bergamo-applicants': {'source_series_key':'bergamo-applicants','authority_key':'bergamo','regime_code':'WL-REGIME-L190-2012','population_scope':'applicant','sector_scope':'all','publication_model':'periodic_attachment','series_url':PAGE,'resource_resolution_status':'landing_page_resolved','verified_date':'2026-09-11','notes':'Current official landing page reverified 11 September 2026; current ELENCO RICHIEDENTI ISCRIZIONE edition is last updated 27 August 2026. Exact source identity and parser boundary are documented in docs/sources/bergamo-operational-check-2026-09-11.md.'}
          }
          positions={r['source_series_key']:i for i,r in enumerate(series)}
          for key,row in desired.items():
              clean={field:row.get(field,'') for field in fields}
              if key in positions: series[positions[key]]=clean
              else: series.append(clean)
          with series_path.open('w',newline='',encoding='utf-8') as f:
              writer=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); writer.writeheader(); writer.writerows(series)

          pages_path=Path('data/source_registry/verified_primary_pages.csv')
          with pages_path.open(newline='',encoding='utf-8') as f:
              reader=csv.DictReader(f); page_fields=reader.fieldnames; pages=list(reader)
          assert page_fields
          for row in pages:
              if row['authority_key']=='bergamo':
                  row.update({'landing_url':PAGE,'verification_date':'2026-09-11','verification_status':'verified'}); break
          else:
              pages.append({'authority_key':'bergamo','landing_url':PAGE,'verification_date':'2026-09-11','verification_status':'verified'})
          with pages_path.open('w',newline='',encoding='utf-8') as f:
              writer=csv.DictWriter(f,fieldnames=page_fields,lineterminator='\n'); writer.writeheader(); writer.writerows(pages)

          coverage_path=Path('data/monitoring/national_coverage.json')
          coverage=json.loads(coverage_path.read_text()); bergamo=next(x for x in coverage['prefectures'] if x['authority_key']=='bergamo')
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          bergamo.update({'official_landing_page':PAGE,'source_verified':True,'current_edition_identified':True,'capture_implemented':True,'parser_implemented':True,'parser_validated':True,'company_observations_loaded':True,'observation_layer':'public_source_observations','canonical_integration_validated':False,'public_export_enabled':True,'durable_evidence_verified':False,'population_scopes_complete':True,'latest_source_reference_date':'2026-08-27','last_successful_source_check_at':now,'last_attempted_source_check_at':now,'last_successful_investigation_on':'2026-09-11','monitoring_status':'CURRENT','unresolved_issue':['Canonical hosted-database integration and independent durable-evidence verification remain governed under #16; public source observations are validated independently of that infrastructure.'],'actionable_issue':False,'coverage_status':'VALIDATED','terminal_reason':None,'completion_evidence':['docs/sources/bergamo-operational-check-2026-09-11.md','src/white_list_archive/parsers/bergamo_positioned.py','tests/test_bergamo_parser_semantics.py','data/publication/multi_prefecture_pilot.json'],'known_content_sha256':[LISTED_SHA,APPLICANT_SHA],'evidence':['data/source_registry/verified_primary_pages.csv','data/source_registry/source_series_inventory.csv','data/publication/multi_prefecture_pilot.json','docs/sources/bergamo-operational-check-2026-09-11.md'],'last_completed_coverage_stage':'VALIDATED'})
          coverage_path.write_text(json.dumps(coverage,ensure_ascii=False,indent=2)+'\n')

          pages_workflow=Path('.github/workflows/public-pages.yml'); p=pages_workflow.read_text()
          parser_anchor="      - 'src/white_list_archive/parsers/udine_positioned.py'\n"; assert parser_anchor in p
          if 'bergamo_positioned.py' not in p: p=p.replace(parser_anchor,parser_anchor+"      - 'src/white_list_archive/parsers/bergamo_positioned.py'\n")
          for old,new in [
              ("assert reg['meta']['record_count'] == 14683","assert reg['meta']['record_count'] == 16729"),
              ("'ancona','bari','udine'}","'ancona','bari','udine','bergamo'}"),
              ("'ancona-ordinary','bari-ordinary','udine-ordinary'","'ancona-ordinary','bari-ordinary','udine-ordinary','bergamo-ordinary'"),
              ("assert reg['meta']['authority_count'] == 18","assert reg['meta']['authority_count'] == 19"),
              ("assert reg['meta']['register_count'] == 19","assert reg['meta']['register_count'] == 20"),
              ("assert pref['meta']['published_count'] == 18","assert pref['meta']['published_count'] == 19")]:
              assert old in p,old; p=p.replace(old,new,1)
          ua="          udine = [x for x in pref['prefectures'] if x['authority_key'] == 'udine']\n          assert len(udine) == 1 and udine[0]['mapped'] and udine[0]['published']\n"; assert ua in p
          p=p.replace(ua,ua+"          bergamo = [x for x in pref['prefectures'] if x['authority_key'] == 'bergamo']\n          assert len(bergamo) == 1 and bergamo[0]['mapped'] and bergamo[0]['published']\n",1)
          pages_workflow.write_text(p)

          browser_path=Path('tests/public_portal_browser.cjs'); b=browser_path.read_text()
          la="      assert.ok(labels.includes('White List ordinaria · Prefettura di Udine'));\n"; assert la in b
          b=b.replace(la,la+"      assert.ok(labels.includes('White List ordinaria · Prefettura di Bergamo'));\n",1)
          assert 'assert.equal(stats.total,14683);' in b; b=b.replace('assert.equal(stats.total,14683);','assert.equal(stats.total,16729);',1)
          ex="'ancona','bari','udine'].includes(r.authority_key)"; assert ex in b; b=b.replace(ex,"'ancona','bari','udine','bergamo'].includes(r.authority_key)",1)
          ua2="      assert.equal(palma[0].observed_expiry_date,'');\n"; assert ua2 in b
          bt=("      const bergamo=registry.records.filter(r=>r.authority_key==='bergamo');\n"
              "      assert.equal(bergamo.length,2046);\n"
              "      assert.equal(bergamo.filter(r=>r.source_key==='bergamo-listed').length,1434);\n"
              "      assert.equal(bergamo.filter(r=>r.source_key==='bergamo-applicants').length,612);\n"
              "      assert.deepEqual(statusCounts(bergamo),{listed:626,pending:612,renewal_update_in_progress:808});\n")
          b=b.replace(ua2,ua2+bt,1); browser_path.write_text(b)
          PY
      - name: Validate complete national candidate
        shell: bash
        run: |
          pytest -q tests/test_bergamo_parser_semantics.py
          pytest -q
          rm -rf /tmp/bergamo-national-build /tmp/bergamo-national-sources
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/bergamo-national-sources \
            --registry-json /tmp/bergamo-national-build/registry.json \
            --registry-csv /tmp/bergamo-national-build/registry.csv \
            --prefectures-json /tmp/bergamo-national-build/prefectures.json \
            --prefectures-csv /tmp/bergamo-national-build/prefectures.csv
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          reg=json.loads(Path('/tmp/bergamo-national-build/registry.json').read_text()); pref=json.loads(Path('/tmp/bergamo-national-build/prefectures.json').read_text())
          assert reg['meta']['record_count']==16729,reg['meta']
          assert reg['meta']['authority_count']==19 and reg['meta']['register_count']==20
          assert reg['meta']['authority_counts']['bergamo']==2046 and reg['meta']['register_counts']['bergamo-ordinary']==2046
          rows=[r for r in reg['records'] if r['authority_key']=='bergamo']
          assert len([r for r in rows if r['source_key']=='bergamo-listed'])==1434
          assert len([r for r in rows if r['source_key']=='bergamo-applicants'])==612
          assert Counter(r['source_status'] for r in rows)==Counter({'renewal_update_in_progress':808,'listed':626,'pending':612})
          assert pref['meta']['authority_count']==106 and pref['meta']['published_count']==19 and pref['meta']['mapped_count']==35
          item=[x for x in pref['prefectures'] if x['authority_key']=='bergamo']; assert len(item)==1 and item[0]['mapped'] and item[0]['published']
          print('Bergamo national candidate validated:',reg['meta']['record_count'],pref['meta'])
          PY
          git diff --check
      - name: Commit validated production materialization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/public-pages.yml data/monitoring/national_coverage.json data/publication/multi_prefecture_pilot.json data/source_registry/source_series_inventory.csv data/source_registry/verified_primary_pages.csv src/white_list_archive/publishing/public_national_registry.py tests/public_portal_browser.cjs
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Integrate Bergamo public archive'
          git push origin HEAD:expansion/bergamo-2026-09-11
