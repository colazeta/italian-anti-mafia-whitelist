name: Transform bounded historical reviewed captures

# Bounded reviewed-code acceptance and explicit catch-up; no duplicate schedule.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transform-historical-captures.yml'
      - 'src/white_list_archive/acquisition/historical_transform.py'
  workflow_dispatch:
    inputs:
      robot_state_sha:
        description: Frozen robot-state commit (empty only for the initial batch)
        type: string
        default: ''
      shard:
        description: Reviewed authority shard
        type: choice
        options: ['0', '1', '2', '3']
        default: '0'
      cursor:
        description: Exact attempt cursor within this frozen shard denominator
        type: string
        default: '0'
      max_jobs:
        description: Maximum historical interpretations to attempt
        type: choice
        options: ['1', '2', '5', '10']
        default: '2'
      selection_sha256:
        description: Frozen selection digest (required after the initial batch)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Serialise with the ordinary private transformer; retain shared database controls.
  group: transform-reviewed-captures
  cancel-in-progress: false

jobs:
  historical-transform:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: evidence-archive
    env:
      PYTHONUNBUFFERED: '1'
      EVIDENCE_BUCKET: ${{ vars.EVIDENCE_BUCKET }}
      EVIDENCE_ENDPOINT: ${{ vars.EVIDENCE_ENDPOINT }}
      EVIDENCE_REGION: ${{ vars.EVIDENCE_REGION }}
      EVIDENCE_POLICY_EVIDENCE: ${{ vars.EVIDENCE_POLICY_EVIDENCE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.EVIDENCE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.EVIDENCE_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.EVIDENCE_SESSION_TOKEN }}
      EVIDENCE_DATABASE_URL: ${{ secrets.EVIDENCE_DATABASE_URL }}
      AWS_EC2_METADATA_DISABLED: 'true'
      ROBOT_HEAD_INPUT: ${{ inputs.robot_state_sha }}
      SHARD: ${{ inputs.shard }}
      CURSOR: ${{ inputs.cursor }}
      MAX_JOBS: ${{ inputs.max_jobs }}
      SELECTION_SHA256: ${{ inputs.selection_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install existing parser and private persistence runtime
        run: |
          set -euo pipefail
          while IFS= read -r source_file; do
            [ -n "$source_file" ] && sudo rm -f "$source_file"
          done < <(grep -rlE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '\|dl\.google\.com/linux/chrome|d;\|packages\.google\.com/chrome|d' /etc/apt/sources.list
          fi
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 &&
               sudo apt-get install -y --no-install-recommends poppler-utils antiword; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Parser dependency installation failed' >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[publication,storage,database]'
      - name: Interpret one bounded batch from the complete frozen historical selection
        run: |
          set -euo pipefail
          git fetch --no-tags origin robot-state:refs/remotes/origin/robot-state
          if [ -z "$ROBOT_HEAD_INPUT" ]; then
            ROBOT_HEAD_INPUT="$(git rev-parse refs/remotes/origin/robot-state)"
          fi
          python -m white_list_archive.acquisition.historical_transform \
            --robot-head "$ROBOT_HEAD_INPUT" --shard "${SHARD:-0}" --shards 4 \
            --cursor "${CURSOR:-0}" --max-jobs "${MAX_JOBS:-2}" \
            --expected-selection-sha256 "$SELECTION_SHA256"

# No originals, parse rows, detailed reports or storage coordinates are uploaded.
# Pending interpretations and quarantines remain explicit; no public promotion.
