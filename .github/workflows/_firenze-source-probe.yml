name: Firenze source probe

on:
  push:
    branches:
      - expansion/firenze-2026-09-18

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate permanent parsers against current official sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/firenze
          curl -fL --retry 2 --connect-timeout 20 --max-time 120 -A 'Mozilla/5.0' 'https://prefettura.interno.gov.it/sites/default/files/42/2026-09/white_list_09-09-2026.xlsx' -o /tmp/firenze/listed.xlsx
          curl -fL --retry 2 --connect-timeout 20 --max-time 120 -A 'Mozilla/5.0' 'https://prefettura.interno.gov.it/sites/default/files/42/2026-09/elenco-rich-w.l-al-09.09.26.pdf' -o /tmp/firenze/applicants.pdf
          python -m pip install -q openpyxl python-docx pdfplumber
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from white_list_archive.parsers.firenze_sources import parse_firenze_listed, parse_firenze_applicants

          common={
            'authority_key':'firenze','authority_name':'Prefettura di Firenze',
            'register_key':'firenze-ordinary','register_name':'White List ordinaria',
            'reference_date':'2026-09-09','source_page_url':'https://prefettura.interno.gov.it/it/prefetture/firenze/white-list-elenco-imprese-iscritte'}
          listed=parse_firenze_listed(Path('/tmp/firenze/listed.xlsx'), common | {
            'source_key':'firenze-listed','population_scope':'listed',
            'resource_url':'https://prefettura.interno.gov.it/sites/default/files/42/2026-09/white_list_09-09-2026.xlsx',
            'sha256':'bc23303a5c9f398c4749def1178057f8d938644fe6f2b3745c8a8112901f17f0'})
          applicants=parse_firenze_applicants(Path('/tmp/firenze/applicants.pdf'), common | {
            'source_key':'firenze-applicants','population_scope':'pending',
            'resource_url':'https://prefettura.interno.gov.it/sites/default/files/42/2026-09/elenco-rich-w.l-al-09.09.26.pdf',
            'sha256':'6a6eb981f3476b67c4344067a82b14295076cb1c35a557337aecb8bc38a7d695'})
          print('LISTED='+repr(listed.diagnostics))
          print('APPLICANTS='+repr(applicants.diagnostics))
          print('TOTAL='+str(len(listed.records)+len(applicants.records)))
          PY