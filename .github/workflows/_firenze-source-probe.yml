name: Firenze source probe

on:
  push:
    branches:
      - expansion/firenze-2026-09-18

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit current Firenze source boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/firenze
          curl -fL --retry 2 --connect-timeout 20 --max-time 120 -A 'Mozilla/5.0' 'https://prefettura.interno.gov.it/sites/default/files/42/2026-09/white_list_09-09-2026.xlsx' -o /tmp/firenze/listed.xlsx
          curl -fL --retry 2 --connect-timeout 20 --max-time 120 -A 'Mozilla/5.0' 'https://prefettura.interno.gov.it/sites/default/files/42/2026-09/elenco-rich-w.l-al-09.09.26.pdf' -o /tmp/firenze/applicants.pdf
          echo "LISTED_BYTES=$(wc -c </tmp/firenze/listed.xlsx)"
          echo "LISTED_SHA256=$(sha256sum /tmp/firenze/listed.xlsx | cut -d' ' -f1)"
          echo "APPLICANTS_BYTES=$(wc -c </tmp/firenze/applicants.pdf)"
          echo "APPLICANTS_SHA256=$(sha256sum /tmp/firenze/applicants.pdf | cut -d' ' -f1)"
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          python -m pip install -q openpyxl python-docx
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re, subprocess
          from white_list_archive.parsers.arezzo_openxml import parse_arezzo_listed

          cfg={
            'source_key':'firenze-listed','authority_key':'firenze','authority_name':'Prefettura di Firenze',
            'register_key':'firenze-ordinary','register_name':'White List ordinaria','population_scope':'listed',
            'reference_date':'2026-09-09','source_page_url':'https://prefettura.interno.gov.it/it/prefetture/firenze/white-list-elenco-imprese-iscritte',
            'resource_url':'https://prefettura.interno.gov.it/sites/default/files/42/2026-09/white_list_09-09-2026.xlsx',
            'sha256':'bc23303a5c9f398c4749def1178057f8d938644fe6f2b3745c8a8112901f17f0'}
          batch=parse_arezzo_listed(Path('/tmp/firenze/listed.xlsx'),cfg)
          print('LISTED_DIAGNOSTICS='+repr(batch.diagnostics))
          print('LISTED_STATUS_COUNTS='+repr(dict(Counter(r['source_status'] for r in batch.records))))
          print('LISTED_IDENTIFIER_COVERAGE='+str(sum(bool(r['identifiers']) for r in batch.records)))
          print('LISTED_RAW_IDENTIFIER_ONLY='+str(sum(bool(r['identifier_field_raw']) and not r['identifiers'] for r in batch.records)))
          print('LISTED_RECORDS='+str(len(batch.records)))
          by_identity={}
          for r in batch.records:
              by_identity.setdefault((r['name'],r['identifier_field_raw']),[]).append(r)
          conflicts={k:v for k,v in by_identity.items() if len(v)>1}
          print('LISTED_IDENTITY_VARIANT_GROUPS='+str(len(conflicts)))
          for k,v in conflicts.items():
              print('LISTED_IDENTITY_VARIANT='+repr(k)+' '+repr([(x['observed_listing_date'],x['observed_expiry_date'],x['source_status']) for x in v]))

          subprocess.run(['pdftotext','-layout','/tmp/firenze/applicants.pdf','/tmp/firenze/applicants.txt'],check=True)
          raw=Path('/tmp/firenze/applicants.txt').read_text(encoding='utf-8',errors='replace')
          rows=[]
          for page_no,page in enumerate(raw.split('\f'),1):
              if not page.strip(): continue
              lines=page.splitlines(); header=None
              for i,line in enumerate(lines):
                  if 'Denominazione / Ragione Sociale' in line and 'Codice Fiscale' in line and 'Data Richiesta' in line:
                      header=(i,line.index('Sede Legale'),line.index('Codice Fiscale'),line.index('Data Richiesta'),line.index('Esito')); break
              if header is None: raise RuntimeError(f'No applicant header on page {page_no}')
              i,office_start,id_start,date_start,outcome_start=header
              for line_no,line in enumerate(lines[i+1:],i+2):
                  if not line.strip() or 'Pagina ' in line or 'Totale Società' in line: continue
                  date_raw=line[date_start:outcome_start].strip()
                  if not re.fullmatch(r'\d{2}/\d{2}/\d{4}',date_raw): continue
                  name=line[:office_start].strip(); office=line[office_start:id_start].strip(); identifier=line[id_start:date_start].strip(); outcome=line[outcome_start:].strip()
                  if not name or not identifier: raise RuntimeError(f'Applicant row missing identity p{page_no}:l{line_no}')
                  rows.append((page_no,line_no,name,office,identifier,date_raw,outcome))
          strict11=re.compile(r'^\d{11}$'); strict16=re.compile(r'^[A-Z]{6}[0-9A-Z]{10}$')
          malformed=[r for r in rows if not (strict11.fullmatch(r[4]) or strict16.fullmatch(r[4].upper()))]
          print('APPLICANT_RECORDS='+str(len(rows)))
          print('APPLICANT_IDENTIFIER_COVERAGE='+str(len(rows)-len(malformed)))
          print('APPLICANT_RAW_IDENTIFIER_ONLY='+str(len(malformed)))
          print('APPLICANT_OUTCOME_COUNTS='+repr(dict(Counter(r[6] for r in rows))))
          print('APPLICANT_BLANK_OFFICE='+str(sum(not r[3] for r in rows)))
          for r in malformed: print('APPLICANT_MALFORMED_IDENTIFIER='+repr(r))
          for r in rows:
              if not r[3]: print('APPLICANT_BLANK_OFFICE_ROW='+repr(r))
          if len(rows)!=125 or len(malformed)!=2 or any(r[6] for r in rows):
              raise RuntimeError('Firenze applicant boundary differs from reviewed source total/status/identifier set')
          PY
