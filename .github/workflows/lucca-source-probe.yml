name: Lucca source probe

on:
  push:
    branches:
      - expansion/lucca-2026-09-19
    paths:
      - .github/workflows/lucca-source-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install probe runtime
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf openpyxl python-docx xlrd

      - name: Probe official Lucca publication surface
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/lucca-probe
          python - <<'PY'
          import hashlib, json, re, sys
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup

          LANDING = 'https://prefettura.interno.gov.it/it/prefetture/lucca/elenco-imprese-iscritte-e-richiedenti'
          OUT = Path('tmp/lucca-probe')
          headers = {
              'User-Agent': 'Mozilla/5.0 (compatible; italian-anti-mafia-whitelist source verification; +https://github.com/colazeta/italian-anti-mafia-whitelist)',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
          }
          report = {'landing_url': LANDING, 'landing_ok': False, 'attachments': [], 'errors': []}
          try:
              r = requests.get(LANDING, headers=headers, timeout=45, allow_redirects=True)
              report.update({'landing_status': r.status_code, 'landing_final_url': r.url, 'landing_content_type': r.headers.get('content-type')})
              r.raise_for_status()
              report['landing_ok'] = True
              html = r.text
              (OUT / 'landing.html').write_text(html, encoding='utf-8')
              soup = BeautifulSoup(html, 'html.parser')
              text = ' '.join(soup.stripped_strings)
              report['title'] = soup.title.get_text(' ', strip=True) if soup.title else None
              m = re.search(r'Ultimo aggiornamento\s+([^|]{0,120})', text, re.I)
              report['last_update_text'] = m.group(1).strip() if m else None

              candidates = []
              for a in soup.find_all('a', href=True):
                  label = ' '.join(a.stripped_strings).strip()
                  norm = re.sub(r'\s+', ' ', label).casefold()
                  if ('iscritte' in norm or 'richiedenti' in norm) and ('impres' in norm or 'ditt' in norm or 'white' in norm):
                      candidates.append((label, urljoin(r.url, a['href'])))
              # preserve order, exact URL/label pairs only
              seen = set()
              candidates = [x for x in candidates if not (x in seen or seen.add(x))]
              report['candidate_link_count'] = len(candidates)

              for idx, (label, url) in enumerate(candidates, start=1):
                  item = {'label': label, 'url': url}
                  try:
                      rr = requests.get(url, headers=headers, timeout=60, allow_redirects=True)
                      item.update({'status': rr.status_code, 'final_url': rr.url, 'content_type': rr.headers.get('content-type'), 'content_length_header': rr.headers.get('content-length'), 'last_modified': rr.headers.get('last-modified')})
                      rr.raise_for_status()
                      body = rr.content
                      item['bytes'] = len(body)
                      item['sha256'] = hashlib.sha256(body).hexdigest()
                      suffix = Path(urlparse(rr.url).path).suffix.lower() or '.bin'
                      path = OUT / f'attachment-{idx}{suffix}'
                      path.write_bytes(body)
                      item['saved_as'] = str(path)
                      item['magic_hex'] = body[:16].hex()
                  except Exception as exc:
                      item['error'] = f'{type(exc).__name__}: {exc}'
                  report['attachments'].append(item)
          except Exception as exc:
              report['errors'].append(f'{type(exc).__name__}: {exc}')

          (OUT / 'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          # This is a discovery probe: lack of availability is recorded rather than inferred as non-publication.
          PY

      - name: Inspect downloaded document text conservatively
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, zipfile
          from pathlib import Path
          from pypdf import PdfReader
          from docx import Document
          import openpyxl

          root = Path('tmp/lucca-probe')
          report = json.loads((root/'report.json').read_text(encoding='utf-8'))
          out = []
          for item in report.get('attachments', []):
              p = Path(item.get('saved_as',''))
              if not p.exists():
                  continue
              text = ''
              try:
                  if p.suffix.lower() == '.pdf' or p.read_bytes()[:4] == b'%PDF':
                      reader = PdfReader(str(p))
                      text = '\n'.join((page.extract_text() or '') for page in reader.pages[:8])
                  elif p.suffix.lower() in {'.xlsx','.xlsm'} or p.read_bytes()[:2] == b'PK':
                      wb = openpyxl.load_workbook(p, read_only=True, data_only=True)
                      parts=[]
                      for ws in wb.worksheets[:3]:
                          for row in ws.iter_rows(min_row=1, max_row=min(ws.max_row,80), values_only=True):
                              parts.append(' | '.join('' if v is None else str(v) for v in row))
                      text='\n'.join(parts)
                  elif p.suffix.lower() in {'.docx'}:
                      doc=Document(str(p)); text='\n'.join(x.text for x in doc.paragraphs[:300])
              except Exception as exc:
                  text = f'EXTRACTION_ERROR {type(exc).__name__}: {exc}'
              text = re.sub(r'\x00', '', text)
              (root/(p.name+'.txt')).write_text(text[:80000], encoding='utf-8')
              out.append({'file':str(p),'preview':text[:8000]})
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: lucca-source-probe
          path: tmp/lucca-probe/
          if-no-files-found: error
          retention-days: 7
