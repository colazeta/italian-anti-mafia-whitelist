name: Cremona integration finalizer 2026-09-18

on:
  push:
    branches:
      - expansion/cremona-2026-09-18
    paths:
      - .github/workflows/cremona-finalize-2026-09-18.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/cremona-2026-09-18
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify branch base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = 'e9f92322c0ba6a7f2ef7d064edda42c3d0fa303d'
          test "$(git merge-base HEAD origin/main)" = 'e9f92322c0ba6a7f2ef7d064edda42c3d0fa303d'
      - name: Install validation runtime
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils antiword
          python -m pip install -e '.[publication]' pytest
      - name: Apply permanent Cremona integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv, json

          ROOT=Path('.')
          PAGE='https://prefettura.interno.gov.it/it/prefetture/cremona/evidenza/white-list-elenco-ditte'
          PDF='https://prefettura.interno.gov.it/sites/default/files/22/2026-09/white-list-elenchi-ditte_3.pdf'
          SHA='55a9498a76120f0b781f9c7ae8da7144c141551598b63a98b0bc52caac79a550'

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if s.count(old)!=1:
                  raise SystemExit(f'{path}: expected one occurrence of {old!r}, found {s.count(old)}')
              p.write_text(s.replace(old,new))

          # Approved source configuration.
          p=Path('data/publication/multi_prefecture_pilot.json')
          config=json.loads(p.read_text())
          if any(s['source_key']=='cremona-combined' for s in config['sources']):
              raise SystemExit('cremona-combined already present in publication config')
          config['sources'].append({
              'source_key':'cremona-combined','parser':'cremona_combined',
              'authority_key':'cremona','authority_name':'Prefettura di Cremona',
              'register_key':'cremona-ordinary','register_name':'White List ordinaria',
              'population_scope':'listed_and_applicant','reference_date':'2026-09-18',
              'source_page_url':PAGE,'resource_url':PDF,'sha256':SHA,
              'expected_source_rows':187,'last_source_update':'2026-09-18',
              'last_source_update_basis':'verified capture date; the current official attachment has no embedded edition date and the landing-page timestamp predates its September content',
              'approval_mode':'raw_sha256',
              'notes':'Combined official Cremona table: 187 observations = 99 listed + 50 renewal/update + 38 applicant pending; 183/187 observations have structured identifiers. See docs/sources/cremona-operational-check-2026-09-18.md.'
          })
          p.write_text(json.dumps(config,ensure_ascii=False,indent=2)+'\n')

          # Verified landing and one combined source series.
          p=Path('data/source_registry/verified_primary_pages.csv')
          rows=list(csv.DictReader(p.open(newline='')))
          rows.append({'authority_key':'cremona','landing_url':PAGE,'verification_date':'2026-09-18','verification_status':'verified'})
          if len({r['authority_key'] for r in rows})!=len(rows): raise SystemExit('duplicate verified authority')
          rows.sort(key=lambda r:r['authority_key'])
          with p.open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['authority_key','landing_url','verification_date','verification_status'],lineterminator='\n'); w.writeheader(); w.writerows(rows)

          p=Path('data/source_registry/source_series_inventory.csv')
          rows=list(csv.DictReader(p.open(newline='')))
          rows.append({
              'source_series_key':'cremona-combined','authority_key':'cremona','regime_code':'WL-REGIME-L190-2012',
              'population_scope':'listed_and_applicant','sector_scope':'all','publication_model':'periodic_attachment',
              'series_url':PAGE,'resource_resolution_status':'landing_page_resolved','verified_date':'2026-09-18',
              'notes':'Current official combined table independently reverified 18 September 2026; positive row-level evidence contains both listed/renewal and applicant-in-istruttoria populations. Exact SHA, 187-row boundary and conservative parser rules are documented in docs/sources/cremona-operational-check-2026-09-18.md.'
          })
          if len({r['source_series_key'] for r in rows})!=len(rows): raise SystemExit('duplicate source series')
          rows.sort(key=lambda r:r['source_series_key'])
          fields=['source_series_key','authority_key','regime_code','population_scope','sector_scope','publication_model','series_url','resource_resolution_status','verified_date','notes']
          with p.open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)

          replace_once('data/catalog.csv','verified-primary-pages,source_registry,data/source_registry/verified_primary_pages.csv,csv,national,in_progress,verified_primary_page,55,false,','verified-primary-pages,source_registry,data/source_registry/verified_primary_pages.csv,csv,national,in_progress,verified_primary_page,56,false,')
          replace_once('data/catalog.csv','source-series-inventory,source_registry,data/source_registry/source_series_inventory.csv,csv,national,in_progress,source_series,109,false,','source-series-inventory,source_registry,data/source_registry/source_series_inventory.csv,csv,national,in_progress,source_series,110,false,')

          # Coverage ledger: preserve its schema and copy generic validated-stage values from Chieti.
          p=Path('data/monitoring/national_coverage.json')
          cov=json.loads(p.read_text())
          entries=cov['authorities'] if 'authorities' in cov else cov['prefectures']
          by={e['authority_key']:e for e in entries}
          c=by['cremona']; template=by['chieti']
          for key in ['current_edition_identified','capture_implemented','parser_implemented','parser_validated','company_observations_loaded','observation_layer','canonical_integration_validated','public_export_enabled','durable_evidence_verified','population_scopes_complete','archived_evidence_storage_status','monitoring_status','actionable_issue','coverage_status','terminal_reason','last_completed_coverage_stage']:
              if key in template: c[key]=template[key]
          c['source_verified']=True
          c['latest_source_reference_date']='2026-09-18'
          for key in ['last_successful_source_check_at','last_attempted_source_check_at','last_content_change_at','last_successful_investigation_on']:
              if key in c: c[key]='2026-09-18'
          c['unresolved_issue']=[]
          c['completion_evidence']=['docs/sources/cremona-operational-check-2026-09-18.md','src/white_list_archive/parsers/cremona_combined.py','tests/test_cremona_parser_semantics.py','data/publication/multi_prefecture_pilot.json']
          c['known_content_sha256']=[SHA]
          c['evidence']=['data/source_registry/verified_primary_pages.csv','data/source_registry/source_series_inventory.csv','data/publication/multi_prefecture_pilot.json','docs/sources/cremona-operational-check-2026-09-18.md']
          p.write_text(json.dumps(cov,ensure_ascii=False,indent=2)+'\n')

          # Parser binding in national public build.
          replace_once('src/white_list_archive/publishing/public_national_registry.py',
              'from white_list_archive.parsers.chieti_legacy_doc import PARSERS as CHIETI_PARSERS\n',
              'from white_list_archive.parsers.chieti_legacy_doc import PARSERS as CHIETI_PARSERS\nfrom white_list_archive.parsers.cremona_combined import PARSERS as CREMONA_PARSERS\n')
          replace_once('src/white_list_archive/publishing/public_national_registry.py',
              '        or CHIETI_PARSERS.get(cfg["parser"])\n',
              '        or CHIETI_PARSERS.get(cfg["parser"])\n        or CREMONA_PARSERS.get(cfg["parser"])\n')

          # Population completeness gates.
          replace_once('tests/test_source_population_coverage.py','assert report["verified_authority_count"] == 55','assert report["verified_authority_count"] == 56')
          replace_once('tests/test_source_population_coverage.py','assert report["register_scope_count"] == 57','assert report["register_scope_count"] == 58')
          replace_once('tests/test_source_population_coverage.py','assert report["complete_register_scope_count"] == 57','assert report["complete_register_scope_count"] == 58')
          marker='''    assert all(row["covering_series_keys"] == ["milano-combined"] for row in milano)\n'''
          addition=marker+'''\n    cremona = [\n        row\n        for row in report["rows"]\n        if row["authority_key"] == "cremona"\n        and row["regime_code"] == "WL-REGIME-L190-2012"\n    ]\n    assert {row["coverage_status"] for row in cremona} == {"COVERED_COMBINED_SERIES"}\n    assert all(row["covering_series_keys"] == ["cremona-combined"] for row in cremona)\n'''
          replace_once('tests/test_source_population_coverage.py',marker,addition)

          # Public workflow trigger and frozen national/candidate assertions.
          replace_once('.github/workflows/public-pages.yml',"      - 'src/white_list_archive/parsers/chieti_legacy_doc.py'\n","      - 'src/white_list_archive/parsers/chieti_legacy_doc.py'\n      - 'src/white_list_archive/parsers/cremona_combined.py'\n")
          wf=Path('.github/workflows/public-pages.yml'); s=wf.read_text()
          s=s.replace("assert reg['meta']['record_count'] == 63222","assert reg['meta']['record_count'] == 63409")
          s=s.replace("'laquila','chieti'}","'laquila','chieti','cremona'}")
          s=s.replace("'laquila-ordinary','chieti-ordinary'","'laquila-ordinary','chieti-ordinary','cremona-ordinary'")
          s=s.replace("assert reg['meta']['authority_count'] == 55","assert reg['meta']['authority_count'] == 56")
          s=s.replace("assert reg['meta']['register_count'] == 57","assert reg['meta']['register_count'] == 58")
          s=s.replace("assert pref['meta']['published_count'] == 55","assert pref['meta']['published_count'] == 56")
          s=s.replace("assert pref['meta']['mapped_count'] == 55","assert pref['meta']['mapped_count'] == 56")
          anchor="          assert pref['meta']['mapped_count'] == 56\n"
          block=anchor+'''          cremona = [x for x in pref['prefectures'] if x['authority_key'] == 'cremona']\n          assert len(cremona) == 1 and cremona[0]['mapped'] and cremona[0]['published'] and cremona[0]['series_count'] == 1\n          cremona_records = [r for r in reg['records'] if r['authority_key'] == 'cremona']\n          assert len(cremona_records) == 187\n          assert all(r['source_key'] == 'cremona-combined' for r in cremona_records)\n          assert sum(r['source_status'] == 'listed' for r in cremona_records) == 99\n          assert sum(r['source_status'] == 'pending' for r in cremona_records) == 38\n          assert sum(r['source_status'] == 'renewal_update_in_progress' for r in cremona_records) == 50\n          assert sum(bool(r['identifiers']) for r in cremona_records) == 183\n          assert len({r['record_locator'] for r in cremona_records}) == 187\n'''
          if s.count(anchor)!=1: raise SystemExit('public-pages mapped-count anchor drift')
          wf.write_text(s.replace(anchor,block))

          # Browser acceptance follows the same frozen boundary.
          bp=Path('tests/public_portal_browser.cjs'); s=bp.read_text()
          s=s.replace("assert.equal(stats.total,63222);","assert.equal(stats.total,63409);")
          s=s.replace("'messina','laquila','chieti'].includes(r.authority_key)","'messina','laquila','chieti','cremona'].includes(r.authority_key)")
          label="      assert.ok(labels.includes('White List ordinaria · Prefettura di Chieti'));\n"
          if s.count(label)!=1: raise SystemExit('browser Chieti label anchor drift')
          s=s.replace(label,label+"      assert.ok(labels.includes('White List ordinaria · Prefettura di Cremona'));\n")
          ch_anchor="      assert.equal(chieti.filter(r=>r.source_key==='chieti-applicants'&&!r.application_date).length,5);\n"
          cblock=ch_anchor+'''      const cremona=registry.records.filter(r=>r.authority_key==='cremona');\n      assert.equal(cremona.length,187);\n      assert.equal(cremona.filter(r=>r.source_key==='cremona-combined').length,187);\n      assert.deepEqual(statusCounts(cremona),{listed:99,pending:38,renewal_update_in_progress:50});\n      assert.equal(new Set(cremona.map(r=>r.record_locator)).size,187);\n      assert.equal(cremona.filter(r=>r.identifiers.length>0).length,183);\n      assert.equal(cremona.filter(r=>r.identifier_field_raw&&r.identifiers.length===0).length,4);\n      assert.equal(cremona.flatMap(r=>r.identifiers).length,203);\n'''
          if s.count(ch_anchor)!=1: raise SystemExit('browser Chieti assertion anchor drift')
          bp.write_text(s.replace(ch_anchor,cblock))
          PY
          git diff --check
          python -m py_compile src/white_list_archive/parsers/cremona_combined.py src/white_list_archive/publishing/public_national_registry.py
          pytest -q tests/test_cremona_parser_semantics.py tests/test_source_population_coverage.py
          node --check tests/public_portal_browser.cjs
      - name: Reverify Cremona content and build full candidate
        shell: bash
        run: |
          set -euo pipefail
          URL='https://prefettura.interno.gov.it/sites/default/files/22/2026-09/white-list-elenchi-ditte_3.pdf'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36'
          for copy in 1 2; do
            ok=0
            for attempt in 1 2 3; do
              if curl -fsSL -A "$UA" -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${URL}?final=${copy}-${attempt}-$(date +%s%N)" -o "/tmp/cremona-${copy}.pdf"; then ok=1; break; fi
              sleep $((attempt*2))
            done
            test "$ok" -eq 1
          done
          cmp /tmp/cremona-1.pdf /tmp/cremona-2.pdf
          test "$(sha256sum /tmp/cremona-1.pdf | cut -d' ' -f1)" = '55a9498a76120f0b781f9c7ae8da7144c141551598b63a98b0bc52caac79a550'
          rm -rf /tmp/cremona-public /tmp/cremona-sources
          mkdir -p /tmp/cremona-public/data
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/cremona-sources \
            --registry-json /tmp/cremona-public/data/registry.json \
            --registry-csv /tmp/cremona-public/data/registry.csv \
            --prefectures-json /tmp/cremona-public/data/prefectures.json \
            --prefectures-csv /tmp/cremona-public/data/prefectures.csv
          python - <<'PY'
          import json
          from collections import Counter
          reg=json.load(open('/tmp/cremona-public/data/registry.json'))
          pref=json.load(open('/tmp/cremona-public/data/prefectures.json'))
          assert reg['meta']['record_count']==63409
          assert reg['meta']['authority_count']==56
          assert reg['meta']['register_count']==58
          assert pref['meta']['published_count']==56 and pref['meta']['mapped_count']==56
          rows=[r for r in reg['records'] if r['authority_key']=='cremona']
          assert len(rows)==187 and len({r['record_locator'] for r in rows})==187
          assert Counter(r['source_status'] for r in rows)==Counter({'listed':99,'pending':38,'renewal_update_in_progress':50})
          assert sum(bool(r['identifiers']) for r in rows)==183
          assert sum(len(r['identifiers']) for r in rows)==203
          print('CANDIDATE',reg['meta']['record_count'],reg['meta']['authority_count'],reg['meta']['register_count'],pref['meta']['published_count'],pref['meta']['mapped_count'])
          PY
      - name: Commit only permanent integration files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          permanent=(
            .github/workflows/public-pages.yml
            data/catalog.csv
            data/monitoring/national_coverage.json
            data/publication/multi_prefecture_pilot.json
            data/source_registry/source_series_inventory.csv
            data/source_registry/verified_primary_pages.csv
            docs/sources/cremona-operational-check-2026-09-18.md
            src/white_list_archive/parsers/cremona_combined.py
            src/white_list_archive/publishing/public_national_registry.py
            tests/public_portal_browser.cjs
            tests/test_cremona_parser_semantics.py
            tests/test_source_population_coverage.py
          )
          git add "${permanent[@]}"
          git diff --cached --check
          git commit -m 'Expand public White List coverage to Cremona'
          git push origin HEAD:expansion/cremona-2026-09-18

# Retrigger the bounded finalizer after workflow registration.
