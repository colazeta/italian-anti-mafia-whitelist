name: Crotone production gate 2026-09-11

on:
  push:
    branches: [expansion/crotone-2026-09-11]
    paths: [.github/workflows/crotone-production-gate-2026-09-11.yml]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/crotone-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialise production metadata and integration
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          root=Path('.')
          landing='https://prefettura.interno.gov.it/it/prefetture/crotone/evidenza/white-list'
          listed_url='https://prefettura.interno.gov.it/sites/default/files/0/2026-09/ditte-iscritte-white-list-2.pdf'
          applicant_url='https://prefettura.interno.gov.it/sites/default/files/0/2026-09/ditte-con-richiesta-iscrizione-white-list-2.pdf'
          listed_sha='c9a2774c5842b895cd0bb18be3fe30a0c8858b2d67e985a993983e1834f0d511'
          applicant_sha='af66ff6bf6a173c4156fef3e7741ca26956769e399285764123ef8405097e6d1'

          # Approved parser dispatch.
          p=root/'src/white_list_archive/publishing/public_national_registry.py'
          text=p.read_text()
          anchor='from white_list_archive.parsers.caltanissetta_tables import PARSERS as CALTANISSETTA_PARSERS\n'
          addition=anchor+'from white_list_archive.parsers.crotone_tables import PARSERS as CROTONE_PARSERS\n'
          if 'CROTONE_PARSERS' not in text:
              if anchor not in text: raise SystemExit('builder import anchor drift')
              text=text.replace(anchor,addition,1)
              dispatch='        or CALTANISSETTA_PARSERS.get(cfg["parser"])\n'
              if dispatch not in text: raise SystemExit('builder dispatch anchor drift')
              text=text.replace(dispatch,dispatch+'        or CROTONE_PARSERS.get(cfg["parser"])\n',1)
              p.write_text(text)

          # Publication config: append the two byte-pinned, positively identified populations.
          p=root/'data/publication/multi_prefecture_pilot.json'
          cfg=json.loads(p.read_text())
          cfg['sources']=[s for s in cfg['sources'] if s.get('authority_key')!='crotone']
          cfg['sources'].extend([
            {
              'source_key':'crotone-listed','parser':'crotone_listed','authority_key':'crotone','authority_name':'Prefettura di Crotone',
              'register_key':'crotone-ordinary','register_name':'White List ordinaria','population_scope':'listed','reference_date':'2026-09-11',
              'source_page_url':landing,'resource_url':listed_url,'sha256':listed_sha,'expected_source_rows':328,
              'last_source_update':'2026-09-11','last_source_update_basis':'current official attachment independently verified on 11 September 2026; the PDF does not state an edition date and its metadata records creation on 9 September 2026',
              'notes':'Current byte-pinned 130-page listed-company publication. 743 reviewed section rows, including one deterministic continuation of the preceding identity, yield 328 conservative company observations after formatting-only address normalisation (73 listed; 255 renewal/update in progress). Five broader identity/date groups have substantive address conflicts and therefore remain separate. Blank or malformed source identifiers/dates are never reconstructed. Exact evidence is documented in docs/sources/crotone-operational-check-2026-09-11.md.'
            },
            {
              'source_key':'crotone-applicants','parser':'crotone_applicants','authority_key':'crotone','authority_name':'Prefettura di Crotone',
              'register_key':'crotone-ordinary','register_name':'White List ordinaria','population_scope':'applicant','reference_date':'2026-09-11',
              'source_page_url':landing,'resource_url':applicant_url,'sha256':applicant_sha,'expected_source_rows':180,
              'last_source_update':'2026-09-11','last_source_update_basis':'current official attachment independently verified on 11 September 2026; the PDF does not state an edition date and its metadata records creation on 9 September 2026',
              'notes':'Current byte-pinned 46-page applicant publication. 205 non-header physical table rows contain 25 deterministic cross-page continuation fragments and yield 180 distinct pending applicant observations. Source text and malformed identifiers remain raw; no missing values are inferred. Exact evidence is documented in docs/sources/crotone-operational-check-2026-09-11.md.'
            }
          ])
          p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n')

          # National monitoring: mapped/scopes were already positive; advance only validated production stages.
          p=root/'data/monitoring/national_coverage.json'
          coverage=json.loads(p.read_text())
          rows=coverage.get('authority_statuses') if isinstance(coverage,dict) else None
          if not isinstance(rows,list):
              raise SystemExit('coverage shape drift: expected authority_statuses list')
          matches=[x for x in rows if x.get('authority_key')=='crotone']
          if len(matches)!=1: raise SystemExit(f'Crotone coverage cardinality drift: {len(matches)}')
          row=matches[0]
          row.update({
            'source_verified':True,'current_edition_identified':True,'capture_implemented':True,'parser_implemented':True,'parser_validated':True,
            'company_observations_loaded':True,'observation_layer':'public_source_observations','public_export_enabled':True,'population_scopes_complete':True,
            'latest_source_reference_date':'2026-09-11','last_successful_source_check_at':'2026-09-11T17:21:09Z','last_attempted_source_check_at':'2026-09-11T17:21:09Z',
            'last_successful_investigation_on':'2026-09-11','monitoring_status':'CURRENT','coverage_status':'VALIDATED','terminal_reason':None,
            'unresolved_issue':['Canonical hosted-database integration and independent durable-evidence verification remain governed under #16; public source observations are validated independently of that infrastructure.'],
            'actionable_issue':False,
            'completion_evidence':['docs/sources/crotone-operational-check-2026-09-11.md','src/white_list_archive/parsers/crotone_tables.py','tests/test_crotone_parser_semantics.py','data/publication/multi_prefecture_pilot.json'],
            'known_content_sha256':[listed_sha,applicant_sha],
            'evidence':['data/source_registry/verified_primary_pages.csv','data/source_registry/source_series_inventory.csv','data/publication/multi_prefecture_pilot.json','docs/sources/crotone-operational-check-2026-09-11.md'],
            'last_completed_coverage_stage':'VALIDATED',
          })
          p.write_text(json.dumps(coverage,ensure_ascii=False,indent=2)+'\n')

          # Reverify already-mapped landing and series without changing registry denominators.
          p=root/'data/source_registry/verified_primary_pages.csv'
          rows=list(csv.reader(p.open(newline='',encoding='utf-8')))
          found=0
          for r in rows:
              if r and r[0]=='crotone': r[2]='2026-09-11'; r[3]='verified'; found+=1
          if found!=1: raise SystemExit(f'Crotone verified page rows: {found}')
          with p.open('w',newline='',encoding='utf-8') as f: csv.writer(f,lineterminator='\n').writerows(rows)

          p=root/'data/source_registry/source_series_inventory.csv'
          rows=list(csv.reader(p.open(newline='',encoding='utf-8')))
          notes={
            'crotone-listed':'Current official White List landing reverified 11 September 2026. The byte-pinned 130-page listed attachment yields 328 conservative public observations from 743 reviewed section rows (73 listed; 255 renewal/update in progress). Exact source-layout and grouping evidence is documented in docs/sources/crotone-operational-check-2026-09-11.md.',
            'crotone-applicants':'Current official White List landing reverified 11 September 2026. The byte-pinned 46-page applicant attachment yields 180 pending observations after deterministic stitching of 25 cross-page continuation fragments. Exact evidence is documented in docs/sources/crotone-operational-check-2026-09-11.md.'}
          found=set()
          for r in rows:
              if r and r[0] in notes:
                  r[8]='2026-09-11'; r[9]=notes[r[0]]; found.add(r[0])
          if found!=set(notes): raise SystemExit(f'Crotone series rows missing: {set(notes)-found}')
          with p.open('w',newline='',encoding='utf-8') as f: csv.writer(f,lineterminator='\n').writerows(rows)

          # Public browser acceptance denominators and authority-specific checks.
          p=root/'tests/public_portal_browser.cjs'; text=p.read_text()
          old="      assert.ok(labels.includes('White List ordinaria · Prefettura di Caltanissetta'));\n"
          if "Prefettura di Crotone" not in text:
              if old not in text: raise SystemExit('browser label anchor drift')
              text=text.replace(old,old+"      assert.ok(labels.includes('White List ordinaria · Prefettura di Crotone'));\n",1)
          text=text.replace('assert.equal(stats.total,19321);','assert.equal(stats.total,19829);',1)
          text=text.replace("'caltanissetta'].includes(r.authority_key)","'caltanissetta','crotone'].includes(r.authority_key)",1)
          anchor="      assert.deepEqual(statusCounts(caltanissetta),{listed:281,other_or_unknown:5,pending:288,renewal_update_in_progress:232});\n"
          if "const crotone=registry.records.filter" not in text:
              if anchor not in text: raise SystemExit('browser Caltanissetta anchor drift')
              block=(anchor+"      const crotone=registry.records.filter(r=>r.authority_key==='crotone');\n"
                     "      assert.equal(crotone.length,508);\n"
                     "      assert.equal(crotone.filter(r=>r.source_key==='crotone-listed').length,328);\n"
                     "      assert.equal(crotone.filter(r=>r.source_key==='crotone-applicants').length,180);\n"
                     "      assert.deepEqual(statusCounts(crotone),{listed:73,pending:180,renewal_update_in_progress:255});\n"
                     "      const pm=crotone.filter(r=>r.name==='PM COSTRUZIONI S.R.L.');\n"
                     "      assert.ok(pm.some(r=>r.identifier_field_raw==='0330033796'&&r.identifiers.length===0));\n")
              text=text.replace(anchor,block,1)
          p.write_text(text)

          # Human-readable evidence boundary.
          p=root/'docs/sources/crotone-operational-check-2026-09-11.md'
          p.write_text('''# Crotone operational source check — 11 September 2026

The current official Prefettura di Crotone White List landing page was reverified on 11 September 2026 and positively exposes two distinct populations: **Ditte iscritte white list** and **Ditte con richiesta iscrizione white list**. Failed or blocked independent HTTP requests are not treated as negative evidence.

## Byte-pinned current sources

- Listed population: `ditte-iscritte-white-list-2.pdf`, SHA-256 `c9a2774c5842b895cd0bb18be3fe30a0c8858b2d67e985a993983e1834f0d511`, 130 pages.
- Applicant population: `ditte-con-richiesta-iscrizione-white-list-2.pdf`, SHA-256 `af66ff6bf6a173c4156fef3e7741ca26956769e399285764123ef8405097e6d1`, 46 pages.

Neither PDF states a reliable edition date in its visible content. PDF metadata records creation/modification on 9 September 2026, so the public configuration uses the **verification date 11 September 2026** as its reference date rather than inventing an edition date.

## Listed population

The table audit identified 743 reviewed section rows after one deterministic structural continuation: on page 63 a row with blank identity/address cells contains only a second date/status observation immediately below `SAMMARCO GIUSEPPE COSTRUZIONI GENERALI SRL`; only the preceding identity/address cells are carried, while the date/status observation remains separate.

Companies recur across White List sections. A conservative grouping uses normalised company name, the raw source identifier, formatting-only normalised registered address, semantic listing date (or raw sentinel), semantic expiry date (or raw sentinel), and source status. It yields **328 public observations: 73 `listed` and 255 `renewal_update_in_progress`**. A broader identity/date/status grouping would produce 323 groups but merges five cases with substantively different addresses; it is therefore rejected. No identifier, address or missing date is repaired or inferred.

## Applicant population

The applicant PDF contains 205 non-header physical table rows. Twenty-five are deterministic cross-page continuation fragments. The fail-closed stitching rules yield **180 distinct `pending` observations**, with zero duplicate logical rows. One reviewed example is `INERTI CALCESTRUZZI NETO S.A.S DI SALVATORE LIDONNICI & C`, whose identity/date and long textual cells are split across pages 9–10.

Malformed source identifiers remain in `identifier_field_raw` and never become canonical IDs. This includes embedded-space/mixed values such as `VRTGPP43P20 E339O` and `RLLGGR87M29 B774G/ 03332600794`.

## Publication boundary

The production parsers freeze page counts, row denominators, grouping denominator, statuses and applicant continuation count. They fail closed on new table widths, unreviewed date typography, ambiguous page continuations, duplicate same-section grouping, or source-count drift. Durable evidence and hosted-database integration remain governed separately under issue #16.
''',encoding='utf-8')
          PY
      - name: Install complete validation runtime
        run: |
          python -m pip install -e '.[dev,publication,storage,database]'
      - name: Validate parser semantics and repository
        run: pytest -q
      - name: Validate byte-pinned Crotone parsers against current official sources
        run: |
          python - <<'PY'
          import hashlib, json, time
          from pathlib import Path
          from urllib.request import Request,urlopen
          from white_list_archive.parsers.crotone_tables import PARSERS
          cfg=json.loads(Path('data/publication/multi_prefecture_pilot.json').read_text())['sources']
          for source in [x for x in cfg if x['authority_key']=='crotone']:
              last=None
              for i in range(5):
                  try:
                      with urlopen(Request(source['resource_url'],headers={'User-Agent':'italian-anti-mafia-whitelist/0.1 (+production validation)','Accept':'application/pdf,*/*'}),timeout=90) as r: body=r.read()
                      break
                  except Exception as e:
                      last=e; time.sleep(4*(i+1))
              else: raise last
              if hashlib.sha256(body).hexdigest()!=source['sha256']: raise SystemExit(f"SHA drift: {source['source_key']}")
              path=Path('/tmp')/(source['source_key']+'.pdf'); path.write_bytes(body)
              batch=PARSERS[source['parser']](path,source)
              assert len(batch.records)==source['expected_source_rows'],(source['source_key'],len(batch.records))
              print(source['source_key'],batch.diagnostics)
          PY
      - name: Validate national public build candidate
        run: |
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/public-national-sources \
            --registry-json /tmp/registry.json \
            --registry-csv /tmp/registry.csv \
            --prefectures-json /tmp/prefectures.json \
            --prefectures-csv /tmp/prefectures.csv
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('/tmp/registry.json').read_text())
          pref=json.loads(Path('/tmp/prefectures.json').read_text())
          assert reg['meta']['record_count']==19829,reg['meta']
          assert reg['meta']['authority_count']==24,reg['meta']
          assert reg['meta']['register_count']==25,reg['meta']
          assert pref['meta']['mapped_count']==36,pref['meta']
          assert pref['meta']['published_count']==24,pref['meta']
          cr=[r for r in reg['records'] if r['authority_key']=='crotone']
          assert len(cr)==508
          assert sum(r['source_status']=='listed' for r in cr)==73
          assert sum(r['source_status']=='renewal_update_in_progress' for r in cr)==255
          assert sum(r['source_status']=='pending' for r in cr)==180
          print('Crotone production candidate validated:',reg['meta']['record_count'],pref['meta'])
          PY
      - name: Commit production candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/white_list_archive/publishing/public_national_registry.py data/publication/multi_prefecture_pilot.json data/monitoring/national_coverage.json data/source_registry/verified_primary_pages.csv data/source_registry/source_series_inventory.csv tests/public_portal_browser.cjs docs/sources/crotone-operational-check-2026-09-11.md
          git commit -m 'Integrate Crotone public archive'
          git push origin HEAD:expansion/crotone-2026-09-11
