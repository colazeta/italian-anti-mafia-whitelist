name: Pescara anomaly detail

on:
  push:
    branches: [expansion/pescara-2026-09-21]
    paths: [.github/workflows/pescara-anomaly-detail.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: expansion/pescara-2026-09-21, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq antiword
          python -m pip install --disable-pip-version-check requests
      - name: Identify reviewed anomaly identities
        run: |
          python - <<'PY'
          import collections,hashlib,json,re,subprocess,xml.etree.ElementTree as ET
          from pathlib import Path
          import requests
          sources={
            'listed':('https://prefettura.interno.gov.it/sites/default/files/0/2026-09/white-list-2026.doc','6a8aa832db7d0f55c17d9ed1f8179d9ed46a7c927b5b88d85319f79a1da92239'),
            'applicants':('https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco_richiedenti_white-list_04.09.2026.doc','2a0f74ab6548ad2418f539aba7fc2eaf0d23998b709b0bc247e512d7b46a578c')}
          clean=lambda x:re.sub(r'\s+',' ',x or '').strip()
          def root(key):
            url,sha=sources[key];b=requests.get(url,timeout=60).content
            if hashlib.sha256(b).hexdigest()!=sha:raise RuntimeError('hash drift')
            p=Path('/tmp/'+key+'.doc');p.write_bytes(b)
            db=subprocess.run(['antiword','-x','db',str(p)],stdout=subprocess.PIPE,check=True).stdout.decode('utf-8','replace')
            return ET.fromstring(re.sub(r'<!DOCTYPE book PUBLIC.*?docbookx\.dtd">\s*','',db,flags=re.S))
          def header(c): return 'ragione sociale' in ' | '.join(c).casefold()
          r=root('listed');chapter=[x for x in r.findall('.//chapter') if x.findall('.//informaltable')][0]
          sec='';phys=[]
          for para_i,para in enumerate(chapter.findall('./para'),1):
            table=para.find('.//informaltable')
            if table is None:
              t=clean(''.join(para.itertext()))
              if t.upper().startswith('SEZIONE'):sec=t
              continue
            for tg_i,tg in enumerate(table.findall('.//tgroup'),1):
              for row_i,row in enumerate(tg.findall('.//row'),1):
                c=[clean(''.join(e.itertext())) for e in row.findall('./entry')]
                if not any(c) or header(c):continue
                phys.append({'section':sec,'locator':f'para{para_i}:t{tg_i}:r{row_i}','cells':c})
          nonstandard=[x for x in phys if clean(x['cells'][6]) not in ('','IN RINNOVO')]
          memberships=collections.defaultdict(list)
          for x in phys:memberships[(x['section'],tuple(x['cells']))].append(x['locator'])
          same_section_dupes=[{'section':k[0],'cells':list(k[1]),'locators':v} for k,v in memberships.items() if len(v)>1]
          ar=root('applicants');rows=[]
          for tg in ar.findall('.//informaltable//tgroup'):
            for row in tg.findall('.//row'):
              c=[clean(''.join(e.itertext())) for e in row.findall('./entry')]
              if any(c) and not header(c):rows.append(c)
          details={'listed_nonstandard_status':nonstandard,'listed_same_section_duplicates':same_section_dupes,'applicant_rows_4_to_7':[{'row':i+1,'cells':rows[i]} for i in range(3,7)],'applicant_blank_name_rows':[{'row':i,'cells':c,'previous':rows[i-2] if i>1 else None} for i,c in enumerate(rows,1) if not c[0]]}
          Path('docs/sources/pescara-anomaly-detail-2026-09-21.json').write_text(json.dumps(details,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit anomaly detail
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/sources/pescara-anomaly-detail-2026-09-21.json
          git commit -m 'Checkpoint Pescara anomaly review'
          git push origin HEAD:expansion/pescara-2026-09-21
