name: Forli-Cesena finalise permanent gates

on:
  push:
    branches:
      - expansion/forli-cesena-2026-09-13
    paths:
      - .github/workflows/forli-cesena-finalise-gates.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forli-cesena-finalise-gates
  cancel-in-progress: false

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/forli-cesena-2026-09-13
          fetch-depth: 0

      - name: Update permanent browser gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/public_portal_browser.cjs')
          text = p.read_text(encoding='utf-8')
          replacements = [
              (
                  "      assert.ok(labels.includes('White List ordinaria · Prefettura di Foggia'));\n",
                  "      assert.ok(labels.includes('White List ordinaria · Prefettura di Foggia'));\n      assert.ok(labels.includes('White List ordinaria · Prefettura di Forlì-Cesena'));\n",
              ),
              ("      assert.equal(stats.total,30558);\n", "      assert.equal(stats.total,31307);\n"),
              (
                  "'catania','genova','foggia'].includes(r.authority_key));\n",
                  "'catania','genova','foggia','forli-cesena'].includes(r.authority_key));\n",
              ),
              (
                  "      assert.deepEqual(statusCounts(foggia),{listed:85,pending:628,renewal_update_in_progress:245});\n",
                  "      assert.deepEqual(statusCounts(foggia),{listed:85,pending:628,renewal_update_in_progress:245});\n      const forli=registry.records.filter(r=>r.authority_key==='forli-cesena');\n      assert.equal(forli.length,749);\n      assert.equal(forli.filter(r=>r.source_key==='forli-cesena-combined').length,749);\n      assert.deepEqual(statusCounts(forli),{listed:401,pending:144,renewal_update_in_progress:204});\n",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise RuntimeError(f'browser gate anchor drift: {old!r} count={text.count(old)}')
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/public_portal_browser.cjs
          git diff --cached --check
          git commit -m 'Extend browser acceptance to Forli-Cesena'
          git pull --rebase origin expansion/forli-cesena-2026-09-13
          git push origin HEAD:expansion/forli-cesena-2026-09-13

      - name: Update permanent Pages gate
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin expansion/forli-cesena-2026-09-13
          python - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/public-pages.yml')
          text = p.read_text(encoding='utf-8')
          replacements = [
              (
                  "      - 'src/white_list_archive/parsers/foggia_tables.py'\n",
                  "      - 'src/white_list_archive/parsers/foggia_tables.py'\n      - 'src/white_list_archive/parsers/forli_cesena_combined.py'\n",
              ),
              ("          assert reg['meta']['record_count'] == 30558\n", "          assert reg['meta']['record_count'] == 31307\n"),
              (
                  "'catania','genova','foggia'}\n",
                  "'catania','genova','foggia','forli-cesena'}\n",
              ),
              (
                  "'catania-ordinary','genova-ordinary','foggia-ordinary'\n",
                  "'catania-ordinary','genova-ordinary','foggia-ordinary','forli-cesena-ordinary'\n",
              ),
              ("          assert reg['meta']['authority_count'] == 31\n", "          assert reg['meta']['authority_count'] == 32\n"),
              ("          assert reg['meta']['register_count'] == 32\n", "          assert reg['meta']['register_count'] == 33\n"),
              ("          assert pref['meta']['published_count'] == 31\n", "          assert pref['meta']['published_count'] == 32\n"),
              ("          assert pref['meta']['mapped_count'] == 40\n", "          assert pref['meta']['mapped_count'] == 41\n"),
              (
                  "          assert len(foggia) == 1 and foggia[0]['mapped'] and foggia[0]['published'] and foggia[0]['series_count'] == 2\n",
                  "          assert len(foggia) == 1 and foggia[0]['mapped'] and foggia[0]['published'] and foggia[0]['series_count'] == 2\n          forli = [x for x in pref['prefectures'] if x['authority_key'] == 'forli-cesena']\n          assert len(forli) == 1 and forli[0]['mapped'] and forli[0]['published'] and forli[0]['series_count'] == 1\n",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise RuntimeError(f'Pages gate anchor drift: {old!r} count={text.count(old)}')
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
          git add .github/workflows/public-pages.yml
          git diff --cached --check
          git commit -m 'Extend Pages gate to Forli-Cesena'
          git pull --rebase origin expansion/forli-cesena-2026-09-13
          git push origin HEAD:expansion/forli-cesena-2026-09-13
