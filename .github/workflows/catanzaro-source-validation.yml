name: Catanzaro source validation (temporary)

on:
  push:
    branches:
      - expansion/catanzaro-2026-09-15
    paths:
      - .github/workflows/catanzaro-source-validation.yml
      - src/white_list_archive/parsers/catanzaro_tables.py
      - tests/test_catanzaro_parser_semantics.py
      - docs/sources/catanzaro-operational-check-2026-09-15.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project and validation dependencies
        run: python -m pip install -e .[dev,database,storage] requests
      - name: Revalidate official publication surface and capture resources twice
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          import requests

          PAGE = "https://prefettura.interno.gov.it/it/prefetture/catanzaro/provvedimenti-whitelist-elenchi"
          SOURCES = {
              "listed": {
                  "url": "https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elencoditteiscritteinwhitelistal10092026.pdf",
                  "sha256": "8578a1b2d3ef0e2d71f1133381082d63d131182fd1b74c456cffe708ed94df7f",
                  "bytes": 619398,
                  "filename": "elencoditteiscritteinwhitelistal10092026.pdf",
              },
              "applicants": {
                  "url": "https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elencoditterichiedentiiscrizioneinwhitelistal10092026.pdf",
                  "sha256": "8c5b0ea684b20f0893016e4a528bac57fb2b05c40aa9669340bdf7bd7dab115c",
                  "bytes": 338826,
                  "filename": "elencoditterichiedentiiscrizioneinwhitelistal10092026.pdf",
              },
          }
          headers = {"User-Agent": "italian-anti-mafia-whitelist/1.0 source-verification"}
          landing = requests.get(PAGE, timeout=60, headers=headers)
          landing.raise_for_status()
          for source in SOURCES.values():
              if source["filename"] not in landing.text:
                  raise RuntimeError(f"Official Catanzaro page no longer exposes {source['filename']}")

          for kind, source in SOURCES.items():
              payloads = []
              for attempt in (1, 2):
                  response = requests.get(source["url"], timeout=60, headers=headers)
                  response.raise_for_status()
                  if "pdf" not in response.headers.get("content-type", "").lower() and not response.content.startswith(b"%PDF"):
                      raise RuntimeError(
                          f"{kind} attempt {attempt}: non-PDF response {response.headers.get('content-type')!r}"
                      )
                  payloads.append(response.content)
                  print(json.dumps({
                      "kind": kind,
                      "attempt": attempt,
                      "bytes": len(response.content),
                      "sha256": hashlib.sha256(response.content).hexdigest(),
                  }, sort_keys=True))
              if payloads[0] != payloads[1]:
                  raise RuntimeError(f"{kind}: independent GETs were not byte-identical")
              digest = hashlib.sha256(payloads[0]).hexdigest()
              if digest != source["sha256"] or len(payloads[0]) != source["bytes"]:
                  raise RuntimeError(
                      f"{kind}: official source drift: sha={digest}, bytes={len(payloads[0])}"
                  )
              Path(f"/tmp/catanzaro-{kind}.pdf").write_bytes(payloads[0])
          PY
      - name: Parse fresh captures through the edition-bound parser
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          from white_list_archive.parsers.catanzaro_tables import (
              parse_catanzaro_applicants,
              parse_catanzaro_listed,
          )

          PAGE = "https://prefettura.interno.gov.it/it/prefetture/catanzaro/provvedimenti-whitelist-elenchi"
          common = {
              "authority_key": "catanzaro",
              "authority_name": "Prefettura di Catanzaro",
              "register_key": "catanzaro-white-list",
              "register_name": "White List — Prefettura di Catanzaro",
              "reference_date": "2026-09-10",
              "source_page_url": PAGE,
          }
          listed_cfg = {
              **common,
              "source_key": "catanzaro-listed",
              "population_scope": "listed",
              "resource_url": "https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elencoditteiscritteinwhitelistal10092026.pdf",
              "sha256": "8578a1b2d3ef0e2d71f1133381082d63d131182fd1b74c456cffe708ed94df7f",
          }
          applicant_cfg = {
              **common,
              "source_key": "catanzaro-applicants",
              "population_scope": "applicant",
              "resource_url": "https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elencoditterichiedentiiscrizioneinwhitelistal10092026.pdf",
              "sha256": "8c5b0ea684b20f0893016e4a528bac57fb2b05c40aa9669340bdf7bd7dab115c",
          }
          listed = parse_catanzaro_listed(Path("/tmp/catanzaro-listed.pdf"), listed_cfg)
          applicants = parse_catanzaro_applicants(Path("/tmp/catanzaro-applicants.pdf"), applicant_cfg)
          assert listed.diagnostics["public_records"] == 610
          assert listed.diagnostics["sector_rows"] == 1556
          assert listed.diagnostics["status_counts"] == {
              "listed": 377,
              "renewal_update_in_progress": 233,
          }
          assert applicants.diagnostics["public_records"] == 277
          assert applicants.diagnostics["status_counts"] == {"pending": 277}
          assert len(listed.records) + len(applicants.records) == 887
          print(listed.diagnostics)
          print(applicants.diagnostics)
          PY
      - name: Run Catanzaro semantic regression tests
        run: pytest -q tests/test_catanzaro_parser_semantics.py
      - name: Run repository tests
        run: pytest -q
