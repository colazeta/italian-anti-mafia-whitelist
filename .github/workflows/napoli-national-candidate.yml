name: Napoli national integration candidate

on:
  push:
    branches:
      - expansion/napoli-2026-09-13
    paths:
      - '.github/workflows/napoli-national-candidate.yml'
      - 'tmp/napoli_national_candidate.py'
      - 'tmp/napoli_ledger_candidate.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Integrate validated Napoli national candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Napoli expansion branch
        uses: actions/checkout@v4
        with:
          ref: expansion/napoli-2026-09-13
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare runner package sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source_file; do
            [ -n "$source_file" ] && sudo rm -f "$source_file"
          done < <(grep -rlE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '\|dl\.google\.com/linux/chrome|d;\|packages\.google\.com/chrome|d' /etc/apt/sources.list
          fi

      - name: Install publication and test runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends poppler-utils; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install --disable-pip-version-check -e '.[dev,database,storage,publication]'

      - name: Apply fail-closed Napoli publication candidate
        run: python tmp/napoli_national_candidate.py prepare

      - name: Transition Napoli coverage ledger fail-closed
        run: python tmp/napoli_ledger_candidate.py

      - name: Run repository tests
        run: pytest -q

      - name: Build actual national candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/public-national-sources
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/public-national-sources \
            --registry-json public-site/data/registry.json \
            --registry-csv public-site/data/registry.csv \
            --prefectures-json public-site/data/prefectures.json \
            --prefectures-csv public-site/data/prefectures.csv

      - name: Freeze generated Napoli denominators and browser assertions
        run: python tmp/napoli_national_candidate.py finalize public-site/data/registry.json public-site/data/prefectures.json

      - name: Validate generated public artifact
        run: python -m white_list_archive.publishing.public_artifact public-site

      - name: Install browser acceptance runtime
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test candidate portal at desktop and mobile widths
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory public-site > /tmp/napoli-public-preview.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          node tests/public_portal_browser.cjs

      - name: Check official-source links without turning a transient fetch into data failure
        shell: bash
        run: |
          set +e
          python -m white_list_archive.publishing.public_links public-site /tmp/napoli-link-audit.json
          status=$?
          echo "official_link_audit_exit=$status"
          if [ -f /tmp/napoli-link-audit.json ]; then
            cat /tmp/napoli-link-audit.json
          fi
          exit 0

      - name: Commit only validated production candidate
        shell: bash
        run: |
          set -euo pipefail
          git restore public-site/data/registry.json public-site/data/registry.csv public-site/data/prefectures.json public-site/data/prefectures.csv
          rm -f tmp/napoli_national_candidate.py tmp/napoli_ledger_candidate.py
          git config user.name colazeta
          git config user.email '47261299+colazeta@users.noreply.github.com'
          git add \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            src/white_list_archive/parsers/napoli_tables.py \
            src/white_list_archive/publishing/public_national_registry.py \
            tests/public_portal_browser.cjs
          git add -u tmp/napoli_national_candidate.py tmp/napoli_ledger_candidate.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No validated candidate diff to commit' >&2
            exit 1
          fi
          git status --short
          git commit -m 'Integrate validated Napoli national candidate'
          git push origin HEAD:expansion/napoli-2026-09-13
