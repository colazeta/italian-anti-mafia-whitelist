name: Caserta anomaly audit

on:
  push:
    branches:
      - expansion/caserta-2026-09-12
    paths:
      - .github/workflows/caserta-anomaly-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/caserta-2026-09-12
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit runtime
        run: python -m pip install --disable-pip-version-check requests pdfplumber
      - name: Inspect exact anomaly rows
        env:
          LISTED_URL: https://prefettura.interno.gov.it/sites/default/files/30/2026-09/elenco-iscritti-31082026_white-list.pdf
          APPLICANT_URL: https://prefettura.interno.gov.it/sites/default/files/30/2026-08/elenco_imprese_richiedenti_iscrizione_white_list-al-31.08.2026.pdf
          LISTED_SHA256: d323335641b3a84a2e13c047e403030b5bb6a98ec6d034c8648d1286d703585a
          APPLICANT_SHA256: 90f4bfbedd6c2e4794330066df83bfce834bb3a2707902fe2705430439d1ffc5
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, re
          from collections import Counter
          from pathlib import Path
          import requests, pdfplumber

          OUT=Path('tmp/caserta_anomaly_audit.json'); OUT.parent.mkdir(parents=True,exist_ok=True)
          UA={'User-Agent':'italian-anti-mafia-whitelist anomaly auditor/1.0'}
          DATE=re.compile(r'^\d{2}/\d{2}/\d{4}$')
          STRICT_TOKEN=re.compile(r'(?<![A-Z0-9])(?:\d{11}|[A-Z]{6}\d{2}[A-Z]\d{2}[A-Z]\d{3}[A-Z])(?![A-Z0-9])',re.I)
          SECTIONS=re.compile(r'^(?:10|[1-9])(?:\s*[-–—,;/]\s*(?:10|[1-9]))*$')

          def clean(v): return re.sub(r'\s+',' ',(v or '').replace('\xa0',' ')).strip()
          def fetch(url,expected,stem):
              r=requests.get(url,headers=UA,timeout=120); r.raise_for_status()
              sha=hashlib.sha256(r.content).hexdigest()
              if sha != expected: raise RuntimeError(f'{stem}: SHA mismatch {sha}')
              p=Path(f'/tmp/{stem}.pdf'); p.write_bytes(r.content); return p
          def rows(path):
              out=[]
              with pdfplumber.open(path) as pdf:
                  for pno,page in enumerate(pdf.pages,1):
                      for tno,table in enumerate(page.extract_tables() or [],1):
                          for rno,row in enumerate(table or [],1):
                              c=[clean(x) for x in row]
                              if c and c[0].isdigit(): out.append({'index':int(c[0]),'page':pno,'table':tno,'row':rno,'cells':c})
              return out
          def tokenise(raw):
              return [x.upper() for x in STRICT_TOKEN.findall(clean(raw).upper())]
          def listed_audit(rs):
              anomalies=[]; id_token_counts=Counter()
              for r in rs:
                  c=r['cells']; raw_id=c[4]; tokens=tokenise(raw_id); id_token_counts[len(tokens)]+=1
                  status=clean(c[7]).casefold(); section=clean(c[8]);
                  reasons=[]
                  if not raw_id or len(tokens)!=1: reasons.append('identifier_token_count')
                  if c[3]: reasons.append('secondary_office_nonblank')
                  if c[5] and not DATE.fullmatch(c[5]): reasons.append('registration_date_noncanonical')
                  if c[6] and not DATE.fullmatch(c[6]) and not re.match(r'^\d{2}/\d{2}/\d{4}\b',c[6]): reasons.append('expiry_date_noncanonical')
                  if status not in {'','in aggiornamento'}: reasons.append('unusual_update_field')
                  if not SECTIONS.fullmatch(section): reasons.append('section_noncanonical')
                  if reasons:
                      anomalies.append({**r,'reasons':reasons,'identifier_tokens':tokens})
              return {'data_rows':len(rs),'id_token_count_distribution':dict(id_token_counts),'anomaly_rows':anomalies,'anomaly_indices':[r['index'] for r in anomalies]}
          def applicant_audit(rs):
              anomalies=[]; id_token_counts=Counter(); statuses=Counter()
              for r in rs:
                  c=r['cells']; tokens=tokenise(c[4]); id_token_counts[len(tokens)]+=1
                  status=clean(c[7]).casefold(); statuses[status]+=1; reasons=[]
                  if not c[4] or len(tokens)!=1: reasons.append('identifier_token_count')
                  if c[3]: reasons.append('secondary_office_nonblank')
                  if not SECTIONS.fullmatch(c[5]): reasons.append('section_noncanonical')
                  if c[6] and not DATE.fullmatch(c[6]): reasons.append('application_date_noncanonical')
                  if not c[6]: reasons.append('application_date_blank')
                  if status not in {'in istruttoria','in isruttoria'}: reasons.append('unusual_outcome_field')
                  if reasons:
                      anomalies.append({**r,'reasons':reasons,'identifier_tokens':tokens})
              return {'data_rows':len(rs),'id_token_count_distribution':dict(id_token_counts),'status_values':dict(statuses),'anomaly_rows':anomalies,'anomaly_indices':[r['index'] for r in anomalies]}

          lp=fetch(os.environ['LISTED_URL'],os.environ['LISTED_SHA256'],'caserta_listed')
          ap=fetch(os.environ['APPLICANT_URL'],os.environ['APPLICANT_SHA256'],'caserta_applicants')
          report={'listed':listed_audit(rows(lp)),'applicants':applicant_audit(rows(ap))}
          OUT.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:{'data_rows':v['data_rows'],'id_token_count_distribution':v['id_token_count_distribution'],'anomaly_count':len(v['anomaly_rows']),'anomaly_indices':v['anomaly_indices']} for k,v in report.items()},ensure_ascii=False,indent=2))
          PY
      - name: Persist anomaly checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin expansion/caserta-2026-09-12
          git add tmp/caserta_anomaly_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Checkpoint Caserta anomaly audit'
          git push origin HEAD:expansion/caserta-2026-09-12
