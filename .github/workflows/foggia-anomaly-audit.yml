name: Foggia anomaly audit

on:
  push:
    branches:
      - expansion/foggia-2026-09-13
    paths:
      - .github/workflows/foggia-anomaly-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/foggia-2026-09-13
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pdfplumber
      - name: Audit applicant outcomes and listed identity conflicts
        run: |
          python - <<'PY'
          from __future__ import annotations
          import collections, hashlib, io, json, re
          from pathlib import Path
          import requests, pdfplumber

          SOURCES={
            'listed':('https://prefettura.interno.gov.it/sites/default/files/43/2026-09/white-list-elenco-imprese-iscritte-aggiornato_al-08-09-2026-copia.pdf','313828d0d7fc0797920697841411503230a1a569e1eb8d41f93aec15908e5d5a'),
            'applicants':('https://prefettura.interno.gov.it/sites/default/files/43/2026-09/elenco_delle_imprese_richiedenti_iscrizione_elenco_fornitori_agg_10-09-2026.pdf','d76eab040fcb984dbabbff740296f9cd30b41ef028ba756d210d4b7d7df2f6d5'),
          }
          UA='Mozilla/5.0 (compatible; italian-anti-mafia-whitelist-anomaly-audit/1.0)'
          ID=re.compile(r'(?<![A-Za-z0-9])(?:\d{11}|[A-Za-z]{6}[0-9A-Za-z]{10})(?![A-Za-z0-9])')
          DATE_TOKEN=re.compile(r'(?<!\d)(?:\d{1,2})[./-](?:\d{1,2})[./-](?:20\d{2})(?!\d)')
          YEAR=re.compile(r'20\d{2}')
          SECTION=re.compile(r'\bSezione\s+([IVX]+)\s*[:.-]?\s*([^\n]*)',re.I)
          def clean(v): return ' '.join((v or '').replace('\xa0',' ').split())
          def ids(v):
            return list(dict.fromkeys(m.group(0).upper() for m in ID.finditer(clean(v))))
          def get(pop):
            url,sha=SOURCES[pop]
            r=requests.get(url,headers={'User-Agent':UA},timeout=60); r.raise_for_status()
            got=hashlib.sha256(r.content).hexdigest()
            if got!=sha: raise SystemExit(f'hash drift {pop}: {got}')
            return r.content
          def page_rows(raw):
            out=[]
            with pdfplumber.open(io.BytesIO(raw)) as pdf:
              for pno,page in enumerate(pdf.pages,1):
                text=page.extract_text() or ''
                sm=SECTION.search(text)
                section={'roman':sm.group(1).upper(),'label':clean(sm.group(2))} if sm else None
                for ti,t in enumerate(page.extract_tables() or []):
                  for ri,row in enumerate(t or []):
                    c=[clean(x) for x in (row or [])]
                    if any(c): out.append({'page':pno,'table':ti,'row':ri,'cells':c,'section':section})
            return out

          listed=page_rows(get('listed'))
          applicants=page_rows(get('applicants'))
          result={'authority_key':'foggia'}

          # Applicant file: classify every 7-column non-header row by exact last-column source outcome.
          a7=[r for r in applicants if len(r['cells'])==7]
          def is_header(c):
            joined=' '.join(c).casefold()
            return ('ragione sociale' in joined or 'codice fiscale' in joined or 'data presentazione' in joined or 'data richiesta' in joined)
          adata=[r for r in a7 if clean(r['cells'][0]) and not is_header(r['cells'])]
          outcomes=collections.Counter(clean(r['cells'][6]) for r in adata)
          outcome_detail={}
          for outcome in sorted(outcomes):
            rs=[r for r in adata if clean(r['cells'][6])==outcome]
            date_col_counts=collections.Counter()
            for r in rs:
              for idx,v in enumerate(r['cells']):
                if YEAR.search(v): date_col_counts[str(idx)]+=1
            outcome_detail[outcome]={
              'rows':len(rs),
              'rows_with_year_anywhere':sum(bool(YEAR.search(' | '.join(r['cells']))) for r in rs),
              'rows_with_strict_id_col3':sum(bool(ids(r['cells'][3])) for r in rs),
              'year_column_counts':dict(date_col_counts),
              'examples':[{'page':r['page'],'row':r['row'],'cells':r['cells']} for r in rs[:12]],
            }
          no_outcome=[r for r in adata if not clean(r['cells'][6])]
          applicant_id_groups=collections.defaultdict(list)
          for r in adata:
            for ident in ids(r['cells'][3]): applicant_id_groups[ident].append(r)
          applicant_dups=[]
          for ident,rs in applicant_id_groups.items():
            if len(rs)>1:
              applicant_dups.append({'identifier':ident,'rows':[{'page':r['page'],'row':r['row'],'name':r['cells'][0],'activities':r['cells'][4],'date':r['cells'][5],'outcome':r['cells'][6]} for r in rs]})
          result['applicants']={
            'page_count':max(r['page'] for r in applicants),
            'all_nonempty_table_rows':len(applicants),
            'seven_col_rows':len(a7),
            'seven_col_data_rows':len(adata),
            'outcome_counts':dict(outcomes),
            'outcome_detail':outcome_detail,
            'rows_without_outcome':len(no_outcome),
            'rows_without_outcome_examples':[{'page':r['page'],'row':r['row'],'cells':r['cells']} for r in no_outcome[:25]],
            'duplicate_strict_identifier_groups':applicant_dups,
          }

          # Listed file: compare alternative safe grouping keys and enumerate every true conflict.
          ldata=[]
          for r in listed:
            c=r['cells']
            if len(c)==7 and clean(c[0]) and clean(c[3]) and not is_header(c) and (YEAR.search(c[4]) or YEAR.search(c[5])):
              ldata.append(r)
          def norm_update(v):
            x=clean(v)
            f=x.casefold().replace(' ', '')
            if f in {'incorso','iincorso'}: return 'IN CORSO'
            return x
          by_identity=collections.defaultdict(list)
          exact_groups=collections.defaultdict(list)
          semantic_groups=collections.defaultdict(list)
          for r in ldata:
            c=r['cells']; iv=ids(c[3])
            ident=iv[0] if len(iv)==1 else f'RAW::{clean(c[3])}::{clean(c[0])}'
            by_identity[ident].append(r)
            exact_groups[(clean(c[0]),clean(c[3]),clean(c[4]),clean(c[5]),clean(c[6]))].append(r)
            semantic_groups[(clean(c[0]),clean(c[3]),clean(c[4]),clean(c[5]),norm_update(c[6]))].append(r)
          conflicts=[]
          for ident,rs in by_identity.items():
            variants=lambda i: sorted({clean(r['cells'][i]) for r in rs if clean(r['cells'][i])})
            names,listing,expiry,update=variants(0),variants(4),variants(5),variants(6)
            if len(names)>1 or len(listing)>1 or len(expiry)>1 or len(update)>1:
              conflicts.append({
                'identifier_key':ident,'row_count':len(rs),'names':names,
                'listing_raw':listing,'expiry_raw':expiry,'update_raw':update,
                'semantic_update':sorted({norm_update(r['cells'][6]) for r in rs}),
                'rows':[{'page':r['page'],'row':r['row'],'section':r['section'],'cells':r['cells']} for r in rs],
              })
          result['listed']={
            'page_count':max(r['page'] for r in listed),
            'sector_rows':len(ldata),
            'identity_groups':len(by_identity),
            'exact_source_groups':len(exact_groups),
            'semantic_typography_groups':len(semantic_groups),
            'identity_conflicts':conflicts,
            'identity_conflict_count':len(conflicts),
            'strict_identifier_rows':sum(len(ids(r['cells'][3]))==1 for r in ldata),
            'raw_identifier_rows':sum(len(ids(r['cells'][3]))!=1 for r in ldata),
            'raw_identifier_examples':[{'page':r['page'],'row':r['row'],'name':r['cells'][0],'identifier_raw':r['cells'][3]} for r in ldata if len(ids(r['cells'][3]))!=1][:30],
          }
          Path('tmp').mkdir(exist_ok=True)
          Path('tmp/foggia_anomaly_audit.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({
            'applicants':{
              'page_count':result['applicants']['page_count'],
              'all_nonempty_table_rows':result['applicants']['all_nonempty_table_rows'],
              'seven_col_data_rows':result['applicants']['seven_col_data_rows'],
              'outcome_counts':result['applicants']['outcome_counts'],
              'rows_without_outcome':result['applicants']['rows_without_outcome'],
              'duplicate_strict_identifier_group_count':len(applicant_dups),
              'outcome_detail':result['applicants']['outcome_detail'],
            },
            'listed':{
              k:result['listed'][k] for k in ('page_count','sector_rows','identity_groups','exact_source_groups','semantic_typography_groups','identity_conflict_count','strict_identifier_rows','raw_identifier_rows')
            },
          },ensure_ascii=False,indent=2))
          PY
      - name: Commit anomaly checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/foggia_anomaly_audit.json
          git commit -m 'Checkpoint Foggia source anomaly audit'
          git push origin HEAD:expansion/foggia-2026-09-13
