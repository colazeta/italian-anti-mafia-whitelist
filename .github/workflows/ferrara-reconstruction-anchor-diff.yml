name: Ferrara reconstruction anchor diff

on:
  push:
    branches: [expansion/ferrara-2026-09-20]
    paths: [.github/workflows/ferrara-reconstruction-anchor-diff.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e . requests pdfplumber==0.11.10
      - name: Compare direct anchors with production continuation merge
        shell: python
        run: |
          import collections, hashlib, re, secrets, tempfile
          from datetime import date
          from pathlib import Path
          import pdfplumber, requests
          from white_list_archive.parsers.ferrara_tables import (
              _parse_reconstruction_physical, _is_header, _is_reconstruction_structural,
              _status, _clean,
          )

          SOURCES={
            'A':('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-a-fornitura-moduli-prefabbricati-e-dei-relativi-arredi_is_0.pdf','4fdf292b1538892c7b5ff79d3c0c14e0ed3b5830effb791316b0fddb8c90ae01',8),
            'B':('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-b-demolizione-di-edifici-ed-altre-strutture_is_0.pdf','97d9af0d587af0b7d93d31df33bd612440bf5be5b48b57872d436e2afeb164ec',35),
            'C':('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-c-movimenti-di-terra_is_0.pdf','99f519101dccff84dddd9753f0d6fa27170c33b1982858afe9fdf9ebbc63c57e',23),
            'D':('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-d-noleggio-con-coducente-mezzi-speciali_is_0.pdf','07c27b38e48a879aa0d1efff4710bf7dbbf1bb323e59f62eb0b0b796a75a46d8',7),
            'E':('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-e-fornitura-e-posa-in-opera-impianti-fotovoltaici_is_0.pdf','9cea950d37f653d0356edb9a46a7f43665a382e771c969bc93f7027f95fecf9e',13),
            'F':('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-f-fornitura-e-manutenzione-impianti-tecnologici_is_0.pdf','ac7dd77f1c4633c27a62c0ad7e074f507a10b091a327c2fc1072cfb52fd45664',14),
            'G':('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-g-fornitura-beni-necessari-ricostruzione_is_0.pdf','0657c7e0f0b9fb8ad7f0b341682716d695132e61131adc92407627a5cae82bae',3),
          }
          EMPTY={('C',23)}

          def capture(s,root):
            url,expected,_=SOURCES[s]
            bodies=[]
            for _ in range(2):
              r=requests.get(url,headers={'User-Agent':'italian-anti-mafia-whitelist/ferrara-anchor-diff','Cache-Control':'no-cache','Pragma':'no-cache'},params={'n':secrets.token_hex(8)},timeout=90)
              r.raise_for_status(); got=hashlib.sha256(r.content).hexdigest(); assert got==expected,(s,expected,got,len(r.content)); bodies.append(r.content)
            assert bodies[0]==bodies[1],f'independent capture mismatch {s}'
            p=root/f'{s}.pdf';p.write_bytes(bodies[0]);return p

          def sem_date(raw):
            raw=_clean(raw)
            if not raw:return ''
            m=re.fullmatch(r'(\d{1,2})/(\d{1,2})/(\d{4})',raw)
            if not m:return f'RAW:{raw}'
            d,mn,y=map(int,m.groups())
            try:return date(y,mn,d).isoformat()
            except ValueError:return f'RAW:{raw}'

          def key(row):
            return (row['identifier_raw'].casefold(),sem_date(row['listed_raw']),sem_date(row['expiry_raw']),_status(row['note']))

          def direct_anchors(paths):
            anchors=[]; continuation_rows=[]; unclassified=[]; empty=set()
            for sector in sorted(paths):
              expected_pages=SOURCES[sector][2]
              with pdfplumber.open(paths[sector]) as pdf:
                assert len(pdf.pages)==expected_pages,(sector,len(pdf.pages),expected_pages)
                current=None
                for pno,page in enumerate(pdf.pages,1):
                  tables=page.extract_tables() or []
                  if len(tables)!=1:
                    text=_clean(page.extract_text() or ''); words=page.extract_words() or []
                    if (sector,pno) in EMPTY and not tables and not text and not words:
                      empty.add((sector,pno)); current=None; continue
                    raise RuntimeError((sector,pno,'table_count',len(tables),text,len(words)))
                  for tno,table in enumerate(tables,1):
                    for rno,raw in enumerate(table or [],1):
                      cells=[_clean(v) for v in raw]
                      if not any(cells):continue
                      if len(cells)!=6:raise RuntimeError((sector,pno,rno,'cols',len(cells),cells))
                      loc=f'{sector}:p{pno}:t{tno}:r{rno}'
                      if _is_header(cells) or _is_reconstruction_structural(cells): current=None; continue
                      name,office,ident,listed,expiry,note=cells
                      if name and ident and expiry:
                        row={'sector':sector,'name':name,'office':office,'identifier_raw':ident,'listed_raw':listed,'expiry_raw':expiry,'note':note,'locator':loc}
                        anchors.append(row); current=row; continue
                      if current is not None and not ident and not listed and not expiry and any((name,office,note)):
                        continuation_rows.append({'anchor_locator':current['locator'],'anchor_key_before':key(current),'anchor_note_before':current['note'],'locator':loc,'cells':cells})
                        continue
                      unclassified.append((sector,loc,cells))
            assert empty==EMPTY,empty
            return anchors,continuation_rows,unclassified

          with tempfile.TemporaryDirectory() as d:
            root=Path(d); paths={s:capture(s,root) for s in SOURCES}
            direct,continuations,unclassified=direct_anchors(paths)
            production=_parse_reconstruction_physical(paths)
            print('PHYSICAL_COUNTS direct production continuations unclassified',len(direct),len(production),len(continuations),len(unclassified))
            print('UNCLASSIFIED',repr(unclassified))
            direct_by_locator={r['locator']:r for r in direct}
            prod_by_locator={r['physical_locators'][0]:r for r in production}
            print('ANCHOR_LOCATOR_DIFF direct_only',sorted(set(direct_by_locator)-set(prod_by_locator)))
            print('ANCHOR_LOCATOR_DIFF production_only',sorted(set(prod_by_locator)-set(direct_by_locator)))
            assert set(direct_by_locator)==set(prod_by_locator)

            status_changes=[]; key_changes=[]
            for loc in sorted(direct_by_locator):
              before=direct_by_locator[loc]; after=prod_by_locator[loc]
              kb=key(before); ka=key(after)
              if _status(before['note'])!=_status(after['note']):
                status_changes.append((loc,before['name'],before['identifier_raw'],before['note'],after['note'],_status(before['note']),_status(after['note']),after['physical_locators']))
              if kb!=ka:
                key_changes.append((loc,before['name'],kb,ka,before['note'],after['note'],after['physical_locators']))
            print('STATUS_CHANGES',repr(status_changes))
            print('GROUP_KEY_CHANGES',repr(key_changes))
            print('CONTINUATIONS')
            for item in continuations: print(repr(item))

            direct_groups=collections.defaultdict(list); prod_groups=collections.defaultdict(list)
            for r in direct: direct_groups[key(r)].append(r['locator'])
            for r in production: prod_groups[key(r)].append(r['physical_locators'][0])
            print('GROUP_COUNTS direct production',len(direct_groups),len(prod_groups))
            direct_members={tuple(sorted(v)):k for k,v in direct_groups.items()}
            prod_members={tuple(sorted(v)):k for k,v in prod_groups.items()}
            print('DIRECT_GROUPS_NOT_PRODUCTION')
            for members,k in direct_members.items():
              if members not in prod_members: print(repr((k,members)))
            print('PRODUCTION_GROUPS_NOT_DIRECT')
            for members,k in prod_members.items():
              if members not in direct_members: print(repr((k,members)))

            # This diagnostic is intentionally evidentiary, not a gate on the disputed 694/697 denominator.
            assert len(direct)==1161==len(production)
