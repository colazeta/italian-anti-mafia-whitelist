name: Genova reviewed legend-row patch

on:
  push:
    branches:
      - expansion/genova-2026-09-12
    paths:
      - .github/workflows/genova-legend-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/genova-2026-09-12
      - name: Add exact reviewed legend-row exclusion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/white_list_archive/parsers/genova_tables.py')
          text = path.read_text(encoding='utf-8')

          constant_needle = '_RENEWAL = "RICHIESTO RINNOVO"\n'
          constant_block = '''_RENEWAL = "RICHIESTO RINNOVO"\n_REVIEWED_LISTED_LEGEND = (\n    "Legenda Sez. I - Estrazione, fornitura e trasporto di terra e materiali inerti "\n    "Sez. II - Confezionamento, fornitura e trasporto di calcestruzzo e bitume "\n    "Sez. III - Noli a freddo di macchinari Sez. IV - Fornitura di ferro lavorato "\n    "Sez. V - Noli a caldo Sez. VI - Autotrasporto per conto terzi "\n    "Sez. VII - Guardiani ai cantieri Sez. VIII - Servizi funerari e cimiteriali "\n    "Sez. IX - Ristorazione, gestione delle mense e catering "\n    "Sez. X - Servizi ambientali, comprese le attività di raccolta, di trasporto nazionale e transfrontaliero, "\n    "anche per conto terzi, di trattamento e di smaltimento dei rifiuti, nonché le attività di risanamento "\n    "e bonifica e gli altri servizi connessi alla gestione dei rifiuti"\n)\n'''
          if text.count(constant_needle) != 1:
              raise SystemExit(f'expected one renewal constant, found {text.count(constant_needle)}')
          if '_REVIEWED_LISTED_LEGEND' in text:
              raise SystemExit('reviewed legend constant already present')
          text = text.replace(constant_needle, constant_block, 1)

          row_needle = '''                    name = cells[0]\n                    if not name:\n                        raise RuntimeError(f"Genova listed blank name on page {page_number}, row {table_row}")\n                    section_values = _sections(cells[4], scope="listed", name=name)\n'''
          row_block = '''                    name = cells[0]\n                    if not name:\n                        raise RuntimeError(f"Genova listed blank name on page {page_number}, row {table_row}")\n                    if name == _REVIEWED_LISTED_LEGEND:\n                        if any(cells[1:]):\n                            raise RuntimeError(f"Genova listed reviewed legend geometry drift: {cells!r}")\n                        continue\n                    section_values = _sections(cells[4], scope="listed", name=name)\n'''
          if text.count(row_needle) != 1:
              raise SystemExit(f'expected one listed row binding, found {text.count(row_needle)}')
          text = text.replace(row_needle, row_block, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit reviewed parser correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/white_list_archive/parsers/genova_tables.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'Exclude reviewed Genova legend row'
          git push origin HEAD:expansion/genova-2026-09-12
