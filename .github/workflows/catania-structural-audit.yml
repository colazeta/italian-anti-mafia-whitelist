name: Catania structural audit

on:
  push:
    branches:
      - expansion/catania-2026-09-12
    paths:
      - .github/workflows/catania-structural-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/catania-2026-09-12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl
      - name: Audit byte-pinned workbooks
        run: |
          python - <<'PY'
          import collections, hashlib, json, os, re
          from datetime import date, datetime
          from io import BytesIO

          import requests
          from openpyxl import load_workbook

          SOURCES = {
            'listed': {
              'url': 'https://prefettura.interno.gov.it/sites/default/files/18/2026-09/white-list-iscritti-aggiornato-11-settembre-2026.xlsx',
              'sha256': '1d2cbba0751998da03ed7335c6525a8392bd3ec12513e81ee5f3f020e498a291',
              'header_row': 2,
              'columns': 8,
            },
            'applicants': {
              'url': 'https://prefettura.interno.gov.it/sites/default/files/18/2026-09/white-list-richiedenti-aggiornato-11-settembre-2026.xlsx',
              'sha256': '4e0cb83a5718cd54b284847a0746fe52fc48bb81be201b758d55024662cb2c27',
              'header_row': 4,
              'columns': 7,
            },
          }

          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0 (compatible; whitelist-archive-audit/1.0)'})

          def clean(v):
              if v is None:
                  return ''
              if isinstance(v, (date, datetime)):
                  return v.isoformat()
              return ' '.join(str(v).replace('\u00a0', ' ').split())

          def typ(v):
              if v is None:
                  return 'blank'
              if isinstance(v, datetime):
                  return 'datetime'
              if isinstance(v, date):
                  return 'date'
              if isinstance(v, str) and v.startswith('='):
                  return 'formula'
              return type(v).__name__

          def data_rows(sheet, header_row, columns):
              out = []
              for rn, values in enumerate(
                  sheet.iter_rows(min_row=header_row + 1, max_col=columns, values_only=True),
                  start=header_row + 1,
              ):
                  vals = list(values)
                  if any(clean(v) for v in vals):
                      out.append((rn, vals))
              return out

          report = {'authority_key': 'catania', 'reference_date': '2026-09-11', 'sources': {}}

          for population, cfg in SOURCES.items():
              r = session.get(cfg['url'], timeout=45)
              r.raise_for_status()
              digest = hashlib.sha256(r.content).hexdigest()
              if digest != cfg['sha256']:
                  raise SystemExit(f'{population} hash drift: {digest}')

              wf = load_workbook(BytesIO(r.content), read_only=True, data_only=False)
              wd = load_workbook(BytesIO(r.content), read_only=True, data_only=True)
              if wf.sheetnames != ['Foglio1'] or wd.sheetnames != ['Foglio1']:
                  raise SystemExit(f'{population} worksheet drift: {wf.sheetnames}')

              sf, sd = wf['Foglio1'], wd['Foglio1']
              rows = data_rows(sf, cfg['header_row'], cfg['columns'])
              rows_data = data_rows(sd, cfg['header_row'], cfg['columns'])
              data_by_row = {rn: vals for rn, vals in rows_data}

              result = {
                'url': cfg['url'],
                'sha256': digest,
                'sheet_rows': sf.max_row,
                'sheet_columns': sf.max_column,
                'data_rows': len(rows),
                'blank_rows_after_header': sf.max_row - cfg['header_row'] - len(rows),
                'field_type_counts': {},
                'missing_required': {},
                'exact_duplicate_groups': 0,
                'exact_duplicate_rows_beyond_first': 0,
                'anomalies': [],
              }

              for ci in range(cfg['columns']):
                  result['field_type_counts'][str(ci + 1)] = dict(collections.Counter(typ(v[ci]) for _, v in rows))

              anomaly_count_total = 0
              if population == 'listed':
                  req = {'name': 0, 'office': 1, 'sectors': 3, 'identifier': 4, 'listing_date': 5, 'expiry': 6}
                  status = collections.Counter(clean(v[7]) for _, v in rows)
                  sector_tokens = collections.Counter()
                  formula_shapes = collections.Counter()
                  expiry_cache = collections.Counter()

                  for rn, vf in rows:
                      for token in re.split(r'\s*[,.;]+\s*', clean(vf[3])):
                          if token:
                              sector_tokens[token] += 1

                      if typ(vf[6]) == 'formula':
                          formula_shapes[re.sub(r'\d+', '#', clean(vf[6]))] += 1
                          cached = data_by_row.get(rn, [''] * cfg['columns'])[6]
                          expiry_cache[typ(cached)] += 1

                      bad = []
                      for key, ci in req.items():
                          if not clean(vf[ci]):
                              bad.append(f'missing_{key}')

                      ident = clean(vf[4]).replace(' ', '')
                      if ident and not ((ident.isdigit() and len(ident) == 11) or (len(ident) == 16 and ident.isalnum())):
                          bad.append('identifier_nonstandard')

                      st = clean(vf[7]).casefold()
                      if st not in ('', 'richiesto rinnovo'):
                          bad.append('unreviewed_status')

                      if typ(vf[6]) == 'formula' and not re.fullmatch(
                          r'=DATE\(YEAR\(F\d+\)\+1,MONTH\(F\d+\),DAY\(F\d+\)\)', clean(vf[6]), re.I
                      ):
                          bad.append('unreviewed_expiry_formula')

                      if bad:
                          anomaly_count_total += 1
                          if len(result['anomalies']) < 250:
                              result['anomalies'].append({'row': rn, 'flags': bad, 'values': [clean(x) for x in vf]})

                  result['status_vocab'] = dict(status)
                  result['sector_tokens'] = dict(sector_tokens)
                  result['expiry_formula_shape_counts'] = dict(formula_shapes)
                  result['expiry_formula_cached_value_types'] = dict(expiry_cache)
                  key_rows = [tuple(clean(x) for x in v[:8]) for _, v in rows]

              else:
                  req = {'name': 0, 'office': 1, 'sectors': 3, 'identifier': 4, 'application_date': 5}
                  outcome = collections.Counter(clean(v[6]) for _, v in rows)
                  sector_tokens = collections.Counter()

                  for rn, v in rows:
                      for token in re.split(r'\s*[,.;]+\s*', clean(v[3])):
                          if token:
                              sector_tokens[token] += 1

                      bad = []
                      for key, ci in req.items():
                          if not clean(v[ci]):
                              bad.append(f'missing_{key}')

                      ident = clean(v[4]).replace(' ', '')
                      if ident and not ((ident.isdigit() and len(ident) == 11) or (len(ident) == 16 and ident.isalnum())):
                          bad.append('identifier_nonstandard')
                      if clean(v[6]):
                          bad.append('nonblank_outcome')

                      if bad:
                          anomaly_count_total += 1
                          if len(result['anomalies']) < 250:
                              result['anomalies'].append({'row': rn, 'flags': bad, 'values': [clean(x) for x in v]})

                  result['outcome_vocab'] = dict(outcome)
                  result['sector_tokens'] = dict(sector_tokens)
                  key_rows = [tuple(clean(x) for x in v[:7]) for _, v in rows]

              counts = collections.Counter(key_rows)
              duplicates = [k for k, c in counts.items() if c > 1]
              result['exact_duplicate_groups'] = len(duplicates)
              result['exact_duplicate_rows_beyond_first'] = sum(counts[k] - 1 for k in duplicates)
              result['missing_required'] = {
                  key: sum(not clean(v[ci]) for _, v in rows) for key, ci in req.items()
              }
              result['anomaly_count_total'] = anomaly_count_total
              report['sources'][population] = result

          os.makedirs('tmp', exist_ok=True)
          with open('tmp/catania_structural_audit.json', 'w', encoding='utf-8') as f:
              json.dump(report, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
      - name: Commit structural audit checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/catania_structural_audit.json
          git commit -m 'Checkpoint Catania structural audit'
          git push origin HEAD:expansion/catania-2026-09-12
