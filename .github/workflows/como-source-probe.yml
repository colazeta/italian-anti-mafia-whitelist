name: Como source probe

on:
  push:
    branches:
      - expansion/como-2026-09-17
    paths:
      - .github/workflows/como-source-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and inspect official Como HTML twice
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          import time
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.request import Request, urlopen

          urls = {
              "listed": "https://prefettura.interno.gov.it/it/prefetture/como/elenco-ditte-iscritte-white-list",
              "applicants": "https://prefettura.interno.gov.it/it/prefetture/como/elenco-ditte-fase-iscrizione-white-list",
          }
          out = Path("como-source-probe")
          out.mkdir(exist_ok=True)

          class Tables(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.tables=[]; self.table=None; self.row=None; self.cell=None; self.depth=0
              def handle_starttag(self, tag, attrs):
                  tag=tag.casefold()
                  if tag == "table": self.table=[]
                  elif tag == "tr" and self.table is not None: self.row=[]
                  elif tag in {"td","th"} and self.row is not None:
                      if self.cell is None: self.cell=[]; self.depth=0
                      else: self.depth += 1
                  elif tag == "br" and self.cell is not None: self.cell.append(" ")
              def handle_data(self, data):
                  if self.cell is not None: self.cell.append(data)
              def handle_endtag(self, tag):
                  tag=tag.casefold()
                  if tag in {"td","th"} and self.cell is not None:
                      if self.depth: self.depth -= 1; return
                      self.row.append(" ".join("".join(self.cell).split())); self.cell=None
                  elif tag == "tr" and self.row is not None:
                      if any(self.row): self.table.append(self.row)
                      self.row=None
                  elif tag == "table" and self.table is not None:
                      if self.table: self.tables.append(self.table)
                      self.table=None

          def fetch(url):
              req=Request(url, headers={"User-Agent":"italian-anti-mafia-whitelist/0.1 (+source verification)","Accept":"text/html,*/*"})
              with urlopen(req, timeout=90) as response:
                  return response.read(), response.geturl(), response.headers.get("Last-Modified", "")

          result={}
          for key,url in urls.items():
              captures=[]
              for attempt in range(2):
                  body, final_url, last_modified = fetch(url)
                  sha=hashlib.sha256(body).hexdigest()
                  captures.append((body,sha,final_url,last_modified))
                  Path(out/f"{key}-{attempt+1}.html").write_bytes(body)
                  if attempt == 0: time.sleep(2)
              parser=Tables(); parser.feed(captures[0][0].decode("utf-8")); parser.close()
              table_summaries=[]
              for i, table in enumerate(parser.tables):
                  joined=" ".join(" ".join(r) for r in table[:8]).casefold()
                  table_summaries.append({"index":i,"rows":len(table),"head":table[:8]})
              text=re.sub(r"\s+", " ", captures[0][0].decode("utf-8"))
              result[key]={
                  "sha256_first":captures[0][1],
                  "sha256_second":captures[1][1],
                  "raw_stable":captures[0][1] == captures[1][1],
                  "bytes":len(captures[0][0]),
                  "final_url":captures[0][2],
                  "last_modified":captures[0][3],
                  "table_count":len(parser.tables),
                  "tables":table_summaries,
                  "has_prefettura_como":"PREFETTURA DI COMO" in text,
                  "has_listed_title":"ELENCO DEI FORNITORI, PRESTATORI DI SERVIZI ED ESECUTORI DI LAVORI NON SOGGETTI A TENTATIVO DI INFILTRAZIONE MAFIOSA" in text,
                  "has_applicant_title":"RICHIEDENTI" in text and "ISCRIZIONE" in text,
              }
          print(json.dumps(result, ensure_ascii=False, indent=2))
          Path(out/"probe.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: como-source-probe
          path: como-source-probe/
          if-no-files-found: error
          retention-days: 7
