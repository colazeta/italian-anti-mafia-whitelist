name: Trento national integration candidate

on:
  workflow_dispatch:
  push:
    branches:
      - expansion/trento-2026-09-14
    paths:
      - .github/workflows/trento-source-capture.yml
      - tmp/trento_integrate_candidate.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF and publication runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,database,storage,publication]'

      - name: Independently capture approved Trento sources
        shell: bash
        run: |
          set -euo pipefail
          listed='https://prefettura.interno.gov.it/sites/default/files/86/2026-09/imprese-iscritte-11-settembre-2026.pdf'
          applicants='https://prefettura.interno.gov.it/sites/default/files/86/2026-09/imprese-richiedenti-10-settembre-2026.pdf'

          fetch_twice() {
            local label="$1" url="$2" expected_bytes="$3" expected_sha="$4"
            for n in 1 2; do
              curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
                --user-agent 'italian-anti-mafia-whitelist/official-source-verification' \
                "$url" -o "${label}.${n}.pdf"
            done
            cmp "${label}.1.pdf" "${label}.2.pdf"
            test "$(head -c 5 "${label}.1.pdf")" = '%PDF-'
            test "$(wc -c < "${label}.1.pdf" | tr -d ' ')" = "$expected_bytes"
            test "$(sha256sum "${label}.1.pdf" | awk '{print $1}')" = "$expected_sha"
            cp "${label}.1.pdf" "${label}.pdf"
          }

          fetch_twice listed "$listed" 7663549 b831570c01220b8709ebf9c4dbdfe856aba37a21c46353cf7bc9eedb5965c8af
          fetch_twice applicants "$applicants" 384118 9f36797e3e11834c979f9b5f5d58d693e19fa2456c69ce5859628d4e56a056c0

      - name: Run Trento semantic tests
        run: python -m pytest -q tests/test_trento_parser_semantics.py

      - name: Validate complete Trento parser output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          from white_list_archive.parsers.trento_tables import parse_trento_applicants, parse_trento_listed

          authority = "Commissariato del Governo per la Provincia di Trento"
          listed_cfg = {
              "source_key": "trento-listed", "authority_key": "trento", "authority_name": authority,
              "register_key": "trento-ordinary", "register_name": "White List ordinaria",
              "population_scope": "listed", "reference_date": "2026-09-11",
              "source_page_url": "https://prefettura.interno.gov.it/it/prefetture/trento/white-list-elenco-imprese-iscritte",
              "resource_url": "https://prefettura.interno.gov.it/sites/default/files/86/2026-09/imprese-iscritte-11-settembre-2026.pdf",
              "sha256": "b831570c01220b8709ebf9c4dbdfe856aba37a21c46353cf7bc9eedb5965c8af",
          }
          applicant_cfg = {
              "source_key": "trento-applicants", "authority_key": "trento", "authority_name": authority,
              "register_key": "trento-ordinary", "register_name": "White List ordinaria",
              "population_scope": "applicant", "reference_date": "2026-09-10",
              "source_page_url": "https://prefettura.interno.gov.it/it/prefetture/trento/white-list-elenco-imprese-richiedenti",
              "resource_url": "https://prefettura.interno.gov.it/sites/default/files/86/2026-09/imprese-richiedenti-10-settembre-2026.pdf",
              "sha256": "9f36797e3e11834c979f9b5f5d58d693e19fa2456c69ce5859628d4e56a056c0",
          }
          listed = parse_trento_listed(Path('listed.pdf'), listed_cfg)
          applicants = parse_trento_applicants(Path('applicants.pdf'), applicant_cfg)
          records = listed.records + applicants.records
          assert len(listed.records) == 1366
          assert len(applicants.records) == 98
          assert len(records) == 1464
          assert len({r['record_locator'] for r in records}) == 1464
          assert Counter(r['source_status'] for r in listed.records) == Counter({'listed':699,'renewal_update_in_progress':667})
          assert Counter(r['source_status'] for r in applicants.records) == Counter({'pending':98})
          assert listed.diagnostics['section_rows'] == 3020
          assert listed.diagnostics['reviewed_continuations'] == 172
          assert applicants.diagnostics['reviewed_continuations'] == 17
          PY

      - name: Apply fail-closed Trento integration transaction
        run: |
          set -euo pipefail
          python tmp/trento_integrate_candidate.py
          python - <<'PY'
          from pathlib import Path
          p=Path('data/source_registry/verified_primary_pages.csv')
          old='trento,https://prefettura.interno.gov.it/it/prefetture/trento/evidenza/white-list,2026-09-06,verified'
          new='trento,https://prefettura.interno.gov.it/it/prefetture/trento/evidenza/white-list,2026-09-14,verified'
          text=p.read_text(encoding='utf-8')
          assert text.count(old)==1, 'Trento verified-page anchor drift'
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Run full repository tests
        run: python -m pytest -q

      - name: Build actual national candidate
        run: |
          set -euo pipefail
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/trento-national-sources \
            --registry-json public-site/data/registry.json \
            --registry-csv public-site/data/registry.csv \
            --prefectures-json public-site/data/prefectures.json \
            --prefectures-csv public-site/data/prefectures.csv
          python -m white_list_archive.publishing.public_artifact public-site

      - name: Validate national candidate denominators
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          reg=json.loads(Path('public-site/data/registry.json').read_text(encoding='utf-8'))
          pref=json.loads(Path('public-site/data/prefectures.json').read_text(encoding='utf-8'))
          assert reg['meta']['record_count']==42198
          assert reg['meta']['authority_count']==38
          assert reg['meta']['register_count']==39
          assert len(reg['records'])==42198
          trento=[r for r in reg['records'] if r['authority_key']=='trento']
          assert len(trento)==1464
          assert sum(r['source_key']=='trento-listed' for r in trento)==1366
          assert sum(r['source_key']=='trento-applicants' for r in trento)==98
          assert Counter(r['source_status'] for r in trento)==Counter({'listed':699,'pending':98,'renewal_update_in_progress':667})
          assert pref['meta']['published_count']==38
          assert pref['meta']['mapped_count']==44
          rows=[x for x in pref['prefectures'] if x['authority_key']=='trento']
          assert len(rows)==1 and rows[0]['mapped'] and rows[0]['published'] and rows[0]['series_count']==2
          PY

      - name: Check production-only transaction diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            data/source_registry/verified_primary_pages.csv \
            src/white_list_archive/publishing/public_national_registry.py \
            tests/public_portal_browser.cjs | sort)"
          test "$actual" = "$expected" || { echo 'Unexpected candidate diff:'; printf '%s\n' "$actual"; exit 1; }
          test ! -e tmp/trento_integrate_candidate.py~

      - name: Commit and push validated production integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            data/source_registry/verified_primary_pages.csv \
            src/white_list_archive/publishing/public_national_registry.py \
            tests/public_portal_browser.cjs
          git diff --cached --check
          git commit -m 'Integrate Trento public White List coverage'
          git push origin HEAD:expansion/trento-2026-09-14
