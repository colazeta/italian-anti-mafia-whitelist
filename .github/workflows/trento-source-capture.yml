name: Trento source capture

on:
  workflow_dispatch:
  push:
    branches:
      - expansion/trento-2026-09-14
    paths:
      - .github/workflows/trento-source-capture.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF inspection runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check pdfplumber

      - name: Independently capture official Trento sources
        shell: bash
        run: |
          set -euo pipefail
          listed='https://prefettura.interno.gov.it/sites/default/files/86/2026-09/imprese-iscritte-11-settembre-2026.pdf'
          applicants='https://prefettura.interno.gov.it/sites/default/files/86/2026-09/imprese-richiedenti-10-settembre-2026.pdf'

          fetch_twice() {
            local label="$1"
            local url="$2"
            for n in 1 2; do
              curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
                --user-agent 'italian-anti-mafia-whitelist/official-source-verification' \
                "$url" -o "${label}.${n}.pdf"
            done
            cmp "${label}.1.pdf" "${label}.2.pdf"
            test "$(head -c 5 "${label}.1.pdf")" = '%PDF-'
            cp "${label}.1.pdf" "${label}.pdf"
            echo "TRN_${label^^}_URL=$url"
            echo "TRN_${label^^}_BYTES=$(wc -c < "${label}.pdf" | tr -d ' ')"
            echo "TRN_${label^^}_SHA256=$(sha256sum "${label}.pdf" | awk '{print $1}')"
            echo "TRN_${label^^}_PAGES=$(pdfinfo "${label}.pdf" | awk '/^Pages:/ {print $2}')"
          }

          fetch_twice listed "$listed"
          fetch_twice applicants "$applicants"

      - name: Inspect textual structure
        shell: bash
        run: |
          set -euo pipefail
          for label in listed applicants; do
            pdftotext -layout "${label}.pdf" "${label}.txt"
            echo "===== ${label^^} TEXT METRICS ====="
            echo "LINES=$(wc -l < "${label}.txt" | tr -d ' ')"
            echo "FORM_FEEDS=$(python - "$label" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1] + '.txt').read_text(errors='replace')
          print(p.count('\f'))
          PY
          )"
            echo "===== ${label^^} FIRST 80 LINES ====="
            sed -n '1,80p' "${label}.txt"
            echo "===== ${label^^} LAST 80 LINES ====="
            tail -n 80 "${label}.txt"
          done

      - name: Audit pdfplumber table boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from collections import Counter, defaultdict
          from pathlib import Path
          import pdfplumber

          def clean(value):
              return re.sub(r"\s+", " ", value or "").strip()

          id_re = re.compile(r"^(?:\d{11}|[A-Z0-9]{16})$")
          date_re = re.compile(r"\b\d{1,2}[./-]\d{1,2}[./-]\d{4}\b")
          section_re = re.compile(r"\bSezione\s+([IVX]+)\b", re.I)

          for label in ("listed", "applicants"):
              physical = 0
              widths = Counter()
              table_counts = Counter()
              header_coords = []
              valid_id_rows = []
              dated_no_id = []
              other_nonempty = []
              section_first_pages = {}
              section_rows = Counter()
              current_section = None
              outcomes = Counter()
              groups = defaultdict(list)
              identifiers = Counter()

              with pdfplumber.open(Path(f"{label}.pdf")) as pdf:
                  for pno, page in enumerate(pdf.pages, 1):
                      text = page.extract_text() or ""
                      match = section_re.search(text)
                      if match:
                          sec = match.group(1).upper()
                          if sec not in section_first_pages:
                              section_first_pages[sec] = pno
                          current_section = sec
                      tables = page.find_tables()
                      table_counts[len(tables)] += 1
                      for tno, table in enumerate(tables, 1):
                          for rno, raw in enumerate(table.extract() or [], 1):
                              physical += 1
                              cells = tuple(clean(v) for v in (raw or []))
                              widths[len(cells)] += 1
                              if not any(cells):
                                  continue
                              first = cells[0].lower() if cells else ""
                              if "ragione" in first and ("social" in first or "sociale" in first):
                                  header_coords.append((pno, tno, rno))
                                  continue
                              identifier = re.sub(r"\s+", "", cells[3]).upper() if len(cells) > 3 else ""
                              has_id = bool(id_re.fullmatch(identifier))
                              has_date = bool(date_re.search(" ".join(cells)))
                              coord = (pno, tno, rno)
                              if has_id:
                                  valid_id_rows.append((coord, cells))
                                  identifiers[identifier] += 1
                                  if label == "listed" and len(cells) == 7:
                                      status = cells[6]
                                      outcomes[status] += 1
                                      key = (identifier, cells[4], cells[5], status)
                                      groups[key].append((coord, cells[0], current_section))
                                      if current_section:
                                          section_rows[current_section] += 1
                                  elif label == "applicants" and len(cells) == 7:
                                      outcomes[cells[6]] += 1
                              elif has_date:
                                  dated_no_id.append((coord, cells))
                              else:
                                  other_nonempty.append((coord, cells))

              print(f"===== TRN_{label.upper()}_PDFPLUMBER_AUDIT =====")
              print(f"PHYSICAL_ROWS={physical}")
              print(f"ROW_WIDTHS={dict(sorted(widths.items()))}")
              print(f"TABLE_COUNT_BY_PAGE={dict(sorted(table_counts.items()))}")
              print(f"HEADER_ROWS={len(header_coords)} FIRST={header_coords[:20]} LAST={header_coords[-10:]}")
              print(f"VALID_ID_ROWS={len(valid_id_rows)}")
              print(f"UNIQUE_VALID_IDENTIFIERS={len(identifiers)}")
              print(f"IDENTIFIER_OCCURRENCE_COUNTS={dict(Counter(identifiers.values()))}")
              print(f"DATED_ROWS_WITHOUT_STRICT_ID={len(dated_no_id)}")
              for item in dated_no_id[:40]:
                  print("DATED_NO_ID", item)
              print(f"OTHER_NONEMPTY_ROWS={len(other_nonempty)}")
              for item in other_nonempty[:30]:
                  print("OTHER", item)
              print(f"OUTCOME_TEXT_COUNTS={dict(outcomes)}")
              if label == "listed":
                  print(f"SECTION_FIRST_PAGES={section_first_pages}")
                  print(f"STRICT_ID_SECTION_ROWS={dict(section_rows)}")
                  print(f"EXACT_ID_DATE_STATUS_GROUPS={len(groups)}")
                  print(f"GROUP_OCCURRENCE_COUNTS={dict(Counter(len(v) for v in groups.values()))}")
                  conflict_ids = defaultdict(set)
                  for key in groups:
                      conflict_ids[key[0]].add(key[1:])
                  conflicts = {k: sorted(v) for k, v in conflict_ids.items() if len(v) > 1}
                  print(f"IDENTIFIERS_WITH_MULTIPLE_DATE_STATUS_GROUPS={len(conflicts)}")
                  for key in sorted(conflicts)[:50]:
                      print("CONFLICT", key, conflicts[key])
              print("FIRST_VALID_ID_ROWS")
              for item in valid_id_rows[:5]:
                  print(item)
              print("LAST_VALID_ID_ROWS")
              for item in valid_id_rows[-5:]:
                  print(item)
          PY

      - name: Record page-level text fingerprints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          for label in ('listed', 'applicants'):
              text = Path(f'{label}.txt').read_text(errors='replace')
              pages = text.split('\f')
              if pages and not pages[-1].strip():
                  pages.pop()
              print(f'TRN_{label.upper()}_TEXT_PAGES={len(pages)}')
              for idx in sorted(set([0, 1, max(0, len(pages)//2), max(0, len(pages)-2), max(0, len(pages)-1)])):
                  if idx >= len(pages):
                      continue
                  norm = '\n'.join(line.rstrip() for line in pages[idx].splitlines()).strip()
                  digest = hashlib.sha256(norm.encode()).hexdigest()
                  print(f'TRN_{label.upper()}_PAGE_{idx+1}_TEXT_SHA256={digest}')
                  print(f'TRN_{label.upper()}_PAGE_{idx+1}_NONEMPTY_LINES={sum(bool(x.strip()) for x in pages[idx].splitlines())}')
          PY
