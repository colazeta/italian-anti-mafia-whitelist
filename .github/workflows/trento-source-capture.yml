name: Trento parser validation

on:
  workflow_dispatch:
  push:
    branches:
      - expansion/trento-2026-09-14
    paths:
      - .github/workflows/trento-source-capture.yml
      - src/white_list_archive/parsers/trento_tables.py
      - tests/test_trento_parser_semantics.py
      - docs/sources/trento-operational-check-2026-09-14.md

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Independently capture approved Trento sources
        shell: bash
        run: |
          set -euo pipefail
          listed='https://prefettura.interno.gov.it/sites/default/files/86/2026-09/imprese-iscritte-11-settembre-2026.pdf'
          applicants='https://prefettura.interno.gov.it/sites/default/files/86/2026-09/imprese-richiedenti-10-settembre-2026.pdf'

          fetch_twice() {
            local label="$1" url="$2" expected_bytes="$3" expected_sha="$4"
            for n in 1 2; do
              curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
                --user-agent 'italian-anti-mafia-whitelist/official-source-verification' \
                "$url" -o "${label}.${n}.pdf"
            done
            cmp "${label}.1.pdf" "${label}.2.pdf"
            test "$(head -c 5 "${label}.1.pdf")" = '%PDF-'
            test "$(wc -c < "${label}.1.pdf" | tr -d ' ')" = "$expected_bytes"
            test "$(sha256sum "${label}.1.pdf" | awk '{print $1}')" = "$expected_sha"
            cp "${label}.1.pdf" "${label}.pdf"
          }

          fetch_twice listed \
            "$listed" \
            7663549 \
            b831570c01220b8709ebf9c4dbdfe856aba37a21c46353cf7bc9eedb5965c8af
          fetch_twice applicants \
            "$applicants" \
            384118 \
            9f36797e3e11834c979f9b5f5d58d693e19fa2456c69ce5859628d4e56a056c0

      - name: Run Trento semantic tests
        run: python -m pytest -q tests/test_trento_parser_semantics.py

      - name: Validate complete Trento parser output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter
          from pathlib import Path

          from white_list_archive.parsers.trento_tables import (
              parse_trento_applicants,
              parse_trento_listed,
          )

          authority = "Commissariato del Governo per la Provincia di Trento"
          listed_cfg = {
              "source_key": "trento-listed",
              "authority_key": "trento",
              "authority_name": authority,
              "register_key": "trento-white-list",
              "register_name": "White List - Trento",
              "population_scope": "listed",
              "reference_date": "2026-09-11",
              "source_page_url": "https://prefettura.interno.gov.it/it/prefetture/trento/white-list-elenco-imprese-iscritte",
              "resource_url": "https://prefettura.interno.gov.it/sites/default/files/86/2026-09/imprese-iscritte-11-settembre-2026.pdf",
              "sha256": "b831570c01220b8709ebf9c4dbdfe856aba37a21c46353cf7bc9eedb5965c8af",
          }
          applicant_cfg = {
              "source_key": "trento-applicants",
              "authority_key": "trento",
              "authority_name": authority,
              "register_key": "trento-white-list",
              "register_name": "White List - Trento",
              "population_scope": "applicant",
              "reference_date": "2026-09-10",
              "source_page_url": "https://prefettura.interno.gov.it/it/prefetture/trento/white-list-elenco-imprese-richiedenti",
              "resource_url": "https://prefettura.interno.gov.it/sites/default/files/86/2026-09/imprese-richiedenti-10-settembre-2026.pdf",
              "sha256": "9f36797e3e11834c979f9b5f5d58d693e19fa2456c69ce5859628d4e56a056c0",
          }

          listed = parse_trento_listed(Path("listed.pdf"), listed_cfg)
          applicants = parse_trento_applicants(Path("applicants.pdf"), applicant_cfg)
          records = listed.records + applicants.records

          assert len(listed.records) == 1366, len(listed.records)
          assert len(applicants.records) == 98, len(applicants.records)
          assert len(records) == 1464, len(records)
          assert len({record["record_locator"] for record in records}) == 1464
          assert Counter(record["source_status"] for record in listed.records) == Counter(
              {"listed": 699, "renewal_update_in_progress": 667}
          )
          assert Counter(record["source_status"] for record in applicants.records) == Counter(
              {"pending": 98}
          )
          assert listed.diagnostics["section_rows"] == 3020
          assert listed.diagnostics["reviewed_continuations"] == 172
          assert listed.diagnostics["reviewed_date_exceptions"] == 1
          assert listed.diagnostics["reviewed_identifier_exceptions"] == 4
          assert applicants.diagnostics["reviewed_continuations"] == 17
          assert applicants.diagnostics["reviewed_date_exceptions"] == 1

          malformed = [
              record
              for record in listed.records
              if record["name"] == "BUTTERINI PIETRO TRASPORTI S.R.L."
          ]
          assert len(malformed) == 1
          assert malformed[0]["identifiers"] == []

          mixed = [
              record
              for record in applicants.records
              if record["name"] == "ROMANI DE MOLL S.R.L. IMPRESA SOCIALE"
          ]
          assert len(mixed) == 1
          assert mixed[0]["application_date"] == "2026-06-29"
          assert mixed[0]["source_fields"]["integration_date_raw"] == "02.07.2026"

          print("TRN_LISTED_PUBLIC_RECORDS=1366")
          print("TRN_APPLICANT_PUBLIC_RECORDS=98")
          print("TRN_TOTAL_PUBLIC_RECORDS=1464")
          print("TRN_LISTED_STATUS_COUNTS=" + repr(listed.diagnostics["status_counts"]))
          print("TRN_APPLICANT_STATUS_COUNTS=" + repr(applicants.diagnostics["status_counts"]))
          PY
