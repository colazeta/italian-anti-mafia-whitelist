name: Bari date audit 2026-09-10

on:
  push:
    branches: [expansion/bari-source-audit-2026-09-10-v2]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Enumerate every non-ISO-valid Bari date token
        shell: bash
        run: |
          python -m pip install -q pdfplumber
          python - <<'PY'
          import hashlib, json, re, tempfile
          from datetime import date
          from urllib.request import Request, urlopen
          import pdfplumber

          SOURCES={
            'listed':('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/whitelist_elenco-societa-iscritte_permanenza_31-08-2026.pdf','a28fe31e102e601ea0253c3fc93c559c3f964dd28d5cfa55c64e9c309a5517d9',[16,17]),
            'applicants':('https://prefettura.interno.gov.it/sites/default/files/0/2026-08/whitelist_elenco-richieste-iscrizione_31-08-2026.pdf','9164ec87debb629291415f0eaf125ee35fd191775466b3582e9e34dea78cf36d',[16]),
          }
          valid_shape=re.compile(r'^(\d{2})/(\d{2})/(\d{4})$')
          clean=lambda v:' '.join(str(v or '').replace('\u00a0',' ').split())
          for kind,(url,expected_sha,cols) in SOURCES.items():
            req=Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelistArchive/1.0; source-date-audit)'})
            with urlopen(req,timeout=90) as response: data=response.read()
            sha=hashlib.sha256(data).hexdigest(); print(kind.upper()+'_SHA256='+sha); assert sha==expected_sha
            malformed=[]; calendar_invalid=[]; blanks=0; total=0
            with tempfile.NamedTemporaryFile(suffix='.pdf') as f:
              f.write(data); f.flush()
              with pdfplumber.open(f.name) as pdf:
                for pno,page in enumerate(pdf.pages,1):
                  table=page.find_tables(); assert len(table)==1
                  rows=[[clean(c) for c in r] for r in table[0].extract()[1:] if any(clean(c) for c in r)][2:]
                  for rno,row in enumerate(rows,1):
                    for col in cols:
                      total+=1; value=clean(row[col])
                      if not value: blanks+=1; continue
                      m=valid_shape.fullmatch(value)
                      context={'page':pno,'row':rno,'col':col,'value':value,'name':row[0],'identifier':row[4]}
                      if not m:
                        malformed.append(context); continue
                      d,mn,y=map(int,m.groups())
                      try: date(y,mn,d)
                      except ValueError: calendar_invalid.append(context)
            print(kind.upper()+'_DATE_TOTAL='+str(total))
            print(kind.upper()+'_BLANK_DATES='+str(blanks))
            print(kind.upper()+'_MALFORMED='+json.dumps(malformed,ensure_ascii=False))
            print(kind.upper()+'_CALENDAR_INVALID='+json.dumps(calendar_invalid,ensure_ascii=False))
          PY