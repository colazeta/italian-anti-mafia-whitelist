name: Bari structure audit 2026-09-10

on:
  push:
    branches:
      - expansion/bari-source-audit-2026-09-10-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect split-row geometry and current source identity
        shell: bash
        run: |
          python -m pip install -q requests beautifulsoup4 pdfplumber
          python - <<'PY'
          import hashlib, json, re, tempfile
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import pdfplumber, requests
          from bs4 import BeautifulSoup

          PAGE='https://prefettura.interno.gov.it/it/prefetture/bari/evidenza/white-list'
          EXPECTED={
            'listed':'a28fe31e102e601ea0253c3fc93c559c3f964dd28d5cfa55c64e9c309a5517d9',
            'applicants':'9164ec87debb629291415f0eaf125ee35fd191775466b3582e9e34dea78cf36d',
          }
          TARGETS={
            'listed': {7:[22],19:[14,15],23:[31],27:[9,35],28:[12,17,23]},
            'applicants': {1:[4],13:[41],14:[8,9,10]},
          }
          H={'User-Agent':'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelistArchive/1.0; evidence-source-check)'}
          def clean(v): return ' '.join(str(v or '').replace('\u00a0',' ').split())
          def compact_row(row): return [clean(c) for c in row]
          s=requests.Session(); r=s.get(PAGE,headers=H,timeout=45); r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          selected={'listed':[],'applicants':[]}
          for a in soup.find_all('a',href=True):
              href=urljoin(PAGE,a['href']); label=clean(' '.join(a.stripped_strings)); text=(label+' '+Path(urlparse(href).path).name).casefold()
              if not href.lower().endswith('.pdf'): continue
              if 'richiest' in text or 'richiedent' in text: selected['applicants'].append((label,href))
              elif 'societ' in text and 'iscritt' in text: selected['listed'].append((label,href))
          print('LANDING_STATUS='+str(r.status_code))
          for kind in ('listed','applicants'):
              if len(selected[kind]) != 1: raise SystemExit(f'{kind}: source selection drift {selected[kind]!r}')
              label,url=selected[kind][0]
              data=s.get(url,headers=H,timeout=90).content
              sha=hashlib.sha256(data).hexdigest()
              print(f'{kind.upper()}_LABEL={label}')
              print(f'{kind.upper()}_URL={url}')
              print(f'{kind.upper()}_SHA256={sha}')
              if sha != EXPECTED[kind]: raise SystemExit(f'{kind}: byte drift {sha}')
              with tempfile.NamedTemporaryFile(suffix='.pdf') as f:
                  f.write(data); f.flush()
                  with pdfplumber.open(f.name) as pdf:
                      print(f'{kind.upper()}_PAGES={len(pdf.pages)}')
                      for pno, indexes in TARGETS[kind].items():
                          page=pdf.pages[pno-1]
                          tables=page.find_tables()
                          if len(tables)!=1: raise SystemExit(f'{kind} page {pno}: {len(tables)} tables')
                          table=tables[0]
                          extracted=table.extract()
                          print(f'BEGIN_{kind.upper()}_PAGE_{pno}_CONTEXT')
                          lo=max(0,min(indexes)-4); hi=min(len(extracted),max(indexes)+5)
                          for ridx in range(lo,hi):
                              vals=compact_row(extracted[ridx])
                              marker='TARGET' if ridx in indexes else 'CTX'
                              print(marker+f'_ROW_{ridx}='+json.dumps(vals,ensure_ascii=False))
                          # Inspect text physically assigned to target table-row bands and the small band immediately above.
                          words=page.extract_words(x_tolerance=1,y_tolerance=1,keep_blank_chars=False)
                          for ridx in indexes:
                              rowobj=table.rows[ridx]
                              cells=[c for c in rowobj.cells if c]
                              if not cells: continue
                              top=min(c[1] for c in cells); bottom=max(c[3] for c in cells)
                              def words_in(a,b):
                                  selected_words=[w for w in words if a <= (float(w['top'])+float(w['bottom']))/2 < b]
                                  return ' '.join(w['text'] for w in sorted(selected_words,key=lambda w:(round(float(w['top']),1),float(w['x0']))))
                              print(f'ROW_BAND_{kind}_{pno}_{ridx}='+json.dumps({'top':top,'bottom':bottom,'text':words_in(top,bottom),'above_14pt':words_in(max(0,top-14),top)},ensure_ascii=False))
                          print(f'END_{kind.upper()}_PAGE_{pno}_CONTEXT')
          PY