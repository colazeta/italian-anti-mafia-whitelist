name: Bari applicant sector inspection 2026-09-10

on:
  push:
    branches: [expansion/bari-source-audit-2026-09-10-v2]

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect Bari applicant sector anomaly'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect exact source geometry
        shell: bash
        run: |
          python -m pip install -q pdfplumber
          python - <<'PY'
          import hashlib, json, tempfile
          from urllib.request import Request, urlopen
          import pdfplumber

          URL='https://prefettura.interno.gov.it/sites/default/files/0/2026-08/whitelist_elenco-richieste-iscrizione_31-08-2026.pdf'
          SHA='9164ec87debb629291415f0eaf125ee35fd191775466b3582e9e34dea78cf36d'
          req=Request(URL,headers={'User-Agent':'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelistArchive/1.0; exact-row-inspection)'})
          with urlopen(req,timeout=90) as response: data=response.read()
          observed=hashlib.sha256(data).hexdigest(); print('SHA256',observed); assert observed==SHA
          clean=lambda v:' '.join(str(v or '').replace('\u00a0',' ').split())
          with tempfile.NamedTemporaryFile(suffix='.pdf') as f:
            f.write(data); f.flush()
            with pdfplumber.open(f.name) as pdf:
              page=pdf.pages[7]
              tables=page.find_tables(); assert len(tables)==1
              table=tables[0]
              extracted=table.extract()
              nonempty=[([clean(c) for c in row], idx) for idx,row in enumerate(extracted[1:], start=1) if any(clean(c) for c in row)]
              print('NONEMPTY_AFTER_OUTER_HEADER',len(nonempty))
              for logical_idx in range(27,32):
                raw_index=logical_idx+2
                row, original_index=nonempty[raw_index-1]
                print('COMPANY_LOGICAL_ROW',logical_idx,'ORIGINAL_TABLE_ROW_INDEX',original_index,'CELLS',json.dumps(row,ensure_ascii=False))
              target_company=29
              target_nonempty_index=target_company+1  # two administrative rows occupy nonempty indices 0,1
              target_row, original_index=nonempty[target_nonempty_index]
              print('TARGET_ROW',json.dumps(target_row,ensure_ascii=False))
              print('TARGET_ORIGINAL_INDEX',original_index)
              # pdfplumber table.rows indexes the full extracted table including the first outer row.
              geom=table.rows[original_index].cells
              bboxes=[cell for cell in geom if cell is not None]
              print('TARGET_CELL_BBOXES',json.dumps(bboxes))
              tops=[b[1] for b in bboxes]; bottoms=[b[3] for b in bboxes]
              band=(min(b[0] for b in bboxes),min(tops)-1,max(b[2] for b in bboxes),max(bottoms)+1)
              words=page.crop(band).extract_words(x_tolerance=1,y_tolerance=1,keep_blank_chars=False)
              print('TARGET_BAND',band)
              print('TARGET_WORDS',json.dumps(words,ensure_ascii=False))
              # Print sector-column x ranges and words falling in them.
              sector_cells=geom[6:16]
              for i,cell in enumerate(sector_cells,1):
                print('SECTOR',i,'BBOX',cell)
          PY
