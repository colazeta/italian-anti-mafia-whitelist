name: Brescia parser validation v2

on:
  push:
    branches:
      - expansion/brescia-2026-09-12
    paths:
      - .github/workflows/brescia-parser-validation-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/brescia-2026-09-12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile reviewed workbook sheet order
        run: |
          python - <<'PY'
          from pathlib import Path

          parser = Path('src/white_list_archive/parsers/brescia_openxml.py')
          text = parser.read_text(encoding='utf-8')
          old = '_EXPECTED_SHEETS = ["Foglio1", "Foglio3", "Foglio2"]'
          new = '_EXPECTED_LISTED_SHEETS = ["Foglio1", "Foglio3", "Foglio2"]\n_EXPECTED_APPLICANT_SHEETS = ["Foglio1", "Foglio2", "Foglio3"]'
          if old not in text:
              raise SystemExit('Expected Brescia sheet-order constant not found')
          text = text.replace(old, new, 1)
          marker = 'def parse_brescia_applicants('
          head, tail = text.split(marker, 1)
          listed_refs = head.count('_EXPECTED_SHEETS')
          applicant_refs = tail.count('_EXPECTED_SHEETS')
          if listed_refs != 2 or applicant_refs != 2:
              raise SystemExit('Unexpected sheet-order reference counts: listed=%d applicant=%d' % (listed_refs, applicant_refs))
          head = head.replace('_EXPECTED_SHEETS', '_EXPECTED_LISTED_SHEETS')
          tail = tail.replace('_EXPECTED_SHEETS', '_EXPECTED_APPLICANT_SHEETS')
          parser.write_text(head + marker + tail, encoding='utf-8')

          test = Path('tests/test_brescia_parser_semantics.py')
          t = test.read_text(encoding='utf-8')
          old_helper = '''def _workbook() -> tuple[openpyxl.Workbook, openpyxl.worksheet.worksheet.Worksheet]:
    workbook = openpyxl.Workbook()
    ws = workbook.active
    ws.title = "Foglio1"
    workbook.create_sheet("Foglio3")
    workbook.create_sheet("Foglio2")
    return workbook, ws
'''
          new_helper = '''def _workbook(*, applicant: bool = False) -> tuple[openpyxl.Workbook, openpyxl.worksheet.worksheet.Worksheet]:
    workbook = openpyxl.Workbook()
    ws = workbook.active
    ws.title = "Foglio1"
    if applicant:
        workbook.create_sheet("Foglio2")
        workbook.create_sheet("Foglio3")
    else:
        workbook.create_sheet("Foglio3")
        workbook.create_sheet("Foglio2")
    return workbook, ws
'''
          if old_helper not in t:
              raise SystemExit('Expected synthetic workbook helper not found')
          t = t.replace(old_helper, new_helper, 1)
          needle = 'path = tmp_path / "applicants.xlsx"\n    workbook, ws = _workbook()'
          if needle not in t:
              raise SystemExit('Expected applicant fixture call not found')
          t = t.replace(needle, 'path = tmp_path / "applicants.xlsx"\n    workbook, ws = _workbook(applicant=True)', 1)
          test.write_text(t, encoding='utf-8')
          PY
      - name: Install parser validation runtime
        run: python -m pip install --disable-pip-version-check -e '.[dev,publication]'
      - name: Validate parser against byte-pinned official sources
        env:
          LISTED_URL: https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco-ditte-iscritte-10-settembre-2026.xlsx
          APPLICANT_URL: https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco-ditte-richiedenti-l-iscrizione-10-settembre-2026.xlsx
          LISTED_SHA: 509e6724de2d4d63f403e254236ec2c5b77077d676ee8c17382464d5c9da07a7
          APPLICANT_SHA: 0ab15af0f0f2838aa162177cbc07b91f3d7d80b561ca490611b8ec368c595f34
        run: |
          python - <<'PY'
          import hashlib, json, os, tempfile
          from pathlib import Path
          from urllib.request import Request, urlopen
          from white_list_archive.parsers.brescia_openxml import parse_brescia_applicants, parse_brescia_listed

          def download(url, expected, path):
              req = Request(url, headers={'User-Agent': 'italian-anti-mafia-whitelist/parser-validation'})
              with urlopen(req, timeout=90) as response:
                  body = response.read()
              actual = hashlib.sha256(body).hexdigest()
              if actual != expected:
                  raise SystemExit('SHA drift: %s != %s' % (actual, expected))
              path.write_bytes(body)

          def cfg(parser, source_key, scope, resource_url, sha):
              return {
                  'parser': parser, 'source_key': source_key,
                  'authority_key': 'brescia', 'authority_name': 'Prefettura di Brescia',
                  'register_key': 'brescia-ordinary', 'register_name': 'White List ordinaria',
                  'population_scope': scope, 'reference_date': '2026-09-10',
                  'source_page_url': 'https://prefettura.interno.gov.it/it/prefetture/brescia/evidenza/white-list',
                  'resource_url': resource_url, 'sha256': sha,
              }

          with tempfile.TemporaryDirectory() as td:
              lp = Path(td) / 'listed.xlsx'; ap = Path(td) / 'applicants.xlsx'
              download(os.environ['LISTED_URL'], os.environ['LISTED_SHA'], lp)
              download(os.environ['APPLICANT_URL'], os.environ['APPLICANT_SHA'], ap)
              listed = parse_brescia_listed(lp, cfg('brescia_listed','brescia-listed','listed',os.environ['LISTED_URL'],os.environ['LISTED_SHA']))
              applicants = parse_brescia_applicants(ap, cfg('brescia_applicants','brescia-applicants','applicant',os.environ['APPLICANT_URL'],os.environ['APPLICANT_SHA']))
              assert listed.diagnostics['sector_rows'] == 3308, listed.diagnostics
              assert listed.diagnostics['public_records'] == 2032, listed.diagnostics
              assert listed.diagnostics['status_counts'] == {'listed': 1820, 'renewal_update_in_progress': 212}, listed.diagnostics
              assert listed.diagnostics['peer_resolved_date_rows'] == 2, listed.diagnostics
              assert listed.diagnostics['reviewed_structural_shift_rows'] == 1, listed.diagnostics
              assert applicants.diagnostics['source_rows'] == 1264, applicants.diagnostics
              assert applicants.diagnostics['public_records'] == 1263, applicants.diagnostics
              assert applicants.diagnostics['status_counts'] == {'pending': 1263}, applicants.diagnostics
              assert applicants.diagnostics['missing_application_dates'] == 841, applicants.diagnostics
              assert applicants.diagnostics['malformed_application_dates'] == 1, applicants.diagnostics
              assert applicants.diagnostics['duplicate_exact_groups'] == 1, applicants.diagnostics
              assert len(listed.records) + len(applicants.records) == 3295
              print(json.dumps({'listed': listed.diagnostics, 'applicants': applicants.diagnostics, 'total_records': 3295}, ensure_ascii=False, indent=2))
          PY
      - name: Run Brescia semantic tests
        run: python -m pytest -q tests/test_brescia_parser_semantics.py
      - name: Commit validated parser reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/white_list_archive/parsers/brescia_openxml.py tests/test_brescia_parser_semantics.py
          if git diff --cached --quiet; then
            echo 'Parser reconciliation already materialised.'
          else
            git commit -m 'Validate Brescia parser against current sources'
            git push origin HEAD:expansion/brescia-2026-09-12
          fi
