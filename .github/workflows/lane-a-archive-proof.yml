name: Lane A protected archive proof

# One-shot operational proof for issue #163. This workflow has no schedule and no
# workflow_dispatch entry point. It runs on main only when this file itself changes,
# so adding or correcting it exercises the approved protected archive boundary without
# altering any recurring acquisition/publication schedule.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/lane-a-archive-proof.yml

permissions:
  contents: read

jobs:
  archive-potenza:
    name: Archive mutable Potenza source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: evidence-archive
    env:
      EVIDENCE_BUCKET: ${{ vars.EVIDENCE_BUCKET }}
      EVIDENCE_ENDPOINT: ${{ vars.EVIDENCE_ENDPOINT }}
      EVIDENCE_REGION: ${{ vars.EVIDENCE_REGION }}
      EVIDENCE_POLICY_EVIDENCE: ${{ vars.EVIDENCE_POLICY_EVIDENCE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.EVIDENCE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.EVIDENCE_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.EVIDENCE_SESSION_TOKEN }}
      EVIDENCE_DATABASE_URL: ${{ secrets.EVIDENCE_DATABASE_URL }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install archive runtime
        run: python -m pip install -e '.[storage,database]'
      - name: Require approved private store
        run: |
          python - <<'PY'
          import os
          from white_list_archive.storage.evidence import StoreConfig
          StoreConfig.from_env()
          required = ('AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Required protected evidence-store configuration is unavailable')
          if not os.environ.get('EVIDENCE_DATABASE_URL'):
              print('Relational writer is unavailable; preserve durable bytes and capture provenance, then report persistence debt.')
          PY
      - name: Capture Potenza bytes before downstream interpretation
        run: |
          set -euo pipefail
          mkdir -p /tmp/archive-first /tmp/public-actions
          python -m white_list_archive.acquisition.archive_first \
            --source-key potenza-combined \
            --resource-url 'https://www.utgpotenza.it/_whitelist.php' \
            --origin-type official_current \
            --authority-rank-code primary_official \
            --resource-type-code html \
            --authority-registry data/source_registry/territorial_authorities.csv \
            --series-registry data/source_registry/source_series_inventory.csv \
            --work-dir /tmp/archive-first \
            --public-receipt /tmp/public-actions/archive-receipt.json
      - name: Verify Potenza durable readback and production capture persistence
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/public-actions/archive-receipt.json')
          if not path.exists():
              raise SystemExit('No redacted checkpoint exists: durable archive boundary was not reached')
          receipt = json.loads(path.read_text())
          print(json.dumps(receipt, sort_keys=True))
          if not receipt.get('durable_content_readback_verified'):
              raise SystemExit('ContentObject provider readback was not verified')
          if not receipt.get('durable_capture_provenance_readback_verified'):
              raise SystemExit('Immutable capture-provenance provider readback was not verified')
          if receipt.get('database_capture_persistence_state') != 'persisted':
              raise SystemExit('Durable bytes were retained but production capture persistence remains debt')
          PY

  archive-pistoia:
    name: Archive independent Pistoia source
    needs: archive-potenza
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: evidence-archive
    env:
      EVIDENCE_BUCKET: ${{ vars.EVIDENCE_BUCKET }}
      EVIDENCE_ENDPOINT: ${{ vars.EVIDENCE_ENDPOINT }}
      EVIDENCE_REGION: ${{ vars.EVIDENCE_REGION }}
      EVIDENCE_POLICY_EVIDENCE: ${{ vars.EVIDENCE_POLICY_EVIDENCE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.EVIDENCE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.EVIDENCE_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.EVIDENCE_SESSION_TOKEN }}
      EVIDENCE_DATABASE_URL: ${{ secrets.EVIDENCE_DATABASE_URL }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install archive runtime
        run: python -m pip install -e '.[storage,database]'
      - name: Require approved private store
        run: |
          python - <<'PY'
          import os
          from white_list_archive.storage.evidence import StoreConfig
          StoreConfig.from_env()
          required = ('AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Required protected evidence-store configuration is unavailable')
          if not os.environ.get('EVIDENCE_DATABASE_URL'):
              print('Relational writer is unavailable; preserve durable bytes and capture provenance, then report persistence debt.')
          PY
      - name: Capture Pistoia bytes before downstream interpretation
        run: |
          set -euo pipefail
          mkdir -p /tmp/archive-first /tmp/public-actions
          python -m white_list_archive.acquisition.archive_first \
            --source-key pistoia-listed \
            --resource-url 'https://prefettura.interno.gov.it/it/prefetture/pistoia/white-list-elenco-imprese-iscritte' \
            --origin-type official_current \
            --authority-rank-code primary_official \
            --resource-type-code html \
            --authority-registry data/source_registry/territorial_authorities.csv \
            --series-registry data/source_registry/source_series_inventory.csv \
            --work-dir /tmp/archive-first \
            --public-receipt /tmp/public-actions/archive-receipt.json
      - name: Verify Pistoia durable readback and production capture persistence
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/public-actions/archive-receipt.json')
          if not path.exists():
              raise SystemExit('No redacted checkpoint exists: durable archive boundary was not reached')
          receipt = json.loads(path.read_text())
          print(json.dumps(receipt, sort_keys=True))
          if not receipt.get('durable_content_readback_verified'):
              raise SystemExit('ContentObject provider readback was not verified')
          if not receipt.get('durable_capture_provenance_readback_verified'):
              raise SystemExit('Immutable capture-provenance provider readback was not verified')
          if receipt.get('database_capture_persistence_state') != 'persisted':
              raise SystemExit('Durable bytes were retained but production capture persistence remains debt')
          PY

# No source bytes, frozen manifests, storage coordinates or working data are uploaded
# as Actions artefacts. Durable originals and immutable capture provenance remain only
# in the approved private evidence backend/catalogue; the workflow log receives the
# existing redacted public receipt.
