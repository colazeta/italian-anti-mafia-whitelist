name: Temporary Chieti source discovery

on:
  push:
    branches:
      - expansion/chieti-2026-09-18
    paths:
      - '.github/workflows/chieti-source-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact expansion branch
        uses: actions/checkout@v4
        with:
          ref: expansion/chieti-2026-09-18
      - name: Install PDF inspection runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Resolve and inspect official Chieti source resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/chieti
          UA='Mozilla/5.0 (compatible; italian-anti-mafia-whitelist/1.0; Chieti source verification)'
          pages=(
            'https://prefettura.interno.gov.it/it/prefetture/chieti/evidenza/white-list'
            'https://prefettura.interno.gov.it/it/prefetture/chieti/white-list-albo-iscritti'
            'https://prefettura.interno.gov.it/it/prefetture/chieti/elenco-imprese-richiedenti-liscrizione-nelle-white-list'
          )
          i=0
          for url in "${pages[@]}"; do
            i=$((i+1))
            curl --fail --location --silent --show-error --retry 2 -A "$UA page-$i" \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$url" -o "/tmp/chieti/page-$i.html"
            echo "PAGE $i $url bytes=$(wc -c </tmp/chieti/page-$i.html) sha256=$(sha256sum /tmp/chieti/page-$i.html | cut -d' ' -f1)"
          done
          python - <<'PY' > /tmp/chieti/links.tsv
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin
          bases = [
              'https://prefettura.interno.gov.it/it/prefetture/chieti/evidenza/white-list',
              'https://prefettura.interno.gov.it/it/prefetture/chieti/white-list-albo-iscritti',
              'https://prefettura.interno.gov.it/it/prefetture/chieti/elenco-imprese-richiedenti-liscrizione-nelle-white-list',
          ]
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.href=None; self.text=[]; self.rows=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      self.href = dict(attrs).get('href'); self.text=[]
              def handle_data(self, data):
                  if self.href is not None: self.text.append(data)
              def handle_endtag(self, tag):
                  if tag == 'a' and self.href is not None:
                      self.rows.append((self.href, ' '.join(''.join(self.text).split())))
                      self.href=None; self.text=[]
          seen=set()
          for idx, base in enumerate(bases,1):
              p=P(); p.feed(Path(f'/tmp/chieti/page-{idx}.html').read_text(errors='replace'))
              for href,text in p.rows:
                  url=urljoin(base,href)
                  low=(url+' '+text).lower()
                  if ('/sites/default/files/' in url or url.lower().endswith(('.pdf','.xlsx','.xls','.csv'))) and url not in seen:
                      seen.add(url); print(f'{idx}\t{text}\t{url}')
          PY
          echo '--- attachment candidates ---'
          cat /tmp/chieti/links.tsv
          n=0
          while IFS=$'\t' read -r page label url; do
            n=$((n+1))
            out="/tmp/chieti/resource-$n"
            curl --fail --location --silent --show-error --retry 2 -A "$UA resource-$n" \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$url" -o "$out"
            echo "RESOURCE $n page=$page bytes=$(wc -c <"$out") sha256=$(sha256sum "$out" | cut -d' ' -f1)"
            echo "LABEL $label"
            echo "URL $url"
            file "$out"
            if pdfinfo "$out" >/tmp/chieti/pdfinfo-$n.txt 2>/dev/null; then
              grep -E '^(Pages|Page size|PDF version|Producer|Creator):' /tmp/chieti/pdfinfo-$n.txt || true
              pdftotext -f 1 -l 3 -layout "$out" "/tmp/chieti/sample-$n.txt" || true
              echo "--- PDF TEXT SAMPLE $n ---"
              sed -n '1,120p' "/tmp/chieti/sample-$n.txt" || true
            fi
          done < /tmp/chieti/links.tsv
      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: chieti-source-discovery
          path: /tmp/chieti
          retention-days: 1
          if-no-files-found: error
