name: Aosta source audit

on:
  push:
    branches:
      - expansion/aosta-source-audit-2026-09-10

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install audit runtime
        run: python -m pip install 'pdfplumber>=0.11,<0.12'
      - name: Inspect official Aosta White List resources
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          import time
          import urllib.request
          from collections import Counter
          from pathlib import Path
          import pdfplumber

          sources = {
              "listed": "https://www.regione.vda.it/allegato.aspx?pk=84307",
              "applicants": "https://www.regione.vda.it/allegato.aspx?pk=84309",
          }
          dmy = re.compile(r"^\d{1,2}/\d{1,2}/\d{4}$")
          ident = re.compile(r"(?:\b\d{11}\b|\b[A-Z0-9]{16}\b)", re.I)

          def clean(value):
              return " ".join(str(value or "").replace("\u00a0", " ").split())

          for key, url in sources.items():
              data = None
              last = None
              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "italian-anti-mafia-whitelist-source-audit/1.0"})
                      with urllib.request.urlopen(req, timeout=45) as resp:
                          data = resp.read()
                          content_type = resp.headers.get("content-type", "")
                      break
                  except Exception as exc:
                      last = exc
                      if attempt < 3:
                          time.sleep(attempt * 3)
              if data is None:
                  raise SystemExit(f"{key}: download failed after bounded retries: {last}")
              path = Path(f"/tmp/aosta-{key}.pdf")
              path.write_bytes(data)
              digest = hashlib.sha256(data).hexdigest()
              with pdfplumber.open(path) as pdf:
                  row_lengths = Counter()
                  nonempty_masks = Counter()
                  date_positions = Counter()
                  identifier_positions = Counter()
                  table_count = 0
                  candidate_headers = []
                  nonempty_rows = 0
                  data_rows = 0
                  status_categories = Counter()
                  listed_continuations = Counter()
                  applicant_date_index = Counter()
                  applicant_activity_index = Counter()
                  applicant_secondary_index = Counter()
                  for page in pdf.pages:
                      for table in page.extract_tables():
                          table_count += 1
                          previous = None
                          for raw in table:
                              row = [clean(cell) for cell in raw]
                              if not any(row):
                                  continue
                              nonempty_rows += 1
                              row_lengths[len(row)] += 1
                              mask = tuple(i for i, cell in enumerate(row) if cell)
                              nonempty_masks[mask] += 1
                              folded = " | ".join(row).casefold()
                              if "ragione sociale" in folded and len(candidate_headers) < 6:
                                  candidate_headers.append(row)
                              dpos = tuple(i for i, cell in enumerate(row) if dmy.fullmatch(cell))
                              ipos = tuple(i for i, cell in enumerate(row) if ident.search(cell))
                              if dpos:
                                  date_positions[dpos] += 1
                              if ipos:
                                  identifier_positions[ipos] += 1
                              if dpos and ipos and row[0] and "ragione sociale" not in row[0].casefold():
                                  data_rows += 1
                                  low = folded
                                  if "aggiornamento" in low or "rinnovo" in low:
                                      status_categories["renewal/update"] += 1
                                  elif "istruttoria" in low:
                                      status_categories["pending/instruction"] += 1
                                  elif any(token in low for token in ("negat", "dinieg", "rigett")):
                                      status_categories["negative"] += 1
                                  elif "iscritt" in low:
                                      status_categories["listed-word"] += 1
                                  else:
                                      status_categories["blank-or-other"] += 1
                              if key == "listed" and len(row) == 8 and dpos == (5, 6) and not ipos and not row[0]:
                                  listed_continuations["total"] += 1
                                  if previous and len(previous) == 8 and ident.search(previous[3] or ""):
                                      listed_continuations["after_identity_row"] += 1
                                      if previous[5] == row[5] and previous[6] == row[6]:
                                          listed_continuations["same_dates_as_previous"] += 1
                                      if row[2]:
                                          listed_continuations["secondary_office_only"] += 1
                                      if row[7]:
                                          listed_continuations["status_text_present"] += 1
                              if key == "applicants" and dpos and ipos and row[0]:
                                  applicant_date_index[dpos[0]] += 1
                                  iid = ipos[0]
                                  between = [i for i in range(iid + 1, dpos[0]) if row[i]]
                                  if between:
                                      applicant_activity_index[between[-1]] += 1
                                  if len(row) > 3 and row[3]:
                                      applicant_secondary_index[3] += 1
                              previous = row
                  print(json.dumps({
                      "source": key,
                      "url": url,
                      "sha256": digest,
                      "bytes": len(data),
                      "content_type": content_type,
                      "pages": len(pdf.pages),
                      "tables": table_count,
                      "nonempty_rows": nonempty_rows,
                      "row_lengths": dict(sorted(row_lengths.items())),
                      "common_nonempty_masks": [[list(mask), count] for mask, count in nonempty_masks.most_common(12)],
                      "date_positions": [[list(pos), count] for pos, count in date_positions.most_common(12)],
                      "identifier_positions": [[list(pos), count] for pos, count in identifier_positions.most_common(12)],
                      "candidate_headers": candidate_headers,
                      "data_rows_with_date_and_identifier": data_rows,
                      "status_categories": dict(status_categories),
                      "listed_continuations": dict(listed_continuations),
                      "applicant_date_index": dict(applicant_date_index),
                      "applicant_activity_index": dict(applicant_activity_index),
                      "applicant_secondary_index": dict(applicant_secondary_index),
                  }, ensure_ascii=False))
          PY
