name: Diagnose Aosta applicant row count

on:
  push:
    branches:
      - expansion/aosta-source-audit-2026-09-10

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/aosta-source-audit-2026-09-10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install parser runtime
        run: python -m pip install -e '.[publication]'
      - name: Inspect current official applicant table boundary
        run: |
          python .tmp/aosta_materialise.py
          python - <<'PY'
          from collections import Counter, defaultdict
          from pathlib import Path
          import hashlib, time, urllib.request
          import pdfplumber
          from white_list_archive.parsers.multi_prefecture_tables import _DMY_FLEX, _identifiers, _table_rows

          url='https://www.regione.vda.it/allegato.aspx?pk=84309'
          dest=Path('/tmp/aosta-applicants.pdf')
          last=None
          for attempt in range(1,4):
              try:
                  req=urllib.request.Request(url, headers={'User-Agent':'italian-anti-mafia-whitelist/0.1 source-verification'})
                  with urllib.request.urlopen(req, timeout=45) as r:
                      dest.write_bytes(r.read())
                  break
              except Exception as exc:
                  last=exc
                  if attempt==3: raise
                  time.sleep(attempt*2)
          sha=hashlib.sha256(dest.read_bytes()).hexdigest()
          print('sha256', sha)
          assert sha == '77d4abb04467d58af4a702e6fec291f19022adff96cfe87b3f88eb929a7f82cd', sha
          candidates=[]
          with pdfplumber.open(dest) as pdf:
              for page,row in _table_rows(pdf):
                  if len(row)==13 and _DMY_FLEX.fullmatch(row[9] or ''):
                      candidates.append((page.page_number, tuple(row)))
          print('candidate_count', len(candidates))
          counts=Counter(row for _,row in candidates)
          exact_dupes=[(row,n) for row,n in counts.items() if n>1]
          print('exact_duplicate_shapes', len(exact_dupes), 'duplicate_extra_rows', sum(n-1 for _,n in exact_dupes))
          for row,n in exact_dupes:
              pages=[p for p,r in candidates if r==row]
              print('EXACT_DUP', 'n=',n,'pages=',pages,'name=',row[0],'id=',row[5],'date=',row[9],'outcome=',row[12])
          id_missing=[]
          for idx,(page,row) in enumerate(candidates,1):
              if not _identifiers(row[5]):
                  id_missing.append((idx,page,row[0],row[5],row[9],row[12]))
          print('identifier_missing',len(id_missing))
          for item in id_missing:
              print('ID_MISSING',item)
          by_identity=defaultdict(list)
          for idx,(page,row) in enumerate(candidates,1):
              key=(row[0],row[5],row[9],row[12])
              by_identity[key].append((idx,page,row))
          identity_dupes=[(k,v) for k,v in by_identity.items() if len(v)>1]
          print('identity_duplicate_groups',len(identity_dupes),'identity_duplicate_extra_rows',sum(len(v)-1 for _,v in identity_dupes))
          for key,vals in identity_dupes:
              print('IDENTITY_DUP', 'key=',key, 'indexes_pages=',[(i,p) for i,p,_ in vals])
          print('outcomes', Counter(row[12] for _,row in candidates))
          PY
