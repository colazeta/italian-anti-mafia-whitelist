name: Diagnose Aosta applicant parser boundary

on:
  push:
    branches:
      - expansion/aosta-source-audit-2026-09-10

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/aosta-source-audit-2026-09-10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install parser runtime
        run: python -m pip install 'pdfplumber>=0.11,<0.12'
      - name: Diagnose current official applicant rows without row-level disclosure
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          import urllib.request
          from collections import Counter
          from pathlib import Path
          import pdfplumber

          url='https://www.regione.vda.it/allegato.aspx?pk=84309'
          req=urllib.request.Request(url,headers={'User-Agent':'italian-anti-mafia-whitelist-source-audit/1.0'})
          with urllib.request.urlopen(req,timeout=60) as resp:
              data=resp.read()
          expected='77d4abb04467d58af4a702e6fec291f19022adff96cfe87b3f88eb929a7f82cd'
          digest=hashlib.sha256(data).hexdigest()
          assert digest==expected,(digest,expected)
          path=Path('/tmp/aosta-applicants.pdf'); path.write_bytes(data)
          dmy=re.compile(r'^\d{1,2}/\d{1,2}/\d{4}$')
          canonical=re.compile(r'^(?:\d{11}|[A-Z0-9]{16})$',re.I)
          def clean(v): return ' '.join(str(v or '').replace('\u00a0',' ').split())
          candidates=[]
          with pdfplumber.open(path) as pdf:
              for page_no,page in enumerate(pdf.pages,1):
                  for table_no,table in enumerate(page.extract_tables(),1):
                      for row_no,raw in enumerate(table,1):
                          row=[clean(x) for x in raw]
                          if len(row)==13 and row[0] and row[5] and dmy.fullmatch(row[9] or ''):
                              candidates.append((page_no,table_no,row_no,row))
          shapes=Counter()
          outcomes=Counter()
          noncanonical=[]
          for page_no,table_no,row_no,row in candidates:
              ident=row[5].replace(' ','')
              if ident.isdigit(): shape=f'digits:{len(ident)}'
              elif ident.isalnum(): shape=f'alnum:{len(ident)}'
              else: shape='other'
              shapes[shape]+=1
              low=row[12].casefold()
              if 'istruttoria' in low: outcome='pending'
              elif 'iscritt' in low: outcome='listed'
              elif any(x in low for x in ('negat','dinieg','rigett')): outcome='negative'
              elif any(x in low for x in ('rinunc','cancell','revoc')): outcome='cancellation'
              elif row[12]: outcome='other_text'
              else: outcome='blank'
              outcomes[outcome]+=1
              if not canonical.fullmatch(ident):
                  noncanonical.append({'page':page_no,'table':table_no,'row':row_no,'identifier_shape':shape,'outcome_class':outcome,'application_date':row[9]})
          print(json.dumps({'sha256':digest,'candidate_rows':len(candidates),'identifier_shapes':dict(shapes),'outcome_classes':dict(outcomes),'noncanonical_candidate_count':len(noncanonical),'noncanonical_candidate_coordinates':noncanonical},ensure_ascii=False))
          PY
