name: Padova national integration candidate

on:
  push:
    branches:
      - expansion/padova-2026-09-14
    paths:
      - .github/workflows/padova-national-candidate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project
        run: python -m pip install -e '.[dev,publication]'
      - name: Apply fail-closed Padova integration transaction
        run: python tmp/padova_integrate_candidate.py
      - name: Run repository and Padova semantic tests
        run: pytest -q
      - name: Build actual national candidate
        run: |
          rm -rf /tmp/padova-public-national-sources /tmp/padova-public-site
          mkdir -p /tmp/padova-public-site/data
          cp -R public-site/. /tmp/padova-public-site/
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/padova-public-national-sources \
            --registry-json /tmp/padova-public-site/data/registry.json \
            --registry-csv /tmp/padova-public-site/data/registry.csv \
            --prefectures-json /tmp/padova-public-site/data/prefectures.json \
            --prefectures-csv /tmp/padova-public-site/data/prefectures.csv
      - name: Validate candidate denominators and source semantics
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root = Path('/tmp/padova-public-site/data')
          reg = json.loads((root/'registry.json').read_text(encoding='utf-8'))
          pref = json.loads((root/'prefectures.json').read_text(encoding='utf-8'))
          assert reg['meta']['record_count'] == len(reg['records']) == 38505
          assert reg['meta']['authority_count'] == 36
          assert reg['meta']['register_count'] == 37
          assert pref['meta']['published_count'] == 36
          assert pref['meta']['mapped_count'] == 43
          padova = [r for r in reg['records'] if r['authority_key'] == 'padova']
          assert len(padova) == 1005
          assert Counter(r['source_key'] for r in padova) == {'padova-listed': 831, 'padova-applicants': 174}
          assert Counter(r['source_status'] for r in padova) == {'listed': 581, 'renewal_update_in_progress': 250, 'pending': 174}
          assert len({r['record_locator'] for r in padova}) == 1005
          p = [x for x in pref['prefectures'] if x.get('authority_key') == 'padova']
          assert len(p) == 1 and p[0]['mapped'] and p[0]['published'] and p[0]['series_count'] == 2
          noncal = [r for r in padova if r['source_key'] == 'padova-listed' and r.get('source_fields', {}).get('expiry_date_raw_variants') in (['46581,00'], ['8807/2026'])]
          assert len(noncal) == 2 and all(r['observed_expiry_date'] == '' for r in noncal)
          recovered = [r for r in padova if r['source_key'] == 'padova-applicants' and r['name'] == 'NON SOLO ZANZARE SRL']
          assert len(recovered) == 1
          dup = [r for r in padova if r['source_key'] == 'padova-applicants' and r['name'] == 'CLEAN SRL' and r['identifier_field_raw'] == '02027230289' and r['application_date'] == '2026-01-14']
          assert len(dup) == 2 and dup[0]['record_locator'] != dup[1]['record_locator']
          print('PADOVA_NATIONAL_CANDIDATE', len(padova), reg['meta']['record_count'], reg['meta']['authority_count'], reg['meta']['register_count'], pref['meta']['mapped_count'])
          PY
      - name: Validate recursively closed public artifact
        run: python -m white_list_archive.publishing.public_artifact /tmp/padova-public-site
      - name: Check production-only transaction diff
        run: |
          git diff --check
          git status --short
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/public-pages.yml',
              'data/monitoring/national_coverage.json',
              'data/publication/multi_prefecture_pilot.json',
              'data/source_registry/source_series_inventory.csv',
              'docs/sources/padova-operational-check-2026-09-14.md',
              'src/white_list_archive/publishing/public_national_registry.py',
              'tests/public_portal_browser.cjs',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          assert changed == allowed, (changed, allowed)
          PY
      - name: Commit validated Padova production integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/public-pages.yml \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            docs/sources/padova-operational-check-2026-09-14.md \
            src/white_list_archive/publishing/public_national_registry.py \
            tests/public_portal_browser.cjs
          git diff --cached --check
          git commit -m 'Integrate Padova public source observations'
          git push origin HEAD:expansion/padova-2026-09-14
