name: Lodi source transition v2 (temporary)

on:
  push:
    branches:
      - fix/lodi-source-drift-2026-09-16
    paths:
      - '.github/workflows/lodi-source-transition-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lodi-source-transition-2026-09-16
  cancel-in-progress: false

jobs:
  transition:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Confirm branch and current official source stability
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/lodi-source-drift-2026-09-16'
          remote_sha="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-list --count HEAD..origin/main)" -eq 0
          listed='https://docs.google.com/spreadsheets/d/e/2PACX-1vSTOZ3x5FBo4IanDtISccAnqZmVLPmGhEYaj0YrDn4aP6ZpwY8kzpiHhAX0i26IwipgD6bvsWhSigwz/pub?gid=0&single=true&output=csv'
          applicants='https://docs.google.com/spreadsheets/d/e/2PACX-1vSTOZ3x5FBo4IanDtISccAnqZmVLPmGhEYaj0YrDn4aP6ZpwY8kzpiHhAX0i26IwipgD6bvsWhSigwz/pub?gid=245180329&single=true&output=csv'
          mkdir -p /tmp/lodi-transition
          for n in 1 2; do
            nonce="$(date +%s%N)-$n"
            curl --fail --location --silent --show-error --retry 3 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${listed}&cb=${nonce}" -o "/tmp/lodi-transition/listed-$n.csv"
            sleep 3
            nonce="$(date +%s%N)-a-$n"
            curl --fail --location --silent --show-error --retry 3 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${applicants}&cb=${nonce}" -o "/tmp/lodi-transition/applicants-$n.csv"
            sleep 3
          done
          cmp /tmp/lodi-transition/listed-1.csv /tmp/lodi-transition/listed-2.csv
          cmp /tmp/lodi-transition/applicants-1.csv /tmp/lodi-transition/applicants-2.csv
          test "$(sha256sum /tmp/lodi-transition/listed-1.csv | cut -d' ' -f1)" = 'c3695018c56ba754614eff988011e0f9b2f6cb2d8e0f22a9823275c8659da613'
          test "$(sha256sum /tmp/lodi-transition/applicants-1.csv | cut -d' ' -f1)" = '55aeab7e809cb90cc1ebd1ad9c1f08db78e91648a2c2e1a2b603188c77846228'
      - name: Apply reviewed Lodi transition
        run: |
          python tmp/lodi_apply_transition.py
          git diff --check
      - name: Prepare publication runtime
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source_file; do
            [ -n "$source_file" ] && sudo rm -f "$source_file"
          done < <(grep -rlE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '\|dl\.google\.com/linux/chrome|d;\|packages\.google\.com/chrome|d' /etc/apt/sources.list
          fi
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends poppler-utils; then break; fi
            test "$attempt" -lt 3 || exit 1
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[dev,publication,database,storage]'
      - name: Run repository and Lodi semantic tests
        run: |
          pytest -q
          pytest -q tests/test_lodi_parser_semantics.py
          node --check tests/public_portal_browser.cjs
      - name: Commit implementation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/white_list_archive/parsers/lodi_sheets.py tests/test_lodi_parser_semantics.py data/publication/multi_prefecture_pilot.json data/source_registry/source_series_inventory.csv data/monitoring/national_coverage.json docs/sources/lodi-operational-check-2026-09-16.md
          git commit -m 'Approve 16 September Lodi source transition'
          git push origin HEAD:fix/lodi-source-drift-2026-09-16
          echo "IMPLEMENTED_SHA=$(git rev-parse HEAD)"
      - name: Build and validate current national boundary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lodi-national /tmp/lodi-sources
          mkdir -p /tmp/lodi-national
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/lodi-sources \
            --registry-json /tmp/lodi-national/registry.json \
            --registry-csv /tmp/lodi-national/registry.csv \
            --prefectures-json /tmp/lodi-national/prefectures.json \
            --prefectures-csv /tmp/lodi-national/prefectures.csv
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          reg=json.loads(Path('/tmp/lodi-national/registry.json').read_text(encoding='utf-8'))
          pref=json.loads(Path('/tmp/lodi-national/prefectures.json').read_text(encoding='utf-8'))
          assert reg['meta']['record_count'] == len(reg['records']) == 51565
          assert reg['meta']['authority_count'] == 46
          assert reg['meta']['register_count'] == 47
          assert pref['meta']['published_count'] == 46
          assert pref['meta']['mapped_count'] == 47
          records=[r for r in reg['records'] if r['authority_key']=='lodi']
          assert len(records)==173
          assert len({r['record_locator'] for r in records})==173
          assert Counter(r['source_status'] for r in records)==Counter({'listed':146,'renewal_update_in_progress':23,'rejected_or_denied':2,'pending':2})
          by_id={i:r for r in records for i in r.get('identifiers',[]) if i in {'03030560969','04220560967'}}
          assert by_id['03030560969']['source_status']=='renewal_update_in_progress'
          assert by_id['03030560969']['observed_listing_date']=='2025-10-23'
          assert by_id['03030560969']['observed_expiry_date']=='2026-10-23'
          assert by_id['04220560967']['source_status']=='listed'
          assert by_id['04220560967']['observed_listing_date']=='2026-09-16'
          assert by_id['04220560967']['observed_expiry_date']=='2027-09-16'
          print({'record_count':51565,'published_count':46,'register_count':47,'mapped_count':47,'lodi_records':173,'lodi_statuses':dict(Counter(r['source_status'] for r in records))})
          PY
