name: Aosta source transition finalisation (temporary)

on:
  push:
    branches:
      - fix/aosta-source-drift-2026-09-16
    paths:
      - .github/workflows/aosta-source-audit-2026-09-16.yml

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/aosta-source-drift-2026-09-16
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconcile branch with current main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "Aosta transition branch no longer contains current main; refusing to materialise against a stale national baseline" >&2
            exit 1
          fi
      - name: Install publication and test runtime
        run: |
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends poppler-utils; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Publication runtime package installation failed after bounded retries" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[publication,dev,database,storage]'
      - name: Verify and materialise reviewed Aosta transition
        run: python tmp/aosta_transition_finalise_2026_09_16.py
      - name: Remove temporary machinery and freeze production-only diff
        run: |
          git rm tmp/aosta_transition_finalise_2026_09_16.py
          git rm .github/workflows/aosta-source-audit-2026-09-16.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/sources/aosta-operational-check-2026-09-10.md')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/public-pages.yml',
              'data/monitoring/national_coverage.json',
              'data/publication/multi_prefecture_pilot.json',
              'docs/sources/aosta-operational-check-2026-09-10.md',
              'tests/public_portal_browser.cjs',
          }
          observed = set(subprocess.check_output(['git','diff','--name-only','origin/main'], text=True).splitlines())
          assert observed == expected, f'Unexpected final Aosta diff: observed={sorted(observed)!r}, expected={sorted(expected)!r}'
          print('production-only diff:', *sorted(observed), sep='\n- ')
          PY
      - name: Commit final Aosta transition and attempt branch checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Approve 16 September Aosta source transition'
          FINAL_SHA=$(git rev-parse HEAD)
          echo "FINAL_SHA=$FINAL_SHA"
          set +e
          git push origin HEAD:fix/aosta-source-drift-2026-09-16
          PUSH_STATUS=$?
          set -e
          echo "PUSH_STATUS=$PUSH_STATUS"
          exit 0
