name: Finalise Pisa production-only integration

on:
  push:
    branches:
      - expansion/pisa-2026-09-15
    paths:
      - '.github/workflows/pisa-finalise-production.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pisa-finalise-production
  cancel-in-progress: false

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stage permanent Pisa portal gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          workflow = Path('.github/workflows/public-pages.yml')
          text = workflow.read_text(encoding='utf-8')
          text = replace_once(text, "      - 'src/white_list_archive/parsers/roma_positioned.py'\n", "      - 'src/white_list_archive/parsers/roma_positioned.py'\n      - 'src/white_list_archive/parsers/pisa_tables.py'\n", 'Pisa parser path trigger')
          text = replace_once(text, "          assert reg['meta']['record_count'] == 46799\n", "          assert reg['meta']['record_count'] == 47248\n", 'record count')
          text = replace_once(text, "'trento','lodi','roma'}\n", "'trento','lodi','roma','pisa'}\n", 'authority set')
          text = replace_once(text, "'trento-ordinary','lodi-ordinary','roma-ordinary'\n", "'trento-ordinary','lodi-ordinary','roma-ordinary','pisa-white-list'\n", 'register set')
          text = replace_once(text, "          assert reg['meta']['authority_count'] == 40\n", "          assert reg['meta']['authority_count'] == 41\n", 'authority count')
          text = replace_once(text, "          assert reg['meta']['register_count'] == 41\n", "          assert reg['meta']['register_count'] == 42\n", 'register count')
          text = replace_once(text, "          assert pref['meta']['published_count'] == 40\n", "          assert pref['meta']['published_count'] == 41\n", 'published count')
          text = replace_once(text, "          assert pref['meta']['mapped_count'] == 44\n", "          assert pref['meta']['mapped_count'] == 45\n", 'mapped count')
          roma_block = """          assert sum(r['source_status'] == 'pending' for r in roma_records) == 2256\n          assert len({r['record_locator'] for r in roma_records}) == 4428\n"""
          pisa_block = roma_block + """          pisa = [x for x in pref['prefectures'] if x['authority_key'] == 'pisa']\n          assert len(pisa) == 1 and pisa[0]['mapped'] and pisa[0]['published'] and pisa[0]['series_count'] == 3\n          pisa_records = [r for r in reg['records'] if r['authority_key'] == 'pisa']\n          assert len(pisa_records) == 449\n          assert sum(r['source_key'] == 'pisa-listed' for r in pisa_records) == 398\n          assert sum(r['source_key'] == 'pisa-applicants' for r in pisa_records) == 18\n          assert sum(r['source_key'] == 'pisa-renewal-update' for r in pisa_records) == 33\n          assert sum(r['source_status'] == 'listed' for r in pisa_records) == 398\n          assert sum(r['source_status'] == 'pending' for r in pisa_records) == 18\n          assert sum(r['source_status'] == 'renewal_update_in_progress' for r in pisa_records) == 33\n          assert len({r['record_locator'] for r in pisa_records}) == 449\n          assert sum(bool(r['identifiers']) for r in pisa_records if r['source_key'] == 'pisa-listed') == 397\n          assert sum(bool(r['identifiers']) for r in pisa_records if r['source_key'] == 'pisa-applicants') == 18\n          assert sum(bool(r['identifiers']) for r in pisa_records if r['source_key'] == 'pisa-renewal-update') == 33\n"""
          text = replace_once(text, roma_block, pisa_block, 'Pisa workflow invariants')
          Path('tmp/pisa-public-pages.final.yml').write_text(text, encoding='utf-8')

          browser = Path('tests/public_portal_browser.cjs')
          text = browser.read_text(encoding='utf-8')
          text = replace_once(text, "      assert.ok(labels.includes('White List ordinaria · Prefettura di Roma'));\n", "      assert.ok(labels.includes('White List ordinaria · Prefettura di Roma'));\n      assert.ok(labels.includes('White List — Prefettura di Pisa · Prefettura di Pisa'));\n", 'Pisa register selector')
          text = replace_once(text, "      assert.equal(stats.total,46799);\n", "      assert.equal(stats.total,47248);\n", 'browser total')
          text = replace_once(text, "'trento','lodi','roma'].includes(r.authority_key));\n", "'trento','lodi','roma','pisa'].includes(r.authority_key));\n", 'browser baseline exclusion')
          roma_browser = """      assert.deepEqual(statusCounts(roma),{listed:1215,pending:2256,renewal_update_in_progress:957});\n      assert.equal(new Set(roma.map(r=>r.record_locator)).size,4428);\n"""
          pisa_browser = roma_browser + """      const pisa=registry.records.filter(r=>r.authority_key==='pisa');\n      assert.equal(pisa.length,449);\n      assert.equal(pisa.filter(r=>r.source_key==='pisa-listed').length,398);\n      assert.equal(pisa.filter(r=>r.source_key==='pisa-applicants').length,18);\n      assert.equal(pisa.filter(r=>r.source_key==='pisa-renewal-update').length,33);\n      assert.deepEqual(statusCounts(pisa),{listed:398,pending:18,renewal_update_in_progress:33});\n      assert.equal(new Set(pisa.map(r=>r.record_locator)).size,449);\n      assert.equal(pisa.filter(r=>r.source_key==='pisa-listed'&&r.identifiers.length>0).length,397);\n      assert.equal(pisa.filter(r=>r.source_key==='pisa-applicants'&&r.identifiers.length>0).length,18);\n      assert.equal(pisa.filter(r=>r.source_key==='pisa-renewal-update'&&r.identifiers.length>0).length,33);\n      assert.equal(pisa.filter(r=>r.name==='ROHDE NIELSEN A/S'&&r.source_key==='pisa-listed'&&r.identifiers.length===0).length,1);\n"""
          text = replace_once(text, roma_browser, pisa_browser, 'Pisa browser invariants')
          browser.write_text(text, encoding='utf-8')
          PY
      - name: Verify staged changes
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/public_portal_browser.cjs
          grep -q "record_count'] == 47248" tmp/pisa-public-pages.final.yml
          grep -q "authority_count'] == 41" tmp/pisa-public-pages.final.yml
          grep -q "register_count'] == 42" tmp/pisa-public-pages.final.yml
          grep -q "published_count'] == 41" tmp/pisa-public-pages.final.yml
          grep -q "mapped_count'] == 45" tmp/pisa-public-pages.final.yml
          grep -q "pisa-white-list" tmp/pisa-public-pages.final.yml
          grep -q "pisa_tables.py" tmp/pisa-public-pages.final.yml
          grep -q "stats.total,47248" tests/public_portal_browser.cjs
          grep -q "ROHDE NIELSEN A/S" tests/public_portal_browser.cjs
          git diff --check -- tests/public_portal_browser.cjs
      - name: Commit staging payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/public_portal_browser.cjs tmp/pisa-public-pages.final.yml
          git diff --cached --check
          git commit -m 'Stage Pisa public portal gates'
          git push origin HEAD:expansion/pisa-2026-09-15
