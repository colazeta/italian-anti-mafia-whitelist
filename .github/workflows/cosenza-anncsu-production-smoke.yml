name: Cosenza ANNCSU production smoke
# v2: ANNCSU street identity is ODONIMO-only; language metadata is excluded.

on:
  push:
    branches:
      - feature/official-address-enrichment
    paths:
      - '.github/workflows/cosenza-anncsu-production-smoke.yml'
  workflow_dispatch:

concurrency:
  group: cosenza-anncsu-production-smoke
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: whitelist
          POSTGRES_USER: whitelist
          POSTGRES_PASSWORD: whitelist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whitelist -d whitelist"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      PGPASSWORD: whitelist
      TEST_DSN: postgresql://whitelist:whitelist@localhost:5432/whitelist

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install project and utilities
        run: |
          python -m pip install -e .[dev,database]
          pytest -q tests/test_italian_address.py tests/test_anncsu_linkage.py tests/test_anncsu_odonimo_contract.py tests/test_anncsu_acquisition.py
          sudo apt-get update
          sudo apt-get install -y poppler-utils postgresql-client

      - name: Apply PostgreSQL schema and tests
        run: |
          psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -f db/apply.sql
          psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -f db/test.sql

      - name: Reconstruct frozen Cosenza canonical addresses
        run: |
          white-list-cosenza-capture \
            https://prefettura.interno.gov.it/it/prefetture/cosenza/white-list-elenchi-aggiornati-28-giugno-2026 \
            https://prefettura.interno.gov.it/it/prefetture/cosenza/white-list-elenchi-aggiornati-03-agosto-2026
          python - <<'PY'
          import json
          from pathlib import Path
          live = {item['reference_date']: item for item in json.loads(Path('artifacts/cosenza-capture/manifest.json').read_text())}
          frozen = {
              '2026-06-28': json.loads(Path('data/captures/cosenza/combined_2026-06-28.json').read_text()),
              '2026-08-03': json.loads(Path('data/captures/cosenza/combined_2026-08-03.json').read_text()),
          }
          keys = ['resource_url', 'sha256', 'text_sha256', 'schema_fingerprint', 'page_count']
          for reference_date, expected in frozen.items():
              observed = live.get(reference_date)
              if observed is None:
                  raise SystemExit(f'Missing live Cosenza edition {reference_date}')
              mismatches = {key: {'expected': expected[key], 'observed': observed.get(key)} for key in keys if observed.get(key) != expected.get(key)}
              if mismatches:
                  raise SystemExit(f'Frozen content identity mismatch for {reference_date}: {mismatches}')
          print('Frozen Cosenza source identities verified.')
          PY
          white-list-persist-capture-manifests --dsn "$TEST_DSN" \
            data/captures/cosenza/combined_2026-06-28.json \
            data/captures/cosenza/combined_2026-08-03.json
          white-list-cosenza-v2 \
            artifacts/cosenza-capture/2026-06-28/combined.pdf \
            artifacts/cosenza-capture/2026-08-03/combined.pdf \
            --output-dir artifacts/cosenza-v2
          white-list-persist-parsed-records-v2 --dsn "$TEST_DSN" \
            --capture-manifest data/captures/cosenza/combined_2026-06-28.json \
            --parse-manifest artifacts/cosenza-v2/parse_manifest_v2.json \
            --parse-label before \
            --records artifacts/cosenza-v2/before_records_v2.csv
          white-list-persist-parsed-records-v2 --dsn "$TEST_DSN" \
            --capture-manifest data/captures/cosenza/combined_2026-08-03.json \
            --parse-manifest artifacts/cosenza-v2/parse_manifest_v2.json \
            --parse-label after \
            --records artifacts/cosenza-v2/after_records_v2.csv
          white-list-semantic-pipeline \
            --dsn "$TEST_DSN" \
            --series-code cosenza-combined \
            > artifacts/cosenza-v2/semantic_pipeline.json
          psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -f db/tests/006_cosenza_semantic_pipeline.sql
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ['TEST_DSN']) as conn, conn.cursor() as cur:
              cur.execute("SELECT count(*),count(DISTINCT btrim(full_address)) FROM core.address")
              observed=tuple(map(int,cur.fetchone()))
          if observed != (1298,1298):
              raise SystemExit(f'Unexpected Cosenza canonical address population: {observed}')
          print('Canonical address population:', observed)
          PY

      - name: Acquire frozen official Istat and ANNCSU inputs
        run: |
          mkdir -p artifacts/istat-municipalities artifacts/anncsu
          white-list-istat-municipalities-acquire \
            --output-dir artifacts/istat-municipalities \
            --expected-sha256 83842076860450f7e482daecea6b7a769f5f93d0bf5b0d48802b44896d7a26d5 \
            > artifacts/istat-municipalities/acquisition.json
          white-list-anncsu-acquire \
            --dataset INDIR_CALA \
            --output-dir artifacts/anncsu \
            --expected-sha256 65136ad879e33bca5e776f526fe77d17bd3b141a434575591873c842e23ef0aa \
            > artifacts/anncsu/acquisition.json

      - name: Persist production ANNCSU enrichment candidates
        run: |
          mkdir -p artifacts/cosenza-anncsu-production
          ISTAT_CSV=$(find artifacts/istat-municipalities -maxdepth 1 -name 'istat-municipalities-*.csv' -print -quit)
          ISTAT_MANIFEST=$(find artifacts/istat-municipalities -maxdepth 1 -name 'istat-municipalities-*.manifest.json' -print -quit)
          ANNCSU_CSV=$(find artifacts/anncsu -maxdepth 1 -name 'INDIR_CALA_*.csv' -print -quit)
          ANNCSU_MANIFEST=$(find artifacts/anncsu -maxdepth 1 -name 'anncsu-indir_cala-*.manifest.json' -print -quit)
          test -n "$ISTAT_CSV" && test -n "$ISTAT_MANIFEST" && test -n "$ANNCSU_CSV" && test -n "$ANNCSU_MANIFEST"
          white-list-anncsu-enrich \
            --dsn "$TEST_DSN" \
            --istat-csv "$ISTAT_CSV" \
            --istat-manifest "$ISTAT_MANIFEST" \
            --anncsu-csv "$ANNCSU_CSV" \
            --anncsu-manifest "$ANNCSU_MANIFEST" \
            --dataset-region Calabria \
            | tee artifacts/cosenza-anncsu-production/enrichment.json

      - name: Build ANNCSU validation pack
        run: |
          ENDPOINT=$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('artifacts/cosenza-anncsu-production/enrichment.json').read_text())['provider_endpoint'])
          PY
          )
          white-list-geocode-validation \
            --dsn "$TEST_DSN" \
            --provider-name anncsu \
            --provider-endpoint "$ENDPOINT" \
            --sample-size 150 \
            --output-dir artifacts/cosenza-anncsu-production/validation \
            > artifacts/cosenza-anncsu-production/validation_stdout.json
          cat artifacts/cosenza-anncsu-production/validation/README.md
          cat artifacts/cosenza-anncsu-production/validation/README.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate complete accounting and candidate safety
        run: |
          python - <<'PY'
          import json, os, psycopg
          from pathlib import Path
          root=Path('artifacts/cosenza-anncsu-production')
          run=json.loads((root/'enrichment.json').read_text())
          summary=json.loads((root/'validation/summary.json').read_text())
          if run['selected_address_ids'] != 1298 or not run['all_selected_addresses_accounted_for']:
              raise SystemExit(f"Pipeline accounting failed: {run}")
          if run['candidate'] + run['not_found'] != 1298:
              raise SystemExit('Candidate + terminal results do not reconcile')
          if summary['total_canonical_addresses'] != 1298 or summary['unprocessed'] != 0:
              raise SystemExit(f"Validation pack accounting failed: {summary}")
          if summary['addresses_with_provider_match'] != run['candidate']:
              raise SystemExit('Validation candidate total does not reconcile with pipeline')
          if summary['not_found'] != run['not_found']:
              raise SystemExit('Validation terminal total does not reconcile with pipeline')
          if summary['manual_sample_rows'] != 150:
              raise SystemExit(f"Unexpected review sample size: {summary['manual_sample_rows']}")
          with psycopg.connect(os.environ['TEST_DSN']) as conn, conn.cursor() as cur:
              cur.execute("SELECT count(*) FROM geo.address_geocode_result WHERE provider_name='anncsu' AND match_status_code='accepted' AND upper_inf(system_period)")
              accepted=int(cur.fetchone()[0])
              cur.execute("SELECT count(*) FROM mart.address_geography WHERE geocode_provider='anncsu' AND latitude IS NOT NULL")
              leaked=int(cur.fetchone()[0])
          if accepted or leaked:
              raise SystemExit(f'ANNCSU pilot falsely accepted geography: accepted={accepted}, geography={leaked}')
          print('ANNCSU production smoke accounting validated; all results remain candidate/not_found.')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cosenza-anncsu-production-smoke
          path: |
            artifacts/cosenza-anncsu-production/
            artifacts/istat-municipalities/*.manifest.json
            artifacts/anncsu/*.manifest.json
            artifacts/istat-municipalities/acquisition.json
            artifacts/anncsu/acquisition.json
          if-no-files-found: warn
          retention-days: 30
