name: Finalise Crotone resolution docs once

on:
  push:
    branches:
      - sources/resolve-crotone-2026-09-09
    paths:
      - '.github/workflows/finalise-crotone-docs-once.yml'

permissions:
  contents: write

jobs:
  finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sources/resolve-crotone-2026-09-09
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refresh README and evidence log
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          replacements = {
              '- **63** qualified recurring source series;': '- **65** qualified recurring source series;',
              'At the current **34-page / 63-series** discovery baseline, the deterministic ledger contains **35 register/discovery scopes**: **32** account for both populations and **3** remain unresolved/incomplete.': 'At the current **34-page / 65-series** discovery baseline, the deterministic ledger contains **35 register/discovery scopes**: **33** account for both populations and **2** remain unresolved/incomplete.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected README marker missing: {old}')
              text = text.replace(old, new, 1)
          readme.write_text(text, encoding='utf-8')
          encoded = ''
          Path('docs/sources/source-population-resolution-2026-09-09.md').write_bytes(base64.b64decode(encoded))
          PY
      - name: Verify documentation and focused source-population state
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests/test_source_population_coverage.py tests/test_monitoring_reconciliation.py tests/test_repository_governance.py
          grep -F '**65** qualified recurring source series' README.md
          grep -F '**33** account for both populations and **2** remain unresolved/incomplete' README.md
          grep -F 'scopes with both `listed` and `applicant` populations accounted for: **33**' docs/sources/source-population-resolution-2026-09-09.md
      - name: Remove one-off workflows and commit final Crotone resolution
        run: |
          git rm .github/workflows/resolve-crotone-once.yml .github/workflows/finalise-crotone-docs-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/sources/source-population-resolution-2026-09-09.md
          git diff --cached --check
          git commit -m 'Finalise Crotone source-population resolution evidence'
          git push origin HEAD:sources/resolve-crotone-2026-09-09
