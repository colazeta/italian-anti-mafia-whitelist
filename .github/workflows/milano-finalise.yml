name: Milano production finalisation (temporary)

on:
  push:
    branches:
      - expansion/milano-2026-09-16
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milano-production-finalisation
  cancel-in-progress: false

jobs:
  finalise:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[finalise]'))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout expansion branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconcile latest main without publishing partial state
        shell: bash
        run: |
          set -euo pipefail
          branch='expansion/milano-2026-09-16'
          remote_sha="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          merge_rc=0
          git merge --no-edit origin/main || merge_rc=$?
          if [ "$merge_rc" -ne 0 ]; then
            conflicted="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicted" != 'data/source_registry/source_series_inventory.csv' ]; then
              echo "Unexpected merge conflict set: $conflicted" >&2
              exit 1
            fi
            git checkout --theirs -- data/source_registry/source_series_inventory.csv
          fi
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path('data/source_registry/source_series_inventory.csv')
          with path.open('r', encoding='utf-8', newline='') as fh:
              reader = csv.DictReader(fh)
              fieldnames = reader.fieldnames
              rows = list(reader)
          if not fieldnames:
              raise SystemExit('source inventory header missing')
          matches = [row for row in rows if row.get('authority_key') == 'milano']
          if len(matches) != 1:
              raise SystemExit(f'Expected one Milano inventory row, got {len(matches)}')
          row = matches[0]
          if row.get('source_series_key') not in {'milano-listed', 'milano-combined'}:
              raise SystemExit(f"Unexpected Milano inventory pre-state: {row.get('source_series_key')!r}")
          row.update({
              'source_series_key': 'milano-combined',
              'authority_key': 'milano',
              'regime_code': 'WL-REGIME-L190-2012',
              'population_scope': 'listed_and_applicant',
              'sector_scope': 'all',
              'publication_model': 'custom_web_application',
              'series_url': 'https://prefettura.interno.gov.it/it/prefetture/milano/evidenza/white-list',
              'resource_resolution_status': 'landing_page_resolved',
              'verified_date': '2026-09-16',
              'notes': (
                  'Official Milano combined table revalidated again on 16 September 2026 after same-day source drift. '
                  'Two independent no-cache GETs were byte-identical at SHA-256 b360e209f3997894a3e7408e5be7f07d77cddca0c3490581ff3410218a02d9a8. '
                  'Current boundary: 4,220 sector rows / 2,618 logical observations (939 listed, 517 renewal/update, 1,162 pending). '
                  'The registered-only sibling remains stable at SHA-256 4509948e4baf91ed5c92bd5940a2fca1cd5f9a6fd21f553c4864e68735e36608 '
                  "and exactly matches the 1,456 non-pending combined identities; it is corroborative and not co-ingested."
              ),
          })
          with path.open('w', encoding='utf-8', newline='') as fh:
              writer = csv.DictWriter(fh, fieldnames=fieldnames, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)
          PY
          if [ "$merge_rc" -ne 0 ]; then
            git add data/source_registry/source_series_inventory.csv
            git commit --no-edit
          fi
          test "$(git rev-list --count HEAD..origin/main)" -eq 0
      - name: Apply reviewed Milano production transaction
        run: python tmp/milano_finalise.py
      - name: Advance transaction to latest independently audited source boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          PREV = '1d84bda8cdcd7252fd2580af31489b0cc4361801a417125fbfade03c584bb474'
          NEW = 'b360e209f3997894a3e7408e5be7f07d77cddca0c3490581ff3410218a02d9a8'
          SIBLING = '4509948e4baf91ed5c92bd5940a2fca1cd5f9a6fd21f553c4864e68735e36608'

          def repl(path_s, old, new, count=1):
              path = Path(path_s)
              text = path.read_text(encoding='utf-8')
              found = text.count(old)
              if found != count:
                  raise RuntimeError(f'{path}: expected {count} occurrences of {old!r}, found {found}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          cfg_path = Path('data/publication/multi_prefecture_pilot.json')
          cfg = json.loads(cfg_path.read_text(encoding='utf-8'))
          sources = [x for x in cfg['sources'] if x.get('source_key') == 'milano-combined']
          if len(sources) != 1:
              raise RuntimeError('Milano publication source cardinality drift')
          src = sources[0]
          if (src.get('sha256'), src.get('expected_sector_rows'), src.get('expected_source_rows')) != (PREV, 4218, 2617):
              raise RuntimeError('Unexpected intermediate Milano publication state')
          src['sha256'] = NEW
          src['expected_sector_rows'] = 4220
          src['expected_source_rows'] = 2618
          src['notes'] = (
              'The mutable combined operational table was revalidated again on 16 September 2026 after another fail-closed same-day drift. '
              f'Two fresh no-cache GETs were byte-identical at 972,380 bytes with SHA-256 {NEW}. '
              'The reviewed boundary contains 4,220 sector rows and 2,618 logical observations: 939 listed, 517 renewal/update in progress and 1,162 pending. '
              'All 2,618 identifiers are strict. Four pending observations are source-explicitly dated 16 September 2026, including '
              'SV VERNICIATURE INDUSTRIALI S.R.L. (02685280394), G.B.C. INDUSTRIAL TOOLS SPA (07639230155), '
              'VERNIA SRL (11967860153) and CARBON SUD TRASPORTI E SERVIZI S.R.L. (14302100962). '
              f'The registered-only sibling remains stable at SHA-256 {SIBLING}; its 1,456 identities exactly match the combined non-pending set and it is not co-ingested.'
          )
          cfg_path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          repl('src/white_list_archive/parsers/milano_webapp.py', '_EXPECTED_SECTOR_ROWS = 4218\n', '_EXPECTED_SECTOR_ROWS = 4220\n')
          repl('src/white_list_archive/parsers/milano_webapp.py', '_EXPECTED_RECORDS = 2617\n', '_EXPECTED_RECORDS = 2618\n')
          repl(
              'src/white_list_archive/parsers/milano_webapp.py',
              '_EXPECTED_STATUS_COUNTS = {\n    "listed": 941,\n    "renewal_update_in_progress": 515,\n    "pending": 1161,\n}\n',
              '_EXPECTED_STATUS_COUNTS = {\n    "listed": 939,\n    "renewal_update_in_progress": 517,\n    "pending": 1162,\n}\n',
          )
          repl('src/white_list_archive/parsers/milano_webapp.py', '_EXPECTED_IDENTIFIER_COVERAGE = 2617\n', '_EXPECTED_IDENTIFIER_COVERAGE = 2618\n')

          mon_path = Path('data/monitoring/national_coverage.json')
          mon = json.loads(mon_path.read_text(encoding='utf-8'))
          entries = [x for x in mon['prefectures'] if x.get('authority_key') == 'milano']
          if len(entries) != 1 or entries[0].get('known_content_sha256') != [PREV] or entries[0].get('canonical_integration_validated') is not True:
              raise RuntimeError('Unexpected intermediate Milano monitoring state')
          entries[0]['known_content_sha256'] = [NEW]
          entries[0]['last_successful_source_check_at'] = '2026-09-16T19:03:59Z'
          entries[0]['last_attempted_source_check_at'] = '2026-09-16T19:03:59Z'
          entries[0]['last_content_change_at'] = '2026-09-16T19:03:37Z'
          mon_path.write_text(json.dumps(mon, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          note_path = 'docs/sources/milano-operational-check-2026-09-16.md'
          repl(note_path, 'combined table: **971,900 bytes**, SHA-256 **`1d84bda8cdcd7252fd2580af31489b0cc4361801a417125fbfade03c584bb474`**;', f'combined table: **972,380 bytes**, SHA-256 **`{NEW}`**;')
          repl(note_path, 'The current combined source contains **10** statutory tables, **4,218** physical sector-membership rows and **2,617** conservative logical observations.', 'The current combined source contains **10** statutory tables, **4,220** physical sector-membership rows and **2,618** conservative logical observations.')
          repl(note_path, '- **4,218** source sector-membership rows;', '- **4,220** source sector-membership rows;')
          repl(note_path, '- **2,617** logical observations;', '- **2,618** logical observations;')
          repl(note_path, '- **2,617/2,617** strict source identifiers, with one logical observation per identifier;', '- **2,618/2,618** strict source identifiers, with one logical observation per identifier;')
          repl(note_path, '- **2,617/2,617** observations with at least one source-explicit statutory activity section;', '- **2,618/2,618** observations with at least one source-explicit statutory activity section;')
          repl(note_path, '- **941** `listed` observations;', '- **939** `listed` observations;')
          repl(note_path, '- **515** `renewal_update_in_progress` observations;', '- **517** `renewal_update_in_progress` observations;')
          repl(note_path, '- **1,161** `pending` observations.', '- **1,162** `pending` observations.')
          repl(note_path, 'All **1,161** pending observations have explicit application dates. All **941** listed observations have explicit listing and expiry dates.', 'All **1,162** pending observations have explicit application dates. All **939** listed observations have explicit listing and expiry dates.')
          repl(note_path, 'The current source explicitly contains these three pending observations dated 16 September:', 'The current source explicitly contains these four pending observations dated 16 September:')
          repl(note_path, '- G.B.C. INDUSTRIAL TOOLS SPA — `07639230155`;', '- SV VERNICIATURE INDUSTRIALI S.R.L. — `02685280394`;\n- G.B.C. INDUSTRIAL TOOLS SPA — `07639230155`;')
          repl(
              note_path,
              'Relative to the first same-day capture, the aggregate current boundary is +3 logical observations and +4 sector rows; the status distribution moves from 940/516/1,158 to 941/515/1,161. The retained first-capture evidence is sufficient to prove the former approved aggregate and hash but does not preserve the old mutable response body, so the individual identity behind the aggregate one-row `renewal_update_in_progress` to `listed` shift is not reconstructed here. No identity or legal effect is inferred to fill that evidential gap.',
              'The source changed again after the 4,218 / 2,617 boundary was reviewed. The current boundary is +1 logical observation and +2 sector rows relative to that second capture, with status counts moving from 941/515/1,161 to 939/517/1,162. SV VERNICIATURE INDUSTRIALI S.R.L. is positively observed as the additional 16 September pending identity. The retained evidence does not establish the individual identities behind the aggregate two-row `listed` to `renewal_update_in_progress` shift, so no identity or legal effect is inferred for those transitions.'
          )
          repl(note_path, '**54,182 records / 47 published Prefectures / 48 published registers / 47 mapped Prefectures**', '**54,183 records / 47 published Prefectures / 48 published registers / 47 mapped Prefectures**')
          repl(note_path, '**2,617 Milano observations / 2,617 distinct locators**', '**2,618 Milano observations / 2,618 distinct locators**')

          pages = '.github/workflows/public-pages.yml'
          repl(pages, "          assert reg['meta']['record_count'] == 54182\n", "          assert reg['meta']['record_count'] == 54183\n")
          repl(pages, "          assert len(milano_records) == 2617\n", "          assert len(milano_records) == 2618\n")
          repl(pages, "          assert sum(r['source_status'] == 'listed' for r in milano_records) == 941\n", "          assert sum(r['source_status'] == 'listed' for r in milano_records) == 939\n")
          repl(pages, "          assert sum(r['source_status'] == 'renewal_update_in_progress' for r in milano_records) == 515\n", "          assert sum(r['source_status'] == 'renewal_update_in_progress' for r in milano_records) == 517\n")
          repl(pages, "          assert sum(r['source_status'] == 'pending' for r in milano_records) == 1161\n", "          assert sum(r['source_status'] == 'pending' for r in milano_records) == 1162\n")
          repl(pages, "          assert len({r['record_locator'] for r in milano_records}) == 2617\n", "          assert len({r['record_locator'] for r in milano_records}) == 2618\n")
          repl(pages, "          assert sum(bool(r['identifiers']) for r in milano_records) == 2617\n", "          assert sum(bool(r['identifiers']) for r in milano_records) == 2618\n")
          repl(pages, "          assert sum(bool(r['application_date']) for r in milano_records) == 1161\n", "          assert sum(bool(r['application_date']) for r in milano_records) == 1162\n")
          repl(pages, "          assert sum(bool(r['observed_listing_date']) for r in milano_records) == 941\n", "          assert sum(bool(r['observed_listing_date']) for r in milano_records) == 939\n")
          repl(pages, "          assert sum(bool(r['observed_expiry_date']) for r in milano_records) == 941\n", "          assert sum(bool(r['observed_expiry_date']) for r in milano_records) == 939\n")
          repl(pages, "          assert pending_16 == {\n              ('G.B.C. INDUSTRIAL TOOLS SPA', '07639230155'),\n", "          assert pending_16 == {\n              ('SV VERNICIATURE INDUSTRIALI S.R.L.', '02685280394'),\n              ('G.B.C. INDUSTRIAL TOOLS SPA', '07639230155'),\n")

          browser = 'tests/public_portal_browser.cjs'
          repl(browser, '      assert.equal(stats.total,54182);\n', '      assert.equal(stats.total,54183);\n')
          repl(browser, '      assert.equal(milano.length,2617);\n', '      assert.equal(milano.length,2618);\n')
          repl(browser, "      assert.equal(milano.filter(r=>r.source_key==='milano-combined').length,2617);\n", "      assert.equal(milano.filter(r=>r.source_key==='milano-combined').length,2618);\n")
          repl(browser, '      assert.deepEqual(statusCounts(milano),{listed:941,pending:1161,renewal_update_in_progress:515});\n', '      assert.deepEqual(statusCounts(milano),{listed:939,pending:1162,renewal_update_in_progress:517});\n')
          repl(browser, '      assert.equal(new Set(milano.map(r=>r.record_locator)).size,2617);\n', '      assert.equal(new Set(milano.map(r=>r.record_locator)).size,2618);\n')
          repl(browser, '      assert.equal(milano.filter(r=>r.identifiers.length>0).length,2617);\n', '      assert.equal(milano.filter(r=>r.identifiers.length>0).length,2618);\n')
          repl(browser, "      assert.equal(milano.filter(r=>r.application_date!=='').length,1161);\n", "      assert.equal(milano.filter(r=>r.application_date!=='').length,1162);\n")
          repl(browser, "      assert.equal(milano.filter(r=>r.observed_listing_date!=='').length,941);\n", "      assert.equal(milano.filter(r=>r.observed_listing_date!=='').length,939);\n")
          repl(browser, "      assert.equal(milano.filter(r=>r.observed_expiry_date!=='').length,941);\n", "      assert.equal(milano.filter(r=>r.observed_expiry_date!=='').length,939);\n")
          PY
      - name: Enforce production-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only origin/main | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          .github/workflows/public-pages.yml
          data/monitoring/national_coverage.json
          data/publication/multi_prefecture_pilot.json
          data/source_registry/source_series_inventory.csv
          data/source_registry/verified_primary_pages.csv
          docs/sources/milano-operational-check-2026-09-16.md
          src/white_list_archive/parsers/milano_webapp.py
          src/white_list_archive/publishing/public_national_registry.py
          tests/public_portal_browser.cjs
          tests/test_milano_parser_semantics.py
          tests/test_operations.py
          tests/test_source_population_coverage.py
          EOF
          sed -i 's/^          //' /tmp/expected-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          for path in .github/workflows/milano-national-candidate.yml .github/workflows/milano-source-probe.yml .github/workflows/milano-finalise.yml tmp/fix_operations_priority_test.py tmp/milano_integrate_candidate.py tmp/milano_finalise.py; do
            test ! -e "$path"
          done
      - name: Prepare publication runtime
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source_file; do
            [ -n "$source_file" ] && sudo rm -f "$source_file"
          done < <(grep -rlE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '\|dl\.google\.com/linux/chrome|d;\|packages\.google\.com/chrome|d' /etc/apt/sources.list
          fi
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends poppler-utils; then
              break
            fi
            test "$attempt" -lt 3 || exit 1
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[dev,publication,database,storage]'
      - name: Run repository and Milano semantic tests
        run: |
          pytest -q
          pytest -q tests/test_milano_parser_semantics.py
          node --check tests/public_portal_browser.cjs
      - name: Build and validate final national boundary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/milano-final-national /tmp/milano-final-sources
          mkdir -p /tmp/milano-final-national
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/milano-final-sources \
            --registry-json /tmp/milano-final-national/registry.json \
            --registry-csv /tmp/milano-final-national/registry.csv \
            --prefectures-json /tmp/milano-final-national/prefectures.json \
            --prefectures-csv /tmp/milano-final-national/prefectures.csv
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from white_list_archive.acquisition.source_population_coverage import _read_csv, build_coverage
          root = Path('/tmp/milano-final-national')
          reg = json.loads((root / 'registry.json').read_text(encoding='utf-8'))
          pref = json.loads((root / 'prefectures.json').read_text(encoding='utf-8'))
          assert reg['meta']['record_count'] == len(reg['records']) == 54183
          assert reg['meta']['authority_count'] == 47
          assert reg['meta']['register_count'] == 48
          assert pref['meta']['authority_count'] == 106
          assert pref['meta']['published_count'] == 47
          assert pref['meta']['mapped_count'] == 47
          records = [r for r in reg['records'] if r['authority_key'] == 'milano']
          assert len(records) == 2618
          assert len({r['record_locator'] for r in records}) == 2618
          assert {r['source_key'] for r in records} == {'milano-combined'}
          assert Counter(r['source_status'] for r in records) == Counter({'listed': 939, 'renewal_update_in_progress': 517, 'pending': 1162})
          assert sum(bool(r['identifiers']) for r in records) == 2618
          assert all(r['requested_activities'] for r in records)
          assert sum(bool(r['application_date']) for r in records) == 1162
          assert sum(bool(r['observed_listing_date']) for r in records) == 939
          assert sum(bool(r['observed_expiry_date']) for r in records) == 939
          pending_16 = {(r['name'], r['identifier_field_raw']) for r in records if r['source_status'] == 'pending' and r['application_date'] == '2026-09-16'}
          assert pending_16 == {
              ('SV VERNICIATURE INDUSTRIALI S.R.L.', '02685280394'),
              ('G.B.C. INDUSTRIAL TOOLS SPA', '07639230155'),
              ('VERNIA SRL', '11967860153'),
              ('CARBON SUD TRASPORTI E SERVIZI S.R.L.', '14302100962'),
          }
          coverage = build_coverage(_read_csv(Path('data/source_registry/verified_primary_pages.csv')), _read_csv(Path('data/source_registry/source_series_inventory.csv')))
          assert coverage['verified_authority_count'] == 47
          assert coverage['register_scope_count'] == coverage['complete_register_scope_count'] == 48
          assert coverage['incomplete_register_scope_count'] == 0
          monitoring = json.loads(Path('data/monitoring/national_coverage.json').read_text(encoding='utf-8'))
          milano = [p for p in monitoring['prefectures'] if p['authority_key'] == 'milano']
          assert len(milano) == 1
          assert milano[0]['canonical_integration_validated'] is True
          assert milano[0]['durable_evidence_verified'] is False
          assert milano[0]['known_content_sha256'] == ['b360e209f3997894a3e7408e5be7f07d77cddca0c3490581ff3410218a02d9a8']
          print({'record_count': 54183, 'authority_count': 47, 'register_count': 48, 'published_count': 47, 'mapped_count': 47, 'milano_records': 2618, 'complete_register_scopes': 48})
          PY
      - name: Commit validated production-only finalisation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -A
          git commit -m 'chore(milano): finalise production integration'
          git diff --name-only origin/main...HEAD | sort > /tmp/committed-files.txt
          diff -u /tmp/expected-files.txt /tmp/committed-files.txt
          echo "FINAL_SHA=$(git rev-parse HEAD)"
          echo "MAIN_SHA=$(git rev-parse origin/main)"
          echo "AHEAD=$(git rev-list --count origin/main..HEAD)"
          echo "BEHIND=$(git rev-list --count HEAD..origin/main)"
      - name: Publish final branch checkpoint when permitted
        shell: bash
        run: |
          set +e
          branch='expansion/milano-2026-09-16'
          git push origin "HEAD:$branch"
          rc=$?
          echo "PUSH_EXIT=$rc"
          echo "FINAL_SHA=$(git rev-parse HEAD)"
          exit 0
