name: Cremona table probe 2026-09-18

on:
  push:
    branches:
      - expansion/cremona-2026-09-18
    paths:
      - .github/workflows/cremona-table-probe-2026-09-18.yml

permissions:
  contents: read

jobs:
  table-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install pdfplumber
        run: python -m pip install --quiet pdfplumber
      - name: Inspect tables
        shell: bash
        run: |
          set -euo pipefail
          URL='https://prefettura.interno.gov.it/sites/default/files/22/2026-09/white-list-elenchi-ditte_3.pdf'
          curl -fsSL -A 'Mozilla/5.0' -H 'Cache-Control: no-cache' "${URL}?probe=$(date +%s%N)" -o source.pdf
          python - <<'PY'
          import pdfplumber
          with pdfplumber.open('source.pdf') as pdf:
              print('pages',len(pdf.pages))
              for pn,page in enumerate(pdf.pages,1):
                  tables=page.extract_tables()
                  print('page',pn,'table_count',len(tables),'rows',[len(t) for t in tables])
                  for ti,table in enumerate(tables,1):
                      print('table',pn,ti,'columns',max((len(r) for r in table),default=0))
                      for row in table[:8]: print('row',repr(row))
          PY
