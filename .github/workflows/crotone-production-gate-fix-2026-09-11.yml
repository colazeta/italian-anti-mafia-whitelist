name: Crotone production gate fix 2026-09-11

on:
  push:
    branches: [expansion/crotone-2026-09-11]
    paths: [.github/workflows/crotone-production-gate-fix-2026-09-11.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/crotone-2026-09-11
      - name: Align section tracking with byte-pinned grouping audit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/white_list_archive/parsers/crotone_tables.py')
          text=p.read_text()
          old='''            if page_section is not None and (current_section is None or (nonempty and _is_header(nonempty[0]))):\n                current_section = page_section\n'''
          new='''            if page_section is not None:\n                current_section = page_section\n'''
          if old not in text:
              raise SystemExit('Crotone section-tracking anchor drift')
          p.write_text(text.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/white_list_archive/parsers/crotone_tables.py
          git commit -m 'Align Crotone section tracking with source audit'
          git push origin HEAD:expansion/crotone-2026-09-11
