name: Crotone production gate fix 2026-09-11

on:
  push:
    branches: [expansion/crotone-2026-09-11]
    paths: [.github/workflows/crotone-production-gate-fix-2026-09-11.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/crotone-2026-09-11
      - name: Repair monitoring collection key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/crotone-production-gate-2026-09-11.yml')
          text=p.read_text()
          old="rows=coverage.get('authorities',coverage if isinstance(coverage,list) else None)"
          new="rows=coverage.get('prefectures',coverage if isinstance(coverage,list) else None)"
          if old not in text:
              raise SystemExit('production gate coverage anchor drift')
          p.write_text(text.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/crotone-production-gate-2026-09-11.yml
          git commit -m 'Fix Crotone production gate coverage collection'
          git push origin HEAD:expansion/crotone-2026-09-11
