name: Imperia reviewed candidate staging 2026-09-19

on:
  push:
    branches:
      - expansion/imperia-2026-09-19
    paths:
      - .github/workflows/imperia-promote-candidate.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download successful reviewed finalizer artifact
        uses: actions/download-artifact@v4
        with:
          name: imperia-integration-finalizer
          path: /tmp/imperia-finalizer
          github-token: ${{ github.token }}
          run-id: 35431218016
      - name: Verify and checkpoint candidate as non-workflow blob
        shell: bash
        env:
          TARGET_BRANCH: expansion/imperia-2026-09-19
        run: |
          set -euo pipefail
          candidate=/tmp/imperia-finalizer/imperia-public-pages-candidate.yml
          test -s "$candidate"
          echo '971234893fb61946d2103256e68ad8203b2df8be8464e8090c5370c4a08b8437  '"$candidate" | sha256sum -c -
          mkdir -p tmp
          cp "$candidate" tmp/imperia-public-pages-candidate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tmp/imperia-public-pages-candidate.yml
          git diff --cached --check
          test "$(git diff --cached --name-only)" = 'tmp/imperia-public-pages-candidate.yml'
          git commit -m 'Checkpoint reviewed Imperia public workflow candidate'
          git push origin "HEAD:${TARGET_BRANCH}"
