name: Forli-Cesena source audit

on:
  push:
    branches:
      - expansion/forli-cesena-2026-09-13
    paths:
      - .github/workflows/forli-cesena-source-audit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forli-cesena-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/forli-cesena-2026-09-13
          fetch-depth: 0

      - name: Install PDF inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet 'pdfplumber>=0.11,<0.12'
          command -v pdfinfo
          command -v pdftotext

      - name: Fetch official PDF twice and checkpoint exact outcome
        shell: bash
        run: |
          set -u
          landing='https://prefettura.interno.gov.it/it/prefetture/forli-cesena/evidenza/white-list'
          url='https://prefettura.interno.gov.it/sites/default/files/44/2026-09/wlp-al-11-09-2026.pdf'
          expected_sha='f18e1980e6f7f5bc2ac55a55926ab7a221f290fc7a40f5d0781eef4885455468'
          mkdir -p tmp /tmp/forli_audit
          report='tmp/forli_cesena_source_audit.txt'
          : > "$report"
          printf '%s\n' 'authority_key=forli-cesena' "fetched_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "official_landing=$landing" "official_pdf=$url" 'edition_date=2026-09-11' "expected_sha256=$expected_sha" >> "$report"

          landing_code=$(curl -L -sS --connect-timeout 20 --max-time 90 --retry 2 --retry-delay 2 --retry-all-errors \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -c /tmp/forli_audit/cookies.txt -w '%{http_code}' -o /tmp/forli_audit/landing.html "$landing" \
            2>/tmp/forli_audit/landing.err || true)
          echo "landing_http_code=${landing_code:-curl_error}" >> "$report"

          for n in a b; do
            code=$(curl -L -sS --connect-timeout 20 --max-time 120 --retry 3 --retry-delay 2 --retry-all-errors \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
              -H 'Accept: application/pdf,application/octet-stream;q=0.9,*/*;q=0.8' -H "Referer: $landing" \
              -b /tmp/forli_audit/cookies.txt -w '%{http_code}' -o "/tmp/forli_audit/source_${n}.pdf" "$url" \
              2>"/tmp/forli_audit/source_${n}.err" || true)
            size=0; test -f "/tmp/forli_audit/source_${n}.pdf" && size=$(stat -c '%s' "/tmp/forli_audit/source_${n}.pdf")
            magic='missing'; test "$size" -gt 4 && magic=$(head -c 5 "/tmp/forli_audit/source_${n}.pdf" | tr -cd '[:print:]')
            echo "fetch_${n}_http_code=${code:-curl_error}" >> "$report"
            echo "fetch_${n}_bytes=$size" >> "$report"
            echo "fetch_${n}_magic=$magic" >> "$report"
          done

          valid_a=false; valid_b=false
          test -f /tmp/forli_audit/source_a.pdf && head -c 5 /tmp/forli_audit/source_a.pdf | grep -q '^%PDF-' && valid_a=true
          test -f /tmp/forli_audit/source_b.pdf && head -c 5 /tmp/forli_audit/source_b.pdf | grep -q '^%PDF-' && valid_b=true
          echo "valid_pdf_a=$valid_a" >> "$report"; echo "valid_pdf_b=$valid_b" >> "$report"

          if test "$valid_a" = true && test "$valid_b" = true; then
            sha_a=$(sha256sum /tmp/forli_audit/source_a.pdf | awk '{print $1}')
            sha_b=$(sha256sum /tmp/forli_audit/source_b.pdf | awk '{print $1}')
            identical=false; cmp -s /tmp/forli_audit/source_a.pdf /tmp/forli_audit/source_b.pdf && identical=true
            pinned=false; test "$sha_a" = "$expected_sha" && test "$sha_b" = "$expected_sha" && pinned=true
            echo "sha256_a=$sha_a" >> "$report"; echo "sha256_b=$sha_b" >> "$report"; echo "byte_identical=$identical" >> "$report"; echo "matches_pinned_sha=$pinned" >> "$report"
            echo "bytes=$(stat -c '%s' /tmp/forli_audit/source_a.pdf)" >> "$report"

            if test "$identical" = true && test "$pinned" = true; then
              pages=$(pdfinfo /tmp/forli_audit/source_a.pdf | awk '/^Pages:/ {print $2}')
              echo "pages=$pages" >> "$report"
              pdftotext -layout /tmp/forli_audit/source_a.pdf /tmp/forli_audit/source.txt
              text_sha=$(sha256sum /tmp/forli_audit/source.txt | awk '{print $1}')
              echo "layout_text_sha256=$text_sha" >> "$report"
              echo "layout_text_lines=$(wc -l < /tmp/forli_audit/source.txt | tr -d ' ')" >> "$report"

              for label in 'AVVIO ISTRUTTORIA' 'IN AGGIORNAMENTO' RINNOVO AGGIORNAMENTO ISCRITTA; do
                key=$(echo "$label" | tr '[:upper:] ' '[:lower:]_')
                count=$(grep -Eio "$label" /tmp/forli_audit/source.txt 2>/dev/null | wc -l | tr -d ' ' || true)
                echo "${key}_occurrences=${count:-0}" >> "$report"
              done

              ids=$(grep -Eo '(^|[^0-9])[0-9]{11}([^0-9]|$)' /tmp/forli_audit/source.txt 2>/dev/null | grep -Eo '[0-9]{11}' | sort -u | wc -l | tr -d ' ' || true)
              echo "unique_11_digit_tokens=${ids:-0}" >> "$report"
              echo 'capture_gate=BYTE_IDENTICAL_PINNED_AND_TEXT_EXTRACTED' >> "$report"

              printf '\n--- status-bearing lines (first 240) ---\n' >> "$report"
              grep -Ein -m 240 'AVVIO[[:space:]]+ISTRUTTORIA|IN[[:space:]]+AGGIORNAMENTO|RINNOVO|AGGIORNAMENTO|ISCRITTA' /tmp/forli_audit/source.txt >> "$report" || true
              printf '\n--- first 180 layout text lines ---\n' >> "$report"
              sed -n '1,180p' /tmp/forli_audit/source.txt >> "$report"
            elif test "$identical" != true; then
              echo 'capture_gate=PDF_FETCHED_BYTES_DIFFER' >> "$report"
            else
              echo 'capture_gate=PINNED_SHA_MISMATCH' >> "$report"
            fi
          else
            echo 'capture_gate=OFFICIAL_PDF_FETCH_UNAVAILABLE_FROM_GITHUB_RUNNER' >> "$report"
          fi
          cat "$report"

      - name: Audit pdfplumber table geometry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, re
          from collections import Counter
          from pathlib import Path
          import pdfplumber

          source = Path('/tmp/forli_audit/source_a.pdf')
          out = Path('tmp/forli_cesena_table_audit.txt')
          if not source.exists():
              out.write_text('table_gate=SOURCE_UNAVAILABLE\n', encoding='utf-8')
              raise SystemExit(0)

          def clean(v):
              return ' '.join(str(v or '').replace('\n', ' ').split())

          rows = []
          page_summaries = []
          headers = Counter()
          widths = Counter()
          table_counts = []
          status_cells = Counter()
          with pdfplumber.open(source) as pdf:
              for page in pdf.pages:
                  tables = page.extract_tables()
                  table_counts.append(len(tables))
                  page_summary = {'page': page.page_number, 'tables': len(tables), 'shapes': []}
                  for ti, table in enumerate(tables, 1):
                      cleaned = [[clean(c) for c in row] for row in table if row]
                      if not cleaned:
                          continue
                      widths.update(len(r) for r in cleaned)
                      header = tuple(c.casefold() for c in cleaned[0])
                      headers[header] += 1
                      page_summary['shapes'].append([len(cleaned), max(len(r) for r in cleaned)])
                      for ri, row in enumerate(cleaned):
                          joined = ' | '.join(row)
                          if re.search(r'AVVIO\s+ISTRUTTORIA|IN\s+AGGIORNAMENTO|RINNOVO|ISCRITT', joined, re.I):
                              status_cells[joined[-240:]] += 1
                          if ri > 0 and any(row):
                              rows.append((page.page_number, ti, ri, row))
                  page_summaries.append(page_summary)

          lines = []
          lines.append('pages=' + str(len(table_counts)))
          lines.append('table_counts_by_page=' + json.dumps(table_counts))
          lines.append('row_width_counts=' + json.dumps(dict(widths), sort_keys=True))
          lines.append('candidate_data_rows=' + str(len(rows)))
          lines.append('header_signatures=' + str(len(headers)))
          for header, count in headers.most_common(20):
              lines.append(f'header[{count}]=' + json.dumps(header, ensure_ascii=False))
          lines.append('page_summaries=' + json.dumps(page_summaries, ensure_ascii=False))
          lines.append('\n--- first 40 extracted data rows ---')
          for page, ti, ri, row in rows[:40]:
              lines.append(f'p{page}:t{ti}:r{ri}=' + json.dumps(row, ensure_ascii=False))
          lines.append('\n--- rows around status signals (first 80) ---')
          emitted = 0
          for page, ti, ri, row in rows:
              joined = ' | '.join(row)
              if re.search(r'AVVIO\s+ISTRUTTORIA|IN\s+AGGIORNAMENTO|RINNOVO|ISCRITT', joined, re.I):
                  lines.append(f'p{page}:t{ti}:r{ri}=' + json.dumps(row, ensure_ascii=False))
                  emitted += 1
                  if emitted >= 80:
                      break
          lines.append('\n--- status-bearing cell signatures ---')
          for value, count in status_cells.most_common(30):
              lines.append(f'{count}x {value}')
          out.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          cat tmp/forli_cesena_table_audit.txt

      - name: Commit audit checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/forli_cesena_source_audit.txt tmp/forli_cesena_table_audit.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Checkpoint Forli-Cesena table geometry audit'
          git push origin HEAD:expansion/forli-cesena-2026-09-13
