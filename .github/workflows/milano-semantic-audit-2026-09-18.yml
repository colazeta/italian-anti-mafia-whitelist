name: Milano semantic audit 2026-09-18
on:
  push:
    branches: [fix/milano-source-drift-2026-09-18]
    paths: [.github/workflows/milano-semantic-audit-2026-09-18.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -e '.[dev]'
      - name: Capture and compare
        run: |
          mkdir -p audit /tmp/milano
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' -A 'italian-anti-mafia-whitelist/0.1 (+milano-semantic-audit)' -o /tmp/milano/current.html "https://whitelist.prefmi.it/elenco/elenco.php?semantic_audit=${GITHUB_RUN_ID}"
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' -A 'italian-anti-mafia-whitelist/0.1 (+milano-semantic-audit)' -o /tmp/milano/registered.html "https://whitelist.prefmi.it/elenco/elenco_iscritte.php?semantic_audit=${GITHUB_RUN_ID}"
          python - <<'PY'
          import hashlib,json,re,urllib.request
          from pathlib import Path
          from collections import Counter
          import white_list_archive.parsers.milano_webapp as m

          def logical(path, allow_pending):
              tables=m._parse_tables(m._decode(Path(path)))
              assert len(tables)==10
              grouped={}; sector_rows=0
              for sec,table in enumerate(tables,1):
                  assert m._clean(table[0][0])==m._EXPECTED_SECTION_PREFIXES[sec-1]
                  assert tuple(m._clean(v) for v in table[1])==m._HEADER
                  for physical,cells in enumerate(table[2:],3):
                      if not any(m._clean(v) for v in cells): continue
                      sector_rows+=1
                      assert len(cells)==6
                      name,office,identifier,first,second,note=[m._clean(v) for v in cells]
                      assert name and office and identifier and m._STRICT_IDENTIFIER.fullmatch(identifier)
                      status,app,listing,expiry=m._status_and_dates(first,second)
                      assert allow_pending or status!='pending'
                      key=(m._normalise_text(name),identifier.upper(),m._normalise_address(office),status,app,listing,expiry,m._normalise_text(note))
                      g=grouped.setdefault(key,{'name':name,'office':office,'identifier':identifier.upper(),'status':status,'application_date':app,'listing_date':listing,'expiry_date':expiry,'note':note,'sections':[]})
                      assert sec not in g['sections']; g['sections'].append(sec)
              out={}
              for r in grouped.values():
                  r['sections'].sort(); assert r['identifier'] not in out; out[r['identifier']]=r
              return out,sector_rows

          cur,sector_rows=logical('/tmp/milano/current.html',True)
          reg,reg_sector_rows=logical('/tmp/milano/registered.html',False)
          assert {i for i,r in cur.items() if r['status']!='pending'}==set(reg)
          req=urllib.request.Request('https://colazeta.github.io/italian-anti-mafia-whitelist/data/registry.json?audit=20260918',headers={'User-Agent':'italian-anti-mafia-whitelist/0.1 (+milano-semantic-audit)','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=120) as f: public=json.load(f)
          prior={}
          for r in public['records']:
              if r.get('authority_key')!='milano' or r.get('source_key')!='milano-combined': continue
              mm=re.search(r':id-([A-Za-z0-9]+)$',r.get('record_locator','')); assert mm
              prior[mm.group(1).upper()]=r
          added=sorted(set(cur)-set(prior)); removed=sorted(set(prior)-set(cur))
          status=[]; semantic=[]
          for i in sorted(set(cur)&set(prior)):
              n,o=cur[i],prior[i]
              old_status=o.get('source_status','')
              if n['status']!=old_status:
                  status.append({'identifier':i,'name':n['name'],'from':old_status,'to':n['status'],'old_listing_date':o.get('observed_listing_date',''),'old_expiry_date':o.get('observed_expiry_date',''),'new_application_date':n['application_date'],'new_listing_date':n['listing_date'],'new_expiry_date':n['expiry_date']})
              old_sections=[]
              for s in o.get('source_fields',{}).get('sections',[]):
                  mm=re.search(r'(\d+)$',str(s));
                  if mm: old_sections.append(int(mm.group(1)))
              fields={
                'name':[o.get('name',''),n['name']],
                'office':[o.get('registered_office',''),n['office']],
                'application_date':[o.get('application_date',''),n['application_date']],
                'listing_date':[o.get('observed_listing_date',''),n['listing_date']],
                'expiry_date':[o.get('observed_expiry_date',''),n['expiry_date']],
                'note':[o.get('source_fields',{}).get('note',''),n['note']],
                'sections':[old_sections,n['sections']],
              }
              changed={k:v for k,v in fields.items() if v[0]!=v[1]}
              if changed: semantic.append({'identifier':i,'name':n['name'],'status_from':old_status,'status_to':n['status'],'changes':changed})
          result={
            'combined_sha256':hashlib.sha256(Path('/tmp/milano/current.html').read_bytes()).hexdigest(),
            'combined_bytes':Path('/tmp/milano/current.html').stat().st_size,
            'registered_sha256':hashlib.sha256(Path('/tmp/milano/registered.html').read_bytes()).hexdigest(),
            'registered_bytes':Path('/tmp/milano/registered.html').stat().st_size,
            'sector_rows':sector_rows,'registered_sector_rows':reg_sector_rows,
            'prior_total':len(prior),'current_total':len(cur),'registered_total':len(reg),
            'prior_status_counts':dict(Counter(r.get('source_status','') for r in prior.values())),
            'current_status_counts':dict(Counter(r['status'] for r in cur.values())),
            'logical_nonblank_notes':sum(bool(r['note']) for r in cur.values()),
            'added':[cur[i] for i in added],
            'removed':[{'identifier':i,'name':prior[i].get('name',''),'status':prior[i].get('source_status','')} for i in removed],
            'status_changes':status,
            'semantic_changes':semantic,
            'cross_view_identity_match':True,
          }
          Path('audit/semantic-delta.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: milano-semantic-audit-2026-09-18
          path: audit/semantic-delta.json
          retention-days: 1
