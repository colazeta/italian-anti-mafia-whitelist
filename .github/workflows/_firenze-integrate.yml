name: Firenze bounded integration helper

on:
  push:
    branches:
      - expansion/firenze-2026-09-18

permissions:
  contents: write

jobs:
  finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stage reviewed Firenze public boundary
        shell: bash
        run: |
          set -euo pipefail
          python tmp/firenze_finalise.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staging/firenze-public-pages.yml tests/public_portal_browser.cjs
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No staging delta to persist.'
            exit 0
          fi
          git commit -m 'Stage Firenze public portal assertions'
          git push origin HEAD:expansion/firenze-2026-09-18
