name: Cremona status probe 2026-09-18

on:
  push:
    branches:
      - expansion/cremona-2026-09-18
    paths:
      - .github/workflows/cremona-status-probe-2026-09-18.yml

permissions:
  contents: read

jobs:
  probe-statuses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Count current source states
        shell: bash
        run: |
          set -euo pipefail
          URL='https://prefettura.interno.gov.it/sites/default/files/22/2026-09/white-list-elenchi-ditte_3.pdf'
          curl -fsSL -A 'Mozilla/5.0' -H 'Cache-Control: no-cache' "${URL}?probe=$(date +%s%N)" -o source.pdf
          echo "sha256=$(sha256sum source.pdf | cut -d' ' -f1) bytes=$(wc -c < source.pdf)"
          pdftotext -layout source.pdf source.txt
          python - <<'PY'
          import re
          from collections import Counter
          lines=open('source.txt',encoding='utf-8',errors='replace').read().splitlines()
          starts=[]
          for i,line in enumerate(lines):
              m=re.match(r'^\s*(\d{1,3})\s+',line)
              if m:
                  n=int(m.group(1))
                  if 1 <= n <= 187:
                      starts.append((i,n))
          print('start_count',len(starts))
          print('sequence_ok',[n for _,n in starts]==list(range(1,188)))
          counts=Counter()
          examples={}
          for j,(pos,n) in enumerate(starts):
              end=starts[j+1][0] if j+1<len(starts) else len(lines)
              b='\n'.join(lines[pos:end]).upper()
              pending=('ISCRITTO ELENCO RICHIEDENTI' in b and 'IN ISTRUTTORIA' in b)
              renewal=('FATTA ISTANZA A PERMANERE' in b or 'FATTA ISTANZA A PERAMERE' in b)
              generic=('FATTA ISTANZA IN DATA' in b and not renewal)
              dates=re.findall(r'\b\d{2}/\d{2}/\d{4}\b',b)
              if pending: counts['pending']+=1
              elif renewal: counts['renewal']+=1
              elif generic: counts['generic_application']+=1
              elif len(dates)>=2: counts['dated_listed']+=1
              else: counts['unclassified']+=1
              if pending and 'pending' not in examples: examples['pending']=(n,b)
              if renewal and 'renewal' not in examples: examples['renewal']=(n,b)
              if generic and 'generic' not in examples: examples['generic']=(n,b)
              if not pending and not renewal and not generic and len(dates)<2 and 'unclassified' not in examples: examples['unclassified']=(n,b)
          print('counts',dict(counts))
          for k,v in examples.items(): print('example',k,v[0],repr(v[1]))
          print('permanere_tokens',sum('FATTA ISTANZA A PERMANERE' in x.upper() for x in lines))
          print('peramere_tokens',sum('FATTA ISTANZA A PERAMERE' in x.upper() for x in lines))
          print('generic_istanza_tokens',sum('FATTA ISTANZA IN DATA' in x.upper() for x in lines))
          PY
