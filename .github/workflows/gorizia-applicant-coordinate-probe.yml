name: Gorizia parser invariant probe

on:
  push:
    branches:
      - expansion/gorizia-2026-09-13
    paths:
      - .github/workflows/gorizia-applicant-coordinate-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: expansion/gorizia-2026-09-13

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit exact parser grouping and blank-expiry evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from collections import Counter, defaultdict
          from pathlib import Path

          listed = json.loads(Path('tmp/gorizia_listed_tables.json').read_text(encoding='utf-8'))

          def clean(value):
              return re.sub(r'\s+', ' ', value or '').strip()

          sector_rows = []
          for table in listed:
              section = int(table['table'])
              for item in table['rows'][1:]:
                  values = [clean(v) for v in item['physical_cells']]
                  if not any(values):
                      continue
                  if len(values) != 7:
                      raise RuntimeError(f"section {section} row {item['row']} physical width drift: {values!r}")
                  name, office, secondary, identifier_raw, listing_raw, expiry_raw, update_raw = values
                  sector_rows.append({
                      'section': section,
                      'source_row': item['row'],
                      'name': name,
                      'office': office,
                      'secondary': secondary,
                      'identifier_raw': identifier_raw,
                      'listing_raw': listing_raw,
                      'expiry_raw': expiry_raw,
                      'update_raw': update_raw,
                  })

          grouped = defaultdict(list)
          for row in sector_rows:
              key = (
                  row['name'], row['office'], row['secondary'], row['identifier_raw'],
                  row['listing_raw'], row['expiry_raw'],
              )
              grouped[key].append(row)

          status_counts = Counter()
          for members in grouped.values():
              status_counts['renewal_update_in_progress' if any(m['update_raw'] for m in members) else 'listed'] += 1

          blank_rows = [row for row in sector_rows if not row['expiry_raw']]
          by_sig = defaultdict(list)
          for row in blank_rows:
              sig = (row['name'], row['office'], row['identifier_raw'], row['listing_raw'])
              by_sig[sig].append(row)

          blank_signatures = []
          for sig, members in by_sig.items():
              blank_signatures.append({
                  'name': sig[0],
                  'office': sig[1],
                  'identifier_raw': sig[2],
                  'listing_raw': sig[3],
                  'sections': sorted({m['section'] for m in members}),
                  'source_rows': sorted([[m['section'], m['source_row']] for m in members]),
              })

          mixed_updates = []
          for key, members in grouped.items():
              updates = sorted({m['update_raw'] for m in members})
              if len(updates) > 1:
                  mixed_updates.append({
                      'name': key[0],
                      'identifier_raw': key[3],
                      'listing_raw': key[4],
                      'expiry_raw': key[5],
                      'update_values': updates,
                      'sections': sorted({m['section'] for m in members}),
                  })

          print(json.dumps({
              'sector_rows': len(sector_rows),
              'parser_registration_groups': len(grouped),
              'parser_status_counts': dict(status_counts),
              'blank_sector_row_count': len(blank_rows),
              'blank_unique_signature_count': len(blank_signatures),
              'blank_signatures': blank_signatures,
              'mixed_update_group_count': len(mixed_updates),
              'mixed_update_groups': mixed_updates,
          }, ensure_ascii=False, indent=2))
          PY
