name: National ANNCSU orchestration validation

on:
  pull_request:
    paths:
      - 'src/white_list_archive/acquisition/anncsu.py'
      - 'src/white_list_archive/acquisition/istat_municipalities.py'
      - 'src/white_list_archive/geocoding/anncsu_*.py'
      - 'src/white_list_archive/geocoding/country_routing.py'
      - 'src/white_list_archive/geocoding/italian_address.py'
      - 'db/schema/059_address_normalisation.sql'
      - 'db/schema/061_anncsu_orchestration.sql'
      - 'db/seeds/015_geo_lookup_values.sql'
      - 'db/apply.sql'
      - 'db/test.sql'
      - 'db/tests/010_anncsu_orchestration.sql'
      - 'data/publication/multi_prefecture_pilot.json'
      - 'scripts/validate_national_anncsu.py'
      - 'scripts/validate_national_anncsu_with_retries.py'
      - 'pyproject.toml'
      - '.github/workflows/anncsu-national-validation.yml'
  push:
    branches: [main]
    paths:
      - 'src/white_list_archive/acquisition/anncsu.py'
      - 'src/white_list_archive/acquisition/istat_municipalities.py'
      - 'src/white_list_archive/geocoding/anncsu_*.py'
      - 'src/white_list_archive/geocoding/country_routing.py'
      - 'src/white_list_archive/geocoding/italian_address.py'
      - 'db/schema/059_address_normalisation.sql'
      - 'db/schema/061_anncsu_orchestration.sql'
      - 'db/seeds/015_geo_lookup_values.sql'
      - 'db/apply.sql'
      - 'db/test.sql'
      - 'db/tests/010_anncsu_orchestration.sql'
      - 'data/publication/multi_prefecture_pilot.json'
      - 'scripts/validate_national_anncsu.py'
      - 'scripts/validate_national_anncsu_with_retries.py'
      - 'pyproject.toml'
      - '.github/workflows/anncsu-national-validation.yml'
  workflow_dispatch:

concurrency:
  group: anncsu-national-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multi-region-live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: whitelist
          POSTGRES_USER: whitelist
          POSTGRES_PASSWORD: whitelist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whitelist -d whitelist"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      PGPASSWORD: whitelist
      TEST_DSN: postgresql://whitelist:whitelist@localhost:5432/whitelist

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install project and database utilities
        run: |
          python -m pip install -e '.[dev,database]'
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client poppler-utils
          pytest -q tests/test_national_anncsu.py tests/test_anncsu_acquisition.py tests/test_anncsu_linkage.py tests/test_address_country_routing.py

      - name: Acquire frozen Istat municipality reference
        run: |
          mkdir -p artifacts/national-anncsu/istat
          white-list-istat-municipalities-acquire \
            --output-dir artifacts/national-anncsu/istat \
            --expected-sha256 83842076860450f7e482daecea6b7a769f5f93d0bf5b0d48802b44896d7a26d5 \
            > artifacts/national-anncsu/istat-acquisition.json
          ISTAT_CSV=$(find artifacts/national-anncsu/istat -maxdepth 1 -name 'istat-municipalities-*.csv' -print -quit)
          ISTAT_MANIFEST=$(find artifacts/national-anncsu/istat -maxdepth 1 -name 'istat-municipalities-*.manifest.json' -print -quit)
          test -n "$ISTAT_CSV" && test -n "$ISTAT_MANIFEST"
          echo "ISTAT_CSV=$ISTAT_CSV" >> "$GITHUB_ENV"
          echo "ISTAT_MANIFEST=$ISTAT_MANIFEST" >> "$GITHUB_ENV"

      - name: Apply database schema and integrity tests
        run: |
          psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -f db/apply.sql
          psql -h localhost -U whitelist -d whitelist -v ON_ERROR_STOP=1 -f db/test.sql

      - name: Validate official catalogue and two-region incremental orchestration
        run: |
          python scripts/validate_national_anncsu_with_retries.py \
            --dsn "$TEST_DSN" \
            --istat-csv "$ISTAT_CSV" \
            --istat-manifest "$ISTAT_MANIFEST" \
            --source-config data/publication/multi_prefecture_pilot.json \
            --artifact-dir artifacts/national-anncsu \
            --cache-dir /tmp/anncsu-national-cache

      - name: Remove bulky reference input from review artifact
        if: always()
        run: |
          rm -rf artifacts/national-anncsu/istat
          rm -f artifacts/national-anncsu/istat-acquisition.json

      - name: Upload national ANNCSU validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: national-anncsu-validation-attempt-${{ github.run_attempt }}
          path: artifacts/national-anncsu/
          if-no-files-found: warn
          retention-days: 30
