name: Padova source anomaly audit

on:
  push:
    branches:
      - expansion/padova-2026-09-14
    paths:
      - .github/workflows/padova-pdf-structure.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install 'pdfplumber>=0.11,<0.12'
      - name: Fetch and pin official Padova PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/padova-audit
          fetch_twice() {
            local label="$1" url="$2" expected_size="$3" expected_sha="$4"
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 "$url" -o "tmp/padova-audit/${label}.a.pdf"
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 "$url" -o "tmp/padova-audit/${label}.b.pdf"
            cmp "tmp/padova-audit/${label}.a.pdf" "tmp/padova-audit/${label}.b.pdf"
            test "$(wc -c < "tmp/padova-audit/${label}.a.pdf")" -eq "$expected_size"
            printf '%s  %s\n' "$expected_sha" "tmp/padova-audit/${label}.a.pdf" | sha256sum -c -
            mv "tmp/padova-audit/${label}.a.pdf" "tmp/padova-audit/${label}.pdf"
            rm "tmp/padova-audit/${label}.b.pdf"
          }
          fetch_twice listed 'https://prefettura.interno.gov.it/sites/default/files/75/2026-08/elenco-imprese-iscritte.pdf' 1411878 d140451c7a091e7df497f49465177ba012422917d2031c24df676e76dd909289
          fetch_twice applicants 'https://prefettura.interno.gov.it/sites/default/files/75/2026-08/elenco-imprese-richiedenti.pdf' 343755 b2cce4c2d34db016a7b84ac83f71032acdf319c020e1bf881d923ef1d45601a3
      - name: Inspect exact anomalies and chronology
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee tmp/padova-audit/anomalies.txt
          from datetime import datetime
          from pathlib import Path
          import json
          import pdfplumber

          root = Path('tmp/padova-audit')
          def clean(v): return ' '.join((v or '').split())
          def rows_for(pdf):
              out=[]
              for pno,page in enumerate(pdf.pages,1):
                  tables=page.extract_tables() or []
                  assert len(tables)==1,(pno,len(tables))
                  for rno,row in enumerate(tables[0] or [],1):
                      c=[clean(x) for x in row]
                      if not any(c) or c[0]=='Ragione Sociale': continue
                      assert len(c)==17,(pno,rno,len(c),c)
                      out.append((pno,rno,c))
              return out
          def dt(s): return datetime.strptime(s,'%d/%m/%Y').date()

          with pdfplumber.open(root/'listed.pdf') as pdf:
              rows=rows_for(pdf)
              assert len(rows)==831
              print('LISTED_TARGETS')
              for target in (108,479):
                  for ordinal in range(target-1,target+2):
                      pno,rno,c=rows[ordinal-1]
                      print(json.dumps({'ordinal':ordinal,'page':pno,'row':rno,'cells':c},ensure_ascii=False))
              chrono=[]
              unusual=[]
              for ordinal,(pno,rno,c) in enumerate(rows,1):
                  try: start,end=dt(c[14]),dt(c[15])
                  except Exception: continue
                  delta=(end-start).days
                  if end < start: chrono.append([ordinal,pno,c[0],c[14],c[15],delta,c[16]])
                  if delta < 300 or delta > 400: unusual.append([ordinal,pno,c[0],c[14],c[15],delta,c[16]])
              print('LISTED_EXPIRY_BEFORE_LISTING',json.dumps(chrono,ensure_ascii=False))
              print('LISTED_UNUSUAL_DATE_SPANS_LT300_OR_GT400',json.dumps(unusual,ensure_ascii=False))
              for page_no in (14,61):
                  page=pdf.pages[page_no-1]
                  print(f'LISTED_PAGE_{page_no}_TEXT',json.dumps(page.extract_text() or '',ensure_ascii=False))
                  page.to_image(resolution=180).save(root/f'listed-page-{page_no}.png')

          with pdfplumber.open(root/'applicants.pdf') as pdf:
              rows=rows_for(pdf)
              assert len(rows)==174
              print('APPLICANT_TARGETS')
              for target in (38,39,113):
                  for ordinal in range(max(1,target-2),min(len(rows),target+2)+1):
                      pno,rno,c=rows[ordinal-1]
                      print(json.dumps({'target':target,'ordinal':ordinal,'page':pno,'row':rno,'cells':c},ensure_ascii=False))
              for page_no in (5,11):
                  page=pdf.pages[page_no-1]
                  print(f'APPLICANT_PAGE_{page_no}_TEXT',json.dumps(page.extract_text() or '',ensure_ascii=False))
                  words=page.extract_words(x_tolerance=1,y_tolerance=1,keep_blank_chars=False,use_text_flow=False)
                  print(f'APPLICANT_PAGE_{page_no}_WORDS',json.dumps(words,ensure_ascii=False))
                  page.to_image(resolution=180).save(root/f'applicants-page-{page_no}.png')
          PY
      - name: Upload targeted visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: padova-source-anomaly-audit
          path: |
            tmp/padova-audit/anomalies.txt
            tmp/padova-audit/listed-page-*.png
            tmp/padova-audit/applicants-page-*.png
          if-no-files-found: error
          retention-days: 3
