name: Potenza national candidate (temporary)

on:
  push:
    branches:
      - expansion/potenza-2026-09-15
    paths:
      - .github/workflows/potenza-national-candidate.yml
      - tmp/potenza_integrate_candidate.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: potenza-national-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply candidate transaction in the runner worktree
        run: python tmp/potenza_integrate_candidate.py

      - name: Enforce exact candidate integration diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          data/monitoring/national_coverage.json
          data/publication/multi_prefecture_pilot.json
          data/source_registry/source_series_inventory.csv
          src/white_list_archive/publishing/public_national_registry.py
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Prepare publication runtime
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source_file; do
            [ -n "$source_file" ] && sudo rm -f "$source_file"
          done < <(grep -rlE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '\|dl\.google\.com/linux/chrome|d;\|packages\.google\.com/chrome|d' /etc/apt/sources.list
          fi
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && \
               sudo apt-get install -y --no-install-recommends poppler-utils; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Publication runtime package installation failed after bounded retries" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[dev,publication,database,storage]'

      - name: Run full repository and Potenza semantic tests
        run: |
          pytest -q
          pytest -q tests/test_potenza_parser_semantics.py

      - name: Build actual national candidate
        run: |
          rm -rf /tmp/potenza-national-candidate /tmp/potenza-national-sources
          mkdir -p /tmp/potenza-national-candidate
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/potenza-national-sources \
            --registry-json /tmp/potenza-national-candidate/registry.json \
            --registry-csv /tmp/potenza-national-candidate/registry.csv \
            --prefectures-json /tmp/potenza-national-candidate/prefectures.json \
            --prefectures-csv /tmp/potenza-national-candidate/prefectures.csv

      - name: Validate actual national and Potenza denominators
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root = Path('/tmp/potenza-national-candidate')
          reg = json.loads((root / 'registry.json').read_text(encoding='utf-8'))
          pref = json.loads((root / 'prefectures.json').read_text(encoding='utf-8'))

          assert reg['meta']['record_count'] == len(reg['records']) == 51088
          assert reg['meta']['authority_count'] == 45
          assert reg['meta']['register_count'] == 46
          assert pref['meta']['authority_count'] == 106
          assert pref['meta']['published_count'] == 45
          assert pref['meta']['mapped_count'] == 47

          potenza_pref = [x for x in pref['prefectures'] if x.get('authority_key') == 'potenza']
          assert len(potenza_pref) == 1
          assert potenza_pref[0]['mapped'] and potenza_pref[0]['published']
          assert potenza_pref[0]['series_count'] == 1

          records = [r for r in reg['records'] if r['authority_key'] == 'potenza']
          assert len(records) == 1034
          assert len({r['record_locator'] for r in records}) == 1034
          assert all(r['source_key'] == 'potenza-combined' for r in records)
          assert Counter(r['source_status'] for r in records) == Counter({
              'renewal_update_in_progress': 442,
              'pending': 375,
              'listed': 217,
          })
          assert sum(bool(r['identifiers']) for r in records) == 1033
          assert sum(bool(r['identifier_field_raw']) and not r['identifiers'] for r in records) == 1
          assert sum(bool(r['application_date']) for r in records) == 1034
          assert sum(bool(r['observed_listing_date']) for r in records) == 659
          assert sum(bool(r['observed_expiry_date']) for r in records) == 659
          assert sum(bool(r['requested_activities']) for r in records) == 0
          assert all(r['parser_name'] == 'potenza_combined' and r['parser_version'] == '2' for r in records)
          assert all(r['source_fields']['physical_locator'].startswith('source-id:') for r in records)
          assert sum(bool(r['source_fields']['notes']) for r in records) == 1
          edge = [r for r in records if r['source_fields']['physical_locator'] == 'source-id:903']
          assert len(edge) == 1
          assert edge[0]['name'] == 'GAP S.R.L.S.'
          assert edge[0]['source_status'] == 'renewal_update_in_progress'
          assert edge[0]['observed_listing_date'] == '2024-11-28'
          assert edge[0]['observed_expiry_date'] == '2025-11-28'
          assert edge[0]['source_fields']['in_aggiornamento'] == '1'

          print({
              'record_count': reg['meta']['record_count'],
              'authority_count': reg['meta']['authority_count'],
              'register_count': reg['meta']['register_count'],
              'published_count': pref['meta']['published_count'],
              'mapped_count': pref['meta']['mapped_count'],
              'potenza_records': len(records),
          })
          PY

      - name: Recheck exact production transaction
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > /tmp/actual-files-final.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files-final.txt

      - name: Commit validated production integration
        shell: bash
        env:
          BRANCH: expansion/potenza-2026-09-15
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Remote branch advanced during candidate transaction: $remote_sha != $GITHUB_SHA" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            src/white_list_archive/publishing/public_national_registry.py
          git commit -m 'feat(potenza): integrate current White List coverage'
          git push origin "HEAD:$BRANCH"
