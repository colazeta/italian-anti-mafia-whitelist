name: One-shot Agrigento branch reconciliation

on:
  push:
    branches:
      - expansion/agrigento-2026-09-10
    paths:
      - '.github/workflows/agrigento-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Agrigento branch with history
        uses: actions/checkout@v4
        with:
          ref: expansion/agrigento-2026-09-10
          fetch-depth: 0
      - name: Reconcile current main and Agrigento scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git show HEAD:data/publication/multi_prefecture_pilot.json > /tmp/agrigento-config.json
          git show HEAD:data/monitoring/national_coverage.json > /tmp/agrigento-coverage.json

          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_code=$?
          set -e
          if [ "$merge_code" -ne 0 ] && ! git diff --name-only --diff-filter=U | grep -q .; then
            echo "Merge failed without ordinary content conflicts" >&2
            exit "$merge_code"
          fi

          # Publication configuration: current main is authoritative for all
          # existing Prefectures (including the Aosta transition). Add only the
          # two already validated Agrigento source-series objects from the
          # pre-merge branch snapshot.
          if git diff --name-only --diff-filter=U | grep -qx 'data/publication/multi_prefecture_pilot.json'; then
            git checkout --theirs -- data/publication/multi_prefecture_pilot.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          current_path = Path('data/publication/multi_prefecture_pilot.json')
          agr_path = Path('/tmp/agrigento-config.json')
          current = json.loads(current_path.read_text(encoding='utf-8'))
          agr = json.loads(agr_path.read_text(encoding='utf-8'))
          agr_sources = [s for s in agr['sources'] if s.get('authority_key') == 'agrigento']
          assert {s['source_key'] for s in agr_sources} == {'agrigento-listed', 'agrigento-applicants'}
          current['sources'] = [s for s in current['sources'] if s.get('authority_key') != 'agrigento'] + agr_sources
          current_path.write_text(json.dumps(current, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git add data/publication/multi_prefecture_pilot.json

          # Coverage ledger: preserve current-main state for every authority,
          # replacing only Agrigento with the validated branch checkpoint.
          if git diff --name-only --diff-filter=U | grep -qx 'data/monitoring/national_coverage.json'; then
            git checkout --theirs -- data/monitoring/national_coverage.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          current_path = Path('data/monitoring/national_coverage.json')
          agr_path = Path('/tmp/agrigento-coverage.json')
          current = json.loads(current_path.read_text(encoding='utf-8'))
          agr = json.loads(agr_path.read_text(encoding='utf-8'))
          agr_entry = next(p for p in agr['prefectures'] if p.get('authority_key') == 'agrigento')
          idx = next(i for i,p in enumerate(current['prefectures']) if p.get('authority_key') == 'agrigento')
          current['prefectures'][idx] = agr_entry
          current_path.write_text(json.dumps(current, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git add data/monitoring/national_coverage.json

          # The Agrigento portal workflow is the branch's validated version;
          # only the national total changes because Aosta now contributes one
          # fewer observation on current main (8,822 + 1,161 = 9,983).
          if git diff --name-only --diff-filter=U | grep -qx '.github/workflows/public-pages.yml'; then
            git checkout --ours -- .github/workflows/public-pages.yml
          fi
          sed -i 's/9984/9983/g' .github/workflows/public-pages.yml
          git add .github/workflows/public-pages.yml

          # Preserve current-main browser acceptance coverage and extend it for
          # Agrigento without inventing source-status distributions.
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/public_portal_browser.cjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace("assert.ok(labels.includes('White List ordinaria · Prefettura di Asti'));", "assert.ok(labels.includes('White List ordinaria · Prefettura di Asti'));\n      assert.ok(labels.includes('White List ordinaria · Prefettura di Agrigento'));", 1)
          text = text.replace('assert.equal(stats.total,8822);', 'assert.equal(stats.total,9983);', 1)
          anchor = "      assert.deepEqual(statusCounts(asti),{listed:287,other_or_unknown:1,pending:13});\n"
          addition = anchor + "      const agrigento=registry.records.filter(r=>r.authority_key==='agrigento');\n      assert.equal(agrigento.length,1161);\n      assert.equal(agrigento.filter(r=>r.source_key==='agrigento-listed').length,855);\n      assert.equal(agrigento.filter(r=>r.source_key==='agrigento-applicants').length,306);\n"
          if "const agrigento=registry.records.filter" not in text:
              assert anchor in text
              text = text.replace(anchor, addition, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git add tests/public_portal_browser.cjs

          unresolved=$(git diff --name-only --diff-filter=U)
          if [ -n "$unresolved" ]; then
            echo "Unresolved merge paths remain:" >&2
            echo "$unresolved" >&2
            exit 1
          fi

          # The one-shot workflow must not survive into the reviewed PR tree.
          git rm -f .github/workflows/agrigento-reconcile.yml
          git status --short
          git commit -m "Merge current main into Agrigento expansion"
          git push origin HEAD:expansion/agrigento-2026-09-10
