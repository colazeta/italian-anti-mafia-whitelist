name: Benevento expansion diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install -e '.[publication]'
      - name: Validate current Benevento sources and parser
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, html.parser, json, urllib.parse, urllib.request
          from pathlib import Path
          from white_list_archive.parsers.benevento_positioned import parse_applicants, parse_listed

          sources={
            'listed':('https://prefettura.interno.gov.it/it/prefetture/benevento/white-list-elenco-imprese-iscritte','a0e260f748d3447cf17378e15e3466ec93ca72b7da1f6a7b1e1144c11ba28c01',734,parse_listed),
            'applicant':('https://prefettura.interno.gov.it/it/prefetture/benevento/white-list-elenco-imprese-richiedenti','7e7333af70cef53e10e8c9d269cb6d5a70a88f33871630606b6cd06b1c2f5cac',202,parse_applicants),
          }
          class L(html.parser.HTMLParser):
            def __init__(self): super().__init__(); self.links=[]; self.h=None; self.t=[]
            def handle_starttag(self,tag,attrs):
              if tag=='a': self.h=dict(attrs).get('href'); self.t=[]
            def handle_data(self,d):
              if self.h is not None: self.t.append(d)
            def handle_endtag(self,tag):
              if tag=='a' and self.h is not None:
                self.links.append((self.h,' '.join(''.join(self.t).split()))); self.h=None; self.t=[]
          def get(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'italian-anti-mafia-whitelist/0.1','Accept':'*/*'}),timeout=45) as r:return r.read()
          def resolve(page):
            p=L(); p.feed(get(page).decode('utf-8','replace')); c=[]
            for h,t in p.links:
              a=urllib.parse.urljoin(page,h); f=(t+' '+h).casefold()
              if ('31 agosto 2026' in f or '31.08.2026' in f or '31082026' in f) and '.pdf' in f:c.append(a)
            if len(c)!=1: raise RuntimeError(f'expected exactly one current official resource, got {len(c)}')
            return c[0]
          for population,(page,expected_sha,expected_rows,parser) in sources.items():
            resource=resolve(page); body=get(resource); actual=hashlib.sha256(body).hexdigest()
            if actual!=expected_sha: raise RuntimeError(f'{population}: source hash changed: {actual}')
            path=Path('/tmp')/f'benevento-{population}.pdf'; path.write_bytes(body)
            cfg={'source_key':f'benevento-{population}','authority_key':'benevento','authority_name':'Prefettura di Benevento','register_key':'benevento-ordinary','register_name':'White List ordinaria','population_scope':population,'reference_date':'2026-08-31','source_page_url':page,'resource_url':resource,'sha256':actual}
            batch=parser(path,cfg)
            if len(batch.records)!=expected_rows: raise RuntimeError(f'{population}: expected {expected_rows} rows, got {len(batch.records)}')
            if len({r['record_locator'] for r in batch.records})!=expected_rows: raise RuntimeError(f'{population}: duplicate record locator')
            summary={k:v for k,v in batch.diagnostics.items() if k not in {'page_rows'}}
            summary['page_rows']=batch.diagnostics['page_rows']
            print(population,json.dumps(summary,ensure_ascii=False,sort_keys=True))
          PY
