name: Benevento expansion diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install -e '.[publication]'
      - name: Inspect current Benevento table geometry
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, html.parser, re, urllib.parse, urllib.request
          from pathlib import Path
          import pdfplumber

          pages={
            'listed':'https://prefettura.interno.gov.it/it/prefetture/benevento/white-list-elenco-imprese-iscritte',
            'applicant':'https://prefettura.interno.gov.it/it/prefetture/benevento/white-list-elenco-imprese-richiedenti',
          }
          class L(html.parser.HTMLParser):
            def __init__(self): super().__init__(); self.links=[]; self.h=None; self.t=[]
            def handle_starttag(self,tag,attrs):
              if tag=='a': self.h=dict(attrs).get('href'); self.t=[]
            def handle_data(self,d):
              if self.h is not None: self.t.append(d)
            def handle_endtag(self,tag):
              if tag=='a' and self.h is not None:
                self.links.append((self.h,' '.join(''.join(self.t).split()))); self.h=None; self.t=[]
          def get(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'italian-anti-mafia-whitelist/0.1','Accept':'*/*'}),timeout=45) as r:return r.read()
          def resolve(u):
            p=L(); p.feed(get(u).decode('utf-8','replace')); c=[]
            for h,t in p.links:
              a=urllib.parse.urljoin(u,h); f=(t+' '+h).casefold()
              if ('31 agosto 2026' in f or '31.08.2026' in f or '31082026' in f) and '.pdf' in f:c.append(a)
            if len(c)!=1: raise SystemExit(f'expected one current resource, got {len(c)}')
            return c[0]
          for label,page in pages.items():
            url=resolve(page); body=get(url); path=Path('/tmp/'+label+'.pdf'); path.write_bytes(body)
            print(label,'sha256',hashlib.sha256(body).hexdigest(),'resource',url)
            with pdfplumber.open(path) as pdf:
              p=pdf.pages[0]; tables=p.find_tables()
              print(label,'table_count',len(tables))
              for ti,table in enumerate(tables):
                extracted=table.extract()
                print(label,'table',ti,'bbox',tuple(round(x,2) for x in table.bbox),'rows',len(table.rows))
                for ri,(row,cells_text) in enumerate(zip(table.rows,extracted)):
                  folded=' '.join(str(x or '') for x in cells_text).casefold()
                  if ri<3 or 'ragione' in folded:
                    print(label,'row',ri,'cell_bboxes',[None if c is None else tuple(round(x,2) for x in c) for c in row.cells])
                    print(label,'row',ri,'semantic',[sorted({k for k in ('ragione','sede','codice','partita','iscrizione','scadenza','istanza','data','note') if k in str(v or '').casefold()}) for v in cells_text])
              # Aggregate primary-date centres and exact x extents, no row text.
              words=p.extract_words(x_tolerance=1,y_tolerance=2,keep_blank_chars=False)
              dates=[w for w in words if re.fullmatch(r'\d{1,2}[./-]\d{1,2}[./-]\d{4}',w['text'])]
              ids=[w for w in words if re.fullmatch(r'(?:\d{11}|[A-Z0-9]{16})',w['text'].upper())]
              print(label,'first_page_date_boxes',[(round(w['x0'],1),round(w['x1'],1),round(w['top'],1)) for w in dates])
              print(label,'first_page_id_boxes',[(round(w['x0'],1),round(w['x1'],1),round(w['top'],1)) for w in ids])
          PY
