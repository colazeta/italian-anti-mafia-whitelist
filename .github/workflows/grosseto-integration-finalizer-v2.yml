name: Grosseto integration finalizer v2 2026-09-19

on:
  push:
    branches:
      - expansion/grosseto-2026-09-19
    paths:
      - .github/workflows/grosseto-integration-finalizer-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify branch base and Grosseto-only pre-finalization scope
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "expansion/grosseto-2026-09-19"
          git fetch origin main
          test "$(git rev-list --count HEAD..origin/main)" = "0"
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/grosseto-.*|tmp/grosseto-.*|src/white_list_archive/parsers/grosseto_openxml.py|tests/test_grosseto_parser_semantics.py)$' | grep -q .; then
            echo 'Unexpected pre-finalization file outside Grosseto scope' >&2
            exit 1
          fi
      - name: Execute reviewed finalizer transaction with clean test scope
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          source = Path('.github/workflows/grosseto-integration-finalizer.yml')
          data = yaml.safe_load(source.read_text(encoding='utf-8'))
          steps = data['jobs']['finalize']['steps']
          scripts = {step.get('name'): step.get('run') for step in steps if step.get('name') and step.get('run')}
          required = [
              'Install full validation runtime',
              'Materialise permanent Grosseto integration',
              'Reverify official sources and parser boundary',
              'Run repository tests on clean review scope',
              'Build and validate national candidate',
              'Commit permanent checkpoint',
          ]
          missing = [name for name in required if name not in scripts]
          if missing:
              raise SystemExit(f'Missing reviewed finalizer steps: {missing!r}')

          # The generated public registry artifacts are publication outputs and are
          # intentionally not tracked in git. The reviewed v1 script attempted to
          # restore them with `git checkout --`, which fails after the candidate has
          # otherwise built and validated successfully. Remove only those generated
          # outputs instead; this changes no validation or evidence gate.
          build_name = 'Build and validate national candidate'
          checkout_cleanup = 'git checkout -- public-site/data/registry.json public-site/data/registry.csv public-site/data/prefectures.json public-site/data/prefectures.csv'
          remove_cleanup = 'rm -f public-site/data/registry.json public-site/data/registry.csv public-site/data/prefectures.json public-site/data/prefectures.csv'
          if checkout_cleanup not in scripts[build_name]:
              raise SystemExit('Reviewed generated-output cleanup anchor missing')
          scripts[build_name] = scripts[build_name].replace(checkout_cleanup, remove_cleanup, 1)

          def run(name: str) -> None:
              print(f'::group::{name}')
              subprocess.run(['bash', '-c', 'set -euo pipefail\n' + scripts[name]], check=True)
              print('::endgroup::')

          run('Install full validation runtime')
          run('Materialise permanent Grosseto integration')
          run('Reverify official sources and parser boundary')

          # The repository artifact-policy test must see the intended PR tree, not
          # transactional worker machinery. Deletions stay unstaged so the reviewed
          # permanent checkpoint can be pushed first and connector-side cleanup can
          # subsequently remove the temporary files explicitly.
          for path in Path('.github/workflows').glob('grosseto-*.yml'):
              path.unlink()
          trigger = Path('tmp/grosseto-probe-trigger.txt')
          if trigger.exists():
              trigger.unlink()

          run('Run repository tests on clean review scope')
          run('Build and validate national candidate')
          run('Commit permanent checkpoint')
          PY
      - name: Upload reviewed public-pages candidate
        uses: actions/upload-artifact@v4
        with:
          name: grosseto-public-pages-candidate-v2
          path: tmp/grosseto-public-pages-candidate.yml
          if-no-files-found: error
          retention-days: 7
