name: Grosseto integration finalizer v2 2026-09-19

on:
  push:
    branches:
      - expansion/grosseto-2026-09-19
    paths:
      - .github/workflows/grosseto-integration-finalizer-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify branch base and Grosseto-only pre-finalization scope
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "expansion/grosseto-2026-09-19"
          git fetch origin main
          test "$(git rev-list --count HEAD..origin/main)" = "0"
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/grosseto-.*|tmp/grosseto-.*|src/white_list_archive/parsers/grosseto_openxml.py|tests/test_grosseto_parser_semantics.py)$' | grep -q .; then
            echo 'Unexpected pre-finalization file outside Grosseto scope' >&2
            exit 1
          fi

      - name: Prepare reviewed transaction steps
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          source = Path('.github/workflows/grosseto-integration-finalizer.yml')
          data = yaml.safe_load(source.read_text(encoding='utf-8'))
          steps = data['jobs']['finalize']['steps']
          scripts = {step.get('name'): step.get('run') for step in steps if step.get('name') and step.get('run')}
          required = [
              'Install full validation runtime',
              'Materialise permanent Grosseto integration',
              'Reverify official sources and parser boundary',
              'Run repository tests on clean review scope',
              'Build and validate national candidate',
              'Commit permanent checkpoint',
          ]
          missing = [name for name in required if name not in scripts]
          if missing:
              raise SystemExit(f'Missing reviewed finalizer steps: {missing!r}')

          # Generated public registry files are publication outputs and are not tracked.
          # Preserve all validation while replacing only the invalid v1 git-checkout cleanup
          # with deletion of those generated outputs after successful validation.
          build_name = 'Build and validate national candidate'
          checkout_cleanup = 'git checkout -- public-site/data/registry.json public-site/data/registry.csv public-site/data/prefectures.json public-site/data/prefectures.csv'
          remove_cleanup = 'rm -f public-site/data/registry.json public-site/data/registry.csv public-site/data/prefectures.json public-site/data/prefectures.csv'
          if checkout_cleanup not in scripts[build_name]:
              raise SystemExit('Reviewed generated-output cleanup anchor missing')
          scripts[build_name] = scripts[build_name].replace(checkout_cleanup, remove_cleanup, 1)

          # csv.DictWriter defaults to CRLF even on Linux. The reviewed materialiser
          # rewrites two existing LF CSV registries, so the default produces a whole-file
          # whitespace diff that the unchanged git diff --cached --check gate correctly
          # rejects. Preserve the gate and make only those deterministic writers emit LF.
          materialise_name = 'Materialise permanent Grosseto integration'
          writer_anchor = "w=csv.DictWriter(h,fieldnames=fields); w.writeheader(); w.writerows(rows)"
          writer_replacement = "w=csv.DictWriter(h,fieldnames=fields,lineterminator='\\n'); w.writeheader(); w.writerows(rows)"
          if scripts[materialise_name].count(writer_anchor) != 2:
              raise SystemExit('Reviewed CSV writer anchors changed unexpectedly')
          scripts[materialise_name] = scripts[materialise_name].replace(writer_anchor, writer_replacement)

          Path('/tmp/grosseto-reviewed-steps.json').write_text(json.dumps(scripts), encoding='utf-8')
          PY
          cat >/tmp/run-grosseto-reviewed-step.py <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          scripts=json.loads(Path('/tmp/grosseto-reviewed-steps.json').read_text(encoding='utf-8'))
          name=sys.argv[1]
          subprocess.run(['bash','-c','set -euo pipefail\n'+scripts[name]], check=True)
          PY

      - name: Install full validation runtime
        run: python /tmp/run-grosseto-reviewed-step.py 'Install full validation runtime'

      - name: Materialise permanent Grosseto integration
        run: python /tmp/run-grosseto-reviewed-step.py 'Materialise permanent Grosseto integration'

      - name: Reverify official sources and parser boundary
        run: python /tmp/run-grosseto-reviewed-step.py 'Reverify official sources and parser boundary'

      - name: Remove transactional files from review worktree
        run: |
          set -euo pipefail
          rm -f .github/workflows/grosseto-*.yml tmp/grosseto-probe-trigger.txt

      - name: Run repository tests on clean review scope
        run: python /tmp/run-grosseto-reviewed-step.py 'Run repository tests on clean review scope'

      - name: Build and validate national candidate
        run: python /tmp/run-grosseto-reviewed-step.py 'Build and validate national candidate'

      - name: Commit permanent checkpoint
        run: python /tmp/run-grosseto-reviewed-step.py 'Commit permanent checkpoint'

      - name: Upload reviewed public-pages candidate
        uses: actions/upload-artifact@v4
        with:
          name: grosseto-public-pages-candidate-v2
          path: tmp/grosseto-public-pages-candidate.yml
          if-no-files-found: error
          retention-days: 7
