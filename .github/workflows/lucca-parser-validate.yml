name: Lucca parser validation

on:
  push:
    branches:
      - expansion/lucca-2026-09-19
    paths:
      - .github/workflows/lucca-parser-validate.yml
      - src/white_list_archive/parsers/lucca_tables.py
      - tests/test_lucca_parser_semantics.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check requests pdfplumber pytest
      - name: Run focused parser semantics tests
        run: pytest -q tests/test_lucca_parser_semantics.py
      - name: Fetch official sources twice and validate exact parser boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/lucca-validate
          python - <<'PY'
          import hashlib, json, time
          from pathlib import Path
          import requests
          from white_list_archive.parsers.lucca_tables import parse_lucca_applicants, parse_lucca_listed

          sources = {
              'listed': {
                  'url': 'https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco-imprese-iscritte-agg-l-40-del-2020-al-11-settembre-2026.pdf',
                  'sha256': 'd5a0f11c68a0a3dfb01d10b30f35130c7899795bb46e0239226ad5ea575b5c67',
                  'bytes': 532170,
              },
              'applicants': {
                  'url': 'https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco-imprese-richiedenti-agg-l-40-del-2020-al-08-settembre-2026.pdf',
                  'sha256': 'fd9cdc163e09c411ce5fd1f716d85811a15503f3527ac0f5abdaec909de4f084',
                  'bytes': 179370,
              },
          }
          headers = {'User-Agent': 'Mozilla/5.0 (compatible; italian-anti-mafia-whitelist source verification)'}
          root = Path('tmp/lucca-validate')
          report = {}
          for key, src in sources.items():
              captures=[]
              for attempt in (1,2):
                  r=requests.get(src['url'], headers={**headers, 'Cache-Control':'no-cache', 'Pragma':'no-cache'}, timeout=60)
                  r.raise_for_status()
                  body=r.content
                  digest=hashlib.sha256(body).hexdigest()
                  captures.append({'attempt':attempt,'status':r.status_code,'bytes':len(body),'sha256':digest,'last_modified':r.headers.get('last-modified')})
                  if digest != src['sha256'] or len(body) != src['bytes']:
                      raise SystemExit(f'{key}: official source drift: {captures[-1]}')
                  if attempt == 1:
                      (root/f'{key}.pdf').write_bytes(body)
                  time.sleep(1)
              if captures[0]['sha256'] != captures[1]['sha256']:
                  raise SystemExit(f'{key}: independent captures differ')
              report[key]=captures

          page='https://prefettura.interno.gov.it/it/prefetture/lucca/elenco-imprese-iscritte-e-richiedenti'
          base={
              'authority_key':'lucca',
              'authority_name':'Prefettura di Lucca',
              'source_page_url':page,
          }
          listed_cfg={**base,
              'source_key':'lucca-listed', 'register_key':'lucca-listed', 'register_name':'Elenco imprese iscritte',
              'population_scope':'listed', 'reference_date':'2026-09-11', 'resource_url':sources['listed']['url'], 'sha256':sources['listed']['sha256']}
          applicant_cfg={**base,
              'source_key':'lucca-applicants', 'register_key':'lucca-applicants', 'register_name':'Elenco imprese richiedenti',
              'population_scope':'applicants', 'reference_date':'2026-09-08', 'resource_url':sources['applicants']['url'], 'sha256':sources['applicants']['sha256']}
          listed=parse_lucca_listed(root/'listed.pdf', listed_cfg)
          applicants=parse_lucca_applicants(root/'applicants.pdf', applicant_cfg)
          assert listed.diagnostics['public_records'] == 331, listed.diagnostics
          assert listed.diagnostics['status_counts'] == {'listed':229,'renewal_update_in_progress':102}, listed.diagnostics
          assert listed.diagnostics['identifier_coverage'] == 324, listed.diagnostics
          assert listed.diagnostics['raw_identifier_only'] == 7, listed.diagnostics
          assert applicants.diagnostics['public_records'] == 71, applicants.diagnostics
          assert applicants.diagnostics['status_counts'] == {'pending':71}, applicants.diagnostics
          assert applicants.diagnostics['identifier_coverage'] == 69, applicants.diagnostics
          assert applicants.diagnostics['raw_identifier_only'] == 2, applicants.diagnostics
          combined=listed.records+applicants.records
          assert len(combined)==402
          assert sum(bool(r['identifiers']) for r in combined)==393
          locators=[r['record_locator'] for r in combined]
          assert len(locators)==len(set(locators))
          report['parser']={'listed':listed.diagnostics,'applicants':applicants.diagnostics,'combined_records':len(combined),'combined_identifier_coverage':sum(bool(r['identifiers']) for r in combined)}
          (root/'validation-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report['parser'],ensure_ascii=False,indent=2))
          PY
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: lucca-parser-validation
          path: tmp/lucca-validate/validation-report.json
          if-no-files-found: error
          retention-days: 7
