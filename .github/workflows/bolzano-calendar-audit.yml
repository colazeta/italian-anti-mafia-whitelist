name: Bolzano calendar audit

on:
  push:
    branches:
      - expansion/bolzano-bozen-2026-09-12
    paths:
      - .github/workflows/bolzano-calendar-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/bolzano-bozen-2026-09-12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'python-docx>=1.1,<2' requests
      - name: Audit strict-format calendar validity
        run: |
          python - <<'PY'
          import hashlib, io, json, re
          from collections import Counter
          from datetime import datetime
          from pathlib import Path

          import requests
          from docx import Document
          from docx.oxml.ns import qn

          SOURCES = {
              'listed': ('https://prefettura.interno.gov.it/sites/default/files/0/2026-09/2026.09.11-elenco-white-list-da-sez-1-a-sez-10_iscritti-rinnovi.docx', '96992db4caac16200fbebfa573bb602e1e396961ff854bbf006cb42e011c1e04'),
              'applicant': ('https://prefettura.interno.gov.it/sites/default/files/0/2026-09/2026.09.11-elenco-richiesta-iscrizione-wl.docx', '8b7321745edb19db688a001b9a1a706e84bee95cb457f9fdca1af144521ef3ae'),
          }
          H = {'User-Agent': 'italian-anti-mafia-whitelist/calendar-audit (+https://github.com/colazeta/italian-anti-mafia-whitelist)'}
          STRICT = re.compile(r'^\d{2}/\d{2}/\d{4}$')
          def clean(value): return re.sub(r'\s+', ' ', value or '').strip()
          def fetch(kind):
              url, expected = SOURCES[kind]
              r = requests.get(url, headers=H, timeout=60); r.raise_for_status()
              got = hashlib.sha256(r.content).hexdigest()
              if got != expected: raise SystemExit(f'{kind} source drift: {got} != {expected}')
              return r.content
          def physical(row):
              return [clean(' '.join((n.text or '') for n in tc.iter(qn('w:t')))) for tc in row._tr.tc_lst]
          def classify(raw, counter):
              if not STRICT.fullmatch(raw):
                  return
              try:
                  datetime.strptime(raw, '%d/%m/%Y')
              except ValueError:
                  counter[raw] += 1

          ldoc = Document(io.BytesIO(fetch('listed')))
          if len(ldoc.tables) != 10: raise SystemExit('listed table-count drift')
          listing_invalid = Counter(); expiry_invalid = Counter(); listed_rows = 0
          for section, table in enumerate(ldoc.tables, 1):
              for row in table.rows[2:]:
                  x = physical(row)
                  if not any(x): continue
                  if len(x) < 6: raise SystemExit(f'listed physical row too short in section {section}: {x!r}')
                  listed_rows += 1
                  classify(x[4], listing_invalid); classify(x[5], expiry_invalid)
          if listed_rows != 1706: raise SystemExit(f'listed row drift: {listed_rows}')

          adoc = Document(io.BytesIO(fetch('applicant')))
          if len(adoc.tables) != 1: raise SystemExit('applicant table-count drift')
          app_invalid = Counter(); app_rows = 0
          for row in adoc.tables[0].rows[2:]:
              x = physical(row)
              if not any(x): continue
              if len(x) != 7: raise SystemExit(f'applicant physical row drift: {x!r}')
              app_rows += 1; classify(x[5], app_invalid)
          if app_rows != 351: raise SystemExit(f'applicant row drift: {app_rows}')

          report = {
              'source_sha256': {k: v[1] for k, v in SOURCES.items()},
              'listed_rows': listed_rows,
              'applicant_rows': app_rows,
              'invalid_strict_listing_dates': dict(listing_invalid),
              'invalid_strict_expiry_dates': dict(expiry_invalid),
              'invalid_strict_application_dates': dict(app_invalid),
          }
          Path('tmp').mkdir(exist_ok=True)
          Path('tmp/bolzano_calendar_audit.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Persist calendar-audit checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/bolzano_calendar_audit.json
          if git diff --cached --quiet; then
            echo 'No calendar-audit change to checkpoint.'
            exit 0
          fi
          git commit -m 'Checkpoint Bolzano calendar audit'
          git push origin HEAD:expansion/bolzano-bozen-2026-09-12
