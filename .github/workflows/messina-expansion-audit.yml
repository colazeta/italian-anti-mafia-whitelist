name: Messina expansion audit

on:
  push:
    branches:
      - expansion/messina-2026-09-18

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install audit dependencies
        run: |
          python -m pip install --disable-pip-version-check -q pdfplumber

      - name: Capture and inspect current official Messina White List sources
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://prefettura.interno.gov.it/it/prefetture/messina/evidenza/white-list'
          APPLICANTS='https://prefettura.interno.gov.it/sites/default/files/0/2026-09/richieste-iscrizione-white-list-11.09.2026.pdf'
          LISTED='https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco-whitelist-iscritte-tutte-le-sezioni-online-11.09.2026.pdf'
          UA='Mozilla/5.0 WhiteListArchive/1.0 (+https://github.com/colazeta/italian-anti-mafia-whitelist)'
          mkdir -p /tmp/messina
          for i in 1 2; do
            curl --fail --location --retry 3 --retry-delay 2 --user-agent "$UA" --output "/tmp/messina/page-$i.html" "$PAGE"
            curl --fail --location --retry 3 --retry-delay 2 --user-agent "$UA" --output "/tmp/messina/applicants-$i.pdf" "$APPLICANTS"
            curl --fail --location --retry 3 --retry-delay 2 --user-agent "$UA" --output "/tmp/messina/listed-$i.pdf" "$LISTED"
          done
          echo '=== CAPTURE INTEGRITY ==='
          wc -c /tmp/messina/page-*.html /tmp/messina/applicants-*.pdf /tmp/messina/listed-*.pdf
          sha256sum /tmp/messina/page-*.html /tmp/messina/applicants-*.pdf /tmp/messina/listed-*.pdf
          cmp /tmp/messina/page-1.html /tmp/messina/page-2.html && echo 'landing_page_byte_identical=true'
          cmp /tmp/messina/applicants-1.pdf /tmp/messina/applicants-2.pdf && echo 'applicants_byte_identical=true'
          cmp /tmp/messina/listed-1.pdf /tmp/messina/listed-2.pdf && echo 'listed_byte_identical=true'

          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json, re
          import pdfplumber

          paths = {
              'applicants': Path('/tmp/messina/applicants-1.pdf'),
              'listed': Path('/tmp/messina/listed-1.pdf'),
          }
          ident_re = re.compile(r'(?<![A-Za-z0-9])(?:\d{11}|[A-Za-z0-9]{16})(?![A-Za-z0-9])')
          date_re = re.compile(r'^\d{2}/\d{2}/\d{4}$')

          def clean(v):
              if v is None: return ''
              return ' '.join(str(v).replace('\n',' ').split())

          for label, path in paths.items():
              print(f'=== PDFPLUMBER {label.upper()} ===')
              all_rows=[]
              page_company_counts=[]
              widths=Counter()
              with pdfplumber.open(path) as pdf:
                  print('pages=', len(pdf.pages))
                  for pageno,page in enumerate(pdf.pages,1):
                      tables=page.find_tables()
                      print(f'page={pageno} tables={len(tables)}')
                      pcount=0
                      for ti,t in enumerate(tables,1):
                          rows=t.extract()
                          print(f' page={pageno} table={ti} rows={len(rows)} bbox={tuple(round(x,1) for x in t.bbox)}')
                          for ri,row in enumerate(rows):
                              cells=[clean(x) for x in row]
                              widths[len(cells)] += 1
                              joined=' | '.join(cells)
                              ids=ident_re.findall(joined)
                              # The reviewed PDFs expose one identifier field per company row;
                              # use the presence of a strict identifier only for exploratory row discovery.
                              if ids:
                                  pcount += 1
                                  all_rows.append((pageno,ti,ri,cells,ids))
                      page_company_counts.append(pcount)
              print('table_row_widths=', dict(widths))
              print('strict_identifier_rows_per_page=', page_company_counts)
              print('strict_identifier_rows_total=', len(all_rows))
              id_values=[]
              for _,_,_,cells,ids in all_rows: id_values.extend(ids)
              print('strict_identifiers_total=', len(id_values), 'unique=', len(set(id_values)))
              dup=Counter(id_values)
              print('duplicate_identifiers=', [(k,v) for k,v in dup.items() if v>1][:50])
              print('first_rows=')
              for row in all_rows[:4]: print(json.dumps(row, ensure_ascii=False))
              print('last_rows=')
              for row in all_rows[-4:]: print(json.dumps(row, ensure_ascii=False))

              if label == 'listed':
                  # Reviewed layout expected: name, office, secondary, identifier, listing, expiry, update, sections.
                  update=Counter(); row_lengths=Counter(); dates_bad=[]
                  for pageno,ti,ri,cells,ids in all_rows:
                      row_lengths[len(cells)] += 1
                      if len(cells) >= 8:
                          update[cells[6]] += 1
                          for idx,field in ((4,'listing'),(5,'expiry')):
                              raw=cells[idx]
                              if raw and not date_re.fullmatch(raw): dates_bad.append((pageno,ti,ri,cells[0],field,raw))
                  print('listed_company_row_widths=', dict(row_lengths))
                  print('listed_update_raw=', json.dumps(update, ensure_ascii=False, sort_keys=True))
                  print('listed_nonstandard_dates=', json.dumps(dates_bad, ensure_ascii=False))
              else:
                  # Reviewed layout expected: name, office, secondary, identifier, sections, application date.
                  row_lengths=Counter(); dates_bad=[]
                  for pageno,ti,ri,cells,ids in all_rows:
                      row_lengths[len(cells)] += 1
                      if len(cells) >= 6:
                          raw=cells[5]
                          if raw and not date_re.fullmatch(raw): dates_bad.append((pageno,ti,ri,cells[0],raw))
                  print('applicant_company_row_widths=', dict(row_lengths))
                  print('applicant_nonstandard_dates=', json.dumps(dates_bad, ensure_ascii=False))
          PY
