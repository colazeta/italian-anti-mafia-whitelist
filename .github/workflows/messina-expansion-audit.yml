name: Messina expansion audit

on:
  push:
    branches:
      - expansion/messina-2026-09-18

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install project
        run: python -m pip install --disable-pip-version-check -q -e .

      - name: Capture verified current Messina sources
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://prefettura.interno.gov.it/it/prefetture/messina/evidenza/white-list'
          APPLICANTS='https://prefettura.interno.gov.it/sites/default/files/0/2026-09/richieste-iscrizione-white-list-11.09.2026.pdf'
          LISTED='https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco-whitelist-iscritte-tutte-le-sezioni-online-11.09.2026.pdf'
          UA='Mozilla/5.0 WhiteListArchive/1.0 (+https://github.com/colazeta/italian-anti-mafia-whitelist)'
          mkdir -p /tmp/messina
          for i in 1 2; do
            curl --fail --location --retry 3 --retry-delay 2 --user-agent "$UA" -o "/tmp/messina/page-$i.html" "$PAGE"
            curl --fail --location --retry 3 --retry-delay 2 --user-agent "$UA" -o "/tmp/messina/applicants-$i.pdf" "$APPLICANTS"
            curl --fail --location --retry 3 --retry-delay 2 --user-agent "$UA" -o "/tmp/messina/listed-$i.pdf" "$LISTED"
          done
          sha256sum /tmp/messina/page-*.html /tmp/messina/applicants-*.pdf /tmp/messina/listed-*.pdf
          cmp /tmp/messina/page-1.html /tmp/messina/page-2.html
          cmp /tmp/messina/applicants-1.pdf /tmp/messina/applicants-2.pdf
          cmp /tmp/messina/listed-1.pdf /tmp/messina/listed-2.pdf
          test "$(sha256sum /tmp/messina/applicants-1.pdf | cut -d' ' -f1)" = '852f8f59db96f134fae8e2f95ef3b75b041699a1eb4115639d5eb3a0c5e699e4'
          test "$(sha256sum /tmp/messina/listed-1.pdf | cut -d' ' -f1)" = 'cf1219ccdfb4f6abafd1bb23edf325fdb8dc16d5611a7498378aeed51754644e'

      - name: Parse fail-closed Messina listed source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from white_list_archive.parsers.messina_tables import parse_messina_listed
          cfg = {
              'authority_key': 'messina',
              'authority_name': 'Prefettura di Messina',
              'register_key': 'messina-ordinary',
              'register_name': 'White List ordinaria',
              'source_page_url': 'https://prefettura.interno.gov.it/it/prefetture/messina/evidenza/white-list',
              'source_key': 'messina-listed',
              'population_scope': 'listed',
              'reference_date': '2026-09-11',
              'resource_url': 'https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco-whitelist-iscritte-tutte-le-sezioni-online-11.09.2026.pdf',
              'sha256': 'cf1219ccdfb4f6abafd1bb23edf325fdb8dc16d5611a7498378aeed51754644e',
          }
          batch = parse_messina_listed(Path('/tmp/messina/listed-1.pdf'), cfg)
          print('listed diagnostics:', batch.diagnostics)
          assert len(batch.records) == 880
          PY

      - name: Parse fail-closed Messina applicant source
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from white_list_archive.parsers.messina_tables import parse_messina_applicants
          cfg = {
              'authority_key': 'messina',
              'authority_name': 'Prefettura di Messina',
              'register_key': 'messina-ordinary',
              'register_name': 'White List ordinaria',
              'source_page_url': 'https://prefettura.interno.gov.it/it/prefetture/messina/evidenza/white-list',
              'source_key': 'messina-applicants',
              'population_scope': 'applicant',
              'reference_date': '2026-09-11',
              'resource_url': 'https://prefettura.interno.gov.it/sites/default/files/0/2026-09/richieste-iscrizione-white-list-11.09.2026.pdf',
              'sha256': '852f8f59db96f134fae8e2f95ef3b75b041699a1eb4115639d5eb3a0c5e699e4',
          }
          batch = parse_messina_applicants(Path('/tmp/messina/applicants-1.pdf'), cfg)
          print('applicant diagnostics:', batch.diagnostics)
          assert len(batch.records) == 154
          sitec = [r for r in batch.records if r['name'] == 'SITEC S.R.L.']
          assert len(sitec) == 1 and sitec[0]['identifiers'] == [] and sitec[0]['application_date']
          avio = [r for r in batch.records if r['name'] == 'AVIOMARKETING S.P.A. UNIPERSONALE']
          assert len(avio) == 1 and len(avio[0]['identifiers']) == 2
          PY

      - name: Upload reviewed source capture
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: messina-source-capture
          path: |
            /tmp/messina/page-1.html
            /tmp/messina/applicants-1.pdf
            /tmp/messina/listed-1.pdf
          if-no-files-found: error
