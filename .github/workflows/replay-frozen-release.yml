name: Replay frozen national release from private archive

on:
  workflow_dispatch:
    inputs:
      release_manifest:
        description: Tracked frozen release manifest under data/releases/
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: frozen-release-replay
  cancel-in-progress: false

jobs:
  replay:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: evidence-archive
    env:
      EVIDENCE_BUCKET: ${{ vars.EVIDENCE_BUCKET }}
      EVIDENCE_ENDPOINT: ${{ vars.EVIDENCE_ENDPOINT }}
      EVIDENCE_REGION: ${{ vars.EVIDENCE_REGION }}
      EVIDENCE_POLICY_EVIDENCE: ${{ vars.EVIDENCE_POLICY_EVIDENCE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.EVIDENCE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.EVIDENCE_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.EVIDENCE_SESSION_TOKEN }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Checkout release catalogue on main
        uses: actions/checkout@v4

      - name: Freeze reviewed manifest and resolve pinned code revision
        id: release
        env:
          RELEASE_MANIFEST_INPUT: ${{ inputs.release_manifest }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          root = Path.cwd().resolve()
          releases = (root / 'data' / 'releases').resolve()
          raw = os.environ['RELEASE_MANIFEST_INPUT'].strip()
          if not raw:
              raise SystemExit('release_manifest is required')
          candidate = (root / raw).resolve()
          try:
              candidate.relative_to(releases)
          except ValueError as exc:
              raise SystemExit('release_manifest must resolve under data/releases/') from exc
          if candidate.suffix.lower() != '.json' or not candidate.is_file():
              raise SystemExit('release_manifest must name an existing JSON file')
          manifest = json.loads(candidate.read_text(encoding='utf-8'))
          if manifest.get('schema_version') != 1:
              raise SystemExit('Unsupported frozen release schema_version')
          release_id = manifest.get('release_id')
          if not isinstance(release_id, str) or not release_id.strip():
              raise SystemExit('Frozen release must have a non-empty release_id')
          revision = manifest.get('code_revision')
          if not isinstance(revision, str) or not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise SystemExit('Frozen release code_revision must be an exact 40-character Git commit SHA')
          sources = manifest.get('sources')
          if not isinstance(sources, list) or not sources:
              raise SystemExit('Frozen release must pin at least one source')
          shutil.copyfile(candidate, '/tmp/frozen-release.json')
          Path(os.environ['GITHUB_OUTPUT']).write_text(
              f'code_revision={revision}\nrelease_id={release_id}\n',
              encoding='utf-8',
          )
          PY
          git ls-files --error-unmatch "$RELEASE_MANIFEST_INPUT" >/dev/null

      - name: Checkout exact code revision pinned by release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.code_revision }}
          clean: true

      - name: Prepare runner package sources
        run: |
          while IFS= read -r source_file; do
            [ -n "$source_file" ] && sudo rm -f "$source_file"
          done < <(grep -rlE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list.d 2>/dev/null || true)
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '\|dl\.google\.com/linux/chrome|d;\|packages\.google\.com/chrome|d' /etc/apt/sources.list
          fi
          if grep -RqsE 'dl\.google\.com/linux/chrome|packages\.google\.com/chrome' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null; then
            echo 'Chrome APT source remained after targeted cleanup' >&2
            exit 1
          fi

      - name: Install frozen replay runtime
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq -o Acquire::Retries=3 && \
               sudo apt-get install -y --no-install-recommends poppler-utils antiword; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Publication runtime package installation failed after bounded retries' >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          python -m pip install -e '.[publication,storage]'

      - name: Require designated private archive
        run: |
          python - <<'PY'
          import os
          from white_list_archive.storage.evidence import StoreConfig
          StoreConfig.from_env()
          if any(not os.environ.get(k) for k in ('AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY')):
              raise SystemExit('Private evidence store credentials are not configured')
          PY

      - name: Replay release from pinned archived captures only
        env:
          PINNED_CODE_REVISION: ${{ steps.release.outputs.code_revision }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/frozen-replay/work /tmp/frozen-replay/output
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/frozen-replay/work \
            --registry-json /tmp/frozen-replay/output/registry.json \
            --registry-csv /tmp/frozen-replay/output/registry.csv \
            --prefectures-json /tmp/frozen-replay/output/prefectures.json \
            --prefectures-csv /tmp/frozen-replay/output/prefectures.csv \
            --release-manifest /tmp/frozen-release.json \
            --runtime-code-revision "$PINNED_CODE_REVISION"

      - name: Verify replay products without publishing them
        env:
          EXPECTED_RELEASE_ID: ${{ steps.release.outputs.release_id }}
          PINNED_CODE_REVISION: ${{ steps.release.outputs.code_revision }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from white_list_archive.publishing.public_contract import validate_registry

          out = Path('/tmp/frozen-replay/output')
          required = ('registry.json', 'registry.csv', 'prefectures.json', 'prefectures.csv', 'history.json')
          missing = [name for name in required if not (out / name).is_file()]
          if missing:
              raise SystemExit(f'Frozen replay outputs missing: {missing!r}')
          registry = json.loads((out / 'registry.json').read_text(encoding='utf-8'))
          prefectures = json.loads((out / 'prefectures.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('/tmp/frozen-release.json').read_text(encoding='utf-8'))
          validate_registry(registry)
          if manifest['release_id'] != os.environ['EXPECTED_RELEASE_ID']:
              raise SystemExit('Release identity changed between selection and replay')
          if manifest['code_revision'] != os.environ['PINNED_CODE_REVISION']:
              raise SystemExit('Executing revision differs from frozen release pin')
          print(json.dumps({
              'release_id': manifest['release_id'],
              'code_revision': manifest['code_revision'],
              'registry_records': registry['meta']['record_count'],
              'authorities_published': registry['meta']['authority_count'],
              'registers_published': registry['meta']['register_count'],
              'prefectures_in_index': prefectures['meta']['authority_count'],
              'published_prefectures': prefectures['meta']['published_count'],
              'source_mode': 'archived_frozen_release',
          }, sort_keys=True))
          PY

# Deliberately no upload-artifact, Pages deployment, live-source fallback or database
# promotion. This workflow proves replayability of one reviewed frozen release from
# immutable private archive inputs; release promotion remains a separate serial gate.
