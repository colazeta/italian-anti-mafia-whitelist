name: One-shot public JS escaping fix

on:
  push:
    branches:
      - feature/multi-prefecture-pilot
    paths:
      - '.github/workflows/fix-public-js-escaping.yml'
      - 'public-site/app.js'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multi-prefecture-pilot
      - name: Correct HTML named character reference
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('public-site/app.js')
          text=path.read_text(encoding='utf-8')
          old='\'"\':\'&quot\''
          new='\'"\':\'&quot;\''
          if old not in text:
              print('Escaping already correct; no change.')
          else:
              path.write_text(text.replace(old,new,1),encoding='utf-8')
              print('Corrected double-quote escaping.')
          PY
      - name: Commit correction if needed
        run: |
          if git diff --quiet -- public-site/app.js; then
            echo 'No commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-site/app.js
          git commit -m 'Fix public HTML escaping'
          git push origin HEAD:feature/multi-prefecture-pilot
