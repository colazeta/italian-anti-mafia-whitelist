name: Siracusa integration finalizer 2026-09-20

on:
  push:
    branches:
      - expansion/siracusa-2026-09-20
    paths:
      - .github/workflows/siracusa-integration-finalizer-2026-09-20.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: siracusa-integration-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/siracusa-2026-09-20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify branch, canonical base and isolated scope
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "expansion/siracusa-2026-09-20"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "547b24cacba57a8b9cd437f655244013de640560"
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-list --count HEAD..origin/main)" = "0"
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/siracusa-(source-probe|parser-validate|integration-finalizer)-2026-09-20\.yml|tmp/siracusa_integrate\.py|docs/sources/siracusa-operational-check-2026-09-20\.md|src/white_list_archive/parsers/siracusa_tables\.py|tests/test_siracusa_parser_semantics\.py)$' | grep -q .; then
            echo 'Unexpected pre-integration branch scope' >&2
            exit 1
          fi
      - name: Install complete validation runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils antiword
          python -m pip install -e '.[dev,publication,database,storage]'
      - name: Materialise Siracusa integration
        run: |
          set -euo pipefail
          python tmp/siracusa_integrate.py
          git diff --check
          test -f tmp/siracusa-public-pages.yml
          if git diff --name-only | grep -E '^\.github/workflows/' | grep -v '^\.github/workflows/siracusa-' | grep -q .; then
            echo 'Materializer modified a permanent workflow directly' >&2
            exit 1
          fi
      - name: Run focused and full repository validation
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/siracusa-source-probe-2026-09-20.yml \
            .github/workflows/siracusa-parser-validate-2026-09-20.yml
          pytest -q tests/test_siracusa_parser_semantics.py tests/test_source_registry.py tests/test_source_population_coverage.py
          pytest -q
      - name: Build and validate national candidate
        run: |
          set -euo pipefail
          rm -rf /tmp/siracusa-national
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/siracusa-national \
            --registry-json public-site/data/registry.json \
            --registry-csv public-site/data/registry.csv \
            --prefectures-json public-site/data/prefectures.json \
            --prefectures-csv public-site/data/prefectures.csv
          python - <<'PY'
          import json
          from collections import Counter
          reg=json.load(open('public-site/data/registry.json',encoding='utf-8'))
          pref=json.load(open('public-site/data/prefectures.json',encoding='utf-8'))
          records=[x for x in reg['records'] if x['authority_key']=='siracusa']
          assert reg['meta']['record_count']==69474
          assert reg['meta']['authority_count']==66
          assert reg['meta']['register_count']==68
          assert pref['meta']['published_count']==66
          assert pref['meta']['mapped_count']==66
          assert len(records)==419
          assert Counter(x['source_key'] for x in records)==Counter({'siracusa-listed':315,'siracusa-applicants':104})
          assert Counter(x['source_status'] for x in records)==Counter({'listed':246,'renewal_update_in_progress':67,'other_or_unknown':2,'pending':104})
          assert sum(bool(x['identifiers']) for x in records)==414
          assert sum(bool(x['observed_expiry_date']) for x in records)==315
          assert sum(bool(x['application_date']) for x in records)==103
          assert len({x['record_locator'] for x in records})==419
          malformed=[x for x in records if x['source_key']=='siracusa-applicants' and '17.01/2024' in x['source_fields'].get('application_date_raw_variants',[])]
          assert len(malformed)==1 and malformed[0]['application_date']==''
          print('SIRACUSA_NATIONAL_OK 69474/66/68/66')
          PY
      - name: Commit permanent checkpoint and reviewed Pages candidate
        run: |
          set -euo pipefail
          git restore public-site/data 2>/dev/null || true
          git add \
            data/catalog.csv \
            data/monitoring/national_coverage.json \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            data/source_registry/verified_primary_pages.csv \
            src/white_list_archive/publishing/public_national_registry.py \
            tests/public_portal_browser.cjs \
            tests/test_source_population_coverage.py \
            tests/test_source_registry.py \
            tmp/siracusa-public-pages.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 10
          if git diff --cached --name-only | grep -E '^\.github/workflows/|^scripts/' | grep -q .; then
            echo 'Temporary or workflow machinery leaked into permanent checkpoint' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate Siracusa White List observations'
          git push origin HEAD:expansion/siracusa-2026-09-20
