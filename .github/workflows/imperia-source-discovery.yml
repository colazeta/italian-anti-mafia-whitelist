name: Imperia source discovery 2026-09-19

on:
  push:
    branches:
      - expansion/imperia-2026-09-19
    paths:
      - .github/workflows/imperia-source-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Discover current official Imperia White List resources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q requests beautifulsoup4
          mkdir -p tmp/imperia-discovery/files
          python - <<'PY'
          import hashlib, json, os, re, time
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup

          OUT = Path('tmp/imperia-discovery')
          FILES = OUT / 'files'
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36 WhiteListArchive/1.0'
          session = requests.Session()
          session.headers.update({
              'User-Agent': UA,
              'Accept': 'text/html,application/xhtml+xml,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,*/*;q=0.8',
              'Cache-Control': 'no-cache',
              'Pragma': 'no-cache',
          })

          seeds = [
              'https://prefettura.interno.gov.it/it/prefetture/imperia/evidenza/white-list',
              'https://prefettura.interno.gov.it/it/prefetture/imperia/white-list-elenco-imprese-iscritte',
              'https://prefettura.interno.gov.it/it/prefetture/imperia/elenco-imprese-iscritte-white-list',
              'https://prefettura.interno.gov.it/it/prefetture/imperia/white-list-elenco-imprese-richiedenti',
              'https://prefettura.interno.gov.it/it/prefetture/imperia/elenco-imprese-richiedenti-iscrizione-white-list',
              'https://www1.prefettura.it/imperia/contenuti/White_list_elenco_imprese_iscritte-69550.htm',
          ]

          key_re = re.compile(r'(white\s*list|white-list|elenco|iscritt|richiedent|istanza|ditte)', re.I)
          attachment_ext = re.compile(r'\.(pdf|xlsx?|ods|docx?|rtf|csv)(?:$|\?)', re.I)
          results = []
          discovered = {}

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def safe_name(url, idx):
              p = urlparse(url).path.rsplit('/', 1)[-1] or f'resource-{idx}'
              p = re.sub(r'[^A-Za-z0-9._-]+', '_', p)[:160]
              return f'{idx:03d}-{p}'

          def fetch(url, save=False):
              rec = {'url': url}
              try:
                  r = session.get(url, timeout=45, allow_redirects=True)
                  data = r.content
                  rec.update({
                      'status': r.status_code,
                      'final_url': r.url,
                      'content_type': r.headers.get('content-type'),
                      'content_disposition': r.headers.get('content-disposition'),
                      'last_modified': r.headers.get('last-modified'),
                      'etag': r.headers.get('etag'),
                      'bytes': len(data),
                      'sha256': sha(data),
                  })
                  if save and r.status_code == 200 and data:
                      path = FILES / safe_name(r.url, len(list(FILES.iterdir())) + 1)
                      path.write_bytes(data)
                      rec['saved_as'] = str(path)
                  return rec, r
              except Exception as e:
                  rec['error'] = f'{type(e).__name__}: {e}'
                  return rec, None

          # Fetch seed pages, then inspect one relevant internal-link depth.
          queue = list(seeds)
          seen = set()
          pages = []
          while queue and len(seen) < 50:
              url = queue.pop(0)
              if url in seen:
                  continue
              seen.add(url)
              rec, r = fetch(url, save=False)
              results.append(rec)
              if r is None or r.status_code != 200:
                  continue
              ctype = (r.headers.get('content-type') or '').lower()
              if 'html' not in ctype and not r.text.lstrip().lower().startswith(('<!doctype', '<html')):
                  continue
              pages.append(url)
              soup = BeautifulSoup(r.text, 'html.parser')
              title = soup.title.get_text(' ', strip=True) if soup.title else ''
              rec['title'] = title
              rec['page_text_excerpt'] = ' '.join(soup.get_text(' ', strip=True).split())[:1200]
              for a in soup.find_all('a', href=True):
                  href = urljoin(r.url, a['href']).split('#')[0]
                  text = ' '.join(a.get_text(' ', strip=True).split())
                  if not href.startswith(('http://', 'https://')):
                      continue
                  if 'prefettura' not in urlparse(href).netloc and 'interno.gov.it' not in urlparse(href).netloc:
                      continue
                  blob = f'{text} {href}'
                  if not key_re.search(blob):
                      continue
                  discovered.setdefault(href, {'url': href, 'labels': []})['labels'].append(text)
                  # Only recurse into Imperia official HTML-looking pages.
                  if ('/prefetture/imperia/' in href or 'prefettura.it/imperia/' in href) and not attachment_ext.search(href):
                      if href not in seen and href not in queue:
                          queue.append(href)

          # Fetch every likely attachment discovered from relevant pages, retaining bytes.
          attachments = []
          for href, meta in sorted(discovered.items()):
              labels = [x for x in meta['labels'] if x]
              blob = ' '.join(labels) + ' ' + href
              if attachment_ext.search(href) or re.search(r'(elenco|iscritt|richiedent|istanza|white)', blob, re.I):
                  rec, r = fetch(href, save=True)
                  rec['anchor_labels'] = sorted(set(labels))
                  attachments.append(rec)

          # Repeat successful non-HTML candidate source downloads independently with cache-bypass query.
          repeats = []
          ts = int(time.time())
          for rec in attachments:
              if rec.get('status') != 200 or not rec.get('saved_as'):
                  continue
              ct = (rec.get('content_type') or '').lower()
              path = urlparse(rec.get('final_url') or rec['url']).path.lower()
              if 'html' in ct and not attachment_ext.search(path):
                  continue
              sep = '&' if '?' in rec['url'] else '?'
              retry_url = rec['url'] + sep + f'_wlarchive_nocache={ts}'
              rr, _ = fetch(retry_url, save=True)
              rr['original_url'] = rec['url']
              repeats.append(rr)

          report = {
              'landing': seeds[0],
              'seed_count': len(seeds),
              'visited_count': len(seen),
              'pages': pages,
              'results': results,
              'discovered_links': list(discovered.values()),
              'attachments': attachments,
              'independent_repeats': repeats,
          }
          (OUT / 'report.json').write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding='utf-8')

          print('IMPERIA_DISCOVERY_SUMMARY')
          print(json.dumps({
              'visited_count': report['visited_count'],
              'pages': pages,
              'attachments': [
                  {k: x.get(k) for k in ('url','anchor_labels','status','final_url','content_type','bytes','sha256','saved_as')}
                  for x in attachments
              ],
              'repeats': [
                  {k: x.get(k) for k in ('original_url','status','final_url','content_type','bytes','sha256','saved_as')}
                  for x in repeats
              ],
          }, indent=2, ensure_ascii=False))
          PY

          echo '--- saved files ---'
          find tmp/imperia-discovery -maxdepth 2 -type f -printf '%p\t%s bytes\n' | sort
          echo '--- file signatures ---'
          find tmp/imperia-discovery/files -type f -print0 | xargs -0 -r file

      - name: Upload source-discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imperia-source-discovery
          path: tmp/imperia-discovery
          if-no-files-found: error
          retention-days: 7
