name: Udine public-contract fix 2026-09-10

on:
  push:
    branches: [expansion/udine-2026-09-10]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply Udine public contract fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/udine-2026-09-10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restrict Udine source fields to the existing publication contract
        run: |
          python - <<'PY'
          from pathlib import Path

          parser=Path('src/white_list_archive/parsers/udine_positioned.py')
          text=parser.read_text()
          old='''                source_fields: dict[str, Any] = {\n                    "source_page": page_number,\n                    "source_page_row": row_number,\n                    "section_roman": current_section,\n                    "listing_date_raw": dates[0],\n                    "expiry_date_raw": dates[1],\n                    "update_raw": "In aggiornamento" if updating else "",\n                    "registered_office_source_band": office,\n                    "secondary_representation_source_band": secondary,\n                }\n                if not listing_date:\n                    source_fields["listing_date_unparsed_reviewed"] = True\n                if not expiry_date:\n                    source_fields["expiry_date_unparsed_reviewed"] = True\n'''
          new='''                source_fields: dict[str, Any] = {\n                    "sections": [f"Sezione {section_number}"],\n                    "listing_date_raw_variants": [dates[0]],\n                    "expiry_date_raw_variants": [dates[1]],\n                    "in_aggiornamento": "In aggiornamento" if updating else "",\n                }\n'''
          assert text.count(old)==1, text.count(old)
          text=text.replace(old,new)
          old2='''                    source_fields={\n                        "source_page": page_number,\n                        "source_page_row": row_number,\n                        "activity_codes_raw": activity_raw,\n                        "application_date_raw": dates[0],\n                        "population_evidence": "official current list of suppliers that requested White List registration",\n                        "cross_page_name_repair": (page_number, row_number) == (1, 17),\n                    },\n'''
          new2='''                    source_fields={\n                        "application_date_raw_variants": [dates[0]],\n                        "requested_activities_source": activity_raw,\n                    },\n'''
          assert text.count(old2)==1, text.count(old2)
          parser.write_text(text.replace(old2,new2))

          finalizer=Path('.github/workflows/udine-production-finalizer-2026-09-10.yml')
          wf=finalizer.read_text()
          old3="      assert.equal(palma[0].source_fields.expiry_date_raw,'269/01/2027');"
          new3="      assert.deepEqual(palma[0].source_fields.expiry_date_raw_variants,['269/01/2027']);"
          assert wf.count(old3)==1,wf.count(old3)
          finalizer.write_text(wf.replace(old3,new3))
          PY
      - name: Commit contract-compatible retry trigger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/udine-public-contract-fix-2026-09-10.yml
          git add src/white_list_archive/parsers/udine_positioned.py .github/workflows/udine-production-finalizer-2026-09-10.yml
          git diff --cached --check
          git commit -m 'Prepare Udine production integration'
          git push origin HEAD:expansion/udine-2026-09-10
