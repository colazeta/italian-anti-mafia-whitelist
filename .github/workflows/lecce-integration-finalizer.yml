name: Lecce integration finalizer

on:
  push:
    branches:
      - expansion/lecce-2026-09-18
    paths:
      - '.github/workflows/lecce-integration-finalizer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lecce-integration-finalizer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: expansion/lecce-2026-09-18
          fetch-depth: 0
      - name: Generate reviewed public workflow candidate
        run: |
          python - <<'PY'
          from scripts.lecce_integration_finalizer import update_public_workflow
          update_public_workflow()
          PY
          mkdir -p tmp
          cp .github/workflows/public-pages.yml tmp/lecce-public-pages.generated.yml
          git checkout -- .github/workflows/public-pages.yml
          git diff --check
      - name: Commit workflow candidate as non-workflow helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/lecce-public-pages.generated.yml
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'chore: stage reviewed Lecce public workflow candidate'
          git push origin HEAD:expansion/lecce-2026-09-18
