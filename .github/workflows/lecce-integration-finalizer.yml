name: Lecce integration finalizer

on:
  push:
    branches:
      - expansion/lecce-2026-09-18
    paths:
      - 'scripts/lecce_integration_finalizer.py'
      - '.github/workflows/lecce-integration-finalizer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lecce-integration-finalizer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: expansion/lecce-2026-09-18
          fetch-depth: 0
      - name: Materialize permanent Lecce integration
        run: |
          python scripts/lecce_integration_finalizer.py
          rm -f scripts/lecce_source_probe.py
          rm -f .github/workflows/lecce-source-probe.yml
          rm -f tmp/lecce_probe.json
          rm -f scripts/lecce_integration_finalizer.py
          rm -f .github/workflows/lecce-integration-finalizer.yml
          python -m py_compile src/white_list_archive/parsers/lecce_tables.py
          git diff --check
      - name: Commit clean permanent integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'feat: integrate Lecce public White List coverage'
          git push origin HEAD:expansion/lecce-2026-09-18
