name: Pescara boundary audit

on:
  push:
    branches: [expansion/pescara-2026-09-21]
    paths: [.github/workflows/pescara-boundary-audit.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/pescara-2026-09-21
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq antiword
          python -m pip install --disable-pip-version-check requests
      - name: Derive reviewed parser boundaries
        run: |
          python - <<'PY'
          import collections, hashlib, json, re, subprocess, xml.etree.ElementTree as ET
          from datetime import date
          from pathlib import Path
          import requests

          SRC={
            'listed':('https://prefettura.interno.gov.it/sites/default/files/0/2026-09/white-list-2026.doc','6a8aa832db7d0f55c17d9ed1f8179d9ed46a7c927b5b88d85319f79a1da92239'),
            'applicants':('https://prefettura.interno.gov.it/sites/default/files/0/2026-09/elenco_richiedenti_white-list_04.09.2026.doc','2a0f74ab6548ad2418f539aba7fc2eaf0d23998b709b0bc247e512d7b46a578c'),
          }
          clean=lambda x:re.sub(r'\s+',' ',x or '').strip()
          ident=re.compile(r'(?<![A-Za-z0-9])(?:\d{11}|[A-Za-z]{6}[0-9A-Za-z]{10})(?![A-Za-z0-9])')
          date_re=re.compile(r'^(\d{1,2})\s*([/.])\s*(\d{1,2})\s*\2\s*(\d{4})$')
          def valid_date(x):
            m=date_re.fullmatch(clean(x))
            if not m:return False
            try: date(int(m.group(4)),int(m.group(3)),int(m.group(1)));return True
            except ValueError:return False
          def docbook(key):
            url,sha=SRC[key];body=requests.get(url,timeout=60,headers={'User-Agent':'Mozilla/5.0 (compatible; ItalianAntiMafiaWhitelist/1.0)'}).content
            got=hashlib.sha256(body).hexdigest()
            if got!=sha:raise RuntimeError(f'{key} hash drift {got}')
            p=Path(f'/tmp/{key}.doc');p.write_bytes(body)
            raw=subprocess.run(['antiword','-x','db',str(p)],stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True).stdout.decode('utf-8','replace')
            xml=re.sub(r'<!DOCTYPE book PUBLIC.*?docbookx\.dtd">\s*','',raw,flags=re.S)
            return ET.fromstring(xml)
          def is_header(cells):
            f=' | '.join(cells).casefold();return 'ragione sociale' in f or ('denominaz' in f and ('codice fiscale' in f or 'partita' in f))

          root=docbook('listed')
          chapters=[c for c in root.findall('.//chapter') if c.findall('.//informaltable')]
          if len(chapters)!=1:raise RuntimeError(f'listed chapter drift {len(chapters)}')
          current=''; labels=[]; sector_rows=[]; table_groups=0
          for para in chapters[0].findall('./para'):
            table=para.find('.//informaltable')
            if table is None:
              text=clean(''.join(para.itertext()))
              if text.upper().startswith('SEZIONE'):
                current=text;labels.append(text)
              continue
            if not current:raise RuntimeError('listed table before section')
            for tg in table.findall('.//tgroup'):
              table_groups+=1
              if tg.get('cols')!='7':raise RuntimeError(f'listed col drift {tg.get("cols")}')
              for row in tg.findall('.//row'):
                cells=[clean(''.join(e.itertext())) for e in row.findall('./entry')]
                if not any(cells) or is_header(cells):continue
                if len(cells)!=7:raise RuntimeError(f'listed row width {len(cells)}')
                sector_rows.append((current,cells))
          grouped={}
          for section,cells in sector_rows:
            key=tuple(cells);g=grouped.setdefault(key,{'cells':cells,'sections':[]})
            if section not in g['sections']:g['sections'].append(section)
          records=list(grouped.values())
          status=lambda note:'renewal_update_in_progress' if clean(note).casefold()=='in rinnovo' else ('listed' if not clean(note) else 'other_or_unknown')
          malformed_ids=collections.Counter();malformed_dates=collections.Counter();status_counts=collections.Counter();idcov=0
          section_memberships=0
          for g in records:
            c=g['cells'];section_memberships+=len(g['sections']);status_counts[status(c[6])]+=1
            if ident.search(c[3]):idcov+=1
            elif c[3]:malformed_ids[c[3]]+=1
            for raw in (c[4],c[5]):
              if raw and not valid_date(raw):malformed_dates[raw]+=1
          listed={
            'source_sha256':SRC['listed'][1],'table_groups':table_groups,'section_labels':labels,
            'sector_rows':len(sector_rows),'logical_records_exact_row_grouping':len(records),'section_memberships_after_grouping':section_memberships,
            'status_counts':dict(status_counts),'identifier_coverage':idcov,'raw_only_identifier_records':sum(malformed_ids.values()),
            'malformed_identifiers':dict(malformed_ids),'malformed_dates':dict(malformed_dates),
            'nonstandard_status_notes':dict(collections.Counter(g['cells'][6] for g in records if clean(g['cells'][6]) not in ('','IN RINNOVO'))),
            'section_membership_distribution':dict(collections.Counter(len(g['sections']) for g in records)),
          }

          root=docbook('applicants');rows=[];headers=[];groups=0
          for tg in root.findall('.//informaltable//tgroup'):
            groups+=1
            if tg.get('cols')!='6':raise RuntimeError(f'applicant col drift {tg.get("cols")}')
            for row in tg.findall('.//row'):
              cells=[clean(''.join(e.itertext())) for e in row.findall('./entry')]
              if not any(cells):continue
              if is_header(cells):headers.append(cells);continue
              if len(cells)!=6:raise RuntimeError(f'applicant row width {len(cells)}')
              rows.append(cells)
          malformed_aids=collections.Counter();malformed_adates=collections.Counter();idcov_a=0;blank_names=[]
          for i,c in enumerate(rows,1):
            if not c[0]:blank_names.append(i)
            if ident.search(c[3]):idcov_a+=1
            elif c[3]:malformed_aids[c[3]]+=1
            if c[5] and not valid_date(c[5]):malformed_adates[c[5]]+=1
          applicants={
            'source_sha256':SRC['applicants'][1],'table_groups':groups,'headers':headers,'records':len(rows),'status_counts':{'pending':len(rows)},
            'identifier_coverage':idcov_a,'raw_only_identifier_records':sum(malformed_aids.values()),'malformed_identifiers':dict(malformed_aids),
            'malformed_dates':dict(malformed_adates),'blank_company_row_numbers':blank_names,
            'unique_rows':len({tuple(r) for r in rows}),
          }
          Path('docs/sources/pescara-boundary-audit-2026-09-21.json').write_text(json.dumps({'listed':listed,'applicants':applicants},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit boundary audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/sources/pescara-boundary-audit-2026-09-21.json
          git commit -m 'Freeze Pescara parser boundary audit'
          git push origin HEAD:expansion/pescara-2026-09-21
