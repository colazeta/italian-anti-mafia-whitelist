name: Barletta-Andria-Trani production persister 2026-09-11

on:
  push:
    branches: [expansion/barletta-andria-trani-2026-09-11]

permissions:
  contents: write

jobs:
  persist:
    if: github.event.head_commit.message == 'Persist Barletta production files'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/barletta-andria-trani-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validation runtime
        run: python -m pip install -e '.[dev,publication,database,storage]' && python -m pip install -q beautifulsoup4
      - name: Recreate the already validated materialization
        shell: bash
        run: |
          python scripts/barletta_production_finalize_tmp.py
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/test_operations.py')
          text=path.read_text()
          block='''def test_http_availability_or_incomplete_population_cannot_advance_success(ledger):\n    authority_key = "barletta-andria-trani"\n'''
          replacement='''def test_http_availability_or_incomplete_population_cannot_advance_success(ledger):\n    # Keep this safety invariant attached to an authority that is still at the\n    # source-identified stage. Barletta-Andria-Trani graduates only after both\n    # positive populations, byte identity and parser boundaries are validated.\n    authority_key = "brindisi"\n'''
          assert text.count(block)==1
          path.write_text(text.replace(block,replacement,1))
          PY
          pytest -q
          git diff --check
      - name: Persist non-workflow production files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/white_list_archive/publishing/public_national_registry.py \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            data/source_registry/verified_primary_pages.csv \
            data/monitoring/national_coverage.json \
            docs/sources/barletta-andria-trani-operational-check-2026-09-11.md \
            tests/public_portal_browser.cjs \
            tests/test_operations.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Integrate Barletta-Andria-Trani public archive'
          git push origin HEAD:expansion/barletta-andria-trani-2026-09-11
