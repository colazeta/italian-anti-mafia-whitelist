name: Barletta-Andria-Trani grouping audit 2026-09-11

on:
  push:
    branches: [expansion/barletta-andria-trani-2026-09-11]

permissions:
  contents: write

jobs:
  audit:
    if: github.event.head_commit.message == 'Run Barletta grouping audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/barletta-andria-trani-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run repeated-sector grouping audit
        run: |
          python -m pip install -q pdfplumber
          python scripts/barletta_grouping_audit_tmp.py
      - name: Commit recoverable grouping checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/barletta-andria-trani-grouping.json
          git diff --cached --check
          git commit -m 'Record Barletta-Andria-Trani grouping boundary'
          git push origin HEAD:expansion/barletta-andria-trani-2026-09-11
