name: Barletta-Andria-Trani parser patch 2026-09-11

on:
  push:
    branches: [expansion/barletta-andria-trani-2026-09-11]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix Barletta duplicate date geometry'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/barletta-andria-trani-2026-09-11
      - name: Deduplicate only identical date tokens within one logical row
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/white_list_archive/parsers/barletta_andria_trani_tables.py')
          text=path.read_text()
          old='''        raw_dates: list[str] = []\n        for row in source_rows:\n            raw_dates.extend(_date_fields(row))\n        if not 1 <= len(raw_dates) <= 2:\n'''
          new='''        raw_dates: list[str] = []\n        for row in source_rows:\n            for raw_date in _date_fields(row):\n                if raw_date not in raw_dates:\n                    raw_dates.append(raw_date)\n        if not 1 <= len(raw_dates) <= 2:\n'''
          if old not in text:
              raise SystemExit('expected parser block not found')
          path.write_text(text.replace(old,new,1))
          PY
          git diff --check
      - name: Commit parser correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/white_list_archive/parsers/barletta_andria_trani_tables.py
          git commit -m 'Handle duplicate Barletta source date geometry'
          git push origin HEAD:expansion/barletta-andria-trani-2026-09-11
