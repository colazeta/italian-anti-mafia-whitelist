name: Barletta-Andria-Trani production finalizer 2026-09-11

on:
  push:
    branches: [expansion/barletta-andria-trani-2026-09-11]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Run Barletta production finalizer'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/barletta-andria-trani-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validation runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install -e '.[dev,publication,database,storage]'
          python -m pip install -q beautifulsoup4
      - name: Materialize reviewed production integration
        run: python scripts/barletta_production_finalize_tmp.py
      - name: Preserve incomplete-population regression on an actually incomplete authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/test_operations.py')
          text=path.read_text()
          block='''def test_http_availability_or_incomplete_population_cannot_advance_success(ledger):\n    authority_key = "barletta-andria-trani"\n'''
          replacement='''def test_http_availability_or_incomplete_population_cannot_advance_success(ledger):\n    # Keep this safety invariant attached to an authority that is still at the\n    # source-identified stage. Barletta-Andria-Trani graduates only after both\n    # positive populations, byte identity and parser boundaries are validated.\n    authority_key = "brindisi"\n'''
          assert text.count(block)==1
          path.write_text(text.replace(block,replacement,1))
          PY
      - name: Validate repository and complete national build
        shell: bash
        run: |
          pytest -q
          rm -rf /tmp/barletta-national-build /tmp/barletta-national-sources
          white-list-public-national-build \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --authority-aliases data/source_registry/national_index_authority_aliases.csv \
            --work-dir /tmp/barletta-national-sources \
            --registry-json /tmp/barletta-national-build/registry.json \
            --registry-csv /tmp/barletta-national-build/registry.csv \
            --prefectures-json /tmp/barletta-national-build/prefectures.json \
            --prefectures-csv /tmp/barletta-national-build/prefectures.csv
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('/tmp/barletta-national-build/registry.json').read_text())
          pref=json.loads(Path('/tmp/barletta-national-build/prefectures.json').read_text())
          assert reg['meta']['record_count']==17303,reg['meta']
          assert reg['meta']['authority_count']==20 and reg['meta']['register_count']==21
          assert reg['meta']['authority_counts']['barletta-andria-trani']==574
          assert reg['meta']['register_counts']['barletta-andria-trani-ordinary']==574
          assert pref['meta']['authority_count']==106
          assert pref['meta']['published_count']==20
          assert pref['meta']['mapped_count']==35
          bat=[x for x in pref['prefectures'] if x['authority_key']=='barletta-andria-trani']
          assert len(bat)==1 and bat[0]['mapped'] and bat[0]['published']
          print('National Barletta candidate validated:',reg['meta']['record_count'],pref['meta'])
          PY
          git diff --check
      - name: Commit validated production materialization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/white_list_archive/publishing/public_national_registry.py \
            data/publication/multi_prefecture_pilot.json \
            data/source_registry/source_series_inventory.csv \
            data/source_registry/verified_primary_pages.csv \
            data/monitoring/national_coverage.json \
            docs/sources/barletta-andria-trani-operational-check-2026-09-11.md \
            .github/workflows/public-pages.yml \
            tests/public_portal_browser.cjs \
            tests/test_operations.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Integrate Barletta-Andria-Trani public archive'
          git push origin HEAD:expansion/barletta-andria-trani-2026-09-11
