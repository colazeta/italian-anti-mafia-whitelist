name: Barletta-Andria-Trani reviewed status fix 2026-09-11

on:
  push:
    branches: [expansion/barletta-andria-trani-2026-09-11]

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.event.head_commit.message == 'Retry reviewed Barletta status fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/barletta-andria-trani-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply only the reviewed source-typography exception
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          parser=Path('src/white_list_archive/parsers/barletta_andria_trani_tables.py')
          text=parser.read_text()
          old='status = "renewal_update_in_progress" if "aggiornamento" in row_text.casefold() else "listed"'
          new='status = "renewal_update_in_progress" if ("aggiornamento" in row_text.casefold() or "aggiornament o" in row_text.casefold()) else "listed"'
          assert text.count(old)==1
          text=text.replace(old,new)
          old_field='"in_aggiornamento": representative["note_raw"] if "aggiornamento" in representative["note_raw"].casefold() else "",'
          new_field='"in_aggiornamento": representative["note_raw"] if ("aggiornamento" in representative["note_raw"].casefold() or "aggiornament o" in representative["note_raw"].casefold()) else "",'
          assert text.count(old_field)==1
          text=text.replace(old_field,new_field)
          parser.write_text(text)

          test=Path('tests/test_barletta_andria_trani_parser_semantics.py')
          t=test.read_text()
          anchor='def test_identifiers_are_exact_and_never_reconstructed() -> None:\n'
          assert anchor in t
          insertion='def test_reviewed_split_update_status_typography_is_frozen_in_parser_source() -> None:\n    source = __import__("inspect").getsource(__import__("white_list_archive.parsers.barletta_andria_trani_tables", fromlist=["*"]).parse_barletta_andria_trani_listed)\n    assert "aggiornament o" in source\n\n\n'
          if 'test_reviewed_split_update_status_typography_is_frozen_in_parser_source' not in t:
              t=t.replace(anchor,insertion+anchor)
          test.write_text(t)
          PY
      - name: Install validation runtime
        run: python -m pip install -e '.[dev,publication,database,storage]'
      - name: Revalidate exact byte-pinned current sources and repository tests
        shell: bash
        run: |
          pytest -q tests/test_barletta_andria_trani_parser_semantics.py
          python - <<'PY'
          import hashlib, json
          from collections import Counter
          from pathlib import Path
          from urllib.request import Request, urlopen
          from white_list_archive.parsers.barletta_andria_trani_tables import parse_barletta_andria_trani_listed, parse_barletta_andria_trani_applicants
          sources={
            'listed':('https://prefettura.interno.gov.it/sites/default/files/104/2026-09/white-list-prefettura-di-barletta-andria-trani_1.pdf','d3c0e61942cbdefd03cfa7d99f71b2abbfc430f25ff86b8693d44ef14de07e13'),
            'applicants':('https://prefettura.interno.gov.it/sites/default/files/104/2026-09/elenco-imprese-rich-iscriz-white-list-prefettura-di-barletta-andria-trani_0.pdf','ce460ca66f2d996784ac28d559af5fe702ae8a1d72ed80affeb70a0cb36b0d57'),
          }
          paths={}
          for kind,(url,expected) in sources.items():
              req=Request(url,headers={'User-Agent':'ItalianAntiMafiaWhitelistArchive/1.0 parser-validation'})
              with urlopen(req,timeout=90) as response: body=response.read()
              observed=hashlib.sha256(body).hexdigest(); assert observed==expected,(kind,observed)
              path=Path('/tmp',f'barletta-{kind}.pdf'); path.write_bytes(body); paths[kind]=path
          base={'authority_key':'barletta-andria-trani','authority_name':'Prefettura di Barletta-Andria-Trani','register_key':'barletta-andria-trani-ordinary','register_name':'White List ordinaria','reference_date':'2026-09-11'}
          lc=base|{'source_key':'barletta-andria-trani-listed','population_scope':'listed','source_page_url':'https://prefettura.interno.gov.it/it/prefetture/barletta-andria-trani/white-list-elenco-imprese-iscritte','resource_url':sources['listed'][0],'sha256':sources['listed'][1]}
          ac=base|{'source_key':'barletta-andria-trani-applicants','population_scope':'applicant','source_page_url':'https://prefettura.interno.gov.it/it/prefetture/barletta-andria-trani/white-list-elenco-imprese-richiedenti-liscrizione','resource_url':sources['applicants'][0],'sha256':sources['applicants'][1]}
          listed=parse_barletta_andria_trani_listed(paths['listed'],lc)
          applicants=parse_barletta_andria_trani_applicants(paths['applicants'],ac)
          result={'listed':listed.diagnostics,'applicants':applicants.diagnostics,'listed_statuses':dict(Counter(r['source_status'] for r in listed.records)),'total_public_records':len(listed.records)+len(applicants.records)}
          print('BARLETTA_VALIDATED_OUTPUT='+json.dumps(result,ensure_ascii=False,sort_keys=True))
          assert listed.diagnostics['sector_rows']==1013
          assert listed.diagnostics['public_records']==493
          assert applicants.diagnostics['public_records']==81
          assert result['total_public_records']==574
          PY
          pytest -q
      - name: Commit reviewed parser correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/white_list_archive/parsers/barletta_andria_trani_tables.py tests/test_barletta_andria_trani_parser_semantics.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Fix Barletta split update status'
          git push origin HEAD:expansion/barletta-andria-trani-2026-09-11
