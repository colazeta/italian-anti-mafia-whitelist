name: Barletta-Andria-Trani targeted geometry audit 2026-09-11

on:
  push:
    branches: [expansion/barletta-andria-trani-2026-09-11]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.head_commit.message == 'Audit Barletta page 136 geometry'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/barletta-andria-trani-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect source rows and coordinates
        shell: bash
        run: |
          python -m pip install -q pdfplumber
          python - <<'PY'
          import hashlib, tempfile
          from urllib.request import Request, urlopen
          import pdfplumber
          URL='https://prefettura.interno.gov.it/sites/default/files/104/2026-09/white-list-prefettura-di-barletta-andria-trani_1.pdf'
          SHA='d3c0e61942cbdefd03cfa7d99f71b2abbfc430f25ff86b8693d44ef14de07e13'
          req=Request(URL,headers={'User-Agent':'ItalianAntiMafiaWhitelistArchive/1.0 targeted-geometry-audit'})
          with urlopen(req,timeout=90) as response: body=response.read()
          assert hashlib.sha256(body).hexdigest()==SHA
          clean=lambda v:' '.join(str(v or '').replace('\u00a0',' ').split())
          with tempfile.NamedTemporaryFile(suffix='.pdf') as f:
              f.write(body); f.flush()
              with pdfplumber.open(f.name) as pdf:
                  for pno in (135,136,137):
                      page=pdf.pages[pno-1]
                      print('=== PAGE',pno,'TEXT ===')
                      print(page.extract_text() or '')
                      print('=== TABLES ===')
                      for ti,table in enumerate(page.find_tables(),1):
                          print('TABLE',ti,'BBOX',table.bbox)
                          for ri,row in enumerate(table.extract() or [],1):
                              print('ROW',ri,repr([clean(c) for c in row]))
                      print('=== WORDS ===')
                      for word in page.extract_words(use_text_flow=False, keep_blank_chars=False):
                          if word.get('text'):
                              print(round(word['x0'],1),round(word['top'],1),round(word['x1'],1),round(word['bottom'],1),repr(word['text']))
          PY
