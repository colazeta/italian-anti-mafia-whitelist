name: Barletta-Andria-Trani note-date patch 2026-09-11

on:
  push:
    branches: [expansion/barletta-andria-trani-2026-09-11]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Patch Barletta note-date semantics'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/barletta-andria-trani-2026-09-11
      - name: Preserve note-column dates without reclassifying them
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/white_list_archive/parsers/barletta_andria_trani_tables.py')
          text=path.read_text()
          old='''        if not 1 <= len(raw_dates) <= 2:\n            raise RuntimeError(\n                f"{cfg['source_key']}: expected one or two source date fields at page {item['page']} row {item['row']}, got {raw_dates!r}"\n            )\n        listing_raw = raw_dates[0]\n        expiry_raw = raw_dates[1] if len(raw_dates) == 2 else ""\n'''
          new='''        if not raw_dates:\n            raise RuntimeError(\n                f"{cfg['source_key']}: missing source date fields at page {item['page']} row {item['row']}"\n            )\n        note_raw = _clean(item["base"][-1]) if len(item["base"]) >= 8 else ""\n        extra_note_dates = raw_dates[2:]\n        if any(value not in note_raw for value in extra_note_dates):\n            raise RuntimeError(\n                f"{cfg['source_key']}: unreviewed extra source date at page {item['page']} row {item['row']}: {raw_dates!r}"\n            )\n        listing_raw = raw_dates[0]\n        expiry_raw = raw_dates[1] if len(raw_dates) >= 2 else ""\n'''
          if old not in text:
              raise SystemExit('date-count block not found')
          text=text.replace(old,new,1)
          old='''            "group_key": (*identity, *date_key, status),\n'''
          new='''            "group_key": (*identity, *date_key, status, note_raw.casefold()),\n'''
          if old not in text:
              raise SystemExit('group-key block not found')
          text=text.replace(old,new,1)
          old='''            "status": status,\n            "section": item["section"],\n'''
          new='''            "status": status,\n            "note_raw": note_raw,\n            "section": item["section"],\n'''
          if old not in text:
              raise SystemExit('reviewed block not found')
          text=text.replace(old,new,1)
          old='''            "in_aggiornamento": "Aggiornamento in corso" if representative["status"] == "renewal_update_in_progress" else "",\n        }\n'''
          new='''            "in_aggiornamento": representative["note_raw"] if "aggiornamento" in representative["note_raw"].casefold() else "",\n        }\n'''
          if old not in text:
              raise SystemExit('source-fields block not found')
          text=text.replace(old,new,1)
          old='''            outcome_raw="Aggiornamento in corso" if representative["status"] == "renewal_update_in_progress" else "",\n'''
          new='''            outcome_raw=representative["note_raw"],\n'''
          if old not in text:
              raise SystemExit('outcome block not found')
          text=text.replace(old,new,1)
          path.write_text(text)
          PY
          git diff --check
      - name: Commit parser correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/white_list_archive/parsers/barletta_andria_trani_tables.py
          git commit -m 'Preserve Barletta note-column dates'
          git push origin HEAD:expansion/barletta-andria-trani-2026-09-11
