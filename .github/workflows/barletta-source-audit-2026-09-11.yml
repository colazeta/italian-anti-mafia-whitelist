name: Barletta-Andria-Trani status token audit 2026-09-11

on:
  push:
    branches: [expansion/barletta-andria-trani-2026-09-11]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.head_commit.message == 'Audit Barletta update-status variants'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/barletta-andria-trani-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install parser runtime
        run: python -m pip install -e '.[publication]'
      - name: Enumerate reviewed update-status variants
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, re, tempfile
          from pathlib import Path
          from urllib.request import Request, urlopen
          from white_list_archive.parsers.barletta_andria_trani_tables import _listed_sector_rows, _clean
          url='https://prefettura.interno.gov.it/sites/default/files/104/2026-09/white-list-prefettura-di-barletta-andria-trani_1.pdf'
          sha='d3c0e61942cbdefd03cfa7d99f71b2abbfc430f25ff86b8693d44ef14de07e13'
          req=Request(url,headers={'User-Agent':'ItalianAntiMafiaWhitelistArchive/1.0 status-variant-audit'})
          with urlopen(req,timeout=90) as response: body=response.read()
          assert hashlib.sha256(body).hexdigest()==sha
          with tempfile.NamedTemporaryFile(suffix='.pdf') as f:
              f.write(body); f.flush(); logical,_=_listed_sector_rows(Path(f.name),'barletta-listed')
          variants=[]
          for item in logical:
              rows=[item['base'],*item['continuations']]
              text=_clean(' '.join(' '.join(r) for r in rows))
              folded=text.casefold()
              if 'aggiornament' in folded and 'aggiornamento' not in folded:
                  tokens=sorted(set(re.findall(r'\b\w*aggiornament\w*\b',folded)))
                  variants.append((item['page'],item['row'],item['section'],tokens,text,item['base'][-1] if item['base'] else ''))
          print('VARIANT_ONLY_COUNT',len(variants))
          for value in variants: print('VARIANT_ONLY',repr(value))
          assert len(variants)==2, variants
          PY
