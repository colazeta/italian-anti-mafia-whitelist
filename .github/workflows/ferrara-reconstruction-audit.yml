name: Ferrara reconstruction completeness audit

on:
  push:
    branches:
      - expansion/ferrara-2026-09-20
    paths:
      - .github/workflows/ferrara-reconstruction-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pdfplumber
      - name: Audit pinned Ferrara reconstruction rows fail-closed
        shell: python
        run: |
          import hashlib, io, json, re, secrets, unicodedata
          from collections import Counter
          from datetime import datetime
          import pdfplumber, requests

          SOURCES = [
              ('A', 'fornitura moduli prefabbricati e relativi arredi', 'https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-a-fornitura-moduli-prefabbricati-e-dei-relativi-arredi_is_0.pdf', '4fdf292b1538892c7b5ff79d3c0c14e0ed3b5830effb791316b0fddb8c90ae01', 8),
              ('B', 'demolizione edifici e altre strutture', 'https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-b-demolizione-di-edifici-ed-altre-strutture_is_0.pdf', '97d9af0d587af0b7d93d31df33bd612440bf5be5b48b57872d436e2afeb164ec', 35),
              ('C', 'movimenti di terra', 'https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-c-movimenti-di-terra_is_0.pdf', '99f519101dccff84dddd9753f0d6fa27170c33b1982858afe9fdf9ebbc63c57e', 23),
              ('D', 'noleggio con conducente mezzi speciali', 'https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-d-noleggio-con-coducente-mezzi-speciali_is_0.pdf', '07c27b38e48a879aa0d1efff4710bf7dbbf1bb323e59f62eb0b0b796a75a46d8', 7),
              ('E', 'fornitura e posa impianti fotovoltaici', 'https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-e-fornitura-e-posa-in-opera-impianti-fotovoltaici_is_0.pdf', '9cea950d37f653d0356edb9a46a7f43665a382e771c969bc93f7027f95fecf9e', 13),
              ('F', 'fornitura e manutenzione impianti tecnologici', 'https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-f-fornitura-e-manutenzione-impianti-tecnologici_is_0.pdf', 'ac7dd77f1c4633c27a62c0ad7e074f507a10b091a327c2fc1072cfb52fd45664', 14),
              ('G', 'fornitura beni necessari alla ricostruzione', 'https://prefettura.interno.gov.it/sites/default/files/0/2026-08/h-bis-g-fornitura-beni-necessari-ricostruzione_is_0.pdf', '0657c7e0f0b9fb8ad7f0b341682716d695132e61131adc92407627a5cae82bae', 3),
          ]

          def norm(v):
              return ' '.join((v or '').replace('\u00a0', ' ').split())

          def fold(v):
              v = unicodedata.normalize('NFKD', norm(v))
              return ''.join(c for c in v if not unicodedata.combining(c)).casefold()

          def ids(v):
              upper = norm(v).upper()
              compact = re.sub(r'[^0-9A-Z]', '', upper)
              out = re.findall(r'(?<![0-9A-Z])(?:[0-9]{11}|[A-Z0-9]{16})(?![0-9A-Z])', upper)
              if len(compact) in (11, 16) and compact not in out:
                  out.append(compact)
              return tuple(dict.fromkeys(out))

          def date_state(v):
              v = norm(v)
              if not v:
                  return 'blank'
              if not re.fullmatch(r'\d{2}/\d{2}/\d{4}', v):
                  return 'raw_noncanonical'
              try:
                  datetime.strptime(v, '%d/%m/%Y')
              except ValueError:
                  return 'raw_invalid'
              return 'normalised'

          def status(note):
              n = fold(note)
              if not n:
                  return 'listed'
              if 'rinnovo' in n or 'rinovo' in n:
                  return 'renewal_update_in_progress'
              return 'other_or_unknown'

          def is_header(row):
              j = fold(' | '.join(row))
              return ('denominazione' in j or 'ragione sociale' in j) and ('c.f' in j or 'partita iva' in j or 'p.iva' in j)

          def is_structural(row):
              j = fold(' | '.join(row))
              return (
                  ('prefettura' in j and 'ferrara' in j)
                  or 'white list' in j
                  or ('art. 1' in j and 'legge' in j)
                  or ('elenco' in j and ('imprese' in j or 'fornitori' in j))
              )

          def fetch_twice(url, expected):
              bodies = []
              for _ in range(2):
                  r = requests.get(url, headers={
                      'User-Agent': 'italian-anti-mafia-whitelist/ferrara-reconstruction-audit',
                      'Cache-Control': 'no-cache', 'Pragma': 'no-cache'},
                      params={'audit_nonce': secrets.token_hex(8)}, timeout=90)
                  r.raise_for_status()
                  bodies.append(r.content)
              assert bodies[0] == bodies[1], 'independent fetches differ'
              actual = hashlib.sha256(bodies[0]).hexdigest()
              assert actual == expected, (expected, actual, len(bodies[0]))
              return bodies[0]

          def page_diagnostic(sector, pno, page, tables):
              text = norm(page.extract_text() or '')
              words = page.extract_words() or []
              return {
                  'sector': sector,
                  'page': pno,
                  'table_count': len(tables),
                  'text': text,
                  'word_count': len(words),
                  'date_like_tokens': re.findall(r'(?<!\d)\d{1,2}[./-]\d{1,2}(?:[./-]\d{2,4})?(?!\d)', text),
                  'identifier_like_tokens': re.findall(r'(?<![0-9A-Z])(?:\d{11}|[A-Z0-9]{16})(?![0-9A-Z])', text.upper()),
                  'status_markers': [m for m in ('rinnovo', 'aggiornamento', 'corso') if m in fold(text)],
              }

          summary = {}
          all_records = []
          all_unclassified = []
          table_gaps = []

          for sector, activity, url, sha, expected_pages in SOURCES:
              records, headers, structural, continuations, unclassified = [], [], [], [], []
              current = None
              body = fetch_twice(url, sha)
              with pdfplumber.open(io.BytesIO(body)) as pdf:
                  assert len(pdf.pages) == expected_pages, (sector, len(pdf.pages), expected_pages)
                  for pno, page in enumerate(pdf.pages, 1):
                      tables = page.extract_tables() or []
                      if len(tables) != 1:
                          diagnostic = page_diagnostic(sector, pno, page, tables)
                          table_gaps.append(diagnostic)
                          print('FERRARA_RECONSTRUCTION_PAGE_DIAGNOSTIC_JSON')
                          print(json.dumps(diagnostic, ensure_ascii=False, indent=2))
                          continue
                      for tno, table in enumerate(tables, 1):
                          for rno, raw in enumerate(table or [], 1):
                              row = [norm(x) for x in (raw or [])]
                              if not any(row):
                                  continue
                              assert len(row) == 6, (sector, pno, rno, row)
                              loc = f'{sector}:p{pno}:t{tno}:r{rno}'
                              if is_header(row):
                                  headers.append({'locator': loc, 'row': row})
                                  current = None
                                  continue
                              if is_structural(row):
                                  structural.append({'locator': loc, 'row': row})
                                  current = None
                                  continue
                              name, office, ident, listed_raw, expiry_raw, note = row
                              if name and ident and expiry_raw:
                                  current = {
                                      'sector': sector, 'activity': activity, 'locator': loc,
                                      'source_locators': [loc], 'name': name, 'office': office,
                                      'id_raw': ident, 'listed_raw': listed_raw,
                                      'expiry_raw': expiry_raw, 'note': note,
                                  }
                                  records.append(current)
                                  continue
                              if current is not None and not ident and not listed_raw and not expiry_raw and any((name, office, note)):
                                  for key, value in (('name', name), ('office', office), ('note', note)):
                                      if value:
                                          current[key] = norm(f"{current[key]} {value}")
                                  current['source_locators'].append(loc)
                                  continuations.append({'locator': loc, 'attached_to': current['locator'], 'row': row})
                                  continue
                              unclassified.append({'locator': loc, 'row': row})

              for x in records:
                  x['ids'] = ids(x['id_raw'])
                  x['listed_state'] = date_state(x['listed_raw'])
                  x['expiry_state'] = date_state(x['expiry_raw'])
                  x['status'] = status(x['note'])
              all_records.extend(records)
              all_unclassified.extend(unclassified)
              summary[sector] = {
                  'activity': activity,
                  'records': len(records),
                  'statuses': dict(Counter(x['status'] for x in records)),
                  'strict_id_rows': sum(bool(x['ids']) for x in records),
                  'listing_date_states': dict(Counter(x['listed_state'] for x in records)),
                  'expiry_date_states': dict(Counter(x['expiry_state'] for x in records)),
                  'headers': len(headers), 'structural': len(structural),
                  'continuations': len(continuations),
                  'continuation_rows': continuations,
                  'unclassified': unclassified,
                  'identifier_anomalies': [
                      {'locator': x['locator'], 'name': x['name'], 'raw': x['id_raw']}
                      for x in records if not x['ids']],
                  'date_anomalies': [
                      {'locator': x['locator'], 'name': x['name'], 'listing_raw': x['listed_raw'], 'expiry_raw': x['expiry_raw'],
                       'listing_state': x['listed_state'], 'expiry_state': x['expiry_state']}
                      for x in records if x['listed_state'] not in ('normalised','blank') or x['expiry_state'] != 'normalised'],
              }

          report = {
              'per_sector': summary,
              'physical_sector_observations': len(all_records),
              'status_counts': dict(Counter(x['status'] for x in all_records)),
              'strict_id_rows': sum(bool(x['ids']) for x in all_records),
              'multi_sector_identity_counts': dict(Counter(x['id_raw'].casefold() for x in all_records)),
              'table_gaps': table_gaps,
              'unclassified': all_unclassified,
          }
          print('FERRARA_RECONSTRUCTION_AUDIT_JSON')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          assert not table_gaps, table_gaps
          assert not all_unclassified, all_unclassified
          assert all_records, 'no reconstruction observations parsed'
