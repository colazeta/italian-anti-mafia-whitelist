name: Gorizia semantic probe

on:
  push:
    branches:
      - expansion/gorizia-2026-09-13
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit parser grouping and blank-expiry evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from collections import Counter, defaultdict
          from pathlib import Path

          listed = json.loads(Path('tmp/gorizia_listed_tables.json').read_text(encoding='utf-8'))

          def clean(value: str | None) -> str:
              return re.sub(r'\s+', ' ', value or '').strip()

          sector_rows = []
          section_counts = {}
          for table in listed:
              section = int(table['table'])
              body = []
              for item in table['rows'][1:]:
                  values = [clean(v) for v in item['physical_cells']]
                  if not any(values):
                      continue
                  if len(values) != 7:
                      raise RuntimeError(f"section {section} row {item['row']} physical width drift: {values!r}")
                  body.append((item['row'], values))
              section_counts[section] = len(body)
              for source_row, values in body:
                  name, office, secondary, identifier_raw, listing_raw, expiry_raw, update_raw = values
                  sector_rows.append({
                      'section': section,
                      'source_row': source_row,
                      'name': name,
                      'office': office,
                      'secondary': secondary,
                      'identifier_raw': identifier_raw,
                      'listing_raw': listing_raw,
                      'expiry_raw': expiry_raw,
                      'update_raw': update_raw,
                  })

          grouped = defaultdict(list)
          for row in sector_rows:
              key = (
                  row['name'], row['office'], row['secondary'], row['identifier_raw'],
                  row['listing_raw'], row['expiry_raw'],
              )
              grouped[key].append(row)

          status_counts = Counter()
          for members in grouped.values():
              status_counts['renewal_update_in_progress' if any(m['update_raw'] for m in members) else 'listed'] += 1

          blank_sector_rows = [row for row in sector_rows if not row['expiry_raw']]
          blank_signatures = []
          seen = set()
          for row in blank_sector_rows:
              sig = (row['name'], row['office'], row['identifier_raw'], row['listing_raw'])
              if sig not in seen:
                  seen.add(sig)
                  blank_signatures.append({
                      'name': row['name'],
                      'office': row['office'],
                      'identifier_raw': row['identifier_raw'],
                      'listing_raw': row['listing_raw'],
                      'sections': sorted({
                          item['section'] for item in blank_sector_rows
                          if (item['name'], item['office'], item['identifier_raw'], item['listing_raw']) == sig
                      }),
                      'source_rows': sorted([
                          [item['section'], item['source_row']] for item in blank_sector_rows
                          if (item['name'], item['office'], item['identifier_raw'], item['listing_raw']) == sig
                      ]),
                  })

          mixed_update_groups = []
          for key, members in grouped.items():
              update_values = sorted({m['update_raw'] for m in members})
              if len(update_values) > 1:
                  mixed_update_groups.append({
                      'name': key[0],
                      'identifier_raw': key[3],
                      'listing_raw': key[4],
                      'expiry_raw': key[5],
                      'update_values': update_values,
                      'sections': sorted({m['section'] for m in members}),
                  })

          report = {
              'sector_rows': len(sector_rows),
              'section_counts': section_counts,
              'parser_registration_groups': len(grouped),
              'parser_status_counts': dict(status_counts),
              'blank_sector_row_count': len(blank_sector_rows),
              'blank_unique_signature_count': len(blank_signatures),
              'blank_signatures': blank_signatures,
              'mixed_update_group_count': len(mixed_update_groups),
              'mixed_update_groups': mixed_update_groups,
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
