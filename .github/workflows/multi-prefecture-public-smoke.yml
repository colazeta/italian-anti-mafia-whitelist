name: Multi-prefecture public smoke

on:
  push:
    branches:
      - feature/multi-prefecture-pilot
    paths:
      - 'data/publication/multi_prefecture_pilot.json'
      - 'src/white_list_archive/parsers/multi_prefecture_tables.py'
      - 'src/white_list_archive/publishing/public_national_registry.py'
      - '.github/workflows/multi-prefecture-public-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install public build runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python -m pip install -e '.[publication]'
      - name: Build multi-Prefecture registry and Prefecture index
        run: |
          white-list-public-national-registry \
            --source-config data/publication/multi_prefecture_pilot.json \
            --verified-pages data/source_registry/verified_primary_pages.csv \
            --source-series data/source_registry/source_series_inventory.csv \
            --work-dir artifacts/public-national/sources \
            --registry-json artifacts/public-national/registry.json \
            --registry-csv artifacts/public-national/registry.csv \
            --prefectures-json artifacts/public-national/prefectures.json \
            --prefectures-csv artifacts/public-national/prefectures.csv
      - name: Validate public pilot invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/public-national/registry.json').read_text())
          p=json.loads(Path('artifacts/public-national/prefectures.json').read_text())
          assert r['meta']['contract_version']==3
          assert set(r['meta']['authority_counts'])=={'cosenza','parma','pistoia','bologna'}
          assert set(r['meta']['register_counts'])=={'cosenza-ordinary','parma-ordinary','pistoia-ordinary','bologna-provincial','bologna-post-sisma'}
          assert p['meta']['authority_count'] >= 90
          assert p['meta']['published_count'] == 4
          for source in r['meta']['sources']:
              d=source['diagnostics']
              assert d['public_records'] > 0, source['source_key']
              assert d.get('dropped_date_rows',0)==0, source['source_key']
          print(json.dumps({'registry_meta':r['meta'],'prefecture_meta':p['meta']},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: multi-prefecture-public-smoke
          path: artifacts/public-national
          retention-days: 7
