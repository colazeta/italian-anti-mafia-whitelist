services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whitelist}
      POSTGRES_USER: ${POSTGRES_USER:-whitelist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whitelist}
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whitelist} -d ${POSTGRES_DB:-whitelist}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - whitelist_pgdata:/var/lib/postgresql/data
      - ./db:/workspace/db:ro

volumes:
  whitelist_pgdata:
